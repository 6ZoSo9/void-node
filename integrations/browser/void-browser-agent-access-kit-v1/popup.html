<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Verify VOID</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <p class="sigil">VOID // MAINNET-0</p>
        <h1>Agent Access</h1>
      </header>
      <form id="verify-form">
        <label for="endpoint">VOID node origin</label>
        <input
          id="endpoint"
          name="endpoint"
          type="url"
          spellcheck="false"
          autocomplete="off"
          placeholder="http://…onion or https://node.example"
          required
        >
        <button id="verify-button" type="submit">Verify read-only surface</button>
      </form>
      <p id="status" role="status">No node verified.</p>
      <pre id="result" hidden></pre>
      <footer>No wallet, signing, payment, WC, validator, or operator authority.</footer>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
