[Service]
# Clear any previous posts, then add a noisy/retry loop.
ExecStartPost=
ExecStartPost=/bin/bash -lc 'set -euo pipefail
  echo "[autostart] wait for HTTP and mount (status2 or exporter)..." >&2
  for i in {1..60}; do
    if curl -fsS "http://127.0.0.1:${HTTP_PORT:-4100}/proposer/auto/status2" >/dev/null 2>&1 || \
       curl -fsS "http://127.0.0.1:${HTTP_PORT:-4100}/metrics/void/proposer.v3b.prom" >/dev/null 2>&1; then
      echo "[autostart] attempting enable @ ${PROPOSER_TICK_MS:-2000}ms" >&2
      if curl -fsS -X POST "http://127.0.0.1:${HTTP_PORT:-4100}/proposer/auto/start?ms=${PROPOSER_TICK_MS:-2000}" >/dev/null 2>&1; then
        echo "[autostart] enabled OK" >&2
        exit 0
      fi
    fi
    sleep 1
  done
  echo "[autostart] gave up after 60s (non-fatal)" >&2
  exit 0
'
