[Service]
# Best-effort: never fail the service if this hook flaps
ExecStartPost=/usr/bin/bash -lc '\
  H="127.0.0.1:${HTTP_PORT:-4100}"; \
  for i in {1..60}; do curl -fsS "http://$H/blocks/latest/number2.json" >/dev/null && break || sleep 0.5; done; \
  for i in {1..8}; do curl -fsS -X POST "http://$H/proposer/auto/start?ms=${PROPOSER_TICK_MS:-2000}" && exit 0 || sleep 0.7; done; \
  exit 0'
