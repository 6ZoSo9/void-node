[Service]
# Optional wait-for-ready, fully quoted and safe (no-op if file/route absent)
ExecStartPost=
ExecStartPost=/bin/bash -lc 'for i in {1..60}; do \
  out=$(curl -fsS http://127.0.0.1:${HTTP_PORT}/health/ready?format=prom 2>/dev/null || true); \
  echo "$out" | grep -q "^void_ready 1$" && exit 0; sleep 1; done; exit 0'
