[Service]
# Clear previous ExecStartPost(s) and install a resilient retrier
ExecStartPost=
ExecStartPost=/bin/bash -lc '\
  set -euo pipefail; \
  H="127.0.0.1:${HTTP_PORT:-4100}"; \
  # Wait for HTTP to be up
  for i in {1..60}; do curl -fsS "http://$H/blocks/latest/number2.json" >/dev/null && break || sleep 0.5; done; \
  # Try to enable auto loop up to 10 times (in case app is still mounting routes)
  for i in {1..10}; do \
    curl -fsS -X POST "http://$H/proposer/auto/start?ms=2000" && exit 0 || sleep 0.7; \
  done; \
  # Best-effort, never fail the unit
  exit 0 \
'
