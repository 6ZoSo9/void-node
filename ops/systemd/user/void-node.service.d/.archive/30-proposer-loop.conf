[Service]
# Start a lightweight background proposer loop after the node comes up.
# It is safe/idempotent; guarded by pkill to avoid duplicates.
ExecStartPost=/bin/bash -lc 'pkill -f scripts/dev_proposer.ts || true; \
  (cd "$HOME/dev/void-node" && exec nohup env DATA_DIR=${DATA_DIR:-data_a} HTTP_PORT=${HTTP_PORT:-4100} \
   npx --yes tsx scripts/dev_proposer.ts >/dev/null 2>&1 &) '
