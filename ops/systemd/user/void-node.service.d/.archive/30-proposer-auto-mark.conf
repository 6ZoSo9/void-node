[Service]
Environment=PROPOSER_AUTO=1
Environment=PROPOSER_TICK_MS=2000
# after HTTP is up, write truth to metrics (retry a few times)
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do curl -fsS -X POST "http://127.0.0.1:4100/proposer/auto/mark?enabled=${PROPOSER_AUTO}&ms=${PROPOSER_TICK_MS}" && break || sleep 1; done'
