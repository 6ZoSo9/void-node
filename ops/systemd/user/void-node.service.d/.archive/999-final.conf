[Service]
# Ensure all dev shims are on (belt-and-suspenders; unknown keys are ignored)
Environment=VOID_DEV_ROUTES=1
Environment=DEV_SHIMS=1
Environment=VOID_DEV_SHIMS=1
Environment=DEV_PROPOSER=1
Environment=VOID_DEV_PROPOSER=1

# Wipe ALL prior ExecStartPost entries (prevents hidden auto-start logic)
ExecStartPost=
