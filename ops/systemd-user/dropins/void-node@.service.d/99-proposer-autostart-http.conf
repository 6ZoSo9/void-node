[Service]
# Clear anything earlier, then add a safe, single-line shell
ExecStartPost=
ExecStartPost=/bin/bash -lc 'set -euo pipefail; echo "[autostart] wait for HTTP…" >&2; for i in $(seq 1 60); do if curl -fsS "http://127.0.0.1:${HTTP_PORT:-4100}/proposer/auto/status2" >/dev/null 2>&1 || curl -fsS "http://127.0.0.1:${HTTP_PORT:-4100}/metrics/void/proposer.v3b.prom" >/dev/null 2>&1; then echo "[autostart] enabling @ ${PROPOSER_TICK_MS:-2000}ms" >&2; curl -fsS -X POST "http://127.0.0.1:${HTTP_PORT:-4100}/proposer/auto/start?ms=${PROPOSER_TICK_MS:-2000}" >/dev/null 2>&1 || true; break; fi; sleep 1; done'
