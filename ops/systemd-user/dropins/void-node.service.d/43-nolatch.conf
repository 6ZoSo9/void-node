[Service]
# Common kill-switch envs (the build only needs to recognize any one of these):
Environment=CHAIN_LATCH_DISABLE=1
Environment=VOID_CHAIN_LATCH_DISABLE=1
Environment=CHAINLATCH_DISABLE=1
Environment=DISABLE_CHAIN_LATCH=1

# Also refuse any generic saveBlock wrappers that might rebind:
Environment=SAVE_BLOCK_DISABLE_WRAPS=1
Environment=SAVE_WRAPS_DISABLE=1
Environment=SAVEBLOCK_WRAPS_OFF=1
