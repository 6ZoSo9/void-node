[Service]
ExecStartPost=/usr/bin/env -S bash -lc 'echo "[trace] started pid=$MAINPID cgroup=$(cat /proc/$MAINPID/cgroup | head -1)" >&2'
ExecStopPost=/usr/bin/env -S bash -lc 'echo "[trace] stop reason=$EXIT_CODE/$EXIT_STATUS by=$(ps -o pid,comm,cmd --no-headers --ppid=$MANAGERPID | tr -s " ") " >&2'
