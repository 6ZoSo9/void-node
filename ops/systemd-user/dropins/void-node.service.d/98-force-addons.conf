[Service]
# Dev routes/open addons for this build
Environment=ALLOW_DEV_ROUTES=1
Environment=VOID_ADDONS=DEV
# Make sure safeboot is truly off
Environment=VOID_SAFEBOOT=0
Environment=VOID_SAFEBOOT_ALLOW=
Environment=VOID_SAFEBOOT_ALLOWED=
Environment=VOID_SAFEBOOT_ALLOW_EXTRA=
# Head fetch-free points at your live store
Environment=HEAD_TXT_SOURCE=store
Environment=HEAD_STORE_DIR=%h/dev/void-node/data_fresh_1762521034
