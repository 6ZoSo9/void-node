[Service]
# Head reader (explicit file source)
Environment=HEAD_TXT_SOURCE=file
Environment=HEAD_FILE=%h/dev/void-node/data_a/head.txt

# Dev/diag routes
Environment=VOID_ADDONS=DEV,DIAG
Environment=ALLOW_DEV_ROUTES=1
Environment=DEV_ROUTES=1
Environment=VOID_DIAG_ROUTES=1
Environment=ENABLE_DEV_ROUTES=1
Environment=ENABLE_DIAG_ROUTES=1

# Kill v7/wrappers; force simple save path
Environment=V7_DISABLE=1
Environment=VOID_V7_DISABLE=1
Environment=SEGSTORE_V7_DISABLE=1
Environment=SEGSTORE_TRAMP_DISABLE=1
Environment=SEGSTORE_WRAP_DISABLE=1
Environment=SEGSTORE_PROXY_DISABLE=1
Environment=WRAP_DISABLE=1
Environment=TRAMP_DISABLE=1
Environment=TXROOT_SETTER_WRAP_DISABLE=1
Environment=TXROOT_SETTER_WRAP=0
Environment=SEGSTORE_SAVE_ENGINE=simple
Environment=SAVE_BLOCK_ENGINE=simple
Environment=SEGSTORE_SIMPLE_SAVE=1

# Proposer auto @ 2s
Environment=PROPOSER_AUTO=1
Environment=PROPOSER_TICK_MS=2000
