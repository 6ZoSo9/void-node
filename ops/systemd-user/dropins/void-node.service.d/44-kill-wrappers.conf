[Service]
# Already set latch-killers; keep them and add the rest:
Environment=CHAIN_LATCH_DISABLE=1
Environment=VOID_CHAIN_LATCH_DISABLE=1
Environment=CHAINLATCH_DISABLE=1
Environment=DISABLE_CHAIN_LATCH=1

# Generic wrap/tramp kills (keep)
Environment=SAVE_BLOCK_DISABLE_WRAPS=1
Environment=SAVE_WRAPS_DISABLE=1
Environment=SAVEBLOCK_WRAPS_OFF=1
Environment=SEGSTORE_TRAMP_DISABLE=1
Environment=SEGSTORE_WRAP_DISABLE=1
Environment=SEGSTORE_PROXY_DISABLE=1
Environment=WRAP_DISABLE=1
Environment=TRAMP_DISABLE=1

# Vector7/setter wrap already off (keep)
Environment=V7_DISABLE=1
Environment=VOID_V7_DISABLE=1
Environment=SEGSTORE_V7_DISABLE=1
Environment=TXROOT_SETTER_WRAP_DISABLE=1
Environment=TXROOT_SETTER_WRAP=0

# Force SIMPLE save engine (keep)
Environment=SEGSTORE_SAVE_ENGINE=simple
Environment=SAVE_BLOCK_ENGINE=simple
Environment=SEGSTORE_SIMPLE_SAVE=1

# ---- Target the specific offenders that are still showing up ----
# tx-inject family
Environment=TX_INJECT_DISABLE=1
Environment=DISABLE_TX_INJECT=1
Environment=TXINJECT_DISABLE=1
Environment=TX_INJECT2_DISABLE=1
Environment=TX_INJECT3_DISABLE=1
Environment=DISABLE_TX_INJECT2=1
Environment=DISABLE_TX_INJECT3=1

# force-inject wrapper
Environment=TX_INJECT_FORCE_DISABLE=1
Environment=DISABLE_TX_INJECT_FORCE=1

# tx-merge family (merge-all, caps, pour-on-save)
Environment=TX_MERGE_DISABLE=1
Environment=DISABLE_TX_MERGE=1
Environment=TX_MERGE_ALL_DISABLE=1
Environment=DISABLE_TX_MERGE_ALL=1
Environment=TX_MERGE_CAP_DISABLE=1
Environment=DISABLE_TX_MERGE_CAP=1
Environment=POUR_ON_SAVE_DISABLE=1
Environment=DISABLE_POUR_ON_SAVE=1

# chain latch variants (seen v11)
Environment=CHAIN_LATCH_V11_DISABLE=1
Environment=DISABLE_CHAIN_LATCH_V11=1

# Health/metrics only; keep proposer later via HTTP
Environment=PROPOSER_AUTO=0
