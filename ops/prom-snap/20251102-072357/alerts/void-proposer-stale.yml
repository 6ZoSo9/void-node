groups:
- name: void-proposer-stale
  interval: 15s
  rules:
  - alert: VoidProposerExporterStale
    expr: last_over_time(void:proposer_exporter_age_ms:last[2m]) > 60000
    for: 2m
    labels: { severity: warning, system: void }
    annotations:
      summary: "Proposer exporter is STALE"
      description: "Exporter age exceeded 60s for 2 minutes."
