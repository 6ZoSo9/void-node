groups:
- name: void-ready-lite
  rules:
  - alert: VoidReadyDegraded
    expr: (up{job="void-head"} == 1) and (void:ready:lite == 0)
    for: 10m
    labels: { severity: warning, system: void }
    annotations:
      summary: "VOID ready degraded"
      description: "Node is up but head hasn't advanced recently (void:ready:lite=0 for 10m)."
      runbook_url: "https://grafana.local/runbooks/void-ready-lite"
