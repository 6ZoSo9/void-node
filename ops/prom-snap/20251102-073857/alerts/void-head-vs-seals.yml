groups:
- name: void-head-vs-seals
  rules:
  - alert: VoidHeadBehindSeals
    expr: (void:head_seal_gap:seals_ahead >= 3) and on(instance) (up == 1)
    for: 2m
    labels: { system: void, severity: warning }
    annotations:
      summary: "Head behind seals ({{ $labels.instance }})"
      description: "Seals are {{ $value }} blocks ahead for ≥2m (env={{ $labels.env }})."

  - alert: VoidHeadBehindSealsCritical
    expr: (void:head_seal_gap:seals_ahead >= 10) and on(instance) (up == 1)
    for: 2m
    labels: { system: void, severity: critical }
    annotations:
      summary: "Head significantly behind seals ({{ $labels.instance }})"
      description: "Seals are {{ $value }} blocks ahead for ≥2m (env={{ $labels.env }})."

  # Any drift at all for 5m (direction-agnostic)
  - alert: VoidHeadSealGapNonZero
    expr: (void:head_seal_gap:abs > 0) and on(instance) (up == 1)
    for: 5m
    labels: { system: void, severity: info }
    annotations:
      summary: "Non-zero head↔seals gap ({{ $labels.instance }})"
      description: "Gap {{ $value }} has persisted for ≥5m (env={{ $labels.env }})."
