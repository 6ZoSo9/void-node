groups:
- name: void-header3-rules
  interval: 15s
  rules:
  - record: void:seals_rate_2m
    expr: clamp_min(delta(void_seal_last_number[2m]) / 120, 0)
  - record: void:header3_adv_rate_2m
    expr: clamp_min(delta(void_header3_last_number[2m]) / 120, 0)

  - record: void:seals_rate_2m:by_job
    expr: clamp_min((sum by (job, instance) (delta(void_seal_last_number[2m]))) / 120, 0)
  - record: void:header3_adv_rate_2m:by_job
    expr: clamp_min((sum by (job, instance) (delta(void_header3_last_number[2m]))) / 120, 0)

  - record: void:header3_age_s
    expr: time() - timestamp(void_header3_last_number)
  - record: void:seals_age_s
    expr: time() - timestamp(void_seal_last_number)
