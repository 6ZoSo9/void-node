groups:
- name: void-scrape-health
  rules:
  - alert: VoidTxrootCoreScrapeDown
    expr: up{job="void-txroot-core"} == 0
    for: 2m
    labels:
      severity: warning
      team: void
    annotations:
      summary: "void-txroot-core scrape is down"
      description: "The txroot core exporter at 127.0.0.1:4100/__void/metrics/txroot4/core is not scraping."
