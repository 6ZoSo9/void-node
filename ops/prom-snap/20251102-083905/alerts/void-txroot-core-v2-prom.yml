groups:
- name: void-txroot-core-v2-prom
  rules:
  - alert: VoidTxRootCoreV2PromDown
    expr: up{job="void-txroot-core-v2-prom"} == 0
    for: 2m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "TxRoot core2.prom scrape down"
      description: "Prom scrape for txroot core2.prom is down for >2m on {{ $labels.instance }}"
