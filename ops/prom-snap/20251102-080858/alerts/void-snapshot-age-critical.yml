groups:
- name: void-snapshot-age-critical
  interval: 30s
  rules:
  - alert: VoidSnapshotVeryStale
    expr: void_ops_prom_snap_age_seconds > 2700  # 45 minutes
    for: 5m
    labels:
      severity: critical
      system: void
    annotations:
      summary: "Prom snapshot VERY stale (>45m)"
      description: "Last snapshot age is {{ $value | humanizeDuration }}."
