groups:
- name: void-ready-alert
  rules:
  - alert: VoidReadyHardDegraded
    expr: void:ready:hard == 0
    for: 5m
    labels: { severity: critical, system: void }
    annotations:
      summary: "VOID hard-ready degraded"
      description: "Node is up but either head hasn't advanced or setter heartbeat is missing."
      runbook_url: "https://grafana.local/runbooks/void-ready-lite"
