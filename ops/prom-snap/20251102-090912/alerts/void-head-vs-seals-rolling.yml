groups:
- name: void-head-vs-seals-rolling
  rules:
  - record: void:head_seal_gap:seals_ahead:max_2m
    expr: max_over_time(void:head_seal_gap:seals_ahead[2m])

  - alert: VoidHeadBehindSealsRollingWarn
    expr: (void:head_seal_gap:seals_ahead:max_2m >= 3) and on(instance) (up == 1)
    for: 0m
    labels: { system: void, severity: warning }
    annotations:
      summary: "Head behind (rolling) — {{ $labels.instance }}"
      description: "Seals have been ahead by ≥3 blocks within 2m (env={{ $labels.env }})."

  - alert: VoidHeadBehindSealsRollingCrit
    expr: (void:head_seal_gap:seals_ahead:max_2m >= 10) and on(instance) (up == 1)
    for: 0m
    labels: { system: void, severity: critical }
    annotations:
      summary: "Head far behind (rolling) — {{ $labels.instance }}"
      description: "Seals ahead by ≥10 blocks within 2m (env={{ $labels.env }})."
