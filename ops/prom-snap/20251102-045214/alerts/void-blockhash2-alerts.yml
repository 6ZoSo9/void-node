groups:
- name: void-blockhash2-alerts
  rules:
  - alert: VoidBlockhashMismatch
    expr: increase(void_blockhash_mismatches[2m]) > 0
    for: 2m
    labels:
      severity: critical
      system: void
    annotations:
      summary: "Block hash verification failing"
      description: "Mismatches detected in the last 2m. Inspect /blocks/:n/hash2 to debug."

  - alert: VoidBlockhashHealthBad
    expr: (void:blockhash:ok:last_2m == 0) or on() (void_blockhash_health == 0)
    for: 2m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Blockhash health unhealthy"
      description: "void_blockhash_health has been 0 for 2m. Check /health/blockhash2 and the store/hash pipeline."
