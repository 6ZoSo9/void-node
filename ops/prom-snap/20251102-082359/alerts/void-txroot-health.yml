groups:
- name: void-txroot-health
  rules:
  - alert: VoidTxRootHealthBad
    expr: min_over_time(void_txroot_health[2m]) == 0
    for: 2m
    labels: {severity: warning, system: void, rule_version: core-v2}
    annotations:
      summary: "TxRoot health bad"
      description: "void_txroot_health == 0 for 2m (roots mismatched or not fresh)."
