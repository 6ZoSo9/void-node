groups:
- name: void-snapshot-age
  interval: 30s
  rules:
  - alert: VoidSnapshotStale
    expr: void_ops_prom_snap_age_seconds > 1800
    for: 10m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Prom snapshot stale (>30m)"
      description: "No new snapshot landed for {{ $value | humanizeDuration }}."
