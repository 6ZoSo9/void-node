rule_files:
  - /etc/prometheus/rules.d/*.yml
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: "void-header3"
    scheme: http
    metrics_path: /__void/metrics/header3.prom
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:4100"]
    scrape_interval: 15s
    scrape_timeout: 10s
  - job_name: "void-seals-v2"
    scheme: http
    metrics_path: /metrics/void/seals
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:4100"]
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9100']
