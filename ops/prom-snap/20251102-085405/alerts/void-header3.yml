groups:
- name: void-header3
  interval: 15s
  rules:
  - alert: VoidHeader3Mismatch
    expr: (void_header3_last_mismatch >= 0)
    for: 1m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Header3 mismatch detected"
      description: "header3 != computed txroot at block {{ $value }} sometime in the recent window."
  - alert: VoidHeader3Stale
    expr: (vector(0) + (time() - timestamp(void_header3_last_number))) > 120
    for: 2m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Header3 checker stale"
      description: "header3 checker hasn't advanced in >2m (possible scrape/job issue)."
