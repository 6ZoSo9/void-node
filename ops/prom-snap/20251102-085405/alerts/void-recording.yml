groups:
- name: void-recording
  interval: 15s
  rules:
  - record: void:follower_drift:last_2m
    expr: last_over_time(void_follower_drift{job="void-follower-v4",env="dev"}[2m])

  - record: void:follower_head_local:changes_2m
    expr: changes(void_follower_head_local{job="void-follower-v4",env="dev"}[2m])

  - record: void:follower_head_peer:increase_2m
    expr: increase(void_follower_head_peer{job="void-follower-v4",env="dev"}[2m])
