groups:
- name: void-proposer-rescue-surge
  interval: 15s
  rules:
  - alert: VoidProposerRescueSurge
    expr: increase(void_proposer_rescues_total[10m]) > 5
    for: 0m
    labels: { severity: warning, system: void }
    annotations:
      summary: "Proposer auto-rescue surge"
      description: "More than 5 rescues in the last 10 minutes."
