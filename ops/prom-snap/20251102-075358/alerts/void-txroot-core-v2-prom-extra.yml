groups:
- name: void-txroot-core-v2-prom-extra
  interval: 30s
  rules:
  - alert: VoidTxRootCoreThroughputLow
    expr: scalar( max(rate(void_txroot_core_saves_total[1m])) or on() vector(0) ) < bool 0.1
    for: 2m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "TxRoot core saves throughput is low"
      description: "saves_total 1m rate < 0.1 for 2m"
