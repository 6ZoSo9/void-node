groups:
- name: void-txroot-setter-alerts
  rules:
  - alert: VoidTxrootNoSetsWhileHeadAdvancing
    expr: (increase(void_head_number{job="void-head"}[10m]) > 50)
      and (increase(void_txroot_header_set_total{job="void-txroot-setter"}[10m]) == 0)
      and (max_over_time(void_block_txcount{job="void-head"}[10m]) > 0)
    for: 2m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "TxRoot setter not updating while head is advancing"
      description: "Head increased > 50 over 10m, but setter recorded 0 updates on windows with non-empty blocks."
