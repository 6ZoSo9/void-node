groups:
- name: void-snapshot-age-warn
  interval: 30s
  rules:
  - alert: VoidSnapshotStale
    expr: void_ops_prom_snap_age_seconds > 1800   # 30 minutes
    for: 5m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Prom snapshot stale (>30m)"
      description: "Last snapshot age is {{ $value | humanizeDuration }}."
