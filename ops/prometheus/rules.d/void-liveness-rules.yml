groups:
- name: void-liveness-rules
  interval: 15s
  rules:
  - record: void:liveness_age:last_2m
    expr: last_over_time(void_liveness_last_submit_age_seconds[2m])

  # Treat mempool ~0 as (mempool gauge) < 0.5; if you don’t have void_mempool, use a header-stall rule instead.
  - record: void:liveness_should_submit
    expr: (void:liveness_age:last_2m > 600) and (last_over_time(void_mempool[5m]) < 0.5)
