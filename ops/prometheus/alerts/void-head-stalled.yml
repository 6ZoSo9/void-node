groups:
- name: void-head
  rules:
  - alert: VoidHeadStalled
    expr: (void:head:stalled_2m == 1) and on(job,instance) (up == 1)
    for: 4m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "Head stalled ({{ $labels.instance }})"
      description: "void_head_number has not advanced for 2 minutes (job={{ $labels.job }}, instance={{ $labels.instance }})."
