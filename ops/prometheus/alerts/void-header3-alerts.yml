groups:
- name: void-header3-alerts
  interval: 15s
  rules:
  - alert: VoidSealsStalled
    expr: (void:seals_rate_2m) == 0
    for: 4m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Seals stalled"
      description: "No sealed blocks in the last 2 minutes."

  - alert: VoidHeader3NotAdvancing
    expr: (void:header3_adv_rate_2m) == 0
    for: 4m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "header3 not advancing"
      description: "void_header3_last_number hasn't moved in 2 minutes."

  - alert: VoidHeader3Mismatch
    expr: (void_header3_last_mismatch) >= 0
    for: 3m
    labels:
      severity: critical
      system: void
    annotations:
      summary: "header3 mismatch detected"
      description: "Last mismatch at block {{ $value }}."
