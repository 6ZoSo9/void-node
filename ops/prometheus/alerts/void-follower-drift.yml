groups:
- name: void-follower-drift
  rules:
  - alert: VoidFollowerDrift
    expr: last_over_time(void_follower_drift[2m]) > 0
    for: 2m
    labels: {system: void, severity: warn}
    annotations:
      summary: "VOID: follower drift > 0"
      description: "Follower head is behind peer for >2m."
