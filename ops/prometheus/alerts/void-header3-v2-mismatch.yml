groups:
- name: void-header3-v2
  interval: 15s
  rules:
  - alert: VoidHeader3MismatchV2
    expr: last_over_time(void_header3_match_v2[1m]) < 0.5
    for: 1m
    labels: {severity: critical, system: void}
    annotations:
      summary: "Header3 txRoot mismatch"
      description: "Parity exporter reports mismatch for >=1m on {{ $labels.instance }}"
