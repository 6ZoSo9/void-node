groups:
- name: void-header3-v2-alerts
  rules:
  - alert: VoidHeader3V2NoProgress
    expr: (time() - max_over_time(void_header3_last_number_v2[5m])) > 180
    for: 2m
    labels: { system: "void", severity: "warn" }
    annotations:
      summary: "header3 v2 exporter not progressing"
      description: "No header3 v2 progress in the last 3m."

  - alert: VoidTxRootSetterMismatch
    expr: increase(void_txroot_header_mismatch_total[5m]) > 0
    for: 1m
    labels: { system: "void", severity: "crit" }
    annotations:
      summary: "Header txRoot mismatch detected by setter"
      description: "Setter observed mismatches in the last 5m."

  - alert: VoidTxRootSetterErrors
    expr: increase(void_txroot_header_errors_total[5m]) > 0
    for: 1m
    labels: { system: "void", severity: "crit" }
    annotations:
      summary: "Header txRoot setter errors"
      description: "Setter returned errors in the last 5m."
