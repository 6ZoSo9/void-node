groups:
- name: void-header3-v2-alerts
  interval: 15s
  rules:
  - alert: VoidHeader3V2NoProgress
    expr: (time() - max_over_time(void_header3_last_number_v2[2m])) > 120
    for: 0m
    labels: {severity: warning, system: void}
    annotations:
      summary: "Header3 v2 not advancing"
      description: "No new checks in >2m."
  - alert: VoidHeader3V2Mismatch
    expr: last_over_time(void_header3_match_v2[1m]) == 0
    for: 2m
    labels: {severity: warning, system: void}
    annotations:
      summary: "Header3 v2 mismatch"
      description: "Header txRoot != expected for >2m."
