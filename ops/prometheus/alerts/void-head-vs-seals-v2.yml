groups:
- name: void-head-vs-seals-v2
  interval: 30s
  rules:
  # Example: head vs seals gap as a scalar (adjust to your actual recording if you have one)
  - record: void:head_seal_gap_signed
    expr: scalar( max(void_head_number) or on() vector(0) )
         - scalar( max(void_seals_last_block) or on() vector(0) )

  # Throughput low (uses BOOL for scalar-to-scalar comparison)
  - alert: VoidTxRootCoreThroughputV2Low
    expr: scalar( max(rate(void_txroot_core_set_total[1m])) or on() vector(0) ) < bool 0.1
    for: 4m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "TxRoot core throughput is low"
      description: "set_total 1m rate < 0.1 for 2m"

  # Health bad (kept if you scrape /health/txroot3?format=prom)
  - alert: VoidTxRootHealthBad
    expr: (1 - scalar(max(void_txroot_health) or on() vector(0))) > bool 0
    for: 4m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "TxRoot health is 0"
      description: "void_txroot_health stayed 0 for 2m"
