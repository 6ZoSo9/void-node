groups:
- name: void-setter
  rules:
  - alert: VoidTxRootSetterStuck
    expr: rate(void_txroot_header_heartbeat_total[2m]) == 0
    for: 4m
    labels: { severity: critical, system: void }
    annotations:
      summary: "TxRoot setter heartbeat stalled"
      description: "No txroot setter heartbeat increase in 2m."
