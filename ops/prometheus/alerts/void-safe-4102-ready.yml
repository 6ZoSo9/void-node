groups:
- name: void-safe-4102-ready
  interval: 15s
  rules:
  - alert: VoidSafe4102NotReady
    expr: (void:safe4102_ready) == 0
    for: 3m
    labels: { severity: warning, system: void, env: dev }
    annotations:
      summary: "SAFE 4102 not ready"
      description: "No head progress and/or header3 worker hasn’t checked any blocks for 3m."
