groups:
- name: void-ready-mismatch
  rules:
  - alert: VoidReadyMismatch
    expr: (void_ready_bit == 1) and (void:ready:hard == 0)
    for: 3m
    labels: { severity: critical, system: void }
    annotations:
      summary: "READY mismatch (node=1, hard=0)"
      description: "Node says ready, but either head isn’t advancing or setter HB is missing."
      runbook_url: "https://grafana.local/runbooks/void-ready-lite"
