groups:
- name: void-txroot-throughput-now
  interval: 15s
  rules:
  - alert: VoidTxRootSetRateLowNow
    expr: sum by(job) (rate(void_block_txroot_set_total[30s])) < 0.5
    for: 4m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "TxRoot set rate low ({{ $labels.job }})"
      description: "rate(void_block_txroot_set_total[30s]) < 0.5 for 2m (job={{ $labels.job }})"

  - alert: VoidBlockSavesRateLowNow
    expr: sum by(job) (rate(void_block_saves_total[30s])) < 0.5
    for: 4m
    labels:
      system: void
      severity: warning
    annotations:
      summary: "Block saves rate low ({{ $labels.job }})"
      description: "rate(void_block_saves_total[30s]) < 0.5 for 2m (job={{ $labels.job }})"
