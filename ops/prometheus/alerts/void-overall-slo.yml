groups:
- name: void-overall-slo
  interval: 15s
  rules:
  - alert: VoidOverallSLO1hBelow99
    expr: (void:overall_uptime_1h < 0.99)
    for: 5m
    labels: {severity: warning, system: void}
    annotations:
      summary: "Overall uptime < 99% (last 1h)"
      description: "void:overall_uptime_1h={{ $value | printf \"%.3f\" }}"

  - alert: VoidOverallSLO24hBelow95
    expr: (void:overall_uptime_24h < 0.95)
    for: 10m
    labels: {severity: warning, system: void}
    annotations:
      summary: "Overall uptime < 95% (last 24h)"
      description: "void:overall_uptime_24h={{ $value | printf \"%.3f\" }}"
