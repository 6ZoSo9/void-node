groups:
- name: void-agents-coverage
  interval: 15s
  rules:
  - alert: VoidAgentCoverageZero
    expr: (void_agent_receipts_coverage{job="void-agent-receipts-byid"} < 1)
    for: 2m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Agent {{ $labels.id }} not reporting"
      description: "coverage < 1 for 2m (no fresh receipts)."
