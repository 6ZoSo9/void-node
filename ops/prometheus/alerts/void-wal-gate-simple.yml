groups:
- name: void-wal-gate-simple
  interval: 15s
  rules:
  - alert: VoidWalGateRaised
    expr: max_over_time(void_wal_gate_proposer[2m]) == 1
    for: 2m
    labels: { severity: warning, system: void }
    annotations:
      summary: "WAL gate raised"
      description: "void_wal_gate_proposer==1 for 2m. Check clamp/preloads."
