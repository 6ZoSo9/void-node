groups:
- name: void-txroot-core
  rules:
  - alert: VoidTxRootMismatchCoreMain
    expr: rate(void_block_txroot_mismatch_total{job="void-txroot-core-v2"}[2m]) > 0
      and max_over_time(void_block_txcount{job="void-head"}[2m]) > 0
    for: 4m
    labels: { system: void, severity: warning }
    annotations:
      summary: "TxRoot mismatch on main"
      description: "Non-empty blocks seen recently and core mismatch > 0."

  - alert: VoidTxRootMismatchCoreFollower
    expr: rate(void_block_txroot_mismatch_total{job="void-txroot-core-v2-follower"}[2m]) > 0
      and max_over_time(void_block_txcount{job="void-head"}[2m]) > 0
    for: 4m
    labels: { system: void, severity: warning }
    annotations:
      summary: "TxRoot mismatch on follower"
      description: "Non-empty blocks seen recently and core mismatch > 0."
