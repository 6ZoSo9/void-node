groups:
- name: void-header3-gap
  rules:
  - alert: VoidHeader3WriterGapTooLarge
    expr: abs(max_over_time(void_header3:writer_gap[2m])) > 3
    for: 2m
    labels:
      severity: warning
      system: void
    annotations:
      summary: "Header writer/verifier gap > 3 for 2m"
      description: "Setter last_set_block and header3_last_number_v2 are diverging: gap={{ $value }}."
