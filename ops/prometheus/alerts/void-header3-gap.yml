groups:
- name: void-header3-gap
  interval: 15s
  rules:
  - alert: VoidHeader3StuckBehindHead
    expr: (max by() (void_head:last_number) - max by() (void_header3:last_number)) > 2
    for: 2m
    labels: {severity: warning, system: void}
    annotations:
      summary: "header3 exporter behind head"
      description: "header3 is >2 blocks behind head for 2m."
