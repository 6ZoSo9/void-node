[Service]
# Evict any stale listener on 4100 (stray proxy, old node, etc.) before we bind
ExecStartPre=/bin/bash -lc '\
  fuser -k 4100/tcp || true; \
  for i in {1..20}; do \
    ss -ltnH | grep -q ":4100 " || exit 0; \
    sleep 0.1; \
  done; \
  echo "[guard] 4100 still busy after evict"; \
  ss -ltnp | grep ":4100 " || true; \
  exit 1'
