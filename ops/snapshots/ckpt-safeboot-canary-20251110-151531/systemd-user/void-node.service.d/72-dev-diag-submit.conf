[Service]
# Dev & diag routes (this branch can require ALL of these)
Environment=VOID_ADDONS=DEV,DIAG
Environment=ALLOW_DEV_ROUTES=1
Environment=DEV_ROUTES=1
Environment=VOID_DIAG_ROUTES=1
Environment=ENABLE_DEV_ROUTES=1
Environment=ENABLE_DIAG_ROUTES=1

# TX submit → mempool bridges (seen on other builds)
Environment=VOID_TXSUBMIT=1
Environment=TX_SUBMIT_ENABLE=1
Environment=VOID_SAFE_SUBMIT_BRIDGE=1
Environment=VOID_MEMPOOL_BRIDGE=1

# Keep safeboot OFF and hardlock OFF (already off, but re-assert)
Environment=VOID_SAFEBOOT=0
Environment=HEADER3_HARDLOCK_DISABLE=1
Environment=HEADER3_HARDLOCK_OFF=1

# Head reader: use the LIVE store
Environment=HEAD_TXT_SOURCE=store
Environment=HEAD_STORE_DIR=%h/dev/void-node/data_a
