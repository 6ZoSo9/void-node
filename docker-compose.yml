version: "3.8"
services:
  proposer:
    build: .
    environment:
      DATA_DIR: /data_a
      HTTP_PORT: 4100
      P2P_PORT: 4700
      BOOTSTRAP_ADDRS: "proposer:4700,follower:4701"
      NODE_PRIVKEY_PATH: /keys/proposer.pem
    ports: ["4100:4100"]
    volumes:
      - ./data_a:/data_a
      - ./ops/keys:/keys
      - void_buy_authority_proposer:/root/.local/state/void-node-authority-v1
    command: ["node","dist/index.js"]

  follower:
    build: .
    environment:
      DATA_DIR: /data_b
      HTTP_PORT: 4101
      P2P_PORT: 4701
      BOOTSTRAP_ADDRS: "proposer:4700,follower:4701"
      NODE_PRIVKEY_PATH: /keys/follower.pem
    ports: ["4101:4101"]
    volumes:
      - ./data_b:/data_b
      - ./ops/keys:/keys
      - void_buy_authority_follower:/root/.local/state/void-node-authority-v1
    command: ["node","dist/index.js"]

volumes:
  void_buy_authority_proposer:
  void_buy_authority_follower:

volumes:
  void_buy_coupled_authority:
