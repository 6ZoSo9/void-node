name: Buy VOID dispatcher guarded broadcast apply v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_payment_keyed_dispatcher_guarded_broadcast_apply_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_guarded_broadcast_apply_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-guarded-broadcast-apply-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dispatcher-guarded-broadcast-apply-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_guarded_broadcast_context_v1.ts"
      - "src/economic/buy_void_payment_keyed_guarded_broadcast_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_lease_session_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "src/economic/buy_void_payment_keyed_runtime_dependency_bootstrap_v1.ts"
      - "src/economic/buy_void_payment_keyed_full_runtime_v1.ts"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_payment_keyed_dispatcher_guarded_broadcast_apply_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_guarded_broadcast_apply_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-guarded-broadcast-apply-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dispatcher-guarded-broadcast-apply-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove bounded dispatcher guarded broadcast apply
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          npm run build
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_guarded_broadcast_apply_v1.ts | tee "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_DISPATCHER_GUARDED_BROADCAST_APPLY_V1_PROOF_GREEN' "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          grep -Fx 'guarded_broadcast_worker_execution_bounded=true' "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          grep -Fx 'generic_full_runtime_apply_forbidden=true' "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          grep -Fx 'caller_dependency_authority=false' "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          grep -Fx 'dispatcher_publish=false' "$RUNNER_TEMP/dispatcher-guarded-apply.log"
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_guarded_broadcast_context_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_lease_session_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_guarded_broadcast_v1.ts
          git diff --check
