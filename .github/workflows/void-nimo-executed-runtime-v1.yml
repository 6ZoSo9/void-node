name: VOID Nimo executed runtime v1
on:
  pull_request:
    paths:
      - 'scripts/**/*nimo*'
      - 'scripts/fixtures/nimo-*/**'
      - 'scripts/run_void_public_bootstrap*'
      - 'scripts/lib/void_public_seed_common_v1.mjs'
      - 'tools/void-nimo-no-tailnet-acceptance-v1.mjs'
      - 'public/bootstrap/v1.json'
      - '.github/workflows/void-nimo-executed-runtime-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**/*nimo*'
      - 'scripts/fixtures/nimo-*/**'
      - 'scripts/run_void_public_bootstrap*'
      - 'scripts/lib/void_public_seed_common_v1.mjs'
      - 'tools/void-nimo-no-tailnet-acceptance-v1.mjs'
      - 'public/bootstrap/v1.json'
      - '.github/workflows/void-nimo-executed-runtime-v1.yml'
permissions:
  contents: read
jobs:
  schedules:
    name: Executed runtime schedules (Node ${{ matrix.major }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 22
            version: 22.23.2
          - major: 24
            version: 24.21.0
          - major: 26
            version: 26.10.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.version }}
      - name: Nine independent schedules
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for file in scripts/lib/void_nimo_executed_runtime_v1.mjs scripts/prove_void_nimo_executed_runtime_v1.mjs scripts/verify_void_nimo_executed_runtime_v1.mjs scripts/fixtures/nimo-executed-runtime-v1/*.mjs; do
            node --check "$file"
          done
          node scripts/prove_void_nimo_executed_runtime_v1.mjs predecessor "$RUNNER_TEMP/raw" "$GITHUB_RUN_ID"
          for profile in mutation recovery; do
            for index in 1 2 3 4; do
              node scripts/prove_void_nimo_executed_runtime_v1.mjs "$profile-$index" "$RUNNER_TEMP/raw" "$GITHUB_RUN_ID"
            done
          done
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-raw-${{ matrix.major }}
          path: ${{ runner.temp }}/raw/*.json
          if-no-files-found: error
          retention-days: 14
  verify:
    name: Verify executed runtime (Node ${{ matrix.major }})
    needs: schedules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 22
            version: 22.23.2
          - major: 24
            version: 24.21.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-raw-*
          path: ${{ runner.temp }}/input
      - name: Byte-first runtime verification
        run: node scripts/verify_void_nimo_executed_runtime_v1.mjs "$RUNNER_TEMP/input" "$RUNNER_TEMP/verified" "$GITHUB_RUN_ID" "${{ matrix.major }}" single
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-verified-${{ matrix.major }}
          path: ${{ runner.temp }}/verified/*.json
          if-no-files-found: error
          retention-days: 14
  matrix:
    name: Verify Node 26 and exact 30-execution matrix
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/input
      - name: Third verifier also binds the complete matrix
        run: node scripts/verify_void_nimo_executed_runtime_v1.mjs "$RUNNER_TEMP/input" "$RUNNER_TEMP/verified" "$GITHUB_RUN_ID" 26 matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executed-runtime-matrix
          path: |
            ${{ runner.temp }}/input/runtime-*/*.json
            ${{ runner.temp }}/verified/*.json
          if-no-files-found: error
          retention-days: 14
