name: VOID economic epoch2 production validator runtime import v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-validator-runtime-import-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_import_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-runtime-import-v1.md"
      - "tools/void-economic-epoch2-production-validator-runtime-evidence-candidate-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs"
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-precision-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-nimo-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-xiphos-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-runtime-evidence-v1.json"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-import-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-economic-epoch2-production-validator-runtime-import-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_import_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-runtime-import-v1.md"
      - "tools/void-economic-epoch2-production-validator-runtime-evidence-candidate-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs"
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-precision-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-nimo-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-xiphos-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-runtime-evidence-v1.json"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-import-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-production-validator-runtime-import-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove per-host candidate contract
        run: |
          set -euo pipefail
          node scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs

      - name: Prove three-host semantic import
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-runtime-import-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_runtime_import_v1.mjs
          node scripts/prove_void_economic_epoch2_production_validator_runtime_import_v1.mjs

      - name: Diff hygiene
        run: git diff --check
