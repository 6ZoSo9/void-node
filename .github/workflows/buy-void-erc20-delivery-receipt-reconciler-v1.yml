name: Buy VOID ERC20 delivery receipt reconciler v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-erc20-delivery-receipt-reconciler-v1.yml"
      - "docs/operators/buy-void-erc20-delivery-receipt-reconciler-v1.md"
      - "docs/operators/buy-void-canonical-erc20-delivery-composition-v1.md"
      - "scripts/prove_buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "scripts/prove_buy_void_canonical_erc20_delivery_composition_v1.ts"
      - "scripts/prove_buy_void_runtime_integration_guard_v1.ts"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-erc20-delivery-receipt-reconciler-v1.yml"
      - "docs/operators/buy-void-erc20-delivery-receipt-reconciler-v1.md"
      - "docs/operators/buy-void-canonical-erc20-delivery-composition-v1.md"
      - "scripts/prove_buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "scripts/prove_buy_void_canonical_erc20_delivery_composition_v1.ts"
      - "scripts/prove_buy_void_runtime_integration_guard_v1.ts"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove ERC20 receipt reconciliation
        run: npx --no-install tsx scripts/prove_buy_void_erc20_delivery_receipt_reconciler_v1.ts
      - name: Preserve canonical ERC20 composition
        run: npx --no-install tsx scripts/prove_buy_void_canonical_erc20_delivery_composition_v1.ts
      - name: Preserve canonical parent HOLD
        run: npx --no-install tsx scripts/prove_buy_void_canonical_erc20_execution_hold_v1.ts
      - name: Preserve parent integration guard
        run: npx --no-install tsx scripts/prove_buy_void_runtime_integration_guard_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
