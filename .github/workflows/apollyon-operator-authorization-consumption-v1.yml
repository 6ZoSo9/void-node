name: Apollyon operator authorization consumption v1

on:
  pull_request:
    paths:
      - "tools/apollyon-operator-authorization-consumption-v1.mjs"
      - "scripts/prove_apollyon_operator_authorization_consumption_v1.mjs"
      - "docs/security/apollyon-operator-authorization-consumption-v1.md"
      - ".github/workflows/apollyon-operator-authorization-consumption-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/apollyon-operator-authorization-consumption-v1.mjs"
      - "scripts/prove_apollyon_operator_authorization_consumption_v1.mjs"
      - "docs/security/apollyon-operator-authorization-consumption-v1.md"
      - ".github/workflows/apollyon-operator-authorization-consumption-v1.yml"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Syntax
        run: |
          node --check tools/apollyon-operator-authorization-consumption-v1.mjs
          node --check scripts/prove_apollyon_operator_authorization_consumption_v1.mjs
      - name: Prove durable single-use consumption
        run: node scripts/prove_apollyon_operator_authorization_consumption_v1.mjs
