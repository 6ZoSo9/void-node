name: Apollyon training pre-entry binary candidate lock v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
      - "scripts/prove_apollyon_training_preentry_binary_candidate_v1.py"
      - "fixtures/security/apollyon-training-preentry-binary-candidate-lock-v1.json"
      - "scripts/prove_apollyon_training_preentry_binary_candidate_lock_v1.py"
      - "docs/security/apollyon-training-preentry-binary-candidate-lock-v1.md"
      - ".github/workflows/apollyon-training-preentry-binary-candidate-lock-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
      - "scripts/prove_apollyon_training_preentry_binary_candidate_v1.py"
      - "fixtures/security/apollyon-training-preentry-binary-candidate-lock-v1.json"
      - "scripts/prove_apollyon_training_preentry_binary_candidate_lock_v1.py"
      - "docs/security/apollyon-training-preentry-binary-candidate-lock-v1.md"
      - ".github/workflows/apollyon-training-preentry-binary-candidate-lock-v1.yml"

permissions:
  contents: read

jobs:
  lock-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate lock
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate lock
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove parent candidate validator and lock
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prove_apollyon_training_preentry_binary_candidate_v1.py \
            scripts/prove_apollyon_training_preentry_binary_candidate_lock_v1.py
          python3 -I -B scripts/prove_apollyon_training_preentry_binary_candidate_v1.py \
            --self-test
          python3 -I -B scripts/prove_apollyon_training_preentry_binary_candidate_lock_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
