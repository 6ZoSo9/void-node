name: VOID coupled successor runtime semantic seam v1

on:
  pull_request:
    paths:
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "scripts/prove_void_coupled_successor_runtime_semantic_seam_v1.mjs"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "docs/architecture/coupled-successor-runtime-semantic-seam-v1.md"
      - "docs/ren/journal/2026-09-27-coupled-successor-runtime-semantic-seam-v1.md"
      - ".github/workflows/void-coupled-successor-runtime-semantic-seam-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-coupled-successor-runtime-semantic-seam-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove runtime semantic seam
        run: node scripts/prove_void_coupled_successor_runtime_semantic_seam_v1.mjs

      - name: Preserve successor migration proof
        run: node scripts/prove_void_economic_evm_successor_migration_v1.mjs

      - name: Preserve coupled gate proof
        run: node scripts/prove_void_coupled_economic_successor_gate_v1.mjs

      - name: Diff hygiene
        run: git diff --check
