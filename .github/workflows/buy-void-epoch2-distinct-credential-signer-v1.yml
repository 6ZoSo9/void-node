name: Buy VOID Epoch-2 distinct credential signer v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-distinct-credential-signer-v1.yml"
      - "src/economic/buy_void_native_fulfillment_wallet_credential_signer_v1.ts"
      - "scripts/prove_buy_void_epoch2_credential_signer_v1.ts"
      - "docs/operators/buy-void-epoch2-distinct-fulfiller-credential-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and prove distinct Epoch-2 signer boundary
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          node --import tsx scripts/prove_buy_void_epoch2_credential_signer_v1.ts
          node --import tsx scripts/prove_buy_void_native_fulfillment_wallet_credential_signer_v1.ts
          git diff --check
