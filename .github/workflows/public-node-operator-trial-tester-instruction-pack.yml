name: public-node-operator-trial-tester-instruction-pack

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-tester-instruction-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial tester instruction pack
        run: bash tools/check_public_node_operator_trial_tester_instruction_pack_v1.sh
