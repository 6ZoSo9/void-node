name: Buy VOID Epoch-2 dormant first-entry installed qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.yml"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.md"
      - "docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.yml"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.md"
      - "docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-dormant-first-entry-installed-qualification-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact installed-qualification generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_base=abfc9bca33717cda57448672107f1b8d8b3fdfd0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$source_base" "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              test "$PR_BASE" != 0000000000000000000000000000000000000000
              git merge-base --is-ancestor "$PR_BASE" "$EXPECTED_HEAD"
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              git merge-base --is-ancestor "$PUSH_BEFORE" "$EXPECTED_HEAD"
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if test "$EVENT_NAME" = pull_request; then
            allowed="$RUNNER_TEMP/allowed.txt"
            actual="$RUNNER_TEMP/actual.txt"
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.yml' \
              '.github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-materializer-v1.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v3.yml' \
              'docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.md' \
              'docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-materializer-v1.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v3.md' \
              'ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py' \
              'ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.c' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
              'ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json' \
              'ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf' \
              'scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_materializer_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
              | LC_ALL=C sort > "$allowed"
            git diff --no-renames --name-only "$base" "$EXPECTED_HEAD" -- | LC_ALL=C sort > "$actual"
            test -s "$actual"
            unexpected="$RUNNER_TEMP/unexpected.txt"
            LC_ALL=C comm -23 "$actual" "$allowed" > "$unexpected"
            if test -s "$unexpected"; then
              cat "$unexpected" >&2
              exit 1
            fi
          fi

          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-current-head-plan-v1.md)" = \
            4f41222ec32edb8b6fda911ecbc060ec1bcc14e7
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-installed-qualification-v1.md)" = \
            7e1bc8498638cd78afdd5f7399de6e66fc7301e1
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py)" = \
            1e6edd633328cec597f9ae3064e013ac62b69de4
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py)" = \
            f0ca6d231ea787eee6b1f9be84000111ef9055a4
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py)" = \
            ce6930bc1be8239a3171d4922c44b96a50f5778b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py)" = \
            438b69e3c0da8549b77f7bdeaa7ed35e7d07ef84
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json)" = \
            227c2fa449abf1387925373c706ecd07775d5898
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_current_head_plan_v1.py)" = \
            771c0b5981c58929fcc76186f32b4cf6278e5199
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py)" = \
            8f6505078984588e007fb807eb9105af847f0467

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and focused proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_INSTALLED_QUALIFICATION_V1_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/installed-qualification-v1-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_INSTALLER_FIRST_ENTRY_INSTALLED_QUALIFICATION_V1_PROOF_GREEN' \
            'target_blob_bound=true' \
            'installer_v5_blob_bound=true' \
            'standalone_observer_v6_blob_bound=true' \
            'real_dependency_loaders_exercised=true' \
            'real_accepted_lock_observation_exercised=true' \
            'former_native_parent_gates_preserved=true' \
            'real_qualification_reaches_installed_state_gate=true' \
            'real_planner_transitive_qualification_exercised=true' \
            'real_source_checkout_lock_drift_rejected=true' \
            'retained_checkout_exit_drift_rejected=true' \
            'real_observer_cleanup_verified=true' \
            'production_root_ownership_checks_preserved=true' \
            'fixture_root_metadata_emulated=true' \
            'triple_installed_snapshot_exercised=true' \
            'installed_generation_drift_rejected=true' \
            'temporary_git_metadata_truth_preserved=true' \
            'temporary_git_metadata_cleanup_required=true' \
            'payload_execution_absent=true' \
            'protected_root_write=false' \
            'repository_worktree_write=false' \
            'service_mutation=false' \
            'credential_access=false' \
            'signing=false' \
            'transaction=false' \
            'rpc_call=false' \
            'funds_movement=false' \
            'production_host_evidence_authority=false' \
            'installed_generation_evidence_authority=true' \
            'non_designated_host_authority_rejected=true' \
            'privileged_execution_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Verify inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/installed-qualification-v1-source-plan.log"
          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_installed_qualification_v1.py --source-plan | tee "$out"

          for marker in \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'root_required_for_run=true' \
            'triple_snapshot_required=true' \
            'temporary_git_metadata_write_possible_on_run=true' \
            'temporary_git_metadata_cleanup_required=true' \
            'protected_root_write=false' \
            'repository_worktree_write=false' \
            'launcher_execution=false' \
            'native_execution=false' \
            'binder_execution=false' \
            'credential_access=false' \
            'funds_movement=false' \
            'production_host_evidence_authority=false' \
            'installed_generation_evidence_authority=false' \
            'privileged_execution_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
