name: VOID PR2761 main reconciliation v1

on:
  push:
    branches:
      - ren/buy-void-preappend-detached-json-v1-20261010
    paths:
      - .github/workflows/void-pr2761-main-reconcile-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2761-main-reconcile-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact reconciliation trigger
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge qualified main and prove hardening composition
        shell: bash
        run: bash scripts/void_pr2761_main_reconcile_v1.sh
