name: Buy VOID custody durability rollback challenge plan v2
on:
  pull_request:
    paths:
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json"
      - "scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v2.py"
      - "docs/architecture/buy-void-presale-custody-durability-rollback-challenge-plan-v2.md"
      - ".github/workflows/buy-void-presale-custody-durability-rollback-challenge-plan-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact parent and source-only delta
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PARENT=60a6fffc0fd8de576769f4bc090b3a12ca4ba526
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT" "$EXPECTED_HEAD"
          printf '%s\n' \
            'ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json' \
            'scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v2.py' \
            'docs/architecture/buy-void-presale-custody-durability-rollback-challenge-plan-v2.md' \
            '.github/workflows/buy-void-presale-custody-durability-rollback-challenge-plan-v2.yml' | sort > "$RUNNER_TEMP/expected"
          git diff --no-renames --name-only "$PARENT" "$EXPECTED_HEAD" -- | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git rev-parse HEAD:src/economic)" = 71c67e62a2b21a98f3f5135ee6aa56e0ef97d262
          test "$(git rev-parse HEAD:ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json)" = 5face2022dc2cbc573e32e99f88623f381a8a174
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs)" = 96d4ac3499d222841f1f7a3c53e14900b68ae8cf
          test "$(git rev-parse HEAD:scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v1.mjs)" = b196fcaa77a6bdc465baacb3387aa949f47bc956
          git diff --check "$PARENT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Source-only closed plan and adversarial proof
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v2.py --self-test
          python3 -I -B scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v2.py --run

      - name: Prove controller V1 refuses V2 authorization before capability use
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import {
            VOID_BUY_VOID_ALLOCATION_CUSTODY_ROLLBACK_CONTROLLER_PLAN_ID_V1 as V1,
            buildBuyVoidAllocationCustodyRollbackChallengeAuthorizationIdV1 as buildId,
            executeBuyVoidAllocationCustodyRollbackControllerCandidateV1 as execute,
          } from "./tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs";
          const V2="voidbuycustodychallengeplan2_622c5cab506b8424860a484e6675f73031a26635c0ef29a80aee2281f53f0844";
          assert.notEqual(V1,V2);
          const body={
            marker:"VOID_BUY_VOID_CUSTODY_ROLLBACK_CHALLENGE_AUTHORIZATION_V1",
            version:1,
            plan_id:V1,
            operation_id:"voidbuycustodychallengeop1_"+"1".repeat(64),
            non_customer_canary:true,
            canary_domain_id:"void.buyvoid.presale.noncustomer.canary.v1",
            allocation_ledger_unchanged_required:true,
            customer_request_state_unchanged_required:true,
            reviewed_source_tree:"71c67e62a2b21a98f3f5135ee6aa56e0ef97d262",
            exact_current_policy_bound:true,
            expected_policy_fingerprint_sha256:"sha256:"+"a".repeat(64),
            expected_policy_generation:"9",
          };
          const authorizationFor=plan_id=>{
            const data={...body,plan_id};
            return {...data,authorization_id:buildId(data)};
          };
          // A valid V1 authorization passes plan validation and reaches capability preflight.
          assert.throws(()=>execute({authorization:authorizationFor(V1),capabilities:{}}),
            error=>error?.message==="capability_set_invalid");
          let capabilityTouched=0;
          const untrustedCapabilities=new Proxy({}, {
            get(){capabilityTouched++;throw new Error("capabilities_evaluated");},
            ownKeys(){capabilityTouched++;throw new Error("capabilities_enumerated");},
          });
          // The new V2 plan is rejected by the actual V1 controller before capability access.
          assert.throws(()=>execute({authorization:authorizationFor(V2),capabilities:untrustedCapabilities}),
            error=>error?.message==="authorization_plan_invalid");
          assert.equal(capabilityTouched,0);
          const reusedV1=authorizationFor(V1);
          // No accidental reinterpretation of a V1 authorization after changing its plan field.
          assert.throws(()=>execute({authorization:{...reusedV1,plan_id:V2},capabilities:untrustedCapabilities}),
            error=>error?.message==="authorization_plan_invalid");
          assert.equal(capabilityTouched,0);
          console.log("VOID_BUY_VOID_CUSTODY_V1_V2_BEHAVIORAL_IDENTITY_PROOF_GREEN");
          console.log("valid_v1_authorization_reaches_capability_boundary=true");
          console.log("v2_authorization_rejected_before_capability_access=true");
          console.log("v1_authorization_rebind_to_v2_rejected=true");
          console.log("injected_capabilities_invoked=false");
          console.log("host_execution=false");
          console.log("payment_acceptance=false");
          console.log("public_presale_activation=false");
          console.log("funds_movement=false");
          NODE
