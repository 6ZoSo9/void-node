name: VOID Nimo no-Tailnet acceptance v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-nimo-no-tailnet-acceptance-v1.yml'
      - 'docs/operations/void-nimo-no-tailnet-onboarding-v1.md'
      - 'scripts/prove_void_nimo_no_tailnet_acceptance_v1.mjs'
      - 'tools/void-nimo-no-tailnet-acceptance-v1.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/void-nimo-no-tailnet-acceptance-v1.yml'
      - 'docs/operations/void-nimo-no-tailnet-onboarding-v1.md'
      - 'scripts/prove_void_nimo_no_tailnet_acceptance_v1.mjs'
      - 'tools/void-nimo-no-tailnet-acceptance-v1.mjs'

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax
        run: |
          node --check tools/void-nimo-no-tailnet-acceptance-v1.mjs
          node --check scripts/prove_void_nimo_no_tailnet_acceptance_v1.mjs
      - name: Focused proof
        run: node scripts/prove_void_nimo_no_tailnet_acceptance_v1.mjs
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
