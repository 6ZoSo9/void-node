name: VOID PR1106 current-main reconciliation v1

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-pr1106-current-main-reconcile-v1.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/buy-void-production-private-services-activation-v1-20260808'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile exact current main and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feat/buy-void-production-private-services-activation-v1-20260808'
          EXPECTED_FEATURE_HEAD='33611e71ecf07b90dbb1a688cdf2439d6cf262e2'
          EXPECTED_MAIN='62bc3c2121f00c85b4571175ca746c974d5927ad'
          EXPECTED_MERGE_BASE='521b2ef4fa9c9ad38af94c9b7b36da73c2cc9f53'
          HELPER='.github/workflows/tmp-pr1106-current-main-reconcile-v1.yml'

          FEATURE_FILES=(
            '.github/workflows/buy-void-production-private-services-activation-v1.yml'
            'docs/operators/buy-void-production-private-services-activation-v1.md'
            'scripts/prove_buy_void_production_private_services_activation_v1.ts'
            'src/economic/buy_void_production_private_services_activation_v1.ts'
          )
          MAIN_FILES=(
            '.github/workflows/storage-readiness-route-stack-boundary-v1.yml'
            'scripts/prove_void_storage_readiness_route_stack_boundary_v1.mjs'
            'src/diag/patch_latest_number2_shim_v3.cjs'
            'src/index.ts'
          )

          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          test "$(git diff --name-only "$EXPECTED_FEATURE_HEAD" HEAD)" = "$HELPER"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_FEATURE_HEAD" "$EXPECTED_MAIN")" = "$EXPECTED_MERGE_BASE"

          actual_feature_scope="$(git diff --name-only "$EXPECTED_MERGE_BASE" "$EXPECTED_FEATURE_HEAD" | sort)"
          expected_feature_scope="$(printf '%s\n' "${FEATURE_FILES[@]}" | sort)"
          test "$actual_feature_scope" = "$expected_feature_scope"

          actual_main_scope="$(git diff --name-only "$EXPECTED_MERGE_BASE" "$EXPECTED_MAIN" | sort)"
          expected_main_scope="$(printf '%s\n' "${MAIN_FILES[@]}" | sort)"
          test "$actual_main_scope" = "$expected_main_scope"

          declare -A FEATURE_BLOBS
          for f in "${FEATURE_FILES[@]}"; do
            FEATURE_BLOBS["$f"]="$(git rev-parse "$EXPECTED_FEATURE_HEAD:$f")"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          git rm -- "$HELPER"

          for f in "${FEATURE_FILES[@]}"; do
            test "$(git hash-object -- "$f")" = "${FEATURE_BLOBS[$f]}"
          done

          final_scope="$(git diff --name-only "$EXPECTED_MAIN" | sort)"
          test "$final_scope" = "$expected_feature_scope"
          git diff --check "$EXPECTED_MAIN"

          git commit -m 'chore: reconcile PR1106 with current main'

          new_head="$(git rev-parse HEAD)"
          parents="$(git show -s --format='%P' HEAD)"
          first_parent="$(printf '%s\n' "$parents" | awk '{print $1}')"
          second_parent="$(printf '%s\n' "$parents" | awk '{print $2}')"
          test "$first_parent" = "$(git rev-parse HEAD^)"
          test "$second_parent" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$first_parent^")" = "$EXPECTED_FEATURE_HEAD"

          final_committed_scope="$(git diff --name-only "$EXPECTED_MAIN" "$new_head" | sort)"
          test "$final_committed_scope" = "$expected_feature_scope"
          test ! -e "$HELPER"

          git push origin "HEAD:$BRANCH"
