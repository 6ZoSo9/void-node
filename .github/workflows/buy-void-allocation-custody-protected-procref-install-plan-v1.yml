name: VOID Buy custody protected proc-ref install plan v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_protected-procref-install-plan-v1.mjs"
      - "docs/operators/buy-void-allocation-custody-protected-procref-install-plan-v1.md"
      - ".github/workflows/buy-void-allocation-custody-protected-procref-install-plan-v1.yml"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source-only install plan
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="0fcd557319fbec6ffec78cb94a8fdeda41f67366"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-protected-procref-install-plan-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-protected-procref-install-plan-v1.md'
            $'A\tscripts/prove_void_buy_allocation_custody_protected-procref-install-plan-v1.mjs'
            $'A\ttools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs)" = \
            "9c8e414e3b46924472c0d49a7e9dbf7e616bdf2f"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_protected-procref-install-plan-v1.mjs)" = \
            "3c82cf44ab179d1e349b3ab76a3c3de4a3c7f1cf"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-protected-procref-install-plan-v1.md)" = \
            "ea6d1f03a1f6fc0552ba3cdb529ddf5e6a2b45d4"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = \
            "25c0e32ae85da4569fb9521a0812e10ab0fcede3"

          test "$(git cat-file -s HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = "56180"
          printf '%s  %s\n' \
            "d87dc3c539d32aff9722b802ec4b172441e98095a5bcc5cd5edac868572b4e0a" \
            "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py" \
            | sha256sum -c -

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Parse source-only JavaScript
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs
          node --check scripts/prove_void_buy_allocation_custody_protected-procref-install-plan-v1.mjs

      - name: Prove source-only install boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/protected-procref-install-plan-proof.txt"
          node scripts/prove_void_buy_allocation_custody_protected-procref-install-plan-v1.mjs | tee "$proof"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_PROTECTED_PROCREF_INSTALL_PLAN_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_plan_source_blob=true' \
            'reviewed_protected_source_blob_exact=true' \
            'reviewed_protected_source_bytes_exact=true' \
            'reviewed_protected_source_sha256_exact=true' \
            'fixed_protected_install_paths_bound=true' \
            'create_only_no_clobber_contract=true' \
            'same_filesystem_root_staging_required=true' \
            'fsync_and_postinstall_reverification_required=true' \
            'content_addressed_install_receipt_required=true' \
            'install_receipt_external_review_required=true' \
            'stop_before_root_census_required=true' \
            'no_filesystem_module_import=true' \
            'no_child_process_module_import_in_plan=true' \
            'no_apply_install_execute_mode=true' \
            'protected_source_install_authorized=false' \
            'protected_source_installed=false' \
            'root_census_execution_authorized=false' \
            'privileged_all_process_census_executed=false' \
            'filesystem_write=false' \
            'service_mutation=false' \
            'systemd_mutation=false' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Render non-authorizing plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/protected-procref-install-plan.json"
          node tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs --plan > "$plan"
          node --input-type=module - "$plan" <<'NODE'
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(p.status!=="HOLD_SOURCE_ONLY_NO_INSTALL_AUTHORITY") throw new Error("status");
          if(p.reviewed_source.git_blob_sha1!=="25c0e32ae85da4569fb9521a0812e10ab0fcede3") throw new Error("blob");
          if(p.reviewed_source.bytes!==56180) throw new Error("bytes");
          if(p.reviewed_source.sha256!=="d87dc3c539d32aff9722b802ec4b172441e98095a5bcc5cd5edac868572b4e0a") throw new Error("sha256");
          for(const k of [
            "protected_source_install_authorized",
            "protected_source_installed",
            "root_census_execution_authorized",
            "privileged_all_process_census_executed",
            "filesystem_write",
            "service_mutation",
            "systemd_mutation",
            "replacement_apply_authorized",
            "runtime_integration",
            "payment_acceptance",
            "public_presale_activation",
            "production_gate_ready",
            "funds_movement",
          ]) if(p.authority[k]!==false) throw new Error(k);
          process.stdout.write("VOID_PROTECTED_PROCREF_INSTALL_PLAN_RENDER_GREEN\n");
          NODE

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
