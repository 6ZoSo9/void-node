name: Buy VOID V3 staging instruction amount binding v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_payment_v2_allocation_stage.ts"
      - "scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts"
      - "docs/architecture/buy-void-verified-payment-v3-instruction-amount-binding-v1.md"
      - ".github/workflows/buy-void-verified-payment-v3-instruction-amount-binding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: staging instruction amount / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact successor generation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="42041eb8dc28aac2e26dfcc4b144caa729829d12"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t actual < <(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/buy-void-verified-payment-v3-instruction-amount-binding-v1.yml"
            "docs/architecture/buy-void-verified-payment-v3-instruction-amount-binding-v1.md"
            "scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts"
            "src/economic/buy_void_verified_payment_v2_allocation_stage.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#actual[@]}" -eq 4
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test "$(git rev-parse HEAD:src/economic/buy_void_verified_payment_v2_allocation_stage.ts)" = "3d2b600462222966e06b33f75af8da054ed4aeaf"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts)" = "5445fd595354fa9824a509af92c580d0506feb5d"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-verified-payment-v3-instruction-amount-binding-v1.md)" = "988c3e1a04b071620ecdb8a3d7095271ab367f53"
          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install and build exact source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Prove instruction amount binding
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stage-instruction-amount-${{ matrix.node }}.log"
          timeout 120s npx --no-install tsx scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts | tee "$out"
          grep -Fx "VOID_BUY_VOID_VERIFIED_PAYMENT_V2_ALLOCATION_STAGE_PROOF_GREEN" "$out"
          grep -Fx "payment_instruction_amount_bound_to_request_and_verifier=true" "$out"
          grep -Fx "missing_mismatched_or_invalid_payment_instruction_amount_rejected=true" "$out"
          grep -Fx "original_first_request_history_qualified=false" "$out"
          grep -Fx "locked_writer_preappend_history_gate_required=true" "$out"
          grep -Fx "source_only_unmounted=true" "$out"
          grep -Fx "payment_acceptance=false" "$out"
          grep -Fx "presale_activation=false" "$out"
          grep -Fx "funds_movement=false" "$out"
      - name: Preserve parent generation refusal
        run: |
          set -euo pipefail
          set +e
          timeout 150s node scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs --self-test             > "$RUNNER_TEMP/parent.stdout" 2> "$RUNNER_TEMP/parent.stderr"
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "v3_parent_relative_scope_changed|v2_added_economic_source_not_exact:src/economic/buy_void_verified_payment_v2_allocation_stage.ts"             "$RUNNER_TEMP/parent.stderr"
          echo "VOID_BUY_VOID_V3_STAGE_INSTRUCTION_AMOUNT_PARENT_REFUSAL_GREEN"
