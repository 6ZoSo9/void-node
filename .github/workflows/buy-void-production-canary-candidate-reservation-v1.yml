name: Buy VOID production canary candidate reservation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-production-canary-candidate-reservation-v1.yml"
      - "docs/operators/buy-void-production-canary-candidate-reservation-v1.md"
      - "scripts/buy_void_production_canary_candidate_reservation_v1.ts"
      - "scripts/prove_buy_void_production_canary_candidate_reservation_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_runtime_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts"
      - "scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "scripts/prove_buy_void_production_live_canary_preflight_v1.ts"
      - "src/economic/buy_void_production_live_canary_preflight_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-production-canary-candidate-reservation-v1.yml"
      - "docs/operators/buy-void-production-canary-candidate-reservation-v1.md"
      - "scripts/buy_void_production_canary_candidate_reservation_v1.ts"
      - "scripts/prove_buy_void_production_canary_candidate_reservation_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_runtime_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts"
      - "scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "scripts/prove_buy_void_production_live_canary_preflight_v1.ts"
      - "src/economic/buy_void_production_live_canary_preflight_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-production-canary-candidate-reservation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_production_canary_candidate_reservation_v1.ts \
            scripts/prove_buy_void_production_canary_candidate_reservation_v1.ts
      - name: Prove candidate reservation operator boundary
        run: npx --no-install tsx scripts/prove_buy_void_production_canary_candidate_reservation_v1.ts
      - name: Preserve crash-consistent saga runtime
        run: npx --no-install tsx scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts
      - name: Preserve crash-consistent saga server policy
        run: npx --no-install tsx scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts
      - name: Preserve production live-canary preflight
        run: npx --no-install tsx scripts/prove_buy_void_production_live_canary_preflight_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene across committed change range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == "push" ]] && [[ -n "$PUSH_BEFORE_SHA" ]] && [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            git diff --check HEAD^..HEAD
          fi
