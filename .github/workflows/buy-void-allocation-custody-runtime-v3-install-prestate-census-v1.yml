name: VOID Buy custody runtime V3 install prestate census v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-install-prestate-census-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-install-prestate-census-v1.yml"
      - "ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact read-only census successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="4f0150a53a4c938c273c634f506f5dbbc56475e7"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-install-prestate-census-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-install-prestate-census-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py)" = \
            "5da3edbcc9f2799faad44f722893c501669a80fd"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py)" = \
            "f637a7f8bde0679bcf16cf1f69256ad1380d9861"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-install-prestate-census-v1.md)" = \
            "5fd3522f00dba37d6e249b3b14a8514bf4f1f3fe"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json)" = \
            "edb4ea2b833373ab387762e45ba7da4032c860f3"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py

      - name: Self-test census without host inspection
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-v3-prestate-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py \
            --self-test | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_INSTALL_PRESTATE_CENSUS_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'archive_lock_exact=true' \
            'descriptor_bound_tree_scan=true' \
            'target_tree_content_metadata_digest=true' \
            'nested_mount_rejection_bound=true' \
            'symlink_opaque_identity_bound=true' \
            'special_file_rejection=true' \
            'stage_and_rollback_collision_observed=true' \
            'read_only=true' \
            'filesystem_write=false' \
            'archive_extraction=false' \
            'service_state_checked=false' \
            'service_mutation=false' \
            'request_history_read=false' \
            'custody_data_read=false' \
            'credential_access=false' \
            'wallet_or_signer_access=false' \
            'install_target_selected=false' \
            'existing_target_replaced=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/custody-v3-prestate-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py \
            | tee "$proof"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_INSTALL_PRESTATE_CENSUS_V1_PROOF_GREEN' "$proof"
          for marker in \
            'archive_lock_exact=true' \
            'descriptor_bound_tree_scan=true' \
            'target_tree_content_metadata_digest=true' \
            'nested_mount_rejection_bound=true' \
            'symlink_opaque_identity_bound=true' \
            'absent_target_create_only_candidate_proven=true' \
            'present_target_rollback_candidate_proven=true' \
            'special_file_rejection=true' \
            'collision_fail_closed=true' \
            'host_census_not_executed_in_ci=true' \
            'read_only=true' \
            'filesystem_write=false' \
            'archive_extraction=false' \
            'service_state_checked=false' \
            'service_mutation=false' \
            'request_history_read=false' \
            'custody_data_read=false' \
            'credential_access=false' \
            'wallet_or_signer_access=false' \
            'install_target_selected=false' \
            'existing_target_replaced=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
