name: Apollyon protected-store metadata-safe first-host collector V1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_protected_store_first_host_collector_v1.py"
      - "scripts/prove_apollyon_protected_store_first_host_collector_v1.py"
      - "docs/security/apollyon-protected-store-first-host-collector-v1.md"
      - ".github/workflows/apollyon-protected-store-first-host-collector-v1.yml"
      - "ops/security/apollyon-protected-store-machine-identity-binding-v1.json"
      - "scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py"
      - "docs/security/apollyon-protected-store-machine-identity-binding-v1.md"
      - ".github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml"
      - "ops/security/apollyon-xiphos-machine-id-provenance-hold-v1.json"
      - "scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v1.py"
      - "docs/security/apollyon-xiphos-machine-id-provenance-hold-v1.md"
      - ".github/workflows/apollyon-xiphos-machine-id-provenance-hold-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact post-provenance-HOLD parent and four-file repair scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          parent=819031d8e9f1dfe4863a0df06fd2420a00c1cad8
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$parent" "$HEAD_SHA"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/apollyon-protected-store-first-host-collector-v1.yml' \
            'docs/security/apollyon-protected-store-first-host-collector-v1.md' \
            'ops/xiphos/apollyon_protected_store_first_host_collector_v1.py' \
            'scripts/prove_apollyon_protected_store_first_host_collector_v1.py' \
            | LC_ALL=C sort > "$expected"
          git diff --no-renames --name-only "$parent" "$HEAD_SHA" -- \
            | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/xiphos/apollyon_protected_store_first_host_collector_v1.py)" = 36f77c85a2716989726af77679160de2b9e48f76
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_first_host_collector_v1.py)" = 5159ae38a32d32e910d7baeadf3003cb6d83d20b
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-first-host-collector-v1.md)" = 13491811c99d8d0de95609af81711e595cfb0159

          test "$(git rev-parse HEAD:ops/security/apollyon-protected-store-machine-identity-binding-v1.json)" = 0fb44bcfd90423d5bfbe6f7a9e6143de54bc9b26
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py)" = 45ab6a6cbfea05d61617de294d18ed7dec07fae9
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-machine-identity-binding-v1.md)" = 24cc4b6ce92931d9be9d39a46afb5a1c76e267fb
          test "$(git rev-parse HEAD:.github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml)" = c8737fe68f15894bd15af0e775fc79cb2b50d9bb

          # Preserve merged #3763 truth: the observed digest is not authenticated
          # host provenance and cannot authorize collector execution.
          test "$(git rev-parse HEAD:ops/security/apollyon-xiphos-machine-id-provenance-hold-v1.json)" = e0c7aa5d26639caee4c293da1846544bb07ca903
          test "$(git rev-parse HEAD:scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v1.py)" = d848808585934e6609f0c84c09adcba18339a583
          test "$(git rev-parse HEAD:docs/security/apollyon-xiphos-machine-id-provenance-hold-v1.md)" = fb6fdba3e8cba4f471daa09cef3469de0c0dd24d
          test "$(git rev-parse HEAD:.github/workflows/apollyon-xiphos-machine-id-provenance-hold-v1.yml)" = e526570137e1d50d41c1876feb79b07c665017a1

          git diff --check "$parent" "$HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for name in (
              "ops/xiphos/apollyon_protected_store_first_host_collector_v1.py",
              "scripts/prove_apollyon_protected_store_first_host_collector_v1.py",
          ):
              compile(Path(name).read_text("utf-8"), name, "exec", dont_inherit=True)
          print("collector_python_syntax_green=true")
          PY

      - name: Self-test source without host pass
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/collector-self-test.log"
          python3 -I -B ops/xiphos/apollyon_protected_store_first_host_collector_v1.py --self-test | tee "$out"
          grep -Fx 'VOID_APOLLYON_PROTECTED_STORE_FIRST_HOST_COLLECTOR_V1_SELF_TEST_GREEN' "$out"
          grep -Fx 'host_read_performed=false' "$out"
          grep -Fx 'machine_identity_bound=true' "$out"
          grep -Fx 'protected_record_contents_read=false' "$out"
          grep -Fx 'protected_record_names_listed=false' "$out"
          grep -Fx 'process_environment_read=false' "$out"
          grep -Fx 'raw_process_args_read=false' "$out"
          grep -Fx 'filesystem_mutation=false' "$out"
          grep -Fx 'service_mutation=false' "$out"
          grep -Fx 'training_execution=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Prove inert metadata-safe collector boundary
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/collector-proof.log"
          python3 -I -B scripts/prove_apollyon_protected_store_first_host_collector_v1.py | tee "$out"
          for marker in \
            'VOID_APOLLYON_PROTECTED_STORE_FIRST_HOST_COLLECTOR_V1_PROOF_GREEN' \
            'exact_parent_binding_pinned=true' \
            'machine_identity_digest_pinned=true' \
            'protected_record_contents_read=false' \
            'protected_record_names_listed=false' \
            'process_environment_read=false' \
            'raw_process_args_read=false' \
            'directory_enumeration_not_required=true' \
            'acl_adversary_rejected=true' \
            'terminal_metadata_drift_rejected=true' \
            'ambiguous_stacked_mount_rejected=true' \
            'complete_mountinfo_cover_row_bound=true' \
            'mount_options_drift_bound=true' \
            'mount_source_drift_bound=true' \
            'mount_super_options_drift_bound=true' \
            'raw_mount_source_not_emitted=true' \
            'systemctl_show_only_contract=true' \
            'inert_full_pass_orchestration_executed=true' \
            'whole_pass_drift_adversaries_rejected=true' \
            'absence_does_not_promote_installed_metadata=true' \
            'host_pass_performed=false' \
            'filesystem_mutation=false' \
            'service_mutation=false' \
            'training_execution=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Require plan mode preserves negative authority
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/collector-plan.json"
          python3 -I -B ops/xiphos/apollyon_protected_store_first_host_collector_v1.py --plan > "$plan"
          python3 -I -B - "$plan" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          assert value["mode"]=="plan"
          assert value["authority"]["host_pass_performed"] is False
          for key in (
              "protected_store_origin_proven",
              "writer_invocation_authorized",
              "training_execution_authorized",
              "credential_access",
              "signing",
              "transaction",
              "funds_movement",
          ):
              assert value["authority"][key] is False, key
          assert value["protected_record_contents_read"] is False
          assert value["protected_record_names_listed"] is False
          assert value["process_environment_read"] is False
          assert value["raw_process_args_read"] is False
          print("collector_plan_negative_authority_green=true")
          PY

      - name: Final diff hygiene
        run: |
          set -euo pipefail
          git diff --check 819031d8e9f1dfe4863a0df06fd2420a00c1cad8 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
