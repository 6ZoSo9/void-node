name: public-node-operator-trial-packet

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial packet
        run: bash tools/check_public_node_operator_trial_packet_v1.sh
