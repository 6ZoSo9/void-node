name: Buy VOID native plan binding current-main reconcile v1

on:
  push:
    branches:
      - fix/buy-void-production-native-execution-plan-binding-v1-20260809
    paths:
      - '.github/workflows/buy-void-native-plan-binding-current-main-reconcile-v1.yml'

permissions:
  contents: write

concurrency:
  group: buy-void-native-plan-binding-current-main-reconcile-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact branch and exact main
        shell: bash
        env:
          EXPECTED_MAIN: 000b89f59698b19c6744c77be34f8393316e8fab
          BRANCH: fix/buy-void-production-native-execution-plan-binding-v1-20260809
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          LIVE_BRANCH="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE_BRANCH" = "$GITHUB_SHA"
          test "$LIVE_MAIN" = "$EXPECTED_MAIN"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          MERGE_BASE="$(git merge-base HEAD "$EXPECTED_MAIN")"
          printf '%s\n' \
            '.github/workflows/buy-void-native-plan-binding-current-main-reconcile-v1.yml' \
            'docs/operators/buy-void-production-native-execution-operator-v1.md' \
            'scripts/buy_void_production_native_execution_operator_v1.ts' \
            'scripts/prove_buy_void_native_execution_runtime_v1.ts' \
            'scripts/prove_buy_void_production_native_execution_operator_v1.ts' \
            'src/economic/buy_void_native_execution_runtime_v1.ts' \
            > /tmp/expected-child.txt
          git diff --name-only "$MERGE_BASE"...HEAD | sort > /tmp/actual-child.txt
          diff -u /tmp/expected-child.txt /tmp/actual-child.txt
          git diff --name-only "$MERGE_BASE".."$EXPECTED_MAIN" | sort > /tmp/main-movement.txt
          for path in \
            'docs/operators/buy-void-production-native-execution-operator-v1.md' \
            'scripts/buy_void_production_native_execution_operator_v1.ts' \
            'scripts/prove_buy_void_native_execution_runtime_v1.ts' \
            'scripts/prove_buy_void_production_native_execution_operator_v1.ts' \
            'src/economic/buy_void_native_execution_runtime_v1.ts'; do
            if grep -Fxq "$path" /tmp/main-movement.txt; then
              echo "main overlap detected: $path" >&2
              exit 1
            fi
          done

      - name: Merge exact current main
        shell: bash
        env:
          EXPECTED_MAIN: 000b89f59698b19c6744c77be34f8393316e8fab
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          test -z "$(git status --porcelain)"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove native execution binding
        run: |
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_native_execution_operator_v1.ts

      - name: Preserve merged private-service and terminal truth
        run: |
          npx --no-install tsx scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts

      - name: Preserve runtime integration and E2E
        run: |
          npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
          npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Verify exact reconciled scope
        shell: bash
        env:
          EXPECTED_MAIN: 000b89f59698b19c6744c77be34f8393316e8fab
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_MAIN"...HEAD
          printf '%s\n' \
            '.github/workflows/buy-void-native-plan-binding-current-main-reconcile-v1.yml' \
            'docs/operators/buy-void-production-native-execution-operator-v1.md' \
            'scripts/buy_void_production_native_execution_operator_v1.ts' \
            'scripts/prove_buy_void_native_execution_runtime_v1.ts' \
            'scripts/prove_buy_void_production_native_execution_operator_v1.ts' \
            'src/economic/buy_void_native_execution_runtime_v1.ts' \
            > /tmp/expected.txt
          git diff --name-only "$EXPECTED_MAIN"...HEAD | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Guard live refs then ordinary-push reconciliation
        shell: bash
        env:
          EXPECTED_MAIN: 000b89f59698b19c6744c77be34f8393316e8fab
          BRANCH: fix/buy-void-production-native-execution-plan-binding-v1-20260809
        run: |
          set -euo pipefail
          LIVE_BRANCH="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE_BRANCH" = "$GITHUB_SHA"
          test "$LIVE_MAIN" = "$EXPECTED_MAIN"
          git push origin HEAD:"refs/heads/$BRANCH"
