name: VOID keygen create-only v1

on:
  pull_request:
    paths:
      - "scripts/keygen.ts"
      - "scripts/keygen.js"
      - "scripts/prove_void_keygen_create_only_v1.mjs"
      - ".github/workflows/void-keygen-create-only-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/keygen.ts"
      - "scripts/keygen.js"
      - "scripts/prove_void_keygen_create_only_v1.mjs"
      - ".github/workflows/void-keygen-create-only-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: keygen create-only / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove create-only key generation
        run: |
          set -euo pipefail
          node --check scripts/keygen.js
          node --check scripts/prove_void_keygen_create_only_v1.mjs
          node scripts/prove_void_keygen_create_only_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck -- --pretty false

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
