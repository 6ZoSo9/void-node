name: void-public-participant-session-state-file-v1

on:
  pull_request:
    paths:
      - "ops/public/void-public-participant-session-state-file-v1.mjs"
      - "ops/public/void-public-participant-read-session-v1.mjs"
      - "ops/public/void-public-participant-session-http-v1.mjs"
      - "scripts/prove_void_public_participant_session_state_file_v1.mjs"
      - "scripts/prove_void_public_participant_session_http_v1.mjs"
      - "docs/security/void-public-participant-session-state-file-v1.md"
      - ".github/workflows/void-public-participant-session-state-file-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/prove_void_public_participant_session_state_file_v1.mjs
      - if: matrix.node == 24
        run: node scripts/prove_void_public_participant_session_http_v1.mjs
