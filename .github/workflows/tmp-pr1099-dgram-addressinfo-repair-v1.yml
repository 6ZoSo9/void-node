name: VOID PR1099 dgram AddressInfo repair v1

on:
  push:
    branches:
      - 'feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Guard exact repair parent and source shape
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='967167772afdeecb06be3a0544769e2a1917349a'
          SRC='src/p2p/udp_swarm_datagram_runtime_v1.ts'
          WF='.github/workflows/tmp-pr1099-dgram-addressinfo-repair-v1.yml'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WF"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/p2p/udp_swarm_datagram_runtime_v1.ts')
          s = p.read_text()
          old = 'function freezeBound(address: dgram.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'
          new = 'function freezeBound(address: net.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'
          assert s.count(old) == 1, s.count(old)
          assert s.count(new) == 0, s.count(new)
          PY

      - name: Apply one-token namespace repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/p2p/udp_swarm_datagram_runtime_v1.ts')
          s = p.read_text()
          old = 'function freezeBound(address: dgram.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'
          new = 'function freezeBound(address: net.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/tmp-pr1099-dgram-addressinfo-repair-v1.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Prove UDP swarm datagram runtime
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_datagram_runtime_v1.ts

      - name: Preserve raw-empty-catch terminal zero
        run: npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Verify final semantic scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='967167772afdeecb06be3a0544769e2a1917349a'
          SRC='src/p2p/udp_swarm_datagram_runtime_v1.ts'
          test "$(git diff --name-only "$EXPECTED_PARENT")" = "$SRC"
          git diff --check "$EXPECTED_PARENT"
          git diff -- "$SRC" | grep -F -- '-function freezeBound(address: dgram.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'
          git diff -- "$SRC" | grep -F -- '+function freezeBound(address: net.AddressInfo): VoidUdpSwarmDatagramRuntimeBoundV1 {'

      - name: Commit exact repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: use net AddressInfo for UDP runtime build'
          git push origin HEAD:feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808
