name: VOID Buy custody allocation-root observed read v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs"
      - "scripts/prove_buy_void_custody_allocation_roots_observed_read_v1.mjs"
      - "docs/architecture/buy-void-custody-allocation-roots-observed-read-v1.md"
      - ".github/workflows/buy-void-custody-allocation-roots-observed-read-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-allocation-read-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check observer and proof
        run: |
          set -euo pipefail
          node --check src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs
          node --check scripts/prove_buy_void_custody_allocation_roots_observed_read_v1.mjs
      - name: Prove FIFO-safe allocation-root observation
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/custody-allocation-read-node-${{ matrix.node }}.txt"
          node scripts/prove_buy_void_custody_allocation_roots_observed_read_v1.mjs | tee "$receipt"
          for invariant in \
            'VOID_BUY_VOID_CUSTODY_ALLOCATION_ROOTS_OBSERVED_READ_V1_PROOF_GREEN' \
            'exact_source_git_blob_verified=true' \
            'leaf_fifo_substitution_nonblocking=true' \
            'descriptor_and_visible_identity_revalidated=true' \
            'cross_root_atomic_snapshot_proven=false' \
            'allocation_writer_lock_held=false' \
            'allocation_reserve_enabled=false' \
            'custody_recover_enabled=false' \
            'filesystem_write=false' \
            'production_allocation_mutation_ready=false' \
            'funds_moved=false'
          do
            grep -Fx "$invariant" "$receipt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-allocation-read-node-${{ matrix.node }}
          path: ${{ runner.temp }}/custody-allocation-read-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
  cross-node:
    needs: prove
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-allocation-read-node-*
          path: ./receipts
          merge-multiple: true
      - name: Require byte-identical receipts
        run: |
          set -euo pipefail
          cmp receipts/custody-allocation-read-node-22.txt receipts/custody-allocation-read-node-24.txt
          cmp receipts/custody-allocation-read-node-22.txt receipts/custody-allocation-read-node-26.txt
          echo VOID_BUY_VOID_CUSTODY_ALLOCATION_ROOTS_OBSERVED_READ_CROSS_NODE_GREEN
