name: VOID public node safe serve snapshot budget v1

on:
  pull_request:
    paths:
      - "tools/public-node-safe-serve-v1.mjs"
      - "tools/public-node-safe-serve-snapshot-budget-v1.mjs"
      - "tools/check_public_node_safe_serve_v1.sh"
      - "package.json"
      - "scripts/prove_public_node_safe_serve_snapshot_budget_v1.mjs"
      - "docs/security/public-node-safe-serve-snapshot-budget-v1.md"
      - ".github/workflows/public-node-safe-serve-snapshot-budget-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: snapshot budget / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check source and proof
        run: |
          set -euo pipefail
          node --check tools/public-node-safe-serve-v1.mjs
          node --check tools/public-node-safe-serve-snapshot-budget-v1.mjs
          node --check scripts/prove_public_node_safe_serve_snapshot_budget_v1.mjs

      - name: Prove aggregate snapshot admission
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-node-safe-serve-snapshot-budget-v1.txt"
          node scripts/prove_public_node_safe_serve_snapshot_budget_v1.mjs | tee "$proof"
          grep -Fx 'VOID_PUBLIC_NODE_SAFE_SERVE_SNAPSHOT_BUDGET_V1_GREEN' "$proof"
          grep -Fx 'max_public_file_bytes=8388608' "$proof"
          grep -Fx 'max_aggregate_snapshot_bytes=33554432' "$proof"
          grep -Fx 'max_in_flight_snapshots=8' "$proof"
          grep -Fx 'reservation_before_body_allocation=true' "$proof"
          grep -Fx 'head_snapshot_reservation=false' "$proof"
          grep -Fx 'capacity_rejection_before_body_read=true' "$proof"
          grep -Fx 'release_finish_close_error_abort=true' "$proof"
          grep -Fx 'pre_send_disconnect_stops_send=true' "$proof"
          grep -Fx 'synchronous_send_failure_release=true' "$proof"
          grep -Fx 'release_idempotent=true' "$proof"
          grep -Fx 'retry_after_release=true' "$proof"
          grep -Fx 'descriptor_custody_preserved=true' "$proof"
          grep -Fx 'workflow_trigger_coverage_complete=true' "$proof"
          grep -Fx 'runtime_or_network_mutation=false' "$proof"

      - name: Re-prove safe-serve custody and per-file ceiling
        run: bash tools/check_public_node_safe_serve_v1.sh

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck -- --pretty false

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
