name: chain2050-role-authority-sovereign-owner-gas-funding-receipt-evidence-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-sovereign-owner-gas-funding-receipt-evidence-v1.json"
      - "tools/chain2050-role-authority-sovereign-owner-gas-funding-receipt-evidence-v1.mjs"
      - "scripts/prove_chain2050_role_authority_sovereign_owner_gas_funding_receipt_evidence_v1.mjs"
      - "docs/security/chain2050-role-authority-sovereign-owner-gas-funding-receipt-evidence-v1.md"
      - ".github/workflows/chain2050-role-authority-sovereign-owner-gas-funding-receipt-evidence-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_sovereign_owner_gas_funding_receipt_evidence_v1.mjs | tee "$RUNNER_TEMP/funding-receipt.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_SOVEREIGN_OWNER_GAS_FUNDING_RECEIPT_EVIDENCE_V1_GREEN' "$RUNNER_TEMP/funding-receipt.log"
          grep -Fx 'funding_receipt_evidence_id=voidcrasgfr1_e9385b102116119b36a6f783451fd4357df4150b9a8813ed98e4ee1f754fba0e' "$RUNNER_TEMP/funding-receipt.log"
          grep -Fx 'registry_entry_count=0' "$RUNNER_TEMP/funding-receipt.log"
      - run: git diff --check
