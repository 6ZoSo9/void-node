name: Buy VOID payment-keyed terminal closeout v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-terminal-closeout-v1.yml"
      - "src/economic/buy_void_payment_keyed_terminal_closeout_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_terminal_closeout_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-terminal-closeout-v1.md"
      - "src/economic/buy_void_payment_keyed_receipt_evidence_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_reconstruction_v1.ts"
      - "src/economic/buy_void_confirmed_closeout_v1.ts"
      - "src/economic/buy_void_confirmed_state_journal_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-payment-keyed-terminal-closeout-v1.yml"
      - "src/economic/buy_void_payment_keyed_terminal_closeout_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_terminal_closeout_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-terminal-closeout-v1.md"
      - "src/economic/buy_void_payment_keyed_receipt_evidence_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_reconstruction_v1.ts"
      - "src/economic/buy_void_confirmed_closeout_v1.ts"
      - "src/economic/buy_void_confirmed_state_journal_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Typecheck and prove payment-keyed terminal closeout
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          node --import tsx scripts/prove_buy_void_payment_keyed_terminal_closeout_v1.ts
          git diff --check
