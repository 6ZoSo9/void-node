name: VOID Buy credential query ELF lock v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v2.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v2.mjs"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v2.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v2.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v2.mjs"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Rederive exact candidate and lock
        run: |
          set -euo pipefail
          proof=scripts/prove_void_buy_user_manager_credential_query_elf_lock_v2.mjs
          out="$RUNNER_TEMP/credential-query-elf-lock-v2-${{ matrix.node }}.json"

          node "$proof" --self-test | tee "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V2_GREEN' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'lock_id=voidbuyumqcredelflock2_c05afb1a6fbd44a00d4f220652e87ee099e0456992a17a6ae7b60bda9229cf54' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'query_binary_sha256=af02d006176db1a16eee52625751736c63af3bd1b250b46f81f200359fb48718' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'max_dropin_paths=64' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'max_load_credentials=32' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'exactly_one_epoch2_credential_required=true' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'candidate_accepted=true' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'replacement_authorized=false' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'live_query_authorized=false' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/credential-query-lock-v2-proof.log"

          node "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json

      - name: Reprove fixed-path hostile-loader boundary
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -static -fno-pie -no-pie -Wl,--build-id=none             -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -Wl,--build-id=none             -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"

          test "$(sha256sum "$pre" | awk '{print $1}')" =             "67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c"
          test "$(sha256sum "$query" | awk '{print $1}')" =             "af02d006176db1a16eee52625751736c63af3bd1b250b46f81f200359fb48718"
          test "$(stat -Lc '%s' "$pre")" -eq 706504
          test "$(stat -Lc '%s' "$query")" -eq 47160

          test -d /opt
          test ! -L /opt
          host_opt_before="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          for tool in /usr/bin/unshare /usr/bin/mount /usr/bin/mountpoint /usr/bin/install /usr/bin/env /usr/bin/bash; do
            test -x "$tool"
          done
          sudo -n true

          fake="$RUNNER_TEMP/credential-lock-v2-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-lock-v2-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\"" \
            "$fake/preload.c" -o "$fake/preload.so"

          ns="$RUNNER_TEMP/credential-lock-v2-private-opt.sh"
          cat > "$ns" <<'SH'
          set -euo pipefail
          pre="$1"
          query="$2"
          preload="$3"
          sentinel="$4"
          direct_log="$5"
          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1

          self_ns="$(stat -Lc '%i' /proc/self/ns/mnt)"
          init_ns="$(stat -Lc '%i' /proc/1/ns/mnt)"
          test "$self_ns" != "$init_ns"

          /usr/bin/mount --make-rprivate /
          /usr/bin/mount -t tmpfs -o mode=0755,uid=0,gid=0,size=16m tmpfs /opt
          /usr/bin/mountpoint -q /opt
          test "$(stat -Lc '%u:%g:%a' /opt)" = "0:0:755"

          /usr/bin/install -d -o root -g root -m 0755 "$root"
          /usr/bin/install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          /usr/bin/install -o root -g root -m 0555 "$query" "$root/$query_name"

          rm -f "$sentinel"
          if /usr/bin/env \
               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
               LD_PRELOAD="$preload" \
               "$root/$query_name" --self-test >"$direct_log" 2>&1; then
            echo direct_poisoned_v2_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          /usr/bin/env LD_PRELOAD="$preload" \
            "$root/$pre_name" --exec-self-test
          test ! -e "$sentinel"
          SH

          sudo -n /usr/bin/unshare --mount --fork /usr/bin/bash "$ns" \
            "$pre" "$query" "$fake/preload.so" "$sentinel" \
            "$RUNNER_TEMP/direct-query.log" |
            tee "$RUNNER_TEMP/preexec-query.log"

          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V2_SELF_TEST_GREEN' "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/preexec-query.log"
          host_opt_after="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          test "$host_opt_after" = "$host_opt_before"
          test ! -e /opt/void-buy-void-user-manager-credential-query-v1

          echo private_opt_mount_namespace=true
          echo host_opt_identity_unchanged=true
          echo host_opt_metadata_mutation=false
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V2_HOSTILE_LOADER_GREEN

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/credential-query-elf-lock-v2-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks

      - name: Require exact lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "locks/credential-query-elf-lock-v2-$node.json"
          done
          cmp locks/credential-query-elf-lock-v2-22.json locks/credential-query-elf-lock-v2-24.json
          cmp locks/credential-query-elf-lock-v2-22.json locks/credential-query-elf-lock-v2-26.json
          grep -F '"lock_id": "voidbuyumqcredelflock2_c05afb1a6fbd44a00d4f220652e87ee099e0456992a17a6ae7b60bda9229cf54"'             locks/credential-query-elf-lock-v2-22.json
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V2_CROSS_NODE_GREEN
