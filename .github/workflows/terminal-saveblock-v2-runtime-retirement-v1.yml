name: terminal-saveblock-v2-runtime-retirement-v1

on:
  pull_request:
    paths:
      - 'scripts/retire_terminal_saveblock_v2_runtime_v1.mjs'
      - 'scripts/prove_terminal_saveblock_v2_runtime_retirement_v1.mjs'
      - 'scripts/copy_void_runtime_js_v1.mjs'
      - 'src/index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/terminal-saveblock-v2-runtime-retirement-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/retire_terminal_saveblock_v2_runtime_v1.mjs'
      - 'scripts/prove_terminal_saveblock_v2_runtime_retirement_v1.mjs'
      - 'scripts/copy_void_runtime_js_v1.mjs'
      - 'src/index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/terminal-saveblock-v2-runtime-retirement-v1.yml'

permissions:
  contents: read

jobs:
  prove-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build emitted runtime with retirement transform
        run: npm run build
      - name: Prove terminal saveBlock v2 is dead in emitted runtime
        run: node scripts/prove_terminal_saveblock_v2_runtime_retirement_v1.mjs
