name: Authenticated Paid Work Production Activation Credential Reference Metadata v1

on:
  pull_request:
    paths:
      - .github/workflows/authenticated-paid-work-production-activation-credential-reference-metadata-v1.yml
      - config/activation-candidates/authenticated-paid-work-production-activation-credential-reference-metadata-v1.json
      - docs/operations/authenticated-paid-work-production-activation-credential-reference-metadata-v1.md
      - schemas/authenticated-paid-work-production-activation-credential-reference-metadata-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_credential_reference_metadata_v1.mjs
      - scripts/prove_authenticated_paid_work_production_activation_credential_reference_temporal_binding_v1.mjs
      - scripts/prove_authenticated_paid_work_production_activation_postrestart_mutation_neutrality_v1.mjs
      - scripts/external_agent_paid_work_authenticated_submission_activation_prerequisite_v1.ts
      - schemas/external-agent-paid-work-authenticated-submission-activation-prerequisite-v1.schema.json
      - scripts/agent_paid_work_credential_registry_v1.ts
      - schemas/agent-paid-work-credential-registry-v1.schema.json
      - scripts/agent_paid_work_submission_receiver_v1.ts
      - docs/operators/agent-paid-work-credential-registry-v1.md
      - .github/workflows/authenticated-paid-work-production-activation-service-unit-design-v1.yml
      - docs/operations/authenticated-paid-work-production-activation-service-unit-design-v1.md
      - ops/mainnet0/authenticated-paid-work-production-activation-service-unit-design-v1.json
      - schemas/authenticated-paid-work-production-activation-service-unit-design-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_service_unit_design_v1.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/authenticated-paid-work-production-activation-credential-reference-metadata-v1.yml
      - config/activation-candidates/authenticated-paid-work-production-activation-credential-reference-metadata-v1.json
      - docs/operations/authenticated-paid-work-production-activation-credential-reference-metadata-v1.md
      - schemas/authenticated-paid-work-production-activation-credential-reference-metadata-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_credential_reference_metadata_v1.mjs
      - scripts/prove_authenticated_paid_work_production_activation_credential_reference_temporal_binding_v1.mjs
      - scripts/prove_authenticated_paid_work_production_activation_postrestart_mutation_neutrality_v1.mjs
      - scripts/external_agent_paid_work_authenticated_submission_activation_prerequisite_v1.ts
      - schemas/external-agent-paid-work-authenticated-submission-activation-prerequisite-v1.schema.json
      - scripts/agent_paid_work_credential_registry_v1.ts
      - schemas/agent-paid-work-credential-registry-v1.schema.json
      - scripts/agent_paid_work_submission_receiver_v1.ts
      - docs/operators/agent-paid-work-credential-registry-v1.md
      - .github/workflows/authenticated-paid-work-production-activation-service-unit-design-v1.yml
      - docs/operations/authenticated-paid-work-production-activation-service-unit-design-v1.md
      - ops/mainnet0/authenticated-paid-work-production-activation-service-unit-design-v1.json
      - schemas/authenticated-paid-work-production-activation-service-unit-design-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_service_unit_design_v1.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-production-activation-credential-reference-metadata-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove exact non-secret credential reference and non-activation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bind Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse exact source credential reference metadata
        run: node -e 'JSON.parse(require("node:fs").readFileSync("config/activation-candidates/authenticated-paid-work-production-activation-credential-reference-metadata-v1.json", "utf8"))'

      - name: Prove merged activation prerequisites
        run: |
          node scripts/prove_authenticated_paid_work_production_activation_configuration_schema_v1.mjs
          node scripts/prove_authenticated_paid_work_production_activation_configuration_instance_v1.mjs
          node scripts/prove_authenticated_paid_work_runtime_disabled_production_rollback_plan_v1.mjs
          node scripts/prove_authenticated_paid_work_production_activation_trusted_context_reference_metadata_v1.mjs
          node scripts/prove_authenticated_paid_work_production_activation_service_unit_design_v1.mjs

      - name: Prove exact credential reference, temporal binding, restart neutrality, and non-activation
        run: |
          node scripts/prove_authenticated_paid_work_production_activation_credential_reference_metadata_v1.mjs
          node scripts/prove_authenticated_paid_work_production_activation_credential_reference_temporal_binding_v1.mjs
          node scripts/prove_authenticated_paid_work_production_activation_postrestart_mutation_neutrality_v1.mjs
