name: VOID Buy VOID canonical caller request source v1
on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_canonical_caller_request_v1.ts"
      - "docs/architecture/buy-void-canonical-caller-request-v1.md"
      - ".github/workflows/buy-void-canonical-caller-request-v1.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact writer and immutable replay source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = f591f7407d9afc2cf77e0f90923aa11b4817fd4e
          test "$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)" = 970e686cd96b43d496c44acb4ff343a5e61e26c5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Locked dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck actual handoff regression
        run: ./node_modules/.bin/tsc --noEmit --esModuleInterop --module NodeNext --moduleResolution NodeNext --target ES2022 --skipLibCheck --types node scripts/prove_buy_void_canonical_caller_request_v1.ts
      - name: Build actual source handoff
        run: npm run build
      - name: Prove immutable original request through fsync and allocation
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/prove_buy_void_canonical_caller_request_v1.ts | tee canonical-request-${{ matrix.node }}.txt
          for assertion in \
            normal_handoff_preserved=true \
            postfsync_caller_wallet_quote_launch_mutation_cannot_poison_allocation=true \
            launch_callback_caller_mutation_cannot_poison_allocation=true \
            unstable_request_toJSON_read_exactly_once=true \
            wrong_first_original_buyer_held_before_fsync=true \
            durable_payment_allocation_original_buyer_bound=true \
            strict_replay_and_exact_recovery_preserved=true \
            real_customer_records_used=false \
            source_writer_not_mounted=true \
            production_payment_authority=false \
            funds_moved=false
          do
            grep -Fx "$assertion" canonical-request-${{ matrix.node }}.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-canonical-request-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: canonical-request-${{ matrix.node }}.txt
          retention-days: 1
          if-no-files-found: error
      - name: Source diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            git diff --check "$BASE" "$HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
  cross-node:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-canonical-request-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require exact receipt equality on Node 22 24 26
        run: |
          set -euo pipefail
          for n in 22 24 26; do test -s "receipts/canonical-request-$n.txt"; done
          cmp receipts/canonical-request-22.txt receipts/canonical-request-24.txt
          cmp receipts/canonical-request-22.txt receipts/canonical-request-26.txt
          echo "VOID_BUY_VOID_CANONICAL_CALLER_REQUEST_THREE_NODE_GREEN"
          echo "production_payment_authority=false"
          echo "funds_moved=false"
