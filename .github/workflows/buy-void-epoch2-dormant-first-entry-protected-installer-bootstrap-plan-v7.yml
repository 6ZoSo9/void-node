name: Buy VOID Epoch-2 repaired protected-installer bootstrap plan v7

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py"
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py"
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired planner generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT_NAME" in
            pull_request) base="190fae8c410d7fe3ae4af5551ea78a5523bcd7fb" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="190fae8c410d7fe3ae4af5551ea78a5523bcd7fb" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$base"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py)" = \
            9ea4a7d34a66f81ed568adaed693755ebca37b66
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py)" = \
            66263ef1beb35d5611683f456f95cafd5e0007ec
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v7.md)" = \
            313953d03653a44885a43cc4d9a5ddcdd5665abb

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py)" = \
            d9650aff7af2cb9fc9a8d95a888d8dd52aef1970
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py)" = \
            7c3ad1188fca114188a8f9876c7a1b7390280b56
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py)" = \
            2c2c988891bfacf3d8cf937551a2971ca8a6e5fb
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json)" = \
            227c2fa449abf1387925373c706ecd07775d5898
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py)" = \
            609cde180490f4f5f53ed7e34d73b95f22313bcd
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json)" = \
            5aa397be684dd1c87ca84fcb4d70ab3ebc176eb1
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py)" = \
            557eb68453d517d78bb3b6c6d8427df9ed36316f

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_REPAIRED_BOOTSTRAP_PLAN_V7_SYNTAX_GREEN")
          PY

      - name: Prove repaired planner V7
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
          out="$RUNNER_TEMP/repaired-bootstrap-plan-v7-proof.log"
          python3 -I -B "$proof" | tee "$out"
          markers=(
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALLER_BOOTSTRAP_PLAN_V7_PROOF_GREEN'
            'target_blob_bound=true'
            'workflow_pull_request_exact_parent_bound=true'
            'workflow_dispatch_exact_parent_bound=true'
            'workflow_dispatch_first_parent_inference_absent=true'
            'predecessor_v6_plan_bound=true'
            'predecessor_v6_proof_bound=true'
            'inherited_hardened_functions_unchanged=true'
            'repaired_qualifier_blob_bound=true'
            'repaired_qualifier_contract_loaded=true'
            'qualification_nonroot_execution_required=true'
            'qualification_protected_state_read_only_required=true'
            'qualification_temporary_git_metadata_write_required=true'
            'qualification_temporary_git_metadata_cleanup_required=true'
            'qualification_git_callbacks_neutralized_required=true'
            'qualification_bootstrap_self_test_absent=true'
            'complete_plan_body_content_addressed=true'
            'structured_bootstrap_argv_only=true'
            'bootstrap_execution_performed=false'
            'protected_installer_apply_performed=false'
            'planner_filesystem_write=false'
            'planner_protected_filesystem_mutation=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

      - name: Verify V7 source-only plan
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
          out="$RUNNER_TEMP/repaired-bootstrap-plan-v7-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$out"
          markers=(
            'mode=source-plan'
            'source_only=true'
            'host_read=false'
            'host_write=false'
            'qualifier_git_blob_sha1=d9650aff7af2cb9fc9a8d95a888d8dd52aef1970'
            'installed_qualification_performed=false'
            'qualification_nonroot_execution_required=true'
            'qualification_protected_state_read_only_required=true'
            'qualification_temporary_git_metadata_write_required=true'
            'qualification_git_callbacks_neutralized_required=true'
            'qualification_descriptor_bound_source_execution_required=true'
            'bootstrap_execution_performed=false'
            'protected_installer_apply_performed=false'
            'filesystem_write=false'
            'service_mutation=false'
            'credential_access=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
