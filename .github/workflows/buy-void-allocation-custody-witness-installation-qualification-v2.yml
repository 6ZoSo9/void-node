name: VOID Buy VOID witness installation qualification v2

on:
  pull_request:
    paths:
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-qualification-v2.md"
      - ".github/workflows/buy-void-allocation-custody-witness-installation-qualification-v2.yml"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts \
            scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts

      - name: Prove V2 installation qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts

      - name: Preserve V1 installation qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v1.ts

      - name: Preserve transport policy
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_transport_v1.ts

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
