name: Buy VOID Epoch-2 dormant binder native candidate lock v1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs"
      - "scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs"
  push:
    branches: [main]
    paths:
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs"
      - "scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact accepted dormant binder candidate generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          candidate_head=1b9346f8e91f49019ce16585810054c10da078ca
          lock_base=0fa249522c955aff03d3eaa24b768381a32d987b
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then
            base="$lock_base"
          fi

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$candidate_head^{commit}")" = "$candidate_head"
          test "$(git rev-parse "$lock_base^{commit}")" = "$lock_base"
          git merge-base --is-ancestor "$candidate_head" "$lock_base"
          git merge-base --is-ancestor "$lock_base" "$EXPECTED_HEAD"
          test "$base" = "$lock_base"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.md' \
            'ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.json' \
            'scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_lock_v1.py' \
            | sort > "$expected"
          git diff --name-only "$lock_base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.json)" = \
            c500880206250ae079261277494c99835366c747
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_lock_v1.py)" = \
            711b576731798bfd0849eefe82f3d232b31aa12c
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.md)" = \
            c4554a91f1f65afc36a8bf2099beea26ea0d55c0

          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_v1.py)" = \
            5ac4264d7f9bdb394cf5be4490aa1eadd1f929ee
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-binder-native-candidate-v1.yml)" = \
            1292e9ceb82fe533339718765c6bf0982bb278bc
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-binder-native-candidate-v1.md)" = \
            f5292b266fb5b8aac89dfc51101ecb0a0498dddc
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v2.c)" = \
            4fdf3f627f407335b9d50800fbbc913d1edae523
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs)" = \
            9c29eb4716077e459b9154f39d0f30cf2e56729f
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs)" = \
            4671d37fcdb43c2bee9d3de16402df0cd25257bb

          git diff --check "$lock_base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Rederive and verify accepted candidate lock
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lock-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_binder_native_candidate_lock_v1.py |
            tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_NATIVE_CANDIDATE_LOCK_V1_GREEN' \
            'lock_id=voidbuye2dormantbinderlock1_9f0002c70442e25553ea7d9dfd3203a806b9fd0e973392f25ad6a5e607995b61' \
            'candidate_id=voidbuye2dormantbindercand1_3e577d797e1cac83f29baf35efef84620db2506722764b07598cb4f2524d4aad' \
            'candidate_report_sha256=897b9700f36f13d1cdee3c5b6f128a54d0505ddfc852fdcca96e5054ea5d1829' \
            'candidate_report_git_blob_sha1=443cd004e215159b5b508ec09b29c1c586b6aa14' \
            'native_binary_sha256=ca078f3a81191847d5b0b75de99e4d8f7e389fd051afdb76338f28e157ae5a7c' \
            'native_binary_bytes=726976' \
            'binder_sha256=afa31537a93faee0936e7a4bd384598dd150687da7c24276327f0a16f56d1a5e' \
            'hosted_three_report_identity_bound=true' \
            'hosted_three_binary_identity_bound=true' \
            'independent_report_rederivation_bound=true' \
            'independent_elf_rederivation_bound=true' \
            'failure_truth_boundary_test_modes_bound=true' \
            'candidate_accepted=true' \
            'native_binary_identity_accepted=true' \
            'binder_source_identity_accepted=true' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'private_key_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'wc_void_market_activation_authorized=false' \
            'treasury_liquidity_action_authorized=false' \
            'funds_movement_authorized=false' \
            'production_host_evidence_authority=false' \
            'next_gate=void_buy_void_epoch2_dormant_binder_native_candidate_materializer_v1'
          do
            grep -Fx "$marker" "$out"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-dormant-binder-native-lock-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v1.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check
