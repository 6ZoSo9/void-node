name: VOID public P2P activation readiness v1

on:
  pull_request:
    paths:
      - "tools/void-public-p2p-activation-readiness-v1.mjs"
      - "scripts/prove_void_public_p2p_activation_readiness_v1.mjs"
      - "docs/operations/void-public-p2p-activation-readiness-v1.md"
      - ".github/workflows/void-public-p2p-activation-readiness-v1.yml"
      - "config/**/*.json"
      - "public/**/*.json"
      - "src/index.ts"
      - "src/p2p/udp_swarm_public_relay_introduction_collector_v1.ts"
      - "src/p2p/udp_swarm_public_relay_introduction_entrypoint_v1.ts"
      - "src/p2p/udp_swarm_node_runtime_mount_v1.ts"
      - "scripts/prove_void_public_p2p_entrypoint_collector_wiring_v1.ts"
      - "ops/run-void-node-live-v1.sh"
      - ".env.example"
      - "scripts/lib/void_bootstrap_record_release_root_v1.mjs"
      - "scripts/lib/void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"
      - "scripts/lib/void_p2p_udp_swarm_verified_discovery_composition_v1.mjs"
      - "scripts/lib/void_public_bootstrap_release_locator_composition_v1.mjs"
      - "scripts/lib/void_public_bootstrap_record_v2_locator_resolver_v1.mjs"
      - "scripts/lib/void_public_bootstrap_record_v2_mirror_contract_v1.mjs"
  push:
    branches:
      - main
    paths:
      - "tools/void-public-p2p-activation-readiness-v1.mjs"
      - "scripts/prove_void_public_p2p_activation_readiness_v1.mjs"
      - "docs/operations/void-public-p2p-activation-readiness-v1.md"
      - ".github/workflows/void-public-p2p-activation-readiness-v1.yml"
      - "config/**/*.json"
      - "public/**/*.json"
      - "src/index.ts"
      - "src/p2p/udp_swarm_public_relay_introduction_collector_v1.ts"
      - "src/p2p/udp_swarm_public_relay_introduction_entrypoint_v1.ts"
      - "src/p2p/udp_swarm_node_runtime_mount_v1.ts"
      - "scripts/prove_void_public_p2p_entrypoint_collector_wiring_v1.ts"
      - "ops/run-void-node-live-v1.sh"
      - ".env.example"
      - "scripts/lib/void_bootstrap_record_release_root_v1.mjs"
      - "scripts/lib/void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"
      - "scripts/lib/void_p2p_udp_swarm_verified_discovery_composition_v1.mjs"
      - "scripts/lib/void_public_bootstrap_release_locator_composition_v1.mjs"
      - "scripts/lib/void_public_bootstrap_record_v2_locator_resolver_v1.mjs"
      - "scripts/lib/void_public_bootstrap_record_v2_mirror_contract_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Syntax
        run: |
          node --check tools/void-public-p2p-activation-readiness-v1.mjs
          node --check scripts/prove_void_public_p2p_activation_readiness_v1.mjs
      - name: Focused proof
        run: |
          node --import tsx scripts/prove_void_public_p2p_entrypoint_collector_wiring_v1.ts
          node scripts/prove_void_public_p2p_activation_readiness_v1.mjs
      - name: Current production source is ready while deployment remains unauthorized
        run: |
          node tools/void-public-p2p-activation-readiness-v1.mjs \
            --output "$RUNNER_TEMP/readiness.json"
          node - "$RUNNER_TEMP/readiness.json" <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (receipt.decision !== "ACTIVATION_SOURCE_READY") process.exit(1);
          if (receipt.ready !== true) process.exit(1);
          if (receipt.blockers.length !== 0) process.exit(1);
          if (receipt.snapshot.release_root_status !== "active") process.exit(1);
          if (receipt.snapshot.release_root_threshold !== 1) process.exit(1);
          if (receipt.snapshot.release_root_key_count !== 1) process.exit(1);
          if (receipt.snapshot.signed_bootstrap_record_id_valid_count !== 1) process.exit(1);
          if (receipt.snapshot.signed_observer_authorization_valid_count !== 1) process.exit(1);
          if (![0, 1].includes(receipt.snapshot.signed_observer_authorization_current_valid_count)) process.exit(1);
          if (receipt.snapshot.relay_introduction_artifact_valid_count !== 0) process.exit(1);
          if (receipt.live_observer_authorization_required_after_deployment !== true) process.exit(1);
          if (receipt.observer_authorization_currentness_source_gate !== false) process.exit(1);
          if (receipt.live_relay_introduction_required_after_deployment !== true) process.exit(1);
          if (receipt.relay_introduction_artifact_source_gate !== false) process.exit(1);
          if (receipt.production_activation_authorized !== false) process.exit(1);
          if (receipt.external_acceptance_required_after_deployment !== true) process.exit(1);
          if (receipt.network_calls_performed !== false) process.exit(1);
          NODE
