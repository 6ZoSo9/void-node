name: VOID Buy VOID original buyer crash replay V2 successor

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v2.mjs"
      - "docs/architecture/buy-void-payment-allocation-first-original-crash-v2.md"
      - ".github/workflows/buy-void-payment-allocation-first-original-crash-v2.yml"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v1.mjs"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_v1.ts"
      - "scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-original-buyer-crash-v2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Exact immutable checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout SHA and clean working tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and compile current original-wallet binding
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Preserve original buyer replay classifier first-row falsifications
        run: node scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs
      - name: Prove actual filesystem payment fsync allocation crash recovery
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_verified_payment_allocation_handoff_v1.ts
      - name: Verify frozen V1 historical identity STILL rejects new source generation
        run: |
          set -euo pipefail
          if node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v1.mjs \
               > "$RUNNER_TEMP/frozen-v1.stdout" 2> "$RUNNER_TEMP/frozen-v1.stderr"; then
            echo "UNEXPECTED_HISTORICAL_CRASH_V1_IDENTITY_ACCEPTED" >&2
            exit 1
          fi
          grep -F "reviewed_source_blob_drift:src/economic/buy_void_verified_allocation_replay_binding_v1.ts" \
            "$RUNNER_TEMP/frozen-v1.stderr"
          echo "FROZEN_HISTORICAL_CRASH_V1_REJECTS_SOURCE_DRIFT_GREEN"
      - name: Prove V2 initial-buyer-wallet crash matrix is fail closed
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v2.mjs \
            > "buyer-crash-v2-${{ matrix.node }}.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            assert.equal(j.marker,"VOID_BUY_VOID_PAYMENT_ALLOCATION_HYPOTHETICAL_CRASH_MATRIX_V2");
            assert.equal(j.reviewed_current_replay_source_blob_sha1,
              "0a74a3652081c3e142d0b887676771a7ac148f32");
            assert.equal(j.frozen_predecessor_crash_proof_git_blob_sha1,
              "1a8db260a134ad438366d5b7660f926768c98a79");
            assert.equal(j.source_runtime_generation_commit,
              "7da490d56556ab98b5515f5eba53bf6a8f118203");
            assert.equal(j.frozen_historical_V1_proof_unchanged,true);
            assert.equal(j.initial_buyer_wallet_missing_variants_rejected,3);
            assert.equal(j.late_buyer_wallet_backfill_verified_allocation_rejected,true);
            assert.equal(j.changed_original_buyer_wallet_rejected,true);
            assert.equal(j.late_tx_and_receive_with_original_wallet_positive,true);
            assert.equal(j.exact_replay_idempotent,true);
            assert.deepEqual(j.observed_publication_phases,
              ["intent_only","ledger_committed","complete"]);
            for(const key of ["proposed_allocation_mutated",
              "actual_durable_payment_fsync_verified",
              "verified_capacity_and_request_locks_held",
              "independently_proven_original_request",
              "protected_high_water_custody_verified",
              "allocation_publication_integrated",
              "exactly_once_allocation_production_ready",
              "signer_or_wallet_access",
              "production_source_finality_authority_ready",
              "presale_activation","funds_moved"])assert.equal(j[key],false,key);
            console.log("VOID_BUY_VOID_FIRST_ORIGINAL_BUYER_CRASH_V2_GREEN");
            console.log("production_activation=false");
          ' "buyer-crash-v2-${{ matrix.node }}.json"
      - name: Upload exact-node evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-original-wallet-crash-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: buyer-crash-v2-${{ matrix.node }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Committed diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all independent source-only crash reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-original-wallet-crash-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./buyer-crash
      - name: Require exact Node 22 24 26 byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "buyer-crash/buyer-crash-v2-$v.json"; done
          cmp buyer-crash/buyer-crash-v2-22.json buyer-crash/buyer-crash-v2-24.json
          cmp buyer-crash/buyer-crash-v2-22.json buyer-crash/buyer-crash-v2-26.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            import crypto from "node:crypto";
            const raw=fs.readFileSync("buyer-crash/buyer-crash-v2-22.json");
            const j=JSON.parse(raw);
            assert.equal(j.late_buyer_wallet_backfill_verified_allocation_rejected,true);
            assert.equal(j.exactly_once_allocation_production_ready,false);
            console.log("VOID_BUY_VOID_FIRST_ORIGINAL_BUYER_CRASH_V2_CROSS_NODE_GREEN");
            console.log("raw_report_sha256="+crypto.createHash("sha256").update(raw).digest("hex"));
            console.log("real_payment_or_allocation_performed=false");
          '
