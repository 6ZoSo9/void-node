name: Buy VOID fulfillment deployment preparation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-deployment-preparation-v1.yml"
      - "src/economic/buy_void_presale_fulfillment_deployment_preparation_v1.ts"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "scripts/prove_buy_void_presale_fulfillment_deployment_preparation_v1.ts"
      - "docs/operators/buy-void-presale-fulfillment-deployment-preparation-v1.md"
      - "src/economic/buy_void_erc20_production_configuration_candidate_binding_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "ops/mainnet0/buy-void-presale-fulfillment-compiled-identity-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-deployment-preparation-v1.yml"
      - "src/economic/buy_void_presale_fulfillment_deployment_preparation_v1.ts"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "scripts/prove_buy_void_presale_fulfillment_deployment_preparation_v1.ts"
      - "docs/operators/buy-void-presale-fulfillment-deployment-preparation-v1.md"
      - "src/economic/buy_void_erc20_production_configuration_candidate_binding_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "ops/mainnet0/buy-void-presale-fulfillment-compiled-identity-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Typecheck and prove deployment preparation
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          node --import tsx scripts/prove_buy_void_presale_fulfillment_deployment_preparation_v1.ts
          node scripts/prove_buy_void_presale_fulfillment_compiled_identity_acceptance_v1.mjs
          git diff --check
