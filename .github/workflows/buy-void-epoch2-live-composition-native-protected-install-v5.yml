name: Buy VOID Epoch-2 native protected upgrade v5

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v5.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v5.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v5.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v6r2.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V6R2 upgrade generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          repair_base=65b4515b78e467afb399b510037e8c64256e87a5
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$repair_base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-protected-install-v5.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-protected-install-v5.md' \
            'ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py' \
            'scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v5.py' \
            | sort > "$expected"
          git diff --name-only "$repair_base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py)" = \
            fd7a06490ccf6fb14831d8b0372a892e2764c9dc
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v5.py)" = \
            938ae777b1a441a77314778eb4ea750596615b8c
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-protected-install-v5.md)" = \
            16e86a2ed5f9f68450149238faf40d86c85721fd
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v6r2.json)" = \
            bc3cb6d7843447ed1f0f769c2d298bb76dac8b1b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = \
            5021727f1def1ec11f870d735cab65acc1701a5e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" = \
            499df9b94b5b89354837570da0c7e47ec280025d
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" = \
            14cbe81e27d04fee77cbe75225ce308bf8561a7b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py)" = \
            74c69fe8a95ed5f361a39971618f43f7c768c865

          git diff --check "$repair_base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py",
              "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v5.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_NATIVE_PROTECTED_INSTALL_V5_SYNTAX_GREEN")
          PY

      - name: Prove atomic protected upgrade source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-native-upgrade-v5-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v5.py |
            tee "$out"

          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V5_PROOF_GREEN"
            "accepted_v6r2_lock_bound=true"
            "accepted_native_binary_rederived=true"
            "repaired_runner_bytes_bound=true"
            "repaired_v3r_qualifier_bound=true"
            "predecessor_generation_exact=true"
            "ready_green_state_machine_exercised=true"
            "atomic_root_exchange_primitive_exercised=true"
            "predecessor_retention_required=true"
            "automatic_rollback_required=true"
            "production_apply_state_machine_synthetic_exercised=true"
            "post_first_exchange_rollback_exercised=true"
            "post_predecessor_retention_rollback_exercised=true"
            "green_rollback_publication_receipt_truthful=true"
            "post_exchange_oserror_receipt_truthful=true"
            "post_rollback_plan_binding_revalidation=true"
            "node_drift_after_rollback_final_state_unverified=true"
            "checkout_drift_after_rollback_final_state_unverified=true"
            "rollback_cleanup_ambiguity_exercised=true"
            "rollback_cleanup_publication_receipt_truthful=true"
            "rollback_failure_receipt_exercised=true"
            "post_exchange_fsync_failure_exercised=true"
            "success_close_receipt_truthful=true"
            "runtime_user_git_checkout_binding=true"
            "expected_plan_id_apply_binding=true"
            "checkout_tool_generation_bracketed=true"
            "pre_mutation_authority_boundary=true"
            "pre_mutation_authority_flush_required=true"
            "post_upgrade_close_receipt_truthful=true"
            "wrong_confirmation_pre_mutation_hold_exercised=true"
            "candidate_files_unopened_before_confirmation=true"
            "protected_root_unopened_before_confirmation=true"
            "protected_install_authorized=false"
            "live_execution_authorized=false"
            "credential_access_authorized=false"
            "signing_authorized=false"
            "transaction_authorized=false"
            "payment_acceptance_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "treasury_liquidity_action_authorized=false"
            "funds_movement_authorized=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-native-upgrade-v5-source-plan.log"
          python3 -I -B \
            ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py \
            --source-plan | tee "$out"

          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V5"
            "mode=source-plan"
            "source_only=true"
            "host_read=false"
            "host_write=false"
            "accepted_lock_id=voidbuye2nativecandlock6r2_ab95f15c8f2731adf6bfd97dfd5467495c90bdb5ee267948efc6a522be74b417"
            "candidate_id=voidbuye2nativecand6r2_5d643422fb1c53686edd9386d6a65f000d9f399538bf94cca98b232fdfb15e8d"
            "target_root=/opt/void-buy-void-epoch2-live-composition-v3"
            "staging_root=/opt/.void-buy-void-epoch2-live-composition-v3.upgrade-v6r2.stage"
            "predecessor_root=/opt/.void-buy-void-epoch2-live-composition-v3.predecessor-v4"
            "create_only=false"
            "atomic_root_exchange_required=true"
            "predecessor_retention_required=true"
            "automatic_rollback_required=true"
            "node_generation_bound_at_plan_apply=true"
            "expected_main_head_bound_at_plan_apply=true"
            "checkout_tool_generation_bracket_required=true"
            "protected_install_authorized=false"
            "live_execution_authorized=false"
            "credential_access_authorized=false"
            "private_key_access_authorized=false"
            "signing_authorized=false"
            "transaction_authorized=false"
            "payment_acceptance_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "treasury_liquidity_action_authorized=false"
            "funds_movement_authorized=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
