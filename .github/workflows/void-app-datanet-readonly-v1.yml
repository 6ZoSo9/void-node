name: VOID App DataNet read-only v1

on:
  pull_request:
    paths:
      - "public/void-app-wave1-v1/assets/js/app.js"
      - "public/void-app-wave1-v1/assets/js/data-live.js"
      - "public/void-app-wave1-v1/assets/js/data-request-owner.js"
      - "public/public-node/datanet/field-replication-status-card-v1.json"
      - "public/public-node/datanet/field-replication-status-card-v1.html"
      - "public/public-node/datanet/index.json"
      - "src/ui/void_app_wave1_foundation_v1.ts"
      - "src/ui/void_app_datanet_readonly_adapter_v1.ts"
      - "scripts/prove_void_app_datanet_readonly_v1.mjs"
      - "scripts/prove_void_app_datanet_local_origin_v1.mjs"
      - "scripts/prove_void_app_datanet_request_owner_v1.mjs"
      - "scripts/prove_void_app_datanet_response_lifetime_v1.mjs"
      - "scripts/prove_void_app_datanet_cancel_rejection_terminal_v1.mjs"
      - ".github/workflows/void-app-datanet-readonly-v1.yml"
  push:
    branches: [main]
    paths:
      - "public/void-app-wave1-v1/assets/js/app.js"
      - "public/void-app-wave1-v1/assets/js/data-live.js"
      - "public/void-app-wave1-v1/assets/js/data-request-owner.js"
      - "public/public-node/datanet/field-replication-status-card-v1.json"
      - "public/public-node/datanet/field-replication-status-card-v1.html"
      - "public/public-node/datanet/index.json"
      - "src/ui/void_app_wave1_foundation_v1.ts"
      - "src/ui/void_app_datanet_readonly_adapter_v1.ts"
      - "scripts/prove_void_app_datanet_readonly_v1.mjs"
      - "scripts/prove_void_app_datanet_local_origin_v1.mjs"
      - "scripts/prove_void_app_datanet_request_owner_v1.mjs"
      - "scripts/prove_void_app_datanet_response_lifetime_v1.mjs"
      - "scripts/prove_void_app_datanet_cancel_rejection_terminal_v1.mjs"
      - ".github/workflows/void-app-datanet-readonly-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check public/void-app-wave1-v1/assets/js/app.js
          node --check public/void-app-wave1-v1/assets/js/data-live.js
          node --check public/void-app-wave1-v1/assets/js/data-request-owner.js
          node --check scripts/prove_void_app_datanet_readonly_v1.mjs
          node --check scripts/prove_void_app_datanet_local_origin_v1.mjs
          node --check scripts/prove_void_app_datanet_request_owner_v1.mjs
          node --check scripts/prove_void_app_datanet_response_lifetime_v1.mjs
          node --check scripts/prove_void_app_datanet_cancel_rejection_terminal_v1.mjs
      - name: Build compiled runtime adapter
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/ui/void_app_datanet_readonly_adapter_v1.js
      - name: Prove read-only DataNet view
        run: node scripts/prove_void_app_datanet_readonly_v1.mjs
      - name: Prove local App origin integration
        run: node scripts/prove_void_app_datanet_local_origin_v1.mjs
      - name: Prove bounded DataNet request ownership
        run: node scripts/prove_void_app_datanet_request_owner_v1.mjs
      - name: Prove DataNet response lifetime ownership
        run: node scripts/prove_void_app_datanet_response_lifetime_v1.mjs
      - name: Prove failed cancellation retains terminal ownership
        run: node scripts/prove_void_app_datanet_cancel_rejection_terminal_v1.mjs
