name: VOID App DataNet read-only v1

on:
  pull_request:
    paths:
      - "public/void-app-wave1-v1/assets/js/app.js"
      - "public/void-app-wave1-v1/assets/js/data-live.js"
      - "public/public-node/datanet/field-replication-status-card-v1.json"
      - "scripts/prove_void_app_datanet_readonly_v1.mjs"
      - ".github/workflows/void-app-datanet-readonly-v1.yml"
  push:
    branches: [main]
    paths:
      - "public/void-app-wave1-v1/assets/js/app.js"
      - "public/void-app-wave1-v1/assets/js/data-live.js"
      - "public/public-node/datanet/field-replication-status-card-v1.json"
      - "scripts/prove_void_app_datanet_readonly_v1.mjs"
      - ".github/workflows/void-app-datanet-readonly-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check public/void-app-wave1-v1/assets/js/app.js
          node --check public/void-app-wave1-v1/assets/js/data-live.js
          node --check scripts/prove_void_app_datanet_readonly_v1.mjs
      - name: Prove read-only DataNet view
        run: node scripts/prove_void_app_datanet_readonly_v1.mjs
