name: VOID Constitutional Sovereign Succession Alignment V1

on:
  pull_request:
    paths:
      - "docs/governance/void-constitutional-authority-boundary-v1.md"
      - "fixtures/governance/void-constitutional-authority-boundary-v1.json"
      - "ops/mainnet0/void-constitutional-authority-boundary-v1-proof.sh"
      - ".github/workflows/void-constitutional-sovereign-succession-alignment-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/governance/void-constitutional-authority-boundary-v1.md"
      - "fixtures/governance/void-constitutional-authority-boundary-v1.json"
      - "ops/mainnet0/void-constitutional-authority-boundary-v1-proof.sh"
      - ".github/workflows/void-constitutional-sovereign-succession-alignment-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-constitutional-sovereign-succession-alignment-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove constitutional sovereign succession alignment
        run: bash ops/mainnet0/void-constitutional-authority-boundary-v1-proof.sh
      - name: Diff hygiene
        run: git diff --check
