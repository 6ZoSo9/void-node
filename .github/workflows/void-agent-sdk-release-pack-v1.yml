name: VOID Agent SDK release pack v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-agent-sdk-release-pack-v1.yml"
      - "integrations/agents/void-agent-sdk-v1/**"
      - "scripts/prove_void_agent_sdk_release_pack_v1.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-agent-sdk-release-pack-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: |
          node --check integrations/agents/void-agent-sdk-v1/index.mjs
          node --check integrations/agents/void-agent-sdk-v1/cli.mjs
          node --check scripts/prove_void_agent_sdk_release_pack_v1.mjs
      - name: Prove SDK and release integrity
        run: node scripts/prove_void_agent_sdk_release_pack_v1.mjs
      - name: Inspect npm package contents
        working-directory: integrations/agents/void-agent-sdk-v1
        run: npm pack --dry-run --ignore-scripts
