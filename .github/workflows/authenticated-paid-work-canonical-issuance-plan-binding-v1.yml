name: Authenticated paid-work canonical issuance plan binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-canonical-issuance-plan-binding-v1.yml"
      - "docs/operations/authenticated-paid-work-canonical-issuance-plan-binding-v1.md"
      - "fixtures/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1.example.json"
      - "integrations/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1/**"
      - "schemas/authenticated-paid-work-canonical-issuance-plan-binding-v1.schema.json"
      - "scripts/prove_authenticated_paid_work_canonical_issuance_plan_binding_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-paid-work-canonical-issuance-plan-binding-v1.yml"
      - "docs/operations/authenticated-paid-work-canonical-issuance-plan-binding-v1.md"
      - "fixtures/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1.example.json"
      - "integrations/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1/**"
      - "schemas/authenticated-paid-work-canonical-issuance-plan-binding-v1.schema.json"
      - "scripts/prove_authenticated_paid_work_canonical_issuance_plan_binding_v1.mjs"

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-canonical-issuance-plan-binding-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check integrations/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1/index.mjs
          node --check scripts/prove_authenticated_paid_work_canonical_issuance_plan_binding_v1.mjs
      - name: Parse closed JSON artifacts
        run: |
          python3 -m json.tool integrations/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1/package.json >/dev/null
          python3 -m json.tool fixtures/agents/authenticated-paid-work-canonical-issuance-plan-binding-v1.example.json >/dev/null
          python3 -m json.tool schemas/authenticated-paid-work-canonical-issuance-plan-binding-v1.schema.json >/dev/null
      - name: Prove canonical issuance plan binding and request adapter
        run: ./node_modules/.bin/tsx scripts/prove_authenticated_paid_work_canonical_issuance_plan_binding_v1.mjs
      - run: npm run typecheck
