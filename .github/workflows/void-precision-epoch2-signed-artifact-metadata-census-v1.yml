name: VOID Precision epoch2 signed artifact metadata census v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-precision-epoch2-signed-artifact-metadata-census-v1.yml"
      - "ops/precision/void_precision_epoch2_signed_artifact_metadata_census_v1.sh"
      - "scripts/prove_void_precision_epoch2_signed_artifact_metadata_census_v1.mjs"
      - "docs/operators/economic-epoch2-signed-artifact-metadata-census-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: bash -n ops/precision/void_precision_epoch2_signed_artifact_metadata_census_v1.sh
      - run: node scripts/prove_void_precision_epoch2_signed_artifact_metadata_census_v1.mjs
      - run: git diff --check
