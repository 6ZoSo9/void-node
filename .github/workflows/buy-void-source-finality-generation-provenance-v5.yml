name: VOID Buy VOID historical reviewed source files v5 preservation

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_generation_provenance_v5.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v5.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts"
      - "src/economic/buy_void_source_finality_authenticated_composition_v3.ts"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v5.md"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v5-review-checklist.md"
      - ".github/workflows/buy-void-source-finality-generation-provenance-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and immutable historical V5 source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object src/economic/buy_void_source_finality_generation_provenance_v5.ts)" =             "0804a50b87c089e2d03bbca716641d7211e6a8bc"
          grep -F 'git_blob_sha1: "c0e4660bb238e1b718b8a471890901bd5a59badf"'             src/economic/buy_void_source_finality_generation_provenance_v5.ts

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck immutable V5 and deadline proof
        run: |
          ./node_modules/.bin/tsc             --noEmit             --target ES2022             --module NodeNext             --moduleResolution NodeNext             --lib ES2022             --types node             --esModuleInterop             --allowSyntheticDefaultImports             --downlevelIteration             --skipLibCheck             src/economic/buy_void_source_finality_generation_provenance_v5.ts             scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts

      - name: Preserve immutable V5 total-deadline proof bytes
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_source_finality_generation_provenance_v5.ts)" = \
            "aaf136c7be2ead7a134a4748ec6f7d62de9a1c8d"
          test "$(git hash-object scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts)" = \
            "f620b0b0f09cf51ffeb73346fd0fdb3c5e088b05"
          grep -F 'source_finality_total_deadline_exceeded' \
            scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts
          echo "historical_v5_deadline_proof_bytes_preserved=true"
          echo "historical_v5_deadline_proof_not_executed_against_v6_dependencies=true"

      - name: Preserve authenticated composition and static policy
        run: |
          ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3.ts
          ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3_truncated_response.ts
          ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authority_v2.ts
          ./node_modules/.bin/tsx scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts

      - name: Build current repository artifacts
        run: npm run build

      - name: Require historical V5 to reject current V2 source generation
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          const v5 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v5.js");
          const result = v5.verifyBuyVoidSourceFinalityRuntimeSourceFilesV5();
          assert.equal(result.ok, false);
          assert.equal(result.reviewed_source_files_verified, false);
          assert.equal(result.reason, "source_files_git_blob_mismatch");
          assert.equal(v5.VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_AUTHORITY_V5.production_source_finality_authority_ready, false);
          console.log("VOID_BUY_VOID_HISTORICAL_V5_CURRENT_SOURCE_MISMATCH_PRESERVED");
          NODE

      - name: Require current V6 source successor to remain production HOLD
        run: |
          ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v6.ts
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          const v6 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v6.js");
          assert.equal(v6.VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_AUTHORITY_V6.production_source_finality_authority_ready, false);
          assert.equal(v6.VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_AUTHORITY_V6.deployed_artifact_generation_verified, false);
          console.log("VOID_BUY_VOID_V6_SUCCESSOR_PRODUCTION_HOLD_PRESERVED");
          NODE

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
