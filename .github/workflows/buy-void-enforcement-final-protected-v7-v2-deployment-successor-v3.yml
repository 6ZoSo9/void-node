name: VOID Buy VOID protected V7 V2 candidate V3 successor
on:
  pull_request:
    paths:
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.yml"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "src/index.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {node: [22, 24, 26]}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: ${{ github.event.pull_request.head.sha || github.sha }}, fetch-depth: 0, persist-credentials: false}
      - name: Bind exact generation
        env: {EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}, SOURCE_BASE: 8b0823d55ebebadca172497ef754413591c5f54b}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$SOURCE_BASE" "$EXPECTED_HEAD"
          printf '%s\n' 'ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json' 'scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs' 'docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md' '.github/workflows/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.yml' | sort > "$RUNNER_TEMP/expected"
          git diff --name-only "$SOURCE_BASE" "$EXPECTED_HEAD" -- | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs)" = "0fb6dc5c1bb91cf54a4053e7429d4153e2a46a86"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md)" = "f45ff218f3b097c68424b51806db4e99770069ca"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json)" = "4e23ecbb64eb26c14f5ab15af85eb86d59c3a718"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json)" = "589845615654da8b688764377b34296267ac0063"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs)" = "81a4f189b2c3a1ff988e44ece93ed1ee983898f8"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts)" = "3de6e4bd1f9aa2e9c0a0889cc7c0ab489cb306c0"
          test "$(git rev-parse HEAD:src/index.ts)" = "7df1f21c730b554c414c88c550a4475234485370"
          git diff --check "$SOURCE_BASE" "$EXPECTED_HEAD" --
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: ${{ matrix.node }}}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Derive exact V3 candidate
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --self-test
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --derive > "$RUNNER_TEMP/candidate-v3-${{ matrix.node }}.json"
          cmp "$RUNNER_TEMP/candidate-v3-${{ matrix.node }}.json" ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json
          test "$(sha256sum "$RUNNER_TEMP/candidate-v3-${{ matrix.node }}.json" | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          test "$(git hash-object "$RUNNER_TEMP/candidate-v3-${{ matrix.node }}.json")" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v7-v2-candidate-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/candidate-v3-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v7-v2-candidate-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate
      - run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate/candidate-v3-$node.json"; done
          cmp candidate/candidate-v3-22.json candidate/candidate-v3-24.json
          cmp candidate/candidate-v3-22.json candidate/candidate-v3-26.json
          test "$(sha256sum candidate/candidate-v3-22.json | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          echo VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3_CROSS_NODE_GREEN
