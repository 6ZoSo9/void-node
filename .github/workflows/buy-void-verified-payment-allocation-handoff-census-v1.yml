name: VOID Buy VOID verified payment to allocation handoff census v1

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_census_v1.mjs"
      - ".github/workflows/buy-void-verified-payment-allocation-handoff-census-v1.yml"
      - "docs/architecture/buy-void-verified-payment-allocation-handoff-census-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-payment-allocation-handoff-census-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  historical-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Preserve merged negative-gap evidence bytes
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_census_v1.mjs)" = "370cb4f3b101a8e431f7404cdfaefb4c330bc91e"
          test "$(git hash-object docs/architecture/buy-void-verified-payment-allocation-handoff-census-v1.md)" = "c7f2aefdcef867edf9bacb1ce27f2b7ba8fd2086"
          SNAPSHOT=f7c894eb2ff8f378b2f0a906192cc1a0602e1d24
          git cat-file -e "$SNAPSHOT^{commit}"
          test "$(git rev-parse "$SNAPSHOT:src/economic/buy_void_verified_payment_capacity_admission_v1.ts")" = "617e401c3202e34e8754e988cea66c9caa02f873"
          test "$(git rev-parse "$SNAPSHOT:src/economic/buy_void_allocation_reservation_publication_writer_v1.ts")" = "59b336eb82222bf0f5bcfe37060ec520c54e9b62"
          test "$(git rev-parse "$SNAPSHOT:src/economic/buy_void_verified_allocation_replay_binding_v1.ts")" = "feb1f0e3fea1ff07406cd3b8fcd315c48338596f"
          echo "historical_source_snapshot_commit=$SNAPSHOT"
          grep -F 'exactly_once_allocation_production_ready=false' docs/architecture/buy-void-verified-payment-allocation-handoff-census-v1.md
          echo "historical_negative_gap_generation_preserved=true"
          echo "current_source_gate_moved_to_verified_payment_allocation_handoff_v1=true"
          echo "presale_activation=false"
          echo "funds_moved=false"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
