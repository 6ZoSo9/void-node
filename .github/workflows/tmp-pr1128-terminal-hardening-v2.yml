name: tmp PR1128 terminal operator hardening v2

on:
  push:
    branches:
      - feat/buy-void-production-private-services-foreground-operator-v1-20260808
    paths:
      - ".github/workflows/tmp-pr1128-terminal-hardening-v2.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Verify exact helper ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b816bfa5838e6c8fcfb6624833038dc71d6cf943"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/tmp-pr1128-terminal-hardening-v2.yml"
      - name: Apply terminal hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/economic/buy_void_production_private_services_operator_v1.ts")
          source = source_path.read_text()

          source = source.replace(
              '  unexpected_started_result_cleanup: true,\n  unknown_side_effect_state_is_residual: true,\n',
              '  unexpected_started_result_cleanup: true,\n  held_result_boundary_revalidated: true,\n  dry_run_authority_arguments_rejected_without_apply: true,\n  provider_submission_id_parser_duplicated: false,\n  unknown_side_effect_state_is_residual: true,\n',
              1,
          )
          source = source.replace('const SAFE_PROVIDER_ID = /^[A-Za-z0-9._:@/-]{1,200}$/;\n', '', 1)

          old_cleanup_name = 'async function cleanupUnexpectedStartedResult(raw: Record<string, any>): Promise<{'
          if source.count(old_cleanup_name) != 1:
              raise SystemExit('unexpected cleanup helper source shape')
          source = source.replace(
              old_cleanup_name,
              'async function cleanupUnexpectedActivationResult(raw: Record<string, any>): Promise<{',
              1,
          )

          apply_anchor = '  const apply = input.apply === true;\n  const resolvePolicy =\n'
          dry_guard = '''  const apply = input.apply === true;
          if (
            !apply &&
            (input.confirmation !== undefined ||
              input.expected_plan_id_sha256 !== undefined ||
              input.rpc_readiness_confirmation !== undefined ||
              input.custodian_activation_confirmation !== undefined ||
              input.broadcaster_activation_confirmation !== undefined)
          ) {
            return held({
              applied: false,
              stage: "operator_input",
              reason: "production_private_services_operator_dry_run_authority_input_forbidden",
            });
          }
          const resolvePolicy =
          '''
          if source.count(apply_anchor) != 1:
              raise SystemExit('unexpected apply anchor')
          source = source.replace(apply_anchor, dry_guard, 1)

          old_held_block = '''  if (raw.ok !== true) {
            return held({
              applied: apply,
              stage: "activation",
              reason:
                raw.authority === VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1
                  ? safeReason(raw.reason, "production_private_services_operator_activation_held")
                  : "production_private_services_operator_activation_held_boundary_invalid",
              production_activation_plan_id_sha256:
                typeof raw.plan_id_sha256 === "string" ? raw.plan_id_sha256 : null,
              rpc_probe_performed: flags.rpc_probe,
              service_state_mutation_performed: flags.service_mutation,
              custodian_service_active_after_return: flags.custodian_active,
              broadcaster_service_active_after_return: flags.broadcaster_active,
              credential_read_performed: flags.credential_read,
              signing_performed: flags.signing,
              submit_once_performed: flags.submit_once,
              transaction_broadcast_performed: flags.broadcast,
              money_movement_performed: flags.money,
            });
          }
          '''
          new_held_block = '''  if (raw.ok !== true) {
            const heldBoundaryValid =
              raw.ok === false &&
              raw.status === "held" &&
              raw.applied === apply &&
              raw.marker === VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_V1 &&
              raw.version === 1 &&
              raw.authority ===
                VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1 &&
              (raw.plan_id_sha256 === null ||
                raw.plan_id_sha256 ===
                  policyState.production_activation_plan_id_sha256) &&
              raw.credential_read_performed === false &&
              raw.signing_performed === false &&
              raw.submit_once_performed === false &&
              raw.transaction_broadcast_performed === false &&
              raw.money_movement_performed === false;

            if (!heldBoundaryValid) {
              await cleanupUnexpectedActivationResult(raw);
              return held({
                applied: apply,
                stage: "activation",
                reason: "production_private_services_operator_activation_held_boundary_invalid",
                production_activation_plan_id_sha256:
                  typeof raw.plan_id_sha256 === "string" ? raw.plan_id_sha256 : null,
                rpc_probe_performed: flags.rpc_probe,
                service_state_mutation_performed: flags.service_mutation,
                custodian_service_active_after_return: flags.custodian_active,
                broadcaster_service_active_after_return: flags.broadcaster_active,
                side_effect_state_known: false,
                credential_read_performed: flags.credential_read,
                signing_performed: flags.signing,
                submit_once_performed: flags.submit_once,
                transaction_broadcast_performed: flags.broadcast,
                money_movement_performed: flags.money,
              });
            }

            return held({
              applied: apply,
              stage: "activation",
              reason: safeReason(
                raw.reason,
                "production_private_services_operator_activation_held",
              ),
              production_activation_plan_id_sha256:
                typeof raw.plan_id_sha256 === "string" ? raw.plan_id_sha256 : null,
              rpc_probe_performed: flags.rpc_probe,
              service_state_mutation_performed: flags.service_mutation,
              custodian_service_active_after_return: flags.custodian_active,
              broadcaster_service_active_after_return: flags.broadcaster_active,
              credential_read_performed: false,
              signing_performed: false,
              submit_once_performed: false,
              transaction_broadcast_performed: false,
              money_movement_performed: false,
            });
          }
          '''
          if source.count(old_held_block) != 1:
              raise SystemExit('unexpected held block shape')
          source = source.replace(old_held_block, new_held_block, 1)

          source = source.replace(
              '    typeof raw.provider_submission_id === "string" &&\n    SAFE_PROVIDER_ID.test(raw.provider_submission_id);',
              '    typeof raw.provider_submission_id === "string" &&\n    raw.provider_submission_id.length > 0;',
              1,
          )
          source = source.replace(
              '      ? await cleanupUnexpectedStartedResult(raw)',
              '      ? await cleanupUnexpectedActivationResult(raw)',
              1,
          )
          if 'SAFE_PROVIDER_ID' in source:
              raise SystemExit('duplicate provider id parser remains')
          source_path.write_text(source)

          cli_path = Path("scripts/buy_void_production_private_services_operator_v1.ts")
          cli = cli_path.read_text()
          return_anchor = '''  return {
            apply,
            confirmation,
            expectedPlanId,
            rpcReadinessConfirmation,
            custodianActivationConfirmation,
            broadcasterActivationConfirmation,
          };
          }
          '''
          guarded_return = '''  if (
            !apply &&
            [
              "--confirm",
              "--expected-plan-id-sha256",
              "--rpc-readiness-confirm",
              "--custodian-confirm",
              "--broadcaster-confirm",
            ].some((flag) => seen.has(flag))
          ) {
            throw new Error("--apply is required with activation confirmation options");
          }

          return {
            apply,
            confirmation,
            expectedPlanId,
            rpcReadinessConfirmation,
            custodianActivationConfirmation,
            broadcasterActivationConfirmation,
          };
          }
          '''
          if cli.count(return_anchor) != 1:
              raise SystemExit('unexpected CLI parse return shape')
          cli = cli.replace(return_anchor, guarded_return, 1)

          main_anchor = 'async function main(): Promise<void> {\n'
          if cli.count(main_anchor) != 1:
              raise SystemExit('unexpected CLI main anchor')
          cli = cli.replace(
              main_anchor,
              'let activationInvocationStarted = false;\n\nasync function main(): Promise<void> {\n',
              1,
          )

          old_call = '''    result = await runBuyVoidProductionPrivateServicesOperatorV1({
              apply: args.apply,
              confirmation: args.confirmation,
              expected_plan_id_sha256: args.expectedPlanId,
              rpc_readiness_confirmation: args.rpcReadinessConfirmation,
              custodian_activation_confirmation: args.custodianActivationConfirmation,
              broadcaster_activation_confirmation: args.broadcasterActivationConfirmation,
            });
          '''
          new_call = '''    activationInvocationStarted = true;
            result = await runBuyVoidProductionPrivateServicesOperatorV1(
              args.apply
                ? {
                    apply: true,
                    confirmation: args.confirmation,
                    expected_plan_id_sha256: args.expectedPlanId,
                    rpc_readiness_confirmation: args.rpcReadinessConfirmation,
                    custodian_activation_confirmation: args.custodianActivationConfirmation,
                    broadcaster_activation_confirmation:
                      args.broadcasterActivationConfirmation,
                  }
                : { apply: false },
            );
          '''
          if cli.count(old_call) != 1:
              raise SystemExit('unexpected CLI operator call shape')
          cli = cli.replace(old_call, new_call, 1)

          old_error_fields = '''    residual_service_state: true,
              side_effect_state_known: false,
          '''
          new_error_fields = '''    residual_service_state: activationInvocationStarted,
              side_effect_state_known: !activationInvocationStarted,
          '''
          if cli.count(old_error_fields) != 1:
              raise SystemExit('unexpected CLI error fields')
          cli = cli.replace(old_error_fields, new_error_fields, 1)
          cli_path.write_text(cli)

          proof_path = Path("scripts/prove_buy_void_production_private_services_operator_v1.ts")
          proof = proof_path.read_text()
          proof = proof.replace(
              '    provider_submission_id: "synthetic-readiness-provider-id",',
              '    provider_submission_id: "rpc@127.0.0.1:8545/request-1",',
              1,
          )

          dry_test_anchor = '''assert.equal((invalidInput.decision as any).stage, "operator_input");
          assert.equal(activationCalls, 0);
          
          const policyHeld = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          dry_test = '''assert.equal((invalidInput.decision as any).stage, "operator_input");
          assert.equal(activationCalls, 0);

          const dryRunAuthorityInput = await runBuyVoidProductionPrivateServicesOperatorV1(
            {
              confirmation:
                VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_CONFIRMATION_V1,
            },
            {
              resolve_policy: () => readyPolicy(),
              run_activation: async () => {
                activationCalls += 1;
                return dryRunActivation();
              },
            },
          );
          assert.equal((dryRunAuthorityInput.decision as any).ok, false);
          assert.equal((dryRunAuthorityInput.decision as any).stage, "operator_input");
          assert.equal(
            (dryRunAuthorityInput.decision as any).reason,
            "production_private_services_operator_dry_run_authority_input_forbidden",
          );
          assert.equal(activationCalls, 0);
          
          const policyHeld = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          if proof.count(dry_test_anchor) != 1:
              raise SystemExit('unexpected dry-run proof anchor')
          proof = proof.replace(dry_test_anchor, dry_test, 1)

          residual_anchor = '''assert.equal(residualDecision.custodian_service_active_after_return, true);
          assert.equal(residual.session, null);
          
          const thrown = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          malformed_held = '''assert.equal(residualDecision.custodian_service_active_after_return, true);
          assert.equal(residual.session, null);

          const malformedHeldCleanupOrder: string[] = [];
          const malformedHeld = await runBuyVoidProductionPrivateServicesOperatorV1(
            { apply: true },
            {
              resolve_policy: () => readyPolicy(),
              run_activation: async () => ({
                ok: false,
                status: "held",
                applied: true,
                marker: "WRONG_ACTIVATION_MARKER",
                version: 1,
                reason: "synthetic_malformed_held",
                plan_id_sha256: PLAN_ID,
                rpc_probe_performed: true,
                custodian_service_start_performed: true,
                broadcaster_service_start_performed: true,
                custodian_service_active_after_return: true,
                broadcaster_service_active_after_return: true,
                credential_read_performed: false,
                signing_performed: false,
                submit_once_performed: false,
                transaction_broadcast_performed: false,
                money_movement_performed: false,
                services: {
                  broadcaster: {
                    stop: async () => { malformedHeldCleanupOrder.push("broadcaster"); },
                  },
                  custodian: {
                    stop: async () => { malformedHeldCleanupOrder.push("custodian"); },
                  },
                },
                authority:
                  VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1,
              } as any),
            },
          );
          const malformedHeldDecision = malformedHeld.decision as any;
          assert.equal(malformedHeldDecision.ok, false);
          assert.equal(
            malformedHeldDecision.reason,
            "production_private_services_operator_activation_held_boundary_invalid",
          );
          assert.equal(malformedHeldDecision.side_effect_state_known, false);
          assert.equal(malformedHeldDecision.residual_service_state, true);
          assert.deepEqual(malformedHeldCleanupOrder, ["broadcaster", "custodian"]);
          
          const thrown = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          if proof.count(residual_anchor) != 1:
              raise SystemExit('unexpected residual proof anchor')
          proof = proof.replace(residual_anchor, malformed_held, 1)

          proof = proof.replace(
              '      provider_submission_id: "invalid provider id with spaces",',
              '      provider_submission_id: "",',
              1,
          )

          authority_anchor = '''assert.equal(
            VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.unknown_side_effect_state_is_residual,
            true,
          );
          '''
          authority_extra = '''assert.equal(
            VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.held_result_boundary_revalidated,
            true,
          );
          assert.equal(
            VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.dry_run_authority_arguments_rejected_without_apply,
            true,
          );
          assert.equal(
            VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.provider_submission_id_parser_duplicated,
            false,
          );
          assert.equal(
            VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.unknown_side_effect_state_is_residual,
            true,
          );
          '''
          if proof.count(authority_anchor) != 1:
              raise SystemExit('unexpected authority proof anchor')
          proof = proof.replace(authority_anchor, authority_extra, 1)

          static_anchor = 'assert.doesNotMatch(operatorSource, /catch\\s*\\{\\s*\\}/);\n'
          if proof.count(static_anchor) != 1:
              raise SystemExit('unexpected static proof anchor')
          proof = proof.replace(
              static_anchor,
              static_anchor + 'assert.doesNotMatch(operatorSource, /SAFE_PROVIDER_ID/);\n',
              1,
          )

          signal_anchor = '''assert.ok(latchCall >= 0 && activationCall > latchCall);
          
          process.stdout.write(`${JSON.stringify({
          '''
          signal_extra = '''assert.ok(latchCall >= 0 && activationCall > latchCall);
          assert.match(cliSource, /activationInvocationStarted = true/);
          assert.match(
            cliSource,
            /residual_service_state: activationInvocationStarted/,
          );
          assert.match(
            cliSource,
            /side_effect_state_known: !activationInvocationStarted/,
          );
          assert.match(
            cliSource,
            /--apply is required with activation confirmation options/,
          );
          
          process.stdout.write(`${JSON.stringify({
          '''
          if proof.count(signal_anchor) != 1:
              raise SystemExit('unexpected signal proof anchor')
          proof = proof.replace(signal_anchor, signal_extra, 1)

          marker_anchor = '''  unexpected_started_result_cleanup: true,
            cleanup_failure_explicit: true,
            unknown_side_effect_state_is_residual: true,
          '''
          marker_extra = '''  unexpected_started_result_cleanup: true,
            held_result_boundary_revalidated: true,
            dry_run_authority_arguments_rejected_without_apply: true,
            provider_submission_id_parser_duplicated: false,
            cleanup_failure_explicit: true,
            unknown_side_effect_state_is_residual: true,
          '''
          if proof.count(marker_anchor) != 1:
              raise SystemExit('unexpected proof marker anchor')
          proof = proof.replace(marker_anchor, marker_extra, 1)
          proof_path.write_text(proof)

          workflow_path = Path(".github/workflows/buy-void-production-private-services-operator-v1.yml")
          workflow = workflow_path.read_text()
          path_anchor = '      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"\n'
          dependency_paths = '''      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
                - "src/economic/buy_void_native_execution_runtime_v1.ts"
                - "scripts/prove_buy_void_native_execution_runtime_v1.ts"
                - "scripts/prove_buy_void_native_execution_runtime_guard_v1.ts"
                - "src/economic/buy_void_runtime_integration_v1.ts"
                - "scripts/prove_buy_void_runtime_integration_v1.ts"
                - "src/economic/buy_void_native_delivery_runtime_integration_v1.ts"
                - "src/economic/buy_void_native_execution_worker_v1.ts"
                - "src/economic/buy_void_production_activation_plan_v1.ts"
                - "scripts/prove_buy_void_production_activation_plan_v1.ts"
                - "src/economic/buy_void_native_chain2050_broadcaster_v1.ts"
                - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
                - "scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts"
                - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
                - "scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
                - "src/economic/buy_void_prepared_transaction_credential_signer_v1.ts"
                - "src/economic/buy_void_native_fulfillment_wallet_credential_signer_v1.ts"
                - "src/economic/buy_void_prepared_transaction_custodian_ipc_v1.ts"
                - "src/economic/buy_void_prepared_transaction_custody_v1.ts"
                - "tools/buy-void-prepared-transaction-custodian-service-v1.mjs"
                - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
                - "src/economic/buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts"
                - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
                - "scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts"
          '''
          if workflow.count(path_anchor) != 2:
              raise SystemExit('unexpected workflow dependency path anchor count')
          workflow = workflow.replace(path_anchor, dependency_paths, 2)

          proof_step_anchor = '''      - name: Preserve broadcaster submission activation
                run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
              - name: Typecheck repository
          '''
          extra_steps = '''      - name: Preserve broadcaster submission activation
                run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
              - name: Preserve production activation plan and chain transport
                run: |
                  npx --no-install tsx scripts/prove_buy_void_production_activation_plan_v1.ts
                  npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
              - name: Preserve custodian credential composition
                run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts
              - name: Preserve native execution and parent runtime policy ownership
                run: |
                  npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
                  npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
                  npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
              - name: Preserve synthetic end-to-end rehearsal
                run: npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts
              - name: Typecheck repository
          '''
          if workflow.count(proof_step_anchor) != 1:
              raise SystemExit('unexpected workflow proof step anchor')
          workflow = workflow.replace(proof_step_anchor, extra_steps, 1)
          workflow_path.write_text(workflow)

          docs_path = Path("docs/operators/buy-void-production-private-services-operator-v1.md")
          docs = docs_path.read_text()
          dry_anchor = '''Dry run performs zero RPC probes, zero service starts, zero credential reads,
          zero signing, zero submission/broadcast, and zero money movement.
          '''
          dry_extra = '''Dry run performs zero RPC probes, zero service starts, zero credential reads,
          zero signing, zero submission/broadcast, and zero money movement.

          Dry-run calls also reject activation confirmation/plan arguments instead of silently
          ignoring them. The five apply-only authority inputs are accepted only when
          `apply=true`; the CLI likewise rejects those flags unless `--apply` is present.
          '''
          if docs.count(dry_anchor) != 1:
              raise SystemExit('unexpected docs dry-run anchor')
          docs = docs.replace(dry_anchor, dry_extra, 1)

          held_anchor = '''If the coordinator itself throws rather than returning its normal bounded
          result, the operator reports `side_effect_state_known=false` instead of claiming
          that no startup side effect occurred.
          '''
          held_extra = '''If the coordinator itself throws rather than returning its normal bounded
          result, the operator reports `side_effect_state_known=false` instead of claiming
          that no startup side effect occurred. Unknown side-effect state is always treated
          as residual service risk.

          A returned `held` decision is trusted only when its exact #1106 marker, version,
          status, applied state, authority object, plan binding, and zero credential/sign/
          submit/broadcast/money flags all validate. A malformed held result is a boundary
          failure. If it unexpectedly carries service handles, cleanup is attempted in
          broadcaster-then-custodian order, but the receipt remains conservative with
          `side_effect_state_known=false`.

          The wrapper does not introduce a second provider-submission-ID parser. Successful
          provider IDs remain owned and sanitized by the reviewed chain-2050/#1106 stack;
          this operator only requires the already-reviewed successful value to be non-empty.
          '''
          if docs.count(held_anchor) != 1:
              raise SystemExit('unexpected docs held anchor')
          docs = docs.replace(held_anchor, held_extra, 1)

          cli_anchor = '''There is no wallet/RPC/runtime-root/signer/credential/private-path override and
          no transaction submission flag.
          '''
          cli_extra = '''There is no wallet/RPC/runtime-root/signer/credential/private-path override and
          no transaction submission flag.

          CLI parse/argument failures occur before activation invocation and are reported as
          known zero-side-effect failures (`side_effect_state_known=true`,
          `residual_service_state=false`). Errors after activation invocation remain
          conservative (`side_effect_state_known=false`, `residual_service_state=true`).
          '''
          if docs.count(cli_anchor) != 1:
              raise SystemExit('unexpected docs CLI anchor')
          docs = docs.replace(cli_anchor, cli_extra, 1)
          docs_path.write_text(docs)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused compile and operator proof
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
      - name: Prove CLI pre-activation error truth
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npx --no-install tsx scripts/buy_void_production_private_services_operator_v1.ts --confirm invalid-without-apply 2>&1)"
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          printf '%s\n' "$OUTPUT" | grep -F '"residual_service_state": false'
          printf '%s\n' "$OUTPUT" | grep -F '"side_effect_state_known": true'
