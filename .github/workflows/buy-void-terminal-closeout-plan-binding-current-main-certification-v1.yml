name: Buy VOID terminal-closeout plan binding current-main certification v1

on:
  pull_request:
    paths:
      - '.github/workflows/buy-void-terminal-closeout-plan-binding-current-main-certification-v1.yml'

permissions:
  contents: read

concurrency:
  group: buy-void-terminal-closeout-plan-binding-current-main-certification-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.head.repo.full_name == '6ZoSo9/void-node' &&
      github.event.pull_request.head.ref == 'fix/buy-void-terminal-closeout-plan-binding-v1-20260809' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compose exact current main without publishing
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='ee3d3037159e259d8726f6bf5018373d2edc96d7'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name 'void-ci'
          git config user.email 'void-ci@users.noreply.github.com'
          git merge --no-commit --no-ff "$BASE_SHA"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check "$BASE_SHA"
          printf '%s\n' \
            '.github/workflows/buy-void-terminal-closeout-plan-binding-current-main-certification-v1.yml' \
            'docs/operators/buy-void-production-terminal-closeout-operator-v1.md' \
            'scripts/buy_void_production_terminal_closeout_operator_v1.ts' \
            'scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts' \
            'scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts' \
            'scripts/prove_buy_void_saga_terminal_closeout_v1.ts' \
            'scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts' \
            'src/economic/buy_void_saga_terminal_closeout_model_v1.ts' \
            'src/economic/buy_void_saga_terminal_closeout_runtime_v1.ts' \
            'src/economic/buy_void_saga_terminal_closeout_v1.ts' \
            > /tmp/expected-current-main-diff.txt
          git diff --cached --name-only "$BASE_SHA" | sort > /tmp/actual-current-main-diff.txt
          diff -u /tmp/expected-current-main-diff.txt /tmp/actual-current-main-diff.txt

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove terminal-closeout core plan binding
        run: npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_v1.ts

      - name: Prove terminal-closeout runtime plan binding
        run: npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts

      - name: Prove production terminal-closeout operator binding
        run: npx --no-install tsx scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts

      - name: Re-prove confirmed closeout and server policy
        run: |
          npx --no-install tsx scripts/prove_buy_void_confirmed_closeout_v1.ts
          npx --no-install tsx scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts

      - name: Re-prove Buy VOID runtime integration
        run: npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts

      - name: Re-prove synthetic end-to-end fulfillment rehearsal
        run: npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Reconfirm exact composed diff
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='ee3d3037159e259d8726f6bf5018373d2edc96d7'
          git diff --cached --check "$BASE_SHA"
          git diff --cached --name-only "$BASE_SHA" | sort > /tmp/actual-current-main-diff-final.txt
          diff -u /tmp/expected-current-main-diff.txt /tmp/actual-current-main-diff-final.txt
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Abort local composition
        if: always()
        shell: bash
        run: git merge --abort || true
