name: Buy VOID compiled fulfillment identity acceptance v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.yml"
      - "ops/mainnet0/buy-void-presale-fulfillment-compiled-identity-v1.json"
      - "tools/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.mjs"
      - "scripts/prove_buy_void_presale_fulfillment_compiled_identity_acceptance_v1.mjs"
      - "docs/operators/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.md"
      - "contracts/mainnet/BuyVoidPresaleFulfillmentV1.sol"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.yml"
      - "ops/mainnet0/buy-void-presale-fulfillment-compiled-identity-v1.json"
      - "tools/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.mjs"
      - "scripts/prove_buy_void_presale_fulfillment_compiled_identity_acceptance_v1.mjs"
      - "docs/operators/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.md"
      - "contracts/mainnet/BuyVoidPresaleFulfillmentV1.sol"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Verify exact accepted compiler identity
        run: |
          set -euo pipefail
          node --check tools/buy-void-presale-fulfillment-compiled-identity-acceptance-v1.mjs
          node --check scripts/prove_buy_void_presale_fulfillment_compiled_identity_acceptance_v1.mjs
          node scripts/prove_buy_void_presale_fulfillment_compiled_identity_acceptance_v1.mjs
          git diff --check
