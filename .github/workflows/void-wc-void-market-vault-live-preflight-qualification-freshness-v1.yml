name: VOID WC-VOID market-vault live-preflight qualification freshness v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-live-preflight-qualification-freshness-v1.yml"
      - "docs/operators/wc-void-market-vault-live-preflight-qualification-freshness-v1.md"
      - "scripts/prove_void_wc_void_market_vault_live_preflight_qualification_freshness_v1.mjs"
      - "tools/void-wc-void-market-vault-live-deployment-observation-preflight-v1.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-wc-void-market-vault-live-preflight-qualification-freshness-v1.yml"
      - "docs/operators/wc-void-market-vault-live-preflight-qualification-freshness-v1.md"
      - "scripts/prove_void_wc_void_market_vault_live_preflight_qualification_freshness_v1.mjs"
      - "tools/void-wc-void-market-vault-live-deployment-observation-preflight-v1.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check tools/void-wc-void-market-vault-live-deployment-observation-preflight-v1.mjs
          node --check scripts/prove_void_wc_void_market_vault_live_preflight_qualification_freshness_v1.mjs
      - name: Prove qualification freshness wall
        run: node scripts/prove_void_wc_void_market_vault_live_preflight_qualification_freshness_v1.mjs
      - name: Existing live-preflight regression
        run: node scripts/prove_void_wc_void_market_vault_live_deployment_observation_preflight_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
