name: Buy VOID user-manager credential query v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-v3.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-user-manager-credential-query-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove V3 complete metadata generation binding
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/credential-query-v3-${{ matrix.node }}.log"
          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs | tee "$OUT"
          for marker in \
            'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_PROOF_GREEN' \
            'v2_source_preserved=true' \
            'accepted_peer_guard_preserved=true' \
            'dropin_bound=64' \
            'loadcredential_bound=32' \
            'exactly_one_epoch2_credential_required=true' \
            'unrelated_credentials_allowed=true' \
            'complete_dropin_set_sha256_emitted=true' \
            'complete_credential_set_sha256_emitted=true' \
            'sha256_known_vector_verified=true' \
            'cross_query_complete_set_binding_enabled=true' \
            'credential_contents_read=false' \
            'binary_acceptance=false' \
            'protected_install_authorized=false' \
            'live_query_authorized=false' \
            'production_host_evidence_authority=false' \
            'host_mutation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$OUT"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1)"
