name: Chain-2050 DataNet anchor boundary v1

on:
  pull_request:
    paths:
      - ".github/workflows/chain2050-datanet-anchor-boundary-v1.yml"
      - "docs/architecture/chain2050-datanet-anchor-boundary-v1.md"
      - "fixtures/architecture/chain2050-datanet-anchor-boundary-v1.json"
      - "schemas/chain2050-datanet-anchor-boundary-v1.schema.json"
      - "scripts/prove_chain2050_datanet_anchor_boundary_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chain2050-datanet-anchor-boundary-v1.yml"
      - "docs/architecture/chain2050-datanet-anchor-boundary-v1.md"
      - "fixtures/architecture/chain2050-datanet-anchor-boundary-v1.json"
      - "schemas/chain2050-datanet-anchor-boundary-v1.schema.json"
      - "scripts/prove_chain2050_datanet_anchor_boundary_v1.mjs"

permissions:
  contents: read

concurrency:
  group: chain2050-datanet-anchor-boundary-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact source bindings and authority boundary
        run: |
          set -euo pipefail
          node --check scripts/prove_chain2050_datanet_anchor_boundary_v1.mjs
          node scripts/prove_chain2050_datanet_anchor_boundary_v1.mjs
          git diff --exit-code
