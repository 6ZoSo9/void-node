permissions:
  contents: read

concurrency:
  group: epoch2-first-entry-source-generation-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact event scope and preserved generations
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              cursor="$EXPECTED_HEAD"
              while test "$cursor" != "$base"; do
                parent_line="$(git rev-list --parents -n 1 "$cursor")"
                parent_count="$(awk '{print NF-1}' <<<"$parent_line")"
                if test "$parent_count" -gt 1; then
                  candidate_base="$(git rev-parse "$cursor^1")"
                  if git merge-base --is-ancestor "$PR_BASE" "$candidate_base"; then
                    base="$candidate_base"
                    break
                  fi
                fi
                next="$(git rev-parse "$cursor^1")"
                if ! git merge-base --is-ancestor "$PR_BASE" "$next"; then
                  break
                fi
                cursor="$next"
              done
              ;;
            push)
              base="$PUSH_BEFORE"
              test -n "$base"
              test "$base" != 0000000000000000000000000000000000000000
              ;;
            workflow_dispatch) base="" ;;
            *) exit 1 ;;
          esac
          if test -n "$base"; then
            git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"
            expected="$RUNNER_TEMP/epoch2-generation-v3-expected-scope.txt"
            actual="$RUNNER_TEMP/epoch2-generation-v3-actual-scope.txt"
            printf '%s\n' \
              'A	.github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v3.yml' \
              'A	docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v3.md' \
              'A	ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py' \
              'A	ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.c' \
              'A	ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf' \
              'A	scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5_generation.py' \
              'A	scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5_terminal.py' \
              'A	scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.py' \
              | sort > "$expected"
            git diff --name-status "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
            diff -u "$expected" "$actual"
            git diff --check "$base" "$EXPECTED_HEAD"
          else
            echo "scope_event_comparison=not_applicable_manual_replay"
          fi
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v3.md)" = 695af55c3d3951bc14b7cb9c2acd7d855bb757bd
