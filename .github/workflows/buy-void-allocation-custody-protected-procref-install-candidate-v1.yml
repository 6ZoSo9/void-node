name: VOID Buy custody protected proc-ref installer candidate v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py"
      - "scripts/prove_void_buy_allocation_custody_protected_procref_install_candidate_v1.py"
      - "docs/operators/buy-void-allocation-custody-protected-procref-install-candidate-v1.md"
      - ".github/workflows/buy-void-allocation-custody-protected-procref-install-candidate-v1.yml"
      - "tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs"
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.json"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact disabled installer successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="2ba266ddec0e17154db1a8511a0a29d5db2174f6"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-protected-procref-install-candidate-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-protected-procref-install-candidate-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_protected_procref_install_candidate_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py)" = \
            "467bed6ef835bc84eb5b6f8cb53b0fbfb1b1f686"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_protected_procref_install_candidate_v1.py)" = \
            "7861a1625238d0324ed697519f3b108eac211b9d"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-protected-procref-install-candidate-v1.md)" = \
            "0aa1454fcb876fab303f286b548e1814d298afe5"
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-protected-procref-install-plan-v1.mjs)" = \
            "a2431fffbee7be4de2ee1152b70e5fcccafd40c9"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.json)" = \
            "29a5d9325468897c9b99d22d4a0376547a5e865e"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = \
            "2f22f0cf3e5c5ed56c2a31f0862f087cdbbe41a9"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_protected_procref_install_candidate_v1.py

      - name: Run disposable self-test
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/procref-installer-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py \
            --self-test | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_PROTECTED_PROCREF_INSTALL_CANDIDATE_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'exact_v4_source_lock_bound=true' \
            'exact_reviewed_source_bytes_bound=true' \
            'renameat2_noreplace_fixture_green=true' \
            'create_only_no_clobber_fixture_green=true' \
            'stage_descriptor_retained_through_publication=true' \
            'stage_path_revalidated_before_publication=true' \
            'stage_substitution_rejected=true' \
            'foreign_stage_cleanup_refused=true' \
            'exact_stage_generation_cleanup=true' \
            'truthful_host_write_failure_classification=true' \
            'post_publication_exact_reverification_fixture_green=true' \
            'content_addressed_install_receipt_fixture_green=true' \
            'production_apply_cli_present=true' \
            'production_apply_reachable=false' \
            'production_apply_authorized=false' \
            'root_census_execution_authorized=false' \
            'production_host_write_performed=false' \
            'self_test_temporary_filesystem_write=true' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/procref-installer-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_protected_procref_install_candidate_v1.py \
            | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_PROTECTED_PROCREF_INSTALL_CANDIDATE_V1_PROOF_GREEN' "$out"
          for marker in \
            'exact_installer_source_blob_asserted=true' \
            'exact_v4_source_lock_bound=true' \
            'exact_v4_install_plan_bound=true' \
            'production_apply_guard_precedes_host_access=true' \
            'apply_nonexistent_candidate_not_read=true' \
            'stage_descriptor_retained_through_publication=true' \
            'stage_path_revalidated_before_publication=true' \
            'stage_substitution_rejected=true' \
            'foreign_stage_cleanup_refused=true' \
            'exact_stage_generation_cleanup=true' \
            'truthful_host_write_failure_classification=true' \
            'production_apply_cli_present=true' \
            'production_apply_reachable=false' \
            'production_apply_authorized=false' \
            'root_census_execution_authorized=false' \
            'production_host_write_performed=false' \
            'replacement_apply_authorized=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove apply guard before host access
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/procref-installer-apply-hold.txt"
          set +e
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_protected_procref_install_candidate_v1.py \
            --apply --source-file /nonexistent/never-read >"$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          test "$rc" -eq 2
          grep -Fx 'reason=custody_procref_install_candidate_protected_install_apply_not_authorized' "$out"
          grep -Fx 'publication_state=not_published' "$out"
          grep -Fx 'production_apply_cli_present=true' "$out"
          grep -Fx 'production_apply_reachable=false' "$out"
          grep -Fx 'production_apply_authorized=false' "$out"
          grep -Fx 'production_host_write_performed=false' "$out"
          grep -Fx 'root_census_execution_authorized=false' "$out"
          grep -Fx 'replacement_apply_authorized=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
