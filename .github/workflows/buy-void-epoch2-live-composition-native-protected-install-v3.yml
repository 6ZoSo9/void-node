name: Buy VOID Epoch-2 native protected install v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v3.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v3.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v3.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v3.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V3 installer generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lock_head=e2a6e11b1c9b78b9bfe59682592c24460b275c66
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$lock_head" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-protected-install-v3.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-protected-install-v3.md' \
            'ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py' \
            'scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py' \
            | sort > "$expected"
          git diff --name-only "$lock_head" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py)" = \
            ff31ae5a9c3440e5cb63e17e8080ad7c99a19eae
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py)" = \
            6ca2de944743666aa42d266741bb4c3a8c9bc14a
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-protected-install-v3.md)" = \
            94e93d25408d4393c0162f4a81b8772323d73889
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json)" = \
            db59358bab68a0fa33d0840bd9afe967dd809e61
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = \
            5021727f1def1ec11f870d735cab65acc1701a5e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" = \
            baab733e43c030d24f8d4abd1644f3c4ae55c3b2
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" = \
            14cbe81e27d04fee77cbe75225ce308bf8561a7b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py)" = \
            70b74ff2f09f5aef86eec39b8f643d8f2ebb63f5

          git diff --check "$lock_head" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py",
              "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_NATIVE_PROTECTED_INSTALL_V3_SYNTAX_GREEN")
          PY

      - name: Prove protected installer source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-native-install-v3-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v3.py |
            tee "$out"

          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V3_PROOF_GREEN"
            "accepted_v5_lock_bound=true"
            "accepted_native_binary_rederived=true"
            "accepted_runner_bytes_bound=true"
            "fixed_node_measured_not_installed=true"
            "runtime_user_git_checkout_binding=true"
            "expected_plan_id_apply_binding=true"
            "create_only_atomic_publication=true"
            "truthful_post_publication_failure_receipt=true"
            "pre_mutation_authority_boundary=true"
            "pre_mutation_authority_flush_required=true"
            "wrong_confirmation_pre_mutation_hold_exercised=true"
            "candidate_files_unopened_before_confirmation=true"
            "protected_root_unopened_before_confirmation=true"
            "protected_install_authorized=false"
            "live_execution_authorized=false"
            "credential_access_authorized=false"
            "signing_authorized=false"
            "transaction_authorized=false"
            "payment_acceptance_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "treasury_liquidity_action_authorized=false"
            "funds_movement_authorized=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-native-install-v3-source-plan.log"
          python3 -I -B \
            ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v3.py \
            --source-plan | tee "$out"

          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V3"
            "mode=source-plan"
            "source_only=true"
            "host_read=false"
            "host_write=false"
            "accepted_lock_id=voidbuye2nativecandlock5_650ae9975eeb898279649e48115cdfec242052c0853b0ce5af19244d4d304126"
            "candidate_id=voidbuye2nativecand5_a377212ff699fb3463d2bfeecc61a16416a98ed5a291771c4a8a73aa003e6308"
            "target_root=/opt/void-buy-void-epoch2-live-composition-v3"
            "staging_root=/opt/.void-buy-void-epoch2-live-composition-v3.stage"
            "create_only=true"
            "atomic_root_publication_required=true"
            "rename_noreplace_required=true"
            "node_generation_bound_at_plan_apply=true"
            "expected_main_head_bound_at_plan_apply=true"
            "truthful_post_publication_failure_receipt_required=true"
            "protected_install_authorized=false"
            "live_execution_authorized=false"
            "credential_access_authorized=false"
            "private_key_access_authorized=false"
            "signing_authorized=false"
            "transaction_authorized=false"
            "payment_acceptance_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "treasury_liquidity_action_authorized=false"
            "funds_movement_authorized=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
