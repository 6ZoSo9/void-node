name: VOID Buy user manager query static preexec v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_unit_query_preexec_v1.mjs"
      - "docs/architecture/buy-void-user-manager-private-unit-query-preexec-v1.md"
      - ".github/workflows/buy-void-user-manager-private-unit-query-preexec-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_unit_query_preexec_v1.mjs"
      - "docs/architecture/buy-void-user-manager-private-unit-query-preexec-v1.md"
      - ".github/workflows/buy-void-user-manager-private-unit-query-preexec-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: \${{ matrix.node }}
      - name: Prove source contract
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_void_user_manager_private_unit_query_preexec_v1.mjs |
            tee "$RUNNER_TEMP/preexec-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_PREEXEC_V1_PROOF_GREEN' "$RUNNER_TEMP/preexec-proof.log"
          grep -Fx 'static_link_required=true' "$RUNNER_TEMP/preexec-proof.log"
          grep -Fx 'query_elf_content_lock_still_required=true' "$RUNNER_TEMP/preexec-proof.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/preexec-proof.log"
      - name: Build static preexec and dynamic query
        run: |
          set -euo pipefail
          preexec="$RUNNER_TEMP/private-unit-query-preexec"
          query="$RUNNER_TEMP/private-unit-query"
          gcc -O2 -Wall -Wextra -Werror -std=c11 -static -fno-pie -no-pie \
            -Wl,--build-id=none \
            ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c \
            -o "$preexec"
          gcc -O2 -Wall -Wextra -Werror -std=c11 \
            ops/precision/void_buy_void_user_manager_private_unit_query_v1.c \
            -ldl -o "$query"
          readelf -l "$preexec" | tee "$RUNNER_TEMP/preexec-readelf.log"
          if grep -F ' INTERP ' "$RUNNER_TEMP/preexec-readelf.log"; then
            echo "static preexec unexpectedly has PT_INTERP" >&2
            exit 1
          fi
          file "$preexec" | grep -F 'statically linked'
      - name: Prove preload cannot enter query through static preexec
        run: |
          set -euo pipefail
          root=/opt/void-buy-void-user-manager-query-v1
          preexec="$RUNNER_TEMP/private-unit-query-preexec"
          query="$RUNNER_TEMP/private-unit-query"
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -o root -g root -m 0755 "$preexec" "$root/void_buy_void_user_manager_private_unit_query_preexec_v1"
          sudo install -o root -g root -m 0755 "$query" "$root/void_buy_void_user_manager_private_unit_query_v1"

          fake="$RUNNER_TEMP/preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_unit_query_v1")==NULL &&
               strstr(exe,"private-unit-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          gcc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\"" "$fake/preload.c" -o "$fake/preload.so"

          rm -f "$sentinel"
          if sudo env \
               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
               LD_PRELOAD="$fake/preload.so" \
               "$root/void_buy_void_user_manager_private_unit_query_v1" --self-test \
               >"$RUNNER_TEMP/direct-query.log" 2>&1; then
            echo "direct poisoned query unexpectedly succeeded" >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          sudo env LD_PRELOAD="$fake/preload.so" \
            "$root/void_buy_void_user_manager_private_unit_query_preexec_v1" --exec-self-test |
            tee "$RUNNER_TEMP/preexec-query.log"
          test ! -e "$sentinel"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_V1_SELF_TEST_GREEN' "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'sanitized_loader_environment=true' "$RUNNER_TEMP/preexec-query.log"

          sudo chmod 0777 "$root/void_buy_void_user_manager_private_unit_query_v1"
          if sudo "$root/void_buy_void_user_manager_private_unit_query_preexec_v1" --exec-self-test \
               >"$RUNNER_TEMP/mutable-child.log" 2>&1; then
            echo "mutable query unexpectedly admitted" >&2
            exit 1
          fi
          grep -Fx 'reason=query_file_custody_invalid' "$RUNNER_TEMP/mutable-child.log"
          sudo chmod 0755 "$root/void_buy_void_user_manager_private_unit_query_v1"

          sudo rm -f \
            "$root/void_buy_void_user_manager_private_unit_query_preexec_v1" \
            "$root/void_buy_void_user_manager_private_unit_query_v1"
          sudo rmdir "$root"
      - run: git diff --check
