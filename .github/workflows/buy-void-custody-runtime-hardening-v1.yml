name: VOID Buy custody runtime hardening v1

on:
  pull_request:
    paths:
      - "ops/systemd/void-node-live.service.d/98-buy-void-custody-runtime-hardening-v1.conf.example"
      - "scripts/prove_buy_void_custody_runtime_hardening_v1.mjs"
      - "docs/operators/buy-void-custody-runtime-hardening-v1.md"
      - ".github/workflows/buy-void-custody-runtime-hardening-v1.yml"
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"
  push:
    branches: [main]
    paths:
      - "ops/systemd/void-node-live.service.d/98-buy-void-custody-runtime-hardening-v1.conf.example"
      - "scripts/prove_buy_void_custody_runtime_hardening_v1.mjs"
      - "docs/operators/buy-void-custody-runtime-hardening-v1.md"
      - ".github/workflows/buy-void-custody-runtime-hardening-v1.yml"
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove bounded hardening profile
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_custody_runtime_hardening_v1.mjs |
            tee "$RUNNER_TEMP/hardening.log"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_HARDENING_V1_GREEN' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'NoNewPrivileges=yes' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'CapabilityBoundingSet=' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'AmbientCapabilities=' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'network_policy_changed=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'environment_changed=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'credential_binding_changed=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'service_restarted=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/hardening.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/hardening.log"
      - run: git diff --check
