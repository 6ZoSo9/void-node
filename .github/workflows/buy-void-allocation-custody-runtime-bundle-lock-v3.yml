name: VOID Buy custody runtime bundle acceptance lock v3

on:
  pull_request:
    paths:
      - "ops/security/buy-void-allocation-custody-runtime-bundle-lock-v3.json"
      - "scripts/prove_void_buy_allocation_custody_runtime_bundle_lock_v3.mjs"
      - "docs/architecture/buy-void-allocation-custody-runtime-bundle-lock-v3.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-bundle-lock-v3.yml"
      - "tools/void-buy-allocation-custody-runtime-bundle-candidate-v3.mjs"
      - "tools/void-buy-allocation-custody-runtime-bundle-candidate-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_runtime_bundle_candidate_v2.mjs"
      - "docs/architecture/buy-void-allocation-custody-runtime-bundle-candidate-v2.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-bundle-candidate-v2.yml"
      - "scripts/prove_void_buy_allocation_custody_runtime_bundle_candidate_v3.mjs"
      - "docs/architecture/buy-void-allocation-custody-runtime-bundle-candidate-v3.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-bundle-candidate-v3.yml"
      - "tools/void-buy-allocation-custody-runtime-bundle-candidate-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_runtime_bundle_candidate_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-runtime-bundle-candidate-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-bundle-candidate-v1.yml"
      - "tools/void-buy-allocation-custody-service-v2.mjs"
      - "src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs"
      - "src/economic/buy_void_custody_payment_ledgers_observed_read_v1.mjs"
      - "src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_preappend_plain_input_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_inventory_reservation_journal_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "src/economic/buy_void_fulfillment_confirmation_v1.ts"
      - "src/economic/buy_void_fulfillment_journal_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  prove:
    name: custody bundle lock v3 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile exact source tree
        run: |
          set -euo pipefail
          rm -rf dist
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Prove exact hosted V3 candidate and acceptance lock
        run: |
          set -euo pipefail
          node --check scripts/prove_void_buy_allocation_custody_runtime_bundle_lock_v3.mjs
          log="$RUNNER_TEMP/custody-bundle-lock-v3.txt"
          node scripts/prove_void_buy_allocation_custody_runtime_bundle_lock_v3.mjs --self-test | tee "$log"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_BUNDLE_LOCK_V3_GREEN' "$log"
          grep -Fx 'candidate_id=voidbuycustodybundle3_dae3764e1f1b660235d17ad933e32ed0d4f67d8fc4cd322286d34c5d9f0dbe32' "$log"
          grep -Fx 'candidate_sha256=0d1be868aab98debdf0785c59cf45954ae68b2e1ebd0687ee56206b10b02ac67' "$log"
          grep -Fx 'candidate_accepted=true' "$log"
          grep -Fx 'all_three_fifo_safe_readers_bound=true' "$log"
          grep -Fx 'immutable_root_install=false' "$log"
          grep -Fx 'runtime_integration=false' "$log"
          grep -Fx 'payment_acceptance=false' "$log"
          grep -Fx 'public_presale_activation=false' "$log"
          grep -Fx 'funds_movement=false' "$log"
          out="$RUNNER_TEMP/custody-bundle-lock-v3-node-${{ matrix.node }}.json"
          node scripts/prove_void_buy_allocation_custody_runtime_bundle_lock_v3.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-allocation-custody-runtime-bundle-lock-v3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-bundle-lock-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/custody-bundle-lock-v3-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-bundle-lock-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks
      - name: Require exact cross-node V3 lock bytes
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "locks/custody-bundle-lock-v3-node-$v.json"
          done
          cmp locks/custody-bundle-lock-v3-node-22.json locks/custody-bundle-lock-v3-node-24.json
          cmp locks/custody-bundle-lock-v3-node-22.json locks/custody-bundle-lock-v3-node-26.json
          echo VOID_BUY_VOID_CUSTODY_RUNTIME_BUNDLE_LOCK_V3_THREE_NODE_GREEN
