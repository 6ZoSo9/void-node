name: VOID Buy custody V3 protected all-process reference census lock v4

on:
  pull_request:
    paths:
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.json"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v4.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.yml"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.yml"
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current protected-source V4 lock successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="0eb763d8ecba723f5a80cccb24a297fbf5a010b7"

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.md'
            $'A\tops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.json'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v4.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" =             "2f22f0cf3e5c5ed56c2a31f0862f087cdbbe41a9"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" =             "551102b148d3b2e0b0f5a83d67ace9f69549c918"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.md)" =             "1dd0939cd5d0390a13aff54996f9c65ba253eebd"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.yml)" =             "23b004aa89b94fd8037b7f82ab1148f174454d05"

          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v3.json)" =             "e66742be948ae418cbdca75542db263050930c15"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.json)" =             "29a5d9325468897c9b99d22d4a0376547a5e865e"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v4.py)" =             "17c29d6666d01690e69c780ee5fd7b1948cac1dc"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v4.md)" =             "69c231e128e579c73eec16d55f3732de3ae243c8"

          printf '%s  %s\n'             "79810ed2afa60d2e544e0f6f48ff8189dd26d5aaeb65208bfb1f562fda467a1c"             "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"             | sha256sum -c -
          test "$(wc -c < ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" -eq 74322

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile V4 lock proof
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile             scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v4.py

      - name: Prove V4 current protected-source acceptance
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/protected-source-lock-v4.txt"
          python3 -I -B             scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v4.py             | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_REFERENCE_CENSUS_LOCK_V4_GREEN' "$out"
          for marker in             'candidate_source_git_blob_exact=true'             'candidate_source_bytes_exact=true'             'candidate_source_ascii_only=true'             'candidate_source_sha256_exact=true'             'source_generation_companion_blobs_exact=true'             'historical_v3_lock_preserved=true'             'focused_source_run_bound=true'             'exact_head_review_bound=true'             'candidate_source_accepted=true'             'current_parent_lineage_bound=true'             'host_pid_namespace_external_lease_required=true'             'host_mount_namespace_external_lease_required=true'             'host_user_namespace_external_lease_required=true'             'host_namespace_lease_provenance_authenticated_by_census=false'             'mount_namespace_reference_absence_proven=false'             'all_process_reference_absence_proven=false'             'fd_table_stability_proven=false'             'mapping_set_stability_proven=false'             'process_reference_snapshot_race_free=false'             'live_at_use_reverification_required=true'             'protected_install_authorized=false'             'protected_source_installed=false'             'live_privileged_census_authorized=false'             'live_privileged_census_executed=false'             'replacement_apply_authorized=false'             'runtime_integration=false'             'payment_acceptance=false'             'public_presale_activation=false'             'production_gate_ready=false'             'funds_movement=false'             'next_gate=RESTACK_REVIEW_CURRENT_PROTECTED_SOURCE_INSTALL_PLAN_PR3771'; do
            grep -Fx "$marker" "$out"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
