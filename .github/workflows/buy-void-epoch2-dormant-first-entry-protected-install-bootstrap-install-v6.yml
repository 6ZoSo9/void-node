name: Buy VOID Epoch-2 dormant first-entry protected bootstrap install v6

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-dormant-first-entry-protected-bootstrap-install-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V6 bootstrap installer generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          parent=5316130eb663407456408c8ac8b454871ebda919
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$parent" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
            | sort > "$expected"
          git diff --name-only "$parent" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py)" = 63e1c973978cfcb67105010e4145f01552673bc3
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py)" = cb229523f260dbb50620c062556d725efebe4e8d
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md)" = 38cc160e19c1bcf593a648ec13c0a395be423822
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py)" = 3a937c756a91ad2565897f1ae5d881f9fa2f41c6
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json)" = f5b03c6b81016edf21f605099e0ef8976f40e107
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf)" = 6e0630af72111bd9976dcc38cdcdada1904dd067

          git diff --check "$parent" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and independent installer proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V6_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/v6-bootstrap-install-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V6_PROOF_GREEN' \
            'target_blob_bound=true' \
            'accepted_bootstrap_v6_lock_bound=true' \
            'source_generation_v3_manifest_bound=true' \
            'accepted_bootstrap_v6_binary_bound=true' \
            'python_and_git_host_policy_bound=true' \
            'wrong_confirmation_precedes_host_reads=true' \
            'single_rename_noreplace_publication=true' \
            'generation_bound_stage_cleanup_required=true' \
            'prepublication_cleanup_failure_fail_closed=true' \
            'post_publication_failure_truth_monotonic=true' \
            'post_publication_rollback=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'credential_access=false' \
            'signing=false' \
            'transaction=false' \
            'rpc_call=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Rederive accepted V6 install inputs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v6-install-inputs"
          python3 -I -B scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py \
            --derive-dir "$out" | tee "$RUNNER_TEMP/materialize.log"

          bootstrap="$out/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6"
          manifest="$out/source-generation-v3.conf"

          test "$(stat -c %s "$bootstrap")" = 874608
          test "$(stat -c %a "$bootstrap")" = 555
          test "$(sha256sum "$bootstrap" | awk '{print $1}')" = c0121a4d50443dac1c6e42a03fcdee77ec55c867acd6aea04cbbce3ae424a21b
          test "$(git hash-object "$bootstrap")" = a91707c3e5803071fc73c3451c9bcb3b774f8b48

          test "$(stat -c %s "$manifest")" = 2382
          test "$(stat -c %a "$manifest")" = 444
          test "$(sha256sum "$manifest" | awk '{print $1}')" = aa9ee1676355b95f7c4b5e7d10e303eda5e30bb3142a588986461efaa7040662
          test "$(git hash-object "$manifest")" = 6e0630af72111bd9976dcc38cdcdada1904dd067

          grep -Fx 'artifact_publication_only=true' "$RUNNER_TEMP/materialize.log"
          grep -Fx 'protected_install_authorized=false' "$RUNNER_TEMP/materialize.log"
          grep -Fx 'live_execution_authorized=false' "$RUNNER_TEMP/materialize.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/materialize.log"

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/source-plan.log"
          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py --source-plan | tee "$out"
          for marker in \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'create_only=true' \
            'rename_noreplace_required=true' \
            'python_and_git_host_policy_required=true' \
            'bootstrap_execution_authorized=false' \
            'inner_installer_execution_authorized=false' \
            'service_mutation_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
