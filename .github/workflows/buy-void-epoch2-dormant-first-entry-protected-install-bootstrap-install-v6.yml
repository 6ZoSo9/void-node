    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V6 bootstrap installer generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_base=e8c2944afbb0a99855e500864d86da788accfad9
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$source_base" "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              test "$PR_BASE" != 0000000000000000000000000000000000000000
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          if test "$EVENT_NAME" = pull_request; then
            allowed="$RUNNER_TEMP/allowed-scope.txt"
            actual="$RUNNER_TEMP/actual-scope.txt"
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.yml' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.yml' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v6.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.md' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
              | LC_ALL=C sort > "$allowed"
            git diff --no-renames --name-only "$base" "$EXPECTED_HEAD" -- | LC_ALL=C sort > "$actual"
            test -s "$actual"
            unexpected="$RUNNER_TEMP/unexpected-scope.txt"
            LC_ALL=C comm -23 "$actual" "$allowed" > "$unexpected"
            if test -s "$unexpected"; then
              cat "$unexpected" >&2
              exit 1
            fi
