name: void-ai-agent-provenance-unfiltered-v1

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prove_void_ai_agent_first_contact_v1.mjs
      - run: node scripts/prove_void_ai_agent_public_utility_v1.mjs
      - run: git diff --check
