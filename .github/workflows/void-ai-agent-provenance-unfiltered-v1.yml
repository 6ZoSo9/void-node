name: void-ai-agent-provenance-unfiltered-v1

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node scripts/prove_void_ai_agent_first_contact_v1.mjs
      - run: node scripts/prove_void_ai_agent_public_utility_v1.mjs
      - run: git diff --check
