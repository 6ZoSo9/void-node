name: datanet-manifest-root-integrity-v1

on:
  pull_request:
    paths:
      - "src/http/datanet_routes.ts"
      - "scripts/prove_datanet_manifest_root_integrity_v1.mjs"
      - ".github/workflows/datanet-manifest-root-integrity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build repository
        run: npm run build

      - name: Prove DataNet manifest root integrity
        run: node scripts/prove_datanet_manifest_root_integrity_v1.mjs

      - name: Typecheck repository
        run: npm run typecheck -- --pretty false

      - name: Diff hygiene
        run: git diff --check
