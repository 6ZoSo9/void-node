name: tmp PR1128 private-services operator hardening v1

on:
  push:
    branches:
      - feat/buy-void-production-private-services-foreground-operator-v1-20260808
    paths:
      - ".github/workflows/tmp-pr1128-private-services-operator-hardening-v1.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Verify guarded helper ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3d678425166e5a933124ad5e39d881a1158ede6b"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/tmp-pr1128-private-services-operator-hardening-v1.yml"
      - name: Apply exact lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/economic/buy_void_production_private_services_operator_v1.ts")
          source = source_path.read_text()

          old_catches = '''    try {
              await services.broadcaster.stop();
              broadcasterStopSucceeded = true;
            } catch {}
            try {
              await services.custodian.stop();
              custodianStopSucceeded = true;
            } catch {}
          '''
          new_catches = '''    try {
              await services.broadcaster.stop();
              broadcasterStopSucceeded = true;
            } catch (error) {
              void error;
            }
            try {
              await services.custodian.stop();
              custodianStopSucceeded = true;
            } catch (error) {
              void error;
            }
          '''
          if source.count(old_catches) != 1:
              raise SystemExit("unexpected shutdown catch source shape")
          source = source.replace(old_catches, new_catches, 1)

          old_held = '''  const custodianActive = input.custodian_service_active_after_return === true;
            const broadcasterActive = input.broadcaster_service_active_after_return === true;
            return {
          '''
          new_held = '''  const custodianActive = input.custodian_service_active_after_return === true;
            const broadcasterActive = input.broadcaster_service_active_after_return === true;
            const sideEffectStateKnown = input.side_effect_state_known !== false;
            return {
          '''
          if source.count(old_held) != 1:
              raise SystemExit("unexpected held state source shape")
          source = source.replace(old_held, new_held, 1)
          old_residual = '''      residual_service_state: custodianActive || broadcasterActive,
                side_effect_state_known: input.side_effect_state_known !== false,
          '''
          new_residual = '''      residual_service_state: sideEffectStateKnown
                  ? custodianActive || broadcasterActive
                  : true,
                side_effect_state_known: sideEffectStateKnown,
          '''
          if source.count(old_residual) != 1:
              raise SystemExit("unexpected residual state source shape")
          source = source.replace(old_residual, new_residual, 1)

          reason_marker = '      reason: "production_private_services_operator_started_boundary_invalid",'
          reason_index = source.index(reason_marker)
          block_start = source.rfind('  if (', 0, reason_index)
          block_end = source.index('\n  }\n\n  return {\n    decision:', reason_index) + len('\n  }')
          block = source[block_start:block_end]
          open_marker = '  ) {\n    return held({'
          if block.count(open_marker) != 1:
              raise SystemExit("unexpected started-boundary block shape")
          cleanup = '''  ) {
              const services = (activation as any).services as
                | {
                    custodian?: StoppableServiceV1;
                    broadcaster?: StoppableServiceV1;
                  }
                | undefined;
              let broadcasterCleanupSucceeded: boolean | null = null;
              let custodianCleanupSucceeded: boolean | null = null;
              if (typeof services?.broadcaster?.stop === "function") {
                broadcasterCleanupSucceeded = false;
                try {
                  await services.broadcaster.stop();
                  broadcasterCleanupSucceeded = true;
                } catch (error) {
                  void error;
                }
              }
              if (typeof services?.custodian?.stop === "function") {
                custodianCleanupSucceeded = false;
                try {
                  await services.custodian.stop();
                  custodianCleanupSucceeded = true;
                } catch (error) {
                  void error;
                }
              }
              return held({'''
          block = block.replace(open_marker, cleanup, 1)
          old_active = '''      custodian_service_active_after_return: flags.custodianActive,
                broadcaster_service_active_after_return: flags.broadcasterActive,
          '''
          new_active = '''      custodian_service_active_after_return:
                  flags.custodianActive && custodianCleanupSucceeded !== true,
                broadcaster_service_active_after_return:
                  flags.broadcasterActive && broadcasterCleanupSucceeded !== true,
          '''
          if block.count(old_active) != 1:
              raise SystemExit("unexpected started residual fields")
          block = block.replace(old_active, new_active, 1)
          source = source[:block_start] + block + source[block_end:]
          source_path.write_text(source)

          cli_path = Path("scripts/buy_void_production_private_services_operator_v1.ts")
          cli = cli_path.read_text()
          old_signal = '''function waitForShutdownSignal(): Promise<BuyVoidProductionPrivateServicesOperatorShutdownTriggerV1> {
            return new Promise((resolve) => {
              const finish = (signal: "SIGINT" | "SIGTERM") => {
                process.off("SIGINT", onSigint);
                process.off("SIGTERM", onSigterm);
                resolve(signal);
              };
              const onSigint = () => finish("SIGINT");
              const onSigterm = () => finish("SIGTERM");
              process.once("SIGINT", onSigint);
              process.once("SIGTERM", onSigterm);
            });
          }
          '''
          new_signal = '''function createShutdownSignalLatch(): {
            promise: Promise<BuyVoidProductionPrivateServicesOperatorShutdownTriggerV1>;
            dispose: () => void;
          } {
            let settled = false;
            let resolveSignal!: (
              signal: BuyVoidProductionPrivateServicesOperatorShutdownTriggerV1,
            ) => void;
            const promise = new Promise<BuyVoidProductionPrivateServicesOperatorShutdownTriggerV1>(
              (resolve) => {
                resolveSignal = resolve;
              },
            );
            function dispose(): void {
              process.off("SIGINT", onSigint);
              process.off("SIGTERM", onSigterm);
            }
            function finish(signal: "SIGINT" | "SIGTERM"): void {
              if (settled) return;
              settled = true;
              dispose();
              resolveSignal(signal);
            }
            function onSigint(): void {
              finish("SIGINT");
            }
            function onSigterm(): void {
              finish("SIGTERM");
            }
            process.once("SIGINT", onSigint);
            process.once("SIGTERM", onSigterm);
            return { promise, dispose };
          }
          '''
          if cli.count(old_signal) != 1:
              raise SystemExit("unexpected CLI signal source shape")
          cli = cli.replace(old_signal, new_signal, 1)

          old_main_start = '''async function main(): Promise<void> {
            const args = parseArgs(process.argv.slice(2));
            const result = await runBuyVoidProductionPrivateServicesOperatorV1({
          '''
          new_main_start = '''async function main(): Promise<void> {
            const args = parseArgs(process.argv.slice(2));
            const signalLatch = args.apply ? createShutdownSignalLatch() : null;
            let result;
            try {
              result = await runBuyVoidProductionPrivateServicesOperatorV1({
          '''
          if cli.count(old_main_start) != 1:
              raise SystemExit("unexpected CLI main start shape")
          cli = cli.replace(old_main_start, new_main_start, 1)

          old_call_end = '''    broadcaster_activation_confirmation: args.broadcasterActivationConfirmation,
            });
          
            console.log(JSON.stringify(result.decision, null, 2));
          
            if (!result.decision.ok) {
              process.exitCode = result.decision.residual_service_state ? 3 : 2;
              return;
            }
            if (result.decision.status === "planned") return;
          '''
          new_call_end = '''        broadcaster_activation_confirmation: args.broadcasterActivationConfirmation,
              });
            } catch (error) {
              signalLatch?.dispose();
              throw error;
            }
          
            console.log(JSON.stringify(result.decision, null, 2));
          
            if (!result.decision.ok) {
              signalLatch?.dispose();
              process.exitCode = result.decision.residual_service_state ? 3 : 2;
              return;
            }
            if (result.decision.status === "planned") {
              signalLatch?.dispose();
              return;
            }
          '''
          if cli.count(old_call_end) != 1:
              raise SystemExit("unexpected CLI activation call tail")
          cli = cli.replace(old_call_end, new_call_end, 1)

          old_wait = '''  const signal = await waitForShutdownSignal();
            const shutdown = await result.session.stop(signal);
            console.log(JSON.stringify(shutdown, null, 2));
          '''
          new_wait = '''  if (!signalLatch) {
              throw new Error("production_private_services_operator_signal_latch_missing");
            }
            const signal = await signalLatch.promise;
            const shutdown = await result.session.stop(signal);
            signalLatch.dispose();
            console.log(JSON.stringify(shutdown, null, 2));
          '''
          if cli.count(old_wait) != 1:
              raise SystemExit("unexpected CLI wait shape")
          cli = cli.replace(old_wait, new_wait, 1)
          cli_path.write_text(cli)

          proof_path = Path("scripts/prove_buy_void_production_private_services_operator_v1.ts")
          proof = proof_path.read_text()
          old_thrown = '''assert.equal(thrown.decision.side_effect_state_known, false);
          
          const contradictory = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          new_thrown = '''assert.equal(thrown.decision.side_effect_state_known, false);
          assert.equal(thrown.decision.residual_service_state, true);
          
          const contradictoryCleanupOrder: string[] = [];
          const contradictory = await runBuyVoidProductionPrivateServicesOperatorV1(
          '''
          if proof.count(old_thrown) != 1:
              raise SystemExit("unexpected thrown proof shape")
          proof = proof.replace(old_thrown, new_thrown, 1)

          old_contradictory_services = '''      ...startedActivation({
                broadcaster: { stop: async () => {} },
                custodian: { stop: async () => {} },
              }),
          '''
          new_contradictory_services = '''      ...startedActivation({
                broadcaster: {
                  stop: async () => { contradictoryCleanupOrder.push("broadcaster"); },
                },
                custodian: {
                  stop: async () => { contradictoryCleanupOrder.push("custodian"); },
                },
              }),
          '''
          if proof.count(old_contradictory_services) != 1:
              raise SystemExit("unexpected contradictory services proof shape")
          proof = proof.replace(old_contradictory_services, new_contradictory_services, 1)

          old_contradictory_assert = '''assert.equal(contradictory.decision.money_movement_performed, true);
          
          assert.equal(VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.daemonize, false);
          '''
          new_contradictory_assert = '''assert.equal(contradictory.decision.money_movement_performed, true);
          assert.equal(contradictory.decision.residual_service_state, false);
          assert.equal(contradictory.session, null);
          assert.deepEqual(contradictoryCleanupOrder, ["broadcaster", "custodian"]);
          
          assert.equal(VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_OPERATOR_AUTHORITY_V1.daemonize, false);
          '''
          if proof.count(old_contradictory_assert) != 1:
              raise SystemExit("unexpected contradictory assertion proof shape")
          proof = proof.replace(old_contradictory_assert, new_contradictory_assert, 1)

          old_source_assert = '''assert.doesNotMatch(operatorSource, /buyVoidSubmitPreparedTransactionFromOpaqueCustodyV1/);
          for (const forbiddenFlag of [
          '''
          new_source_assert = '''assert.doesNotMatch(operatorSource, /buyVoidSubmitPreparedTransactionFromOpaqueCustodyV1/);
          assert.doesNotMatch(operatorSource, /catch\\s*\\{\\s*\\}/);
          for (const forbiddenFlag of [
          '''
          if proof.count(old_source_assert) != 1:
              raise SystemExit("unexpected source guard proof shape")
          proof = proof.replace(old_source_assert, new_source_assert, 1)

          old_signal_assert = '''assert.match(cliSource, /process\\.once\\("SIGINT"/);
          assert.match(cliSource, /process\\.once\\("SIGTERM"/);
          
          process.stdout.write(`${JSON.stringify({
          '''
          new_signal_assert = '''assert.match(cliSource, /process\\.once\\("SIGINT"/);
          assert.match(cliSource, /process\\.once\\("SIGTERM"/);
          const latchCall = cliSource.indexOf(
            "const signalLatch = args.apply ? createShutdownSignalLatch() : null",
          );
          const activationCall = cliSource.indexOf(
            "await runBuyVoidProductionPrivateServicesOperatorV1",
          );
          assert.ok(latchCall >= 0 && activationCall > latchCall);
          
          process.stdout.write(`${JSON.stringify({
          '''
          if proof.count(old_signal_assert) != 1:
              raise SystemExit("unexpected CLI signal assertion proof shape")
          proof = proof.replace(old_signal_assert, new_signal_assert, 1)
          proof_path.write_text(proof)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused compile and proof
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_preflight_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_rpc_readiness_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
          npm run typecheck
          npm run build
          git diff --check
      - name: Publish repaired prepared branch and remove helper
        shell: bash
        env:
          TARGET_BRANCH: feat/buy-void-production-private-services-foreground-operator-v1-20260808
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tmp-pr1128-private-services-operator-hardening-v1.yml
          git add -- \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden production private-services operator lifecycle"
          git push origin "HEAD:${TARGET_BRANCH}"
