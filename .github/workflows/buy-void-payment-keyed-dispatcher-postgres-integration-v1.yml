name: Buy VOID payment-keyed dispatcher PostgreSQL integration v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-integration-v1.yml"
      - "schemas/buy-void-payment-keyed-dispatcher-postgres-v1.sql"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_integration_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-store-v1.md"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-integration-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-integration-v1.yml"
      - "schemas/buy-void-payment-keyed-dispatcher-postgres-v1.sql"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_integration_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-store-v1.md"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-integration-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: void_dispatcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d void_dispatcher_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      VOID_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/void_dispatcher_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install isolated PostgreSQL test client
        run: |
          set -euo pipefail
          npm install \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            pg@8.16.3
          git diff --exit-code -- package.json package-lock.json

      - name: Static schema and adapter proof
        run: |
          set -euo pipefail
          node --import tsx \
            scripts/prove_buy_void_payment_keyed_dispatcher_postgres_integration_v1.ts \
            --static
          node --import tsx \
            scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts

      - name: Real PostgreSQL adapter integration
        run: |
          set -euo pipefail
          node --import tsx \
            scripts/prove_buy_void_payment_keyed_dispatcher_postgres_integration_v1.ts \
            --real

      - name: Repository regression gates
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_v1.ts
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
          git diff --check
