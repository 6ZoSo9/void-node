name: VOID Buy user manager private peer guard v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_peer_guard_v1.mjs"
      - "docs/architecture/buy-void-user-manager-private-peer-guard-v1.md"
      - ".github/workflows/buy-void-user-manager-private-peer-guard-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_peer_guard_v1.mjs"
      - "docs/architecture/buy-void-user-manager-private-peer-guard-v1.md"
      - ".github/workflows/buy-void-user-manager-private-peer-guard-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Compile and prove native peer guard
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_void_user_manager_private_peer_guard_v1.mjs |
            tee "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_PEER_GUARD_V1_PROOF_GREEN' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'root_kernel_manager_selection_required=true' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'systemd_private_socket_so_peercred_required=true' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'generic_user_bus_authority=false' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'complete_user_manager_attestation=false' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/user-manager-peer.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/user-manager-peer.log"
      - run: git diff --check
