name: VOID P2P direct upgrade runtime v1

on:
  pull_request:
    paths:
      - "src/node_core.ts"
      - "src/p2p/direct_upgrade_v1.ts"
      - "scripts/prove_void_p2p_direct_upgrade_runtime_v1.ts"
      - "docs/public/void-p2p-direct-upgrade-runtime-v1.md"
      - ".github/workflows/void-p2p-direct-upgrade-runtime-v1.yml"
      - "src/p2p/relay_v1.ts"
      - "scripts/lib/void_p2p_direct_upgrade_contract_v1.mjs"
      - "scripts/lib/void_p2p_reachability_classification_contract_v1.mjs"
  push:
    branches: [main]
    paths:
      - "src/node_core.ts"
      - "src/p2p/direct_upgrade_v1.ts"
      - "scripts/prove_void_p2p_direct_upgrade_runtime_v1.ts"
      - "docs/public/void-p2p-direct-upgrade-runtime-v1.md"
      - ".github/workflows/void-p2p-direct-upgrade-runtime-v1.yml"
      - "src/p2p/relay_v1.ts"
      - "scripts/lib/void_p2p_direct_upgrade_contract_v1.mjs"
      - "scripts/lib/void_p2p_reachability_classification_contract_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-direct-upgrade-runtime-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx --no-install tsx scripts/prove_void_p2p_direct_upgrade_runtime_v1.ts
      - run: npx --no-install tsx scripts/prove_void_p2p_relay_reservation_v1.ts
      - run: node scripts/prove_void_p2p_direct_upgrade_contract_v1.mjs
      - run: node scripts/prove_void_p2p_reachability_classification_contract_v1.mjs
      - run: npx --no-install tsx scripts/prove_void_p2p_multipath_address_v1.ts
      - run: npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts
      - run: npx --no-install tsx scripts/prove_void_p2p_verified_peer_cache_reconnect_v1.ts
      - run: git diff --check
