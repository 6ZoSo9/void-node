name: VOID Buy VOID allocation reservation plain-data boundary v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_plain_data_v1.ts"
      - ".github/workflows/buy-void-allocation-reservation-plain-data-v1.yml"
      - "docs/architecture/buy-void-allocation-reservation-plain-data-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-plain-data-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact current PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove exact-head checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build source-only repository
        run: npm run build
      - name: Preserve original full reservation ledger contract
        run: node --import tsx scripts/prove_buy_void_allocation_reservation_ledger_v1.ts
      - name: Reject getters proxies and ambient toJSON, preserve exact replay
        run: |
          set -euo pipefail
          node --import tsx scripts/prove_buy_void_allocation_reservation_plain_data_v1.ts \
            | tee "allocation-plain-data-${{ matrix.node }}.txt"
          grep -Fx 'VOID_BUY_VOID_ALLOCATION_LEDGER_PLAIN_DATA_V1_GREEN' \
            "allocation-plain-data-${{ matrix.node }}.txt"
          grep -Fx 'canonical_record_jsonl_unchanged=true' \
            "allocation-plain-data-${{ matrix.node }}.txt"
          grep -Fx 'ambient_Object_toJSON_executed=false' \
            "allocation-plain-data-${{ matrix.node }}.txt"
          grep -Fx 'top_level_proxy_traps_executed=false' \
            "allocation-plain-data-${{ matrix.node }}.txt"
          grep -Fx 'production_allocation_mutation_ready=false' \
            "allocation-plain-data-${{ matrix.node }}.txt"
      - name: Upload reviewed local-only proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-allocation-plain-data-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: allocation-plain-data-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Committed source change hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [source-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact three independent proof receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-allocation-plain-data-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./plain-data-receipts
      - name: Require byte-identical Node 22 24 26 results
        run: |
          set -euo pipefail
          for n in 22 24 26; do
            test -s "plain-data-receipts/allocation-plain-data-$n.txt"
          done
          cmp plain-data-receipts/allocation-plain-data-22.txt plain-data-receipts/allocation-plain-data-24.txt
          cmp plain-data-receipts/allocation-plain-data-22.txt plain-data-receipts/allocation-plain-data-26.txt
          echo "VOID_BUY_VOID_ALLOCATION_LEDGER_PLAIN_DATA_CROSS_NODE_GREEN"
          echo "runtime_mounted=false"
          echo "funds_moved=false"
