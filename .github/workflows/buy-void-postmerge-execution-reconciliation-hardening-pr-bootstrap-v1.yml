name: Buy VOID postmerge execution reconciliation hardening PR bootstrap v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/buy-void-postmerge-execution-reconciliation-hardening-pr-bootstrap-v1.yml"
      - "scripts/patch_buy_void_postmerge_execution_reconciliation_hardening_v1.py"

permissions:
  contents: write

concurrency:
  group: buy-void-postmerge-execution-reconciliation-hardening-pr-bootstrap-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'fix/buy-void-postmerge-execution-reconciliation-hardening-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Guard inputs, reconcile main, and import immutable native hardening
        id: guard
        shell: bash
        env:
          EXPECTED_BRANCH: fix/buy-void-postmerge-execution-reconciliation-hardening-v1-20260809
          MERGED_OPERATOR_BASE: 96e995b4ee924ee89122dce29e4aa9eb1756ea0e
          NATIVE_FIX_COMMIT: 71b24f94861618363493d164ed6a803cd924c41c
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

          git fetch --no-tags origin main
          start_main="$(git rev-parse origin/main)"
          echo "start_main=$start_main"
          git merge-base --is-ancestor "$MERGED_OPERATOR_BASE" "$start_main"

          semantic=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )
          git diff --quiet "$MERGED_OPERATOR_BASE" "$start_main" -- "${semantic[@]}"

          git fetch --no-tags origin "$NATIVE_FIX_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$NATIVE_FIX_COMMIT"
          git merge-base --is-ancestor "$MERGED_OPERATOR_BASE" "$NATIVE_FIX_COMMIT"
          mapfile -t native_changed < <(git diff --name-only "$MERGED_OPERATOR_BASE...$NATIVE_FIX_COMMIT" | sort)
          native_expected=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )
          mapfile -t native_expected_sorted < <(printf '%s\n' "${native_expected[@]}" | sort)
          test "${#native_changed[@]}" -eq 5
          for i in "${!native_expected_sorted[@]}"; do
            test "${native_changed[$i]}" = "${native_expected_sorted[$i]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "$start_main"
          git checkout "$NATIVE_FIX_COMMIT" -- "${native_expected[@]}"
          echo "start_main=$start_main" >> "$GITHUB_OUTPUT"

      - name: Apply exact post-merge hardening patch
        run: python3 scripts/patch_buy_void_postmerge_execution_reconciliation_hardening_v1.py

      - name: Verify exact working semantic scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'changed=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 7
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_native_execution_runtime_v1.ts \
            scripts/buy_void_production_native_execution_operator_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_v1.ts \
            scripts/prove_buy_void_production_native_execution_operator_v1.ts \
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts

      - name: Prove native execution hardening wall
        shell: bash
        run: |
          set -euo pipefail
          for proof in \
            scripts/prove_buy_void_production_native_execution_operator_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_guard_v1.ts \
            scripts/prove_buy_void_native_execution_worker_v1.ts \
            scripts/prove_buy_void_native_execution_nonce_fee_planner_v1.ts \
            scripts/prove_buy_void_delivery_submission_guard_v1.ts \
            scripts/prove_buy_void_production_preflight_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_activation_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts \
            scripts/prove_buy_void_runtime_integration_v1.ts \
            scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts
          do
            echo "proof=$proof"
            npx --no-install tsx "$proof"
          done

      - name: Prove broadcast reconciliation hardening wall
        shell: bash
        run: |
          set -euo pipefail
          for proof in \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_runtime_v1.ts \
            scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts \
            scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts \
            scripts/prove_buy_void_runtime_integration_v1.ts
          do
            echo "proof=$proof"
            npx --no-install tsx "$proof"
          done

      - name: Typecheck and build repository
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Commit proven semantic repair and publish non-force
        shell: bash
        env:
          START_MAIN: ${{ steps.guard.outputs.start_main }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- \
            docs/operators/buy-void-production-native-execution-operator-v1.md \
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/buy_void_production_native_execution_operator_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_v1.ts \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_production_native_execution_operator_v1.ts \
            src/economic/buy_void_native_execution_runtime_v1.ts
          test -z "$(git diff --name-only)"
          git commit -m "fix: harden Buy VOID post-merge execution boundaries"

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_head="$(git ls-remote origin "refs/heads/$PR_HEAD_BRANCH" | awk '{print $1}')"
          echo "remote_main_before_push=$remote_main"
          echo "start_main=$START_MAIN"
          echo "remote_head_before_push=$remote_head"
          echo "pr_head_before_run=$PR_HEAD_SHA"
          test "$remote_main" = "$START_MAIN"
          test "$remote_head" = "$PR_HEAD_SHA"

          git push origin "HEAD:refs/heads/$PR_HEAD_BRANCH"
          echo "VOID_BUY_VOID_POSTMERGE_EXECUTION_RECONCILIATION_HARDENING_V2_GREEN"
          echo "production_operator_invocation_performed=false"
          echo "production_credential_access_performed=false"
          echo "real_signing_performed=false"
          echo "real_transaction_broadcast_performed=false"
          echo "inventory_mutation_performed=false"
          echo "money_movement_performed=false"
