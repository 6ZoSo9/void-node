name: VOID Buy VOID protected V2 receipt publisher

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "docs/operators/buy-void-source-finality-live-process-binding-v2-receipt-publish-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-binding-v2-receipt-publish-v1.yml"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "docs/operators/buy-void-source-finality-live-process-binding-v2-receipt-publish-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-binding-v2-receipt-publish-v1.yml"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and prove publisher
        run: |
          set -euo pipefail
          npm run typecheck
          node --import "file://$PWD/node_modules/tsx/dist/loader.mjs"             scripts/prove_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts |
            tee "$RUNNER_TEMP/v2-publisher.log"
          grep -Fx 'VOID_BUY_VOID_V2_LIVE_PROCESS_RECEIPT_PUBLISHER_V1_PROOF_GREEN' "$RUNNER_TEMP/v2-publisher.log"
          grep -Fx 'generation_recheck_before_and_after_publication=true' "$RUNNER_TEMP/v2-publisher.log"
          grep -Fx 'stale_new_receipt_exact_rollback=true' "$RUNNER_TEMP/v2-publisher.log"
          grep -Fx 'systemctl_user_selector_authority=false' "$RUNNER_TEMP/v2-publisher.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/v2-publisher.log"
      - name: Root create-once fixture
        if: matrix.node == 24
        run: |
          set -euo pipefail
          nodebin="$(command -v node)"
          sudo env PATH=/usr/bin:/bin HOME=/root LANG=C LC_ALL=C TZ=UTC             "$nodebin" --import "file://$PWD/node_modules/tsx/dist/loader.mjs"             scripts/prove_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts             --root-fixture |
            tee "$RUNNER_TEMP/v2-publisher-root.log"
          grep -Fx 'root_create_once_and_exact_rollback=true' "$RUNNER_TEMP/v2-publisher-root.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/v2-publisher-root.log"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}"
          git diff --check "$BASE" "$HEAD"
