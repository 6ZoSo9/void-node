name: Buy VOID public edge POST proxy v1

on:
  pull_request:
    paths:
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_buy_void_public_edge_post_proxy_v1.mjs"
      - "docs/operators/buy-void-public-edge-post-proxy-v1.md"
      - ".github/workflows/buy-void-public-edge-post-proxy-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_buy_void_public_edge_post_proxy_v1.mjs"
      - "docs/operators/buy-void-public-edge-post-proxy-v1.md"
      - ".github/workflows/buy-void-public-edge-post-proxy-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: bounded checkout edge / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check ops/public/void-public-app-composition-gateway-v1.mjs
      - run: node --check scripts/prove_buy_void_public_edge_post_proxy_v1.mjs
      - run: node scripts/prove_buy_void_public_edge_post_proxy_v1.mjs
      - run: test -z "$(git status --porcelain=v1)"
