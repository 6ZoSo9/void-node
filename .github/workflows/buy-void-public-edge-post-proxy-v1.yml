name: Buy VOID public edge POST proxy v1

on:
  pull_request:
    paths:
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_buy_void_public_edge_post_proxy_v1.mjs"
      - "docs/operators/buy-void-public-edge-post-proxy-v1.md"
      - ".github/workflows/buy-void-public-edge-post-proxy-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_buy_void_public_edge_post_proxy_v1.mjs"
      - "docs/operators/buy-void-public-edge-post-proxy-v1.md"
      - ".github/workflows/buy-void-public-edge-post-proxy-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/prove_buy_void_public_edge_post_proxy_v1.mjs
