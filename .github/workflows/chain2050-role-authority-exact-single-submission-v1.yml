name: chain2050-role-authority-exact-single-submission-v1

on:
  pull_request:
    paths:
      - "tools/chain2050-role-authority-exact-single-submission-v1.mjs"
      - "scripts/prove_chain2050_role_authority_exact_single_submission_v1.mjs"
      - "docs/security/chain2050-role-authority-exact-single-submission-v1.md"
      - ".github/workflows/chain2050-role-authority-exact-single-submission-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Prove durable exact single submission
        run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_exact_single_submission_v1.mjs | tee "$RUNNER_TEMP/exact-single-submission.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_EXACT_SINGLE_SUBMISSION_V1_GREEN' "$RUNNER_TEMP/exact-single-submission.log"
          grep -Fx 'durable_submission_intent_before_rpc=true' "$RUNNER_TEMP/exact-single-submission.log"
          grep -Fx 'eth_sendRawTransaction_maximum_invocations_per_attempt=1' "$RUNNER_TEMP/exact-single-submission.log"
          grep -Fx 'automatic_retry=false' "$RUNNER_TEMP/exact-single-submission.log"
          grep -Fx 'replacement_transaction=false' "$RUNNER_TEMP/exact-single-submission.log"
      - name: Diff hygiene
        run: git diff --check
