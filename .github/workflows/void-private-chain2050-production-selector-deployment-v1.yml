name: VOID private Chain-2050 production selector deployment v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-private-chain2050-production-selector-deployment-v1.yml"
      - "docs/operations/void-private-chain2050-production-selector-deployment-v1.md"
      - "ops/mainnet0/void-private-chain2050-production-selector-deployment-v1.json"
      - "ops/systemd/user/void-private-chain2050-rpc-selected-durable-v1.service.example"
      - "scripts/prove_void_private_chain2050_production_selector_deployment_v1.mjs"
      - "scripts/prove_void_private_chain2050_anvil_executable_binding_v1.mjs"
      - "ops/mainnet0/mainnet0-start-8545-selected-durable-state.sh"
      - "tools/void-private-chain2050-startup-integration-v1.mjs"
      - "tools/void-private-chain2050-startup-selection-v1.mjs"
      - "tools/void-private-chain2050-checkpoint-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-private-chain2050-production-selector-deployment-v1.yml"
      - "docs/operations/void-private-chain2050-production-selector-deployment-v1.md"
      - "ops/mainnet0/void-private-chain2050-production-selector-deployment-v1.json"
      - "ops/systemd/user/void-private-chain2050-rpc-selected-durable-v1.service.example"
      - "scripts/prove_void_private_chain2050_production_selector_deployment_v1.mjs"
      - "scripts/prove_void_private_chain2050_anvil_executable_binding_v1.mjs"
      - "ops/mainnet0/mainnet0-start-8545-selected-durable-state.sh"
      - "tools/void-private-chain2050-startup-integration-v1.mjs"
      - "tools/void-private-chain2050-startup-selection-v1.mjs"
      - "tools/void-private-chain2050-checkpoint-v1.mjs"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax
        run: |
          node --check scripts/prove_void_private_chain2050_production_selector_deployment_v1.mjs
          node --check scripts/prove_void_private_chain2050_anvil_executable_binding_v1.mjs
          node --check scripts/prove_mainnet0_8545_selector_restore_retirement_v1.mjs
          node --check scripts/prove_void_private_chain2050_startup_integration_v1.mjs
          node --check scripts/prove_void_private_chain2050_startup_selection_v1.mjs
          node --check scripts/prove_void_private_chain2050_checkpoint_v1.mjs
          node --check tools/void-private-chain2050-startup-integration-v1.mjs
          bash -n ops/mainnet0/mainnet0-start-8545-selected-durable-state.sh

      - name: Production deployment-shape proof
        run: node scripts/prove_void_private_chain2050_production_selector_deployment_v1.mjs

      - name: Exact Anvil executable binding proof
        run: node scripts/prove_void_private_chain2050_anvil_executable_binding_v1.mjs

      - name: Selector/startup regressions
        run: |
          node scripts/prove_mainnet0_8545_selector_restore_retirement_v1.mjs
          node scripts/prove_void_private_chain2050_startup_selection_v1.mjs
          node scripts/prove_void_private_chain2050_startup_integration_v1.mjs
          node scripts/prove_void_private_chain2050_checkpoint_v1.mjs

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD --
