name: Buy VOID terminal closeout transport hardening bootstrap v5

on:
  pull_request:
    branches: [fix/buy-void-terminal-closeout-plan-binding-v1-20260809]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/buy-void-postmerge-terminal-closeout-hardening-pr-bootstrap-v1.yml"
      - ".github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml"
      - "scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py"
      - "scripts/buy_void_production_terminal_closeout_operator_v1.ts"
      - "scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts"

permissions:
  contents: write

concurrency:
  group: buy-void-terminal-closeout-transport-hardening-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.number == 1158 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/buy-void-postmerge-terminal-closeout-hardening-v1-20260809' &&
      github.base_ref == 'fix/buy-void-terminal-closeout-plan-binding-v1-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact live child and reconcile exact #1159 parent
        id: guard
        shell: bash
        env:
          EXPECTED_PARENT: 3ec97675449b76383557d2e5a198b91fc4e6b7e3
          EXPECTED_OPERATOR_BLOB: 8a9b8a58a66d538c41034b3527fe96a19d134a75
          EXPECTED_PROOF_BLOB: 8b67f3ddf5e16ce1a269f8ae2b1228eaac641e14
          PARENT_BRANCH: fix/buy-void-terminal-closeout-plan-binding-v1-20260809
          CHILD_BRANCH: fix/buy-void-postmerge-terminal-closeout-hardening-v1-20260809
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          live_child="$(git ls-remote origin "refs/heads/$CHILD_BRANCH" | awk '{print $1}')"
          test "$live_child" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PARENT_BRANCH"
          live_parent="$(git rev-parse FETCH_HEAD)"
          test "$live_parent" = "$EXPECTED_PARENT"
          operator_blob="$(git ls-tree "$live_parent" scripts/buy_void_production_terminal_closeout_operator_v1.ts | awk '{print $3}')"
          proof_blob="$(git ls-tree "$live_parent" scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts | awk '{print $3}')"
          test "$operator_blob" = "$EXPECTED_OPERATOR_BLOB"
          test "$proof_blob" = "$EXPECTED_PROOF_BLOB"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          printf '%s\n' \
            .github/workflows/buy-void-postmerge-terminal-closeout-hardening-pr-bootstrap-v1.yml \
            .github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml \
            scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py \
            | sort > /tmp/allowed-carrier-conflicts.txt

          set +e
          git merge --no-ff --no-commit "$live_parent"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > /tmp/unmerged.txt
            test -s /tmp/unmerged.txt
            comm -23 /tmp/unmerged.txt /tmp/allowed-carrier-conflicts.txt > /tmp/unexpected-unmerged.txt
            test ! -s /tmp/unexpected-unmerged.txt
            while IFS= read -r path; do
              git checkout --ours -- "$path"
              git add -- "$path"
            done < /tmp/unmerged.txt
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --name-only "$live_parent" -- | sort > /tmp/reconciled-parent-diff.txt
          diff -u /tmp/allowed-carrier-conflicts.txt /tmp/reconciled-parent-diff.txt
          git diff --check "$live_parent" --
          git commit -m 'Merge exact #1159 terminal plan binding parent'
          test -z "$(git status --porcelain)"
          echo "parent=$live_parent" >> "$GITHUB_OUTPUT"

      - name: Apply transport and canonical-envelope hardening
        run: python3 scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py

      - name: Verify exact semantic working scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            > /tmp/expected-semantic.txt
          git diff --name-only | sort > /tmp/actual-semantic.txt
          diff -u /tmp/expected-semantic.txt /tmp/actual-semantic.txt
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts

      - name: Prove terminal closeout hardening wall
        shell: bash
        run: |
          set -euo pipefail
          for proof in \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_reducer_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_runtime_reducer_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts \
            scripts/prove_buy_void_confirmed_closeout_v1.ts \
            scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_runtime_v1.ts \
            scripts/prove_buy_void_runtime_integration_v1.ts \
            scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts
          do
            echo "proof=$proof"
            npx --no-install tsx "$proof"
          done

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Retire temporary carriers and verify final parent-relative scope
        shell: bash
        env:
          PARENT: ${{ steps.guard.outputs.parent }}
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/buy-void-postmerge-terminal-closeout-hardening-pr-bootstrap-v1.yml \
            .github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml \
            scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py
          git add -- \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts
          git diff --check "$PARENT" --
          printf '%s\n' \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            > /tmp/expected-final.txt
          git diff --name-only "$PARENT" -- | sort > /tmp/actual-final.txt
          diff -u /tmp/expected-final.txt /tmp/actual-final.txt
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

      - name: Guard live refs, commit proven final semantic delta, and publish non-force
        shell: bash
        env:
          EXPECTED_PARENT: ${{ steps.guard.outputs.parent }}
          EXPECTED_CHILD: ${{ github.event.pull_request.head.sha }}
          CHILD_BRANCH: ${{ github.head_ref }}
          PARENT_BRANCH: fix/buy-void-terminal-closeout-plan-binding-v1-20260809
        run: |
          set -euo pipefail
          live_parent="$(git ls-remote origin "refs/heads/$PARENT_BRANCH" | awk '{print $1}')"
          live_child="$(git ls-remote origin "refs/heads/$CHILD_BRANCH" | awk '{print $1}')"
          test "$live_parent" = "$EXPECTED_PARENT"
          test "$live_child" = "$EXPECTED_CHILD"
          git commit -m 'fix: harden Buy VOID terminal closeout transport boundary'
          printf '%s\n' \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            > /tmp/expected-final-commit.txt
          git diff --name-only "$EXPECTED_PARENT"...HEAD | sort > /tmp/actual-final-commit.txt
          diff -u /tmp/expected-final-commit.txt /tmp/actual-final-commit.txt
          git diff --check "$EXPECTED_PARENT"...HEAD
          git push origin "HEAD:refs/heads/$CHILD_BRANCH"
          echo 'VOID_BUY_VOID_TERMINAL_CLOSEOUT_TRANSPORT_HARDENING_V5_GREEN'
          echo 'live_terminal_closeout_performed=false'
          echo 'inventory_consumption_performed=false'
          echo 'public_fulfillment_mutation_performed=false'
          echo 'saga_mutation_performed=false'
          echo 'credential_access_performed=false'
          echo 'signing_performed=false'
          echo 'transaction_broadcast_performed=false'
          echo 'money_movement_performed=false'
