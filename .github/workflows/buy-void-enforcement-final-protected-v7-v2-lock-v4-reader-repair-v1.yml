name: VOID Buy VOID protected V7 V2 lock V4 reader repair V1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove reader-repair lock / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact reader-repair lock generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BASE" = "827b94aabbecb915ab2cf22bba8f178b7d0568bc"
          test "$(git merge-base "827b94aabbecb915ab2cf22bba8f178b7d0568bc" "$EXPECTED_HEAD")" = "827b94aabbecb915ab2cf22bba8f178b7d0568bc"
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            'A	.github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.yml' \
            'A	docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.md' \
            'A	ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.json' \
            'A	scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs' | sort > "$expected"
          git diff --name-status "827b94aabbecb915ab2cf22bba8f178b7d0568bc" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.json)" = "c9e50cebb0735981f946a1afbc4de6d692ced347"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs)" = "025e2905e0a9d56cde7a2954f4c47ff4b33d0c37"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.md)" = "2b82a3a94f06f9d053f581eeb4b22731514e9156"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json)" = "ec00f0c552e600fff38e4998e4beb128c93b481d"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs)" = "3a7401202fee374f2a7da3f5efc0d29976f9792a"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v4.mjs)" = "9de04b5340f904b8886562727d5f9006876b7ec5"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "40c7d21e0f22bc2ffe079f80360af342f4d8a6aa"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json)" = "f1b9d661eb3363e9bf18dbeb3610c659a54219bb"
          git diff --check "827b94aabbecb915ab2cf22bba8f178b7d0568bc" "$EXPECTED_HEAD" --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact reader-repair V4 lock
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs --self-test
          out="$RUNNER_TEMP/lock-v4-reader-repair-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4_reader_repair_v1.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4-reader-repair-v1.json
          test "$(git hash-object "$out")" = "c9e50cebb0735981f946a1afbc4de6d692ced347"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v7-v2-lock-v4-reader-repair-${{ github.event.pull_request.head.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/lock-v4-reader-repair-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v7-v2-lock-v4-reader-repair-${{ github.event.pull_request.head.sha }}-node-*
          merge-multiple: true
          path: lock-v4-reader-repair
      - name: Require Node 22 24 26 equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "lock-v4-reader-repair/lock-v4-reader-repair-$node.json"; done
          cmp lock-v4-reader-repair/lock-v4-reader-repair-22.json lock-v4-reader-repair/lock-v4-reader-repair-24.json
          cmp lock-v4-reader-repair/lock-v4-reader-repair-22.json lock-v4-reader-repair/lock-v4-reader-repair-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const l=JSON.parse(fs.readFileSync("lock-v4-reader-repair/lock-v4-reader-repair-22.json","utf8"));
          assert.equal(l.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V4_READER_REPAIR_V1");
          assert.equal(l.candidate_evidence.git_blob_sha1,"ec00f0c552e600fff38e4998e4beb128c93b481d");
          assert.equal(l.candidate_evidence.candidate_enforcement_set_sha256,"00e8ca31370f9c6c4fa77185ed05a9ed0554e0b2036b6c5f2e937e7839c67b1a");
          assert.equal(l.candidate_identity_lock_evidence_verified,true);
          assert.equal(l.candidate_enforcement_identity_accepted,false);
          assert.equal(l.independent_review_complete,false);
          assert.equal(l.candidate_acceptance_lifecycle_ready,false);
          assert.equal(l.downstream_candidate_v5_derivation_ready,false);
          assert.equal(l.deployed_artifact_generation_verified,false);
          assert.equal(l.runtime_mount_authority,false);
          assert.equal(l.production_source_finality_authority_ready,false);
          assert.equal(l.public_presale_activation,false);
          assert.equal(l.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_LOCK_V4_READER_REPAIR_V1_CROSS_NODE_GREEN");
          NODE
