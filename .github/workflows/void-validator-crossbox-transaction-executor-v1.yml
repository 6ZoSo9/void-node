name: VOID validator crossbox transaction executor v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-validator-crossbox-transaction-executor-v1.yml"
      - "docs/operators/void-validator-crossbox-transaction-executor-v1.md"
      - "scripts/prove_void_validator_crossbox_transaction_executor_v1.mjs"
      - "tools/void-validator-crossbox-transaction-executor-v1.mjs"
      - "tools/void-crossbox-mutation-transaction-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-validator-crossbox-transaction-executor-v1.yml"
      - "docs/operators/void-validator-crossbox-transaction-executor-v1.md"
      - "scripts/prove_void_validator_crossbox_transaction_executor_v1.mjs"
      - "tools/void-validator-crossbox-transaction-executor-v1.mjs"
      - "tools/void-crossbox-mutation-transaction-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax
        run: |
          node --check tools/void-crossbox-mutation-transaction-v1.mjs
          node --check tools/void-validator-crossbox-transaction-executor-v1.mjs
          node --check scripts/prove_void_validator_crossbox_transaction_executor_v1.mjs

      - name: Prove validator transaction journal/replay contract
        run: node scripts/prove_void_validator_crossbox_transaction_executor_v1.mjs

      - name: Authority and integration wall
        shell: bash
        run: |
          set -euo pipefail

          tool="tools/void-validator-crossbox-transaction-executor-v1.mjs"
          proof="scripts/prove_void_validator_crossbox_transaction_executor_v1.mjs"
          doc="docs/operators/void-validator-crossbox-transaction-executor-v1.md"

          grep -F 'source_journal_executor_only: true' "$tool" >/dev/null
          grep -F 'append_only_replay_required: true' "$tool" >/dev/null
          grep -F 'observation_before_recovery_required: true' "$tool" >/dev/null
          grep -F 'fresh_checkpoint_tag_absence_required: true' "$tool" >/dev/null
          grep -F 'restart_if_active' "$tool" >/dev/null
          grep -F 'local:true' "$tool" >/dev/null
          grep -F 'remote:true' "$tool" >/dev/null
          grep -F 'validator_executor_journal_replay_mismatch' "$tool" >/dev/null
          grep -F 'validator_executor_checkpoint_fresh_absence_required' "$tool" >/dev/null

          grep -F 'VOID_VALIDATOR_CROSSBOX_TRANSACTION_EXECUTOR_V1_PROOF_GREEN' "$proof" >/dev/null
          grep -F 'publish_crash_observation_before_retry=true' "$proof" >/dev/null
          grep -F 'inactive_service_preserved=true' "$proof" >/dev/null
          grep -F 'checkpoint_requires_fresh_tag_absence=true' "$proof" >/dev/null

          grep -F 'does **not** edit or execute that shell yet' "$doc" >/dev/null
          grep -F 'grants no live mutation authority' "$doc" >/dev/null

          for forbidden in 'systemctl ' 'ssh ' 'git push' 'git tag ' 'eth_sendRawTransaction'; do
            if grep -F "$forbidden" "$tool" >/dev/null; then
              echo "forbidden execution surface in journal controller: $forbidden" >&2
              exit 1
            fi
          done

      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
