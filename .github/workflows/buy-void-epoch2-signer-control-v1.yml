name: Buy VOID Epoch-2 offline signer control v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-signer-control-v1.yml"
      - "src/economic/buy_void_epoch2_signer_control_v1.ts"
      - "src/economic/buy_void_epoch2_fulfillment_access_list_v1.ts"
      - "scripts/prove_buy_void_epoch2_signer_control_v1.ts"
      - "scripts/void_buy_void_epoch2_signer_control_cli_v1.ts"
      - "docs/operators/buy-void-epoch2-signer-control-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and qualify signer-control proof
        run: |
          set -euo pipefail
          npm run build
          node --import tsx scripts/prove_buy_void_epoch2_signer_control_v1.ts
          git diff --check
