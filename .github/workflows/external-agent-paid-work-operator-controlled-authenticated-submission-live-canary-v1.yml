name: External Agent Paid Work Operator-Controlled Authenticated Submission Live Canary V1

on:
  pull_request:
    paths:
      - ".github/workflows/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.yml"
      - "docs/public-agent/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.md"
      - "examples/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.example.json"
      - "schemas/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.schema.json"
      - "scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts"
      - "scripts/prove_external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts"
      - "scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_prerequisite_v1.ts"
      - "scripts/external_agent_paid_work_authenticated_submission_execution_candidate_v1.ts"
      - "scripts/external_agent_paid_work_authenticated_submission_activation_prerequisite_v1.ts"
      - "tools/void-agent-mcp-authenticated-submission-live-canary-v1.mjs"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.yml"
      - "docs/public-agent/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.md"
      - "examples/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.example.json"
      - "schemas/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.schema.json"
      - "scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts"
      - "scripts/prove_external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts"
      - "scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_prerequisite_v1.ts"
      - "scripts/external_agent_paid_work_authenticated_submission_execution_candidate_v1.ts"
      - "scripts/external_agent_paid_work_authenticated_submission_activation_prerequisite_v1.ts"
      - "tools/void-agent-mcp-authenticated-submission-live-canary-v1.mjs"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate example and schema JSON
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            examples/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.example.json
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            schemas/external-agent-paid-work-operator-controlled-authenticated-submission-live-canary-v1.schema.json

      - name: Static injected-only live-authority scan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          implementation = pathlib.Path(
              "scripts/external_agent_paid_work_operator_controlled_"
              "authenticated_submission_live_canary_v1.ts"
          )
          proof = pathlib.Path(
              "scripts/prove_external_agent_paid_work_operator_controlled_"
              "authenticated_submission_live_canary_v1.ts"
          )
          source = implementation.read_text(encoding="utf-8")
          proof_text = proof.read_text(encoding="utf-8")

          forbidden = {
              "node:http import": r'from\s+["\']node:http["\']',
              "node:https import": r'from\s+["\']node:https["\']',
              "node:net import": r'from\s+["\']node:net["\']',
              "node:tls import": r'from\s+["\']node:tls["\']',
              "node:dns import": r'from\s+["\']node:dns',
              "undici import": r'from\s+["\']undici["\']',
              "axios import": r'from\s+["\']axios["\']',
              "fetch call": r"\bfetch\s*\(",
              "HTTP request call": r"\.request\s*\(",
              "paid-work submit function": r"\bsubmitVoidAiAgentPaidWorkV1\s*\(",
              "token reader": r"\breadPaidWorkTokenFileV1\s*\(",
              "existing live-canary executor": r"\bexecuteCanary\s*\(",
              "official MCP session constructor": r"\bcreateOfficialMcpSession\s*\(",
              "Bearer material": r"Bearer\s+",
              "authorization header literal": r'authorization\s*:\s*[`"\']',
              "credential-file read": (
                  r"readFileSync\s*\(\s*(?:credentialPath|"
                  r"command\.credential_source_path)"
              ),
              "listener call": r"\.listen\s*\(",
              "service control": r"\b(?:systemctl|service\s+(?:start|restart))\b",
              "wallet construction": r"\b(?:privateKey|mnemonic|new\s+Wallet)\b",
          }

          failures = [
              label
              for label, pattern in forbidden.items()
              if re.search(pattern, source, flags=re.IGNORECASE)
          ]

          required = [
              "beginAttempt:",
              "finalizeAttempt:",
              "openCredentialOnce:",
              "closeCredential:",
              "submitOnce:",
              "live execution is disabled by configuration",
              "live submission requires allow_live_submit=true",
              "maximum_attempt_count: 1",
              "automatic_retry: false",
              "hold_manual_reconciliation_no_retry",
              "secret_material_exposed_to_runner: false",
              "credential_path_disclosed: false",
              "manual_reconciliation_required",
          ]
          for literal in required:
              if literal not in source:
                  failures.append(f"missing injected-authority literal: {literal}")

          if "repository_proof_network_access=false" not in proof_text:
              failures.append("proof lacks explicit no-network marker")
          if "repository_proof_real_credential_read=false" not in proof_text:
              failures.append("proof lacks explicit no-real-credential marker")
          if re.search(r'from\s+["\']node:(?:http|https|net|tls|dns)', proof_text):
              failures.append("proof imports a network primitive")

          if failures:
              print("HOLD: static injected-only live-authority scan failed")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)

          print("STATIC_OPERATOR_CONTROLLED_LIVE_CANARY_INJECTED_ONLY_SAFETY_GREEN=true")
          PY

      - name: Run focused proof
        shell: bash
        run: |
          set -Eeuo pipefail
          PROOF_LOG="$RUNNER_TEMP/void-operator-live-canary-proof.txt"
          node node_modules/tsx/dist/cli.mjs \
            scripts/prove_external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts \
            | tee "$PROOF_LOG"
          grep -Fq \
            "VOID_EXTERNAL_AGENT_PAID_WORK_OPERATOR_CONTROLLED_AUTHENTICATED_SUBMISSION_LIVE_CANARY_V1_PROOF_GREEN" \
            "$PROOF_LOG"

      - name: Focused TypeScript no-new-errors check
        shell: bash
        run: |
          set -Eeuo pipefail

          BASELINE_LOG="$RUNNER_TEMP/void-operator-live-canary-baseline-tsc.txt"
          CANDIDATE_LOG="$RUNNER_TEMP/void-operator-live-canary-candidate-tsc.txt"

          COMMON_ARGS=(
            --pretty false
            --noEmit
            --strict
            --target ES2022
            --module NodeNext
            --moduleResolution NodeNext
            --types node
            --skipLibCheck
            scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_prerequisite_v1.ts
          )

          set +e
          node node_modules/typescript/bin/tsc \
            "${COMMON_ARGS[@]}" \
            >"$BASELINE_LOG" 2>&1
          BASELINE_RC=$?

          node node_modules/typescript/bin/tsc \
            "${COMMON_ARGS[@]}" \
            scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts \
            scripts/prove_external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts \
            >"$CANDIDATE_LOG" 2>&1
          CANDIDATE_RC=$?
          set -e

          cat "$BASELINE_LOG"
          cat "$CANDIDATE_LOG"

          python3 - \
            "$BASELINE_LOG" \
            "$BASELINE_RC" \
            "$CANDIDATE_LOG" \
            "$CANDIDATE_RC" <<'PY'
          import json
          import re
          import sys

          baseline_path, baseline_rc, candidate_path, candidate_rc = sys.argv[1:]
          baseline_rc = int(baseline_rc)
          candidate_rc = int(candidate_rc)
          start = re.compile(
              r"^(?P<path>.+?)\((?P<line>\d+),(?P<column>\d+)\): "
              r"error TS(?P<code>\d+): (?P<message>.*)$"
          )

          def parse(path):
              records = []
              current = None
              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  for raw in handle:
                      line = raw.rstrip("\r\n")
                      match = start.match(line)
                      if match:
                          if current is not None:
                              records.append(current)
                          current = {
                              "path": match.group("path"),
                              "line": int(match.group("line")),
                              "column": int(match.group("column")),
                              "code": int(match.group("code")),
                              "message": [match.group("message").strip()],
                          }
                      elif current is not None and line.strip():
                          current["message"].append(line.strip())
              if current is not None:
                  records.append(current)
              for record in records:
                  record["message"] = " ".join(record["message"])
              return sorted(
                  records,
                  key=lambda item: (
                      item["path"], item["line"], item["column"],
                      item["code"], item["message"],
                  ),
              )

          baseline = parse(baseline_path)
          candidate = parse(candidate_path)
          print("baseline_diagnostics=" + json.dumps(baseline, sort_keys=True))
          print("candidate_diagnostics=" + json.dumps(candidate, sort_keys=True))

          if baseline_rc == 0:
              if baseline:
                  raise SystemExit("HOLD: baseline returned zero with diagnostics")
              if candidate_rc != 0 or candidate:
                  raise SystemExit("HOLD: candidate introduced TypeScript diagnostics")
          else:
              if candidate_rc == 0 or candidate != baseline:
                  raise SystemExit("HOLD: candidate diagnostics differ from baseline")

          targets = {
              "scripts/external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts",
              "scripts/prove_external_agent_paid_work_operator_controlled_authenticated_submission_live_canary_v1.ts",
          }
          if any(item["path"] in targets for item in candidate):
              raise SystemExit("HOLD: candidate diagnostics mention a live-canary target")

          print("VOID_EXTERNAL_AGENT_PAID_WORK_OPERATOR_CONTROLLED_AUTHENTICATED_SUBMISSION_LIVE_CANARY_V1_TYPESCRIPT_NO_NEW_ERRORS_GREEN")
          PY

      - name: TypeScript build baseline
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
