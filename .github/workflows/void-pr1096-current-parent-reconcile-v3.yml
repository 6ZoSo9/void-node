name: VOID PR1096 live-parent reconcile v4

on:
  pull_request:
    paths:
      - '.github/workflows/void-pr1096-current-parent-reconcile-v3.yml'
  push:
    branches:
      - 'feat/p2p-udp-swarm-node-control-mount-v1-20260807'
    paths:
      - '.github/workflows/void-pr1096-current-parent-reconcile-v3.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'push' || github.event.pull_request.number == 1096
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Follow exact-feature live parent, reconcile by anchors, prove, self-delete
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feat/p2p-udp-swarm-node-control-mount-v1-20260807'
          BASE_BRANCH='feat/p2p-udp-swarm-authenticated-control-adapter-v1-20260807'
          EXPECTED_PREVIOUS_STAGING_HEAD='9a4036cf5cf9b8109ba5c0590693d1a6e1f91cbf'
          EXPECTED_FEATURE_HEAD='a71a7c92a31b54aac7ad9cbc9d767ff69ec31901'
          TEMP='.github/workflows/void-pr1096-current-parent-reconcile-v3.yml'

          BASE_WORKFLOW='.github/workflows/void-p2p-udp-swarm-authenticated-control-adapter-v1.yml'
          BASE_DOC='docs/public/void-p2p-udp-swarm-authenticated-control-adapter-v1.md'
          BASE_PROOF='scripts/prove_void_p2p_udp_swarm_authenticated_control_adapter_v1.ts'
          BASE_SOURCE='src/p2p/udp_swarm_authenticated_control_adapter_v1.ts'
          EXPECTED_BASE_WORKFLOW_BLOB='1ee9423cca62d657e96879fece43e892898454b5'
          EXPECTED_BASE_DOC_BLOB='170a70e1399948764c0c555ccba3ba04f2a0109b'
          EXPECTED_BASE_PROOF_BLOB='389c18121505971fb9d21ef634b9c66d57bb6458'
          EXPECTED_BASE_SOURCE_BLOB='ff3543fab623a2b8fc2f6083e55c69d96621a5d4'

          STAGING_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREVIOUS_STAGING_HEAD"
          test "$(git diff --name-only "$EXPECTED_FEATURE_HEAD" HEAD)" = "$TEMP"

          git fetch --no-tags origin "$BASE_BRANCH"
          BASE_HEAD="$(git rev-parse FETCH_HEAD)"

          test "$(git rev-parse "$BASE_HEAD:$BASE_WORKFLOW")" = "$EXPECTED_BASE_WORKFLOW_BLOB"
          test "$(git rev-parse "$BASE_HEAD:$BASE_DOC")" = "$EXPECTED_BASE_DOC_BLOB"
          test "$(git rev-parse "$BASE_HEAD:$BASE_PROOF")" = "$EXPECTED_BASE_PROOF_BLOB"
          test "$(git rev-parse "$BASE_HEAD:$BASE_SOURCE")" = "$EXPECTED_BASE_SOURCE_BLOB"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "$BASE_HEAD"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = 'src/node_core.ts'
          fi

          git checkout "$BASE_HEAD" -- src/node_core.ts

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/node_core.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'HOLD: PR1096 {label} anchor count={count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import {\n  VOID_P2P_DIRECT_UPGRADE_EPHEMERAL_PORT_MAX_V1,',
              'import {\n'
              '  normalizeVoidUdpSwarmControlMessageV1,\n'
              '  type VoidUdpSwarmControlMessageV1,\n'
              '} from "./p2p/udp_swarm_control_v1.js";\n'
              'import { VoidUdpSwarmRelayBridgeV1 } from "./p2p/udp_swarm_relay_bridge_v1.js";\n'
              'import {\n'
              '  VoidUdpSwarmAuthenticatedControlAdapterV1,\n'
              '  type VoidUdpSwarmControlDeliveryV1,\n'
              '  type VoidUdpSwarmProbeActionV1,\n'
              '  type VoidUdpSwarmDirectUpgradeOfferActionV1,\n'
              '} from "./p2p/udp_swarm_authenticated_control_adapter_v1.js";\n'
              'import {\n'
              '  VOID_P2P_DIRECT_UPGRADE_EPHEMERAL_PORT_MAX_V1,',
              'swarm imports',
          )
          replace_once(
              '  | VoidRelayControlMessageV1\n  | VoidDirectUpgradeControlMessageV1;',
              '  | VoidRelayControlMessageV1\n'
              '  | VoidUdpSwarmControlMessageV1\n'
              '  | VoidDirectUpgradeControlMessageV1;',
              'wire union',
          )
          replace_once(
              '  relayServer?: boolean;\n  directUpgradeEnabled?: boolean;',
              '  relayServer?: boolean;\n'
              '  udpSwarmRelayEndpoint?: string;\n'
              '  udpSwarmAllowNonPublicEndpoint?: boolean;\n'
              '  directUpgradeEnabled?: boolean;',
              'NodeOpts',
          )
          replace_once(
              '  private relayStreams = new Map<string, RelayLocalStreamV1>();\n\n'
              '  private readonly directUpgradeEnabled: boolean;',
              '  private relayStreams = new Map<string, RelayLocalStreamV1>();\n'
              '  private readonly udpSwarmAllowNonPublicEndpoint: boolean;\n'
              '  private readonly udpSwarmControl: VoidUdpSwarmAuthenticatedControlAdapterV1;\n\n'
              '  private readonly directUpgradeEnabled: boolean;',
              'class fields',
          )
          replace_once(
              '    this.relayServerEnabled = !!opts?.relayServer;\n'
              '    this.directUpgradeEnabled = !!opts?.directUpgradeEnabled;',
              '    this.relayServerEnabled = !!opts?.relayServer;\n'
              '    this.udpSwarmAllowNonPublicEndpoint =\n'
              '      opts?.udpSwarmAllowNonPublicEndpoint === true;\n'
              '    const udpSwarmRelayEndpoint = String(\n'
              '      opts?.udpSwarmRelayEndpoint || "",\n'
              '    ).trim();\n'
              '    if (udpSwarmRelayEndpoint && !this.relayServerEnabled) {\n'
              '      throw new Error(\n'
              '        "UDP swarm relay endpoint requires relayServer=true",\n'
              '      );\n'
              '    }\n'
              '    const udpSwarmRelayBridge = udpSwarmRelayEndpoint\n'
              '      ? new VoidUdpSwarmRelayBridgeV1(\n'
              '          this.relayServerState,\n'
              '          udpSwarmRelayEndpoint,\n'
              '          (nodeId) =>\n'
              '            this.authenticatedDirectPeer(nodeId)?.authenticatedPublicPem,\n'
              '          this.udpSwarmAllowNonPublicEndpoint,\n'
              '        )\n'
              '      : undefined;\n'
              '    this.udpSwarmControl = new VoidUdpSwarmAuthenticatedControlAdapterV1({\n'
              '      localNodeId: this.id,\n'
              '      localPublicPem: this.pubPEM,\n'
              '      localPrivateKey: this.priv,\n'
              '      isStartedRelayClientStream: (relayNodeId, peerNodeId, streamId) => {\n'
              '        const entry = this.relayStreams.get(\n'
              '          this.relayStreamKey(relayNodeId, streamId),\n'
              '        );\n'
              '        return !!entry && entry.started && entry.remote_node_id === peerNodeId;\n'
              '      },\n'
              '      relayBridge: udpSwarmRelayBridge,\n'
              '      allowNonPublicEndpoint: this.udpSwarmAllowNonPublicEndpoint,\n'
              '    });\n'
              '    this.directUpgradeEnabled = !!opts?.directUpgradeEnabled;',
              'constructor',
          )
          replace_once(
              '    observation: VoidP2PReachabilityObservationV1;\n'
              '  }) => void;\n'
              '  onSealed?: (b: Block, sealMs: number) => void;',
              '    observation: VoidP2PReachabilityObservationV1;\n'
              '  }) => void;\n'
              '  onUdpSwarmProbeAction?: (action: VoidUdpSwarmProbeActionV1) => void;\n'
              '  onUdpSwarmDirectUpgradeOffer?: (\n'
              '    action: VoidUdpSwarmDirectUpgradeOfferActionV1,\n'
              '  ) => void;\n'
              '  onSealed?: (b: Block, sealMs: number) => void;',
              'callbacks',
          )
          replace_once(
              '          this.sweepRelayClientState();\n'
              '          this.sweepRelayServerState();\n'
              '          this.sweepDirectUpgradeState();',
              '          this.sweepRelayClientState();\n'
              '          this.sweepRelayServerState();\n'
              '          this.udpSwarmControl.sweep();\n'
              '          this.sweepDirectUpgradeState();',
              'periodic sweep',
          )
          replace_once(
              '    if (isVoidRelayControlTypeV1((msg as any)?.type)) {',
              '    const udpSwarmMessage = normalizeVoidUdpSwarmControlMessageV1(\n'
              '      msg,\n'
              '      this.udpSwarmAllowNonPublicEndpoint,\n'
              '    );\n'
              '    if (udpSwarmMessage) {\n'
              '      this.handleUdpSwarmAuthenticatedControl(peer, udpSwarmMessage);\n'
              '      return;\n'
              '    }\n\n'
              '    if (isVoidRelayControlTypeV1((msg as any)?.type)) {',
              'authenticated message routing',
          )

          methods = '''  private sendUdpSwarmControlDeliveries(
            deliveries: readonly VoidUdpSwarmControlDeliveryV1[],
          ): number {
            let sent = 0;
            for (const delivery of deliveries) {
              const recipient = this.authenticatedDirectPeer(delivery.recipient_node_id);
              if (!recipient) {
                console.warn("VOID_P2P_UDP_SWARM_NODE_CONTROL_V1_DELIVERY_HOLD", {
                  recipient_node_id: delivery.recipient_node_id,
                  reason: "authenticated direct control peer unavailable",
                });
                continue;
              }
              this.sendRaw(recipient, delivery.message);
              sent += 1;
            }
            return sent;
          }

          private handleUdpSwarmAuthenticatedControl(
            peer: Peer,
            message: VoidUdpSwarmControlMessageV1,
          ): void {
            if (peer.transport !== "direct") {
              console.warn("VOID_P2P_UDP_SWARM_NODE_CONTROL_V1_REJECT", {
                peer_id: peer.id,
                reason: "UDP swarm control requires authenticated direct control peer",
              });
              return;
            }
            try {
              const result = this.udpSwarmControl.handleAuthenticatedControl({
                fromNodeId: peer.id,
                message,
              });
              this.sendUdpSwarmControlDeliveries(result.control_deliveries);
              for (const action of result.udp_probe_actions) {
                this.onUdpSwarmProbeAction?.(action);
              }
              if (result.direct_upgrade_offer) {
                this.onUdpSwarmDirectUpgradeOffer?.(result.direct_upgrade_offer);
              }
            } catch (error) {
              const reason = error instanceof Error ? error.message : String(error);
              console.warn("VOID_P2P_UDP_SWARM_NODE_CONTROL_V1_REJECT", {
                peer_id: peer.id,
                message_type: message.type,
                reason,
              });
              if (message.type === "UDP_SWARM_UPGRADE_REQUEST") {
                const rejection = normalizeVoidUdpSwarmControlMessageV1({
                  type: "UDP_SWARM_UPGRADE_REJECT",
                  protocol: 1,
                  request_id: message.request_id,
                  reason: "udp_swarm_upgrade_unavailable",
                });
                if (rejection?.type === "UDP_SWARM_UPGRADE_REJECT") {
                  this.sendRaw(peer, rejection);
                }
              }
            }
          }

          requestUdpSwarmUpgradeV1(
            relayNodeId: string,
            targetNodeId: string,
            streamId: string,
          ): { ok: true; request_id: string } | { ok: false; error: string } {
            const relayPeer = this.authenticatedDirectPeer(relayNodeId);
            if (!relayPeer) return { ok: false, error: "relay_not_authenticated_direct" };
            try {
              const started = this.udpSwarmControl.beginUpgrade({
                relayNodeId,
                targetNodeId,
                streamId,
              });
              if (started.control_delivery.recipient_node_id !== relayNodeId) {
                throw new Error("UDP swarm request delivery relay mismatch");
              }
              this.sendRaw(relayPeer, started.control_delivery.message);
              return { ok: true, request_id: started.request_id };
            } catch (error) {
              return {
                ok: false,
                error: error instanceof Error ? error.message : String(error),
              };
            }
          }

          ingestUdpSwarmRendezvousProbeV1(
            packet: unknown,
            remoteAddress: string,
            remotePort: number,
          ):
            | { ok: true; control_deliveries_sent: number; observation: unknown }
            | { ok: false; error: string } {
            try {
              const result = this.udpSwarmControl.handleRelayUdpProbe({
                packet,
                remoteAddress,
                remotePort,
              });
              const sent = this.sendUdpSwarmControlDeliveries(
                result.control_deliveries,
              );
              return {
                ok: true,
                control_deliveries_sent: sent,
                observation: structuredClone(result.observation),
              };
            } catch (error) {
              return {
                ok: false,
                error: error instanceof Error ? error.message : String(error),
              };
            }
          }

          udpSwarmControlSnapshot() {
            return this.udpSwarmControl.snapshot();
          }

          '''
          replace_once(
              '  private relayStreamKey(relayNodeId: string, streamId: string): string {',
              methods + '  private relayStreamKey(relayNodeId: string, streamId: string): string {',
              'swarm methods',
          )
          replace_once(
              '    this.relayStreams.delete(key);\n'
              '    entry.socket.remoteClose(reason);\n'
              '  }\n\n'
              '  private sendRelayCloseToNode',
              '    this.relayStreams.delete(key);\n'
              '    entry.socket.remoteClose(reason);\n'
              '    this.udpSwarmControl.sweep();\n'
              '  }\n\n'
              '  private sendRelayCloseToNode',
              'relay local stream cleanup',
          )
          replace_once(
              '        const entry = this.relayStreams.get(key);\n'
              '        if (entry?.socket === peer.socket) this.relayStreams.delete(key);',
              '        const entry = this.relayStreams.get(key);\n'
              '        if (entry?.socket === peer.socket) {\n'
              '          this.relayStreams.delete(key);\n'
              '          this.udpSwarmControl.sweep();\n'
              '        }',
              'relay peer transport cleanup',
          )
          replace_once(
              '    if (!peer.handshakeDone || peer.id.startsWith("?-")) return;\n\n'
              '    this.directUpgradeRelayState.removePeer(peer.id);',
              '    if (!peer.handshakeDone || peer.id.startsWith("?-")) return;\n\n'
              '    this.udpSwarmControl.removeAuthenticatedPeer(peer.id);\n\n'
              '    this.directUpgradeRelayState.removePeer(peer.id);',
              'authenticated peer cleanup',
          )

          path.write_text(text)
          PY

          git add src/node_core.ts
          git rm -- "$TEMP"

          actual_scope="$(git diff --name-only "$BASE_HEAD" | sort)"
          expected_scope="$(printf '%s\n' \
            '.github/workflows/void-p2p-udp-swarm-node-control-mount-v1.yml' \
            'docs/public/void-p2p-udp-swarm-node-control-mount-v1.md' \
            'scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts' \
            'src/node_core.ts' | sort)"
          test "$actual_scope" = "$expected_scope"

          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_udp_swarm_authenticated_control_adapter_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_authenticated_relay_udp_rendezvous_bridge_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_relay_reservation_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_public_key_retention_v1.ts
          npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts
          npm run typecheck
          npm run build
          git diff --cached --check "$BASE_HEAD"

          git commit -m 'chore: reconcile UDP swarm Node control mount with live reviewed parent'
          NEW_HEAD="$(git rev-parse HEAD)"

          git fetch --no-tags origin "$BASE_BRANCH" "$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$BASE_HEAD"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$STAGING_HEAD"

          git push origin "HEAD:$BRANCH"
          printf 'PR1096_RECONCILED_HEAD=%s\n' "$NEW_HEAD"
