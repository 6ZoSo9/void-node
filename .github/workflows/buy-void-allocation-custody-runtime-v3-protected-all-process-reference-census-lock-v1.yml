name: VOID Buy custody V3 protected all-process reference census lock v1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.json"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.yml"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact acceptance-lock successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="7792fd3227c36cd7d19906f8966cd7244209cc3a"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.md'
            $'A\tops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.json'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.json)" = \
            "3eacfe0dec5144ba8c1e4c743bf3e8025f58f88a"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v1.py)" = \
            "bf9f50c4627b9d7768c22665b5c0cc0eb60572e1"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v1.md)" = \
            "093da1d1484a20d21c5cd9f9e13089f407f09317"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = \
            "0567991abb05c121722d47485ab9e7410b8b8126"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile proof
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v1.py

      - name: Prove exact acceptance lock
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-protected-allprocref-lock-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_lock_v1.py \
            | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_REFERENCE_CENSUS_LOCK_V1_PROOF_GREEN' "$out"
          for marker in \
            'candidate_source_git_blob_exact=true' \
            'candidate_source_bytes_exact=true' \
            'candidate_source_ascii_only=true' \
            'hosted_focused_run_bound=true' \
            'protected_execution_contract_bound=true' \
            'candidate_source_accepted=true' \
            'source_sha256_freshly_derived=false' \
            'protected_install_authorized=false' \
            'protected_source_installed=false' \
            'live_privileged_census_authorized=false' \
            'live_privileged_census_executed=false' \
            'all_process_reference_absence_proven=false' \
            'fd_table_stability_proven=false' \
            'mapping_set_stability_proven=false' \
            'process_reference_snapshot_race_free=false' \
            'live_at_use_reverification_required=true' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done
          grep -E '^candidate_source_sha256=[0-9a-f]{64}$' "$out"

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
