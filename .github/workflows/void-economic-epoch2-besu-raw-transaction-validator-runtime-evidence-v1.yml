name: VOID economic epoch2 Besu raw transaction validator runtime evidence v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-runtime-evidence-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-runtime-import-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/pom.xml"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/src/main/java/org/voidnetwork/besu/epoch2/VoidEpoch2RawTransactionDomainPlugin.java"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/src/main/resources/META-INF/services/org.hyperledger.besu.plugin.BesuPlugin"
      - "scripts/run_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.sh"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.mjs"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_source_v1.mjs"
      - ".github/workflows/void-economic-epoch2-besu-raw-transaction-validator-runtime-v1.yml"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_evidence_v1.mjs"
      - ".github/workflows/void-economic-epoch2-besu-raw-transaction-validator-runtime-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove canonical hosted runtime evidence
        run: |
          node --check scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_evidence_v1.mjs
          node scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_evidence_v1.mjs

      - name: Diff hygiene
        run: git diff --check
