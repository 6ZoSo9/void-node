name: Buy VOID production activation evidence v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/mainnet0/buy-void-production-activation-evidence-v1.json"
      - "scripts/prove_buy_void_production_activation_evidence_v1.ts"
      - "src/economic/buy_void_payment_keyed_production_configuration_verifier_v1.ts"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "src/economic/buy_void_payment_keyed_transaction_preparation_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - ".github/workflows/buy-void-production-activation-evidence-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/mainnet0/buy-void-production-activation-evidence-v1.json"
      - "scripts/prove_buy_void_production_activation_evidence_v1.ts"
      - "src/economic/buy_void_payment_keyed_production_configuration_verifier_v1.ts"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "src/economic/buy_void_payment_keyed_transaction_preparation_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - ".github/workflows/buy-void-production-activation-evidence-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/prove_buy_void_production_activation_evidence_v1.ts
