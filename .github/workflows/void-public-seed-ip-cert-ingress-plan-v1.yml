name: VOID public seed IP-certificate ingress plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-seed-ip-cert-ingress-plan-v1.yml"
      - "docs/public/public-seed-ip-certificate-ingress-plan-v1.md"
      - "scripts/build_void_public_seed_ip_cert_ingress_plan_v1.mjs"
      - "scripts/prove_void_public_seed_ip_cert_ingress_plan_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-public-seed-ip-cert-ingress-plan-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Prove domain-free IP-certificate ingress contract
        run: |
          node --check scripts/build_void_public_seed_ip_cert_ingress_plan_v1.mjs
          node --check scripts/prove_void_public_seed_ip_cert_ingress_plan_v1.mjs
          node scripts/prove_void_public_seed_ip_cert_ingress_plan_v1.mjs

  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
