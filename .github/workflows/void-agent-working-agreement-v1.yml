name: VOID agent working agreement v1

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "scripts/prove_void_agent_working_agreement_v1.mjs"
      - ".github/workflows/void-agent-working-agreement-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-agent-working-agreement-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check proof syntax
        run: node --check scripts/prove_void_agent_working_agreement_v1.mjs
      - name: Prove repository working agreement
        run: node scripts/prove_void_agent_working_agreement_v1.mjs
