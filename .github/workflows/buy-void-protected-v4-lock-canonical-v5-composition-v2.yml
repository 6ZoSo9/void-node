name: VOID accepted protected V4 lock canonical V5 composition v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-protected-v4-lock-canonical-v5-composition-v2.yml"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
      - "docs/architecture/buy-void-protected-v4-lock-canonical-v5-composition-v2.md"
      - "docs/operations/canonical-producer-source-custody-v1.md"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json"
      - "src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact composition head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout and two-parent restack
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          read -r head repair_parent extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$head" = "$EXPECTED_HEAD"
          test "$repair_parent" = "c1b00b856fb996cad5d5a1d1f84c1bce27a2878c"
          test -z "${extra:-}"
          read -r predecessor p1 p2 extra2 <<<"$(git rev-list --parents -n 1 "$repair_parent")"
          test "$predecessor" = "$repair_parent"
          test "$p1" = "94a07497a1583ec990ac0ca665604bebf570b5e7"
          test "$p2" = "f504843c457403b95b4e9887a190f0677f820c31"
          test -z "${extra2:-}"
          expected_repair=$'.github/workflows/buy-void-protected-v4-lock-canonical-v5-composition-v2.yml\ndocs/architecture/buy-void-protected-v4-lock-canonical-v5-composition-v2.md\nscripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs'
          test "$(git diff --name-only "$repair_parent" HEAD | sort)" = "$(printf '%s\n' "$expected_repair" | sort)"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact composition sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs)" = "0f731f9932d043f6c0eaac8db6cc4eca7673f9c2"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-protected-v4-lock-canonical-v5-composition-v2.md)" = "221bd4b8d7b908b2f893e5301143600952545901"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json)" = "4de9c2185a1359d2877b17958666f91497a91179"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json)" = "ec00f0c552e600fff38e4998e4beb128c93b481d"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs)" = "15c33b8c88db7d31af96bbd50ed4940425ff7417"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4.md)" = "2ef2554fdc0cba8f194c74b2f7c53bf1377e3814"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml)" = "bf4d059202ed62449fbc6cfe62402aaa73b22682"
          test "$(git rev-parse HEAD:ops/run-void-node-live-v1.sh)" = "bc6a17ccdf389299fb139db37e742f0b1ad9dc4e"
          test "$(git rev-parse HEAD:src/index.ts)" = "a09661797aa4295371c036be36d82995e5233269"
          git diff --check "f504843c457403b95b4e9887a190f0677f820c31" HEAD
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/run-void-node-live-v1.sh
          node --check runtime/canonical-producer-self-http-guard-v5.cjs
          node --check scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs
          node --check scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs
          node --check scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs
      - name: Prove canonical V5
        run: node scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs
      - name: Prove accepted-lock composition
        run: node scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs
      - name: Derive deterministic composition receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs --receipt > "$RUNNER_TEMP/composition-v2.json"
          node -e '
            const fs=require("node:fs");
            const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(value.accepted_v4_lock_preserved!==true) process.exit(2);
            if(value.candidate_v5_required!==true) process.exit(3);
            if(value.candidate_v5_accepted!==false) process.exit(4);
            if(value.runtime_cutover_authorized!==false) process.exit(5);
          ' "$RUNNER_TEMP/composition-v2.json"
