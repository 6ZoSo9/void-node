name: VOID Coordination Successor Chain v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-coordination-successor-chain-v1.yml"
      - "tools/void-coordination-successor-chain-v1.mjs"
      - "scripts/prove_void_coordination_successor_chain_v1.mjs"
      - "docs/operations/void-coordination-successor-chain-v1.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-coordination-successor-chain-v1.yml"
      - "tools/void-coordination-successor-chain-v1.mjs"
      - "scripts/prove_void_coordination_successor_chain_v1.mjs"
      - "docs/operations/void-coordination-successor-chain-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_major: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node_major }}
      - name: Syntax
        run: |
          node --check tools/void-coordination-successor-chain-v1.mjs
          node --check scripts/prove_void_coordination_successor_chain_v1.mjs
      - name: Prove successor-chain resolver
        run: node scripts/prove_void_coordination_successor_chain_v1.mjs
