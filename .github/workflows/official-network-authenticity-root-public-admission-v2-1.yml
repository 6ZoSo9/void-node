name: official-network-authenticity-root-public-admission-v2-1

on:
  push:
    paths:
      - ".github/workflows/official-network-authenticity-root-public-admission-v2-1.yml"
      - "config/official-network-authenticity-root-v2-1/**"
      - "docs/legal/OFFICIAL_NETWORK_AUTHENTICITY_ROOT_PUBLIC_ADMISSION_V2_1.md"
      - "schemas/official-network-authenticity-root-admission-v2-1.schema.json"
      - "scripts/prove_official_network_authenticity_root_public_admission_v2_1.mjs"
      - "src/security/official_network_authenticity_root_public_admission_v2_1.ts"
  pull_request:
    paths:
      - ".github/workflows/official-network-authenticity-root-public-admission-v2-1.yml"
      - "config/official-network-authenticity-root-v2-1/**"
      - "docs/legal/OFFICIAL_NETWORK_AUTHENTICITY_ROOT_PUBLIC_ADMISSION_V2_1.md"
      - "schemas/official-network-authenticity-root-admission-v2-1.schema.json"
      - "scripts/prove_official_network_authenticity_root_public_admission_v2_1.mjs"
      - "src/security/official_network_authenticity_root_public_admission_v2_1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/prove_official_network_authenticity_wall_v1.mjs
      - run: node scripts/prove_official_network_authenticity_root_v2.mjs
      - run: node scripts/prove_official_network_identity_mainnet0_correction_v2_1.mjs
      - run: node scripts/prove_official_network_authenticity_root_public_admission_v2_1.mjs
      - run: npm run build
      - run: git diff --check
