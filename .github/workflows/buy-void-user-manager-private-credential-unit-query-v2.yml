name: VOID Buy authenticated credential unit query v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v2.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v2.yml"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v2.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v2.yml"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Compile and prove V2 source contract
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs |
            tee "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V2_PROOF_GREEN' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'v1_source_preserved=true' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'dropin_bound=64' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'loadcredential_bound=32' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'exactly_one_epoch2_credential_required=true' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'duplicate_credential_ids_rejected=true' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'credential_set_generation_stability_required=true' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'protected_install_authorized=false' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'live_query_authorized=false' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/credential-unit-query-v2-proof.log"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
