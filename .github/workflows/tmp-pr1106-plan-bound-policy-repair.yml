name: tmp-pr1106-plan-bound-policy-repair

on:
  push:
    branches:
      - feat/buy-void-production-private-services-activation-v1-20260808

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: stage PR #1106 plan-bound policy repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='2edef6e00ef5dab9b8602b1501ce08117fea2627'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/tmp-pr1106-plan-bound-policy-repair.yml'
      - name: Apply plan-bound policy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/economic/buy_void_production_private_services_activation_v1.ts')
          proof_path = Path('scripts/prove_buy_void_production_private_services_activation_v1.ts')
          docs_path = Path('docs/operators/buy-void-production-private-services-activation-v1.md')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = source_path.read_text()
          source = replace_once(
              source,
              '  all_component_confirmations_checked_before_side_effects: true,\n  production_activation_plan_revalidated: true,\n',
              '  all_component_confirmations_checked_before_side_effects: true,\n  applied_policy_snapshotted_from_validated_plan: true,\n  caller_policy_reuse_after_plan_validation: false,\n  production_activation_plan_revalidated: true,\n',
              'source authority snapshot flags',
          )
          source = replace_once(
              source,
              '''function exact(value: unknown, expected: string): boolean {\n  return typeof value === "string" && value === expected;\n}\n\n''',
              '''function exact(value: unknown, expected: string): boolean {\n  return typeof value === "string" && value === expected;\n}\n\nfunction planBoundPolicy(\n  plan: Readonly<\n    Extract<\n      ReturnType<typeof createBuyVoidProductionActivationPlanV1>,\n      { ok: true }\n    >\n  >,\n): Readonly<BuyVoidProductionActivationPlanPolicyV1> {\n  const rpc = Object.freeze({\n    rpc_url: plan.rpc_url,\n    expected_chain_id: 2050,\n  });\n  const custodian = Object.freeze({\n    socket_path: plan.custodian_socket_path,\n    custody_store_dir: plan.custody_store_dir,\n    credentials_directory: plan.credentials_directory,\n    expected_wallet_address: plan.expected_wallet_address,\n  });\n  const broadcaster = Object.freeze({\n    socket_path: plan.broadcaster_socket_path,\n    custody_store_dir: plan.custody_store_dir,\n    state_dir: plan.broadcaster_state_dir,\n    expected_signer_fingerprint_sha256:\n      plan.expected_signer_fingerprint_sha256,\n    rpc,\n  });\n  return Object.freeze({ custodian, broadcaster });\n}\n\n''',
              'source planBoundPolicy helper',
          )
          source = replace_once(
              source,
              '''  const runReadiness =\n    dependencies.run_rpc_readiness || runBuyVoidProductionRpcReadinessV1;\n''',
              '''  const appliedPolicy = planBoundPolicy(plan);\n\n  const runReadiness =\n    dependencies.run_rpc_readiness || runBuyVoidProductionRpcReadinessV1;\n''',
              'source applied policy snapshot',
          )
          source = replace_once(source, '        policy: input.policy,\n', '        policy: appliedPolicy,\n', 'source readiness policy')
          source = replace_once(source, '        policy: input.policy.custodian,\n', '        policy: appliedPolicy.custodian,\n', 'source custodian policy')
          source = replace_once(source, '        policy: input.policy.broadcaster,\n', '        policy: appliedPolicy.broadcaster,\n', 'source broadcaster policy')
          source_path.write_text(source)

          proof = proof_path.read_text()
          proof = replace_once(
              proof,
              '''    custodian_stop_fails?: boolean;\n    broadcaster_stop_fails?: boolean;\n''',
              '''    custodian_stop_fails?: boolean;\n    broadcaster_stop_fails?: boolean;\n    on_rpc_input?: (input: any) => void;\n    on_custodian_input?: (input: any) => void;\n    on_broadcaster_input?: (input: any) => void;\n''',
              'proof dependency callbacks type',
          )
          proof = replace_once(
              proof,
              '''      assert.equal(input.expected_plan_id_sha256, dry.plan_id_sha256);\n      if (options.rpc === "held") {\n''',
              '''      assert.equal(input.expected_plan_id_sha256, dry.plan_id_sha256);\n      options.on_rpc_input?.(input);\n      if (options.rpc === "held") {\n''',
              'proof rpc callback',
          )
          proof = replace_once(
              proof,
              '''        VOID_BUY_VOID_PREPARED_TRANSACTION_CUSTODIAN_CREDENTIAL_ACTIVATION_CONFIRMATION_V1,\n      );\n      if (options.custodian === "held") {\n''',
              '''        VOID_BUY_VOID_PREPARED_TRANSACTION_CUSTODIAN_CREDENTIAL_ACTIVATION_CONFIRMATION_V1,\n      );\n      options.on_custodian_input?.(input);\n      if (options.custodian === "held") {\n''',
              'proof custodian callback',
          )
          proof = replace_once(
              proof,
              '''        VOID_BUY_VOID_PREPARED_TRANSACTION_BROADCASTER_SUBMISSION_ACTIVATION_CONFIRMATION_V1,\n      );\n      if (options.broadcaster === "held") {\n''',
              '''        VOID_BUY_VOID_PREPARED_TRANSACTION_BROADCASTER_SUBMISSION_ACTIVATION_CONFIRMATION_V1,\n      );\n      options.on_broadcaster_input?.(input);\n      if (options.broadcaster === "held") {\n''',
              'proof broadcaster callback',
          )
          proof = replace_once(
              proof,
              '''resetCounters();\nconst started = await runBuyVoidProductionPrivateServicesActivationV1(\n  authorizedInput,\n  makeDependencies(),\n);\n''',
              '''resetCounters();\nconst mutableCallerPolicy: any = {\n  custodian: { ...policy.custodian },\n  broadcaster: {\n    ...policy.broadcaster,\n    rpc: { ...policy.broadcaster.rpc },\n  },\n};\nconst mutatedCustodianSocket =\n  "/run/void/buy-void/mutated-custodian.sock";\nconst mutatedBroadcasterSocket =\n  "/run/void/buy-void/mutated-broadcaster.sock";\nconst mutatedRpcUrl = "http://127.0.0.1:9545/";\nlet observedCustodianSocket = "";\nlet observedBroadcasterSocket = "";\nlet observedBroadcasterRpcUrl = "";\nconst mutationResistant =\n  await runBuyVoidProductionPrivateServicesActivationV1(\n    { ...authorizedInput, policy: mutableCallerPolicy },\n    makeDependencies({\n      on_rpc_input(input: any) {\n        assert.notEqual(input.policy, mutableCallerPolicy);\n        assert.equal(Object.isFrozen(input.policy), true);\n        assert.equal(Object.isFrozen(input.policy.custodian), true);\n        assert.equal(Object.isFrozen(input.policy.broadcaster), true);\n        assert.equal(Object.isFrozen(input.policy.broadcaster.rpc), true);\n        assert.equal(\n          input.policy.custodian.socket_path,\n          policy.custodian.socket_path,\n        );\n        assert.equal(\n          input.policy.broadcaster.socket_path,\n          policy.broadcaster.socket_path,\n        );\n        assert.equal(\n          input.policy.broadcaster.rpc.rpc_url,\n          policy.broadcaster.rpc.rpc_url,\n        );\n        mutableCallerPolicy.custodian.socket_path = mutatedCustodianSocket;\n        mutableCallerPolicy.broadcaster.socket_path = mutatedBroadcasterSocket;\n        mutableCallerPolicy.broadcaster.rpc.rpc_url = mutatedRpcUrl;\n      },\n      on_custodian_input(input: any) {\n        observedCustodianSocket = input.policy.socket_path;\n      },\n      on_broadcaster_input(input: any) {\n        observedBroadcasterSocket = input.policy.socket_path;\n        observedBroadcasterRpcUrl = input.policy.rpc.rpc_url;\n      },\n    }),\n  );\nassert.equal(mutationResistant.ok, true);\nassert.equal(mutationResistant.status, "started");\nassert.equal(mutableCallerPolicy.custodian.socket_path, mutatedCustodianSocket);\nassert.equal(mutableCallerPolicy.broadcaster.socket_path, mutatedBroadcasterSocket);\nassert.equal(mutableCallerPolicy.broadcaster.rpc.rpc_url, mutatedRpcUrl);\nassert.equal(observedCustodianSocket, policy.custodian.socket_path);\nassert.equal(observedBroadcasterSocket, policy.broadcaster.socket_path);\nassert.equal(observedBroadcasterRpcUrl, policy.broadcaster.rpc.rpc_url);\nassert.equal(readinessCalls, 1);\nassert.equal(custodianStarts, 1);\nassert.equal(broadcasterStarts, 1);\n\nresetCounters();\nconst started = await runBuyVoidProductionPrivateServicesActivationV1(\n  authorizedInput,\n  makeDependencies(),\n);\n''',
              'proof caller-policy mutation test',
          )
          proof = replace_once(
              proof,
              '''assert.equal(\n  VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1\n    .read_only_rpc_probe_before_service_start,\n  true,\n);\n''',
              '''assert.equal(\n  VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1\n    .applied_policy_snapshotted_from_validated_plan,\n  true,\n);\nassert.equal(\n  VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1\n    .caller_policy_reuse_after_plan_validation,\n  false,\n);\nassert.equal(\n  VOID_BUY_VOID_PRODUCTION_PRIVATE_SERVICES_ACTIVATION_AUTHORITY_V1\n    .read_only_rpc_probe_before_service_start,\n  true,\n);\n''',
              'proof authority snapshot assertions',
          )
          proof = replace_once(
              proof,
              '''console.log("component_confirmation_failures_before_side_effects=true");\nconsole.log("rpc_readiness_required_before_service_start=true");\n''',
              '''console.log("component_confirmation_failures_before_side_effects=true");\nconsole.log("validated_plan_policy_snapshot_frozen=true");\nconsole.log("caller_policy_mutation_after_plan_confirmation_changes_targets=false");\nconsole.log("rpc_readiness_required_before_service_start=true");\n''',
              'proof snapshot markers',
          )
          proof_path.write_text(proof)

          docs = docs_path.read_text()
          docs = replace_once(
              docs,
              '''The separate real-transaction confirmation\n`buyVoidSubmitPreparedTransactionFromOpaqueCustodyV1` is not accepted or used by\nthis coordinator. Real submission remains a later independent authority gate.\n\n## Partial-start rollback\n''',
              '''The separate real-transaction confirmation\n`buyVoidSubmitPreparedTransactionFromOpaqueCustodyV1` is not accepted or used by\nthis coordinator. Real submission remains a later independent authority gate.\n\n## Validated-plan snapshot boundary\n\nAfter the plan and all authority echoes validate, the coordinator derives a new\nfrozen activation policy only from normalized values carried by that validated\nplan. The later RPC-readiness, custodian, and broadcaster calls consume that\nplan-bound snapshot rather than re-reading the caller's original policy object.\n\nThis closes the asynchronous policy-mutation window: changing the caller-owned\nobject while the readiness probe is awaiting cannot retarget the custodian\nsocket, broadcaster socket, custody/state/credential paths, signer fingerprint,\nor RPC endpoint after the exact plan ID has already been confirmed.\n\n## Partial-start rollback\n''',
              'docs validated-plan snapshot section',
          )
          docs = replace_once(
              docs,
              '''- exact forwarding of each independent confirmation to its existing primitive;\n- RPC readiness failure before either service starts;\n''',
              '''- exact forwarding of each independent confirmation to its existing primitive;\n- mutation of the caller-owned policy after plan confirmation cannot change any\n  downstream activation target;\n- RPC readiness failure before either service starts;\n''',
              'docs proof snapshot bullet',
          )
          docs_path.write_text(docs)
          PY
      - name: Verify repaired source and proofs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsx scripts/prove_buy_void_production_private_services_activation_v1.ts
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
          npm run typecheck
          npm run build
          git diff --check
      - name: Commit repaired feature files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/economic/buy_void_production_private_services_activation_v1.ts \
            scripts/prove_buy_void_production_private_services_activation_v1.ts \
            docs/operators/buy-void-production-private-services-activation-v1.md
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'fix: bind Buy VOID activation to validated plan snapshot v1'
          git push origin HEAD:feat/buy-void-production-private-services-activation-v1-20260808
