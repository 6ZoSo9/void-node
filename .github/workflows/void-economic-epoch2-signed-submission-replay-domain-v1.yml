name: VOID economic epoch2 signed submission replay domain v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-signed-submission-replay-domain-v1.yml"
      - "tools/void-economic-epoch2-signed-submission-intent-v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_submission_intent_v1.mjs"
      - "ops/mainnet0/economic-epoch2-signed-submission-policy-v1.json"
      - "docs/architecture/economic-epoch2-signed-submission-replay-domain-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-signed-submission-replay-domain-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove Epoch-2 signed submission replay domain
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-signed-submission-intent-v1.mjs
          node --check scripts/prove_void_economic_epoch2_signed_submission_intent_v1.mjs
          node scripts/prove_void_economic_epoch2_signed_submission_intent_v1.mjs
          git diff --exit-code
