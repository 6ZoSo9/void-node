name: public-node-operator-trial-receipt-example

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-receipt-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial receipt example
        run: bash tools/check_public_node_operator_trial_receipt_example_v1.sh
