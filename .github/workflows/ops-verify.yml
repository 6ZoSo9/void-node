name: ops-verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prove local relevant-path detector and PR integration range
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git -C "$TMP" init -q
          git -C "$TMP" config user.name void-ci-proof
          git -C "$TMP" config user.email void-ci-proof@example.invalid
          mkdir -p "$TMP/ops" "$TMP/.github/workflows"
          : > "$TMP/Makefile"
          : > "$TMP/ops/prom-verify.sh"
          : > "$TMP/.github/workflows/ops-verify.yml"
          git -C "$TMP" add .
          git -C "$TMP" commit -q -m base
          BASE="$(git -C "$TMP" rev-parse HEAD)"

          for i in $(seq 1 600); do
            printf 'noise-%s\n' "$i" > "$TMP/noise-$i.txt"
          done
          git -C "$TMP" add .
          git -C "$TMP" commit -q -m noise
          NOISE="$(git -C "$TMP" rev-parse HEAD)"
          git -C "$TMP" diff --quiet "$BASE" "$NOISE" -- \
            Makefile ops/prom-verify.sh .github/workflows/ops-verify.yml

          printf 'changed\n' >> "$TMP/Makefile"
          git -C "$TMP" add Makefile
          git -C "$TMP" commit -q -m relevant
          RELEVANT="$(git -C "$TMP" rev-parse HEAD)"
          if git -C "$TMP" diff --quiet "$BASE" "$RELEVANT" -- \
            Makefile ops/prom-verify.sh .github/workflows/ops-verify.yml; then
            echo "relevant-path detector failed to find Makefile after large noise set" >&2
            exit 1
          fi

          # Prove pull-request attribution against the synthetic integration tree.
          # A is the branch point. B is the current base tip and independently
          # grows Makefile by >30 lines. H leaves Makefile at A but changes a
          # relevant ops path. M integrates B + H. B->M must report relevant
          # because of the ops change while attributing zero Makefile shrink.
          RANGE="$TMP/range-proof"
          git -C "$RANGE" init -q 2>/dev/null || {
            mkdir -p "$RANGE"
            git -C "$RANGE" init -q
          }
          git -C "$RANGE" config user.name void-ci-proof
          git -C "$RANGE" config user.email void-ci-proof@example.invalid
          mkdir -p "$RANGE/ops" "$RANGE/.github/workflows"
          : > "$RANGE/ops/prom-verify.sh"
          : > "$RANGE/.github/workflows/ops-verify.yml"

          write_makefile() {
            local count="$1"
            : > "$RANGE/Makefile"
            for i in $(seq 1 "$count"); do
              printf 'target-%s:\n\t@true\n' "$i" >> "$RANGE/Makefile"
            done
          }

          write_makefile 80
          git -C "$RANGE" add .
          git -C "$RANGE" commit -q -m A
          A="$(git -C "$RANGE" rev-parse HEAD)"

          git -C "$RANGE" checkout -q -b pr-no-shrink "$A"
          printf '# PR relevant change\n' >> "$RANGE/ops/prom-verify.sh"
          git -C "$RANGE" add ops/prom-verify.sh
          git -C "$RANGE" commit -q -m H
          H="$(git -C "$RANGE" rev-parse HEAD)"

          git -C "$RANGE" checkout -q -b base-tip "$A"
          write_makefile 120
          git -C "$RANGE" add Makefile
          git -C "$RANGE" commit -q -m B
          B="$(git -C "$RANGE" rev-parse HEAD)"
          git -C "$RANGE" merge -q --no-ff -m M pr-no-shrink
          M="$(git -C "$RANGE" rev-parse HEAD)"

          mapfile -t M_PARENTS < <(
            git -C "$RANGE" cat-file -p "$M" | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
          )
          [ "${#M_PARENTS[@]}" -eq 2 ]
          [ "${M_PARENTS[0]}" = "$B" ]
          [ "${M_PARENTS[1]}" = "$H" ]

          if git -C "$RANGE" diff --quiet "$B" "$M" -- \
            Makefile ops/prom-verify.sh .github/workflows/ops-verify.yml; then
            echo "synthetic integration detector missed PR-owned ops change" >&2
            exit 1
          fi

          B_LINES="$(git -C "$RANGE" show "$B:Makefile" | wc -l | tr -d ' ')"
          M_LINES="$(git -C "$RANGE" show "$M:Makefile" | wc -l | tr -d ' ')"
          [ "$B_LINES" -eq "$M_LINES" ] || {
            echo "upstream-only Makefile growth was incorrectly attributed to PR integration" >&2
            exit 1
          }

          H_LINES="$(git -C "$RANGE" show "$H:Makefile" | wc -l | tr -d ' ')"
          DIRECT_FALSE_DELTA=$((B_LINES-H_LINES))
          [ "$DIRECT_FALSE_DELTA" -gt 30 ] || {
            echo "synthetic base-tip -> PR-head control did not reproduce false shrink" >&2
            exit 1
          }

          # A real multi-commit PR shrink must still fail against the integration
          # result even when its final commit stops touching Makefile.
          git -C "$RANGE" checkout -q -b pr-shrink "$B"
          write_makefile 20
          git -C "$RANGE" add Makefile
          git -C "$RANGE" commit -q -m shrink
          printf '# later relevant change\n' >> "$RANGE/ops/prom-verify.sh"
          git -C "$RANGE" add ops/prom-verify.sh
          git -C "$RANGE" commit -q -m later-relevant
          SHRINK_H="$(git -C "$RANGE" rev-parse HEAD)"

          LAST_BEFORE="$(git -C "$RANGE" show "$SHRINK_H~1:Makefile" | wc -l | tr -d ' ')"
          LAST_AFTER="$(git -C "$RANGE" show "$SHRINK_H:Makefile" | wc -l | tr -d ' ')"
          [ "$LAST_BEFORE" -eq "$LAST_AFTER" ] || {
            echo "synthetic last-commit control unexpectedly changed Makefile" >&2
            exit 1
          }

          git -C "$RANGE" checkout -q -b base-shrink "$B"
          git -C "$RANGE" merge -q --no-ff -m shrink-integration pr-shrink
          SHRINK_M="$(git -C "$RANGE" rev-parse HEAD)"
          mapfile -t SHRINK_M_PARENTS < <(
            git -C "$RANGE" cat-file -p "$SHRINK_M" | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
          )
          [ "${#SHRINK_M_PARENTS[@]}" -eq 2 ]
          [ "${SHRINK_M_PARENTS[0]}" = "$B" ]
          [ "${SHRINK_M_PARENTS[1]}" = "$SHRINK_H" ]

          SHRINK_BEFORE="$(git -C "$RANGE" show "$B:Makefile" | wc -l | tr -d ' ')"
          SHRINK_AFTER="$(git -C "$RANGE" show "$SHRINK_M:Makefile" | wc -l | tr -d ' ')"
          SHRINK_DELTA=$((SHRINK_BEFORE-SHRINK_AFTER))
          [ "$SHRINK_DELTA" -gt 30 ] || {
            echo "synthetic integration shrink did not exceed 30-line threshold" >&2
            exit 1
          }

      - name: Detect relevant ops verification changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"

          fail_open() {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Unable to establish the exact event integration range; running guards fail-open."
            exit 0
          }

          ACTUAL_HEAD="$(git rev-parse HEAD 2>/dev/null)" || fail_open
          [ -n "${CHECKOUT_SHA:-}" ] || fail_open
          [ "$ACTUAL_HEAD" = "$CHECKOUT_SHA" ] || fail_open

          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "${PR_HEAD_SHA:-}" ] || fail_open
            mapfile -t CHECKOUT_PARENTS < <(
              git cat-file -p "$CHECKOUT_SHA" 2>/dev/null | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
            )
            [ "${#CHECKOUT_PARENTS[@]}" -eq 2 ] || fail_open
            BASE_SHA="${CHECKOUT_PARENTS[0]}"
            CHECKOUT_PR_HEAD_SHA="${CHECKOUT_PARENTS[1]}"
            [ "$CHECKOUT_PR_HEAD_SHA" = "$PR_HEAD_SHA" ] || fail_open
            HEAD_SHA="$CHECKOUT_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
            [ "$ACTUAL_HEAD" = "$HEAD_SHA" ] || fail_open
          fi

          [ -n "${BASE_SHA:-}" ] || fail_open
          [ -n "${HEAD_SHA:-}" ] || fail_open
          [ "$BASE_SHA" != "$ZERO_SHA" ] || fail_open

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --no-recurse-submodules --depth=1 origin "$sha"; then
                fail_open
              fi
            fi
            git cat-file -e "$sha^{commit}" 2>/dev/null || fail_open
          done

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            Makefile ops/prom-verify.sh .github/workflows/ops-verify.yml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No ops-verify repository inputs changed in the exact integration range; guarded checks will be skipped."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Relevant ops-verify input changed in the exact integration range; guarded checks will run."
          fi

  guards:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Guard Makefile shrink (>30 lines) over exact integration range
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"

          ACTUAL_HEAD="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "Checkout HEAD unavailable; refusing to waive Makefile shrink guard." >&2
            exit 1
          }
          [ -n "${CHECKOUT_SHA:-}" ] && [ "$ACTUAL_HEAD" = "$CHECKOUT_SHA" ] || {
            echo "Checkout SHA does not match exact event state; refusing to waive Makefile shrink guard." >&2
            exit 1
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "${PR_HEAD_SHA:-}" ] || {
              echo "Pull-request head SHA unavailable; refusing to waive Makefile shrink guard." >&2
              exit 1
            }
            mapfile -t CHECKOUT_PARENTS < <(
              git cat-file -p "$CHECKOUT_SHA" 2>/dev/null | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
            )
            [ "${#CHECKOUT_PARENTS[@]}" -eq 2 ] || {
              echo "Pull-request checkout is not an exact two-parent integration commit." >&2
              exit 1
            }
            BASE_SHA="${CHECKOUT_PARENTS[0]}"
            CHECKOUT_PR_HEAD_SHA="${CHECKOUT_PARENTS[1]}"
            [ "$CHECKOUT_PR_HEAD_SHA" = "$PR_HEAD_SHA" ] || {
              echo "Pull-request integration parent 2 does not equal the exact PR head." >&2
              exit 1
            }
            HEAD_SHA="$CHECKOUT_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
            [ -n "${HEAD_SHA:-}" ] && [ "$ACTUAL_HEAD" = "$HEAD_SHA" ] || {
              echo "Push checkout does not equal the exact after SHA." >&2
              exit 1
            }
          fi

          # A newly created branch has no previous push commit, so there is no
          # meaningful shrink range to compare. Pull requests always have an
          # integration parent and can never use this waiver.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "Pull-request integration base unavailable; refusing to waive Makefile shrink guard." >&2
              exit 1
            fi
            echo "No previous push commit; Makefile shrink guard not applicable to this creation event."
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$sha"
            fi
            git cat-file -e "$sha^{commit}"
          done

          BEFORE="$(git show "$BASE_SHA:Makefile" | wc -l | tr -d ' ')"
          AFTER="$(git show "$HEAD_SHA:Makefile" | wc -l | tr -d ' ')"
          DELTA=$((BEFORE-AFTER))
          if [ "$DELTA" -gt 30 ]; then
            echo "Makefile shrank by $DELTA lines across the exact integration range (limit 30)."
            exit 1
          fi

      - name: Install bounded pinned promtool
        run: |
          set -euo pipefail
          VER="2.54.1"
          SHA256="31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f"
          ROOT="/tmp/void-prometheus-${VER}"
          ARCHIVE="/tmp/prometheus-${VER}.linux-amd64.tar.gz"
          URL="https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 --retry 2 --retry-connrefused \
            -o "$ARCHIVE" "$URL"
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$ROOT" --strip-components=1 \
            "prometheus-${VER}.linux-amd64/promtool" \
            "prometheus-${VER}.linux-amd64/prometheus.yml"
          chmod 0755 "$ROOT/promtool"
          echo "$ROOT" >> "$GITHUB_PATH"
          "$ROOT/promtool" --version

      - name: Prove and run ops Prometheus verification
        run: |
          set -euo pipefail
          VER="2.54.1"
          ROOT="/tmp/void-prometheus-${VER}"

          bash -n ops/prom-verify.sh

          sudo rm -rf /etc/prometheus
          sudo mkdir -p /etc/prometheus

          # Syntax alone is insufficient: the real verifier must reject an
          # invalid Prometheus configuration.
          sudo tee /etc/prometheus/prometheus.yml >/dev/null <<'EOF'
          global:
            scrape_interval: definitely-not-a-duration
          EOF
          if bash ops/prom-verify.sh; then
            echo "ops/prom-verify.sh accepted an invalid Prometheus configuration" >&2
            exit 1
          fi

          # Restore a known-valid upstream fixture before exercising rule scans.
          sudo cp "$ROOT/prometheus.yml" /etc/prometheus/prometheus.yml

          write_valid_rule() {
            sudo tee "$1" >/dev/null <<'EOF'
          groups:
          - name: void-ops-verify-valid
            rules:
            - alert: VoidOpsVerifyValid
              expr: vector(1)
          EOF
          }

          write_invalid_rule() {
            sudo tee "$1" >/dev/null <<'EOF'
          groups:
          - name: void-ops-verify-invalid
            rules:
            - alert: VoidOpsVerifyInvalid
              expr: sum(
          EOF
          }

          RULE_DIRS=(
            /etc/prometheus/alerts
            /etc/prometheus/rules.d
            /etc/prometheus/void-rules
          )

          # Prove every canonical rules directory is actually consumed by the
          # real verifier. Each iteration leaves all other directories valid and
          # injects one semantically invalid rule into the selected directory.
          for target in "${RULE_DIRS[@]}"; do
            for dir in "${RULE_DIRS[@]}"; do
              sudo rm -rf "$dir"
              sudo mkdir -p "$dir"
              write_valid_rule "$dir/valid.yml"
            done
            write_invalid_rule "$target/invalid.yml"
            if bash ops/prom-verify.sh; then
              echo "ops/prom-verify.sh did not reject invalid rule in $target" >&2
              exit 1
            fi
          done

          # Final positive path: valid config plus valid rules in all three
          # canonical directories must pass the same production verifier.
          for dir in "${RULE_DIRS[@]}"; do
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            write_valid_rule "$dir/valid.yml"
          done
          bash ops/prom-verify.sh
