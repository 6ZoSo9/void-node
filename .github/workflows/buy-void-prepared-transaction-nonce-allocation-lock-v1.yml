name: Buy VOID prepared transaction nonce allocation lock v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-prepared-transaction-nonce-allocation-lock-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-nonce-allocation-lock-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_nonce_allocation_lock_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-prepared-transaction-nonce-allocation-lock-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-nonce-allocation-lock-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_nonce_allocation_lock_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"

permissions:
  contents: read

concurrency:
  group: buy-void-prepared-transaction-nonce-allocation-lock-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove multi-process allocation and dead-ticket recovery
        run: npx tsx scripts/prove_buy_void_prepared_transaction_nonce_allocation_lock_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
