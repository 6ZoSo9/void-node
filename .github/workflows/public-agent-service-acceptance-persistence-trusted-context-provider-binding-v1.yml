name: Public agent acceptance persistence trusted context provider binding V1

on:
  pull_request:
    paths:
      - "src/index.ts"
      - "src/http/public_agent_service_acceptance_persistence_trusted_context_provider_binding_v1.ts"
      - "schemas/public-agent-service-acceptance-persistence-trusted-context-provider-binding-v1.schema.json"
      - "examples/public-agent-service-acceptance-persistence-trusted-context-provider-binding-v1.example.json"
      - "docs/public-agent/public-agent-service-acceptance-persistence-trusted-context-provider-binding-v1.md"
      - "scripts/prove_public_agent_service_acceptance_persistence_trusted_context_provider_binding_v1.ts"
      - "scripts/prove_public_agent_service_acceptance_persistence_http_route_server_bootstrap_callsite_integration_v1.ts"
      - ".github/workflows/public-agent-service-acceptance-persistence-trusted-context-provider-binding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node_modules/.bin/tsc -p tsconfig.nonindex.json --noEmit
      - run: node_modules/.bin/tsc -p tsconfig.build.json --noEmit
      - run: node_modules/.bin/tsx scripts/prove_public_agent_service_acceptance_persistence_trusted_context_provider_binding_v1.ts
      - run: node_modules/.bin/tsx scripts/prove_public_agent_service_acceptance_persistence_http_route_server_bootstrap_callsite_integration_v1.ts
