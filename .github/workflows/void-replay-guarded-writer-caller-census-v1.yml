name: VOID replay guarded writer caller census v1

on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.mts"
      - "**/*.cts"
      - "docs/architecture/void-replay-guarded-writer-caller-census-v1.md"
      - ".github/workflows/void-replay-guarded-writer-caller-census-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-replay-guarded-writer-caller-census-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic adversarial importer proof
        run: |
          set -euo pipefail
          node --check tools/void-replay-guarded-writer-caller-census-v1.mjs
          node --check scripts/prove_void_replay_guarded_writer_caller_census_v1.mjs
          node scripts/prove_void_replay_guarded_writer_caller_census_v1.mjs
      - name: Enumerate actual tracked source imports
        run: node tools/void-replay-guarded-writer-caller-census-v1.mjs --scan
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
