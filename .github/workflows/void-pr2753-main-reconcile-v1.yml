name: VOID PR2753 main reconciliation v1

on:
  push:
    branches:
      - ren/buy-void-first-original-v6-current-main-joint-review-20261009
    paths:
      - .github/workflows/void-pr2753-main-reconcile-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2753-main-reconcile-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation trigger
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge qualified main and publish exact combined tree
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="ren/buy-void-first-original-v6-current-main-joint-review-20261009"
          predecessor="5c8ce0f1a2dc7f45e522bcbd513ae3f4872117bc"
          qualified_main="13b43dd68bb80ae975f1fc0ac7edcd50b1d8b714"
          workflow=".github/workflows/void-pr2753-main-reconcile-v1.yml"
          helper="scripts/reconcile_pr2753_seal_first_source_v1.py"

          test "$GITHUB_REF_NAME" = "$branch"
          expected_stage="$(printf '%s\n' "$workflow" "$helper" | sort)"
          actual_stage="$(git diff --name-only "$predecessor" HEAD | sort)"
          test "$actual_stage" = "$expected_stage"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$qualified_main"

          set +e
          git merge --no-commit --no-ff "$qualified_main"
          merge_rc=$?
          set -e
          test "$merge_rc" -ne 0

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts="$(printf '%s\n' \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs \
            | sort)"
          test "$conflicts" = "$expected_conflicts"

          git checkout --ours -- \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs

          python3 "$helper" | tee /tmp/void-pr2753-reconcile.txt
          grep -Fx "VOID_PR2753_SEAL_FIRST_SOURCE_RECONCILE_V1_GREEN" \
            /tmp/void-pr2753-reconcile.txt
          grep -Fx "economic_source_rewritten=false" /tmp/void-pr2753-reconcile.txt
          grep -Fx "seal_waiver=false" /tmp/void-pr2753-reconcile.txt

          git add -- \
            src/index.ts \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs \
            scripts/prove_void_public_checkpoint_seal_first_startup_v1.mjs \
            docs/architecture/void-public-checkpoint-seal-first-startup-v1.md
          test -z "$(git diff --name-only --diff-filter=U)"

          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
          node scripts/prove_void_public_checkpoint_seal_first_startup_v1.mjs
          npm run typecheck
          npm run build
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

          rm -- "$workflow" "$helper"
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"

          git config user.name "VOID Repository Bot"
          git config user.email "44710859+6ZoSo9@users.noreply.github.com"
          git commit -m "merge(public,econ): reconcile seal-first startup with presale integration"

          test "$(git rev-parse HEAD^1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$qualified_main"
          test "$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
