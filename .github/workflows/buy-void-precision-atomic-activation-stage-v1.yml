name: VOID Buy VOID Precision atomic activation staging v1

on:
  pull_request:
    paths:
      - "tools/void-buy-void-precision-atomic-activation-preflight-v1.mjs"
      - "tools/void-buy-void-precision-atomic-activation-stage-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_stage_v1.sh"
      - "scripts/prove_buy_void_precision_atomic_activation_stage_v1.mjs"
      - "docs/operators/buy-void-precision-atomic-activation-staging-v1.md"
      - ".github/workflows/buy-void-precision-atomic-activation-stage-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-buy-void-precision-atomic-activation-preflight-v1.mjs"
      - "tools/void-buy-void-precision-atomic-activation-stage-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_stage_v1.sh"
      - "scripts/prove_buy_void_precision_atomic_activation_stage_v1.mjs"
      - "docs/operators/buy-void-precision-atomic-activation-staging-v1.md"
      - ".github/workflows/buy-void-precision-atomic-activation-stage-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/prove_buy_void_precision_atomic_activation_stage_v1.mjs
