name: VOID Live Agent JSONL Runtime Wedge v1

on:
  pull_request:
    paths:
      - "src/index.ts"
      - "src/http/agent_pick2_jsonl_semantic_index_v1.ts"
      - "src/economic/wc_public_earning_pilot_v1.ts"
      - "src/economic/wc_public_claim_history_authority_v1.ts"
      - "src/economic/wc_verified_receipt_acceptance_v1.ts"
      - "src/economic/wc_process_instance_lock_v1.ts"
      - "scripts/prove_wc_verified_receipt_acceptance_v1.ts"
      - "scripts/prove_wc_process_instance_lock_v1.ts"
      - "scripts/prove_agent_pick2_jsonl_semantic_index_v1.ts"
      - "scripts/prove_agent_pick2_large_unwitnessed_completion_wedge_v1.ts"
      - "scripts/prove_agent_pick2_external_writer_cache_wedge_v1.ts"
      - "src/economic/wc_public_remote_truth_jsonl_index_v1.ts"
      - "scripts/prove_wc_public_remote_truth_atomicity_v1.ts"
      - "scripts/prove_wc_public_remote_evidence_body_bound_v1.ts"
      - "scripts/prove_wc_public_claim_history_authority_v1.ts"
      - "scripts/prove_wc_public_claim_issuance_atomicity_v1.ts"
      - "scripts/prove_wc_public_earning_pilot_v1.ts"
      - "scripts/prove_wc_public_earning_pilot_runtime_v1.ts"
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
      - "scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/index.ts"
      - "src/http/agent_pick2_jsonl_semantic_index_v1.ts"
      - "src/economic/wc_public_earning_pilot_v1.ts"
      - "src/economic/wc_public_claim_history_authority_v1.ts"
      - "src/economic/wc_verified_receipt_acceptance_v1.ts"
      - "src/economic/wc_process_instance_lock_v1.ts"
      - "scripts/prove_wc_verified_receipt_acceptance_v1.ts"
      - "scripts/prove_wc_process_instance_lock_v1.ts"
      - "scripts/prove_agent_pick2_jsonl_semantic_index_v1.ts"
      - "scripts/prove_agent_pick2_large_unwitnessed_completion_wedge_v1.ts"
      - "scripts/prove_agent_pick2_external_writer_cache_wedge_v1.ts"
      - "src/economic/wc_public_remote_truth_jsonl_index_v1.ts"
      - "scripts/prove_wc_public_remote_truth_atomicity_v1.ts"
      - "scripts/prove_wc_public_remote_evidence_body_bound_v1.ts"
      - "scripts/prove_wc_public_claim_history_authority_v1.ts"
      - "scripts/prove_wc_public_claim_issuance_atomicity_v1.ts"
      - "scripts/prove_wc_public_earning_pilot_v1.ts"
      - "scripts/prove_wc_public_earning_pilot_runtime_v1.ts"
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
      - "scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"

permissions:
  contents: read

jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install behavioral-proof runtime dependencies
        run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_jsonl_semantic_index_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_large_unwitnessed_completion_wedge_v1.ts
      - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
      - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs

  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install behavioral-proof runtime dependencies
        run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_jsonl_semantic_index_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_large_unwitnessed_completion_wedge_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_process_instance_lock_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_remote_truth_atomicity_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_remote_evidence_body_bound_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_claim_history_authority_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_claim_issuance_atomicity_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_verified_receipt_acceptance_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_earning_pilot_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_wc_public_earning_pilot_runtime_v1.ts
      - name: Prove shared diff hygiene contract
        run: node scripts/prove_ci_diff_hygiene_v1.mjs
      - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
      - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Diff hygiene
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh

  node26:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Install behavioral-proof runtime dependencies
        run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_jsonl_semantic_index_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_large_unwitnessed_completion_wedge_v1.ts
      - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
      - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
