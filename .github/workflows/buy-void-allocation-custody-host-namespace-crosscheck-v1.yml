name: VOID Buy custody host namespace receipt cross-check v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_host_namespace_crosscheck_v1.py"
      - "scripts/prove_void_buy_allocation_custody_host_namespace_crosscheck_v1.py"
      - "docs/operators/buy-void-allocation-custody-host-namespace-crosscheck-v1.md"
      - ".github/workflows/buy-void-allocation-custody-host-namespace-crosscheck-v1.yml"
      - "ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact namespace cross-check successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="17606a1c0bc939b2e6921ad0d586122237f224d8"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-host-namespace-crosscheck-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-host-namespace-crosscheck-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_host_namespace_crosscheck_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_host_namespace_crosscheck_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_host_namespace_crosscheck_v1.py)" = \
            "542ac103bc2607cc50f6913abde137097487c00c"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_host_namespace_crosscheck_v1.py)" = \
            "ce45e722422c0ec75345bcf90dd61250514c484e"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-host-namespace-crosscheck-v1.md)" = \
            "0df93664b52a9cd2bef9fb857280fd74035d92d2"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py)" = \
            "08094872d5a8aca720ae0a9f710866890d8132e7"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py)" = \
            "ded737a228a627a241a84131113db6d3521f635c"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_host_namespace_crosscheck_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_host_namespace_crosscheck_v1.py

      - name: Self-test without host receipts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ns-crosscheck-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_host_namespace_crosscheck_v1.py \
            --self-test | tee "$out"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_HOST_NAMESPACE_CROSSCHECK_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'candidate_receipt_id_recomputed=true' \
            'observation_receipt_id_recomputed=true' \
            'receipt_file_sha256_bound_into_crosscheck_id=true' \
            'designated_host_anchors_required=true' \
            'process_census_source_identity_required=true' \
            'pid_namespace_match_required=true' \
            'mount_namespace_match_required=true' \
            'boot_id_match_required=true' \
            'procfs_identity_match_required=true' \
            'proc_mount_contract_match_required=true' \
            'operator_uid_match_required=true' \
            'authority_promotion_rejected=true' \
            'collector_source_provenance_authenticated=false' \
            'receipt_origin_authenticated=false' \
            'independent_host_context_attested=false' \
            'external_reviewer_approval_required=true' \
            'external_reviewer_approval_present=false' \
            'lease_authority=false' \
            'process_census_consumption_authorized=false' \
            'automatic_process_census_feed_authorized=false' \
            'production_filesystem_write=false' \
            'self_test_temporary_filesystem_write=true' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/ns-crosscheck-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_host_namespace_crosscheck_v1.py \
            | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_HOST_NAMESPACE_CROSSCHECK_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'candidate_receipt_id_recomputed=true' \
            'observation_receipt_id_recomputed=true' \
            'receipt_file_sha256_bound_into_crosscheck_id=true' \
            'designated_host_anchors_required=true' \
            'process_census_source_identity_required=true' \
            'pid_namespace_match_required=true' \
            'mount_namespace_match_required=true' \
            'boot_id_match_required=true' \
            'procfs_identity_match_required=true' \
            'proc_mount_contract_match_required=true' \
            'operator_uid_match_required=true' \
            'authority_promotion_rejected=true' \
            'collector_source_provenance_authenticated=false' \
            'receipt_origin_authenticated=false' \
            'independent_host_context_attested=false' \
            'external_reviewer_approval_required=true' \
            'external_reviewer_approval_present=false' \
            'lease_authority=false' \
            'process_census_consumption_authorized=false' \
            'automatic_process_census_feed_authorized=false' \
            'without_dash_b_bootstrap_hold=true' \
            'host_receipts_not_collected_in_ci=true' \
            'production_filesystem_write=false' \
            'test_fixture_filesystem_write=true' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
