name: VOID WC/VOID opening claim binding persistence v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-opening-claim-binding-persistence-v1.mjs"
      - "scripts/prove_void_wc_void_opening_claim_binding_persistence_v1.mjs"
      - "docs/operators/wc-void-opening-claim-binding-persistence-v1.md"
      - "tools/void-wc-void-opening-claim-binding-v1.mjs"
      - "scripts/prove_void_wc_void_opening_claim_binding_v1.mjs"
      - ".github/workflows/void-wc-void-opening-claim-binding-persistence-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-wc-void-opening-claim-binding-persistence-v1.mjs"
      - "scripts/prove_void_wc_void_opening-claim-binding-persistence-v1.mjs"
      - "docs/operators/wc-void-opening-claim-binding-persistence-v1.md"
      - "tools/void-wc-void-opening-claim-binding-v1.mjs"
      - "scripts/prove_void_wc_void_opening_claim_binding_v1.mjs"
      - ".github/workflows/void-wc-void-opening-claim-binding-persistence-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-opening-claim-binding-persistence-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove claim binding source dependency
        run: node scripts/prove_void_wc_void_opening_claim_binding_v1.mjs

      - name: Prove claim binding persistence
        run: node scripts/prove_void_wc_void_opening_claim_binding_persistence_v1.mjs

      - name: Diff hygiene
        run: git diff --check
