name: VOID Buy VOID allocation custody qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-allocation-custody-qualification-v1.yml"
      - "docs/architecture/buy-void-allocation-custody-qualification-v1.md"
      - "scripts/prove_buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_qualification_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-allocation-custody-qualification-v1.yml"
      - "docs/architecture/buy-void-allocation-custody-qualification-v1.md"
      - "scripts/prove_buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_qualification_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve exact historical V1 contract
        run: |
          set -euo pipefail
          test "$(git hash-object src/economic/buy_void_allocation_custody_qualification_v1.ts)" = "4adae871f2938840e2ec936e743d0b650b5f1a00"
          test "$(git hash-object scripts/prove_buy_void_allocation_custody_qualification_v1.ts)" = "756cc52119e78150e6cc251454e1a79d75ade9f9"
          test "$(git hash-object docs/architecture/buy-void-allocation-custody-qualification-v1.md)" = "b52f32ff343f7fd340c7782d0c68cde3bb54693d"
          git cat-file -e 59b336eb82222bf0f5bcfe37060ec520c54e9b62^{blob}
          grep -F 'VOID_BUY_VOID_ALLOCATION_CUSTODY_REVIEWED_WRITER_BLOB_SHA1_V1' src/economic/buy_void_allocation_custody_qualification_v1.ts
          grep -F '"59b336eb82222bf0f5bcfe37060ec520c54e9b62"' src/economic/buy_void_allocation_custody_qualification_v1.ts
          echo "historical_custody_v1_preserved=true"
          echo "current_writer_requalification_required=true"
          echo "independent_custody_proven=false"
          echo "production_gate_ready=false"
          echo "funds_movement=false"

      - name: Diff hygiene
        run: git diff --check
