name: VOID Buy VOID allocation custody qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-allocation-custody-qualification-v1.yml"
      - "docs/architecture/buy-void-allocation-custody-qualification-v1.md"
      - "scripts/prove_buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-allocation-custody-qualification-v1.yml"
      - "docs/architecture/buy-void-allocation-custody-qualification-v1.md"
      - "scripts/prove_buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove allocation custody qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_qualification_v1.ts

      - name: Preserve allocation high-water contract
        run: npx tsx scripts/prove_buy_void_allocation_reservation_high_water_v1.ts

      - name: Preserve allocation publication writer
        run: npx tsx scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts

      - name: Verify source tree cleanliness
        run: test -z "$(git status --short)"

      - name: Diff hygiene
        run: git diff --check
