name: VOID Node Fleet Public Fetch Transport V1

on:
  pull_request:
    paths:
      - "tools/void-node-fleet-public-fetch-transport-v1.mjs"
      - "scripts/prove_void_node_fleet_public_fetch_transport_v1.mjs"
      - "docs/operations/void-node-fleet-public-fetch-transport-v1.md"
      - ".github/workflows/void-node-fleet-public-fetch-transport-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-node-fleet-public-fetch-transport-v1.mjs"
      - "scripts/prove_void_node_fleet_public_fetch_transport_v1.mjs"
      - "docs/operations/void-node-fleet-public-fetch-transport-v1.md"
      - ".github/workflows/void-node-fleet-public-fetch-transport-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: |
          node --check tools/void-node-fleet-public-fetch-transport-v1.mjs
          node --check scripts/prove_void_node_fleet_public_fetch_transport_v1.mjs
      - name: Prove public fetch transport
        run: node scripts/prove_void_node_fleet_public_fetch_transport_v1.mjs
      - name: Diff hygiene
        run: git diff --check
