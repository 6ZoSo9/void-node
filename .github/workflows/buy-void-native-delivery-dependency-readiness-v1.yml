name: Buy VOID Native Delivery Dependency Readiness v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-native-delivery-dependency-readiness-v1.yml"
      - "docs/operators/buy-void-native-delivery-dependency-readiness-v1.md"
      - "scripts/buy_void_native_delivery_dependency_readiness_v1.ts"
      - "scripts/prove_buy_void_native_delivery_dependency_readiness_guard_v1.ts"
      - "scripts/prove_buy_void_native_delivery_dependency_readiness_v1.ts"
      - "src/economic/buy_void_native_delivery_dependency_readiness_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-native-delivery-dependency-readiness-v1.yml"
      - "docs/operators/buy-void-native-delivery-dependency-readiness-v1.md"
      - "scripts/buy_void_native_delivery_dependency_readiness_v1.ts"
      - "scripts/prove_buy_void_native_delivery_dependency_readiness_guard_v1.ts"
      - "scripts/prove_buy_void_native_delivery_dependency_readiness_v1.ts"
      - "src/economic/buy_void_native_delivery_dependency_readiness_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/prove_buy_void_native_delivery_dependency_readiness_v1.ts
      - run: npx tsx scripts/prove_buy_void_native_delivery_dependency_readiness_guard_v1.ts
      - run: npx tsx scripts/buy_void_native_delivery_dependency_readiness_v1.ts
      - run: npm run build
