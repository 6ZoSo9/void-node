name: First Public Earn Nimo Live Canary Public Evidence V1

on:
  pull_request:
    paths:
      - "docs/public/evidence/first-public-earn-nimo-live-canary-v1/**"
      - "scripts/prove_first_public_earn_nimo_live_canary_public_evidence_v1.mjs"
      - ".github/workflows/first-public-earn-nimo-live-canary-public-evidence-v1.yml"
  push:
    paths:
      - "docs/public/evidence/first-public-earn-nimo-live-canary-v1/**"
      - "scripts/prove_first_public_earn_nimo_live_canary_public_evidence_v1.mjs"
      - ".github/workflows/first-public-earn-nimo-live-canary-public-evidence-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/prove_first_public_earn_nimo_live_canary_public_evidence_v1.mjs
