name: paid-datanet-object-integrity-fulfillment-cli-v1

on:
  push:
    paths:
      - ".github/workflows/paid-datanet-object-integrity-fulfillment-cli-v1.yml"
      - "docs/operators/paid-datanet-object-integrity-fulfillment-cli-v1.md"
      - "scripts/paid_datanet_object_integrity_fulfillment_cli_v1.ts"
      - "scripts/prove_paid_datanet_object_integrity_fulfillment_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_admission_decision_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_payment_confirmation_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_quote_approval_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_quote_bridge_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_triage_cli_v1.ts"
      - "scripts/paid_datanet_quote_packet_v1.ts"
      - "scripts/paid_datanet_operator_workflow_cli_v1.ts"
      - "src/paid_services/datanet_service_catalog_v1.ts"
      - "src/paid_services/datanet_request_admission_v1.ts"
      - "src/paid_services/datanet_fulfillment_receipt_v1.ts"
  pull_request:
    paths:
      - ".github/workflows/paid-datanet-object-integrity-fulfillment-cli-v1.yml"
      - "docs/operators/paid-datanet-object-integrity-fulfillment-cli-v1.md"
      - "scripts/paid_datanet_object_integrity_fulfillment_cli_v1.ts"
      - "scripts/prove_paid_datanet_object_integrity_fulfillment_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_admission_decision_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_payment_confirmation_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_quote_approval_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_quote_bridge_cli_v1.ts"
      - "scripts/paid_datanet_public_pilot_triage_cli_v1.ts"
      - "scripts/paid_datanet_quote_packet_v1.ts"
      - "scripts/paid_datanet_operator_workflow_cli_v1.ts"
      - "src/paid_services/datanet_service_catalog_v1.ts"
      - "src/paid_services/datanet_request_admission_v1.ts"
      - "src/paid_services/datanet_fulfillment_receipt_v1.ts"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove object-integrity fulfillment CLI v1
        run: >-
          npx --no-install tsx
          scripts/prove_paid_datanet_object_integrity_fulfillment_cli_v1.ts
