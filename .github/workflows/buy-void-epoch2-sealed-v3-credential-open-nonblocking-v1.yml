name: Buy VOID Epoch-2 sealed V3 credential open nonblocking V1

on:
  pull_request:
    paths:
      - 'scripts/void_buy_void_epoch2_credential_attestation_sealed_v3.mjs'
      - 'scripts/prove_buy_void_epoch2_sealed_v3_credential_open_nonblocking_v1.mjs'
      - '.github/workflows/buy-void-epoch2-sealed-v3-credential-open-nonblocking-v1.yml'
  push:
    branches:
      - ren/epoch2-sealed-v3-nonblocking-credential-open-v1-20261019
    paths:
      - 'scripts/void_buy_void_epoch2_credential_attestation_sealed_v3.mjs'
      - 'scripts/prove_buy_void_epoch2_sealed_v3_credential_open_nonblocking_v1.mjs'
      - '.github/workflows/buy-void-epoch2-sealed-v3-credential-open-nonblocking-v1.yml'

permissions:
  contents: read

jobs:
  fixture-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax only
        run: |
          node --check scripts/void_buy_void_epoch2_credential_attestation_sealed_v3.mjs
          node --check scripts/prove_buy_void_epoch2_sealed_v3_credential_open_nonblocking_v1.mjs
      - name: Disposable credential FIFO replacement negative
        run: |
          node scripts/prove_buy_void_epoch2_sealed_v3_credential_open_nonblocking_v1.mjs
      - name: Diff hygiene
        run: git diff --check
