name: Buy VOID Epoch-2 V6R3 runner policy atomic upgrade V1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'scripts/prove_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'docs/operators/buy-void-epoch2-live-composition-runner-policy-atomic-upgrade-v1.md'
      - '.github/workflows/buy-void-epoch2-live-composition-runner-policy-atomic-upgrade-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
      - 'ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json'
      - 'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs'
  push:
    branches: [ main ]
    paths:
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'scripts/prove_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'docs/operators/buy-void-epoch2-live-composition-runner-policy-atomic-upgrade-v1.md'
      - '.github/workflows/buy-void-epoch2-live-composition-runner-policy-atomic-upgrade-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
      - 'ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json'
      - 'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile             ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py             scripts/prove_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py
      - name: Executor source self-test
        run: |
          python3 -I -B             ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py             --self-test
      - name: Executor source plan
        run: |
          python3 -I -B             ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py             --source-plan
      - name: Exact proof
        run: |
          python3 -I -B             scripts/prove_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py
      - name: Diff hygiene
        run: git diff --check
