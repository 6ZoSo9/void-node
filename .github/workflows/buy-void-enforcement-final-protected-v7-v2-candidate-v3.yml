name: VOID Buy VOID final protected V7/V2 enforcement candidate v3

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v3.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v5.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs"
      - ".github/workflows/canonical-producer-source-custody-v1.yml"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
      - ".github/workflows/void-public-checkpoint-seal-first-startup-v1.yml"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "ops/**"
      - "runtime/**"
      - "scripts/**"
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v3.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v5.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs"
      - ".github/workflows/canonical-producer-source-custody-v1.yml"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
      - ".github/workflows/void-public-checkpoint-seal-first-startup-v1.yml"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "ops/**"
      - "runtime/**"
      - "scripts/**"
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and census parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor d5ad8c401b67832919eeabd95f26bdae513e68fe "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs)" = e9783f70e2e25145897e0e594aacfd6d57f97bee
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build reviewed economic closure
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Derive V3 candidate
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
          node --check "$proof"
          self="$RUNNER_TEMP/protected-v7-v2-candidate-v3-self-${{ matrix.node }}.txt"
          node "$proof" --self-test | tee "$self"
          grep -Fx 'VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3_GREEN' "$self"
          grep -Fx 'provider_historical_lock_proof_reexecuted=false' "$self"
          grep -Fx 'provider_current_content_semantics_requalified=true' "$self"
          grep -Fx 'complete_executable_closure_verified=true' "$self"
          grep -Fx 'candidate_enforcement_identity_accepted=false' "$self"
          grep -Fx 'production_source_finality_authority_ready=false' "$self"
          grep -Fx 'public_presale_activation=false' "$self"
          grep -Fx 'funds_movement=false' "$self"
          self_sha="$(sed -n 's/^candidate_enforcement_set_sha256=//p' "$self")"
          test -n "$self_sha"
          out="$RUNNER_TEMP/protected-v7-v2-candidate-v3-node-${{ matrix.node }}.json"
          repeat="$RUNNER_TEMP/protected-v7-v2-candidate-v3-node-${{ matrix.node }}-repeat.json"
          node "$proof" --derive > "$out"
          node "$proof" --derive > "$repeat"
          cmp "$out" "$repeat"
          derived_sha="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(c.candidate_enforcement_set_sha256)' "$out")"
          test "$self_sha" = "$derived_sha"
          echo "cross_process_derivation_byte_identical=true"
          echo "self_test_candidate_sha_matches_derive=true"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_final_protected_v7_v2_candidate_v3");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3");
          assert.equal(c.version,3);
          assert.equal(c.protected_census_parent,"d5ad8c401b67832919eeabd95f26bdae513e68fe");
          assert.equal(c.current_enforcement_parent,"6080389131c3cdb80fa9935b5ff80f4e40f09938");
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,
            "297399d8c5cd975e5bf9f96adc291aebae13ce6a83c26ca5a039668c7b32b0f2");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-v7-v2-candidate-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/protected-v7-v2-candidate-v3-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-v7-v2-candidate-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate

      - name: Require Node 22/24/26 byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "candidate/protected-v7-v2-candidate-v3-node-$node.json"
          done
          cmp candidate/protected-v7-v2-candidate-v3-node-22.json candidate/protected-v7-v2-candidate-v3-node-24.json
          cmp candidate/protected-v7-v2-candidate-v3-node-22.json candidate/protected-v7-v2-candidate-v3-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("candidate/protected-v7-v2-candidate-v3-node-22.json","utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3");
          assert.match(c.candidate_enforcement_set_sha256,/^[0-9a-f]{64}$/u);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,
            "297399d8c5cd975e5bf9f96adc291aebae13ce6a83c26ca5a039668c7b32b0f2");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3_CROSS_NODE_GREEN");
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          console.log("candidate_enforcement_identity_accepted=false");
          console.log("funds_movement=false");
          NODE
