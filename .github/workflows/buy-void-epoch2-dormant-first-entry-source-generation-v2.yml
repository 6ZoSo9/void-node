      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v2.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch2-first-entry-source-generation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact event scope and preserved generations
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT_NAME" in
            pull_request) base="$(git merge-base "$PR_BASE" "$EXPECTED_HEAD")" ;;
            push)
              base="$PUSH_BEFORE"
              test -n "$base"
              test "$base" != 0000000000000000000000000000000000000000
              ;;
            workflow_dispatch) base="" ;;
            *) exit 1 ;;
          esac
          if test -n "$base"; then
            git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"
            expected="$RUNNER_TEMP/epoch2-generation-v2-expected-scope.txt"
            actual="$RUNNER_TEMP/epoch2-generation-v2-actual-scope.txt"
            printf '%s\n' \
              'A	.github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v2.yml' \
              'A	docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v2.md' \
              'A	ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py' \
              'A	ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c' \
              'A	ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf' \
              'A	scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py' \
              'A	scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py' \
              'A	scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py' \
              | sort > "$expected"
            git diff --name-status "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
            diff -u "$expected" "$actual"
            git diff --check "$base" "$EXPECTED_HEAD"
          else
            echo "scope_event_comparison=not_applicable_manual_replay"
          fi
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v2.md)" = 4af65a4a1e1d64cb25bae6fa7da64b14bfb2002f
          test "$(git ls-tree HEAD -- docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v2.md | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py)" = 383b84e71b371de65579e4113469e86a59b807ab
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py)" = 69a018c0eccedf3782055c56725579d02463b05e
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py)" = 242eac04da6e17d32e9a9baa9b57f572cabda7a8
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py)" = 88577de29dddbe61d2c2f59179d0dcb62a49165a
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py)" = f3d6b1559be7490303cf36338c4bfa38fdaa390a
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c)" = 243583d4ed0522796b2bbf448abd4e9c28958f50
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c)" = 19f9baf8d6d707da43dbd0e247667af1a10e46c5
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c)" = 2c3c9ed120cc9949a0528e43be886354aa25da5a
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c)" = c7d2125b59dcbecc1d6aae8818e84cac8ce85da9
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c)" = 81fc960f1cec597b01875ed944b25e5b6574d34d
          test "$(git ls-tree HEAD -- ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json)" = f8ff6fbb855aecafc329cd60622cf3af782745a3
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json)" = 471a52641135ee3ce31d521980e6ea37af18ce58
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json)" = 64c9a42ca1108a9e8f88218c34d53e50668c653e
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json)" = 57ecc08d465fe2a3c395546d349864312cd08a3f
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf)" = a484a7d2e1159ebbef3357ec849af92d7f12cff1
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf)" = 782f747cda24a214c64e8ec3f49b6791bbb62f97
          test "$(git ls-tree HEAD -- ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py)" = 7b2ddaeddf844d98aa4eb7006ee371ea6a455f57
          test "$(git ls-tree HEAD -- scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py)" = ffa111fbe6bca7306e57e044fc88a26b1da7a334
          test "$(git ls-tree HEAD -- scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py)" = c7cd7a3ed91486ee1272f051634ed00c4f8ca79d
          test "$(git ls-tree HEAD -- scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py | cut -d" " -f1)" = 100644
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py)" = 32f58b97ca2564bccd95dbcf07ccd033aa68133e
          test "$(git ls-tree HEAD -- scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py | cut -d" " -f1)" = 100644
          test "$(git ls-tree HEAD -- .github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v2.yml | cut -d" " -f1)" = 100644
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and complete focused proofs
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py",
          ):
              compile(Path(relative).read_bytes(), relative, "exec", dont_inherit=True)
          print("VOID_EPOCH2_FIRST_ENTRY_SOURCE_GENERATION_V2_SYNTAX_GREEN")
          PY
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_generation.py
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4_terminal.py
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.py
          /usr/bin/python3 -I -S -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py --self-test
          /usr/bin/python3 -I -S -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v4.py --source-plan
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
