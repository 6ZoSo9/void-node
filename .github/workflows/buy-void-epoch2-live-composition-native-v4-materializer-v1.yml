name: Buy VOID Epoch-2 native V4 materializer v1

on:
  pull_request:
    paths:
      - "scripts/materialize_buy_void_epoch2_live_composition_native_v4.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_v4_materializer_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-v4-materializer-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-v4-materializer-v1.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v4.py"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-native-v4-materializer-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact materializer generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lock_head=b5e5e520bdedfa16818ca67e1ba0c9b2757b59f2
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$lock_head" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-v4-materializer-v1.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-v4-materializer-v1.md' \
            'scripts/materialize_buy_void_epoch2_live_composition_native_v4.py' \
            'scripts/prove_buy_void_epoch2_live_composition_native_v4_materializer_v1.py' \
            | sort > "$expected"
          git diff --name-only "$lock_head" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_live_composition_native_v4.py)" = \
            465f223dce8ab8fb653f28e11cbe6610d7616661
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_v4_materializer_v1.py)" = \
            17d15a2e2469b85163a7837ed0c2b4b8ee65986a
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json)" = \
            34340b5a8d13b7496bf5cafcf9d2937cb777d45c
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_v4.py)" = \
            9d0f3740d12e136e0a47d13451a83ae1c99b112a
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = \
            2e75b8a6fa5ecc36ce2ca05d920001a16abcf5b7
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" = \
            baab733e43c030d24f8d4abd1644f3c4ae55c3b2

          git diff --check "$lock_head" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and independent materializer proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "scripts/materialize_buy_void_epoch2_live_composition_native_v4.py",
              "scripts/prove_buy_void_epoch2_live_composition_native_v4_materializer_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_NATIVE_V4_MATERIALIZER_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/materializer-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_v4_materializer_v1.py |
            tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_V4_MATERIALIZER_V1_PROOF_GREEN' \
            'materializer_blob_bound=true' \
            'accepted_v4_lock_bound=true' \
            'candidate_tool_blob_bound=true' \
            'native_source_blob_bound=true' \
            'runner_source_blob_bound=true' \
            'runner_artifact_identity_bound=true' \
            'two_materializations_byte_identical=true' \
            'accepted_binary_bytes=722880' \
            'accepted_binary_sha256=09f2afc921d9d7a5282372151005eab4a3d5bcc520b8359588eb0038351702c4' \
            'static_no_pt_interp_verified=true' \
            'create_only_output_replay_rejected=true' \
            'output_descriptor_readback=true' \
            'output_parent_directory_fsync=true' \
            'output_failure_destructive_cleanup=false' \
            'artifact_publication_only=true' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false' \
            'treasury_liquidity_action_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Materialize exact accepted V4 install inputs
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/void_buy_void_epoch2_live_composition_native_preentry_v3"
          runner="$RUNNER_TEMP/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
          receipt="$RUNNER_TEMP/epoch2-native-v4-materialize.log"

          python3 -I -B scripts/materialize_buy_void_epoch2_live_composition_native_v4.py \
            --derive "$native" | tee "$receipt"

          python3 -I -B - "$runner" <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import sys

          source=pathlib.Path(
              "ops/precision/"
              "void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
          )
          target=pathlib.Path(sys.argv[1])

          before=source.lstat()
          assert stat.S_ISREG(before.st_mode) and not stat.S_ISLNK(before.st_mode)
          assert before.st_nlink==1 and before.st_size==40616
          raw=source.read_bytes()
          after=source.lstat()
          assert (
              before.st_dev, before.st_ino, before.st_size,
              before.st_mtime_ns, before.st_ctime_ns
          ) == (
              after.st_dev, after.st_ino, after.st_size,
              after.st_mtime_ns, after.st_ctime_ns
          )
          assert hashlib.sha256(raw).hexdigest()==(
              "f6a75184dcc63989328c351fc93e140e"
              "6dac103f682f5c58c9f76bccd359a889"
          )

          fd=os.open(
              target,
              os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC|os.O_NOFOLLOW,
              0o400,
          )
          try:
              view=memoryview(raw)
              offset=0
              while offset<len(view):
                  n=os.write(fd,view[offset:])
                  assert n>0
                  offset+=n
              os.fchmod(fd,0o444)
              os.fsync(fd)
              st=os.fstat(fd)
              assert stat.S_IMODE(st.st_mode)==0o444
              assert st.st_size==40616
          finally:
              os.close(fd)
          check=target.read_bytes()
          assert check==raw
          PY

          test "$(stat -c %s "$native")" = 722880
          test "$(sha256sum "$native" | awk '{print $1}')" = \
            09f2afc921d9d7a5282372151005eab4a3d5bcc520b8359588eb0038351702c4
          test "$(stat -c %s "$runner")" = 40616
          test "$(sha256sum "$runner" | awk '{print $1}')" = \
            f6a75184dcc63989328c351fc93e140e6dac103f682f5c58c9f76bccd359a889

          readelf -l "$native" > "$RUNNER_TEMP/epoch2-native-v4-readelf.txt"
          if grep -F ' INTERP ' "$RUNNER_TEMP/epoch2-native-v4-readelf.txt"; then
            echo materialized_native_has_dynamic_interpreter >&2
            exit 1
          fi

          grep -Fx 'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_V4_MATERIALIZER_V1_DERIVE_GREEN' "$receipt"
          grep -Fx 'output_descriptor_readback=true' "$receipt"
          grep -Fx 'output_parent_directory_fsync=true' "$receipt"
          grep -Fx 'output_failure_destructive_cleanup=false' "$receipt"
          grep -Fx 'candidate_binary_identity_accepted=true' "$receipt"
          grep -Fx 'protected_install_authorized=false' "$receipt"

          printf '%s  %s\n%s  %s\n' \
            09f2afc921d9d7a5282372151005eab4a3d5bcc520b8359588eb0038351702c4 \
            void_buy_void_epoch2_live_composition_native_preentry_v3 \
            f6a75184dcc63989328c351fc93e140e6dac103f682f5c58c9f76bccd359a889 \
            void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs \
            > "$RUNNER_TEMP/SHA256SUMS_epoch2_native_v4.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-native-v4-install-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/void_buy_void_epoch2_live_composition_native_preentry_v3
            ${{ runner.temp }}/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs
            ${{ runner.temp }}/SHA256SUMS_epoch2_native_v4.txt
            ${{ runner.temp }}/epoch2-native-v4-materialize.log
          if-no-files-found: error
          retention-days: 7

      - run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
