name: VOID economic epoch2 production validator runtime import promotion v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "tools/void-economic-epoch2-production-validator-runtime-evidence-import-v1.mjs"
      - "tools/void-economic-epoch2-production-validator-runtime-enforcement-promotion-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_import_v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_enforcement_promotion_v1.mjs"
      - "scripts/prove_void_economic_epoch2_committed_real_validator_runtime_enforcement_v1.mjs"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-enforcement-promotion-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-precision-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-precision-import-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-nimo-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-nimo-import-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-xiphos-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-xiphos-import-v1.json"
      - "docs/operators/economic-epoch2-production-validator-runtime-evidence-import-v1.md"
      - "docs/operators/economic-epoch2-production-validator-runtime-enforcement-promotion-v1.md"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-import-promotion-v1.yml"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove single-validator runtime evidence import
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs
          node --check tools/void-economic-epoch2-production-validator-runtime-evidence-import-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_import_v1.mjs
          node scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_import_v1.mjs

      - name: Prove three-validator enforcement promotion
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-runtime-enforcement-promotion-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_runtime_enforcement_promotion_v1.mjs
          node scripts/prove_void_economic_epoch2_production_validator_runtime_enforcement_promotion_v1.mjs

      - name: Prove committed real validator runtime enforcement
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_committed_real_validator_runtime_enforcement_v1.mjs
          node scripts/prove_void_economic_epoch2_committed_real_validator_runtime_enforcement_v1.mjs

      - name: Diff hygiene
        run: git diff --check
