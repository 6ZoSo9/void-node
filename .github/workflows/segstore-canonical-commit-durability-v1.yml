name: VOID SegStore canonical commit durability v1

on:
  pull_request:
    paths:
      - "src/chain/seg_store.ts"
      - "scripts/prove_segstore_canonical_commit_durability_v1.mjs"
      - ".github/workflows/segstore-canonical-commit-durability-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/chain/seg_store.ts"
      - "scripts/prove_segstore_canonical_commit_durability_v1.mjs"
      - ".github/workflows/segstore-canonical-commit-durability-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segstore-canonical-commit-durability-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check proof syntax
        run: node --check scripts/prove_segstore_canonical_commit_durability_v1.mjs

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build runtime artifacts
        run: npm run build

      - name: Prove canonical commit durability
        run: node scripts/prove_segstore_canonical_commit_durability_v1.mjs

      - name: Preserve WAL intent durability
        run: node scripts/prove_segstore_wal_intent_durability_v1.mjs

      - name: Preserve canonical WAL replay
        run: node scripts/prove_segstore_wal_replay_canonical_order_v1.mjs

      - name: Preserve canonical read fail-closed
        run: node scripts/prove_segstore_canonical_read_fail_closed_v1.mjs

      - name: Preserve path confinement
        run: node scripts/prove_segstore_path_confinement_v1.mjs

      - name: Preserve torn-tail repair
        run: node scripts/prove_segstore_auto_repair_torn_tail_v1.mjs

      - name: Preserve truthful dry-run
        run: node scripts/prove_segstore_auto_repair_dry_run_truth_v1.mjs

      - name: Diff hygiene
        run: git diff --check
