name: Buy VOID Epoch-2 repaired V6 bootstrap replacement plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-replace-plan-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-replace-plan-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-replace-plan-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-replace-plan-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact replacement-plan generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch) base="$(git rev-parse "$EXPECTED_HEAD^1")" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$base"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-replace-plan-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-replace-plan-v1.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py)" = \
            c60179b340a0bf0d138d588b9537599aae2975a0
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py)" = \
            43ea24d46e85cbe5830143c46664b9107f1f557f
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-replace-plan-v1.md)" = \
            f4d4f30208c7f034938770ecebbc27735898e416

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py)" = \
            438b69e3c0da8549b77f7bdeaa7ed35e7d07ef84
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json)" = \
            f2ce1364dd776bfbf1aa1ef59ce999cb46037b73
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v6.py)" = \
            c5d083cbf276f59f888aeb79b874bac4480f1506
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf)" = \
            de56bacb30bea0adc418e240cf3fb8d900b061ef

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py",
          ):
              compile(
                  Path(relative).read_text("utf-8"),
                  relative,
                  "exec",
                  dont_inherit=True,
              )
          print("VOID_BUY_VOID_EPOCH2_V6_BOOTSTRAP_REPLACEMENT_PLAN_V1_SYNTAX_GREEN")
          PY

      - name: Prove plan-only replacement boundary
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
          out="$RUNNER_TEMP/replacement-plan-proof.log"
          python3 -I -B "$proof" | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_REPLACE_PLAN_V1_PROOF_GREEN' \
            'target_blob_bound=true' \
            'content_id_ast_values_bound=true' \
            'merged_v6_install_helper_bound=true' \
            'repaired_candidate_lock_bound=true' \
            'repaired_materializer_bound=true' \
            'precruft_predecessor_identity_bound=true' \
            'repaired_target_identity_bound=true' \
            'predecessor_policy_current_tool_match_required=true' \
            'canonical_target_manifest_required=true' \
            'plan_only_no_apply_entry=true' \
            'protected_root_mutation_calls_absent=true' \
            'atomic_root_exchange_required=true' \
            'predecessor_retention_required=true' \
            'automatic_rollback_required=true' \
            'replacement_apply_authorized=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Verify source-only plan contract
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_replace_plan_v1.py"
          out="$RUNNER_TEMP/replacement-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$out"
          for marker in \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'create_only=false' \
            'atomic_root_exchange_required=true' \
            'predecessor_retention_required=true' \
            'automatic_rollback_required=true' \
            'replacement_apply_authorized=false' \
            'protected_filesystem_mutation=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done
          python3 -I -B "$target" --self-test | tee "$RUNNER_TEMP/replacement-self-test.log"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_REPLACE_PLAN_V1_SELF_TEST_GREEN' \
            "$RUNNER_TEMP/replacement-self-test.log"

          if python3 -I -B "$target" --apply >"$RUNNER_TEMP/apply.out" 2>"$RUNNER_TEMP/apply.err"; then
            echo "unexpected_apply_mode_accepted" >&2
            exit 1
          fi
          grep -F -- '--apply' "$RUNNER_TEMP/apply.err"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
