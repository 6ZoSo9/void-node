name: Buy VOID V3 capacity-safe protected source-generation successor

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs"
      - "docs/architecture/buy-void-verified-payment-v3-source-generation-acceptance-v1.md"
      - ".github/workflows/buy-void-verified-payment-v3-source-generation-acceptance-v1.yml"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_verified_payment_v2_trigger_closure_v1.mjs"
      - ".github/workflows/buy-void-verified-payment-transport-v2.yml"
      - "scripts/prove_buy_void_v2_custody_inspect_bridge_v1.mjs"
      - "scripts/prove_buy_void_verified_payment_transport_v2.ts"
      - "scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts"
      - "src/economic/buy_void_v2_custody_inspect_bridge_v1.mjs"
      - "src/economic/buy_void_verified_payment_transport_v2.ts"
      - "src/economic/buy_void_verified_payment_v2_allocation_stage.ts"
      - "docs/architecture/buy-void-verified-payment-capacity-fifo-nonblocking-v2.md"
      - "scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v1.yml"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - ".github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: V3 source successor / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Exact checkout and build
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs)" = "a0e17fb148d9f694dab00f1154dd8660d55f1b9b"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs)" = "d8282ff6bc403d7dacb6b902f80d21299ebc27f3"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-verified-payment-v3-source-generation-acceptance-v1.md)" = "812c02a2fdaa1a11aaaac75b74486ca473e0cb57"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts)" = "1b3d72c2eda967f5cd84d929cd80c62508cce16e"
          test "$(git rev-parse HEAD:src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = "d1320be22fe55af24017b84f0655fbcde82dbee9"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml)" = "521096800aa980e48b093f3019cf2f0429aadc5a"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v1.yml)" = "5fd9e86fb243dc0c049a00b2182d054eb36e9dff"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml)" = "e895675c1e104951dbef5e8d1a9331fa3eaca42a"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml)" = "006719f4ab28260f14890b3464c35f81b101cdba"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml)" = "1fae14285f11ffbfbfa9d5cd8c5112989e0b7eb6"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Prove V3 trigger closure
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs
          out="$RUNNER_TEMP/v3-trigger-${{ matrix.node }}.log"
          timeout 30s node scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs | tee "$out"
          grep -Fx "VOID_BUY_VOID_VERIFIED_PAYMENT_V3_TRIGGER_CLOSURE_V1_GREEN" "$out"
          grep -Fx "v3_composed_input_count=10" "$out"
          grep -Fx "v3_dedicated_trigger_closure=true" "$out"
          grep -Fx "protected_consumers_dispatch_v3=true" "$out"
      - name: Prove FIFO-safe capacity source at production open boundaries
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/capacity-fifo-${{ matrix.node }}.log"
          timeout 100s npx --no-install tsx scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts | tee "$out"
          grep -Fx "VOID_BUY_VOID_VERIFIED_PAYMENT_CAPACITY_FIFO_NONBLOCKING_V2_GREEN" "$out"
          grep -Fx "fifo_swap_at_real_production_open_rejected=true" "$out"
          grep -Fx "fifo_private_sidecar_swap_at_real_production_open_rejected=true" "$out"
      - name: Prove strict V3 composed source successor
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs
          receipt="$RUNNER_TEMP/v3-source-successor-${{ matrix.node }}.json"
          out="$RUNNER_TEMP/v3-source-successor-${{ matrix.node }}.log"
          timeout 150s node scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs --self-test | tee "$out"
          timeout 150s node scripts/prove_buy_void_repaired_v7_v3_current_generation_dispatch_v1.mjs --receipt > "$receipt"
          grep -Fx "VOID_BUY_VOID_REPAIRED_V7_V3_CURRENT_GENERATION_DISPATCH_V1_GREEN" "$out"
          grep -Fx "v2_source_proof_expected_capacity_refusal_preserved=true" "$out"
          grep -Fx "capacity_fifo_safe_source_exact=true" "$out"
          grep -Fx "capacity_fifo_proof_bound=true" "$out"
          grep -Fx "v3_five_workflow_dispatches_bound=true" "$out"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(p.marker,"VOID_BUY_VOID_REPAIRED_V7_V3_CURRENT_GENERATION_DISPATCH_V1");
          assert.equal(p.version,3);
          assert.equal(p.protected_path_count,49);
          assert.equal(p.nonprotected_economic_drift_count,6);
          assert.equal(p.added_v2_economic_source_count,3);
          assert.equal(p.fifo_safe_capacity_writer_bound,true);
          assert.equal(p.v2_source_proof_expected_capacity_refusal_preserved,true);
          assert.equal(p.current_built_census_identity_matches_frozen_v4,true);
          assert.equal(p.provider_source_identity_preserved,true);
          assert.equal(p.verified_payment_v2_route_mounted,false);
          assert.equal(p.payment_allocation_custody_authority,false);
          assert.equal(p.independent_source_acceptance_complete,false);
          assert.equal(p.successor_runtime_generation_accepted,false);
          assert.equal(p.public_presale_activation,false);
          assert.equal(p.funds_movement,false);
          NODE
      - name: Preserve V2 and V1 refusals
        run: |
          set -euo pipefail
          set +e
          timeout 120s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test             > "$RUNNER_TEMP/v2.stdout" 2> "$RUNNER_TEMP/v2.stderr"
          v2_result=$?
          timeout 120s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs --self-test             > "$RUNNER_TEMP/v1.stdout" 2> "$RUNNER_TEMP/v1.stderr"
          v1_result=$?
          set -e
          test "$v2_result" -ne 0
          grep -Fq "reconciliation_modified_allowed_current_main_drift:src/economic/buy_void_verified_payment_capacity_admission_v1.ts" "$RUNNER_TEMP/v2.stderr"
          test "$v1_result" -ne 0
          grep -Fq "unexpected_post_census_economic_drift" "$RUNNER_TEMP/v1.stderr"
          echo "historical_v2_capacity_refusal_preserved=true"
          echo "historical_v1_refusal_preserved=true"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-v3-source-successor-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/v3-source-successor-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-v3-source-successor-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: proof
      - name: Exact Node 22/24/26 V3 receipt equality
        run: |
          set -euo pipefail
          for version in 22 24 26; do
            test -s "proof/v3-source-successor-$version.json"
          done
          cmp proof/v3-source-successor-22.json proof/v3-source-successor-24.json
          cmp proof/v3-source-successor-22.json proof/v3-source-successor-26.json
          echo "VOID_BUY_VOID_V3_SOURCE_SUCCESSOR_CROSS_NODE_GREEN"
