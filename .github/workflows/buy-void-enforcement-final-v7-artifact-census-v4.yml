name: VOID Buy VOID final V7/V2 enforcement census v4

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_enforcement_v3_historical_predecessor_preservation_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v4.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_enforcement_v3_historical_predecessor_preservation_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v4.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact semantic generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Preserve frozen V4 census proof on exact V3 successor
        run: |
          set -euo pipefail
          echo "HISTORICAL_V4_CENSUS_CURRENT_V3_PRESERVATION_V1"
          out="$RUNNER_TEMP/final-v7-v2-census-v4-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_v3_historical_predecessor_preservation_v1.mjs             --receipt > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(r.schema,
            "void_buy_void_enforcement_v3_historical_predecessor_preservation_v1");
          assert.equal(r.marker,
            "VOID_BUY_VOID_ENFORCEMENT_V3_HISTORICAL_PREDECESSOR_PRESERVATION_V1");
          assert.equal(r.current_generation,"protected_v7_v2_v3");
          assert.equal(r.v4_census_proof_frozen,true);
          assert.equal(r.v5_census_successor_bound,true);
          assert.equal(r.v3_candidate_bound,true);
          assert.equal(r.v3_lock_bound,true);
          assert.equal(r.historical_predecessor_rederivation_required,false);
          assert.equal(r.production_source_finality_authority_ready,false);
          assert.equal(r.public_presale_activation,false);
          assert.equal(r.funds_movement,false);
          NODE
          echo "frozen_v4_census_rederived_on_v3=false"
          echo "current_v3_successor_verified=true"
          echo "public_presale_activation=false"
          echo "funds_movement=false"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-v7-v2-census-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-v7-v2-census-v4-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: final-v7-v2-census-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census
      - name: Require exact Node 22/24/26 V3 preservation equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "census/final-v7-v2-census-v4-node-$node.json"
          done
          cmp census/final-v7-v2-census-v4-node-22.json               census/final-v7-v2-census-v4-node-24.json
          cmp census/final-v7-v2-census-v4-node-22.json               census/final-v7-v2-census-v4-node-26.json
          sha256sum census/final-v7-v2-census-v4-node-22.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const r=JSON.parse(
            fs.readFileSync(
              "census/final-v7-v2-census-v4-node-22.json",
              "utf8",
            ),
          );
          assert.equal(r.marker,
            "VOID_BUY_VOID_ENFORCEMENT_V3_HISTORICAL_PREDECESSOR_PRESERVATION_V1");
          assert.equal(r.v4_census_proof_frozen,true);
          assert.equal(r.v5_census_successor_bound,true);
          assert.equal(r.v3_candidate_bound,true);
          assert.equal(r.v3_lock_bound,true);
          assert.equal(r.historical_predecessor_rederivation_required,false);
          assert.equal(r.public_presale_activation,false);
          assert.equal(r.funds_movement,false);
          console.log("VOID_BUY_VOID_FROZEN_V4_V3_PRESERVATION_CROSS_NODE_GREEN");
          console.log("frozen_v4_census_proof_preserved=true");
          console.log("current_v3_successor_verified=true");
          console.log("historical_predecessor_rederivation_required=false");
          console.log("funds_movement=false");
          NODE
