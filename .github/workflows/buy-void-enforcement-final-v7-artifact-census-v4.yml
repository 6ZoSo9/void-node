name: VOID Buy VOID final V7/V2 enforcement census v4

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v4.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v4.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact semantic generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Derive V4 census
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/final-v7-v2-census-v4-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_final_v7_artifact_census_v4");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_V7_ARTIFACT_CENSUS_V4");
          assert.equal(c.version,4);
          assert.equal(c.source_parent,"16563121f8d6c2a1fa7cd2f99ca4be2f88aa3cca");
          assert.equal(c.previous_integration_head,"d1e72d53dfb6b6a9b47ffbbc67b8c4c279c2ac86");
          assert.deepEqual(c.intentional_protected_delta_paths,[
            "src/economic/buy_void_ethereum_public_checkout_finality_gate_v1.ts",
          ]);
          assert.equal(c.economic_artifact_count,28);
          assert.equal(c.economic_source_file_count,28);
          assert.equal(c.protected_tracked_source_count,49);
          assert.equal(c.intentional_semantic_delta_verified,true);
          assert.equal(c.v1_live_process_receipt_rejected_after_v2_promotion,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.census_id,/^voidbefv7c4_[0-9a-f]{64}$/u);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-v7-v2-census-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-v7-v2-census-v4-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: final-v7-v2-census-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census
      - name: Require exact Node 22/24/26 census equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "census/final-v7-v2-census-v4-node-$node.json"; done
          cmp census/final-v7-v2-census-v4-node-22.json census/final-v7-v2-census-v4-node-24.json
          cmp census/final-v7-v2-census-v4-node-22.json census/final-v7-v2-census-v4-node-26.json
          sha256sum census/final-v7-v2-census-v4-node-22.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("census/final-v7-v2-census-v4-node-22.json","utf8"));
          console.log("VOID_BUY_VOID_FINAL_V7_V2_CENSUS_V4_CROSS_NODE_GREEN");
          console.log("census_id="+c.census_id);
          console.log("artifact_inventory_sha256="+c.economic_hosted_artifact_inventory_sha256);
          console.log("source_inventory_sha256="+c.economic_hosted_source_inventory_sha256);
          console.log("protected_inventory_sha256="+c.protected_tracked_source_inventory_canonical_sha256);
          console.log("candidate_enforcement_identity_accepted=false");
          console.log("funds_movement=false");
          NODE
