name: DataNet content commitment pre-sign revalidation v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-content-commitment-pre-sign-revalidation-v1.yml"
      - "tools/datanet-content-commitment-pre-sign-revalidation-v1.mjs"
      - "scripts/prove_datanet_content_commitment_pre_sign_revalidation_v1.mjs"
      - "schemas/datanet-content-commitment-pre-sign-revalidation-v1.schema.json"
      - "docs/architecture/datanet-content-commitment-pre-sign-revalidation-v1.md"
      - "tools/datanet-content-commitment-unsigned-call-plan-v1.mjs"
      - "tools/datanet-content-commitment-object-preflight-observer-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-content-commitment-pre-sign-revalidation-v1.yml"
      - "tools/datanet-content-commitment-pre-sign-revalidation-v1.mjs"
      - "scripts/prove_datanet_content_commitment_pre_sign_revalidation_v1.mjs"
      - "schemas/datanet-content-commitment-pre-sign-revalidation-v1.schema.json"
      - "docs/architecture/datanet-content-commitment-pre-sign-revalidation-v1.md"
      - "tools/datanet-content-commitment-unsigned-call-plan-v1.mjs"
      - "tools/datanet-content-commitment-object-preflight-observer-v1.mjs"

permissions:
  contents: read

concurrency:
  group: datanet-content-commitment-pre-sign-revalidation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove fresh pre-sign revalidation and dynamic binding
        run: |
          set -euo pipefail
          node --check tools/datanet-content-commitment-pre-sign-revalidation-v1.mjs
          node --check scripts/prove_datanet_content_commitment_pre_sign_revalidation_v1.mjs
          node scripts/prove_datanet_content_commitment_pre_sign_revalidation_v1.mjs
          git diff --exit-code
