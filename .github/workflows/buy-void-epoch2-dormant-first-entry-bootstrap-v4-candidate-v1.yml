name: Buy VOID Epoch-2 dormant first-entry bootstrap V4 candidate v1

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
  push:
    branches:
      - main
    paths:
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact generation and self-test
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py)" = "a14a7f56b1fb4ee14213fe9094adad14b45aae2f"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c)" = c7d2125b59dcbecc1d6aae8818e84cac8ce85da9
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf)" = a484a7d2e1159ebbef3357ec849af92d7f12cff1
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py --self-test | tee "$RUNNER_TEMP/self-test.log"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V4_CANDIDATE_V1_SELF_TEST_GREEN' "$RUNNER_TEMP/self-test.log"
          grep -Fx 'exact_source_generation_bound=true' "$RUNNER_TEMP/self-test.log"
          grep -Fx 'sealed_source_snapshot_required=true' "$RUNNER_TEMP/self-test.log"
          grep -Fx 'candidate_accepted=false' "$RUNNER_TEMP/self-test.log"
          grep -Fx 'protected_install_authorized=false' "$RUNNER_TEMP/self-test.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/self-test.log"
          git diff --check

  derive:
    name: derive bootstrap V4 candidate / ${{ matrix.lane }}
    needs: source-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive exact candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/candidate-v1"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py --derive-dir "$out" | tee "$RUNNER_TEMP/derive.log"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V4_CANDIDATE_V1_DERIVE_GREEN' "$RUNNER_TEMP/derive.log"
          grep -Fx 'source_generation_id=voidbuye2dormantsourcegen1_435345cd442c4d59760984c3445d178461cbbf163a0a53e760a392ca2d0bae77' "$RUNNER_TEMP/derive.log"
          grep -Fx 'sealed_source_snapshot=true' "$RUNNER_TEMP/derive.log"
          grep -Fx 'toolchain_revalidated_after_build=true' "$RUNNER_TEMP/derive.log"
          grep -Fx 'candidate_accepted=false' "$RUNNER_TEMP/derive.log"
          grep -Fx 'protected_install_authorized=false' "$RUNNER_TEMP/derive.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/derive.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1-${{ matrix.lane }}
          path: ${{ runner.temp }}/candidate-v1
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1-*
          path: ${{ runner.temp }}/candidates
      - name: Compare and independently rederive
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compare.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py --compare-dir "$RUNNER_TEMP/candidates" | tee "$out"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V4_CANDIDATE_V1_THREE_RUN_GREEN' "$out"
          grep -Fx 'three_report_bytes_identical=true' "$out"
          grep -Fx 'three_binary_bytes_identical=true' "$out"
          grep -Fx 'independent_rederivation_verified=true' "$out"
          grep -Fx 'candidate_accepted=false' "$out"
          grep -Fx 'protected_install_authorized=false' "$out"
          grep -Fx 'funds_movement=false' "$out"
          git diff --check
