name: VOID Buy credential query complete-set fingerprints v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v3.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v3.yml"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v3.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v3.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact V3 source generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c)" =             "fb2ecf7e3fbf4797d53f78369c13e84b792eead4"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs)" =             "2ab2e22182a6d165316bc2c9f48213c3c397f63b"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c)" =             "39b292a6353cc36bcc07a5425ff2c736372a7c83"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c)" =             "d8b30ac499c3bb8a5d223dbc6be687dd175be611"

      - name: Prove V3 native query
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-query-v3-proof.log"
          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_PROOF_GREEN"
            "v2_source_preserved=true"
            "accepted_peer_guard_preserved=true"
            "dropin_bound=64"
            "loadcredential_bound=32"
            "exactly_one_epoch2_credential_required=true"
            "unrelated_credentials_allowed=true"
            "complete_dropin_set_sha256_emitted=true"
            "complete_loadcredential_set_sha256_emitted=true"
            "same_length_set_substitution_detectable=true"
            "unrelated_credential_paths_emitted=false"
            "transcript_non_disclosure_executable=true"
            "credential_contents_read=false"
            "binary_acceptance=false"
            "protected_install_authorized=false"
            "live_query_authorized=false"
            "production_host_evidence_authority=false"
            "host_mutation=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
