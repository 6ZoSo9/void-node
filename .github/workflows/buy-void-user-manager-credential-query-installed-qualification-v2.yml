name: VOID Buy credential query installed qualification v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-installed-qualification-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-installed-qualification-v2.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source branch scope
        run: |
          set -euo pipefail
          base=bc6a81c13e250e038189905b898320a957d4b6f0
          git merge-base --is-ancestor "$base" HEAD
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-user-manager-credential-query-installed-qualification-v2.yml' \
            'docs/operators/buy-void-user-manager-credential-query-installed-qualification-v2.md' \
            'ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v2.py' \
            'scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v2.py' \
            | sort > "$expected"
          git diff --name-only "$base" HEAD -- | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$base" HEAD

      - name: Prove V3 qualification source
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/v3-installed-qualification-proof.log"
          python3 -I -B scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v2.py |
            tee "$proof"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V2_PROOF_GREEN' "$proof"
          grep -Fx 'complete_metadata_generation_sha256_required=true' "$proof"
          grep -Fx 'bounded_unrelated_credentials_allowed=true' "$proof"
          grep -Fx 'exactly_one_target_credential_required=true' "$proof"
          grep -Fx 'exactly_one_target_dropin_required=true' "$proof"
          grep -Fx 'v3_v1_v2_installed_generation_bound=true' "$proof"
          grep -Fx 'double_credential_query_required=true' "$proof"
          grep -Fx 'v6_security_generation_composition_required=true' "$proof"
          grep -Fx 'live_execution_authorized=false' "$proof"
          grep -Fx 'credential_contents_read=false' "$proof"
          grep -Fx 'host_mutation=false' "$proof"
          grep -Fx 'funds_movement=false' "$proof"

      - name: Diff hygiene
        run: git diff --check
