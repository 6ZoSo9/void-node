name: Buy VOID Epoch-2 protected bootstrap installed qualification v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
  push:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact installed-qualification generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          parent=39cf687363ed1cdd5cdc15d6f0b017ce8526f17f
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$parent" "$EXPECTED_HEAD"

          if [ "${{ github.event_name }}" = pull_request ]; then
            expected="$RUNNER_TEMP/expected-scope.txt"
            actual="$RUNNER_TEMP/actual-scope.txt"
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.yml' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.md' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py' \
              | sort > "$expected"
            git diff --name-only "$parent" "$EXPECTED_HEAD" -- | sort > "$actual"
            diff -u "$expected" "$actual"
          fi

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py)" = 8a11fe23eafbc945b8f5a437b6eb27012ed5bae9
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py)" = 8279c3bc31bb32b7953843dc178c20aac3088d08
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v1.md)" = 37b0aab668cc66fb1e4083603886168f75f029fb
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py)" = df3c27c57e0d413c7487189f1ddf6c141004d67c
          git diff --check "$parent" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax, self-test, plan and proof
        run: |
          set -euo pipefail

          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALLED_QUALIFICATION_V1_SYNTAX_GREEN")
          PY

          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py --self-test |
            tee "$RUNNER_TEMP/bootstrap-qual-self-test.log"

          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py --plan |
            tee "$RUNNER_TEMP/bootstrap-qual-plan.log"

          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v1.py |
            tee "$RUNNER_TEMP/bootstrap-qual-proof.log"

          grep -Fx \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALLED_QUALIFICATION_V1_PROOF_GREEN' \
            "$RUNNER_TEMP/bootstrap-qual-proof.log"

          for marker in \
            'qualifier_source_blob_bound=true' \
            'installer_source_blob_bound=true' \
            'exact_installed_root_required=true' \
            'root_python_policy_binding_required=true' \
            'double_bootstrap_self_test_required=true' \
            'descriptor_bound_bootstrap_self_test_required=true' \
            'visible_generation_revalidated_after_self_test=true' \
            'protected_installer_plan_execution=false' \
            'protected_installer_apply=false' \
            'credential_access=false' \
            'signing=false' \
            'transaction=false' \
            'rpc_call=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/bootstrap-qual-proof.log"
          done

      - run: git diff --check
