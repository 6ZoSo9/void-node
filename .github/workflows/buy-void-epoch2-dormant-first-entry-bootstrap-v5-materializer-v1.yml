name: Buy VOID Epoch-2 dormant first-entry bootstrap V5 materializer v1

on:
  pull_request:
    paths:
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v5-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_candidate_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf"
  push:
    branches: [main]
    paths:
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v5-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_candidate_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact materializer generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          lock_head=c39cb83038174dc37967b9c29c624a9dcc4e1db7
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$lock_head" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v5-materializer-v1.md' \
            'scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py' \
            | sort > "$expected"
          git diff --name-only "$lock_head" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py)" = b35e06ef8124a037d142366229f55473d765878b
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py)" = a03896bd5f9f469440850a8006678facc5914929
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v5-candidate-lock-v1.json)" = 46f8512395936f5fc81423ce31a5c9b88928a21f
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_candidate_v1.py)" = 2b17ad5aebd44caf8162b88ea9b9d7e25161c75e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5.c)" = 81fc960f1cec597b01875ed944b25e5b6574d34d
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v2.conf)" = 782f747cda24a214c64e8ec3f49b6791bbb62f97

          git diff --check "$lock_head" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and independent materializer proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V5_MATERIALIZER_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/materializer-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v5_materializer_v1.py | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V5_MATERIALIZER_V1_PROOF_GREEN' \
            'materializer_blob_bound=true' \
            'accepted_bootstrap_v5_lock_bound=true' \
            'candidate_tool_blob_bound=true' \
            'source_generation_manifest_bound=true' \
            'two_materializations_byte_identical=true' \
            'accepted_binary_bytes=874600' \
            'accepted_binary_sha256=4392f1aa3e35edf4e347fd81c15c9b1ba0810c71111f4e96dafcbf2e1cb52374' \
            'manifest_bytes=2382' \
            'manifest_sha256=3ab7f9b6e23c6fd2fe82486fd2a396c3bd207e335675e6c5bfe58776ab99d6ff' \
            'create_only_output_replay_rejected=true' \
            'artifact_publication_only=true' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Materialize exact accepted V5 install inputs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bootstrap-v5-install-inputs"
          receipt="$RUNNER_TEMP/epoch2-dormant-first-entry-bootstrap-v5-materialize.log"

          python3 -I -B scripts/materialize_buy_void_epoch2_dormant_first_entry_bootstrap_v5.py --derive-dir "$out" | tee "$receipt"

          bootstrap="$out/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v5"
          manifest="$out/source-generation-v2.conf"

          test "$(stat -c %s "$bootstrap")" = 874600
          test "$(stat -c %a "$bootstrap")" = 555
          test "$(sha256sum "$bootstrap" | awk '{print $1}')" = 4392f1aa3e35edf4e347fd81c15c9b1ba0810c71111f4e96dafcbf2e1cb52374

          test "$(stat -c %s "$manifest")" = 2382
          test "$(stat -c %a "$manifest")" = 444
          test "$(sha256sum "$manifest" | awk '{print $1}')" = 3ab7f9b6e23c6fd2fe82486fd2a396c3bd207e335675e6c5bfe58776ab99d6ff

          readelf -lW "$bootstrap" > "$RUNNER_TEMP/readelf.txt"
          if grep -F ' INTERP ' "$RUNNER_TEMP/readelf.txt"; then
            echo materialized_bootstrap_has_dynamic_interpreter >&2
            exit 1
          fi

          cp "$receipt" "$out/epoch2-dormant-first-entry-bootstrap-v5-materialize.log"

          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V5_MATERIALIZER_V1_DERIVE_GREEN' "$receipt"
          grep -Fx 'artifact_publication_only=true' "$receipt"
          grep -Fx 'protected_install_authorized=false' "$receipt"
          grep -Fx 'live_execution_authorized=false' "$receipt"
          grep -Fx 'funds_movement=false' "$receipt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-dormant-first-entry-bootstrap-v5-install-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bootstrap-v5-install-inputs
          if-no-files-found: error
          retention-days: 7

      - run: |
          set -euo pipefail
          git diff --check
