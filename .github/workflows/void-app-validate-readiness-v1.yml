name: VOID App Validate Read-only Readiness v1

on:
  pull_request:
    paths:
      - 'public/void-app-wave1-v1/**'
      - 'public/public-node/validators/mainnet0-validator-candidate-readiness-matrix-hold-v1.json'
      - 'scripts/prove_void_app_validate_readiness_v1.mjs'
      - '.github/workflows/void-app-validate-readiness-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'public/void-app-wave1-v1/**'
      - 'public/public-node/validators/mainnet0-validator-candidate-readiness-matrix-hold-v1.json'
      - 'scripts/prove_void_app_validate_readiness_v1.mjs'
      - '.github/workflows/void-app-validate-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Prove read-only Validate readiness
        run: node scripts/prove_void_app_validate_readiness_v1.mjs
