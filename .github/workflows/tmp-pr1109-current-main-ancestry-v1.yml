name: VOID PR1109 current-main ancestry reconciliation v1

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-pr1109-current-main-ancestry-v1.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/buy-void-production-live-canary-preflight-v1-20260808'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile exact current main ancestry and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feat/buy-void-production-live-canary-preflight-v1-20260808'
          EXPECTED_CHILD_HEAD='53b3885b8ef3d563c4032e836d69e0f46935d792'
          EXPECTED_MAIN='9baae72b868070803f2bb47e09d3a511dc56103d'
          EXPECTED_MERGE_BASE='a0cb7c67085fe079bd2af943fcad55b930f4fd45'
          HELPER='.github/workflows/tmp-pr1109-current-main-ancestry-v1.yml'

          CHILD_FILES=(
            '.github/workflows/buy-void-production-live-canary-preflight-v1.yml'
            'docs/operators/buy-void-production-live-canary-preflight-v1.md'
            'scripts/prove_buy_void_production_live_canary_preflight_v1.ts'
            'src/economic/buy_void_production_live_canary_preflight_v1.ts'
          )

          test "$(git rev-parse HEAD^)" = "$EXPECTED_CHILD_HEAD"
          test "$(git diff --name-only "$EXPECTED_CHILD_HEAD" HEAD)" = "$HELPER"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_CHILD_HEAD" "$EXPECTED_MAIN")" = "$EXPECTED_MERGE_BASE"
          test -z "$(git diff --name-only "$EXPECTED_MERGE_BASE" "$EXPECTED_MAIN")"

          actual_child_scope="$(git diff --name-only "$EXPECTED_MERGE_BASE" "$EXPECTED_CHILD_HEAD" | sort)"
          expected_child_scope="$(printf '%s\n' "${CHILD_FILES[@]}" | sort)"
          test "$actual_child_scope" = "$expected_child_scope"

          declare -A CHILD_BLOBS
          for f in "${CHILD_FILES[@]}"; do
            CHILD_BLOBS["$f"]="$(git rev-parse "$EXPECTED_CHILD_HEAD:$f")"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          git rm -- "$HELPER"

          for f in "${CHILD_FILES[@]}"; do
            test "$(git hash-object -- "$f")" = "${CHILD_BLOBS[$f]}"
          done

          final_scope="$(git diff --name-only "$EXPECTED_MAIN" | sort)"
          test "$final_scope" = "$expected_child_scope"
          git diff --check "$EXPECTED_MAIN"

          git commit -m 'chore: reconcile PR1109 with merged current main'

          new_head="$(git rev-parse HEAD)"
          parents="$(git show -s --format='%P' HEAD)"
          first_parent="$(printf '%s\n' "$parents" | awk '{print $1}')"
          second_parent="$(printf '%s\n' "$parents" | awk '{print $2}')"
          test "$second_parent" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$first_parent^")" = "$EXPECTED_CHILD_HEAD"

          final_committed_scope="$(git diff --name-only "$EXPECTED_MAIN" "$new_head" | sort)"
          test "$final_committed_scope" = "$expected_child_scope"
          test ! -e "$HELPER"

          git push origin "HEAD:$BRANCH"
