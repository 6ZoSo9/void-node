name: guard-secrets
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan staged diff for secrets
        run: |
          set -euo pipefail
          bad=$(git ls-files -z | xargs -0 -I{} sh -c 'grep -nEI "BEGIN (EC|RSA|OPENSSH) PRIVATE KEY|grafana\.token|Authorization: Bearer|x-api-key|x-secret" "{}" || true' || true)
          if [ -n "$bad" ]; then
            echo "$bad"; exit 1
          fi
