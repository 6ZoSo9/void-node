name: VOID Tor onion external reachability v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-tor-onion-external-reachability-v1.yml'
      - 'scripts/lib/void_tor_native_bootstrap_transport_v1.mjs'
      - 'tools/void-tor-agent-access-client-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-tor-onion-external-reachability-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install Tor client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor

      - name: Bootstrap isolated external Tor client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/void-tor-client-data" evidence
          printf '%s\n' \
            "DataDirectory $RUNNER_TEMP/void-tor-client-data" \
            "SocksPort 127.0.0.1:19051" \
            "SafeSocks 1" \
            "SafeLogging 1" \
            "ClientOnly 1" \
            "RunAsDaemon 0" \
            "Log notice stdout" \
            >"$RUNNER_TEMP/void-tor-client.conf"

          tor --verify-config -f "$RUNNER_TEMP/void-tor-client.conf"
          tor -f "$RUNNER_TEMP/void-tor-client.conf" >evidence/tor-client.log 2>&1 &
          echo "$!" >"$RUNNER_TEMP/void-tor-client.pid"

          for _ in $(seq 1 180); do
            if grep -Fq 'Bootstrapped 100% (done): Done' evidence/tor-client.log &&
               ss -H -ltn | awk '{print $4}' | grep -Eq '127\.0\.0\.1:19051$'; then
              echo "tor_bootstrap_100=true"
              echo "tor_socks_ready=true"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/void-tor-client.pid")" 2>/dev/null; then
              cat evidence/tor-client.log >&2
              exit 1
            fi
            sleep 1
          done

          cat evidence/tor-client.log >&2
          exit 1

      - name: Probe Nimo onion from outside network
        shell: bash
        env:
          ONION_BASE: 'http://6a4r6osb37sp2t6nbx7dpdnq5wfdzdrn5axt7t33kduzuznarqqpnkid.onion'
        run: |
          set -euo pipefail
          sleep 20
          success=0
          for attempt in 1 2 3; do
            echo "attempt=$attempt" | tee -a evidence/probe.log
            set +e
            ONION_BASE="$ONION_BASE" node --input-type=module <<'NODE' \
              >"evidence/probe-$attempt.out" 2>"evidence/probe-$attempt.err"
import { requestOnionJson } from "./scripts/lib/void_tor_native_bootstrap_transport_v1.mjs";

const sample = await requestOnionJson({
  base: process.env.ONION_BASE,
  socksHost: "127.0.0.1",
  socksPort: 19051,
  timeoutMs: 45000,
});

if (
  sample?.ready !== true ||
  !Number.isSafeInteger(sample?.head) ||
  sample.head < 1951058 ||
  sample?.gap !== 0 ||
  sample?.txroot_live !== 1
) {
  throw new Error(`outside onion readiness not exact-green: ${JSON.stringify(sample)}`);
}

console.log(JSON.stringify(sample));
console.log("external_onion_reachable=true");
console.log("external_onion_exact_green=true");
NODE
            rc=$?
            set -e
            cat "evidence/probe-$attempt.out" | tee -a evidence/probe.log || true
            cat "evidence/probe-$attempt.err" | tee -a evidence/probe.log >&2 || true
            if test "$rc" -eq 0; then
              success=1
              break
            fi
            sleep 20
          done

          test "$success" -eq 1
          echo "VOID_TOR_ONION_EXTERNAL_REACHABILITY_V1_GREEN"

      - name: Upload reachability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-tor-onion-external-reachability-v1-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
