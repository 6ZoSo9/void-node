name: VOID Buy VOID candidate reviewed source files v6

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_generation_provenance_v6.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs"
      - "docs/architecture/buy-void-source-finality-live-process-binding-v1.md"
      - "ops/precision/void_buy_void_source_finality_live_process_binding_receipt_install_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_receipt_install_v1.ts"
      - "docs/operators/buy-void-source-finality-live-process-binding-receipt-install-v1.md"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v6.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v7.ts"
      - "scripts/prove_buy_void_source_finality_v7_provider_pair_pre_rpc_v1.mjs"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "scripts/prove_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "docs/operators/buy-void-source-finality-v7-deployment-receipt-install-v1.md"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v6_deadline.ts"
      - "src/economic/buy_void_source_finality_authenticated_composition_v3.ts"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "Dockerfile"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v6.md"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v7.md"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v6-review-checklist.md"
      - ".github/workflows/buy-void-source-finality-generation-provenance-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_source_finality_generation_provenance_v6.ts \
            src/economic/buy_void_source_finality_generation_provenance_v7.ts \
            src/economic/buy_void_source_finality_live_process_binding_v1.ts \
            ops/precision/void_buy_void_source_finality_live_process_binding_receipt_install_v1.ts \
            scripts/prove_buy_void_source_finality_live_process_binding_receipt_install_v1.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v6.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v7.ts \
            ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            scripts/prove_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v6_deadline.ts

      - name: Prove reviewed source-file binding V6
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v6.ts

      - name: Prove dormant V7 deployment receipt and provider quorum
        run: |
          set -euo pipefail
          proof_log="$RUNNER_TEMP/source-finality-v7-root-proof.txt"
          sudo env "PATH=$PATH" ./node_modules/.bin/tsx \
            scripts/prove_buy_void_source_finality_generation_provenance_v7.ts \
            | tee "$proof_log"
          grep -Fx 'audited_post2865_enforcement_lock_bound=true' "$proof_log"
          grep -Fx 'deployment_receipt_enforcement_identity_bound=true' "$proof_log"
          grep -Fx 'same_live_process_binding_gate_required=true' "$proof_log"
          grep -Fx 'unverified_live_process_binding_not_promoted=true' "$proof_log"
          grep -Fx 'deployment_receipt_root_owned_ancestor_custody_required=true' "$proof_log"
          grep -Fx 'forged_deployment_object_rejected=true' "$proof_log"
          grep -Fx 'cloned_deployment_cannot_bypass_observation_brand=true' "$proof_log"
          grep -Fx 'deployment_classifier_gate_shadowed_by_unbranded_observation=true' "$proof_log"
          grep -Fx 'writable_parent_rejected=true' "$proof_log"
          grep -Fx 'root_custody_positive_exercised=true' "$proof_log"

      - name: Prove V7 root-custodied deployment receipt installer
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/source-finality-v7-receipt-installer.txt"
          sudo env "PATH=$PATH" ./node_modules/.bin/tsx \
            scripts/prove_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            | tee "$install_log"
          grep -Fx 'root_custodied_create_once_positive=true' "$install_log"
          grep -Fx 'repository_local_fsmonitor_ignored=true' "$install_log"
          grep -Fx 'matching_reapply_idempotent=true' "$install_log"
          grep -Fx 'mismatched_existing_receipt_rejected=true' "$install_log"
          grep -Fx 'funds_movement=false' "$install_log"

      - name: Prove V6 preflight shares the total deadline
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v6_deadline.ts

      - name: Preserve V3 authenticated composition
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3.ts

      - name: Preserve V3 truncated-response fail-closed behavior
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3_truncated_response.ts

      - name: Preserve V2 stable-policy authority
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authority_v2.ts

      - name: Preserve finalized-source RPC adapter
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts

      - name: Repository build
        run: npm run build

      - name: Prove executable provider-pair gate precedes RPC
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_v7_provider_pair_pre_rpc_v1.mjs
          proof_log="$RUNNER_TEMP/source-finality-v7-provider-pair-pre-rpc.txt"
          sudo env "PATH=$PATH" node scripts/prove_buy_void_source_finality_v7_provider_pair_pre_rpc_v1.mjs | tee "$proof_log"
          grep -Fx 'invalid_provider_pair_http_request_count=0' "$proof_log"
          grep -Fx 'invalid_provider_pair_https_request_count=0' "$proof_log"
          grep -Fx 'valid_provider_pair_reaches_https_request_sentinel=true' "$proof_log"
          grep -Fx 'real_v7_observer_invoked=true' "$proof_log"
          grep -Fx 'production_dependency_injection_seam_added=false' "$proof_log"
          grep -Fx 'real_network_contact=false' "$proof_log"
          grep -Fx 'public_presale_activation=false' "$proof_log"
          grep -Fx 'funds_movement=false' "$proof_log"

      - name: Prove same-live-process binding contract
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs
          node scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs

      - name: Prove root live-process binding receipt installer
        run: |
          set -euo pipefail
          installer_log="$RUNNER_TEMP/live-process-binding-installer.txt"
          sudo env "PATH=$PATH" ./node_modules/.bin/tsx \
            scripts/prove_buy_void_source_finality_live_process_binding_receipt_install_v1.ts \
            | tee "$installer_log"
          grep -Fx 'root_custodied_create_once_positive=true' "$installer_log"
          grep -Fx 'matching_reapply_idempotent=true' "$installer_log"
          grep -Fx 'mismatched_existing_receipt_rejected=true' "$installer_log"
          grep -Fx 'process_environment_allowlist_only=true' "$installer_log"
          grep -Fx 'funds_movement=false' "$installer_log"

      - name: Prove compiled V6 source-file resolution
        run: |
          node --input-type=module -e 'const v6 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v6.js"); const result = v6.verifyBuyVoidSourceFinalityRuntimeSourceFilesV6(); if (result.ok !== true || result.reviewed_source_files_verified !== true || result.verified_source_file_count !== "5") { console.error(JSON.stringify(result)); process.exit(1); } console.log("VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_V6_COMPILED_SOURCE_RESOLUTION_GREEN");'

      - name: Build production runtime image
        if: matrix.node == 24
        run: docker build -t void-v6-reviewed-source-runtime-proof .

      - name: Prove packaged runtime contains reviewed source set
        if: matrix.node == 24
        run: |
          docker run --rm --entrypoint node void-v6-reviewed-source-runtime-proof \
            --input-type=module \
            -e 'const v6 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v6.js"); const result = v6.verifyBuyVoidSourceFinalityRuntimeSourceFilesV6(); if (result.ok !== true || result.reviewed_source_files_verified !== true || result.verified_source_file_count !== "5") { console.error(JSON.stringify(result)); process.exit(1); } console.log("VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_V6_PACKAGED_RUNTIME_SOURCE_RESOLUTION_GREEN");'

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
