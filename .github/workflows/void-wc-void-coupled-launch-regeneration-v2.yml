name: VOID WC-VOID coupled launch regeneration v2

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-coupled-launch-regeneration-v2.yml"
      - "tools/void-wc-void-coupled-launch-regeneration-v2.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_regeneration_v2.mjs"
      - "docs/operators/wc-void-coupled-launch-regeneration-v2.md"
      - "ops/mainnet0/wc-void-coupled-launch-atomic-migration-plan-v2.json"
      - "docs/operators/wc-void-bounded-canary-evidence-v1.md"
      - "docs/operators/wc-void-market-vault-canonical-application-v1.md"
      - "docs/operators/wc-void-market-vault-runtime-attestation-import-v1.md"
      - "docs/operators/wc-void-market-vault-runtime-attestation-v1.md"
      - "docs/operators/wc-void-production-readiness-v1.md"
      - "scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_canonical_application_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_runtime_attestation_import_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_runtime_attestation_v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "tools/void-wc-void-bounded-canary-evidence-v1.mjs"
      - "tools/void-wc-void-market-vault-canonical-application-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-import-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_atomic_migration_plan_v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-coupled-launch-regeneration-v2.yml"
      - "tools/void-wc-void-coupled-launch-regeneration-v2.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_regeneration_v2.mjs"
      - "docs/operators/wc-void-coupled-launch-regeneration-v2.md"
      - "ops/mainnet0/wc-void-coupled-launch-atomic-migration-plan-v2.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-import-v1.mjs"
      - "tools/void-wc-void-market-vault-canonical-application-v1.mjs"
      - "tools/void-wc-void-bounded-canary-evidence-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_runtime_attestation_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_runtime_attestation_import_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_canonical_application_v1.mjs"
      - "scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs"
      - "docs/operators/wc-void-production-readiness-v1.md"
      - "docs/operators/wc-void-market-vault-runtime-attestation-v1.md"
      - "docs/operators/wc-void-market-vault-runtime-attestation-import-v1.md"
      - "docs/operators/wc-void-market-vault-canonical-application-v1.md"
      - "docs/operators/wc-void-bounded-canary-evidence-v1.md"
      - "scripts/prove_void_wc_void_coupled_launch_atomic_migration_plan_v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-coupled-launch-regeneration-v2.mjs
          node --check scripts/prove_void_wc_void_coupled_launch_regeneration_v2.mjs
          node --check scripts/prove_void_wc_void_coupled_launch_atomic_migration_plan_v2.mjs
      - name: Prove corrected coupled launch generation
        run: node scripts/prove_void_wc_void_coupled_launch_regeneration_v2.mjs
      - name: Prove atomic migration plan
        run: node scripts/prove_void_wc_void_coupled_launch_atomic_migration_plan_v2.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
