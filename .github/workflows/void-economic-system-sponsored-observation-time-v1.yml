name: VOID sponsored observation time v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-system-sponsored-observation-time-v1.yml"
      - "docs/operators/economic-system-sponsored-observation-time-v1.md"
      - "tools/void-economic-system-sponsored-observation-time-v1.mjs"
      - "scripts/prove_void_economic_system_sponsored_observation_time_v1.mjs"
      - "tools/void-economic-system-sponsored-reservation-store-v1.mjs"
      - "scripts/prove_void_economic_system_sponsored_reservation_store_v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-system-sponsored-observation-time-v1.yml"
      - "docs/operators/economic-system-sponsored-observation-time-v1.md"
      - "tools/void-economic-system-sponsored-observation-time-v1.mjs"
      - "scripts/prove_void_economic_system_sponsored_observation_time_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax
        run: |
          node --check tools/void-economic-system-sponsored-observation-time-v1.mjs
          node --check scripts/prove_void_economic_system_sponsored_observation_time_v1.mjs

      - name: Prove sponsored observation time
        run: node scripts/prove_void_economic_system_sponsored_observation_time_v1.mjs

      - name: Build parent bakery-lock dependency
        run: npm run build

      - name: Preserve sponsored reservation store
        run: node scripts/prove_void_economic_system_sponsored_reservation_store_v1.mjs

      - name: Verify source tree cleanliness
        run: test -z "$(git status --short)"

      - name: Diff hygiene
        run: git diff --check
