name: VOID node fleet atomic cutover v1

on:
  pull_request:
    paths:
      - "tools/void-node-fleet-atomic-cutover-v1.mjs"
      - "scripts/prove_void_node_fleet_atomic_cutover_v1.mjs"
      - "docs/operations/void-node-fleet-atomic-cutover-v1.md"
      - ".github/workflows/void-node-fleet-atomic-cutover-v1.yml"
      - "tools/void-node-fleet-drift-audit-v1.mjs"
      - "tools/void-node-fleet-source-convergence-v1.mjs"
      - "tools/void-node-fleet-process-freshness-audit-v1.mjs"
      - "tools/void-node-fleet-process-restart-controller-v1.mjs"
  push:
    branches: [main]
    paths:
      - "tools/void-node-fleet-atomic-cutover-v1.mjs"
      - "scripts/prove_void_node_fleet_atomic_cutover_v1.mjs"
      - "docs/operations/void-node-fleet-atomic-cutover-v1.md"
      - ".github/workflows/void-node-fleet-atomic-cutover-v1.yml"
      - "tools/void-node-fleet-drift-audit-v1.mjs"
      - "tools/void-node-fleet-source-convergence-v1.mjs"
      - "tools/void-node-fleet-process-freshness-audit-v1.mjs"
      - "tools/void-node-fleet-process-restart-controller-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-node-fleet-atomic-cutover-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-node-fleet-atomic-cutover-v1.mjs
          node --check scripts/prove_void_node_fleet_atomic_cutover_v1.mjs
      - name: Atomic cutover proof
        run: node scripts/prove_void_node_fleet_atomic_cutover_v1.mjs
      - name: Existing fleet regressions
        run: |
          node scripts/prove_void_node_fleet_source_convergence_v1.mjs
          node scripts/prove_void_node_fleet_process_restart_controller_v1.mjs
      - name: Diff hygiene
        run: git diff --check
