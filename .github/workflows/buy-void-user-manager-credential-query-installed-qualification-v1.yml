name: VOID Buy installed credential query qualification v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "docs/operators/buy-void-user-manager-credential-query-installed-qualification-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-installed-qualification-v1.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "docs/operators/buy-void-user-manager-credential-query-installed-qualification-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-installed-qualification-v1.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py",
              "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V1_SYNTAX_GREEN")
          PY

      - name: Run qualifier self-test
        run: |
          set -euo pipefail
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py             --self-test | tee "$RUNNER_TEMP/credential-installed-self.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V1_SELF_TEST_GREEN'             "$RUNNER_TEMP/credential-installed-self.log"

      - name: Prove exact qualification source
        run: |
          set -euo pipefail
          python3 -I -B             scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v1.py |
            tee "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V1_PROOF_GREEN'             "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'accepted_credential_lock_bound=true' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'installed_pair_generation_required=true' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'double_credential_query_required=true' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'v6_security_qualification_required=true' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'same_manager_mainpid_generation_composition_required=true' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/credential-installed-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/credential-installed-proof.log"

      - name: Prove inert live plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-installed-plan.log"
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py             --plan | tee "$out"
          grep -Fx 'credential_installed_pair_verification_required=true' "$out"
          grep -Fx 'credential_installed_generation_stability_required=true' "$out"
          grep -Fx 'double_credential_query_required=true' "$out"
          grep -Fx 'v6_security_qualification_required=true' "$out"
          grep -Fx 'same_manager_mainpid_generation_composition_required=true' "$out"
          grep -Fx 'credential_contents_read=false' "$out"
          grep -Fx 'query_execution=false' "$out"
          grep -Fx 'host_mutation=false' "$out"
          grep -Fx 'production_host_evidence_authority=false' "$out"
          grep -Fx 'next_action=SEPARATELY_AUTHORIZE_CREDENTIAL_QUERY_READ_ONLY_QUALIFICATION' "$out"

      - run: git diff --check
