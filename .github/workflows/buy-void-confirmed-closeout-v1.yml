name: Buy VOID confirmed closeout v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_confirmed_closeout_v1.ts"
      - "src/economic/buy_void_confirmed_closeout_runtime_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "scripts/prove_buy_void_confirmed_closeout_v1.ts"
      - "scripts/prove_buy_void_confirmed_closeout_runtime_v1.ts"
      - "scripts/prove_buy_void_confirmed_closeout_guard_v1.ts"
      - "docs/operators/buy-void-confirmed-closeout-v1.md"
      - ".github/workflows/buy-void-confirmed-closeout-v1.yml"
  push:
    branches:
      - "feat/buy-void-confirmed-closeout-v1"

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/prove_buy_void_confirmed_closeout_v1.ts
      - run: npx --no-install tsx scripts/prove_buy_void_confirmed_closeout_runtime_v1.ts
      - run: npx --no-install tsx scripts/prove_buy_void_confirmed_closeout_guard_v1.ts
      - run: npm run build
