name: VOID P2P authenticated UDP swarm relay control v1

on:
  pull_request:
    paths:
      - "src/p2p/udp_swarm_control_v1.ts"
      - "scripts/prove_void_p2p_udp_swarm_control_v1.ts"
      - "docs/public/void-p2p-udp-swarm-control-v1.md"
      - ".github/workflows/void-p2p-udp-swarm-control-v1.yml"
      - "src/p2p/udp_rendezvous_v1.ts"
      - "src/p2p/udp_swarm_upgrade_v1.ts"
      - "src/p2p/udp_secure_session_bootstrap_v1.ts"
  push:
    branches: [main]
    paths:
      - "src/p2p/udp_swarm_control_v1.ts"
      - "scripts/prove_void_p2p_udp_swarm_control_v1.ts"
      - "docs/public/void-p2p-udp-swarm-control-v1.md"
      - ".github/workflows/void-p2p-udp-swarm-control-v1.yml"
      - "src/p2p/udp_rendezvous_v1.ts"
      - "src/p2p/udp_swarm_upgrade_v1.ts"
      - "src/p2p/udp_secure_session_bootstrap_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-udp-swarm-control-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove authenticated UDP swarm relay control
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_control_v1.ts

      - name: Preserve swarm upgrade orchestrator
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_upgrade_v1.ts

      - name: Preserve authenticated rendezvous mapping
        run: npx --no-install tsx scripts/prove_void_p2p_udp_rendezvous_mapping_v1.ts

      - name: Preserve secure-session bootstrap
        run: npx --no-install tsx scripts/prove_void_p2p_udp_secure_session_bootstrap_v1.ts

      - name: Preserve peer-socket adapter
        run: npx --no-install tsx scripts/prove_void_p2p_udp_peer_socket_adapter_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            git diff --check HEAD^..HEAD
          fi
