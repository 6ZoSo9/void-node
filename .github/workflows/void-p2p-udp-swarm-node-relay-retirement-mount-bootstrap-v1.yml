name: VOID P2P UDP swarm Node relay retirement mount bootstrap v1

on:
  push:
    branches:
      - feat/p2p-udp-swarm-node-relay-retirement-mount-v1-20260809

permissions:
  contents: write

jobs:
  materialize-and-prove:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.ref == 'refs/heads/feat/p2p-udp-swarm-node-relay-retirement-mount-v1-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v6
        with:
          ref: feat/p2p-udp-swarm-node-relay-retirement-mount-v1-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact triggering head
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test "$(git branch --show-current)" = 'feat/p2p-udp-swarm-node-relay-retirement-mount-v1-20260809'

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize Node relay retirement mount
        run: python3 scripts/materialize_void_p2p_udp_swarm_node_relay_retirement_mount_v1.py

      - name: Prove Node relay retirement mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_relay_retirement_mount_v1.ts

      - name: Re-prove relay retirement executor
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_relay_retirement_executor_v1.ts

      - name: Re-prove Node direct-route health mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_direct_route_health_mount_v1.ts

      - name: Re-prove direct-route health probe
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_probe_v1.ts

      - name: Re-prove direct-route health observer
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_observer_v1.ts

      - name: Re-prove direct-route health policy
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_policy_v1.ts

      - name: Re-prove Node candidate promotion
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Re-prove Node candidate integration
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Working-tree diff hygiene
        run: git diff --check

      - name: Retire bootstrap carrier and verify staged scope
        run: |
          set -euo pipefail
          git rm -- .github/workflows/void-p2p-udp-swarm-node-relay-retirement-mount-bootstrap-v1.yml
          git rm -- scripts/materialize_void_p2p_udp_swarm_node_relay_retirement_mount_v1.py
          git add -- src/node_core.ts
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/void-p2p-udp-swarm-node-relay-retirement-mount-bootstrap-v1.yml'
            'scripts/materialize_void_p2p_udp_swarm_node_relay_retirement_mount_v1.py'
            'src/node_core.ts'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Commit proven source
        run: |
          set -euo pipefail
          git config user.name 'void-node-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: mount UDP swarm relay retirement in Node v1'

      - name: Push non-force branch advance
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/feat/p2p-udp-swarm-node-relay-retirement-mount-v1-20260809
