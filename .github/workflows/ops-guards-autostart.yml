name: Ops Guards (autostart)
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure single ExecStartPost drop-in
        run: |
          set -euo pipefail
          c=$(grep -Rl "ExecStartPost=.*proposer-autostart-http.sh" ops/systemd/user/void-node.service.d | wc -l || true)
          if [ "$c" -ne 1 ]; then
            echo "Expected exactly one autostart ExecStartPost drop-in, found $c"; exit 1
          fi
      - name: Prove proposer auto-start mutation guard
        run: npx tsx scripts/prove_proposer_auto_start_mutation_confirmation_guard_v1.ts
      - name: Prove proposer auto-stop shadow route closure
        run: npx tsx scripts/prove_proposer_auto_stop_shadow_route_v1.ts
