name: VOID Tor-native public bootstrap v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-tor-native-public-bootstrap-v1.yml'
      - 'docs/public/void-tor-native-public-bootstrap-v1.md'
      - 'scripts/lib/void_tor_native_bootstrap_transport_v1.mjs'
      - 'scripts/prove_void_tor_native_bootstrap_transport_v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-tor-native-public-bootstrap-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check Tor-native source
        run: |
          node --check scripts/lib/void_tor_native_bootstrap_transport_v1.mjs
          node --check scripts/prove_void_tor_native_bootstrap_transport_v1.mjs

      - name: Prove Tor-native transport boundary
        run: node scripts/prove_void_tor_native_bootstrap_transport_v1.mjs

  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Reject raw empty catches
        run: |
          ! grep -R -nE 'catch[[:space:]]*\{[[:space:]]*\}' \
            scripts/lib/void_tor_native_bootstrap_transport_v1.mjs \
            scripts/prove_void_tor_native_bootstrap_transport_v1.mjs
