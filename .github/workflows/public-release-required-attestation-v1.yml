name: VOID Public Release Required Attestation V1

on:
  pull_request:
    paths:
      - "release/bin/void-node-update"
      - "scripts/prove_public_release_required_attestation_v1.mjs"
      - "docs/public/release-update-channel-v1.md"
      - "docs/security/public-release-update-channel-v1-threat-model.md"
      - ".github/workflows/public-release-required-attestation-v1.yml"
  push:
    branches: [main]
    paths:
      - "release/bin/void-node-update"
      - "scripts/prove_public_release_required_attestation_v1.mjs"
      - "docs/public/release-update-channel-v1.md"
      - "docs/security/public-release-update-channel-v1-threat-model.md"
      - ".github/workflows/public-release-required-attestation-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check release/bin/void-node-update
          node --check scripts/prove_public_release_required_attestation_v1.mjs
      - name: Prove required stable attestation boundary
        run: node scripts/prove_public_release_required_attestation_v1.mjs
