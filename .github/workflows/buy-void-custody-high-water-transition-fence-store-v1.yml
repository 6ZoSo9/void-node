name: VOID Buy VOID custody transition fence store v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_high_water_transition_fence_store_v1.mjs"
      - "scripts/prove_buy_void_custody_high_water_transition_fence_store_v1.mjs"
      - "docs/architecture/buy-void-custody-high-water-transition-fence-store-v1.md"
      - ".github/workflows/buy-void-custody-high-water-transition-fence-store-v1.yml"
      - "src/economic/buy_void_custody_high_water_transition_fence_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-transition-fence-store-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check source-only store and proof
        run: |
          node --check src/economic/buy_void_custody_high_water_transition_fence_store_v1.mjs
          node --check scripts/prove_buy_void_custody_high_water_transition_fence_store_v1.mjs

      - name: Prove create-only permanent slot storage
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_custody_high_water_transition_fence_store_v1.mjs \
            | tee "transition-fence-store-node-${{ matrix.node }}.txt"
          for invariant in \
            'VOID_BUY_VOID_CUSTODY_HIGH_WATER_TRANSITION_FENCE_STORE_V1_GREEN' \
            'create_only_record_created_and_fsynced=true' \
            'exact_replay_performs_no_second_write=true' \
            'same_prior_competing_successor_rejected=true' \
            'malformed_existing_slot_retained_fail_closed=true' \
            'symlink_slot_rejected_without_cleanup=true' \
            'private_root_exact_0700_required=true' \
            'root_symlink_rejected=true' \
            'independent_process_competition_exactly_one_winner=true' \
            'record_deletion_allowed=false' \
            'partial_create_automatic_cleanup=false' \
            'high_water_write_performed=false' \
            'service_mounted=false' \
            'custody_reserve_method_enabled=false' \
            'custody_recover_method_enabled=false' \
            'production_allocation_mutation_ready=false' \
            'funds_moved=false'
          do
            grep -Fx "$invariant" "transition-fence-store-node-${{ matrix.node }}.txt"
          done

      - name: Upload synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-custody-transition-fence-store-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: transition-fence-store-node-${{ matrix.node }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact-head receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-custody-transition-fence-store-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./transition-fence-store

      - name: Require byte-identical Node 22 24 26 evidence
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "transition-fence-store/transition-fence-store-node-$v.txt"
          done
          cmp transition-fence-store/transition-fence-store-node-22.txt transition-fence-store/transition-fence-store-node-24.txt
          cmp transition-fence-store/transition-fence-store-node-22.txt transition-fence-store/transition-fence-store-node-26.txt
          echo "VOID_BUY_VOID_CUSTODY_HIGH_WATER_TRANSITION_FENCE_STORE_CROSS_NODE_GREEN"
          echo "record_deletion_allowed=false"
          echo "high_water_write_performed=false"
          echo "production_allocation_mutation_ready=false"
          echo "funds_moved=false"
