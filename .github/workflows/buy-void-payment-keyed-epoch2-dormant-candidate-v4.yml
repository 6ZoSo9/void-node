name: Buy VOID Epoch-2 dormant candidate v4 fee/receipt truth

on:
  pull_request:
    paths:
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v3.json"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v4.json"
      - "scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v4.mjs"
      - "docs/operators/buy-void-payment-keyed-epoch2-dormant-candidate-v4.md"
      - ".github/workflows/buy-void-payment-keyed-epoch2-dormant-candidate-v4.yml"
  push:
    branches: [main]
    paths:
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v3.json"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v4.json"
      - "scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v4.mjs"
      - "docs/operators/buy-void-payment-keyed-epoch2-dormant-candidate-v4.md"
      - ".github/workflows/buy-void-payment-keyed-epoch2-dormant-candidate-v4.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact V4 truth generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v3.json)" = \
            "04061934a537a1d91213cdd1f9110b46faca4cc7"
          test "$(git rev-parse HEAD:ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v4.json)" = \
            "e569c9211e01f14c7c00dd1c5041d4dfb0817609"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v4.mjs)" = \
            "402a5689a5bedfddb1abbcbf7f561ea41c3ec5d6"
      - name: Prove exact-chain-receipt fee precedence
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-dormant-v4.log"
          node scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v4.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_PAYMENT_KEYED_EPOCH2_DORMANT_CANDIDATE_V4_PROOF_GREEN"
            "predecessor_v3_git_blob_bound=true"
            "candidate_configuration_unchanged=true"
            "signer_credential_state_unchanged=true"
            "authority_unchanged=true"
            "exact_chain_receipt_required_for_all_fee_branches=true"
            "zero_fee_branch_preserved=true"
            "per_payment_native_gas_funding_branch_preserved=true"
            "standing_balance_fee_authority=false"
            "runtime_enabled=false"
            "runtime_apply_enabled=false"
            "credential_access=false"
            "transaction_signing=false"
            "transaction_broadcast=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done
      - run: git diff --check
