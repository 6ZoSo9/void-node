name: VOID P2P UDP swarm Node runtime mount v1

on:
  pull_request:
    paths:
      - '.env.example'
      - 'src/index.ts'
      - 'src/p2p/udp_swarm_node_runtime_mount_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_node_runtime_mount_v1.ts'
      - 'docs/public/void-p2p-udp-swarm-node-runtime-mount-v1.md'
      - '.github/workflows/void-p2p-udp-swarm-node-runtime-mount-v1.yml'

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove Node runtime mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_runtime_mount_v1.ts

      - name: Re-prove Node control mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts

      - name: Re-prove Node candidate promotion
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Re-prove single-socket UDP swarm runtime
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_single_socket_runtime_v1.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
