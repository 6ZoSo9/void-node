name: VOID Buy VOID hardened receipt range composition v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-v7-protected-substrate-install-v4.yml"
      - ".github/workflows/void-v7-source-release-full-history-reseal-v1.yml"
      - "docs/operators/buy-void-source-finality-v7-deployment-receipt-install-v1.md"
      - "docs/operators/buy-void-v7-protected-substrate-install-v4.md"
      - "docs/operators/void-v7-source-release-full-history-reseal-v1.md"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "ops/precision/void_buy_void_v7_protected_substrate_install_v4.py"
      - "ops/precision/void_v7_source_release_full_history_reseal_v1.py"
      - "scripts/prove_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "scripts/prove_buy_void_v7_protected_substrate_install_v4.py"
      - "scripts/prove_void_v7_source_release_full_history_reseal_v1.py"
      - "scripts/prove_buy_void_v7_v2_hardened_receipt_range_composition_v1.mjs"
      - "docs/architecture/buy-void-v7-v2-hardened-receipt-range-composition-v1.md"
      - ".github/workflows/buy-void-v7-v2-hardened-receipt-range-composition-v1.yml"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    name: composition / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact composition generation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v2_hardened_receipt_range_composition_v1.mjs)" = "d315de2997ca3b035f111f81071c5b346f88dbe6"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-v7-v2-hardened-receipt-range-composition-v1.md)" = "1dedd635506df6123fa8f8608d2c6a0e6aec5b56"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "5301c32f53c2a82435152e38b36486507a73f906"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json)" = "e530390e505d447ca0ad9e2a098ec6a819ae3e6c"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove composition
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_v7_v2_hardened_receipt_range_composition_v1.mjs
          node scripts/prove_buy_void_v7_v2_hardened_receipt_range_composition_v1.mjs --self-test
          node scripts/prove_buy_void_v7_v2_hardened_receipt_range_composition_v1.mjs --receipt > "$RUNNER_TEMP/composition-${{ matrix.node }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-hardened-receipt-range-composition-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/composition-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check e6336075802680577f4d3e82ab7384b5c212bb4c HEAD --

  cross-node:
    needs: [composition]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-hardened-receipt-range-composition-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: composition
      - name: Require Node 22 24 26 composition receipt equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "composition/composition-$node.json"; done
          cmp composition/composition-22.json composition/composition-24.json
          cmp composition/composition-22.json composition/composition-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("composition/composition-22.json","utf8"));
          assert.equal(r.marker,"VOID_BUY_VOID_V7_V2_HARDENED_RECEIPT_RANGE_COMPOSITION_V1");
          assert.equal(r.reviewed_protected_drift_count,1);
          assert.equal(r.reviewed_protected_drift.path,"ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts");
          assert.equal(r.candidate_v4_required,true);
          assert.equal(r.candidate_v4_accepted,false);
          assert.equal(r.public_presale_activation,false);
          assert.equal(r.funds_movement,false);
          console.log("VOID_BUY_VOID_V7_V2_HARDENED_RECEIPT_RANGE_COMPOSITION_V1_CROSS_NODE_GREEN");
          console.log("current_enforcement_tracked_source_inventory_sha256="+r.current_enforcement_tracked_source_inventory_sha256);
          NODE

  planner-hold:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck composed source
        run: npm run typecheck
      - name: Require accepted V3 lock to HOLD on hardened receipt row
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git switch -C main "$head"
          out="$RUNNER_TEMP/v3-lock-composition-hold.log"
          set +e
          npx tsx ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            --plan \
            --expected-commit "$head" \
            --expected-tree "$tree" \
            --accepted-enforcement-lock-path ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json \
            >"$out" 2>&1
          status=$?
          set -e
          cat "$out"
          test "$status" -eq 2
          grep -Fx 'marker=VOID_BUY_VOID_SOURCE_FINALITY_V7_DEPLOYMENT_RECEIPT_INSTALL_V1_HOLD' "$out"
          grep -Fx 'reason=accepted_enforcement_candidate_current_source_inventory_mismatch:ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts' "$out"
          test "$(grep -Fxc 'status=PLAN_GREEN' "$out" || true)" -eq 0
          echo 'accepted_v3_lock_hardened_receipt_hold=true'
          echo 'versioned_v4_candidate_required=true'
