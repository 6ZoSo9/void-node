name: VOID Buy user manager query ELF lock v5

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - ".github/workflows/buy-void-user-manager-query-elf-candidate-v5.yml"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v5.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v5.json"
      - "scripts/prove_void_buy_user_manager_query_elf_lock_v5.mjs"
      - "docs/operators/buy-void-user-manager-query-elf-lock-v5.md"
      - ".github/workflows/buy-void-user-manager-query-elf-lock-v5.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - ".github/workflows/buy-void-user-manager-query-elf-candidate-v5.yml"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v5.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v5.json"
      - "scripts/prove_void_buy_user_manager_query_elf_lock_v5.mjs"
      - "docs/operators/buy-void-user-manager-query-elf-lock-v5.md"
      - ".github/workflows/buy-void-user-manager-query-elf-lock-v5.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Rederive and verify exact V5 lock
        run: |
          set -euo pipefail
          proof=scripts/prove_void_buy_user_manager_query_elf_lock_v5.mjs
          out="$RUNNER_TEMP/user-manager-query-elf-lock-v5-${{ matrix.node }}.json"
          node "$proof" --self-test | tee "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_QUERY_ELF_LOCK_V5_GREEN' "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          grep -Fx 'control_group_service_interface_required=true' "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          grep -Fx 'candidate_accepted=true' "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          grep -Fx 'install_authorized=false' "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          grep -Fx 'live_query_authorized=false' "$RUNNER_TEMP/query-elf-lock-v5-proof.log"
          node "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-user-manager-query-elf-lock-v5.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-user-manager-query-elf-lock-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/user-manager-query-elf-lock-v5-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-user-manager-query-elf-lock-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks
      - name: Require exact V5 lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "locks/user-manager-query-elf-lock-v5-$node.json"
          done
          cmp locks/user-manager-query-elf-lock-v5-22.json locks/user-manager-query-elf-lock-v5-24.json
          cmp locks/user-manager-query-elf-lock-v5-22.json locks/user-manager-query-elf-lock-v5-26.json
          grep -F '"lock_id": "voidbuyumqelflock5_38121f2ca91940fafeb5aa4ead65a757f43e352bfeff82d7d4b6d7e085205b54"'             locks/user-manager-query-elf-lock-v5-22.json
          echo VOID_BUY_VOID_USER_MANAGER_QUERY_ELF_LOCK_V5_CROSS_NODE_GREEN
