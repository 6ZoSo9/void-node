name: Steam Read-Only Bridge Response Teardown V1

on:
  pull_request:
    paths:
      - "src/integrations/steam_readonly_bridge_v1.ts"
      - "scripts/prove_steam_readonly_bridge_v1.ts"
      - "scripts/prove_steam_readonly_bridge_response_teardown_v1.ts"
      - "docs/integrations/steam-readonly-bridge-v1.md"
      - ".github/workflows/steam-readonly-bridge-v1.yml"
      - ".github/workflows/steam-readonly-bridge-response-teardown-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/integrations/steam_readonly_bridge_v1.ts"
      - "scripts/prove_steam_readonly_bridge_v1.ts"
      - "scripts/prove_steam_readonly_bridge_response_teardown_v1.ts"
      - "docs/integrations/steam-readonly-bridge-v1.md"
      - ".github/workflows/steam-readonly-bridge-v1.yml"
      - ".github/workflows/steam-readonly-bridge-response-teardown-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Steam bridge scope
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --target ES2022
          --lib ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --strict
          --esModuleInterop
          --skipLibCheck
          --types node
          src/integrations/steam_readonly_bridge_v1.ts
          scripts/prove_steam_readonly_bridge_v1.ts
          scripts/prove_steam_readonly_bridge_response_teardown_v1.ts
      - name: Preserve canonical Steam bridge proof
        run: ./node_modules/.bin/tsx scripts/prove_steam_readonly_bridge_v1.ts
      - name: Prove rejected response teardown bounds
        run: ./node_modules/.bin/tsx scripts/prove_steam_readonly_bridge_response_teardown_v1.ts
      - name: Diff hygiene
        run: git diff --check
