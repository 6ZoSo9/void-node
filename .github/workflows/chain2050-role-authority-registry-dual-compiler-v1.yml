name: chain2050-role-authority-registry-dual-compiler-v1

on:
  pull_request:
    paths:
      - ".github/workflows/chain2050-role-authority-registry-dual-compiler-v1.yml"
      - "tools/chain2050-role-authority-registry-dual-compiler-v1.mjs"
      - "scripts/prove_chain2050_role_authority_registry_dual_compiler_v1.mjs"
      - "docs/security/chain2050-role-authority-registry-dual-compiler-v1.md"
      - "contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"

permissions:
  contents: read

concurrency:
  group: chain2050-role-authority-registry-dual-compiler-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check tools/chain2050-role-authority-registry-dual-compiler-v1.mjs
      - run: node scripts/prove_chain2050_role_authority_registry_dual_compiler_v1.mjs

  real-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate exact Paris Standard JSON input
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            CONTRACT_PATH,
            buildStandardJsonInput,
            canonicalJson,
            sha256,
          } from "./tools/chain2050-role-authority-registry-dual-compiler-v1.mjs";
          const source = fs.readFileSync(CONTRACT_PATH, "utf8");
          const input = buildStandardJsonInput(source);
          const file = process.env.RUNNER_TEMP + "/role-authority-solc-input.json";
          fs.writeFileSync(file, JSON.stringify(input, null, 2) + "\n");
          console.log("input=" + file);
          console.log(
            "standard_json_input_canonical_sha256=" +
            sha256(canonicalJson(input)),
          );
          NODE

      - name: Compile environment A — native official solc container
        run: |
          set -Eeuo pipefail
          INPUT="$RUNNER_TEMP/role-authority-solc-input.json"
          OUTPUT="$RUNNER_TEMP/role-authority-native-output.json"
          ENVIRONMENT="$RUNNER_TEMP/role-authority-native-environment.json"
          IMAGE="ethereum/solc:0.8.20"
          docker pull "$IMAGE"
          VERSION_OUTPUT="$(docker run --rm "$IMAGE" --version)"
          case "$VERSION_OUTPUT" in
            *0.8.20+commit.a1b79de6*) ;;
            *) echo "HOLD: native compiler release mismatch" >&2; exit 1 ;;
          esac
          docker run --rm -i "$IMAGE" --standard-json <"$INPUT" >"$OUTPUT"
          test -s "$OUTPUT"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          IMAGE_DIGEST="$(docker image inspect --format '{{join .RepoDigests ","}}' "$IMAGE" || true)"
          test -n "$IMAGE_ID"
          test -n "$IMAGE_DIGEST" || IMAGE_DIGEST="$IMAGE_ID"
          python3 - "$ENVIRONMENT" "$VERSION_OUTPUT" "$IMAGE_ID" "$IMAGE_DIGEST" <<'PY'
          import json, sys
          from pathlib import Path
          target, version, image_id, image_digest = sys.argv[1:]
          value = {
              "marker": "VOID_SOLC_COMPILER_ENVIRONMENT_V1",
              "compiler_release": "0.8.20+commit.a1b79de6",
              "kind": "native-container",
              "implementation": "ethereum-solc-native-linux-amd64",
              "version_output": version,
              "artifact_identity": image_digest,
              "image_id": image_id,
              "image_digest": image_digest,
          }
          Path(target).write_text(json.dumps(value, indent=2) + "\n")
          PY

      - name: Compile environment B — npm solc-js
        run: |
          set -Eeuo pipefail
          INPUT="$RUNNER_TEMP/role-authority-solc-input.json"
          OUTPUT="$RUNNER_TEMP/role-authority-solcjs-output.json"
          ENVIRONMENT="$RUNNER_TEMP/role-authority-solcjs-environment.json"
          COMPILER_DIR="$RUNNER_TEMP/role-authority-solcjs"
          mkdir -p "$COMPILER_DIR"
          npm init --yes --prefix "$COMPILER_DIR" >/dev/null
          npm install             --prefix "$COMPILER_DIR"             --ignore-scripts             --no-audit             --no-fund             --save-exact             solc@0.8.20
          SOLCJS="$COMPILER_DIR/node_modules/.bin/solcjs"
          test -x "$SOLCJS"
          VERSION_OUTPUT="$($SOLCJS --version)"
          case "$VERSION_OUTPUT" in
            *0.8.20+commit.a1b79de6*) ;;
            *) echo "HOLD: solc-js compiler release mismatch" >&2; exit 1 ;;
          esac
          "$SOLCJS" --standard-json <"$INPUT" >"$OUTPUT"
          test -s "$OUTPUT"
          python3 - "$COMPILER_DIR" "$ENVIRONMENT" "$VERSION_OUTPUT" "$(node --version)" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          target = Path(sys.argv[2])
          version_output = sys.argv[3]
          node_version = sys.argv[4]
          package = json.loads((root / "node_modules/solc/package.json").read_text())
          soljson = root / "node_modules/solc/soljson.js"
          lock = root / "package-lock.json"
          soljson_sha = hashlib.sha256(soljson.read_bytes()).hexdigest()
          lock_sha = hashlib.sha256(lock.read_bytes()).hexdigest()
          value = {
              "marker": "VOID_SOLC_COMPILER_ENVIRONMENT_V1",
              "compiler_release": "0.8.20+commit.a1b79de6",
              "kind": "npm-solcjs",
              "implementation": "solc-js-emscripten",
              "version_output": version_output,
              "artifact_identity": f"npm:solc@{package['version']}:soljson-sha256:{soljson_sha}",
              "package_version": package["version"],
              "node_version": node_version,
              "soljson_sha256": soljson_sha,
              "package_lock_sha256": lock_sha,
          }
          target.write_text(json.dumps(value, indent=2) + "\n")
          PY

      - name: Compare exact outputs and print compiled identity
        run: |
          set -Eeuo pipefail
          REVIEW="$RUNNER_TEMP/role-authority-dual-compiler-review.json"
          REVIEW_REPO="$RUNNER_TEMP/role-authority-dual-compiler-review-repo"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git clone --no-hardlinks --quiet "$GITHUB_WORKSPACE" "$REVIEW_REPO"
          git -C "$REVIEW_REPO" checkout --detach --quiet "$SOURCE_COMMIT"
          test "$(git -C "$REVIEW_REPO" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C "$REVIEW_REPO" status --porcelain=v1 --untracked-files=all)"
          node "$REVIEW_REPO/tools/chain2050-role-authority-registry-dual-compiler-v1.mjs" \
            --input "$RUNNER_TEMP/role-authority-solc-input.json" \
            --output-a "$RUNNER_TEMP/role-authority-native-output.json" \
            --environment-a "$RUNNER_TEMP/role-authority-native-environment.json" \
            --output-b "$RUNNER_TEMP/role-authority-solcjs-output.json" \
            --environment-b "$RUNNER_TEMP/role-authority-solcjs-environment.json" \
            --review-output "$REVIEW" \
            >/dev/null
          python3 - "$REVIEW" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["decision"]["status"] ==             "HOLD_PENDING_SOVEREIGN_BYTECODE_REVIEW_OWNER_DEPLOYER_BINDING_AND_UNSIGNED_DEPLOYMENT_TRANSACTION"
          assert value["comparison"]["creation_bytecode_exact_match"] is True
          assert value["comparison"]["runtime_template_exact_match"] is True
          assert value["comparison"]["expected_deployed_runtime_exact_match"] is True
          assert value["artifacts"]["constructor_owner_address"] is None
          assert value["artifacts"]["deployment_data_sha256"] is None
          assert all(flag is False for flag in value["authority"].values())
          print("reproducibility_id=" + value["reproducibility_id"])
          print("contract_source_sha256=" + value["source"]["contract_source_sha256"])
          print("standard_json_input_canonical_sha256=" + value["source"]["standard_json_input_canonical_sha256"])
          print("creation_bytecode_sha256=" + value["artifacts"]["creation_bytecode_sha256"])
          print("runtime_template_sha256=" + value["artifacts"]["runtime_template_sha256"])
          print("expected_deployed_runtime_sha256=" + value["artifacts"]["expected_deployed_runtime_sha256"])
          print("immutable_empty_registry_root_sha256=" + value["artifacts"]["immutable_empty_registry_root_sha256"])
          print("runtime_immutable_references=" + json.dumps(value["artifacts"]["runtime_immutable_references"], separators=(",", ":")))
          print("abi_sha256=" + value["artifacts"]["abi_sha256"])
          print("metadata_sha256=" + value["artifacts"]["metadata_sha256"])
          print("storage_layout_sha256=" + value["artifacts"]["storage_layout_sha256"])
          print("method_identifiers_sha256=" + value["artifacts"]["method_identifiers_sha256"])
          print("VOID_CHAIN2050_ROLE_AUTHORITY_REGISTRY_DUAL_COMPILER_V1_REAL_OUTPUT_GREEN")
          PY

      - run: npm run typecheck
