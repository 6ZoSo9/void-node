name: Buy VOID Epoch-2 native protected install v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v1.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v1.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-native-protected-install-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py",
              "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py",
          ):
              compile(
                  Path(relative).read_text("utf-8"),
                  relative,
                  "exec",
                  dont_inherit=True,
              )
          print("VOID_BUY_VOID_EPOCH2_NATIVE_PROTECTED_INSTALL_V1_SYNTAX_GREEN")
          PY

      - name: Prove protected install contract and exact candidate preparation
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/epoch2-native-protected-install-proof.txt"
          python3 -I -B \
            scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py \
            | tee "$OUT"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V1_PROOF_GREEN' \
            'accepted_v3_lock_bound=true' \
            'offhost_exact_candidate_preparation=true' \
            'native_candidate_sha256_bound=true' \
            'runner_candidate_sha256_bound=true' \
            'create_only=true' \
            'atomic_directory_publication=true' \
            'root_node_identity_policy_bound=true' \
            'expected_source_head_policy_bound=true' \
            'explicit_apply_confirmation_required=true' \
            'host_apply_executed=false' \
            'live_execution=false' \
            'credential_access=false' \
            'private_key_access=false' \
            'signing=false' \
            'transaction=false' \
            'service_mutation=false' \
            'public_presale_activation=false' \
            'wc_void_market_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$OUT"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
