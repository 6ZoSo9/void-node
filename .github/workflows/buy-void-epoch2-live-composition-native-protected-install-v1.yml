name: Buy VOID Epoch-2 native protected install v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v1.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v1.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact reviewed generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py)" =             "f572868ea0edacbb3404771b793c4c60f9471abb"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py)" =             "9bf80ac153c7dfae9eb550f9df7b5366fa999faa"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json)" =             "57f965a944031eac90d69b4104b0f8f2473e66cc"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c)" =             "4aa091e7835b32aa5c4e7b8e4059651c69a64eb3"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs)" =             "92e8c8696ea7e2bb81b6ef089db8baa657188935"
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" =             "14cbe81e27d04fee77cbe75225ce308bf8561a7b"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py)" =             "8dc5d53dfcc52c261a3da0ee692f3a4fcc0bfc4c"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py",
              "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_NATIVE_PROTECTED_INSTALL_V1_SYNTAX_GREEN")
          PY

      - name: Prove protected install source
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v1.py |
            tee "$RUNNER_TEMP/e2-native-install-proof.log"
          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_PROTECTED_INSTALL_V1_PROOF_GREEN"
            "accepted_v3_lock_bound=true"
            "accepted_native_binary_rederived=true"
            "accepted_runner_bytes_bound=true"
            "fixed_node_measured_not_installed=true"
            "runtime_user_git_checkout_binding=true"
            "expected_plan_id_apply_binding=true"
            "create_only_atomic_publication=true"
            "truthful_post_publication_failure_receipt=true"
            "protected_install_authorized=false"
            "live_execution_authorized=false"
            "credential_access_authorized=false"
            "signing_authorized=false"
            "transaction_authorized=false"
            "payment_acceptance_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "funds_movement_authorized=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$RUNNER_TEMP/e2-native-install-proof.log"
          done

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-native-install-source-plan.log"
          python3 -I -B             ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v1.py             --source-plan | tee "$out"
          grep -Fx 'source_only=true' "$out"
          grep -Fx 'host_read=false' "$out"
          grep -Fx 'host_write=false' "$out"
          grep -Fx 'create_only=true' "$out"
          grep -Fx 'node_generation_bound_at_plan_apply=true' "$out"
          grep -Fx 'expected_main_head_bound_at_plan_apply=true' "$out"
          grep -Fx 'truthful_post_publication_failure_receipt_required=true' "$out"
          grep -Fx 'protected_install_authorized=false' "$out"
          grep -Fx 'live_execution_authorized=false' "$out"
          grep -Fx 'funds_movement_authorized=false' "$out"

      - run: git diff --check
