name: VOID economic epoch2 DataNet registry deployment prerequisites v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-datanet-registry-deployment-prerequisites-v1.yml"
      - "ops/mainnet0/economic-epoch2-datanet-registry-deployment-prerequisites-v1.json"
      - "scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs"
      - "ops/mainnet0/datanet-content-commitment-compiled-identity-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "docs/operators/economic-epoch2-datanet-registry-deployment-prerequisites-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-epoch2-datanet-registry-deployment-prerequisites-v1.yml"
      - "ops/mainnet0/economic-epoch2-datanet-registry-deployment-prerequisites-v1.json"
      - "scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs"
      - "ops/mainnet0/datanet-content-commitment-compiled-identity-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "docs/operators/economic-epoch2-datanet-registry-deployment-prerequisites-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs
      - run: node scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs
      - run: git diff --check
