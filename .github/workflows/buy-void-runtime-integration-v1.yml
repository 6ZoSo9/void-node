name: Buy VOID Runtime Integration v1

on:
  push:
    branches:
      - main
    paths:
      - "src/index.ts"
      - "src/economic/buy_void_*.ts"
      - "scripts/prove_buy_void_*.ts"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"
      - "scripts/prove_buy_void_nimo_original_v1_current_v2_bridge_v1.mjs"
      - "scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs"
      - "docs/architecture/buy-void-nimo-witness-v2-proposed-lock-v1.json"
  pull_request:
    paths:
      - "src/index.ts"
      - "src/economic/buy_void_*.ts"
      - "scripts/prove_buy_void_*.ts"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"
      - "scripts/prove_buy_void_nimo_original_v1_current_v2_bridge_v1.mjs"
      - "scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs"
      - "docs/architecture/buy-void-nimo-witness-v2-proposed-lock-v1.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci --ignore-scripts
      - name: Focused Buy VOID TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
      - name: Build exact current runtime before compiled-byte proofs
        run: |
          set -euo pipefail
          npm run build
      - name: Runtime integration proofs
        run: |
          ./node_modules/.bin/tsx scripts/prove_buy_void_runtime_integration_v1.ts
          ./node_modules/.bin/tsx scripts/prove_buy_void_runtime_integration_guard_v1.ts
      - name: Create disposable PostgreSQL factory credentials
        shell: bash
        run: |
          set -euo pipefail
          cred_dir="/run/credentials/void-postgres-runtime-${GITHUB_RUN_ID}"
          sudo install -d -m 0755 /run/credentials
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$cred_dir"
          printf '%s' 'void-ci-postgres-password-v1' \
            > "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          chmod 0400 "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=localhost' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout "$RUNNER_TEMP/postgres-runtime-proof-key.pem" \
            -out "$cred_dir/buy-void-dispatcher-postgres-ca-v1" \
            >/dev/null 2>&1
          chmod 0400 "$cred_dir/buy-void-dispatcher-postgres-ca-v1"
          echo "VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY=$cred_dir" >> "$GITHUB_ENV"
          echo "VOID_TEST_POSTGRES_SERVER_KEY_PATH=$RUNNER_TEMP/postgres-runtime-proof-key.pem" >> "$GITHUB_ENV"
      - name: Buy VOID proof stack
        run: |
          set -euo pipefail
          for proof in scripts/prove_buy_void_*.ts
          do
            echo "VOID_BUY_VOID_PROOF_STACK_BEGIN=$proof"
            case "$proof" in
              scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'exact reviewed dispatcher source drift' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq '0e27a76e777c326d2d9e2b1550b7f2979fca9abb' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq 'eb4fb37c6073415228b312663c45a99d5015c727' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_DISPATCH_V1_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'exact reviewed dispatcher source drift' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq '0e27a76e777c326d2d9e2b1550b7f2979fca9abb' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq 'eb4fb37c6073415228b312663c45a99d5015c727' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_DISPATCH_V2_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v2.ts)
                # Frozen V2 is historical. The current replay source is a
                # separately reviewed generation and the old proof must HOLD.
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'reviewed source changed:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq '0a74a3652081c3e142d0b887676771a7ac148f32' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq 'e3c659194a95394dd53b1960aed559e3950a89e1' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_DUAL_RAIL_V2_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v2.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'reviewed handoff source blob mismatch:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_HANDOFF_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'reviewed handoff source blob mismatch:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq '435ed6000caad046f48fb318fbc7c865393f3b6c' "$RUNNER_TEMP/$(basename "$proof").hold"
                grep -Fq 'e3c659194a95394dd53b1960aed559e3950a89e1' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_HANDOFF_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts)
                # This exact proof and Nimo V3 bundle are frozen historical generations.
                # Current source is qualified by crash V6, joint custody, package
                # preservation and the dedicated Nimo admission workflows. Do not
                # execute or silently repin the historical proof against successor bytes.
                test "$(git hash-object -- "$proof")" = "4ef9379ff3130795533a7d2d59b5f737eafa0a00"
                test "$(git hash-object scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs)" = "56e581b15e133f751070df1d5cf432ae4568cce8"
                test "$(git hash-object src/economic/buy_void_allocation_reservation_ledger_v1.ts)" = "9debe79943ba4622bb6b976ccbcfabf36b8429e3"
                test "$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)" = "e3c659194a95394dd53b1960aed559e3950a89e1"
                echo "VOID_HISTORICAL_WITNESS_BUNDLE_PROOF_PRESERVED_CURRENT_FIRST_ORIGINAL_GENERATION=$proof"
                continue
                ;;
              scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts)
                # Frozen V3 Nimo runtime-bundle candidate was built from source main
                # 851513f... and must not be rederived against the final first-original generation.
                test "$(git hash-object -- "$proof")" = "0d8778b937f564eee5eabfcdb554c6ea8ffde0c8"
                test "$(git hash-object src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts)" = "453550bcab9c5caf192c6d9d813bce9ce4433b0a"
                test "$(git hash-object scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs)" = "56e581b15e133f751070df1d5cf432ae4568cce8"
                test "$(git hash-object src/economic/buy_void_allocation_reservation_ledger_v1.ts)" = "9debe79943ba4622bb6b976ccbcfabf36b8429e3"
                test "$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)" = "e3c659194a95394dd53b1960aed559e3950a89e1"
                echo "VOID_HISTORICAL_WITNESS_BUNDLE_V3_PROOF_PRESERVED_CURRENT_FIRST_ORIGINAL_GENERATION=$proof"
                continue
                ;;
              scripts/prove_buy_void_source_finality_generation_provenance_v4.ts|scripts/prove_buy_void_source_finality_generation_provenance_v4_deadline.ts|scripts/prove_buy_void_source_finality_generation_provenance_v5.ts|scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts|scripts/prove_buy_void_allocation_custody_qualification_v1.ts)
                # Historical source/custody generations remain covered by
                # dedicated preservation workflows. Current source-finality is
                # V6 and current custody writer identity is V2.
                continue
                ;;
            esac
            ./node_modules/.bin/tsx "$proof"
            echo "VOID_BUY_VOID_PROOF_STACK_GREEN=$proof"
          done
      - name: Remove disposable PostgreSQL factory credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY:-}"; then
            sudo rm -rf -- "$VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY"
          fi
          rm -f "$RUNNER_TEMP/postgres-runtime-proof-key.pem"
      # Preserve independent diagnostics without masking an earlier proof failure.
      # Do not start these steps after cancellation or failed prerequisites.
      - name: Build after proof failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Diff hygiene after proof failures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: git diff --check
