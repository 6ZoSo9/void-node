name: Buy VOID Runtime Integration v1

on:
  push:
    branches:
      - main
    paths:
      - "src/index.ts"
      - "src/economic/buy_void_*.ts"
      - "scripts/prove_buy_void_*.ts"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"
  pull_request:
    paths:
      - "src/index.ts"
      - "src/economic/buy_void_*.ts"
      - "scripts/prove_buy_void_*.ts"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci --ignore-scripts
      - name: Focused Buy VOID TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
      - name: Runtime integration proofs
        run: |
          ./node_modules/.bin/tsx scripts/prove_buy_void_runtime_integration_v1.ts
          ./node_modules/.bin/tsx scripts/prove_buy_void_runtime_integration_guard_v1.ts
      - name: Create disposable PostgreSQL factory credentials
        shell: bash
        run: |
          set -euo pipefail
          cred_dir="/run/credentials/void-postgres-runtime-${GITHUB_RUN_ID}"
          sudo install -d -m 0755 /run/credentials
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$cred_dir"
          printf '%s' 'void-ci-postgres-password-v1' \
            > "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          chmod 0400 "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=localhost' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout "$RUNNER_TEMP/postgres-runtime-proof-key.pem" \
            -out "$cred_dir/buy-void-dispatcher-postgres-ca-v1" \
            >/dev/null 2>&1
          chmod 0400 "$cred_dir/buy-void-dispatcher-postgres-ca-v1"
          echo "VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY=$cred_dir" >> "$GITHUB_ENV"
          echo "VOID_TEST_POSTGRES_SERVER_KEY_PATH=$RUNNER_TEMP/postgres-runtime-proof-key.pem" >> "$GITHUB_ENV"
      - name: Buy VOID proof stack
        run: |
          for proof in scripts/prove_buy_void_*.ts
          do
            case "$proof" in
              scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts)
                # Original V1 is a frozen HISTORICAL generation, not a
                # current-V2 witness acceptance test. It MUST reject the
                # changed current compiled auto-fulfillment bytes. Preserve
                # both SHA pins and prove its specific mismatch explicitly.
                test "$(git hash-object src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts)" = "d2e84643c9f4d76c642c7e07d4ea2bf1634035e4"
                test "$(sha256sum dist/economic/buy_void_auto_fulfillment_v1.js | cut -d ' ' -f1)" = "119a08db651cb85091f66ed2c9e475c56a81f21c9084c47c7f8ee083f831a47c"
                frozen_v1_log="$RUNNER_TEMP/buy-void-frozen-nimo-v1-current-mismatch.log"
                if ./node_modules/.bin/tsx "$proof" > "$frozen_v1_log" 2>&1; then
                  echo "ERROR: frozen V1 unexpectedly accepted changed current witness bytes" >&2
                  exit 1
                fi
                grep -F "reviewed runtime bundle file bytes changed: dist/economic/buy_void_auto_fulfillment_v1.js" "$frozen_v1_log"
                grep -F "sha256:ae15c56f1aa7009955058ca1d454da5e0d55a3e6c2011c54e7316374e33a5cf6" "$frozen_v1_log"
                grep -F "sha256:119a08db651cb85091f66ed2c9e475c56a81f21c9084c47c7f8ee083f831a47c" "$frozen_v1_log"
                echo "VOID_NIMO_FROZEN_V1_CURRENT_V2_MISMATCH_HELD_GREEN"
                echo "historical_v1_manifest_rewritten=false"
                echo "current_v2_nimo_witness_installed=false"
                echo "current_v2_nimo_witness_accepted=false"
                echo "production_payment_allocation_authority=false"
                rm -f "$frozen_v1_log"
                continue
                ;;
              scripts/prove_buy_void_source_finality_generation_provenance_v4.ts|scripts/prove_buy_void_source_finality_generation_provenance_v4_deadline.ts|scripts/prove_buy_void_source_finality_generation_provenance_v5.ts|scripts/prove_buy_void_source_finality_generation_provenance_v5_deadline.ts|scripts/prove_buy_void_allocation_custody_qualification_v1.ts)
                # Historical source/custody generations remain covered by
                # dedicated preservation workflows. Current source-finality is
                # V6 and current custody writer identity is V2.
                continue
                ;;
            esac
            ./node_modules/.bin/tsx "$proof"
          done
      - name: Remove disposable PostgreSQL factory credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY:-}"; then
            sudo rm -rf -- "$VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY"
          fi
          rm -f "$RUNNER_TEMP/postgres-runtime-proof-key.pem"
      # Preserve independent diagnostics without masking an earlier proof failure.
      # Do not start these steps after cancellation or failed prerequisites.
      - name: Build after proof failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Diff hygiene after proof failures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: git diff --check
