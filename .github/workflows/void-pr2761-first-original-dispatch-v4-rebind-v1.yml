name: VOID PR2761 first-original dispatcher V4 diagnostic v1

on:
  push:
    branches:
      - ren/buy-void-preappend-detached-json-v1-20261010
    paths:
      - .github/workflows/void-pr2761-first-original-dispatch-v4-rebind-v1.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: void-pr2761-first-original-dispatch-v4-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce author phase without publishing
        id: reproduce
        env:
          EXPECTED_BRANCH: ren/buy-void-preappend-detached-json-v1-20261010
          EXPECTED_PARENT: 8a2ea4688c693540e6733276410fae3efbccf377
          STAGER: .github/workflows/void-pr2761-first-original-dispatch-v4-rebind-v1.yml
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$STAGER"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
              "git", "show",
              "5313dbee1f57cc8e8f7d1e8295b1a1e88de85d7c:.github/workflows/void-pr2761-first-original-dispatch-v4-rebind-v1.yml",
          ]).decode("utf-8")
          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n"
          start = source.index(opener) + len(opener)
          end = source.index(closer, start)
          lines = source[start:end].splitlines()
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          Path("/tmp/void-pr2761-author.py").write_text(body, encoding="utf-8")
          PY

          set +e
          python3 /tmp/void-pr2761-author.py > /tmp/author.log 2>&1
          rc=$?
          set -e

          {
            echo "VOID_PR2761_FIRST_ORIGINAL_DISPATCH_V4_DIAGNOSTIC_V1"
            echo "head=$GITHUB_SHA"
            echo "author_rc=$rc"
            echo "changed_paths_begin"
            git status --short
            echo "changed_paths_end"
            echo "author_log_begin"
            cat /tmp/author.log
            echo "author_log_end"
          } | tee /tmp/diagnostic.txt

          echo "author_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish bounded diagnostic to PR 2761
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /tmp/diagnostic.txt
          bytes="$(wc -c < /tmp/diagnostic.txt | tr -d ' ')"
          test "$bytes" -le 20000
          body="$(printf 'Guarded V4 rebind diagnostic for `%s`:\n\n```text\n%s\n```\n\nNo source publication, branch rewrite, host mutation, payment, or funds action occurred.' "$GITHUB_SHA" "$(cat /tmp/diagnostic.txt)")"
          gh api --method POST "/repos/$REPOSITORY/issues/2761/comments" -f body="$body" >/dev/null

      - name: Preserve fail-closed result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.reproduce.outputs.author_rc }}" = "0"
