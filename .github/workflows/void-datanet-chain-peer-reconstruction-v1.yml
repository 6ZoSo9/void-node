name: VOID DataNet Chain-2050 peer reconstruction v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-datanet-chain-peer-reconstruction-replica-accounting-v1.yml"
      - ".github/workflows/void-datanet-chain-peer-reconstruction-v1.yml"
      - "docs/architecture/datanet-chain-peer-reconstruction-replica-accounting-v1.md"
      - "docs/architecture/datanet-chain-peer-reconstruction-v1.md"
      - "scripts/lib/void_datanet_chain_peer_reconstruction_v1.mjs"
      - "scripts/prove_void_datanet_chain_peer_reconstruction_replica_accounting_v1.mjs"
      - "scripts/prove_void_datanet_chain_peer_reconstruction_v1.mjs"
      - "scripts/prove_void_datanet_reconstruction_evidence_v1.mjs"
      - "scripts/void_datanet_reconstruction_evidence_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-datanet-chain-peer-reconstruction-replica-accounting-v1.yml"
      - ".github/workflows/void-datanet-chain-peer-reconstruction-v1.yml"
      - "docs/architecture/datanet-chain-peer-reconstruction-replica-accounting-v1.md"
      - "docs/architecture/datanet-chain-peer-reconstruction-v1.md"
      - "scripts/lib/void_datanet_chain_peer_reconstruction_v1.mjs"
      - "scripts/prove_void_datanet_chain_peer_reconstruction_replica_accounting_v1.mjs"
      - "scripts/prove_void_datanet_chain_peer_reconstruction_v1.mjs"
      - "scripts/prove_void_datanet_reconstruction_evidence_v1.mjs"
      - "scripts/void_datanet_reconstruction_evidence_v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-datanet-chain-peer-reconstruction-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: planner (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_DEFINITION_SHA^{commit}" || git fetch --no-tags origin "$WORKFLOW_DEFINITION_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Run proofs and write canonical receipt
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: node scripts/void_datanet_reconstruction_evidence_v1.mjs emit planner "$RUNNER_TEMP/datanet-planner-receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datanet-member-planner-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/datanet-planner-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

  accounting:
    uses: ./.github/workflows/void-datanet-chain-peer-reconstruction-replica-accounting-v1.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      definition_sha: ${{ github.workflow_sha }}

  aggregate:
    if: ${{ always() }}
    needs: [planner, accounting]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_DEFINITION_SHA^{commit}" || git fetch --no-tags origin "$WORKFLOW_DEFINITION_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: datanet-member-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/datanet-members
          merge-multiple: false
      - name: Verify exactly six current receipts and replay source proofs
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          PLANNER_RESULT: ${{ needs.planner.result }}
          ACCOUNTING_RESULT: ${{ needs.accounting.result }}
        run: node scripts/void_datanet_reconstruction_evidence_v1.mjs aggregate "$RUNNER_TEMP/datanet-members" "$RUNNER_TEMP/datanet-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datanet-matrix-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/datanet-bundle/bundle.json
          if-no-files-found: error
          retention-days: 30
