name: Authenticated Paid Work Production Rollback Plan v1

on:
  pull_request:
    paths:
      - .github/workflows/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.yml
      - docs/operations/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.md
      - ops/mainnet0/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.json
      - schemas/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.schema.json
      - scripts/prove_authenticated_paid_work_runtime_disabled_production_rollback_plan_v1.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.yml
      - docs/operations/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.md
      - ops/mainnet0/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.json
      - schemas/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.schema.json
      - scripts/prove_authenticated_paid_work_runtime_disabled_production_rollback_plan_v1.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-production-rollback-plan-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove source-only fail-closed rollback plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bind Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse rollback plan and schema
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("ops/mainnet0/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("schemas/authenticated-paid-work-runtime-disabled-production-rollback-plan-v1.schema.json", "utf8"))'

      - name: Prove exact source-only rollback boundary
        run: node scripts/prove_authenticated_paid_work_runtime_disabled_production_rollback_plan_v1.mjs
