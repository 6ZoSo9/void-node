name: VOID Realms single canonical world v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-realms-single-canonical-world-region-checkpoint-handoff-v1.yml"
      - "docs/architecture/void-realms-single-canonical-world-region-checkpoint-handoff-v1.md"
      - "examples/void-realms-single-canonical-world-region-checkpoint-handoff-v1.example.json"
      - "schemas/void-realms-single-canonical-world-region-checkpoint-handoff-v1.schema.json"
      - "src/game/void_realms_single_canonical_world_region_checkpoint_handoff_v1.ts"
      - "scripts/prove_void_realms_single_canonical_world_region_checkpoint_handoff_v1.ts"
      - "ops/mainnet0/probe_void_realms_single_world_host_readiness_v1.py"
      - "integrations/luanti/void_realms_world/mod.conf"
      - "integrations/luanti/void_realms_world/init.lua"
      - "integrations/luanti/void_realms_world/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-realms-single-canonical-world-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Parse JSON artifacts
        run: |
          python3 -m json.tool schemas/void-realms-single-canonical-world-region-checkpoint-handoff-v1.schema.json >/dev/null
          python3 -m json.tool examples/void-realms-single-canonical-world-region-checkpoint-handoff-v1.example.json >/dev/null
      - name: Compile read-only host probe
        run: |
          python3 -m py_compile ops/mainnet0/probe_void_realms_single_world_host_readiness_v1.py
      - name: Typecheck source
        run: npm run typecheck
      - name: Prove canonical world contract
        run: |
          npx tsx scripts/prove_void_realms_single_canonical_world_region_checkpoint_handoff_v1.ts
