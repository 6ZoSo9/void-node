name: VOID WC-VOID related-identity evidence manifest v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-opening-related-identity-evidence-manifest-v1.yml"
      - "tools/void-wc-void-opening-related-identity-evidence-manifest-v1.mjs"
      - "scripts/prove_void_wc_void_opening_related_identity_evidence_manifest_v1.mjs"
      - "docs/operators/wc-void-opening-related-identity-evidence-manifest-v1.md"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-wc-void-opening-related-identity-evidence-manifest-v1.yml"
      - "tools/void-wc-void-opening-related-identity-evidence-manifest-v1.mjs"
      - "scripts/prove_void_wc_void_opening_related_identity_evidence_manifest_v1.mjs"
      - "docs/operators/wc-void-opening-related-identity-evidence-manifest-v1.md"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-related-identity-evidence-manifest-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check tools/void-wc-void-opening-related-identity-evidence-manifest-v1.mjs
          node --check scripts/prove_void_wc_void_opening_related_identity_evidence_manifest_v1.mjs

      - name: Prove unsigned related-identity evidence manifest
        run: node scripts/prove_void_wc_void_opening_related_identity_evidence_manifest_v1.mjs

      - name: Diff hygiene
        run: git diff --check
