        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/canonical-txsubmit-admission-dedupe-v1-20260823"
          test "$(git rev-parse HEAD^)" = "9b9f39a1c98e076172a6e5058de750d912e46e25"
          test -z "$(git status --porcelain)"

