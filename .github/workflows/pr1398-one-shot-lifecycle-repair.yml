name: pr1398-one-shot-lifecycle-repair

on:
  push:
    branches:
      - fix/canonical-txsubmit-admission-dedupe-v1-20260823
    paths:
      - ".github/workflows/pr1398-one-shot-lifecycle-repair.yml"

permissions:
  contents: write

concurrency:
  group: pr1398-one-shot-lifecycle-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == '6ZoSo9/void-node' && github.event.before == '9b9f39a1c98e076172a6e5058de750d912e46e25'
