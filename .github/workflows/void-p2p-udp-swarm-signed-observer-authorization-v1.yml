name: VOID P2P UDP swarm signed observer authorization v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-p2p-udp-swarm-signed-observer-authorization-v1.yml"
      - "docs/public/void-p2p-udp-swarm-signed-observer-authorization-v1.md"
      - "scripts/lib/void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"
      - "scripts/prove_void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"
  push:
    branches:
      - "fix/p2p-udp-swarm-signed-observer-authorization-v1-20260812"
    paths:
      - ".github/workflows/void-p2p-udp-swarm-signed-observer-authorization-v1.yml"
      - "docs/public/void-p2p-udp-swarm-signed-observer-authorization-v1.md"
      - "scripts/lib/void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"
      - "scripts/prove_void_p2p_udp_swarm_signed_observer_authorization_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove signed observer authorization
        run: node scripts/prove_void_p2p_udp_swarm_signed_observer_authorization_v1.mjs

      - name: Re-prove verified discovery composition
        run: node --import tsx scripts/prove_void_p2p_udp_swarm_verified_discovery_composition_v1.mjs

      - name: Repository checks
        run: |
          npm run typecheck
          npm run build

      - name: Diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" ]] && [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            git diff --check HEAD^..HEAD
          fi
