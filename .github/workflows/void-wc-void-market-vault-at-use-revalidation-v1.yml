name: VOID WC/VOID market-vault at-use revalidation v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-at-use-revalidation-v1.yml"
      - "docs/operators/wc-void-market-vault-at-use-revalidation-v1.md"
      - "scripts/prove_void_wc_void_market_vault_at_use_revalidation_v1.mjs"
      - "tools/void-wc-void-market-vault-at-use-revalidation-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-import-v1.mjs"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-market-vault-at-use-revalidation-v1.yml"
      - "docs/operators/wc-void-market-vault-at-use-revalidation-v1.md"
      - "scripts/prove_void_wc_void_market_vault_at_use_revalidation_v1.mjs"
      - "tools/void-wc-void-market-vault-at-use-revalidation-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "tools/void-wc-void-market-vault-runtime-attestation-import-v1.mjs"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-market-vault-at-use-revalidation-v1.mjs
          node --check scripts/prove_void_wc_void_market_vault_at_use_revalidation_v1.mjs
      - name: Prove at-use market-vault revalidation
        run: node scripts/prove_void_wc_void_market_vault_at_use_revalidation_v1.mjs
      - name: Existing market-vault runtime regressions
        run: |
          node scripts/prove_void_wc_void_market_vault_runtime_attestation_v1.mjs
          node scripts/prove_void_wc_void_market_vault_runtime_attestation_import_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
