name: VOID public seed DataNet static v1

on:
  pull_request:
    paths:
      - "ops/public/public-seed-adapter-v1.mjs"
      - "scripts/prove_void_public_seed_datanet_static_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-public-seed-datanet-static-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/public/public-seed-adapter-v1.mjs"
      - "scripts/prove_void_public_seed_datanet_static_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-public-seed-datanet-static-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check ops/public/public-seed-adapter-v1.mjs
          node --check scripts/prove_void_public_seed_datanet_static_v1.mjs

      - name: Prove exact DataNet static surface
        run: node scripts/prove_void_public_seed_datanet_static_v1.mjs

      - name: Prove shallow committed-range diff hygiene contract
        if: matrix.node == 24
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
