name: VOID Buy credential query ELF lock v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v1.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v1.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v1.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v1.mjs"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v1.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v1.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v1.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v1.mjs"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Rederive exact candidate and lock
        run: |
          set -euo pipefail
          proof=scripts/prove_void_buy_user_manager_credential_query_elf_lock_v1.mjs
          out="$RUNNER_TEMP/credential-query-elf-lock-v1-${{ matrix.node }}.json"

          node "$proof" --self-test | tee "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V1_GREEN' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'credential_query_preexec_pair_execution_proven=true' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'candidate_accepted=true' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'install_authorized=false' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'live_query_authorized=false' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/credential-query-lock-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/credential-query-lock-proof.log"

          node "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json

      - name: Reprove fixed-path hostile-loader boundary
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -static -fno-pie -no-pie -Wl,--build-id=none             -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -Wl,--build-id=none             -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"
          test "$(sha256sum "$pre" | awk '{print $1}')" =             "67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c"
          test "$(sha256sum "$query" | awk '{print $1}')" =             "7b968a20f1507215477f43a59c5d82b9e9adca918ce5f2df566292d8380b4cb1"
          test "$(stat -Lc '%s' "$pre")" -eq 706504
          test "$(stat -Lc '%s' "$query")" -eq 43064
          readelf -l "$pre" > "$RUNNER_TEMP/preexec.readelf"
          ! grep -F ' INTERP ' "$RUNNER_TEMP/preexec.readelf"
          file "$pre" | grep -F 'statically linked'

          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1
          original_opt_mode="$(stat -Lc '%a' /opt)"
          cleanup() {
            sudo rm -f "$root/$pre_name" "$root/$query_name" || true
            sudo rmdir "$root" 2>/dev/null || true
            sudo chmod "$original_opt_mode" /opt || true
          }
          trap cleanup EXIT
          sudo chmod go-w /opt
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          sudo install -o root -g root -m 0555 "$query" "$root/$query_name"

          fake="$RUNNER_TEMP/credential-lock-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-lock-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\""             "$fake/preload.c" -o "$fake/preload.so"

          rm -f "$sentinel"
          if sudo env                VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1                LD_PRELOAD="$fake/preload.so"                "$root/$query_name" --self-test                >"$RUNNER_TEMP/direct-query.log" 2>&1; then
            echo direct_poisoned_credential_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          sudo env LD_PRELOAD="$fake/preload.so"             "$root/$pre_name" --exec-self-test |
            tee "$RUNNER_TEMP/preexec-query.log"
          test ! -e "$sentinel"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V1_SELF_TEST_GREEN'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/preexec-query.log"

          cleanup
          trap - EXIT
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V1_HOSTILE_LOADER_GREEN

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-lock-v1-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/credential-query-elf-lock-v1-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-lock-v1-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks

      - name: Require exact lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "locks/credential-query-elf-lock-v1-$node.json"
          done
          cmp locks/credential-query-elf-lock-v1-22.json locks/credential-query-elf-lock-v1-24.json
          cmp locks/credential-query-elf-lock-v1-22.json locks/credential-query-elf-lock-v1-26.json
          grep -F '"lock_id": "voidbuyumqcredelflock1_9cac1929a16f130e176ba3af998963defeacdd7e2b73467ca02bbf89cb4763eb"'             locks/credential-query-elf-lock-v1-22.json
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V1_CROSS_NODE_GREEN
