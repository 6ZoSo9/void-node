name: Agent Paid Work Credential WC Account Binding Lifecycle V1

on:
  pull_request:
    paths:
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-lifecycle-v1.yml"
      - "docs/operators/agent-paid-work-credential-wc-account-binding-lifecycle-v1.md"
      - "fixtures/agent-paid-work/credential-wc-account-binding-registry-v1.example.json"
      - "schemas/agent-paid-work-credential-wc-account-binding-registry-v1.schema.json"
      - "scripts/agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs"
      - "scripts/prove_agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs"
  push:
    paths:
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-lifecycle-v1.yml"
      - "docs/operators/agent-paid-work-credential-wc-account-binding-lifecycle-v1.md"
      - "fixtures/agent-paid-work/credential-wc-account-binding-registry-v1.example.json"
      - "schemas/agent-paid-work-credential-wc-account-binding-registry-v1.schema.json"
      - "scripts/agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs"
      - "scripts/prove_agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs"

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs
      - run: node --check scripts/prove_agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs
      - run: node scripts/prove_agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs
