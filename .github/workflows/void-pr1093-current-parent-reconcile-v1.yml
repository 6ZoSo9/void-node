name: VOID PR1093 current-parent reconcile v1

on:
  push:
    branches:
      - 'feat/p2p-authenticated-peer-public-key-retention-v1-20260807'
    paths:
      - '.github/workflows/void-pr1093-current-parent-reconcile-v1.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reconcile current parent, prove, self-delete, and fast-forward
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH='feat/p2p-authenticated-peer-public-key-retention-v1-20260807'
          BASE_BRANCH='feat/p2p-ephemeral-direct-mount-v1-20260807'
          EXPECTED_FEATURE_HEAD='b7016778c90caae0d5af0c12f161302569d0748f'
          EXPECTED_STAGING_PARENT='cfabd3bb50bf0d8d42e22bc8c4db9a54631e6453'
          EXPECTED_BASE='a3553991c3ec02659f1d41649d254a5a19dd4f4e'
          TEMP='.github/workflows/void-pr1093-current-parent-reconcile-v1.yml'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          test "$(git diff --name-only "$EXPECTED_FEATURE_HEAD" HEAD)" = "$TEMP"

          git fetch --no-tags origin "$BASE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "$EXPECTED_BASE"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = 'src/node_core.ts'
          fi

          # Current parent owns node_core; retain only PR1093's two-line
          # authenticated public-key retention seam.
          git checkout "$EXPECTED_BASE" -- src/node_core.ts

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/node_core.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'HOLD: {label} anchor count={count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  remoteHello?: VoidPeerHelloV1;\n  authTimer: NodeJS.Timeout | null;',
              '  remoteHello?: VoidPeerHelloV1;\n  authenticatedPublicPem?: string;\n  authTimer: NodeJS.Timeout | null;',
              'peer authenticated PEM field',
          )
          replace_once(
              '    peer.id = auth.id;\n    peer.handshakeDone = true;\n    peer.listens = [...auth.listen];',
              '    peer.id = auth.id;\n    peer.handshakeDone = true;\n    peer.authenticatedPublicPem = auth.pubkey;\n    peer.listens = [...auth.listen];',
              'accepted AUTH PEM retention',
          )

          path.write_text(text)
          PY

          git add src/node_core.ts
          git rm -- "$TEMP"
          test -z "$(git diff --name-only --diff-filter=U)"

          actual_scope="$(git diff --name-only "$EXPECTED_BASE" | sort)"
          expected_scope="$(printf '%s\n' \
            '.github/workflows/void-p2p-authenticated-peer-public-key-retention-v1.yml' \
            'docs/public/void-p2p-authenticated-peer-public-key-retention-v1.md' \
            'scripts/prove_void_p2p_authenticated_peer_public_key_retention_v1.ts' \
            'src/node_core.ts' | sort)"
          test "$actual_scope" = "$expected_scope"

          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_public_key_retention_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts
          npx --no-install tsx scripts/prove_void_p2p_udp_swarm_control_v1.ts
          npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts
          npm run typecheck
          npm run build
          git diff --cached --check "$EXPECTED_BASE"

          git commit -m 'chore: reconcile authenticated peer public-key retention with current parent'
          git push origin "HEAD:$BRANCH"
