name: Buy VOID Epoch-2 live composition native candidate v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v3-source.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-v6.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind reconciled source generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_parent=5deec4ea5126ef657e0ae0e4a212423f9438e0a2
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$source_parent" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-candidate-v6.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-candidate-v6.md' \
            'scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py' \
            | sort > "$expected"
          git diff --name-only "$source_parent" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = \
            5021727f1def1ec11f870d735cab65acc1701a5e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" = \
            499df9b94b5b89354837570da0c7e47ec280025d
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py)" = \
            b48972c0f930f5a33754a390bd2289853fc93c93
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-live-composition-native-preentry-v3-source.yml)" = \
            428bd68439ab5b7251632107839346d6b18fc769
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" = \
            14cbe81e27d04fee77cbe75225ce308bf8561a7b
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py)" = \
            696eacfd72ba31ae4b00a1ddf98e91b0cabb5134

          git diff --check "$source_parent" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Re-run reconciled native source proof
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-v3-source-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py |
            tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_NATIVE_PREENTRY_V3_SOURCE_PROOF_GREEN' \
            'v3_runner_source_blob_bound=true' \
            'v3_fixed_root_separate=true' \
            'v3_parent_proof_schema_separate=true' \
            'native_first_instruction_preserved=true' \
            'runner_digest_policy_binding_preserved=true' \
            'node_digest_policy_binding_preserved=true' \
            'native_parent_retained_for_child_lifetime=true' \
            'preproof_hold_access_false=true' \
            'postfork_preproof_root_javascript_indeterminate=true' \
            'postfork_preproof_sensitive_access_false=true' \
            'postproof_hold_access_indeterminate=true' \
            'postproof_root_javascript_state_truthful=true' \
            'abnormal_child_receipt_truthful=true' \
            'candidate_accepted=false' \
            'install_authorized=false' \
            'live_execution_authorized=false' \
            'credential_content_access=false' \
            'transaction=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  derive:
    name: derive v6 candidate / ${{ matrix.lane }}
    needs: source-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive static-closure candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/candidate.json"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py \
            --derive "$out" | tee "$RUNNER_TEMP/derive.txt"
          for marker in \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_positive_control=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/derive.txt"
          done
          cat "$out"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-native-candidate-v6-${{ matrix.lane }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: independently compare v6 candidate closure
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-epoch2-native-candidate-v6-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false

      - name: Self-test candidate verifier
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/self-test.txt"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py \
            --self-test | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_V6_SELF_TEST=GREEN' \
            'source_blob_bound=true' \
            'two_local_builds_required=true' \
            'three_hosted_reports_required=true' \
            'comparison_rederives_elf=true' \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Require three-run equality and independent re-derivation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compare.txt"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_candidate_v6.py \
            --compare-dir "$RUNNER_TEMP/candidates" | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_V6_THREE_RUN_GREEN' \
            'three_run_report_bytes_identical=true' \
            'comparison_rederived_elf=true' \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - run: git diff --check
