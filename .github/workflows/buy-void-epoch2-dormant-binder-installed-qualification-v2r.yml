name: Buy VOID Epoch-2 dormant binder installed qualification v2r

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py"
      - "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2r.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2r.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py"
      - "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2r.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2r.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact installed-qualification generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse "$EXPECTED_HEAD^1")"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n'             '.github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2r.yml'             'docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2r.md'             'ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py'             'scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py'             | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py)" =             f3d6b1559be7490303cf36338c4bfa38fdaa390a
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py)" =             54b3222e7d4b6ed3f8ce76ff5434c222ef1508e5
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py)" =             9686a7b8b01598b60c8d628a1098f7259dc2b361
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2r.md)" =             b65a6ec721c6884f11bf1a1e87b1b3330b8f5437
          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py",
              "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_INSTALLED_QUALIFICATION_V2R_SYNTAX_GREEN")
          PY

      - name: Prove read-only installed qualification
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dormant-binder-installed-qualification-v2.log"
          python3 -I -B scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2r.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_INSTALLED_QUALIFICATION_V2R_PROOF_GREEN"
            "hardened_installer_source_blob_bound=true"
            "accepted_v3_lock_rechecked=true"
            "protected_install_state_required_green=true"
            "installed_root_descriptor_bound=true"
            "exact_native_identity_rechecked=true"
            "exact_binder_identity_rechecked=true"
            "installed_generation_before_middle_after_required=true"
            "double_native_self_test_required=true"
            "native_self_test_descriptor_bound=true"
            "binder_execution=false"
            "live_binding_execution=false"
            "credential_access=false"
            "private_key_access=false"
            "signing=false"
            "transaction=false"
            "payment_acceptance=false"
            "customer_safe_to_pay=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
            "next_gate=SEPARATELY_AUTHORIZE_EPOCH2_V3R_DORMANT_CANDIDATE_LIVE_BINDING"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
