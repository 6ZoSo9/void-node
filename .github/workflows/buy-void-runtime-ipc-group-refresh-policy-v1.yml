name: VOID Buy runtime IPC group refresh policy v1

on:
  pull_request:
    paths:
      - "tools/void-buy-runtime-ipc-group-refresh-policy-v1.mjs"
      - "scripts/prove_void_buy_runtime_ipc_group_refresh_policy_v1.mjs"
      - "docs/operators/buy-void-runtime-ipc-group-refresh-policy-v1.md"
      - ".github/workflows/buy-void-runtime-ipc-group-refresh-policy-v1.yml"
      - "tools/void-buy-allocation-custody-socket-runtime-directory-policy-v1.mjs"
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v1.conf.example"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-runtime-ipc-group-refresh-policy-v1.mjs"
      - "scripts/prove_void_buy_runtime_ipc_group_refresh_policy_v1.mjs"
      - "docs/operators/buy-void-runtime-ipc-group-refresh-policy-v1.md"
      - ".github/workflows/buy-void-runtime-ipc-group-refresh-policy-v1.yml"
      - "tools/void-buy-allocation-custody-socket-runtime-directory-policy-v1.mjs"
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v1.conf.example"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove policy
        run: |
          set -euo pipefail
          node --check tools/void-buy-runtime-ipc-group-refresh-policy-v1.mjs
          node scripts/prove_void_buy_runtime_ipc_group_refresh_policy_v1.mjs |
            tee "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'VOID_BUY_VOID_RUNTIME_IPC_GROUP_REFRESH_POLICY_V1_GREEN' "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'runtime_identity_preserved=true' "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'target_supplementary_gid=980' "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'user_manager_refresh_required=true' "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'host_mutation_authorized=false' "$RUNNER_TEMP/ipc-group-refresh.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/ipc-group-refresh.log"
          git diff --check
