name: PR 969 retry-safe reclaim runner

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/pr969-retry-safe-reclaim-runner.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/buy-void-native-execution-attempt-idempotency-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buy-void-native-execution-attempt-idempotency-v1
          fetch-depth: 0

      - name: Apply reviewed retry-safety repair
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path(
              "src/economic/buy_void_delivery_submission_guard_v1.ts"
          )
          source = source_path.read_text(encoding="utf-8")

          def block(lines: list[str]) -> str:
              return "\n".join(lines)

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}_anchor_count={count}")
              source = source.replace(old, new, 1)

          replace_once(
              block([
                  "  release_reason_binding_immutable: true,",
                  "  alternate_idempotency_key_replay_forbidden: true,",
              ]),
              block([
                  "  release_reason_binding_immutable: true,",
                  "  retry_safe_release_allowlist: true,",
                  "  terminal_release_reclaim_forbidden: true,",
                  "  alternate_idempotency_key_replay_forbidden: true,",
              ]),
              "authority",
          )

          replace_once(
              block([
                  "const RELEASE_SCHEMA =",
                  "  \"void_buy_void_delivery_submission_guard_release_v1\";",
                  "const COMMON_ENTRY_KEYS = [",
              ]),
              block([
                  "const RELEASE_SCHEMA =",
                  "  \"void_buy_void_delivery_submission_guard_release_v1\";",
                  "const RETRY_SAFE_RELEASE_REASONS = new Set([",
                  "  \"signer_address_read_failed\",",
                  "  \"signer_address_mismatch\",",
                  "  \"transaction_signing_failed\",",
                  "  \"invalid_raw_signed_transaction_from_signer\",",
                  "  \"signed_transaction_parse_failed\",",
                  "  \"signed_transaction_hash_mismatch\",",
                  "  \"signed_transaction_binding_mismatch\",",
                  "  \"invalid_provider_submission_id\",",
                  "  \"broadcast_definitively_not_submitted\",",
                  "]);",
                  "const COMMON_ENTRY_KEYS = [",
              ]),
              "allowlist",
          )

          replace_once(
              "function entryHash(",
              block([
                  "function releaseReasonAllowsRetry(reason: string): boolean {",
                  "  return RETRY_SAFE_RELEASE_REASONS.has(reason);",
                  "}",
                  "",
                  "function entryHash(",
              ]),
              "helper",
          )

          replace_once(
              block([
                  "    if (value.event === \"claim\") {",
                  "      if (existingKey?.event === \"claim\") {",
                  "        throw new Error(\"submission_guard_duplicate_claim\");",
                  "      }",
                  "    } else {",
              ]),
              block([
                  "    if (value.event === \"claim\") {",
                  "      if (existingKey?.event === \"claim\") {",
                  "        throw new Error(\"submission_guard_duplicate_claim\");",
                  "      }",
                  "      if (",
                  "        existingKey?.event === \"release\" &&",
                  "        !releaseReasonAllowsRetry(existingKey.release_reason)",
                  "      ) {",
                  "        throw new Error(",
                  "          \"submission_guard_non_retryable_release_reclaimed\",",
                  "        );",
                  "      }",
                  "    } else {",
              ]),
              "replay",
          )

          replace_once(
              block([
                  "        if (latest?.event === \"claim\") {",
                  "          return {",
                  "            claimed: false as const,",
                  "            reason: \"submission_already_claimed\",",
                  "            existing_transaction_hash:",
                  "              latest.expected_transaction_hash,",
                  "          };",
                  "        }",
                  "",
                  "        const previous =",
              ]),
              block([
                  "        if (latest?.event === \"claim\") {",
                  "          return {",
                  "            claimed: false as const,",
                  "            reason: \"submission_already_claimed\",",
                  "            existing_transaction_hash:",
                  "              latest.expected_transaction_hash,",
                  "          };",
                  "        }",
                  "        if (",
                  "          latest?.event === \"release\" &&",
                  "          !releaseReasonAllowsRetry(latest.release_reason)",
                  "        ) {",
                  "          return {",
                  "            claimed: false as const,",
                  "            reason: \"submission_release_not_retry_safe\",",
                  "            existing_transaction_hash:",
                  "              latest.expected_transaction_hash,",
                  "          };",
                  "        }",
                  "",
                  "        const previous =",
              ]),
              "runtime",
          )

          source_path.write_text(source, encoding="utf-8")

          payload = Path(
              ".github/workflows/pr969-retry-safe-reclaim-apply.yml"
          ).read_text(encoding="utf-8")
          run_marker = "        run: |\n"
          if payload.count(run_marker) != 1:
              raise SystemExit("apply_payload_run_block_mismatch")
          script = textwrap.dedent(payload.split(run_marker, 1)[1])
          tail_marker = "cat > /tmp/pr969-proof.b64 <<'EOF'\n"
          if script.count(tail_marker) != 1:
              raise SystemExit("apply_payload_tail_marker_mismatch")
          tail = script[script.index(tail_marker):]
          old_cleanup = (
              "rm -f .github/workflows/"
              "pr969-retry-safe-reclaim-apply.yml"
          )
          new_cleanup = (
              "rm -f .github/workflows/"
              "pr969-retry-safe-reclaim-apply.yml "
              ".github/workflows/"
              "pr969-retry-safe-reclaim-runner.yml"
          )
          if tail.count(old_cleanup) != 1:
              raise SystemExit("apply_payload_cleanup_marker_mismatch")
          tail = tail.replace(old_cleanup, new_cleanup, 1)
          Path("/tmp/pr969-tail.sh").write_text(tail, encoding="utf-8")
          PY

          bash /tmp/pr969-tail.sh
