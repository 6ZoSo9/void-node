name: VOID Buy VOID first-original buyer and dispatcher composition v2

on:
  pull_request:
    paths:
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts"
      - ".github/workflows/buy-void-operator-verified-allocation-dispatch-v1.yml"
      - ".github/workflows/buy-void-operator-verified-allocation-dispatch-v2.yml"
      - "docs/architecture/buy-void-operator-verified-allocation-dispatch-v1.md"
      - "docs/architecture/buy-void-operator-verified-allocation-dispatch-v2.md"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v2.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v2.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v3.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs"
      - "src/economic/buy_void_preappend_plain_input_v1.ts"
      - ".github/workflows/buy-void-first-original-dispatch-compose-v1.yml"
      - "docs/architecture/buy-void-first-original-dispatch-compose-v1.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-original-dispatch-compose-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source-only review head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout to event
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain=v1)"
      - name: Node from reviewed source matrix
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact lock without install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build without starting VOID
        run: |
          npm run typecheck
          npm run build
      - name: Authenticate distinct reviewed source and proof blobs
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            import crypto from "node:crypto";
            const pins = new Map([
              ["src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts","0e27a76e777c326d2d9e2b1550b7f2979fca9abb"],
              ["scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts","5050498f600efd7d5c83af214f75663a66685d6e"],
              ["scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts","e58bf39fadc25123771481608fad2a61a8f3133f"],
              ["src/economic/buy_void_verified_allocation_replay_binding_v1.ts","435ed6000caad046f48fb318fbc7c865393f3b6c"],
              ["scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts","d31f8cbb85ed17c9937baf3c9725a6fae22cc829"],
              ["scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v2.ts","9fb39172afa09e49c11d72ff376e9af2d99a4101"],
              ["src/economic/buy_void_preappend_plain_input_v1.ts","4fbf115830dde01930631e73fea856abe0cceafa"],
              ["scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs","3f91404c8f5b6897b0781455564b4ec26b480c03"],
              ["scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v2.mjs","d42148523c44d95d3b87236ade22cfb92dcb5bee"],
              ["src/economic/buy_void_verified_payment_capacity_admission_v1.ts","f591f7407d9afc2cf77e0f90923aa11b4817fd4e"],
            ]);
            for (const [file,sha] of pins) {
              const bytes=fs.readFileSync(file);
              const actual=crypto.createHash("sha1").update(Buffer.from("blob "+bytes.length+"\0")).update(bytes).digest("hex");
              assert.equal(actual,sha,"reviewed source Git blob changed: "+file);
            }
            console.log("BUY_VOID_ORIGINAL_DISPATCH_EXACT_SOURCE_TUPLE_GREEN");
          '
      - name: Frozen historical crash and handoff proofs must still HOLD
        run: |
set -euo pipefail
for v in 1 2 3; do
  log="$RUNNER_TEMP/historic-crash-$v.txt"
  if node "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v$v.mjs" > "$log" 2>&1; then
    echo "UNEXPECTED_FROZEN_CRASH_V${v}_REISSUE" >&2
    exit 1
  fi
  grep -F 'reviewed_source_blob_drift:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$log"
done
if ./node_modules/.bin/tsx scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v2.ts > "$RUNNER_TEMP/historic-handoff-v2.txt" 2>&1; then
  echo "UNEXPECTED_FROZEN_HANDOFF_V2_REISSUE" >&2
  exit 1
fi
grep -F 'reviewed handoff source blob mismatch:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/historic-handoff-v2.txt"
          if node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts > "$RUNNER_TEMP/historic-dispatch-v1.txt" 2>&1; then
            echo "UNEXPECTED_FROZEN_DISPATCH_V1_REISSUE" >&2
            exit 1
          fi
          grep -F 'mounted router generation drift' "$RUNNER_TEMP/historic-dispatch-v1.txt"
      - name: Current first-original crash/replay V4 must pass; frozen V1/V2/V3 stay rejected
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs \
            > "$RUNNER_TEMP/current-crash-v4.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const receipt=JSON.parse(fs.readFileSync(
              process.env.RUNNER_TEMP+"/current-crash-v4.json","utf8"));
            assert.equal(receipt.marker,
              "VOID_BUY_VOID_PAYMENT_ALLOCATION_HYPOTHETICAL_CRASH_MATRIX_V4");
            for(const key of [
              "frozen_historical_V1_proof_unchanged",
              "frozen_historical_V2_proof_unchanged",
              "frozen_historical_V3_proof_unchanged",
              "late_buyer_wallet_backfill_verified_allocation_rejected",
              "changed_original_buyer_wallet_rejected",
              "late_tx_and_receive_with_original_wallet_positive",
              "exact_replay_idempotent",
              "conflicting_identity_rejected",
              "malformed_or_orphan_history_rejected",
            ]) assert.equal(receipt[key],true,"current V2 replay guard: "+key);
            assert.equal(receipt.initial_buyer_wallet_missing_variants_rejected,3);
            assert.deepEqual(receipt.observed_publication_phases,
              ["intent_only","ledger_committed","complete"]);
            for(const key of [
              "proposed_allocation_mutated","actual_durable_payment_fsync_verified",
              "verified_capacity_and_request_locks_held",
              "independently_proven_original_request",
              "protected_high_water_custody_verified",
              "allocation_publication_integrated",
              "exactly_once_allocation_production_ready",
              "signer_or_wallet_access",
              "production_source_finality_authority_ready",
              "presale_activation","funds_moved",
            ]) assert.equal(receipt[key],false,"must retain HOLD: "+key);
          '
      - name: Hardened dispatcher outer input proof
        run: |
          set -euo pipefail
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts \
            | tee "$RUNNER_TEMP/dispatch.txt"
          for marker in \
            'VOID_BUY_VOID_OPERATOR_ALLOCATION_DISPATCH_SOURCE_CANDIDATE_V2_GREEN' \
            'frozen_dispatcher_v1_proof_unchanged=true' \
            'reviewed_router_source_blob=1fde828c97175560f98ab070af33eefc595f8002' \
            'outer_input_proxy_rejected_without_traps=true' \
            'outer_input_getter_rejected_without_invocation=true' \
            'outer_input_root_getter_rejected_without_invocation=true' \
            'outer_input_unreviewed_keys_and_toJSON_rejected=true' \
            'null_prototype_outer_input_accepted=true' \
            'dispatch_calls_allocation_writer_only_on_verified_branch=true' \
            'mounted_verified_allocation_dispatch=false' \
            'payment_or_allocation_append_performed=false' \
            'presale_activation=false' \
            'funds_moved=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/dispatch.txt"
          done
      - name: Real temp filesystem first-original buyer handoff V3 proof
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts \
            | tee "$RUNNER_TEMP/handoff.txt"
          for marker in \
            'VOID_BUY_VOID_VERIFIED_ALLOCATION_HANDOFF_FIRST_ORIGINAL_V3_GREEN' \
            'first_original_missing_absent_null_empty_preappend_held=true' \
            'forged_matching_allocation_replay_held=true' \
            'valid_original_late_tx_receiver_preserves_deterministic_allocation=true' \
            'durable_payment_event_reappend=false' \
            'runtime_integration=false' \
            'production_gate_ready=false' \
            'presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/handoff.txt"
          done
      - name: Emit deterministic unaccepted combined source receipt
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const receipt={
              schema:"void_buy_void_first_original_buyer_dispatch_source_composition_v2",
              version:2,
              reviewed_dispatch_source_git_blob_sha1:"0e27a76e777c326d2d9e2b1550b7f2979fca9abb",
              reviewed_dispatch_proof_git_blob_sha1:"5050498f600efd7d5c83af214f75663a66685d6e",
              frozen_dispatch_v1_proof_unchanged:true,
              reviewed_first_original_buyer_git_blob_sha1:"435ed6000caad046f48fb318fbc7c865393f3b6c",
              reviewed_real_handoff_proof_git_blob_sha1:"d31f8cbb85ed17c9937baf3c9725a6fae22cc829",
              outer_input_proxy_getter_negative_proven:true,
              original_wallet_absent_null_empty_preappend_held:true,
              forged_existing_allocation_wallet_backfill_held:true,
              valid_initial_wallet_late_tx_receiver_preserved:true,
              frozen_historical_v1_reissued:false,
              actual_mounted_dispatcher_verified:false,
              authenticated_cross_uid_custody_verified:false,
              protected_launch_high_water_verified:false,
              real_customer_payment_finality_verified:false,
              installed_nimo_witness_v2_verified:false,
              production_gate_ready:false,
              presale_activation:false,
              funds_movement:false
            };
            fs.writeFileSync(process.argv[1],JSON.stringify(receipt,null,2)+"\n");
          ' compose-${{ matrix.node }}.json
      - name: Upload exact-head no-funds review receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-original-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: compose-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Diff whitespace checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three exact-head source receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-original-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./compose
      - name: Require byte-identical 22 24 26 review receipts
        run: |
          set -euo pipefail
          for version in 22 24 26; do test -s "compose/compose-$version.json"; done
          cmp compose/compose-22.json compose/compose-24.json
          cmp compose/compose-22.json compose/compose-26.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            import crypto from "node:crypto";
            const bytes=fs.readFileSync("compose/compose-22.json");
            const d=JSON.parse(bytes);
            for (const [key,val] of Object.entries(d)) {
              if (key.endsWith("_verified") || key.endsWith("_ready") ||
                  key==="presale_activation" || key==="funds_movement") assert.equal(val,false,key);
            }
            console.log("VOID_BUY_VOID_FIRST_ORIGINAL_DISPATCH_COMPOSE_V2_THREE_NODE_GREEN");
            console.log("source_receipt_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
            console.log("actual_mounted_dispatcher_verified=false");
            console.log("real_funds_moved=false");
          '
