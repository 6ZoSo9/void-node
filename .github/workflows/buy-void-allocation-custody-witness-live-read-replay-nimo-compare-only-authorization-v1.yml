name: VOID replay Nimo compare-only authorization v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-live-read-replay-nimo-compare-only-authorization-v1.sh"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_nimo_compare_only_authorization_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-live-read-replay-nimo-compare-only-authorization-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-live-read-replay-nimo-compare-only-authorization-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-replay-nimo-compare-only-auth-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Nimo compare-only authorization source / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Validate source-only Nimo installer
        run: |
          bash -n tools/void-buy-allocation-custody-witness-live-read-replay-nimo-compare-only-authorization-v1.sh
          node scripts/prove_buy_void_allocation_custody_witness_live_read_replay_nimo_compare_only_authorization_v1.mjs
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
