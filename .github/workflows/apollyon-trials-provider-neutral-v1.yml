name: apollyon-trials-provider-neutral-v1

on:
  pull_request:
    paths:
      - ".github/workflows/apollyon-trials-provider-neutral-v1.yml"
      - "docs/public/apollyon-trials-provider-neutral-v1.md"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "schemas/apollyon-trial-packet-v1.schema.json"
      - "scripts/apollyon_trial_packet_v1.mjs"
      - "scripts/prove_apollyon_trials_provider_neutral_v1.mjs"
      - "scripts/prove_apollyon_trial_schema_alignment_v1.mjs"
      - "scripts/prove_apollyon_trial_ci_self_enforcement_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apollyon-trials-provider-neutral-v1.yml"
      - "docs/public/apollyon-trials-provider-neutral-v1.md"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "schemas/apollyon-trial-packet-v1.schema.json"
      - "scripts/apollyon_trial_packet_v1.mjs"
      - "scripts/prove_apollyon_trials_provider_neutral_v1.mjs"
      - "scripts/prove_apollyon_trial_schema_alignment_v1.mjs"
      - "scripts/prove_apollyon_trial_ci_self_enforcement_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollyon-trials-provider-neutral-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check scripts/apollyon_trial_packet_v1.mjs
          node --check scripts/prove_apollyon_trials_provider_neutral_v1.mjs
          node --check scripts/prove_apollyon_trial_schema_alignment_v1.mjs
          node --check scripts/prove_apollyon_trial_ci_self_enforcement_v1.mjs

      - name: Run focused proof
        run: |
          node scripts/prove_apollyon_trials_provider_neutral_v1.mjs
          node scripts/prove_apollyon_trial_schema_alignment_v1.mjs

      - name: Prove Apollyon committed-range self-enforcement
        if: matrix.node == 24
        run: node scripts/prove_apollyon_trial_ci_self_enforcement_v1.mjs

      - name: Prove committed-range hygiene contract
        if: matrix.node == 24
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene across committed change range
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
