name: VOID WC-VOID market-vault role deployment qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-role-deployment-qualification-v1.yml"
      - "docs/operators/wc-void-market-vault-role-deployment-qualification-v1.md"
      - "scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v2.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v1.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v2.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_current_v2.mjs"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiler-identity-v1-artifact.zip.b64"
      - "tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_correction_v2.mjs"
      - "docs/operators/wc-void-market-vault-compiled-identity-correction-v2.md"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/chain2050-role-authority-sovereign-genesis-append-authorization-v1.json"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "contracts/mainnet/WCVoidMarketVaultV2.sol"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-market-vault-role-deployment-qualification-v1.yml"
      - "docs/operators/wc-void-market-vault-role-deployment-qualification-v1.md"
      - "scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v2.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v1.mjs"
      - "tools/void-wc-void-market-vault-role-deployment-qualification-v2.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_current_v2.mjs"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiler-identity-v1-artifact.zip.b64"
      - "tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_correction_v2.mjs"
      - "docs/operators/wc-void-market-vault-compiled-identity-correction-v2.md"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/chain2050-role-authority-sovereign-genesis-append-authorization-v1.json"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "contracts/mainnet/WCVoidMarketVaultV2.sol"
      - "tools/void-wc-void-market-vault-runtime-attestation-v1.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-market-vault-role-deployment-qualification-v1.mjs
          node --check tools/void-wc-void-market-vault-role-deployment-qualification-v2.mjs
          node --check scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v1.mjs
          node --check scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v2.mjs
          node --check tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs
          node --check tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs
          node --check scripts/prove_void_wc_void_market_vault_compiled_identity_current_v2.mjs
          node --check scripts/prove_void_wc_void_market_vault_compiled_identity_correction_v2.mjs
      - name: Prove compiled identity correction
        run: node scripts/prove_void_wc_void_market_vault_compiled_identity_correction_v2.mjs
      - name: Prove corrected current compiled identity
        run: node scripts/prove_void_wc_void_market_vault_compiled_identity_current_v2.mjs
      - name: Prove corrected role and deployment preparation generation
        shell: bash
        run: |
          set -euo pipefail
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          case "$package_blob:$lock_blob" in
            f28c3e9446c7623ef203da36a9642d046e5f34ee:b2671f0149f522b2489247016df0a5ec4bb72b8b)
              node scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v1.mjs
              echo "market_vault_role_qualification_source_generation=historical_v1"
              ;;
            14fbdf5717b07fd4c734f5da7a8e84ed59bee93f:15b5c82ea36f13079a2f9e8863722f654eb3f201)
              hold="$RUNNER_TEMP/market-vault-role-v1-hold.txt"
              if node scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v1.mjs >"$hold" 2>&1; then
                echo "unexpected V1 market-vault role qualification acceptance of audited package generation" >&2
                exit 1
              fi
              grep -F 'control_source_blob_mismatch:package.json' "$hold"
              node scripts/prove_void_wc_void_market_vault_role_deployment_qualification_v2.mjs
              echo "market_vault_role_qualification_source_generation=audited_v2"
              ;;
            *)
              echo "unknown package generation" >&2
              exit 1
              ;;
          esac
      - name: Upstream source regressions
        shell: bash
        run: |
          set -euo pipefail
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          case "$package_blob:$lock_blob" in
            f28c3e9446c7623ef203da36a9642d046e5f34ee:b2671f0149f522b2489247016df0a5ec4bb72b8b)
              node scripts/prove_void_reviewed_node_package_runtime_v1.mjs
              node scripts/prove_void_wc_void_launch_controller_control_requalification_v1.mjs
              ;;
            14fbdf5717b07fd4c734f5da7a8e84ed59bee93f:15b5c82ea36f13079a2f9e8863722f654eb3f201)
              node scripts/prove_void_reviewed_node_package_runtime_v2.mjs
              node scripts/prove_void_wc_void_launch_controller_control_requalification_v2.mjs
              ;;
            *)
              echo "unknown package generation" >&2
              exit 1
              ;;
          esac
          node scripts/prove_void_wc_void_market_vault_compiled_identity_acceptance_v1.mjs
          node scripts/prove_void_wc_void_market_vault_runtime_attestation_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
