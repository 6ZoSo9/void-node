name: VOID V7 V5 staging static launcher qualifier v2

on:
  pull_request:
    paths:
      - ".github/workflows/void-v7-v5-stage-static-launcher-qualifier-v2.yml"
      - "docs/operators/void-v7-v5-stage-static-launcher-qualifier-v2.md"
      - "ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v2.c"
      - "ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v2.py"
      - "scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v2.py"
      - "ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v2.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact launcher candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify qualifier custody successor parent and four-path scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=a672d6be15815a008bbf664ba099fc9ce72bfc92
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'M\t.github/workflows/void-v7-v5-stage-static-launcher-qualifier-v2.yml'
            $'M\tdocs/operators/void-v7-v5-stage-static-launcher-qualifier-v2.md'
            $'M\tops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v2.py'
            $'M\tscripts/prove_void_v7_v5_stage_static_launcher_qualifier_v2.py'
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${actual[$i]}" = "${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Bind exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v2.c)" = "2337466b713b6572cc5ec832817899bbcb4e2ac2"
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v2.py)" = "4de9e927d73f8ec5acd0b9cce26617355456efcd"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v2.py)" = "9199a09bda1e9c40a68ef9387f23dd73dc33bf73"
          test "$(git rev-parse HEAD:docs/operators/void-v7-v5-stage-static-launcher-qualifier-v2.md)" = "c62bf1177ae528a6894737128709a953f5744940"
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v2.json)" = "c7ff1128ff04f3ce5f995206af52f844564c6b39"

      - name: Python syntax
        run: |
          python3 -I -B -m py_compile             ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v2.py             scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v2.py

      - name: Build static launcher candidate
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -static             ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v2.c             -o "$RUNNER_TEMP/v5-stage-launcher-static"
          test -x "$RUNNER_TEMP/v5-stage-launcher-static"
          file "$RUNNER_TEMP/v5-stage-launcher-static" | grep -F 'statically linked'
          "$RUNNER_TEMP/v5-stage-launcher-static" --self-test | tee "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'VOID_V7_V5_SOURCE_RECEIPT_STAGE_ROOT_LAUNCHER_V2_SELF_TEST_GREEN' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'production_payload_manifest_lock_embedded=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'python_selected_installer_descriptor_inheritance_required=true' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'root_execution_authorized=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'source_stage_apply_authorized=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'receipt_stage_apply_authorized=false' "$RUNNER_TEMP/static-self-test.log"

      - name: Prove launcher and qualifier boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v5-stage-launcher-qualifier-proof.log"
          python3 -I -B scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v2.py | tee "$out"
          grep -Fx 'VOID_V7_V5_STAGE_STATIC_LAUNCHER_QUALIFIER_V2_PROOF_GREEN' "$out"
          grep -Fx 'launcher_compiles_with_werror=true' "$out"
          grep -Fx 'launcher_self_test_green=true' "$out"
          grep -Fx 'hardened_installer_generation_bound=true' "$out"
          grep -Fx 'source_nonblocking_read_boundary_bound=true' "$out"
          grep -Fx 'receipt_pre_import_isolation_bound=true' "$out"
          grep -Fx 'selected_installer_procfd_execution_bound=true' "$out"
          grep -Fx 'path_substitution_cannot_change_executed_fd_bytes=true' "$out"
          grep -Fx 'production_manifest_lock_unbound=true' "$out"
          grep -Fx 'normal_launcher_operation_fail_closed=true' "$out"
          grep -Fx 'four_fixed_operations_only=true' "$out"
          grep -Fx 'caller_path_authority=false' "$out"
          grep -Fx 'caller_source_generation_authority=false' "$out"
          grep -Fx 'read_only_pair_qualifier_self_test_green=true' "$out"
          grep -Fx 'receipt_verified_fd_metadata_bound=true' "$out"
          grep -Fx 'receipt_path_substitution_rejected=true' "$out"
          grep -Fx 'recursive_source_custody_bound=true' "$out"
          grep -Fx 'whole_tree_node_limit_includes_root=true' "$out"
          grep -Fx 'whole_tree_node_cap_boundary_tested=true' "$out"
          grep -Fx 'node_limit_preaccess_enforced=true' "$out"
          grep -Fx 'all_child_types_depth_limited=true' "$out"
          grep -Fx 'regular_file_depth_cap_plus_one_rejected=true' "$out"
          grep -Fx 'writable_descendant_file_rejected=true' "$out"
          grep -Fx 'writable_descendant_directory_rejected=true' "$out"
          grep -Fx 'staged_tree_generation_change_detected=true' "$out"
          grep -Fx 'source_stage_mode_0755_bound=true' "$out"
          grep -Fx 'source_internal_stage_build_v1_bound=true' "$out"
          grep -Fx 'predecessor_0555_tmp_v1_not_reused=true' "$out"
          grep -Fx 'journal_fence_path_selection_deferred=true' "$out"
          grep -Fx 'launcher_install_authorized=false' "$out"
          grep -Fx 'root_execution_authorized=false' "$out"
          grep -Fx 'source_stage_apply_authorized=false' "$out"
          grep -Fx 'receipt_stage_apply_authorized=false' "$out"
          grep -Fx 'fixed_source_exchange_authority=false' "$out"
          grep -Fx 'fixed_receipt_exchange_authority=false' "$out"
          grep -Fx 'service_mutation=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"