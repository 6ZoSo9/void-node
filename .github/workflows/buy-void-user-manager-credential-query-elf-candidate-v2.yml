name: VOID Buy credential query ELF candidate v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v2.yml"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v2.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b,c]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact V2 source generation
        run: |
          set -euo pipefail
          source_parent=94e9c269041bf32872c3e97f4302314a9f70d2b7
          git merge-base --is-ancestor "$source_parent" HEAD
          expected_scope="$RUNNER_TEMP/expected-scope.txt"
          actual_scope="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n'             '.github/workflows/buy-void-user-manager-credential-query-elf-candidate-v2.yml'             'docs/operators/buy-void-user-manager-credential-query-elf-candidate-v2.md'             | sort > "$expected_scope"
          git diff --name-only "$source_parent" HEAD -- | sort > "$actual_scope"
          diff -u "$expected_scope" "$actual_scope"
          git diff --check "$source_parent" HEAD

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c)" =             "d8b30ac499c3bb8a5d223dbc6be687dd175be611"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c)" =             "39b292a6353cc36bcc07a5425ff2c736372a7c83"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs)" =             "ea9eec06a355aec3e4448196bc1dd38295de5ad1"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c)" =             "0ccd2d07a951389d85a9fc56ec892a774d9dd681"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs)" =             "58df08ca966f4629893c3885f1df37c837762520"

          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v2.mjs |
            tee "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V2_PROOF_GREEN'             "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'dropin_bound=64' "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'loadcredential_bound=32' "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'exactly_one_epoch2_credential_required=true' "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/v2-source-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/v2-source-proof.log"

      - name: Derive deterministic V2 credential-query pair
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v2.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"
          meta="$RUNNER_TEMP/credential-query-elf-candidate-v2.json"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -static -fno-pie -no-pie -Wl,--build-id=none             -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -Wl,--build-id=none             -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"
          chmod 0555 "$pre" "$query"

          readelf -l "$pre" > "$RUNNER_TEMP/preexec.readelf"
          ! grep -F ' INTERP ' "$RUNNER_TEMP/preexec.readelf"
          file "$pre" | grep -F 'statically linked'

          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C             VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1             "$query" --self-test | tee "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V2_SELF_TEST_GREEN'             "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'dropin_limit_64=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'loadcredential_limit_32=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'exactly_one_target_credential_match_required=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'duplicate_credential_ids_rejected=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'credential_set_generation_stability_required=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/query-self-test.log"

          # The accepted static preexec intentionally retains the historical
          # fixed installed query pathname. Install V2 bytes at that pathname
          # in the disposable CI root and prove the descriptor-bound launch.
          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1
          original_opt_mode="$(stat -Lc '%a' /opt)"
          cleanup() {
            sudo rm -f "$root/$pre_name" "$root/$query_name" || true
            sudo rmdir "$root" 2>/dev/null || true
            sudo chmod "$original_opt_mode" /opt || true
          }
          trap cleanup EXIT
          sudo chmod go-w /opt
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          sudo install -o root -g root -m 0555 "$query" "$root/$query_name"

          fake="$RUNNER_TEMP/credential-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\""             "$fake/preload.c" -o "$fake/preload.so"

          rm -f "$sentinel"
          if sudo env                VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1                LD_PRELOAD="$fake/preload.so"                "$root/$query_name" --self-test                >"$RUNNER_TEMP/direct-query.log" 2>&1; then
            echo direct_poisoned_credential_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          sudo env LD_PRELOAD="$fake/preload.so"             "$root/$pre_name" --exec-self-test |
            tee "$RUNNER_TEMP/preexec-query.log"
          test ! -e "$sentinel"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V2_SELF_TEST_GREEN'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/preexec-query.log"

          cleanup
          trap - EXIT

          pre_sha="$(sha256sum "$pre" | awk '{print $1}')"
          pre_bytes="$(stat -Lc '%s' "$pre")"
          query_sha="$(sha256sum "$query" | awk '{print $1}')"
          query_bytes="$(stat -Lc '%s' "$query")"
          cc_sha="$(sha256sum /usr/bin/cc | awk '{print $1}')"
          strip_sha="$(sha256sum /usr/bin/strip | awk '{print $1}')"

          META="$meta" PRE_SHA="$pre_sha" PRE_BYTES="$pre_bytes"           QUERY_SHA="$query_sha" QUERY_BYTES="$query_bytes"           CC_SHA="$cc_sha" STRIP_SHA="$strip_sha"           node --input-type=module <<'NODE'
          import fs from "node:fs";
          const out={
            marker:"VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V2",
            version:2,
            source_parent:"94e9c269041bf32872c3e97f4302314a9f70d2b7",
            v1_predecessor_lock_id:"voidbuyumqcredelflock1_65a1839c14b692349dda8cccdbe8657a9485754c5d10ffa5b57421ce87e3753c",
            peer_source_git_blob_sha1:"d8b30ac499c3bb8a5d223dbc6be687dd175be611",
            credential_query_source_git_blob_sha1:"39b292a6353cc36bcc07a5425ff2c736372a7c83",
            credential_query_proof_git_blob_sha1:"ea9eec06a355aec3e4448196bc1dd38295de5ad1",
            credential_preexec_source_git_blob_sha1:"0ccd2d07a951389d85a9fc56ec892a774d9dd681",
            credential_preexec_proof_git_blob_sha1:"58df08ca966f4629893c3885f1df37c837762520",
            preexec_binary_sha256:process.env.PRE_SHA,
            preexec_binary_bytes:Number(process.env.PRE_BYTES),
            preexec_static_no_interp:true,
            query_binary_sha256:process.env.QUERY_SHA,
            query_binary_bytes:Number(process.env.QUERY_BYTES),
            max_dropin_paths:64,
            max_load_credentials:32,
            unique_credential_ids_required:true,
            exactly_one_epoch2_credential_required:true,
            unrelated_credentials_allowed:true,
            complete_credential_set_generation_stability_required:true,
            authenticated_private_manager_peer_required:true,
            retained_private_connection_required:true,
            credential_query_preexec_pair_execution_proven:true,
            credential_contents_read:false,
            cc_sha256:process.env.CC_SHA,
            strip_sha256:process.env.STRIP_SHA,
            candidate_accepted:false,
            replacement_authorized:false,
            live_query_authorized:false,
            complete_host_evidence_collector:false,
            production_host_evidence_authority:false,
            payment_acceptance:false,
            public_presale_activation:false,
            transaction:false,
            funds_movement:false
          };
          fs.writeFileSync(process.env.META,JSON.stringify(out)+"\n");
          NODE

          echo "preexec_binary_sha256=$pre_sha"
          echo "preexec_binary_bytes=$pre_bytes"
          echo "query_binary_sha256=$query_sha"
          echo "query_binary_bytes=$query_bytes"
          echo "max_dropin_paths=64"
          echo "max_load_credentials=32"
          echo "exactly_one_epoch2_credential_required=true"
          echo "unrelated_credentials_allowed=true"
          echo "credential_query_preexec_pair_execution_proven=true"
          echo "candidate_accepted=false"
          echo "replacement_authorized=false"
          echo "live_query_authorized=false"
          echo "credential_contents_read=false"
          echo "funds_movement=false"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-v2-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.slot }}
          path: |
            ${{ runner.temp }}/credential-query-preexec
            ${{ runner.temp }}/credential-query
            ${{ runner.temp }}/credential-query-elf-candidate-v2.json
          if-no-files-found: error
          retention-days: 7

  cross-job:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-v2-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: candidates
      - name: Require exact three-job equality
        run: |
          set -euo pipefail
          stem="void-buy-credential-query-elf-v2-${{ github.event.pull_request.head.sha || github.sha }}"
          for slot in a b c; do
            test -s "candidates/$stem-$slot/credential-query-preexec"
            test -s "candidates/$stem-$slot/credential-query"
            test -s "candidates/$stem-$slot/credential-query-elf-candidate-v2.json"
          done
          for slot in b c; do
            cmp "candidates/$stem-a/credential-query-preexec"                 "candidates/$stem-$slot/credential-query-preexec"
            cmp "candidates/$stem-a/credential-query"                 "candidates/$stem-$slot/credential-query"
            cmp "candidates/$stem-a/credential-query-elf-candidate-v2.json"                 "candidates/$stem-$slot/credential-query-elf-candidate-v2.json"
          done
          sha256sum "candidates/$stem-a/credential-query-preexec"
          sha256sum "candidates/$stem-a/credential-query"
          cat "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"max_dropin_paths":64' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"max_load_credentials":32' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"exactly_one_epoch2_credential_required":true' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"candidate_accepted":false' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"replacement_authorized":false' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"live_query_authorized":false' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          grep -F '"funds_movement":false' "candidates/$stem-a/credential-query-elf-candidate-v2.json"
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V2_CROSS_JOB_GREEN
