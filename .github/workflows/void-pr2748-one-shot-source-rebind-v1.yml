name: VOID PR2748 one-shot source rebind v1

on:
  push:
    branches:
      - ren/public-bootstrap-seal-fatal-fast-hold-v1-20261009
    paths:
      - .github/workflows/void-pr2748-one-shot-source-rebind-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2748-one-shot-source-rebind-v1
  cancel-in-progress: false

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard, prove and publish exact two-file rebind
        env:
          EXPECTED_PARENT: 4016704bc468fe5de715a3d92c116ffa0267947b
          EXPECTED_BRANCH: ren/public-bootstrap-seal-fatal-fast-hold-v1-20261009
          OLD_SOURCE_BLOB: 0e3361ef8d4e6f3d7a9e428d14db64281afc21fe
          NEW_SOURCE_BLOB: 510c5194a8cacf1c3e0ff22824aded0c28651dc1
          WORKFLOW_PATH: .github/workflows/void-pr2748-one-shot-source-rebind-v1.yml
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$WORKFLOW_PATH"

          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ["OLD_SOURCE_BLOB"]
          new = os.environ["NEW_SOURCE_BLOB"]
          paths = (
              Path("runtime/canonical-producer-self-http-guard-v1.cjs"),
              Path("scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"),
          )

          for path in paths:
              original = path.read_text(encoding="utf-8")
              if original.count(old) != 1:
                  raise SystemExit(f"unexpected old-source occurrence count for {path}: {original.count(old)}")
              if new in original:
                  raise SystemExit(f"new source identity already present in {path}")
              updated = original.replace(old, new)
              path.write_text(updated, encoding="utf-8")
          PY

          node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs

          rm -- "$WORKFLOW_PATH"
          git diff --check

          expected_paths="$({ printf '%s\n' \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs \
            "$WORKFLOW_PATH"; } | sort)"
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"

          git config user.name "VOID Repository Bot"
          git config user.email "44710859+6ZoSo9@users.noreply.github.com"
          git add -- \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs \
            "$WORKFLOW_PATH"
          git commit -m "test(public): rebind legacy self-http proof to seal-first startup"

          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
