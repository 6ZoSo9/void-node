name: VOID custody reserve first-original V2 source proof
on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_custody_reserve_first_original_v2.mjs"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_custody_reserve_plan_v1.mjs"
      - ".github/workflows/buy-void-custody-reserve-first-original-v2.yml"
      - "docs/architecture/buy-void-custody-reserve-first-original-v2.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custody-reserve-first-original-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-current-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checked-out source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor cff927e850dfc078419be06a468aa77c6c1f41c3 HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies without postinstall scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical compiled sources
        run: npm run build
      - name: Preserve frozen V1 negative source-identity witness
        run: |
          set -euo pipefail
          if node scripts/prove_buy_void_custody_reserve_plan_v1.mjs > "$RUNNER_TEMP/frozen-v1.txt" 2>&1; then
            echo "UNEXPECTED_FROZEN_V1_REISSUE" >&2
            exit 1
          fi
          grep -F 'dependency drift: src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/frozen-v1.txt"
          echo frozen_custody_reserve_V1_replay_identity_rejected=true
      - name: Prove reviewed V2 source and first-original wallet requirement
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_custody_reserve_first_original_v2.mjs
          node scripts/prove_buy_void_custody_reserve_first_original_v2.mjs |
            tee "custody-first-original-${{ matrix.node }}.txt"
          grep -Fx "VOID_BUY_VOID_CUSTODY_RESERVE_PLAN_FIRST_ORIGINAL_V2_PROOF_GREEN" "custody-first-original-${{ matrix.node }}.txt"
          for marker in             'planned_then_idempotent_exact_ledger=true'             'prior_verified_allocation_gap_held=true'             'proxy_and_accessor_execution_count=0'             'custody_reserve_method_enabled=false'             'production_allocation_mutation_ready=false'             'funds_moved=false'
          do grep -Fx "$marker" "custody-first-original-${{ matrix.node }}.txt"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-first-original-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: custody-first-original-${{ matrix.node }}.txt
          retention-days: 1
          if-no-files-found: error
      - name: Source diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
  cross-node:
    needs: reviewed-current-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-first-original-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require identical reviewed source receipts on Node 22 24 26
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "receipts/custody-first-original-$node.txt"; done
          cmp receipts/custody-first-original-22.txt receipts/custody-first-original-24.txt
          cmp receipts/custody-first-original-22.txt receipts/custody-first-original-26.txt
          echo VOID_BUY_VOID_CUSTODY_RESERVE_FIRST_ORIGINAL_V2_CROSS_NODE_GREEN
          echo "custody_reserve_method_enabled=false"
          echo "production_allocation_mutation_ready=false"
          echo "presale_activation=false"
          echo "funds_moved=false"
