name: VOID BTC/VOID trade-funded fees v1
# Re-run marker: native-gas asset separation correction
# Re-run marker: full fee/opening/reservation audit v2

on:
  pull_request:
    paths:
      - ".github/workflows/void-btc-void-trade-funded-fees-v1.yml"
      - "tools/void-btc-void-trade-funded-fees-v1.mjs"
      - "scripts/prove_void_btc_void_trade_funded_fees_v1.mjs"
      - "tools/void-btc-void-quote-math-v1.mjs"
      - "scripts/prove_void_btc_void_quote_math_v1.mjs"
      - "tools/void-btc-void-market-maker-reserve-policy-v1.mjs"
      - "scripts/prove_void_btc_void_market_maker_reserve_policy_v1.mjs"
      - "scripts/prove_void_btc_void_buyback_lot_journal_transition_v1.mjs"
      - "scripts/prove_void_btc_void_atomic_settlement_state_invariants_v1.mjs"
      - "docs/public/btc-void-trade-funded-fees-v1.md"
      - "docs/public/btc-void-market-maker-reserve-policy-v1.md"
      - "docs/public/btc-void-native-atomic-market-v1.md"
      - "docs/public/btc-void-quote-math-v1.md"
      - "docs/public/btc-void-buyback-lot-journal-transition-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-btc-void-trade-funded-fees-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove trade-funded fee envelope
        run: node scripts/prove_void_btc_void_trade_funded_fees_v1.mjs

      - name: Preserve deterministic quote math
        run: node scripts/prove_void_btc_void_quote_math_v1.mjs

      - name: Preserve reserve-recycling policy
        run: node scripts/prove_void_btc_void_market_maker_reserve_policy_v1.mjs

      - name: Preserve buyback create-once journal
        run: node scripts/prove_void_btc_void_buyback_lot_journal_transition_v1.mjs

      - name: Preserve atomic-settlement current stack
        run: node scripts/prove_void_btc_void_atomic_settlement_state_invariants_v1.mjs

      - name: Diff hygiene
        run: git diff --check
