name: VOID Buy VOID final protected enforcement census v3

on:
  pull_request:
    paths:
      - "src/economic/**"
      - "ops/precision/void_buy_void_source_finality_v7_native_preentry_v1.c"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_body_v2.bash"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_v1.sh"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "ops/precision/void_buy_void_source_finality_provider_pair_binding_receipt_install_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "runtime/canonical-producer-source-custody-v1.cjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/prove_buy_void_enforcement_final_v7_protected_census_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-protected-census-v3.md"
      - ".github/workflows/buy-void-enforcement-final-v7-protected-census-v3.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/**"
      - "ops/precision/void_buy_void_source_finality_v7_native_preentry_v1.c"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_body_v2.bash"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_v1.sh"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "ops/precision/void_buy_void_source_finality_provider_pair_binding_receipt_install_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "runtime/canonical-producer-source-custody-v1.cjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/prove_buy_void_enforcement_final_v7_protected_census_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-protected-census-v3.md"
      - ".github/workflows/buy-void-enforcement-final-v7-protected-census-v3.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and derive protected census
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          out="$RUNNER_TEMP/final-v7-protected-census-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_v7_protected_census_v3.mjs > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_V7_PROTECTED_CENSUS_V3");
          assert.equal(c.version,3);
          assert.equal(c.source_parent,"2c2b56911efa0775378ee653b4a6699d93ae1104");
          assert.equal(c.repository_head_sha,process.env.EXPECTED_HEAD);
          assert.equal(c.economic_artifact_count,28);
          assert.equal(c.economic_source_file_count,28);
          assert.equal(c.protected_execution_source_count,13);
          assert.equal(c.selector_elf_lock.selector_elf_identity_accepted,true);
          assert.equal(c.protected_launcher.native_launcher_size_bound,true);
          assert.equal(c.protected_launcher.native_launcher_sha256_bound,true);
          assert.equal(c.protected_launcher.historical_v1_live_process_tool_allowlisted,false);
          assert.equal(c.protected_launcher.live_process_v2_tool_allowlisted,true);
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.census_id,/^voidbefv7pc3_[0-9a-f]{64}$/u);
          NODE
      - name: Upload exact census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-v7-protected-census-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-v7-protected-census-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"

  cross-node:
    needs: [census]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-v7-protected-census-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census
      - name: Require Node 22 24 26 exact census equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "census/final-v7-protected-census-$node.json"
          done
          cmp census/final-v7-protected-census-22.json census/final-v7-protected-census-24.json
          cmp census/final-v7-protected-census-22.json census/final-v7-protected-census-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("census/final-v7-protected-census-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.economic_artifact_count,28);
          assert.equal(c.economic_source_file_count,28);
          assert.equal(c.protected_execution_source_count,13);
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_V7_PROTECTED_CENSUS_V3_CROSS_NODE_GREEN");
          console.log("census_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("census_id="+c.census_id);
          console.log("economic_artifact_inventory_sha256="+c.economic_artifact_inventory_sha256);
          console.log("economic_source_inventory_sha256="+c.economic_source_inventory_sha256);
          console.log("protected_execution_inventory_sha256="+c.protected_execution_inventory_sha256);
          NODE
