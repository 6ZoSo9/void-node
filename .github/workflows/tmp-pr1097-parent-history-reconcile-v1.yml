name: VOID PR1097 parent history reconcile v1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR1097 branch
        uses: actions/checkout@v4
        with:
          ref: feat/p2p-udp-swarm-observation-evidence-v1-20260807
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard exact staging and restored parent
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='3da7e1c88e5cfb1452ef9b8e44bcbab01293e6f6'
          PARENT='a71a7c92a31b54aac7ad9cbc9d767ff69ec31901'
          BASE='feat/p2p-udp-swarm-node-control-mount-v1-20260807'
          WF='.github/workflows/tmp-pr1097-parent-history-reconcile-v1.yml'
          test "$(git rev-parse HEAD^)" = "$ORIGINAL"
          test "$(git diff --name-only "$ORIGINAL" HEAD)" = "$WF"
          git fetch origin "$BASE"
          test "$(git rev-parse "origin/$BASE")" = "$PARENT"
          test -z "$(git diff --name-only 0171515ea4d884bb1467d912aa711919cf47e1b1 "$PARENT")"

      - name: Merge restored parent history without semantic changes
        shell: bash
        run: |
          set -euo pipefail
          BASE='feat/p2p-udp-swarm-node-control-mount-v1-20260807'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff "origin/$BASE" -m 'chore: reconcile PR1097 after parent stack restoration'
          rm -f .github/workflows/tmp-pr1097-parent-history-reconcile-v1.yml
          test -z "$(git diff --name-only 3da7e1c88e5cfb1452ef9b8e44bcbab01293e6f6)"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove observation evidence
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_observation_evidence_v1.ts

      - name: Re-prove parent Node control mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts

      - name: Preserve raw-empty-catch terminal zero
        run: npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify exact original feature tree and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='3da7e1c88e5cfb1452ef9b8e44bcbab01293e6f6'
          test -z "$(git diff --name-only "$ORIGINAL")"
          git diff --check "$ORIGINAL"
          git add -A
          git diff --cached --check
          git commit -m 'ci: remove temporary PR1097 reconciliation workflow'
          test -z "$(git diff --name-only "$ORIGINAL" HEAD)"
          git push origin HEAD:feat/p2p-udp-swarm-observation-evidence-v1-20260807
