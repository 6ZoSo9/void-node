name: Buy VOID Epoch-2 live composition native candidate v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-v3.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind repaired privileged-source generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor \
            aab42057ff5da0cd1319acc465d1e297c5814436 \
            "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c)" = \
            4aa091e7835b32aa5c4e7b8e4059651c69a64eb3
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs)" = \
            92e8c8696ea7e2bb81b6ef089db8baa657188935
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs)" = \
            944453d7876a21568207479375467ff1eebcf218
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml)" = \
            85c28fdf03345240332cbf41d46fbda065958ec7
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" = \
            14cbe81e27d04fee77cbe75225ce308bf8561a7b
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Re-run repaired privileged-source proof
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs \
            | tee "$RUNNER_TEMP/source-proof.txt"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_NATIVE_PREENTRY_V1_PROOF_GREEN' \
            'native_parent_revalidated_after_sensitive_sequence=true' \
            'caller_stdin_javascript_rejected_before_root_js=true' \
            'native_preentry_static=true' \
            'native_preentry_no_pt_interp=true' \
            'native_preentry_ld_preload_blocked_before_main=true' \
            'live_credential_access=false' \
            'live_signing=false' \
            'transaction=false' \
            'public_presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/source-proof.txt"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  derive:
    name: derive v3 candidate / ${{ matrix.lane }}
    needs: source-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive static-closure candidate
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -I -B \
            scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py \
            --derive "$RUNNER_TEMP/candidate.json" \
            | tee "$RUNNER_TEMP/derive.txt"
          for marker in \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_positive_control=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/derive.txt"
          done
          cat "$RUNNER_TEMP/candidate.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-native-candidate-v3-${{ matrix.lane }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: independently compare v3 candidate closure
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-epoch2-native-candidate-v3-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false

      - name: Self-test candidate verifier
        run: |
          set -euo pipefail
          python3 -I -B \
            scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py \
            --self-test \
            | tee "$RUNNER_TEMP/self-test.txt"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_V3_SELF_TEST=GREEN' \
            'source_blob_bound=true' \
            'two_local_builds_required=true' \
            'three_hosted_reports_required=true' \
            'comparison_rederives_elf=true' \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_positive_control=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/self-test.txt"
          done

      - name: Require three-run equality and independent re-derivation
        run: |
          set -euo pipefail
          python3 -I -B \
            scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py \
            --compare-dir "$RUNNER_TEMP/candidates" \
            | tee "$RUNNER_TEMP/compare.txt"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_V3_THREE_RUN_GREEN' \
            'three_run_report_bytes_identical=true' \
            'comparison_rederived_elf=true' \
            'static_link_required=true' \
            'pt_interp_absent=true' \
            'hostile_ld_preload_preentry_blocked=true' \
            'static_toolchain_closure_bound=true' \
            'traced_absolute_link_inputs_fail_closed=true' \
            'linker_trace_closed_grammar=true' \
            'linker_archive_member_records_bound=true' \
            'raw_linker_trace_identity_bound=true' \
            'unknown_nonempty_linker_trace_records_hold=true' \
            'candidate_accepted=false' \
            'live_execution_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/compare.txt"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "\${BASE:-}" ]; then
            BASE="$(git rev-parse "$HEAD^1")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
