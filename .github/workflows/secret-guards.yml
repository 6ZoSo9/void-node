name: secret-guards
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block obvious secrets and paths
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | egrep -i '\.key$|\.pem$|(^|/)\.secrets(/|$)|(^|/)mnt/voidkey(/|$)' || true)
          if [ -n "$bad_files" ]; then
            echo "[FAIL] secret-like files are tracked:"; echo "$bad_files"; exit 1
          fi
          # light content scan
          if egrep -RIn '-----BEGIN [A-Z ]*PRIVATE KEY-----|mnemonic|seed phrase|xprv|luks|passphrase' . 2>/dev/null; then
            echo "[FAIL] sensitive markers found in repo content"; exit 1
          fi
