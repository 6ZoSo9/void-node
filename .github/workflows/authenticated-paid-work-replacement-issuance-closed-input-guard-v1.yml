name: Authenticated paid-work replacement issuance closed input guard v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-replacement-issuance-closed-input-guard-v1.yml"
      - "docs/operations/authenticated-paid-work-replacement-issuance-closed-input-guard-v1.md"
      - "integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/closed-input-guard-v1.mjs"
      - "scripts/prove_authenticated_paid_work_replacement_issuance_closed_input_guard_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check guard syntax
        run: >-
          node --check
          integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/closed-input-guard-v1.mjs
      - name: Check proof syntax
        run: >-
          node --check
          scripts/prove_authenticated_paid_work_replacement_issuance_closed_input_guard_v1.mjs
      - name: Prove closed input boundary
        run: >-
          node
          scripts/prove_authenticated_paid_work_replacement_issuance_closed_input_guard_v1.mjs
