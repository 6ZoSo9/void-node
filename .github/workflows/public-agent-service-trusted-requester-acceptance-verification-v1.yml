name: Public Agent Service Trusted Requester Acceptance Verification V1

on:
  pull_request:
    paths:
      - ".github/workflows/public-agent-service-trusted-requester-acceptance-verification-v1.yml"
      - "docs/public-agent/public-agent-service-trusted-requester-acceptance-verification-v1.md"
      - "examples/public-agent-service-trusted-requester-acceptance-verification-v1.example.json"
      - "schemas/public-agent-service-trusted-requester-acceptance-verification-v1.schema.json"
      - "scripts/prove_public_agent_service_trusted_requester_acceptance_verification_v1.ts"
      - "scripts/public_agent_service_trusted_requester_acceptance_verification_v1.ts"
      - "scripts/public_agent_service_requester_acceptance_authentication_v1.ts"
      - "scripts/public_agent_service_trusted_provider_quote_response_verification_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/prove_public_agent_service_trusted_requester_acceptance_verification_v1.ts
