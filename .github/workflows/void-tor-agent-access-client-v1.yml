name: VOID Tor Agent Access Client V1

on:
  pull_request:
    paths:
      - ".github/workflows/void-tor-agent-access-client-v1.yml"
      - "config/void-tor-agent-access-client-v1.json"
      - "docs/public-node/void-tor-agent-access-client-v1.md"
      - "fixtures/tor-agent-access/**"
      - "schemas/void-tor-agent-access-client-v1.schema.json"
      - "scripts/prove_void_tor_agent_access_client_v1.mjs"
      - "tools/void-tor-agent-access-client-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-tor-agent-access-client-v1.yml"
      - "config/void-tor-agent-access-client-v1.json"
      - "docs/public-node/void-tor-agent-access-client-v1.md"
      - "fixtures/tor-agent-access/**"
      - "schemas/void-tor-agent-access-client-v1.schema.json"
      - "scripts/prove_void_tor_agent_access_client_v1.mjs"
      - "tools/void-tor-agent-access-client-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-tor-agent-access-client-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check tools/void-tor-agent-access-client-v1.mjs
          node --check scripts/prove_void_tor_agent_access_client_v1.mjs

      - name: Validate JSON inputs
        run: |
          python3 -m json.tool config/void-tor-agent-access-client-v1.json >/dev/null
          python3 -m json.tool schemas/void-tor-agent-access-client-v1.schema.json >/dev/null
          for file in fixtures/tor-agent-access/*.json
          do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Run bounded transport and identity proof
        run: |
          node scripts/prove_void_tor_agent_access_client_v1.mjs \
            | tee /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "VOID_TOR_AGENT_ACCESS_CLIENT_V1_PROOF_GREEN" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "socks5_domain_addressing=true" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "local_onion_dns_resolution=false" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "signed_binding_verified=true" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "required_route_hash_pins_enforced=true" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "mutation=false" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "payment_execution=false" \
            /tmp/void-tor-agent-access-client-v1-proof.log
          grep -Fx "fund_movement=false" \
            /tmp/void-tor-agent-access-client-v1-proof.log
