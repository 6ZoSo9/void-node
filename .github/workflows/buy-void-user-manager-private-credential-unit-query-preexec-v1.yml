name: VOID Buy credential unit query static preexec v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-preexec-v1.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-preexec-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-preexec-v1.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-preexec-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove source contract
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs |
            tee "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_PREEXEC_V1_PROOF_GREEN' \
            "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'distinct_fixed_install_root=true' "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'static_link_required=true' "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'credential_query_elf_content_lock_still_required=true' \
            "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'protected_install_authorized=false' "$RUNNER_TEMP/credential-preexec-proof.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/credential-preexec-proof.log"

      - name: Build static preexec and credential query
        run: |
          set -euo pipefail
          preexec="$RUNNER_TEMP/private-credential-unit-query-preexec"
          query="$RUNNER_TEMP/private-credential-unit-query"
          gcc -O2 -Wall -Wextra -Werror -std=c11 -static -fno-pie -no-pie \
            -Wl,--build-id=none \
            ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c \
            -o "$preexec"
          gcc -O2 -Wall -Wextra -Werror -std=c11 -fno-ident \
            -Wl,--build-id=none \
            ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c \
            -ldl -o "$query"
          readelf -l "$preexec" | tee "$RUNNER_TEMP/credential-preexec-readelf.log"
          if grep -F ' INTERP ' "$RUNNER_TEMP/credential-preexec-readelf.log"; then
            echo "static credential preexec unexpectedly has PT_INTERP" >&2
            exit 1
          fi
          file "$preexec" | grep -F 'statically linked'

      - name: Prove fixed-path loader boundary
        run: |
          set -euo pipefail
          root=/opt/void-buy-void-user-manager-credential-query-v1
          preexec="$RUNNER_TEMP/private-credential-unit-query-preexec"
          query="$RUNNER_TEMP/private-credential-unit-query"
          preexec_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1
          original_opt_mode="$(stat -Lc '%a' /opt)"
          cleanup() {
            sudo rm -f \
              "$root/$preexec_name" \
              "$root/$query_name" \
              "$root/$query_name.real" \
              "$root/$query_name.hardlink" || true
            sudo rmdir "$root" 2>/dev/null || true
            sudo chmod "$original_opt_mode" /opt || true
          }
          trap cleanup EXIT

          sudo chmod go-w /opt
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -o root -g root -m 0755 "$preexec" "$root/$preexec_name"
          sudo install -o root -g root -m 0755 "$query" "$root/$query_name"

          if sudo "$preexec" --exec-self-test >"$RUNNER_TEMP/copied-preexec.log" 2>&1; then
            echo "copied preexec unexpectedly admitted" >&2
            exit 1
          fi
          grep -Fx 'reason=fixed_preexec_path_required' "$RUNNER_TEMP/copied-preexec.log"

          fake="$RUNNER_TEMP/preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"private-credential-unit-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          gcc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\"" \
            "$fake/preload.c" -o "$fake/preload.so"

          rm -f "$sentinel"
          if sudo env \
               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
               LD_PRELOAD="$fake/preload.so" \
               "$root/$query_name" --self-test \
               >"$RUNNER_TEMP/direct-credential-query.log" 2>&1; then
            echo "direct poisoned credential query unexpectedly succeeded" >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          sudo env LD_PRELOAD="$fake/preload.so" \
            "$root/$preexec_name" --exec-self-test |
            tee "$RUNNER_TEMP/preexec-credential-query.log"
          test ! -e "$sentinel"
          grep -Fx \
            'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V1_SELF_TEST_GREEN' \
            "$RUNNER_TEMP/preexec-credential-query.log"
          grep -Fx 'credential_query_preexec_execution_path_proven=false' \
            "$RUNNER_TEMP/preexec-credential-query.log"

          sudo chmod 0777 "$root/$query_name"
          if sudo "$root/$preexec_name" --exec-self-test \
               >"$RUNNER_TEMP/mutable-child.log" 2>&1; then
            echo "mutable credential query unexpectedly admitted" >&2
            exit 1
          fi
          grep -Fx 'reason=query_file_custody_invalid' "$RUNNER_TEMP/mutable-child.log"
          sudo chmod 0755 "$root/$query_name"

          sudo mv "$root/$query_name" "$root/$query_name.real"
          sudo ln -s "$query_name.real" "$root/$query_name"
          if sudo "$root/$preexec_name" --exec-self-test \
               >"$RUNNER_TEMP/symlink-child.log" 2>&1; then
            echo "symlink credential query unexpectedly admitted" >&2
            exit 1
          fi
          grep -Fx 'reason=query_file_custody_invalid' "$RUNNER_TEMP/symlink-child.log"
          sudo rm "$root/$query_name"
          sudo mv "$root/$query_name.real" "$root/$query_name"

          sudo ln "$root/$query_name" "$root/$query_name.hardlink"
          if sudo "$root/$preexec_name" --exec-self-test \
               >"$RUNNER_TEMP/multilink-child.log" 2>&1; then
            echo "multi-link credential query unexpectedly admitted" >&2
            exit 1
          fi
          grep -Fx 'reason=query_file_custody_invalid' "$RUNNER_TEMP/multilink-child.log"
          sudo rm "$root/$query_name.hardlink"

          cleanup
          trap - EXIT

      - name: Diff hygiene
        env:
          PARENT: 51c95c3324844a8a9580066649debf8fdcd42e3c
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT" "$HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD"
          git diff --check "$PARENT" "$HEAD"
