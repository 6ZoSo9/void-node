name: Buy VOID Epoch-2 protected-bootstrap install v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact install-source generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py)" = \
            eea423b5a6d556b5dec91365a4da39b83b9507ec
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py)" = \
            9cec49c0590c13001b36b0241b7b44790349018c
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md)" = \
            9276cd10bcac05a5af05a53a9d5d2bfaeae89353

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json)" = \
            a96dee99c89ef386a6cbd05609b8f4a764caada8
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.py)" = \
            a445ce8f0172a4f09a03afdf86ebc767aec65ada
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v1.py)" = \
            d5f31610fcdc5059d0b1ea93a6f3130ecdd2aeb1
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py)" = \
            d1417455330837c4d584f7bf36f932a869c903cb
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c)" = \
            243583d4ed0522796b2bbf448abd4e9c28958f50
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py)" = \
            383b84e71b371de65579e4113469e86a59b807ab

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py",
          ):
              compile(
                  Path(relative).read_text("utf-8"),
                  relative,
                  "exec",
                  dont_inherit=True,
              )
          print("VOID_BUY_VOID_EPOCH2_PROTECTED_BOOTSTRAP_INSTALL_V1_SYNTAX_GREEN")
          PY

      - name: Prove create-only protected-bootstrap installer
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
          out="$RUNNER_TEMP/protected-bootstrap-install-v1-proof.log"
          python3 -I -B "$proof" | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V1_PROOF_GREEN' \
            'target_blob_bound=true' \
            'accepted_bootstrap_lock_bound=true' \
            'materializer_generation_bound=true' \
            'bootstrap_source_generation_bound=true' \
            'protected_installer_generation_bound=true' \
            'policy_parser_contract_bound=true' \
            'create_only_stage_publication_required=true' \
            'rename_noreplace_required=true' \
            'initial_stage_cleanup_gap_absent=true' \
            'bootstrap_input_revalidated_before_publication=true' \
            'bootstrap_execution_absent=true' \
            'protected_installer_apply_absent=true' \
            'post_publication_rollback=false' \
            'live_execution_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Verify source-only plan
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
          out="$RUNNER_TEMP/protected-bootstrap-install-v1-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$out"
          for marker in \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'create_only=true' \
            'rename_noreplace_required=true' \
            'bootstrap_execution_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'wc_void_market_activation_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
