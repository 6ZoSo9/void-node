name: Buy VOID Epoch-2 protected bootstrap install v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.py"
  push:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact protected-bootstrap installer generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          parent=1880801bc79794c1bbb07ddd6ec81630fce9b5c6
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$parent" "$EXPECTED_HEAD"

          if [ "${{ github.event_name }}" = pull_request ]; then
            expected="$RUNNER_TEMP/expected-scope.txt"
            actual="$RUNNER_TEMP/actual-scope.txt"
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.yml' \
              'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md' \
              'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py' \
              'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py' \
              | sort > "$expected"
            git diff --name-only "$parent" "$EXPECTED_HEAD" -- | sort > "$actual"
            diff -u "$expected" "$actual"
          fi

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py)" = 9202474f0fe56f37fcc45dbedde0efd44d32f86b
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py)" = ae196ff23e7abd70bd7485a48109a330a315eb79
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-install-v1.md)" = 21967259a275b8c4d92d6d337c1361b8851e9177
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json)" = a96dee99c89ef386a6cbd05609b8f4a764caada8

          git diff --check "$parent" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax, self-test and proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V1_SYNTAX_GREEN")
          PY

          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py --self-test |
            tee "$RUNNER_TEMP/bootstrap-install-self-test.log"

          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py |
            tee "$RUNNER_TEMP/bootstrap-install-proof.log"

          grep -Fx \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V1_PROOF_GREEN' \
            "$RUNNER_TEMP/bootstrap-install-proof.log"

          for marker in \
            'installer_source_blob_bound=true' \
            'accepted_lock_blob_bound=true' \
            'accepted_bootstrap_identity_bound=true' \
            'create_only_protected_root=true' \
            'retained_fd_stage_readback_required=true' \
            'rename_noreplace_single_publication=true' \
            'prepublication_cleanup_generation_bound=true' \
            'post_publication_rollback=false' \
            'truthful_post_publication_failure_receipt=true' \
            'bootstrap_execution_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/bootstrap-install-proof.log"
          done

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bootstrap-install-source-plan.log"
          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v1.py --source-plan | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_INSTALL_V1' \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'create_only=true' \
            'rename_noreplace_required=true' \
            'bootstrap_execution_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'credential_access_authorized=false' \
            'private_key_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
