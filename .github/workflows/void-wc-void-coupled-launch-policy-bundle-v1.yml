name: VOID WC VOID coupled launch policy bundle v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-coupled-launch-policy-bundle-v1.mjs"
      - "tools/void-wc-void-coupled-launch-policy-reviewed-core-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_policy_bundle_v1.mjs"
      - "docs/operators/wc-void-coupled-launch-policy-bundle-v1.md"
      - "tools/void-wc-void-opening-window-policy-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-economic-intent-ttl-caps-policy-v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-contract-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - ".github/workflows/void-wc-void-coupled-launch-policy-bundle-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-wc-void-coupled-launch-policy-bundle-v1.mjs"
      - "tools/void-wc-void-coupled-launch-policy-reviewed-core-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_policy_bundle_v1.mjs"
      - "docs/operators/wc-void-coupled-launch-policy-bundle-v1.md"
      - "tools/void-wc-void-opening-window-policy-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-economic-intent-ttl-caps-policy-v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-contract-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - ".github/workflows/void-wc-void-coupled-launch-policy-bundle-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prove coupled launch policy bundle
        run: node scripts/prove_void_wc_void_coupled_launch_policy_bundle_v1.mjs
