name: VOID Buy VOID web payment cross-UID writer candidate v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_web_payment_cross_uid_lock_*.mjs"
      - "scripts/prove_buy_void_web_payment_cross_uid_lock_writer_*.mjs"
      - "scripts/prove_buy_void_web_payment_cross_uid_lock_writer_ci_v1.sh"
      - "scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_*.mjs"
      - "docs/architecture/buy-void-web-payment-cross-uid-lock-writer-v1.md"
      - ".github/workflows/buy-void-web-payment-cross-uid-lock-writer-v1.yml"
      - "src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
      - "scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs"
      - ".github/workflows/buy-void-allocation-custody-service-v2-cross-uid-lock.yml"
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-web-crossuid-writer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    name: source candidate / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact clean head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and prove
        run: |
          npm run typecheck
          npm run build
          bash scripts/prove_buy_void_web_payment_cross_uid_lock_writer_ci_v1.sh \
            --prove "${{ matrix.node }}"
      - name: Preserve parent scopes and exact joint union
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WEB_PARENT: a4b744bcd443fa7717a7fe3d37f77a62a2002037
          LOCK_PARENT: d8cb6badd73f143db65b814521a87051578f49cb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$WEB_PARENT" "$HEAD"
          git merge-base --is-ancestor "$LOCK_PARENT" "$HEAD"

          # Preserve #2788's original exact 11-path historical scope using its
          # own reviewed commit, rather than pretending this later joint PR is
          # the original source-only patch.
          bash scripts/prove_buy_void_web_payment_cross_uid_lock_writer_ci_v1.sh \
            --scope "$BASE" "$WEB_PARENT"

          # Every reviewed #2788 component other than this integration-aware
          # workflow must remain byte-identical to its parent head.
          for path in \
            docs/architecture/buy-void-web-payment-cross-uid-lock-writer-v1.md \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_cases_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_harness_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_input_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_snapshot_v1.mjs \
            scripts/prove_buy_void_web_payment_cross_uid_lock_writer_ci_v1.sh \
            scripts/prove_buy_void_web_payment_cross_uid_lock_writer_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_validation_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_writer_impl_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_writer_v1.mjs
          do
            test "$(git rev-parse "$WEB_PARENT:$path")" = \
                 "$(git hash-object "$path")"
          done

          # Bind the complete current #2793 lock successor without repinning or
          # relabeling any of its reviewed source/proof/workflow bytes.
          for path in \
            .github/workflows/buy-void-allocation-custody-service-v2-cross-uid-lock.yml \
            scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs \
            src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs
          do
            test "$(git rev-parse "$LOCK_PARENT:$path")" = \
                 "$(git hash-object "$path")"
          done

          git diff --check "$BASE" "$HEAD"
          git diff --name-only "$BASE" "$HEAD" | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            .github/workflows/buy-void-allocation-custody-service-v2-cross-uid-lock.yml \
            .github/workflows/buy-void-web-payment-cross-uid-lock-writer-v1.yml \
            docs/architecture/buy-void-web-payment-cross-uid-lock-writer-v1.md \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_cases_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_harness_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_input_v1.mjs \
            scripts/lib/buy_void_web_payment_cross_uid_lock_writer_proof_snapshot_v1.mjs \
            scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs \
            scripts/prove_buy_void_web_payment_cross_uid_lock_writer_ci_v1.sh \
            scripts/prove_buy_void_web_payment_cross_uid_lock_writer_v1.mjs \
            src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_validation_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_writer_impl_v1.mjs \
            src/economic/buy_void_web_payment_cross_uid_lock_writer_v1.mjs \
            | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo web_parent_scope_preserved=true
          echo lock_successor_blobs_preserved=true
          echo joint_diff_union_exact=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-crossuid-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: web-crossuid-writer-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: web-crossuid-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts
      - run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "receipts/web-crossuid-writer-$v.txt"; done
          cmp receipts/web-crossuid-writer-22.txt receipts/web-crossuid-writer-24.txt
          cmp receipts/web-crossuid-writer-22.txt receipts/web-crossuid-writer-26.txt
          echo VOID_BUY_VOID_WEB_PAYMENT_CROSS_UID_WRITER_THREE_NODE_PROOF_GREEN
          echo payment_acceptance=false
          echo presale_activation=false
