name: public-node-operator-trial-submission-review-decision-example

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-node-operator-trial-submission-review-decision-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial submission review decision example
        run: bash tools/check_public_node_operator_trial_submission_review_decision_example_v1.sh
