name: VOID Buy VOID bakery ambient toJSON isolation v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "scripts/prove_buy_void_filesystem_bakery_lock_async_v1.ts"
      - "docs/architecture/buy-void-bakery-ambient-tojson-current-v1.md"
      - ".github/workflows/buy-void-bakery-ambient-tojson-current-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-bakery-ambient-tojson-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact source
        run: npm run build

      - name: Prove bakery authority isolation
        run: |
          set -euo pipefail
          npx tsx scripts/prove_buy_void_filesystem_bakery_lock_async_v1.ts \
            | tee "bakery-ambient-tojson-node-${{ matrix.node }}.txt"
          grep -Fx "VOID_BUY_VOID_FILESYSTEM_BAKERY_LOCK_ASYNC_V1_GREEN" \
            "bakery-ambient-tojson-node-${{ matrix.node }}.txt"
          grep -Fx "ambient_object_prototype_toJSON_lock_claim_authority=false" \
            "bakery-ambient-tojson-node-${{ matrix.node }}.txt"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Upload exact receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bakery-ambient-tojson-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: bakery-ambient-tojson-node-${{ matrix.node }}.txt
          retention-days: 1
          if-no-files-found: error

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bakery-ambient-tojson-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence

      - name: Require byte-identical proof
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "evidence/bakery-ambient-tojson-node-$v.txt"
          done
          cmp evidence/bakery-ambient-tojson-node-22.txt evidence/bakery-ambient-tojson-node-24.txt
          cmp evidence/bakery-ambient-tojson-node-22.txt evidence/bakery-ambient-tojson-node-26.txt
          echo "VOID_BUY_VOID_BAKERY_AMBIENT_TOJSON_CROSS_NODE_GREEN"
          echo "runtime_mutation=false"
          echo "funds_moved=false"
