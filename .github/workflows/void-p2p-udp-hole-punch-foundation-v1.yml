name: VOID P2P UDP hole-punch foundation v1

on:
  pull_request:
    paths:
      - "src/p2p/udp_hole_punch_v1.ts"
      - "scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts"
      - "docs/public/void-p2p-udp-hole-punch-foundation-v1.md"
      - ".github/workflows/void-p2p-udp-hole-punch-foundation-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/p2p/udp_hole_punch_v1.ts"
      - "scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts"
      - "docs/public/void-p2p-udp-hole-punch-foundation-v1.md"
      - ".github/workflows/void-p2p-udp-hole-punch-foundation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-udp-hole-punch-foundation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove UDP hole-punch foundation
        run: npx --no-install tsx scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts

      - name: Preserve authenticated P2P identity regression
        run: npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts

      - name: Preserve relay reservation regression
        run: npx --no-install tsx scripts/prove_void_p2p_relay_reservation_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
