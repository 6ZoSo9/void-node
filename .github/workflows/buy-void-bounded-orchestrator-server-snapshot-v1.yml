name: Buy VOID bounded orchestrator server snapshot V1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-bounded-orchestrator-server-snapshot-v1.yml"
      - "docs/operators/buy-void-bounded-orchestrator-server-snapshot-v1.md"
      - "scripts/prove_buy_void_bounded_orchestrator_server_snapshot_guard_v1.ts"
      - "scripts/prove_buy_void_bounded_orchestrator_server_snapshot_runtime_v1.ts"
      - "scripts/prove_buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_bounded_auto_fulfillment_orchestrator_runtime_v1.ts"
      - "scripts/prove_buy_void_bounded_auto_fulfillment_orchestrator_runtime_v1.ts"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/prove_buy_void_bounded_orchestrator_server_snapshot_v1.ts
      - run: npx tsx scripts/prove_buy_void_bounded_orchestrator_server_snapshot_runtime_v1.ts
      - run: npx tsx scripts/prove_buy_void_bounded_orchestrator_server_snapshot_guard_v1.ts
      - run: npx tsx scripts/prove_buy_void_bounded_auto_fulfillment_orchestrator_v1.ts
      - run: npx tsx scripts/prove_buy_void_bounded_auto_fulfillment_orchestrator_runtime_v1.ts
      - run: npx tsx scripts/prove_buy_void_bounded_auto_fulfillment_orchestrator_guard_v1.ts
      - run: npx tsx scripts/prove_buy_void_runtime_integration_guard_v1.ts
      - run: npm run build
