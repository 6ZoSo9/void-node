name: VOID P2P UDP swarm datagram runtime v1

on:
  pull_request:
    paths:
      - 'src/p2p/udp_swarm_datagram_runtime_v1.ts'
      - 'src/p2p/udp_hole_punch_v1.ts'
      - 'src/p2p/udp_rendezvous_v1.ts'
      - 'src/p2p/udp_swarm_authenticated_control_adapter_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_datagram_runtime_v1.ts'
      - 'scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts'
      - 'scripts/prove_void_p2p_udp_rendezvous_mapping_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_authenticated_control_adapter_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts'
      - 'docs/public/void-p2p-udp-swarm-datagram-runtime-v1.md'
      - '.github/workflows/void-p2p-udp-swarm-datagram-runtime-v1.yml'
  push:
    branches:
      - 'feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove UDP swarm datagram runtime
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_datagram_runtime_v1.ts

      - name: Re-prove UDP hole-punch foundation
        run: npx --no-install tsx scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts

      - name: Re-prove UDP rendezvous mapping
        run: npx --no-install tsx scripts/prove_void_p2p_udp_rendezvous_mapping_v1.ts

      - name: Re-prove authenticated control adapter
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_authenticated_control_adapter_v1.ts

      - name: Preserve raw-empty-catch terminal zero
        run: npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
