name: public-node-operator-trial-submission-review-chain-final-seal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-node-operator-trial-submission-review-chain-final-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial submission review chain final seal
        run: bash tools/check_public_node_operator_trial_submission_review_chain_final_seal_v1.sh
