name: VOID Buy VOID original request prestate census v1

on:
  pull_request:
    paths:
      - "tools/void-buy-original-request-prestate-census-v1.mjs"
      - "scripts/prove_void_buy_original_request_prestate_census_v1.mjs"
      - "docs/architecture/buy-void-original-request-prestate-census-v1.md"
      - ".github/workflows/buy-void-original-request-prestate-census-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-original-request-prestate-census-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-readonly:
    name: original request read-only prestate / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and synthetic privacy/safety proof
        run: |
          node --check tools/void-buy-original-request-prestate-census-v1.mjs
          node --check scripts/prove_void_buy_original_request_prestate_census_v1.mjs
          node scripts/prove_void_buy_original_request_prestate_census_v1.mjs
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
