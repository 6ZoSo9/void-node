name: VOID public Earn PROXY-v2 edge contract v1

on:
  pull_request:
    paths:
      - "tools/void-public-earn-proxy-v2-edge-contract-v1.mjs"
      - "scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs"
      - "docs/architecture/public-earn-proxy-v2-edge-contract-v1.md"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-source-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-edge-composition-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - ".github/workflows/public-earn-proxy-v2-edge-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: public Earn edge / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check source contract
        run: |
          node --check tools/void-public-earn-proxy-v2-edge-contract-v1.mjs
          node --check scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs

      - name: Prove public Earn source isolation contract
        run: node scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "${BASE:-}" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
