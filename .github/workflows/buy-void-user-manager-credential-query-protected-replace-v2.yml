name: VOID Buy credential query protected replace v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove protected replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove source contract
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py |
            tee "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_REPLACE_V2_PROOF_GREEN'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'preexec_replacement=false'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'v1_predecessor_preserved_after_success=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'query_atomic_exchange_required=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'automatic_failure_rollback=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'foreign_stage_cleanup_rejected=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'current_invocation_stage_inode_bound=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'operation_directory_lock_required=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'crash_state_classifier_complete=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'apply_crash_resume_supported=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'rollback_crash_resume_supported=true'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'credential_contents_read=false'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          grep -Fx 'funds_movement=false'             "$RUNNER_TEMP/credential-query-protected-replace-v2.log"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
