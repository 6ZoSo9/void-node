name: VOID Buy credential query protected replace v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove protected replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove source contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v2.py \
            scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py
          python3 -I -B scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py |
            tee "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          for marker in \
            'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_REPLACE_V2_PROOF_GREEN' \
            'preexec_replacement=false' \
            'v1_predecessor_preserved_after_success=true' \
            'query_atomic_exchange_required=true' \
            'automatic_failure_rollback=true' \
            'foreign_stage_cleanup_rejected=true' \
            'current_invocation_stage_inode_bound=true' \
            'operation_directory_lock_required=true' \
            'crash_state_classifier_complete=true' \
            'apply_crash_resume_supported=true' \
            'rollback_crash_resume_supported=true' \
            'stable_parent_operation_lock_required=true' \
            'descriptor_bound_state_inspection_required=true' \
            'private_stage_publication_required=true' \
            'visible_install_root_generation_revalidation_required=true' \
            'private_pending_state_required=true' \
            'root_fixture_required_for_behavioral_claims=true' \
            'credential_contents_read=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/credential-query-protected-replace-v2.log"
          done

      - name: Exercise repaired recovery primitives
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/root LANG=C LC_ALL=C TZ=UTC \
            /usr/bin/python3 -I -B \
            scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v2.py \
            --root-fixture |
            tee "$RUNNER_TEMP/credential-query-protected-replace-v2-root-fixture.log"
          for marker in \
            'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_REPLACE_V2_ROOT_FIXTURE_GREEN' \
            'private_stage_publication_behavior_exercised=true' \
            'private_stage_file_and_directory_fsync_exercised=true' \
            'stable_parent_lock_behavior_exercised=true' \
            'visible_install_root_replacement_rejected=true' \
            'private_pending_state_behavior_exercised=true' \
            'private_pending_cleanup_behavior_exercised=true' \
            'host_opt_mutation=false' \
            'query_execution=false' \
            'credential_contents_read=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/credential-query-protected-replace-v2-root-fixture.log"
          done

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
