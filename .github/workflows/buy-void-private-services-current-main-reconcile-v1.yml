name: Buy VOID private-services current-main reconcile v1

on:
  pull_request:
    paths:
      - '.github/workflows/buy-void-private-services-current-main-reconcile-v1.yml'

permissions:
  contents: write

concurrency:
  group: buy-void-private-services-current-main-reconcile-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.head.repo.full_name == '6ZoSo9/void-node' &&
      github.event.pull_request.head.ref == 'fix/buy-void-private-services-malformed-success-cleanup-v1-20260809' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact head and exact current main
        shell: bash
        run: |
          set -euo pipefail
          TARGET_MAIN='0791c33f74c5449cb1d29ef92ae899fb34e42c59'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'
          BRANCH='${{ github.event.pull_request.head.ref }}'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain)"

          LIVE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE_HEAD" = "$EVENT_HEAD"
          test "$LIVE_MAIN" = "$TARGET_MAIN"

          git cat-file -e "$TARGET_MAIN^{commit}"
          MERGE_BASE="$(git merge-base HEAD "$TARGET_MAIN")"
          git diff --name-only "$MERGE_BASE".."$TARGET_MAIN" | sort > /tmp/main-movement.txt
          for path in \
            '.github/workflows/buy-void-private-services-malformed-success-cleanup-v1.yml' \
            'scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts' \
            'src/economic/buy_void_production_private_services_operator_v1.ts'; do
            if grep -Fxq "$path" /tmp/main-movement.txt; then
              echo "main overlap detected: $path" >&2
              exit 1
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge exact authorized current main
        shell: bash
        run: |
          set -euo pipefail
          TARGET_MAIN='0791c33f74c5449cb1d29ef92ae899fb34e42c59'
          git merge --no-edit --no-ff "$TARGET_MAIN"
          git merge-base --is-ancestor "$TARGET_MAIN" HEAD
          test -z "$(git status --porcelain)"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove private-service cleanup and activation
        run: |
          npx --no-install tsx scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_activation_v1.ts

      - name: Regress merged terminal-closeout truth
        run: |
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts

      - name: Re-prove Buy VOID integration and E2E
        run: |
          npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
          npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts

      - name: Typecheck and build repository
        run: |
          npm run typecheck
          npm run build

      - name: Verify exact reconciled scope
        shell: bash
        run: |
          set -euo pipefail
          TARGET_MAIN='0791c33f74c5449cb1d29ef92ae899fb34e42c59'
          git diff --check "$TARGET_MAIN"...HEAD
          printf '%s\n' \
            '.github/workflows/buy-void-private-services-current-main-reconcile-v1.yml' \
            '.github/workflows/buy-void-private-services-malformed-success-cleanup-v1.yml' \
            'scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts' \
            'src/economic/buy_void_production_private_services_operator_v1.ts' \
            | sort > /tmp/expected.txt
          git diff --name-only "$TARGET_MAIN"...HEAD | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Guard live refs then ordinary-push reconciliation
        shell: bash
        run: |
          set -euo pipefail
          TARGET_MAIN='0791c33f74c5449cb1d29ef92ae899fb34e42c59'
          EXPECTED_OLD='${{ github.event.pull_request.head.sha }}'
          BRANCH='${{ github.event.pull_request.head.ref }}'
          LIVE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$LIVE_HEAD" = "$EXPECTED_OLD"
          test "$LIVE_MAIN" = "$TARGET_MAIN"
          git push origin HEAD:"refs/heads/$BRANCH"
