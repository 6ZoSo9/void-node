name: VOID WC/VOID bounded canary evidence v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-bounded-canary-evidence-v1.mjs"
      - "scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs"
      - "docs/operators/wc-void-bounded-canary-evidence-v1.md"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiler-identity-v1-artifact.zip.b64"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-wc-void-bounded-canary-evidence-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-wc-void-bounded-canary-evidence-v1.mjs"
      - "scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs"
      - "docs/operators/wc-void-bounded-canary-evidence-v1.md"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiler-identity-v1-artifact.zip.b64"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-wc-void-bounded-canary-evidence-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-bounded-canary-evidence-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove bounded canary evidence contract
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-bounded-canary-evidence-v1.mjs
          node --check scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs
          node scripts/prove_void_wc_void_bounded_canary_evidence_v1.mjs

      - name: Diff hygiene
        run: git diff --check
