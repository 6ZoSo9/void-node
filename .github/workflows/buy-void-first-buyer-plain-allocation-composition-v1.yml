name: VOID Buy VOID first-original replay plus allocation plain-data v1
on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs"
      - "scripts/prove_buy_void_allocation_reservation_plain_data_v1.ts"
      - "scripts/prove_buy_void_first_buyer_allocation_composition_v1.mjs"
      - ".github/workflows/buy-void-first-buyer-plain-allocation-composition-v1.yml"
      - "docs/architecture/buy-void-first-buyer-plain-allocation-composition-v1.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: void-first-buyer-plain-allocation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head / clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Locked install, typecheck and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Run exact source-bound first-buyer + allocation combined proof
        run: |
          node scripts/prove_buy_void_first_buyer_allocation_composition_v1.mjs \
            | tee "buyer-allocation-${{ matrix.node }}.txt"
          grep -Fx "VOID_BUY_VOID_FIRST_BUYER_ALLOCATION_PLAIN_COMPOSITION_V1_GREEN" "buyer-allocation-${{ matrix.node }}.txt"
          grep -Fx "customer_ledger_mutation=false" "buyer-allocation-${{ matrix.node }}.txt"
          grep -Fx "production_allocation_mutation_ready=false" "buyer-allocation-${{ matrix.node }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-buyer-allocation-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: buyer-allocation-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
  cross-node:
    needs: [combined]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: first-buyer-allocation-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - run: |
          set -euo pipefail
          for n in 22 24 26; do test -s "receipts/buyer-allocation-$n.txt"; done
          cmp receipts/buyer-allocation-22.txt receipts/buyer-allocation-24.txt
          cmp receipts/buyer-allocation-22.txt receipts/buyer-allocation-26.txt
          grep -Fx "production_allocation_mutation_ready=false" receipts/buyer-allocation-22.txt
          echo "VOID_BUY_VOID_FIRST_BUYER_ALLOCATION_CROSS_NODE_V1_GREEN"
