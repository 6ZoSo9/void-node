name: VOID participant postpurchase coupled candidate promotion v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-participant-postpurchase-coupled-candidate-promotion-v1.yml"
      - "docs/operators/participant-postpurchase-coupled-candidate-promotion-v1.md"
      - "scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs"
      - "tools/void-participant-postpurchase-coupled-candidate-promotion-v1.mjs"
      - "tools/void-participant-postpurchase-production-runtime-binding-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-participant-postpurchase-coupled-candidate-promotion-v1.yml"
      - "docs/operators/participant-postpurchase-coupled-candidate-promotion-v1.md"
      - "scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs"
      - "tools/void-participant-postpurchase-coupled-candidate-promotion-v1.mjs"
      - "tools/void-participant-postpurchase-production-runtime-binding-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-participant-postpurchase-coupled-candidate-promotion-v1.mjs
          node --check scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs
      - name: Prove promotion gate
        run: |
          node scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
