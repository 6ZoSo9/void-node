name: VOID Buy VOID final protected V7/V2 enforcement lock v3

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v3.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v5.yml"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "ops/**"
      - "runtime/**"
      - "scripts/**"
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v3.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v3.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v5.yml"
      - "ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "ops/**"
      - "runtime/**"
      - "scripts/**"
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact lock generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 4af6cf87a555616e9c154da3676865194d795a6d "$EXPECTED_HEAD"
          test "$(git rev-parse 4af6cf87a555616e9c154da3676865194d795a6d:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs)" = b2cf2514e2a75c91446edbe4b56ed995fb0a8fc6
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build reviewed economic closure without repository helper execution
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Verify exact hosted candidate and derive V3 acceptance lock
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v3.mjs"
          node --check "$proof"
          candidate="$RUNNER_TEMP/protected-v7-v2-candidate-v3-node-${{ matrix.node }}.json"
          lock="$RUNNER_TEMP/protected-v7-v2-lock-v3-node-${{ matrix.node }}.json"
          cp ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json "$candidate"
          node "$proof" --derive > "$lock"
          cmp "$lock" ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json
          test "$(wc -c < "$candidate")" -eq 18142
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "58a1d773523e025e6f66a9fe0f3098cd7951a60810da8cf0b2f16584bd100a45"
          test "$(git hash-object "$candidate")" = "092642b365976d3ea8d50682a1c7a8724455362b"
          node --input-type=module - "$candidate" "$lock" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const candidate=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const lock=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));
          assert.equal(candidate.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3");
          assert.equal(candidate.candidate_enforcement_set_sha256,
            "bf158923831b21dd1e907c91cd4889afbe9fd8bce221e12b0fa1a2bb0896943d");
          assert.equal(candidate.dependency_provider.historical_lock_proof_reexecuted,false);
          assert.equal(candidate.dependency_provider.current_content_semantics_requalified,true);
          assert.equal(lock.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V3");
          assert.equal(lock.candidate_head,"4af6cf87a555616e9c154da3676865194d795a6d");
          assert.equal(lock.candidate_evidence.sha256,
            "58a1d773523e025e6f66a9fe0f3098cd7951a60810da8cf0b2f16584bd100a45");
          assert.equal(lock.candidate_evidence.git_blob_sha1,
            "092642b365976d3ea8d50682a1c7a8724455362b");
          assert.equal(lock.candidate_evidence.candidate_enforcement_set_sha256,
            "bf158923831b21dd1e907c91cd4889afbe9fd8bce221e12b0fa1a2bb0896943d");
          assert.equal(lock.dependency_provider.historical_lock_proof_reexecuted,false);
          assert.equal(lock.dependency_provider.current_content_semantics_requalified,true);
          assert.equal(lock.candidate_enforcement_identity_accepted,true);
          assert.equal(lock.deployed_artifact_generation_verified,false);
          assert.equal(lock.runtime_mount_authority,false);
          assert.equal(lock.production_source_finality_authority_ready,false);
          assert.equal(lock.public_presale_activation,false);
          assert.equal(lock.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V3_NODE_GREEN");
          console.log("provider_historical_lock_proof_reexecuted=false");
          console.log("provider_current_content_semantics_requalified=true");
          console.log("candidate_enforcement_identity_accepted=true");
          console.log("production_source_finality_authority_ready=false");
          console.log("public_presale_activation=false");
          console.log("funds_movement=false");
          NODE

      - name: Prove accepted V3 lock is deployment-planner consumable
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git switch -C main "$head"
          npx tsx ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts             --plan             --expected-commit "$head"             --expected-tree "$tree"             --accepted-enforcement-lock-path ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json             | tee "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"
          grep -Fx 'status=PLAN_GREEN' "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"
          grep -Fx 'accepted_enforcement_set_sha256=bf158923831b21dd1e907c91cd4889afbe9fd8bce221e12b0fa1a2bb0896943d' "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"
          grep -Fx 'filesystem_mutation=false' "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"
          grep -Fx 'presale_activation=false' "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/deployment-plan-${{ matrix.node }}.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-v7-v2-lock-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/protected-v7-v2-candidate-v3-node-${{ matrix.node }}.json
            ${{ runner.temp }}/protected-v7-v2-lock-v3-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"

  compare:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-v7-v2-lock-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: lock

      - name: Require Node 22/24/26 candidate and lock byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "lock/protected-v7-v2-candidate-v3-node-$node.json"
            test -s "lock/protected-v7-v2-lock-v3-node-$node.json"
          done
          cmp lock/protected-v7-v2-candidate-v3-node-22.json lock/protected-v7-v2-candidate-v3-node-24.json
          cmp lock/protected-v7-v2-candidate-v3-node-22.json lock/protected-v7-v2-candidate-v3-node-26.json
          cmp lock/protected-v7-v2-lock-v3-node-22.json lock/protected-v7-v2-lock-v3-node-24.json
          cmp lock/protected-v7-v2-lock-v3-node-22.json lock/protected-v7-v2-lock-v3-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const candidateBytes=fs.readFileSync("lock/protected-v7-v2-candidate-v3-node-22.json");
          const lockBytes=fs.readFileSync("lock/protected-v7-v2-lock-v3-node-22.json");
          const candidate=JSON.parse(candidateBytes);
          const lock=JSON.parse(lockBytes);
          assert.equal(candidate.candidate_enforcement_set_sha256,
            "bf158923831b21dd1e907c91cd4889afbe9fd8bce221e12b0fa1a2bb0896943d");
          assert.equal(lock.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V3");
          assert.equal(lock.candidate_enforcement_identity_accepted,true);
          assert.equal(lock.production_source_finality_authority_ready,false);
          assert.equal(lock.public_presale_activation,false);
          assert.equal(lock.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V3_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+
            crypto.createHash("sha256").update(candidateBytes).digest("hex"));
          console.log("lock_json_sha256="+
            crypto.createHash("sha256").update(lockBytes).digest("hex"));
          console.log("accepted_enforcement_set_sha256="+
            lock.candidate_evidence.candidate_enforcement_set_sha256);
          console.log("candidate_enforcement_identity_accepted=true");
          console.log("funds_movement=false");
          NODE
