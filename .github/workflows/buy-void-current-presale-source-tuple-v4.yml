name: VOID Buy VOID current presale source tuple V4

on:
  pull_request:
    paths:
      - "src/index.ts"
      - "src/economic/buy_void_preappend_plain_input_v1.ts"
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_preappend_inherited_index_setter_v1.mjs"
      - "scripts/prove_buy_void_dispatch_own_array_index_v1.mjs"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v4.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v5.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v6.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v3.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v5.mjs"
      - ".github/workflows/buy-void-current-presale-source-tuple-v3.yml"
      - ".github/workflows/buy-void-current-presale-source-tuple-v4.yml"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and authenticate exact tuple
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          test "$(git hash-object src/economic/buy_void_preappend_plain_input_v1.ts)" = "945cd55d92d4a76fe0d8bfaa237ca27d4753dc2f"
          test "$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)" = "b451bcd895986dadaf6e53954671062068316ccf"
          test "$(git hash-object src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts)" = "eb4fb37c6073415228b312663c45a99d5015c727"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts)" = "5050498f600efd7d5c83af214f75663a66685d6e"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts)" = "794b3bb8e2c386be7fad607a3adf79aadff5332d"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v4.ts)" = "752deafb5a8ff884cfcfc0ff7ef8fded2a92287b"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v5.ts)" = "9113830d86e60d818ddf10d6381fb285b534d008"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts)" = "d31f8cbb85ed17c9937baf3c9725a6fae22cc829"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts)" = "959e19e2cfc76616385a47556335e4ba8e094e44"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v3.ts)" = "10a6dad27b08c3b21ccc2d0940451f770438e89e"
          test "$(git hash-object src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = "d1320be22fe55af24017b84f0655fbcde82dbee9"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v6.ts)" = "1ef5cd61a338cf726ddec59cea24932846d8d1fb"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts)" = "6eb05ddde297f951a738345b4f42c674f07d740c"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts)" = "b7a2bef595f43775d7b788e7efbc3fffa4e20f86"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts)" = "8e5b81f29cc80dd68bfe8d60b56e2c28031ce957"
          test "$(git hash-object scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs)" = "3f91404c8f5b6897b0781455564b4ec26b480c03"
          test "$(git hash-object scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v5.mjs)" = "5dc2d12e34e648d2dbfb8f1e79584caa2f8abc51"
          test "$(git hash-object scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v6.mjs)" = "6d0d489eba7964d82e104c8824f1ebdb0da9e397"
      - name: Require predecessor refusals and current successor success
        run: |
          set -euo pipefail
          for spec in             "scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts|exact reviewed dispatcher source drift"             "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts|reviewed handoff source blob mismatch:src/economic/buy_void_verified_allocation_replay_binding_v1.ts"             "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs|reviewed_source_blob_drift:src/economic/buy_void_allocation_reservation_ledger_v1.ts"             "scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v2.ts|reviewed source changed:src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
          do
            proof="${spec%%|*}"
            marker="${spec#*|}"
            log="$RUNNER_TEMP/$(basename "$proof").hold"
            set +e
            case "$proof" in
              *.ts) node --import tsx "$proof" >"$log" 2>&1 ;;
              *) node "$proof" >"$log" 2>&1 ;;
            esac
            status=$?
            set -e
            test "$status" -eq 1
            grep -Fq "$marker" "$log"
            if [[ "$proof" == *first_original_v3.ts ]]; then
              # Frozen V3 pins the older replay first, before the writer.
              grep -Fq '435ed6000caad046f48fb318fbc7c865393f3b6c' "$log"
              grep -Fq 'b451bcd895986dadaf6e53954671062068316ccf' "$log"
            fi
            if [[ "$proof" == *crash_matrix_v4.mjs ]]; then
              grep -Fq '66617a89d5ad9f81b5a21d98cca55fcda6902a80' "$log"
              grep -Fq '8d84955e1e093a5c5af63241e62b8722fadd2f29' "$log"
            fi
            if [[ "$proof" == *dual_rail_v2.ts ]]; then
              # V2's first frozen dependency is the old central writer;
              # exact current writer drift must HOLD, not be repinned.
              grep -Fq 'f591f7407d9afc2cf77e0f90923aa11b4817fd4e' "$log"
              grep -Fq 'd1320be22fe55af24017b84f0655fbcde82dbee9' "$log"
            fi
            echo "historical_refusal_verified=$proof"
          done
          log="$RUNNER_TEMP/dispatcher-v3.hold"
          set +e
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts >"$log" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -Fq 'current mounted router generation drift' "$log"
          echo "historical_refusal_verified=scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts"
          log="$RUNNER_TEMP/dispatcher-v4.hold"
          set +e
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v4.ts >"$log" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -Fq 'current mounted router generation drift' "$log"
          grep -Fq '40239e0f76aa1edce43523d18c1b57691e41e8cf' "$log"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$log"
          echo "historical_refusal_verified=scripts/prove_buy_void_operator_verified_allocation_dispatch_v4.ts"
          log="$RUNNER_TEMP/dispatcher-v5.hold"
          set +e
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v5.ts >"$log" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -Fq 'current mounted router generation drift' "$log"
          grep -Fq '123ec1792a027f93d4c9030749a0e7e136a75a44' "$log"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$log"
          echo "historical_refusal_verified=scripts/prove_buy_void_operator_verified_allocation_dispatch_v5.ts"
          for spec in \
            "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts|reviewed handoff source blob mismatch:src/economic/buy_void_verified_payment_capacity_admission_v1.ts" \
            "scripts/prove_buy_void_operator_verified_allocation_dispatch_v6.ts|payment/allocation writer source generation drift" \
            "scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v3.ts|reviewed source changed:src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
          do
            proof="${spec%%|*}"
            marker="${spec#*|}"
            log="$RUNNER_TEMP/$(basename "$proof").fifo-successor-hold"
            set +e
            node --import tsx "$proof" >"$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 1
            grep -Fq "$marker" "$log"
            grep -Fq 'ac8bf352979e0e24d2cab45c3b23949e1bd2b026' "$log"
            grep -Fq 'd1320be22fe55af24017b84f0655fbcde82dbee9' "$log"
            echo "fifo_predecessor_refusal_verified=$proof"
          done
          node scripts/prove_buy_void_preappend_inherited_index_setter_v1.mjs
          node scripts/prove_buy_void_dispatch_own_array_index_v1.mjs
          echo current_positive_begin=crash_v6
          node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v6.mjs > crash-${{ matrix.node }}.json
          echo current_positive_begin=first_original_v5
          node --import tsx scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts > handoff-${{ matrix.node }}.txt
          echo current_positive_begin=dispatcher_v7
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts > dispatch-${{ matrix.node }}.txt
          echo current_positive_begin=dual_rail_v4
          node --import tsx scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts > dualrail-${{ matrix.node }}.txt
          grep -Fq 'VOID_BUY_VOID_PAYMENT_ALLOCATION_HYPOTHETICAL_CRASH_MATRIX_V6' crash-${{ matrix.node }}.json
          grep -Fxq 'VOID_BUY_VOID_VERIFIED_ALLOCATION_HANDOFF_FIRST_ORIGINAL_V5_GREEN' handoff-${{ matrix.node }}.txt
          grep -Fxq 'VOID_BUY_VOID_OPERATOR_ALLOCATION_DISPATCH_SOURCE_CANDIDATE_V7_GREEN' dispatch-${{ matrix.node }}.txt
          grep -Fxq 'frozen_dispatcher_v6_proof_unchanged=true' dispatch-${{ matrix.node }}.txt
          grep -Fxq 'VOID_BUY_VOID_FIRST_ORIGINAL_DUAL_RAIL_REAL_HANDOFF_V4_GREEN' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'both_native_usdc_rails_admitted=2' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'reviewed_replay_source_blob=b451bcd895986dadaf6e53954671062068316ccf' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'reviewed_allocation_ledger_source_blob=8d84955e1e093a5c5af63241e62b8722fadd2f29' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'frozen_dual_rail_v2_proof_unchanged=true' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'actual_live_provider_finality_verified=false' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'mounted_verified_allocation_dispatch=false' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'funds_movement=false' dualrail-${{ matrix.node }}.txt
          grep -Fxq 'production_gate_ready=false' handoff-${{ matrix.node }}.txt
          grep -Fxq 'mounted_verified_allocation_dispatch=false' dispatch-${{ matrix.node }}.txt
          grep -Fxq 'funds_moved=false' dispatch-${{ matrix.node }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-presale-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            crash-${{ matrix.node }}.json
            handoff-${{ matrix.node }}.txt
            dispatch-${{ matrix.node }}.txt
            dualrail-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: current-presale-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: evidence
      - run: |
          set -euo pipefail
          for kind in crash handoff dispatch dualrail; do
            ext=json
            test "$kind" = crash || ext=txt
            cmp "evidence/$kind-22.$ext" "evidence/$kind-24.$ext"
            cmp "evidence/$kind-22.$ext" "evidence/$kind-26.$ext"
          done
          echo VOID_BUY_VOID_CURRENT_PRESALE_SOURCE_TUPLE_V4_CROSS_NODE_GREEN
          echo dual_rail_handoff_current_v4_proven=true
          echo production_gate_ready=false
          echo presale_activation=false
          echo funds_moved=false
