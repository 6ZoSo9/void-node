name: Apollyon durable attempt claim native peer guard v2

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_durable_attempt_claim_native_peer_guard_v2.c"
      - "scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_v2.mjs"
      - "docs/security/apollyon-durable-attempt-claim-native-peer-guard-v2.md"
      - ".github/workflows/apollyon-durable-attempt-claim-native-peer-guard-v2.yml"
      - "tools/apollyon-durable-attempt-claim-revalidation-handoff-v2.mjs"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_durable_attempt_claim_native_peer_guard_v2.c"
      - "scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_v2.mjs"
      - "docs/security/apollyon-durable-attempt-claim-native-peer-guard-v2.md"
      - ".github/workflows/apollyon-durable-attempt-claim-native-peer-guard-v2.yml"
      - "tools/apollyon-durable-attempt-claim-revalidation-handoff-v2.mjs"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove native peer guard
        run: |
          set -euo pipefail
          node --check scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_v2.mjs
          node scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_v2.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              BASE="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"
              BASE="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              BASE="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
