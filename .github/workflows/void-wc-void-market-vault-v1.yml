name: VOID WC/VOID market vault v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-v1.yml"
      - "contracts/mainnet/WCVoidMarketVaultV1.sol"
      - "test/mainnet/WCVoidMarketVaultV1.t.sol"
      - "scripts/prove_void_wc_void_market_vault_v1.mjs"
      - "docs/architecture/wc-void-market-vault-v1.md"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "docs/operators/wc-void-production-readiness-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-market-vault-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove locked market vault source boundary
        run: node scripts/prove_void_wc_void_market_vault_v1.mjs

      - name: Preserve production readiness HOLD
        run: node scripts/prove_void_wc_void_production_readiness_v1.mjs

      - name: Preserve stacked WC/VOID source gates
        run: |
          node scripts/prove_void_wc_void_coupled_opening_v1.mjs
          node scripts/prove_void_wc_void_ledger_persistence_v1.mjs

      - name: Diff hygiene
        run: git diff --check

  foundry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run self-contained Foundry adversarial suite
        env:
          FOUNDRY_IMAGE: ghcr.io/foundry-rs/foundry:v1.7.1
        run: |
          set -Eeuo pipefail

          FOUNDRY_HOME="$RUNNER_TEMP/void-foundry-home"
          FOUNDRY_OUT="$RUNNER_TEMP/void-foundry-out"
          FOUNDRY_CACHE="$RUNNER_TEMP/void-foundry-cache"
          FOUNDRY_PROJECT="$RUNNER_TEMP/void-wc-void-market-vault-foundry"

          mkdir -p             "$FOUNDRY_HOME"             "$FOUNDRY_OUT"             "$FOUNDRY_CACHE"             "$FOUNDRY_PROJECT/contracts/mainnet"             "$FOUNDRY_PROJECT/test/mainnet"

          install -m 0444             contracts/mainnet/WCVoidMarketVaultV1.sol             "$FOUNDRY_PROJECT/contracts/mainnet/WCVoidMarketVaultV1.sol"
          install -m 0444             test/mainnet/WCVoidMarketVaultV1.t.sol             "$FOUNDRY_PROJECT/test/mainnet/WCVoidMarketVaultV1.t.sol"

          cmp             contracts/mainnet/WCVoidMarketVaultV1.sol             "$FOUNDRY_PROJECT/contracts/mainnet/WCVoidMarketVaultV1.sol"
          cmp             test/mainnet/WCVoidMarketVaultV1.t.sol             "$FOUNDRY_PROJECT/test/mainnet/WCVoidMarketVaultV1.t.sol"

          docker pull "$FOUNDRY_IMAGE"
          docker run --rm             --user "$(id -u):$(id -g)"             --entrypoint forge             -e HOME=/foundry-home             -v "$FOUNDRY_HOME:/foundry-home"             -v "$FOUNDRY_OUT:/foundry-out"             -v "$FOUNDRY_CACHE:/foundry-cache"             -v "$FOUNDRY_PROJECT:/proof:ro"             -w /proof             "$FOUNDRY_IMAGE"             test             --root /proof             --contracts contracts             --match-path test/mainnet/WCVoidMarketVaultV1.t.sol             --use 0.8.24             --evm-version paris             --out /foundry-out             --cache-path /foundry-cache             -vvv

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
