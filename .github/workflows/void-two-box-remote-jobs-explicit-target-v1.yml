name: VOID two-box remote jobs explicit target v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-two-box-remote-jobs-explicit-target-v1.yml"
      - "ops/two-box-remote-jobs-submit-proof.sh"
      - "ops/two-box-remote-jobs-submit-product-proof.sh"
      - "ops/two-box-remote-datanet-view-proof.sh"
      - "ops/two-box-network-peer-proof.sh"
      - "scripts/prove_void_two_box_network_peer_explicit_target_v1.mjs"
      - "scripts/prove_void_two_box_remote_jobs_explicit_target_v1.mjs"
      - "docs/operators/void-two-box-remote-jobs-explicit-target-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-two-box-remote-jobs-explicit-target-v1.yml"
      - "ops/two-box-remote-jobs-submit-proof.sh"
      - "ops/two-box-remote-jobs-submit-product-proof.sh"
      - "ops/two-box-remote-datanet-view-proof.sh"
      - "ops/two-box-network-peer-proof.sh"
      - "scripts/prove_void_two_box_network_peer_explicit_target_v1.mjs"
      - "scripts/prove_void_two_box_remote_jobs_explicit_target_v1.mjs"
      - "docs/operators/void-two-box-remote-jobs-explicit-target-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax only
        run: |
          bash -n ops/two-box-remote-jobs-submit-proof.sh
          bash -n ops/two-box-remote-jobs-submit-product-proof.sh
          bash -n ops/two-box-remote-datanet-view-proof.sh
          bash -n ops/two-box-network-peer-proof.sh
          node --check scripts/prove_void_two_box_remote_jobs_explicit_target_v1.mjs
          node --check scripts/prove_void_two_box_network_peer_explicit_target_v1.mjs
      - name: Prove explicit target contract without network
        run: node scripts/prove_void_two_box_remote_jobs_explicit_target_v1.mjs
      - name: Prove network-peer explicit target contract without network
        run: node scripts/prove_void_two_box_network_peer_explicit_target_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
