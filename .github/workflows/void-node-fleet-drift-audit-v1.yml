name: VOID node fleet drift audit v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-node-fleet-drift-audit-v1.yml"
      - "docs/operations/void-node-fleet-drift-audit-v1.md"
      - "scripts/prove_void_node_fleet_drift_audit_v1.mjs"
      - "tools/void-node-fleet-drift-audit-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-node-fleet-drift-audit-v1.yml"
      - "docs/operations/void-node-fleet-drift-audit-v1.md"
      - "scripts/prove_void_node_fleet_drift_audit_v1.mjs"
      - "tools/void-node-fleet-drift-audit-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-node-fleet-drift-audit-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check tools/void-node-fleet-drift-audit-v1.mjs
          node --check scripts/prove_void_node_fleet_drift_audit_v1.mjs
      - name: Prove fail-closed drift classification
        run: node scripts/prove_void_node_fleet_drift_audit_v1.mjs
      - name: Prove example config is printable without host access
        run: |
          node tools/void-node-fleet-drift-audit-v1.mjs --print-example-config > /tmp/void-fleet-config.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/void-fleet-config.json","utf8")); if(x.marker!=="VOID_NODE_FLEET_DRIFT_CONFIG_V1"||x.nodes.length!==3) process.exit(1)'
      - name: Diff hygiene across committed change range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == "push" ]] && [[ -n "$PUSH_BEFORE_SHA" ]] && [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            git diff --check HEAD^..HEAD
          fi
