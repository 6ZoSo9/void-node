name: Buy VOID Epoch-2 dormant first-entry bootstrap V6 candidate lock v2

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
  push:
    branches:
      - main
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.c"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired V6 lock generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.md' \
            'ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.json' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v2.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.json)" = \
            a55acded2065e90286832da3e23edf8ab13827d8
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v2.py)" = \
            e6f3c52e94494a6584bedf213331fc38ff2c3e81
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v2.md)" = \
            eb8382c02e2c7bfb94ad9aea0b01e04ae6aaa965

          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_v1.py)" = \
            e4e8ca7f5ca3fbc935821ce6d607751fcd653658
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.yml)" = \
            cfc99617fb69f6cb945b806c6b3b153086eeb159
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-v1.md)" = \
            e5f4023f0b60ce5ef144f91b8f95bb9094a1dfce
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v6.c)" = \
            560726bcae6ea0738502cb5e74b65f9116bd447d
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf)" = \
            de56bacb30bea0adc418e240cf3fb8d900b061ef
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v5.py)" = \
            ce6930bc1be8239a3171d4922c44b96a50f5778b
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json)" = \
            f5b03c6b81016edf21f605099e0ef8976f40e107

          test "$(git rev-parse 404367eb982fa92a40f3c2fe51d5f172a1e9fac0^{tree})" = \
            724f501caeb7fa888b3b93f55ff5da08a577088a
          git merge-base --is-ancestor \
            404367eb982fa92a40f3c2fe51d5f172a1e9fac0 \
            "$EXPECTED_HEAD"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove repaired V6 candidate lock
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v6-cruft-lock-proof.log"
          python3 -I -B \
            scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v6_candidate_lock_v2.py \
            | tee "$out"

          markers=(
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V6_CANDIDATE_LOCK_V2_PROOF_GREEN'
            'lock_id=voidbuye2dormantbootstraplock3r_9025557c46c1b5ba8ece40f89808616a0b099de887234a2f151d0c57ad9734c8'
            'repaired_source_generation_bound=true'
            'cruft_mtimes_compatibility_accepted=true'
            'cruft_mtimes_non_authoritative=true'
            'cruft_mtimes_private_object_view_copy=false'
            'candidate_source_head_rederived=true'
            'hosted_three_way_candidate_identity_bound=true'
            'independent_rederivation_bound=true'
            'candidate_report_content_address_bound=true'
            'candidate_accepted=true'
            'native_binary_identity_accepted=true'
            'source_generation_identity_accepted=true'
            'superseded_pre_cruft_lock_preserved=true'
            'superseded_pre_cruft_lock_install_authority=false'
            'protected_install_authorized=false'
            'live_execution_authorized=false'
            'credential_access_authorized=false'
            'signing_authorized=false'
            'transaction_authorized=false'
            'rpc_call_authorized=false'
            'funds_movement_authorized=false'
            'next_gate=void_buy_void_epoch2_dormant_first_entry_bootstrap_v6_materializer_v2'
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
