name: VOID credential request PROXY-v2 edge runtime v1

on:
  pull_request:
    paths:
      - "ops/void-agent-credential-request-proxy-v2-edge-v1.mjs"
      - "examples/systemd/void-agent-credential-request-proxy-v2-edge-v1.service"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-source-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-edge-composition-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-rate-state-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_proxy_v2_edge_runtime_v1.mjs"
      - "docs/architecture/agent-paid-work-credential-request-proxy-v2-edge-runtime-v1.md"
      - ".github/workflows/agent-paid-work-credential-request-proxy-v2-edge-runtime-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: edge runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove PROXY-v2 stream, durable rate debit and exact forwarding
        run: |
          set -euo pipefail
          node --check ops/void-agent-credential-request-proxy-v2-edge-v1.mjs
          node --check tools/void-agent-paid-work-credential-request-proxy-v2-rate-state-v1.mjs
          node --check scripts/prove_agent_paid_work_credential_request_proxy_v2_edge_runtime_v1.mjs
          node scripts/prove_agent_paid_work_credential_request_proxy_v2_edge_runtime_v1.mjs
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git diff --check "$BASE" "$HEAD"
