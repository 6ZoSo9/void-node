name: VOID Buy VOID first-original preappend plain input v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_preappend_plain_input_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "scripts/prove_buy_void_preappend_plain_input_v1.mjs"
      - "docs/architecture/buy-void-preappend-plain-input-v1.md"
      - ".github/workflows/buy-void-preappend-plain-input-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-preappend-plain-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact review head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact head and clean state
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build reviewed source
        run: |
          npm run typecheck
          npm run build
      - name: Keep existing pure replay/first-original proof green
        run: node scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs
      - name: Exercise real preappend classifier with caller-controlled objects
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_preappend_plain_input_v1.mjs \
            | tee "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "VOID_BUY_VOID_PREAPPEND_PLAIN_INPUT_V1_PROOF_GREEN" "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "ordinary_original_buyer_ready_preserved=true" "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "event_request_getter_and_toJSON_hooks_called=0" "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "ambient_serializer_hook_calls=0" "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "production_allocation_mutation_ready=false" "preappend-plain-node-${{ matrix.node }}.txt"
          grep -Fx "presale_activation=false" "preappend-plain-node-${{ matrix.node }}.txt"
      - name: Preserve clean compiled build and checked diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA:-HEAD^}" "$HEAD_SHA"
      - name: Upload read-only synthetic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-preappend-plain-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: preappend-plain-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all three exact-head receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-preappend-plain-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require Node 22 24 26 byte-identical outcomes
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "receipts/preappend-plain-node-$v.txt"; done
          cmp receipts/preappend-plain-node-22.txt receipts/preappend-plain-node-24.txt
          cmp receipts/preappend-plain-node-22.txt receipts/preappend-plain-node-26.txt
          echo "VOID_BUY_VOID_PREAPPEND_PLAIN_THREE_NODE_GREEN"
          echo "production_allocation_mutation_ready=false"
          echo "presale_activation=false"
