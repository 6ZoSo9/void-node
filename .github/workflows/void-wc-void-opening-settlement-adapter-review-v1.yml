name: VOID WC/VOID opening settlement adapter review v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/wc-void-opening-settlement-adapter-review-v1.json"
      - "tools/void-wc-void-opening-settlement-adapter-review-v1.mjs"
      - "scripts/prove_void_wc_void_opening_settlement_adapter_review_v1.mjs"
      - "docs/operators/wc-void-opening-settlement-adapter-review-v1.md"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_opening_v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - ".github/workflows/void-wc-void-opening-settlement-adapter-review-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/mainnet0/wc-void-opening-settlement-adapter-review-v1.json"
      - "tools/void-wc-void-opening-settlement-adapter-review-v1.mjs"
      - "scripts/prove_void_wc_void_opening_settlement_adapter_review_v1.mjs"
      - "docs/operators/wc-void-opening-settlement-adapter-review-v1.md"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_opening_v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - ".github/workflows/void-wc-void-opening-settlement-adapter-review-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-opening-settlement-adapter-review-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove settlement adapter source review
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-opening-settlement-adapter-review-v1.mjs
          node --check scripts/prove_void_wc_void_opening_settlement_adapter_review_v1.mjs
          node scripts/prove_void_wc_void_opening_settlement_adapter_review_v1.mjs

      - name: Prove production candidate remains fail closed
        run: |
          set -euo pipefail
          node scripts/prove_void_wc_void_production_readiness_v1.mjs

      - name: Diff hygiene
        run: git diff --check
