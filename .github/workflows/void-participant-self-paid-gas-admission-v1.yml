name: VOID participant self-paid gas admission v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-participant-self-paid-gas-admission-v1.yml"
      - "tools/void-participant-self-paid-gas-admission-v1.mjs"
      - "scripts/prove_void_participant_self_paid_gas_admission_v1.mjs"
      - "docs/architecture/participant-self-paid-gas-admission-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-participant-self-paid-gas-admission-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove aggregate self-paid gas admission
        run: node scripts/prove_void_participant_self_paid_gas_admission_v1.mjs

      - name: Diff hygiene
        run: git diff --check
