name: Index size and markers v1

on:
  pull_request:
    paths:
      - '.github/workflows/index-size-markers-v1.yml'
      - 'tools/check_index_size.sh'
      - 'src/index.ts'
      - 'fixtures/ops/guard-baselines/index-ts-size-v1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/index-size-markers-v1.yml'
      - 'tools/check_index_size.sh'
      - 'src/index.ts'
      - 'fixtures/ops/guard-baselines/index-ts-size-v1.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure script is executable
        run: chmod +x tools/check_index_size.sh

      - name: Run guard
        run: tools/check_index_size.sh
