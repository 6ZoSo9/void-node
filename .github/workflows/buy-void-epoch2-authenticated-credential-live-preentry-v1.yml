name: VOID Buy Epoch-2 authenticated credential privileged pre-entry v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_preentry_v1.c"
      - "scripts/prove_void_buy_void_epoch2_authenticated_credential_live_preentry_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-preentry-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-preentry-v1.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_preentry_v1.c"
      - "scripts/prove_void_buy_void_epoch2_authenticated_credential_live_preentry_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-preentry-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-preentry-v1.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-authenticated-credential-live-preentry-v1-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: \${{ matrix.node }}
      - name: Prove source and static first entry
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_void_epoch2_authenticated_credential_live_preentry_v1.mjs |
            tee "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_LIVE_PREENTRY_V1_PROOF_GREEN' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'sealed_v2_runner_bound=true' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'runner_exact_sha256_bound=true' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'direct_root_node_stdin_requires_native_parent=true' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'caller_stdin_not_forwarded=true' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'static_preentry_loader_poison_blocked=true' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'privileged_first_entry_installation_proven=false' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'transaction=false' "$RUNNER_TEMP/e2-preentry-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/e2-preentry-proof.log"
      - run: git diff --check

  root-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build disposable fixed-path fixture
        run: |
          set -euo pipefail
          fixed_root=/opt/void-buy-void-epoch2-live-composition-v2
          fixed_entry="$fixed_root/void_buy_void_epoch2_authenticated_credential_live_preentry_v1"
          fixed_runner="$fixed_root/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
          cc -std=c11 -Wall -Wextra -Werror -O2 -static \
            ops/precision/void_buy_void_epoch2_authenticated_credential_live_preentry_v1.c \
            -o "$RUNNER_TEMP/e2-preentry"
          sudo install -d -o root -g root -m 0755 "$fixed_root"
          sudo install -o root -g root -m 0555 "$RUNNER_TEMP/e2-preentry" "$fixed_entry"
          sudo install -o root -g root -m 0444 \
            ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs \
            "$fixed_runner"

      - name: Reject same-size tampered runner before Node
        run: |
          set -euo pipefail
          fixed_root=/opt/void-buy-void-epoch2-live-composition-v2
          fixed_entry="$fixed_root/void_buy_void_epoch2_authenticated_credential_live_preentry_v1"
          fixed_runner="$fixed_root/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
          cp ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs \
            "$RUNNER_TEMP/tampered-runner.mjs"
          python3 - "$RUNNER_TEMP/tampered-runner.mjs" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          b=bytearray(p.read_bytes())
          i=next(i for i,v in enumerate(b) if 0x41 <= v <= 0x7a)
          b[i]^=1
          p.write_bytes(b)
          PY
          test "$(stat -c %s "$RUNNER_TEMP/tampered-runner.mjs")" = "24365"
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/tampered-runner.mjs" "$fixed_runner"
          set +e
          sudo "$fixed_entry" --run \
            --confirm RUN_AUTHENTICATED_EPOCH2_CREDENTIAL_LIVE_COMPOSITION_V2 \
            --expected-head "\${GITHUB_SHA}" </dev/null \
            >"$RUNNER_TEMP/tampered.out" 2>"$RUNNER_TEMP/tampered.err"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'native_preentry_runner_digest_mismatch' "$RUNNER_TEMP/tampered.err"
          sudo install -o root -g root -m 0444 \
            ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs \
            "$fixed_runner"

      - name: Reject direct root Node runner
        run: |
          set -euo pipefail
          set +e
          sudo /usr/bin/node --input-type=module - --run \
            --confirm RUN_AUTHENTICATED_EPOCH2_CREDENTIAL_LIVE_COMPOSITION_V2 \
            --expected-head "\${GITHUB_SHA}" \
            < ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs \
            >"$RUNNER_TEMP/direct.out" 2>"$RUNNER_TEMP/direct.err"
          status=$?
          set -e
          test "$status" -eq 2
          grep -E 'privileged_first_entry_parent_(identity_mismatch|unavailable)' "$RUNNER_TEMP/direct.err"

      - name: Caller stdin cannot become privileged JavaScript
        run: |
          set -euo pipefail
          fixed_entry=/opt/void-buy-void-epoch2-live-composition-v2/void_buy_void_epoch2_authenticated_credential_live_preentry_v1
          marker="$RUNNER_TEMP/caller-stdin-executed"
          python3 - "$marker" "$RUNNER_TEMP/hostile-stdin.mjs" <<'PY'
          import json,pathlib,sys
          marker=sys.argv[1]
          pathlib.Path(sys.argv[2]).write_text(
              'import fs from "node:fs"; fs.writeFileSync('
              + json.dumps(marker)
              + ',"bad");\n',
              encoding="utf-8",
          )
          PY
          set +e
          sudo "$fixed_entry" --run \
            --confirm RUN_AUTHENTICATED_EPOCH2_CREDENTIAL_LIVE_COMPOSITION_V2 \
            --expected-head "\${GITHUB_SHA}" \
            <"$RUNNER_TEMP/hostile-stdin.mjs" \
            >"$RUNNER_TEMP/native.out" 2>"$RUNNER_TEMP/native.err"
          status=$?
          set -e
          test "$status" -ne 0
          test ! -e "$marker"
          grep -F 'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_LIVE_COMPOSITION_V2_HOLD' \
            "$RUNNER_TEMP/native.err"

      - name: Clean disposable fixed-path fixture
        if: always()
        run: |
          sudo rm -rf /opt/void-buy-void-epoch2-live-composition-v2
