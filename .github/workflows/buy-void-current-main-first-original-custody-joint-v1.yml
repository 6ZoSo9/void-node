name: VOID Buy VOID current-main first-original and custody joint qualification v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "tools/void-buy-allocation-custody-service-v1.mjs"
      - "src/economic/buy_void_custody_payment_ledgers_observed_read_v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_service_v1.mjs"
      - "scripts/prove_buy_void_first_original_*"
      - "scripts/prove_buy_void_allocation_raw_jsonl_prototype_boundary_v1.mjs"
      - "scripts/prove_buy_void_fatal_utf8_decoder_intrinsic_v1.ts"
      - "docs/architecture/buy-void-current-main-first-original-custody-joint-v1.md"
      - ".github/workflows/buy-void-current-main-first-original-custody-joint-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-current-main-custody-joint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact unmerged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source tuple and independently merged custody source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)" = "b451bcd895986dadaf6e53954671062068316ccf"
          test "$(git hash-object src/economic/buy_void_allocation_reservation_ledger_v1.ts)" = "8d84955e1e093a5c5af63241e62b8722fadd2f29"
          test "$(git hash-object scripts/prove_buy_void_fatal_utf8_decoder_intrinsic_v1.ts)" = "d84cc8f572bef9517eef625075b6370ee0f21082"
          test "$(git hash-object tools/void-buy-allocation-custody-service-v1.mjs)" = "b89d6c3ef210473f486f9fc9d1cab9303e6336c9"
          git merge-base --is-ancestor 16a9002a3b1ffe0f8faa2c9170ca6c087565c59a HEAD
          git merge-base --is-ancestor df7ad33671b8c47a350c1d3ebfc87c59d69d580a HEAD

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Locked install, typecheck and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Verify first-original buyer and allocation ledger with actual compiled modules
        run: |
          set -euo pipefail
          mkdir -p proof-evidence
          node scripts/prove_buy_void_first_original_own_array_history_v1.mjs > proof-evidence/own-array.txt
          node scripts/prove_buy_void_first_original_byte_framed_jsonl_v1.mjs > proof-evidence/raw-first-original.txt
          node scripts/prove_buy_void_first_original_inherited_json_fields_v1.mjs > proof-evidence/inherited-rows.txt
          node scripts/prove_buy_void_allocation_raw_jsonl_prototype_boundary_v1.mjs > proof-evidence/allocation-raw.txt
          node --import tsx scripts/prove_buy_void_fatal_utf8_decoder_intrinsic_v1.ts > "decoder-${{ matrix.node }}.txt"
          grep -Fx "VOID_FIRST_BUYER_REPLAY_OWN_ARRAY_HISTORY_V1_GREEN" proof-evidence/own-array.txt
          grep -Fx "VOID_FIRST_ORIGINAL_BYTE_FRAMED_JSONL_V1_GREEN" proof-evidence/raw-first-original.txt
          grep -Fx "VOID_BUY_VOID_FIRST_ORIGINAL_INHERITED_JSON_FIELDS_V1_GREEN" proof-evidence/inherited-rows.txt
          grep -Fx "VOID_BUY_VOID_ALLOCATION_RAW_JSONL_PROTOTYPE_BOUNDARY_V1_GREEN" proof-evidence/allocation-raw.txt
          grep -Fx "VOID_BUY_VOID_FATAL_UTF8_INTRINSIC_SOURCE_GREEN" "decoder-${{ matrix.node }}.txt"
          grep -Fx "shared_allocation_backing_empty_nonempty_hold=true" "decoder-${{ matrix.node }}.txt"
          grep -Fx "shared_replay_backing_empty_nonempty_hold=true" "decoder-${{ matrix.node }}.txt"
          grep -Fx "post_import_shared_predicate_calls_on_economic_classifiers=0" "decoder-${{ matrix.node }}.txt"
          grep -Fx "ordinary_empty_allocation_buffer_genesis_valid=true" "decoder-${{ matrix.node }}.txt"
          grep -Fx "post_import_method_getter_callbacks_on_economic_classifiers=0" "decoder-${{ matrix.node }}.txt"
          grep -Fx "malicious_decoder_callback_invocations_on_economic_classifiers=0" "decoder-${{ matrix.node }}.txt"
          grep -Fx "production_gate_ready=false" "decoder-${{ matrix.node }}.txt"
          grep -Fx "original_wallet_inheritance_refused=true" proof-evidence/inherited-rows.txt
          grep -Fx "idempotent_retry_preserves_full_history=true" proof-evidence/allocation-raw.txt
          grep -Fx "payment_or_allocation_append_performed=false" proof-evidence/inherited-rows.txt
          grep -Fx "payment_or_allocation_append_performed=false" proof-evidence/allocation-raw.txt

      - name: Prove merged service independently reads durable payment and stays mutation-disabled
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-service-v1.mjs
          node --check src/economic/buy_void_custody_payment_ledgers_observed_read_v1.mjs
          node scripts/prove_void_buy_allocation_custody_service_v1.mjs > proof-evidence/merged-custody.txt
          grep -Fx "VOID_BUY_VOID_ALLOCATION_CUSTODY_SERVICE_V1_PROOF_GREEN" proof-evidence/merged-custody.txt
          grep -Fx "canonical_verified_payment_replay_classifier_reused=true" proof-evidence/merged-custody.txt
          grep -Fx "durable_payment_provenance_reaches_capacity_lock_hold=true" proof-evidence/merged-custody.txt
          grep -Fx "reserve_ipc_default_hold=true" proof-evidence/merged-custody.txt
          grep -Fx "unverified_intent_recovery_ipc_held=true" proof-evidence/merged-custody.txt
          grep -Fx "payment_acceptance=false" proof-evidence/merged-custody.txt
          grep -Fx "funds_movement=false" proof-evidence/merged-custody.txt

      - name: Emit deterministic non-authority joint receipt
        run: |
          set -euo pipefail
          {
            echo "VOID_BUY_VOID_FIRST_ORIGINAL_AND_CUSTODY_JOINT_MAIN_V1_GREEN"
            echo "main_parent=16a9002a3b1ffe0f8faa2c9170ca6c087565c59a"
            echo "first_original_owner=df7ad33671b8c47a350c1d3ebfc87c59d69d580a"
            echo "replay_source=b451bcd895986dadaf6e53954671062068316ccf"
            echo "allocation_source=8d84955e1e093a5c5af63241e62b8722fadd2f29"
            echo "native_utf8_decoder_bound=true"
            echo "custody_source=b89d6c3ef210473f486f9fc9d1cab9303e6336c9"
            echo "durable_payment_provenance_read=true"
            echo "first_original_wallet_backfill_refused=true"
            echo "raw_allocation_history_preserved=true"
            echo "cross_uid_capacity_serialization_qualified=false"
            echo "reserve_method_enabled=false"
            echo "recover_method_enabled=false"
            echo "deployed_artifact_generation_verified=false"
            echo "payment_acceptance=false"
            echo "presale_activation=false"
            echo "funds_movement=false"
          } > "joint-custody-${{ matrix.node }}.txt"
          cat "joint-custody-${{ matrix.node }}.txt"

      - name: Upload exact head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-joint-custody-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            joint-custody-${{ matrix.node }}.txt
            decoder-${{ matrix.node }}.txt
            proof-evidence/*.txt
          if-no-files-found: error
          retention-days: 3

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

  cross-node:
    needs: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three independent exact-head receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-joint-custody-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Byte-identical Node 22 24 26 review
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/joint-custody-$node.txt"
            test -s "receipts/decoder-$node.txt"
          done
          cmp receipts/joint-custody-22.txt receipts/joint-custody-24.txt
          cmp receipts/joint-custody-22.txt receipts/joint-custody-26.txt
          cmp receipts/decoder-22.txt receipts/decoder-24.txt
          cmp receipts/decoder-22.txt receipts/decoder-26.txt
          grep -Fx "malicious_decoder_callback_invocations_on_economic_classifiers=0" receipts/decoder-22.txt
          grep -Fx "cross_uid_capacity_serialization_qualified=false" receipts/joint-custody-22.txt
          grep -Fx "reserve_method_enabled=false" receipts/joint-custody-22.txt
          grep -Fx "funds_movement=false" receipts/joint-custody-22.txt
          echo "VOID_BUY_VOID_CURRENT_MAIN_JOINT_THREE_NODE_GREEN"
