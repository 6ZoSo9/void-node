name: Demo003 verifier archive safety v1

on:
  pull_request:
    paths:
      - ".github/workflows/public-node-local-data-drop-demo003-verifier-archive-safety-v1.yml"
      - "ops/mainnet0/public-node-local-data-drop-demo003-folder-fixture.sh"
      - "ops/mainnet0/public-node-local-data-drop-demo003-verify-folder-fixture.sh"
      - "ops/mainnet0/public-node-local-data-drop-demo003-verifier-archive-safety-v1-proof.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-node-local-data-drop-demo003-verifier-archive-safety-v1.yml"
      - "ops/mainnet0/public-node-local-data-drop-demo003-folder-fixture.sh"
      - "ops/mainnet0/public-node-local-data-drop-demo003-verify-folder-fixture.sh"
      - "ops/mainnet0/public-node-local-data-drop-demo003-verifier-archive-safety-v1-proof.sh"

permissions:
  contents: read

concurrency:
  group: demo003-verifier-archive-safety-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove Demo003 verifier archive containment
        run: |
          set -euo pipefail
          bash ops/mainnet0/public-node-local-data-drop-demo003-verifier-archive-safety-v1-proof.sh
          git diff --exit-code
