      - "tools/void-economic-system-sponsored-anti-grief-policy-contract-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-wc-void-reverse-settlement-v1.mjs"
      - "tools/void-wc-void-public-quote-disclosure-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/prove_void_participant_postpurchase_production_runtime_binding_v1.mjs"
      - "scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-participant-postpurchase-canonical-application-v1.yml"
      - "docs/operators/participant-postpurchase-canonical-application-v1.md"
      - "scripts/prove_void_participant_postpurchase_canonical_application_v1.mjs"
      - "scripts/prove_void_participant_postpurchase_canonical_application_v2.mjs"
      - "tools/void-participant-postpurchase-canonical-application-v1.mjs"
      - "tools/void-participant-postpurchase-canonical-application-v2.mjs"
      - "tools/void-participant-postpurchase-coupled-candidate-promotion-v1.mjs"
      - "tools/void-participant-postpurchase-production-runtime-binding-v1.mjs"
      - "tools/void-participant-postpurchase-finality-import-v1.mjs"
      - "tools/void-participant-postpurchase-finality-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "tools/void-economic-intent-ttl-caps-policy-v1.mjs"
      - "tools/void-economic-system-sponsored-anti-grief-policy-contract-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "tools/void-wc-void-opening-concentration-sybil-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-wc-void-reverse-settlement-v1.mjs"
      - "tools/void-wc-void-public-quote-disclosure-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/prove_void_participant_postpurchase_production_runtime_binding_v1.mjs"
      - "scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-participant-postpurchase-canonical-application-v1.mjs
          node --check tools/void-participant-postpurchase-canonical-application-v2.mjs
          node --check scripts/prove_void_participant_postpurchase_canonical_application_v1.mjs
          node --check scripts/prove_void_participant_postpurchase_canonical_application_v2.mjs
      - name: Prove participant canonical application generation
        shell: bash
        run: |
          set -euo pipefail
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          case "$package_blob:$lock_blob" in
            f28c3e9446c7623ef203da36a9642d046e5f34ee:b2671f0149f522b2489247016df0a5ec4bb72b8b)
              node scripts/prove_void_participant_postpurchase_canonical_application_v1.mjs
              echo "participant_postpurchase_canonical_application_mode=historical_v1"
              ;;
            14fbdf5717b07fd4c734f5da7a8e84ed59bee93f:15b5c82ea36f13079a2f9e8863722f654eb3f201)
              hold="$RUNNER_TEMP/participant-postpurchase-canonical-v1-hold.txt"
              if node scripts/prove_void_participant_postpurchase_canonical_application_v1.mjs >"$hold" 2>&1; then
                echo "unexpected V1 acceptance of audited package generation" >&2
                exit 1
              fi
              grep -F 'PARTICIPANT_CANONICAL_REVIEWED_RUNTIME_MATERIALIZATION_FAILED' "$hold"
              node scripts/prove_void_participant_postpurchase_canonical_application_v2.mjs
              echo "participant_postpurchase_canonical_application_mode=audited_v2"
              ;;
            *)
              echo "unknown package generation" >&2
              exit 1
              ;;
          esac
      - name: Upstream participant and reviewed-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prove_void_participant_postpurchase_production_runtime_binding_v1.mjs
          node scripts/prove_void_participant_postpurchase_coupled_candidate_promotion_v1.mjs
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          case "$package_blob:$lock_blob" in
            f28c3e9446c7623ef203da36a9642d046e5f34ee:b2671f0149f522b2489247016df0a5ec4bb72b8b)
              node scripts/prove_void_reviewed_node_package_runtime_v1.mjs
              ;;
            14fbdf5717b07fd4c734f5da7a8e84ed59bee93f:15b5c82ea36f13079a2f9e8863722f654eb3f201)
              node scripts/prove_void_reviewed_node_package_runtime_v2.mjs
              ;;
            *)
              echo "unknown package generation" >&2
              exit 1
              ;;
          esac
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
