name: VOID economic epoch2 public VOID state-root anchor v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-public-void-state-root-anchor-v1.yml"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "schemas/economic-epoch2-public-void-state-root-anchor-v1.schema.json"
      - "tools/void-economic-epoch2-public-void-state-root-anchor-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_void_state_root_anchor_v1.mjs"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"
      - "public/public-node/evidence/economic-epoch2-migration-manifest-v1.json"
      - "public/public-node/evidence/economic-epoch2-migration-manifest-v2.json"
      - "ops/mainnet0/economic-epoch2-production-successor-equivalence-evidence-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-nonce-continuity-evidence-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "contracts/mainnet/DatanetContentCommitmentRegistryV1.sol"
      - "docs/operators/economic-epoch2-public-void-state-root-anchor-v1.md"
      - "public/public-node/index.json"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_public_app_composition_gateway_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-epoch2-public-void-state-root-anchor-v1.yml"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "schemas/economic-epoch2-public-void-state-root-anchor-v1.schema.json"
      - "tools/void-economic-epoch2-public-void-state-root-anchor-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_void_state_root_anchor_v1.mjs"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"
      - "public/public-node/evidence/economic-epoch2-migration-manifest-v1.json"
      - "public/public-node/evidence/economic-epoch2-migration-manifest-v2.json"
      - "ops/mainnet0/economic-epoch2-production-successor-equivalence-evidence-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-nonce-continuity-evidence-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "contracts/mainnet/DatanetContentCommitmentRegistryV1.sol"
      - "docs/operators/economic-epoch2-public-void-state-root-anchor-v1.md"
      - "public/public-node/index.json"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "scripts/prove_public_app_composition_gateway_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-economic-epoch2-public-void-state-root-anchor-v1.mjs
          node --check scripts/prove_void_economic_epoch2_public_void_state_root_anchor_v1.mjs
          node -e 'JSON.parse(require("fs").readFileSync("schemas/economic-epoch2-public-void-state-root-anchor-v1.schema.json","utf8"))'
      - name: Prove exact anchor payload
        run: node scripts/prove_void_economic_epoch2_public_void_state_root_anchor_v1.mjs
      - name: Diff hygiene
        run: git diff --check
