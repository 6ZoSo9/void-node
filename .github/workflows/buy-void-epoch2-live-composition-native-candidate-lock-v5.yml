name: Buy VOID Epoch-2 native candidate lock v5

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v5.yml"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v5.py"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v5.yml"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v3-source.yml"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact accepted candidate generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          candidate_head=3d84bdb417f45e3bab450f7a90c5e4c64130f4f1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$candidate_head" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v5.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md' \
            'ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json' \
            'scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py' \
            | sort > "$expected"
          git diff --name-only "$candidate_head" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json)" = \
            db59358bab68a0fa33d0840bd9afe967dd809e61
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py)" = \
            0a636cf66de6ef79672429c0c944f13bb787eb04
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md)" = \
            202273260524e17568509824ccf2519f6c4ab217
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_v5.py)" = \
            bc1b7575e8a77d98b81252da39b6e2d3c10760d9
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-live-composition-native-candidate-v5.yml)" = \
            9a2999cf36c3665109632762317b1aa094baf921
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py)" = \
            3918e59fa7393824f2c98d129dfbead3d3867d99
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-live-composition-native-preentry-v3-source.yml)" = \
            43e791da6b7513bf945731f888f0590fc99c7773
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = \
            5021727f1def1ec11f870d735cab65acc1701a5e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" = \
            baab733e43c030d24f8d4abd1644f3c4ae55c3b2
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" = \
            14cbe81e27d04fee77cbe75225ce308bf8561a7b

          git diff --check "$candidate_head" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Re-run reconciled native source proof
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-source-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_native_preentry_v3_source.py |
            tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_NATIVE_PREENTRY_V3_SOURCE_PROOF_GREEN' \
            'v3_runner_source_blob_bound=true' \
            'native_first_instruction_preserved=true' \
            'runner_digest_policy_binding_preserved=true' \
            'node_digest_policy_binding_preserved=true' \
            'native_parent_retained_for_child_lifetime=true' \
            'preproof_hold_access_false=true' \
            'postfork_preproof_root_javascript_indeterminate=true' \
            'postfork_preproof_sensitive_access_false=true' \
            'postproof_hold_access_indeterminate=true' \
            'postproof_root_javascript_state_truthful=true' \
            'abnormal_child_receipt_truthful=true' \
            'candidate_accepted=false' \
            'install_authorized=false' \
            'live_execution_authorized=false' \
            'credential_content_access=false' \
            'transaction=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Rederive and verify exact V5 acceptance lock
        run: |
          set -euo pipefail
          proof=scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py
          out="$RUNNER_TEMP/epoch2-native-candidate-lock-v5.json"

          python3 -I -B "$proof" --self-test |
            tee "$RUNNER_TEMP/lock-proof.log"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_LOCK_V5_GREEN' \
            'lock_id=voidbuye2nativecandlock5_650ae9975eeb898279649e48115cdfec242052c0853b0ce5af19244d4d304126' \
            'candidate_report_sha256=327de6a4e56aa3a677f66ee04b5342d8923a19ab09d3e16ed3f82ef8cda2fcb2' \
            'candidate_report_git_blob_sha1=cb53a777b51c990b3f34223d20242c04a047f1bf' \
            'candidate_id=voidbuye2nativecand5_a377212ff699fb3463d2bfeecc61a16416a98ed5a291771c4a8a73aa003e6308' \
            'native_binary_sha256=85f9b772e27e1e74199188c838ca107c91cdbc6e08ac20c47e8988c258073de8' \
            'native_binary_bytes=726976' \
            'runner_sha256=f6a75184dcc63989328c351fc93e140e6dac103f682f5c58c9f76bccd359a889' \
            'runner_bytes=40616' \
            'candidate_workflow_bound=true' \
            'hosted_three_report_identity_bound=true' \
            'hosted_independent_rederivation_bound=true' \
            'candidate_accepted=true' \
            'native_binary_identity_accepted=true' \
            'runner_identity_accepted=true' \
            'protected_install_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'private_key_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'wc_void_market_activation_authorized=false' \
            'treasury_liquidity_action_authorized=false' \
            'funds_movement_authorized=false' \
            'production_host_evidence_authority=false' \
            'next_gate=void_buy_void_epoch2_live_composition_native_protected_install_v3'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/lock-proof.log"
          done

          python3 -I -B "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-native-candidate-lock-v5-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/epoch2-native-candidate-lock-v5.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check
