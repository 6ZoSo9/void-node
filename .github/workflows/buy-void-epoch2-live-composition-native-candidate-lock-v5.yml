name: Buy VOID Epoch-2 native candidate lock v5

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v5.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v5.yml"

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve accepted V5 lock on integrated generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = "5021727f1def1ec11f870d735cab65acc1701a5e"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json)" = "db59358bab68a0fa33d0840bd9afe967dd809e61"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v5.py)" = "0a636cf66de6ef79672429c0c944f13bb787eb04"
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v5.md)" = "202273260524e17568509824ccf2519f6c4ab217"
          python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path("ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json").read_text("utf-8"))
          assert value["schema"]=="void_buy_void_epoch2_live_composition_native_candidate_lock_v5"
          assert value["marker"]=="VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_LOCK_V5"
          assert value["version"]==5
          assert value["lock_id"]=="voidbuye2nativecandlock5_650ae9975eeb898279649e48115cdfec242052c0853b0ce5af19244d4d304126"
          assert value["next_gate"]=="void_buy_void_epoch2_live_composition_native_protected_install_v3"
          assert value["candidate_accepted"] is True
          assert value["native_binary_identity_accepted"] is True
          assert value["runner_identity_accepted"] is True
          for key in (
              "protected_install_authorized","live_execution_authorized",
              "credential_access_authorized","private_key_access_authorized",
              "signing_authorized","transaction_authorized",
              "payment_acceptance_authorized",
              "public_presale_activation_authorized",
              "wc_void_market_activation_authorized",
              "treasury_liquidity_action_authorized",
              "funds_movement_authorized",
              "production_host_evidence_authority",
          ):
              assert value[key] is False, key
          PY
          echo VOID_BUY_VOID_EPOCH2_NATIVE_CANDIDATE_LOCK_V5_ACCEPTED_EVIDENCE_PRESERVED
          echo lock_id=voidbuye2nativecandlock5_650ae9975eeb898279649e48115cdfec242052c0853b0ce5af19244d4d304126
          echo next_gate=void_buy_void_epoch2_live_composition_native_protected_install_v3
          echo protected_install_authorized=false
          echo live_execution_authorized=false
          echo funds_movement=false
      - run: git diff --check
