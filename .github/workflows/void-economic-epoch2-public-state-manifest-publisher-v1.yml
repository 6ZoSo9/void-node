name: VOID epoch2 public state manifest publisher v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-public-state-manifest-publisher-v1.yml"
      - "tools/void-economic-epoch2-public-state-manifest-publisher-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_state_manifest_publisher_v1.mjs"
      - "ops/mainnet0/economic-epoch2-client-neutral-state-manifest-evidence-v1.json"
      - "docs/operators/economic-epoch2-public-state-manifest-publisher-v1.md"
      - "docs/ren/journal/2026-09-27-epoch2-public-state-manifest-publisher-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove exact-manifest publisher wall
        run: node scripts/prove_void_economic_epoch2_public_state_manifest_publisher_v1.mjs

      - name: Diff hygiene
        run: git diff --check
