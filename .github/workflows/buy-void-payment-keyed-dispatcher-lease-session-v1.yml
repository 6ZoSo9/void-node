name: Buy VOID dispatcher lease session v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-lease-session-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_lease_session_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_lease_session_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-lease-session-v1.md"
      - "src/economic/buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-lease-session-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_lease_session_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_lease_session_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-lease-session-v1.md"
      - "src/economic/buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and prove lease-session ownership
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_lease_session_v1.ts | tee "$RUNNER_TEMP/lease-session-proof.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_DISPATCHER_LEASE_SESSION_V1_PROOF_GREEN' "$RUNNER_TEMP/lease-session-proof.log"
          grep -Fx 'cases=42' "$RUNNER_TEMP/lease-session-proof.log"
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_nonreplayable_postgres_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_v1.ts
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022 --types node --esModuleInterop --skipLibCheck scripts/prove_buy_void_payment_keyed_dispatcher_lease_session_v1.ts
          git diff --check
