name: buy-void-delivery-sign-broadcast-adapter-v1

on:
  push:
    paths:
      - "src/economic/buy_void_delivery_sign_broadcast_adapter_v1.ts"
      - "scripts/prove_buy_void_delivery_sign_broadcast_adapter_v1.ts"
      - "scripts/prove_buy_void_delivery_sign_broadcast_adapter_guard_v1.ts"
      - ".github/workflows/buy-void-delivery-sign-broadcast-adapter-v1.yml"
  pull_request:
    paths:
      - "src/economic/buy_void_delivery_sign_broadcast_adapter_v1.ts"
      - "scripts/prove_buy_void_delivery_sign_broadcast_adapter_v1.ts"
      - "scripts/prove_buy_void_delivery_sign_broadcast_adapter_guard_v1.ts"
      - ".github/workflows/buy-void-delivery-sign-broadcast-adapter-v1.yml"

permissions:
  contents: read

jobs:
  bounded-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused TypeScript
        run: >-
          npx tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022 --types node
          --esModuleInterop --allowSyntheticDefaultImports
          --downlevelIteration --skipLibCheck
          src/economic/buy_void_delivery_sign_broadcast_adapter_v1.ts
          scripts/prove_buy_void_delivery_sign_broadcast_adapter_v1.ts
          scripts/prove_buy_void_delivery_sign_broadcast_adapter_guard_v1.ts
      - run: npx tsx scripts/prove_buy_void_delivery_sign_broadcast_adapter_v1.ts
      - run: npx tsx scripts/prove_buy_void_delivery_sign_broadcast_adapter_guard_v1.ts
      - run: npm run build
