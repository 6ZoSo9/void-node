name: Buy VOID Epoch-2 native candidate lock v4

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v4.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v4.md"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v4.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v4.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v4.md"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v4.yml"

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve accepted V4 lock on exact V5 successor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = "5021727f1def1ec11f870d735cab65acc1701a5e"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json)" = "34340b5a8d13b7496bf5cafcf9d2937cb777d45c"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v4.py)" = "2710dc583209a815e11550cd5a2df482ab9fe311"
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v4.md)" = "eff04334ae6ecc7354004bc20d1544b0ab965f00"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json)" = "db59358bab68a0fa33d0840bd9afe967dd809e61"
          echo VOID_BUY_VOID_EPOCH2_NATIVE_CANDIDATE_LOCK_V4_HISTORICAL_PRESERVED
          echo v5_lock_successor_exact=true
          echo v4_lock_frozen=true
          echo protected_install_authorized=false
          echo live_execution_authorized=false
          echo funds_movement=false
      - run: git diff --check
