name: public-node-operator-self-check-response-bound-v1

on:
  pull_request:
    paths:
      - "tools/public-node-operator-self-check-v1.mjs"
      - "tools/public-node-operator-self-check-receipt-review-v1.mjs"
      - "tools/public-node-operator-evidence-pack-v1.mjs"
      - "tools/public-node-operator-evidence-pack-review-v1.mjs"
      - "scripts/prove_public_node_operator_self_check_response_bound_v1.mjs"
      - "scripts/prove_public_node_operator_admitted_body_deadline_v1.mjs"
      - "scripts/prove_public_node_operator_cli_numeric_controls_v1.mjs"
      - "scripts/prove_public_node_operator_transport_binding_v1.mjs"
      - "scripts/prove_public_node_operator_receipt_generation_authority_v1.mjs"
      - "scripts/prove_public_node_operator_evidence_pack_review_v1.ts"
      - "docs/public-node/public-node-operator-self-check-v1.md"
      - "docs/public-node/public-node-operator-self-check-receipt-review-v1.md"
      - "docs/public-node/public-node-operator-evidence-pack-review-v1.md"
      - ".github/workflows/public-node-operator-self-check-response-bound-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/public-node-operator-self-check-v1.mjs"
      - "tools/public-node-operator-self-check-receipt-review-v1.mjs"
      - "tools/public-node-operator-evidence-pack-v1.mjs"
      - "tools/public-node-operator-evidence-pack-review-v1.mjs"
      - "scripts/prove_public_node_operator_self_check_response_bound_v1.mjs"
      - "scripts/prove_public_node_operator_admitted_body_deadline_v1.mjs"
      - "scripts/prove_public_node_operator_cli_numeric_controls_v1.mjs"
      - "scripts/prove_public_node_operator_transport_binding_v1.mjs"
      - "scripts/prove_public_node_operator_receipt_generation_authority_v1.mjs"
      - "scripts/prove_public_node_operator_evidence_pack_review_v1.ts"
      - "docs/public-node/public-node-operator-self-check-v1.md"
      - "docs/public-node/public-node-operator-self-check-receipt-review-v1.md"
      - "docs/public-node/public-node-operator-evidence-pack-review-v1.md"
      - ".github/workflows/public-node-operator-self-check-response-bound-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check tools/public-node-operator-self-check-v1.mjs
          node --check tools/public-node-operator-self-check-receipt-review-v1.mjs
          node --check tools/public-node-operator-evidence-pack-v1.mjs
          node --check tools/public-node-operator-evidence-pack-review-v1.mjs
          node --check scripts/prove_public_node_operator_self_check_response_bound_v1.mjs
          node --check scripts/prove_public_node_operator_admitted_body_deadline_v1.mjs
          node --check scripts/prove_public_node_operator_cli_numeric_controls_v1.mjs
          node --check scripts/prove_public_node_operator_transport_binding_v1.mjs
          node --check scripts/prove_public_node_operator_receipt_generation_authority_v1.mjs
          node --check scripts/prove_public_node_operator_evidence_pack_review_v1.ts
      - name: Prove bounded operator self-check responses
        run: node scripts/prove_public_node_operator_self_check_response_bound_v1.mjs
      - name: Prove admitted body deadline ownership
        run: node scripts/prove_public_node_operator_admitted_body_deadline_v1.mjs
      - name: Prove strict operator CLI numeric controls
        run: node scripts/prove_public_node_operator_cli_numeric_controls_v1.mjs
      - name: Prove operator transport binding
        run: node scripts/prove_public_node_operator_transport_binding_v1.mjs
      - name: Prove receipt generation authority
        run: node scripts/prove_public_node_operator_receipt_generation_authority_v1.mjs
      - name: Prove canonical evidence-pack receipt-review replay
        run: node --experimental-strip-types scripts/prove_public_node_operator_evidence_pack_review_v1.ts
      - name: Diff hygiene
        run: git diff --check
