name: Buy VOID prepared-transaction chain2050 transport v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_native_chain2050_broadcaster_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts"
      - "scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts"
      - "scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_coordinator_v1.ts"
      - "docs/operators/buy-void-prepared-transaction-chain2050-transport-v1.md"
      - ".github/workflows/buy-void-prepared-transaction-chain2050-transport-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_native_chain2050_broadcaster_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts"
      - "scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts"
      - "scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_coordinator_v1.ts"
      - "docs/operators/buy-void-prepared-transaction-chain2050-transport-v1.md"
      - ".github/workflows/buy-void-prepared-transaction-chain2050-transport-v1.yml"

permissions:
  contents: read

concurrency:
  group: buy-void-prepared-transaction-chain2050-transport-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove private chain2050 transport
        run: |
          npx tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx tsx scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts
          npx tsx scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts
          npx tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
