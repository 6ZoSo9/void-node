name: VOID Buy VOID allocation custody host evidence v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_host_evidence_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-host-evidence-v1.md"
      - ".github/workflows/buy-void-allocation-custody-host-evidence-v1.yml"
      - "tools/void-buy-allocation-custody-service-v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-service-contract-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-custody-host-evidence-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: custody host evidence / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build canonical dependencies
        run: |
          npm run typecheck
          npm run build

      - name: Syntax-check host collector
        run: node --check tools/void-buy-allocation-custody-host-evidence-v1.mjs

      - name: Prove host-evidence contract
        run: node scripts/prove_void_buy_allocation_custody_host_evidence_v1.mjs

      - name: Preserve allocation custody service contract
        run: node scripts/prove_void_buy_allocation_custody_service_v1.mjs

      - name: Record qualification boundary
        run: |
          echo "host_evidence_current=true"
          echo "historical_custody_v1_not_reused_for_new_writer=true"
          echo "current_writer_requalification_required=true"
          echo "runtime_integration=false"
          echo "production_gate_ready=false"
          echo "funds_movement=false"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
