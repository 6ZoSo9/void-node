name: VOID Buy VOID enforcement artifact attestation v1

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/copy_void_runtime_js_v1.mjs'
      - 'scripts/retire_saveblock_periodic_rewriters_v1.mjs'
      - 'scripts/prove_buy_void_enforcement_*'
      - 'scripts/prove_buy_void_source_finality_execution_preflight_v1.ts'
      - 'docs/architecture/buy-void-enforcement-artifact-attestation-v1.*'
      - '.github/workflows/buy-void-enforcement-artifact-attestation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-enforcement-attestation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compiled:
    name: enforcement closure / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and prove exact locked enforcement closure
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node --import tsx scripts/prove_buy_void_source_finality_execution_preflight_v1.ts
          node scripts/prove_buy_void_enforcement_artifact_attestation_v1.mjs --derive > enforcement-candidate.json
          cmp enforcement-candidate.json docs/architecture/buy-void-enforcement-artifact-attestation-v1.json
          node scripts/prove_buy_void_enforcement_artifact_attestation_v1.mjs | tee enforcement-proof.log
          node scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v1.mjs
          python3 scripts/prove_buy_void_enforcement_image_identity_v1.py --self-test
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enforcement-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            enforcement-candidate.json
            enforcement-proof.log
          if-no-files-found: error
          retention-days: 7

  packaged:
    name: stopped image enforcement and content identity
    needs: compiled
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Build and extract an immutable stopped image
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
          # Build before installing host dependencies or writing evidence into context.
          docker build --iidfile "$RUNNER_TEMP/enforcement-image-id" \
            --label "org.opencontainers.image.revision=$EXPECTED_HEAD_SHA" .
          IMAGE_ID="$(cat "$RUNNER_TEMP/enforcement-image-id")"
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          CID="$(docker create "$IMAGE_ID")"
          cleanup() { docker rm "$CID" >/dev/null; }
          trap cleanup EXIT
          docker inspect "$CID" > "$RUNNER_TEMP/enforcement-container-before.json"
          mkdir -p "$RUNNER_TEMP/enforcement-root/dist"
          docker cp "$CID:/app/dist/economic" "$RUNNER_TEMP/enforcement-root/dist/economic"
          docker save --output "$RUNNER_TEMP/enforcement-image.tar" "$IMAGE_ID"
          docker inspect "$CID" > "$RUNNER_TEMP/enforcement-container-after.json"
          cmp "$RUNNER_TEMP/enforcement-container-before.json" "$RUNNER_TEMP/enforcement-container-after.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify enforcement bytes, historical preservation, and image identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm run build
          node scripts/prove_buy_void_enforcement_artifact_attestation_v1.mjs \
            --packaged-root "$RUNNER_TEMP/enforcement-root" | tee enforcement-package-proof.log
          node scripts/prove_buy_void_source_finality_packaged_compiled_artifact_attestation_v1.mjs \
            --packaged-root "$RUNNER_TEMP/enforcement-root" | tee historical-package-proof.log
          python3 scripts/prove_buy_void_enforcement_image_identity_v1.py \
            --archive "$RUNNER_TEMP/enforcement-image.tar" \
            --manifest docs/architecture/buy-void-enforcement-artifact-attestation-v1.json \
            --image-id "$(cat "$RUNNER_TEMP/enforcement-image-id")" \
            --container-inspect "$RUNNER_TEMP/enforcement-container-after.json" \
            --checkout-head "$EXPECTED_HEAD_SHA" | tee enforcement-image-identity.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enforcement-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            enforcement-package-proof.log
            historical-package-proof.log
            enforcement-image-identity.json
          if-no-files-found: error
          retention-days: 7
