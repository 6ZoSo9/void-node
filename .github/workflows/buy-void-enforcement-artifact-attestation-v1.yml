name: VOID Buy VOID historical enforcement V4 and V5 successor candidate

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/prove_buy_void_enforcement_*"
      - "scripts/prove_buy_void_source_finality_execution_preflight_v1.ts"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v4.json"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v5-candidate.md"
      - ".github/workflows/buy-void-enforcement-artifact-attestation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-enforcement-preservation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout and immutable historical enforcement V4
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object docs/architecture/buy-void-enforcement-artifact-attestation-v4.json)" =             "d9e391bb058132b83a4eeaec00797e41dab9fa26"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove descriptor and Git trust helpers
        run: |
          node scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node scripts/prove_buy_void_reviewed_git_invocation_v1.mjs --self-test

      - name: Build exact current artifacts
        run: npm run build

      - name: Verify reviewed node-util boundary without modifying frozen V1
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_enforcement_v1_util_boundary_v1.mjs


      - name: Preserve current V6 signer and broadcast HOLD
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_execution_preflight_v1.ts

      - name: Preserve historical V4 manifest as immutable predecessor
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v4=JSON.parse(fs.readFileSync(
            "docs/architecture/buy-void-enforcement-artifact-attestation-v4.json",
            "utf8",
          ));
          assert.equal(v4.marker,"VOID_BUY_VOID_ENFORCEMENT_ARTIFACT_ATTESTATION_V4");
          assert.equal(v4.version,4);
          assert.equal(
            v4.current_enforcement?.enforcement_artifact_set_sha256,
            "854fa637d25f0931c37d5d35fda641adb38ad1f55ca23b2662fb97d42a262a7b",
          );
          assert.equal(v4.production_source_finality_authority_ready,false);
          assert.equal(v4.deployed_artifact_generation_verified,false);
          console.log("HISTORICAL_ENFORCEMENT_V4_MANIFEST_IMMUTABLE=true");
          NODE

      - name: Derive current enforcement V5 candidate without acceptance
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs)" = "70292a0b283d8f06814f153105e27397f924c19d"
          node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --self-test
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --derive > enforcement-v5-candidate-${{ matrix.node }}.json 2> "$RUNNER_TEMP/historical-v5-error.log"; then
            echo 'HISTORICAL_V5_DERIVATION_FROM_UNCHANGED_SOURCE=true'
          else
            # Historical source derivation MUST refuse a changed E2 executable closure.
            grep -F '22a30e3ffad6047a472488104c769140bd050878 HEAD --' "$RUNNER_TEMP/historical-v5-error.log"
            grep -F 'deriveBuyVoidEnforcementArtifactAttestationV5Candidate' "$RUNNER_TEMP/historical-v5-error.log"
            test "$(git hash-object tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs)" = "55ff3d203daf4e62b417303041ddc6a8d60ffc34"
            node tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs > "$RUNNER_TEMP/epoch2-source-only.log"
            grep -Fx 'status=EPOCH2_SOURCE_TUPLE_REVIEWABLE_CREDENTIAL_AND_ACTIVATION_HOLD' "$RUNNER_TEMP/epoch2-source-only.log"
            grep -Fx 'historical_v1_authority_inherited=false' "$RUNNER_TEMP/epoch2-source-only.log"
            grep -Fx 'signer_control_or_systemd_credential_verified=false' "$RUNNER_TEMP/epoch2-source-only.log"
            grep -Fx 'production_payment_activation=false' "$RUNNER_TEMP/epoch2-source-only.log"
            grep -Fx 'source_qualification_complete=true' "$RUNNER_TEMP/epoch2-source-only.log"
            touch "$RUNNER_TEMP/epoch2-historical-enforcement-refusal"
            echo 'HISTORICAL_V5_CANDIDATE_REFUSED_E2_SOURCE=true'
          fi
          if test ! -f "$RUNNER_TEMP/epoch2-historical-enforcement-refusal"; then
          node --input-type=module - <<'NODE' "enforcement-v5-candidate-${{ matrix.node }}.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.schema,"void_buy_void_enforcement_artifact_v5_candidate");
          assert.equal(j.version,5);
          // Exact current V6 runtime-source candidate parent, not the
          // immutable historical enforcement-V4 provenance label.
          assert.equal(j.source_runtime_parent,"22a30e3ffad6047a472488104c769140bd050878");
          assert.equal(
            j.predecessor?.historical_v4_manifest_git_blob_sha1,
            "d9e391bb058132b83a4eeaec00797e41dab9fa26",
          );
          for(const key of [
            "candidate_identity_accepted",
            "dynamic_tool_execution_identity_verified",
            "dynamic_tool_transitive_closure_verified",
            "complete_executable_closure_verified",
            "deployed_artifact_generation_verified",
            "runtime_mount_authority",
            "production_source_finality_authority_ready",
            "presale_activation",
            "funds_movement",
          ]) assert.equal(j[key],false,key);
          console.log("CURRENT_ENFORCEMENT_V5_CANDIDATE_HOLD_GREEN=true");
          NODE
          fi

      - name: Derive current dynamic-tool source census without execution authority
        run: |
          node scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs --self-test
          test "$(git hash-object scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs)" = "368ade74f36acad899420db5cf994363d6dfa04a"
          if test -f "$RUNNER_TEMP/epoch2-historical-enforcement-refusal"; then
            # E2 may alter the V5 closure while leaving the older dynamic-tool
            # subset itself unchanged. Preserve either exact historic result.
            if node scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs --derive > "$RUNNER_TEMP/legacy-dynamic-tools.json" 2> "$RUNNER_TEMP/legacy-dynamic-error.log"; then
              node --input-type=module - <<'NODE' "$RUNNER_TEMP/legacy-dynamic-tools.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          assert.equal(j.source_target_files_git_blobs_verified, true);
          assert.equal(j.executed_target_verified, false);
          assert.equal(j.dynamic_tool_transitive_closure_verified, false);
          assert.equal(j.complete_executable_closure_verified, false);
          assert.equal(j.candidate_identity_accepted, false);
          assert.equal(j.production_source_finality_authority_ready, false);
          console.log("HISTORICAL_DYNAMIC_SUBSET_UNCHANGED_E2_ACTIVE_CLOSURE_UNQUALIFIED=true");
          NODE
            else
              grep -F '32f40899d6b71561bf4bf3a917e51c431cb867de HEAD --' "$RUNNER_TEMP/legacy-dynamic-error.log"
              echo 'HISTORICAL_DYNAMIC_TOOL_CANDIDATE_REFUSED_E2_SOURCE=true'
            fi
          else
            node scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs --derive > dynamic-tools-${{ matrix.node }}.json
          fi
          if test ! -f "$RUNNER_TEMP/epoch2-historical-enforcement-refusal"; then
          node --input-type=module - <<'NODE' "dynamic-tools-${{ matrix.node }}.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.source_target_files_git_blobs_verified,true);
          assert.equal(j.executed_target_verified,false);
          assert.equal(j.dynamic_tool_transitive_closure_verified,false);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.candidate_identity_accepted,false);
          assert.equal(j.deployed_artifact_generation_verified,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          console.log("CURRENT_DYNAMIC_TOOL_SOURCE_CENSUS_HOLD_GREEN=true");
          NODE
          fi

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
