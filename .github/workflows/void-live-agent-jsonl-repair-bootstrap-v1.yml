name: VOID live agent JSONL repair bootstrap v1

on:
  push:
    branches:
      - fix/live-agent-jsonl-runtime-wedge-v1-20260816

permissions:
  contents: write

jobs:
  publish-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Apply exact current-main repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path("src/index.ts")
          text = source.read_text()
          expected_blob = "7ab484fd21aae9e259fe4d9733b35216b9e12ea3"
          observed_blob = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
          if observed_blob != expected_blob:
              raise SystemExit(f"unexpected src/index.ts blob before repair: {observed_blob}")

          lines = text.splitlines(keepends=True)
          lo, hi = 24899, 27150
          region = "".join(lines[lo:hi])
          buggy_split = '.split("\\\\n")'
          fixed_split = '.split("\\n")'
          buggy_join = '.join("\\\\n")'
          fixed_join = '.join("\\n")'
          split_count = region.count(buggy_split)
          join_count = region.count(buggy_join)
          if split_count != 23:
              raise SystemExit(f"expected 23 legacy agent JSONL split defects, got {split_count}")
          if join_count != 10:
              raise SystemExit(f"expected 10 legacy agent JSONL join defects, got {join_count}")

          for i in range(lo, min(hi, len(lines))):
              lines[i] = lines[i].replace(buggy_split, fixed_split).replace(buggy_join, fixed_join)
          text = "".join(lines)

          unsafe_header = 'const n = Number((await selfJson(`/blocks/latest/number2.json`)).number);'
          safe_header = 'const n = Number((await selfJson(`/blocks/latest/number2.json`))?.number);'
          if text.count(unsafe_header) != 1:
              raise SystemExit("expected exactly one null-unsafe Header3 latest-number read")
          text = text.replace(unsafe_header, safe_header, 1)
          source.write_text(text)

          repaired = source.read_text()
          repaired_region = "".join(repaired.splitlines(keepends=True)[lo:hi])
          if buggy_split in repaired_region or buggy_join in repaired_region:
              raise SystemExit("legacy agent JSONL escaped-newline delimiter remains")
          if repaired_region.count(fixed_split) < 23:
              raise SystemExit("expected at least 23 real-newline JSONL splits after repair")
          if repaired_region.count(fixed_join) < 10:
              raise SystemExit("expected at least 10 real-newline JSONL joins after repair")
          if safe_header not in repaired:
              raise SystemExit("Header3 null-safe suppression compatibility missing")

          new_blob = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
          if new_blob == expected_blob:
              raise SystemExit("src/index.ts blob did not change")

          grep = subprocess.run(
              ["git", "grep", "-l", expected_blob, "--", "."],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE
          )
          pin_paths = [p for p in grep.stdout.splitlines() if p and p != "src/index.ts"]
          if not pin_paths:
              raise SystemExit("canonical src/index.ts provenance pin not found")
          for rel in pin_paths:
              p = Path(rel)
              data = p.read_text()
              if expected_blob not in data:
                  continue
              p.write_text(data.replace(expected_blob, new_blob))
          print(f"old_index_blob={expected_blob}")
          print(f"new_index_blob={new_blob}")
          print("updated_pin_paths=" + ",".join(pin_paths))
          PY

          cat > scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs <<'EOF'
          import fs from "node:fs";
          import assert from "node:assert/strict";

          const source = fs.readFileSync("src/index.ts", "utf8");
          const lines = source.split("\n");
          const agentRegion = lines.slice(24899, 27150).join("\n");
          const buggySplit = '.split("\\\\n")';
          const fixedSplit = '.split("\\n")';
          const buggyJoin = '.join("\\\\n")';
          const fixedJoin = '.join("\\n")';

          assert.equal(agentRegion.includes(buggySplit), false, "literal backslash-n JSONL split remains in live agent job family");
          assert.equal(agentRegion.includes(buggyJoin), false, "literal backslash-n JSONL join remains in live agent job family");
          assert.ok(agentRegion.split(fixedSplit).length - 1 >= 23, "expected repaired newline JSONL readers");
          assert.ok(agentRegion.split(fixedJoin).length - 1 >= 10, "expected repaired newline JSONL writers/metrics joins");

          const unsafeHeader = 'const n = Number((await selfJson(`/blocks/latest/number2.json`)).number);';
          const safeHeader = 'const n = Number((await selfJson(`/blocks/latest/number2.json`))?.number);';
          assert.equal(source.includes(unsafeHeader), false, "Header3 poller still dereferences synthetic null response");
          assert.equal(source.includes(safeHeader), true, "Header3 poller null-safe boundary missing");

          const raw = [
            JSON.stringify({ id: "job-a", status: "queued" }),
            JSON.stringify({ id: "job-b", status: "queued" }),
            JSON.stringify({ id: "job-c", status: "queued" }),
          ].join("\n") + "\n";
          const parsed = raw.split("\n").filter((line) => line.trim()).map((line) => JSON.parse(line));
          assert.deepEqual(parsed.map((x) => x.id), ["job-a", "job-b", "job-c"]);
          assert.throws(() => JSON.parse(raw), /JSON|Unexpected|non-whitespace/i, "whole-file JSON parse must remain invalid for multi-record JSONL");

          console.log("VOID_LIVE_AGENT_JSONL_RUNTIME_WEDGE_V1_PROOF_GREEN");
          console.log("agent_jsonl_real_newline_split=true");
          console.log("agent_jsonl_real_newline_join=true");
          console.log("multi_record_jsonl_parse=true");
          console.log("header3_synthetic_null_safe=true");
          console.log("runtime_mutation_performed=false");
          EOF

          cat > .github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml <<'EOF'
          name: VOID Live Agent JSONL Runtime Wedge v1

          on:
            pull_request:
              paths:
                - "src/index.ts"
                - "runtime/canonical-producer-self-http-guard-v1.cjs"
                - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
                - "scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs"
                - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
            push:
              branches:
                - main
              paths:
                - "src/index.ts"
                - "runtime/canonical-producer-self-http-guard-v1.cjs"
                - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
                - "scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs"
                - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"

          permissions:
            contents: read

          jobs:
            node22:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
                - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
                  with:
                    node-version: 22
                - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
                - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
            node24:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
                - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
                  with:
                    node-version: 24
                - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
                - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
                - run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..HEAD
            node26:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
                - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
                  with:
                    node-version: 26
                - run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
                - run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
          EOF

          rm .github/workflows/void-live-agent-jsonl-repair-bootstrap-v1.yml

      - name: Install repository dependencies
        run: npm ci
      - name: Focused live-wedge proof
        run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
      - name: Canonical legacy observer provenance proof
        run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
      - name: Repository typecheck
        run: npm run typecheck
      - name: Repository build
        run: npm run build
      - name: Publish bounded repair commit
        run: |
          git config user.name "void-coordination-bot"
          git config user.email "44710859+6ZoSo9@users.noreply.github.com"
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -ge 4
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m "fix(runtime): repair live agent JSONL reader wedge"
          git push origin HEAD:fix/live-agent-jsonl-runtime-wedge-v1-20260816
