name: VOID public bootstrap stable-seed qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-bootstrap-stable-seed-qualification-v1.yml"
      - "docs/public/public-bootstrap-stable-seed-qualification-v1.md"
      - "scripts/lib/void_public_seed_qualification_v1.mjs"
      - "scripts/lib/void_public_seed_common_v1.mjs"
      - "scripts/lib/void_public_seed_probe_v1.mjs"
      - "scripts/lib/void_public_seed_receipt_v1.mjs"
      - "scripts/qualify_void_public_seed_v1.mjs"
      - "scripts/build_void_public_bootstrap_manifest_v1.mjs"
      - "scripts/prove_void_public_seed_qualification_v1.mjs"
      - "scripts/prove_void_public_seed_pinned_lookup_node_compat_v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-bootstrap-stable-seed-qualification-v1.yml"
      - "docs/public/public-bootstrap-stable-seed-qualification-v1.md"
      - "scripts/lib/void_public_seed_qualification_v1.mjs"
      - "scripts/lib/void_public_seed_common_v1.mjs"
      - "scripts/lib/void_public_seed_probe_v1.mjs"
      - "scripts/lib/void_public_seed_receipt_v1.mjs"
      - "scripts/qualify_void_public_seed_v1.mjs"
      - "scripts/build_void_public_bootstrap_manifest_v1.mjs"
      - "scripts/prove_void_public_seed_qualification_v1.mjs"
      - "scripts/prove_void_public_seed_pinned_lookup_node_compat_v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-public-bootstrap-stable-seed-qualification-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-lookup-node-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Prove pinned hostname lookup compatibility
        run: |
          node --check scripts/lib/void_public_seed_qualification_v1.mjs
          node --check scripts/prove_void_public_seed_pinned_lookup_node_compat_v1.mjs
          node scripts/prove_void_public_seed_pinned_lookup_node_compat_v1.mjs

  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check qualification tools
        run: |
          node --check scripts/lib/void_public_seed_qualification_v1.mjs
          node --check scripts/lib/void_public_seed_common_v1.mjs
          node --check scripts/lib/void_public_seed_probe_v1.mjs
          node --check scripts/lib/void_public_seed_receipt_v1.mjs
          node --check scripts/qualify_void_public_seed_v1.mjs
          node --check scripts/build_void_public_bootstrap_manifest_v1.mjs
          node --check scripts/prove_void_public_seed_qualification_v1.mjs
          node --check scripts/prove_void_public_seed_pinned_lookup_node_compat_v1.mjs
          node --check tools/void-public-seed-gateway-v1.mjs

      - name: Prove stable-seed qualification and publication boundary
        run: node scripts/prove_void_public_seed_qualification_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
