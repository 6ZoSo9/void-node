name: VOID shared market post-discovery state v2

on:
  pull_request:
    paths:
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "scripts/prove_void_shared_market_post_discovery_state_v2.mjs"
      - "docs/architecture/void-shared-market-post-discovery-state-v2.md"
      - "docs/architecture/void-shared-market-post-discovery-state-v1.md"
      - "docs/operators/wc-void-coupled-opening-v1.md"
      - "ops/mainnet/CURRENT_TRUTH.md"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "docs/ren/current-state-v1.md"
      - "docs/ren/journal/2026-09-27-shared-market-reconciliation-v2.md"
      - ".github/workflows/void-shared-market-post-discovery-state-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-shared-market-post-discovery-state-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove shared market V2 reconciliation
        run: node scripts/prove_void_shared_market_post_discovery_state_v2.mjs

      - name: Preserve historical V1 proof
        run: node scripts/prove_void_shared_market_post_discovery_state_v1.mjs

      - name: Prove coupled successor remains fail closed
        run: node scripts/prove_void_coupled_economic_successor_gate_v1.mjs

      - name: Diff hygiene
        run: git diff --check
