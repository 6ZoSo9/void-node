name: VOID participant postpurchase at-use revalidation v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-participant-postpurchase-at-use-revalidation-v1.yml"
      - "docs/operators/participant-postpurchase-at-use-revalidation-v1.md"
      - "scripts/prove_void_participant_postpurchase_at_use_revalidation_v1.mjs"
      - "tools/void-participant-postpurchase-at-use-revalidation-v1.mjs"
      - "tools/void-participant-postpurchase-production-runtime-binding-v1.mjs"
      - "tools/void-participant-postpurchase-finality-import-v1.mjs"
      - "tools/void-participant-postpurchase-finality-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-participant-postpurchase-at-use-revalidation-v1.yml"
      - "docs/operators/participant-postpurchase-at-use-revalidation-v1.md"
      - "scripts/prove_void_participant_postpurchase_at_use_revalidation_v1.mjs"
      - "tools/void-participant-postpurchase-at-use-revalidation-v1.mjs"
      - "tools/void-participant-postpurchase-production-runtime-binding-v1.mjs"
      - "tools/void-participant-postpurchase-finality-import-v1.mjs"
      - "tools/void-participant-postpurchase-finality-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-participant-postpurchase-at-use-revalidation-v1.mjs
          node --check scripts/prove_void_participant_postpurchase_at_use_revalidation_v1.mjs
      - name: Prove participant-control at-use freshness
        run: node scripts/prove_void_participant_postpurchase_at_use_revalidation_v1.mjs
      - name: Existing participant runtime-binding regressions
        run: |
          node scripts/prove_void_participant_postpurchase_production_runtime_binding_v1.mjs
          node scripts/prove_void_participant_postpurchase_finality_import_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
