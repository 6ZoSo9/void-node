name: VOID P2P UDP swarm Node recovery newer-session guard v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-p2p-udp-swarm-node-post-retirement-recovery-newer-session-guard-v1.yml'
      - 'scripts/patch_void_p2p_udp_swarm_node_post_retirement_recovery_newer_session_guard_v1.py'

permissions:
  contents: write

concurrency:
  group: void-p2p-udp-swarm-node-post-retirement-recovery-newer-session-guard-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.head.repo.full_name == '6ZoSo9/void-node' &&
      github.event.pull_request.head.ref == 'feat/p2p-udp-swarm-node-post-retirement-recovery-mount-v1-20260809' &&
      github.event.pull_request.base.ref == 'feat/p2p-udp-swarm-post-retirement-recovery-policy-v1-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact hardening head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply deterministic newer-session guard patch
        run: python3 scripts/patch_void_p2p_udp_swarm_node_post_retirement_recovery_newer_session_guard_v1.py

      - name: Prove Node post-retirement recovery mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts

      - name: Re-prove post-retirement recovery policy
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_post_retirement_recovery_policy_v1.ts

      - name: Re-prove Node relay retirement mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_relay_retirement_mount_v1.ts

      - name: Re-prove relay retirement executor
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_relay_retirement_executor_v1.ts

      - name: Re-prove Node direct-route health mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_direct_route_health_mount_v1.ts

      - name: Re-prove Node candidate promotion
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Verify exact semantic patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            'scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts' \
            'src/node_core.ts' > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit proven semantic hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts \
            src/node_core.ts
          git diff --cached --check
          printf '%s\n' \
            'scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts' \
            'src/node_core.ts' > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git commit -m "fix: suppress stale UDP recovery for newer sessions"

      - name: Guard live branch then fast-forward publish
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_OLD="${{ github.event.pull_request.head.sha }}"
          LIVE="$(git ls-remote origin refs/heads/${{ github.event.pull_request.head.ref }} | awk '{print $1}')"
          test "$LIVE" = "$EXPECTED_OLD"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
