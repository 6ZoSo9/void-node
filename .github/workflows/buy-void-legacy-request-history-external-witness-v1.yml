name: VOID Buy legacy history external witness v1

on:
  pull_request:
    paths:
      - "tools/void-buy-legacy-request-history-external-witness-v1.mjs"
      - "scripts/prove_void_buy_legacy_request_history_external_witness_v1.mjs"
      - "docs/operators/buy-void-legacy-request-history-external-witness-v1.md"
      - ".github/workflows/buy-void-legacy-request-history-external-witness-v1.yml"
      - "tools/void-buy-legacy-request-history-sovereign-authorization-v1.mjs"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-legacy-request-history-external-witness-v1.mjs"
      - "scripts/prove_void_buy_legacy_request_history_external_witness_v1.mjs"
      - "docs/operators/buy-void-legacy-request-history-external-witness-v1.md"
      - ".github/workflows/buy-void-legacy-request-history-external-witness-v1.yml"
      - "tools/void-buy-legacy-request-history-sovereign-authorization-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and prove witness journal contract
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node --check tools/void-buy-legacy-request-history-external-witness-v1.mjs
          node --check scripts/prove_void_buy_legacy_request_history_external_witness_v1.mjs
          node scripts/prove_void_buy_legacy_request_history_external_witness_v1.mjs |
            tee "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'VOID_BUY_VOID_LEGACY_HISTORY_EXTERNAL_WITNESS_V1_PROOF_GREEN' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'signed_authorization_reverified_before_plan=true' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'external_transport_authenticated=false' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'external_witness_verified=false' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'historical_request_history_disposition_accepted=false' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'stable_root_apply_authorized=false' "$RUNNER_TEMP/legacy-history-witness.txt"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/legacy-history-witness.txt"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
