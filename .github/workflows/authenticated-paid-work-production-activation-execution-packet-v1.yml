name: Authenticated paid-work activation execution packet v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-production-activation-execution-packet-v1.yml"
      - "config/activation-candidates/authenticated-paid-work-production-activation-execution-packet-v1.json"
      - "docs/operations/authenticated-paid-work-production-activation-execution-packet-v1.md"
      - "scripts/prove_authenticated_paid_work_production_activation_execution_packet_v1.mjs"
      - ".github/workflows/authenticated-paid-work-fresh-direct-quote-authentication-preparation-v1.yml"
      - "docs/operations/authenticated-paid-work-fresh-direct-quote-authentication-preparation-v1.md"
      - "examples/authenticated-paid-work-fresh-direct-quote-authentication-preparation-v1.example.json"
      - "schemas/authenticated-paid-work-fresh-direct-quote-authentication-preparation-v1.schema.json"
      - "scripts/authenticated_paid_work_fresh_direct_quote_authentication_preparation_v1.ts"
      - "scripts/prove_authenticated_paid_work_fresh_direct_quote_authentication_preparation_v1.ts"
      - "scripts/authenticated_paid_work_quote_acceptance_payment_authority_activation_persistence_v1.ts"
      - "ops/mainnet0/authenticated-paid-work-production-activation-live-canary-scope-v1.json"
      - "ops/mainnet0/authenticated-paid-work-production-activation-execution-confirmation-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-production-activation-execution-packet-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Parse packet
        run: python3 -m json.tool config/activation-candidates/authenticated-paid-work-production-activation-execution-packet-v1.json >/dev/null
      - name: Prove fresh direct authentication preparation
        run: npx tsx scripts/prove_authenticated_paid_work_fresh_direct_quote_authentication_preparation_v1.ts
      - name: Check packet proof syntax
        run: node --check scripts/prove_authenticated_paid_work_production_activation_execution_packet_v1.mjs
      - name: Prove execution packet
        run: node scripts/prove_authenticated_paid_work_production_activation_execution_packet_v1.mjs
