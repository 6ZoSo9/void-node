name: Apollyon live custody dormant qualification v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_live_custody_dormant_qualification_v1.py"
      - "scripts/prove_apollyon_live_custody_dormant_qualification_v1.py"
      - "docs/security/apollyon-live-custody-dormant-qualification-v1.md"
      - ".github/workflows/apollyon-live-custody-dormant-qualification-v1.yml"
      - "ops/xiphos/apollyon_custody_stale_socket_cleanup_v1.py"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.service"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_live_custody_dormant_qualification_v1.py"
      - "scripts/prove_apollyon_live_custody_dormant_qualification_v1.py"
      - "docs/security/apollyon-live-custody-dormant-qualification-v1.md"
      - ".github/workflows/apollyon-live-custody-dormant-qualification-v1.yml"
      - "ops/xiphos/apollyon_custody_stale_socket_cleanup_v1.py"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.service"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove dormant qualification boundary
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_live_custody_dormant_qualification_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              BASE="$PR_BASE"
              ;;
            push)
              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"
              BASE="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              BASE="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
