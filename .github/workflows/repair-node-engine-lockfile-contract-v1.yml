name: Repair node engine lockfile contract v1

on:
  push:
    branches:
      - fix/node-engine-lockfile-contract-v1
    paths:
      - .github/workflows/repair-node-engine-lockfile-contract-v1.yml

permissions:
  contents: write

concurrency:
  group: repair-node-engine-lockfile-contract-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Reconstruct the exact two-file repair
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE='e21911deb769b4537c9aa842ad8c8de37e9c1ebc'
          WORKFLOW='.github/workflows/repair-node-engine-lockfile-contract-v1.yml'

          python3 - "$BASE" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          base = sys.argv[1]

          def from_base(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{base}:{path}"])

          def replace_once(data: bytes, old: bytes, new: bytes, label: str) -> bytes:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"HOLD: {label} expected one match, found {count}")
              return data.replace(old, new, 1)

          lock_path = Path("package-lock.json")
          lock = from_base(str(lock_path))
          lock = replace_once(
              lock,
              b'        "node": ">=22 <23"\n',
              b'        "node": "^22.0.0 || ^24.0.0 || ^26.0.0"\n',
              "root lockfile engine",
          )
          lock_path.write_bytes(lock)

          proof_path = Path("scripts/prove_node22_repository_contract_v1.mjs")
          proof = from_base(str(proof_path))
          proof = replace_once(
              proof,
              b'const rootPackage = readJson("package.json");\nconst sourcePackage = readJson("src/package.json");',
              b'const rootPackage = readJson("package.json");\nconst rootLock = readJson("package-lock.json");\nconst sourcePackage = readJson("src/package.json");',
              "root lockfile read",
          )
          proof = replace_once(
              proof,
              b'assert.equal(rootPackage.engines?.node, EXPECTED_ENGINE);\nassert.equal(sourcePackage.engines?.node, EXPECTED_ENGINE);',
              b'assert.equal(rootPackage.engines?.node, EXPECTED_ENGINE);\nassert.equal(rootLock.packages?.[""]?.engines?.node, EXPECTED_ENGINE);\nassert.equal(sourcePackage.engines?.node, EXPECTED_ENGINE);',
              "root lockfile assertion",
          )
          proof = replace_once(
              proof,
              b'      expected_engine: EXPECTED_ENGINE,\n      supported_node_majors: SUPPORTED_MAJORS,',
              b'      expected_engine: EXPECTED_ENGINE,\n      root_lockfile_engine: rootLock.packages?.[""]?.engines?.node,\n      supported_node_majors: SUPPORTED_MAJORS,',
              "root lockfile proof output",
          )
          proof_path.write_bytes(proof)
          PY

          rm -- "$WORKFLOW"

          python3 -m json.tool package-lock.json >/dev/null
          node --check scripts/prove_node22_repository_contract_v1.mjs
          node scripts/prove_node22_repository_contract_v1.mjs > /tmp/node-engine-lockfile-proof.json
          grep -F 'VOID_NODE_COMPATIBILITY_REPOSITORY_CONTRACT_V2' /tmp/node-engine-lockfile-proof.json
          grep -F '"root_lockfile_engine": "^22.0.0 || ^24.0.0 || ^26.0.0"' /tmp/node-engine-lockfile-proof.json

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck

          ACTUAL_FILES="$(git diff --name-only "$BASE" -- | LC_ALL=C sort)"
          EXPECTED_FILES="$(printf '%s\n' \
            package-lock.json \
            scripts/prove_node22_repository_contract_v1.mjs | LC_ALL=C sort)"
          test "$ACTUAL_FILES" = "$EXPECTED_FILES" || {
            printf 'HOLD: unexpected final file scope\n%s\n' "$ACTUAL_FILES" >&2
            exit 1
          }

          ACTUAL_NUMSTAT="$(git diff --numstat "$BASE" --)"
          EXPECTED_NUMSTAT="$(printf '1\t1\tpackage-lock.json\n3\t0\tscripts/prove_node22_repository_contract_v1.mjs')"
          test "$ACTUAL_NUMSTAT" = "$EXPECTED_NUMSTAT" || {
            printf 'HOLD: unexpected final diff size\n%s\n' "$ACTUAL_NUMSTAT" >&2
            exit 1
          }

          git diff --check "$BASE" --
          git status --short

      - name: Commit the exact repaired branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce root lockfile Node engine contract v1'
          git push origin HEAD:fix/node-engine-lockfile-contract-v1
