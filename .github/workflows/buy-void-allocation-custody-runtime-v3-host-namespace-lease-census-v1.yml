name: VOID Buy custody runtime V3 host namespace lease census v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-host-namespace-lease-census-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-host-namespace-lease-census-v1.yml"
      - "ops/precision/void_economic_sponsored_runtime_storage_designated_host_plan_v3.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact namespace-lease successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="836f5e704a603f67b77b2406aeec9174f640497e"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-host-namespace-lease-census-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-host-namespace-lease-census-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py)" = \
            "ce6e416f5cccd79d421e9404f6f4fa12a416fc6a"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py)" = \
            "ba1830589bc236b12ce3b8ac6711f7ef0c1ea0fe"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-host-namespace-lease-census-v1.md)" = \
            "ffd3a1d93898a9e6dd420638972f1f3ce70d4486"
          test "$(git rev-parse HEAD:ops/precision/void_economic_sponsored_runtime_storage_designated_host_plan_v3.py)" = \
            "4234379cb7e283e03c654e10d0d7fe8986e99897"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py

      - name: Self-test without host lease collection
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-nslease-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py \
            --self-test | tee "$out"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_HOST_NAMESPACE_LEASE_CENSUS_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'designated_host_policy_exact=true' \
            'precision_hostname_bound=true' \
            'precision_operator_uid_bound=true' \
            'precision_machine_id_sha256_bound=true' \
            'pid1_pid_namespace_equality_required=true' \
            'pid1_mount_namespace_equality_required=true' \
            'procfs_type_required=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'proc_mount_contract_revalidated=true' \
            'boot_id_same_boot_binding=true' \
            'descriptor_relative_bounded_reader_tested=true' \
            'python_no_bytecode_mode_required=true' \
            'production_filesystem_write=false' \
            'self_test_temporary_filesystem_write=true' \
            'namespace_lease_is_install_authority=false' \
            'namespace_values_candidate_only=true' \
            'host_initial_namespace_authority_proven=false' \
            'namespace_lease_external_review_completed=false' \
            'automatic_process_census_feed_authorized=false' \
            'process_census_consumption_authorized=false' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/custody-nslease-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_host_namespace_lease_census_v1.py \
            | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_HOST_NAMESPACE_LEASE_CENSUS_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'designated_host_policy_exact=true' \
            'precision_hostname_bound=true' \
            'precision_operator_uid_bound=true' \
            'precision_machine_id_sha256_bound=true' \
            'pid1_pid_namespace_equality_required=true' \
            'pid1_mount_namespace_equality_required=true' \
            'procfs_type_required=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'proc_mount_contract_revalidated=true' \
            'boot_id_same_boot_binding=true' \
            'descriptor_relative_bounded_reader_tested=true' \
            'python_no_bytecode_mode_required=true' \
            'without_dash_b_bootstrap_hold=true' \
            'host_collection_not_executed_in_ci=true' \
            'production_filesystem_write=false' \
            'test_fixture_filesystem_write=true' \
            'namespace_lease_is_install_authority=false' \
            'namespace_values_candidate_only=true' \
            'host_initial_namespace_authority_proven=false' \
            'namespace_lease_external_review_completed=false' \
            'automatic_process_census_feed_authorized=false' \
            'process_census_consumption_authorized=false' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
