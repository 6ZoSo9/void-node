name: VOID Buy VOID operator local intent v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-operator-local-intent-v1.yml"
      - "src/index.ts"
      - "src/economic/buy_void_operator_local_intent_v1.ts"
      - "src/economic/buy_void_request_tx_hash_binding_v1.ts"
      - "scripts/prove_buy_void_operator_local_intent_v1.ts"
      - "scripts/prove_buy_void_request_tx_hash_binding_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-operator-local-intent-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: operator local intent / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Prove operator local intent boundary
        run: npx tsx scripts/prove_buy_void_operator_local_intent_v1.ts

      - name: Prove tx-hash mutation wiring
        run: npx tsx scripts/prove_buy_void_request_tx_hash_binding_v1.ts

      - name: Build exact source
        run: npm run build

      - name: Verify source tree cleanliness
        run: test -z "$(git status --porcelain=v1)"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
