name: DataNet field-object pull bounds v1

on:
  pull_request:
    paths:
      - "tools/datanet-field-object-pull-v1.mjs"
      - "scripts/prove_datanet_field_object_pull_bounds_v1.mjs"
      - "docs/public/datanet-field-object-pull-bounds-v1.md"
      - ".github/workflows/datanet-field-object-pull-bounds-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/datanet-field-object-pull-v1.mjs"
      - "scripts/prove_datanet_field_object_pull_bounds_v1.mjs"
      - "docs/public/datanet-field-object-pull-bounds-v1.md"
      - ".github/workflows/datanet-field-object-pull-bounds-v1.yml"

permissions:
  contents: read

concurrency:
  group: datanet-field-object-pull-bounds-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Check source and proof syntax
        run: |
          node --check tools/datanet-field-object-pull-v1.mjs
          node --check scripts/prove_datanet_field_object_pull_bounds_v1.mjs
      - name: Prove bounded transport and output authority
        run: node scripts/prove_datanet_field_object_pull_bounds_v1.mjs
      - name: Diff hygiene
        run: git diff --check
