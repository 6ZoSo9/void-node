name: DataNet H1 admitted S0 S1 exec publication v1

on:
  pull_request:
    paths:
      - "fixtures/datanet-h1-s0-s1-publication-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/prove_datanet_h1_s0_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admitted_s0_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admitted_s0_s1_exec_publication_v1.py"
      - "docs/datanet-h1-admitted-s0-s1-exec-publication-v1.md"
      - ".github/workflows/datanet-h1-admitted-s0-s1-exec-publication-v1.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/datanet-h1-s0-s1-publication-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/prove_datanet_h1_s0_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admitted_s0_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admitted_s0_s1_exec_publication_v1.py"
      - "docs/datanet-h1-admitted-s0-s1-exec-publication-v1.md"
      - ".github/workflows/datanet-h1-admitted-s0-s1-exec-publication-v1.yml"

permissions:
  contents: read

concurrency:
  group: datanet-h1-admitted-s0-s1-exec-publication-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Assert exact head and source syntax
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -x /usr/bin/fallocate
          test -x /usr/bin/ln
          test -x /usr/sbin/mkfs.ext4
          node --version
          node --check scripts/prove_datanet_h1_admitted_s0_s1_publication_ext4_v1.mjs
          python3 -I -B - <<'PY'
          import ast
          from pathlib import Path
          for p in [
              Path('scripts/prove_datanet_posix_admission_capability_v1.py'),
              Path('scripts/prove_datanet_h1_admitted_s0_s1_exec_publication_v1.py'),
          ]:
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
      - name: Prove exec-preserved admission with S0 S1 and S2 rejection
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/void-datanet-admitted-s0-s1-node-${{ matrix.node }}.ext4"
          mountpoint="$RUNNER_TEMP/void-datanet-admitted-s0-s1-node-${{ matrix.node }}-mnt"
          stdout_log="$RUNNER_TEMP/datanet-admitted-s0-s1-v1-node-${{ matrix.node }}.stdout.log"
          stderr_log="$RUNNER_TEMP/datanet-admitted-s0-s1-v1-node-${{ matrix.node }}.stderr.log"
          mounted=0
          cleanup() {
            set +e
            if [ "$mounted" -eq 1 ]; then
              sync
              sudo umount "$mountpoint"
            fi
            rmdir "$mountpoint" 2>/dev/null || true
            rm -f "$image"
          }
          trap cleanup EXIT

          /usr/bin/dd if=/dev/zero of="$image" bs=1M count=384 status=none
          test "$(stat -c %s "$image")" -eq 402653184
          test $(( $(stat -c %b "$image") * 512 )) -ge 402653184
          /usr/sbin/mkfs.ext4 -F -q -E lazy_itable_init=0,lazy_journal_init=0 "$image"

          mkdir "$mountpoint"
          sudo mount -o loop,nosuid,nodev,noexec "$image" "$mountpoint"
          mounted=1
          test "$(findmnt -n -o FSTYPE --target "$mountpoint")" = ext4
          sudo mkdir "$mountpoint/store"
          sudo chown "$(id -u):$(id -g)" "$mountpoint/store"
          sudo chmod 0700 "$mountpoint/store"
          test -z "$(find "$mountpoint/store" -mindepth 1 -maxdepth 1 -print -quit)"

          export VOID_DATANET_EXT4_ROOT="$mountpoint/store"
          python3 -I -B scripts/prove_datanet_h1_admitted_s0_s1_exec_publication_v1.py \
            > >(tee "$stdout_log") \
            2> >(tee "$stderr_log" >&2)

          grep -F '"marker":"VOID_DATANET_H1_ADMITTED_S0_S1_EXEC_PUBLICATION_V1_GREEN"' "$stdout_log"
          grep -F '"status":"GREEN"' "$stdout_log"
          grep -F '"successful_helper_lifetimes":{"fallocate":2,"link":2}' "$stdout_log"
          grep -F '"test_only_collision_link_helper_lifetimes":0' "$stdout_log"
          grep -F '"total":7' "$stdout_log"
          grep -F '"same_pid_survived_exec_for_every_slot":true' "$stdout_log"
          grep -F '"inherited_lock_fd_verified_inside_node_for_every_slot":true' "$stdout_log"
          grep -F '"s0_verified_before_s1_candidate_allocation":true' "$stdout_log"
          grep -F '"s0_s1_distinct_inodes":true' "$stdout_log"
          grep -F '"s2_rejected_before_mutation":true' "$stdout_log"
          grep -F '"s2_state_unchanged":true' "$stdout_log"
          grep -F '"root_k_posix_capability_composed":true' "$stdout_log"
          grep -F '"full_27_lifetime_campaign_proved":false' "$stdout_log"
          grep -F '"peak_9_proved":false' "$stdout_log"
          test ! -s "$stderr_log"

          test "$(find "$mountpoint/store" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -e "$mountpoint/store/datanet-6104826324f0eabbe2f9b41ad53844e0028670eca202a92f494b384b8ed0063e-s2.v1"

          sync
          sudo umount "$mountpoint"
          mounted=0
          trap - EXIT
          rmdir "$mountpoint"
          rm -f "$image"
      - name: Retain exact proof diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datanet-h1-admitted-s0-s1-exec-v1-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/datanet-admitted-s0-s1-v1-node-${{ matrix.node }}.stdout.log
            ${{ runner.temp }}/datanet-admitted-s0-s1-v1-node-${{ matrix.node }}.stderr.log
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        run: git diff --check
