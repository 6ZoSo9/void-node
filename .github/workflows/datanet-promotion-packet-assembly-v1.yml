name: DataNet Promotion Packet Assembly v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-promotion-packet-assembly-v1.yml"
      - "docs/architecture/datanet-promotion-packet-assembly-v1.md"
      - "docs/architecture/datanet-promotion-publisher-provenance-separation-v1.md"
      - "schemas/datanet-promotion-packet-assembly-v1.schema.json"
      - "scripts/datanet_promotion_packet_assembly_v1.ts"
      - "scripts/prove_datanet_promotion_packet_assembly_v1.ts"
      - "scripts/datanet_promotion_publisher_provenance_separation_v1.ts"
      - "scripts/datanet_promotion_evidence_source_collect_v1.mjs"
      - "scripts/datanet_promotion_candidate_generate_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-promotion-packet-assembly-v1.yml"
      - "docs/architecture/datanet-promotion-packet-assembly-v1.md"
      - "docs/architecture/datanet-promotion-publisher-provenance-separation-v1.md"
      - "schemas/datanet-promotion-packet-assembly-v1.schema.json"
      - "scripts/datanet_promotion_packet_assembly_v1.ts"
      - "scripts/prove_datanet_promotion_packet_assembly_v1.ts"
      - "scripts/datanet_promotion_publisher_provenance_separation_v1.ts"
      - "scripts/datanet_promotion_evidence_source_collect_v1.mjs"
      - "scripts/datanet_promotion_candidate_generate_v1.mjs"

permissions:
  contents: read

concurrency:
  group: datanet-promotion-packet-assembly-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Prove atomic DataNet promotion packet assembly
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/prove_datanet_promotion_packet_assembly_v1.ts
          git diff --exit-code
