permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove canonical ERC20 delivery canary source plan
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/canonical-erc20-delivery-canary-plan-v1.log"
          node scripts/prove_buy_void_canonical_erc20_delivery_canary_plan_v1.mjs | tee "$log"
          grep -Fx 'VOID_BUY_VOID_CANONICAL_ERC20_DELIVERY_CANARY_PLAN_V1_GREEN' "$log"
          grep -Fx 'plan_id=voidbverc20canary1_5c1bc8a16b52b8e7e07f79aadfa01c5865b5804f7603f2c8fd4330d043520173' "$log"
          grep -Fx 'source_binding_count=53' "$log"
          grep -Fx 'future_requirement_count=30' "$log"
          grep -Fx 'canonical_asset=void_token_erc20' "$log"
          grep -Fx 'canonical_chain_id=2050' "$log"
          grep -Fx 'legacy_native_canary_retired=true' "$log"
          grep -Fx 'canonical_erc20_mutation_critical_import_closure_bound=true' "$log"
          grep -Fx 'historical_native_canary_proof_exact_blob_only=true' "$log"
          grep -Fx 'historical_native_canary_proof_transitive_import_closure_claimed=false' "$log"
          grep -Fx 'canonical_delivery_runtime_parent_mounted=true' "$log"
          grep -Fx 'canonical_delivery_execution_ready=false' "$log"
          grep -Fx 'presale_inventory_funding_ready=false' "$log"
          grep -Fx 'live_canary_authorized_by_preflight=false' "$log"
          grep -Fx 'participant_control_source_only=true' "$log"
          grep -Fx 'canary_execution=false' "$log"
          grep -Fx 'signing=false' "$log"
          grep -Fx 'transaction_broadcast=false' "$log"
          grep -Fx 'public_delivery_activation=false' "$log"
          grep -Fx 'presale_activation=false' "$log"
          grep -Fx 'funds_movement=false' "$log"

      - name: Diff hygiene
        shell: bash
        run: git diff --check 40e61e4695cd4fd9e95bbd44e95152b5c2e2f432 HEAD
