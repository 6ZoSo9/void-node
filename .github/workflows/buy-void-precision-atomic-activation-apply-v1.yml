name: VOID Buy VOID Precision atomic activation apply v1

on:
  pull_request:
    paths:
      - "tools/void-buy-void-precision-atomic-activation-preflight-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_preflight_v1.sh"
      - "tools/void-buy-void-precision-atomic-activation-stage-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_stage_v1.sh"
      - "ops/precision/void_precision_buy_void_atomic_activation_apply_v1.sh"
      - "scripts/prove_buy_void_precision_atomic_activation_apply_v1.mjs"
      - "docs/operators/buy-void-precision-atomic-activation-apply-v1.md"
      - ".github/workflows/buy-void-precision-atomic-activation-apply-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-buy-void-precision-atomic-activation-preflight-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_preflight_v1.sh"
      - "tools/void-buy-void-precision-atomic-activation-stage-v1.mjs"
      - "ops/precision/void_precision_buy_void_atomic_activation_stage_v1.sh"
      - "ops/precision/void_precision_buy_void_atomic_activation_apply_v1.sh"
      - "scripts/prove_buy_void_precision_atomic_activation_apply_v1.mjs"
      - "docs/operators/buy-void-precision-atomic-activation-apply-v1.md"
      - ".github/workflows/buy-void-precision-atomic-activation-apply-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax
        run: |
          node --check scripts/prove_buy_void_precision_atomic_activation_apply_v1.mjs
          bash -n ops/precision/void_precision_buy_void_atomic_activation_apply_v1.sh
      - name: Prove private activation boundary
        run: node scripts/prove_buy_void_precision_atomic_activation_apply_v1.mjs
