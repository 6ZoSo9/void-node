name: DeepSeek Harness VOID free v1

on:
  pull_request:
    paths:
      - ".github/workflows/deepseek-harness-void-free-v1.yml"
      - "integrations/agents/deepseek-harness-void-free-v1/**"
      - "scripts/prove_deepseek_harness_void_free_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deepseek-harness-void-free-v1.yml"
      - "integrations/agents/deepseek-harness-void-free-v1/**"
      - "scripts/prove_deepseek_harness_void_free_v1.mjs"

permissions:
  contents: read

concurrency:
  group: deepseek-harness-void-free-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          bash -n integrations/agents/deepseek-harness-void-free-v1/run-free-readonly.sh
          node --check scripts/prove_deepseek_harness_void_free_v1.mjs
      - name: Free-only bridge proof
        run: node scripts/prove_deepseek_harness_void_free_v1.mjs
      - name: Diff hygiene
        run: git diff --check
