name: VOID Market Distribution Policy v1

on:
  pull_request:
    paths:
      - 'docs/architecture/void-market-distribution-policy-v1.md'
      - 'docs/architecture/void-presale-market-separation-audit-v1.md'
      - 'docs/operators/void-purpose-vault-allocation-eth-market-amendment-v1.md'
      - 'docs/operators/void-purpose-vault-allocation-v1.md'
      - 'ops/mainnet/mainnet0-premine-allocation.current.json'
      - 'fixtures/economic/void-market-distribution-policy-v1.json'
      - 'scripts/prove_void_market_distribution_policy_v1.mjs'
      - '.github/workflows/void-market-distribution-policy-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/void-market-distribution-policy-v1.md'
      - 'docs/architecture/void-presale-market-separation-audit-v1.md'
      - 'docs/operators/void-purpose-vault-allocation-eth-market-amendment-v1.md'
      - 'docs/operators/void-purpose-vault-allocation-v1.md'
      - 'ops/mainnet/mainnet0-premine-allocation.current.json'
      - 'fixtures/economic/void-market-distribution-policy-v1.json'
      - 'scripts/prove_void_market_distribution_policy_v1.mjs'
      - '.github/workflows/void-market-distribution-policy-v1.yml'

permissions:
  contents: read

jobs:
  policy:
    name: market policy (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact market policy
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for file in \
            docs/architecture/void-market-distribution-policy-v1.md \
            docs/architecture/void-presale-market-separation-audit-v1.md \
            docs/operators/void-purpose-vault-allocation-eth-market-amendment-v1.md \
            docs/operators/void-purpose-vault-allocation-v1.md \
            ops/mainnet/mainnet0-premine-allocation.current.json \
            fixtures/economic/void-market-distribution-policy-v1.json \
            scripts/prove_void_market_distribution_policy_v1.mjs \
            .github/workflows/void-market-distribution-policy-v1.yml; do
            test "$(git hash-object "$file")" = "$(git rev-parse "$EXPECTED_HEAD:$file")"
          done
          node --check scripts/prove_void_market_distribution_policy_v1.mjs
          node scripts/prove_void_market_distribution_policy_v1.mjs
          git diff --exit-code
