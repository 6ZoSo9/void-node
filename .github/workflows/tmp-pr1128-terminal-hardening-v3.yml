name: tmp PR1128 terminal operator hardening v3

on:
  push:
    branches:
      - feat/buy-void-production-private-services-foreground-operator-v1-20260808
    paths:
      - ".github/tmp-pr1128-terminal-hardening-trigger-v3.txt"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Verify exact staged ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^^)" = "078c43e1b1713ecfd2f14b3a65a86958d21b0d7d"
          test "$(git diff --name-only HEAD^^^..HEAD^^)" = ".github/scripts/tmp_pr1128_terminal_hardening_v3.py"
          test "$(git diff --name-only HEAD^^..HEAD^)" = ".github/workflows/tmp-pr1128-terminal-hardening-v3.yml"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/tmp-pr1128-terminal-hardening-trigger-v3.txt"
      - name: Apply exact hardening patch
        run: python3 .github/scripts/tmp_pr1128_terminal_hardening_v3.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused compile and operator proof
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
      - name: Prove CLI pre-activation error truth
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npx --no-install tsx scripts/buy_void_production_private_services_operator_v1.ts --confirm invalid-without-apply 2>&1)"
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          printf '%s\n' "$OUTPUT" | grep -F '"residual_service_state": false'
          printf '%s\n' "$OUTPUT" | grep -F '"side_effect_state_known": true'
      - name: Preserve dependency proof wall
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/prove_buy_void_production_private_services_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_preflight_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_rpc_readiness_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_activation_plan_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
          npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
          npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts
      - name: Repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          git diff --check
      - name: Publish hardened branch and remove temporary helpers
        shell: bash
        env:
          TARGET_BRANCH: feat/buy-void-production-private-services-foreground-operator-v1-20260808
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git rm -- \
            .github/workflows/tmp-pr1128-terminal-hardening-v2.yml \
            .github/scripts/tmp_pr1128_terminal_hardening_v3.py \
            .github/workflows/tmp-pr1128-terminal-hardening-v3.yml \
            .github/tmp-pr1128-terminal-hardening-trigger-v3.txt
          git add -- \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_production_private_services_operator_v1.ts \
            .github/workflows/buy-void-production-private-services-operator-v1.yml \
            docs/operators/buy-void-production-private-services-operator-v1.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden Buy VOID private-services operator terminal boundaries"
          git push origin "HEAD:$TARGET_BRANCH"
