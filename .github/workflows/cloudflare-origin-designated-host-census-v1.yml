name: VOID Cloudflare origin designated-host census v1

on:
  pull_request:
    paths:
      - "ops/public/void_cloudflare_origin_designated_host_census_v1.py"
      - "scripts/prove_void_cloudflare_origin_designated_host_census_v1.py"
      - "docs/operators/cloudflare-origin-designated-host-census-v1.md"
      - "tools/void-cloudflare-origin-loopback-isolation-policy-v1.mjs"
      - "ops/public/void-cloudflare-origin-proxy-v2-adapter-v1.mjs"
      - "ops/public/void-public-443-proxy-v2-dispatcher-v1.mjs"
      - ".github/workflows/cloudflare-origin-designated-host-census-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: designated-host census source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove source-only observer
        run: |
          set -euo pipefail
          python3 -I -B -m py_compile ops/public/void_cloudflare_origin_designated_host_census_v1.py
          python3 -I -B -m py_compile scripts/prove_void_cloudflare_origin_designated_host_census_v1.py
          proof="$RUNNER_TEMP/cloudflare-designated-host-census-v1.txt"
          {
            python3 -I -B ops/public/void_cloudflare_origin_designated_host_census_v1.py --self-test
            python3 -I -B scripts/prove_void_cloudflare_origin_designated_host_census_v1.py
          } | tee "$proof"
          grep -Fx 'VOID_CLOUDFLARE_ORIGIN_DESIGNATED_HOST_CENSUS_V1_SELF_TEST_GREEN' "$proof"
          grep -Fx 'VOID_CLOUDFLARE_ORIGIN_DESIGNATED_HOST_CENSUS_V1_PROOF_GREEN' "$proof"
          grep -Fx 'all_five_linux_capability_sets_observed=true' "$proof"
          grep -Fx 'process_environment_access=false' "$proof"
          grep -Fx 'credential_contents_read=false' "$proof"
          grep -Fx 'nftables_exact_ruleset_verified=false' "$proof"
          grep -Fx 'cloudflare_control_plane_evidence_external=true' "$proof"
          grep -Fx 'live_acceptance_claimed=false' "$proof"

      - name: Prove inert plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/cloudflare-designated-host-plan-v1.txt"
          python3 -I -B ops/public/void_cloudflare_origin_designated_host_census_v1.py --plan | tee "$plan"
          grep -Fx 'read_only=true' "$plan"
          grep -Fx 'process_environment_access=false' "$plan"
          grep -Fx 'credential_content_access=false' "$plan"
          grep -Fx 'filesystem_write=false' "$plan"
          grep -Fx 'service_mutation=false' "$plan"
          grep -Fx 'nftables_mutation=false' "$plan"
          grep -Fx 'network_mutation=false' "$plan"
          grep -Fx 'live_acceptance_claimed=false' "$plan"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "${BASE:-}" ]; then
            BASE="$(git rev-parse "$HEAD^1")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
