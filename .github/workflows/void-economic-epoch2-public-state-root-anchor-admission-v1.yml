name: VOID economic epoch2 public state-root anchor admission v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-public-state-root-anchor-admission-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_state_root_anchor_admission_v1.mjs"
      - "docs/operators/economic-epoch2-public-state-root-anchor-admission-v1.md"
      - "tools/void-economic-epoch2-public-void-state-root-anchor-v1.mjs"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "tools/datanet-content-commitment-canonical-truth-admission-v1.mjs"
      - "tools/datanet-content-commitment-finalized-event-membership-v1.mjs"
      - ".github/workflows/void-economic-epoch2-public-state-root-anchor-admission-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-economic-epoch2-public-state-root-anchor-admission-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_state_root_anchor_admission_v1.mjs"
      - "docs/operators/economic-epoch2-public-state-root-anchor-admission-v1.md"
      - "tools/void-economic-epoch2-public-void-state-root-anchor-v1.mjs"
      - "public/public-node/evidence/economic-epoch2-public-void-state-root-anchor-v1.json"
      - "tools/datanet-content-commitment-canonical-truth-admission-v1.mjs"
      - "tools/datanet-content-commitment-finalized-event-membership-v1.mjs"
      - ".github/workflows/void-economic-epoch2-public-state-root-anchor-admission-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-public-state-root-anchor-admission-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove state-root anchor admission composition
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-public-state-root-anchor-admission-v1.mjs
          node --check scripts/prove_void_economic_epoch2_public_state_root_anchor_admission_v1.mjs
          node scripts/prove_void_economic_epoch2_public_state_root_anchor_admission_v1.mjs

      - name: Diff hygiene
        run: git diff --check
