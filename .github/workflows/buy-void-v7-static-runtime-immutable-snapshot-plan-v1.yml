name: Buy VOID V7 static runtime immutable snapshot plan v1

on:
  pull_request:
    paths:
      - 'ops/security/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.json'
      - 'scripts/prove_buy_void_v7_static_runtime_immutable_snapshot_plan_v1.mjs'
      - 'docs/architecture/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.md'
      - '.github/workflows/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-v7-static-runtime-immutable-snapshot-plan-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parent and scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT_HEAD="4e43fd403996b6042aea58d810912dd87501bdce"
          test "$(git merge-base "$PARENT_HEAD" "$EXPECTED_HEAD")" = "$PARENT_HEAD"
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          A	.github/workflows/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.yml
          A	docs/architecture/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.md
          A	ops/security/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.json
          A	scripts/prove_buy_void_v7_static_runtime_immutable_snapshot_plan_v1.mjs
          EOF
          git diff --name-status "$PARENT_HEAD" "$EXPECTED_HEAD" -- | sort > "$RUNNER_TEMP/actual"
          sort "$RUNNER_TEMP/expected" > "$RUNNER_TEMP/expected.sorted"
          diff -u "$RUNNER_TEMP/expected.sorted" "$RUNNER_TEMP/actual"
          git diff --check "$PARENT_HEAD" "$EXPECTED_HEAD" --
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.json)" = "9c5ce1e13f9e4695cf17099ccd57f1e11d620eda"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_static_runtime_immutable_snapshot_plan_v1.mjs)" = "6562e350ec0c36149bbf5b7b8b29142462d0f424"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-v7-static-runtime-immutable-snapshot-plan-v1.md)" = "850dd1d0751d23fb5c1d088595dc824db67efb3c"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove source-only immutable snapshot plan
        run: node scripts/prove_buy_void_v7_static_runtime_immutable_snapshot_plan_v1.mjs
