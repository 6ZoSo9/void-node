name: VOID Buy credential query protected replace v3 repaired

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v3r.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v3r.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-replace-v3r.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-replace-v3r.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact reviewed generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py)" =             "573fd2785910eae62568a4add0be4d176886b28e"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v3r.py)" =             "05fe8a5e7765e4a31488789c273b5f746032567c"
          test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json)" =             "c4870f3178aebc9a0bb6557562f663b8480cfefa"
          test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json)" =             "b73415ce8fc95ff2d49cbde97a15d701ad5b7937"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py",
              "scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v3r.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_REPLACE_V3R_SYNTAX_GREEN")
          PY

      - name: Prove guarded V2 to V3 replacement
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-query-replace-v3r-proof.log"
          python3 -I -B             scripts/prove_void_buy_void_user_manager_credential_query_protected_replace_v3r.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_REPLACE_V3R_PROOF_GREEN"
            "accepted_lock_id=voidbuyumqcredelflock3r_8b064214e22ce54ac193b426f38b9d6a7ea4cee07b38b68c8d1eeb6c51de6f34"
            "installed_predecessor_lock_id=voidbuyumqcredelflock2_c05afb1a6fbd44a00d4f220652e87ee099e0456992a17a6ae7b60bda9229cf54"
            "preexec_replacement=false"
            "v1_predecessor_preserved_after_success=true"
            "v2_predecessor_retained_after_success=true"
            "query_atomic_exchange_required=true"
            "automatic_failure_rollback=true"
            "foreign_stage_cleanup_rejected=true"
            "current_invocation_stage_inode_bound=true"
            "operation_directory_lock_required=true"
            "crash_state_classifier_complete=true"
            "apply_crash_resume_supported=true"
            "rollback_crash_resume_supported=true"
            "pre_mutation_authority_boundary=true"
            "apply_authority_boundary_pre_mutation=true"
            "rollback_authority_boundary_pre_mutation=true"
            "query_execution=false"
            "credential_contents_read=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "transaction=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
