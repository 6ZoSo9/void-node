name: VOID Buy VOID custody lock release fsync fault disclosure v1

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_custody_exclusive_lock_release_fsync_fault_v1.mjs"
      - ".github/workflows/buy-void-custody-exclusive-lock-release-fsync-fault-v1.yml"
      - "docs/architecture/buy-void-custody-exclusive-lock-release-fsync-fault-v1.md"
      - "src/economic/buy_void_custody_high_water_exclusive_lock_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-release-fsync-disclosure-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  disclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact unmerged head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Validate reproducible synthetic release-failure contrast
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_custody_exclusive_lock_release_fsync_fault_v1.mjs
          node scripts/prove_buy_void_custody_exclusive_lock_release_fsync_fault_v1.mjs \
            | tee "custody-fsync-fault-${{ matrix.node }}.txt"
          for required in \
            "before_callback_fsync_failure_lock_retained=true" \
            "failed_rmdir_lock_retained=true" \
            "after_rmdir_fsync_failure_reported=true" \
            "after_rmdir_fsync_failure_lock_retained=false" \
            "independent_process_acquires_after_reported_release_failure=true" \
            "live_power_loss_tested=false" \
            "production_writer_implemented=false" \
            "production_allocation_mutation_ready=false" \
            "funds_moved=false"
          do
            grep -Fx "$required" "custody-fsync-fault-${{ matrix.node }}.txt"
          done
      - name: Upload disposable fault-cut evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-release-fsync-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: custody-fsync-fault-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [disclose]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download three exact-head fault receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-release-fsync-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./proofs
      - name: Require identical Node 22 24 26 disclosure bytes
        run: |
          set -euo pipefail
          for version in 22 24 26; do test -s "proofs/custody-fsync-fault-$version.txt"; done
          cmp proofs/custody-fsync-fault-22.txt proofs/custody-fsync-fault-24.txt
          cmp proofs/custody-fsync-fault-22.txt proofs/custody-fsync-fault-26.txt
          echo "VOID_CUSTODY_RELEASE_FSYNC_FAULT_THREE_NODE_DISCLOSURE_GREEN"
          echo "production_high_water_writer_ready=false"
          echo "reserve_recover_enabled=false"
