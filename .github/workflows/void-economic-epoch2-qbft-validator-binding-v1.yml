name: VOID economic epoch2 QBFT validator binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-qbft-validator-binding-v1.yml"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-precision-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-nimo-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-node-identity-xiphos-v1.json"
      - "ops/mainnet0/economic-epoch2-production-client-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "ops/mainnet/validator-status.current.yaml"
      - "docs/architecture/economic-epoch2-qbft-validator-binding-v1.md"
      - "scripts/prove_void_economic_epoch2_qbft_validator_binding_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove QBFT validator binding boundary
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_qbft_validator_binding_v1.mjs
          node scripts/prove_void_economic_epoch2_qbft_validator_binding_v1.mjs
