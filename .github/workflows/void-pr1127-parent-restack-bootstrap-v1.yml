name: VOID PR1127 parent restack bootstrap v1

on:
  push:
    branches:
      - 'feat/p2p-udp-swarm-node-candidate-integration-v1-20260808'
    paths:
      - '.github/workflows/void-pr1127-parent-restack-bootstrap-v1.yml'

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/p2p-udp-swarm-node-candidate-integration-v1-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact child and parent state
        shell: bash
        env:
          EXPECTED_PRIOR_CHILD_HEAD: e6cfd52fe1d4d0ef142e32ddebef54ad96e64a52
          EXPECTED_PARENT_BRANCH: feat/p2p-udp-swarm-relay-preserving-takeover-policy-v1-20260808
          EXPECTED_PARENT_HEAD: 7f76f0d520d0f28aaed10f525fbf5b07d9c44886
          EXPECTED_NODE_CORE_BLOB: d1706757c06578dc790689747400ecb5d1c33550
          EXPECTED_INTEGRATION_PROOF_BLOB: 0a801dffb05805fa448d47ac2f5639147cd9f797
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRIOR_CHILD_HEAD"
          test "$(git hash-object src/node_core.ts)" = "$EXPECTED_NODE_CORE_BLOB"
          test "$(git hash-object scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts)" = "$EXPECTED_INTEGRATION_PROOF_BLOB"
          git fetch --no-tags origin "$EXPECTED_PARENT_BRANCH:refs/remotes/origin/$EXPECTED_PARENT_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$EXPECTED_PARENT_BRANCH")" = "$EXPECTED_PARENT_HEAD"
          test "$(git merge-base "$EXPECTED_PRIOR_CHILD_HEAD" "$EXPECTED_PARENT_HEAD")" = '271535c0d2ef0c89480ab18b814488d36c9584a9'

      - name: Merge exact settled parent without rewriting history
        shell: bash
        env:
          EXPECTED_PARENT_HEAD: 7f76f0d520d0f28aaed10f525fbf5b07d9c44886
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$EXPECTED_PARENT_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT_HEAD" HEAD
          test "$(git hash-object src/node_core.ts)" = 'd1706757c06578dc790689747400ecb5d1c33550'
          test "$(git hash-object scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts)" = '0a801dffb05805fa448d47ac2f5639147cd9f797'
          test -f src/p2p/udp_swarm_relay_preserving_takeover_policy_v1.ts
          git diff --check HEAD^1..HEAD

      - name: Remove bootstrap helper and publish ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/void-pr1127-parent-restack-bootstrap-v1.yml
          git diff --cached --check
          git commit -m 'chore: complete PR1127 parent restack bootstrap'
          git push origin HEAD:feat/p2p-udp-swarm-node-candidate-integration-v1-20260808
