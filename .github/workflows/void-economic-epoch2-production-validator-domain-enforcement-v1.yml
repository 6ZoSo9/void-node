name: VOID economic epoch2 production validator domain enforcement v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_domain_enforcement_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-domain-enforcement-v1.md"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-topology-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "ops/common/void-economic-epoch2-qbft-local-identity-prepare-v1.mjs"
      - ".github/workflows/void-economic-epoch2-production-validator-domain-enforcement-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_domain_enforcement_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-domain-enforcement-v1.md"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-topology-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "ops/common/void-economic-epoch2-qbft-local-identity-prepare-v1.mjs"
      - ".github/workflows/void-economic-epoch2-production-validator-domain-enforcement-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-production-validator-domain-enforcement-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove production validator enforcement evidence contract
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_domain_enforcement_v1.mjs
          node scripts/prove_void_economic_epoch2_production_validator_domain_enforcement_v1.mjs

      - name: Diff hygiene
        run: git diff --check
