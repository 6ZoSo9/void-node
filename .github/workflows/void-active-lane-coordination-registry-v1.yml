name: VOID Active Lane Coordination Registry V1

on:
  pull_request:
    paths:
      - ".github/workflows/void-active-lane-coordination-registry-v1.yml"
      - "docs/operations/void-active-lane-coordination-registry-v1.md"
      - "ops/coordination/active-lane-reservations-v1.json"
      - "scripts/prove_void_active_lane_coordination_registry_v1.mjs"
      - "tools/void-active-lane-registry-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-active-lane-coordination-registry-v1.yml"
      - "docs/operations/void-active-lane-coordination-registry-v1.md"
      - "ops/coordination/active-lane-reservations-v1.json"
      - "scripts/prove_void_active_lane_coordination_registry_v1.mjs"
      - "tools/void-active-lane-registry-v1.mjs"

permissions:
  contents: read
  pull-requests: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove active-lane registry
        run: node scripts/prove_void_active_lane_coordination_registry_v1.mjs
      - name: Capture read-only registry
        run: |
          node tools/void-active-lane-registry-v1.mjs capture \
            --repo-root "$PWD" \
            --policy "$PWD/ops/coordination/active-lane-reservations-v1.json" \
            --output "$RUNNER_TEMP/void-active-lanes.json" \
            --require-github
          test -s "$RUNNER_TEMP/void-active-lanes.json"
