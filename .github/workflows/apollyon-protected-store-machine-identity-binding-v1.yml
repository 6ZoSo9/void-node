name: Apollyon protected-store Xiphos machine identity binding V1

on:
  pull_request:
    paths:
      - "ops/security/apollyon-protected-store-machine-identity-binding-v1.json"
      - "scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py"
      - "docs/security/apollyon-protected-store-machine-identity-binding-v1.md"
      - ".github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml"
      - "ops/security/apollyon-protected-store-first-host-evidence-plan-v1.json"
      - "scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py"
      - "docs/security/apollyon-protected-store-first-host-evidence-plan-v1.md"
      - ".github/workflows/apollyon-protected-store-first-host-evidence-plan-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact historical parent and cumulative five-file source-only scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PARENT=4bb11c7469b47b25810390b762709bd93a7184e3
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/apollyon-protected-store-first-host-evidence-plan-v1.yml' \
            '.github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml' \
            'docs/security/apollyon-protected-store-machine-identity-binding-v1.md' \
            'ops/security/apollyon-protected-store-machine-identity-binding-v1.json' \
            'scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py' \
            | LC_ALL=C sort > "$expected"
          git diff --no-renames --name-only "$PARENT" HEAD -- | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/apollyon-protected-store-machine-identity-binding-v1.json)" = 188c4c21d31d27d380a3c4f91b81bb7f6b826be3
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py)" = 9f13039a35c5c0afd457593d4436c614991434b1
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-machine-identity-binding-v1.md)" = 3b464cfb7f3d59b2329f2d1623066c36574e1657

          # Authenticate immutable parent evidence from the historical parent tree,
          # not from cumulative successor worktree copies.
          test "$(git rev-parse "$PARENT":ops/security/apollyon-protected-store-first-host-evidence-plan-v1.json)" = 110c8a6bb4f8ec89514cfd9ef4cdc3218fa2a4ca
          test "$(git rev-parse "$PARENT":scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py)" = 533b8357caea9c77c5c73aba95233712824b65d9
          test "$(git rev-parse "$PARENT":docs/security/apollyon-protected-store-first-host-evidence-plan-v1.md)" = 4b055837dd4e150fb2573947ff11f0b2f455622e
          test "$(git rev-parse "$PARENT":.github/workflows/apollyon-protected-store-first-host-evidence-plan-v1.yml)" = f533256a7b2b2a75b1f9aa8298ac43692b5af9d7

          git diff --check "$PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile proof without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          name = "scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py"
          compile(Path(name).read_text("utf-8"), name, "exec", dont_inherit=True)
          print("machine_identity_binding_python_syntax_green=true")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove exact Xiphos identity binding and negative authority
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apollyon-xiphos-machine-id-binding.txt"
          python3 -I -B scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py --self-test | tee "$out"

          for marker in \
            'VOID_APOLLYON_PROTECTED_STORE_MACHINE_IDENTITY_BINDING_V1_PROOF_GREEN' \
            'binding_id=voidapollyonhostidbind1_71ad71a32fed9e24ccb3e06499f8777d7835ddac6280fb9f4a92423bfbd02198' \
            'parent_pr=3749' \
            'parent_head=4bb11c7469b47b25810390b762709bd93a7184e3' \
            'parent_blob_count=4' \
            'binding_contract_count=24' \
            'negative_authority_count=18' \
            'rejected_adversaries=62' \
            'target_host=Xiphos' \
            'machine_identity_kind=etc_machine_id_sha256' \
            'expected_machine_id_sha256=543902c4c208d749dbe2baa239e9cd010ac50eb8cde4db8eb8cd26f6e806f057' \
            'raw_machine_id_recorded=false' \
            'raw_machine_id_printed=false' \
            'machine_identity_bound=true' \
            'observed_digest_binding_not_authenticated_host_identity=true' \
            'authenticated_transport_attestation_present=false' \
            'authenticated_xiphos_machine_identity_proven=false' \
            'host_pass_authorized=false' \
            'host_pass_performed=false' \
            'protected_store_origin_proven=false' \
            'writer_invocation_authorized=false' \
            'training_execution_authorized=false' \
            'credential_access=false' \
            'transaction=false' \
            'funds_movement=false' \
            'next_gate=AUTHENTICATE_XIPHOS_TRANSPORT_AND_ATTEST_MACHINE_IDENTITY_THEN_SEPARATELY_AUTHORIZE_READ_ONLY_METADATA_SAFE_XIPHOS_FIRST_PASS'
          do
            grep -Fx "$marker" "$out"
          done

          python3 -I -B scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py --run > "$RUNNER_TEMP/run.txt"
          grep -Fx 'VOID_APOLLYON_PROTECTED_STORE_MACHINE_IDENTITY_BINDING_V1_PROOF_GREEN' "$RUNNER_TEMP/run.txt"
          grep -Fx 'machine_identity_bound=true' "$RUNNER_TEMP/run.txt"
          grep -Fx 'host_pass_performed=false' "$RUNNER_TEMP/run.txt"
          grep -Fx 'training_execution_authorized=false' "$RUNNER_TEMP/run.txt"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/run.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
