name: VOID Coordination Rotation Live Snapshot v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-coordination-rotation-live-snapshot-v1.yml"
      - "tools/void-coordination-rotation-live-snapshot-v1.mjs"
      - "scripts/prove_void_coordination_rotation_live_snapshot_v1.mjs"
      - "docs/operations/void-coordination-rotation-live-snapshot-v1.md"
      - "tools/void-coordination-successor-chain-v1.mjs"
      - "tools/void-coordination-rotation-snapshot-v1.mjs"
      - "tools/void-worker-coordination-live-dispatch-v1.mjs"
      - "ops/coordination/worker-live-dispatch-policy-v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-coordination-rotation-live-snapshot-v1.yml"
      - "tools/void-coordination-rotation-live-snapshot-v1.mjs"
      - "scripts/prove_void_coordination_rotation_live_snapshot_v1.mjs"
      - "docs/operations/void-coordination-rotation-live-snapshot-v1.md"
      - "tools/void-coordination-successor-chain-v1.mjs"
      - "tools/void-coordination-rotation-snapshot-v1.mjs"
      - "tools/void-worker-coordination-live-dispatch-v1.mjs"
      - "ops/coordination/worker-live-dispatch-policy-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_major: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node_major }}
      - name: Syntax
        run: |
          node --check tools/void-coordination-rotation-live-snapshot-v1.mjs
          node --check scripts/prove_void_coordination_rotation_live_snapshot_v1.mjs
      - name: Prove live rotation snapshot capture
        run: node scripts/prove_void_coordination_rotation_live_snapshot_v1.mjs
