name: Buy VOID presale custody durability rollback challenge plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-custody-durability-rollback-challenge-plan-v1.yml"
      - "docs/operators/buy-void-presale-custody-durability-rollback-challenge-plan-v1.md"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json"
      - "scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v1.py"
      - "ops/security/buy-void-presale-host-evidence-collection-plan-v1.json"
      - "ops/security/buy-void-presale-source-freeze-acceptance-v2.json"
      - "ops/precision/void_buy_void_presale_allocation_custody_host_evidence_v1.ts"
      - "scripts/prove_buy_void_presale_allocation_custody_host_evidence_v1.ts"
      - "docs/operators/buy-void-presale-allocation-custody-host-evidence-v1.md"
      - ".github/workflows/buy-void-presale-allocation-custody-host-evidence-v1.yml"
      - "tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md"
      - ".github/workflows/buy-void-allocation-custody-live-durability-rollback-contract-v1.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-presale-custody-durability-rollback-challenge-plan-v1.yml"
      - "docs/operators/buy-void-presale-custody-durability-rollback-challenge-plan-v1.md"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json"
      - "scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v1.py"
      - "ops/security/buy-void-presale-host-evidence-collection-plan-v1.json"
      - "ops/security/buy-void-presale-source-freeze-acceptance-v2.json"
      - "ops/precision/void_buy_void_presale_allocation_custody_host_evidence_v1.ts"
      - "scripts/prove_buy_void_presale_allocation_custody_host_evidence_v1.ts"
      - "docs/operators/buy-void-presale-allocation-custody-host-evidence-v1.md"
      - ".github/workflows/buy-void-presale-allocation-custody-host-evidence-v1.yml"
      - "tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md"
      - ".github/workflows/buy-void-allocation-custody-live-durability-rollback-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact challenge-plan generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="4558e33f12fd2c60b1a26a5847516c762d427a71" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-presale-custody-durability-rollback-challenge-plan-v1.yml' \
            'docs/operators/buy-void-presale-custody-durability-rollback-challenge-plan-v1.md' \
            'ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json' \
            'scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json)" = 5face2022dc2cbc573e32e99f88623f381a8a174
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v1.py)" = ecc2b6e41b37521fdfe97a4df7136625c8be86e6
          test "$(git rev-parse HEAD:docs/operators/buy-void-presale-custody-durability-rollback-challenge-plan-v1.md)" = 4906f0ca9e732a07ed90ddeccfe5c15d875fc124

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-host-evidence-collection-plan-v1.json)" = ad68175e629fd1cf90180db3a904f84834314fdd
          test "$(git rev-parse HEAD:ops/security/buy-void-presale-source-freeze-acceptance-v2.json)" = 174d536807f03fd7b6ff44820d4e378c7055150e
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_presale_allocation_custody_host_evidence_v1.ts)" = 7efc48397d96ae38ab4577e28ca3f26ef9254dd1
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_allocation_custody_host_evidence_v1.ts)" = 0f2cffc11cf0c730e24a78a504c99ece47fc6f06
          test "$(git rev-parse HEAD:docs/operators/buy-void-presale-allocation-custody-host-evidence-v1.md)" = e776529abc8ce6dc7ba21864b48b923aafddf079
          test "$(git rev-parse HEAD:.github/workflows/buy-void-presale-allocation-custody-host-evidence-v1.yml)" = 56dc995e6ee380971a3ae6939cb42e4be1a16301

          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs)" = eef7c4e1db7401ba82fda96aa1e8da40c1981b7d
          test "$(git rev-parse HEAD:scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs)" = 7ced5fb56a22cd546aab30c466021b01b1c6a84d
          test "$(git rev-parse HEAD:docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md)" = 16a8a755888abd7b9ad4f0377468d6a403f80a70
          test "$(git rev-parse HEAD:.github/workflows/buy-void-allocation-custody-live-durability-rollback-contract-v1.yml)" = b3426f40577ff1ca1bbab8ca46232ae1ca0a8148

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove challenge plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-challenge-plan-v1.log"
          python3 -I -B scripts/prove_buy_void_presale_custody_durability_rollback_challenge_plan_v1.py | tee "$out"

          markers=(
            'VOID_BUY_VOID_PRESALE_CUSTODY_DURABILITY_ROLLBACK_CHALLENGE_PLAN_V1_PROOF_GREEN'
            'plan_id=voidbuycustodychallengeplan1_dd868e3fb6ebdbf894c1170d0ecc153d61e198d9c20279a05c3309957add9006'
            'accepted_presale_source_bound=true'
            'read_only_prerequisite_collector_bound=true'
            'durability_contract_bound=true'
            'required_future_evidence_count=20'
            'non_customer_canary_domain_required=true'
            'allocation_ledger_unchanged_required=true'
            'customer_request_state_unchanged_required=true'
            'challenge_plan_only=true'
            'host_execution_authorized=false'
            'storage_mutation_authorized=false'
            'rollback_test_authorized=false'
            'payment_acceptance_authorized=false'
            'public_presale_activation_authorized=false'
            'funds_movement=false'
            'next_gate=SEPARATELY_AUTHORIZE_NONCUSTOMER_CUSTODY_DURABILITY_ROLLBACK_CHALLENGE_V1'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
