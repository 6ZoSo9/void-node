name: VOID Merlin Claude Code Advisor v1

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".claude/settings.json"
      - "AGENTS.md"
      - "scripts/prove_merlin_claude_code_advisor_v1.mjs"
      - ".github/workflows/void-merlin-claude-code-advisor-v1.yml"
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - ".claude/settings.json"
      - "AGENTS.md"
      - "scripts/prove_merlin_claude_code_advisor_v1.mjs"
      - ".github/workflows/void-merlin-claude-code-advisor-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-merlin-claude-code-advisor-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisor-boundary:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - name: Parse Claude project settings
        run: node -e 'JSON.parse(require("node:fs").readFileSync(".claude/settings.json", "utf8"))'

      - name: Prove Merlin advisory and sandbox boundary
        run: node scripts/prove_merlin_claude_code_advisor_v1.mjs

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
