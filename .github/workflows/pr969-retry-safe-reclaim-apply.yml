name: PR 969 retry-safe reclaim apply

on:
  push:
    branches:
      - fix/buy-void-native-execution-attempt-idempotency-v1
    paths:
      - .github/workflows/pr969-retry-safe-reclaim-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage PR 969 retry safety apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buy-void-native-execution-attempt-idempotency-v1
          fetch-depth: 0

      - name: Apply reviewed retry-safety repair
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/economic/buy_void_delivery_submission_guard_v1.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}_anchor_count={count}")
              source = source.replace(old, new, 1)

          replace_once(
              """  release_reason_binding_immutable: true,
          alternate_idempotency_key_replay_forbidden: true,
          """,
              """  release_reason_binding_immutable: true,
          retry_safe_release_allowlist: true,
          terminal_release_reclaim_forbidden: true,
          alternate_idempotency_key_replay_forbidden: true,
          """,
              "authority",
          )

          replace_once(
              """const RELEASE_SCHEMA =
            \"void_buy_void_delivery_submission_guard_release_v1\";
          const COMMON_ENTRY_KEYS = [
          """,
              """const RELEASE_SCHEMA =
            \"void_buy_void_delivery_submission_guard_release_v1\";
          const RETRY_SAFE_RELEASE_REASONS = new Set([
            \"signer_address_read_failed\",
            \"signer_address_mismatch\",
            \"transaction_signing_failed\",
            \"invalid_raw_signed_transaction_from_signer\",
            \"signed_transaction_parse_failed\",
            \"signed_transaction_hash_mismatch\",
            \"signed_transaction_binding_mismatch\",
            \"invalid_provider_submission_id\",
            \"broadcast_definitively_not_submitted\",
          ]);
          const COMMON_ENTRY_KEYS = [
          """,
              "allowlist",
          )

          replace_once(
              """function entryHash(
          """,
              """function releaseReasonAllowsRetry(reason: string): boolean {
            return RETRY_SAFE_RELEASE_REASONS.has(reason);
          }

          function entryHash(
          """,
              "helper",
          )

          replace_once(
              """    if (value.event === \"claim\") {
                if (existingKey?.event === \"claim\") {
                  throw new Error(\"submission_guard_duplicate_claim\");
                }
              } else {
          """,
              """    if (value.event === \"claim\") {
                if (existingKey?.event === \"claim\") {
                  throw new Error(\"submission_guard_duplicate_claim\");
                }
                if (
                  existingKey?.event === \"release\" &&
                  !releaseReasonAllowsRetry(existingKey.release_reason)
                ) {
                  throw new Error(
                    \"submission_guard_non_retryable_release_reclaimed\",
                  );
                }
              } else {
          """,
              "replay",
          )

          replace_once(
              """        if (latest?.event === \"claim\") {
                  return {
                    claimed: false as const,
                    reason: \"submission_already_claimed\",
                    existing_transaction_hash:
                      latest.expected_transaction_hash,
                  };
                }

                const previous =
          """,
              """        if (latest?.event === \"claim\") {
                  return {
                    claimed: false as const,
                    reason: \"submission_already_claimed\",
                    existing_transaction_hash:
                      latest.expected_transaction_hash,
                  };
                }
                if (
                  latest?.event === \"release\" &&
                  !releaseReasonAllowsRetry(latest.release_reason)
                ) {
                  return {
                    claimed: false as const,
                    reason: \"submission_release_not_retry_safe\",
                    existing_transaction_hash:
                      latest.expected_transaction_hash,
                  };
                }

                const previous =
          """,
              "runtime",
          )

          path.write_text(source, encoding="utf-8")
          PY

          cat > /tmp/pr969-proof.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/pr969-proof.b64 | base64 --decode > scripts/prove_buy_void_delivery_submission_release_reason_idempotency_v1.ts

          cat > /tmp/pr969-doc.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/pr969-doc.b64 | base64 --decode > docs/operators/buy-void-native-execution-worker-v1.md

          test "$(sha256sum src/economic/buy_void_delivery_submission_guard_v1.ts | awk '{print $1}')" = "1ec053a1c8a67111d237cf74d5900042d6f7d6c21ad1c0871a0e265ca66f9486"
          test "$(sha256sum scripts/prove_buy_void_delivery_submission_release_reason_idempotency_v1.ts | awk '{print $1}')" = "65c4cd556f9b43830bb23be0431c2631de1890c6537d6c92d70ddfe2e9aea417"
          test "$(sha256sum docs/operators/buy-void-native-execution-worker-v1.md | awk '{print $1}')" = "58b60520274c8cdb4a76e6fffb7418de6e8ab51540b7b4b092bdbd163aedabf4"

          rm -rf .github/void-automation/pr969
          rm -f .github/workflows/pr969-retry-safe-reclaim-apply.yml
          git diff --check

          git config user.name "VOID source automation"
          git config user.email "void-source-automation@users.noreply.github.com"
          git add \
            src/economic/buy_void_delivery_submission_guard_v1.ts \
            scripts/prove_buy_void_delivery_submission_release_reason_idempotency_v1.ts \
            docs/operators/buy-void-native-execution-worker-v1.md
          git add -u .github
          git commit -m "fix: restrict Buy VOID reclaim to retry-safe releases"
          git push origin HEAD:fix/buy-void-native-execution-attempt-idempotency-v1
