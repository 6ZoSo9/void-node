name: public-node-operator-trial-root-link

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-root-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial root link
        run: bash tools/check_public_node_operator_trial_root_link_v1.sh
