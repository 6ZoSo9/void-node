name: VOID AI Agent Paid Work Client V1

on:
  pull_request:
    paths:
      - ".github/workflows/void-ai-agent-paid-work-client-v1.yml"
      - "docs/public/ai-agent-paid-work-client-v1.md"
      - "examples/void-ai-agent-paid-work-client-v1.example.json"
      - "schemas/void-ai-agent-paid-work-client-v1.schema.json"
      - "scripts/prove_void_ai_agent_paid_work_client_v1.mjs"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-ai-agent-paid-work-client-v1.yml"
      - "docs/public/ai-agent-paid-work-client-v1.md"
      - "examples/void-ai-agent-paid-work-client-v1.example.json"
      - "schemas/void-ai-agent-paid-work-client-v1.schema.json"
      - "scripts/prove_void_ai_agent_paid_work_client_v1.mjs"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-ai-agent-paid-work-client-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run focused proof
        run: node scripts/prove_void_ai_agent_paid_work_client_v1.mjs

      - name: Help surface
        run: node tools/void-ai-agent-paid-work-client-v1.mjs --help

      - name: TypeScript baseline
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
