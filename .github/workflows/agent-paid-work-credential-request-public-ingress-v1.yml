name: VOID agent paid-work credential request public ingress v1

on:
  pull_request:
    paths:
      - "ops/void-ai-agent-public-gateway-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_public_ingress_v1.mjs"
      - "docs/public/agent-paid-work-credential-request-public-ingress-v1.md"
      - "examples/systemd/void-ai-agent-public-gateway-v1.service.d/71-agent-paid-work-credential-request-gateway-v1.conf"
      - ".github/workflows/agent-paid-work-credential-request-public-ingress-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/void-ai-agent-public-gateway-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_public_ingress_v1.mjs"
      - "docs/public/agent-paid-work-credential-request-public-ingress-v1.md"
      - "examples/systemd/void-ai-agent-public-gateway-v1.service.d/71-agent-paid-work-credential-request-gateway-v1.conf"
      - ".github/workflows/agent-paid-work-credential-request-public-ingress-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-agent-paid-work-credential-request-public-ingress-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: node --check ops/void-ai-agent-public-gateway-v1.mjs
      - run: node --check scripts/prove_agent_paid_work_credential_request_public_ingress_v1.mjs
      - run: node scripts/prove_agent_paid_work_credential_request_public_ingress_v1.mjs
      - run: git diff --check
