name: Buy VOID Epoch-2 public signer-control evidence v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-signer-control-public-evidence-v1.yml"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs"
      - "scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs"
      - "docs/operators/buy-void-epoch2-signer-control-public-evidence-v1.md"
      - "src/economic/buy_void_epoch2_signer_control_v1.ts"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: public signer-control evidence / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate without stored Git credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check acceptance lane
        run: |
          set -euo pipefail
          node --check tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs
          node --check scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs
          node --check scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs
      - name: Verify public signer-control evidence
        run: node scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs
      - name: Verify dormant candidate V2 successor
        run: node scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs
      - name: Diff hygiene
        run: git diff --check
