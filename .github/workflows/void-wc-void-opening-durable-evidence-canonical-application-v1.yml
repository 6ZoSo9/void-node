      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-opening-durable-evidence-canonical-application-v1.mjs
          node --check scripts/prove_void_wc_void_opening_durable_evidence_canonical_application_v1.mjs
      - name: Prove durable opening canonical application
        run: node scripts/prove_void_wc_void_opening_durable_evidence_canonical_application_v1.mjs
      - name: Upstream durable-opening and classifier regressions
        run: |
          node scripts/prove_void_wc_void_opening_durable_evidence_candidate_promotion_v1.mjs
          node scripts/prove_void_wc_void_opening_claim_binding_persistence_v1.mjs
          node scripts/prove_void_wc_void_opening_claim_binding_publication_v1.mjs
          node scripts/prove_void_wc_void_opening_replay_persistence_v1.mjs
          node scripts/prove_void_wc_void_production_readiness_v1.mjs
          node scripts/prove_void_coupled_economic_successor_gate_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
