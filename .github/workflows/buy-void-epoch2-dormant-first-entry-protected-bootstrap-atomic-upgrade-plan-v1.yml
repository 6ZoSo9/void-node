name: Buy VOID Epoch-2 repaired V6 atomic bootstrap upgrade plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired planner generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          STACK_PARENT=12b5b05eaaf07e10bd4cb04c98abc1916a81fede
          case "$EVENT_NAME" in
            pull_request)
              test "$PR_BASE" = "$STACK_PARENT"
              base="$STACK_PARENT"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch) base="$STACK_PARENT" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py)" = 9ba10aac284da9e44db0ad258348425cfa3c2e2c
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py)" = b8ad4ea673d0744d95f37b3b21532415ded8193d
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-plan-v1.md)" = 53b5fd8e7cef477bf2bf234739e2393766bfc602

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py)" = d4b298dea73a4970987bf22435be3e76a5e7a02d
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py)" = 74245f061432efd5383123c111ab481befbe90b5
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.md)" = bc41ad73160734b9a11bcaf925dc24b7daf645db
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-atomic-upgrade-v1.yml)" = 5601a90c2e12a6ea98e70339ea4b351572cda5d6

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_ATOMIC_UPGRADE_PLAN_V1_SYNTAX_GREEN")
          PY

      - name: Prove non-executing planner
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
          out="$RUNNER_TEMP/atomic-upgrade-plan-proof.log"
          python3 -I -B "$proof" | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_BOOTSTRAP_ATOMIC_UPGRADE_PLAN_V1_PROOF_GREEN' \
            'planner_target_blob_bound=true' \
            'repaired_upgrader_generation_bound=true' \
            'upgrader_proof_doc_workflow_generation_bound=true' \
            'fixed_stack_parent_bound=true' \
            'manual_dispatch_base_bound=true' \
            'nonroot_run_required=true' \
            'upgrader_collect_only=true' \
            'subprocess_execution_limited_to_sanitized_git=true' \
            'input_reads_read_only_nofollow=true' \
            'temporary_git_metadata_boundary_explicit=true' \
            'planner_git_callbacks_neutralized=true' \
            'planner_git_fsmonitor_callback_rejected=true' \
            'future_apply_source_inline=true' \
            'future_apply_source_reopens_checkout=false' \
            'future_apply_mutable_checkout_execution=false' \
            'source_repository_mutation=false' \
            'protected_filesystem_mutation=false' \
            'future_apply_argv_emitted_only=true' \
            'future_apply_authorized=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'service_mutation=false' \
            'credential_access=false' \
            'private_key_access=false' \
            'signing=false' \
            'transaction=false' \
            'rpc_call=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'wc_void_market_activation=false' \
            'treasury_liquidity_action=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Verify planner source-only receipts
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"

          self="$RUNNER_TEMP/atomic-upgrade-plan-self-test.log"
          python3 -I -B "$target" --self-test | tee "$self"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_BOOTSTRAP_ATOMIC_UPGRADE_PLAN_V1_SELF_TEST_GREEN' \
            'exact_repaired_upgrader_generation_bound=true' \
            'nonroot_run_required=true' \
            'strict_lowercase_expected_head_required=true' \
            'repaired_bootstrap_identity_bound=true' \
            'repaired_manifest_identity_bound=true' \
            'upgrader_collect_only=true' \
            'temporary_git_metadata_boundary_explicit=true' \
            'planner_git_callbacks_neutralized=true' \
            'future_apply_source_inline=true' \
            'future_apply_source_reopens_checkout=false' \
            'protected_filesystem_mutation=false' \
            'future_apply_argv_emitted_only=true' \
            'future_apply_authorized=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$self"
          done

          plan="$RUNNER_TEMP/atomic-upgrade-plan-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$plan"
          for marker in \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'planner_git_callbacks_neutralized=true' \
            'future_apply_source_inline=true' \
            'future_apply_source_reopens_checkout=false' \
            'future_apply_requires_root=true' \
            'future_apply_authorized=false' \
            'bootstrap_execution=false' \
            'inner_installer_execution=false' \
            'service_mutation=false' \
            'credential_access=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$plan"
          done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
