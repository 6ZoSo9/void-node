name: Agent paid-work credential workflow actions v6 v1

on:
  pull_request:
    paths:
      - ".github/workflows/external-agent-credential-request-packet-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-intake-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-gateway-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-review-queue-v1.yml"
      - ".github/workflows/agent-paid-work-credential-lifecycle-cli-v1.yml"
      - ".github/workflows/agent-paid-work-real-agent-handoff-v1.yml"
      - ".github/workflows/agent-paid-work-credential-registry-v1.yml"
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-lifecycle-v1.yml"
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-retirement-v1.yml"
      - ".github/workflows/agent-paid-work-credential-actions-v6-v1.yml"
      - "scripts/prove_agent_paid_work_credential_actions_v6_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-agent-credential-request-packet-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-intake-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-gateway-v1.yml"
      - ".github/workflows/agent-paid-work-credential-request-review-queue-v1.yml"
      - ".github/workflows/agent-paid-work-credential-lifecycle-cli-v1.yml"
      - ".github/workflows/agent-paid-work-real-agent-handoff-v1.yml"
      - ".github/workflows/agent-paid-work-credential-registry-v1.yml"
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-lifecycle-v1.yml"
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-retirement-v1.yml"
      - ".github/workflows/agent-paid-work-credential-actions-v6-v1.yml"
      - "scripts/prove_agent_paid_work_credential_actions_v6_v1.mjs"

permissions:
  contents: read

concurrency:
  group: agent-paid-work-credential-actions-v6-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check proof syntax
        run: node --check scripts/prove_agent_paid_work_credential_actions_v6_v1.mjs
      - name: Prove credential workflow action generations
        run: node scripts/prove_agent_paid_work_credential_actions_v6_v1.mjs
