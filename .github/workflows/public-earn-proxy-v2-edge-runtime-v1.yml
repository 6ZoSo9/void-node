name: VOID public Earn PROXY-v2 edge runtime v1

on:
  pull_request:
    paths:
      - "tools/void-public-earn-proxy-v2-edge-contract-v1.mjs"
      - "tools/void-public-earn-proxy-v2-rate-state-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-source-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-edge-composition-v1.mjs"
      - "ops/public/void-public-earn-proxy-v2-edge-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs"
      - "scripts/prove_public_earn_proxy_v2_rate_state_v1.mjs"
      - "scripts/prove_public_earn_proxy_v2_edge_runtime_v1.mjs"
      - "docs/architecture/public-earn-proxy-v2-edge-runtime-v1.md"
      - ".github/workflows/public-earn-proxy-v2-edge-runtime-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: public Earn runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check focused source
        run: |
          node --check tools/void-public-earn-proxy-v2-edge-contract-v1.mjs
          node --check tools/void-public-earn-proxy-v2-rate-state-v1.mjs
          node --check ops/public/void-public-earn-proxy-v2-edge-v1.mjs
          node --check scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs
          node --check scripts/prove_public_earn_proxy_v2_rate_state_v1.mjs
          node --check scripts/prove_public_earn_proxy_v2_edge_runtime_v1.mjs

      - name: Re-prove source contract
        run: node scripts/prove_public_earn_proxy_v2_edge_contract_v1.mjs

      - name: Prove durable rate state
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-earn-rate-state-v1.txt"
          node scripts/prove_public_earn_proxy_v2_rate_state_v1.mjs | tee "$proof"
          grep -Fx 'VOID_PUBLIC_EARN_PROXY_V2_RATE_STATE_V1_GREEN' "$proof"
          grep -Fx 'claim_submit_buckets_independent=true' "$proof"
          grep -Fx 'source_port_rotation_does_not_reset_bucket=true' "$proof"
          grep -Fx 'source_a_exhaustion_does_not_deny_source_b=true' "$proof"
          grep -Fx 'concurrent_admission_serialized=true' "$proof"
          grep -Fx 'accepted_event_persisted_before_return=true' "$proof"
          grep -Fx 'restart_replay_preserved=true' "$proof"
          grep -Fx 'parent_namespace_substitution_rejected=true' "$proof"
          grep -Fx 'live_state_custody_proven=false' "$proof"
          grep -Fx 'work_credit_write=false' "$proof"
          grep -Fx 'funds_movement=false' "$proof"

      - name: Prove edge runtime
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-earn-edge-runtime-v1.txt"
          node scripts/prove_public_earn_proxy_v2_edge_runtime_v1.mjs | tee "$proof"
          grep -Fx 'VOID_PUBLIC_EARN_PROXY_V2_EDGE_RUNTIME_V1_GREEN' "$proof"
          grep -Fx 'proxy_v2_http_stream_bound=true' "$proof"
          grep -Fx 'header_body_handoff_bound=true' "$proof"
          grep -Fx 'exact_claim_submit_only=true' "$proof"
          grep -Fx 'durable_rate_debit_before_forward=true' "$proof"
          grep -Fx 'claim_submit_buckets_independent=true' "$proof"
          grep -Fx 'unauthenticated_submit_spam_outer_limited=true' "$proof"
          grep -Fx 'generic_mutation_route_forwarded=false' "$proof"
          grep -Fx 'restart_rate_state_preserved=true' "$proof"
          grep -Fx 'installed_listener_ownership_proven=false' "$proof"
          grep -Fx 'runtime_integration=false' "$proof"
          grep -Fx 'work_credit_write=false' "$proof"
          grep -Fx 'funds_movement=false' "$proof"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck -- --pretty false

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
