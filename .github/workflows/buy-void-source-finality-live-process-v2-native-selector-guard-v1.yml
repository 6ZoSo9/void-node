name: VOID Buy VOID V2 native selector guard

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "scripts/prove_buy_void_source_finality_live_process_v2_selector_guard_v1.mjs"
      - "docs/operators/buy-void-source-finality-live-process-v2-native-selector-guard-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-v2-native-selector-guard-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "scripts/prove_buy_void_source_finality_live_process_v2_selector_guard_v1.mjs"
      - "docs/operators/buy-void-source-finality-live-process-v2-native-selector-guard-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-v2-native-selector-guard-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Compile and prove native selector
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_live_process_v2_selector_guard_v1.mjs
          node scripts/prove_buy_void_source_finality_live_process_v2_selector_guard_v1.mjs |
            tee "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'VOID_BUY_VOID_V2_NATIVE_SELECTOR_GUARD_V1_PROOF_GREEN' "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'native_pidfd_owner=true' "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'manager_pid1_parent_required=true' "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'systemctl_user_selector_authority=false' "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'receipt_publication=false' "$RUNNER_TEMP/v2-native-selector.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/v2-native-selector.log"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}"
          git diff --check "$BASE" "$HEAD"
