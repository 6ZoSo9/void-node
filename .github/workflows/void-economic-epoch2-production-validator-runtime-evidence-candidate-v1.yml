name: VOID economic epoch2 production validator runtime evidence candidate v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-validator-runtime-evidence-candidate-v1.mjs"
      - "scripts/run_void_economic_epoch2_production_validator_runtime_evidence_v1.sh"
      - "scripts/void_epoch2_validator_freshness_requalification_v8.sh"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-runtime-evidence-candidate-v1.md"
      - "tools/void-economic-epoch2-production-validator-domain-enforcement-v1.mjs"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-runtime-evidence-v1.json"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-evidence-candidate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove per-host runtime evidence candidate source
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-runtime-evidence-candidate-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs
          bash -n scripts/run_void_economic_epoch2_production_validator_runtime_evidence_v1.sh
          bash -n scripts/void_epoch2_validator_freshness_requalification_v8.sh
          node scripts/prove_void_economic_epoch2_production_validator_runtime_evidence_candidate_v1.mjs

      - name: Diff hygiene
        run: git diff --check