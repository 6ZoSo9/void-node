name: VOID economic epoch2 replay runtime import promotion v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-gateway-replay-binding-runtime-evidence-import-v1.mjs"
      - "tools/void-economic-epoch2-cross-epoch-replay-protection-promotion-v1.mjs"
      - "scripts/prove_void_economic_epoch2_replay_runtime_import_promotion_v1.mjs"
      - "scripts/prove_void_economic_epoch2_committed_real_cross_epoch_replay_promotion_v1.mjs"
      - "scripts/prove_void_economic_epoch2_durable_replay_store_consume_equivalence_v1.mjs"
      - "ops/mainnet0/economic-epoch2-durable-replay-store-consume-equivalence-v1.json"
      - "ops/mainnet0/economic-epoch2-production-gateway-replay-binding-runtime-evidence-v1.json"
      - "ops/mainnet0/economic-epoch2-production-gateway-replay-binding-runtime-evidence-import-v1.json"
      - "ops/mainnet0/economic-epoch2-cross-epoch-replay-protection-promotion-v1.json"
      - "docs/operators/economic-epoch2-replay-runtime-import-promotion-v1.md"
      - ".github/workflows/void-economic-epoch2-replay-runtime-import-promotion-v1.yml"
      - "ops/mainnet0/economic-epoch2-production-gateway-replay-binding-v1.json"
      - "ops/mainnet0/economic-epoch2-durable-replay-store-v1.json"
      - "ops/mainnet0/economic-epoch2-production-gateway-replay-binding-runtime-evidence-contract-v1.json"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove replay runtime import and promotion
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-gateway-replay-binding-runtime-evidence-import-v1.mjs
          node --check tools/void-economic-epoch2-cross-epoch-replay-protection-promotion-v1.mjs
          node --check scripts/prove_void_economic_epoch2_durable_replay_store_consume_equivalence_v1.mjs
          node scripts/prove_void_economic_epoch2_durable_replay_store_consume_equivalence_v1.mjs
          node --check scripts/prove_void_economic_epoch2_replay_runtime_import_promotion_v1.mjs
          node scripts/prove_void_economic_epoch2_replay_runtime_import_promotion_v1.mjs

      - name: Prove committed real replay promotion
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_committed_real_cross_epoch_replay_promotion_v1.mjs
          node scripts/prove_void_economic_epoch2_committed_real_cross_epoch_replay_promotion_v1.mjs

      - name: Diff hygiene
        run: git diff --check
