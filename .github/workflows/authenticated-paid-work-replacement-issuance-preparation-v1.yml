name: Authenticated paid-work replacement issuance preparation v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-replacement-issuance-preparation-v1.yml"
      - "docs/operations/authenticated-paid-work-replacement-issuance-preparation-v1.md"
      - "docs/operations/authenticated-paid-work-replacement-issuance-evidence-binding-v1.md"
      - "fixtures/agents/authenticated-paid-work-replacement-issuance-preparation-v1.example.json"
      - "integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/**"
      - "schemas/authenticated-paid-work-replacement-issuance-preparation-v1.schema.json"
      - "scripts/prove_authenticated_paid_work_replacement_issuance_preparation_v1.mjs"
      - "scripts/prove_authenticated_paid_work_replacement_issuance_evidence_binding_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-replacement-issuance-preparation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/index.mjs
          node --check integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/evidence-binding-guard-v1.mjs
          node --check scripts/prove_authenticated_paid_work_replacement_issuance_preparation_v1.mjs
          node --check scripts/prove_authenticated_paid_work_replacement_issuance_evidence_binding_v1.mjs
      - name: Parse closed JSON artifacts
        run: |
          node -e 'const fs=require("node:fs"); for (const file of process.argv.slice(1)) JSON.parse(fs.readFileSync(file,"utf8"));' \
            integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/package.json \
            fixtures/agents/authenticated-paid-work-replacement-issuance-preparation-v1.example.json \
            schemas/authenticated-paid-work-replacement-issuance-preparation-v1.schema.json
      - name: Prove replacement issuance preparation
        run: node scripts/prove_authenticated_paid_work_replacement_issuance_preparation_v1.mjs
      - name: Prove replacement issuance evidence binding
        run: node scripts/prove_authenticated_paid_work_replacement_issuance_evidence_binding_v1.mjs
