name: VOID economic epoch2 production successor equivalence v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-successor-equivalence-evidence-v1.mjs"
      - "tools/void-economic-epoch2-production-successor-equivalence-promotion-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_successor_equivalence_v1.mjs"
      - "ops/precision/void_precision_epoch2_production_successor_equivalence_v1.sh"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-production-extra-data-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-state-equivalence-evidence-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - ".github/workflows/void-economic-epoch2-production-successor-equivalence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Check source package syntax
        run: |
          set -euo pipefail
          bash -n ops/precision/void_precision_epoch2_production_successor_equivalence_v1.sh
          node --check tools/void-economic-epoch2-production-successor-equivalence-evidence-v1.mjs
          node --check tools/void-economic-epoch2-production-successor-equivalence-promotion-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_successor_equivalence_v1.mjs

      - name: Prove production successor equivalence contract
        run: |
          set -euo pipefail
          node scripts/prove_void_economic_epoch2_production_successor_equivalence_v1.mjs

      - name: Verify runner authority boundary
        run: |
          set -euo pipefail
          runner=ops/precision/void_precision_epoch2_production_successor_equivalence_v1.sh
          grep -F -- '--p2p-enabled=false' "$runner"
          grep -F -- '--discovery-enabled=false' "$runner"
          grep -F -- '127.0.0.1:${RPC_PORT}' "$runner"
          grep -F 'production_rpc_contact=false' "$runner"
          grep -F 'authoritative_chain2050_write=false' "$runner"
          grep -F 'transaction_submission=false' "$runner"
          grep -F 'funds_movement=false' "$runner"
          ! grep -F 'systemctl ' "$runner"
          ! grep -F 'eth_sendRawTransaction' "$runner"
          ! grep -F 'eth_sendTransaction' "$runner"

      - name: Diff hygiene
        run: git diff --check
