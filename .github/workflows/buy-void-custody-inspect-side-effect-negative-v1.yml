name: VOID Buy VOID custody inspect side effect negative v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_launch_high_water_writer_v1.mjs"
      - "src/economic/buy_void_custody_launch_authority_v2.mjs"
      - "scripts/prove_buy_void_custody_inspect_side_effect_negative_v1.mjs"
      - ".github/workflows/buy-void-custody-inspect-side-effect-negative-v1.yml"
      - "docs/architecture/buy-void-custody-inspect-side-effect-negative-v1.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-inspect-negative-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact unmerged PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove checked-out source identity
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Node from exact matrix
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce inspector temp-file mutation and interleaving
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_custody_inspect_side_effect_negative_v1.mjs
          node scripts/prove_buy_void_custody_inspect_side_effect_negative_v1.mjs \
            | tee "inspect-negative-${{ matrix.node }}.txt"
          grep -Fx "READ_ONLY_INSPECT_DELETES_PRIVATE_TEMP_NEGATIVE_WITNESS_GREEN" \
            "inspect-negative-${{ matrix.node }}.txt"
          grep -Fx "INSPECT_CAN_DELETE_ACTIVE_WRITER_TEMP_NEGATIVE_WITNESS_GREEN" \
            "inspect-negative-${{ matrix.node }}.txt"
          grep -Fx "advance_aborted_without_high_water_change=true" \
            "inspect-negative-${{ matrix.node }}.txt"
          grep -Fx "production_allocation_mutation_ready=false" \
            "inspect-negative-${{ matrix.node }}.txt"
      - name: Upload reproducible negative observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-inspect-negative-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: inspect-negative-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Check commit hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  compare:
    needs: [negative]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve three exact-head negative receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-inspect-negative-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require byte-identical Node 22, 24, 26 results
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "receipts/inspect-negative-$v.txt"; done
          cmp receipts/inspect-negative-22.txt receipts/inspect-negative-24.txt
          cmp receipts/inspect-negative-22.txt receipts/inspect-negative-26.txt
          echo "VOID_BUY_VOID_CUSTODY_INSPECT_NEGATIVE_CROSS_NODE_GREEN"
          echo "production_allocation_mutation_ready=false"
          echo "funds_moved=false"
