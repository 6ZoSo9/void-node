permissions:
  contents: read


jobs:
  historical-refusal:
    name: historical V1 refusal / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current source
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Require current V2 and historical V1 refusal
        run: |
          set -euo pipefail
          echo "HISTORICAL_V1_REFUSAL_CURRENT_V2_DISPATCH_V4"

          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v1.mjs)" =             "d1cb550cf8f05692ca83114281cc35b2a6fe0cf1"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v1.json)" =             "6b2958bdb4dbb38354d5a4b41e5b4d1e919b6794"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v1.json)" =             "ff98ab6b3aaceea9c6ab921e8642a32a0fba79af"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v1.mjs)" =             "43074f083317a54520587ef70eaf3400255f3482"

          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v4.mjs --self-test

          set +e
          npx tsx scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v1.mjs             --derive > "$RUNNER_TEMP/historical-v1.stdout" 2> "$RUNNER_TEMP/historical-v1.stderr"
          status=$?
          set -e

          test "$status" -ne 0
          grep -Fq 'runtime_or_build_source_changed_after_hosted_census'             "$RUNNER_TEMP/historical-v1.stderr"

          echo "historical_v1_candidate_refused_current_v2_source=true"
          echo "frozen_v1_evidence_preserved=true"
          echo "current_v2_generation_verified=true"
          echo "public_presale_activation=false"
          echo "funds_movement=false"
