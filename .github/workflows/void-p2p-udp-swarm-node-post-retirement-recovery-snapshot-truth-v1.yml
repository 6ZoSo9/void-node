name: VOID P2P UDP swarm Node recovery snapshot truth v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-p2p-udp-swarm-node-post-retirement-recovery-snapshot-truth-v1.yml'
      - 'scripts/patch_void_p2p_udp_swarm_node_post_retirement_recovery_snapshot_truth_v1.py'
      - 'src/node_core.ts'
      - 'scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts'

permissions:
  contents: write

concurrency:
  group: void-p2p-udp-swarm-node-post-retirement-recovery-snapshot-truth-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.head.repo.full_name == '6ZoSo9/void-node' &&
      github.event.pull_request.head.ref == 'feat/p2p-udp-swarm-node-post-retirement-recovery-mount-v1-20260809' &&
      github.event.pull_request.base.ref == 'feat/p2p-udp-swarm-post-retirement-recovery-policy-v1-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard branch and detect hardening state
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          if grep -q 'active_recovery_network_attempts_started' src/node_core.ts; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 24
        if: steps.detect.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.detect.outputs.needed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply deterministic snapshot truth patch
        if: steps.detect.outputs.needed == 'true'
        run: python3 scripts/patch_void_p2p_udp_swarm_node_post_retirement_recovery_snapshot_truth_v1.py

      - name: Prove Node post-retirement recovery mount
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts

      - name: Re-prove recovery policy
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_post_retirement_recovery_policy_v1.ts

      - name: Re-prove Node relay retirement mount
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_relay_retirement_mount_v1.ts

      - name: Re-prove relay retirement executor
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_relay_retirement_executor_v1.ts

      - name: Re-prove Node direct-route health mount
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_direct_route_health_mount_v1.ts

      - name: Re-prove Node candidate promotion
        if: steps.detect.outputs.needed == 'true'
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Typecheck repository
        if: steps.detect.outputs.needed == 'true'
        run: npm run typecheck

      - name: Build repository
        if: steps.detect.outputs.needed == 'true'
        run: npm run build

      - name: Verify exact patch scope
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            'scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts' \
            'src/node_core.ts' > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit proven semantic hardening
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/node_core.ts \
            scripts/prove_void_p2p_udp_swarm_node_post_retirement_recovery_mount_v1.ts
          git diff --cached --check
          git commit -m 'fix: report UDP recovery attempt state truthfully'

      - name: Guard live branch then fast-forward publish
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_OLD="${{ github.event.pull_request.head.sha }}"
          LIVE="$(git ls-remote origin refs/heads/${{ github.event.pull_request.head.ref }} | awk '{print $1}')"
          test "$LIVE" = "$EXPECTED_OLD"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
