name: VOID Brood Queen Local Model Seat V1

on:
  pull_request:
    paths:
      - ".github/workflows/void-brood-queen-local-model-seat-v1.yml"
      - "docs/governance/void-brood-queen-local-model-seat-v1.md"
      - "fixtures/governance/void-brood-queen-local-model-seat-v1.json"
      - "scripts/prove_void_brood_queen_local_model_seat_v1.mjs"
      - "scripts/void_brood_queen_local_context_admission_v1.mjs"
      - "docs/governance/void-brood-queen-cryptographic-identity-contract-v1.md"
      - "fixtures/governance/void-brood-queen-cryptographic-identity-contract-v1.json"
      - "scripts/prove_void_brood_queen_cryptographic_identity_contract_v1.mjs"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "fixtures/governance/void-crown-brood-queen-command-layer-v1.json"
      - "scripts/prove_void_crown_brood_queen_command_layer_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-brood-queen-local-model-seat-v1.yml"
      - "docs/governance/void-brood-queen-local-model-seat-v1.md"
      - "fixtures/governance/void-brood-queen-local-model-seat-v1.json"
      - "scripts/prove_void_brood_queen_local_model_seat_v1.mjs"
      - "scripts/void_brood_queen_local_context_admission_v1.mjs"
      - "docs/governance/void-brood-queen-cryptographic-identity-contract-v1.md"
      - "fixtures/governance/void-brood-queen-cryptographic-identity-contract-v1.json"
      - "scripts/prove_void_brood_queen_cryptographic_identity_contract_v1.mjs"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "fixtures/governance/void-crown-brood-queen-command-layer-v1.json"
      - "scripts/prove_void_crown_brood_queen_command_layer_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-brood-queen-local-model-seat-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Syntax
        run: |
          node --check scripts/void_brood_queen_local_context_admission_v1.mjs
          node --check scripts/prove_void_brood_queen_cryptographic_identity_contract_v1.mjs
          node --check scripts/prove_void_crown_brood_queen_command_layer_v1.mjs
          node --check scripts/prove_void_brood_queen_local_model_seat_v1.mjs

      - name: Prove local model seat
        run: node scripts/prove_void_brood_queen_local_model_seat_v1.mjs

      - name: Prove committed-range hygiene contract
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene across committed change range
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
