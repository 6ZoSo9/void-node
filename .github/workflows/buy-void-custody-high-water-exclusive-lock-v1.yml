name: VOID Buy VOID custody exclusive lock v1 source-only

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_high_water_exclusive_lock_v1.mjs"
      - "scripts/prove_buy_void_custody_high_water_exclusive_lock_v1.mjs"
      - ".github/workflows/buy-void-custody-high-water-exclusive-lock-v1.yml"
      - "docs/architecture/buy-void-custody-high-water-exclusive-lock-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-exclusive-lock-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: custody exclusive lock / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact unmerged head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Verify syntax and test private lock contention
        run: |
          set -euo pipefail
          node --check src/economic/buy_void_custody_high_water_exclusive_lock_v1.mjs
          node --check scripts/prove_buy_void_custody_high_water_exclusive_lock_v1.mjs
          node scripts/prove_buy_void_custody_high_water_exclusive_lock_v1.mjs |
            tee "custody-lock-${{ matrix.node }}.txt"
          for proof in             real_child_process_contention_rejected=true             successful_release_directory_fsynced=true             same_uid_private_0700_required=true             private_mode_special_bits_rejected=true             symlink_private_root_rejected=true             stale_lock_auto_takeover=false             callback_failure_lock_retained=true             pre_release_failure_lock_retained=true             durable_release_success_requires_parent_fsync=true             post_rmdir_fsync_failure_lock_retention_guaranteed=false             release_failure_requires_separate_recovery_authority=true             failed_callback_lock_retained=true             async_callback_lock_retained=true             installed_custody_service_uid_qualified=false             cross_uid_ipc_authenticated=false             custody_high_water_writer_implemented=false             production_allocation_mutation_ready=false             funds_moved=false
          do grep -Fx "$proof" "custody-lock-${{ matrix.node }}.txt"; done
      - name: Upload exact-head synthetic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-custody-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: custody-lock-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Source diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [synthetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download three pinned receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-custody-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./proofs
      - name: Compare proof bytes across Node 22 24 and 26
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "proofs/custody-lock-$v.txt"; done
          cmp proofs/custody-lock-22.txt proofs/custody-lock-24.txt
          cmp proofs/custody-lock-22.txt proofs/custody-lock-26.txt
          echo "VOID_CUSTODY_EXCLUSIVE_LOCK_SOURCE_ONLY_CROSS_NODE_GREEN"
          echo "custody_high_water_writer_implemented=false"
          echo "production_allocation_mutation_ready=false"
