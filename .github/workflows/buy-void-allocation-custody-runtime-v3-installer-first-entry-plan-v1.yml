name: VOID Buy custody V3 installer first-entry plan v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-installer-first-entry-plan-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-installer-first-entry-plan-v1.yml"
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-installer-lock-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact first-entry plan successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="329134210c56930e684b2ffdffb45a7ee55fbfb9"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-installer-first-entry-plan-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-installer-first-entry-plan-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py)" = \
            "87f6f9766309bfe3d0b9c74625dbc48c6aa0e16d"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py)" = \
            "fde7840c7a520f275fc933de5ef0866314af87f5"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-installer-first-entry-plan-v1.md)" = \
            "2c410d92697860afc1106e46c18514d0e78656c5"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-installer-lock-v1.json)" = \
            "a1e1f4887787b408d313e73360966f93a63b2b58"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py

      - name: Self-test
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-entry-plan-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py \
            --self-test | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_INSTALLER_FIRST_ENTRY_PLAN_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'installer_lock_exact=true' \
            'accepted_installer_identity_bound=true' \
            'protected_snapshot_exact_four_files=true' \
            'static_native_first_instruction_required=true' \
            'closed_privileged_argv_required=true' \
            'closed_python_runtime_required=true' \
            'python_runtime_identity_selected=false' \
            'python_stdlib_import_closure_selected=false' \
            'first_entry_target_selected=true' \
            'first_entry_native_source_authored=false' \
            'protected_install_authorized=false' \
            'protected_source_installed=false' \
            'live_privileged_census_authorized=false' \
            'replacement_apply_authorized=false' \
            'production_plan_explicit_filesystem_write=false' \
            'production_plan_filesystem_write_free=false' \
            'production_plan_atime_write_possible=true' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Independent proof
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-entry-plan-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py \
            | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_INSTALLER_FIRST_ENTRY_PLAN_V1_PROOF_GREEN' "$out"
          for marker in \
            'exact_source_blob_asserted=true' \
            'installer_lock_exact=true' \
            'accepted_installer_identity_bound=true' \
            'protected_snapshot_exact_four_files=true' \
            'static_native_first_instruction_required=true' \
            'closed_python_runtime_required=true' \
            'python_runtime_identity_selected=false' \
            'python_stdlib_import_closure_selected=false' \
            'caller_selected_python_source_forbidden=true' \
            'caller_selected_installer_path_forbidden=true' \
            'caller_selected_destination_forbidden=true' \
            'closed_privileged_argv_required=true' \
            'python_no_bytecode_mode_required=true' \
            'without_dash_b_bootstrap_hold=true' \
            'root_execution_of_mutable_plan_forbidden=true' \
            'first_entry_target_selected=true' \
            'first_entry_native_source_authored=false' \
            'protected_install_authorized=false' \
            'protected_source_installed=false' \
            'live_privileged_census_authorized=false' \
            'replacement_apply_authorized=false' \
            'production_plan_explicit_filesystem_write=false' \
            'production_plan_filesystem_write_free=false' \
            'production_plan_atime_write_possible=true' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Inert plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/first-entry-plan.json"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_installer_first_entry_plan_v1.py \
            --plan > "$plan"

          python3 -I -B - "$plan" <<'PY'
          import json, pathlib, sys
          p=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert p["marker"]=="VOID_BUY_VOID_CUSTODY_RUNTIME_V3_INSTALLER_FIRST_ENTRY_PLAN_V1"
          assert p["protected_source_snapshot"]["exact_file_count"]==4
          assert p["native_first_instruction_contract"]["static_native_first_instruction_required"] is True
          assert p["python_child_contract"]["closed_python_runtime_required"] is True
          assert p["python_child_contract"]["python_runtime_identity_selected"] is False
          assert p["authority"]["first_entry_target_selected"] is True
          assert p["authority"]["protected_install_authorized"] is False
          assert p["authority"]["protected_source_installed"] is False
          assert p["authority"]["live_privileged_census_authorized"] is False
          assert p["authority"]["replacement_apply_authorized"] is False
          assert p["authority"]["funds_movement"] is False
          assert p["plan_id"].startswith("voidbuycustodyfirstentryplan1_")
          PY

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
