name: Buy VOID Epoch-2 authenticated credential live composition v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-composition-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-composition-v1.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-composition-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-composition-v1.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact reviewed source generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs)" =             "a1d2d715c860cf9c4d42bcbbf021436d3477c934"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs)" =             "469e70bdfbc6aaf30c7778e06caed9b14056506f"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py)" =             "5dec0f9534c3b2d6c8d4a0647e69d3c89ab91cd6"
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs)" =             "bb58ec88472b724e23aeccf65f44f4582c4a1440"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check runner and proof
        run: |
          set -euo pipefail
          node --check ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs
          node --check scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs

      - name: Prove source-only live runner
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-live-composition-proof.log"
          node scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v1.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_LIVE_COMPOSITION_V1_PROOF_GREEN"
            "root_git_object_entry_required=true"
            "root_repository_module_imports=false"
            "qualifier_exact_git_object_executed=true"
            "qualifier_worktree_execution=false"
            "qualifier_before_after_sealed_probe=true"
            "sealed_probe_exact_git_object_executed=true"
            "sealed_probe_runtime_uid_drop_required=true"
            "supplementary_groups_cleared=true"
            "no_new_privileges_child=true"
            "runner_parent_credential_content_access=false"
            "sealed_child_credential_content_access=true"
            "nontransaction_signature_only=true"
            "transaction=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
