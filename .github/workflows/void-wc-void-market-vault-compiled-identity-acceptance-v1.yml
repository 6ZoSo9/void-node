name: VOID WC/VOID market vault compiled identity acceptance v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-compiled-identity-acceptance-v1.yml"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_acceptance_v1.mjs"
      - "docs/operators/wc-void-market-vault-compiled-identity-acceptance-v1.md"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "docs/operators/wc-void-production-readiness-v1.md"
      - "contracts/mainnet/WCVoidMarketVaultV2.sol"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-market-vault-compiled-identity-acceptance-v1.yml"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_acceptance_v1.mjs"
      - "docs/operators/wc-void-market-vault-compiled-identity-acceptance-v1.md"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "docs/operators/wc-void-production-readiness-v1.md"
      - "contracts/mainnet/WCVoidMarketVaultV2.sol"
      - "tools/void-wc-void-market-vault-compiler-identity-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-wc-void-market-vault-compiled-identity-acceptance-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact accepted compiler identity
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-market-vault-compiled-identity-acceptance-v1.mjs
          node --check scripts/prove_void_wc_void_market_vault_compiled_identity_acceptance_v1.mjs
          node scripts/prove_void_wc_void_market_vault_compiled_identity_acceptance_v1.mjs

      - name: Verify production candidate binding remains fail closed
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-production-readiness-v1.mjs
          node --check scripts/prove_void_wc_void_production_readiness_v1.mjs
          node scripts/prove_void_wc_void_production_readiness_v1.mjs

      - name: Diff hygiene
        run: git diff --check
