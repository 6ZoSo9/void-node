name: Buy VOID Epoch-2 signed fulfillment envelope v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-epoch2-envelope-v2.yml"
      - "tools/void-buy-void-epoch2-postgres-source-qualification-v2.mjs"
      - "scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v2.mjs"
      - "docs/operators/buy-void-payment-keyed-epoch2-dormant-candidate-v2.md"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "src/economic/buy_void_epoch2_signer_control_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: E2 source successor / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate without stored Git credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check successor
        run: |
          set -euo pipefail
          node --check tools/void-buy-void-epoch2-postgres-source-qualification-v2.mjs
          node --check scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v2.mjs
      - name: Preserve frozen V1 source qualification
        run: node scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v1.mjs
      - name: Reprove accepted public signer evidence and V2 candidate
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs
          node scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs
      - name: Prove current Epoch-2 source successor V2
        run: node scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v2.mjs
      - name: Diff hygiene
        run: git diff --check
