name: Buy VOID dispatcher PostgreSQL production config v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-production-config-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-production-config-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-production-config-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-production-config-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove production PostgreSQL configuration boundary
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          npm run build
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts | tee "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_DISPATCHER_POSTGRES_PRODUCTION_CONFIG_V1_PROOF_GREEN' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'postgres_production_config_cases=25' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'production_connection_factory_present=false' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'package_pg_dependency_added=false' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'loopback_transport_only=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'tls_verify_full_required=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'systemd_credential_ids_fixed=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'database_url_secret_env_forbidden=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'closed_own_data_properties_required=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'credential_service_subdirectory_required=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'canonical_decimal_configuration_required=true' "$RUNNER_TEMP/postgres-production-config.log"
          grep -Fx 'libpq_environment_fallback_forbidden=true' "$RUNNER_TEMP/postgres-production-config.log"
          git diff --check
