name: VOID Epoch2 V6R3 collapse external admission v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-v6r3-collapse-external-admission-v1.yml"
      - "docs/architecture/buy-void-epoch2-v6r3-collapse-external-admission-v1.md"
      - "ops/security/buy-void-epoch2-v6r3-collapse-external-admission-v1.json"
      - "scripts/prove_buy_void_epoch2_v6r3_collapse_external_admission_v1.py"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml"
      - ".github/workflows/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.yml"
      - ".github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.yml"
      - ".github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.yml"
      - ".github/workflows/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.yml"
      - "docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md"
      - "docs/operators/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.md"
      - "docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.md"
      - "docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.md"
      - "docs/operators/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.md"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs"
      - "ops/precision/void_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py"
      - "ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py"
      - "ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json"
      - "scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py"
      - "scripts/prove_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_lock_v6r3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py"

permissions:
  contents: read

jobs:
  bootstrap:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'ci/epoch2-v6r3-collapse-external-admission-v1-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout admission candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind four-file bootstrap scope
        shell: bash
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE_REF" = "main"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"
          cat > "$RUNNER_TEMP/expected-bootstrap.txt" <<'EOF'
          A	.github/workflows/buy-void-epoch2-v6r3-collapse-external-admission-v1.yml
          A	docs/architecture/buy-void-epoch2-v6r3-collapse-external-admission-v1.md
          A	ops/security/buy-void-epoch2-v6r3-collapse-external-admission-v1.json
          A	scripts/prove_buy_void_epoch2_v6r3_collapse_external_admission_v1.py
          EOF
          sort "$RUNNER_TEMP/expected-bootstrap.txt" -o "$RUNNER_TEMP/expected-bootstrap.txt"
          git diff --name-status "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" -- | sort > "$RUNNER_TEMP/actual-bootstrap.txt"
          diff -u "$RUNNER_TEMP/expected-bootstrap.txt" "$RUNNER_TEMP/actual-bootstrap.txt"
          git diff --check "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" --

      - name: Exercise object matcher without admission authority
        shell: bash
        env:
          TARGET_BRANCH: ren/epoch2-v6r3-stack-collapse-current-main-v1-20261020
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          candidate="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          out="$RUNNER_TEMP/epoch2-collapse-bootstrap.txt"
          python3 -I -B scripts/prove_buy_void_epoch2_v6r3_collapse_external_admission_v1.py \
            --candidate "$candidate" | tee "$out"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_V6R3_COLLAPSE_EXTERNAL_ADMISSION_V1_GREEN' "$out"
          grep -Fx 'candidate_objects_match_manifest=true' "$out"
          grep -Fx 'protected_host_install=false' "$out"
          grep -Fx 'payment_acceptance=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"
          echo 'bootstrap_test_only=true'
          echo 'trusted_target_admission=false'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  trusted-admit:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.ref == 'ren/epoch2-v6r3-stack-collapse-current-main-v1-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate as Git-object input only
        shell: bash
        env:
          TARGET_BRANCH: ren/epoch2-v6r3-stack-collapse-current-main-v1-20261020
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE_REF" = "main"
          test "$(git rev-parse HEAD)" = "$EVENT_BASE_SHA"
          git fetch --no-tags --prune origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          candidate="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$candidate" = "$EVENT_HEAD_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$candidate"
          cat > "$RUNNER_TEMP/expected-target.txt" <<'EOF'
          A	.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml
          A	.github/workflows/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.yml
          A	.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.yml
          A	.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.yml
          A	.github/workflows/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.yml
          A	docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md
          A	docs/operators/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.md
          A	docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.md
          A	docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.md
          A	docs/operators/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.md
          A	ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs
          A	ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c
          A	ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs
          A	ops/precision/void_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py
          A	ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py
          A	ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json
          A	scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py
          A	scripts/prove_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py
          A	scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_lock_v6r3.py
          A	scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py
          A	scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py
          EOF
          sort "$RUNNER_TEMP/expected-target.txt" -o "$RUNNER_TEMP/expected-target.txt"
          git diff --name-status "$EVENT_BASE_SHA" "$candidate" -- | sort > "$RUNNER_TEMP/actual-target.txt"
          diff -u "$RUNNER_TEMP/expected-target.txt" "$RUNNER_TEMP/actual-target.txt"
          git diff --check "$EVENT_BASE_SHA" "$candidate" --
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Prove trusted external object admission
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/epoch2-collapse-trusted-admission.txt"
          python3 -I -B scripts/prove_buy_void_epoch2_v6r3_collapse_external_admission_v1.py \
            --candidate "$candidate" | tee "$out"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_V6R3_COLLAPSE_EXTERNAL_ADMISSION_V1_GREEN' "$out"
          grep -Fx 'path_count=21' "$out"
          grep -Fx 'inherited_count=17' "$out"
          grep -Fx 'adapted_count=4' "$out"
          grep -Fx 'adapted_workflow_blob=3d1f8cc8a0d377063c9dd3ca3509648d3a859ec5' "$out"
          grep -Fx 'candidate_objects_match_manifest=true' "$out"
          grep -Fx 'protected_host_install=false' "$out"
          grep -Fx 'payment_acceptance=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"
          echo 'trusted_target_admission=true'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
