name: Ops Guards (proposer loop)
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure proposer loop unit exists in repo
        run: test -f ops/systemd/user/void-proposer-loop.service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove proposer seal rejection containment
        run: npx tsx scripts/prove_proposer_seal_rejection_containment_v1.ts

      - name: Prove sealBlockCommitOnce true dry run
        run: npx tsx scripts/prove_seal_block_commit_once_true_dry_run_v1.ts

      - name: Prove sealBlockCommitOnce mutation method guard
        run: npx tsx scripts/prove_seal_block_commit_once_mutation_method_guard_v1.ts

      - name: Prove sealBlockOnce mutation method and confirmation guard
        run: npx tsx scripts/prove_seal_block_once_mutation_method_confirmation_guard_v1.ts
