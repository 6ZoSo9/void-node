name: VOID sponsored host trusted clock binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-sponsored-host-trusted-clock-binding-v1.yml"
      - "docs/operators/economic-sponsored-host-trusted-clock-binding-v1.md"
      - "scripts/prove_void_economic_sponsored_host_trusted_clock_binding_v1.mjs"
      - "tools/void-economic-sponsored-host-trusted-clock-binding-v1.mjs"
      - "tools/void-economic-sponsored-host-time-sync-evidence-v1.mjs"
      - "tools/void-economic-system-sponsored-observation-time-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-sponsored-host-trusted-clock-binding-v1.yml"
      - "docs/operators/economic-sponsored-host-trusted-clock-binding-v1.md"
      - "scripts/prove_void_economic_sponsored_host_trusted_clock_binding_v1.mjs"
      - "tools/void-economic-sponsored-host-trusted-clock-binding-v1.mjs"
      - "tools/void-economic-sponsored-host-time-sync-evidence-v1.mjs"
      - "tools/void-economic-system-sponsored-observation-time-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-sponsored-host-trusted-clock-binding-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check tools/void-economic-sponsored-host-trusted-clock-binding-v1.mjs
          node --check scripts/prove_void_economic_sponsored_host_trusted_clock_binding_v1.mjs

      - name: Prove host trusted-clock source binding
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sponsored-host-trusted-clock-binding-v1.txt"
          node scripts/prove_void_economic_sponsored_host_trusted_clock_binding_v1.mjs | tee "$out"
          grep -Fx 'VOID_ECONOMIC_SPONSORED_HOST_TRUSTED_CLOCK_BINDING_V1_PROOF_GREEN' "$out"
          grep -Fx 'fixed_host_time_sync_collector_required=true' "$out"
          grep -Fx 'fixed_process_stat_source=true' "$out"
          grep -Fx 'process_identity_bracketed_around_host_capture=true' "$out"
          grep -Fx 'observation_time_sample_shape_proven=true' "$out"
          grep -Fx 'production_host_sample_collected_in_ci=false' "$out"
          grep -Fx 'trusted_clock_runtime_authority=false' "$out"
          grep -Fx 'cross_process_restart_continuity_proven=false' "$out"
          grep -Fx 'transaction_submission=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Preserve parent source contracts
        run: |
          node scripts/prove_void_economic_sponsored_host_time_sync_evidence_v1.mjs
          node scripts/prove_void_economic_system_sponsored_observation_time_v1.mjs

      - name: Verify source tree cleanliness
        run: test -z "$(git status --short)"

      - name: Diff hygiene
        run: git diff --check
