name: VOID AI Agent Bootstrap Response Bounds V1

on:
  pull_request:
    paths:
      - "tools/void-ai-agent-bootstrap-client-v1.mjs"
      - "scripts/prove_void_ai_agent_bootstrap_client_v1.mjs"
      - "scripts/prove_void_ai_agent_bootstrap_response_bounds_v1.mjs"
      - "docs/public/ai-agent-bootstrap-client-v1.md"
      - ".github/workflows/void-ai-agent-bootstrap-response-bounds-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-ai-agent-bootstrap-client-v1.mjs"
      - "scripts/prove_void_ai_agent_bootstrap_client_v1.mjs"
      - "scripts/prove_void_ai_agent_bootstrap_response_bounds_v1.mjs"
      - "docs/public/ai-agent-bootstrap-client-v1.md"
      - ".github/workflows/void-ai-agent-bootstrap-response-bounds-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-ai-agent-bootstrap-client-v1.mjs
          node --check scripts/prove_void_ai_agent_bootstrap_client_v1.mjs
          node --check scripts/prove_void_ai_agent_bootstrap_response_bounds_v1.mjs
      - name: Preserve canonical bootstrap client contract
        run: node scripts/prove_void_ai_agent_bootstrap_client_v1.mjs
      - name: Prove pre-buffer response bounds
        run: node scripts/prove_void_ai_agent_bootstrap_response_bounds_v1.mjs
      - name: Verify CLI help
        run: node tools/void-ai-agent-bootstrap-client-v1.mjs --help
