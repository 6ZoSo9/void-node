name: participant-readonly-session-v1

on:
  pull_request:
    paths:
      - ".github/workflows/participant-readonly-session-v1.yml"
      - "docs/security/participant-readonly-session-v1.md"
      - "src/security/participant_readonly_session_v1.ts"
      - "scripts/prove_participant_readonly_session_v1.ts"
      - "src/security/chain2050_role_authority_record_v1.ts"
      - "src/security/chain2050_role_authority_read_adapter_v1.ts"
      - "src/security/chain2050_role_authority_registry_read_source_binding_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/participant-readonly-session-v1.yml"
      - "docs/security/participant-readonly-session-v1.md"
      - "src/security/participant_readonly_session_v1.ts"
      - "scripts/prove_participant_readonly_session_v1.ts"
      - "src/security/chain2050_role_authority_record_v1.ts"
      - "src/security/chain2050_role_authority_read_adapter_v1.ts"
      - "src/security/chain2050_role_authority_registry_read_source_binding_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: participant-readonly-session-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove participant read-only session v1
        run: npx --no-install tsx scripts/prove_participant_readonly_session_v1.ts

      - name: Typecheck repository
        if: matrix.node == 24
        run: npm run typecheck
