name: VOID replay Nimo compare handler bounded upgrade v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-live-read-replay-nimo-compare-handler-upgrade-v1.sh"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_nimo_compare_handler_upgrade_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-live-read-replay-nimo-compare-handler-upgrade-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-live-read-replay-nimo-compare-handler-upgrade-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-nimo-compare-handler-upgrade-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: source-only Nimo compare handler upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind checkout SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Check Bash syntax
        run: bash -n tools/void-buy-allocation-custody-witness-live-read-replay-nimo-compare-handler-upgrade-v1.sh
      - name: Prove bounded upgrade source only
        run: node scripts/prove_buy_void_allocation_custody_witness_live_read_replay_nimo_compare_handler_upgrade_v1.mjs
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
