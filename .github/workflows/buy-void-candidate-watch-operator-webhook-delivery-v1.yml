name: Buy VOID candidate-watch operator webhook delivery V1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-candidate-watch-operator-webhook-delivery-v1.yml"
      - "docs/operators/buy-void-candidate-watch-operator-webhook-delivery-v1.md"
      - "examples/systemd/void-buy-void-candidate-watch-operator-webhook-delivery-v1.*"
      - "fixtures/buy-void/candidate-operator-webhook-delivery-config-v1.example.json"
      - "schemas/buy-void-candidate-operator-*.schema.json"
      - "scripts/buy_void_candidate_watch_operator_webhook_delivery_v1.ts"
      - "scripts/prove_buy_void_candidate_watch_operator_webhook_delivery*.ts"
      - "src/economic/buy_void_candidate_watch_operator_webhook_delivery_v1.ts"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_candidate_watch_operator_webhook_delivery_v1.ts \
            scripts/prove_buy_void_candidate_watch_operator_webhook_delivery_v1.ts \
            scripts/prove_buy_void_candidate_watch_operator_webhook_delivery_guard_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_buy_void_candidate_watch_operator_webhook_delivery_v1.ts
      - run: ./node_modules/.bin/tsx scripts/prove_buy_void_candidate_watch_operator_webhook_delivery_guard_v1.ts
      - run: npm run build
