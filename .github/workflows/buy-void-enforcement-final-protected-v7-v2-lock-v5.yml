name: VOID Buy VOID protected V5 enforcement lock

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v5.yml"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v5.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v5.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v5.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v5.yml"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact lock head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and five-add scope
        shell: bash
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=2e2688b3883ca7ef718526a0202b75554145554a
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'A\t.github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v5.yml'
            $'A\tdocs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v5.md'
            $'A\tops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v5.json'
            $'A\tops/security/buy-void-enforcement-final-protected-v7-v2-lock-v5.json'
            $'A\tscripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs'
          )
          test "\${#actual[@]}" -eq "\${#expected[@]}"
          for i in "\${!expected[@]}"; do test "\${actual[$i]}" = "\${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: \${{ matrix.node }}

      - name: Bind exact V5 candidate and lock sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v5.json)" = "46e3774ca442cf593d25b6062ab5538d5ac43611"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v5.json)" = "bc1b2f4095315861db7a257d4cc3c80a9f112530"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs)" = "106c6ccf6da0ecaa202dd2ba26e707b125844612"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v5.md)" = "db8078d52e5b6d29d847cb8e4ccc1dab25fcec01"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs)" = "a0c34ad442d0bac812af67861617cb25c6321ada"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v5.yml)" = "f58b7314797d32f30c17841b703a2f19c63b03a6"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json)" = "854b9e39772e1e930c63b71e1099509df0f2dbf8"
          test "$(git rev-parse HEAD:ops/run-void-node-live-v1.sh)" = "d7d7aede7fcd764a6182bd31f12338c5d3674ecb"

      - name: Syntax
        run: node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs

      - name: Descriptor-reader adversarial self-test
        run: node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs --reader-self-test

      - name: Derive and verify V5 lock twice
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lock-v5-node-\${{ matrix.node }}.json"
          AGAIN="$RUNNER_TEMP/lock-v5-node-\${{ matrix.node }}.again.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs --derive > "$OUT"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs --derive > "$AGAIN"
          cmp "$OUT" "$AGAIN"
          cmp "$OUT" ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v5.json
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs --self-test
          sha256sum "$OUT"

      - name: Upload exact V5 lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v5-lock-\${{ github.event.pull_request.head.sha || github.sha }}-node-\${{ matrix.node }}
          path: \${{ runner.temp }}/lock-v5-node-\${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact lock head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Download Node-major locks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v5-lock-\${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require cross-node byte identity and independent rederivation
        shell: bash
        run: |
          set -euo pipefail
          cmp receipts/lock-v5-node-22.json receipts/lock-v5-node-24.json
          cmp receipts/lock-v5-node-22.json receipts/lock-v5-node-26.json
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v5.mjs --derive > "$RUNNER_TEMP/rederived-lock-v5.json"
          cmp receipts/lock-v5-node-22.json "$RUNNER_TEMP/rederived-lock-v5.json"
          cmp receipts/lock-v5-node-22.json ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v5.json
          node - <<'NODE'
          const fs=require("node:fs");
          const v=JSON.parse(fs.readFileSync("receipts/lock-v5-node-22.json","utf8"));
          if(v.marker!=="VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V5")process.exit(2);
          if(v.candidate_evidence?.candidate_enforcement_set_sha256!=="e72f512b0006eef7cec7325f39c56823eb3c878d7f8452a08c717478b7c8ac45")process.exit(3);
          if(v.candidate_enforcement_identity_accepted!==true)process.exit(4);
          if(v.deployed_artifact_generation_verified!==false)process.exit(5);
          if(v.runtime_mount_authority!==false)process.exit(6);
          if(v.production_source_finality_authority_ready!==false)process.exit(7);
          if(v.deployment_receipt_reissue_required!==true)process.exit(8);
          if(v.public_presale_activation!==false)process.exit(9);
          if(v.funds_movement!==false)process.exit(10);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V5_CROSS_NODE_GREEN");
          NODE
