name: Buy VOID Epoch-2 authenticated credential signer-control binding v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-authenticated-credential-signer-control-binding-v2.yml"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-signer-control-binding-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_live_binding_v2.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-authenticated-credential-signer-control-binding-v2.yml"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-signer-control-binding-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_live_binding_v2.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-authenticated-credential-signer-control-binding-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax and inert composition surfaces
        run: |
          set -euo pipefail
          node --check             ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs
          node --check             scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs
          SOURCE="$(git show HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs)"
          printf '%s' "$SOURCE" | node --input-type=module - --self-test             | tee "$RUNNER_TEMP/self-test-${{ matrix.node }}.txt"
          printf '%s' "$SOURCE" | node --input-type=module - --plan             | tee "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx             'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_SIGNER_CONTROL_BINDING_V2_SELF_TEST_GREEN'             "$RUNNER_TEMP/self-test-${{ matrix.node }}.txt"
          grep -Fx 'runner_root_execution_forbidden=true'             "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx 'protected_v2_binder_child_required=true'             "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"

      - name: Prove protected signer-control composition
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/signer-control-binding-v2-${{ matrix.node }}.txt"
          node scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs             | tee "$OUT"
          for marker in             'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_SIGNER_CONTROL_BINDING_V2_PROOF_GREEN'             'runner_git_object_entry_required=true'             'runner_unprivileged=true'             'runner_root_execution_forbidden=true'             'protected_v2_binder_child_required=true'             'protected_first_entry_provenance_required=true'             'arbitrary_credential_binding_receipt_input_accepted=false'             'exact_credential_binding_child_required=true'             'accepted_signer_control_candidate_bound=true'             'accepted_signer_control_evidence_bound=true'             'accepted_signer_control_tool_and_proofs_pinned=true'             'candidate_lineage_crosscheck=true'             'closing_checkout_revalidation_before_receipt=true'             'signer_offchain_control_proven_on_combined_receipt=true'             'systemd_credential_identity_proven_on_combined_receipt=true'             'active_signing_capability_proven_on_combined_receipt=true'             'transaction_signing_proven=false'             'customer_safe_to_pay=false'             'transaction=false'             'payment_acceptance=false'             'public_presale_activation=false'             'funds_movement=false'
          do
            grep -Fx "$marker" "$OUT"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1)"
