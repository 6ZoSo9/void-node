name: Buy VOID dispatcher PostgreSQL credential binding v1

on:
  pull_request:
    paths:
      - "ops/systemd/void-node-live.service.d/92-buy-void-dispatcher-postgres-credentials-v1.conf.example"
      - "scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts"
      - "docs/operators/buy-void-dispatcher-postgres-credential-binding-v1.md"
      - ".github/workflows/buy-void-dispatcher-postgres-credential-binding-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
  push:
    branches: [main]
    paths:
      - "ops/systemd/void-node-live.service.d/92-buy-void-dispatcher-postgres-credentials-v1.conf.example"
      - "scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts"
      - "docs/operators/buy-void-dispatcher-postgres-credential-binding-v1.md"
      - ".github/workflows/buy-void-dispatcher-postgres-credential-binding-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          set -euo pipefail
          npm run typecheck
          node --import tsx scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts | tee "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'VOID_BUY_VOID_DISPATCHER_POSTGRES_CREDENTIAL_BINDING_V1_PROOF_GREEN' "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'loadcredential_bindings=2' "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'credential_contents_in_repo=false' "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'database_url_env=false' "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'pgpassword_env=false' "$RUNNER_TEMP/postgres-credential-binding.log"
          grep -Fx 'runtime_activation=false' "$RUNNER_TEMP/postgres-credential-binding.log"
          git diff --check
