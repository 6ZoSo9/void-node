name: VOID Sovereign Key Role Registry v1

on:
  pull_request:
    paths:
      - "docs/governance/void-sovereign-key-role-registry-v1.md"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "docs/governance/void-sovereign-authentication-activation-guard-v1.md"
      - "fixtures/governance/void-sovereign-key-role-registry-v1.json"
      - "scripts/prove_void_sovereign_key_role_registry_v1.mjs"
      - ".github/workflows/void-sovereign-key-role-registry-v1.yml"
  push:
    paths:
      - "docs/governance/void-sovereign-key-role-registry-v1.md"
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "docs/governance/void-sovereign-authentication-activation-guard-v1.md"
      - "fixtures/governance/void-sovereign-key-role-registry-v1.json"
      - "scripts/prove_void_sovereign_key_role_registry_v1.mjs"
      - ".github/workflows/void-sovereign-key-role-registry-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node scripts/prove_void_sovereign_key_role_registry_v1.mjs
