name: node-compatibility-repository-contract-v2

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "src/package.json"
      - "run-void-node.sh"
      - "void-participant.sh"
      - "scripts/prove_node22_repository_contract_v1.mjs"
      - "scripts/prove_void_node_clone_and_run_v1.mjs"
      - "scripts/prove_public_earn_validator_onboarding_v1.mjs"
      - "docs/public/clone-and-run-v1.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".nvmrc"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "src/package.json"
      - "run-void-node.sh"
      - "void-participant.sh"
      - "scripts/prove_node22_repository_contract_v1.mjs"
      - "scripts/prove_void_node_clone_and_run_v1.mjs"
      - "scripts/prove_public_earn_validator_onboarding_v1.mjs"
      - "docs/public/clone-and-run-v1.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: node-compatibility-repository-contract-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove repository compatibility contract
        run: node scripts/prove_node22_repository_contract_v1.mjs

      - name: Prove clone-and-run static contract
        run: node scripts/prove_void_node_clone_and_run_v1.mjs

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
