name: Buy VOID V7 static Python runtime generation proof v1

on:
  pull_request:
    paths:
      - '.github/workflows/buy-void-v7-static-python-runtime-generation-proof-v1.yml'
      - 'docs/operators/buy-void-v7-static-python-runtime-generation-proof-v1.md'
      - 'ops/precision/void_buy_void_v7_static_python_runtime_generation_proof_v1.py'
      - 'scripts/prove_buy_void_v7_static_python_runtime_generation_proof_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-v7-static-python-runtime-generation-proof-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FALLBACK_BASE: 0d93be0a7ae1395449a386d4fbe14bb680f51c3f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
            test -n "$BASE"
            test "$(git merge-base "$BASE" "$EXPECTED_HEAD")" = "$BASE"
            cat > "$RUNNER_TEMP/expected-delta" <<'EOF'
          A	.github/workflows/buy-void-v7-static-python-runtime-generation-proof-v1.yml
          A	docs/operators/buy-void-v7-static-python-runtime-generation-proof-v1.md
          A	ops/precision/void_buy_void_v7_static_python_runtime_generation_proof_v1.py
          A	scripts/prove_buy_void_v7_static_python_runtime_generation_proof_v1.py
          EOF
            git diff --name-status "$BASE" "$EXPECTED_HEAD" -- | sort > "$RUNNER_TEMP/actual-delta"
            sort "$RUNNER_TEMP/expected-delta" > "$RUNNER_TEMP/expected-delta.sorted"
            diff -u "$RUNNER_TEMP/expected-delta.sorted" "$RUNNER_TEMP/actual-delta"
            git diff --check "$BASE" "$EXPECTED_HEAD" --
          else
            BASE="$FALLBACK_BASE"
            git merge-base --is-ancestor "$BASE" "$EXPECTED_HEAD"
            git diff --check "$BASE" "$EXPECTED_HEAD" --
          fi
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_static_python_runtime_generation_proof_v1.py)" = "18299de23193f0ab98dca0a2fe50e55376f3b1b1"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_static_python_runtime_generation_proof_v1.py)" = "740771799fdd2a7648e4c3d92311a115c02f2080"
          test "$(git rev-parse HEAD:docs/operators/buy-void-v7-static-python-runtime-generation-proof-v1.md)" = "e9f364b96478d550cd34ded9deea7b5653669984"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_protected_substrate_install_v5.py)" = "632f3371ad3095e6a8fdf338b24c34431abe7d2c"

      - name: Python syntax
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          for rel in (
              "ops/precision/void_buy_void_v7_static_python_runtime_generation_proof_v1.py",
              "scripts/prove_buy_void_v7_static_python_runtime_generation_proof_v1.py",
          ):
              raw = Path(rel).read_bytes()
              compile(raw, rel, "exec", dont_inherit=True, optimize=0)
          PY

      - name: Source self-test
        run: |
          python3 -I -B ops/precision/void_buy_void_v7_static_python_runtime_generation_proof_v1.py --self-test

      - name: Focused source proof
        run: |
          python3 -I -B scripts/prove_buy_void_v7_static_python_runtime_generation_proof_v1.py
