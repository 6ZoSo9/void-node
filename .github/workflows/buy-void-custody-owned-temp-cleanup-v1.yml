name: VOID Buy VOID custody exclusive temp ownership v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_launch_high_water_writer_v1.mjs"
      - "scripts/prove_buy_void_custody_owned_temp_cleanup_v1.mjs"
      - "docs/architecture/buy-void-custody-owned-temp-cleanup-v1.md"
      - ".github/workflows/buy-void-custody-owned-temp-cleanup-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-owned-temp-v1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Exact-head checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
      - name: Node setup
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove unowned temp survives exclusive create collision
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_custody_owned_temp_cleanup_v1.mjs
          node scripts/prove_buy_void_custody_owned_temp_cleanup_v1.mjs \
            | tee "custody-owned-temp-${{ matrix.node }}.txt"
          for marker in \
            'VOID_BUY_VOID_CUSTODY_OWNED_TEMP_CLEANUP_V1_GREEN' \
            'writer_source_git_blob_verified=true' \
            'preexisting_private_temp_EEXIST_rejected=true' \
            'preexisting_private_temp_bytes_and_inode_preserved=true' \
            'unowned_temp_unlink_calls=0' \
            'unowned_temp_fsync_calls=0' \
            'owned_failed_temp_cleanup_verified=true' \
            'exclusive_creation_required_before_cleanup=true' \
            'cross_process_exclusive_writer_fence_verified=false' \
            'production_allocation_mutation_ready=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "custody-owned-temp-${{ matrix.node }}.txt"
          done
      - name: Require clean source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Upload deterministic negative receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-owned-temp-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: custody-owned-temp-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all three exact-head receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-owned-temp-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./proof
      - name: Require Node 22 24 26 byte equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "proof/custody-owned-temp-$node.txt"
          done
          cmp proof/custody-owned-temp-22.txt proof/custody-owned-temp-24.txt
          cmp proof/custody-owned-temp-22.txt proof/custody-owned-temp-26.txt
          echo "VOID_BUY_VOID_CUSTODY_UNOWNED_TEMP_THREE_NODE_GREEN"
          echo "cross_process_exclusive_writer_fence_verified=false"
          echo "production_allocation_mutation_ready=false"
          echo "funds_movement=false"
