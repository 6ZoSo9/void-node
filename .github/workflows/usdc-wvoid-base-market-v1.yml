name: USDC wVOID Base market v1

on:
  pull_request:
    paths:
      - "src/economic/usdc_wvoid_base_market_v1.ts"
      - "scripts/prove_usdc_wvoid_base_market_v1.ts"
      - "docs/architecture/usdc-wvoid-base-market-v1.md"
      - ".github/workflows/usdc-wvoid-base-market-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/prove_usdc_wvoid_base_market_v1.ts
      - run: npm run build
