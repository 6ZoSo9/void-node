name: PR1208 bounded CI fix carrier

on:
  push:
    branches:
      - feat/multipath-public-bootstrap-launcher-v1-20260811
    paths:
      - 'ops/tmp/pr1208-ci-fix.patch'
      - '.github/workflows/pr1208-bounded-ci-fix-carrier.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/multipath-public-bootstrap-launcher-v1-20260811
          fetch-depth: 0
      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/tmp/pr1208-ci-fix.patch
          grep -Fq 'test "${VOID_PUBLIC_BOOTSTRAP_REQUIRE:-0}" != 1' ops/tmp/pr1208-ci-fix.patch
          grep -Fq 'canonical_manifest_published=false' ops/tmp/pr1208-ci-fix.patch
          git apply --check ops/tmp/pr1208-ci-fix.patch
          git apply ops/tmp/pr1208-ci-fix.patch
          bash -n run-void-node.sh
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/prove_void_multipath_public_bootstrap_supervisor_v1.mjs
          npx --no-install tsx scripts/prove_void_public_bootstrap_client_resilience_v1.mjs
          git diff --check
      - name: Remove carrier and publish repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f ops/tmp/pr1208-ci-fix.patch
          rm -f .github/workflows/pr1208-bounded-ci-fix-carrier.yml
          git add run-void-node.sh .github/workflows/void-multipath-public-bootstrap-supervisor-v1.yml
          git add -u ops/tmp/pr1208-ci-fix.patch .github/workflows/pr1208-bounded-ci-fix-carrier.yml
          expected=".github/workflows/void-multipath-public-bootstrap-supervisor-v1.yml
          run-void-node.sh"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: settle multipath bootstrap CI contracts'
          git push origin HEAD:feat/multipath-public-bootstrap-launcher-v1-20260811
