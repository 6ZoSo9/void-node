name: Authenticated Paid Work Production Activation Configuration Schema v1

on:
  pull_request:
    paths:
      - .github/workflows/authenticated-paid-work-production-activation-configuration-schema-v1.yml
      - docs/operations/authenticated-paid-work-production-activation-configuration-schema-v1.md
      - schemas/authenticated-paid-work-production-activation-configuration-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_configuration_schema_v1.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/authenticated-paid-work-production-activation-configuration-schema-v1.yml
      - docs/operations/authenticated-paid-work-production-activation-configuration-schema-v1.md
      - schemas/authenticated-paid-work-production-activation-configuration-v1.schema.json
      - scripts/prove_authenticated_paid_work_production_activation_configuration_schema_v1.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-production-activation-configuration-schema-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove fail-closed production configuration schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bind Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse production configuration schema
        run: node -e 'JSON.parse(require("node:fs").readFileSync("schemas/authenticated-paid-work-production-activation-configuration-v1.schema.json", "utf8"))'

      - name: Prove schema compatibility and non-authority
        run: node scripts/prove_authenticated_paid_work_production_activation_configuration_schema_v1.mjs
