name: void-public-origin-binding-seed-service-plan-v1

on:
  pull_request:
    paths:
      - "tools/void-public-origin-binding-seed-service-plan-v1.mjs"
      - "scripts/prove_void_public_origin_binding_seed_service_plan_v1.mjs"
      - "tools/void-public-origin-binding-activation-packet-v1.mjs"
      - "ops/public/void-public-origin-binding-serving-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
      - "scripts/build_void_public_seed_named_tunnel_packet_v1.mjs"
      - "ops/public/install_void_public_seed_named_tunnel_packet_v1.sh"
      - "scripts/render_void_public_checkpoint_environment_compat_dropin_v1.mjs"
      - "docs/public-node/void-public-origin-binding-seed-service-plan-v1.md"
      - ".github/workflows/void-public-origin-binding-seed-service-plan-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-public-origin-binding-seed-service-plan-v1.mjs"
      - "scripts/prove_void_public_origin_binding_seed_service_plan_v1.mjs"
      - "tools/void-public-origin-binding-activation-packet-v1.mjs"
      - "ops/public/void-public-origin-binding-serving-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
      - "scripts/build_void_public_seed_named_tunnel_packet_v1.mjs"
      - "ops/public/install_void_public_seed_named_tunnel_packet_v1.sh"
      - "scripts/render_void_public_checkpoint_environment_compat_dropin_v1.mjs"
      - "docs/public-node/void-public-origin-binding-seed-service-plan-v1.md"
      - ".github/workflows/void-public-origin-binding-seed-service-plan-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-public-origin-binding-seed-service-plan-v1.mjs
          node --check tools/void-public-seed-gateway-v1.mjs
          node --check scripts/prove_void_public_origin_binding_seed_service_plan_v1.mjs
      - name: Seed-service plan proof
        run: node scripts/prove_void_public_origin_binding_seed_service_plan_v1.mjs
      - name: Activation packet regression
        run: node scripts/prove_void_public_origin_binding_activation_packet_v1.mjs
      - name: Diff hygiene
        run: git diff --check
