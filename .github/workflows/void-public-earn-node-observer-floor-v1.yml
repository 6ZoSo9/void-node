name: VOID Public Earn node observer peer floor v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-earn-node-observer-floor-v1.yml"
      - "tools/void-public-earn-node-observer-floor-v1.mjs"
      - "scripts/prove_void_public_earn_node_observer_floor_v1.mjs"
      - "ops/public/verify-void-public-earn-node-observer-floor-v1.sh"
      - "docs/operators/void-public-earn-node-observer-floor-v1.md"
      - "tools/void-public-earn-validator-onboarding-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-earn-node-observer-floor-v1.yml"
      - "tools/void-public-earn-node-observer-floor-v1.mjs"
      - "scripts/prove_void_public_earn_node_observer_floor_v1.mjs"
      - "ops/public/verify-void-public-earn-node-observer-floor-v1.sh"
      - "docs/operators/void-public-earn-node-observer-floor-v1.md"
      - "tools/void-public-earn-validator-onboarding-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-public-earn-node-observer-floor-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source syntax
        run: |
          node --check tools/void-public-earn-node-observer-floor-v1.mjs
          node --check scripts/prove_void_public_earn_node_observer_floor_v1.mjs
          bash -n ops/public/verify-void-public-earn-node-observer-floor-v1.sh
      - name: Prove minimum-peer-floor semantics
        env:
          VOID_RUN_FULL_NODE_OBSERVER_FIXTURE: "1"
        run: node scripts/prove_void_public_earn_node_observer_floor_v1.mjs
      - run: npm run typecheck
