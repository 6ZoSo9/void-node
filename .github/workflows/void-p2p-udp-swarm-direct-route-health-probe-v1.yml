name: VOID P2P UDP swarm direct-route health probe v1

on:
  pull_request:
    paths:
      - 'src/p2p/udp_swarm_direct_route_health_probe_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_direct_route_health_probe_v1.ts'
      - 'docs/public/void-p2p-udp-swarm-direct-route-health-probe-v1.md'
      - '.github/workflows/void-p2p-udp-swarm-direct-route-health-probe-v1.yml'
      - 'src/p2p/udp_swarm_direct_route_health_observer_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_direct_route_health_observer_v1.ts'
      - 'src/p2p/udp_swarm_direct_route_health_policy_v1.ts'
      - 'src/node_core.ts'

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove direct-route health probe
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_probe_v1.ts

      - name: Re-prove direct-route health observer
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_observer_v1.ts

      - name: Re-prove direct-route health policy
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_policy_v1.ts

      - name: Re-prove Node candidate promotion
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
