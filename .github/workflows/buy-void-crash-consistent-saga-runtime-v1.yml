name: Buy VOID crash-consistent saga runtime v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-crash-consistent-saga-runtime-v1.yml"
      - "docs/operators/buy-void-crash-consistent-saga-runtime-v1.md"
      - "scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts"
      - "scripts/prove_buy_void_runtime_input_depth_fail_closed_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_runtime_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_fulfillment_journal_v1.ts"
      - "src/economic/buy_void_inventory_reservation_journal_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-crash-consistent-saga-runtime-v1.yml"
      - "docs/operators/buy-void-crash-consistent-saga-runtime-v1.md"
      - "scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts"
      - "scripts/prove_buy_void_runtime_input_depth_fail_closed_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_runtime_v1.ts"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_bounded_orchestrator_server_snapshot_v1.ts"
      - "src/economic/buy_void_fulfillment_journal_v1.ts"
      - "src/economic/buy_void_inventory_reservation_journal_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"

permissions:
  contents: read

concurrency:
  group: buy-void-crash-consistent-saga-runtime-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove mounted restart reconciliation and input-depth boundary
        run: |
          npx tsx scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts
          npx tsx scripts/prove_buy_void_runtime_input_depth_fail_closed_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
