name: VOID native-gas custody source-binding V2 candidate

on:
  pull_request:
    paths:
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "tools/void-coupled-native-gas-reconciliation-custody-source-binding-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v2_candidate.mjs"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-source-binding-v2-candidate.md"
      - ".github/workflows/coupled-native-gas-reconciliation-custody-source-binding-v2-candidate.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gas-custody-source-binding-v2-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    name: derive source-binding V2 candidate / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Derive source-binding V2 candidate only
        run: |
          set -euo pipefail
          node scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v2_candidate.mjs --derive             | tee "source-binding-v2-candidate-node-${{ matrix.node }}.json"
          node --input-type=module - "source-binding-v2-candidate-node-${{ matrix.node }}.json" <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            value.candidate_manifest_accepted !== false ||
            value.deployed_artifact_generation_verified !== false ||
            value.trusted_collector_proven !== false ||
            value.live_host_qualification_performed !== false ||
            value.runtime_integration !== false ||
            value.payment_acceptance !== false ||
            value.production_gate_ready !== false ||
            value.funds_movement !== false ||
            JSON.stringify(value.changed_source_paths) !==
              JSON.stringify(["src/economic/buy_void_filesystem_bakery_lock_v1.ts"]) ||
            value.candidate_bakery_lock_git_blob_sha1 !==
              "9bd47abb857368d928c0ca289766cdf3571629ba"
          ) process.exit(1);
          console.log("VOID_NATIVE_GAS_CUSTODY_SOURCE_BINDING_V2_CANDIDATE_GREEN");
          console.log("candidate_reviewed_source_manifest_sha256=" +
            value.candidate_reviewed_source_manifest_sha256);
          NODE

      - name: Upload derive-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-gas-source-binding-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: source-binding-v2-candidate-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi

  compare:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download candidate receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-gas-source-binding-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence

      - name: Require Node 22/24/26 byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "evidence/source-binding-v2-candidate-node-$v.json"; done
          cmp evidence/source-binding-v2-candidate-node-22.json evidence/source-binding-v2-candidate-node-24.json
          cmp evidence/source-binding-v2-candidate-node-22.json evidence/source-binding-v2-candidate-node-26.json
          echo "VOID_NATIVE_GAS_CUSTODY_SOURCE_BINDING_V2_CROSS_NODE_GREEN"
