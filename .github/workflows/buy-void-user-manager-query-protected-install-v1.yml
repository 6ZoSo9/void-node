name: VOID Buy protected user-manager query install v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_query_protected_install_v1.py"
      - "scripts/prove_void_buy_void_user_manager_query_protected_install_v1.py"
      - "docs/operators/buy-void-user-manager-query-protected-install-v1.md"
      - ".github/workflows/buy-void-user-manager-query-protected-install-v1.yml"
      - "ops/security/buy-void-user-manager-query-elf-lock-v1.json"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_query_protected_install_v1.py"
      - "scripts/prove_void_buy_void_user_manager_query_protected_install_v1.py"
      - "docs/operators/buy-void-user-manager-query-protected-install-v1.md"
      - ".github/workflows/buy-void-user-manager-query-protected-install-v1.yml"
      - "ops/security/buy-void-user-manager-query-elf-lock-v1.json"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"

permissions:
  contents: read

jobs:
  generation-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce closed V1 generation
        run: |
          set -euo pipefail
          query=ops/precision/void_buy_void_user_manager_private_unit_query_v1.c
          peer=ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c
          v2_lock=ops/security/buy-void-user-manager-query-elf-lock-v2.json
          v4_parser=tools/void-buy-allocation-custody-host-evidence-v4.mjs

          current_query_blob="$(git hash-object "$query")"
          case "$current_query_blob" in
            5355b7f177574ac4fa173a693605acaf9c5f26e4)
              ;;
            ad49cd7f71c41e0f559a561b5a62a00cec60c215)
              echo "historical V1 query source was reintroduced; restore/review the historical workflow deliberately" >&2
              exit 2
              ;;
            *)
              echo "unknown authenticated-query source generation: $current_query_blob" >&2
              exit 2
              ;;
          esac

          test "$(git hash-object "$peer")" = d8b30ac499c3bb8a5d223dbc6be687dd175be611
          grep -Fq '#define MARKER "VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_V2"' "$query"
          grep -Fq '"private_users_false_required": true' "$v2_lock"
          grep -Fq 'voidbuyumqelflock2_c643213ce46d6f2b4dfe04675a7fbbcaad2b6aea40418cb921586362a054f474' "$v2_lock"
          grep -Fq 'VOID_BUY_VOID_ALLOCATION_CUSTODY_HOST_EVIDENCE_V4' "$v4_parser"

          echo 'VOID_BUY_USER_MANAGER_PROTECTED_INSTALL_V1_SUPERSEDED_BY_V2_GREEN'
          echo 'historical_v1_active=false'
          echo 'final_v2_query_generation_bound=true'
          echo 'unknown_generation_fails_closed=true'
