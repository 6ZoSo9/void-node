name: VOID Tor signed bootstrap external acceptance v1

on:
  pull_request:
    paths:
      - 'public/bootstrap/tor-signed-v1.json'
      - 'config/void-tor-bootstrap-release-root-v1.json'
      - 'run-void-node.sh'
      - 'scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs'
      - 'scripts/resolve_void_tor_public_bootstrap_v1.mjs'
      - 'scripts/lib/void_tor_bootstrap_release_root_v1.mjs'
      - 'scripts/lib/void_tor_native_bootstrap_transport_v1.mjs'
      - '.github/workflows/void-tor-signed-bootstrap-external-acceptance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-tor-signed-bootstrap-external-acceptance-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install Tor client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor

      - name: Start fully bootstrapped isolated Tor SOCKS client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/void-tor-client-data" outside-machine-evidence
          printf '%s\n'             "DataDirectory $RUNNER_TEMP/void-tor-client-data"             "SocksPort 127.0.0.1:19051"             "SafeSocks 1"             "SafeLogging 1"             "ClientOnly 1"             "RunAsDaemon 0"             "Log notice stdout"             >"$RUNNER_TEMP/void-tor-client.conf"

          tor --verify-config -f "$RUNNER_TEMP/void-tor-client.conf"
          tor -f "$RUNNER_TEMP/void-tor-client.conf"             >outside-machine-evidence/tor-client.log 2>&1 &
          echo "$!" >"$RUNNER_TEMP/void-tor-client.pid"

          for _ in $(seq 1 180); do
            if grep -Fq 'Bootstrapped 100% (done): Done' outside-machine-evidence/tor-client.log; then
              if ss -H -ltn | awk '{print $4}' | grep -Eq '127\.0\.0\.1:19051$'; then
                echo "tor_bootstrap_100=true"
                echo "tor_socks_ready=true"
                exit 0
              fi
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/void-tor-client.pid")" 2>/dev/null; then
              cat outside-machine-evidence/tor-client.log >&2
              exit 1
            fi
            sleep 1
          done

          cat outside-machine-evidence/tor-client.log >&2
          exit 1

      - name: Verify and probe signed Tor seed externally
        shell: bash
        env:
          VOID_TOR_SOCKS_HOST: '127.0.0.1'
          VOID_TOR_SOCKS_PORT: '19051'
          VOID_TOR_BOOTSTRAP_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          node scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs             --verify-only             --signed-manifest-file public/bootstrap/tor-signed-v1.json             >outside-machine-evidence/tor-verify.out             2>outside-machine-evidence/tor-verify.log

          node scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs             --signed-manifest-file public/bootstrap/tor-signed-v1.json             >outside-machine-evidence/tor-live.out             2>outside-machine-evidence/tor-live.log

          grep -Fx 'http://6a4r6osb37sp2t6nbx7dpdnq5wfdzdrn5axt7t33kduzuznarqqpnkid.onion'             outside-machine-evidence/tor-live.out
          grep -F 'valid_signature_count=1' outside-machine-evidence/tor-live.log
          grep -F 'VOID_TOR_PUBLIC_BOOTSTRAP_RELEASE_ROOT_RESOLVER_V1_GREEN'             outside-machine-evidence/tor-live.log

          echo 'external_tor_seed_live=true'

      - name: Inspect live historical block zero shapes
        shell: bash
        env:
          ONION_BASE: 'http://6a4r6osb37sp2t6nbx7dpdnq5wfdzdrn5axt7t33kduzuznarqqpnkid.onion'
          HTTPS_BASE: 'https://seed.nullfeed.org'
        run: |
          set -euo pipefail
          for transport in https tor; do
            out="outside-machine-evidence/block0-$transport.json"
            if test "$transport" = https; then
              curl -fsS --max-time 30 "$HTTPS_BASE/blocks/range?from=0&to=0" -o "$out"
            else
              curl -fsS --socks5-hostname 127.0.0.1:19051 --max-time 45 \
                "$ONION_BASE/blocks/range?from=0&to=0" -o "$out"
            fi
            TRANSPORT="$transport" OUT="$out" node - <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.env.OUT, "utf8"));
          const block = Array.isArray(body) ? body[0] : null;
          console.log(`block0_transport=${process.env.TRANSPORT}`);
          console.log(`block0_count=${Array.isArray(body) ? body.length : -1}`);
          console.log(`block0_keys=${block && typeof block === "object" ? Object.keys(block).sort().join(",") : "none"}`);
          console.log(`block0_json=${JSON.stringify(block)}`);
          NODE
          done
          sha256sum outside-machine-evidence/block0-https.json outside-machine-evidence/block0-tor.json
          cmp -s outside-machine-evidence/block0-https.json outside-machine-evidence/block0-tor.json &&
            echo 'block0_transport_bytes_equal=true' ||
            echo 'block0_transport_bytes_equal=false'

      - name: Qualify HTTPS seed freshly for this acceptance run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outside-machine-evidence/https-qualification

          node --check scripts/qualify_void_public_seed_v1.mjs
          node --check scripts/build_void_public_bootstrap_manifest_v1.mjs

          node scripts/qualify_void_public_seed_v1.mjs \
            --endpoint 'https://seed.nullfeed.org' \
            --samples 3 \
            --interval-ms 30000 \
            --output outside-machine-evidence/https-qualification/qualification.json

          node scripts/build_void_public_bootstrap_manifest_v1.mjs \
            --receipt outside-machine-evidence/https-qualification/qualification.json \
            --validity-hours 72 \
            --output outside-machine-evidence/https-qualification/public-bootstrap-v1.json

          node - <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(
            fs.readFileSync(
              "outside-machine-evidence/https-qualification/qualification.json",
              "utf8",
            ),
          );
          const manifest = JSON.parse(
            fs.readFileSync(
              "outside-machine-evidence/https-qualification/public-bootstrap-v1.json",
              "utf8",
            ),
          );
          if (receipt.schema !== "void_public_seed_qualification_v1")
            throw new Error("HTTPS qualification schema mismatch");
          if (receipt.sample_count !== 3)
            throw new Error("HTTPS qualification sample count mismatch");
          if (receipt.loopback_fixture !== false || receipt.temporary_provider !== false)
            throw new Error("HTTPS qualification is not stable-public evidence");
          if (manifest.schema !== "void_public_bootstrap_v1")
            throw new Error("HTTPS manifest schema mismatch");
          if (manifest.status !== "stable_https_seed")
            throw new Error("HTTPS manifest status mismatch");
          if (!Array.isArray(manifest.sync_endpoints) ||
              manifest.sync_endpoints.length !== 1 ||
              manifest.sync_endpoints[0]?.base !== "https://seed.nullfeed.org")
            throw new Error("HTTPS manifest endpoint mismatch");
          if (!(Date.parse(manifest.expires_at) > Date.now()))
            throw new Error("HTTPS manifest is not live");
          for (const value of Object.values(manifest.authority || {})) {
            if (value !== false) throw new Error("HTTPS manifest authority boundary mismatch");
          }
          console.log("fresh_https_qualification=true");
          console.log(`fresh_https_qualification_id=${receipt.qualification_id}`);
          console.log(`fresh_https_manifest_id=${manifest.manifest_id}`);
          console.log(`fresh_https_manifest_expires_at=${manifest.expires_at}`);
          NODE

      - name: Prove bounded readiness head type contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const accept = (head) => Number.isSafeInteger(head) && head >= 0;
          for (const head of [0, 9999, Number.MAX_SAFE_INTEGER]) {
            if (!accept(head)) throw new Error(`valid head rejected: ${head}`);
          }
          for (const head of ["9999", [9999], true, false, null]) {
            if (accept(head)) {
              throw new Error(`schema-invalid head accepted: ${JSON.stringify(head)}`);
            }
          }
          console.log("bounded_ready_head_type_strict=true");
          console.log("wrong_type_controls=string,array,boolean,null");
          NODE

      - name: Fresh clone-run proves bounded HTTPS and Tor historical import
        shell: bash
        env:
          VOID_PUBLIC_BOOTSTRAP_MANIFEST_URL: 'http://127.0.0.1:19192/public-bootstrap-v1.json'
          VOID_PUBLIC_BOOTSTRAP_ALLOW_LOOPBACK_FIXTURE: '1'
          VOID_PUBLIC_BOOTSTRAP_REQUIRE: '1'
          VOID_PUBLIC_BOOTSTRAP_REQUIRE_MULTIPATH: '1'
          VOID_TOR_SOCKS_HOST: '127.0.0.1'
          VOID_TOR_SOCKS_PORT: '19051'
          VOID_TOR_BOOTSTRAP_TIMEOUT_MS: '60000'
          DATA_DIR: ${{ runner.temp }}/void-multipath-data
        run: |
          set -Eeuo pipefail
          rm -rf .runtime node_modules dist .env .nodekey "$DATA_DIR"

          LOG=outside-machine-evidence/multipath-node.log
          READY=outside-machine-evidence/multipath-ready.json
          MIN_FRESH_HEAD=9999

          python3 -m http.server 19192 \
            --bind 127.0.0.1 \
            --directory outside-machine-evidence/https-qualification \
            >outside-machine-evidence/https-manifest-server.log 2>&1 &
          MANIFEST_PID=$!
          PID=""

          cleanup() {
            if test -n "$PID"; then
              kill -TERM "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            kill -TERM "$MANIFEST_PID" 2>/dev/null || true
            wait "$MANIFEST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 \
              http://127.0.0.1:19192/public-bootstrap-v1.json \
              >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$MANIFEST_PID" 2>/dev/null; then
              cat outside-machine-evidence/https-manifest-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          curl -fsS --max-time 2 \
            http://127.0.0.1:19192/public-bootstrap-v1.json \
            >/dev/null

          ./run-void-node.sh run >"$LOG" 2>&1 &
          PID=$!

          GREEN=0
          OBSERVED_HEAD=-1
          for i in $(seq 1 600); do
            if curl -sS --max-time 5 http://127.0.0.1:4100/__void/ready.json >"$READY" 2>/dev/null; then
              OBSERVED_HEAD="$(
                READY_JSON="$(cat "$READY")" node -e '
                  const v=JSON.parse(process.env.READY_JSON);
                  const h=v?.head;
                  if(!Number.isSafeInteger(h) || h < 0) process.exit(1);
                  process.stdout.write(String(h));
                ' 2>/dev/null || printf '%s' -1
              )"
              if test "$OBSERVED_HEAD" -ge "$MIN_FRESH_HEAD"; then
                GREEN=1
                break
              fi
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG" >&2
              exit 1
            fi

            if (( i % 30 == 0 )); then
              echo "fresh_import_progress_head=$OBSERVED_HEAD"
              tail -n 20 "$LOG" || true
            fi
            sleep 1
          done

          if test "$GREEN" != 1; then
            echo "HOLD: bounded fresh historical import did not reach $MIN_FRESH_HEAD; observed=$OBSERVED_HEAD" >&2
            tail -n 200 "$LOG" >&2 || true
            exit 1
          fi

          if grep -Fq 'invalid imported block' "$LOG"; then
            echo 'HOLD: fresh multipath import reported invalid imported block' >&2
            grep -F 'invalid imported block' "$LOG" >&2 || true
            exit 1
          fi

          grep -F 'public_bootstrap=resolved_multipath_https_tor' "$LOG"
          grep -F 'https_bootstrap=active' "$LOG"
          grep -F 'tor_bootstrap=active' "$LOG"
          grep -F 'bootstrap_transport_classes=https,tor' "$LOG"
          grep -F 'public_sync_via_loopback_adapter=true' "$LOG"
          grep -F 'tailnet_required=false' "$LOG"
          grep -F 'VOID_PUBLIC_BOOTSTRAP_CATCHUP_PROGRESS' "$LOG"
          cat "$READY"

          echo 'VOID_TOR_SIGNED_BOOTSTRAP_EXTERNAL_ACCEPTANCE_V1_GREEN'
          echo 'outside_machine=true'
          echo 'https_transport_active=true'
          echo 'tor_transport_active=true'
          echo 'multipath_required=true'
          echo "bounded_fresh_import_head=$OBSERVED_HEAD"
          echo 'bounded_historical_progress=true'
          echo 'fresh_https_qualification_used=true'
          echo 'full_chain_catchup_required_in_ci=false'
          echo 'money_movement_authority=false'

      - name: Upload external acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-tor-signed-bootstrap-external-acceptance-v1-${{ github.sha }}
          path: outside-machine-evidence/
          if-no-files-found: warn
          retention-days: 14
