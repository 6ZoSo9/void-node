name: VOID V7 V5 staging trusted admission plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-v7-v5-stage-trusted-admission-plan-v1.yml"
      - "docs/architecture/buy-void-v7-v5-stage-trusted-admission-plan-v1.md"
      - "ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v1.json"
      - "scripts/prove_buy_void_v7_v5_stage_trusted_admission_plan_v1.mjs"
      - "ops/precision/void_v7_v5_source_stage_install_v1.py"
      - "ops/precision/void_v7_v5_receipt_stage_install_v1.py"
      - "ops/precision/void_v7_full_history_protected_replica_root_launcher_v2.c"
      - "ops/security/buy-void-v7-create-only-persistent-seal-plan-v1.json"
      - "ops/security/buy-void-v7-create-only-closed-tree-acceptance-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact admission-plan head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and four-add scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=5489b50be1e5631a6958d78afeb290f9d1b444bb
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'A\t.github/workflows/buy-void-v7-v5-stage-trusted-admission-plan-v1.yml'
            $'A\tdocs/architecture/buy-void-v7-v5-stage-trusted-admission-plan-v1.md'
            $'A\tops/security/buy-void-v7-v5-stage-trusted-admission-plan-v1.json'
            $'A\tscripts/prove_buy_void_v7_v5_stage_trusted_admission_plan_v1.mjs'
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${actual[$i]}" = "${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact plan surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v1.json)" = "1688e55a0f2b2065b4c27a651a35c1aa9e0138b8"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v5_stage_trusted_admission_plan_v1.mjs)" = "693a31a5d3d9869d43c41f8c5ac52480e29eb24a"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-v7-v5-stage-trusted-admission-plan-v1.md)" = "18f0fcbefda31c2c8c2dc474398c59a97f0a9611"
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_source_stage_install_v1.py)" = "1f251a8489e0b2a69683d991785cb4f46fa6dff5"
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_receipt_stage_install_v1.py)" = "d719de6e8c4974a9356577ee16a9e68fa02b7ca0"

      - name: Prove trusted-admission plan
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_v7_v5_stage_trusted_admission_plan_v1.mjs
          out="$RUNNER_TEMP/v5-stage-admission-plan.log"
          node scripts/prove_buy_void_v7_v5_stage_trusted_admission_plan_v1.mjs | tee "$out"
          grep -Fx 'VOID_V7_V5_STAGE_TRUSTED_ADMISSION_PLAN_V1_PROOF_GREEN' "$out"
          grep -Fx 'plan_id=voidv7v5stageadmissionplan1_050ae2426fcf4b9895ac92b280274c062ed95fc97358fb9786ee6b6b890cee2a' "$out"
          grep -Fx 'closed_tree_precedent_bound=true' "$out"
          grep -Fx 'historical_closed_tree_identities_plan_bound=true' "$out"
          grep -Fx 'upstream_builder_final_workflow_conclusion_pending=true' "$out"
          grep -Fx 'complete_source_snapshot_required=true' "$out"
          grep -Fx 'static_python_descriptor_execution_required=true' "$out"
          grep -Fx 'minimal_fixed_environment_required=true' "$out"
          grep -Fx 'caller_path_authority=false' "$out"
          grep -Fx 'caller_source_generation_authority=false' "$out"
          grep -Fx 'exchange_operations_forbidden=true' "$out"
          grep -Fx 'stage_pair_read_only_qualifier_required=true' "$out"
          grep -Fx 'production_manifest_external_required=true' "$out"
          grep -Fx 'launcher_source_implementation_authorized=false' "$out"
          grep -Fx 'launcher_install_authorized=false' "$out"
          grep -Fx 'root_execution_authorized=false' "$out"
          grep -Fx 'source_stage_apply_authorized=false' "$out"
          grep -Fx 'receipt_stage_apply_authorized=false' "$out"
          grep -Fx 'service_mutation=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"