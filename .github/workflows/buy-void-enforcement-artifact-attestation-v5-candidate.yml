name: VOID Buy VOID enforcement V7 current candidate derivation

on:
  pull_request:
    paths:
      - "src/economic/**"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v7_candidate.mjs"
      - "scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs"
      - "scripts/prove_buy_void_reviewed_git_invocation_v1.mjs"
      - "scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_enforcement_v1.mjs"
      - "ops/security/reviewed-node-package-runtime-enforcement-v1.json"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v6.json"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v7-candidate.md"
      - ".github/workflows/buy-void-enforcement-artifact-attestation-v5-candidate.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-enforcement-v7-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact V7 graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact stacked head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Parse V7 candidate and trust proofs
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v7_candidate.mjs
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs
          node --check scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs
          node --check scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node --check scripts/prove_buy_void_reviewed_git_invocation_v1.mjs

      - name: Prove source-read and Git trust boundaries
        run: |
          node scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node scripts/prove_buy_void_reviewed_git_invocation_v1.mjs --self-test

      - name: Compile exact current economic runtime
        run: node ./node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Preserve accepted V6 predecessor
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import crypto from "node:crypto";
          const p="docs/architecture/buy-void-enforcement-artifact-attestation-v6.json";
          const b=fs.readFileSync(p);
          const git=crypto.createHash("sha1")
            .update(Buffer.from("blob "+b.length+"\0","utf8")).update(b).digest("hex");
          assert.equal(git,"f3ae81f3ccc1831f7811b61bbe7820e599c28dc8");
          const j=JSON.parse(b);
          assert.equal(j.accepted_enforcement_set_sha256,
            "ea7abb9300215e4f76caea4706fa4c4c81465c32f30a3350fe4f01177f845cfb");
          assert.equal(j.complete_executable_closure_verified,true);
          assert.equal(j.candidate_identity_accepted,true);
          assert.equal(j.production_source_finality_authority_ready,false);
          console.log("ACCEPTED_ENFORCEMENT_V6_PREDECESSOR_GREEN");
          NODE

      - name: Require historical V6 candidate to refuse current V7 graph
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs --self-test
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs             --derive             --real-saga-evidence=enforcement-v6-real-saga-${{ matrix.node }}.json             --saga-behavior-log=enforcement-v6-saga-behavior-${{ matrix.node }}.log             --package-runtime-log=enforcement-v6-package-runtime-${{ matrix.node }}.log             > "$RUNNER_TEMP/unexpected-v6.json" 2> "$RUNNER_TEMP/v6-hold.log"; then
            echo "UNEXPECTED_HISTORICAL_V6_DERIVATION" >&2
            exit 1
          fi
          grep -F 'bound source/ancestor blob drift:src/economic/buy_void_source_finality_execution_preflight_v1.ts'             "$RUNNER_TEMP/v6-hold.log"

      - name: Requalify exact real saga dynamic edge
        run: |
          node scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs --workspace             > "$RUNNER_TEMP/enforcement-v7-real-saga-${{ matrix.node }}.json"

      - name: Requalify real saga behavior with inert adapters
        run: |
          node scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs             | tee "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"network_request_performed": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"credential_access_performed": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"wallet_access_performed": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"signing_performed": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"transaction_broadcast_performed": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          grep -F '"money_movement": false' "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"

      - name: Requalify accepted ethers plus express package identity
        run: |
          node scripts/prove_void_reviewed_node_package_runtime_enforcement_v1.mjs             | tee "$RUNNER_TEMP/enforcement-v7-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'root_packages=ethers,express' "$RUNNER_TEMP/enforcement-v7-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'profile_identity_accepted=true' "$RUNNER_TEMP/enforcement-v7-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/enforcement-v7-package-runtime-${{ matrix.node }}.log"

      - name: Self-test V7 scanner
        run: node scripts/prove_buy_void_enforcement_artifact_attestation_v7_candidate.mjs --self-test

      - name: Stage bounded evidence after package qualification
        run: |
          cp "$RUNNER_TEMP/enforcement-v7-real-saga-${{ matrix.node }}.json"             "enforcement-v7-real-saga-${{ matrix.node }}.json"
          cp "$RUNNER_TEMP/enforcement-v7-saga-behavior-${{ matrix.node }}.log"             "enforcement-v7-saga-behavior-${{ matrix.node }}.log"
          cp "$RUNNER_TEMP/enforcement-v7-package-runtime-${{ matrix.node }}.log"             "enforcement-v7-package-runtime-${{ matrix.node }}.log"

      - name: Derive unaccepted current V7 enforcement candidate
        run: |
          node scripts/prove_buy_void_enforcement_artifact_attestation_v7_candidate.mjs             --derive             --real-saga-evidence="enforcement-v7-real-saga-${{ matrix.node }}.json"             --saga-behavior-log="enforcement-v7-saga-behavior-${{ matrix.node }}.log"             --package-runtime-log="enforcement-v7-package-runtime-${{ matrix.node }}.log"             > "enforcement-v7-candidate-${{ matrix.node }}.json"
          node --input-type=module - <<'NODE' "enforcement-v7-candidate-${{ matrix.node }}.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.schema,"void_buy_void_enforcement_artifact_v7_candidate");
          assert.equal(j.version,7);
          assert.equal(j.source_runtime_parent,
            "51e8d399c985c96d5b07b52032661789ecb4a291");
          assert.equal(j.predecessor.accepted_enforcement_v6_set_sha256,
            "ea7abb9300215e4f76caea4706fa4c4c81465c32f30a3350fe4f01177f845cfb");
          assert.equal(j.dynamic_tool_candidate_count,1);
          assert.equal(j.dynamic_tool_execution_identity_verified,true);
          assert.equal(j.dynamic_tool_transitive_closure_verified,true);
          assert.deepEqual(j.third_party_package_imports,["ethers","express"]);
          assert.equal(j.package_runtime_evidence.ethers_package_runtime_verified,true);
          assert.equal(j.package_runtime_evidence.express_package_runtime_verified,true);
          assert.equal(j.package_runtime_evidence.third_party_package_runtime_closure_verified,true);
          assert.equal(j.complete_executable_closure_verified,true);
          assert.equal(j.candidate_identity_accepted,false);
          for(const key of ["deployed_artifact_generation_verified",
            "runtime_mount_authority","production_source_finality_authority_ready",
            "presale_activation","funds_movement"]) assert.equal(j[key],false,key);
          console.log("VOID_BUY_VOID_ENFORCEMENT_V7_CURRENT_CANDIDATE_GREEN");
          NODE

      - name: Require no implicit locked authority
        run: |
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v7_candidate.mjs             > "$RUNNER_TEMP/forbidden.txt" 2>&1; then
            exit 1
          fi
          grep -F 'v7_candidate_derivation_only_no_locked_authority' "$RUNNER_TEMP/forbidden.txt"

      - name: Upload V7 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-v7-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: enforcement-v7-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Exact stacked diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact V7 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-v7-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./v7-evidence
      - name: Require Node 22 24 26 byte equality
        run: |
          for v in 22 24 26; do test -s "v7-evidence/enforcement-v7-candidate-$v.json"; done
          cmp v7-evidence/enforcement-v7-candidate-22.json v7-evidence/enforcement-v7-candidate-24.json
          cmp v7-evidence/enforcement-v7-candidate-22.json v7-evidence/enforcement-v7-candidate-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const b=fs.readFileSync("v7-evidence/enforcement-v7-candidate-22.json");
          const j=JSON.parse(b);
          assert.equal(j.complete_executable_closure_verified,true);
          assert.equal(j.candidate_identity_accepted,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_V7_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(b).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+j.candidate_enforcement_set_sha256);
          console.log("production_authority=false");
          NODE
