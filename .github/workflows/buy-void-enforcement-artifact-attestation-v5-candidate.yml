name: VOID Buy VOID enforcement V6 current candidate derivation

on:
  pull_request:
    paths:
      - "src/economic/**"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v6.mjs"
      - "scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs"
      - "scripts/prove_buy_void_reviewed_git_invocation_v1.mjs"
      - "scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v5.json"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v6-candidate.md"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v6.json"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v6.md"
      - "ops/security/reviewed-node-package-runtime-enforcement-v1.json"
      - "scripts/prove_void_reviewed_node_package_runtime_enforcement_v1.mjs"
      - ".github/workflows/buy-void-enforcement-artifact-attestation-v5-candidate.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: buy-void-enforcement-v6-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact PR source generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and stacked base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test -n "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Parse successor and trust proofs
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs
          node --check scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs
          node --check scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node --check scripts/prove_buy_void_reviewed_git_invocation_v1.mjs

      - name: Prove source-read and Git trust boundaries
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node scripts/prove_buy_void_reviewed_git_invocation_v1.mjs --self-test

      - name: Compile exact current economic runtime
        run: node ./node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Preserve historical V5 refusal
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs)" = "70292a0b283d8f06814f153105e27397f924c19d"
          node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --self-test
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --derive > "$RUNNER_TEMP/unexpected-v5.json" 2> "$RUNNER_TEMP/v5-hold.log"; then
            echo "UNEXPECTED_HISTORICAL_V5_DERIVATION" >&2
            exit 1
          fi
          grep -F '22a30e3ffad6047a472488104c769140bd050878 HEAD --' "$RUNNER_TEMP/v5-hold.log"

      - name: Requalify exact real saga dynamic edge
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs --workspace > "$RUNNER_TEMP/enforcement-v6-real-saga-${{ matrix.node }}.json"
          node --input-type=module - <<'NODE' "$RUNNER_TEMP/enforcement-v6-real-saga-${{ matrix.node }}.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.executed_saga_loader_qualified,true);
          assert.equal(j.dynamic_tool_transitive_closure_verified_for_saga_edge,true);
          assert.equal(j.real_saga_exports_invoked,false);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.funds_movement,false);
          NODE

      - name: Requalify exact real saga behavior with inert adapters
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs | tee "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"network_request_performed": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"credential_access_performed": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"wallet_access_performed": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"signing_performed": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"transaction_broadcast_performed": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          grep -F '"money_movement": false' "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log"

      - name: Requalify reviewed ethers package bytes
        run: |
          set -euo pipefail
          node scripts/prove_void_reviewed_node_package_runtime_v1.mjs | tee "$RUNNER_TEMP/enforcement-v6-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'root_package=ethers' "$RUNNER_TEMP/enforcement-v6-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'packages_aggregate_sha256=5ac562a4396ef1d7ec302ef3af4eba7de7f2e62d478ee83fc30814d13d8d3b73' "$RUNNER_TEMP/enforcement-v6-package-runtime-${{ matrix.node }}.log"
          grep -Fx 'runtime_chain_wallet_transaction_funds_authority=0' "$RUNNER_TEMP/enforcement-v6-package-runtime-${{ matrix.node }}.log"

      - name: Self-test current scanner
        run: node scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs --self-test

      - name: Stage bounded evidence only after clean-repository package proof
        run: |
          set -euo pipefail
          cp -- "$RUNNER_TEMP/enforcement-v6-real-saga-${{ matrix.node }}.json" "enforcement-v6-real-saga-${{ matrix.node }}.json"
          cp -- "$RUNNER_TEMP/enforcement-v6-saga-behavior-${{ matrix.node }}.log" "enforcement-v6-saga-behavior-${{ matrix.node }}.log"
          cp -- "$RUNNER_TEMP/enforcement-v6-package-runtime-${{ matrix.node }}.log" "enforcement-v6-package-runtime-${{ matrix.node }}.log"

      - name: Derive unaccepted current V6 enforcement candidate
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs \
            --derive \
            --real-saga-evidence="enforcement-v6-real-saga-${{ matrix.node }}.json" \
            --saga-behavior-log="enforcement-v6-saga-behavior-${{ matrix.node }}.log" \
            --package-runtime-log="enforcement-v6-package-runtime-${{ matrix.node }}.log" \
            > "enforcement-v6-candidate-${{ matrix.node }}.json"
          node --input-type=module - <<'NODE' "enforcement-v6-candidate-${{ matrix.node }}.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.schema,"void_buy_void_enforcement_artifact_v6_candidate");
          assert.equal(j.version,6);
          assert.equal(j.source_runtime_parent,"99c9b6a5aaaf0f4a5440ebc2dfade3fba70dfc1e");
          assert.equal(j.dynamic_tool_candidate_count,1);
          assert.equal(j.dynamic_tool_execution_identity_verified,true);
          assert.equal(j.dynamic_tool_transitive_closure_verified,true);
          assert.equal(j.no_dynamic_unknown_imports,true);
          assert.deepEqual(j.third_party_package_imports,["ethers","express"]);
          assert.equal(j.package_runtime_evidence.ethers_package_runtime_verified,true);
          assert.equal(j.package_runtime_evidence.express_package_runtime_verified,false);
          assert.equal(j.package_runtime_evidence.third_party_package_runtime_closure_verified,false);
          assert.equal(j.complete_executable_closure_verified,false);
          for(const key of ["candidate_identity_accepted","deployed_artifact_generation_verified",
            "runtime_mount_authority","production_source_finality_authority_ready",
            "presale_activation","funds_movement"]) assert.equal(j[key],false,key);
          console.log("VOID_BUY_VOID_ENFORCEMENT_V6_CURRENT_CANDIDATE_GREEN");
          NODE

      - name: Require no implicit locked authority
        run: |
          set -euo pipefail
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v6_candidate.mjs > "$RUNNER_TEMP/forbidden.txt" 2>&1; then
            exit 1
          fi
          grep -F 'v6_candidate_derivation_only_no_locked_authority' "$RUNNER_TEMP/forbidden.txt"

      - name: Upload V6 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-v6-candidate-${{ github.event.pull_request.head.sha }}-node-${{ matrix.node }}
          path: enforcement-v6-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Exact stacked diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact V6 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-v6-candidate-${{ github.event.pull_request.head.sha }}-node-*
          merge-multiple: true
          path: ./v6-evidence
      - name: Require Node 22 24 26 byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "v6-evidence/enforcement-v6-candidate-$v.json"; done
          cmp v6-evidence/enforcement-v6-candidate-22.json v6-evidence/enforcement-v6-candidate-24.json
          cmp v6-evidence/enforcement-v6-candidate-22.json v6-evidence/enforcement-v6-candidate-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const b=fs.readFileSync("v6-evidence/enforcement-v6-candidate-22.json");
          const j=JSON.parse(b);
          assert.equal(j.dynamic_tool_execution_identity_verified,true);
          assert.equal(j.dynamic_tool_transitive_closure_verified,true);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.package_runtime_evidence.express_package_runtime_verified,false);
          assert.equal(j.candidate_identity_accepted,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_V6_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(b).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+j.candidate_enforcement_set_sha256);
          console.log("remaining_package_gap=express");
          console.log("production_authority=false");
          NODE

  lock-v6:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact lock candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact V6 candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-v6-candidate-${{ github.event.pull_request.head.sha }}-node-*
          merge-multiple: true
          path: ./v6-evidence
      - name: Requalify locked ethers plus express package identity
        run: |
          set -euo pipefail
          node scripts/prove_void_reviewed_node_package_runtime_enforcement_v1.mjs \
            | tee "enforcement-package-lock-${{ matrix.node }}.log"
      - name: Derive and verify accepted V6 enforcement identity
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v6.mjs
          node scripts/prove_buy_void_enforcement_artifact_attestation_v6.mjs \
            --derive \
            --candidate="v6-evidence/enforcement-v6-candidate-22.json" \
            --package-runtime-log="enforcement-package-lock-${{ matrix.node }}.log" \
            > "enforcement-v6-lock-${{ matrix.node }}.json"
          cmp "enforcement-v6-lock-${{ matrix.node }}.json" \
            docs/architecture/buy-void-enforcement-artifact-attestation-v6.json
          node scripts/prove_buy_void_enforcement_artifact_attestation_v6.mjs \
            --verify \
            --candidate="v6-evidence/enforcement-v6-candidate-22.json" \
            --package-runtime-log="enforcement-package-lock-${{ matrix.node }}.log" \
            | tee "enforcement-v6-lock-${{ matrix.node }}.txt"
          grep -Fx 'candidate_identity_accepted=true' "enforcement-v6-lock-${{ matrix.node }}.txt"
          grep -Fx 'complete_executable_closure_verified=true' "enforcement-v6-lock-${{ matrix.node }}.txt"
          grep -Fx 'production_source_finality_authority_ready=false' "enforcement-v6-lock-${{ matrix.node }}.txt"
          grep -Fx 'public_presale_activation=false' "enforcement-v6-lock-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' "enforcement-v6-lock-${{ matrix.node }}.txt"
      - name: Upload accepted V6 identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-v6-lock-${{ github.event.pull_request.head.sha }}-node-${{ matrix.node }}
          path: |
            enforcement-v6-lock-${{ matrix.node }}.json
            enforcement-v6-lock-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

  lock-v6-cross-node:
    needs: [lock-v6]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download accepted V6 identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-v6-lock-${{ github.event.pull_request.head.sha }}-node-*
          merge-multiple: true
          path: ./accepted
      - name: Require exact Node 22 24 26 accepted identity
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "accepted/enforcement-v6-lock-$v.json"
            test -s "accepted/enforcement-v6-lock-$v.txt"
          done
          cmp accepted/enforcement-v6-lock-22.json accepted/enforcement-v6-lock-24.json
          cmp accepted/enforcement-v6-lock-22.json accepted/enforcement-v6-lock-26.json
          cmp accepted/enforcement-v6-lock-22.txt accepted/enforcement-v6-lock-24.txt
          cmp accepted/enforcement-v6-lock-22.txt accepted/enforcement-v6-lock-26.txt
          sha256sum accepted/enforcement-v6-lock-22.json
          echo "VOID_BUY_VOID_ENFORCEMENT_V6_LOCK_CROSS_NODE_GREEN"
          echo "accepted_enforcement_set_sha256=c197ccf77e6fc7499143ed26f00be95c39ae2e8b16d2900255c0dcab576f0f4c"
          echo "production_source_finality_authority_ready=false"
          echo "public_presale_activation=false"
          echo "funds_movement=false"
