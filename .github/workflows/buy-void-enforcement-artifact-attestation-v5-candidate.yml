name: VOID Buy VOID enforcement V5 candidate derivation

on:
  pull_request:
    paths:
      - "src/economic/**"
      - "scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs"
      - "scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs"
      - "scripts/prove_buy_void_reviewed_git_invocation_v1.mjs"
      - "docs/architecture/buy-void-enforcement-artifact-attestation-v5-candidate.md"
      - ".github/workflows/buy-void-enforcement-artifact-attestation-v5-candidate.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-enforcement-v5-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact PR source generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact head binding
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse candidate and trust helpers before expensive build
        run: |
          node --check scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs
          node --check scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
          node --check scripts/prove_buy_void_reviewed_git_invocation_v1.mjs
      - name: Prove ancestor-safe descriptor-relative source reads
        run: node scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs
      - name: Prove absolute sanitized reviewed Git execution
        run: node scripts/prove_buy_void_reviewed_git_invocation_v1.mjs --self-test
      - name: Build exact source-only enforcement artifacts
        run: npm run build
      - name: Self-test closed imports and retained fd growth/swap holds
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs)" = "70292a0b283d8f06814f153105e27397f924c19d"
          node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --self-test
      - name: Prove V6 runtime bridge preserves signer and broadcast HOLD
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_execution_preflight_v1.ts
      - name: Derive unaccepted V5 enforcement candidate
        run: |
          set -euo pipefail
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs --derive > enforcement-v5-candidate-${{ matrix.node }}.json 2> "$RUNNER_TEMP/legacy-v5-derivation-error.log"; then
            echo 'HISTORICAL_V5_SOURCE_GEN_UNCHANGED=true'
          else
            # Epoch-2 executable changes are forbidden under the frozen V5
            # source authority. Assert the precise ancestry-diff failure.
            grep -F '22a30e3ffad6047a472488104c769140bd050878 HEAD --' "$RUNNER_TEMP/legacy-v5-derivation-error.log"
            grep -F 'deriveBuyVoidEnforcementArtifactAttestationV5Candidate' "$RUNNER_TEMP/legacy-v5-derivation-error.log"
            test "$(git hash-object tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs)" = '834f17d99c0351c0f2b10fb024f3ee43afae8a42'
            node tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs > "$RUNNER_TEMP/current-epoch2-source-only.log"
            grep -Fx 'status=EPOCH2_SOURCE_TUPLE_REVIEWABLE_CREDENTIAL_AND_ACTIVATION_HOLD' "$RUNNER_TEMP/current-epoch2-source-only.log"
            grep -Fx 'source_qualification_complete=true' "$RUNNER_TEMP/current-epoch2-source-only.log"
            grep -Fx 'historical_v1_authority_inherited=false' "$RUNNER_TEMP/current-epoch2-source-only.log"
            grep -Fx 'signer_control_or_systemd_credential_verified=false' "$RUNNER_TEMP/current-epoch2-source-only.log"
            grep -Fx 'production_payment_activation=false' "$RUNNER_TEMP/current-epoch2-source-only.log"
            node --input-type=module - <<'NODE' "enforcement-v5-candidate-${{ matrix.node }}.json"
          import fs from "node:fs";
          // Distinct explicitly UNACCEPTED successor classification, not a
          // fabricated V5 derivation or dynamic tool closure.
          const refusal = {
            schema: "void_buy_void_enforcement_v5_historical_refusal_epoch2_v1",
            version: 1,
            historical_source_head: "22a30e3ffad6047a472488104c769140bd050878",
            historical_v5_source_unchanged: false,
            historical_v5_candidate_derived: false,
            historical_v1_authority_inherited: false,
            current_epoch2_source_tuple_qualified: true,
            dynamic_tool_execution_identity_verified: false,
            dynamic_tool_transitive_closure_verified: false,
            complete_executable_closure_verified: false,
            candidate_identity_accepted: false,
            deployed_artifact_generation_verified: false,
            production_source_finality_authority_ready: false,
            signer_control_or_systemd_credential_verified: false,
            production_payment_activation: false,
            presale_activation: false,
            funds_movement: false
          };
          fs.writeFileSync(process.argv[2], JSON.stringify(refusal, null, 2) + "\n");
          NODE
            touch "$RUNNER_TEMP/legacy-v5-rejection-proven"
            echo 'HISTORICAL_V5_REFUSED_AND_EPOCH2_SOURCE_ONLY_QUALIFIED=true'
          fi
          if test ! -f "$RUNNER_TEMP/legacy-v5-rejection-proven"; then
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const file = process.argv[1];
            const candidate = JSON.parse(fs.readFileSync(file, "utf8"));
            assert.equal(candidate.schema, "void_buy_void_enforcement_artifact_v5_candidate");
            assert.equal(candidate.version, 5);
            assert.equal(candidate.source_runtime_parent, "22a30e3ffad6047a472488104c769140bd050878");
            assert.ok(candidate.closed_runtime_artifacts.some(
              entry => entry.path === "dist/economic/buy_void_source_finality_generation_provenance_v6.js"));
            assert.ok(!candidate.closed_runtime_artifacts.some(
              entry => /generation_provenance_v[45][.]js$/.test(entry.path)));
            assert.equal(candidate.static_relative_import_graph_bound,true);
            assert.equal(candidate.no_dynamic_unknown_imports,false);
            assert.ok(candidate.dynamic_tool_candidate_count >= 1);
            assert.equal(candidate.dynamic_tool_import_candidates.length,
              candidate.dynamic_tool_candidate_count);
            assert.equal(candidate.complete_executable_closure_verified,false);
            assert.equal(candidate.dynamic_tool_execution_identity_verified,false);
            assert.equal(candidate.dynamic_tool_transitive_closure_verified,false);
            for(const edge of candidate.dynamic_tool_import_candidates) {
              assert.match(edge.importer_artifact,/^dist\/economic\/buy_void_[a-z0-9_]+[.]js$/);
              assert.match(edge.tool_specifier,/^[.][.]\/[.][.]\/tools\/buy-void-[a-z0-9-]+-v[0-9]+[.]mjs$/);
              assert.equal(edge.executed_target_verified,false);
              assert.equal(edge.dynamic_tool_transitive_closure_verified,false);
            }
            for(const key of ["candidate_identity_accepted","deployed_artifact_generation_verified",
              "runtime_mount_authority","production_source_finality_authority_ready",
              "presale_activation","funds_movement"]) assert.equal(candidate[key],false,key);
            console.log("ENFORCEMENT_V5_STATIC_GRAPH_AND_DYNAMIC_TOOL_HOLD_EVIDENCE_GREEN");
          ' enforcement-v5-candidate-${{ matrix.node }}.json
          fi
      - name: Require rejection of missing derivation authorization
        run: |
          set -euo pipefail
          if node scripts/prove_buy_void_enforcement_artifact_attestation_v5_candidate.mjs > "$RUNNER_TEMP/forbidden.txt" 2>&1; then
            echo "UNEXPECTED_ENFORCEMENT_V5_ACCEPTANCE" >&2; exit 1
          fi
          grep -F "v5_candidate_derivation_only_no_locked_authority" "$RUNNER_TEMP/forbidden.txt"
      - name: Upload Node candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-v5-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: enforcement-v5-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Committed diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all three exact-head derivations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-v5-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./v5-enforcement-evidence
      - name: Require exact Node 22 24 26 candidate byte equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "v5-enforcement-evidence/enforcement-v5-candidate-$node.json"
          done
          cmp v5-enforcement-evidence/enforcement-v5-candidate-22.json v5-enforcement-evidence/enforcement-v5-candidate-24.json
          cmp v5-enforcement-evidence/enforcement-v5-candidate-22.json v5-enforcement-evidence/enforcement-v5-candidate-26.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            import crypto from "node:crypto";
            const bytes=fs.readFileSync("v5-enforcement-evidence/enforcement-v5-candidate-22.json");
            const j=JSON.parse(bytes);
            if (j.schema === "void_buy_void_enforcement_v5_historical_refusal_epoch2_v1") {
              assert.equal(j.version,1);
              assert.equal(j.historical_source_head,"22a30e3ffad6047a472488104c769140bd050878");
              for(const key of [
                "historical_v5_source_unchanged",
                "historical_v5_candidate_derived",
                "historical_v1_authority_inherited",
                "dynamic_tool_execution_identity_verified",
                "dynamic_tool_transitive_closure_verified",
                "complete_executable_closure_verified",
                "candidate_identity_accepted",
                "deployed_artifact_generation_verified",
                "production_source_finality_authority_ready",
                "signer_control_or_systemd_credential_verified",
                "production_payment_activation",
                "presale_activation",
                "funds_movement",
              ]) assert.equal(j[key],false,key);
              assert.equal(j.current_epoch2_source_tuple_qualified,true);
              console.log("VOID_E2_HISTORICAL_V5_REFUSAL_CROSS_NODE_GREEN");
            } else {
            assert.equal(j.candidate_identity_accepted,false);
            assert.equal(j.complete_executable_closure_verified,false);
            assert.equal(j.dynamic_tool_execution_identity_verified,false);
            assert.equal(j.dynamic_tool_transitive_closure_verified,false);
            assert.equal(j.no_dynamic_unknown_imports,false);
            assert.ok(j.dynamic_tool_candidate_count >= 1);
            assert.equal(j.production_source_finality_authority_ready,false);
            assert.equal(j.deployed_artifact_generation_verified,false);
            console.log("VOID_BUY_VOID_ENFORCEMENT_V5_CANDIDATE_CROSS_NODE_GREEN");
            }
            console.log("candidate_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
            console.log("candidate_enforcement_set_sha256="+(j.candidate_enforcement_set_sha256||"none_unaccepted_epoch2"));
            console.log("candidate_acceptance=false");
          '
