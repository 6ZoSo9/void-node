name: VOID V7 stage verifier provider-aware account plan v2

on:
  pull_request:
    paths:
      - 'ops/security/void_v7_stage_verifier_provider_aware_account_plan_v2.json'
      - 'scripts/prove_void_v7_stage_verifier_provider_aware_account_plan_v2.py'
      - 'docs/security/void-v7-stage-verifier-provider-aware-account-plan-v2.md'
      - '.github/workflows/void-v7-stage-verifier-provider-aware-account-plan-v2.yml'

permissions:
  contents: read

jobs:
  provider-aware-account-plan-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind exact current role generation and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          HEAD_EXPECTED="${{ github.event.pull_request.head.sha }}"
          BASE="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_EXPECTED"
          test "$BASE" = "c90f2e89ef0b90a8a8852b72ffb9bf6ba9f22a22"
          git merge-base --is-ancestor "$BASE" "$HEAD_EXPECTED"
          test "$(git rev-parse HEAD:ops/security/void_v7_v5_stage_role_separation_contract_v2.json)" = "4801caaca496baeb85c7842b5b8b4b47122582ab"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py)" = "d88a9548ea34b8209ed7dcd53732fd25dd1371bf"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py)" = "b462696826b4f90fdf5f4938cd5467e5711addab"
          test "$(git rev-parse HEAD:ops/security/void_v7_stage_verifier_provider_aware_account_plan_v2.json)" = "c38b886ec58bcc2e274d43b937defe0db4754a1a"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_stage_verifier_provider_aware_account_plan_v2.py)" = "13b39f49a5827283c7c8385deb35a2f53a6c95fc"
          test "$(git rev-parse HEAD:docs/security/void-v7-stage-verifier-provider-aware-account-plan-v2.md)" = "fd544238b7cf494ac565fc6588bfa2c46a5eedc2"
          cat > /tmp/v7-account-v2-expected <<'SCOPE'
          A	.github/workflows/void-v7-stage-verifier-provider-aware-account-plan-v2.yml
          A	docs/security/void-v7-stage-verifier-provider-aware-account-plan-v2.md
          A	ops/security/void_v7_stage_verifier_provider_aware_account_plan_v2.json
          A	scripts/prove_void_v7_stage_verifier_provider_aware_account_plan_v2.py
          SCOPE
          git diff --name-status "$BASE" "$HEAD_EXPECTED" -- | sort > /tmp/v7-account-v2-actual
          sort /tmp/v7-account-v2-expected > /tmp/v7-account-v2-expected.sorted
          diff -u /tmp/v7-account-v2-expected.sorted /tmp/v7-account-v2-actual
          git diff --check "$BASE" "$HEAD_EXPECTED" --

      - name: Provider-aware fail-closed source proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -I -B scripts/prove_void_v7_stage_verifier_provider_aware_account_plan_v2.py
