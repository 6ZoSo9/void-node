name: chain2050-role-authority-registry-compiled-identity-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-registry-compiled-identity-v1.json"
      - "tools/chain2050-role-authority-registry-compiled-identity-v1.mjs"
      - "scripts/prove_chain2050_role_authority_registry_compiled_identity_v1.mjs"
      - "docs/security/chain2050-role-authority-registry-compiled-identity-v1.md"
      - ".github/workflows/chain2050-role-authority-registry-compiled-identity-v1.yml"
      - "contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"
      - "tools/chain2050-role-authority-registry-dual-compiler-v1.mjs"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check tools/chain2050-role-authority-registry-compiled-identity-v1.mjs
      - run: node --check scripts/prove_chain2050_role_authority_registry_compiled_identity_v1.mjs
      - run: node scripts/prove_chain2050_role_authority_registry_compiled_identity_v1.mjs
      - if: matrix.node == 24
        run: |
          node scripts/prove_chain2050_role_authority_registry_dual_compiler_v1.mjs
          npm run typecheck
