name: VOID DataNet registry deployer resolution observer v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-registry-deployer-resolution-observer-v1.yml"
      - "tools/datanet-content-commitment-registry-deployer-resolution-observer-v1.mjs"
      - "ops/precision/void-datanet-registry-deployer-resolution-precision-v1.mjs"
      - "scripts/prove_datanet_registry_deployer_resolution_observer_v1.mjs"
      - "docs/operators/datanet-registry-deployer-resolution-observer-v1.md"
      - "ops/mainnet0/datanet-registry-deployer-resolution-target-v1.json"
      - "schemas/datanet-registry-deployer-resolution-target-v1.schema.json"
      - "scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs"
      - "tools/datanet-content-commitment-deployment-attestation-v1.mjs"
      - "ops/mainnet0/datanet-content-commitment-compiled-identity-v1.json"
      - "ops/mainnet0/datanet-content-commitment-publisher-selection-v1.json"
      - "ops/mainnet0/datanet-content-commitment-registry-deployer-selection-v1.json"
      - "ops/mainnet0/datanet-registry-deployer-resolution-target-v1.json"
      - "schemas/datanet-registry-deployer-resolution-target-v1.schema.json"
      - "scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-registry-deployer-resolution-observer-v1.yml"
      - "tools/datanet-content-commitment-registry-deployer-resolution-observer-v1.mjs"
      - "ops/precision/void-datanet-registry-deployer-resolution-precision-v1.mjs"
      - "scripts/prove_datanet_registry_deployer_resolution_observer_v1.mjs"
      - "docs/operators/datanet-registry-deployer-resolution-observer-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node --check tools/datanet-content-commitment-registry-deployer-resolution-observer-v1.mjs
      - run: node --check ops/precision/void-datanet-registry-deployer-resolution-precision-v1.mjs
      - run: node --check scripts/prove_datanet_registry_deployer_resolution_observer_v1.mjs
      - run: node --check scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs
      - run: node scripts/prove_datanet_registry_deployer_resolution_observer_v1.mjs
      - run: node scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs
      - run: git diff --check
