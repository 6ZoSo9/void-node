name: Buy VOID Epoch-2 V6R3 terminal census manifest substrate V1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py'
      - 'scripts/prove_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-terminal-runtime-census-manifest-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-terminal-runtime-census-manifest-v1.yml'
      - 'ops/security/buy-void-epoch2-v6r3-python-runtime-closure-contract-v1.json'
      - 'ops/security/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v1.json'
  push:
    branches: [ main ]
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py'
      - 'scripts/prove_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-terminal-runtime-census-manifest-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-terminal-runtime-census-manifest-v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Syntax
        run: |
          python3 -I -B -S -c 'import ast; from pathlib import Path; ast.parse(Path("ops/precision/void_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py").read_text())'
          python3 -I -B -m py_compile scripts/prove_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py
      - name: Fixture-only exact proof
        run: python3 -I -B scripts/prove_buy_void_epoch2_v6r3_terminal_runtime_census_manifest_v1.py
      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
