name: VOID public node connect focus v1

on:
  pull_request:
    paths:
      - "public/public-node/connect/index.html"
      - "public/public-node/connect/public-node-connect-pack-v1.html"
      - "public/public-node/connect/public-node-connect-pack-v1.json"
      - "docs/public/public-node-connect-pack-v1.md"
      - "scripts/prove_void_public_node_connect_focus_v1.mjs"
      - "tools/proof-public-node-connect-pack-v1.mjs"
      - "tools/proof-public-node-connect-pack-closeout-v1.mjs"
      - "tools/proof-public-node-connect-lane-closeout-v1.mjs"
      - "tools/proof-public-node-operator-quickstart-closeout-v1.mjs"
      - "tools/proof-public-node-operator-status-rollup-closeout-v1.mjs"
      - ".github/workflows/void-public-node-connect-focus-v1.yml"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove keyboard focus and dial guidance contract
        run: |
          set -euo pipefail
          node --check scripts/prove_void_public_node_connect_focus_v1.mjs
          node scripts/prove_void_public_node_connect_focus_v1.mjs
          node tools/proof-public-node-connect-pack-v1.mjs
          node tools/proof-public-node-connect-pack-closeout-v1.mjs
          node tools/proof-public-node-connect-lane-closeout-v1.mjs
          node tools/proof-public-node-operator-quickstart-closeout-v1.mjs
          node tools/proof-public-node-operator-status-rollup-closeout-v1.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
