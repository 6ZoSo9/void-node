name: Buy VOID Epoch-2 V6R3 installed qualification V1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py'
      - 'scripts/prove_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py'
      - 'docs/operators/buy-void-epoch2-live-composition-v6r3-installed-qualification-v1.md'
      - '.github/workflows/buy-void-epoch2-live-composition-v6r3-installed-qualification-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
  push:
    branches: [ main ]
    paths:
      - 'ops/precision/void_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py'
      - 'scripts/prove_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py'
      - 'docs/operators/buy-void-epoch2-live-composition-v6r3-installed-qualification-v1.md'
      - '.github/workflows/buy-void-epoch2-live-composition-v6r3-installed-qualification-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_atomic_upgrade_v1.py'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile             ops/precision/void_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py             scripts/prove_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py
      - name: Source self-test
        run: |
          python3 -I -B             ops/precision/void_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py             --self-test
      - name: Source plan
        run: |
          python3 -I -B             ops/precision/void_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py             --plan
      - name: Exact proof
        run: |
          python3 -I -B             scripts/prove_buy_void_epoch2_live_composition_v6r3_installed_qualification_v1.py
      - name: Diff hygiene
        run: git diff --check
