name: VOID economic epoch2 private QBFT materialization v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-qbft-private-runtime-materialization-v1.mjs"
      - "tools/void-economic-epoch2-qbft-private-runtime-bundle-set-v1.mjs"
      - "ops/precision/void-precision-epoch2-qbft-private-runtime-bundle-set-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_private_runtime_bundle_set_v1.mjs"
      - "ops/mainnet0/prepare-void-economic-epoch2-qbft-private-runtime-host-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_private_runtime_materialization_v1.mjs"
      - ".github/workflows/void-economic-epoch2-qbft-private-runtime-materialization-v1.yml"
      - "docs/operators/economic-epoch2-qbft-private-runtime-materialization-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-private-qbft-materialization-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-qbft-private-runtime-materialization-v1.mjs
          node --check tools/void-economic-epoch2-qbft-private-runtime-bundle-set-v1.mjs
          node --check ops/precision/void-precision-epoch2-qbft-private-runtime-bundle-set-v1.mjs
          node --check scripts/prove_void_economic_epoch2_qbft_private_runtime_bundle_set_v1.mjs
          node --check ops/mainnet0/prepare-void-economic-epoch2-qbft-private-runtime-host-v1.mjs
          node --check scripts/prove_void_economic_epoch2_qbft_private_runtime_materialization_v1.mjs
      - name: Prove prepare-only materialization
        run: |
          set -euo pipefail
          node scripts/prove_void_economic_epoch2_qbft_private_runtime_materialization_v1.mjs
          node scripts/prove_void_economic_epoch2_qbft_private_runtime_bundle_set_v1.mjs
      - name: Diff hygiene
        run: git diff --check
