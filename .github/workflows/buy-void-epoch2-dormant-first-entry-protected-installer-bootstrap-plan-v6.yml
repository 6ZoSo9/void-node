name: Buy VOID Epoch-2 protected installer bootstrap plan v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py"
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-installed-qualification-v6.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py"
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json"
      - "scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-protected-installer-bootstrap-plan-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V6 planner generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          source_base=510094f247d3d3c1f49d3d5a402dbefd6716c041
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$source_base" "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              base="$(git merge-base "$PR_BASE" "$EXPECTED_HEAD")"
              test "$base" = "$source_base"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py)" = \
            a6ee24fe7ad41ad7aa0baffa7d20210e06c8e4f2
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py)" = \
            c6aa26e8c233d5eab3dc65bb1572cf4253e2457c
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-plan-v6.md)" = \
            fa01e87c8bde2faf027c2160cfb4e47ee1b08eed

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py)" = \
            f8e25ef310ef4493dd23baee70eef6db84ae68f9
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_installed_qualification_v6.py)" = \
            3f73380677dfe3736d7e74631893142615914768
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_install_v6.py)" = \
            63e1c973978cfcb67105010e4145f01552673bc3
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v6-candidate-lock-v1.json)" = \
            f5b03c6b81016edf21f605099e0ef8976f40e107
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v3.conf)" = \
            6e0630af72111bd9976dcc38cdcdada1904dd067

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v2.json)" = \
            227c2fa449abf1387925373c706ecd07775d5898
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_binder_installer_first_entry_v2.py)" = \
            609cde180490f4f5f53ed7e34d73b95f22313bcd
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json)" = \
            5aa397be684dd1c87ca84fcb4d70ab3ebc176eb1
          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_binder_native_v2.py)" = \
            557eb68453d517d78bb3b6c6d8427df9ed36316f

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and focused V6 plan proof
        run: |
          set -euo pipefail
          for file in \
            ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py \
            scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py
          do
            FILE="$file" python3 -I -B - <<'PY'
          import os
          from pathlib import Path
          relative=os.environ["FILE"]
          compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("syntax_green=" + relative)
          PY
          done

          out="$RUNNER_TEMP/bootstrap-plan-v6-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v6.py |
            tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALLER_BOOTSTRAP_PLAN_V6_PROOF_GREEN' \
            'target_blob_bound=true' \
            'merged_v6_qualifier_bound=true' \
            'v6_installer_blob_bound=true' \
            'launcher_lock_and_materializer_bound=true' \
            'launcher_v2_runtime_head_authority_bound=true' \
            'native_lock_and_materializer_bound=true' \
            'nonroot_plan_required=true' \
            'root_qualification_kept_separate=true' \
            'qualification_descriptor_bound_source_execution_required=true' \
            'installed_qualification_performed=false' \
            'operation_bound_plan_id=true' \
            'plan_id_artifact_path_sensitive=true' \
            'structured_bootstrap_argv_only=true' \
            'bootstrap_execution_absent=true' \
            'protected_installer_apply_absent=true' \
            'filesystem_write=false' \
            'service_mutation=false' \
            'credential_access=false' \
            'signing=false' \
            'transaction=false' \
            'rpc_call=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'wc_void_market_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
