name: VOID AI Agent Public Gateway Upstream Response Bounds V1

on:
  pull_request:
    paths:
      - "ops/void-ai-agent-public-gateway-v1.mjs"
      - "scripts/prove_void_ai_agent_public_gateway_upstream_response_bounds_v1.mjs"
      - "scripts/prove_void_ai_agent_public_gateway_upstream_origin_timeout_v1.mjs"
      - "scripts/prove_void_operator_webhook_receiver_gateway_integration_v1.mjs"
      - "scripts/prove_void_operator_webhook_receiver_guard_v1.mjs"
      - "scripts/prove_agent_paid_work_submission_gateway_integration_v1.mjs"
      - "scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs"
      - "docs/public/ai-agent-public-gateway-upstream-response-bounds-v1.md"
      - ".github/workflows/void-ai-agent-public-gateway-upstream-response-bounds-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/void-ai-agent-public-gateway-v1.mjs"
      - "scripts/prove_void_ai_agent_public_gateway_upstream_response_bounds_v1.mjs"
      - "scripts/prove_void_ai_agent_public_gateway_upstream_origin_timeout_v1.mjs"
      - "scripts/prove_void_operator_webhook_receiver_gateway_integration_v1.mjs"
      - "scripts/prove_void_operator_webhook_receiver_guard_v1.mjs"
      - "scripts/prove_agent_paid_work_submission_gateway_integration_v1.mjs"
      - "scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs"
      - "docs/public/ai-agent-public-gateway-upstream-response-bounds-v1.md"
      - ".github/workflows/void-ai-agent-public-gateway-upstream-response-bounds-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check ops/void-ai-agent-public-gateway-v1.mjs
          node --check scripts/prove_void_ai_agent_public_gateway_upstream_response_bounds_v1.mjs
          node --check scripts/prove_void_ai_agent_public_gateway_upstream_origin_timeout_v1.mjs
          node --check scripts/prove_void_operator_webhook_receiver_gateway_integration_v1.mjs
          node --check scripts/prove_agent_paid_work_submission_gateway_integration_v1.mjs
      - name: Prove bounded upstream responses
        run: node scripts/prove_void_ai_agent_public_gateway_upstream_response_bounds_v1.mjs
      - name: Prove upstream origin and admitted-timeout teardown
        run: node scripts/prove_void_ai_agent_public_gateway_upstream_origin_timeout_v1.mjs
      - name: Preserve operator-webhook gateway contract
        run: |
          node scripts/prove_void_operator_webhook_receiver_gateway_integration_v1.mjs
          node scripts/prove_void_operator_webhook_receiver_guard_v1.mjs
      - name: Preserve paid-work submission gateway contract
        run: |
          node scripts/prove_agent_paid_work_submission_gateway_integration_v1.mjs
          node scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs
