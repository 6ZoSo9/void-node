name: DataNet quick fields accessible labels v1

on:
  pull_request:
    paths:
      - "public/demo/datanet/index.html"
      - "scripts/prove_datanet_quick_fields_accessible_labels_v1.mjs"
      - ".github/workflows/datanet-quick-fields-accessible-labels-v1.yml"
  push:
    branches: [main]
    paths:
      - "public/demo/datanet/index.html"
      - "scripts/prove_datanet_quick_fields_accessible_labels_v1.mjs"
      - ".github/workflows/datanet-quick-fields-accessible-labels-v1.yml"

permissions:
  contents: read

concurrency:
  group: datanet-quick-fields-accessible-labels-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessible-labels:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Check proof syntax
        run: node --check scripts/prove_datanet_quick_fields_accessible_labels_v1.mjs

      - name: Prove durable labels and mutation rejection
        run: |
          node scripts/prove_datanet_quick_fields_accessible_labels_v1.mjs \
            | tee /tmp/datanet-quick-fields-accessible-labels-v1.log
          grep -Fx "PASS: DataNet quick-demo fields have durable visible labels" \
            /tmp/datanet-quick-fields-accessible-labels-v1.log
          grep -Fx "PASS: removing any label/control association fails the proof" \
            /tmp/datanet-quick-fields-accessible-labels-v1.log

      - name: Diff hygiene
        run: git diff --check
