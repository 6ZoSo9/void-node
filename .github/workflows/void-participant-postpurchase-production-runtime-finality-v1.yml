name: VOID participant postpurchase production runtime finality v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/participant-postpurchase-production-runtime-target-v1.json"
      - "tools/void-participant-postpurchase-production-runtime-finality-v1.mjs"
      - "scripts/prove_void_participant_postpurchase_production_runtime_finality_v1.mjs"
      - "docs/operators/participant-postpurchase-production-runtime-finality-v1.md"
      - "tools/void-participant-postpurchase-finality-v1.mjs"
      - "tools/void-participant-postpurchase-finality-import-v1.mjs"
      - "scripts/prove_void_participant_postpurchase_finality_v1.mjs"
      - "scripts/prove_void_participant_postpurchase_finality_import_v1.mjs"
      - ".github/workflows/void-participant-postpurchase-production-runtime-finality-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/mainnet0/participant-postpurchase-production-runtime-target-v1.json"
      - "tools/void-participant-postpurchase-production-runtime-finality-v1.mjs"
      - "scripts/prove_void_participant_postpurchase_production_runtime_finality_v1.mjs"
      - "docs/operators/participant-postpurchase-production-runtime-finality-v1.md"
      - "tools/void-participant-postpurchase-finality-v1.mjs"
      - "tools/void-participant-postpurchase-finality-import-v1.mjs"
      - "scripts/prove_void_participant_postpurchase_finality_v1.mjs"
      - "scripts/prove_void_participant_postpurchase_finality_import_v1.mjs"
      - ".github/workflows/void-participant-postpurchase-production-runtime-finality-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-participant-postpurchase-production-runtime-finality-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove participant finality prerequisites
        run: |
          set -euo pipefail
          node scripts/prove_void_participant_postpurchase_finality_v1.mjs
          node scripts/prove_void_participant_postpurchase_finality_import_v1.mjs

      - name: Prove production-runtime finality wrapper
        run: |
          set -euo pipefail
          node --check tools/void-participant-postpurchase-production-runtime-finality-v1.mjs
          node --check scripts/prove_void_participant_postpurchase_production_runtime_finality_v1.mjs
          node scripts/prove_void_participant_postpurchase_production_runtime_finality_v1.mjs

      - name: Diff hygiene
        run: git diff --check
