name: VOID Repository Cartography v1

on:
  pull_request:
    paths:
      - "docs/REPO_MAP.md"
      - "docs/repo-map-v1.json"
      - "docs/index-map-v1.json"
      - "scripts/generate_void_repo_cartography_v1.mjs"
      - "scripts/review_void_repo_section_v1.mjs"
      - "scripts/prove_void_repo_cartography_v1.mjs"
      - "scripts/prove_void_repo_cartography_git_executable_identity_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-repo-cartography-v1.yml"
  push:
    branches:
      - main
    paths:
      - "docs/REPO_MAP.md"
      - "docs/repo-map-v1.json"
      - "docs/index-map-v1.json"
      - "scripts/generate_void_repo_cartography_v1.mjs"
      - "scripts/review_void_repo_section_v1.mjs"
      - "scripts/prove_void_repo_cartography_v1.mjs"
      - "scripts/prove_void_repo_cartography_git_executable_identity_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-repo-cartography-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-cartography:
    name: repo-directory-node-24
    runs-on: ubuntu-24.04
    env:
      VOID_REPO_CARTOGRAPHY_GIT_EXECUTABLE: /usr/bin/git
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Bind reviewed Git executable identity
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VOID_REPO_CARTOGRAPHY_GIT_EXECUTABLE"
          digest="$(sha256sum "$VOID_REPO_CARTOGRAPHY_GIT_EXECUTABLE" | awk '{print $1}')"
          test "${#digest}" -eq 64
          printf 'VOID_REPO_CARTOGRAPHY_GIT_EXECUTABLE_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Syntax check
        run: |
          node --check scripts/generate_void_repo_cartography_v1.mjs
          node --check scripts/review_void_repo_section_v1.mjs
          node --check scripts/prove_void_repo_cartography_v1.mjs
          node --check scripts/prove_void_repo_cartography_git_executable_identity_v1.mjs
          node --check scripts/prove_ci_diff_hygiene_v1.mjs
          bash -n scripts/ci_diff_hygiene_v1.sh

      - name: Reviewed Git executable boundary proof
        run: node scripts/prove_void_repo_cartography_git_executable_identity_v1.mjs

      - name: Repository cartography proof
        run: node scripts/prove_void_repo_cartography_v1.mjs

      - name: Prove shallow committed-range diff hygiene contract
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Resolve current directory
        run: node scripts/generate_void_repo_cartography_v1.mjs --format json > /tmp/void-repo-map-v1.json

      - name: Exercise bounded domain viewer
        run: |
          node scripts/review_void_repo_section_v1.mjs \
            --domain economic.buy-void \
            --limit 10 \
            --format json > /tmp/void-repo-buy-void-v1.json
          node scripts/review_void_repo_section_v1.mjs \
            --domain network.p2p \
            --limit 10 > /tmp/void-repo-p2p-v1.txt
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("/tmp/void-repo-buy-void-v1.json", "utf8"));
            if (value.marker !== "VOID_REPO_SECTION_REVIEW_V1") process.exit(1);
            if (value.domain?.id !== "economic.buy-void") process.exit(1);
            if (value.domain?.canonical_files?.shown > 10) process.exit(1);
            if (value.arbitrary_registry_path_allowed !== false) process.exit(1);
            if (value.arbitrary_repository_path_allowed !== false) process.exit(1);
            if (value.source_mutation_performed !== false) process.exit(1);
          '

      - name: Publish current directory summary
        if: always()
        run: node scripts/generate_void_repo_cartography_v1.mjs --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bounded Buy VOID directory section
        if: always()
        run: node scripts/review_void_repo_section_v1.mjs --domain economic.buy-void --limit 15 >> "$GITHUB_STEP_SUMMARY"

      - name: Committed-range diff hygiene
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
