name: VOID production Epoch-2 RPC canonical selection v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-production-epoch2-rpc-canonical-selection-v1.yml"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"
      - "ops/mainnet0/production-epoch2-rpc-target-promotion-v1.json"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/**"
      - "tools/void-production-epoch2-rpc-target-v1.mjs"
      - "tools/void-production-epoch2-rpc-selection-evidence-verifier-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-compiler-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-apply-admission-v1.mjs"
      - "tools/void-datanet-registry-deployer-activation-bound-observer-v1.mjs"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/**"
      - "scripts/prove_void_production_epoch2_rpc_target_v1.mjs"
      - "scripts/prove_void_production_epoch2_rpc_canonical_selection_v1.mjs"
      - "ops/mainnet0/datanet-registry-deployer-resolution-target-v1.json"
      - "schemas/datanet-registry-deployer-resolution-target-v1.schema.json"
      - "scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs"
      - "ops/mainnet/CURRENT_TRUTH.md"
      - "docs/operators/production-epoch2-rpc-target-v1.md"
      - "docs/operators/datanet-registry-deployer-resolution-observer-v1.md"
      - "docs/operators/datanet-registry-deployer-activation-bound-observer-v1.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-production-epoch2-rpc-canonical-selection-v1.yml"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"
      - "ops/mainnet0/production-epoch2-rpc-target-promotion-v1.json"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/**"
      - "tools/void-production-epoch2-rpc-target-v1.mjs"
      - "tools/void-production-epoch2-rpc-selection-evidence-verifier-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-compiler-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-apply-admission-v1.mjs"
      - "tools/void-datanet-registry-deployer-activation-bound-observer-v1.mjs"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/**"
      - "scripts/prove_void_production_epoch2_rpc_target_v1.mjs"
      - "scripts/prove_void_production_epoch2_rpc_canonical_selection_v1.mjs"
      - "ops/mainnet0/datanet-registry-deployer-resolution-target-v1.json"
      - "schemas/datanet-registry-deployer-resolution-target-v1.schema.json"
      - "scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs"
      - "ops/mainnet/CURRENT_TRUTH.md"
      - "docs/operators/production-epoch2-rpc-target-v1.md"
      - "docs/operators/datanet-registry-deployer-resolution-observer-v1.md"
      - "docs/operators/datanet-registry-deployer-activation-bound-observer-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-production-epoch2-rpc-target-v1.mjs
          node --check tools/void-production-epoch2-rpc-selection-evidence-verifier-v1.mjs
          node --check scripts/prove_void_production_epoch2_rpc_target_v1.mjs
          node --check scripts/prove_void_production_epoch2_rpc_canonical_selection_v1.mjs
          node --check scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs
          node --check scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs
          node --check scripts/prove_void_production_epoch2_rpc_target_promotion_apply_admission_v1.mjs
      - name: Prove reviewed selection evidence directly
        run: node tools/void-production-epoch2-rpc-selection-evidence-verifier-v1.mjs

      - name: Prove canonical selection
        run: |
          node tools/void-production-epoch2-rpc-target-v1.mjs
          node scripts/prove_void_production_epoch2_rpc_target_v1.mjs
          node scripts/prove_void_production_epoch2_rpc_canonical_selection_v1.mjs
          node scripts/prove_datanet_registry_deployer_resolution_target_v1.mjs
          node scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs
          node scripts/prove_void_production_epoch2_rpc_target_promotion_apply_admission_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
