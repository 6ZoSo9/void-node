name: VOID P2P UDP swarm Node candidate bootstrap count repair PR v1

on:
  pull_request:
    branches:
      - 'feat/p2p-udp-swarm-relay-preserving-takeover-policy-v1-20260808'
    paths:
      - '.github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-count-repair-pr-v1.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/p2p-udp-swarm-node-candidate-integration-v1-20260808'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact automation blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-runner-v1.yml)" = 'cb27836444828b52c8396c60ed96e3597be70dac'
          test "$(git hash-object .github/workflows/void-p2p-udp-swarm-node-candidate-integration-v1.yml)" = '22c1d678a813497e02606825738921ecbc362ac3'
          test -f .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-count-repair-v1.yml
          test -f .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-count-repair-pr-v1.yml

      - name: Repair exact proof-step count and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-runner-v1.yml')
          source = path.read_text()
          old = """              2,\n              'policy regression proof steps',\n"""
          new = """              1,\n              'policy regression proof steps',\n"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f'policy regression proof-step count repair: expected exactly one match, got {count}'
              )
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-runner-v1.yml').read_text()
          assert "              1,\n              'policy regression proof steps',\n" in source
          assert "              2,\n              'policy regression proof steps',\n" not in source
          PY
          git rm \
            .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-count-repair-v1.yml \
            .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-count-repair-pr-v1.yml

      - name: Commit guarded automation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/void-p2p-udp-swarm-node-candidate-bootstrap-runner-v1.yml
          git diff --cached --check
          git commit -m 'ci: fix relay policy proof-step repair count'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
