name: public-repo-hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tracked public repo hygiene
        run: bash tools/check_public_repo_hygiene.sh
