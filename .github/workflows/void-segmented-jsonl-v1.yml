                !ts.isFunctionDeclaration(statement) ||
                statement.name?.text !== 'auditDurableRootReclaimWinnerDigestEvidence' ||
                statement.parameters.length !== 2 ||
                statement.parameters[0].name.getText(sourceFile) !== 'source' ||
                statement.parameters[1].name.getText(sourceFile) !== 'proof' ||
                !statement.body
              ) return false;
              const body = statement.body.getText(sourceFile);
