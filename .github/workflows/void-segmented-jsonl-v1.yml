name: VOID Segmented JSONL V1

on:
  pull_request:
    paths:
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_segmented_jsonl_v1.ts"
      - "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_parent_namespace_v1.ts"
      - "scripts/prove_segmented_jsonl_terminal_generation_v1.ts"
      - "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts"
      - "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_materialized_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_post_durable_close_v1.ts"
      - "scripts/prove_segmented_jsonl_durable_root_v1.ts"
      - ".github/workflows/void-segmented-jsonl-v1.yml"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "scripts/prove_segmented_jsonl_ci_topology_v1.mjs"
      - "tools/check_tsc_noemit_baseline.sh"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches:
      - main
    paths:
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_segmented_jsonl_v1.ts"
      - "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_parent_namespace_v1.ts"
      - "scripts/prove_segmented_jsonl_terminal_generation_v1.ts"
      - "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts"
      - "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_materialized_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_post_durable_close_v1.ts"
      - "scripts/prove_segmented_jsonl_durable_root_v1.ts"
      - ".github/workflows/void-segmented-jsonl-v1.yml"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "scripts/prove_segmented_jsonl_ci_topology_v1.mjs"
      - "tools/check_tsc_noemit_baseline.sh"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

concurrency:
  group: void-segmented-jsonl-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: segmented-jsonl-node-${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install reviewed dependencies
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "${{ matrix.node }}"
          npm ci

      - name: Prove independent SegStore CI topology
        run: |
          test "$(git hash-object scripts/prove_segmented_jsonl_ci_topology_v1.mjs)" = "f4e07c64fe57ab190ddc324473a91c367ac2fe20"
          node scripts/prove_segmented_jsonl_ci_topology_v1.mjs

      - name: Prove focused workflow dependency closure
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const ts = require('typescript');
          let focusedInlineAuditTerminalsExecuted = 0;
          (() => {
            const focusedNativeProcessExit = Reflect.get(process, 'exit').bind(process);
            Object.defineProperties(process, {
              'exit': {
                value(code = 0) {
                  if (focusedInlineAuditTerminalsExecuted !== 4) {
                    throw new Error('focused_inline_audit_premature_exit');
                  }
                  return focusedNativeProcessExit(code);
                },
                writable: false,
                configurable: false,
              },
              'reallyExit': {
                value() {
                  throw new Error('focused_inline_audit_really_exit_forbidden');
                },
                writable: false,
                configurable: false,
              },
            });
          })();
          process.on('exit', () => {
            if (focusedInlineAuditTerminalsExecuted !== 4) process.exitCode = 1;
          });
          const workflowPath = '.github/workflows/void-segmented-jsonl-v1.yml';
          const text = fs.readFileSync(workflowPath, 'utf8');
          const topologyPath = 'scripts/prove_segmented_jsonl_ci_topology_v1.mjs';
          const topologyText = fs.readFileSync(topologyPath, 'utf8');
          const EXPECTED_TOPOLOGY_BLOB_SHA1 = 'f4e07c64fe57ab190ddc324473a91c367ac2fe20';
          function focusedGitBlobSha1(source) {
            return createHash('sha1')
              .update(`blob ${Buffer.byteLength(source, 'utf8')}\0`)
              .update(source, 'utf8')
              .digest('hex');
          }
          const topologyBlobSha1 = focusedGitBlobSha1(topologyText);
          assert.equal(topologyBlobSha1, EXPECTED_TOPOLOGY_BLOB_SHA1, 'focused_topology_blob_not_exact');
          const storageSources = [
            "src/storage/segmented_jsonl_v1.ts",
            "src/storage/segmented_jsonl_snapshot_authority_v1.ts",
            "src/storage/segmented_jsonl_materialized_authority_v1.ts",
            "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts",
            "src/storage/segmented_jsonl_durable_root_v1.ts",
          ];
          const proofs = [
            "scripts/prove_segmented_jsonl_v1.ts",
            "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts",
            "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts",
            "scripts/prove_segmented_jsonl_parent_namespace_v1.ts",
            "scripts/prove_segmented_jsonl_terminal_generation_v1.ts",
            "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts",
            "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts",
            "scripts/prove_segmented_jsonl_materialized_authority_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts",
            "scripts/prove_segmented_jsonl_post_durable_close_v1.ts",
            "scripts/prove_segmented_jsonl_durable_root_v1.ts",
          ];
          const triggerDependencies = [
            ...storageSources,
            ...proofs,
            workflowPath,
            'scripts/ci_diff_hygiene_v1.sh',
            'scripts/prove_ci_diff_hygiene_v1.mjs',
            'scripts/prove_segmented_jsonl_ci_topology_v1.mjs',
            'tools/check_tsc_noemit_baseline.sh',
            '.github/workflows/ci.yml',
            'package.json',
            'package-lock.json',
            'tsconfig.json',
            'tsconfig.build.json',
          ];
          const expressionOpen = '$' + '{{';
          const lineCount = (source, exact) =>
            source.split('\n').filter((line) => line === exact).length;

          function topologyExecutableCodeMask(source) {
            const mask = new Uint8Array(source.length);
            mask.fill(1);
            let state = 'code';
            for (let index = 0; index < source.length; index += 1) {
              const char = source[index];
              const next = source[index + 1];
              if (state === 'code') {
                if (char === '/' && next === '/') {
                  mask[index] = 0;
                  mask[index + 1] = 0;
                  index += 1;
                  state = 'line-comment';
                } else if (char === '/' && next === '*') {
                  mask[index] = 0;
                  mask[index + 1] = 0;
                  index += 1;
                  state = 'block-comment';
                } else if (char === "'" || char === '"' || char === '`') {
                  mask[index] = 0;
                  state = char === "'" ? 'single-quote' : char === '"' ? 'double-quote' : 'template';
                }
                continue;
              }
              if (state === 'line-comment') {
                mask[index] = 0;
                if (char === '\n') {
                  mask[index] = 1;
                  state = 'code';
                }
                continue;
              }
              if (state === 'block-comment') {
                mask[index] = 0;
                if (char === '*' && next === '/') {
                  mask[index + 1] = 0;
                  index += 1;
                  state = 'code';
                }
                continue;
              }
              mask[index] = 0;
              if (char === '\\' && index + 1 < source.length) {
                mask[index + 1] = 0;
                index += 1;
                continue;
              }
              if (
                (state === 'single-quote' && char === "'") ||
                (state === 'double-quote' && char === '"') ||
                (state === 'template' && char === '`')
              ) {
                state = 'code';
              }
            }
            return mask;
          }

          function topologyExecutableExactLineCount(source, exact) {
            const mask = topologyExecutableCodeMask(source);
            const lines = source.split('\n');
            let offset = 0;
            let count = 0;
            for (const line of lines) {
              let executable = false;
              for (let index = offset; index < offset + line.length; index += 1) {
                if (mask[index] === 1) {
                  executable = true;
                  break;
                }
              }
              if (line === exact && executable) count += 1;
              offset += line.length + 1;
            }
            return count;
          }

          function topologyExecutableRegexIndex(source, pattern) {
            const flags = pattern.flags.includes('g') ? pattern.flags : `${pattern.flags}g`;
            const matcher = new RegExp(pattern.source, flags);
            const mask = topologyExecutableCodeMask(source);
            for (let match = matcher.exec(source); match; match = matcher.exec(source)) {
              let executable = false;
              for (let index = match.index; index < match.index + match[0].length; index += 1) {
                if (mask[index] === 1) {
                  executable = true;
                  break;
                }
              }
              if (executable) return match.index;
              if (match[0].length === 0) matcher.lastIndex += 1;
            }
            return -1;
          }

          function topologySourceFile(source, marker) {
            const parsed = ts.createSourceFile(
              'segstore-topology.mjs',
              source,
              ts.ScriptTarget.Latest,
              true,
              ts.ScriptKind.JS,
            );
            assert.equal(parsed.parseDiagnostics.length, 0, marker);
            return parsed;
          }

          function topologyTopLevelVariableDeclarationCount(sourceFile, name, initializer) {
            let count = 0;
            for (const statement of sourceFile.statements) {
              if (!ts.isVariableStatement(statement)) continue;
              for (const declaration of statement.declarationList.declarations) {
                if (!ts.isIdentifier(declaration.name) || declaration.name.text !== name) continue;
                if (!declaration.initializer) continue;
                if (initializer(declaration.initializer.getText(sourceFile))) count += 1;
              }
            }
            return count;
          }

          const topologyMeasurementMutantSpecs = [
            ['literal_false_helper', '01b7909c2fbdf782c5a797f0c72ea20ad059804f2fd5fe5bbdd8f370913152c5'],
            ['hard_coded_helper', 'e209c85c901e02d3ca3cfa499649f92f28179c0805ea6b61cef3820978c9e4c8'],
            ['deleted_production_reconstruction', '4034ba385bce11ddb053d67567cbc562970ce61e33a6bdad378e130fb67af62f'],
            ['deleted_source_read_accounting', '4e4015548a57b53e9286df826018f73ed0564ea6d35c98f3fb92c5e265d01292'],
            ['preloaded_measurement_results', 'ead2799cc67ed087e8a46f953d26562118f61eee924ebaa3809e6a9e57fa936e'],
            ['literal_pass_terminals', '7ace875f1748c20652dd9296d3e3304c09cee778573763f52ceb1a825c889078'],
            ['deleted_acceptance_assertions', '5a64addd25204e52b7ef0c1e2797317510cea4cdce98f913641252eddee0f8f9'],
            ['weakened_acceptance_expectations', 'c89326a819d7dc076f3484283346f3735cf6c6ae52b897712c9b861017c478bb'],
          ];

          function topologyMeasurementPayloadDigest(sourceFile, element) {
            return createHash('sha256')
              .update(
                `${element.elements[1].getText(sourceFile)}\n---EXPECTED---\n${element.elements[2].getText(sourceFile)}`,
              )
              .digest('hex');
          }

          function topologyTopLevelMeasurementArrayCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (!ts.isVariableStatement(statement)) return false;
              if (statement.declarationList.declarations.length !== 1) return false;
              const declaration = statement.declarationList.declarations[0];
              if (
                !ts.isIdentifier(declaration.name) ||
                declaration.name.text !== 'reconstructionMeasurementMutants' ||
                !declaration.initializer ||
                !ts.isArrayLiteralExpression(declaration.initializer) ||
                declaration.initializer.elements.length !== topologyMeasurementMutantSpecs.length
              ) return false;
              const specs = declaration.initializer.elements.map((element) => {
                if (!ts.isArrayLiteralExpression(element) || element.elements.length !== 3) return null;
                const family = element.elements[0];
                if (!ts.isStringLiteral(family)) return null;
                return [family.text, topologyMeasurementPayloadDigest(sourceFile, element)];
              });
              return (
                specs.every(
                  (spec, index) =>
                    spec !== null &&
                    spec[0] === topologyMeasurementMutantSpecs[index][0] &&
                    spec[1] === topologyMeasurementMutantSpecs[index][1],
                ) &&
                new Set(specs.map((spec) => spec?.[0])).size === topologyMeasurementMutantSpecs.length
              );
            }).length;
          }

          function topologyNamedThrowsImportCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (
                !ts.isImportDeclaration(statement) ||
                !ts.isStringLiteral(statement.moduleSpecifier) ||
                statement.moduleSpecifier.text !== 'node:assert/strict'
              ) return false;
              const clause = statement.importClause;
              if (
                !clause ||
                !clause.name ||
                clause.name.text !== 'assert' ||
                !clause.namedBindings ||
                !ts.isNamedImports(clause.namedBindings) ||
                clause.namedBindings.elements.length !== 1
              ) return false;
              const imported = clause.namedBindings.elements[0];
              return (
                imported.propertyName?.text === 'throws' &&
                imported.name.text === 'assertThrows'
              );
            }).length;
          }

          function topologyRejectionAuthorityMutationCount(sourceFile) {
            let count = 0;
            const isAuthority = (node) =>
              (ts.isIdentifier(node) && node.text === 'assertThrows') ||
              (
                ts.isPropertyAccessExpression(node) &&
                ts.isIdentifier(node.expression) &&
                node.expression.text === 'assert' &&
                node.name.text === 'throws'
              );
            const visit = (node) => {
              if (
                ts.isBinaryExpression(node) &&
                node.operatorToken.kind >= ts.SyntaxKind.FirstAssignment &&
                node.operatorToken.kind <= ts.SyntaxKind.LastAssignment &&
                isAuthority(node.left)
              ) count += 1;
              if (
                (ts.isPrefixUnaryExpression(node) || ts.isPostfixUnaryExpression(node)) &&
                isAuthority(node.operand)
              ) count += 1;
              if (ts.isDeleteExpression(node) && isAuthority(node.expression)) count += 1;
              if (ts.isCallExpression(node) && node.arguments.length > 0) {
                const callee = node.expression.getText(sourceFile);
                const target = node.arguments[0];
                if (
                  ['Object.defineProperty', 'Reflect.defineProperty', 'Object.assign'].includes(callee) &&
                  (
                    isAuthority(target) ||
                    (ts.isIdentifier(target) && target.text === 'assert')
                  )
                ) count += 1;
              }
              ts.forEachChild(node, visit);
            };
            visit(sourceFile);
            return count;
          }

          function topologyTopLevelMeasurementSetCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (!ts.isVariableStatement(statement)) return false;
              if (statement.declarationList.declarations.length !== 1) return false;
              const declaration = statement.declarationList.declarations[0];
              return (
                ts.isIdentifier(declaration.name) &&
                declaration.name.text === 'reconstructionMeasurementMutantValues' &&
                declaration.initializer?.getText(sourceFile) === [
                  'new Set(',
                  '  reconstructionMeasurementMutants.map(([, mutant]) => mutant),',
                  ')',
                ].join('\n')
              );
            }).length;
          }

          function topologyTopLevelMeasurementDistinctAssertionCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (!ts.isExpressionStatement(statement)) return false;
              const value = statement.getText(sourceFile);
              return (
                value.startsWith('assert.equal(') &&
                value.includes('reconstructionMeasurementMutantValues.size, 8,') &&
                value.includes('segstore_reconstruction_measurement_mutant_values_not_unique')
              );
            }).length;
          }

          function topologyTopLevelMeasurementLoopCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (!ts.isForOfStatement(statement)) return false;
              if (!ts.isBlock(statement.statement)) return false;
              const body = statement.statement.statements;
              return (
                statement.initializer.getText(sourceFile) ===
                  'const [family, mutant, expected]' &&
                statement.expression.getText(sourceFile) ===
                  'reconstructionMeasurementMutants' &&
                body.length === 3 &&
                ts.isExpressionStatement(body[0]) &&
                body[0].getText(sourceFile) === [
                  'assert.notEqual(',
                  '    mutant,',
                  '    segstoreProof,',
                  '    `segstore_reconstruction_measurement_mutant_not_applied:${family}`,',
                  '  );',
                ].join('\n') &&
                ts.isExpressionStatement(body[1]) &&
                body[1].getText(sourceFile) ===
                  'assertThrows(() => auditSegstoreProof(mutant), expected);' &&
                ts.isExpressionStatement(body[2]) &&
                body[2].getText(sourceFile) ===
                  'reconstructionMeasurementMutantsExecuted += 1;'
              );
            }).length;
          }

          function topologyTopLevelMeasurementAssertionCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (!ts.isExpressionStatement(statement)) return false;
              const text = statement.getText(sourceFile);
              return (
                text.startsWith('assert.equal(') &&
                text.includes('reconstructionMeasurementMutantsExecuted,') &&
                text.includes('\n  8,\n') &&
                text.includes('segstore_reconstruction_measurement_mutant_execution_count')
              );
            }).length;
          }

          function auditTopologyMeasurementMutantExecution(source) {
            const sourceFile = topologySourceFile(
              source,
              'focused_topology_measurement_mutant_parse_failed',
            );
            assert.equal(
              topologyTopLevelMeasurementArrayCount(sourceFile),
              1,
              'focused_topology_measurement_mutant_array_not_exact',
            );
            assert.equal(
              topologyNamedThrowsImportCount(sourceFile),
              1,
              'focused_topology_measurement_named_throws_import_not_exact',
            );
            assert.equal(
              topologyRejectionAuthorityMutationCount(sourceFile),
              0,
              'focused_topology_measurement_rejection_authority_mutated',
            );
            assert.equal(
              topologyTopLevelMeasurementSetCount(sourceFile),
              1,
              'focused_topology_measurement_mutant_value_set_not_exact',
            );
            assert.equal(
              topologyTopLevelMeasurementDistinctAssertionCount(sourceFile),
              1,
              'focused_topology_measurement_mutant_distinct_assertion_not_exact',
            );
            assert.equal(
              topologyTopLevelVariableDeclarationCount(
                sourceFile,
                'reconstructionMeasurementMutantsExecuted',
                (initializer) => initializer === '0',
              ),
              1,
              'focused_topology_measurement_mutant_counter_not_top_level',
            );
            assert.equal(
              topologyTopLevelMeasurementLoopCount(sourceFile),
              1,
              'focused_topology_measurement_mutant_loop_not_top_level',
            );
            assert.equal(
              topologyTopLevelMeasurementAssertionCount(sourceFile),
              1,
              'focused_topology_measurement_mutant_assertion_not_top_level',
            );
            assert.equal(
              topologyExecutableRegexIndex(source, /\bif\s*\(\s*false\s*\)\s*\{/),
              -1,
              'focused_topology_measurement_mutant_literal_false_guard',
            );
            for (const [line, marker] of [
              ['const reconstructionMeasurementMutants = [', 'array'],
              ['let reconstructionMeasurementMutantsExecuted = 0;', 'counter'],
              ['for (const [family, mutant, expected] of reconstructionMeasurementMutants) {', 'loop'],
              ['  assertThrows(() => auditSegstoreProof(mutant), expected);', 'assertion'],
              ['const reconstructionMeasurementMutantValues = new Set(', 'value_set'],
              ['  reconstructionMeasurementMutantValues.size, 8,', 'distinct_actual'],
              ['  "segstore_reconstruction_measurement_mutant_values_not_unique",', 'distinct_marker'],
              ['  reconstructionMeasurementMutantsExecuted += 1;', 'increment'],
              ['  reconstructionMeasurementMutantsExecuted,', 'actual_count'],
              ['  8,', 'expected_count'],
              ['console.log(`segstore_reconstruction_measurement_mutants_executed=${reconstructionMeasurementMutantsExecuted}`);', 'terminal'],
            ]) {
              assert.equal(
                topologyExecutableExactLineCount(source, line),
                1,
                `focused_topology_measurement_mutant_${marker}_not_bound`,
              );
            }
            for (const [family] of topologyMeasurementMutantSpecs) {
              assert.equal(
                topologyExecutableExactLineCount(source, `    "${family}",`),
                1,
                `focused_topology_measurement_mutant_family_not_bound:${family}`,
              );
            }
          }

          function topologyTopLevelDurableRootAuditCallCount(sourceFile) {
            return sourceFile.statements.filter((statement) => {
              if (
                !ts.isExpressionStatement(statement) ||
                !ts.isCallExpression(statement.expression) ||
                !ts.isIdentifier(statement.expression.expression) ||
                statement.expression.expression.text !== 'auditDurableRootReclaimWinnerDigestEvidence'
              ) return false;
              const args = statement.expression.arguments;
              return (
                args.length === 2 &&
                args[0].getText(sourceFile) === 'durableRootSource' &&
                args[1].getText(sourceFile) === 'durableRootProof'
              );
            }).length;
          }

          function topologyDurableRootAuditFunctionCount(sourceFile) {
            const required = [
              'gitBlobSha1(source)',
              'DURABLE_ROOT_SOURCE_BLOB_SHA1',
              'gitBlobSha1(proof)',
              'DURABLE_ROOT_PROOF_BLOB_SHA1',
              'function restoreFailedReclaimClaim(',
              'openRetainedOwnerWitnessForRollback(',
              'linkExactFdCreateOnly(',
              'assertRetainedOwnerWitnessForRollback(retained, 2);',
              'removeExactLockName(\\n      lock,\\n      PUBLISH_LOCK_RECLAIM_NAME,',
              'const descriptorReclaimMatch =',
