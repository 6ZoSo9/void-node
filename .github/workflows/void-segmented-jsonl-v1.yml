name: VOID Segmented JSONL V1

on:
  pull_request:
    paths:
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_segmented_jsonl_v1.ts"
      - "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_parent_namespace_v1.ts"
      - "scripts/prove_segmented_jsonl_terminal_generation_v1.ts"
      - "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts"
      - "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_materialized_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_post_durable_close_v1.ts"
      - "scripts/prove_segmented_jsonl_durable_root_v1.ts"
      - ".github/workflows/void-segmented-jsonl-v1.yml"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "scripts/prove_segmented_jsonl_ci_topology_v1.mjs"
      - "tools/check_tsc_noemit_baseline.sh"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches:
      - main
    paths:
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_segmented_jsonl_v1.ts"
      - "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts"
      - "scripts/prove_segmented_jsonl_parent_namespace_v1.ts"
      - "scripts/prove_segmented_jsonl_terminal_generation_v1.ts"
      - "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts"
      - "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_materialized_authority_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts"
      - "scripts/prove_segmented_jsonl_post_durable_close_v1.ts"
      - "scripts/prove_segmented_jsonl_durable_root_v1.ts"
      - ".github/workflows/void-segmented-jsonl-v1.yml"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "scripts/prove_segmented_jsonl_ci_topology_v1.mjs"
      - "tools/check_tsc_noemit_baseline.sh"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

concurrency:
  group: void-segmented-jsonl-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: segmented-jsonl-node-${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install reviewed dependencies
        run: npm ci

      - name: Prove focused workflow dependency closure
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/void-segmented-jsonl-v1.yml';
          const text = fs.readFileSync(workflowPath, 'utf8');
          const storageSources = [
            "src/storage/segmented_jsonl_v1.ts",
            "src/storage/segmented_jsonl_snapshot_authority_v1.ts",
            "src/storage/segmented_jsonl_materialized_authority_v1.ts",
            "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts",
            "src/storage/segmented_jsonl_durable_root_v1.ts",
          ];
          const proofs = [
            "scripts/prove_segmented_jsonl_v1.ts",
            "scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts",
            "scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts",
            "scripts/prove_segmented_jsonl_parent_namespace_v1.ts",
            "scripts/prove_segmented_jsonl_terminal_generation_v1.ts",
            "scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts",
            "scripts/prove_segmented_jsonl_snapshot_authority_v1.ts",
            "scripts/prove_segmented_jsonl_materialized_authority_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts",
            "scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts",
            "scripts/prove_segmented_jsonl_post_durable_close_v1.ts",
            "scripts/prove_segmented_jsonl_durable_root_v1.ts",
          ];
          const triggerDependencies = [
            ...storageSources,
            ...proofs,
            workflowPath,
            'scripts/ci_diff_hygiene_v1.sh',
            'scripts/prove_ci_diff_hygiene_v1.mjs',
            'scripts/prove_segmented_jsonl_ci_topology_v1.mjs',
            'tools/check_tsc_noemit_baseline.sh',
            '.github/workflows/ci.yml',
            'package.json',
            'package-lock.json',
            'tsconfig.json',
            'tsconfig.build.json',
          ];
          const expressionOpen = '$' + '{{';
          const lineCount = (source, exact) =>
            source.split('\n').filter((line) => line === exact).length;

          function workflowOnRange(source) {
            const lines = source.split("\n");
            const onRoots = [];
            for (let index = 0; index < lines.length; index += 1) {
              if (lines[index] === "on:") onRoots.push(index);
            }
            assert.equal(onRoots.length, 1, `focused_on_root_count:${onRoots.length}`);
            const start = onRoots[0];
            let end = lines.length;
            for (let index = start + 1; index < lines.length; index += 1) {
              if (/^\S/.test(lines[index])) {
                end = index;
                break;
              }
            }
            return { lines, start, end };
          }
          
          function workflowEventRange(source, eventName) {
            const root = workflowOnRange(source);
            const eventLine = `  ${eventName}:`;
            const matches = [];
            for (let index = root.start + 1; index < root.end; index += 1) {
              if (root.lines[index] === eventLine) matches.push(index);
            }
            assert.equal(matches.length, 1, `focused_${eventName}_event_count:${matches.length}`);
            const start = matches[0];
            let end = root.end;
            for (let index = start + 1; index < root.end; index += 1) {
              if (/^  \S/.test(root.lines[index])) {
                end = index;
                break;
              }
            }
            return { lines: root.lines, start, end };
          }
          
          function workflowEventMappingKeys(source, eventName) {
            const event = workflowEventRange(source, eventName);
            const keys = [];
            for (let index = event.start + 1; index < event.end; index += 1) {
              const match = /^    ([A-Za-z0-9_-]+):/.exec(event.lines[index]);
              if (match) keys.push(match[1]);
            }
            return keys;
          }
          
          function parseWorkflowSequenceScalar(line, marker) {
            let match = /^      - "([^"]+)"$/.exec(line);
            if (match) return match[1];
            match = /^      - '([^']+)'$/.exec(line);
            if (match) return match[1];
            match = /^      - ([^"'#][^#]*?)\s*$/.exec(line);
            assert.ok(match, `${marker}:${line.trim()}`);
            return match[1];
          }
          
          function workflowEventSequenceEntries(source, eventName, sequenceName) {
            const event = workflowEventRange(source, eventName);
            const sequenceLine = `    ${sequenceName}:`;
            const matches = [];
            for (let index = event.start + 1; index < event.end; index += 1) {
              if (event.lines[index] === sequenceLine) matches.push(index);
            }
            assert.equal(
              matches.length,
              1,
              `focused_${eventName}_${sequenceName}_count:${matches.length}`,
            );
            const start = matches[0];
            let end = event.end;
            for (let index = start + 1; index < event.end; index += 1) {
              if (/^    \S/.test(event.lines[index])) {
                end = index;
                break;
              }
            }
            const entries = [];
            for (let index = start + 1; index < end; index += 1) {
              const line = event.lines[index];
              if (line.trim() === "" || /^\s*#/.test(line)) continue;
              entries.push(
                parseWorkflowSequenceScalar(
                  line,
                  `focused_${eventName}_${sequenceName}_scalar_not_exact`,
                ),
              );
            }
            return entries;
          }
          
          function workflowEventPathEntries(source, eventName) {
            const entries = workflowEventSequenceEntries(source, eventName, "paths");
            for (const entry of entries) {
              assert.ok(
                !entry.startsWith("!"),
                `focused_${eventName}_negative_path_pattern:${entry}`,
              );
            }
            return entries;
          }
          
          function auditFocusedEventContract(source) {
            assert.deepEqual(
              workflowEventMappingKeys(source, "pull_request"),
              ["paths"],
              "focused_pull_request_mapping_keys_not_exact",
            );
            assert.deepEqual(
              workflowEventMappingKeys(source, "push"),
              ["branches", "paths"],
              "focused_push_mapping_keys_not_exact",
            );
            assert.deepEqual(
              workflowEventSequenceEntries(source, "push", "branches"),
              ["main"],
              "focused_push_main_branch_not_exact",
            );
          }

          function audit(source) {
            auditFocusedEventContract(source);
            const pullRequestPaths = workflowEventPathEntries(source, "pull_request");
            const pushPaths = workflowEventPathEntries(source, "push");
            for (const dependency of triggerDependencies) {
              const pullRequestCount = pullRequestPaths.filter((entry) => entry === dependency).length;
              const pushCount = pushPaths.filter((entry) => entry === dependency).length;
              assert.equal(
                pullRequestCount,
                1,
                `focused_pull_request_trigger_count:${dependency}:${pullRequestCount}`,
              );
              assert.equal(
                pushCount,
                1,
                `focused_push_trigger_count:${dependency}:${pushCount}`,
              );
            }
            for (const dependency of [...storageSources, ...proofs]) {
              assert.ok(
                source.includes(`node --experimental-strip-types --check ${dependency}`),
                `focused_syntax_not_invoked:${dependency}`,
              );
            }
            for (const proof of proofs) {
              assert.ok(
                source.includes(`npx --no-install tsx ${proof}`),
                `focused_proof_not_invoked:${proof}`,
              );
            }
            assert.equal(lineCount(source, '        node: [22, 24, 26]'), 1, 'focused_node_matrix_not_exact');
            assert.equal(lineCount(source, '          fetch-depth: 1'), 1, 'focused_checkout_depth_not_exact');
            assert.equal(lineCount(source, '          persist-credentials: false'), 1, 'focused_credentials_persisted');
            assert.equal(
              lineCount(source, '        run: node scripts/prove_ci_diff_hygiene_v1.mjs'),
              1,
              'focused_shared_proof_not_invoked',
            );
            assert.equal(
              lineCount(source, '        run: node scripts/prove_segmented_jsonl_ci_topology_v1.mjs'),
              1,
              'focused_topology_proof_not_invoked',
            );
            assert.equal(
              lineCount(source, '          node --check scripts/prove_segmented_jsonl_ci_topology_v1.mjs'),
              1,
              'focused_topology_syntax_not_invoked',
            );
            assert.equal(
              lineCount(source, '          bash -n tools/check_tsc_noemit_baseline.sh'),
              1,
              'focused_baseline_syntax_not_invoked',
            );
            assert.ok(
              !/^\s*continue-on-error:\s*true\s*$/m.test(source),
              'focused_failure_tolerance_present',
            );
            assert.equal(
              lineCount(source, '        run: bash scripts/ci_diff_hygiene_v1.sh'),
              1,
              'focused_diff_helper_not_invoked',
            );
            for (const binding of [
              `          CI_DIFF_PR_BASE_SHA: ${expressionOpen} github.event.pull_request.base.sha }}`,
              `          CI_DIFF_CHECKOUT_SHA: ${expressionOpen} github.sha }}`,
              `          CI_DIFF_CURRENT_SHA: ${expressionOpen} github.event.pull_request.head.sha || github.sha }}`,
              `          CI_DIFF_BASE_REMOTE: ${expressionOpen} github.server_url }}/${expressionOpen} github.repository }}.git`,
              `          CI_DIFF_HEAD_REMOTE: ${expressionOpen} github.server_url }}/${expressionOpen} github.event.pull_request.head.repo.full_name || github.repository }}.git`,
            ]) {
              const count = lineCount(source, binding);
              assert.equal(count, 1, `focused_exact_sha_binding_missing:${binding}:${count}`);
            }
            assert.equal(lineCount(source, '        if: matrix.node == 24'), 2, 'focused_node24_gate_count');
            assert.equal(lineCount(source, '        run: npm run typecheck'), 1, 'focused_node24_typecheck_not_terminal');
            assert.equal(lineCount(source, '        run: npm run build'), 1, 'focused_node24_build_not_terminal');
          }

          audit(text);
          assert.throws(
            () => audit(text.replace(`      - "${storageSources[0]}"`, `      # removed ${storageSources[0]}`)),
            /focused_(pull_request|push)_trigger_count:/,
          );
          assert.throws(
            () => audit(text.replace(`npx --no-install tsx ${proofs[0]}`, `node --experimental-strip-types --check ${proofs[0]}`)),
            /focused_proof_not_invoked:/,
          );
          assert.throws(
            () => audit(text.replace('          persist-credentials: false', '          persist-credentials: true')),
            /focused_credentials_persisted/,
          );
          assert.throws(
            () => audit(text.replace(
              `          CI_DIFF_CURRENT_SHA: ${expressionOpen} github.event.pull_request.head.sha || github.sha }}`,
              '          CI_DIFF_CURRENT_SHA: invalid',
            )),
            /focused_exact_sha_binding_missing:/,
          );
          assert.throws(
            () => audit(text.replace('        node: [22, 24, 26]', '        node: [22, 24]')),
            /focused_node_matrix_not_exact/,
          );
          const negativePathMutants = [
            ["single_quoted_exact", `      - '!${storageSources[0]}'`],
            ["double_quoted_exact", `      - \"!${storageSources[0]}\"`],
            ["single_quoted_glob", "      - '!src/storage/**'"],
            ["double_quoted_glob", '      - "!src/storage/**"'],
          ];
          for (const [family, negativeEntry] of negativePathMutants) {
            const target = `      - \"${storageSources[0]}\"\n`;
            const mutant = text.replaceAll(target, `${target}${negativeEntry}\n`);
            assert.notEqual(mutant, text, `focused_negative_path_mutant_not_applied:${family}`);
            assert.throws(
              () => audit(mutant),
              /focused_(pull_request|push)_negative_path_pattern/,
            );
          }
          const pullRequestFilterMutants = [
            ["branches_ignore_block", "    branches-ignore:\n      - main\n"],
            ["negative_branches_block", "    branches:\n      - \"!main\"\n"],
            ["types_opened_flow", "    types: [opened]\n"],
            ["types_without_synchronize_flow", "    types: [opened, reopened]\n"],
            ["types_without_synchronize_block", "    types:\n      - opened\n      - reopened\n"],
            ["types_single_quoted", "    types: 'opened'\n"],
          ];
          for (const [family, filter] of pullRequestFilterMutants) {
            const mutant = text.replace("  pull_request:\n", `  pull_request:\n${filter}`);
            assert.notEqual(mutant, text, `focused_pull_request_filter_mutant_not_applied:${family}`);
            assert.throws(() => audit(mutant), /focused_pull_request_mapping_keys_not_exact/);
          }
          console.log('focused_dependency_binding=true');
          console.log('focused_trigger_closure_falsifier=true');
          console.log('focused_negative_path_patterns_rejected=true');
          console.log('focused_pull_request_branch_filters_rejected=true');
          console.log('focused_pull_request_activity_narrowing_rejected=true');
          console.log('focused_push_main_branch_bound=true');
          console.log('focused_proof_invocation_falsifier=true');
          console.log('focused_credential_falsifier=true');
          console.log('focused_exact_sha_binding_falsifier=true');
          console.log('focused_terminal_matrix_falsifier=true');
          NODE
      - name: Syntax
        run: |
          node --experimental-strip-types --check src/storage/segmented_jsonl_v1.ts
          node --experimental-strip-types --check src/storage/segmented_jsonl_snapshot_authority_v1.ts
          node --experimental-strip-types --check src/storage/segmented_jsonl_materialized_authority_v1.ts
          node --experimental-strip-types --check src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts
          node --experimental-strip-types --check src/storage/segmented_jsonl_durable_root_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_parent_namespace_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_terminal_generation_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_snapshot_authority_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_materialized_authority_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_post_durable_close_v1.ts
          node --experimental-strip-types --check scripts/prove_segmented_jsonl_durable_root_v1.ts
          node --check scripts/prove_ci_diff_hygiene_v1.mjs
          node --check scripts/prove_segmented_jsonl_ci_topology_v1.mjs
          bash -n scripts/ci_diff_hygiene_v1.sh
          bash -n tools/check_tsc_noemit_baseline.sh

      - name: Prove segmented JSONL store
        run: npx --no-install tsx scripts/prove_segmented_jsonl_v1.ts

      - name: Prove delimiter-inclusive segment ceiling
        run: npx --no-install tsx scripts/prove_segmented_jsonl_record_delimiter_ceiling_v1.ts

      - name: Prove writer-reader manifest publication ceiling
        run: npx --no-install tsx scripts/prove_segmented_jsonl_manifest_publish_ceiling_v1.ts

      - name: Prove retained parent namespace authority
        run: npx --no-install tsx scripts/prove_segmented_jsonl_parent_namespace_v1.ts

      - name: Prove manifest framing and terminal tree generation authority
        run: npx --no-install tsx scripts/prove_segmented_jsonl_terminal_generation_v1.ts

      - name: Prove builder record-vector heap bound
        run: npx --no-install tsx scripts/prove_segmented_jsonl_builder_record_vector_heap_v1.ts

      - name: Prove content-addressed snapshot and checkpoint authority
        run: npx --no-install tsx scripts/prove_segmented_jsonl_snapshot_authority_v1.ts

      - name: Prove exact materialized snapshot generation authority
        run: npx --no-install tsx scripts/prove_segmented_jsonl_materialized_authority_v1.ts

      - name: Prove materialized append-only checkpoint continuity
        run: npx --no-install tsx scripts/prove_segmented_jsonl_checkpoint_append_only_v1.ts

      - name: Prove bounded append-only checkpoint consumption
        run: npx --no-install tsx scripts/prove_segmented_jsonl_checkpoint_bounded_consumer_v1.ts

      - name: Prove checkpoint admission bound
        run: npx --no-install tsx scripts/prove_segmented_jsonl_checkpoint_admission_bound_v1.ts

      - name: Prove checkpoint chain lifetime bound
        run: npx --no-install tsx scripts/prove_segmented_jsonl_checkpoint_chain_lifetime_bound_v1.ts

      - name: Prove post-durable close terminal truth
        run: npx --no-install tsx scripts/prove_segmented_jsonl_post_durable_close_v1.ts

      - name: Prove bounded durable checkpoint/root consumer authority
        run: npx --no-install tsx scripts/prove_segmented_jsonl_durable_root_v1.ts

      - name: Repository typecheck
        if: matrix.node == 24
        run: npm run typecheck

      - name: Repository build
        if: matrix.node == 24
        run: npm run build

      - name: Prove independent SegStore CI topology
        run: node scripts/prove_segmented_jsonl_ci_topology_v1.mjs

      - name: Prove committed-range diff hygiene contract
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Committed-range diff hygiene
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
