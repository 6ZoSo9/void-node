                expected = ["name", "uses", "with"];
              } else if (step.name === "Repository typecheck" || step.name === "Repository build") {
                expected = ["name", "if", "run"];
              } else if (step.name === "Committed-range diff hygiene") {
                expected = ["name", "if", "env", "run"];
