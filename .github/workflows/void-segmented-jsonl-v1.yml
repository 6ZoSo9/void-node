              if (ts.isVariableStatement(statement)) {
                for (const declaration of statement.declarationList.declarations) {
                  if (
                    ts.isIdentifier(declaration.name) &&
                    declaration.name.text === 'preTypecheckBaselineReplacement' &&
                    declaration.initializer
                  ) {
                    const initializer = declaration.initializer.getText(sourceFile);
                    if (
                      initializer.startsWith('ci.replace(') &&
                      initializer.includes('Replace topology baseline after checkout') &&
                      initializer.includes('tools/check_tsc_noemit_baseline.sh')
                    ) variableCount += 1;
                  }
                }
              }
              if (!ts.isExpressionStatement(statement)) continue;
              const text = statement.getText(sourceFile);
              if (
                text.startsWith('assert.notEqual(') &&
                text.includes('preTypecheckBaselineReplacement,') &&
                text.includes('ci_pre_typecheck_replacement_mutant_not_applied')
              ) appliedAssertionCount += 1;
              if (
                text.startsWith('assertThrows(') &&
                text.includes('() => auditCi(preTypecheckBaselineReplacement)') &&
                text.includes('/ci_build_job_body_not_exact/')
              ) rejectionAssertionCount += 1;
