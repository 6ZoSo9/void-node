name: VOID Crown Brood Queen Command Layer V1

on:
  pull_request:
    paths:
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "fixtures/governance/void-crown-brood-queen-command-layer-v1.json"
      - "scripts/prove_void_crown_brood_queen_command_layer_v1.mjs"
      - ".github/workflows/void-crown-brood-queen-command-layer-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/governance/void-crown-brood-queen-command-layer-v1.md"
      - "fixtures/governance/void-crown-brood-queen-command-layer-v1.json"
      - "scripts/prove_void_crown_brood_queen_command_layer_v1.mjs"
      - ".github/workflows/void-crown-brood-queen-command-layer-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-crown-brood-queen-command-layer-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Prove Crown / Brood Queen command layer
        run: node scripts/prove_void_crown_brood_queen_command_layer_v1.mjs
      - name: Diff hygiene
        run: git diff --check
