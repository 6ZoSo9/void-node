name: VOID P2P direct upgrade contract v1

on:
  pull_request:
    paths:
      - "scripts/lib/void_p2p_direct_upgrade_contract_v1.mjs"
      - "scripts/prove_void_p2p_direct_upgrade_contract_v1.mjs"
      - "docs/public/void-p2p-direct-upgrade-contract-v1.md"
      - ".github/workflows/void-p2p-direct-upgrade-contract-v1.yml"
      - "scripts/lib/void_p2p_reachability_classification_contract_v1.mjs"
  push:
    branches: [main]
    paths:
      - "scripts/lib/void_p2p_direct_upgrade_contract_v1.mjs"
      - "scripts/prove_void_p2p_direct_upgrade_contract_v1.mjs"
      - "docs/public/void-p2p-direct-upgrade-contract-v1.md"
      - ".github/workflows/void-p2p-direct-upgrade-contract-v1.yml"
      - "scripts/lib/void_p2p_reachability_classification_contract_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-direct-upgrade-contract-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax-check direct upgrade contract
        run: node --check scripts/lib/void_p2p_direct_upgrade_contract_v1.mjs

      - name: Syntax-check direct upgrade proof
        run: node --check scripts/prove_void_p2p_direct_upgrade_contract_v1.mjs

      - name: Prove direct upgrade contract
        run: node scripts/prove_void_p2p_direct_upgrade_contract_v1.mjs

      - name: Preserve reachability classification truth
        run: node scripts/prove_void_p2p_reachability_classification_contract_v1.mjs

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
