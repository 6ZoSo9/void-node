name: void-datanet-paid-read-quote-v1

on:
  pull_request:
    paths:
      - "src/paid_services/datanet_service_catalog_v1.ts"
      - "tools/void-datanet-paid-read-quote-v1.mjs"
      - "scripts/prove_void_datanet_paid_read_quote_v1.mjs"
      - "docs/operations/void-datanet-paid-read-quote-v1.md"
      - ".github/workflows/void-datanet-paid-read-quote-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/paid_services/datanet_service_catalog_v1.ts"
      - "tools/void-datanet-paid-read-quote-v1.mjs"
      - "scripts/prove_void_datanet_paid_read_quote_v1.mjs"
      - "docs/operations/void-datanet-paid-read-quote-v1.md"
      - ".github/workflows/void-datanet-paid-read-quote-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prove paid DataNet read quote
        run: node scripts/prove_void_datanet_paid_read_quote_v1.mjs
