name: Buy VOID saga broadcast reconciliation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-saga-broadcast-reconciliation-v1.yml"
      - "docs/operators/buy-void-saga-broadcast-reconciliation-v1.md"
      - "scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "src/economic/buy_void_saga_broadcast_evidence_journal_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_server_policy_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_coordinator_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custody_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-saga-broadcast-reconciliation-v1.yml"
      - "docs/operators/buy-void-saga-broadcast-reconciliation-v1.md"
      - "scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "src/economic/buy_void_saga_broadcast_evidence_journal_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_server_policy_v1.ts"
      - "src/economic/buy_void_saga_broadcast_reconciliation_coordinator_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custody_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"

permissions:
  contents: read

concurrency:
  group: buy-void-saga-broadcast-reconciliation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove write-ahead broadcast and restart reconciliation
        run: npx tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
