name: Public Agent Service Acceptance Persistence Runtime Binding V1

on:
  pull_request:
    paths:
      - "scripts/public_agent_service_acceptance_persistence_runtime_binding_v1.ts"
      - "scripts/prove_public_agent_service_acceptance_persistence_runtime_binding_v1.ts"
      - "schemas/public-agent-service-acceptance-persistence-runtime-binding-v1.schema.json"
      - "examples/public-agent-service-acceptance-persistence-runtime-binding-v1.example.json"
      - "docs/public-agent/public-agent-service-acceptance-persistence-runtime-binding-v1.md"
      - ".github/workflows/public-agent-service-acceptance-persistence-runtime-binding-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/public_agent_service_acceptance_persistence_runtime_binding_v1.ts"
      - "scripts/prove_public_agent_service_acceptance_persistence_runtime_binding_v1.ts"
      - "schemas/public-agent-service-acceptance-persistence-runtime-binding-v1.schema.json"
      - "examples/public-agent-service-acceptance-persistence-runtime-binding-v1.example.json"
      - "docs/public-agent/public-agent-service-acceptance-persistence-runtime-binding-v1.md"
      - ".github/workflows/public-agent-service-acceptance-persistence-runtime-binding-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/prove_public_agent_service_acceptance_persistence_runtime_binding_v1.ts
