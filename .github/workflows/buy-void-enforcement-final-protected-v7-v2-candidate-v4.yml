name: VOID Buy VOID protected V7 V2 candidate V4

on:
  pull_request:
    paths:
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v4.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: derive V4 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact V4 candidate generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "5e71209a92cb428fe0692a4764b3dd7466645e75" "$EXPECTED_HEAD")" = "5e71209a92cb428fe0692a4764b3dd7466645e75"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json)" = "b8341906d9563739a50dac98ea184a1d93267531"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs)" = "781c99c145ac267f1a177c542f095a7f7bd3063f"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v4.md)" = "e42165f7844f79d8d653d4b2fa0176b2ce83b352"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "5301c32f53c2a82435152e38b36486507a73f906"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json)" = "e530390e505d447ca0ad9e2a098ec6a819ae3e6c"
          git diff --check "5e71209a92cb428fe0692a4764b3dd7466645e75" "$EXPECTED_HEAD" --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Derive exact V4 candidate
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs --self-test
          out="$RUNNER_TEMP/candidate-v4-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json
          test "$(wc -c < "$out")" -eq 18214
          test "$(sha256sum "$out" | awk '{print $1}')" = "7408f190f01113ca8be42f388acbe7fad083ec11100fa9bb31017e635cf53a9f"
          test "$(git hash-object "$out")" = "b8341906d9563739a50dac98ea184a1d93267531"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v7-v2-candidate-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/candidate-v4-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v7-v2-candidate-v4-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate-v4
      - name: Require V4 Node 22 24 26 equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate-v4/candidate-v4-$node.json"; done
          cmp candidate-v4/candidate-v4-22.json candidate-v4/candidate-v4-24.json
          cmp candidate-v4/candidate-v4-22.json candidate-v4/candidate-v4-26.json
          test "$(sha256sum candidate-v4/candidate-v4-22.json | awk '{print $1}')" = "7408f190f01113ca8be42f388acbe7fad083ec11100fa9bb31017e635cf53a9f"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("candidate-v4/candidate-v4-22.json","utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V4");
          assert.equal(c.version,4);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,"686745113e5e5223a357c053a41496dc8ded12698c31967d541efea7bfe469f1");
          assert.equal(c.successor_transition.reviewed_protected_drift_count,1);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_CANDIDATE_V4_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256=7408f190f01113ca8be42f388acbe7fad083ec11100fa9bb31017e635cf53a9f");
          console.log("candidate_git_blob_sha1=b8341906d9563739a50dac98ea184a1d93267531");
          console.log("candidate_enforcement_set_sha256=f28b445fe5f1e632d1265ead825ecf9338644a3ae2704fde83ba1cedaf6be695");
          NODE
