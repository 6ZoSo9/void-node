name: VOID Buy VOID allocation high-water custody qualification v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_allocation_high_water_custody_qualification_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "scripts/prove_buy_void_allocation_high_water_custody_qualification_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts"
      - "docs/architecture/buy-void-allocation-high-water-custody-qualification-v1.md"
      - ".github/workflows/buy-void-allocation-high-water-custody-qualification-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-high-water-custody-qualification-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: custody qualification / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_allocation_high_water_custody_qualification_v1.ts \
            scripts/prove_buy_void_allocation_high_water_custody_qualification_v1.ts

      - name: Build repository
        run: npm run build

      - name: Preserve allocation high-water contract
        run: npx tsx scripts/prove_buy_void_allocation_reservation_high_water_v1.ts

      - name: Preserve allocation publication protocol
        run: npx tsx scripts/prove_buy_void_allocation_reservation_publication_protocol_v1.ts

      - name: Preserve allocation publication writer
        run: npx tsx scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts

      - name: Prove custody qualification evidence contract
        run: npx tsx scripts/prove_buy_void_allocation_high_water_custody_qualification_v1.ts

      - name: Diff hygiene
        run: git diff --check
