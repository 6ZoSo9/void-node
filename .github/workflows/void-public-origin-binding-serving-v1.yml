name: void-public-origin-binding-serving-v1

on:
  pull_request:
    paths:
      - "ops/public/void-public-origin-binding-serving-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
      - "scripts/prove_void_public_origin_binding_serving_v1.mjs"
      - "scripts/prove_public_earn_gateway_v1.mjs"
      - "tools/lib/void-node-public-origin-binding-v1.mjs"
      - "tools/lib/void-public-node-identity-trust-v1.mjs"
      - "config/void-public-node-identity-trust-v1.json"
      - "docs/public-node/void-public-origin-binding-serving-v1.md"
      - ".github/workflows/void-public-origin-binding-serving-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/public/void-public-origin-binding-serving-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
      - "scripts/prove_void_public_origin_binding_serving_v1.mjs"
      - "scripts/prove_public_earn_gateway_v1.mjs"
      - "tools/lib/void-node-public-origin-binding-v1.mjs"
      - "tools/lib/void-public-node-identity-trust-v1.mjs"
      - "config/void-public-node-identity-trust-v1.json"
      - "docs/public-node/void-public-origin-binding-serving-v1.md"
      - ".github/workflows/void-public-origin-binding-serving-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check ops/public/void-public-origin-binding-serving-v1.mjs
          node --check ops/public/public-seed-adapter-v1.mjs
          node --check tools/void-public-seed-gateway-v1.mjs
          node --check scripts/prove_void_public_origin_binding_serving_v1.mjs
      - name: Public-origin binding serving proof
        run: node scripts/prove_void_public_origin_binding_serving_v1.mjs
      - name: Public Earn adapter regression
        run: node scripts/prove_public_earn_gateway_v1.mjs
      - name: Diff hygiene
        run: git diff --check
