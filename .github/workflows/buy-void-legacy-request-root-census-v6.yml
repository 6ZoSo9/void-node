name: VOID Buy legacy request-root census v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_legacy_request_root_census_v6.py"
      - "scripts/prove_void_buy_void_legacy_request_root_census_v6.py"
      - "docs/operators/buy-void-legacy-request-root-census-v6.md"
      - ".github/workflows/buy-void-legacy-request-root-census-v6.yml"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v2.py"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_legacy_request_root_census_v6.py"
      - "scripts/prove_void_buy_void_legacy_request_root_census_v6.py"
      - "docs/operators/buy-void-legacy-request-root-census-v6.md"
      - ".github/workflows/buy-void-legacy-request-root-census-v6.yml"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v2.py"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and focused V6 census proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for p in (
              "ops/precision/void_buy_void_legacy_request_root_census_v6.py",
              "scripts/prove_void_buy_void_legacy_request_root_census_v6.py",
          ):
              compile(Path(p).read_text("utf-8"), p, "exec", dont_inherit=True)
          print("VOID_LEGACY_REQUEST_ROOT_CENSUS_V6_SYNTAX_GREEN")
          PY

          python3 -I -B scripts/prove_void_buy_void_legacy_request_root_census_v6.py |
            tee "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'VOID_BUY_VOID_LEGACY_REQUEST_ROOT_CENSUS_V6_PROOF_GREEN' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'authenticated_user_manager_query_v6_dependency_blob_bound=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'protected_v6_generation_required=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'cap_last_cap_projection_contract_required=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'kernel_cap_last_cap_stability_required=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'metadata_only=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'empty_shape_not_promoted_to_genesis=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'historical_request_history_disposition_proven=false' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'external_witness_required=true' "$RUNNER_TEMP/legacy-root-census-v6.log"
          grep -Fx 'production_gate_ready=false' "$RUNNER_TEMP/legacy-root-census-v6.log"

      - name: Plan remains inert
        run: |
          set -euo pipefail
          python3 -I -B ops/precision/void_buy_void_legacy_request_root_census_v6.py --plan |
            tee "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'read_only=true' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'sudo_required=true' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'protected_v6_generation_required=true' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'cap_last_cap_projection_contract_required=true' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'kernel_cap_last_cap_stability_required=true' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'process_environment_access=false' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'request_or_payment_contents_read=false' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'historical_request_history_disposition_proven=false' "$RUNNER_TEMP/legacy-root-plan-v6.log"
          grep -Fx 'production_gate_ready=false' "$RUNNER_TEMP/legacy-root-plan-v6.log"

      - run: git diff --check
