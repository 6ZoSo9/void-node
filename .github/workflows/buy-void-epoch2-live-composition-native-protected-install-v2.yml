name: Buy VOID Epoch-2 native protected install v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v2.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v2.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v2.md"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v2.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v2.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v2.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-protected-install-v2.md"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json"
      - ".github/workflows/buy-void-epoch2-live-composition-native-protected-install-v2.yml"

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve historical V2 installer on exact V5 successor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c)" = "5021727f1def1ec11f870d735cab65acc1701a5e"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v2.py)" = "c565c2f2327586e58100aaad4954602b85e7ebdb"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_protected_install_v2.py)" = "4d652457c1f28d8306e6b7556b9674641473cef6"
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-native-protected-install-v2.md)" = "f4fdef33d3b0a3145c5cc3ac02e2b9cacfd629c0"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v4.json)" = "34340b5a8d13b7496bf5cafcf9d2937cb777d45c"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v5.json)" = "db59358bab68a0fa33d0840bd9afe967dd809e61"
          echo VOID_BUY_VOID_EPOCH2_NATIVE_PROTECTED_INSTALL_V2_HISTORICAL_PRESERVED
          echo v5_lock_successor_exact=true
          echo protected_install_v2_current_authority=false
          echo protected_install_authorized=false
          echo live_execution_authorized=false
          echo funds_movement=false
      - run: git diff --check
