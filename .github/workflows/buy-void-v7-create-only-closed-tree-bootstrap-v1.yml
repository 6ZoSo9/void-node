name: Buy VOID V7 create-only closed-tree bootstrap v1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_v7_create_only_closed_tree_bootstrap_v1.c'
      - 'scripts/prove_buy_void_v7_create_only_closed_tree_bootstrap_v1.py'
      - 'docs/operators/buy-void-v7-create-only-closed-tree-bootstrap-v1.md'
      - '.github/workflows/buy-void-v7-create-only-closed-tree-bootstrap-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-v7-create-only-closed-tree-bootstrap-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source generation and four-file scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE: b186cb73b26ca50d73fb6f5c2326ead7ea59ed8d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$SOURCE_BASE" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-create-only-persistent-seal-plan-v1.json)" = "9dde5523dca6ab240626430ce1c2b82f1cfe7f20"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_create_only_closed_tree_bootstrap_v1.c)" = "3036fa8c72fe5699433a60ed2c597f8cd96204ff"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_create_only_closed_tree_bootstrap_v1.py)" = "a6126e96abb08eafbce7558dd90e11e7e460133a"
          test "$(git rev-parse HEAD:docs/operators/buy-void-v7-create-only-closed-tree-bootstrap-v1.md)" = "52765a434716a7eb78b812df98c9f20122a951d7"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
            cat > "$RUNNER_TEMP/expected" <<'EOF'
          A	.github/workflows/buy-void-v7-create-only-closed-tree-bootstrap-v1.yml
          A	docs/operators/buy-void-v7-create-only-closed-tree-bootstrap-v1.md
          A	ops/precision/void_buy_void_v7_create_only_closed_tree_bootstrap_v1.c
          A	scripts/prove_buy_void_v7_create_only_closed_tree_bootstrap_v1.py
          EOF
            git diff --name-status "${{ github.event.pull_request.base.sha }}" HEAD -- | sort > "$RUNNER_TEMP/actual"
            sort "$RUNNER_TEMP/expected" > "$RUNNER_TEMP/expected.sorted"
            diff -u "$RUNNER_TEMP/expected.sorted" "$RUNNER_TEMP/actual"
          fi
          git diff --check

      - name: Compile proof source
        run: python3 -m py_compile scripts/prove_buy_void_v7_create_only_closed_tree_bootstrap_v1.py

      - name: Prove static closed-tree bootstrap engine
        run: python3 -I -B scripts/prove_buy_void_v7_create_only_closed_tree_bootstrap_v1.py
