name: Buy VOID custody second-control trust admission HOLD V1
on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-custody-second-control-trust-admission-hold-v1.yml"
      - "tools/void-buy-custody-second-control-trust-admission-hold-v1.mjs"
      - "scripts/prove_buy_void_custody_second_control_trust_admission_hold_v1.mjs"
      - "docs/architecture/buy-void-custody-second-control-trust-admission-hold-v1.md"
      - "tools/void-buy-allocation-custody-second-control-signature-verifier-v1.mjs"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-custody-second-control-trust-admission-hold-v1.yml"
      - "tools/void-buy-custody-second-control-trust-admission-hold-v1.mjs"
      - "scripts/prove_buy_void_custody_second_control_trust_admission_hold_v1.mjs"
      - "docs/architecture/buy-void-custody-second-control-trust-admission-hold-v1.md"
      - "tools/void-buy-allocation-custody-second-control-signature-verifier-v1.mjs"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json"
permissions:
  contents: read
jobs:
  prove:
    name: Unconfigured trust root stays HOLD — Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact PR or push head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
      - name: Select fixture-only Node runtime
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Validate source and proof syntax
        run: |
          set -euo pipefail
          node --check tools/void-buy-custody-second-control-trust-admission-hold-v1.mjs
          node --check scripts/prove_buy_void_custody_second_control_trust_admission_hold_v1.mjs
      - name: Prove no signature can self-activate trust
        env:
          HOME: /nonexistent
          TZ: UTC
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_custody_second_control_trust_admission_hold_v1.mjs
      - name: Diff hygiene
        run: git diff --check
