name: VOID PR1089 raw empty catch repair v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-pr1089-raw-empty-catch-repair-v1.yml'
      - 'scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard exact branch and proof blob
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "feat/p2p-ephemeral-direct-mount-v1-20260807"
          test "$(git hash-object scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts)" = "fd222b2ce8e6d6fc52adb7575585be2f3b488311"

      - name: Repair only the four proof cleanup catches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts')
          s = p.read_text()
          old = 'catch {}'
          new = 'catch (error) { void error; }'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'HOLD: expected exactly 4 raw empty cleanup catches, got {count}')
          s = s.replace(old, new)
          if old in s:
              raise SystemExit('HOLD: raw empty catch remains in focused proof')
          p.write_text(s)
          PY
          git diff --check
          git diff -- scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove repo-wide raw empty catches remain zero
        run: npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Prove ephemeral direct mount remains green
        run: npx --no-install tsx scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Commit exact repair and remove mutator
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/void-pr1089-raw-empty-catch-repair-v1.yml
          git add -- scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts .github/workflows/void-pr1089-raw-empty-catch-repair-v1.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/void-pr1089-raw-empty-catch-repair-v1.yml\nscripts/prove_void_p2p_ephemeral_direct_mount_v1.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: make PR1089 cleanup catches explicit'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
