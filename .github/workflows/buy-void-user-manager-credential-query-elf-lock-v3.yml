name: VOID Buy credential query ELF lock v3 repaired

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3.py"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v3.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3.py"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v3.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact lock candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact repaired candidate and lock
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py             scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3.py

          OUT="$RUNNER_TEMP/credential-query-elf-lock-v3.json"
          python3 -I -B             scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3.py             --self-test |
            tee "$RUNNER_TEMP/credential-query-lock-v3-proof.log"

          for marker in             'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V3_GREEN'             'lock_id=voidbuyumqcredelflock3_4b95342dadd37fb8e1a56ff62c36be226af1adb91c8577cdab2addc0f8e287f2'             'candidate_id=voidbuyumqcredelfcand3_b5c405437bd40582908e097a6f021bd575315d018a9d8457af6549458cbe0922'             'candidate_report_sha256=4ec781f2fb9a8e6c84246c12d7634f895f93b1c5cbc7cda07ce655a4475b55b2'             'preexec_binary_sha256=67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c'             'query_binary_sha256=d60e5719a4d785dbfaca90074ed3313ef9e0cae84c3f933af44d7faf84763923'             'candidate_proof_reexecuted_at_exact_head=true'             'complete_native_toolchain_provenance_bound=true'             'closed_link_trace_grammar_required=true'             'preexec_predecessor_identity_exact=true'             'candidate_accepted=true'             'replacement_authorized=false'             'live_query_authorized=false'             'credential_contents_read=false'             'payment_acceptance=false'             'public_presale_activation=false'             'wc_void_market_activation=false'             'transaction=false'             'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/credential-query-lock-v3-proof.log"
          done

          python3 -I -B             scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3.py             --derive > "$OUT"
          cmp "$OUT" ops/security/buy-void-user-manager-credential-query-elf-lock-v3.json

      - name: Reprove fixed-path hostile-loader boundary
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -static -fno-pie -no-pie -Wl,--build-id=none             -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -Wl,--build-id=none             -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"

          test "$(stat -Lc '%s' "$pre")" -eq 706504
          test "$(sha256sum "$pre" | awk '{print $1}')" =             "67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c"
          test "$(stat -Lc '%s' "$query")" -eq 47160
          test "$(sha256sum "$query" | awk '{print $1}')" =             "d60e5719a4d785dbfaca90074ed3313ef9e0cae84c3f933af44d7faf84763923"

          test -d /opt
          test ! -L /opt
          host_opt_before="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          sudo -n true

          fake="$RUNNER_TEMP/credential-lock-v3-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-lock-v3-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\""             "$fake/preload.c" -o "$fake/preload.so"

          ns="$RUNNER_TEMP/credential-lock-v3-private-opt.sh"
          cat > "$ns" <<'SH'
          set -euo pipefail
          pre="$1"
          query="$2"
          preload="$3"
          sentinel="$4"
          direct_log="$5"
          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1

          self_ns="$(stat -Lc '%i' /proc/self/ns/mnt)"
          init_ns="$(stat -Lc '%i' /proc/1/ns/mnt)"
          test "$self_ns" != "$init_ns"

          /usr/bin/mount --make-rprivate /
          /usr/bin/mount -t tmpfs -o mode=0755,uid=0,gid=0,size=16m tmpfs /opt
          /usr/bin/mountpoint -q /opt
          test "$(stat -Lc '%u:%g:%a' /opt)" = "0:0:755"

          /usr/bin/install -d -o root -g root -m 0755 "$root"
          /usr/bin/install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          /usr/bin/install -o root -g root -m 0555 "$query" "$root/$query_name"

          rm -f "$sentinel"
          if /usr/bin/env                VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1                LD_PRELOAD="$preload"                "$root/$query_name" --self-test >"$direct_log" 2>&1; then
            echo direct_poisoned_v3_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          /usr/bin/env LD_PRELOAD="$preload"             "$root/$pre_name" --exec-self-test
          test ! -e "$sentinel"
          SH

          sudo -n /usr/bin/unshare --mount --fork /usr/bin/bash "$ns"             "$pre" "$query" "$fake/preload.so" "$sentinel"             "$RUNNER_TEMP/direct-query.log" |
            tee "$RUNNER_TEMP/preexec-query.log"

          grep -Fx             'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'complete_dropin_set_sha256_emitted=true'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'complete_credential_set_sha256_emitted=true'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false'             "$RUNNER_TEMP/preexec-query.log"

          host_opt_after="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          test "$host_opt_after" = "$host_opt_before"
          test ! -e /opt/void-buy-void-user-manager-credential-query-v1

          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V3_HOSTILE_LOADER_GREEN

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
