name: void-node-clone-and-run-v1

on:
  pull_request:
    paths:
      - 'run-void-node.sh'
      - 'void-participant.sh'
      - 'scripts/copy_void_runtime_js_v1.mjs'
      - 'scripts/prove_void_node_clone_and_run_v1.mjs'
      - 'scripts/prove_public_earn_validator_onboarding_v1.mjs'
      - 'scripts/resolve_void_public_bootstrap_v1.mjs'
      - 'scripts/lib/void_public_bootstrap_manifest_media_type_v1.mjs'
      - 'docs/public/clone-and-run-v1.md'
      - 'docs/public/run-a-node.md'
      - 'README.md'
      - '.env.example'
      - '.nvmrc'
      - 'Dockerfile'
      - '.github/workflows/void-node-clone-and-run-v1.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-node-clone-and-run-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use default Node.js 24 LTS proof runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prove clone-and-run contract
        run: node scripts/prove_void_node_clone_and_run_v1.mjs

  clone-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host-node: [20, 22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install host Node.js ${{ matrix.host-node }}
        uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.host-node }}'
      - name: Start from a clean clone state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime node_modules dist .env .nodekey
          test ! -e .runtime
          test ! -e node_modules
          test ! -e .env
          test ! -e .nodekey
      - name: Prepare through the public root launcher
        shell: bash
        run: |
          set -euo pipefail
          ./run-void-node.sh prepare | tee /tmp/void-clone-run-prepare.txt
          ./run-void-node.sh doctor | tee /tmp/void-clone-run-doctor.txt
          test -f .env
          test -f .nodekey
          test "$(stat -c '%a' .nodekey)" = 600
          test -d node_modules
          test -f dist/index.js
          test -f dist/wal/wal_v1.js
          cmp -s src/wal/wal_v1.js dist/wal/wal_v1.js
          for key in \
            VOID_QUARANTINE_HOT_RUNTIME \
            VOID_DISABLE_WRAPPER_STORM \
            VOID_DISABLE_TERMINAL_SAVEBLOCK \
            VOID_DISABLE_TERMINAL_SAVEBLOCK_V2 \
            VOID_DISABLE_TXROOT_CORE_BUCKET \
            VOID_DISABLE_TXROOT_HEADER_NOOP \
            VOID_DISABLE_EARLY_WRAPPER_FAMILY \
            VOID_DISABLE_DEDUPE_TRUTHFIX_FORENSICS \
            VOID_DISABLE_SAVEBLOCK_TAIL \
            VOID_DISABLE_FINALIZE_WAL_COMMIT \
            VOID_TXROOT_OBSERVER_DISABLE \
            VOID_TXROOT_FORENSICS_STICKY_DISABLE \
            VOID_DISABLE_DRIFT \
            VOID_DRIFT_DISABLE
          do
            grep -Fx "${key}=1" .env
          done
          grep -F 'wallet_key_generated=false' /tmp/void-clone-run-prepare.txt
          grep -F 'validator_key_generated=false' /tmp/void-clone-run-prepare.txt
          grep -F 'treasury_key_generated=false' /tmp/void-clone-run-prepare.txt
          grep -F 'authority_activated=false' /tmp/void-clone-run-prepare.txt
          grep -F 'supported_node_majors=22 24 26' /tmp/void-clone-run-doctor.txt
          if test '${{ matrix.host-node }}' = 20; then
            grep -F 'runtime_source=repo_local_node24' /tmp/void-clone-run-doctor.txt
            grep -F 'node_version=v24.18.0' /tmp/void-clone-run-doctor.txt
          else
            grep -F 'runtime_source=host_node${{ matrix.host-node }}' /tmp/void-clone-run-doctor.txt
          fi
      - name: Start and sustain the local readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/void-clone-run-node.log
          READY=/tmp/void-clone-run-ready.json
          READY_AFTER_GRACE=/tmp/void-clone-run-ready-after-grace.json
          ./run-void-node.sh run >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill -TERM "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          GREEN=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4100/__void/ready.json >"$READY"; then
              GREEN=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG" >&2
              exit 1
            fi
            sleep 1
          done

          if test "$GREEN" != 1; then
            cat "$LOG" >&2
            exit 1
          fi
          test -s "$READY"
          grep -E '"ready"|ready' "$READY"
          cat "$READY"

          # The historical saveBlock wrapper fight emitted its throttled rewrap
          # report at roughly the one-minute boundary. Stay alive past it.
          sleep 70
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:4100/__void/ready.json >"$READY_AFTER_GRACE"
          test -s "$READY_AFTER_GRACE"
          grep -E '"ready"|ready' "$READY_AFTER_GRACE"
          if grep -F 'ERR_MODULE_NOT_FOUND' "$LOG"; then
            cat "$LOG" >&2
            exit 1
          fi
          if grep -F '[terminal-saveblock-v2] rewrapped live store.saveBlock' "$LOG"; then
            cat "$LOG" >&2
            exit 1
          fi
          if grep -F 'Cannot assign to read only property' "$LOG"; then
            cat "$LOG" >&2
            exit 1
          fi
          cat "$READY_AFTER_GRACE"
          echo 'VOID_NODE_CLONE_AND_RUN_V1_SUSTAINED_RUNTIME_GREEN'
