name: Buy VOID broadcaster chain2050 composition v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_ipc_v1.ts"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts"
      - "docs/operators/buy-void-prepared-transaction-broadcaster-chain2050-composition-v1.md"
      - ".github/workflows/buy-void-prepared-transaction-broadcaster-chain2050-composition-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_ipc_v1.ts"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts"
      - "docs/operators/buy-void-prepared-transaction-broadcaster-chain2050-composition-v1.md"
      - ".github/workflows/buy-void-prepared-transaction-broadcaster-chain2050-composition-v1.yml"

permissions:
  contents: read

concurrency:
  group: buy-void-broadcaster-chain2050-composition-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused Buy VOID TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
      - name: Prove stacked private broadcaster composition
        run: |
          npx tsx scripts/prove_buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts
          npx tsx scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts
          npx tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
