name: Buy VOID allocation custody witness runtime bundle qualification v1

on:
  push:
    paths:
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.md"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-qualification-v2.md"
      - ".github/workflows/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.yml"
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.md"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-qualification-v2.md"
      - ".github/workflows/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx tsx scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts
      - run: npx tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts
      - run: npm run typecheck
      - run: git diff --check
