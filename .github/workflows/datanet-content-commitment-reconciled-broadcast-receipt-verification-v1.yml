name: DataNet reconciled broadcast receipt verification v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.yml"
      - "tools/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.mjs"
      - "scripts/prove_datanet_content_commitment_reconciled_broadcast_receipt_verification_v1.mjs"
      - "schemas/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.schema.json"
      - "docs/architecture/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.md"
      - "tools/datanet-content-commitment-broadcast-reconciliation-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.yml"
      - "tools/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.mjs"
      - "scripts/prove_datanet_content_commitment_reconciled_broadcast_receipt_verification_v1.mjs"
      - "schemas/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.schema.json"
      - "docs/architecture/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.md"

permissions:
  contents: read

concurrency:
  group: datanet-reconciled-broadcast-receipt-verification-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove DataNet reconciled broadcast receipt verification
        run: |
          set -euo pipefail
          node --check tools/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.mjs
          node --check scripts/prove_datanet_content_commitment_reconciled_broadcast_receipt_verification_v1.mjs
          node -e 'JSON.parse(require("fs").readFileSync("schemas/datanet-content-commitment-reconciled-broadcast-receipt-verification-v1.schema.json","utf8"))'
          node scripts/prove_datanet_content_commitment_broadcast_authorization_consumption_v1.mjs
          node scripts/prove_datanet_content_commitment_broadcaster_inspection_access_v1.mjs
          node scripts/prove_datanet_content_commitment_exact_single_submission_v1.mjs
          node scripts/prove_datanet_content_commitment_broadcast_reconciliation_v1.mjs
          node scripts/prove_datanet_content_commitment_reconciled_broadcast_receipt_verification_v1.mjs
          git diff --exit-code
