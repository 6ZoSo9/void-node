name: Buy VOID production fulfillment gas attestation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-production-gas-attestation-v1.yml"
      - "src/economic/buy_void_presale_fulfillment_local_gas_evidence_v1.ts"
      - "tools/buy-void-presale-fulfillment-production-gas-observer-v1.mjs"
      - "scripts/prove_buy_void_presale_fulfillment_production_gas_observer_v1.mjs"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "docs/operators/buy-void-presale-fulfillment-production-gas-attestation-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-presale-fulfillment-production-gas-attestation-v1.yml"
      - "src/economic/buy_void_presale_fulfillment_local_gas_evidence_v1.ts"
      - "tools/buy-void-presale-fulfillment-production-gas-observer-v1.mjs"
      - "scripts/prove_buy_void_presale_fulfillment_production_gas_observer_v1.mjs"
      - "src/economic/buy_void_payment_keyed_runtime_activation_configuration_contract_v1.ts"
      - "docs/operators/buy-void-presale-fulfillment-production-gas-attestation-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove production gas observation boundary
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          node --check tools/buy-void-presale-fulfillment-production-gas-observer-v1.mjs
          node --check scripts/prove_buy_void_presale_fulfillment_production_gas_observer_v1.mjs
          node scripts/prove_buy_void_presale_fulfillment_production_gas_observer_v1.mjs
          git diff --check
