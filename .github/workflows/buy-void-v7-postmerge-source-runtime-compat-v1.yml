name: Buy VOID V7 postmerge source/runtime compatibility V1

on:
  pull_request:
    paths:
      - '.github/workflows/buy-void-v7-postmerge-source-runtime-compat-v1.yml'
      - 'docs/operators/buy-void-v7-postmerge-source-runtime-compat-v1.md'
      - 'ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py'
      - 'scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/buy-void-v7-postmerge-source-runtime-compat-v1.yml'
      - 'docs/operators/buy-void-v7-postmerge-source-runtime-compat-v1.md'
      - 'ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py'
      - 'scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py'

permissions:
  contents: read

jobs:
  source-runtime-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact compatibility scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_HEAD: fd8131500330d8f8d51caa8275db456338c0a878
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$SOURCE_BASE_HEAD" "$EXPECTED_HEAD"
          cat > /tmp/expected-delta <<'EOF'
          A	.github/workflows/buy-void-v7-postmerge-source-runtime-compat-v1.yml
          A	docs/operators/buy-void-v7-postmerge-source-runtime-compat-v1.md
          A	ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py
          A	scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py
          EOF
          git diff --name-status "$SOURCE_BASE_HEAD" "$EXPECTED_HEAD" -- | sort > /tmp/actual-delta
          sort /tmp/expected-delta > /tmp/expected-delta.sorted
          diff -u /tmp/expected-delta.sorted /tmp/actual-delta
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py)" = "1db8fa024731a7bc342d14049a5a97491808041c"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py)" = "4bb6b196338587a2ecfccabd939cc671c9150ecf"
          test "$(git rev-parse HEAD:docs/operators/buy-void-v7-postmerge-source-runtime-compat-v1.md)" = "ac6f2f975620396fe2ff798271e365bad299ce49"
          git diff --check "$SOURCE_BASE_HEAD" "$EXPECTED_HEAD"

      - name: Python syntax
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          for rel in (
              "ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py",
              "scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py",
          ):
              raw = Path(rel).read_bytes()
              compile(raw, rel, "exec", dont_inherit=True, optimize=0)
          PY

      - name: Source self-test and inert plan
        run: |
          python3 -I -B ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py --self-test
          python3 -I -B ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py --plan

      - name: Exact checkout compatibility verification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -B \
            ops/precision/void_buy_void_v7_postmerge_source_runtime_compat_v1.py \
            --verify \
            --checkout "$GITHUB_WORKSPACE" \
            --expected-head "$EXPECTED_HEAD"

      - name: Exact source proof
        run: |
          python3 -I -B scripts/prove_buy_void_v7_postmerge_source_runtime_compat_v1.py
