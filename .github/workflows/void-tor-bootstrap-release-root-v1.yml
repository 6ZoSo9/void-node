name: VOID Tor bootstrap release root v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-tor-bootstrap-release-root-v1.yml'
      - 'config/void-tor-bootstrap-release-root-v1.json'
      - 'docs/public/void-tor-bootstrap-release-root-v1.md'
      - 'scripts/lib/void_tor_bootstrap_release_root_v1.mjs'
      - 'scripts/lib/void_tor_native_bootstrap_transport_v1.mjs'
      - 'scripts/prove_void_tor_bootstrap_release_root_v1.mjs'
      - 'scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs'
      - 'scripts/resolve_void_tor_public_bootstrap_v1.mjs'
      - 'tools/build-public-release-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-tor-bootstrap-release-root-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check release-root source
        run: |
          node --check scripts/lib/void_tor_bootstrap_release_root_v1.mjs
          node --check scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs
          node --check scripts/prove_void_tor_bootstrap_release_root_v1.mjs

      - name: Prove embedded release-root boundary
        run: node scripts/prove_void_tor_bootstrap_release_root_v1.mjs

  repository-and-release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Prove release archive embedding
        run: node scripts/prove_void_tor_bootstrap_release_root_v1.mjs --full

      - name: Diff hygiene
        run: git diff --check

      - name: Reject raw empty catches
        run: |
          ! grep -REn 'catch[[:space:]]*\{[[:space:]]*\}' -- \
            scripts/lib/void_tor_bootstrap_release_root_v1.mjs \
            scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs \
            scripts/prove_void_tor_bootstrap_release_root_v1.mjs


  external-onion-reachability-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install Tor client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor

      - name: Bootstrap isolated Tor client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/void-tor-client-data"
          printf '%s\n' \
            "DataDirectory $RUNNER_TEMP/void-tor-client-data" \
            "SocksPort 127.0.0.1:19051" \
            "SafeSocks 1" \
            "SafeLogging 1" \
            "ClientOnly 1" \
            "RunAsDaemon 0" \
            "Log notice stdout" \
            >"$RUNNER_TEMP/void-tor-client.conf"

          tor --verify-config -f "$RUNNER_TEMP/void-tor-client.conf"
          tor -f "$RUNNER_TEMP/void-tor-client.conf" >"$RUNNER_TEMP/tor-client.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/tor-client.pid"

          for _ in $(seq 1 180); do
            if grep -Fq 'Bootstrapped 100% (done): Done' "$RUNNER_TEMP/tor-client.log" &&
               ss -H -ltn | awk '{print $4}' | grep -Eq '127\.0\.0\.1:19051$'; then
              echo "tor_bootstrap_100=true"
              echo "tor_socks_ready=true"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/tor-client.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/tor-client.log" >&2
              exit 1
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/tor-client.log" >&2
          exit 1

      - name: Probe Nimo onion directly
        shell: bash
        env:
          ONION_BASE: 'http://6a4r6osb37sp2t6nbx7dpdnq5wfdzdrn5axt7t33kduzuznarqqpnkid.onion'
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "external_probe_attempt=$attempt"
            set +e
            ONION_BASE="$ONION_BASE" node --input-type=module <<'NODE'
import { requestOnionJson } from "./scripts/lib/void_tor_native_bootstrap_transport_v1.mjs";

try {
  const sample = await requestOnionJson({
    base: process.env.ONION_BASE,
    path: "/__void/ready.json",
    socksHost: "127.0.0.1",
    socksPort: 19051,
    timeoutMs: 45000,
  });
  console.log(`sample=${JSON.stringify(sample)}`);
  if (
    sample?.ready !== true ||
    !Number.isSafeInteger(sample?.head) ||
    sample.head < 1951058 ||
    sample?.gap !== 0 ||
    sample?.txroot_live !== 1
  ) {
    throw new Error("outside onion readiness is not exact-green");
  }
  console.log("external_onion_reachable=true");
  console.log("external_onion_exact_green=true");
} catch (error) {
  console.error(error?.stack || String(error));
  process.exit(23);
}
NODE
            rc=$?
            set -e
            if test "$rc" -eq 0; then
              success=1
              break
            fi
            sleep 20
          done

          test "$success" -eq 1
          echo "VOID_TOR_ONION_EXTERNAL_REACHABILITY_V1_GREEN"
