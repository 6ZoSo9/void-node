name: VOID Tor bootstrap release root v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-tor-bootstrap-release-root-v1.yml'
      - 'config/void-tor-bootstrap-release-root-v1.json'
      - 'docs/public/void-tor-bootstrap-release-root-v1.md'
      - 'scripts/lib/void_tor_bootstrap_release_root_v1.mjs'
      - 'scripts/lib/void_tor_native_bootstrap_transport_v1.mjs'
      - 'scripts/prove_void_tor_bootstrap_release_root_v1.mjs'
      - 'scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs'
      - 'scripts/resolve_void_tor_public_bootstrap_v1.mjs'
      - 'tools/build-public-release-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-tor-bootstrap-release-root-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check release-root source
        run: |
          node --check scripts/lib/void_tor_bootstrap_release_root_v1.mjs
          node --check scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs
          node --check scripts/prove_void_tor_bootstrap_release_root_v1.mjs

      - name: Prove embedded release-root boundary
        run: node scripts/prove_void_tor_bootstrap_release_root_v1.mjs

  repository-and-release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Prove release archive embedding
        run: node scripts/prove_void_tor_bootstrap_release_root_v1.mjs --full

      - name: Diff hygiene
        run: git diff --check

      - name: Reject raw empty catches
        run: |
          ! grep -REn 'catch[[:space:]]*\{[[:space:]]*\}' -- \
            scripts/lib/void_tor_bootstrap_release_root_v1.mjs \
            scripts/resolve_void_tor_public_bootstrap_release_root_v1.mjs \
            scripts/prove_void_tor_bootstrap_release_root_v1.mjs
