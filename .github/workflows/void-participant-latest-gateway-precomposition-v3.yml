name: VOID participant latest gateway precomposition V3

on:
  pull_request:
    paths:
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "tools/void-public-participant-production-composition-current-gateway-v2.mjs"
      - "scripts/prove_void_public_participant_production_composition_current_gateway_v2.mjs"
      - "scripts/prove_void_participant_latest_gateway_precomposition_v3.mjs"
      - ".github/workflows/void-participant-latest-gateway-precomposition-v3.yml"
      - "docs/security/void-public-participant-latest-gateway-precomposition-v3.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-participant-latest-gateway-precomp-v3-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  source:
    name: Participant source isolation / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Exact draft checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact frozen child and current parent Git identities
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object ops/public/void-public-app-composition-gateway-v1.mjs)" = "d7174ee47ce2438fcc88764a76e08e7cc7f46787"
          test "$(git hash-object tools/void-public-participant-production-composition-current-gateway-v2.mjs)" = "1acd2ab1d46e06dc0b19059c5e8686a9856ca428"
          test "$(git hash-object scripts/prove_void_public_participant_production_composition_current_gateway_v2.mjs)" = "e9e5ab8419534dffafcee195e7b6ab663711108f"
          test "$(git hash-object tools/void-public-participant-production-composition-preflight-v1.mjs)" = "507ee9a1c9b553a86944b2e5287f220c6af73044"
          test "$(git hash-object scripts/prove_void_participant_latest_gateway_precomposition_v3.mjs)" = "b0d04472ce2f723985d7e09a78a6cf29b34d7357"
          git cat-file -e 'd49126c39e298313b1151f1cbd3b4068339c0aaa^{commit}'
          test "$(git show d49126c39e298313b1151f1cbd3b4068339c0aaa:ops/public/void-public-app-composition-gateway-v1.mjs | git hash-object --stdin)" = "b718c5eccedc8d1ac08d1bd8f2281304ca49e152"
      - name: Install reviewed supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build test-only participant security source
        run: npm run build
      - name: Qualify parent source isolation and actual V2 behavior
        run: |
          set -euo pipefail
          node --check scripts/prove_void_participant_latest_gateway_precomposition_v3.mjs
          node scripts/prove_void_participant_latest_gateway_precomposition_v3.mjs \
            | tee "$RUNNER_TEMP/participant-precomposition-v3-node-${{ matrix.node }}.txt"
          for marker in \
            VOID_PARTICIPANT_LATEST_GATEWAY_PRECOMPOSITION_V3_GREEN \
            old_and_latest_gateway_source_blobs_exact=true \
            only_checkout_post_block_changed=true \
            participant_outside_checkout_bytes_identical=true \
            sixteen_non_gateway_security_source_blobs_unchanged=true \
            historical_v2_actual_session_behavior_replayed=true \
            frozen_v1_source_refusal_preserved=true \
            unmerged_child_gateway_still_old=true \
            host_or_service_activation_authorized=false \
            key_wallet_paid_work_wc_funds_access=false
          do
            grep -Fx "$marker" "$RUNNER_TEMP/participant-precomposition-v3-node-${{ matrix.node }}.txt"
          done
      - name: Full TypeScript source typecheck on Node 24
        if: matrix.node == 24
        run: npm run typecheck
      - name: Upload synthetic, no-authority receipt outside checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: participant-precomp-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/participant-precomposition-v3-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 2
      - name: Require whitespace and clean source checkout
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          if [ -n "$BASE" ]; then
            base="$(git merge-base "$BASE" HEAD)"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          git diff --check "$base" HEAD

  parity:
    needs: [source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download independently generated Node proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: participant-precomp-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require byte-identical 22 24 26 observations
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "receipts/participant-precomposition-v3-node-$v.txt"; done
          cmp receipts/participant-precomposition-v3-node-22.txt receipts/participant-precomposition-v3-node-24.txt
          cmp receipts/participant-precomposition-v3-node-22.txt receipts/participant-precomposition-v3-node-26.txt
          grep -Fx "unmerged_child_gateway_still_old=true" receipts/participant-precomposition-v3-node-22.txt
          grep -Fx "host_or_service_activation_authorized=false" receipts/participant-precomposition-v3-node-22.txt
          echo "VOID_PARTICIPANT_PARENT_PRECOMPOSITION_THREE_NODE_GREEN"
          echo "source_stack_integrated=false"
