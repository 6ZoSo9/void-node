name: VOID DataNet H1 publication primitives

on:
  pull_request:
    paths:
      - "src/storage/datanet_state_derived_h1_v1.ts"
      - "scripts/prove_datanet_h1_publication_primitives_v1.ts"
      - ".github/workflows/void-datanet-h1-publication-primitives-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck publication primitive proof
        run: >-
          npx tsc --noEmit --pretty false --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          src/storage/datanet_state_derived_h1_v1.ts
          scripts/prove_datanet_h1_publication_primitives_v1.ts
      - name: Prove reservation and create-only publication primitives
        run: npx tsx scripts/prove_datanet_h1_publication_primitives_v1.ts
