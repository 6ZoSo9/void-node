name: public-node-operator-trial-submission-intake

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-submission-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial submission intake
        run: bash tools/check_public_node_operator_trial_submission_intake_v1.sh
