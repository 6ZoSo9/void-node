name: Buy VOID Epoch-2 V6R3 authenticated host-plan first-entry V1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py'
      - 'scripts/prove_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-authenticated-host-plan-first-entry-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-authenticated-host-plan-first-entry-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
  push:
    branches: [ main ]
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py'
      - 'scripts/prove_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-authenticated-host-plan-first-entry-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-authenticated-host-plan-first-entry-v1.yml'
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'

permissions:
  contents: read

jobs:
  fixture-only-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax only
        run: |
          python3 -I -B -S -m py_compile \
            ops/precision/void_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py \
            scripts/prove_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py
      - name: Synthetic sealed first-entry and checkout HOLD proof
        run: |
          python3 -I -B -S scripts/prove_buy_void_epoch2_v6r3_authenticated_host_plan_first_entry_v1.py
      - name: Source diff hygiene
        run: git diff --check
