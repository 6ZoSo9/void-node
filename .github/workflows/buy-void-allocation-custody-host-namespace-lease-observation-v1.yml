name: VOID Buy custody host namespace lease observation v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py"
      - "scripts/prove_void_buy_allocation_custody_host_namespace_lease_observation_v1.py"
      - "docs/operators/buy-void-allocation-custody-host-namespace-lease-observation-v1.md"
      - ".github/workflows/buy-void-allocation-custody-host-namespace-lease-observation-v1.yml"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact namespace-observation successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="acace7d9051126b07f71ecf1a50fdeaf64a0c24f"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-host-namespace-lease-observation-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-host-namespace-lease-observation-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_host_namespace_lease_observation_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py)" = \
            "08094872d5a8aca720ae0a9f710866890d8132e7"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_host_namespace_lease_observation_v1.py)" = \
            "3592efa15fef86f8cf8d593d8c7456d33a0ff929"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-host-namespace-lease-observation-v1.md)" = \
            "00ee728e06a592161b4a14c58245bd7d75b32c43"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py)" = \
            "ded737a228a627a241a84131113db6d3521f635c"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_host_namespace_lease_observation_v1.py

      - name: Self-test without host observation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ns-observation-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_host_namespace_lease_observation_v1.py \
            --self-test | tee "$out"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_HOST_NAMESPACE_LEASE_OBSERVATION_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'process_census_source_exact=true' \
            'pid_namespace_candidate_format=true' \
            'mount_namespace_candidate_format=true' \
            'pid1_namespace_match_required=true' \
            'mount_namespace_match_required=true' \
            'pid_namespace_mismatch_rejected=true' \
            'mount_namespace_mismatch_rejected=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'descriptor_relative_bounded_reader_tested=true' \
            'proc_self_intermediate_symlink_supported=true' \
            'proc_fdinfo_zero_size_reader_tested=true' \
            'proc_mount_id_reader_tested=true' \
            'boot_id_same_boot_binding=true' \
            'operator_observation_only=true' \
            'operator_must_independently_know_host_context=true' \
            'independent_host_context_attested=false' \
            'lease_authority=false' \
            'automatic_process_census_composition_authorized=false' \
            'python_no_bytecode_mode_required=true' \
            'production_filesystem_write=false' \
            'root_execution_forbidden=true' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/ns-observation-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_host_namespace_lease_observation_v1.py \
            | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_HOST_NAMESPACE_LEASE_OBSERVATION_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'process_census_source_exact=true' \
            'pid_namespace_candidate_format=true' \
            'mount_namespace_candidate_format=true' \
            'pid1_namespace_match_required=true' \
            'mount_namespace_match_required=true' \
            'pid_namespace_mismatch_rejected=true' \
            'mount_namespace_mismatch_rejected=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'descriptor_relative_bounded_reader_tested=true' \
            'proc_fdinfo_zero_size_reader_tested=true' \
            'proc_mount_id_reader_tested=true' \
            'boot_id_same_boot_binding=true' \
            'operator_observation_only=true' \
            'operator_must_independently_know_host_context=true' \
            'independent_host_context_attested=false' \
            'lease_authority=false' \
            'automatic_process_census_composition_authorized=false' \
            'python_no_bytecode_mode_required=true' \
            'without_dash_b_bootstrap_hold=true' \
            'host_observation_not_executed_in_ci=true' \
            'production_filesystem_write=false' \
            'root_execution_forbidden=true' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
