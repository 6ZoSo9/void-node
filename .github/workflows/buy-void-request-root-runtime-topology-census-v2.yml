name: VOID Buy request-root runtime-topology census v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_request_root_runtime_topology_census_v2.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v2.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v3.py"
      - "docs/operators/buy-void-request-root-runtime-topology-census-v2.md"
      - ".github/workflows/buy-void-request-root-runtime-topology-census-v2.yml"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_qualification_v1.ts"
      - "tools/void-buy-stable-request-root-policy-v1.mjs"
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_request_root_runtime_topology_census_v2.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v2.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v3.py"
      - "docs/operators/buy-void-request-root-runtime-topology-census-v2.md"
      - ".github/workflows/buy-void-request-root-runtime-topology-census-v2.yml"
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_qualification_v1.ts"
      - "tools/void-buy-stable-request-root-policy-v1.mjs"
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove V3 source contract
        run: |
          set -euo pipefail
          set +e
          python3 -I -B scripts/prove_void_buy_request_root_runtime_topology_census_v2.py \
            > "$RUNNER_TEMP/request-root-topology-v2.hold" 2>&1
          v2_rc=$?
          set -e
          test "$v2_rc" -ne 0
          grep -Fq 'parent_blob_drift' "$RUNNER_TEMP/request-root-topology-v2.hold"
          grep -Fq 'src/economic/buy_void_verified_payment_capacity_admission_v1.ts' \
            "$RUNNER_TEMP/request-root-topology-v2.hold"
          proof="$RUNNER_TEMP/request-root-topology-v3-proof.txt"
          python3 -I -B scripts/prove_void_buy_request_root_runtime_topology_census_v3.py | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_REQUEST_ROOT_RUNTIME_TOPOLOGY_CENSUS_V3_PROOF_GREEN' "$proof"
          grep -Fx 'accepted_stable_request_root_policy_blob_bound=true' "$proof"
          grep -Fx 'accepted_custody_readable_source_blobs_bound=true' "$proof"
          grep -Fx 'double_census_stability_required=true' "$proof"
          grep -Fx 'designated_machine_id_binding_required=true' "$proof"
          grep -Fx 'authenticated_user_manager_binding_verified=false' "$proof"
          grep -Fx 'target_live_binding_fail_closed_until_authenticated_manager=true' "$proof"
          grep -Fx 'request_payment_contents_read=false' "$proof"
          grep -Fx 'historical_request_history_disposition_proven=false' "$proof"
          grep -Fx 'migration_authorized=false' "$proof"
          grep -Fx 'production_gate_ready=false' "$proof"
      - name: Prove inert plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/request-root-topology-v2-plan.txt"
          python3 -I -B ops/precision/void_buy_request_root_runtime_topology_census_v2.py --plan | tee "$plan"
          grep -Fx 'read_only=true' "$plan"
          grep -Fx 'sudo_required=false' "$plan"
          grep -Fx 'filesystem_write=false' "$plan"
          grep -Fx 'request_payment_contents_read=false' "$plan"
          grep -Fx 'authenticated_user_manager_binding_verified=false' "$plan"
          grep -Fx 'historical_request_history_disposition_proven=false' "$plan"
          grep -Fx 'migration_authorized=false' "$plan"
          grep -Fx 'public_presale_activation=false' "$plan"
          grep -Fx 'funds_movement=false' "$plan"
          grep -Fx 'production_gate_ready=false' "$plan"
          grep -Fx 'next_action=INTEGRATE_MERGED_3057_AUTHENTICATED_USER_MANAGER_BINDING' "$plan"
      - name: Diff hygiene
        run: git diff --check
