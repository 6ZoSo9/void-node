name: VOID sponsored host time-sync evidence v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-sponsored-host-time-sync-evidence-v1.yml"
      - "docs/operators/economic-sponsored-host-time-sync-evidence-v1.md"
      - "scripts/prove_void_economic_sponsored_host_time_sync_evidence_v1.mjs"
      - "tools/void-economic-sponsored-host-time-sync-evidence-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-sponsored-host-time-sync-evidence-v1.yml"
      - "docs/operators/economic-sponsored-host-time-sync-evidence-v1.md"
      - "scripts/prove_void_economic_sponsored_host_time_sync_evidence_v1.mjs"
      - "tools/void-economic-sponsored-host-time-sync-evidence-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-sponsored-host-time-sync-evidence-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check tools/void-economic-sponsored-host-time-sync-evidence-v1.mjs
          node --check scripts/prove_void_economic_sponsored_host_time_sync_evidence_v1.mjs

      - name: Prove host time-sync evidence
        run: node scripts/prove_void_economic_sponsored_host_time_sync_evidence_v1.mjs

      - name: Verify source tree cleanliness
        run: test -z "$(git status --short)"

      - name: Diff hygiene
        run: git diff --check
