name: Buy VOID Epoch-2 dormant binder installed qualification v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py"
      - "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py"
      - "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact installed-qualification generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse "$EXPECTED_HEAD^1")"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          actual="$RUNNER_TEMP/actual-scope.txt"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          test -s "$actual"
          while IFS= read -r changed; do
            case "$changed" in
              '.github/workflows/buy-void-epoch2-dormant-binder-installed-qualification-v2.yml'|\
              'docs/operators/buy-void-epoch2-dormant-binder-installed-qualification-v2.md'|\
              'ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py'|\
              'scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py')
                ;;
              *)
                echo "historical_v2_scope_violation=$changed" >&2
                exit 1
                ;;
            esac
          done < "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py)" =             9b38d2186c2a0db0042e5fd0d551566a1f8f646c
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py)" =             0d7d41a2bcdcd570865b0a75c1e7879561f7a6d5
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py)" =             c0ecc584f664c4eea8cdcc45d2ba0f07046282dc
          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py",
              "scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_INSTALLED_QUALIFICATION_V2_SYNTAX_GREEN")
          PY

      - name: Prove read-only installed qualification
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dormant-binder-installed-qualification-v2.log"
          python3 -I -B scripts/prove_void_buy_void_epoch2_dormant_binder_installed_qualification_v2.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_INSTALLED_QUALIFICATION_V2_PROOF_GREEN"
            "hardened_installer_source_blob_bound=true"
            "accepted_v3_lock_rechecked=true"
            "protected_install_state_required_green=true"
            "installed_root_descriptor_bound=true"
            "exact_native_identity_rechecked=true"
            "exact_binder_identity_rechecked=true"
            "installed_generation_before_middle_after_required=true"
            "double_native_self_test_required=true"
            "native_self_test_descriptor_bound=true"
            "binder_execution=false"
            "live_binding_execution=false"
            "credential_access=false"
            "private_key_access=false"
            "signing=false"
            "transaction=false"
            "payment_acceptance=false"
            "customer_safe_to_pay=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
            "next_gate=SEPARATELY_AUTHORIZE_EPOCH2_V3R_DORMANT_CANDIDATE_LIVE_BINDING"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
