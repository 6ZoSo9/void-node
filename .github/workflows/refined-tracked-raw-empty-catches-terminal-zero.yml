name: refined-tracked-raw-empty-catches-terminal-zero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refined-tracked-raw-empty-catches-terminal-zero.yml'
      - 'scripts/prove_http_tx_routes_empty_catch_visibility_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_root_readme_public_discovery_link_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_closeout_discovery_link_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts'
      - 'scripts/prove_src_index_js_raw_empty_catches_window_0101_0119_v1.ts'
      - 'scripts/prove_src_diag_preload_bundle_raw_empty_catches_visibility_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_public_discovery_index_v1.ts'
      - 'README.md'
      - 'docs/public/refined-tracked-raw-empty-catches-*.md'
      - 'docs/public/refined-tracked-raw-empty-catches-*.json'
      - 'docs/security/refined-tracked-raw-empty-catches-*.md'
      - 'docs/security/refined-tracked-raw-empty-catches-*.json'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.cts'
      - '**/*.mjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  pull_request:
    paths:
      - '.github/workflows/refined-tracked-raw-empty-catches-terminal-zero.yml'
      - 'scripts/prove_http_tx_routes_empty_catch_visibility_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_root_readme_public_discovery_link_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_closeout_discovery_link_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts'
      - 'scripts/prove_src_index_js_raw_empty_catches_window_0101_0119_v1.ts'
      - 'scripts/prove_src_diag_preload_bundle_raw_empty_catches_visibility_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_public_discovery_index_v1.ts'
      - 'README.md'
      - 'docs/public/refined-tracked-raw-empty-catches-*.md'
      - 'docs/public/refined-tracked-raw-empty-catches-*.json'
      - 'docs/security/refined-tracked-raw-empty-catches-*.md'
      - 'docs/security/refined-tracked-raw-empty-catches-*.json'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.cts'
      - '**/*.mjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: refined tracked raw empty catches remain zero
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Prove HTTP tx routes retire legacy mutation authority
        run: npx tsx scripts/prove_http_tx_routes_empty_catch_visibility_v1.ts

      - name: Prove root README public discovery link remains green
        run: npx tsx scripts/prove_refined_tracked_raw_empty_catches_root_readme_public_discovery_link_v1.ts

      - name: Prove closeout discovery link remains green
        run: npx tsx scripts/prove_refined_tracked_raw_empty_catches_closeout_discovery_link_v1.ts

      - name: Prove terminal final seal remains green
        run: npx tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Prove final src/index.js zero window remains green
        run: npx tsx scripts/prove_src_index_js_raw_empty_catches_window_0101_0119_v1.ts

      - name: Prove src_diag remains closed
        run: npx tsx scripts/prove_src_diag_preload_bundle_raw_empty_catches_visibility_v1.ts
