name: VOID P2P authenticated peer identity v1

on:
  pull_request:
    paths:
      - "src/node_core.ts"
      - "src/p2p/auth_v1.ts"
      - "scripts/prove_void_p2p_multipath_address_v1.ts"
      - "scripts/prove_void_p2p_authenticated_peer_identity_v1.ts"
      - "docs/public/void-p2p-authenticated-peer-identity-v1.md"
      - ".github/workflows/void-p2p-authenticated-peer-identity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx --no-install tsx scripts/prove_void_p2p_multipath_address_v1.ts
      - run: npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts
      - run: git diff --check
