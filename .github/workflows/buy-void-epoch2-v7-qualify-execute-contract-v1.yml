name: Buy VOID Epoch-2 V7 qualify/execute contract v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-v7-qualify-execute-contract-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-v7-qualify-execute-contract-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-v7-qualify-execute-contract-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-v7-qualify-execute-contract-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V7 execution-contract generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request) base="f226bb5f4c938a8b51fe8bdfbef3b6985ac0e7ac" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="f226bb5f4c938a8b51fe8bdfbef3b6985ac0e7ac" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$base"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-v7-qualify-execute-contract-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-v7-qualify-execute-contract-v1.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py)" = \
            904fa78c8d21ce03082151a738c0c53099f20ff7
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py)" = \
            4c8d86fea5af335faf81a2a6643277de3c2d02b0
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-installer-bootstrap-v7-qualify_execute_contract-v1.md)" = \
            3912de9211b5ffca96a4946d4ca1a57024ad6469

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py)" = \
            9ea4a7d34a66f81ed568adaed693755ebca37b66
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_plan_v7.py)" = \
            66263ef1beb35d5611683f456f95cafd5e0007ec
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py)" = \
            d9650aff7af2cb9fc9a8d95a888d8dd52aef1970

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_V7_QUALIFY_EXECUTE_CONTRACT_V1_SYNTAX_GREEN")
          PY

      - name: Prove non-executing two-phase contract
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
          out="$RUNNER_TEMP/v7-qualify-execute-contract-v1-proof.log"
          python3 -I -B "$proof" | tee "$out"
          markers=(
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALLER_BOOTSTRAP_V7_QUALIFY_EXECUTE_CONTRACT_V1_PROOF_GREEN'
            'target_blob_bound=true'
            'planner_v7_blob_bound=true'
            'planner_v7_proof_blob_bound=true'
            'repaired_qualifier_blob_bound=true'
            'planner_output_descriptor_read_only=true'
            'canonical_planner_body_required=true'
            'planner_plan_id_recomputed=true'
            'exact_qualification_contract_required=true'
            'nonroot_qualification_phase_required=true'
            'descriptor_bound_qualification_source_required=true'
            'qualification_git_callbacks_neutralized_required=true'
            'qualification_green_before_root_phase_required=true'
            'root_bootstrap_plan_phase_structured_only=true'
            'root_boundary_implementation_separate=true'
            'execution_code_absent=true'
            'filesystem_write=false'
            'service_mutation=false'
            'credential_access=false'
            'signing=false'
            'transaction=false'
            'rpc_call=false'
            'payment_acceptance=false'
            'public_presale_activation=false'
            'wc_void_market_activation=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

      - name: Verify source-only handoff
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_installer_bootstrap_v7_qualify_execute_contract_v1.py"
          out="$RUNNER_TEMP/v7-qualify-execute-contract-v1-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$out"
          markers=(
            'mode=source-plan'
            'source_only=true'
            'host_read=false'
            'host_write=false'
            'phase_order=nonroot_qualification_then_root_bootstrap_plan'
            'qualification_source_execution_mode=descriptor_bound_exact_git_object'
            'qualification_git_callbacks_neutralized_required=true'
            'root_boundary_implementation=separately_reviewed_operator_boundary_required'
            'qualification_execution_performed=false'
            'bootstrap_execution_performed=false'
            'protected_installer_apply_performed=false'
            'root_boundary_execution_performed=false'
            'filesystem_write=false'
            'service_mutation=false'
            'credential_access=false'
            'signing=false'
            'transaction=false'
            'rpc_call=false'
            'payment_acceptance=false'
            'public_presale_activation=false'
            'wc_void_market_activation=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
