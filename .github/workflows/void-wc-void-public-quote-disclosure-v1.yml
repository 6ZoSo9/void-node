name: VOID WC/VOID public quote disclosure v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-public-quote-disclosure-v1.mjs"
      - "scripts/prove_void_wc_void_public_quote_disclosure_v1.mjs"
      - "docs/operators/wc-void-public-quote-disclosure-v1.md"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "docs/ren/current-state-v1.md"
      - "ops/mainnet/CURRENT_TRUTH.md"
      - "docs/ren/journal/2026-09-27-public-quote-disclosure-v1.md"
      - ".github/workflows/void-wc-void-public-quote-disclosure-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-public-quote-disclosure-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove public quote disclosure
        run: node scripts/prove_void_wc_void_public_quote_disclosure_v1.mjs

      - name: Prove coupled successor remains fail closed
        run: node scripts/prove_void_coupled_economic_successor_gate_v1.mjs

      - name: Diff hygiene
        run: git diff --check
