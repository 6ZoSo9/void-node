name: VOID V7 V5 source receipt stage installers v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-v7-v5-source-receipt-stage-install-v1.yml"
      - "docs/operators/buy-void-v7-v5-source-receipt-stage-install-v1.md"
      - "ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py"
      - "ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py"
      - "scripts/prove_buy_void_v7_v5_source_stage_install_v1.py"
      - "scripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py"
      - "ops/security/buy-void-v7-v5-source-receipt-stage-plan-v1.json"
      - "ops/security/buy-void-source-finality-v7-deployment-receipt-v5.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout exact installer head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and six-add scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=c12655339153db9892ba7b508bd0cddaab6f8dcc
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'A\t.github/workflows/buy-void-v7-v5-source-receipt-stage-install-v1.yml'
            $'A\tdocs/operators/buy-void-v7-v5-source-receipt-stage-install-v1.md'
            $'A\tops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py'
            $'A\tops/precision/void_buy_void_v7_v5_source_stage_install_v1.py'
            $'A\tscripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py'
            $'A\tscripts/prove_buy_void_v7_v5_source_stage_install_v1.py'
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${actual[$i]}" = "${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Bind exact installer surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py)" = "ce4497baae23c75abc7e459b7dff85010df9806f"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py)" = "edb57a8128624327917d93bfcd81e2ff3873c2ee"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v5_source_stage_install_v1.py)" = "a39c51f9f6bd7ff62f38c13d39482e631d82daa1"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py)" = "463fb162f56c843182b719d8dbeddeae3bb6173e"
          test "$(git rev-parse HEAD:docs/operators/buy-void-v7-v5-source-receipt-stage-install-v1.md)" = "f5e990b947979eaa0d23ef16071ad3f44f3f345f"
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-v5-source-receipt-stage-plan-v1.json)" = "1ce5de6d4ffa0a89ead32ca734d43f0da72fed59"
          test "$(git rev-parse HEAD:ops/security/buy-void-source-finality-v7-deployment-receipt-v5.json)" = "933e81f5d695eba57b969bf7da0d565be5198073"

      - name: Syntax and focused proofs
        shell: bash
        run: |
          set -euo pipefail
          python -I -B -m py_compile ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py scripts/prove_buy_void_v7_v5_source_stage_install_v1.py scripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py
          python -I -B scripts/prove_buy_void_v7_v5_source_stage_install_v1.py
          python -I -B scripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py

      - name: Preserve bounded copy walker fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python -I -B - <<'PY'
          import os, pathlib, runpy, tempfile
          m=runpy.run_path("ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py",run_name="v5_source_stage_fixture")
          E=m["InstallError"]; walk=m["_copy_candidate_tree_iterative"]
          with tempfile.TemporaryDirectory(prefix="v5-stage-copy-") as td:
              root=pathlib.Path(td); src=root/"src"; dst=root/"dst"; src.mkdir(); dst.mkdir()
              for i in range(6): (src/("n"+str(i))).mkdir()
              s=os.open(src,os.O_RDONLY|os.O_DIRECTORY|os.O_CLOEXEC|os.O_NOFOLLOW)
              d=os.open(dst,os.O_RDONLY|os.O_DIRECTORY|os.O_CLOEXEC|os.O_NOFOLLOW)
              try:
                  try: walk(s,d,node_limit=3,depth_limit=8,total_limit=1024)
                  except E as exc:
                      if str(exc)!="copy_node_limit": raise
                  else: raise SystemExit("copy_node_limit_not_enforced")
              finally: os.close(d); os.close(s)
          print("VOID_V7_V5_SOURCE_STAGE_COPY_FIXTURE_GREEN")
          PY

      - name: Exercise receipt-stage create-only fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python -I -B - <<'PY'
          import contextlib
          import hashlib
          import io
          import os
          import pathlib
          import runpy
          import stat
          import tempfile

          m=runpy.run_path(
              "ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py",
              run_name="v5_receipt_stage_fixture",
          )
          g=m["collect_plan"].__globals__
          with tempfile.TemporaryDirectory(prefix="v5-receipt-stage-fixture-") as td:
              parent=pathlib.Path(td)
              fixed=parent/"fixed-v4.json"
              fixed_raw=b'{"fixture":"v4"}\n'
              fixed.write_bytes(fixed_raw)
              os.chown(fixed,0,0)
              os.chmod(fixed,0o444)

              g["PARENT"]=parent
              g["TARGET"]=parent/".deployment-receipt.json.stage-v5"
              g["FIXED_RECEIPT"]=fixed
              g["FIXED_V4_SHA256"]=hashlib.sha256(fixed_raw).hexdigest()
              g["FIXED_V4_BYTES"]=len(fixed_raw)
              g["require_root_source"]=lambda: None

              planned=g["collect_plan"]()
              if planned["body"]["stage_state"]!="READY":
                  raise SystemExit("fixture_not_ready")

              out=io.StringIO()
              with contextlib.redirect_stdout(out):
                  g["apply"](
                      planned["plan_id"],
                      g["CONFIRM_TOKEN"],
                  )
              if "status=V5_RECEIPT_STAGE_V1_GREEN" not in out.getvalue().splitlines():
                  raise SystemExit("fixture_apply_not_green")

              target=g["TARGET"]
              st=target.lstat()
              if (
                  not stat.S_ISREG(st.st_mode)
                  or stat.S_ISLNK(st.st_mode)
                  or st.st_uid!=0 or st.st_gid!=0
                  or stat.S_IMODE(st.st_mode)!=0o444
                  or st.st_nlink!=1
              ):
                  raise SystemExit("fixture_target_custody_invalid")
              if hashlib.sha256(target.read_bytes()).hexdigest()!=m["SOURCE_RECEIPT_SHA256"]:
                  raise SystemExit("fixture_target_digest_mismatch")
              if fixed.read_bytes()!=fixed_raw:
                  raise SystemExit("fixture_fixed_receipt_changed")

              again=g["collect_plan"]()
              if again["body"]["stage_state"]!="GREEN":
                  raise SystemExit("fixture_reapply_not_green")
              again_out=io.StringIO()
              with contextlib.redirect_stdout(again_out):
                  g["apply"](again["plan_id"],g["CONFIRM_TOKEN"])
              if "status=ALREADY_GREEN" not in again_out.getvalue().splitlines():
                  raise SystemExit("fixture_reapply_not_idempotent")

          print("VOID_V7_V5_RECEIPT_STAGE_CREATE_ONLY_FIXTURE_GREEN")
          PY

      - name: Verify source-only authority receipts
        shell: bash
        run: |
          set -euo pipefail
          python -I -B ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py --source-plan > "$RUNNER_TEMP/source-plan"
          grep -Fx 'source_only=true' "$RUNNER_TEMP/source-plan"
          grep -Fx 'host_read=false' "$RUNNER_TEMP/source-plan"
          grep -Fx 'host_write=false' "$RUNNER_TEMP/source-plan"
          grep -Fx 'create_only=true' "$RUNNER_TEMP/source-plan"
          grep -Fx 'fixed_v4_source_mutation=false' "$RUNNER_TEMP/source-plan"
          grep -Fx 'fixed_source_exchange_authority=false' "$RUNNER_TEMP/source-plan"
          grep -Fx 'service_mutation=false' "$RUNNER_TEMP/source-plan"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/source-plan"