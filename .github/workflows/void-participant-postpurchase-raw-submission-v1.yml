name: VOID participant postpurchase raw submission v1

on:
  pull_request:
    paths:
      - "src/economic/participant_postpurchase_raw_submission_v1.ts"
      - "scripts/prove_void_participant_postpurchase_raw_submission_v1.ts"
      - "docs/operators/participant-postpurchase-raw-submission-v1.md"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_native_chain2050_broadcaster_v1.ts"
      - ".github/workflows/void-participant-postpurchase-raw-submission-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/economic/participant_postpurchase_raw_submission_v1.ts"
      - "scripts/prove_void_participant_postpurchase_raw_submission_v1.ts"
      - "docs/operators/participant-postpurchase-raw-submission-v1.md"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_native_chain2050_broadcaster_v1.ts"
      - ".github/workflows/void-participant-postpurchase-raw-submission-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-participant-postpurchase-raw-submission-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck runtime source
        run: npm run typecheck

      - name: Prove participant raw submission seam
        run: npx tsx scripts/prove_void_participant_postpurchase_raw_submission_v1.ts

      - name: Diff hygiene
        run: git diff --check
