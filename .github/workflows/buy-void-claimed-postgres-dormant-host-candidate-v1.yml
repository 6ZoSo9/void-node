name: Buy VOID claimed PostgreSQL dormant host candidate v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/buy-void-claimed-postgres-dormant-host-candidate-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "ops/systemd/void-node-live.service.d/92-buy-void-dispatcher-postgres-credentials-v1.conf.example"
      - "ops/systemd/void-node-live.service.d/93-buy-void-claimed-postgres-dormant-v1.conf.example"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_contract_v1.ts"
      - "scripts/prove_buy_void_claimed_postgres_dormant_host_candidate_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "docs/operators/buy-void-claimed-postgres-dormant-host-candidate-v1.md"
      - ".github/workflows/buy-void-claimed-postgres-dormant-host-candidate-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/mainnet0/buy-void-claimed-postgres-dormant-host-candidate-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "ops/systemd/void-node-live.service.d/92-buy-void-dispatcher-postgres-credentials-v1.conf.example"
      - "ops/systemd/void-node-live.service.d/93-buy-void-claimed-postgres-dormant-v1.conf.example"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_contract_v1.ts"
      - "scripts/prove_buy_void_claimed_postgres_dormant_host_candidate_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts"
      - "docs/operators/buy-void-claimed-postgres-dormant-host-candidate-v1.md"
      - ".github/workflows/buy-void-claimed-postgres-dormant-host-candidate-v1.yml"

permissions:
  contents: read

concurrency:
  group: buy-void-claimed-postgres-dormant-host-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove dormant claimed PostgreSQL host candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

          node --import tsx \
            scripts/prove_buy_void_claimed_postgres_dormant_host_candidate_v1.ts \
            | tee "$RUNNER_TEMP/claimed-postgres-dormant-host.log"

          grep -Fx \
            'VOID_BUY_VOID_CLAIMED_POSTGRES_DORMANT_HOST_CANDIDATE_V1_PROOF_GREEN' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'parent_runtime_enabled=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'claimed_runtime_enabled=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'admitted_guarded_runtime_enabled=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'base_payment_keyed_runtime_enabled=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'base_payment_keyed_apply_enabled=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'postgres_config_candidate_verified=true' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'postgres_loadcredential_bindings=2' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'database_connection=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'database_provisioning=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'transaction_broadcast=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"
          grep -Fx 'funds_action=false' \
            "$RUNNER_TEMP/claimed-postgres-dormant-host.log"

          node --import tsx scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts
          node --import tsx scripts/prove_buy_void_dispatcher_postgres_credential_binding_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts

          git diff --check
