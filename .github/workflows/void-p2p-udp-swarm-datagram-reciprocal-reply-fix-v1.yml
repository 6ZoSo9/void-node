name: VOID P2P UDP swarm datagram reciprocal reply repair v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-p2p-udp-swarm-datagram-reciprocal-reply-fix-v1.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard and apply reciprocal reply
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_blob='cedfa41f4840764772af5ec355928faff4656572'
          actual_blob="$(git hash-object src/p2p/udp_swarm_datagram_runtime_v1.ts)"
          test "$actual_blob" = "$expected_blob" || {
            echo "HOLD: datagram runtime blob moved: $actual_blob"
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/p2p/udp_swarm_datagram_runtime_v1.ts')
          s=p.read_text()
          old='''    active.direct_path_observed = true;\n    for (const timer of active.timers) clearTimeout(timer);\n    active.timers.clear();\n\n    const observation = Object.freeze({\n'''
          new='''    active.direct_path_observed = true;\n\n    // A peer may observe our first scheduled punch before its own first timer\n    // fires. Reply once immediately from this exact bound socket so the peer\n    // can observe the reciprocal path before we cancel the remaining burst.\n    const reply = createVoidUdpHolePunchPacketV1({\n      sessionId: active.plan.session_id,\n      sourceNodeId: this.localNodeId,\n      targetNodeId: active.plan.peer_node_id,\n      attempt: 0,\n    });\n    try {\n      await this.sendBytes(\n        Buffer.from(JSON.stringify(reply), "utf8"),\n        active.peer_host,\n        active.peer_port,\n      );\n      active.packets_sent += 1;\n    } catch (error) {\n      console.warn("VOID_P2P_UDP_SWARM_DATAGRAM_RUNTIME_V1_PUNCH_REPLY_FAILURE", {\n        session_id: active.plan.session_id,\n        peer_node_id: active.plan.peer_node_id,\n        reason: error instanceof Error ? error.message : String(error),\n      });\n    }\n\n    for (const timer of active.timers) clearTimeout(timer);\n    active.timers.clear();\n\n    const observation = Object.freeze({\n'''
          if s.count(old) != 1:
              raise SystemExit(f'HOLD: reciprocal-reply marker count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check

      - name: Prove repaired source
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prove_void_p2p_udp_swarm_datagram_runtime_v1.ts
          npm run typecheck
          npm run build
          git diff --check

      - name: Commit source and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/p2p/udp_swarm_datagram_runtime_v1.ts
          git commit -m 'fix: reply immediately on first observed UDP punch'
          git rm .github/workflows/void-p2p-udp-swarm-datagram-reciprocal-reply-fix-v1.yml
          git commit -m 'ci: remove reciprocal UDP punch reply repair workflow'
          git push origin HEAD:feat/p2p-udp-swarm-node-datagram-runtime-v1-20260808
