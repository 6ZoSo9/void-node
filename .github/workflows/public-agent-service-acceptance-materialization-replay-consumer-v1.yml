name: Public Agent Service Acceptance Materialization Replay Consumer V1

on:
  pull_request:
    paths:
      - "schemas/public-agent-service-acceptance-materialization-replay-consumer-v1.schema.json"
      - "examples/public-agent-service-acceptance-materialization-replay-consumer-v1.example.json"
      - "docs/public-agent/public-agent-service-acceptance-materialization-replay-consumer-v1.md"
      - "scripts/public_agent_service_acceptance_materialization_replay_consumer_v1.ts"
      - "scripts/prove_public_agent_service_acceptance_materialization_replay_consumer_v1.ts"
      - ".github/workflows/public-agent-service-acceptance-materialization-replay-consumer-v1.yml"
      - "scripts/agent_paid_work_acceptance_envelope_v1.ts"
      - "scripts/agent_paid_work_order_envelope_v1.ts"
      - "scripts/agent_paid_work_quote_envelope_v1.ts"
      - "scripts/public_agent_service_requester_acceptance_authentication_v1.ts"
      - "scripts/public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - "scripts/public_agent_service_provider_quote_response_authentication_v1.ts"
      - "scripts/public_agent_service_provider_quote_response_v1.ts"
      - "ops/public/agent-services-v1/catalog.json"
  push:
    branches:
      - main
    paths:
      - "schemas/public-agent-service-acceptance-materialization-replay-consumer-v1.schema.json"
      - "examples/public-agent-service-acceptance-materialization-replay-consumer-v1.example.json"
      - "docs/public-agent/public-agent-service-acceptance-materialization-replay-consumer-v1.md"
      - "scripts/public_agent_service_acceptance_materialization_replay_consumer_v1.ts"
      - "scripts/prove_public_agent_service_acceptance_materialization_replay_consumer_v1.ts"
      - ".github/workflows/public-agent-service-acceptance-materialization-replay-consumer-v1.yml"
      - "scripts/agent_paid_work_acceptance_envelope_v1.ts"
      - "scripts/agent_paid_work_order_envelope_v1.ts"
      - "scripts/agent_paid_work_quote_envelope_v1.ts"
      - "scripts/public_agent_service_requester_acceptance_authentication_v1.ts"
      - "scripts/public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - "scripts/public_agent_service_provider_quote_response_authentication_v1.ts"
      - "scripts/public_agent_service_provider_quote_response_v1.ts"
      - "ops/public/agent-services-v1/catalog.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsx scripts/prove_public_agent_service_acceptance_materialization_replay_consumer_v1.ts
