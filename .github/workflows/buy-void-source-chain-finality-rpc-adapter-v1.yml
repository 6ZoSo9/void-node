name: VOID Buy VOID source-chain finalized RPC adapter v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "scripts/prove_buy_void_auto_claim_worker_v1.ts"
      - "scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "docs/architecture/buy-void-source-chain-finality-rpc-adapter-v1.md"
      - ".github/workflows/buy-void-source-chain-finality-rpc-adapter-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "scripts/prove_buy_void_auto_claim_worker_v1.ts"
      - "scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "docs/architecture/buy-void-source-chain-finality-rpc-adapter-v1.md"
      - ".github/workflows/buy-void-source-chain-finality-rpc-adapter-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused TypeScript
        run: >-
          npx tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022 --types node
          --esModuleInterop --allowSyntheticDefaultImports
          --downlevelIteration --skipLibCheck
          src/economic/buy_void_payment_rpc_observer_v1.ts
          src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts
          scripts/prove_buy_void_auto_claim_worker_v1.ts
          scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts
      - name: Prove source-chain finalized RPC adapter
        run: npx tsx scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts
      - name: Preserve existing payment observer worker behavior
        run: npx tsx scripts/prove_buy_void_auto_claim_worker_v1.ts
      - name: Preserve existing observer authority guard
        run: npx tsx scripts/prove_buy_void_auto_claim_worker_guard_v1.ts
      - name: Repository build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
