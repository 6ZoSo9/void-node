name: Buy VOID dispatcher PostgreSQL factory guarded publisher v1

on:
  push:
    branches:
      - "feat/buy-void-dispatcher-postgres-connection-factory-v1-20260920"
    paths:
      - ".github/workflows/buy-void-dispatcher-postgres-factory-lock-materializer-v1.yml"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_connection_factory_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_connection_factory_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-dispatcher-postgres-connection-factory-v1.md"
      - ".github/workflows/buy-void-dispatcher-postgres-connection-factory-v1.yml"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Reproduce exact npm package metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/buy-void-dispatcher-postgres-connection-factory-v1-20260920"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("package.json", "utf8"));
          value.dependencies = { ...value.dependencies, pg: "8.23.0" };
          value.devDependencies = {
            ...value.devDependencies,
            "@types/pg": "8.23.1",
          };
          fs.writeFileSync("package.json", JSON.stringify(value, null, 2) + "\n");
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          printf '%s  %s\n' \
            'f50464fac47ca0fa59242147a443c6e83603ca64adce3aa03edc4ee334243885' \
            package.json | sha256sum -c -
          printf '%s  %s\n' \
            '63e63ac3f28bc4a52c3cd44afc25938cc8c6fbf76626cef5239db6e8cf555cfe' \
            package-lock.json | sha256sum -c -
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (pkg.dependencies?.pg !== "8.23.0") throw new Error("pg mismatch");
          if (pkg.devDependencies?.["@types/pg"] !== "8.23.1") throw new Error("@types/pg mismatch");
          if (lock.lockfileVersion !== 3) throw new Error("lockfileVersion mismatch");
          if (lock.packages?.["node_modules/pg"]?.version !== "8.23.0") throw new Error("resolved pg mismatch");
          if (lock.packages?.["node_modules/@types/pg"]?.version !== "8.23.1") throw new Error("resolved @types/pg mismatch");
          if (lock.packages?.["node_modules/pg-native"]) throw new Error("pg-native forbidden");
          NODE
      - name: Install generated lock and create disposable credential fixture
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cred_dir="/run/credentials/void-postgres-factory-${GITHUB_RUN_ID}-publisher"
          sudo install -d -m 0755 /run/credentials
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$cred_dir"
          printf '%s' 'void-ci-postgres-password-v1' \
            > "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          chmod 0600 "$cred_dir/buy-void-dispatcher-postgres-password-v1"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=localhost' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout "$RUNNER_TEMP/postgres-factory-publisher-key.pem" \
            -out "$cred_dir/buy-void-dispatcher-postgres-ca-v1" \
            >/dev/null 2>&1
          chmod 0600 "$cred_dir/buy-void-dispatcher-postgres-ca-v1"
          rm -f "$RUNNER_TEMP/postgres-factory-publisher-key.pem"
          echo "VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY=$cred_dir" >> "$GITHUB_ENV"
      - name: Verify factory source before any repository write
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          ./node_modules/.bin/tsc \
            --noEmit --strict --target ES2022 --module NodeNext \
            --moduleResolution NodeNext --lib ES2022 --types node \
            --esModuleInterop --skipLibCheck \
            scripts/prove_buy_void_payment_keyed_dispatcher_postgres_connection_factory_v1.ts
          node --import tsx \
            scripts/prove_buy_void_payment_keyed_dispatcher_postgres_connection_factory_v1.ts \
            | tee "$RUNNER_TEMP/postgres-factory-publisher.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_DISPATCHER_POSTGRES_CONNECTION_FACTORY_V1_PROOF_GREEN' "$RUNNER_TEMP/postgres-factory-publisher.log"
          grep -Fx 'postgres_connection_factory_cases=9' "$RUNNER_TEMP/postgres-factory-publisher.log"
          grep -Fx 'pool_construction_network_connect=false' "$RUNNER_TEMP/postgres-factory-publisher.log"
          grep -Fx 'ambient_pg_environment_ignored=true' "$RUNNER_TEMP/postgres-factory-publisher.log"
          grep -Fx 'postgres_sslrequest_negotiation_observed=true' "$RUNNER_TEMP/postgres-factory-publisher.log"
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_production_config_v1.ts
          node --import tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_store_v1.ts
          git diff --check
      - name: Commit exact generated package bytes and retire publisher
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git rm .github/workflows/buy-void-dispatcher-postgres-factory-lock-materializer-v1.yml
          git add package.json package-lock.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/buy-void-dispatcher-postgres-factory-lock-materializer-v1.yml"
            "package-lock.json"
            "package.json"
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${staged[$i]}" = "${expected[$i]}"
          done
          git config user.name "void-ci-lock-publisher"
          git config user.email "void-ci-lock-publisher@users.noreply.github.com"
          git commit -m "build(buy-void): pin PostgreSQL factory dependencies"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Clean disposable credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY:-}"; then
            sudo rm -rf -- "$VOID_TEST_POSTGRES_CREDENTIALS_DIRECTORY"
          fi
          rm -f "$RUNNER_TEMP/postgres-factory-publisher-key.pem"
