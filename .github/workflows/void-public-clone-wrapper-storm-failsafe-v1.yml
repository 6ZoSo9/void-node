name: VOID Public Clone Wrapper Storm Failsafe v1

on:
  pull_request:
    paths:
      - "src/util/env.ts"
      - "run-void-node.sh"
      - ".env.example"
      - "scripts/prove_public_clone_wrapper_storm_failsafe_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-public-clone-wrapper-storm-failsafe-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/util/env.ts"
      - "run-void-node.sh"
      - ".env.example"
      - "scripts/prove_public_clone_wrapper_storm_failsafe_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/void-public-clone-wrapper-storm-failsafe-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile production environment module
        run: ./node_modules/.bin/tsc -p tsconfig.build.json
      - name: Prove public clone wrapper-storm fail-safe
        run: node scripts/prove_public_clone_wrapper_storm_failsafe_v1.mjs
      - name: Prove shared diff hygiene contract
        if: matrix.node == '24'
        run: node scripts/prove_ci_diff_hygiene_v1.mjs
      - name: Diff hygiene
        if: matrix.node == '24'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
