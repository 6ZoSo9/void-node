name: VOID Buy VOID private service loader initialization v2

on:
  push:
    branches:
      - "ren/buy-void-private-service-loader-v2-20261013"
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "tools/buy-void-prepared-transaction-custodian-service-v1.mjs"
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "scripts/prove_buy_void_private_service_loader_initialization_v2.mjs"
      - "docs/architecture/buy-void-private-service-loader-initialization-v2.md"
      - ".github/workflows/buy-void-private-service-loader-initialization-v2.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_enforcement_dynamic_tool_candidates_v1.mjs"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "tools/buy-void-prepared-transaction-custodian-service-v1.mjs"
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "scripts/prove_buy_void_private_service_loader_initialization_v2.mjs"
      - "docs/architecture/buy-void-private-service-loader-initialization-v2.md"
      - ".github/workflows/buy-void-private-service-loader-initialization-v2.yml"

permissions:
  contents: read

concurrency:
  group: buy-void-private-service-loader-initialization-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: audited private service loaders / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile exact caller modules
        run: node ./node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Qualify audited package generation and exact private loaders
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_private_service_loader_initialization_v2.mjs
          node scripts/prove_buy_void_private_service_loader_initialization_v2.mjs --self-test
          report="$RUNNER_TEMP/private-service-loader-v2-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_private_service_loader_initialization_v2.mjs --derive > "$report"
          node --input-type=module - "$report" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.schema,"void_buy_void_private_service_loader_initialization_v2");
          assert.equal(j.package_generation,"audited_post_2865");
          assert.equal(j.reviewed_package_profile_id,
            "voidrnpr1_7cfd6b67e6c2bde498196fa8bc880031ea24f95942c194ee7e6f553054c08451");
          assert.equal(j.reviewed_packages_aggregate_sha256,
            "5ac562a4396ef1d7ec302ef3af4eba7de7f2e62d478ee83fc30814d13d8d3b73");
          assert.equal(j.historical_dynamic_tool_census_reexecuted,false);
          assert.equal(j.audited_generation_frozen_census_positive,false);
          assert.equal(j.actual_compiled_loader_body_executed,true);
          assert.equal(j.exact_service_module_bytes_imported,true);
          assert.equal(j.broadcaster_module_initialization_qualified,true);
          assert.equal(j.custodian_module_initialization_qualified,true);
          assert.equal(j.broadcaster_caller_count,3);
          assert.equal(j.custodian_caller_count,1);
          assert.equal(j.service_factory_invoked,false);
          assert.equal(j.service_started,false);
          assert.equal(j.socket_created,false);
          assert.equal(j.credential_or_private_key_access,false);
          assert.equal(j.rpc_call,false);
          assert.equal(j.execution_network_isolation_provided,false);
          assert.equal(j.signing,false);
          assert.equal(j.transaction_submission,false);
          assert.equal(j.transaction_broadcast,false);
          assert.equal(j.money_movement,false);
          assert.equal(j.dynamic_tool_initialization_closure_verified_for_broadcaster_and_custodian,true);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.accepted_enforcement_generation,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          assert.equal(j.funds_movement,false);
          console.log("VOID_PRIVATE_SERVICE_LOADER_INITIALIZATION_V2_GREEN");
          NODE

      - name: Upload exact V2 report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-private-service-loader-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/private-service-loader-v2-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Exact committed-range diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact Node 22 24 26 reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-private-service-loader-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./reports

      - name: Require byte-identical V2 reports
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "reports/private-service-loader-v2-node-$v.json"
          done
          cmp reports/private-service-loader-v2-node-22.json reports/private-service-loader-v2-node-24.json
          cmp reports/private-service-loader-v2-node-22.json reports/private-service-loader-v2-node-26.json
          sha256sum reports/private-service-loader-v2-node-22.json
          echo "VOID_PRIVATE_SERVICE_LOADER_INITIALIZATION_V2_CROSS_NODE_GREEN"
          echo "accepted_enforcement_generation=false"
          echo "runtime_mount_authority=false"
          echo "funds_movement=false"
