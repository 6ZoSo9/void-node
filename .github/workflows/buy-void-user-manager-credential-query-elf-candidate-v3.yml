name: VOID Buy credential query ELF candidate v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b,c]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact V3 source generation
        run: |
          set -euo pipefail
          source_parent=6d8d0725a36d7907e4620371952aa71fd64696df
          git merge-base --is-ancestor "$source_parent" HEAD
          expected_scope="$RUNNER_TEMP/expected-scope.txt"
          actual_scope="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml' \
            'docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md' \
            'scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py' \
            | sort > "$expected_scope"
          git diff --name-only "$source_parent" HEAD -- | sort > "$actual_scope"
          diff -u "$expected_scope" "$actual_scope"
          git diff --check "$source_parent" HEAD

          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs |
            tee "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_PROOF_GREEN' \
            "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'complete_dropin_set_sha256_emitted=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'complete_credential_set_sha256_emitted=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'cross_query_complete_set_binding_enabled=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/v3-source-proof.log"

          python3 -I -B scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py \
            --self-test |
            tee "$RUNNER_TEMP/v3-candidate-self-test.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3_SELF_TEST_GREEN' \
            "$RUNNER_TEMP/v3-candidate-self-test.log"
          grep -Fx 'closed_link_trace_grammar=true' "$RUNNER_TEMP/v3-candidate-self-test.log"
          grep -Fx 'preexec_predecessor_identity_required=true' "$RUNNER_TEMP/v3-candidate-self-test.log"

      - name: Derive complete-provenance V3 credential-query pair
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-candidate"
          python3 -I -B scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py \
            --derive-dir "$out" |
            tee "$RUNNER_TEMP/v3-candidate-derive.log"

          grep -Fx 'preexec_predecessor_identity_exact=true' "$RUNNER_TEMP/v3-candidate-derive.log"
          grep -Fx 'static_toolchain_closure_bound=true' "$RUNNER_TEMP/v3-candidate-derive.log"
          grep -Fx 'preexec_link_trace_closed=true' "$RUNNER_TEMP/v3-candidate-derive.log"
          grep -Fx 'query_link_trace_closed=true' "$RUNNER_TEMP/v3-candidate-derive.log"
          grep -Fx 'candidate_accepted=false' "$RUNNER_TEMP/v3-candidate-derive.log"

          test "$(stat -Lc '%s' "$out/credential-query-preexec")" -eq 706504
          test "$(sha256sum "$out/credential-query-preexec" | awk '{print $1}')" = \
            '67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c'
          test -s "$out/credential-query"
          test -s "$out/credential-query-elf-candidate-v3.json"

      - name: Reprove fixed-path hostile-loader boundary
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-candidate"
          pre="$out/credential-query-preexec"
          query="$out/credential-query"
          fake="$RUNNER_TEMP/credential-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-preload-fired"

          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\"" \
            "$fake/preload.c" -o "$fake/preload.so"

          test -d /opt
          test ! -L /opt
          host_opt_before="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          sudo -n true

          sudo /usr/bin/unshare --mount --fork /usr/bin/bash -c '
            set -euo pipefail
            pre="$1"; query="$2"; preload="$3"; sentinel="$4"; direct_log="$5"; pair_log="$6"
            /usr/bin/mount --make-rprivate /
            /usr/bin/mount -t tmpfs -o mode=0755,uid=0,gid=0,size=16m tmpfs /opt
            root=/opt/void-buy-void-user-manager-credential-query-v1
            pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
            query_name=void_buy_void_user_manager_private_credential_unit_query_v1
            /usr/bin/install -d -o root -g root -m 0755 "$root"
            /usr/bin/install -o root -g root -m 0555 "$pre" "$root/$pre_name"
            /usr/bin/install -o root -g root -m 0555 "$query" "$root/$query_name"

            rm -f "$sentinel"
            if /usr/bin/env \
                VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
                LD_PRELOAD="$preload" \
                "$root/$query_name" --self-test >"$direct_log" 2>&1; then
              echo direct_poisoned_v3_query_unexpectedly_succeeded >&2
              exit 1
            fi
            test -s "$sentinel"
            rm -f "$sentinel"

            /usr/bin/env LD_PRELOAD="$preload" \
              "$root/$pre_name" --exec-self-test | tee "$pair_log"
            test ! -e "$sentinel"
            grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN' "$pair_log"
            grep -Fx 'complete_dropin_set_sha256_emitted=true' "$pair_log"
            grep -Fx 'complete_credential_set_sha256_emitted=true' "$pair_log"
            grep -Fx 'credential_contents_read=false' "$pair_log"
          ' void-v3-pair \
            "$pre" "$query" "$fake/preload.so" "$sentinel" \
            "$RUNNER_TEMP/direct-query.log" "$RUNNER_TEMP/preexec-query.log"

          host_opt_after="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          test "$host_opt_after" = "$host_opt_before"
          test ! -e /opt/void-buy-void-user-manager-credential-query-v1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.slot }}
          path: ${{ runner.temp }}/v3-candidate/
          if-no-files-found: error
          retention-days: 7

  cross-job:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: ${{ runner.temp }}/candidates

      - name: Independently reproduce complete toolchain closure
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_void_buy_user_manager_credential_query_elf_candidate_v3.py \
            --compare-dir "$RUNNER_TEMP/candidates" |
            tee "$RUNNER_TEMP/v3-candidate-compare.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3_THREE_RUN_GREEN' \
            "$RUNNER_TEMP/v3-candidate-compare.log"
          grep -Fx 'independent_toolchain_rederivation=true' "$RUNNER_TEMP/v3-candidate-compare.log"
          grep -Fx 'preexec_predecessor_identity_exact=true' "$RUNNER_TEMP/v3-candidate-compare.log"
          grep -Fx 'candidate_accepted=false' "$RUNNER_TEMP/v3-candidate-compare.log"
          git diff --check
