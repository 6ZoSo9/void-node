name: VOID Buy credential query ELF candidate v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b, c]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact V3 source generation
        run: |
          set -euo pipefail
          source_parent=32806d6ccd6b86a03ccafd7dfb62b8af8f6c9fa1
          git merge-base --is-ancestor "$source_parent" HEAD

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n'             '.github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml'             'docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md'             | sort > "$expected"
          git diff --name-only "$source_parent" HEAD -- | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$source_parent" HEAD

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c)" =             "d8b30ac499c3bb8a5d223dbc6be687dd175be611"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c)" =             "fb2ecf7e3fbf4797d53f78369c13e84b792eead4"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs)" =             "2ab2e22182a6d165316bc2c9f48213c3c397f63b"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c)" =             "0ccd2d07a951389d85a9fc56ec892a774d9dd681"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs)" =             "58df08ca966f4629893c3885f1df37c837762520"

      - name: Derive deterministic V3 pair and prove fixed-path execution
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"
          meta="$RUNNER_TEMP/credential-query-elf-candidate-v3.json"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -static -fno-pie -no-pie -Wl,--build-id=none             -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc             -std=c11 -Wall -Wextra -Werror -O2 -fno-ident             -Wl,--build-id=none             -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"
          chmod 0555 "$pre" "$query"

          readelf -l "$pre" > "$RUNNER_TEMP/preexec.readelf"
          if grep -F ' INTERP ' "$RUNNER_TEMP/preexec.readelf"; then
            echo credential_preexec_has_dynamic_interpreter >&2
            exit 1
          fi
          file "$pre" | grep -F 'statically linked'

          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C             VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1             "$query" --self-test | tee "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN'             "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'complete_dropin_set_fingerprint=true'             "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'complete_loadcredential_set_fingerprint=true'             "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'same_length_set_substitution_changes_fingerprint=true'             "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'transcript_non_disclosure_executable=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/query-self-test.log"

          test -d /opt
          test ! -L /opt
          host_opt_before="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          for tool in /usr/bin/unshare /usr/bin/mount /usr/bin/mountpoint                       /usr/bin/install /usr/bin/env /usr/bin/bash; do
            test -x "$tool"
          done
          sudo -n true

          fake="$RUNNER_TEMP/credential-v3-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-v3-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\""             "$fake/preload.c" -o "$fake/preload.so"

          ns="$RUNNER_TEMP/credential-v3-private-opt.sh"
          cat > "$ns" <<'SH'
          set -euo pipefail
          pre="$1"
          query="$2"
          preload="$3"
          sentinel="$4"
          direct_log="$5"
          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1

          self_ns="$(stat -Lc '%i' /proc/self/ns/mnt)"
          init_ns="$(stat -Lc '%i' /proc/1/ns/mnt)"
          test "$self_ns" != "$init_ns"

          /usr/bin/mount --make-rprivate /
          /usr/bin/mount -t tmpfs -o mode=0755,uid=0,gid=0,size=16m tmpfs /opt
          /usr/bin/mountpoint -q /opt
          test "$(stat -Lc '%u:%g:%a' /opt)" = "0:0:755"

          /usr/bin/install -d -o root -g root -m 0755 "$root"
          /usr/bin/install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          /usr/bin/install -o root -g root -m 0555 "$query" "$root/$query_name"

          rm -f "$sentinel"
          if /usr/bin/env                VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1                LD_PRELOAD="$preload"                "$root/$query_name" --self-test >"$direct_log" 2>&1; then
            echo direct_poisoned_v3_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          /usr/bin/env LD_PRELOAD="$preload"             "$root/$pre_name" --exec-self-test
          test ! -e "$sentinel"
          SH

          sudo -n /usr/bin/unshare --mount --fork /usr/bin/bash "$ns"             "$pre" "$query" "$fake/preload.so" "$sentinel"             "$RUNNER_TEMP/direct-query.log" |
            tee "$RUNNER_TEMP/preexec-query.log"

          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN'             "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'complete_dropin_set_fingerprint=true' "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'complete_loadcredential_set_fingerprint=true' "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'transcript_non_disclosure_executable=true' "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/preexec-query.log"

          host_opt_after="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          test "$host_opt_after" = "$host_opt_before"
          test ! -e /opt/void-buy-void-user-manager-credential-query-v1

          pre_sha="$(sha256sum "$pre" | awk '{print $1}')"
          pre_bytes="$(stat -Lc '%s' "$pre")"
          query_sha="$(sha256sum "$query" | awk '{print $1}')"
          query_bytes="$(stat -Lc '%s' "$query")"
          cc_sha="$(sha256sum /usr/bin/cc | awk '{print $1}')"
          strip_sha="$(sha256sum /usr/bin/strip | awk '{print $1}')"

          META="$meta" PRE_SHA="$pre_sha" PRE_BYTES="$pre_bytes"           QUERY_SHA="$query_sha" QUERY_BYTES="$query_bytes"           CC_SHA="$cc_sha" STRIP_SHA="$strip_sha"           node --input-type=module <<'NODE'
          import fs from "node:fs";
          const out={
            marker:"VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3",
            version:3,
            source_parent:"32806d6ccd6b86a03ccafd7dfb62b8af8f6c9fa1",
            peer_source_git_blob_sha1:"d8b30ac499c3bb8a5d223dbc6be687dd175be611",
            credential_query_source_git_blob_sha1:"fb2ecf7e3fbf4797d53f78369c13e84b792eead4",
            credential_query_proof_git_blob_sha1:"2ab2e22182a6d165316bc2c9f48213c3c397f63b",
            credential_preexec_source_git_blob_sha1:"0ccd2d07a951389d85a9fc56ec892a774d9dd681",
            credential_preexec_proof_git_blob_sha1:"58df08ca966f4629893c3885f1df37c837762520",
            preexec_binary_sha256:process.env.PRE_SHA,
            preexec_binary_bytes:Number(process.env.PRE_BYTES),
            preexec_static_no_interp:true,
            query_binary_sha256:process.env.QUERY_SHA,
            query_binary_bytes:Number(process.env.QUERY_BYTES),
            max_dropin_paths:64,
            max_load_credentials:32,
            unique_credential_ids_required:true,
            exactly_one_epoch2_credential_required:true,
            unrelated_credentials_allowed:true,
            complete_credential_set_generation_stability_required:true,
            complete_dropin_set_sha256_emitted:true,
            complete_loadcredential_set_sha256_emitted:true,
            same_length_set_substitution_detectable:true,
            transcript_non_disclosure_executable:true,
            credential_contents_read:false,
            fixed_path_preexec_execution_proven:true,
            private_opt_mount_namespace:true,
            host_opt_metadata_mutation:false,
            cc_sha256:process.env.CC_SHA,
            strip_sha256:process.env.STRIP_SHA,
            predecessor_v2_lock_id:
              "voidbuyumqcredelflock2_c05afb1a6fbd44a00d4f220652e87ee099e0456992a17a6ae7b60bda9229cf54",
            candidate_accepted:false,
            install_authorized:false,
            replacement_authorized:false,
            live_query_authorized:false,
            complete_host_evidence_collector:false,
            production_host_evidence_authority:false,
            payment_acceptance:false,
            public_presale_activation:false,
            transaction:false,
            funds_movement:false
          };
          fs.writeFileSync(process.env.META,JSON.stringify(out)+"\n");
          NODE

          echo "preexec_binary_sha256=$pre_sha"
          echo "preexec_binary_bytes=$pre_bytes"
          echo "query_binary_sha256=$query_sha"
          echo "query_binary_bytes=$query_bytes"
          echo "complete_dropin_set_sha256_emitted=true"
          echo "complete_loadcredential_set_sha256_emitted=true"
          echo "transcript_non_disclosure_executable=true"
          echo "candidate_accepted=false"
          echo "install_authorized=false"
          echo "replacement_authorized=false"
          echo "live_query_authorized=false"
          echo "credential_contents_read=false"
          echo "funds_movement=false"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.slot }}
          path: |
            ${{ runner.temp }}/credential-query-preexec
            ${{ runner.temp }}/credential-query
            ${{ runner.temp }}/credential-query-elf-candidate-v3.json
          if-no-files-found: error
          retention-days: 7

  cross-job:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: candidates

      - name: Require exact three-job equality
        run: |
          set -euo pipefail
          stem="void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}"
          for slot in a b c; do
            test -s "candidates/$stem-$slot/credential-query-preexec"
            test -s "candidates/$stem-$slot/credential-query"
            test -s "candidates/$stem-$slot/credential-query-elf-candidate-v3.json"
          done
          for slot in b c; do
            cmp "candidates/$stem-a/credential-query-preexec"                 "candidates/$stem-$slot/credential-query-preexec"
            cmp "candidates/$stem-a/credential-query"                 "candidates/$stem-$slot/credential-query"
            cmp "candidates/$stem-a/credential-query-elf-candidate-v3.json"                 "candidates/$stem-$slot/credential-query-elf-candidate-v3.json"
          done
          cat "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"complete_dropin_set_sha256_emitted":true'             "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"complete_loadcredential_set_sha256_emitted":true'             "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"transcript_non_disclosure_executable":true'             "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"candidate_accepted":false'             "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"live_query_authorized":false'             "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3_CROSS_JOB_GREEN
