name: VOID Buy credential query ELF candidate v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml"
      - "docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b,c]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact V3 source generation
        run: |
          set -euo pipefail
          source_parent=e5e40a09db4877665567b6897e36aed90d8de7cb
          git merge-base --is-ancestor "$source_parent" HEAD
          expected_scope="$RUNNER_TEMP/expected-scope.txt"
          actual_scope="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-user-manager-credential-query-elf-candidate-v3.yml' \
            'docs/operators/buy-void-user-manager-credential-query-elf-candidate-v3.md' \
            | sort > "$expected_scope"
          git diff --name-only "$source_parent" HEAD -- | sort > "$actual_scope"
          diff -u "$expected_scope" "$actual_scope"
          git diff --check "$source_parent" HEAD

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c)" = \
            "d8b30ac499c3bb8a5d223dbc6be687dd175be611"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c)" = \
            "0d0e9546aea6e7346f5b35559bcdd8e7788900fe"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs)" = \
            "f640e7fc19b33513360b2247ac1bdc705f848f4f"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c)" = \
            "0ccd2d07a951389d85a9fc56ec892a774d9dd681"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs)" = \
            "58df08ca966f4629893c3885f1df37c837762520"

          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs |
            tee "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_PROOF_GREEN' \
            "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'dropin_bound=64' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'loadcredential_bound=32' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'exactly_one_epoch2_credential_required=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'complete_dropin_set_sha256_emitted=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'complete_credential_set_sha256_emitted=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'cross_query_complete_set_binding_enabled=true' "$RUNNER_TEMP/v3-source-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/v3-source-proof.log"

      - name: Derive deterministic V3 credential-query pair
        run: |
          set -euo pipefail
          pre_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c
          query_src=ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c
          pre="$RUNNER_TEMP/credential-query-preexec"
          query="$RUNNER_TEMP/credential-query"
          meta="$RUNNER_TEMP/credential-query-elf-candidate-v3.json"

          SOURCE_DATE_EPOCH=0 /usr/bin/cc \
            -std=c11 -Wall -Wextra -Werror -O2 -fno-ident \
            -static -fno-pie -no-pie -Wl,--build-id=none \
            -o "$pre" "$pre_src"
          SOURCE_DATE_EPOCH=0 /usr/bin/cc \
            -std=c11 -Wall -Wextra -Werror -O2 -fno-ident \
            -Wl,--build-id=none \
            -o "$query" "$query_src" -ldl
          /usr/bin/strip --strip-all "$pre"
          /usr/bin/strip --strip-all "$query"
          chmod 0555 "$pre" "$query"

          readelf -l "$pre" > "$RUNNER_TEMP/preexec.readelf"
          ! grep -F ' INTERP ' "$RUNNER_TEMP/preexec.readelf"
          file "$pre" | grep -F 'statically linked'

          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
            "$query" --self-test | tee "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN' \
            "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'dropin_limit_64=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'loadcredential_limit_32=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'exactly_one_target_credential_match_required=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'unrelated_credentials_allowed=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'duplicate_credential_ids_rejected=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'credential_set_generation_stability_required=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'complete_dropin_set_sha256_emitted=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'complete_credential_set_sha256_emitted=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'sha256_known_vector_verified=true' "$RUNNER_TEMP/query-self-test.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/query-self-test.log"

          test -d /opt
          test ! -L /opt
          host_opt_before="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          for tool in /usr/bin/unshare /usr/bin/mount /usr/bin/mountpoint /usr/bin/install /usr/bin/env /usr/bin/bash; do
            test -x "$tool"
          done
          sudo -n true

          fake="$RUNNER_TEMP/credential-candidate-v3-preload"
          mkdir "$fake"
          sentinel="$RUNNER_TEMP/credential-candidate-v3-preload-fired"
          cat > "$fake/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          #ifndef SENTINEL_PATH
          #error SENTINEL_PATH required
          #endif
          __attribute__((constructor))
          static void poison(void){
            char exe[4096];
            ssize_t n=readlink("/proc/self/exe",exe,sizeof(exe)-1);
            if(n<=0)return;
            exe[n]='\0';
            if(strstr(exe,"private_credential_unit_query_v1")==NULL &&
               strstr(exe,"credential-query")==NULL)return;
            int fd=open(SENTINEL_PATH,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          /usr/bin/cc -shared -fPIC -DSENTINEL_PATH="\"$sentinel\"" \
            "$fake/preload.c" -o "$fake/preload.so"

          ns="$RUNNER_TEMP/credential-candidate-v3-private-opt.sh"
          cat > "$ns" <<'SH'
          set -euo pipefail
          pre="$1"
          query="$2"
          preload="$3"
          sentinel="$4"
          direct_log="$5"
          root=/opt/void-buy-void-user-manager-credential-query-v1
          pre_name=void_buy_void_user_manager_private_credential_unit_query_preexec_v1
          query_name=void_buy_void_user_manager_private_credential_unit_query_v1

          self_ns="$(stat -Lc '%i' /proc/self/ns/mnt)"
          init_ns="$(stat -Lc '%i' /proc/1/ns/mnt)"
          test "$self_ns" != "$init_ns"

          /usr/bin/mount --make-rprivate /
          /usr/bin/mount -t tmpfs -o mode=0755,uid=0,gid=0,size=16m tmpfs /opt
          /usr/bin/mountpoint -q /opt
          test "$(stat -Lc '%u:%g:%a' /opt)" = "0:0:755"

          /usr/bin/install -d -o root -g root -m 0755 "$root"
          /usr/bin/install -o root -g root -m 0555 "$pre" "$root/$pre_name"
          /usr/bin/install -o root -g root -m 0555 "$query" "$root/$query_name"

          rm -f "$sentinel"
          if /usr/bin/env \
               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1 \
               LD_PRELOAD="$preload" \
               "$root/$query_name" --self-test >"$direct_log" 2>&1; then
            echo direct_poisoned_v3_query_unexpectedly_succeeded >&2
            exit 1
          fi
          test -s "$sentinel"
          rm -f "$sentinel"

          /usr/bin/env LD_PRELOAD="$preload" \
            "$root/$pre_name" --exec-self-test
          test ! -e "$sentinel"
          SH

          sudo -n /usr/bin/unshare --mount --fork /usr/bin/bash "$ns" \
            "$pre" "$query" "$fake/preload.so" "$sentinel" \
            "$RUNNER_TEMP/direct-query.log" |
            tee "$RUNNER_TEMP/preexec-query.log"

          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V3_SELF_TEST_GREEN' \
            "$RUNNER_TEMP/preexec-query.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/preexec-query.log"
          host_opt_after="$(stat -Lc '%d:%i:%u:%g:%a' /opt)"
          test "$host_opt_after" = "$host_opt_before"
          test ! -e /opt/void-buy-void-user-manager-credential-query-v1

          pre_sha="$(sha256sum "$pre" | awk '{print $1}')"
          pre_bytes="$(stat -Lc '%s' "$pre")"
          query_sha="$(sha256sum "$query" | awk '{print $1}')"
          query_bytes="$(stat -Lc '%s' "$query")"
          cc_sha="$(sha256sum /usr/bin/cc | awk '{print $1}')"
          strip_sha="$(sha256sum /usr/bin/strip | awk '{print $1}')"

          META="$meta" PRE_SHA="$pre_sha" PRE_BYTES="$pre_bytes" \
          QUERY_SHA="$query_sha" QUERY_BYTES="$query_bytes" \
          CC_SHA="$cc_sha" STRIP_SHA="$strip_sha" \
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const out={
            marker:"VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3",
            version:3,
            source_parent:"e5e40a09db4877665567b6897e36aed90d8de7cb",
            v2_predecessor_lock_id:"voidbuyumqcredelflock2_c05afb1a6fbd44a00d4f220652e87ee099e0456992a17a6ae7b60bda9229cf54",
            peer_source_git_blob_sha1:"d8b30ac499c3bb8a5d223dbc6be687dd175be611",
            credential_query_source_git_blob_sha1:"0d0e9546aea6e7346f5b35559bcdd8e7788900fe",
            credential_query_proof_git_blob_sha1:"f640e7fc19b33513360b2247ac1bdc705f848f4f",
            credential_preexec_source_git_blob_sha1:"0ccd2d07a951389d85a9fc56ec892a774d9dd681",
            credential_preexec_proof_git_blob_sha1:"58df08ca966f4629893c3885f1df37c837762520",
            preexec_binary_sha256:process.env.PRE_SHA,
            preexec_binary_bytes:Number(process.env.PRE_BYTES),
            preexec_static_no_interp:true,
            query_binary_sha256:process.env.QUERY_SHA,
            query_binary_bytes:Number(process.env.QUERY_BYTES),
            max_dropin_paths:64,
            max_load_credentials:32,
            unique_credential_ids_required:true,
            exactly_one_epoch2_credential_required:true,
            unrelated_credentials_allowed:true,
            complete_credential_set_generation_stability_required:true,
            complete_dropin_set_sha256_emitted:true,
            complete_credential_set_sha256_emitted:true,
            sha256_known_vector_verified:true,
            cross_query_complete_set_binding_enabled:true,
            authenticated_private_manager_peer_required:true,
            retained_private_connection_required:true,
            credential_query_preexec_pair_execution_proven:true,
            private_opt_mount_namespace:true,
            host_opt_identity_unchanged:true,
            host_opt_metadata_mutation:false,
            credential_contents_read:false,
            cc_sha256:process.env.CC_SHA,
            strip_sha256:process.env.STRIP_SHA,
            candidate_accepted:false,
            replacement_authorized:false,
            live_query_authorized:false,
            complete_host_evidence_collector:false,
            production_host_evidence_authority:false,
            payment_acceptance:false,
            public_presale_activation:false,
            transaction:false,
            funds_movement:false
          };
          fs.writeFileSync(process.env.META,JSON.stringify(out)+"\n");
          NODE

          echo "preexec_binary_sha256=$pre_sha"
          echo "preexec_binary_bytes=$pre_bytes"
          echo "query_binary_sha256=$query_sha"
          echo "query_binary_bytes=$query_bytes"
          echo "max_dropin_paths=64"
          echo "max_load_credentials=32"
          echo "exactly_one_epoch2_credential_required=true"
          echo "unrelated_credentials_allowed=true"
          echo "complete_dropin_set_sha256_emitted=true"
          echo "complete_credential_set_sha256_emitted=true"
          echo "cross_query_complete_set_binding_enabled=true"
          echo "credential_query_preexec_pair_execution_proven=true"
          echo "private_opt_mount_namespace=true"
          echo "host_opt_identity_unchanged=true"
          echo "host_opt_metadata_mutation=false"
          echo "candidate_accepted=false"
          echo "replacement_authorized=false"
          echo "live_query_authorized=false"
          echo "credential_contents_read=false"
          echo "funds_movement=false"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.slot }}
          path: |
            ${{ runner.temp }}/credential-query-preexec
            ${{ runner.temp }}/credential-query
            ${{ runner.temp }}/credential-query-elf-candidate-v3.json
          if-no-files-found: error
          retention-days: 7

  cross-job:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}-*
          path: candidates
      - name: Require exact three-job equality
        run: |
          set -euo pipefail
          stem="void-buy-credential-query-elf-v3-${{ github.event.pull_request.head.sha || github.sha }}"
          for slot in a b c; do
            test -s "candidates/$stem-$slot/credential-query-preexec"
            test -s "candidates/$stem-$slot/credential-query"
            test -s "candidates/$stem-$slot/credential-query-elf-candidate-v3.json"
          done
          for slot in b c; do
            cmp "candidates/$stem-a/credential-query-preexec" \
                "candidates/$stem-$slot/credential-query-preexec"
            cmp "candidates/$stem-a/credential-query" \
                "candidates/$stem-$slot/credential-query"
            cmp "candidates/$stem-a/credential-query-elf-candidate-v3.json" \
                "candidates/$stem-$slot/credential-query-elf-candidate-v3.json"
          done
          sha256sum "candidates/$stem-a/credential-query-preexec"
          sha256sum "candidates/$stem-a/credential-query"
          cat "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"max_dropin_paths":64' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"max_load_credentials":32' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"exactly_one_epoch2_credential_required":true' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"complete_dropin_set_sha256_emitted":true' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"complete_credential_set_sha256_emitted":true' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"cross_query_complete_set_binding_enabled":true' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"private_opt_mount_namespace":true' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"host_opt_metadata_mutation":false' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"candidate_accepted":false' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"replacement_authorized":false' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"live_query_authorized":false' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          grep -F '"funds_movement":false' "candidates/$stem-a/credential-query-elf-candidate-v3.json"
          echo VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_CANDIDATE_V3_CROSS_JOB_GREEN
