name: VOID participant current gateway composition v2
on:
  pull_request:
    paths:
      - ".github/workflows/void-participant-current-gateway-composition-v2.yml"
      - "tools/void-public-participant-production-composition-current-gateway-v2.mjs"
      - "scripts/prove_void_public_participant_production_composition_current_gateway_v2.mjs"
      - "docs/security/void-public-participant-production-composition-current-gateway-v2.md"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  prove:
    name: exact gateway V2 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate without stored Git credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require reviewed public-edge source and frozen V1
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object ops/public/void-public-app-composition-gateway-v1.mjs)" = "d7174ee47ce2438fcc88764a76e08e7cc7f46787"
          test "$(git hash-object tools/void-public-participant-production-composition-preflight-v1.mjs)" = "507ee9a1c9b553a86944b2e5287f220c6af73044"
      - name: Install supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile actual participant security runtime
        run: npm run build
      - name: Syntax and standalone versioned composition proof
        run: |
          set -euo pipefail
          node --check tools/void-public-participant-production-composition-current-gateway-v2.mjs
          node --check scripts/prove_void_public_participant_production_composition_current_gateway_v2.mjs
          node scripts/prove_void_public_participant_production_composition_current_gateway_v2.mjs | tee participant-current-gateway-v2-${{ matrix.node }}.txt
          for proof_marker in \
            'VOID_PUBLIC_PARTICIPANT_PRODUCTION_COMPOSITION_PREFLIGHT_V2_PROOF_GREEN' \
            'historical_v1_new_generation_negative_preserved=true' \
            'current_gateway_exact_git_blob_qualified=true' \
            'source_composition_ready=true' \
            'runtime_activation_authorized=false'; do
            grep -Fx "$proof_marker" participant-current-gateway-v2-${{ matrix.node }}.txt
          done
      - name: Check exact reviewed path whitespace
        run: |
          set -euo pipefail
          git diff --check HEAD^..HEAD
