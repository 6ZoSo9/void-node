name: Public Earn gateway service binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/public-earn-gateway-service-binding-v1.yml"
      - "ops/public/run-public-seed-adapter-v1.sh"
      - "ops/public/install-vps-public-seed-adapter-v2.sh"
      - "ops/public/deploy-vps-public-seed-adapter-v2.sh"
      - "ops/public/install-local-public-earn-gateway-v1.sh"
      - "scripts/prove_public_earn_gateway_service_binding_v1.mjs"
      - "docs/operators/public-earn-gateway-service-binding-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-earn-gateway-service-binding-v1.yml"
      - "ops/public/run-public-seed-adapter-v1.sh"
      - "ops/public/install-vps-public-seed-adapter-v2.sh"
      - "ops/public/deploy-vps-public-seed-adapter-v2.sh"
      - "ops/public/install-local-public-earn-gateway-v1.sh"
      - "scripts/prove_public_earn_gateway_service_binding_v1.mjs"
      - "docs/operators/public-earn-gateway-service-binding-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prove_public_earn_gateway_service_binding_v1.mjs
      - run: npm run typecheck
