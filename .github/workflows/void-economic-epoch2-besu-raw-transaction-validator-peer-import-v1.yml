name: VOID economic epoch2 Besu raw transaction validator peer import v1

on:
  pull_request:
    paths:
      - "besu-plugins/epoch2-raw-transaction-domain-v1/pom.xml"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/src/main/java/org/voidnetwork/besu/epoch2/VoidEpoch2RawTransactionDomainPlugin.java"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/src/main/resources/META-INF/services/org.hyperledger.besu.plugin.BesuPlugin"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-artifact-v1.json"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.mjs"
      - "scripts/run_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.sh"
      - "docs/operators/economic-epoch2-besu-raw-transaction-validator-peer-import-v1.md"
      - ".github/workflows/void-economic-epoch2-besu-raw-transaction-validator-peer-import-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-besu-raw-transaction-validator-peer-import-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove peer-import source boundary
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.mjs
          bash -n scripts/run_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.sh
          node scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.mjs source

      - name: Diff hygiene
        run: git diff --check

  hosted-peer-import:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BESU_IMAGE: hyperledger/besu@sha256:6f3f21ce533383fcc8db3bce02252b59d5a9e776b72b5a1c8ecd2db011600042
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Use Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove exact plugin on peer block import
        run: bash scripts/run_void_economic_epoch2_besu_raw_transaction_validator_peer_import_v1.sh

      - name: Upload disposable peer-import evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-economic-epoch2-besu-raw-domain-peer-import-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/void-economic-epoch2-besu-raw-transaction-validator-peer-import-v1.json
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/genesis.json
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/qbft-extra-data.txt
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/producer.log
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/observer.log
            ${{ runner.temp }}/void-besu-raw-domain-peer-import-v1/plugins/void-epoch2-raw-transaction-domain-plugin-v1.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Diff hygiene
        run: git diff --check
