name: VOID WC/VOID vault deployer gas exact signing request v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-vault-deployer-gas-exact-signing-request-v1.yml"
      - "ops/mainnet0/wc-void-market-vault-deployer-gas-pre-sign-revalidation-evidence-v1.json"
      - "ops/mainnet0/wc-void-market-vault-deployer-gas-exact-signing-request-v1.json"
      - "tools/void-wc-void-market-vault-deployer-gas-exact-signing-request-v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_deployer_gas_exact_signing_request_v1.mjs"
      - "docs/operators/wc-void-market-vault-deployer-gas-exact-signing-request-v1.md"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "src/economic/buy_void_erc20_production_configuration_candidate_binding_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-vault-deployer-gas-exact-signing-request-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove exact signing request remains unauthorized
        run: node scripts/prove_void_wc_void_market_vault_deployer_gas_exact_signing_request_v1.mjs

      - name: Preserve pre-sign source proof
        run: node scripts/prove_void_wc_void_market_vault_deployer_gas_pre_sign_revalidation_v1.mjs

      - name: Preserve funding authorization source proof
        run: node scripts/prove_void_wc_void_market_vault_deployer_gas_funding_authorization_v1.mjs

      - name: Diff hygiene
        run: git diff --check
