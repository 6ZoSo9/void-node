name: void-buy-void-presale-exit-readiness-v1

on:
  pull_request:
    paths:
      - "tools/void-buy-void-presale-exit-readiness-v1.mjs"
      - "scripts/prove_void_buy_void_presale_exit_readiness_v1.mjs"
      - "docs/public/void-buy-void-presale-exit-readiness-v1.md"
      - ".github/workflows/void-buy-void-presale-exit-readiness-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-void-presale-exit-readiness-v1.mjs"
      - "scripts/prove_void_buy_void_presale_exit_readiness_v1.mjs"
      - "docs/public/void-buy-void-presale-exit-readiness-v1.md"
      - ".github/workflows/void-buy-void-presale-exit-readiness-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    name: node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/prove_void_buy_void_presale_exit_readiness_v1.mjs
