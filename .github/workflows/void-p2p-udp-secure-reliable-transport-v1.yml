name: VOID P2P secure reliable UDP transport v1

on:
  pull_request:
    paths:
      - "src/p2p/udp_secure_reliable_transport_v1.ts"
      - "scripts/prove_void_p2p_udp_secure_reliable_transport_v1.ts"
      - "docs/public/void-p2p-udp-secure-reliable-transport-v1.md"
      - ".github/workflows/void-p2p-udp-secure-reliable-transport-v1.yml"
      - "src/p2p/udp_authenticated_path_v1.ts"
      - "src/p2p/udp_hole_punch_v1.ts"
  push:
    branches: [main]
    paths:
      - "src/p2p/udp_secure_reliable_transport_v1.ts"
      - "scripts/prove_void_p2p_udp_secure_reliable_transport_v1.ts"
      - "docs/public/void-p2p-udp-secure-reliable-transport-v1.md"
      - ".github/workflows/void-p2p-udp-secure-reliable-transport-v1.yml"
      - "src/p2p/udp_authenticated_path_v1.ts"
      - "src/p2p/udp_hole_punch_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-udp-secure-reliable-transport-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove secure reliable UDP transport
        run: npx --no-install tsx scripts/prove_void_p2p_udp_secure_reliable_transport_v1.ts

      - name: Preserve authenticated UDP path
        run: npx --no-install tsx scripts/prove_void_p2p_udp_authenticated_path_v1.ts

      - name: Preserve UDP hole-punch foundation
        run: npx --no-install tsx scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts

      - name: Preserve authenticated TCP identity
        run: npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            git diff --check HEAD^..HEAD
          fi
