name: Apollyon live custody reviewed-root v2 upgrade v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_designated_host_custody_evidence_readonly_v2.py"
      - "scripts/prove_apollyon_designated_host_custody_evidence_readonly_v2.py"
      - "tools/apollyon-v2-raw-collector-adapter-v1.mjs"
      - "scripts/prove_apollyon_v2_raw_collector_adapter_v1.mjs"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_v2.py"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py"
      - "scripts/prove_apollyon_live_custody_source_session_execution_closure_v2.py"
      - "ops/xiphos/apollyon-custody-deployment-manifest-v1.json"
      - "ops/xiphos/apollyon-live-custody-reviewed-root-v2-upgrade-v1.json"
      - "ops/xiphos/apollyon_live_custody_reviewed_root_v2_upgrade_v1.py"
      - "scripts/prove_apollyon_live_custody_reviewed_root_v2_upgrade_v1.py"
      - "docs/security/apollyon-live-custody-reviewed-root-v2-upgrade-v1.md"
      - ".github/workflows/apollyon-live-custody-reviewed-root-v2-upgrade-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove reviewed-root upgrade
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_live_custody_reviewed_root_v2_upgrade_v1.py | tee "$RUNNER_TEMP/apollyon-root-upgrade-proof.log"
          grep -Fx 'isolated_python_preimport_guard=true' "$RUNNER_TEMP/apollyon-root-upgrade-proof.log"
          grep -Fx 'nonisolated_checkout_module_not_executed=true' "$RUNNER_TEMP/apollyon-root-upgrade-proof.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
