name: VOID node fleet convergence authority hardening bootstrap v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-node-fleet-convergence-authority-hardening-bootstrap-v1.yml'
      - 'scripts/patch_void_node_fleet_convergence_authority_hardening_v1.py'

permissions:
  contents: write

concurrency:
  group: void-node-fleet-convergence-authority-hardening-bootstrap-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == '6ZoSo9/void-node' &&
      github.event.pull_request.head.repo.full_name == '6ZoSo9/void-node' &&
      github.event.pull_request.head.ref == 'fix/void-node-fleet-convergence-authority-hardening-v1-20260809' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact carrier ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply deterministic authority hardening
        run: python3 scripts/patch_void_node_fleet_convergence_authority_hardening_v1.py

      - name: Syntax check convergence source and proof
        run: |
          node --check tools/void-node-fleet-source-convergence-v1.mjs
          node --check scripts/prove_void_node_fleet_source_convergence_v1.mjs

      - name: Prove source convergence authority boundary
        run: node scripts/prove_void_node_fleet_source_convergence_v1.mjs

      - name: Preserve fleet drift audit and connected peer shape
        run: node scripts/prove_void_node_fleet_drift_audit_v1.mjs

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Verify exact semantic hardening scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            'docs/operations/void-node-fleet-source-convergence-v1.md' \
            'scripts/prove_void_node_fleet_source_convergence_v1.mjs' \
            'tools/void-node-fleet-source-convergence-v1.mjs' > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit semantic hardening and retire carriers
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/operations/void-node-fleet-source-convergence-v1.md \
            scripts/prove_void_node_fleet_source_convergence_v1.mjs \
            tools/void-node-fleet-source-convergence-v1.mjs
          git rm -- \
            .github/workflows/void-node-fleet-convergence-authority-hardening-bootstrap-v1.yml \
            scripts/patch_void_node_fleet_convergence_authority_hardening_v1.py
          git diff --cached --check
          git commit -m 'fix: harden fleet convergence authority boundary'

      - name: Guard live branch then ordinary fast-forward publish
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_OLD="${{ github.event.pull_request.head.sha }}"
          LIVE="$(git ls-remote origin refs/heads/${{ github.event.pull_request.head.ref }} | awk '{print $1}')"
          test "$LIVE" = "$EXPECTED_OLD"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
