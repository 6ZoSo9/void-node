name: VOID Buy VOID final protected V7 V2 enforcement candidate v2

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v2.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v2.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Derive protected census-bound candidate
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
          npx tsx "$proof" --self-test
          out="$RUNNER_TEMP/final-protected-v7-v2-candidate-${{ matrix.node }}.json"
          npx tsx "$proof" --derive > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_final_protected_v7_v2_candidate_v2");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V2");
          assert.equal(c.version,2);
          assert.equal(c.protected_census_parent,"3faa7ba803b479d0f709bdc1f437b553154787d9");
          assert.equal(
            c.protected_census_evidence.census_id,
            "voidbefv7c4_9c8fa20632d3cfb431c0d13229153d19f076613720c7402e5374eab1f833401d",
          );
          assert.equal(
            c.protected_census_evidence.census_json_sha256,
            "c9d910cd461b87c6b4722ada7505ceffe9a8d3c266387f3d9bbebddaf8f586f8",
          );
          assert.equal(
            c.protected_census_evidence.protected_tracked_source_inventory_canonical_sha256,
            "224e8c4b63b231e40b1abf4982127a6e2b999724642c4360c10ca21887bbc0a2",
          );
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_v1.length,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_verified,true);
          assert.equal(
            c.current_enforcement_tracked_source_inventory_sha256,
            c.protected_census_evidence.protected_tracked_source_inventory_canonical_sha256,
          );
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.candidate_enforcement_set_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_FINAL_PROTECTED_V7_V2_CANDIDATE_V2_NODE_GREEN");
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-protected-v7-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-protected-v7-v2-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-protected-v7-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate
      - name: Require exact Node 22 24 26 candidate equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate/final-protected-v7-v2-candidate-$node.json"; done
          cmp candidate/final-protected-v7-v2-candidate-22.json candidate/final-protected-v7-v2-candidate-24.json
          cmp candidate/final-protected-v7-v2-candidate-22.json candidate/final-protected-v7-v2-candidate-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("candidate/final-protected-v7-v2-candidate-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_PROTECTED_V7_V2_CANDIDATE_V2_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          console.log("protected_census_id="+c.protected_census_evidence.census_id);
          console.log("candidate_enforcement_identity_accepted=false");
          NODE
