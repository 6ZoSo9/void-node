      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  current-v4-dispatch:
    name: current V4 dispatch / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 827b94aabbecb915ab2cf22bba8f178b7d0568bc
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: 827b94aabbecb915ab2cf22bba8f178b7d0568bc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Verify Dispatch V3 and frozen V3 evidence
        run: |
          set -euo pipefail
          echo "CURRENT_PROTECTED_INTEGRATION_DISPATCH_V4"
          integration="$RUNNER_TEMP/current-protected-integration-v4-${{ matrix.node }}.json"
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v4.mjs --self-test
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v4.mjs --receipt > "$integration"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "40c7d21e0f22bc2ffe079f80360af342f4d8a6aa"
          test "$(wc -c < ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" -eq 17392
          test "$(sha256sum ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json | awk '{print $1}')" = "7f9c032bb3685d0d45f439123878af0ba366bd587e29a98df3270f0f13808c96"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json)" = "f1b9d661eb3363e9bf18dbeb3610c659a54219bb"
          node --input-type=module - "$integration" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const i=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(i.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V4");
          assert.equal(i.protected_path_count,49);
          assert.equal(i.protected_path_identity_preserved,false);
          assert.equal(i.frozen_protected_inventory_preserved,true);
          assert.equal(i.reviewed_protected_drift_count,1);
          assert.equal(i.reviewed_deployment_reader_successor_bound,true);
          assert.equal(i.current_v4_candidate_inventory_preserved,true);
          assert.equal(i.v4_candidate_rederived_on_current_head,true);
          assert.equal(i.v4_candidate_enforcement_identity_accepted,false);
          assert.equal(i.workflow_dispatch_contracts_bound,true);
          assert.equal(i.production_tracked_file_nonblocking,true);
          assert.equal(i.production_tracked_file_fifo_swap_rejected,true);
          assert.equal(i.current_built_census_identity_matches_frozen_v4,true);
          assert.equal(i.provider_source_identity_preserved,true);
          assert.equal(i.provider_source_blob_manifest_bound,true);
          assert.equal(i.provider_historical_commit_object_required,false);
          assert.equal(i.protected_parent_scope_manifest_bound,true);
          assert.equal(i.protected_parent_scope_delta_status_bound,true);
          assert.equal(i.protected_parent_historical_commit_object_required,false);
          assert.ok(Number.isSafeInteger(i.protected_parent_scope_row_count)&&
            i.protected_parent_scope_row_count>3);
          assert.equal(i.frozen_candidate_rederived_on_current_head,false);
          assert.equal(i.current_generation_integration_verified,true);
          assert.equal(i.production_source_finality_authority_ready,false);
          assert.equal(i.public_presale_activation,false);
          assert.equal(i.funds_movement,false);
          NODE
      - name: Require frozen V3 lock to HOLD on repaired tool identity
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git switch -C main "$head"
          out="$RUNNER_TEMP/deployment-v3-reader-hold-${{ matrix.node }}.log"
          set +e
          npx tsx ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            --plan \
            --expected-commit "$head" \
            --expected-tree "$tree" \
            --accepted-enforcement-lock-path ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json \
            >"$out" 2>&1
          status=$?
          set -e
          cat "$out"
          test "$status" -eq 2
          grep -Fx 'marker=VOID_BUY_VOID_SOURCE_FINALITY_V7_DEPLOYMENT_RECEIPT_INSTALL_V1_HOLD' "$out"
          grep -Fx 'reason=accepted_enforcement_candidate_current_source_inventory_mismatch:ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts' "$out"
          test "$(grep -Fxc 'status=PLAN_GREEN' "$out" || true)" -eq 0
          printf '%s\n' \
            'marker=VOID_BUY_VOID_SOURCE_FINALITY_V7_DEPLOYMENT_RECEIPT_INSTALL_V1_HOLD' \
            'reason=accepted_enforcement_candidate_current_source_inventory_mismatch:ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts' \
            > "$out.normalized"
          mv "$out.normalized" "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-current-v4-dispatch-827b94aabbecb915ab2cf22bba8f178b7d0568bc-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/current-protected-integration-v4-${{ matrix.node }}.json
            ${{ runner.temp }}/deployment-v3-reader-hold-${{ matrix.node }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: 827b94aabbecb915ab2cf22bba8f178b7d0568bc
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git diff --check "$(git merge-base "$BASE" "$HEAD")" "$HEAD"

  current-v4-dispatch-cross-node:
    needs: [current-v4-dispatch]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-current-v4-dispatch-827b94aabbecb915ab2cf22bba8f178b7d0568bc-node-*
          merge-multiple: true
          path: current-v3
      - name: Require Node 22 24 26 equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "current-v3/current-protected-integration-v4-$node.json"
            test -s "current-v3/deployment-v3-reader-hold-$node.log"
          done
          cmp current-v3/current-protected-integration-v4-22.json current-v3/current-protected-integration-v4-24.json
          cmp current-v3/current-protected-integration-v4-22.json current-v3/current-protected-integration-v4-26.json
          cmp current-v3/deployment-v3-reader-hold-22.log current-v3/deployment-v3-reader-hold-24.log
          cmp current-v3/deployment-v3-reader-hold-22.log current-v3/deployment-v3-reader-hold-26.log
          echo VOID_BUY_VOID_CURRENT_V4_DISPATCH_CROSS_NODE_GREEN

  derive-v3-portable:
    name: derive V3 portable / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a93016c2e1b0656e9abe8a7607bc35c6cf94eb37
          fetch-depth: 0
          persist-credentials: false
      - name: Create reachable-history-only proof clone
        env:
          EXPECTED_HEAD: a93016c2e1b0656e9abe8a7607bc35c6cf94eb37
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git update-ref refs/heads/void-v3-proof "$EXPECTED_HEAD"
          git bundle create "$RUNNER_TEMP/v3-reachable.bundle" refs/heads/void-v3-proof
          git update-ref -d refs/heads/void-v3-proof
          git clone --no-local "$RUNNER_TEMP/v3-reachable.bundle" "$RUNNER_TEMP/v3-reachable"
          git -C "$RUNNER_TEMP/v3-reachable" checkout --detach "$EXPECTED_HEAD"
          test "$(git -C "$RUNNER_TEMP/v3-reachable" rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C "$RUNNER_TEMP/v3-reachable" cat-file -e '8b0823d55ebebadca172497ef754413591c5f54b^{commit}'
          if git -C "$RUNNER_TEMP/v3-reachable" cat-file -e 'af9646827b25e8103004f96525623ba248b41d2a^{commit}' 2>/dev/null; then
            echo 'unreachable_historical_dispatch_object_present=true' >&2
            exit 1
          fi
          test "$(git -C "$RUNNER_TEMP/v3-reachable" rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
          test "$(git -C "$RUNNER_TEMP/v3-reachable" rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs)" = "8ea7786299422f7fc3fbfd7474b5e92d869e92c2"
          test "$(git -C "$RUNNER_TEMP/v3-reachable" rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md)" = "e0d529ca2b465aa28e61be187a7a9b8dc96e6a5f"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install and build reachable generation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v3-reachable"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Derive portable V3 candidate
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v3-reachable"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --self-test
          out="$RUNNER_TEMP/portable-v3-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json
          test "$(sha256sum "$out" | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          test "$(git hash-object "$out")" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3");
          assert.equal(c.version,3);
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,"c0a56b378215feafacc089e9f59a9f966d57f11e5582e4a13afcd6351d2447bb");
          assert.equal(c.candidate_enforcement_set_sha256,"95a11602e5f2639d33b378293b92863ea7f9f37020ad18dec49d3d4ac6289fd4");
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_CANDIDATE_V3_PORTABLE_GREEN");
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v7-v2-candidate-v3-portable-a93016c2e1b0656e9abe8a7607bc35c6cf94eb37-node-${{ matrix.node }}
          path: ${{ runner.temp }}/portable-v3-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node-v3-portable:
    needs: [derive-v3-portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v7-v2-candidate-v3-portable-a93016c2e1b0656e9abe8a7607bc35c6cf94eb37-node-*
          merge-multiple: true
          path: candidate-v3
      - name: Require portable V3 Node 22 24 26 equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate-v3/portable-v3-$node.json"; done
          cmp candidate-v3/portable-v3-22.json candidate-v3/portable-v3-24.json
          cmp candidate-v3/portable-v3-22.json candidate-v3/portable-v3-26.json
          test "$(sha256sum candidate-v3/portable-v3-22.json | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          echo VOID_BUY_VOID_PROTECTED_V7_V2_CANDIDATE_V3_PORTABLE_CROSS_NODE_GREEN

  lock-v3-source-proof:
    needs: [cross-node-v3-portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9f610b351ad48b214fa04dc6b961e4a202049913
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Bind exact V3 lock generation
        env:
          EXPECTED_HEAD: 9f610b351ad48b214fa04dc6b961e4a202049913
        run: |
          set -euo pipefail
