name: VOID Buy VOID final protected V7 V2 enforcement candidate v2

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v2.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v2.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v2.md"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "docs/architecture/buy-void-repaired-v7-v2-current-generation-dispatch-v2.md"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "docs/architecture/buy-void-repaired-v7-v2-current-generation-dispatch-v1.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v4.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_crash_consistent_fulfillment_saga_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v2.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v2.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v2.md"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "docs/architecture/buy-void-repaired-v7-v2-current-generation-dispatch-v2.md"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json"
      - "docs/architecture/buy-void-repaired-v7-v2-current-generation-dispatch-v1.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Derive current protected V7 V2 candidate V3 successor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs)" = "2ae7e642b4dc38b80b4e55ef3fdea18a3d0eb7c4"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-deployment-successor-v3.md)" = "4f0f349f41be96180794acf76f624927ef9eae8a"
          v3="$RUNNER_TEMP/final-protected-v7-v2-candidate-v3-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --self-test
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v3.mjs --derive > "$v3"
          cmp "$v3" ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json
          test "$(sha256sum "$v3" | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          test "$(git hash-object "$v3")" = "79998af4763b6afca84ffe4e8d14d9a6ff535dfd"
          echo "VOID_BUY_VOID_PROTECTED_V7_V2_CANDIDATE_V3_NODE_${{ matrix.node }}_GREEN"
      - name: Verify frozen candidate against current protected integration
        run: |
          set -euo pipefail
          echo "CURRENT_PROTECTED_INTEGRATION_DISPATCH_V2"
          integration="$RUNNER_TEMP/current-protected-integration-${{ matrix.node }}.json"
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --receipt > "$integration"
          candidate="$RUNNER_TEMP/final-protected-v7-v2-candidate-${{ matrix.node }}.json"
          cp ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json "$candidate"
          node --input-type=module - "$candidate" "$integration" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const i=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_final_protected_v7_v2_candidate_v2");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V2");
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.equal(i.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V2");
          assert.equal(i.protected_path_count,49);
          assert.equal(i.protected_path_identity_preserved,false);
          assert.equal(i.frozen_protected_inventory_preserved,true);
          assert.equal(i.reviewed_protected_drift_count,1);
          assert.equal(i.reviewed_range_index_successor_bound,true);
          assert.equal(i.current_built_census_identity_matches_frozen_v4,true);
          assert.equal(i.provider_source_identity_preserved,true);
          assert.equal(i.frozen_candidate_rederived_on_current_head,false);
          assert.equal(i.current_generation_integration_verified,true);
          assert.equal(i.public_presale_activation,false);
          assert.equal(i.funds_movement,false);
          NODE
          test "$(wc -c < "$candidate")" -eq 16342
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "092a97373013d32dda610df7363587fa3a669f33248a37420b07541d12d892bb"
          test "$(git hash-object "$candidate")" = "4e23ecbb64eb26c14f5ab15af85eb86d59c3a718"

      - name: Verify exact hosted candidate and acceptance lock
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/final-protected-v7-v2-candidate-${{ matrix.node }}.json"
          cmp "$candidate" ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json
          lock="$RUNNER_TEMP/final-protected-v7-v2-lock-${{ matrix.node }}.json"
          echo "CURRENT_PROTECTED_INTEGRATION_DISPATCH_V2"
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test
          cp ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json "$lock"
          cmp "$lock" ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json
          test "$(wc -c < "$candidate")" -eq 16342
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "092a97373013d32dda610df7363587fa3a669f33248a37420b07541d12d892bb"
          test "$(git hash-object "$candidate")" = "4e23ecbb64eb26c14f5ab15af85eb86d59c3a718"

      - name: Require frozen accepted lock to HOLD against successor source
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git switch -C main "$head"
          out="$RUNNER_TEMP/deployment-plan-hold-${{ matrix.node }}.log"
          set +e
          npx tsx ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts \
            --plan \
            --expected-commit "$head" \
            --expected-tree "$tree" \
            --accepted-enforcement-lock-path ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json \
            >"$out" 2>&1
          status=$?
          set -e
          cat "$out"
          test "$status" -eq 2
          grep -Fx 'marker=VOID_BUY_VOID_SOURCE_FINALITY_V7_DEPLOYMENT_RECEIPT_INSTALL_V1_HOLD' "$out"
          grep -Fx 'reason=accepted_enforcement_candidate_current_source_inventory_mismatch:src/index.ts' "$out"
          test "$(grep -Fxc 'status=PLAN_GREEN' "$out" || true)" -eq 0
          echo 'frozen_accepted_lock_current_source_plan_hold=true'
          echo 'separate_deployment_generation_required=true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-protected-v7-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/final-protected-v7-v2-candidate-${{ matrix.node }}.json
            ${{ runner.temp }}/final-protected-v7-v2-lock-${{ matrix.node }}.json
            ${{ runner.temp }}/current-protected-integration-${{ matrix.node }}.json
            ${{ runner.temp }}/final-protected-v7-v2-candidate-v3-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-protected-v7-v2-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate
      - name: Require exact Node 22 24 26 candidate equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate/final-protected-v7-v2-candidate-$node.json"; done
          cmp candidate/final-protected-v7-v2-candidate-22.json candidate/final-protected-v7-v2-candidate-24.json
          cmp candidate/final-protected-v7-v2-candidate-22.json candidate/final-protected-v7-v2-candidate-26.json
          for node in 22 24 26; do test -s "candidate/final-protected-v7-v2-candidate-v3-$node.json"; done
          cmp candidate/final-protected-v7-v2-candidate-v3-22.json candidate/final-protected-v7-v2-candidate-v3-24.json
          cmp candidate/final-protected-v7-v2-candidate-v3-22.json candidate/final-protected-v7-v2-candidate-v3-26.json
          test "$(sha256sum candidate/final-protected-v7-v2-candidate-v3-22.json | awk '{print $1}')" = "df3b5b74e0d1cd0f3198d8f0a5190d392518480804155ad848cd43b6eae6cbf6"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("candidate/final-protected-v7-v2-candidate-v3-22.json","utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V3");
          assert.equal(c.version,3);
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,"c0a56b378215feafacc089e9f59a9f966d57f11e5582e4a13afcd6351d2447bb");
          assert.equal(c.successor_transition.reviewed_protected_drift_count,1);
          assert.equal(c.successor_transition.reviewed_range_index_successor_bound,true);
          assert.equal(c.successor_transition.predecessor_candidate_preserved,true);
          assert.equal(c.candidate_enforcement_set_sha256,"95a11602e5f2639d33b378293b92863ea7f9f37020ad18dec49d3d4ac6289fd4");
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_PROTECTED_V7_V2_CANDIDATE_V3_CROSS_NODE_GREEN");
          NODE
          for node in 22 24 26; do test -s "candidate/final-protected-v7-v2-lock-$node.json"; done
          cmp candidate/final-protected-v7-v2-lock-22.json candidate/final-protected-v7-v2-lock-24.json
          cmp candidate/final-protected-v7-v2-lock-22.json candidate/final-protected-v7-v2-lock-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("candidate/final-protected-v7-v2-candidate-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_PROTECTED_V7_V2_CANDIDATE_V2_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          console.log("protected_census_id="+c.protected_census_evidence.census_id);
          const lockBytes=fs.readFileSync("candidate/final-protected-v7-v2-lock-22.json");
          const lock=JSON.parse(lockBytes);
          assert.equal(lock.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V2");
          assert.equal(lock.candidate_head,"1d138dcb3ac61f156fe8eb0fff27341fe97c04f9");
          assert.equal(lock.candidate_evidence.sha256,"092a97373013d32dda610df7363587fa3a669f33248a37420b07541d12d892bb");
          assert.equal(lock.candidate_evidence.git_blob_sha1,"4e23ecbb64eb26c14f5ab15af85eb86d59c3a718");
          assert.equal(lock.candidate_evidence.candidate_enforcement_set_sha256,"05d7648032223f74a05d89200ef23a76a5265ef2a3a26e52c7f51ce3b33bc852");
          assert.equal(lock.candidate_enforcement_identity_accepted,true);
          assert.equal(lock.deployed_artifact_generation_verified,false);
          assert.equal(lock.production_source_finality_authority_ready,false);
          assert.equal(lock.public_presale_activation,false);
          assert.equal(lock.funds_movement,false);
          console.log("lock_json_sha256="+crypto.createHash("sha256").update(lockBytes).digest("hex"));
          console.log("accepted_enforcement_set_sha256="+lock.candidate_evidence.candidate_enforcement_set_sha256);
          console.log("candidate_enforcement_identity_accepted=true");
          NODE
