name: VOID reviewed Node package runtime v2

on:
  pull_request:
    paths:
      - ".github/workflows/void-reviewed-node-package-runtime-v2.yml"
      - "scripts/prove_void_reviewed_node_package_runtime_v2.mjs"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/security/reviewed-node-package-runtime-ethers-v2.json"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_v1.sh"
      - "ops/precision/void_buy_void_source_finality_v7_privileged_launcher_body_v2.bash"
      - "ops/precision/void_buy_void_source_finality_v7_native_preentry_v1.c"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_candidate_v1.mjs"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v1.mjs"
      - "ops/security/buy-void-v7-privileged-launcher-package-runtime-v1.json"
      - "scripts/prove_buy_void_reviewed_git_invocation_v1.mjs"
      - "docs/security/buy-void-v7-privileged-launcher-package-runtime-candidate-v1.md"
      - "docs/security/buy-void-v7-privileged-launcher-package-runtime-v1.md"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prove:
    name: reviewed package successor / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove frozen V1 refusal and current V2 reviewed runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/void-reviewed-node-package-runtime-v1.mjs
          node --check scripts/prove_void_reviewed_node_package_runtime_v2.mjs
          receipt="$RUNNER_TEMP/reviewed-node-package-runtime-v2.txt"
          node scripts/prove_void_reviewed_node_package_runtime_v2.mjs | tee "$receipt"
          grep -Fx "VOID_REVIEWED_NODE_PACKAGE_RUNTIME_V2_ENFORCEMENT_GREEN" "$receipt"
          grep -Fx "frozen_v1_profile_unchanged=true" "$receipt"
          grep -Fx "frozen_v1_refuses_current_package_generation=true" "$receipt"
          grep -Fx "v2_profile_cross_node_derived=true" "$receipt"
          grep -Fx "private_ethers_import_green=true" "$receipt"
          grep -Fx "runtime_chain_wallet_transaction_funds_authority=0" "$receipt"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$BASE" "$HEAD"

  prove-v7-privileged-launcher-package-runtime-v2:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact head and install audited lock
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Reinventory current privileged launcher package runtime
        run: |
          set -euo pipefail
          node --check scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs
          out="$RUNNER_TEMP/v7-privileged-launcher-package-runtime-v2-${{ matrix.node }}.json"
          node scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs --derive > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.native_preentry_contract_verified,true);
          assert.equal(j.launcher_gate_contract_verified,true);
          assert.equal(j.package_runtime_identity_rederived,true);
          assert.equal(j.privileged_launcher_package_runtime_verified,true);
          assert.equal(j.tsx_worker_threads_allowed,true);
          assert.equal(j.tsx_runtime_id,"voidtsxpr1_0f2bf2dba60718942e7db9b83779a2aeb2e9db32e74610a96a8ec978ad35e4d4");
          assert.equal(j.protected_source_install_authorized,false);
          assert.equal(j.privileged_receipt_execution_authorized,false);
          assert.equal(j.public_presale_activation,false);
          assert.equal(j.funds_movement,false);
          console.log("VOID_V7_PRIVILEGED_LAUNCHER_PACKAGE_RUNTIME_V2_NODE_GREEN");
          NODE
          receipt="$RUNNER_TEMP/v7-privileged-launcher-package-runtime-v2-${{ matrix.node }}.txt"
          node scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs --report | tee "$receipt"
          grep -Fx 'native_preentry_contract_verified=true' "$receipt"
          grep -Fx 'launcher_gate_contract_verified=true' "$receipt"
          grep -Fx 'package_runtime_identity_rederived=true' "$receipt"
          grep -Fx 'privileged_launcher_package_runtime_verified=true' "$receipt"
          grep -Fx 'tsx_worker_threads_allowed=true' "$receipt"
          grep -Fx 'privileged_receipt_execution_authorized=false' "$receipt"
          grep -Fx 'funds_movement=false' "$receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-v7-privileged-launcher-package-runtime-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/v7-privileged-launcher-package-runtime-v2-${{ matrix.node }}.json
            ${{ runner.temp }}/v7-privileged-launcher-package-runtime-v2-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE" "$HEAD"

  v7-privileged-launcher-package-runtime-v2-cross-node:
    needs: [prove-v7-privileged-launcher-package-runtime-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-v7-privileged-launcher-package-runtime-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./runtime-v2
      - name: Require exact Node 22 24 26 runtime evidence
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "runtime-v2/v7-privileged-launcher-package-runtime-v2-$v.json"
            test -s "runtime-v2/v7-privileged-launcher-package-runtime-v2-$v.txt"
          done
          cmp runtime-v2/v7-privileged-launcher-package-runtime-v2-22.json runtime-v2/v7-privileged-launcher-package-runtime-v2-24.json
          cmp runtime-v2/v7-privileged-launcher-package-runtime-v2-22.json runtime-v2/v7-privileged-launcher-package-runtime-v2-26.json
          cmp runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt runtime-v2/v7-privileged-launcher-package-runtime-v2-24.txt
          cmp runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt runtime-v2/v7-privileged-launcher-package-runtime-v2-26.txt
          grep -Fx 'native_preentry_contract_verified=true' runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt
          grep -Fx 'privileged_launcher_package_runtime_verified=true' runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt
          grep -Fx 'tsx_worker_threads_allowed=true' runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt
          grep -Fx 'privileged_receipt_execution_authorized=false' runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt
          grep -Fx 'funds_movement=false' runtime-v2/v7-privileged-launcher-package-runtime-v2-22.txt
          sha256sum runtime-v2/v7-privileged-launcher-package-runtime-v2-22.json
          echo "VOID_V7_PRIVILEGED_LAUNCHER_PACKAGE_RUNTIME_V2_CROSS_NODE_GREEN"
