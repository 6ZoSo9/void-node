name: VOID V7 stage verifier create-only account plan v1

on:
  pull_request:
    paths:
      - 'ops/security/void_v7_stage_verifier_create_only_account_plan_v1.json'
      - 'scripts/prove_void_v7_stage_verifier_create_only_account_plan_v1.py'
      - 'docs/security/void-v7-stage-verifier-create-only-account-plan-v1.md'
      - '.github/workflows/void-v7-stage-verifier-create-only-account-plan-v1.yml'

permissions:
  contents: read

jobs:
  stage-verifier-account-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Exact input identities and create-only four-path scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$BASE" = "eca1b2313f7c384b619151998613d9374fde1bc2"
          git merge-base --is-ancestor "$BASE" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:ops/security/void_v7_v5_stage_role_separation_contract_v1.json)" = "1dccc0f7fd1c74005b519113b0728ebd25477ad5"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py)" = "b8b52649730cd1b1cf23ffc8c68878cef8ecfc5b"
          test "$(git rev-parse HEAD:ops/security/void_v7_stage_verifier_create_only_account_plan_v1.json)" = "e2e052fa0fa1858e842063f994ddd3e611772949"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_stage_verifier_create_only_account_plan_v1.py)" = "060c9842a760d4df11677d7e8dab1e04ccc6b2b7"
          test "$(git rev-parse HEAD:docs/security/void-v7-stage-verifier-create-only-account-plan-v1.md)" = "ea2f901a270d60f4719c8fd52799f688f0197c25"
          cat > /tmp/v7-expected-scope <<'SCOPE'
          A	.github/workflows/void-v7-stage-verifier-create-only-account-plan-v1.yml
          A	docs/security/void-v7-stage-verifier-create-only-account-plan-v1.md
          A	ops/security/void_v7_stage_verifier_create_only_account_plan_v1.json
          A	scripts/prove_void_v7_stage_verifier_create_only_account_plan_v1.py
          SCOPE
          git diff --name-status "$BASE" "$EXPECTED_HEAD" -- | sort > /tmp/v7-actual-scope
          sort /tmp/v7-expected-scope > /tmp/v7-expected-scope.sorted
          diff -u /tmp/v7-expected-scope.sorted /tmp/v7-actual-scope
          git diff --check "$BASE" "$EXPECTED_HEAD" --

      - name: Nonroot source-only plan proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -I -B scripts/prove_void_v7_stage_verifier_create_only_account_plan_v1.py
