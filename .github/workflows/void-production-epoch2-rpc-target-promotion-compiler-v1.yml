name: VOID production Epoch-2 RPC promotion compiler v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-production-epoch2-rpc-target-promotion-compiler-v1.yml"
      - "docs/operators/production-epoch2-rpc-target-promotion-compiler-v1.md"
      - "docs/operators/production-epoch2-rpc-target-v1.md"
      - "scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-compiler-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-v1.mjs"
      - "tools/void-datanet-registry-deployer-activation-bound-observer-v1.mjs"
      - "tools/void-economic-epoch2-qbft-private-runtime-activation-v1.mjs"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-production-epoch2-rpc-target-promotion-compiler-v1.yml"
      - "docs/operators/production-epoch2-rpc-target-promotion-compiler-v1.md"
      - "docs/operators/production-epoch2-rpc-target-v1.md"
      - "scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs"
      - "tools/void-production-epoch2-rpc-target-promotion-compiler-v1.mjs"
      - "tools/void-production-epoch2-rpc-target-v1.mjs"
      - "tools/void-datanet-registry-deployer-activation-bound-observer-v1.mjs"
      - "tools/void-economic-epoch2-qbft-private-runtime-activation-v1.mjs"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-production-epoch2-rpc-target-promotion-compiler-v1.mjs
          node --check scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs
      - name: Prove production Epoch-2 RPC promotion compiler
        run: |
          node scripts/prove_void_production_epoch2_rpc_target_promotion_compiler_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
