name: VOID WC-VOID launch-controller control requalification v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-launch-controller-control-requalification-v1.yml"
      - "docs/operators/wc-void-launch-controller-control-requalification-v1.md"
      - "scripts/prove_void_wc_void_launch_controller_control_requalification_v1.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-launch-controller-control-requalification-v1.yml"
      - "docs/operators/wc-void-launch-controller-control-requalification-v1.md"
      - "scripts/prove_void_wc_void_launch_controller_control_requalification_v1.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-launch-controller-control-requalification-v1.mjs
          node --check scripts/prove_void_wc_void_launch_controller_control_requalification_v1.mjs
      - name: Prove current launch-controller control contract
        run: node scripts/prove_void_wc_void_launch_controller_control_requalification_v1.mjs
      - name: Diff hygiene
        shell: bash
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          git diff --check "$base"...HEAD
