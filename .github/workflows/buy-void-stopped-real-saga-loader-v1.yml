name: VOID Buy VOID stopped real saga loader v1
on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs"
      - ".github/workflows/buy-void-stopped-real-saga-loader-v1.yml"
      - "docs/architecture/buy-void-stopped-real-saga-loader-v1.md"
      - "src/economic/buy_void_erc20_execution_composition_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "scripts/prove_buy_void_enforcement_descriptor_relative_linux_v1.mjs"
      - "scripts/prove_buy_void_reviewed_git_invocation_v1.mjs"
      - "scripts/prove_buy_void_composed_saga_import_initialization_v1.mjs"
      - "scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v1.mjs"
      - "scripts/prove_buy_void_composed_stopped_saga_package_v1.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workspace-real-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve predecessor evidence
        run: |
          node scripts/prove_buy_void_composed_saga_import_initialization_v1.mjs --derive > "$RUNNER_TEMP/import-init.json"
          node scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v1.mjs --derive > "$RUNNER_TEMP/inert.json"
          node scripts/prove_buy_void_composed_stopped_saga_package_v1.mjs --source > "$RUNNER_TEMP/package.json"
      - run: npm run build
      - name: Execute real saga initialization only
        run: |
          node --check scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs
          node scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs --self-test
          node scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs --workspace > "real-saga-${{ matrix.node }}.json"
          node --input-type=module - <<'NODE' "real-saga-${{ matrix.node }}.json"
          import assert from "node:assert/strict"; import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.real_saga_module_imported,true);
          assert.equal(j.real_saga_module_initialized,true);
          assert.equal(j.real_saga_exports_invoked,false);
          assert.equal(j.saga_static_dependencies_builtin_only,true);
          assert.equal(j.executed_saga_loader_qualified,true);
          assert.equal(j.dynamic_tool_transitive_closure_verified_for_saga_edge,true);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          assert.equal(j.funds_movement,false);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-real-saga-loader-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: real-saga-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1
      - run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
  cross-node:
    needs: [workspace-real-import]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-real-saga-loader-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence
      - run: |
          for v in 22 24 26; do test -s "evidence/real-saga-$v.json"; done
          cmp evidence/real-saga-22.json evidence/real-saga-24.json
          cmp evidence/real-saga-22.json evidence/real-saga-26.json
          sha256sum evidence/real-saga-22.json
  stopped-image-extracted-real-import:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build stopped image and qualify extracted bytes
        run: |
          set -euo pipefail
          docker build --iidfile "$RUNNER_TEMP/image-id" .
          IMAGE_ID="$(cat "$RUNNER_TEMP/image-id")"; [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          CID="$(docker create "$IMAGE_ID")"; trap 'docker rm "$CID" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = created
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = false
          test "$(docker inspect --format '{{json .Mounts}}' "$CID")" = "[]"
          ROOT="$RUNNER_TEMP/stopped-root"; mkdir -p "$ROOT/dist/economic" "$ROOT/tools"
          docker cp "$CID:/app/dist/economic/buy_void_erc20_execution_composition_v1.js" "$ROOT/dist/economic/"
          docker cp "$CID:/app/tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs" "$ROOT/tools/"
          node scripts/prove_buy_void_stopped_real_saga_loader_v1.mjs --stopped-root "$ROOT" > "$RUNNER_TEMP/result.json"
          node --input-type=module - <<'NODE' "$RUNNER_TEMP/result.json"
          import assert from "node:assert/strict"; import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.stopped_image_extracted_real_saga_loader_qualified,true);
          assert.equal(j.real_saga_module_imported,true);
          assert.equal(j.real_saga_exports_invoked,false);
          assert.equal(j.dynamic_tool_transitive_closure_verified_for_saga_edge,true);
          assert.equal(j.complete_executable_closure_verified,false);
          assert.equal(j.packaged_image_generation_accepted,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          assert.equal(j.funds_movement,false);
          NODE
          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = created
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = false
