name: Mainnet-0 Canonical Producer Liveness Guard v1

on:
  pull_request:
    paths:
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "ops/run-void-node-live-v1.sh"
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/install-void-node-live-user-service-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/public-node-live-runtime-quarantine-install.sh"
      - "scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs"
      - "scripts/prove_canonical_producer_no_empty_autoprop_v1.mjs"
      - "ops/fix-main-runtime-autoprop.sh"
      - "scripts/boot.sh"
      - "src/index.ts"
      - "src/node_core.ts"
      - "ops/install-user-units.sh"
      - ".env.example"
      - "ops/prove-main-runtime-autoprop.sh"
      - "ops/mainnet0-go-no-go-with-runtime.sh"
      - "scripts/prove_canonical_producer_no_empty_operator_contract_v1.mjs"
      - ".github/workflows/mainnet0-canonical-producer-liveness-guard-v1.yml"
  push:
    branches:
      - main
    paths:
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "ops/run-void-node-live-v1.sh"
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/install-void-node-live-user-service-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/public-node-live-runtime-quarantine-install.sh"
      - "scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs"
      - "scripts/prove_canonical_producer_no_empty_autoprop_v1.mjs"
      - "ops/fix-main-runtime-autoprop.sh"
      - "scripts/boot.sh"
      - "src/index.ts"
      - "src/node_core.ts"
      - "ops/install-user-units.sh"
      - ".env.example"
      - "ops/prove-main-runtime-autoprop.sh"
      - "ops/mainnet0-go-no-go-with-runtime.sh"
      - "scripts/prove_canonical_producer_no_empty_operator_contract_v1.mjs"
      - ".github/workflows/mainnet0-canonical-producer-liveness-guard-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Shell syntax
        run: |
          bash -n ops/guard-canonical-producer-liveness-v1.sh
          bash -n ops/install-void-node-live-user-service-v1.sh
          bash -n ops/mainnet0/install-canonical-producer-liveness-v1.sh
          bash -n ops/mainnet0/public-node-live-runtime-quarantine-install.sh
          bash -n ops/fix-main-runtime-autoprop.sh
          bash -n scripts/boot.sh
          bash -n ops/prove-main-runtime-autoprop.sh
          bash -n ops/mainnet0-go-no-go-with-runtime.sh
      - name: Canonical producer liveness proof
        env:
          VOID_CANONICAL_SELF_HTTP_GUARD: "1"
          VOID_CANONICAL_DISABLE_LEGACY_SELF_HTTP_OBSERVERS: "1"
        run: node scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs
      - name: Canonical producer idle no-empty proof
        run: node scripts/prove_canonical_producer_no_empty_autoprop_v1.mjs
      - name: Canonical producer no-empty dependency and operator contract
        run: node scripts/prove_canonical_producer_no_empty_operator_contract_v1.mjs
