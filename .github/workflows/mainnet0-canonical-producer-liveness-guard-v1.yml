name: Mainnet-0 Canonical Producer Liveness Guard v1

on:
  pull_request:
    paths:
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/install-void-node-live-user-service-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/public-node-live-runtime-quarantine-install.sh"
      - "scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs"
      - "src/index.ts"
      - ".github/workflows/mainnet0-canonical-producer-liveness-guard-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/install-void-node-live-user-service-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/public-node-live-runtime-quarantine-install.sh"
      - "scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs"
      - "src/index.ts"
      - ".github/workflows/mainnet0-canonical-producer-liveness-guard-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Shell syntax
        run: |
          bash -n ops/guard-canonical-producer-liveness-v1.sh
          bash -n ops/install-void-node-live-user-service-v1.sh
          bash -n ops/mainnet0/install-canonical-producer-liveness-v1.sh
          bash -n ops/mainnet0/public-node-live-runtime-quarantine-install.sh
      - name: Canonical producer liveness proof
        run: node scripts/prove_mainnet0_canonical_producer_liveness_guard_v1.mjs
