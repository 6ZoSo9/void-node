name: VOID Release Installer Materialize-Only v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-release-installer-materialize-only-v1.yml"
      - "ops/public/install-void-node-v1.sh"
      - "ops/public/install-void-node-portable-runtime-v1.sh"
      - "scripts/prove_void_release_installer_materialize_only_v1.mjs"
      - "docs/operators/void-release-installer-materialize-only-v1.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-release-installer-materialize-only-v1.yml"
      - "ops/public/install-void-node-v1.sh"
      - "ops/public/install-void-node-portable-runtime-v1.sh"
      - "scripts/prove_void_release_installer_materialize_only_v1.mjs"
      - "docs/operators/void-release-installer-materialize-only-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_major: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node_major }}
      - name: Syntax
        run: |
          bash -n ops/public/install-void-node-v1.sh
          bash -n ops/public/install-void-node-portable-runtime-v1.sh
          node --check scripts/prove_void_release_installer_materialize_only_v1.mjs
      - name: Prove materialize-only release boundary
        run: node scripts/prove_void_release_installer_materialize_only_v1.mjs
