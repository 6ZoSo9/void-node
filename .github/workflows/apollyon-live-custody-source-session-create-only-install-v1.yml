name: Apollyon live custody source session create-only install v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py"
      - "ops/xiphos/apollyon-node-runtime-custody-v1.json"
      - "ops/xiphos/apollyon_node_runtime_create_only_install_v1.py"
      - "scripts/prove_apollyon_live_custody_source_session_create_only_install_v1.py"
      - "docs/security/apollyon-live-custody-source-session-create-only-install-v1.md"
      - ".github/workflows/apollyon-live-custody-source-session-create-only-install-v1.yml"
      - "ops/xiphos/apollyon-custody-deployment-manifest-v1.json"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.service"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.target"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.env.template"
      - "ops/xiphos/00-void-apollyon-training-custody-deny-v1.rules"
      - "ops/xiphos/void-apollyon-custody-v1.tmpfiles.conf"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py"
      - "ops/xiphos/apollyon-node-runtime-custody-v1.json"
      - "ops/xiphos/apollyon_node_runtime_create_only_install_v1.py"
      - "scripts/prove_apollyon_live_custody_source_session_create_only_install_v1.py"
      - "docs/security/apollyon-live-custody-source-session-create-only-install-v1.md"
      - ".github/workflows/apollyon-live-custody-source-session-create-only-install-v1.yml"
      - "ops/xiphos/apollyon-custody-deployment-manifest-v1.json"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.service"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.target"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.env.template"
      - "ops/xiphos/00-void-apollyon-training-custody-deny-v1.rules"
      - "ops/xiphos/void-apollyon-custody-v1.tmpfiles.conf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove create-only installer
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_live_custody_source_session_create_only_install_v1.py | tee "$RUNNER_TEMP/apollyon-create-only-proof.log"
          grep -Fx 'isolated_python_preimport_guard=true' "$RUNNER_TEMP/apollyon-create-only-proof.log"
          grep -Fx 'nonisolated_checkout_module_not_executed=true' "$RUNNER_TEMP/apollyon-create-only-proof.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
