name: VOID P2P learned-peer public redial filter v1

on:
  pull_request:
    paths:
      - "src/types/p2p.ts"
      - "src/node_core.ts"
      - "scripts/prove_void_p2p_learned_peer_public_redial_filter_v1.ts"
      - "scripts/prove_void_p2p_multipath_address_v1.ts"
      - "docs/public/p2p-learned-peer-public-redial-filter-v1.md"
      - ".github/workflows/void-p2p-learned-peer-public-redial-filter-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove learned-peer public redial filter
        run: npx --no-install tsx scripts/prove_void_p2p_learned_peer_public_redial_filter_v1.ts
      - name: Preserve multipath discovery regression
        run: npx --no-install tsx scripts/prove_void_p2p_multipath_address_v1.ts
      - name: Preserve authenticated peer identity
        run: npx --no-install tsx scripts/prove_void_p2p_authenticated_peer_identity_v1.ts
      - name: Preserve verified-peer reconnect
        run: npx --no-install tsx scripts/prove_void_p2p_verified_peer_cache_reconnect_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
