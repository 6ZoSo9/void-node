name: VOID Buy user manager cap-last-cap projection v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "scripts/prove_void_buy_user_manager_cap_last_cap_projection_v6.mjs"
      - "docs/architecture/buy-void-user-manager-cap-last-cap-projection-v6.md"
      - ".github/workflows/buy-void-user-manager-cap-last-cap-projection-v6.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "scripts/prove_void_buy_user_manager_cap_last_cap_projection_v6.mjs"
      - "docs/architecture/buy-void-user-manager-cap-last-cap-projection-v6.md"
      - ".github/workflows/buy-void-user-manager-cap-last-cap-projection-v6.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact V6 projection contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_unit_query_v1.c)" = "fc1f640689b7da7278ff013669ef8a10cd8f6659"
          node scripts/prove_void_buy_user_manager_cap_last_cap_projection_v6.mjs |
            tee "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CAP_LAST_CAP_PROJECTION_V6_PROOF_GREEN' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'kernel_cap_last_cap_runtime_source_required=true' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'systemd_raw_bounding_set_projection_required=true' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'raw_64bit_equality_forbidden=true' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'control_group_service_interface_preserved=true' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'private_users_false_required=true' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/v6-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/v6-proof.log"
      - run: git diff --check
