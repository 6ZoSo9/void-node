name: VOID WC/VOID ledger custody coupled candidate promotion v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-ledger-custody-coupled-candidate-promotion-v1.yml"
      - "docs/operators/wc-void-ledger-custody-coupled-candidate-promotion-v1.md"
      - "scripts/prove_void_wc_void_ledger_custody_coupled_candidate_promotion_v1.mjs"
      - "tools/void-wc-void-ledger-custody-coupled-candidate-promotion-v1.mjs"
      - "tools/void-wc-void-ledger-persistence-import-v1.mjs"
      - "tools/void-wc-void-ledger-persistence-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-ledger-custody-coupled-candidate-promotion-v1.yml"
      - "docs/operators/wc-void-ledger-custody-coupled-candidate-promotion-v1.md"
      - "scripts/prove_void_wc_void_ledger_custody_coupled_candidate_promotion_v1.mjs"
      - "tools/void-wc-void-ledger-custody-coupled-candidate-promotion-v1.mjs"
      - "tools/void-wc-void-ledger-persistence-import-v1.mjs"
      - "tools/void-wc-void-ledger-persistence-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

concurrency:
  group: void-wc-void-ledger-custody-promotion-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check tools/void-wc-void-ledger-custody-coupled-candidate-promotion-v1.mjs
          node --check scripts/prove_void_wc_void_ledger_custody_coupled_candidate_promotion_v1.mjs

      - name: Existing persistence import regression
        run: node scripts/prove_void_wc_void_ledger_persistence_import_v1.mjs

      - name: Coupled candidate promotion proof
        run: node scripts/prove_void_wc_void_ledger_custody_coupled_candidate_promotion_v1.mjs

      - name: Diff hygiene
        run: git diff --check
