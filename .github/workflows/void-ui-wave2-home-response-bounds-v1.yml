name: VOID UI Wave 2 Home response bounds v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-ui-wave2-home-response-bounds-v1.yml"
      - "src/ui/void_app_wave2_home_readonly_v1.ts"
      - "src/ui/void_app_wave2_home_source_fetch_v1.ts"
      - "public/void-app-wave1-v1/assets/js/home-live.js"
      - "scripts/prove_void_ui_wave2_home_readonly_v1.ts"
      - "scripts/prove_void_ui_wave2_home_response_bounds_v1.ts"
      - "scripts/prove_void_ui_wave2_home_evidence_truth_v1.ts"
      - "scripts/prove_void_ui_wave2_home_teardown_settlement_v1.ts"
      - "docs/public/void-ui-wave2-home-readonly-v1/source-manifest.json"
      - "docs/public/void-ui-wave3-wallet-readonly-v1/source-manifest.json"
      - "docs/public/void-ui-wave4-earn-readonly-v1/source-manifest.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-ui-wave2-home-response-bounds-v1.yml"
      - "src/ui/void_app_wave2_home_readonly_v1.ts"
      - "src/ui/void_app_wave2_home_source_fetch_v1.ts"
      - "public/void-app-wave1-v1/assets/js/home-live.js"
      - "scripts/prove_void_ui_wave2_home_readonly_v1.ts"
      - "scripts/prove_void_ui_wave2_home_response_bounds_v1.ts"
      - "scripts/prove_void_ui_wave2_home_evidence_truth_v1.ts"
      - "scripts/prove_void_ui_wave2_home_teardown_settlement_v1.ts"
      - "docs/public/void-ui-wave2-home-readonly-v1/source-manifest.json"
      - "docs/public/void-ui-wave3-wallet-readonly-v1/source-manifest.json"
      - "docs/public/void-ui-wave4-earn-readonly-v1/source-manifest.json"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Prove bounded Home source responses
        run: npx tsx scripts/prove_void_ui_wave2_home_response_bounds_v1.ts
      - name: Prove Home teardown settlement
        run: npx tsx scripts/prove_void_ui_wave2_home_teardown_settlement_v1.ts
      - name: Prove Home evidence truth
        run: npx tsx scripts/prove_void_ui_wave2_home_evidence_truth_v1.ts
      - name: Prove Home UI readiness truth
        run: npx tsx scripts/prove_void_ui_wave2_home_readonly_v1.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diff hygiene
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          BASE="$PR_BASE"
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+; then
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+; then
            BASE="$(git rev-parse "$HEAD^1")"
          fi
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
