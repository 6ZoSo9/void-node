name: public-node-operator-trial-lane-dashboard-link

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-lane-dashboard-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial lane dashboard link
        run: bash tools/check_public_node_operator_trial_lane_dashboard_link_v1.sh
