name: VOID V7 V5 stage role separation contract v2

on:
  pull_request:
    paths:
      - 'ops/security/void_v7_v5_stage_role_separation_contract_v2.json'
      - 'scripts/prove_void_v7_v5_stage_role_separation_contract_v2.py'
      - 'docs/security/void-v7-v5-stage-role-separation-contract-v2.md'
      - '.github/workflows/void-v7-stage-role-separation-contract-v2.yml'

permissions:
  contents: read

jobs:
  role-separation-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind exact current 3715 generation and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$BASE" = "ea2193709dab86ea3eb3c2235d08e8a6858a23c6"
          git merge-base --is-ancestor "$BASE" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_source_stage_install_v1.py)" = "d88a9548ea34b8209ed7dcd53732fd25dd1371bf"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_v7_v5_receipt_stage_install_v1.py)" = "b462696826b4f90fdf5f4938cd5467e5711addab"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v5_source_stage_install_v1.py)" = "5b8e98eec6712efd4846a564f689161fb054338f"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_v7_v5_receipt_stage_install_v1.py)" = "7d968740c9e0c787c57bd493e5c51f5ed385eed1"
          test "$(git rev-parse HEAD:docs/operators/buy-void-v7-v5-source-receipt-stage-install-v1.md)" = "02fa010cd66a50c5e2858b6cced9a7e08ee295af"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-v7-v5-source-receipt-stage-install-v1.yml)" = "af1a9afad2a39b96ee4022ba1b36ebf7534c818b"
          test "$(git rev-parse HEAD:ops/security/void_v7_v5_stage_role_separation_contract_v2.json)" = "4801caaca496baeb85c7842b5b8b4b47122582ab"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_v5_stage_role_separation_contract_v2.py)" = "d640a6b6ad67562f57489807d0bf86eff80bad1d"
          test "$(git rev-parse HEAD:docs/security/void-v7-v5-stage-role-separation-contract-v2.md)" = "92b5a125c210d7cecd2262b8852e11a0bdd71d9c"
          cat > /tmp/v7-role-v2-expected <<'SCOPE'
          A	.github/workflows/void-v7-stage-role-separation-contract-v2.yml
          A	docs/security/void-v7-v5-stage-role-separation-contract-v2.md
          A	ops/security/void_v7_v5_stage_role_separation_contract_v2.json
          A	scripts/prove_void_v7_v5_stage_role_separation_contract_v2.py
          SCOPE
          git diff --name-status "$BASE" "$EXPECTED_HEAD" -- | sort > /tmp/v7-role-v2-actual
          sort /tmp/v7-role-v2-expected > /tmp/v7-role-v2-expected.sorted
          diff -u /tmp/v7-role-v2-expected.sorted /tmp/v7-role-v2-actual
          git diff --check "$BASE" "$EXPECTED_HEAD" --

      - name: Prove current-generation role contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          out="$(mktemp)"
          python3 -I -B scripts/prove_void_v7_v5_stage_role_separation_contract_v2.py | tee "$out"
          grep -Fx 'VOID_V7_V5_STAGE_ROLE_SEPARATION_CONTRACT_V2_PROOF_GREEN' "$out"
          grep -Fx 'descriptor_bound_nonblocking_exact_reads=true' "$out"
          grep -Fx 'all_pinned_worktree_inputs_descriptor_bound=true' "$out"
          grep -Fx 'fifo_symlink_read_regressions=GREEN' "$out"
          grep -Fx 'root_execution=false' "$out"
          grep -Fx 'account_or_acl_mutation=false' "$out"
          grep -Fx 'protected_stage_apply=false' "$out"
          grep -Fx 'presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"
