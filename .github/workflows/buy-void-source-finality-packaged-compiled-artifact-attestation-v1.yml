name: VOID Buy VOID packaged compiled artifact attestation v1

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v1.mjs"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v1.json"
      - "scripts/prove_buy_void_source_finality_packaged_compiled_artifact_attestation_v1.mjs"
      - "docs/architecture/buy-void-source-finality-packaged-compiled-artifact-attestation-v1.md"
      - "docs/architecture/buy-void-source-finality-packaged-compiled-artifact-attestation-v1-review-checklist.md"
      - ".github/workflows/buy-void-source-finality-packaged-compiled-artifact-attestation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-compiled-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build exact repository artifacts
        run: npm run build

      - name: Preserve locked compiled artifact generation
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v1.mjs

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  prove-production-image-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Guard against container execution in this proof
        run: |
          set -euo pipefail
          ! grep -E '(^|[[:space:]])docker[[:space:]]+(run|start|exec)([[:space:]]|$)' \
            .github/workflows/buy-void-source-finality-packaged-compiled-artifact-attestation-v1.yml

      - name: Build normal production Docker image
        run: |
          set -euo pipefail
          docker build --tag "void-node-packaged-attestation:${GITHUB_SHA}" .

      - name: Extract compiled artifacts from stopped container and verify
        run: |
          set -euo pipefail
          IMAGE="void-node-packaged-attestation:${GITHUB_SHA}"
          CID="$(docker create "$IMAGE")"
          cleanup() {
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = "created"
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = "false"

          mkdir -p packaged-root/dist
          docker cp "$CID:/app/dist/economic" packaged-root/dist/economic

          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = "created"
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = "false"

          node scripts/prove_buy_void_source_finality_packaged_compiled_artifact_attestation_v1.mjs \
            --packaged-root "$PWD/packaged-root" \
            | tee buy-void-source-finality-packaged-compiled-artifact-attestation.log

      - name: Upload packaged artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-source-finality-packaged-compiled-artifact-attestation-${{ github.event.pull_request.head.sha || github.sha }}
          path: buy-void-source-finality-packaged-compiled-artifact-attestation.log
          if-no-files-found: error
          retention-days: 1

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
