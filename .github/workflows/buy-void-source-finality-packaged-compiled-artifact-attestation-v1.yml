name: VOID Buy VOID historical package preservation and stopped-image successor

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4.mjs"
      - "scripts/prove_buy_void_historical_compiled_v4_preservation_v1.mjs"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json"
      - "scripts/prove_buy_void_composed_stopped_saga_package_v1.mjs"
      - "scripts/prove_buy_void_composed_stopped_saga_package_v2.mjs"
      - "scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v1.mjs"
      - "scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v2.mjs"
      - "docs/architecture/buy-void-composed-stopped-saga-package-v2.md"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4-candidate.md"
      - ".github/workflows/buy-void-source-finality-packaged-compiled-artifact-attestation-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compiled-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout and historical compiled V3/V4
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json)" =             "d6e97784c5d8be93713e733628c7d1ef746bb5c7"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json)" =             "a07f2e9b03958a58280c4d940fe49097a9413af5"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Preserve historical compiled V4 without current-source execution
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_historical_compiled_v4_preservation_v1.mjs             | tee "packaged-historical-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v4_locked_acceptance=true'             "packaged-historical-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v4_rederived_against_current_source=false'             "packaged-historical-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v4_deployed_artifact_generation_verified=false'             "packaged-historical-v4-${{ matrix.node }}.txt"
          grep -Fx 'funds_moved=false'             "packaged-historical-v4-${{ matrix.node }}.txt"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi

  stopped-image-successor:
    needs: [compiled-successor]
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reprove source-only package and inert loader boundaries
        run: |
          set -euo pipefail
          npm run build
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          historical_package="f28c3e9446c7623ef203da36a9642d046e5f34ee"
          historical_lock="b2671f0149f522b2489247016df0a5ec4bb72b8b"
          audited_package="14fbdf5717b07fd4c734f5da7a8e84ed59bee93f"
          audited_lock="15b5c82ea36f13079a2f9e8863722f654eb3f201"
          if [[ "$package_blob" == "$historical_package" && "$lock_blob" == "$historical_lock" ]]; then
            package_proof="scripts/prove_buy_void_composed_stopped_saga_package_v1.mjs"
            loader_proof="scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v1.mjs"
            generation="historical_v1"
          elif [[ "$package_blob" == "$audited_package" && "$lock_blob" == "$audited_lock" ]]; then
            package_proof="scripts/prove_buy_void_composed_stopped_saga_package_v2.mjs"
            loader_proof="scripts/prove_buy_void_compiled_saga_loader_inert_resolution_v2.mjs"
            generation="audited_v2"
          else
            echo "unsupported stopped-package dependency generation: package=$package_blob lock=$lock_blob" >&2
            exit 1
          fi
          node --check "$package_proof"
          node --check "$loader_proof"
          node "$package_proof" --self-test
          node "$loader_proof" --self-test
          node "$loader_proof" --derive > "$RUNNER_TEMP/inert-loader.json"
          node --input-type=module - <<'NODE' "$RUNNER_TEMP/inert-loader.json" "$generation"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const generation=process.argv[3];
          assert.ok([
            "void_buy_void_compiled_saga_loader_inert_resolution_v1",
            "void_buy_void_compiled_saga_loader_inert_resolution_v2",
          ].includes(j.schema));
          if(generation==="audited_v2"){
            assert.equal(j.schema,"void_buy_void_compiled_saga_loader_inert_resolution_v2");
            assert.equal(j.frozen_v1_refuses_audited_dependency_generation,true);
            assert.equal(j.dependency_package_git_blob_sha1,"14fbdf5717b07fd4c734f5da7a8e84ed59bee93f");
            assert.equal(j.dependency_lock_git_blob_sha1,"15b5c82ea36f13079a2f9e8863722f654eb3f201");
          }else{
            assert.equal(j.schema,"void_buy_void_compiled_saga_loader_inert_resolution_v1");
          }
          assert.equal(j.exact_compiled_factory_executed_with_inert_tool,true);
          assert.equal(j.real_saga_module_imported,false);
          assert.equal(j.real_saga_module_executed,false);
          assert.equal(j.real_saga_exports_invoked,false);
          assert.equal(j.stopped_image_runtime_loader_qualified,false);
          assert.equal(j.packaged_image_generation_accepted,false);
          assert.equal(j.deployed_artifact_generation_verified,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          assert.equal(j.accepted_enforcement_v5,false);
          assert.equal(j.presale_activation,false);
          assert.equal(j.funds_moved,false);
          console.log("INERT_COMPILED_LOADER_NO_PACKAGE_AUTHORITY_GREEN=true");
          NODE

      - name: Build and inspect stopped image only
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          docker build --iidfile "$RUNNER_TEMP/package-successor-image-id" .
          IMAGE_ID="$(cat "$RUNNER_TEMP/package-successor-image-id")"
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          CID="$(docker create "$IMAGE_ID")"
          cleanup() { docker rm "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = "created"
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = "false"
          test "$(docker inspect --format '{{json .Mounts}}' "$CID")" = "[]"
          ROOT="$RUNNER_TEMP/stopped-root"
          mkdir -p "$ROOT/dist/economic"
          docker cp "$CID:/app/dist/economic/buy_void_erc20_execution_composition_v1.js"             "$ROOT/dist/economic/"
          docker cp "$CID:/app/tools" "$ROOT/tools"
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          if [[ "$package_blob" == "f28c3e9446c7623ef203da36a9642d046e5f34ee" && "$lock_blob" == "b2671f0149f522b2489247016df0a5ec4bb72b8b" ]]; then
            package_proof="scripts/prove_buy_void_composed_stopped_saga_package_v1.mjs"
          elif [[ "$package_blob" == "14fbdf5717b07fd4c734f5da7a8e84ed59bee93f" && "$lock_blob" == "15b5c82ea36f13079a2f9e8863722f654eb3f201" ]]; then
            package_proof="scripts/prove_buy_void_composed_stopped_saga_package_v2.mjs"
          else
            echo "unsupported stopped-image dependency generation: package=$package_blob lock=$lock_blob" >&2
            exit 1
          fi
          node "$package_proof" --stopped-root "$ROOT" > "$RUNNER_TEMP/stopped-package.json"
          node --input-type=module - <<'NODE' "$RUNNER_TEMP/stopped-package.json"
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.stopped_image_saga_byte_identity_verified,true);
          assert.equal(j.unreviewed_broadcaster_and_custodian_absent,true);
          assert.equal(j.real_saga_module_imported,false);
          assert.equal(j.real_saga_module_executed,false);
          assert.equal(j.executed_saga_loader_qualified,false);
          assert.equal(j.image_generation_accepted,false);
          assert.equal(j.deployed_artifact_generation_verified,false);
          assert.equal(j.runtime_mount_authority,false);
          assert.equal(j.production_source_finality_authority_ready,false);
          assert.equal(j.presale_activation,false);
          assert.equal(j.funds_movement,false);
          console.log("STOPPED_IMAGE_SUCCESSOR_NO_DEPLOYMENT_AUTHORITY_GREEN=true");
          NODE
          test "$(docker inspect --format '{{.State.Status}}' "$CID")" = "created"
          test "$(docker inspect --format '{{.State.Running}}' "$CID")" = "false"
