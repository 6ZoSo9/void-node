name: Buy VOID Epoch-2 dormant first-entry bootstrap V4 candidate lock v1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
  push:
    branches:
      - main
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact lock generation
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-lock-v1.json)" = "471a52641135ee3ce31d521980e6ea37af18ce58"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_lock_v1.py)" = "972202f9a87f6fd931394a427f02fe894b73ddbf"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_v1.py)" = a14a7f56b1fb4ee14213fe9094adad14b45aae2f
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.yml)" = 2ef4201d71b8080144350c6f8442fea9c43c5b90
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-bootstrap-v4-candidate-v1.md)" = 6990cffe5e68558856d044f42755d097604d8d02
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c)" = c7d2125b59dcbecc1d6aae8818e84cac8ce85da9
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py)" = 242eac04da6e17d32e9a9baa9b57f572cabda7a8
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf)" = a484a7d2e1159ebbef3357ec849af92d7f12cff1
      - name: Prove lock
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lock-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_bootstrap_v4_candidate_lock_v1.py | tee "$out"
          for marker in             'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_BOOTSTRAP_V4_CANDIDATE_LOCK_V1_PROOF_GREEN'             'lock_id=voidbuye2dormantbootstraplock1_ffd5e877b4bf594b7af4eac3f03fd7b846686949febcae54318ef08ee5793796'             'hosted_three_way_candidate_identity_bound=true'             'independent_rederivation_bound=true'             'candidate_report_content_address_bound=true'             'source_generation_identity_accepted=true'             'candidate_accepted=true'             'native_binary_identity_accepted=true'             'protected_install_authorized=false'             'live_execution_authorized=false'             'credential_access_authorized=false'             'signing_authorized=false'             'transaction_authorized=false'             'rpc_call_authorized=false'             'funds_movement_authorized=false'             'next_gate=void_buy_void_epoch2_dormant_first_entry_bootstrap_v4_materializer_v1'
          do
            grep -Fx "$marker" "$out"
          done
          git diff --check
