name: VOID Devnet Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - public-sync-*

jobs:
  devnet-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry (forge/cast/anvil)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup

      - name: Start Anvil (chainId 2050)
        run: |
          ~/.foundry/bin/anvil --chain-id 2050 --block-time 2 --silent &
          echo "ANVIL_PID=$!" >> "$GITHUB_ENV"

          # wait for RPC to come up
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8545 >/dev/null 2>&1; then
              echo "[ci] anvil up on 8545"
              exit 0
            fi
            sleep 1
          done

          echo "[ci][ERR] anvil did not start in time" >&2
          exit 1

      - name: Run VOID devnet bootstrap stack (tests+deploy+protocol+system)
        env:
          RPC_URL: http://127.0.0.1:8545
          # Anvil default dev key – devnet only, never mainnet
          DEVNET_PRIVKEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        run: |
          chmod +x ops/void-devnet-*.sh || true
          ./ops/void-devnet-bootstrap-stack.sh

      - name: Stop Anvil
        if: always()
        run: |
          if [ -n "${ANVIL_PID:-}" ]; then
            echo "[ci] stopping anvil pid $ANVIL_PID"
            kill "$ANVIL_PID" || true
          fi
