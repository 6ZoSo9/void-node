name: agent-paid-work-credential-wc-account-binding-retirement-v1

on:
  pull_request:
    paths:
      - "scripts/agent_paid_work_credential_wc_account_binding_retirement_v1.mjs"
      - "scripts/prove_agent_paid_work_credential_wc_account_binding_retirement_v1.mjs"
      - "schemas/agent-paid-work-credential-wc-account-binding-retirement-v1.schema.json"
      - "examples/agent-paid-work-credential-wc-account-binding-retirement-v1.example.json"
      - "docs/operators/agent-paid-work-credential-wc-account-binding-retirement-v1.md"
      - ".github/workflows/agent-paid-work-credential-wc-account-binding-retirement-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse JSON artifacts
        run: |
          python3 -m json.tool schemas/agent-paid-work-credential-wc-account-binding-retirement-v1.schema.json >/dev/null
          python3 -m json.tool examples/agent-paid-work-credential-wc-account-binding-retirement-v1.example.json >/dev/null
      - name: Check source syntax
        run: |
          node --check scripts/agent_paid_work_credential_wc_account_binding_retirement_v1.mjs
          node --check scripts/prove_agent_paid_work_credential_wc_account_binding_retirement_v1.mjs
      - name: Prove retirement contract
        run: node scripts/prove_agent_paid_work_credential_wc_account_binding_retirement_v1.mjs
