name: VOID Buy credential query protected install v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-install-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-install-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v2.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v2.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-install-v2.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-install-v2.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v2.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact V2 installer generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py)" =             "fa1ba5862e6f7f7894acea5704237459b94292fe"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v2.py)" =             "37d6ef61047f9801015948fac84ee83986f57f30"
          test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json)" =             "b73415ce8fc95ff2d49cbde97a15d701ad5b7937"
          test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-credential-query-elf-candidate-v2.json)" =             "e193d74abbd7c55a792c6a82280a6a0382a8a719"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py",
              "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v2.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_INSTALL_V2_SYNTAX_GREEN")
          PY

      - name: Prove exact V2 create-only installer
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-install-v2-proof.log"
          python3 -I -B             scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v2.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_INSTALL_V2_PROOF_GREEN"
            "accepted_credential_lock_v2_bound=true"
            "v1_predecessor_lock_bound=true"
            "exact_candidate_pair_bound=true"
            "v1_present_root_not_adopted_as_v2=true"
            "query_v2_bytes_bound=true"
            "create_only=true"
            "atomic_root_publication_required=true"
            "rename_noreplace_required=true"
            "explicit_apply_confirmation_required=true"
            "truthful_post_publication_failure_receipt=true"
            "credential_contents_read=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove inert V2 source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-install-v2-plan.log"
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py             --source-plan | tee "$out"
          grep -Fx 'source_only=true' "$out"
          grep -Fx 'host_read=false' "$out"
          grep -Fx 'host_write=false' "$out"
          grep -Fx 'credential_query_generation=v2' "$out"
          grep -Fx 'v1_predecessor_lock_id=voidbuyumqcredelflock1_65a1839c14b692349dda8cccdbe8657a9485754c5d10ffa5b57421ce87e3753c' "$out"
          grep -Fx 'create_only=true' "$out"
          grep -Fx 'query_execution=false' "$out"
          grep -Fx 'credential_contents_read=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Require explicit V2 apply confirmation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-install-v2-no-confirm.log"
          if python3 -I -B                ops/precision/void_buy_void_user_manager_credential_query_protected_install_v2.py                --apply                --preexec /nonexistent/preexec                --query /nonexistent/query                >"$out" 2>&1; then
            echo "credential V2 install unexpectedly admitted without confirmation" >&2
            exit 1
          fi
          grep -Fx 'reason=explicit_create_only_confirmation_required' "$out"
          grep -Fx 'protected_install_performed=false' "$out"

      - run: git diff --check
