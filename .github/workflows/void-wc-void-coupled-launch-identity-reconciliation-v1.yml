name: VOID WC/VOID coupled launch identity reconciliation v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-coupled-launch-identity-reconciliation-v1.yml"
      - "docs/operators/wc-void-coupled-launch-identity-reconciliation-v1.md"
      - "scripts/prove_void_wc_void_coupled_launch_identity_reconciliation_v1.mjs"
      - "tools/void-wc-void-coupled-launch-identity-reconciliation-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-coupled-launch-identity-reconciliation-v1.yml"
      - "docs/operators/wc-void-coupled-launch-identity-reconciliation-v1.md"
      - "scripts/prove_void_wc_void_coupled_launch_identity_reconciliation_v1.mjs"
      - "tools/void-wc-void-coupled-launch-identity-reconciliation-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-wc-void-coupled-launch-identity-reconciliation-v1.mjs
          node --check scripts/prove_void_wc_void_coupled_launch_identity_reconciliation_v1.mjs
      - name: Prove coupled launch identity reconciliation
        run: node scripts/prove_void_wc_void_coupled_launch_identity_reconciliation_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
