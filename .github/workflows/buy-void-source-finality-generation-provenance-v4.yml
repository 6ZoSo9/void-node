name: VOID Buy VOID reviewed source files v4

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_generation_provenance_v4.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v4.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v4_deadline.ts"
      - "src/economic/buy_void_source_finality_authenticated_composition_v3.ts"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "Dockerfile"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v4.md"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v4-review-checklist.md"
      - ".github/workflows/buy-void-source-finality-generation-provenance-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_source_finality_generation_provenance_v4.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v4.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v4_deadline.ts

      - name: Prove reviewed source-file binding V4
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v4.ts

      - name: Prove V4 preflight shares the total deadline
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v4_deadline.ts

      - name: Preserve V3 authenticated composition
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3.ts

      - name: Preserve V3 truncated-response fail-closed behavior
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3_truncated_response.ts

      - name: Preserve V2 stable-policy authority
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authority_v2.ts

      - name: Preserve finalized-source RPC adapter
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts

      - name: Repository build
        run: npm run build

      - name: Prove compiled V4 source-file resolution
        run: |
          node --input-type=module -e 'const v4 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v4.js"); const result = v4.verifyBuyVoidSourceFinalityRuntimeSourceFilesV4(); if (result.ok !== true || result.reviewed_source_files_verified !== true || result.verified_source_file_count !== "5") { console.error(JSON.stringify(result)); process.exit(1); } console.log("VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_V4_COMPILED_SOURCE_RESOLUTION_GREEN");'

      - name: Build production runtime image
        if: matrix.node == 24
        run: docker build -t void-v4-reviewed-source-runtime-proof .

      - name: Prove packaged runtime contains reviewed source set
        if: matrix.node == 24
        run: |
          docker run --rm --entrypoint node void-v4-reviewed-source-runtime-proof \
            --input-type=module \
            -e 'const v4 = await import("./dist/economic/buy_void_source_finality_generation_provenance_v4.js"); const result = v4.verifyBuyVoidSourceFinalityRuntimeSourceFilesV4(); if (result.ok !== true || result.reviewed_source_files_verified !== true || result.verified_source_file_count !== "5") { console.error(JSON.stringify(result)); process.exit(1); } console.log("VOID_BUY_VOID_SOURCE_FINALITY_GENERATION_PROVENANCE_V4_PACKAGED_RUNTIME_SOURCE_RESOLUTION_GREEN");'

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
