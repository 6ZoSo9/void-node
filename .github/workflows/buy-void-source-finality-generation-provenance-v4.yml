name: VOID Buy VOID historical reviewed source files v4

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_generation_provenance_v4.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v4_historical.ts"
      - ".github/workflows/buy-void-source-finality-generation-provenance-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove V4 historical commit/blob lineage
        run: npx tsx scripts/prove_buy_void_source_finality_generation_provenance_v4_historical.ts
      - name: Diff hygiene
        run: git diff --check
