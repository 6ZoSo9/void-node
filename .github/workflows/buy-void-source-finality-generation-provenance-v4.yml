name: VOID Buy VOID source-finality generation provenance v4

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_generation_provenance_v4.ts"
      - "scripts/prove_buy_void_source_finality_generation_provenance_v4.ts"
      - "docs/architecture/buy-void-source-finality-generation-provenance-v4.md"
      - ".github/workflows/buy-void-source-finality-generation-provenance-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_source_finality_generation_provenance_v4.ts \
            scripts/prove_buy_void_source_finality_generation_provenance_v4.ts

      - name: Prove source-generation provenance V4
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v4.ts

      - name: Preserve V3 authenticated composition
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3.ts

      - name: Preserve V2 stable-policy authority
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authority_v2.ts

      - name: Preserve finalized-source RPC adapter
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_chain_finality_rpc_adapter_v1.ts

      - name: Repository build
        run: npm run build

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
