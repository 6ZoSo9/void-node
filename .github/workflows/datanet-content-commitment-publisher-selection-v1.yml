name: VOID DataNet publisher selection v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-content-commitment-publisher-selection-v1.yml"
      - "ops/mainnet0/datanet-content-commitment-publisher-selection-v1.json"
      - "ops/mainnet0/economic-epoch2-datanet-registry-deployment-prerequisites-v1.json"
      - "schemas/datanet-content-commitment-publisher-selection-v1.schema.json"
      - "scripts/prove_datanet_content_commitment_publisher_selection_v1.mjs"
      - "scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs"
      - "docs/operators/datanet-content-commitment-publisher-selection-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-content-commitment-publisher-selection-v1.yml"
      - "ops/mainnet0/datanet-content-commitment-publisher-selection-v1.json"
      - "ops/mainnet0/economic-epoch2-datanet-registry-deployment-prerequisites-v1.json"
      - "schemas/datanet-content-commitment-publisher-selection-v1.schema.json"
      - "scripts/prove_datanet_content_commitment_publisher_selection_v1.mjs"
      - "scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs"
      - "docs/operators/datanet-content-commitment-publisher-selection-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/prove_datanet_content_commitment_publisher_selection_v1.mjs
      - run: node --check scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs
      - run: node scripts/prove_datanet_content_commitment_publisher_selection_v1.mjs
      - run: node scripts/prove_void_economic_epoch2_datanet_registry_deployment_prerequisites_v1.mjs
      - run: git diff --check
