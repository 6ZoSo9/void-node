name: VOID Buy VOID source-finality live-process binding v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs"
      - "docs/architecture/buy-void-source-finality-live-process-binding-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-binding-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs"
      - ".github/workflows/buy-void-source-finality-live-process-binding-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and compile exact source generation
        run: |
          set -euo pipefail
          npm run typecheck
          node ./node_modules/typescript/bin/tsc -p tsconfig.build.json
          node --check dist/economic/buy_void_source_finality_live_process_binding_v1.js
          node --check scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs

      - name: Prove same-live-process contract
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/live-process-binding-${{ matrix.node }}.txt"
          node scripts/prove_buy_void_source_finality_live_process_binding_v1.mjs | tee "$receipt"
          grep -Fx 'VOID_BUY_VOID_SOURCE_FINALITY_LIVE_PROCESS_BINDING_V1_PROOF_GREEN' "$receipt"
          grep -Fx 'deployment_receipt_binding=true' "$receipt"
          grep -Fx 'self_pid_start_time_binding=true' "$receipt"
          grep -Fx 'systemd_invocation_binding=true' "$receipt"
          grep -Fx 'service_cgroup_binding=true' "$receipt"
          grep -Fx 'initial_proc_environment_binding=true' "$receipt"
          grep -Fx 'mutable_process_env_trusted=false' "$receipt"
          grep -Fx 'restart_or_pid_reuse_holds=true' "$receipt"
          grep -Fx 'production_source_finality_authority_ready=false' "$receipt"
          grep -Fx 'public_presale_activation=false' "$receipt"
          grep -Fx 'funds_movement=false' "$receipt"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-finality-live-process-binding-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/live-process-binding-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Download proof receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: source-finality-live-process-binding-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require exact Node-major proof identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/live-process-binding-$node.txt"
          done
          cmp receipts/live-process-binding-22.txt receipts/live-process-binding-24.txt
          cmp receipts/live-process-binding-22.txt receipts/live-process-binding-26.txt
          echo VOID_BUY_VOID_SOURCE_FINALITY_LIVE_PROCESS_BINDING_CROSS_NODE_GREEN
          cat receipts/live-process-binding-22.txt
