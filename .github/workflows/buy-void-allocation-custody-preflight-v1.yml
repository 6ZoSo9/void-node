name: VOID Buy VOID allocation custody preflight v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-allocation-custody-preflight-v1.yml"
      - "tools/void-buy-void-allocation-custody-preflight-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_preflight_v1.mjs"
      - "docs/operators/buy-void-allocation-custody-preflight-v1.md"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "docs/architecture/buy-void-allocation-reservation-publication-writer-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-allocation-custody-preflight-v1.yml"
      - "tools/void-buy-void-allocation-custody-preflight-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_preflight_v1.mjs"
      - "docs/operators/buy-void-allocation-custody-preflight-v1.md"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "docs/architecture/buy-void-allocation-reservation-publication-writer-v1.md"

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-custody-preflight-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: allocation custody preflight / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove read-only custody preflight
        run: node scripts/prove_buy_void_allocation_custody_preflight_v1.mjs

      - name: Load designated-host CLI without observation
        run: node tools/void-buy-void-allocation-custody-preflight-v1.mjs --help

      - name: Diff hygiene
        run: git diff --check

      - name: Verify source tree cleanliness
        run: test -z "$(git status --porcelain=v1)"
