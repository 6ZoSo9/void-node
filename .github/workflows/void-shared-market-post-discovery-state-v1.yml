name: VOID shared market post-discovery state v1

on:
  pull_request:
    paths:
      - "tools/void-shared-market-post-discovery-state-v1.mjs"
      - "scripts/prove_void_shared_market_post_discovery_state_v1.mjs"
      - "docs/architecture/void-shared-market-post-discovery-state-v1.md"
      - ".github/workflows/void-shared-market-post-discovery-state-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-shared-market-post-discovery-state-v1.mjs"
      - "scripts/prove_void_shared_market_post_discovery_state_v1.mjs"
      - "docs/architecture/void-shared-market-post-discovery-state-v1.md"
      - ".github/workflows/void-shared-market-post-discovery-state-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check tools/void-shared-market-post-discovery-state-v1.mjs
      - run: node --check scripts/prove_void_shared_market_post_discovery_state_v1.mjs
      - run: node scripts/prove_void_shared_market_post_discovery_state_v1.mjs
