name: Apollyon claim no-clone lock v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_claim_no_clone_lock_v1.c"
      - "ops/xiphos/apollyon_claim_no_clone_lock_v1.h"
      - "scripts/apollyon_claim_no_clone_lock_v1_selftest.c"
      - "scripts/prove_apollyon_claim_no_clone_lock_v1.py"
      - "docs/security/apollyon-claim-no-clone-lock-v1.md"
      - ".github/workflows/apollyon-claim-no-clone-lock-v1.yml"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.c"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.h"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.c"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.h"
      - "scripts/apollyon_claim_task_singleton_guard_v1_selftest.c"
      - "scripts/prove_apollyon_claim_task_singleton_guard_v1.py"
      - ".github/workflows/apollyon-claim-task-singleton-guard-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_claim_no_clone_lock_v1.c"
      - "ops/xiphos/apollyon_claim_no_clone_lock_v1.h"
      - "scripts/apollyon_claim_no_clone_lock_v1_selftest.c"
      - "scripts/prove_apollyon_claim_no_clone_lock_v1.py"
      - "docs/security/apollyon-claim-no-clone-lock-v1.md"
      - ".github/workflows/apollyon-claim-no-clone-lock-v1.yml"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.c"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.h"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.c"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.h"
      - "scripts/apollyon_claim_task_singleton_guard_v1_selftest.c"
      - "scripts/prove_apollyon_claim_task_singleton_guard_v1.py"
      - ".github/workflows/apollyon-claim-task-singleton-guard-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Event / generation scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              BASE="$PR_BASE"
              git merge-base --is-ancestor "$BASE" "$HEAD"
              actual="$RUNNER_TEMP/claim-no-clone-actual.txt"
              expected="$RUNNER_TEMP/claim-no-clone-expected.txt"
              git diff --name-status "$BASE" "$HEAD" | LC_ALL=C sort > "$actual"
              printf '%s\n' \
                $'A\tops/xiphos/apollyon_claim_no_clone_lock_v1.c' \
                $'A\tops/xiphos/apollyon_claim_no_clone_lock_v1.h' \
                $'A\tscripts/apollyon_claim_no_clone_lock_v1_selftest.c' \
                $'A\tscripts/prove_apollyon_claim_no_clone_lock_v1.py' \
                $'A\tdocs/security/apollyon-claim-no-clone-lock-v1.md' \
                $'A\t.github/workflows/apollyon-claim-no-clone-lock-v1.yml' | LC_ALL=C sort > "$expected"
              cmp "$expected" "$actual"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"
              BASE="$PUSH_BEFORE"
              git merge-base --is-ancestor "$BASE" "$HEAD"
              ;;
            workflow_dispatch)
              BASE="$(git rev-parse HEAD^)"
              ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1;;
          esac
          git diff --check "$BASE" "$HEAD"
      - name: Prove x86_64 no-clone lock
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          command -v gcc
          python3 -I -B scripts/prove_apollyon_claim_no_clone_lock_v1.py |
            tee "$RUNNER_TEMP/apollyon-no-clone-proof.txt"
          markers=(
            "VOID_APOLLYON_CLAIM_NO_CLONE_LOCK_V1_PROOF_GREEN"
            "exact_parent_3309_and_3441_blobs_pinned=true"
            "three_builds_reproducible=true"
            "x86_64_tsync_filter_actual_kernel_test=true"
            "preexisting_second_thread_rejected=true"
            "multithread_rejection_does_not_install_filter=true"
            "clone_clone3_fork_vfork_x32_denied=true"
            "pthread_create_denied=true"
            "continuous_clone_fork_syscall_denial_in_self_process=true"
            "protected_caller_origin_proven=false"
            "host_installation_performed=false"
            "durable_attempt_claim_performed=false"
            "training_execution_performed=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$RUNNER_TEMP/apollyon-no-clone-proof.txt"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
