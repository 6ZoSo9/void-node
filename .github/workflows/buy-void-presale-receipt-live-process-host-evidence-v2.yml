name: Buy VOID presale receipt live-process host evidence v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-receipt-live-process-host-evidence-v2.yml"
      - "docs/operators/buy-void-presale-receipt-live-process-host-evidence-v2.md"
      - "ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v2.ts"
      - "scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v2.ts"
      - "ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_source_finality_authenticated_composition_v3.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-presale-receipt-live-process-host-evidence-v2.yml"
      - "docs/operators/buy-void-presale-receipt-live-process-host-evidence-v2.md"
      - "ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v2.ts"
      - "scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v2.ts"
      - "ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_source_finality_authenticated_composition_v3.ts"
      - "src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts"
      - "src/economic/buy_void_verified_payment_v2.ts"
      - "src/economic/buy_void_payment_rpc_observer_v1.ts"
      - "src/economic/buy_void_source_finality_authority_v2.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bind exact lane-1 V2 repair generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PARENT: bd761f3725d2ad9ccda66819308a62cb45b39fca
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test "$PR_BASE" = "$EXPECTED_PARENT"
              base="$PR_BASE"
              ;;
            workflow_dispatch)
              base="$EXPECTED_PARENT"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-presale-receipt-live-process-host-evidence-v2.yml' \
            'docs/operators/buy-void-presale-receipt-live-process-host-evidence-v2.md' \
            'ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v2.ts' \
            'scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v2.ts' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v2.ts)" = c7cd9f3738461f4fe3bb1c45e6d54943b8c4d281
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v2.ts)" = 3d4f8d154fa8fa9a9e4af7df40498068ab4972af
          test "$(git rev-parse HEAD:docs/operators/buy-void-presale-receipt-live-process-host-evidence-v2.md)" = a52ff728103f861f9c923ea1af62ccc78dae9239

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v1.ts)" = ba69d46ffa6f7d178de447b469b578fa8e87ea3b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts)" = d47a6f99870f385c1bc938adbef74535b78eba1f
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts)" = a334ab29477dec3e36862a512191b9701debb73e
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_generation_provenance_v7.ts)" = 390ff1a2ff0437cd8c8693e7807c12275df42573
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_live_process_binding_v2.ts)" = 987c97568a4d1b9814218603df48a65dbfeed18f
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_live_process_binding_v1.ts)" = 73f088779f015a554f16e9eecf8a9fd9de0e1594
          test "$(git rev-parse HEAD:src/economic/buy_void_auto_fulfillment_v1.ts)" = b7c963b1d55f000d82ad82289b31107b432503de
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_authenticated_composition_v3.ts)" = a3dbe4d0fed3034d3ca2c0b3704a758d7c776090
          test "$(git rev-parse HEAD:src/economic/buy_void_source_chain_finality_rpc_adapter_v1.ts)" = 419054e00f4d96015cd066be81e8719ee71ac00c
          test "$(git rev-parse HEAD:src/economic/buy_void_verified_payment_v2.ts)" = 550ede02fc0b7d6874c324af58b5ef9c5591b311
          test "$(git rev-parse HEAD:src/economic/buy_void_payment_rpc_observer_v1.ts)" = 0073818ad6f6418e895bf794024c9d678b3bef86
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_authority_v2.ts)" = 64953050d74bc0bc6d1e6948ae992d6143edca99
          test "$(git rev-parse HEAD:src/economic/buy_void_source_finality_provider_pair_binding_v1.ts)" = 5d47cd29929f778b07a59647a80c4384b1497a08
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v1.ts)" = 350354779caac35d7442b1315826b8b0c27463e2

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove runtime-user systemd identity repair
        run: |
          set -euo pipefail
          npm run typecheck

          proof="$RUNNER_TEMP/receipt-live-process-host-evidence-v2-proof.log"
          npx tsx scripts/prove_buy_void_presale_receipt_live_process_host_evidence_v2.ts |
            tee "$proof"
          for marker in \
            'VOID_BUY_VOID_PRESALE_RECEIPT_LIVE_PROCESS_HOST_EVIDENCE_V2_PROOF_GREEN' \
            'exact_parent_v1_source_blob_bound=true' \
            'exact_parent_v1_proof_blob_bound=true' \
            'parent_v1_authenticated_module_graph_bound=true' \
            'parent_v1_module_graph_path_count=13' \
            'parent_v1_execution_from_authenticated_data_url=true' \
            'production_v1_module_graph_executed_in_ci=true' \
            'parent_v1_path_import_performed=false' \
            'reviewed_source_open_nonblocking=true' \
            'executable_lease_open_nonblocking=true' \
            'regular_to_fifo_preopen_race_holds=true' \
            'diagnosed_root_peer_credential_failure_repaired=true' \
            'systemctl_query_exact_shape_required=true' \
            'systemctl_environment_exact_shape_required=true' \
            'systemd_working_directory_root_custody_required=true' \
            'systemd_working_directory_symlink_canonicalized=true' \
            'numeric_runtime_uid_gid_drop_required=true' \
            'supplementary_groups_cleared=true' \
            'no_new_privileges_required=true' \
            'inheritable_permitted_effective_bounding_ambient_caps_cleared=true' \
            'setpriv_descriptor_execution_required=true' \
            'systemctl_descriptor_execution_required=true' \
            'builtin_spawn_sync_patch_reaches_named_import=true' \
            'builtin_spawn_sync_patch_restored_after_success=true' \
            'builtin_spawn_sync_patch_restored_after_failure=true' \
            'nested_patch_rejected=true' \
            'non_systemctl_spawn_sync_passthrough=true' \
            'parent_v1_positive_evidence_contract_inherited=true' \
            'parent_v1_negative_authority_contract_inherited=true' \
            'process_environment_read_performed=false' \
            'filesystem_write_performed=false' \
            'service_mutation_performed=false' \
            'credential_access=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false' \
            'production_host_evidence_authority=false'
          do
            grep -Fx "$marker" "$proof"
          done

          self="$RUNNER_TEMP/receipt-live-process-host-evidence-v2-self-test.log"
          npx tsx ops/precision/void_buy_void_presale_receipt_live_process_host_evidence_v2.ts --self-test |
            tee "$self"
          for marker in \
            'VOID_BUY_VOID_PRESALE_RECEIPT_LIVE_PROCESS_HOST_EVIDENCE_V2_SELF_TEST_GREEN' \
            'parent_v1_source_and_proof_bound=true' \
            'parent_v1_authenticated_module_graph_bound=true' \
            'parent_v1_module_graph_path_count=13' \
            'parent_v1_execution_from_authenticated_data_url=true' \
            'parent_v1_path_import_performed=false' \
            'reviewed_source_open_nonblocking=true' \
            'executable_lease_open_nonblocking=true' \
            'root_direct_user_bus_query_replaced=true' \
            'numeric_runtime_uid_gid_drop_required=true' \
            'supplementary_groups_cleared=true' \
            'no_new_privileges_required=true' \
            'all_capability_sets_cleared=true' \
            'setpriv_and_systemctl_descriptor_execution_required=true' \
            'systemd_working_directory_root_custody_required=true' \
            'systemd_working_directory_canonicalization_required=true' \
            'builtin_spawn_sync_patch_scoped_and_restored=true' \
            'non_systemctl_spawn_sync_passthrough_required=true' \
            'filesystem_write_performed=false' \
            'service_mutation_performed=false' \
            'credential_access=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false' \
            'production_host_evidence_authority=false'
          do
            grep -Fx "$marker" "$self"
          done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
