name: VOID Buy VOID protected V7 V2 lock V4

on:
  pull_request:
    paths:
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4.md"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v4.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove lock V4 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact V4 lock generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BASE" = "65e390d6d3da1f0aef7181c2085b9c7d44967126"
          test "$(git merge-base "65e390d6d3da1f0aef7181c2085b9c7d44967126" "$EXPECTED_HEAD")" = "65e390d6d3da1f0aef7181c2085b9c7d44967126"
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            'A	.github/workflows/buy-void-enforcement-final-protected-v7-v2-lock-v4.yml' \
            'A	docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4.md' \
            'A	ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json' \
            'A	scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs' | sort > "$expected"
          git diff --name-status "65e390d6d3da1f0aef7181c2085b9c7d44967126" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json)" = "416202f5a7ee4c55950d5db9d13a718c721fc801"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs)" = "1eb43afaea8e46dfc061a67e15e5dae099874091"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-lock-v4.md)" = "7654605ce6c895656c694e8104efdbbf35c59138"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json)" = "b8341906d9563739a50dac98ea184a1d93267531"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v4.mjs)" = "781c99c145ac267f1a177c542f095a7f7bd3063f"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v3.json)" = "5301c32f53c2a82435152e38b36486507a73f906"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v3.json)" = "e530390e505d447ca0ad9e2a098ec6a819ae3e6c"
          git diff --check "65e390d6d3da1f0aef7181c2085b9c7d44967126" "$EXPECTED_HEAD" --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact V4 lock
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs --self-test
          out="$RUNNER_TEMP/lock-v4-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_lock_v4.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json
          test "$(sha256sum "$out" | awk '{print $1}')" = "95a16e215ae223c663f7675537ff6037ec2c85491c4aa9dd945e1439684d01b9"
          test "$(git hash-object "$out")" = "416202f5a7ee4c55950d5db9d13a718c721fc801"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v7-v2-lock-v4-${{ github.event.pull_request.head.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/lock-v4-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v7-v2-lock-v4-${{ github.event.pull_request.head.sha }}-node-*
          merge-multiple: true
          path: lock-v4
      - name: Require V4 lock Node 22 24 26 equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "lock-v4/lock-v4-$node.json"; done
          cmp lock-v4/lock-v4-22.json lock-v4/lock-v4-24.json
          cmp lock-v4/lock-v4-22.json lock-v4/lock-v4-26.json
          test "$(sha256sum lock-v4/lock-v4-22.json | awk '{print $1}')" = "95a16e215ae223c663f7675537ff6037ec2c85491c4aa9dd945e1439684d01b9"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const lock=JSON.parse(fs.readFileSync("lock-v4/lock-v4-22.json","utf8"));
          assert.equal(lock.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_LOCK_V4");
          assert.equal(lock.version,4);
          assert.equal(lock.candidate_evidence.git_blob_sha1,"b8341906d9563739a50dac98ea184a1d93267531");
          assert.equal(lock.candidate_evidence.candidate_enforcement_set_sha256,"f28b445fe5f1e632d1265ead825ecf9338644a3ae2704fde83ba1cedaf6be695");
          assert.equal(lock.candidate_enforcement_identity_accepted,true);
          assert.equal(lock.deployed_artifact_generation_verified,false);
          assert.equal(lock.runtime_mount_authority,false);
          assert.equal(lock.production_source_finality_authority_ready,false);
          assert.equal(lock.public_presale_activation,false);
          assert.equal(lock.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_LOCK_V4_CROSS_NODE_GREEN");
          NODE
