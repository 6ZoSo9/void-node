name: VOID live agent metrics tail bootstrap v1

on:
  push:
    branches:
      - fix/live-agent-jsonl-runtime-wedge-v1-20260816

permissions:
  contents: write

jobs:
  publish-tail-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/live-agent-jsonl-runtime-wedge-v1-20260816
          fetch-depth: 0
      - name: Guard parent and apply bounded tail repair
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^)" = "b154865c572011041d3e754cb7cb19241a0b31a6"
          test "$(git rev-parse origin/main)" = "e198ffd2dce2862b6a1d5e4c5890ad2afab349f4"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path("src/index.ts")
          proof_path = Path("scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs")
          bootstrap_path = ".github/workflows/void-live-agent-metrics-tail-bootstrap-v1.yml"
          old_blob = "dbef32af1d2ec6d7d9b8409c21e001fd380d8f1b"
          old_proof_blob = "6af898e81100814caff281687171920439e4f961"

          observed = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
          if observed != old_blob:
              raise SystemExit(f"unexpected src/index.ts blob: {observed}")
          observed_proof = subprocess.check_output(["git", "hash-object", str(proof_path)], text=True).strip()
          if observed_proof != old_proof_blob:
              raise SystemExit(f"unexpected focused proof blob: {observed_proof}")

          text = source.read_text()
          replacements = [
              (r'lines.join("\n")+"\\n"', r'lines.join("\n")+"\n"'),
              (r'out.join("\n")+"\\n"', r'out.join("\n")+"\n"'),
              (r'send("# error "+(e?.message||"internal")+"\\n");', r'send("# error "+(e?.message||"internal")+"\n");'),
          ]
          for bad, good in replacements:
              count = text.count(bad)
              if count != 1:
                  raise SystemExit(f"expected exactly one residual literal-newline tail for {bad!r}, got {count}")
              text = text.replace(bad, good, 1)
          source.write_text(text)

          repaired = source.read_text()
          for bad, good in replacements:
              if bad in repaired:
                  raise SystemExit(f"residual literal-newline tail remains: {bad!r}")
              if good not in repaired:
                  raise SystemExit(f"real newline tail missing: {good!r}")

          new_blob = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
          if new_blob == old_blob:
              raise SystemExit("src/index.ts blob did not change")

          expected_pins = {
              "runtime/canonical-producer-self-http-guard-v1.cjs",
              "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs",
          }
          grep_args = [
              "git", "grep", "-l", old_blob, "--", ".",
              f":(exclude){bootstrap_path}",
          ]
          grep = subprocess.run(
              grep_args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False
          )
          if grep.returncode != 0:
              raise SystemExit(f"provenance discovery failed rc={grep.returncode}: {grep.stderr.strip()}")
          pin_paths = {p for p in grep.stdout.splitlines() if p}
          if pin_paths != expected_pins:
              raise SystemExit(f"unexpected provenance pin set: {sorted(pin_paths)}")
          for rel in sorted(expected_pins):
              p = Path(rel)
              data = p.read_text()
              if data.count(old_blob) != 1:
                  raise SystemExit(f"expected exactly one provenance pin in {rel}")
              p.write_text(data.replace(old_blob, new_blob, 1))

          stale = subprocess.run(
              grep_args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False
          )
          if stale.returncode not in (0, 1):
              raise SystemExit(f"stale provenance verification failed rc={stale.returncode}: {stale.stderr.strip()}")
          if stale.stdout.strip():
              raise SystemExit(f"stale source blob remains outside bootstrap: {stale.stdout.strip()}")

          proof = proof_path.read_text()
          anchor = '\nconst unsafeHeader = \'const n = Number((await selfJson(`/blocks/latest/number2.json`)).number);\';\n'
          if proof.count(anchor) != 1:
              raise SystemExit("focused proof insertion anchor was not unique")
          proof_lines = [
              r'const badReceiptsTail = String.raw`lines.join("\n")+"\\n"`;',
              r'const goodReceiptsTail = String.raw`lines.join("\n")+"\n"`;',
              r'const badLeaseMetricsTail = String.raw`out.join("\n")+"\\n"`;',
              r'const goodLeaseMetricsTail = String.raw`out.join("\n")+"\n"`;',
              r'const badLeaseErrorTail = String.raw`send("# error "+(e?.message||"internal")+"\\n");`;',
              r'const goodLeaseErrorTail = String.raw`send("# error "+(e?.message||"internal")+"\n");`;',
              'assert.equal(source.includes(badReceiptsTail), false, "receipts metrics still appends a literal backslash-n tail");',
              'assert.equal(source.includes(goodReceiptsTail), true, "receipts metrics real newline tail missing");',
              'assert.equal(source.includes(badLeaseMetricsTail), false, "lease metrics still appends a literal backslash-n tail");',
              'assert.equal(source.includes(goodLeaseMetricsTail), true, "lease metrics real newline tail missing");',
              'assert.equal(source.includes(badLeaseErrorTail), false, "lease metrics error response still appends a literal backslash-n tail");',
              'assert.equal(source.includes(goodLeaseErrorTail), true, "lease metrics error response real newline tail missing");',
          ]
          addition = "\n".join(proof_lines) + "\n"
          proof_path.write_text(proof.replace(anchor, "\n" + addition + anchor, 1))

          strengthened = proof_path.read_text()
          for marker in ("badReceiptsTail", "badLeaseMetricsTail", "badLeaseErrorTail"):
              if strengthened.count(marker) < 2:
                  raise SystemExit(f"focused proof strengthening missing marker: {marker}")

          print(f"old_index_blob={old_blob}")
          print(f"new_index_blob={new_blob}")
          print("metrics_literal_newline_tails_removed=3")
          print("focused_tail_regression_assertions_added=true")
          PY

          rm .github/workflows/void-live-agent-metrics-tail-bootstrap-v1.yml

          python3 - <<'PY'
          from pathlib import Path
          text = Path("src/index.ts").read_text()
          bad = [
              r'lines.join("\n")+"\\n"',
              r'out.join("\n")+"\\n"',
              r'send("# error "+(e?.message||"internal")+"\\n");',
          ]
          for needle in bad:
              if needle in text:
                  raise SystemExit(f"bad metrics newline tail survived: {needle!r}")
          print("VOID_LIVE_AGENT_METRICS_TAIL_COMPLETION_SWEEP_GREEN")
          PY

      - name: Install dependencies
        run: npm ci
      - name: Strengthened focused wedge proof
        run: node scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
      - name: Canonical provenance proof
        run: node scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
      - name: Repository typecheck
        run: npm run typecheck
      - name: Repository build
        run: npm run build
      - name: Verify net PR scope and publish
        run: |
          mapfile -t paths < <(git diff --name-only origin/main --)
          printf 'net_paths=%s\n' "${paths[*]}"
          expected=(
            .github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml
            runtime/canonical-producer-self-http-guard-v1.cjs
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
            scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
            src/index.ts
          )
          mapfile -t sorted_paths < <(printf '%s\n' "${paths[@]}" | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${sorted_paths[@]}")" = "$(printf '%s\n' "${sorted_expected[@]}")"
          git diff --check origin/main --
          git config user.name "void-coordination-bot"
          git config user.email "44710859+6ZoSo9@users.noreply.github.com"
          git add -- \
            src/index.ts \
            runtime/canonical-producer-self-http-guard-v1.cjs \
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs \
            scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
          git add -u -- .github/workflows/void-live-agent-metrics-tail-bootstrap-v1.yml
          staged_expected=(
            .github/workflows/void-live-agent-metrics-tail-bootstrap-v1.yml
            runtime/canonical-producer-self-http-guard-v1.cjs
            scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs
            scripts/prove_live_agent_jsonl_runtime_wedge_v1.mjs
            src/index.ts
          )
          mapfile -t staged_paths < <(git diff --cached --name-only | sort)
          mapfile -t sorted_staged_expected < <(printf '%s\n' "${staged_expected[@]}" | sort)
          test "$(printf '%s\n' "${staged_paths[@]}")" = "$(printf '%s\n' "${sorted_staged_expected[@]}")"
          git diff --cached --check
          git commit -m "fix(runtime): normalize agent metrics newline tails"
          git push origin HEAD:fix/live-agent-jsonl-runtime-wedge-v1-20260816
