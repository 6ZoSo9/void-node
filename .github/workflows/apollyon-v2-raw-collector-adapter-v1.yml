name: Apollyon V2 raw collector adapter v1

on:
  pull_request:
    paths:
      - "tools/apollyon-v2-raw-collector-adapter-v1.mjs"
      - "scripts/prove_apollyon_v2_raw_collector_adapter_v1.mjs"
      - "docs/security/apollyon-v2-raw-collector-adapter-v1.md"
      - ".github/workflows/apollyon-v2-raw-collector-adapter-v1.yml"
      - "ops/xiphos/apollyon_designated_host_custody_evidence_readonly_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove raw collector adapter
        run: |
          set -euo pipefail
          node --check tools/apollyon-v2-raw-collector-adapter-v1.mjs
          node --check scripts/prove_apollyon_v2_raw_collector_adapter_v1.mjs
          node scripts/prove_apollyon_v2_raw_collector_adapter_v1.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
