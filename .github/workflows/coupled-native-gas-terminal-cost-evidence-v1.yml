name: VOID coupled native gas terminal cost evidence v1

on:
  pull_request:
    paths:
      - "src/economic/coupled_native_gas_terminal_cost_evidence_v1.ts"
      - "scripts/prove_coupled_native_gas_terminal_cost_evidence_v1.ts"
      - "docs/architecture/coupled-native-gas-terminal-cost-evidence-v1.md"
      - ".github/workflows/coupled-native-gas-terminal-cost-evidence-v1.yml"
      - "src/economic/coupled_native_gas_liability_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "src/economic/buy_void_fulfillment_confirmation_v1.ts"
      - "src/economic/buy_void_native_delivery_receipt_reconciler_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/coupled_native_gas_terminal_cost_evidence_v1.ts \
            scripts/prove_coupled_native_gas_terminal_cost_evidence_v1.ts

      - name: Prove terminal native gas cost evidence
        run: npx tsx scripts/prove_coupled_native_gas_terminal_cost_evidence_v1.ts

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
