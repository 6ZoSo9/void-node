name: VOID WC/VOID opening claim binding publication v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-opening-claim-binding-publication-v1.mjs"
      - "scripts/prove_void_wc_void_opening_claim_binding_publication_v1.mjs"
      - "docs/operators/wc-void-opening-claim-binding-publication-v1.md"
      - "tools/void-wc-void-opening-claim-binding-persistence-v1.mjs"
      - "tools/void-wc-void-opening-replay-persistence-v1.mjs"
      - "tools/void-wc-void-opening-replay-protection-v1.mjs"
      - ".github/workflows/void-wc-void-opening-claim-binding-publication-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-wc-void-opening-claim-binding-publication-v1.mjs"
      - "scripts/prove_void_wc_void_opening_claim_binding_publication_v1.mjs"
      - "docs/operators/wc-void-opening-claim-binding-publication-v1.md"
      - "tools/void-wc-void-opening-claim-binding-persistence-v1.mjs"
      - "tools/void-wc-void-opening-replay-persistence-v1.mjs"
      - "tools/void-wc-void-opening-replay-protection-v1.mjs"
      - ".github/workflows/void-wc-void-opening-claim-binding-publication-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-opening-claim-binding-publication-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove replay persistence prerequisite
        run: node scripts/prove_void_wc_void_opening_replay_persistence_v1.mjs

      - name: Prove read-only claim binding verification
        run: node scripts/prove_void_wc_void_opening_claim_binding_persistence_v1.mjs

      - name: Prove replay-bound create-once claim binding publication
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-opening-claim-binding-publication-v1.mjs
          node --check scripts/prove_void_wc_void_opening_claim_binding_publication_v1.mjs
          node scripts/prove_void_wc_void_opening_claim_binding_publication_v1.mjs

      - name: Diff hygiene
        run: git diff --check
