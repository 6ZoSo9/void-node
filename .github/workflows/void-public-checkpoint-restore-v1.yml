name: VOID public checkpoint restore v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-checkpoint-restore-v1.yml"
      - "docs/public/void-public-checkpoint-restore-v1.md"
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".npmrc"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-checkpoint-restore-v1.yml"
      - "docs/public/void-public-checkpoint-restore-v1.md"
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".npmrc"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build runtime modules
        run: npm run build

      - name: Syntax check
        run: |
          node --check tools/void-public-canonical-checkpoint-v1.mjs
          node --check scripts/prove_segstore_path_confinement_v1.mjs
          node --check scripts/lib/void_public_checkpoint_restore_activation_v1.mjs
          node --check scripts/lib/void_public_checkpoint_restore_generation_v1.mjs
          node --check scripts/lib/void_public_checkpoint_restore_supervisor_v1.mjs
          node --check scripts/run_void_public_checkpoint_restore_v1.mjs
          node --check scripts/run_void_public_bootstrap_supervisor_v1.mjs
          node --check scripts/prove_void_public_checkpoint_restore_v1.mjs
          node --check scripts/prove_ci_diff_hygiene_v1.mjs
          bash -n scripts/ci_diff_hygiene_v1.sh

      - name: Prove checkpoint restore
        run: node scripts/prove_void_public_checkpoint_restore_v1.mjs

      - name: Reprove checkpoint transport
        run: node scripts/prove_void_public_checkpoint_discovery_transport_v1.mjs

      - name: Reprove SegStore path confinement
        run: node scripts/prove_segstore_path_confinement_v1.mjs

      - name: Reprove canonical checkpoint verifier
        run: node scripts/prove_void_public_canonical_checkpoint_v1.mjs

      - name: Prove committed-range diff hygiene contract
        if: matrix.node == 24
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene across committed change range
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
