name: Agent Paid Work Credential Registry V1

on:
  pull_request:
    paths:
      - ".github/workflows/agent-paid-work-credential-registry-v1.yml"
      - "docs/operators/agent-paid-work-credential-registry-v1.md"
      - "docs/public/agent-paid-work-submission-intake-runtime-v1.md"
      - "examples/agent-paid-work-credential-registry-v1.example.json"
      - "examples/agent-paid-work-submission-intake-receipt-v1.example.json"
      - "schemas/agent-paid-work-credential-registry-v1.schema.json"
      - "schemas/agent-paid-work-submission-intake-receipt-v1.schema.json"
      - "scripts/agent_paid_work_credential_registry_v1.ts"
      - "scripts/agent_paid_work_submission_receiver_v1.ts"
      - "scripts/prove_agent_paid_work_credential_registry_v1.ts"
      - "scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-paid-work-credential-registry-v1.yml"
      - "docs/operators/agent-paid-work-credential-registry-v1.md"
      - "docs/public/agent-paid-work-submission-intake-runtime-v1.md"
      - "examples/agent-paid-work-credential-registry-v1.example.json"
      - "examples/agent-paid-work-submission-intake-receipt-v1.example.json"
      - "schemas/agent-paid-work-credential-registry-v1.schema.json"
      - "schemas/agent-paid-work-submission-intake-receipt-v1.schema.json"
      - "scripts/agent_paid_work_credential_registry_v1.ts"
      - "scripts/agent_paid_work_submission_receiver_v1.ts"
      - "scripts/prove_agent_paid_work_credential_registry_v1.ts"
      - "scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-paid-work-credential-registry-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prove credential registry and receiver integration
        run: >-
          npx --no-install tsx
          scripts/prove_agent_paid_work_credential_registry_v1.ts

      - name: Regress single-token fallback receiver
        run: >-
          npx --no-install tsx
          scripts/prove_agent_paid_work_submission_intake_runtime_v1.ts

      - name: Regress intake guard
        run: >-
          node
          scripts/prove_agent_paid_work_submission_intake_guard_v1.mjs

      - name: Focused strict TypeScript
        run: >-
          npx --no-install tsc
          --noEmit
          --strict
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --types node
          --skipLibCheck
          scripts/agent_paid_work_order_envelope_v1.ts
          scripts/agent_paid_work_submission_admission_v1.ts
          scripts/agent_paid_work_credential_registry_v1.ts
          scripts/agent_paid_work_submission_receiver_v1.ts
          scripts/prove_agent_paid_work_credential_registry_v1.ts
          scripts/prove_agent_paid_work_submission_intake_runtime_v1.ts

      - name: TypeScript baseline
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
