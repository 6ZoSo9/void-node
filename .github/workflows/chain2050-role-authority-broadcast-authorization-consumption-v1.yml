name: chain2050-role-authority-broadcast-authorization-consumption-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-single-transaction-broadcast-authorization-v1.json"
      - "tools/chain2050-role-authority-single-transaction-broadcast-authorization-v1.mjs"
      - "tools/chain2050-role-authority-broadcast-authorization-consumption-v1.mjs"
      - "scripts/prove_chain2050_role_authority_broadcast_authorization_consumption_v1.mjs"
      - "docs/security/chain2050-role-authority-broadcast-authorization-consumption-v1.md"
      - ".github/workflows/chain2050-role-authority-broadcast-authorization-consumption-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Prove exact broadcast authorization and durable consumption gate
        run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_broadcast_authorization_consumption_v1.mjs | tee "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_BROADCAST_AUTHORIZATION_CONSUMPTION_V1_GREEN' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'broadcast_authorization_id=voidcraba1_66779fab9c8657d7f038585525dfc2ac688adfe33cf10a5d5827abb140e04c85' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'one_submission_attempt_only=true' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'durable_consumption_before_broadcaster_access=true' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'automatic_retry_authorized=false' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
          grep -Fx 'transaction_broadcast_performed=false' "$RUNNER_TEMP/role-authority-broadcast-consumption.log"
      - name: Diff hygiene
        run: git diff --check
