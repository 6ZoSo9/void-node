name: Apollyon Xiphos machine identity provenance HOLD V2

on:
  pull_request:
    paths:
      - "ops/security/apollyon-xiphos-machine-id-provenance-hold-v2.json"
      - "scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v2.py"
      - "docs/security/apollyon-xiphos-machine-id-provenance-hold-v2.md"
      - ".github/workflows/apollyon-xiphos-machine-id-provenance-hold-v2.yml"
      - ".github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml"
      - "docs/security/apollyon-protected-store-machine-identity-binding-v1.md"
      - "ops/security/apollyon-protected-store-machine-identity-binding-v1.json"
      - "scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py"
      - ".github/workflows/apollyon-protected-store-first-host-collector-v1.yml"
      - "docs/security/apollyon-protected-store-first-host-collector-v1.md"
      - "ops/xiphos/apollyon_protected_store_first_host_collector_v1.py"
      - "scripts/prove_apollyon_protected_store_first_host_collector_v1.py"
      - ".github/workflows/apollyon-xiphos-machine-id-provenance-hold-v1.yml"
      - "docs/security/apollyon-xiphos-machine-id-provenance-hold-v1.md"
      - "ops/security/apollyon-xiphos-machine-id-provenance-hold-v1.json"
      - "scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v1.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parent, four-file V2 scope, and inherited blobs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PARENT=4f534e00370882b1fbcf03568ddf355275562f57
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/apollyon-xiphos-machine-id-provenance-hold-v2.yml' \
            'docs/security/apollyon-xiphos-machine-id-provenance-hold-v2.md' \
            'ops/security/apollyon-xiphos-machine-id-provenance-hold-v2.json' \
            'scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v2.py' \
            | LC_ALL=C sort > "$expected"
          git diff --no-renames --name-only "$PARENT" "$EXPECTED_HEAD" -- \
            | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/apollyon-xiphos-machine-id-provenance-hold-v2.json)" = b97c44976b33e21271b6525d4caeffc54c366c1e
          test "$(git rev-parse HEAD:scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v2.py)" = 8ef3e9ff01fc7c84ab8ec3b37b5522c253b00e26
          test "$(git rev-parse HEAD:docs/security/apollyon-xiphos-machine-id-provenance-hold-v2.md)" = 3a7cd6462434495b1790bae565673e25091e865d

          test "$(git rev-parse HEAD:.github/workflows/apollyon-protected-store-machine-identity-binding-v1.yml)" = c8737fe68f15894bd15af0e775fc79cb2b50d9bb
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-machine-identity-binding-v1.md)" = 24cc4b6ce92931d9be9d39a46afb5a1c76e267fb
          test "$(git rev-parse HEAD:ops/security/apollyon-protected-store-machine-identity-binding-v1.json)" = 0fb44bcfd90423d5bfbe6f7a9e6143de54bc9b26
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_machine_identity_binding_v1.py)" = 45ab6a6cbfea05d61617de294d18ed7dec07fae9

          test "$(git rev-parse HEAD:.github/workflows/apollyon-protected-store-first-host-collector-v1.yml)" = dde72db084eed198c42a4183463eab593fa209ba
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-first-host-collector-v1.md)" = 286a5b0528bdf1cd8cd6a1a3628222f6a3b5dbb9
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_protected_store_first_host_collector_v1.py)" = 36f77c85a2716989726af77679160de2b9e48f76
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_first_host_collector_v1.py)" = 67a73d6da5018944bc79e5ed07460f7e6512e57e

          test "$(git rev-parse HEAD:.github/workflows/apollyon-xiphos-machine-id-provenance-hold-v1.yml)" = e526570137e1d50d41c1876feb79b07c665017a1
          test "$(git rev-parse HEAD:docs/security/apollyon-xiphos-machine-id-provenance-hold-v1.md)" = fb6fdba3e8cba4f471daa09cef3469de0c0dd24d
          test "$(git rev-parse HEAD:ops/security/apollyon-xiphos-machine-id-provenance-hold-v1.json)" = e0c7aa5d26639caee4c293da1846544bb07ca903
          test "$(git rev-parse HEAD:scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v1.py)" = d848808585934e6609f0c84c09adcba18339a583

          git diff --check "$PARENT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile proof without bytecode writes
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          name = "scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v2.py"
          compile(Path(name).read_text("utf-8"), name, "exec", dont_inherit=True)
          print("proof_python_syntax_green=true")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove exact V2 provenance HOLD
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apollyon-xiphos-machine-id-provenance-hold-v2.log"
          python3 -I -B scripts/prove_apollyon_xiphos_machine_id_provenance_hold_v2.py --self-test | tee "$out"
          grep -Fx 'VOID_APOLLYON_XIPHOS_MACHINE_ID_PROVENANCE_HOLD_V2_PROOF_GREEN' "$out"
          grep -Fx 'plan_id=voidapollyonxiphosprovenancehold2_1ee4af4279e852299e19e0aecd63c2cc636e5bb1c32fce7e204d996ca4214cb7' "$out"
          grep -Fx 'observed_normalized_machine_id_sha256=543902c4c208d749dbe2baa239e9cd010ac50eb8cde4db8eb8cd26f6e806f057' "$out"
          grep -Fx 'raw_machine_id_absent_from_repository=true' "$out"
          grep -Fx 'digest_internal_consistency_proven=true' "$out"
          grep -Fx 'collector_complete_mountinfo_cover_row_bound=true' "$out"
          grep -Fx 'historical_v1_provenance_hold_preserved=true' "$out"
          grep -Fx 'authenticated_transport_attestation_present=false' "$out"
          grep -Fx 'signed_machine_identity_attestation_present=false' "$out"
          grep -Fx 'authenticated_xiphos_machine_identity_proven=false' "$out"
          grep -Fx 'merged_binding_claim_accepted_for_host_authority=false' "$out"
          grep -Fx 'collector_machine_identity_prerequisite_satisfied_for_host_execution=false' "$out"
          grep -Fx 'host_pass_authorized=false' "$out"
          grep -Fx 'parent_blob_validation=true' "$out"
          grep -Fx 'semantic_adversaries=30' "$out"
          grep -Fx 'training_execution_authorized=false' "$out"
          grep -Fx 'funds_movement_authorized=false' "$out"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Final diff hygiene
        run: |
          set -euo pipefail
          git diff --check 4f534e00370882b1fbcf03568ddf355275562f57 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
