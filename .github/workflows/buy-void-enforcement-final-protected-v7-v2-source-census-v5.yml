name: VOID Buy VOID final protected V7/V2 source census v5

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-source-census-v5.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_source_census_v5.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-source-census-v5.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-source-census-v5.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_source_census_v5.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-source-census-v5.md"
      - "ops/precision/**"
      - "ops/security/**"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/**"
      - "scripts/prove_void_buy_v7_privileged_launcher_package_runtime_v2.mjs"
      - "src/economic/**"
      - "src/index.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact census generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 6080389131c3cdb80fa9935b5ff80f4e40f09938 "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked proof dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Derive protected source census
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_source_census_v5.mjs
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_source_census_v5.mjs --self-test             | tee "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          out="$RUNNER_TEMP/protected-v7-v2-source-census-v5-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_source_census_v5.mjs --receipt > "$out"
          grep -Fx 'VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_SOURCE_CENSUS_V5_GREEN'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          grep -Fx 'protected_tracked_source_count=49'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          grep -Fx 'intentional_protected_delta_count=2'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          grep -Fx 'unchanged_protected_path_count=47'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          grep -Fx 'candidate_enforcement_identity_accepted=false'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false'             "$RUNNER_TEMP/protected-v7-v2-source-census-v5-self-test-${{ matrix.node }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-v7-v2-source-census-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/protected-v7-v2-source-census-v5-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-v7-v2-source-census-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census

      - name: Require Node 22/24/26 byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "census/protected-v7-v2-source-census-v5-node-$node.json"
          done
          cmp census/protected-v7-v2-source-census-v5-node-22.json census/protected-v7-v2-source-census-v5-node-24.json
          cmp census/protected-v7-v2-source-census-v5-node-22.json census/protected-v7-v2-source-census-v5-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("census/protected-v7-v2-source-census-v5-node-22.json","utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_SOURCE_CENSUS_V5");
          assert.equal(c.protected_tracked_source_count,49);
          assert.equal(c.intentional_protected_delta.length,2);
          assert.equal(c.unchanged_protected_path_count,47);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_SOURCE_CENSUS_V5_CROSS_NODE_GREEN");
          console.log("census_id="+c.census_id);
          console.log("protected_inventory_sha256="+c.protected_tracked_source_inventory_canonical_sha256);
          console.log("funds_movement=false");
          NODE
