name: VOID Buy VOID user runtime custody hardening v1

on:
  pull_request:
    paths:
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v1.conf.example"
      - "scripts/prove_buy_void_user_runtime_custody_hardening_v1.mjs"
      - "docs/operators/buy-void-user-runtime-custody-hardening-v1.md"
      - ".github/workflows/buy-void-user-runtime-custody-hardening-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v1.conf.example"
      - "scripts/prove_buy_void_user_runtime_custody_hardening_v1.mjs"
      - "docs/operators/buy-void-user-runtime-custody-hardening-v1.md"
      - ".github/workflows/buy-void-user-runtime-custody-hardening-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove exact additive hardening policy
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_user_runtime_custody_hardening_v1.mjs | tee "$RUNNER_TEMP/runtime-hardening.log"
          grep -Fx 'VOID_BUY_VOID_USER_RUNTIME_CUSTODY_HARDENING_V1_GREEN' "$RUNNER_TEMP/runtime-hardening.log"
          grep -Fx 'target_manager=user' "$RUNNER_TEMP/runtime-hardening.log"
          grep -Fx 'user_or_group_migration=false' "$RUNNER_TEMP/runtime-hardening.log"
          grep -Fx 'service_restart_authorized=false' "$RUNNER_TEMP/runtime-hardening.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/runtime-hardening.log"
          git diff --check
