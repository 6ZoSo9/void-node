name: Buy VOID ERC20 transaction preparation planner v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_erc20_transaction_preparation_planner_v1.ts"
      - "scripts/prove_buy_void_erc20_transaction_preparation_planner_v1.ts"
      - "docs/operators/buy-void-erc20-transaction-preparation-planner-v1.md"
      - ".github/workflows/buy-void-erc20-transaction-preparation-planner-v1.yml"

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove ERC20 transaction preparation
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_erc20_transaction_preparation_planner_v1.ts
      - name: Preserve canonical ERC20 sign/broadcast adapter
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_delivery_sign_broadcast_adapter_v1.ts
      - name: Focused Buy VOID TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/prove_buy_void_*.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
