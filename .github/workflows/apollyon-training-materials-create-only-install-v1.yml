name: Apollyon training materials create-only install v1

on:
  pull_request:
    paths:
      - "ops/xiphos/install_apollyon_training_materials_create_only_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_contract_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_host_plan_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_build_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_apply_v1.py"
      - "scripts/prove_apollyon_training_materials_create_only_install_v1.py"
      - "docs/security/apollyon-training-materials-create-only-install-v1.md"
      - ".github/workflows/apollyon-training-materials-create-only-install-v1.yml"
      - "ops/xiphos/void-apollyon-training-bus-isolation-v1.service"
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
      - "fixtures/security/apollyon-training-preentry-binary-candidate-lock-v1.json"
      - "ops/xiphos/apollyon_candidate_training_entrypoint_v1.c"
      - "ops/security/apollyon-candidate-training-entrypoint-binary-lock-v1.json"
  push:
    branches:
      - main
    paths:
      - "ops/xiphos/install_apollyon_training_materials_create_only_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_contract_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_host_plan_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_build_v1.py"
      - "ops/xiphos/apollyon_training_materials_install_apply_v1.py"
      - "scripts/prove_apollyon_training_materials_create_only_install_v1.py"
      - "docs/security/apollyon-training-materials-create-only-install-v1.md"
      - ".github/workflows/apollyon-training-materials-create-only-install-v1.yml"
      - "ops/xiphos/void-apollyon-training-bus-isolation-v1.service"
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
      - "fixtures/security/apollyon-training-preentry-binary-candidate-lock-v1.json"
      - "ops/xiphos/apollyon_candidate_training_entrypoint_v1.c"
      - "ops/security/apollyon-candidate-training-entrypoint-binary-lock-v1.json"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Syntax and focused proof
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/xiphos/apollyon_training_materials_install_contract_v1.py \
            ops/xiphos/apollyon_training_materials_install_host_plan_v1.py \
            ops/xiphos/apollyon_training_materials_install_build_v1.py \
            ops/xiphos/apollyon_training_materials_install_apply_v1.py \
            ops/xiphos/install_apollyon_training_materials_create_only_v1.py \
            scripts/prove_apollyon_training_materials_create_only_install_v1.py
          python3 -I -B scripts/prove_apollyon_training_materials_create_only_install_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          MERGE_BASE="$(git merge-base "$BASE" HEAD)"
          git diff --check "$MERGE_BASE" HEAD
