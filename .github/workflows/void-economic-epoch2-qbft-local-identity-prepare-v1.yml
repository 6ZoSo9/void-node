name: VOID economic epoch2 QBFT local identity prepare v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-qbft-local-identity-prepare-v1.yml"
      - "ops/common/void-economic-epoch2-qbft-local-identity-prepare-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_local_identity_prepare_v1.mjs"
      - "docs/architecture/economic-epoch2-qbft-local-identity-prepare-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-economic-epoch2-qbft-local-identity-prepare-v1.yml"
      - "ops/common/void-economic-epoch2-qbft-local-identity-prepare-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_local_identity_prepare_v1.mjs"
      - "docs/architecture/economic-epoch2-qbft-local-identity-prepare-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node --check ops/common/void-economic-epoch2-qbft-local-identity-prepare-v1.mjs
      - run: node --check scripts/prove_void_economic_epoch2_qbft_local_identity_prepare_v1.mjs
      - run: node scripts/prove_void_economic_epoch2_qbft_local_identity_prepare_v1.mjs
      - run: git diff --check
