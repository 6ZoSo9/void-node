name: Buy VOID payment-keyed dormant systemd policy v1

on:
  pull_request:
    paths:
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/mainnet0/buy-void-production-activation-evidence-v1.json"
      - "ops/mainnet0/buy-void-production-history-carrier-attestation-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-dormant-host-preparation-v1.json"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "src/economic/buy_void_payment_history_terminal_projection_v1.ts"
      - "src/economic/buy_void_history_carrier_v1.ts"
      - "docs/operators/buy-void-payment-keyed-dormant-systemd-policy-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dormant-systemd-policy-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "ops/mainnet0/buy-void-production-activation-evidence-v1.json"
      - "ops/mainnet0/buy-void-production-history-carrier-attestation-v1.json"
      - "ops/mainnet0/buy-void-payment-keyed-dormant-host-preparation-v1.json"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - "src/economic/buy_void_payment_history_terminal_projection_v1.ts"
      - "src/economic/buy_void_history_carrier_v1.ts"
      - "docs/operators/buy-void-payment-keyed-dormant-systemd-policy-v1.md"
      - ".github/workflows/buy-void-payment-keyed-dormant-systemd-policy-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and prove dormant host preparation
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts | tee "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_DORMANT_SYSTEMD_POLICY_V1_PROOF_GREEN' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'terminal_projection_merge_verified=true' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'carrier_attestation_exact=true' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'runtime_enabled=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'runtime_apply_enabled=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'carrier_root_snapshot_pin_only=true' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'service_mutation=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'transaction_broadcast=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          grep -Fx 'funds_action=false' "$RUNNER_TEMP/dormant-host-preparation.log"
          npm run build
          git diff --check
