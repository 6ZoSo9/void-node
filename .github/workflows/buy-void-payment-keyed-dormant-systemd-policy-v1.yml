name: Buy VOID payment-keyed dormant systemd policy v1

on:
  pull_request:
    paths:
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - ".github/workflows/buy-void-payment-keyed-dormant-systemd-policy-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/systemd/void-node-live.service.d/91-buy-void-payment-keyed-production-dormant-v1.conf.example"
      - "scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts"
      - "ops/mainnet0/buy-void-payment-keyed-production-candidate-v1.json"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_erc20_production_credential_binding_evidence_v1.ts"
      - ".github/workflows/buy-void-payment-keyed-dormant-systemd-policy-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/prove_buy_void_payment_keyed_dormant_systemd_policy_v1.ts
      - run: git diff --check
