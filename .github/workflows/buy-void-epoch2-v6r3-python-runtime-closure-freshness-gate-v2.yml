name: Buy VOID Epoch-2 V6R3 Python runtime closure freshness gate V2

on:
  pull_request:
    paths:
      - '.github/workflows/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.yml'
      - 'docs/operators/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.md'
      - 'ops/security/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.json'
      - 'scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py'
      - 'ops/security/buy-void-epoch2-v6r3-python-runtime-closure-contract-v2.json'
      - 'ops/security/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.json'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.yml'
      - 'docs/operators/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.md'
      - 'ops/security/buy-void-epoch2-v6r3-python-runtime-closure-freshness-gate-v2.json'
      - 'scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax and no privileged tool invocation
        run: |
          python3 -I -B -S -c 'import ast; from pathlib import Path; ast.parse(Path("scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py").read_text())'
          ! grep -En 'sudo|rm -rf|--apply' scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py
      - name: Synthetic stale-evidence proof
        run: python3 -I -B -S scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py --self-test
      - name: Source-only plan
        run: python3 -I -B -S scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py --source-plan
      - name: Require source-only V2 and synthetic Git drift guards
        run: |
          set -euo pipefail
          OUTPUT="$(python3 -I -B -S scripts/prove_buy_void_epoch2_v6r3_python_runtime_closure_freshness_gate_v2.py --self-test)"
          printf '%s\n' "$OUTPUT" | grep -Fx 'git_executable_loader_dso_helper_config_drift_rejected=true'
          printf '%s\n' "$OUTPUT" | grep -Fx 'git_mapped_elf_and_helper_absence_same_data_rejected=true'
          printf '%s\n' "$OUTPUT" | grep -Fx 'synthetic_adversary_count=27'
          printf '%s\n' "$OUTPUT" | grep -Fx 'v2_binary_lock_generation_exact=true'
          printf '%s\n' "$OUTPUT" | grep -Fx 'host_census_performed=false'
          printf '%s\n' "$OUTPUT" | grep -Fx 'host_plan_authorized=false'
      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
