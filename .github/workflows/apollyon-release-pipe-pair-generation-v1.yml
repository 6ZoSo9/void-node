name: Apollyon release pipe pair generation v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_release_pipe_pair_generation_v1.c"
      - "scripts/prove_apollyon_release_pipe_pair_generation_v1.py"
      - "docs/security/apollyon-release-pipe-pair-generation-v1.md"
      - ".github/workflows/apollyon-release-pipe-pair-generation-v1.yml"
      - "ops/xiphos/apollyon_training_start_release_native_candidate_v1.c"
      - "scripts/prove_apollyon_training_start_release_native_candidate_v1.py"
      - "tools/apollyon-training-start-release-binding-v1.mjs"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_release_pipe_pair_generation_v1.c"
      - "scripts/prove_apollyon_release_pipe_pair_generation_v1.py"
      - "docs/security/apollyon-release-pipe-pair-generation-v1.md"
      - ".github/workflows/apollyon-release-pipe-pair-generation-v1.yml"
      - "ops/xiphos/apollyon_training_start_release_native_candidate_v1.c"
      - "scripts/prove_apollyon_training_start_release_native_candidate_v1.py"
      - "tools/apollyon-training-start-release-binding-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove native same-pipe generation
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_release_pipe_pair_generation_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              BASE="$PR_BASE"
              ;;
            push)
              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"
              BASE="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              BASE="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
