name: Buy VOID allocation custody live durability rollback contract v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md"
      - ".github/workflows/buy-void-allocation-custody-live-durability-rollback-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  STACK_PARENT: 89fba1e80c2441bc90ff0387543177e0eb5b5788

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact requirements-contract generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$STACK_PARENT" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            'tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs' \
            'scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs' \
            'docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md' \
            '.github/workflows/buy-void-allocation-custody-live-durability-rollback-contract-v1.yml' \
            | sort > "$expected"
          git diff --no-renames --name-only "$STACK_PARENT" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs)" = 6020547b92fff1534c26c7fed33cedfb49faf7c3
          test "$(git rev-parse HEAD:scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs)" = 1b8547301f1df6c2b8176322b58d47d92fb84d05
          test "$(git rev-parse HEAD:docs/architecture/buy-void-allocation-custody-live-durability-rollback-contract-v1.md)" = 01c9ff56a11fdaf32aad9301c84986b21ff4c002

          test "$(git rev-parse HEAD:src/economic)" = 71c67e62a2b21a98f3f5135ee6aa56e0ef97d262
          test "$(git rev-parse HEAD:ops/security/buy-void-presale-host-evidence-collection-plan-v1.json)" = ad68175e629fd1cf90180db3a904f84834314fdd
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py)" = 295adeea32bc1723b290f7e07e4186e2e6e8e9be
          test "$(git rev-parse HEAD:docs/operators/buy-void-presale-host-evidence-collection-plan-v1.md)" = 4f5d8a5db1cf1b82991962f5bf90a231c96c6f76
          test "$(git rev-parse HEAD:.github/workflows/buy-void-presale-host-evidence-collection-plan-v1.yml)" = 9e7070f89235a3aa401a2c23a5dd3dbafc6a3703

          test "$(git rev-parse HEAD:src/economic/buy_void_allocation_custody_witness_live_read_replay_external_custody_qualification_v1.ts)" = d2bc816b027d2aca0c236d9ec31d128b28159d7d
          test "$(git rev-parse HEAD:src/economic/buy_void_allocation_custody_witness_live_read_replay_rollback_independence_v1.ts)" = 2d5fc24498b569f20701445d6214a8ca31e4f701
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-witness-live-read-replay-rollback-policy-evidence-v1.mjs)" = cf40d9d4a19d138d74aee849a6c02f96ee362dbb
          test "$(git rev-parse HEAD:src/economic/buy_void_allocation_custody_witness_live_read_replay_rollback_second_control_composition_v1.ts)" = 97180cc03e3f1b2f9935191ac6aafe4b15307708

          git diff --check "$STACK_PARENT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove fail-closed lane-2 requirements
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lane2-contract-v1-node-${{ matrix.node }}.log"
          node scripts/prove_buy_void_allocation_custody_live_durability_rollback_contract_v1.mjs | tee "$out"
          for marker in \
            'VOID_BUY_VOID_ALLOCATION_CUSTODY_LIVE_DURABILITY_ROLLBACK_CONTRACT_V1_PROOF_GREEN' \
            'parent_host_evidence_plan_bound=true' \
            'reviewed_lane2_primitives_bound=true' \
            'runtime_economic_tree_unchanged=true' \
            'read_only_collection_sufficient=false' \
            'controlled_live_challenge_required=true' \
            'non_customer_canary_domain_required=true' \
            'operation_bound_authorization_required=true' \
            'live_rollback_test_required=true' \
            'live_durable_storage_proven=false' \
            'rollback_resistance_proven=false' \
            'protected_high_water_custody_proven=false' \
            'independent_custody_proven=false' \
            'host_execution_authorized=false' \
            'storage_mutation_authorized=false' \
            'rollback_test_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'funds_movement=false' \
            'next_action=SEPARATELY_AUTHORIZE_NONCUSTOMER_CUSTODY_DURABILITY_ROLLBACK_CHALLENGE_V1'
          do
            grep -Fx "$marker" "$out"
          done
