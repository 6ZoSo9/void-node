name: VOID Cloudflare origin loopback isolation policy v1

on:
  pull_request:
    paths:
      - "tools/void-cloudflare-origin-loopback-isolation-policy-v1.mjs"
      - "scripts/prove_void_cloudflare_origin_loopback_isolation_policy_v1.mjs"
      - "docs/architecture/cloudflare-origin-loopback-isolation-policy-v1.md"
      - "ops/public/void-cloudflare-origin-proxy-v2-adapter-v1.mjs"
      - "tools/void-cloudflare-origin-proxy-v2-source-v1.mjs"
      - "tools/void-public-443-proxy-v2-dispatch-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-source-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-edge-composition-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-proxy-v2-rate-state-v1.mjs"
      - "ops/void-agent-credential-request-proxy-v2-edge-v1.mjs"
      - "tools/void-public-earn-proxy-v2-edge-contract-v1.mjs"
      - "tools/void-public-earn-proxy-v2-rate-state-v1.mjs"
      - "ops/public/void-public-earn-proxy-v2-edge-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-loopback-connector-policy-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_loopback_connector_policy_v1.mjs"
      - "scripts/prove_void_cloudflare_origin_proxy_v2_runtime_v1.mjs"
      - "ops/public/void-public-443-proxy-v2-dispatcher-v1.mjs"
      - "tools/void-agent-paid-work-credential-request-downstream-isolation-policy-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_downstream-isolation-policy-v1.mjs"
      - "tools/void-public-earn-loopback-isolation-policy-v1.mjs"
      - "scripts/prove_public_earn_loopback_isolation_policy_v1.mjs"
      - "scripts/compose_first_public_earn_tunnel_overlay_v1.mjs"
      - "ops/mainnet0/install-first-public-earn-tunnel-overlay-v1.sh"
      - ".github/workflows/cloudflare-origin-loopback-isolation-policy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: cloudflare isolation policy / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove Cloudflare local isolation policy
        run: |
          set -euo pipefail
          node --check tools/void-cloudflare-origin-loopback-isolation-policy-v1.mjs
          node --check scripts/prove_void_cloudflare_origin_loopback_isolation_policy_v1.mjs
          proof="$RUNNER_TEMP/cloudflare-origin-loopback-isolation-policy-v1.txt"
          node scripts/prove_void_cloudflare_origin_loopback_isolation_policy_v1.mjs | tee "$proof"
          grep -Fx 'VOID_CLOUDFLARE_ORIGIN_LOOPBACK_ISOLATION_POLICY_V1_GREEN' "$proof"
          grep -Fx 'dedicated_system_cloudflared_identity_required=true' "$proof"
          grep -Fx 'historical_user_tunnel_retirement_required=true' "$proof"
          grep -Fx 'exact_sensitive_tunnel_routes_qualified=true' "$proof"
          grep -Fx 'sensitive_origin_http_host_header_bound=true' "$proof"
          grep -Fx 'sensitive_origin_chunked_encoding_disabled_required=true' "$proof"
          grep -Fx 'ordinary_tunnel_routes_preserved_required=true' "$proof"
          grep -Fx 'cloudflare_control_plane_evidence_required=true' "$proof"
          grep -Fx 'cloudflared_to_adapter_policy_shape_qualified=true' "$proof"
          grep -Fx 'adapter_to_dispatcher_policy_shape_qualified=true' "$proof"
          grep -Fx 'closed_world_listener_sets_required=true' "$proof"
          grep -Fx 'noncloudflared_adapter_direct_connect_allowed=false' "$proof"
          grep -Fx 'nonadapter_dispatcher_direct_connect_allowed=false' "$proof"
          grep -Fx 'cloudflared_uid_isolation_proven=false' "$proof"
          grep -Fx 'tunnel_path_ownership_verified=false' "$proof"
          grep -Fx 'runtime_integration=false' "$proof"
          grep -Fx 'funds_movement=false' "$proof"

      - name: Re-prove merged Cloudflare runtime
        run: node scripts/prove_void_cloudflare_origin_proxy_v2_runtime_v1.mjs

      - name: Re-prove credential downstream isolation
        run: |
          node scripts/prove_agent_paid_work_credential_request_loopback_connector_policy_v1.mjs
          node scripts/prove_agent_paid_work_credential_request_downstream-isolation-policy-v1.mjs

      - name: Re-prove Public Earn downstream isolation
        run: node scripts/prove_public_earn_loopback_isolation_policy_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck -- --pretty false

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "${BASE:-}" ]; then
            BASE="$(git rev-parse "$HEAD^1")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
