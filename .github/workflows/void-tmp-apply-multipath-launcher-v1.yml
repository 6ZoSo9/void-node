name: temporary apply multipath launcher v1

on:
  push:
    branches:
      - feat/multipath-public-bootstrap-launcher-v1-20260811

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feat/multipath-public-bootstrap-launcher-v1-20260811
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          base64 -d .github/void-tmp-multipath-patch-v1.b64 | gzip -d > /tmp/multipath.patch
          git apply --check /tmp/multipath.patch
          git apply /tmp/multipath.patch
          printf '%s  %s\n' \
            bd1893112db6bd5f3bcf190a8cd231728e07ffb7215e2b3a796da53a7480dbdb run-void-node.sh \
            c0f2311a330bff4524231a74628de9ac30d85ca91f19978481bd42ff23ff1f6a scripts/resolve_void_public_bootstrap_v1.mjs \
            | sha256sum --check --strict -
          bash -n run-void-node.sh
          node --check scripts/resolve_void_public_bootstrap_v1.mjs
          node --check scripts/lib/void_multipath_public_bootstrap_supervisor_v1.mjs
          node --check scripts/run_void_multipath_public_bootstrap_supervisor_v1.mjs
          node --check scripts/prove_void_multipath_public_bootstrap_supervisor_v1.mjs
          node scripts/prove_void_multipath_public_bootstrap_supervisor_v1.mjs
          git diff --check

      - name: Retire temporary carrier and publish source commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/void-tmp-multipath-patch-v1.b64 \
            .github/workflows/void-tmp-apply-multipath-launcher-v1.yml
          git add -- run-void-node.sh scripts/resolve_void_public_bootstrap_v1.mjs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            .github/void-tmp-multipath-patch-v1.b64
            .github/workflows/void-tmp-apply-multipath-launcher-v1.yml
            run-void-node.sh
            scripts/resolve_void_public_bootstrap_v1.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --cached --check
          git config user.name 'VOID GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: compose multipath public bootstrap launcher v1'
          git push origin HEAD:feat/multipath-public-bootstrap-launcher-v1-20260811
