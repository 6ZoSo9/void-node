name: void-tor-order-status-onion-readonly-v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-tor-order-status-onion-readonly-v1.yml"
      - "config/void-tor-capability-parity-v1.json"
      - "docs/public-node/void-tor-capability-parity-v1.md"
      - "docs/public-node/void-tor-order-status-onion-readonly-v1.md"
      - "scripts/prove_void_tor_capability_parity_v1.mjs"
      - "scripts/prove_void_tor_order_status_onion_readonly_v1.mjs"
      - "tools/void-tor-onion-public-node-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-route-contract-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-source-resolver-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-request-handler-v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-tor-order-status-onion-readonly-v1.yml"
      - "config/void-tor-capability-parity-v1.json"
      - "docs/public-node/void-tor-capability-parity-v1.md"
      - "docs/public-node/void-tor-order-status-onion-readonly-v1.md"
      - "scripts/prove_void_tor_capability_parity_v1.mjs"
      - "scripts/prove_void_tor_order_status_onion_readonly_v1.mjs"
      - "tools/void-tor-onion-public-node-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-route-contract-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-source-resolver-v1.mjs"
      - "tools/void-public-agent-service-order-status-readonly-request-handler-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/prove_void_tor_order_status_onion_readonly_v1.mjs
      - run: python3 scripts/validate_void_tor_capability_parity_v1.py
      - run: node scripts/prove_void_tor_capability_parity_v1.mjs
