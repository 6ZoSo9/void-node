name: VOID DataNet registry exact single broadcast execution v1

on:
  pull_request:
    paths:
      - "tools/void-datanet-registry-*.mjs"
      - "tools/datanet-content-commitment-*.mjs"
      - "tools/void-economic-epoch2-*.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/precision/void-datanet-registry-exact-single-broadcast-execution-v1.mjs"
      - "scripts/prove_void_datanet_registry_exact_single_broadcast_execution_v1.mjs"
      - ".github/workflows/void-datanet-registry-exact-single-broadcast-execution-v1.yml"
      - "docs/operators/datanet-registry-exact-single-broadcast-execution-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          set -euo pipefail
          node --check tools/void-datanet-registry-exact-single-broadcast-execution-v1.mjs
          node --check ops/precision/void-datanet-registry-exact-single-broadcast-execution-v1.mjs
          node --check scripts/prove_void_datanet_registry_exact_single_broadcast_execution_v1.mjs
      - name: Prove exact single broadcast execution
        run: |
          set -euo pipefail
          node scripts/prove_void_datanet_registry_exact_single_broadcast_execution_v1.mjs
      - name: Diff and cleanup hygiene
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
