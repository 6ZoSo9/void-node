name: VOID Signed Onion External Verification V1

on:
  pull_request:
    paths:
      - '.github/workflows/void-signed-onion-external-verification-v1.yml'
      - 'docs/public-node/void-signed-onion-external-verification-v1.md'
      - 'public/public-node/evidence/void-node-onion-binding-v1-nimo-verified.json'
      - 'public/public-node/evidence/void-tor-onion-transport-v1-nimo-verified.json'
      - 'public/public-node/index.json'
      - 'public/public-node/void-signed-onion-external-verification-v1.html'
      - 'public/public-node/void-signed-onion-external-verification-v1.json'
      - 'schemas/void-signed-onion-external-verification-v1.schema.json'
      - 'scripts/prove_void_signed_onion_external_verification_v1.mjs'
      - 'tools/verify_void_signed_onion_external_v1.mjs'
  push:
    paths:
      - '.github/workflows/void-signed-onion-external-verification-v1.yml'
      - 'docs/public-node/void-signed-onion-external-verification-v1.md'
      - 'public/public-node/evidence/void-node-onion-binding-v1-nimo-verified.json'
      - 'public/public-node/evidence/void-tor-onion-transport-v1-nimo-verified.json'
      - 'public/public-node/index.json'
      - 'public/public-node/void-signed-onion-external-verification-v1.html'
      - 'public/public-node/void-signed-onion-external-verification-v1.json'
      - 'schemas/void-signed-onion-external-verification-v1.schema.json'
      - 'scripts/prove_void_signed_onion_external_verification_v1.mjs'
      - 'tools/verify_void_signed_onion_external_v1.mjs'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/verify_void_signed_onion_external_v1.mjs
      - run: node --check scripts/prove_void_signed_onion_external_verification_v1.mjs
      - run: node scripts/prove_void_signed_onion_external_verification_v1.mjs
