name: Authenticated paid-work runtime listener cgroup operator collector v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.yml"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.md"
      - "scripts/prove_authenticated_paid_work_runtime_listener_cgroup_operator_collector_v1.mjs"
      - "tools/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.mjs"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.yml"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.md"
      - "scripts/prove_authenticated_paid_work_runtime_listener_cgroup_operator_collector_v1.mjs"
      - "tools/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.mjs"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs"

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check tools/authenticated-paid-work-runtime-listener-cgroup-operator-collector-v1.mjs
          node --check scripts/prove_authenticated_paid_work_runtime_listener_cgroup_operator_collector_v1.mjs
      - name: Prove read-only collector
        run: node scripts/prove_authenticated_paid_work_runtime_listener_cgroup_operator_collector_v1.mjs
      - name: Typecheck repository
        run: npm run typecheck
