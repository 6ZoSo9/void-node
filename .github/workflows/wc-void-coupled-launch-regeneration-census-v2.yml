  pull_request:
    paths:
      - ".github/workflows/wc-void-coupled-launch-regeneration-census-v2.yml"
      - "tools/void-wc-void-coupled-launch-regeneration-census-v2.mjs"
      - "src/index.ts"
      - "scripts/prove_void_wc_void_coupled_launch_regeneration_census_v2.mjs"
      - "docs/operators/wc-void-coupled-launch-regeneration-census-v2.md"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-correction-v2.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-current-binding-v2.json"
      - "tools/void-wc-void-market-vault-compiled-identity-current-v2.mjs"
      - "scripts/prove_void_wc_void_market_vault_compiled_identity_current_v2.mjs"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "tools/void-wc-void-market-vault-compiled-identity-correction-v2.mjs"
