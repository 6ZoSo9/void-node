name: Apollyon protected-store first-host evidence plan V1

on:
  pull_request:
    paths:
      - "ops/security/apollyon-protected-store-first-host-evidence-plan-v1.json"
      - "scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py"
      - "docs/security/apollyon-protected-store-first-host-evidence-plan-v1.md"
      - ".github/workflows/apollyon-protected-store-first-host-evidence-plan-v1.yml"
      - "tools/apollyon-training-start-protected-store-revalidator-contract-v2.mjs"
      - "scripts/prove_apollyon_training_start_protected_store_revalidator_contract_v2.mjs"
      - "docs/security/apollyon-training-start-protected-store-revalidator-contract-v2.md"
      - ".github/workflows/apollyon-training-start-protected-store-revalidator-contract-v2.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parent and four-file source-only scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PARENT=3706aecf2e258c9c7021137da05428187bbe6654
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/apollyon-protected-store-first-host-evidence-plan-v1.yml' \
            'docs/security/apollyon-protected-store-first-host-evidence-plan-v1.md' \
            'ops/security/apollyon-protected-store-first-host-evidence-plan-v1.json' \
            'scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py' \
            | LC_ALL=C sort > "$expected"
          git diff --no-renames --name-only "$PARENT" HEAD -- | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/apollyon-protected-store-first-host-evidence-plan-v1.json)" = 6ff56be54c33b60e66c1441f0fe1939fb48f8586
          test "$(git rev-parse HEAD:scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py)" = 120d399c140a0e1f8a65f581f4240f5b058012e0
          test "$(git rev-parse HEAD:docs/security/apollyon-protected-store-first-host-evidence-plan-v1.md)" = 671ded6ae9549e7cba911e7869e272e49553fff0

          test "$(git rev-parse HEAD:tools/apollyon-training-start-protected-store-revalidator-contract-v2.mjs)" = 4c78459826c25cab43870b0b322b566575d18667
          test "$(git rev-parse HEAD:scripts/prove_apollyon_training_start_protected_store_revalidator_contract_v2.mjs)" = 2e919af52e44c6dcfec41dc47567a73f658874c3
          test "$(git rev-parse HEAD:docs/security/apollyon-training-start-protected-store-revalidator-contract-v2.md)" = 9f5a94967abd85d81d6f693bf6ff51d086623de9
          test "$(git rev-parse HEAD:.github/workflows/apollyon-training-start-protected-store-revalidator-contract-v2.yml)" = 2774c5f9c3d037cfbd32c15d4af05cb640199ae1

          git diff --check "$PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile source proof without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          name = "scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py"
          compile(Path(name).read_text("utf-8"), name, "exec", dont_inherit=True)
          print("plan_python_syntax_green=true")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove source-only first-host boundary
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apollyon-first-host-plan.txt"
          python3 -I -B scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py --self-test | tee "$out"

          for marker in \
            'VOID_APOLLYON_PROTECTED_STORE_FIRST_HOST_EVIDENCE_PLAN_V1_PROOF_GREEN' \
            'plan_id=voidapollyonfirsthostplan1_be2b83c33630bce1e9bc635cbdd90981f55df38ab0e929706acd4cd7798015ca' \
            'parent_pr=3743' \
            'parent_head=3706aecf2e258c9c7021137da05428187bbe6654' \
            'parent_blob_count=4' \
            'first_pass_requirement_count=39' \
            'negative_authority_count=16' \
            'rejected_adversaries=65' \
            'hosted_candidate_identity_bound=true' \
            'machine_identity_binding_required=true' \
            'machine_identity_bound=false' \
            'duplicate_json_keys_rejected=true' \
            'cross_node_candidate_evidence_bound=true' \
            'read_only_metadata_safe_first_pass_required=true' \
            'protected_record_contents_read_forbidden=true' \
            'process_environment_read_forbidden=true' \
            'raw_process_args_read_forbidden=true' \
            'host_read_performed=false' \
            'filesystem_mutation=false' \
            'service_mutation=false' \
            'writer_capability_created=false' \
            'claim_publication=false' \
            'training_execution=false' \
            'credential_access=false' \
            'transaction=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

          python3 -I -B scripts/prove_apollyon_protected_store_first_host_evidence_plan_v1.py --run > "$RUNNER_TEMP/run.txt"
          grep -Fx 'VOID_APOLLYON_PROTECTED_STORE_FIRST_HOST_EVIDENCE_PLAN_V1_PROOF_GREEN' "$RUNNER_TEMP/run.txt"
          grep -Fx 'host_read_performed=false' "$RUNNER_TEMP/run.txt"
          grep -Fx 'machine_identity_bound=false' "$RUNNER_TEMP/run.txt"
          grep -Fx 'duplicate_json_keys_rejected=true' "$RUNNER_TEMP/run.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
