name: Buy VOID inventory directory fsync fail-closed v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_inventory_reservation_journal_v1.ts"
      - "scripts/prove_buy_void_inventory_reservation_journal_v1.ts"
      - "scripts/prove_buy_void_inventory_directory_fsync_fail_closed_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/buy-void-inventory-directory-fsync-fail-closed-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_inventory_reservation_journal_v1.ts"
      - "scripts/prove_buy_void_inventory_reservation_journal_v1.ts"
      - "scripts/prove_buy_void_inventory_directory_fsync_fail_closed_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - ".github/workflows/buy-void-inventory-directory-fsync-fail-closed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck focused source and proofs
        run: |
          npx --no-install tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck \
            src/economic/buy_void_inventory_reservation_journal_v1.ts \
            scripts/prove_buy_void_inventory_reservation_journal_v1.ts \
            scripts/prove_buy_void_inventory_directory_fsync_fail_closed_v1.ts
      - name: Prove canonical inventory reservation journal
        run: npx --no-install tsx scripts/prove_buy_void_inventory_reservation_journal_v1.ts
      - name: Prove directory fsync failures fail closed and recover
        run: npx --no-install tsx scripts/prove_buy_void_inventory_directory_fsync_fail_closed_v1.ts
      - name: Prove committed-range diff hygiene helper
        if: matrix.node == '24'
        run: node scripts/prove_ci_diff_hygiene_v1.mjs
      - name: Diff hygiene (pull request)
        if: matrix.node == '24' && github.event_name == 'pull_request'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
      - name: Diff hygiene (push)
        if: matrix.node == '24' && github.event_name == 'push'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
      - name: Diff hygiene (manual)
        if: matrix.node == '24' && github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^ HEAD
