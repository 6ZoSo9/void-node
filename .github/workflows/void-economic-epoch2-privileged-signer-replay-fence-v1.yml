name: VOID economic epoch2 privileged signer replay fence v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/economic-epoch2-privileged-signer-replay-fence-v1.json"
      - "scripts/prove_void_economic_epoch2_privileged_signer_replay_fence_v1.mjs"
      - "docs/operators/economic-epoch2-privileged-signer-replay-fence-v1.md"
      - "ops/mainnet0/economic-epoch2-ceremony-role-map-v1.json"
      - "ops/mainnet0/economic-genesis-archive-authority-census-v1.json"
      - "ops/mainnet0/economic-epoch2-account-nonce-continuity-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-signed-artifact-census-closeout-v1.json"
      - "ops/mainnet/mainnet0-ops-treasury-seed-live.20260524-115943.md"
      - "docs/public/public-node-wc-to-void-redacted-settlement-receipt-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - ".github/workflows/void-economic-epoch2-privileged-signer-replay-fence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove privileged signer replay fence
        run: |
          node --check scripts/prove_void_economic_epoch2_privileged_signer_replay_fence_v1.mjs
          node scripts/prove_void_economic_epoch2_privileged_signer_replay_fence_v1.mjs

      - name: Diff hygiene
        run: git diff --check
