name: VOID P2P authenticated reconnect stability v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-p2p-authenticated-reconnect-stability-v1.yml"
      - "scripts/prove_follower_legacy_v2fs_and_duplicate_dial_v1.mjs"
      - "src/node_core.ts"
      - "src/p2p/authenticated_duplicate_arbitration_v1.ts"
      - "src/p2p/authenticated_reconnect_backoff_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-p2p-authenticated-reconnect-stability-v1.yml"
      - "scripts/prove_follower_legacy_v2fs_and_duplicate_dial_v1.mjs"
      - "src/node_core.ts"
      - "src/p2p/authenticated_duplicate_arbitration_v1.ts"
      - "src/p2p/authenticated_reconnect_backoff_v1.ts"
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source SHA to verify
        required: true
        type: string
      expected_base_sha:
        description: Exact committed-range base SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: void-p2p-authenticated-reconnect-stability-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact manual-dispatch source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          echo "manual_dispatch_source_bound=true"
          echo "manual_dispatch_base_bound=true"

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove authenticated duplicate and reconnect stability
        run: node scripts/prove_follower_legacy_v2fs_and_duplicate_dial_v1.mjs

      - name: Verify source tree cleanliness
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "source_tree_clean_after_proof=true"
