name: External agent credential request packet V1

on:
  pull_request:
    paths:
      - ".github/workflows/external-agent-credential-request-packet-v1.yml"
      - "public/agent-paid-work/credential-request/v1/**"
      - "scripts/prove_external_agent_credential_request_packet_v1.py"
      - "scripts/agent_paid_work_credential_request_intake_v1.ts"
      - "scripts/prove_agent_paid_work_credential_request_gateway_v1.ts"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prove public credential request packet
        run: python3 scripts/prove_external_agent_credential_request_packet_v1.py

      - name: Regress credential request gateway
        run: npx tsx scripts/prove_agent_paid_work_credential_request_gateway_v1.ts

      - name: Build
        run: npm run build
