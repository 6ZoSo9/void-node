name: chain2050-role-authority-sovereign-genesis-append-preflight-evidence-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-sovereign-genesis-append-preflight-evidence-v1.json"
      - "tools/chain2050-role-authority-sovereign-genesis-append-preflight-evidence-v1.mjs"
      - "scripts/prove_chain2050_role_authority_sovereign_genesis_append_preflight_evidence_v1.mjs"
      - "docs/security/chain2050-role-authority-sovereign-genesis-append-preflight-evidence-v1.md"
      - ".github/workflows/chain2050-role-authority-sovereign-genesis-append-preflight-evidence-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_sovereign_genesis_append_preflight_evidence_v1.mjs | tee "$RUNNER_TEMP/preflight-evidence.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_SOVEREIGN_GENESIS_APPEND_PREFLIGHT_EVIDENCE_V1_GREEN' "$RUNNER_TEMP/preflight-evidence.log"
          grep -Fx 'preflight_evidence_id=voidcrasgap1_a0af95011a1fb726b057fe1ff4ecf0b31b7529a95881821383adafed878f8812' "$RUNNER_TEMP/preflight-evidence.log"
          grep -Fx 'chain2050_write=false' "$RUNNER_TEMP/preflight-evidence.log"
      - run: git diff --check
