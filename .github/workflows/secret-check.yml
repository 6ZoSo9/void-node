name: secret-check
on: [push, pull_request]
jobs:
  grep-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Block obvious private key material
        shell: bash
        run: |
          set -euo pipefail
          # Only flag real PEM headers that appear as standalone lines in diffs
          # and JSON fields that begin a line (not regex text embedded in YAML).
          PAT='^(\+|\s)?-----BEGIN (ENCRYPTED |OPENSSH |EC |RSA |DSA |ED25519 )?PRIVATE KEY-----$|"privateKey"[[:space:]]*:[[:space:]]*"'
          git log -n 200 -p -- . \
            ':!*.png' ':!*.jpg' ':!*.gif' ':!*.pdf' \
            ':!.github/**' \
          | grep -Eq -- "$PAT" \
            && { echo "Secret-like material found in recent history"; exit 1; } || true
