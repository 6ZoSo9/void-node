name: secret-check
on: [push, pull_request]
jobs:
  grep-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block obvious private key material
        shell: bash
        run: |
          set -euo pipefail
          # Scan last 200 commits (full repo) and fail if obvious keys appear
          if git log -n 200 -p -- . ':!*.png' ':!*.jpg' ':!*.gif' ':!*.pdf' \
            | grep -Eq -- '-----BEGIN (ENCRYPTED |OPENSSH |EC |RSA |DSA |ED25519 )?PRIVATE KEY-----|"privateKey"[[:space:]]*:[[:space:]]*"'; then
            echo "Secret-like material found in recent history"
            exit 1
          fi
