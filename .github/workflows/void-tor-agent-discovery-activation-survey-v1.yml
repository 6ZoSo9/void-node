name: void-tor-agent-discovery-activation-survey-v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-tor-agent-discovery-activation-survey-v1.yml"
      - "docs/operations/void-tor-agent-discovery-activation-survey-v1.md"
      - "ops/mainnet0/survey_void_tor_agent_discovery_activation_v1.py"
      - "config/void-tor-agent-discovery-parity-v1.json"
      - "public/.well-known/void-public-node.json"
      - "public/public-node/agent-paid-work-public-discovery-v1.json"
      - "scripts/prove_void_tor_agent_discovery_parity_v1.mjs"
      - "tools/build_void_tor_agent_discovery_parity_v1.mjs"
      - "tools/void-tor-onion-public-node-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-tor-agent-discovery-activation-survey-v1.yml"
      - "docs/operations/void-tor-agent-discovery-activation-survey-v1.md"
      - "ops/mainnet0/survey_void_tor_agent_discovery_activation_v1.py"
      - "config/void-tor-agent-discovery-parity-v1.json"
      - "public/.well-known/void-public-node.json"
      - "public/public-node/agent-paid-work-public-discovery-v1.json"
      - "scripts/prove_void_tor_agent_discovery_parity_v1.mjs"
      - "tools/build_void_tor_agent_discovery_parity_v1.mjs"
      - "tools/void-tor-onion-public-node-v1.mjs"

permissions:
  contents: read

concurrency:
  group: void-tor-agent-discovery-activation-survey-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m py_compile ops/mainnet0/survey_void_tor_agent_discovery_activation_v1.py
      - run: python3 ops/mainnet0/survey_void_tor_agent_discovery_activation_v1.py self-test
      - name: Prove exact source without inspecting a live service
        run: |
          EXPECTED_HEAD="$(git rev-parse HEAD)"
          python3 ops/mainnet0/survey_void_tor_agent_discovery_activation_v1.py source \
            --repo-root . \
            --expected-head "$EXPECTED_HEAD"
