name: Buy VOID Epoch-2 live composition native lock v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v2.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-v2.json"
      - "ops/security/buy-void-epoch2-live-composition-native-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_lock_v2.mjs"
      - "docs/operators/buy-void-epoch2-live-composition-native-lock-v2.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-lock-v2.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v2.yml"
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-v2.json"
      - "ops/security/buy-void-epoch2-live-composition-native-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_lock_v2.mjs"
      - "docs/operators/buy-void-epoch2-live-composition-native-lock-v2.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-lock-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Require exact five-file PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-native-lock-v2.yml' \
            'docs/operators/buy-void-epoch2-live-composition-native-lock-v2.md' \
            'ops/security/buy-void-epoch2-live-composition-native-candidate-v2.json' \
            'ops/security/buy-void-epoch2-live-composition-native-lock-v2.json' \
            'scripts/prove_buy_void_epoch2_live_composition_native_lock_v2.mjs' \
            | sort > "$expected"
          git diff --name-only "$BASE_SHA" HEAD -- | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$BASE_SHA" HEAD

      - name: Rederive exact candidate and acceptance lock
        run: |
          set -euo pipefail
          proof=scripts/prove_buy_void_epoch2_live_composition_native_lock_v2.mjs
          out="$RUNNER_TEMP/epoch2-native-lock-v2-${{ matrix.node }}.json"

          node "$proof" --self-test | tee "$RUNNER_TEMP/native-lock-v2-proof.log"
          markers=(
            "VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_LOCK_V2_GREEN"
            "lock_id=voidbuye2livecompnativelock2_32261e9f34a132269b9d65a3cc14723938e00a7a6fc4ff08888861afcc50fbd3"
            "native_binary_sha256=78a5159f7286dd107cb34568fe12e9758563123e8bda8c8cccc96eaf6c37c589"
            "runner_sha256=2ba779e98b76cd24c6b24de38b77dfded5ce7dd35869b8dd99490d3aa653af73"
            "candidate_accepted=true"
            "install_authorized=false"
            "live_execution_authorized=false"
            "credential_access=false"
            "private_key_access=false"
            "transaction=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$RUNNER_TEMP/native-lock-v2-proof.log"
          done

          node "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-epoch2-live-composition-native-lock-v2.json

      - name: Re-run complete source trust proof on Node 24
        if: matrix.node == 24
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-source-trust-proof.log"
          node scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs |
            tee "$out"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_NATIVE_PREENTRY_V1_PROOF_GREEN' "$out"
          grep -Fx 'native_first_instruction=true' "$out"
          grep -Fx 'native_parent_retained_for_child_lifetime=true' "$out"
          grep -Fx 'native_parent_revalidated_after_sensitive_sequence=true' "$out"
          grep -Fx 'caller_stdin_javascript_rejected_before_root_js=true' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-live-composition-native-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/epoch2-native-lock-v2-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-epoch2-live-composition-native-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks

      - name: Require exact cross-node lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "locks/epoch2-native-lock-v2-$node.json"
          done
          cmp locks/epoch2-native-lock-v2-22.json locks/epoch2-native-lock-v2-24.json
          cmp locks/epoch2-native-lock-v2-22.json locks/epoch2-native-lock-v2-26.json
          grep -F '"lock_id": "voidbuye2livecompnativelock2_32261e9f34a132269b9d65a3cc14723938e00a7a6fc4ff08888861afcc50fbd3"' \
            locks/epoch2-native-lock-v2-22.json
          echo VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_LOCK_V2_CROSS_NODE_GREEN
