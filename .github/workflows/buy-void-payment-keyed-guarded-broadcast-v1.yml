name: Buy VOID payment-keyed guarded broadcast v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-guarded-broadcast-v1.yml"
      - "src/economic/buy_void_payment_keyed_guarded_broadcast_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_guarded_broadcast_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-guarded-broadcast-v1.md"
      - "src/economic/buy_void_payment_keyed_custodian_broadcast_v1.ts"
      - "src/economic/buy_void_payment_keyed_custodian_signer_v1.ts"
      - "src/economic/buy_void_payment_keyed_preparation_custody_v1.ts"
      - "src/economic/buy_void_payment_keyed_plan_reservation_v1.ts"
      - "src/economic/buy_void_saga_broadcast_evidence_journal_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "schemas/buy-void-crash-consistent-fulfillment-saga-v1.schema.json"
      - "docs/operators/buy-void-crash-consistent-fulfillment-saga-v1.md"
      - "docs/operators/buy-void-saga-broadcast-reconciliation-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-payment-keyed-guarded-broadcast-v1.yml"
      - "src/economic/buy_void_payment_keyed_guarded_broadcast_v1.ts"
      - "scripts/prove_buy_void_payment_keyed_guarded_broadcast_v1.ts"
      - "docs/architecture/buy-void-payment-keyed-guarded-broadcast-v1.md"
      - "src/economic/buy_void_payment_keyed_custodian_broadcast_v1.ts"
      - "src/economic/buy_void_payment_keyed_custodian_signer_v1.ts"
      - "src/economic/buy_void_payment_keyed_preparation_custody_v1.ts"
      - "src/economic/buy_void_payment_keyed_plan_reservation_v1.ts"
      - "src/economic/buy_void_saga_broadcast_evidence_journal_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcast_custody_v1.ts"
      - "src/economic/buy_void_pipeline_coordinator_v1.ts"
      - "tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs"
      - "schemas/buy-void-crash-consistent-fulfillment-saga-v1.schema.json"
      - "docs/operators/buy-void-crash-consistent-fulfillment-saga-v1.md"
      - "docs/operators/buy-void-saga-broadcast-reconciliation-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Typecheck and prove payment-keyed guarded broadcast
        run: |
          set -euo pipefail
          node --check tools/buy-void-crash-consistent-fulfillment-saga-v1.mjs
          npx tsc -p tsconfig.json --noEmit
          npm run build
          node --import tsx scripts/prove_buy_void_payment_keyed_guarded_broadcast_v1.ts | tee "$RUNNER_TEMP/guarded-coordinator-admission.log"
          grep -Fx 'VOID_BUY_VOID_PAYMENT_KEYED_GUARDED_BROADCAST_V1_PROOF_GREEN' "$RUNNER_TEMP/guarded-coordinator-admission.log"
          grep -Fx 'VOID_BUY_VOID_GUARDED_COORDINATOR_ADMISSION_V1_GREEN' "$RUNNER_TEMP/guarded-coordinator-admission.log"
          grep -Fx 'coordinator_admission_cases=28' "$RUNNER_TEMP/guarded-coordinator-admission.log"
          grep -Fx 'VOID_BUY_VOID_GUARDED_PREPARED_STATE_REVALIDATION_V1_GREEN' "$RUNNER_TEMP/guarded-coordinator-admission.log"
          grep -Fx 'prepared_state_revalidation_cases=47' "$RUNNER_TEMP/guarded-coordinator-admission.log"
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022 --types node --esModuleInterop --allowSyntheticDefaultImports --downlevelIteration --skipLibCheck scripts/prove_buy_void_*.ts
          git diff --check
