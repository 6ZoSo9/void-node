name: VOID public seed WireGuard continuity packet v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-seed-wireguard-continuity-packet-v1.yml"
      - "docs/public/public-seed-wireguard-continuity-packet-v1.md"
      - "scripts/build_void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/lib/void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/prove_void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/verify_void_public_seed_wireguard_continuity_packet_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-seed-wireguard-continuity-packet-v1.yml"
      - "docs/public/public-seed-wireguard-continuity-packet-v1.md"
      - "scripts/build_void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/lib/void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/prove_void_public_seed_wireguard_continuity_packet_v1.mjs"
      - "scripts/verify_void_public_seed_wireguard_continuity_packet_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-public-seed-wireguard-continuity-packet-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packet-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check scripts/lib/void_public_seed_wireguard_continuity_packet_v1.mjs
          node --check scripts/build_void_public_seed_wireguard_continuity_packet_v1.mjs
          node --check scripts/verify_void_public_seed_wireguard_continuity_packet_v1.mjs
          node --check scripts/prove_void_public_seed_wireguard_continuity_packet_v1.mjs

      - name: Prove WireGuard continuity packet
        run: node scripts/prove_void_public_seed_wireguard_continuity_packet_v1.mjs

  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
