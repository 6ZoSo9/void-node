name: Buy VOID allocation custody rollback controller candidate V2
on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-allocation-custody-rollback-controller-candidate-v2.yml"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs"
      - "scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v2.mjs"
      - "docs/architecture/buy-void-allocation-custody-rollback-controller-candidate-v2.md"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs"

permissions:
  contents: read

jobs:
  proof:
    name: V2 isolated controller proof Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Validate syntax without source imports
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs
          node --check scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v2.mjs
      - name: V2 sequence, authorization-namespace isolation and false authority
        env:
          HOME: /nonexistent
          TZ: UTC
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v2.mjs
      - name: Diff hygiene
        run: git diff --check
