name: VOID PR1116 preflight import isolation repair v1

on:
  push:
    branches:
      - feat/buy-void-production-preflight-operator-entrypoint-v1-20260808
    paths:
      - ".github/workflows/void-pr1116-preflight-import-isolation-repair-v1.yml"

permissions:
  contents: write

concurrency:
  group: void-pr1116-preflight-import-isolation-repair-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/buy-void-production-preflight-operator-entrypoint-v1-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Guard exact helper parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0f6b37f1864200bb4b172690bfd8388df1669979"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/void-pr1116-preflight-import-isolation-repair-v1.yml"
      - name: Isolate preflight library import from dependency injector startup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("src/economic/buy_void_native_execution_runtime_v1.ts")
          text = runtime.read_text(encoding="utf-8")
          side_effect = 'import "./buy_void_native_delivery_runtime_dependencies_v1.js";\n'
          if text.count(side_effect) != 1:
              raise SystemExit(f"unexpected native-runtime dependency side-effect import count: {text.count(side_effect)}")
          runtime.write_text(text.replace(side_effect, ""), encoding="utf-8")

          guard = Path("scripts/prove_buy_void_native_execution_runtime_guard_v1.ts")
          g = guard.read_text(encoding="utf-8")
          old_rel = '''const runtimeIntegrationRelative =
  "src/economic/buy_void_runtime_integration_v1.ts";'''
          new_rel = '''const runtimeIntegrationRelative =
  "src/economic/buy_void_runtime_integration_v1.ts";
const nativeDeliveryRuntimeIntegrationRelative =
  "src/economic/buy_void_native_delivery_runtime_integration_v1.ts";'''
          if g.count(old_rel) != 1:
              raise SystemExit("runtime integration relative anchor mismatch")
          g = g.replace(old_rel, new_rel)
          old_list = '''  runtimeRelative,
  runtimeIntegrationRelative,
  plannerProofRelative,'''
          new_list = '''  runtimeRelative,
  runtimeIntegrationRelative,
  nativeDeliveryRuntimeIntegrationRelative,
  plannerProofRelative,'''
          if g.count(old_list) != 1:
              raise SystemExit("guard file-list anchor mismatch")
          g = g.replace(old_list, new_list)
          old_read = '''const runtimeIntegration = fs.readFileSync(
  path.join(root, runtimeIntegrationRelative),
  "utf8",
);'''
          new_read = '''const runtimeIntegration = fs.readFileSync(
  path.join(root, runtimeIntegrationRelative),
  "utf8",
);
const nativeDeliveryRuntimeIntegration = fs.readFileSync(
  path.join(root, nativeDeliveryRuntimeIntegrationRelative),
  "utf8",
);'''
          if g.count(old_read) != 1:
              raise SystemExit("guard read anchor mismatch")
          g = g.replace(old_read, new_read)
          old_assert = '''assert.match(
  runtime,
  /buy_void_native_delivery_runtime_dependencies_v1\\.js/,
);'''
          new_assert = '''assert.doesNotMatch(
  runtime,
  /buy_void_native_delivery_runtime_dependencies_v1\\.js/,
);
assert.match(
  nativeDeliveryRuntimeIntegration,
  /import "\\.\\/buy_void_native_delivery_runtime_dependencies_v1\\.js";/,
);
assert.ok(
  runtimeIntegration.indexOf(
    'import "./buy_void_native_delivery_runtime_integration_v1.js";',
  ) <
    runtimeIntegration.indexOf(
      'import "./buy_void_native_execution_runtime_v1.js";',
    ),
);'''
          if g.count(old_assert) != 1:
              raise SystemExit("dependency import guard anchor mismatch")
          guard.write_text(g.replace(old_assert, new_assert), encoding="utf-8")

          proof = Path("scripts/prove_buy_void_production_preflight_operator_v1.ts")
          p = proof.read_text(encoding="utf-8")
          old_proof = '''  assert.equal(
    (runtimeSource.match(/buyVoidNativeExecutionRuntimePolicyStateV1\\(\\)/g) || []).length,
    3,
  );

  const cliSource = fs.readFileSync('''
          new_proof = '''  assert.equal(
    (runtimeSource.match(/buyVoidNativeExecutionRuntimePolicyStateV1\\(\\)/g) || []).length,
    3,
  );
  assert.doesNotMatch(
    runtimeSource,
    /buy_void_native_delivery_runtime_dependencies_v1\\.js/,
  );
  const nativeDeliveryRuntimeSource = fs.readFileSync(
    path.join(
      process.cwd(),
      "src/economic/buy_void_native_delivery_runtime_integration_v1.ts",
    ),
    "utf8",
  );
  assert.match(
    nativeDeliveryRuntimeSource,
    /import "\\.\\/buy_void_native_delivery_runtime_dependencies_v1\\.js";/,
  );

  const cliSource = fs.readFileSync('''
          if p.count(old_proof) != 1:
              raise SystemExit("operator proof import-isolation anchor mismatch")
          proof.write_text(p.replace(old_proof, new_proof), encoding="utf-8")

          workflow = Path(".github/workflows/buy-void-production-preflight-operator-v1.yml")
          w = workflow.read_text(encoding="utf-8")
          path_anchor = '      - "scripts/prove_buy_void_native_execution_runtime_v1.ts"\n'
          path_insert = path_anchor + '      - "scripts/prove_buy_void_native_execution_runtime_guard_v1.ts"\n'
          if w.count(path_anchor) != 2:
              raise SystemExit(f"workflow native-runtime proof path count mismatch: {w.count(path_anchor)}")
          w = w.replace(path_anchor, path_insert)
          step_anchor = '''      - name: Preserve native execution runtime
        run: npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
'''
          step_insert = step_anchor + '''      - name: Preserve native execution runtime import-isolation guard
        run: npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
'''
          if w.count(step_anchor) != 1:
              raise SystemExit("workflow native-runtime step anchor mismatch")
          workflow.write_text(w.replace(step_anchor, step_insert), encoding="utf-8")

          doc = Path("docs/operators/buy-void-production-preflight-operator-v1.md")
          d = doc.read_text(encoding="utf-8")
          doc_anchor = '''The existing status/command route continues to use that same function. The new
operator resolver imports it rather than duplicating its environment parsing.
'''
          doc_insert = doc_anchor + '''
The native-execution library itself does not import the credential/RPC dependency
initializer for side effects. Production parent runtime integration already loads
the native-delivery runtime first, and that runtime owns dependency initialization.
This keeps direct preflight/operator library imports from scheduling credential
reads or RPC identity probes while preserving the production runtime mount order.
'''
          if d.count(doc_anchor) != 1:
              raise SystemExit("operator doc import-isolation anchor mismatch")
          doc.write_text(d.replace(doc_anchor, doc_insert), encoding="utf-8")
          PY
          git diff --check -- \
            src/economic/buy_void_native_execution_runtime_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_guard_v1.ts \
            scripts/prove_buy_void_production_preflight_operator_v1.ts \
            .github/workflows/buy-void-production-preflight-operator-v1.yml \
            docs/operators/buy-void-production-preflight-operator-v1.md
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove production preflight operator
        run: npx --no-install tsx scripts/prove_buy_void_production_preflight_operator_v1.ts
      - name: Preserve native execution runtime and import isolation
        run: |
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
      - name: Preserve parent runtime integration
        run: npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
      - name: Preserve merged production preflight
        run: npx --no-install tsx scripts/prove_buy_void_production_live_canary_preflight_v1.ts
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Remove helper and verify final permanent scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/void-pr1116-preflight-import-isolation-repair-v1.yml
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          cat > "$expected" <<'EOF'
          .github/workflows/buy-void-production-preflight-operator-v1.yml
          docs/operators/buy-void-production-preflight-operator-v1.md
          scripts/buy_void_production_preflight_operator_v1.ts
          scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
          scripts/prove_buy_void_production_preflight_operator_v1.ts
          src/economic/buy_void_native_execution_runtime_v1.ts
          src/economic/buy_void_production_preflight_operator_v1.ts
          EOF
          git diff --name-only 7d2ea5a633b29d08432190543e2ff2d5a82ed082 | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check 7d2ea5a633b29d08432190543e2ff2d5a82ed082
      - name: Commit and normal fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/buy-void-production-preflight-operator-entrypoint-v1-20260808
          test "$(git rev-parse origin/feat/buy-void-production-preflight-operator-entrypoint-v1-20260808)" = "$(git rev-parse HEAD)"
          git config user.name "VOID guarded workflow"
          git config user.email "44710859+6ZoSo9@users.noreply.github.com"
          git add -- \
            src/economic/buy_void_native_execution_runtime_v1.ts \
            scripts/prove_buy_void_native_execution_runtime_guard_v1.ts \
            scripts/prove_buy_void_production_preflight_operator_v1.ts \
            .github/workflows/buy-void-production-preflight-operator-v1.yml \
            docs/operators/buy-void-production-preflight-operator-v1.md
          git status --short
          git commit -m "fix: isolate Buy VOID preflight imports from injector startup"
          git push origin HEAD:feat/buy-void-production-preflight-operator-entrypoint-v1-20260808
