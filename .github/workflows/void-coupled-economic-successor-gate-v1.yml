name: VOID coupled economic successor gate v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-coupled-economic-successor-gate-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-coupled-economic-successor-gate-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove epoch-2 coupled economic successor gate
        run: node scripts/prove_void_coupled_economic_successor_gate_v1.mjs
