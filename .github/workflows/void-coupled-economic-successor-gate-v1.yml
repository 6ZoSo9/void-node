name: VOID coupled economic successor gate v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "scripts/prove_void_wc_void_opening_participant_provenance_eligibility_v1.mjs"
      - "docs/operators/wc-void-opening-participant-provenance-eligibility-v1.md"
      - ".github/workflows/void-wc-void-opening-participant-provenance-eligibility-v1.yml"
      - "schemas/agent-paid-work-credential-wc-account-binding-registry-v1.schema.json"
      - "src/economic/agent_paid_work_wc_earning_adapter_v1.ts"
      - "scripts/prove_void_wc_void_opening_nonproduction_exclusion_v1.mjs"
      - "docs/operators/wc-void-opening-nonproduction-exclusion-v1.md"
      - ".github/workflows/void-wc-void-opening-nonproduction-exclusion-v1.yml"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "scripts/prove_void_shared_market_post_discovery_state_v2.mjs"
      - ".github/workflows/void-coupled-economic-successor-gate-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "scripts/prove_void_coupled_economic_successor_gate_v1.mjs"
      - "docs/operators/coupled-economic-successor-gate-v1.md"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "scripts/prove_void_wc_void_opening_participant_provenance_eligibility_v1.mjs"
      - "docs/operators/wc-void-opening-participant-provenance-eligibility-v1.md"
      - ".github/workflows/void-wc-void-opening-participant-provenance-eligibility-v1.yml"
      - "schemas/agent-paid-work-credential-wc-account-binding-registry-v1.schema.json"
      - "src/economic/agent_paid_work_wc_earning_adapter_v1.ts"
      - "scripts/prove_void_wc_void_opening_nonproduction_exclusion_v1.mjs"
      - "docs/operators/wc-void-opening-nonproduction-exclusion-v1.md"
      - ".github/workflows/void-wc-void-opening-nonproduction-exclusion-v1.yml"
      - "tools/void-shared-market-post-discovery-state-v2.mjs"
      - "scripts/prove_void_shared_market_post_discovery_state_v2.mjs"
      - ".github/workflows/void-coupled-economic-successor-gate-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 22
      - name: Prove epoch-2 coupled economic successor gate
        run: node scripts/prove_void_coupled_economic_successor_gate_v1.mjs
