name: Buy VOID Epoch-2 live fee chain qualification v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-live-fee-chain-qualification-v2.yml"
      - "ops/precision/void_buy_void_epoch2_live_fee_chain_qualification_v2.mjs"
      - "scripts/prove_buy_void_epoch2_live_fee_chain_qualification_v2.mjs"
      - "docs/operators/buy-void-epoch2-live-fee-chain-qualification-v2.md"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/runtime-observation.json"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-live-fee-chain-qualification-v2.yml"
      - "ops/precision/void_buy_void_epoch2_live_fee_chain_qualification_v2.mjs"
      - "scripts/prove_buy_void_epoch2_live_fee_chain_qualification_v2.mjs"
      - "docs/operators/buy-void-epoch2-live-fee-chain-qualification-v2.md"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v2.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "ops/mainnet0/production-epoch2-rpc-target-v1.json"
      - "ops/mainnet0/evidence/production-epoch2-rpc-selection-v1/runtime-observation.json"
      - "public/public-node/evidence/economic-epoch2-client-neutral-state-manifest-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-live-fee-chain-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax and inert qualification surfaces
        run: |
          set -euo pipefail
          node --check             ops/precision/void_buy_void_epoch2_live_fee_chain_qualification_v2.mjs
          node --check             scripts/prove_buy_void_epoch2_live_fee_chain_qualification_v2.mjs
          SOURCE="$(git show HEAD:ops/precision/void_buy_void_epoch2_live_fee_chain_qualification_v2.mjs)"
          printf '%s' "$SOURCE" | node --input-type=module - --self-test             | tee "$RUNNER_TEMP/self-test-${{ matrix.node }}.txt"
          printf '%s' "$SOURCE" | node --input-type=module - --plan             | tee "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx             'VOID_BUY_VOID_EPOCH2_LIVE_FEE_CHAIN_QUALIFICATION_V2_SELF_TEST_GREEN'             "$RUNNER_TEMP/self-test-${{ matrix.node }}.txt"
          grep -Fx 'runner_root_execution_forbidden=true'             "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx 'protected_v2_signer_control_child_required=true'             "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx 'transaction=false' "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/plan-${{ matrix.node }}.txt"

      - name: Prove fee and Chain-2050 semantics
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fee-chain-v2-${{ matrix.node }}.txt"
          node scripts/prove_buy_void_epoch2_live_fee_chain_qualification_v2.mjs             | tee "$OUT"
          for marker in             'VOID_BUY_VOID_EPOCH2_LIVE_FEE_CHAIN_QUALIFICATION_V2_PROOF_GREEN'             'runner_unprivileged=true'             'runner_root_execution_forbidden=true'             'protected_v2_signer_control_child_required=true'             'protected_first_entry_provenance_required=true'             'candidate_v2_fee_policy_bound=true'             'production_eth_gasPrice_semantics_mirrored=true'             'zero_fee_envelope_proven_inert=true'             'bounded_nonzero_fee_envelope_proven_inert=true'             'accepted_history_bound=true'             'exact_validator_roster_before_after_required=true'             'contract_code_identity_bound=true'             'chain_progress_required=true'             'final_block_hash_revalidated=true'             'native_fee_funding_required=true'             'credential_signer_control_before_after_chain_window_required=true'             'credential_signer_control_runtime_generation_stability_required=true'             'credential_signer_control_runtime_drift_rejected=true'             'fresh_rpc_host_service_container_listener_binding_required=true'             'historical_runtime_observation_sufficient_without_fresh_revalidation=false'             'rpc_host_binding_live_provenance_required=true'             'fabricated_rpc_host_binding_provenance_rejected=true'             'rpc_host_generation_drift_rejected=true'             'forged_fee_receipt_rejected=true'             'transaction_calldata_constructed=false'             'nonce_reserved=false'             'transaction=false'             'customer_payment_record_access=false'             'customer_safe_to_pay=false'             'payment_acceptance=false'             'public_presale_activation=false'             'funds_movement=false'
          do
            grep -Fx "$marker" "$OUT"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1)"
