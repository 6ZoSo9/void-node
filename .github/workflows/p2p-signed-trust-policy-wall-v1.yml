name: P2P Signed Trust Policy Wall v1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  p2p-signed-trust-policy-wall-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove signed P2P trust policy wall runtime
        run: npx tsx scripts/prove_p2p_signed_trust_policy_wall_v1.ts

      - name: Prove signed P2P trust policy wall boundaries
        run: npx tsx scripts/prove_p2p_signed_trust_policy_wall_guard_v1.ts

      - name: Prove offline authority non-overwrite and disabled gates
        run: |
          set -euo pipefail
          chmod +x \
            ops/mainnet0/provision-p2p-trust-policy-authority-v1.sh \
            ops/mainnet0/run-p2p-signed-trust-policy-wall-v1.sh
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          ops/mainnet0/provision-p2p-trust-policy-authority-v1.sh "$temp/authority" void-mainnet0-chain2050 \
            | grep -F VOID_P2P_TRUST_POLICY_AUTHORITY_V1_PROVISIONED
          if ops/mainnet0/provision-p2p-trust-policy-authority-v1.sh "$temp/authority" void-mainnet0-chain2050; then
            echo "provisioner unexpectedly overwrote authority material" >&2
            exit 1
          fi
          set +e
          env -u VOID_P2P_TRUST_POLICY_WALL_ENABLED -u VOID_P2P_EDGE_WALL_ENABLED \
            ops/mainnet0/run-p2p-signed-trust-policy-wall-v1.sh >"$temp/out" 2>"$temp/err"
          status=$?
          set -e
          test "$status" -eq 78
          grep -F VOID_P2P_SIGNED_TRUST_POLICY_WALL_V1_DISABLED "$temp/err"

      - name: Guard index.ts size and markers
        run: |
          chmod +x tools/check_index_size.sh
          tools/check_index_size.sh

      - name: Build
        run: npm run build
