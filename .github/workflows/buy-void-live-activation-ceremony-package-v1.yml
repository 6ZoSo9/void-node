name: Buy VOID live activation ceremony package v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-live-activation-ceremony-package-v1.yml"
      - "tools/void-buy-coupled-live-activation-ceremony-package-v1.mjs"
      - "scripts/prove_void_buy_coupled_live_activation_ceremony_package_v1.mjs"
      - "docs/operators/buy-void-coupled-live-activation-ceremony-package-v1.md"
      - "src/economic/buy_void_coupled_launch_gate_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-live-activation-ceremony-package-v1.yml"
      - "tools/void-buy-coupled-live-activation-ceremony-package-v1.mjs"
      - "scripts/prove_void_buy_coupled_live_activation_ceremony_package_v1.mjs"
      - "docs/operators/buy-void-coupled-live-activation-ceremony-package-v1.md"
      - "src/economic/buy_void_coupled_launch_gate_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed dependencies
        run: npm ci
      - name: Prove source-only ceremony package
        run: node scripts/prove_void_buy_coupled_live_activation_ceremony_package_v1.mjs
      - name: Load operator help without mutation
        run: node tools/void-buy-coupled-live-activation-ceremony-package-v1.mjs --help
      - name: Diff hygiene
        run: git diff --check
