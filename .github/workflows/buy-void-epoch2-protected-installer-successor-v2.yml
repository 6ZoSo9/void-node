name: Buy VOID Epoch-2 protected installer successor v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-protected-installer-successor-v2.yml"
      - "docs/operators/buy-void-epoch2-protected-installer-successor-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_git.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-protected-installer-successor-v2.yml"
      - "docs/operators/buy-void-epoch2-protected-installer-successor-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_git.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-installer-successor-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax, raw Git boundary, terminal failures, and static bootstrap
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_git.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.py",
          ):
              compile(Path(relative).read_bytes(), relative, "exec", dont_inherit=True)
          print("VOID_EPOCH2_PROTECTED_INSTALLER_SUCCESSOR_V2_SYNTAX_GREEN")
          PY
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_git.py
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2_terminal.py
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.py
          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py --self-test
          python3 -I -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py --source-plan
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
