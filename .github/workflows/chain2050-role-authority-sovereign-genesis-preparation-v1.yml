name: chain2050-role-authority-sovereign-genesis-preparation-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-sovereign-policy-v1.json"
      - "ops/mainnet0/chain2050-role-authority-sovereign-genesis-preparation-v1.json"
      - "tools/chain2050-role-authority-sovereign-genesis-preparation-v1.mjs"
      - "scripts/prove_chain2050_role_authority_sovereign_genesis_preparation_v1.mjs"
      - "docs/security/chain2050-role-authority-sovereign-genesis-preparation-v1.md"
      - ".github/workflows/chain2050-role-authority-sovereign-genesis-preparation-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Prove SOVEREIGN genesis preparation
        run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_sovereign_genesis_preparation_v1.mjs | tee "$RUNNER_TEMP/sovereign-genesis-prep.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_SOVEREIGN_GENESIS_PREPARATION_V1_GREEN' "$RUNNER_TEMP/sovereign-genesis-prep.log"
          grep -Fx 'role_record_sha256=1492c4d55f5c6d4873a28ca08d641196ba51d9e5c0a7c1cc31f27bf1a6405b0b' "$RUNNER_TEMP/sovereign-genesis-prep.log"
          grep -Fx 'predicted_registry_root_sha256=54619d93d1f94746cb92c3bb4de038d014d5c90b73789581486b4a12b4322041' "$RUNNER_TEMP/sovereign-genesis-prep.log"
          grep -Fx 'append_eligible=false' "$RUNNER_TEMP/sovereign-genesis-prep.log"
          grep -Fx 'chain2050_write=false' "$RUNNER_TEMP/sovereign-genesis-prep.log"
      - name: Diff hygiene
        run: git diff --check
