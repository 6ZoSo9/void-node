name: VOID PR1096 ancestry reconciliation helper v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/void-pr1096-ancestry-reconcile-helper-v3.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.base.ref == 'feat/p2p-udp-swarm-authenticated-control-adapter-v1-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prove exact tree, repair ancestry only, and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET_BRANCH='feat/p2p-udp-swarm-node-control-mount-v1-20260807'
          BASE_BRANCH='feat/p2p-udp-swarm-authenticated-control-adapter-v1-20260807'
          HELPER_BRANCH='ops/pr1096-ancestry-reconcile-helper-v3-20260808'
          HELPER_FILE='.github/workflows/void-pr1096-ancestry-reconcile-helper-v3.yml'
          EXPECTED_TARGET='620afb6e28330f0635f5bcdaaa2fedd0b3f40a56'
          EXPECTED_BASE='29b8da4f1d10dfd703eae4334d95506709f2b03b'
          REVIEWED_FEATURE='a71a7c92a31b54aac7ad9cbc9d767ff69ec31901'

          WORKFLOW='.github/workflows/void-p2p-udp-swarm-node-control-mount-v1.yml'
          DOC='docs/public/void-p2p-udp-swarm-node-control-mount-v1.md'
          PROOF='scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts'
          SOURCE='src/node_core.ts'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = "$HELPER_FILE"

          git fetch --no-tags origin \
            "$TARGET_BRANCH" \
            "$BASE_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET"
          test "$(git rev-parse "origin/$BASE_BRANCH")" = "$EXPECTED_BASE"

          actual_scope="$(git diff --name-status "$EXPECTED_BASE" "$EXPECTED_TARGET" | sort)"
          expected_scope="$(printf '%s\n' \
            "A${IFS}$WORKFLOW" \
            "A${IFS}$DOC" \
            "A${IFS}$PROOF" \
            "M${IFS}$SOURCE" | tr ' ' '\t' | sort)"
          test "$actual_scope" = "$expected_scope"

          actual_numstat="$(git diff --numstat "$EXPECTED_BASE" "$EXPECTED_TARGET" | sort -k3,3)"
          expected_numstat="$(printf '%s\n' \
            "80 0 $WORKFLOW" \
            "131 0 $DOC" \
            "387 0 $PROOF" \
            "192 2 $SOURCE" | tr ' ' '\t' | sort -k3,3)"
          test "$actual_numstat" = "$expected_numstat"

          for p in "$WORKFLOW" "$DOC" "$PROOF"; do
            test "$(git rev-parse "$EXPECTED_TARGET:$p")" = "$(git rev-parse "$REVIEWED_FEATURE:$p")"
          done

          target_tree="$(git rev-parse "$EXPECTED_TARGET^{tree}")"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B target "$EXPECTED_TARGET"
          git merge -s ours --no-ff "$EXPECTED_BASE" \
            -m 'chore: reconcile UDP swarm Node control mount ancestry with current parent'

          test "$(git rev-parse HEAD^1)" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(git diff --name-status "$EXPECTED_BASE" HEAD | sort)" = "$expected_scope"
          test "$(git diff --numstat "$EXPECTED_BASE" HEAD | sort -k3,3)" = "$expected_numstat"
          git diff --check "$EXPECTED_BASE...HEAD"

          git fetch --no-tags origin "$TARGET_BRANCH" "$BASE_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET"
          test "$(git rev-parse "origin/$BASE_BRANCH")" = "$EXPECTED_BASE"
          git push origin "HEAD:$TARGET_BRANCH"

          git fetch --no-tags origin "$HELPER_BRANCH"
          git checkout -B helper-clean "origin/$HELPER_BRANCH"
          test -f "$HELPER_FILE"
          git rm -- "$HELPER_FILE"
          git commit -m 'chore: remove PR1096 ancestry reconciliation helper v3'
          git push origin "HEAD:$HELPER_BRANCH"
