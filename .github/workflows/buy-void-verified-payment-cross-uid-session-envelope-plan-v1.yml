name: VOID Buy VOID verified-payment cross-UID session envelope source plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-verified-payment-cross-uid-session-envelope-plan-v1.yml"
      - "docs/architecture/buy-void-verified-payment-cross-uid-session-envelope-plan-v1.md"
      - "ops/security/buy-void-verified-payment-cross-uid-session-envelope-plan-v1.json"
      - "scripts/prove_buy_void_verified_payment_cross_uid_session_envelope_plan_v1.mjs"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
      - "src/economic/buy_void_cross_uid_failure_reconciliation_v1.mjs"
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "src/economic/buy_void_web_payment_cross_uid_failure_binding_v1.mjs"
      - "src/economic/buy_void_web_payment_cross_uid_lock_validation_v1.mjs"
      - "src/economic/buy_void_web_payment_cross_uid_lock_writer_impl_v1.mjs"
      - "tools/void-buy-allocation-custody-service-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind source generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse '7197eb96ff3ce2d3f630545a85c150b694d20b3b^{tree}')" = "ed7c516dc7d49895a2af576add999c3a5dde945b"
          test "$(git merge-base '7197eb96ff3ce2d3f630545a85c150b694d20b3b' HEAD)" = "7197eb96ff3ce2d3f630545a85c150b694d20b3b"
          test "$(git hash-object 'ops/security/buy-void-verified-payment-cross-uid-session-envelope-plan-v1.json')" = "336aa696f4ff08341be649d7b5e087367c7c629e"
          test "$(git hash-object 'scripts/prove_buy_void_verified_payment_cross_uid_session_envelope_plan_v1.mjs')" = "1466f852d91de10b255fac3637fe5e9056280cc1"
          test "$(git hash-object 'docs/architecture/buy-void-verified-payment-cross-uid-session-envelope-plan-v1.md')" = "e9c3cf1fd1f595217be60c2c733ece2a5b27c04d"
          git diff --check '7197eb96ff3ce2d3f630545a85c150b694d20b3b' HEAD
      - name: Prove source-only session envelope plan
        run: node scripts/prove_buy_void_verified_payment_cross_uid_session_envelope_plan_v1.mjs
