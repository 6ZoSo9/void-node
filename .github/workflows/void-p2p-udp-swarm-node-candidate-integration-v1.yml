name: VOID P2P UDP swarm Node candidate integration v1

on:
  pull_request:
    paths:
      - 'src/node_core.ts'
      - 'src/p2p/udp_swarm_authenticated_direct_candidate_v1.ts'
      - 'src/p2p/udp_swarm_relay_preserving_takeover_policy_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_relay_preserving_takeover_policy_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_authenticated_direct_candidate_v1.ts'
      - 'scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts'
      - 'scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts'
      - 'scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts'
      - 'docs/public/void-p2p-udp-swarm-node-candidate-integration-v1.md'
      - '.github/workflows/void-p2p-udp-swarm-node-candidate-integration-v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove Node candidate integration
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts

      - name: Re-prove relay-preserving takeover policy
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_relay_preserving_takeover_policy_v1.ts

      - name: Re-prove authenticated direct candidate gate
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_authenticated_direct_candidate_v1.ts

      - name: Re-prove ephemeral direct transport mount
        run: npx --no-install tsx scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts

      - name: Re-prove UDP swarm Node control mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_control_mount_v1.ts

      - name: Preserve raw-empty-catch terminal zero
        run: npx --no-install tsx scripts/prove_refined_tracked_raw_empty_catches_terminal_final_seal_v1.ts

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tsc-diagnostics.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-diagnostics-node-${{ matrix.node-version }}
          path: tsc-diagnostics.txt
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Diff hygiene across committed PR range
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          git diff --check "$PR_BASE_SHA...HEAD"
