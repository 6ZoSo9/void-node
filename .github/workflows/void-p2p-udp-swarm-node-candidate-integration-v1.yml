name: VOID P2P UDP swarm Node candidate integration v1 bootstrap

on:
  push:
    branches:
      - 'feat/p2p-udp-swarm-node-candidate-integration-v1-20260808'

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard bootstrap ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='271535c0d2ef0c89480ab18b814488d36c9584a9'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT...HEAD")" = '.github/workflows/void-p2p-udp-swarm-node-candidate-integration-v1.yml'

      - name: Apply exact Node candidate integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/node_core.ts')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              source = source.replace(old, new, 1)

          replace_once(
          '''import {
            VoidUdpSwarmAuthenticatedControlAdapterV1,
            type VoidUdpSwarmControlDeliveryV1,
            type VoidUdpSwarmProbeActionV1,
            type VoidUdpSwarmDirectUpgradeOfferActionV1,
          } from "./p2p/udp_swarm_authenticated_control_adapter_v1.js";
          import {
            VOID_P2P_DIRECT_UPGRADE_EPHEMERAL_PORT_MAX_V1,''',
          '''import {
            VoidUdpSwarmAuthenticatedControlAdapterV1,
            type VoidUdpSwarmControlDeliveryV1,
            type VoidUdpSwarmProbeActionV1,
            type VoidUdpSwarmDirectUpgradeOfferActionV1,
          } from "./p2p/udp_swarm_authenticated_control_adapter_v1.js";
          import type { VoidUdpPeerSocketAdapterV1 } from "./p2p/udp_peer_socket_adapter_v1.js";
          import { VoidUdpSwarmAuthenticatedDirectCandidateV1 } from "./p2p/udp_swarm_authenticated_direct_candidate_v1.js";
          import {
            VOID_P2P_DIRECT_UPGRADE_EPHEMERAL_PORT_MAX_V1,''',
          'candidate imports',
          )

          replace_once(
          '''type ReachabilityProbeContext = {''',
          '''type UdpSwarmAuthenticatedDirectCandidateContextV1 = Readonly<{
            session_id: string;
            expected_peer_node_id: string;
            relay_node_id: string;
            relay_stream_id: string;
            candidate: VoidUdpSwarmAuthenticatedDirectCandidateV1;
          }>;

          type ReachabilityProbeContext = {''',
          'candidate context type',
          )

          replace_once(
          '''  punchCapable: boolean;
            directUpgradeSessionId?: string;
          };''',
          '''  punchCapable: boolean;
            directUpgradeSessionId?: string;
            udpSwarmDirectCandidate?: UdpSwarmAuthenticatedDirectCandidateContextV1;
          };''',
          'peer candidate field',
          )

          replace_once(
          '''  private readonly udpSwarmAllowNonPublicEndpoint: boolean;
            private readonly udpSwarmControl: VoidUdpSwarmAuthenticatedControlAdapterV1;

            private readonly directUpgradeEnabled: boolean;''',
          '''  private readonly udpSwarmAllowNonPublicEndpoint: boolean;
            private readonly udpSwarmControl: VoidUdpSwarmAuthenticatedControlAdapterV1;
            private readonly udpSwarmDirectCandidates = new Map<string, Peer>();

            private readonly directUpgradeEnabled: boolean;''',
          'candidate map field',
          )

          replace_once(
          '''    this.directUpgradePendingRequests.clear();
              this.directUpgradeLocalSessions.clear();
              for (const p of this.peers.values()) {''',
          '''    this.directUpgradePendingRequests.clear();
              this.directUpgradeLocalSessions.clear();
              for (const peer of this.udpSwarmDirectCandidates.values()) {
                peer.udpSwarmDirectCandidate?.candidate.discard("node_stopping");
              }
              this.udpSwarmDirectCandidates.clear();
              for (const p of this.peers.values()) {''',
          'stop candidate cleanup',
          )

          replace_once(
          '''  private finishAuthenticatedPeer(peer: Peer, auth: VoidPeerAuthV1) {''',
          '''  private liveRelayPeerForUdpSwarmCandidateV1(
            expectedPeerNodeId: string,
            relayNodeId: string,
            relayStreamId: string,
          ): Peer | undefined {
            const relayPeer = this.peers.get(expectedPeerNodeId);
            if (
              !relayPeer ||
              !relayPeer.handshakeDone ||
              relayPeer.id !== expectedPeerNodeId ||
              relayPeer.transport !== "relay" ||
              relayPeer.relayViaNodeId !== relayNodeId ||
              relayPeer.relayStreamId !== relayStreamId
            ) return;

            const stream = this.relayStreams.get(
              this.relayStreamKey(relayNodeId, relayStreamId),
            );
            if (
              !stream ||
              !stream.started ||
              stream.remote_node_id !== expectedPeerNodeId ||
              stream.socket !== relayPeer.socket
            ) return;
            return relayPeer;
          }

          private sweepUdpSwarmAuthenticatedDirectCandidatesV1(
            reason = "relay_fallback_lost",
          ): void {
            for (const [sessionId, peer] of [...this.udpSwarmDirectCandidates]) {
              const context = peer.udpSwarmDirectCandidate;
              if (!context) {
                this.udpSwarmDirectCandidates.delete(sessionId);
                continue;
              }
              if (
                this.liveRelayPeerForUdpSwarmCandidateV1(
                  context.expected_peer_node_id,
                  context.relay_node_id,
                  context.relay_stream_id,
                )
              ) continue;
              this.udpSwarmDirectCandidates.delete(sessionId);
              context.candidate.discard(reason);
            }
          }

          private finishUdpSwarmAuthenticatedDirectCandidateV1(
            peer: Peer,
            auth: VoidPeerAuthV1,
          ): boolean {
            const context = peer.udpSwarmDirectCandidate;
            if (!context) return false;
            if (
              this.udpSwarmDirectCandidates.get(context.session_id) !== peer ||
              peer.transport !== "direct" ||
              peer.persistDirectEvidence ||
              peer.expectedNodeId !== context.expected_peer_node_id
            ) {
              this.udpSwarmDirectCandidates.delete(context.session_id);
              context.candidate.discard("candidate Node mount binding mismatch");
              return false;
            }

            if (!context.candidate.acceptNormalVoidAuthentication(auth.id, auth.pubkey)) {
              this.udpSwarmDirectCandidates.delete(context.session_id);
              return false;
            }

            if (peer.authTimer) {
              clearTimeout(peer.authTimer);
              peer.authTimer = null;
            }
            peer.authenticatedPublicPem = auth.pubkey;
            peer.listens = [...auth.listen];
            peer.remoteHello = undefined;
            return true;
          }

          private finishAuthenticatedPeer(peer: Peer, auth: VoidPeerAuthV1) {''',
          'candidate integration helpers',
          )

          replace_once(
          '''    if (peer.probe) {
                return this.finishReachabilityProbeAuthentication(peer, auth);
              }

              if (peer.expectedNodeId && auth.id !== peer.expectedNodeId) {''',
          '''    if (peer.probe) {
                return this.finishReachabilityProbeAuthentication(peer, auth);
              }
              if (peer.udpSwarmDirectCandidate) {
                return this.finishUdpSwarmAuthenticatedDirectCandidateV1(peer, auth);
              }

              if (peer.expectedNodeId && auth.id !== peer.expectedNodeId) {''',
          'candidate auth branch',
          )

          replace_once(
          '''  attachEphemeralDirectTransportV1(
            socket: PeerSocketV1,''',
          '''  stageUdpSwarmAuthenticatedDirectCandidateV1(
            options: Readonly<{
              sessionId: string;
              expectedPeerNodeId: string;
              relayNodeId: string;
              relayStreamId: string;
              transportHint: string;
              socket: VoidUdpPeerSocketAdapterV1;
            }>,
          ): boolean {
            const reject = (reason: string): false => {
              if (!options.socket.destroyed) options.socket.destroy(new Error(reason));
              return false;
            };
            if (this.stopping) return reject("node is stopping");
            if (this.udpSwarmDirectCandidates.has(options.sessionId)) {
              return reject("UDP swarm candidate session already staged");
            }
            if (
              !this.liveRelayPeerForUdpSwarmCandidateV1(
                options.expectedPeerNodeId,
                options.relayNodeId,
                options.relayStreamId,
              )
            ) {
              return reject("exact live relay fallback is required before UDP candidate staging");
            }

            let candidate: VoidUdpSwarmAuthenticatedDirectCandidateV1;
            try {
              candidate = new VoidUdpSwarmAuthenticatedDirectCandidateV1({
                sessionId: options.sessionId,
                expectedPeerNodeId: options.expectedPeerNodeId,
                relayNodeId: options.relayNodeId,
                relayStreamId: options.relayStreamId,
                transportHint: options.transportHint,
                socket: options.socket,
                isRelayFallbackLive: () =>
                  !!this.liveRelayPeerForUdpSwarmCandidateV1(
                    options.expectedPeerNodeId,
                    options.relayNodeId,
                    options.relayStreamId,
                  ),
              });
            } catch (error) {
              return reject(
                error instanceof Error ? error.message : String(error),
              );
            }

            const context: UdpSwarmAuthenticatedDirectCandidateContextV1 =
              Object.freeze({
                session_id: options.sessionId,
                expected_peer_node_id: options.expectedPeerNodeId,
                relay_node_id: options.relayNodeId,
                relay_stream_id: options.relayStreamId,
                candidate,
              });
            try {
              this.attachSocket(
                options.socket,
                options.transportHint,
                true,
                options.expectedPeerNodeId,
                undefined,
                "direct",
                undefined,
                undefined,
                false,
                false,
                undefined,
                undefined,
                context,
              );
              return true;
            } catch (error) {
              candidate.discard(
                error instanceof Error ? error.message : String(error),
              );
              return false;
            }
          }

          udpSwarmAuthenticatedDirectCandidateSnapshotV1() {
            const candidates = [...this.udpSwarmDirectCandidates.entries()]
              .map(([sessionId, peer]) => {
                const context = peer.udpSwarmDirectCandidate;
                if (!context) return;
                const routedPeer = this.peers.get(context.expected_peer_node_id);
                return {
                  ...context.candidate.snapshot(),
                  session_id: sessionId,
                  relay_fallback_live:
                    !!this.liveRelayPeerForUdpSwarmCandidateV1(
                      context.expected_peer_node_id,
                      context.relay_node_id,
                      context.relay_stream_id,
                    ),
                  candidate_is_normal_peer_route: routedPeer === peer,
                  routed_peer_transport: routedPeer?.transport ?? null,
                };
              })
              .filter((entry): entry is NonNullable<typeof entry> => !!entry)
              .sort((a, b) => a.session_id.localeCompare(b.session_id));
            return {
              candidate_count: candidates.length,
              candidates,
              normal_peer_routing_promotion_performed: candidates.some(
                (entry) => entry.candidate_is_normal_peer_route,
              ),
              relay_retirement_performed: false,
            };
          }

          attachEphemeralDirectTransportV1(
            socket: PeerSocketV1,''',
          'candidate public staging surface',
          )

          replace_once(
          '''    directUpgradeSessionId?: string,
              reachabilityProbe?: ReachabilityProbeContext,
            ) {''',
          '''    directUpgradeSessionId?: string,
              reachabilityProbe?: ReachabilityProbeContext,
              udpSwarmDirectCandidate?: UdpSwarmAuthenticatedDirectCandidateContextV1,
            ) {''',
          'attachSocket candidate parameter',
          )

          replace_once(
          '''      punchCapable,
                directUpgradeSessionId,
              };''',
          '''      punchCapable,
                directUpgradeSessionId,
                udpSwarmDirectCandidate,
              };''',
          'attachSocket candidate field assignment',
          )

          replace_once(
          '''      if (
                  peer.probe?.role === "outgoing" &&''',
          '''      if (peer.udpSwarmDirectCandidate) {
                  const current = this.udpSwarmDirectCandidates.get(
                    peer.udpSwarmDirectCandidate.session_id,
                  );
                  if (current === peer) {
                    this.udpSwarmDirectCandidates.delete(
                      peer.udpSwarmDirectCandidate.session_id,
                    );
                  }
                }
                if (
                  peer.probe?.role === "outgoing" &&''',
          'candidate close cleanup',
          )

          replace_once(
          '''    this.peers.set(peer.id, peer);
              peer.authTimer = setTimeout(() => {''',
          '''    this.peers.set(peer.id, peer);
              if (udpSwarmDirectCandidate) {
                this.udpSwarmDirectCandidates.set(
                  udpSwarmDirectCandidate.session_id,
                  peer,
                );
              }
              peer.authTimer = setTimeout(() => {''',
          'candidate registration before HELLO',
          )

          replace_once(
          '''    this.relayStreams.delete(key);
              entry.socket.remoteClose(reason);
              this.udpSwarmControl.sweep();
            }''',
          '''    this.relayStreams.delete(key);
              entry.socket.remoteClose(reason);
              this.udpSwarmControl.sweep();
              this.sweepUdpSwarmAuthenticatedDirectCandidatesV1(
                "relay_fallback_stream_closed",
              );
            }''',
          'relay stream close candidate sweep',
          )

          replace_once(
          '''      }
                return;
              }

              if (!peer.handshakeDone || peer.id.startsWith("?-")) return;

              this.udpSwarmControl.removeAuthenticatedPeer(peer.id);''',
          '''      }
                this.sweepUdpSwarmAuthenticatedDirectCandidatesV1(
                  "relay_fallback_transport_closed",
                );
                return;
              }

              if (!peer.handshakeDone || peer.id.startsWith("?-")) return;

              this.udpSwarmControl.removeAuthenticatedPeer(peer.id);''',
          'relay transport close candidate sweep',
          )

          path.write_text(source)
          PY

      - name: Write focused integration proof
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts <<'EOF'
          import assert from "node:assert/strict";
          import * as crypto from "node:crypto";
          import { EventEmitter } from "node:events";
          import * as fs from "node:fs";
          import * as os from "node:os";
          import * as path from "node:path";

          import { Node } from "../src/node_core.js";
          import { deriveVoidNodeIdFromPublicPemV1 } from "../src/p2p/auth_v1.js";
          import { VoidUdpSecureSessionBootstrapV1 } from "../src/p2p/udp_secure_session_bootstrap_v1.js";
          import type { VoidUdpSecurePacketV1 } from "../src/p2p/udp_secure_reliable_transport_v1.js";

          type TestKeypair = {
            privateKey: crypto.KeyObject;
            publicKey: crypto.KeyObject;
            nodeId: string;
            pubPEM: string;
          };

          type SecurePair = {
            a: VoidUdpSecureSessionBootstrapV1;
            b: VoidUdpSecureSessionBootstrapV1;
          };

          class TestRelaySocket extends EventEmitter {
            destroyed = false;
            readonly writes: Buffer[] = [];

            write(raw: Uint8Array | string): boolean {
              if (this.destroyed) return false;
              this.writes.push(typeof raw === "string" ? Buffer.from(raw) : Buffer.from(raw));
              return true;
            }

            destroy(error?: Error): this {
              if (this.destroyed) return this;
              this.destroyed = true;
              queueMicrotask(() => {
                if (error && this.listenerCount("error") > 0) this.emit("error", error);
                this.emit("close");
              });
              return this;
            }

            remoteClose(_reason: string): void {
              this.destroy();
            }
          }

          function keypair(): TestKeypair {
            const { privateKey, publicKey } = crypto.generateKeyPairSync("ed25519");
            const pubPEM = publicKey.export({ type: "spki", format: "pem" }).toString();
            const nodeId = deriveVoidNodeIdFromPublicPemV1(pubPEM);
            assert(nodeId);
            return { privateKey, publicKey, nodeId, pubPEM };
          }

          function newNode(dataDir: string, kp: TestKeypair): Node {
            process.env.DATA_DIR = dataDir;
            process.env.BOOTSTRAP_ADDRS = "";
            process.env.P2P_BIND_HOST = "127.0.0.1";
            process.env.P2P_ADVERTISE_HOST = "127.0.0.1";
            return new Node(0, kp);
          }

          function internals(node: Node): any {
            return node as any;
          }

          async function waitFor(
            predicate: () => boolean,
            label: string,
            timeoutMs = 5_000,
          ): Promise<void> {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (predicate()) return;
              await new Promise((resolve) => setTimeout(resolve, 10));
            }
            throw new Error(`timed out waiting for ${label}`);
          }

          function establishSecurePair(
            a: TestKeypair,
            b: TestKeypair,
            endpointA: string,
            endpointB: string,
          ): SecurePair {
            const sessionId = crypto.randomBytes(16).toString("hex");
            let controllerA!: VoidUdpSecureSessionBootstrapV1;
            let controllerB!: VoidUdpSecureSessionBootstrapV1;

            const transmitA = (packet: VoidUdpSecurePacketV1) => {
              queueMicrotask(() => controllerB.receiveSecurePacket(packet));
            };
            const transmitB = (packet: VoidUdpSecurePacketV1) => {
              queueMicrotask(() => controllerA.receiveSecurePacket(packet));
            };

            controllerA = new VoidUdpSecureSessionBootstrapV1({
              sessionId,
              localNodeId: a.nodeId,
              remoteNodeId: b.nodeId,
              localPublicPem: a.pubPEM,
              localPrivateKey: a.privateKey,
              localObservedEndpoint: endpointA,
              remoteObservedEndpoint: endpointB,
              allowNonPublicEndpoints: true,
              transmitSecurePacket: transmitA,
              adapterOptions: { autoRetransmit: false },
            });
            controllerB = new VoidUdpSecureSessionBootstrapV1({
              sessionId,
              localNodeId: b.nodeId,
              remoteNodeId: a.nodeId,
              localPublicPem: b.pubPEM,
              localPrivateKey: b.privateKey,
              localObservedEndpoint: endpointB,
              remoteObservedEndpoint: endpointA,
              allowNonPublicEndpoints: true,
              transmitSecurePacket: transmitB,
              adapterOptions: { autoRetransmit: false },
            });

            const helloA = controllerA.localHello();
            const helloB = controllerB.localHello();
            assert.equal(controllerA.acceptRemoteHello(helloB), true);
            assert.equal(controllerB.acceptRemoteHello(helloA), true);
            const proofA = controllerA.createLocalProof();
            const proofB = controllerB.createLocalProof();
            assert.equal(controllerA.acceptRemoteProof(proofB), true);
            assert.equal(controllerB.acceptRemoteProof(proofA), true);
            const offerA = controllerA.createLocalKeyOffer();
            const offerB = controllerB.createLocalKeyOffer();
            assert.equal(controllerA.acceptRemoteKeyOffer(offerB), true);
            assert.equal(controllerB.acceptRemoteKeyOffer(offerA), true);
            assert(controllerA.socket && controllerB.socket);
            return { a: controllerA, b: controllerB };
          }

          function installLiveRelayFallback(
            node: Node,
            remote: TestKeypair,
            relay: TestKeypair,
            streamId: string,
          ): { peer: any; socket: TestRelaySocket } {
            const socket = new TestRelaySocket();
            const peer = {
              id: remote.nodeId,
              socket,
              framer: undefined,
              addr: `relay:${relay.nodeId}/${streamId}->${remote.nodeId}`,
              listens: [],
              outbound: true,
              handshakeDone: true,
              localChallenge: "0".repeat(64),
              authenticatedPublicPem: remote.pubPEM,
              authTimer: null,
              expectedNodeId: remote.nodeId,
              suppressReconnect: true,
              attachedAtMs: Date.now(),
              outboundSeenEmitted: false,
              transport: "relay",
              relayViaNodeId: relay.nodeId,
              relayStreamId: streamId,
              persistDirectEvidence: false,
              punchCapable: false,
            };
            const core = internals(node);
            core.peers.set(remote.nodeId, peer);
            core.relayStreams.set(`${relay.nodeId}:${streamId}`, {
              relay_node_id: relay.nodeId,
              remote_node_id: remote.nodeId,
              stream_id: streamId,
              outgoing: true,
              started: true,
              socket,
            });
            return { peer, socket };
          }

          async function main(): Promise<void> {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "void-udp-node-candidate-v1-"));
            let pair: SecurePair | undefined;
            let rejectedPair: SecurePair | undefined;
            let relayLossPair: SecurePair | undefined;

            try {
              const kpA = keypair();
              const kpB = keypair();
              const relayKp = keypair();
              const nodeA = newNode(path.join(root, "a"), kpA);
              const nodeB = newNode(path.join(root, "b"), kpB);
              const streamId = crypto.randomBytes(16).toString("hex");
              const sessionId = crypto.randomBytes(16).toString("hex");
              const relayFallback = installLiveRelayFallback(
                nodeA,
                kpB,
                relayKp,
                streamId,
              );

              let persistedA = 0;
              internals(nodeA).rememberAuthenticatedPeer = () => { persistedA += 1; };

              pair = establishSecurePair(kpA, kpB, "127.0.0.1:53001", "127.0.0.1:53002");
              assert(pair.a.socket && pair.b.socket);
              assert.equal(
                nodeA.stageUdpSwarmAuthenticatedDirectCandidateV1({
                  sessionId,
                  expectedPeerNodeId: kpB.nodeId,
                  relayNodeId: relayKp.nodeId,
                  relayStreamId: streamId,
                  transportHint: "udp-swarm:127.0.0.1:53002",
                  socket: pair.a.socket,
                }),
                true,
              );
              assert.equal(
                nodeB.attachEphemeralDirectTransportV1(
                  pair.b.socket,
                  kpA.nodeId,
                  "udp-swarm-proof:127.0.0.1:53001",
                ),
                true,
              );

              await waitFor(
                () => {
                  const snapshot = nodeA.udpSwarmAuthenticatedDirectCandidateSnapshotV1();
                  return snapshot.candidate_count === 1 &&
                    snapshot.candidates[0]?.phase === "authenticated_candidate" &&
                    nodeB.peers.get(kpA.nodeId)?.handshakeDone === true;
                },
                "normal VOID authentication over staged UDP candidate",
              );

              const snapshot = nodeA.udpSwarmAuthenticatedDirectCandidateSnapshotV1();
              assert.equal(snapshot.candidate_count, 1);
              assert.equal(snapshot.normal_peer_routing_promotion_performed, false);
              assert.equal(snapshot.relay_retirement_performed, false);
              const candidate = snapshot.candidates[0];
              assert(candidate);
              assert.equal(candidate.expected_peer_node_id, kpB.nodeId);
              assert.equal(candidate.relay_node_id, relayKp.nodeId);
              assert.equal(candidate.relay_stream_id, streamId);
              assert.equal(candidate.phase, "authenticated_candidate");
              assert.equal(candidate.relay_fallback_live, true);
              assert.equal(candidate.candidate_is_normal_peer_route, false);
              assert.equal(candidate.routed_peer_transport, "relay");
              assert.equal(candidate.normal_peer_routing_mutation_performed, false);
              assert.equal(candidate.relay_retirement_authorized, false);

              assert.strictEqual(internals(nodeA).peers.get(kpB.nodeId), relayFallback.peer);
              assert.equal(relayFallback.socket.destroyed, false);
              assert.equal(persistedA, 0);
              assert.equal(
                nodeA.peersSnapshot().connected.filter((entry) => entry.id === kpB.nodeId).length,
                1,
              );

              pair.a.destroy();
              pair.b.destroy();
              await waitFor(
                () => nodeA.udpSwarmAuthenticatedDirectCandidateSnapshotV1().candidate_count === 0,
                "candidate cleanup after secure UDP socket close",
              );
              assert.strictEqual(internals(nodeA).peers.get(kpB.nodeId), relayFallback.peer);
              assert.equal(relayFallback.socket.destroyed, false);

              rejectedPair = establishSecurePair(
                kpA,
                kpB,
                "127.0.0.1:53101",
                "127.0.0.1:53102",
              );
              assert(rejectedPair.a.socket && rejectedPair.b.socket);
              assert.equal(
                nodeA.stageUdpSwarmAuthenticatedDirectCandidateV1({
                  sessionId: crypto.randomBytes(16).toString("hex"),
                  expectedPeerNodeId: kpB.nodeId,
                  relayNodeId: relayKp.nodeId,
                  relayStreamId: "f".repeat(32),
                  transportHint: "udp-swarm:127.0.0.1:53102",
                  socket: rejectedPair.a.socket,
                }),
                false,
              );
              assert.equal(rejectedPair.a.socket.destroyed, true);
              assert.strictEqual(internals(nodeA).peers.get(kpB.nodeId), relayFallback.peer);
              assert.equal(relayFallback.socket.destroyed, false);

              relayLossPair = establishSecurePair(
                kpA,
                kpB,
                "127.0.0.1:53201",
                "127.0.0.1:53202",
              );
              assert(relayLossPair.a.socket && relayLossPair.b.socket);
              const relayLossSessionId = crypto.randomBytes(16).toString("hex");
              assert.equal(
                nodeA.stageUdpSwarmAuthenticatedDirectCandidateV1({
                  sessionId: relayLossSessionId,
                  expectedPeerNodeId: kpB.nodeId,
                  relayNodeId: relayKp.nodeId,
                  relayStreamId: streamId,
                  transportHint: "udp-swarm:127.0.0.1:53202",
                  socket: relayLossPair.a.socket,
                }),
                true,
              );
              assert.equal(
                nodeA.udpSwarmAuthenticatedDirectCandidateSnapshotV1().candidates[0]?.phase,
                "awaiting_void_auth",
              );
              internals(nodeA).finishRelayLocalStream(
                relayKp.nodeId,
                streamId,
                "proof_relay_loss",
              );
              await waitFor(
                () => relayLossPair!.a.socket?.destroyed === true &&
                  nodeA.udpSwarmAuthenticatedDirectCandidateSnapshotV1().candidate_count === 0,
                "relay loss discards staged UDP candidate",
              );
              assert.equal(relayFallback.socket.destroyed, true);

              console.log("secure_udp_candidate_staged_in_node=true");
              console.log("normal_void_hello_auth_reused=true");
              console.log("exact_expected_peer_identity_required=true");
              console.log("exact_live_relay_tuple_required=true");
              console.log("authenticated_candidate_kept_non_routable=true");
              console.log("existing_relay_peer_remains_normal_route=true");
              console.log("candidate_close_preserves_relay=true");
              console.log("wrong_relay_tuple_candidate_destroyed=true");
              console.log("relay_loss_discards_waiting_candidate=true");
              console.log("verified_direct_evidence_persisted=false");
              console.log("normal_peer_routing_promotion_performed=false");
              console.log("relay_retirement_performed=false");
              console.log("production_udp_activation_performed=false");
              console.log("wallet_signer_validator_wc_money_authority=0");
              console.log("VOID_P2P_UDP_SWARM_NODE_CANDIDATE_INTEGRATION_V1_PROOF_GREEN");
            } finally {
              try { pair?.a.destroy(); } catch (error) { void error; }
              try { pair?.b.destroy(); } catch (error) { void error; }
              try { rejectedPair?.a.destroy(); } catch (error) { void error; }
              try { rejectedPair?.b.destroy(); } catch (error) { void error; }
              try { relayLossPair?.a.destroy(); } catch (error) { void error; }
              try { relayLossPair?.b.destroy(); } catch (error) { void error; }
              fs.rmSync(root, { recursive: true, force: true });
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF

      - name: Write operator note
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/public/void-p2p-udp-swarm-node-candidate-integration-v1.md <<'EOF'
          # VOID P2P UDP Swarm Node Candidate Integration v1

          ## Purpose

          Mount the secure UDP peer socket from the single-socket swarm runtime into the existing Node HELLO/AUTH machinery **without replacing the live relay peer**.

          This is the make-before-break Node seam after the authenticated direct-candidate primitive. It deliberately stops before normal peer routing promotion and before relay retirement.

          ## Runtime contract

          `Node.stageUdpSwarmAuthenticatedDirectCandidateV1()` accepts only a secure `VoidUdpPeerSocketAdapterV1` bound to an exact swarm session, expected peer node ID, relay node ID, relay stream ID, and transport hint.

          Before the candidate is mounted, Node requires the exact relay peer to remain authenticated and routable under the expected peer node ID and requires the exact relay-stream record to remain started and backed by that same relay virtual socket.

          The secure UDP socket then runs through the existing normal VOID HELLO/AUTH path. The verified `AUTH` result is handed to `VoidUdpSwarmAuthenticatedDirectCandidateV1` for its independent public-key/node-ID binding and relay-liveness checks.

          ## Non-routable authenticated candidate

          A successful candidate AUTH does not rename the temporary peer to the authenticated node ID, does not set it as the normal peer-map route, does not send PEERS/SUB traffic on it, and does not persist direct reachability evidence.

          The existing relay peer remains at `peers.get(expectedPeerNodeId)` throughout candidate authentication.

          `udpSwarmAuthenticatedDirectCandidateSnapshotV1()` exposes candidate state without exposing the secure socket. It reports whether relay fallback remains live, whether a candidate has become the normal route, and the transport type currently routed for the expected peer.

          ## Failure behavior

          Staging fails closed if the exact relay tuple is not live. Candidate authentication failure destroys only the candidate transport. Closing the candidate transport removes its temporary candidate record without touching the relay.

          If the relay stream or relay transport disappears while a candidate is staged, Node discards the candidate and destroys its secure UDP socket. A later promotion lane therefore cannot inherit a stale make-before-break assumption.

          ## Explicit non-authority

          This lane does not:

          - promote the candidate into normal peer routing;
          - evict or retire the relay after candidate authentication;
          - persist verified-direct cache evidence;
          - claim public-NAT success;
          - activate production/public UDP;
          - modify router, firewall, DNS, or interfaces;
          - access credentials, wallets, signers, validators, Work Credit, transactions, broadcasts, or funds.

          ## Proof

          Run:

          ```bash
          npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts
          ```

          The proof establishes an exact live relay tuple in Node, runs normal VOID HELLO/AUTH over a secure UDP adapter pair, proves the authenticated candidate remains non-routable while the relay remains the sole normal route, proves invalid relay provenance destroys only the candidate, and proves relay loss discards a waiting candidate.

          Expected marker:

          ```text
          VOID_P2P_UDP_SWARM_NODE_CANDIDATE_INTEGRATION_V1_PROOF_GREEN
          ```

          ## Next seam

          A later, separate lane may call the candidate's one-shot promotion authorization and atomically replace the normal route only while relay continuity still holds. Relay retirement remains a still-later transition after direct-route health is proven.
          EOF

