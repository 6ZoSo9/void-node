name: Canonical Producer Legacy Self-HTTP Observers v1

on:
  pull_request:
    paths:
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "runtime/canonical-producer-self-http-guard-v2.cjs"
      - "runtime/canonical-producer-self-http-guard-v3.cjs"
      - "runtime/canonical-producer-self-http-guard-v4.cjs"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "runtime/canonical-producer-source-custody-v1.cjs"
      - "ops/run-void-node-live-v1.sh"
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v2.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v2.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v3.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v4.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v3.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v4.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs"
      - "src/index.ts"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"
  push:
    branches:
      - main
    paths:
      - "runtime/canonical-producer-self-http-guard-v1.cjs"
      - "runtime/canonical-producer-self-http-guard-v2.cjs"
      - "runtime/canonical-producer-self-http-guard-v3.cjs"
      - "runtime/canonical-producer-self-http-guard-v4.cjs"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "runtime/canonical-producer-source-custody-v1.cjs"
      - "ops/run-void-node-live-v1.sh"
      - "ops/guard-canonical-producer-liveness-v1.sh"
      - "ops/mainnet0/install-canonical-producer-liveness-v1.sh"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_v1.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v2.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v2.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v3.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v4.mjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v3.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v4.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs"
      - "src/index.ts"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Shell syntax
        run: |
          bash -n ops/run-void-node-live-v1.sh
          node --check runtime/canonical-producer-self-http-guard-v2.cjs
          node --check scripts/prove_canonical_producer_legacy_self_http_observers_current_v2.mjs
          node --check scripts/prove_canonical_producer_source_generation_dispatch_v2.mjs
          node --check runtime/canonical-producer-self-http-guard-v3.cjs
          node --check runtime/canonical-producer-source-custody-v1.cjs
          node --check scripts/prove_canonical_producer_legacy_self_http_observers_current_v3.mjs
          node --check scripts/prove_canonical_producer_source_generation_dispatch_v3.mjs
          node --check runtime/canonical-producer-self-http-guard-v4.cjs
          node --check runtime/canonical-producer-self-http-guard-v5.cjs
          node --check scripts/prove_canonical_producer_legacy_self_http_observers_current_v4.mjs
          node --check scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs
          node --check scripts/prove_canonical_producer_source_generation_dispatch_v4.mjs
          node --check scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs
          bash -n ops/guard-canonical-producer-liveness-v1.sh
          bash -n ops/mainnet0/install-canonical-producer-liveness-v1.sh
      - name: Canonical legacy observer proof
        run: node scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs
