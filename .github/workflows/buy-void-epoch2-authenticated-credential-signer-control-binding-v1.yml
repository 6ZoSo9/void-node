name: Buy VOID Epoch-2 authenticated credential signer-control binding v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-signer-control-binding-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-signer-control-binding-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_live_binding_v1.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-signer-control-binding-v1.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-signer-control-binding-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_live_binding_v1.mjs"
      - "ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json"
      - "scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs"
      - "ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json"
      - "tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs"
      - "scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs)" =             "6d68b52ec036e422a151239f9c8f3ee7faa28055"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs)" =             "d0e186e4b4bc02534e671cc9bf6edf5a5f1cd6db"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_live_binding_v1.mjs)" =             "e31b6728247188a2ffe7b9587dd0017413fcb716"
          test "$(git rev-parse HEAD:ops/mainnet0/buy-void-payment-keyed-epoch2-dormant-candidate-v2.json)" =             "6a0159e516d30ca8a4b9af4dcace79a4fcddfbb1"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_payment_keyed_epoch2_dormant_candidate_v2.mjs)" =             "863ea6fcef568314e43ea8994bf495e126b5a434"
          test "$(git rev-parse HEAD:ops/mainnet0/evidence/buy-void-epoch2-signer-control-public-evidence-v1.json)" =             "361aea8767f8b049fafd28663b71b177f38f180d"
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-signer-control-public-evidence-v1.mjs)" =             "d0f3c575903a44b9a538f0201257584545077be9"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_signer_control_public_evidence_v1.mjs)" =             "8b34c9c43e28122d7509febfb8f5ab9a001a1b43"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check ops/precision/void_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs
          node --check scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs

      - name: Prove source-only composition
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-auth-credential-signer-control.log"
          node scripts/prove_buy_void_epoch2_authenticated_credential_signer_control_binding_v1.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_SIGNER_CONTROL_BINDING_V1_PROOF_GREEN"
            "runner_git_object_entry_required=true"
            "arbitrary_credential_binding_receipt_input_accepted=false"
            "exact_credential_binding_child_required=true"
            "accepted_signer_control_candidate_bound=true"
            "accepted_signer_control_evidence_bound=true"
            "accepted_signer_control_tool_and_proofs_pinned=true"
            "candidate_lineage_crosscheck=true"
            "closing_checkout_revalidation_before_receipt=true"
            "signer_offchain_control_proven_on_combined_receipt=true"
            "systemd_credential_identity_proven_on_combined_receipt=true"
            "active_signing_capability_proven_on_combined_receipt=true"
            "transaction_signing_proven=false"
            "customer_safe_to_pay=false"
            "transaction=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
