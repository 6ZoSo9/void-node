name: VOID WC-VOID launch-controller control offline signing v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-launch-controller-control-offline-signing-v1.yml"
      - "ops/nimo/void-nimo-wc-void-launch-controller-control-signing-v1.mjs"
      - "scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs"
      - "docs/operators/wc-void-launch-controller-control-offline-signing-v1.md"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "tools/void-reviewed-node-package-runtime-v1.mjs"
      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: VOID launch-controller offline signing v1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prove offline launch-controller control signer
        run: node scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs
