name: VOID WC-VOID launch-controller control offline signing v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-launch-controller-control-offline-signing-v1.yml"
      - "ops/nimo/void-nimo-wc-void-launch-controller-control-signing-v1.mjs"
      - "ops/nimo/void-nimo-wc-void-launch-controller-control-signing-v2.mjs"
      - "ops/nimo/void-nimo-wc-void-launch-controller-control-signing-launch-v1.sh"
      - "ops/nimo/void-nimo-wc-void-launch-controller-control-signing-launch-v2.sh"
      - "scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs"
      - "scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v2.mjs"
      - "tools/void-wc-void-launch-controller-control-requalification-v2.mjs"
      - "docs/operators/wc-void-launch-controller-control-offline-signing-v1.md"
      - "tools/void-wc-void-launch-controller-control-requalification-v1.mjs"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove:
    name: VOID launch-controller offline signing v1 / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.12.0"
          - "22.13.0"
          - "22"
          - "24"
          - "26"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Bind matrix Node to production absolute path
        run: |
          selected_node="$(command -v node)"
          test -x "$selected_node"
          sudo rm -f /usr/bin/node
          sudo ln -s "$selected_node" /usr/bin/node
          test "$(readlink -f /usr/bin/node)" = "$(readlink -f "$selected_node")"

      - name: Prove offline launch-controller control signer generation
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/nimo/void-nimo-wc-void-launch-controller-control-signing-v1.mjs
          node --check ops/nimo/void-nimo-wc-void-launch-controller-control-signing-v2.mjs
          bash -n ops/nimo/void-nimo-wc-void-launch-controller-control-signing-launch-v1.sh
          bash -n ops/nimo/void-nimo-wc-void-launch-controller-control-signing-launch-v2.sh
          node --check scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs
          node --check scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v2.mjs
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"
          case "$package_blob:$lock_blob" in
            f28c3e9446c7623ef203da36a9642d046e5f34ee:b2671f0149f522b2489247016df0a5ec4bb72b8b)
              node scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs
              echo "offline_signing_source_generation=historical_v1"
              ;;
            14fbdf5717b07fd4c734f5da7a8e84ed59bee93f:15b5c82ea36f13079a2f9e8863722f654eb3f201)
              hold="$RUNNER_TEMP/offline-signing-v1-hold.txt"
              if node scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v1.mjs >"$hold" 2>&1; then
                echo "unexpected V1 offline signer acceptance of audited package generation" >&2
                exit 1
              fi
              grep -F 'control_source_blob_mismatch:package.json' "$hold"
              node scripts/prove_void_nimo_wc_void_launch_controller_control_signing_v2.mjs
              echo "offline_signing_source_generation=audited_v2"
              ;;
            *)
              echo "unknown package generation" >&2
              exit 1
              ;;
          esac
