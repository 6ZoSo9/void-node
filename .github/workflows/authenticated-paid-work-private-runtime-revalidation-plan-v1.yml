name: Authenticated paid-work private runtime revalidation plan v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-private-runtime-revalidation-plan-v1.yml"
      - "config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-plan-v1.json"
      - "config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.json"
      - "schemas/authenticated-paid-work-private-runtime-revalidation-plan-v1.schema.json"
      - "schemas/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.schema.json"
      - "docs/operations/authenticated-paid-work-private-runtime-revalidation-plan-v1.md"
      - "docs/operations/authenticated-paid-work-post-expiry-recovery-preparation-v1.md"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-binding-v1.md"
      - "scripts/prove_authenticated_paid_work_private_runtime_revalidation_plan_v1.mjs"
      - "scripts/prove_authenticated_paid_work_private_runtime_revalidation_current_main_reconciliation_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-paid-work-private-runtime-revalidation-plan-v1.yml"
      - "config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-plan-v1.json"
      - "config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.json"
      - "schemas/authenticated-paid-work-private-runtime-revalidation-plan-v1.schema.json"
      - "schemas/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.schema.json"
      - "docs/operations/authenticated-paid-work-private-runtime-revalidation-plan-v1.md"
      - "docs/operations/authenticated-paid-work-post-expiry-recovery-preparation-v1.md"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-binding-v1.md"
      - "scripts/prove_authenticated_paid_work_private_runtime_revalidation_plan_v1.mjs"
      - "scripts/prove_authenticated_paid_work_private_runtime_revalidation_current_main_reconciliation_v1.mjs"

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-private-runtime-revalidation-plan-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require merged replacement and current-main reconciliation contracts
        run: |
          test -f integrations/agents/authenticated-paid-work-runtime-revalidation-v1/index.mjs
          test -f integrations/agents/authenticated-paid-work-credential-rotation-v1/index.mjs
          test -f integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/index.mjs
          test -f integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/evidence-binding-guard-v1.mjs
          test -f integrations/agents/authenticated-paid-work-replacement-issuance-preparation-v1/closed-input-guard-v1.mjs
          test -f integrations/agents/authenticated-paid-work-post-expiry-recovery-preparation-v1/index.mjs
          test -f integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs
      - name: Parse source contracts
        run: |
          python3 -m json.tool config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-plan-v1.json >/dev/null
          python3 -m json.tool config/activation-candidates/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.json >/dev/null
          python3 -m json.tool schemas/authenticated-paid-work-private-runtime-revalidation-plan-v1.schema.json >/dev/null
          python3 -m json.tool schemas/authenticated-paid-work-private-runtime-revalidation-current-main-reconciliation-v1.schema.json >/dev/null
      - name: Check proof syntax
        run: |
          node --check scripts/prove_authenticated_paid_work_private_runtime_revalidation_plan_v1.mjs
          node --check scripts/prove_authenticated_paid_work_private_runtime_revalidation_current_main_reconciliation_v1.mjs
      - name: Prove immutable private runtime revalidation plan
        run: node scripts/prove_authenticated_paid_work_private_runtime_revalidation_plan_v1.mjs
      - name: Prove current-main semantic reconciliation
        run: node scripts/prove_authenticated_paid_work_private_runtime_revalidation_current_main_reconciliation_v1.mjs
      - run: npm run typecheck
