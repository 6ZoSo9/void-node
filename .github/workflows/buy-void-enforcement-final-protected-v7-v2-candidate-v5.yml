name: VOID Buy VOID protected V5 enforcement candidate

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v5.yml"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v5.md"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs"
      - ".github/workflows/buy-void-protected-v4-lock-canonical-v5-composition-v2.yml"
      - "docs/architecture/buy-void-protected-v4-lock-canonical-v5-composition-v2.md"
      - "scripts/prove_buy_void_protected_v4_lock_canonical_v5_composition_v2.mjs"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs"
      - "src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and three-add scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=a016ea761ccdba10352337ad97c05ba8b52ce6cf
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'A\t.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v5.yml'
            $'A\tdocs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v5.md'
            $'A\tscripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs'
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${actual[$i]}" = "${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact candidate proof surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs)" = "26c2fd7f0650d42d413472c6a9d6e9361c88345e"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-enforcement-final-protected-v7-v2-candidate-v5.md)" = "bdaa585fbaa741279b496e8d4359607c1d8e9683"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v4.json)" = "ec00f0c552e600fff38e4998e4beb128c93b481d"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v4.json)" = "4de9c2185a1359d2877b17958666f91497a91179"
          test "$(git rev-parse HEAD:ops/run-void-node-live-v1.sh)" = "bc6a17ccdf389299fb139db37e742f0b1ad9dc4e"
          test "$(git rev-parse HEAD:src/index.ts)" = "a09661797aa4295371c036be36d82995e5233269"

      - name: Syntax
        run: node --check scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs

      - name: Descriptor-reader adversarial self-test
        run: node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs --reader-self-test

      - name: Derive V5 twice
        shell: bash
        run: |
          set -euo pipefail
          PROOF=scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs
          OUT="$RUNNER_TEMP/candidate-v5-node-${{ matrix.node }}.json"
          AGAIN="$RUNNER_TEMP/candidate-v5-node-${{ matrix.node }}.again.json"
          node "$PROOF" --derive > "$OUT"
          node "$PROOF" --derive > "$AGAIN"
          cmp "$OUT" "$AGAIN"
          node "$PROOF" --self-test
          sha256sum "$OUT"

      - name: Upload exact V5 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-protected-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/candidate-v5-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Download Node-major candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-protected-v5-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require cross-node byte identity and independent rederivation
        shell: bash
        run: |
          set -euo pipefail
          cmp receipts/candidate-v5-node-22.json receipts/candidate-v5-node-24.json
          cmp receipts/candidate-v5-node-22.json receipts/candidate-v5-node-26.json
          node scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v5.mjs --derive > "$RUNNER_TEMP/rederived-v5.json"
          cmp receipts/candidate-v5-node-22.json "$RUNNER_TEMP/rederived-v5.json"
          node - <<'NODE'
          const fs=require("node:fs");
          const v=JSON.parse(fs.readFileSync("receipts/candidate-v5-node-22.json","utf8"));
          if(v.marker!=="VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V5")process.exit(2);
          if(v.current_enforcement_tracked_source_inventory_count!==49)process.exit(3);
          if(v.executable_closure_transition?.protected_source_delta_count!==1)process.exit(4);
          if(v.complete_executable_closure_verified!==true)process.exit(5);
          if(v.candidate_enforcement_identity_accepted!==false)process.exit(6);
          if(v.deployed_artifact_generation_verified!==false)process.exit(7);
          if(v.runtime_mount_authority!==false)process.exit(8);
          if(v.production_source_finality_authority_ready!==false)process.exit(9);
          if(v.public_presale_activation!==false)process.exit(10);
          if(v.funds_movement!==false)process.exit(11);
          console.log("VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CANDIDATE_V5_CROSS_NODE_GREEN");
          console.log("candidate_enforcement_set_sha256="+v.candidate_enforcement_set_sha256);
          console.log("current_inventory_sha256="+v.current_enforcement_tracked_source_inventory_sha256);
          console.log("candidate_enforcement_identity_accepted=false");
          console.log("deployed_artifact_generation_verified=false");
          console.log("runtime_mount_authority=false");
          console.log("production_source_finality_authority_ready=false");
          console.log("public_presale_activation=false");
          console.log("funds_movement=false");
          NODE