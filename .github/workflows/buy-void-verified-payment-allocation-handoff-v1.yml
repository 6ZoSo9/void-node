name: VOID Buy VOID verified payment allocation handoff v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_v1.ts"
      - "scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts"
      - "scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v1.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v2.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v3.mjs"
      - "docs/architecture/buy-void-verified-payment-allocation-handoff-v1.md"
      - ".github/workflows/buy-void-verified-payment-allocation-handoff-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-verified-payment-allocation-handoff-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: payment allocation handoff / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Prove durable payment to allocation handoff
        run: npx tsx scripts/prove_buy_void_verified_payment_allocation_handoff_v1.ts

      - name: Preserve serialized payment capacity admission
        run: npx tsx scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts

      - name: Preserve descriptor-bound allocation publication
        run: npx tsx scripts/prove_buy_void_allocation_reservation_publication_writer_v1.ts

      - name: Preserve verified allocation replay lineage
        run: node scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs

      - name: Preserve frozen V1/V2 rejection and prove current V3 crash specification
        run: |
          set -euo pipefail
          # Both historical editions check allocation before replay. Preserve their
          # bytes and require that exact generation refusal, not just any failure.
          for version in 1 2; do
            proof="scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v$version.mjs"
            case "$version" in
              1) expected_blob="1a8db260a134ad438366d5b7660f926768c98a79" ;;
              2) expected_blob="d42148523c44d95d3b87236ade22cfb92dcb5bee" ;;
            esac
            test "$(git hash-object -- "$proof")" = "$expected_blob"
            log="$RUNNER_TEMP/frozen-handoff-v$version.log"
            status=0
            node "$proof" > "$log" 2>&1 || status=$?
            test "$status" -eq 1
            grep -F 'AssertionError [ERR_ASSERTION]: reviewed_source_blob_drift:src/economic/buy_void_allocation_reservation_ledger_v1.ts' "$log"
            grep -F "actual: '66617a89d5ad9f81b5a21d98cca55fcda6902a80'" "$log"
            grep -F "expected: 'c3fc204710a9189723651cfeb6ffc52b1aa049db'" "$log"
          done
          node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v3.mjs \
            > "$RUNNER_TEMP/current-handoff-v3.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            assert.equal(result.marker,
              "VOID_BUY_VOID_PAYMENT_ALLOCATION_HYPOTHETICAL_CRASH_MATRIX_V3");
            assert.equal(result.reviewed_current_replay_source_blob_sha1,
              "895a429ec7a2ef554552cdaa821731d7a645a701");
            assert.equal(result.frozen_predecessor_crash_proof_git_blob_sha1,
              "1a8db260a134ad438366d5b7660f926768c98a79");
            assert.equal(result.frozen_historical_V1_proof_unchanged, true);
            assert.equal(result.source_only, true);
            assert.equal(result.reviewed_combined_source_head,
              "452ac177df4ac63d53cac36ba10216ff68495a77");
            assert.equal(result.reviewed_current_allocation_source_blob_sha1,
              "66617a89d5ad9f81b5a21d98cca55fcda6902a80");
            assert.equal(result.frozen_historical_V2_proof_git_blob_sha1,
              "d42148523c44d95d3b87236ade22cfb92dcb5bee");
            assert.equal(result.frozen_historical_V2_proof_unchanged, true);
            assert.equal(result.forged_prior_event_buffer_length_rejected, true);
            assert.equal(result.forged_allocation_buffer_length_does_not_erase_idempotent_reservation, true);
            assert.equal(result.inventory_units_after_synthetic_sellout, "0");
            assert.equal(result.valid_oversell_rejected_for_insufficient_inventory, true);
            assert.equal(result.malformed_oversell_input_rejected_for_distinct_plain_data_reason, true);
            assert.equal(result.initial_buyer_wallet_missing_variants_rejected, 3);
            assert.equal(result.late_buyer_wallet_backfill_verified_allocation_rejected, true);
            assert.equal(result.changed_original_buyer_wallet_rejected, true);
            assert.equal(result.late_tx_and_receive_with_original_wallet_positive, true);
            assert.deepEqual(result.observed_publication_phases,
              ["intent_only", "ledger_committed", "complete"]);
            assert.equal(result.next_allocation_record_count, 1);
            assert.equal(result.exact_replay_idempotent, true);
            assert.equal(result.conflicting_identity_rejected, true);
            assert.equal(result.malformed_or_orphan_history_rejected, true);
            for (const field of [
              "proposed_allocation_mutated",
              "actual_durable_payment_fsync_verified",
              "verified_capacity_and_request_locks_held",
              "independently_proven_original_request",
              "protected_high_water_custody_verified",
              "allocation_publication_integrated",
              "exactly_once_allocation_production_ready",
              "signer_or_wallet_access",
              "production_source_finality_authority_ready",
              "presale_activation",
              "funds_moved",
            ]) assert.equal(result[field], false, field);
            console.log("VOID_BUY_VOID_HANDOFF_FROZEN_V1_V2_HOLD_CURRENT_V3_GREEN");
          ' "$RUNNER_TEMP/current-handoff-v3.json"

      - name: Verify source tree cleanliness
        run: test -z "$(git status --porcelain=v1)"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
