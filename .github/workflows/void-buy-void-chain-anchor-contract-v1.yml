name: VOID Buy VOID chain anchor contract v1

on:
  pull_request:
    paths:
      - "scripts/lib/void_buy_void_chain_anchor_contract_v1.mjs"
      - "scripts/prove_void_buy_void_chain_anchor_contract_v1.mjs"
      - "schemas/buy-void-chain-anchor-contract-v1.schema.json"
      - "fixtures/economic/buy-void-chain-anchor-contract-v1.example.json"
      - "docs/architecture/buy-void-chain-anchor-and-datanet-boundary-v1.md"
      - ".github/workflows/void-buy-void-chain-anchor-contract-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/void_buy_void_chain_anchor_contract_v1.mjs"
      - "scripts/prove_void_buy_void_chain_anchor_contract_v1.mjs"
      - "schemas/buy-void-chain-anchor-contract-v1.schema.json"
      - "fixtures/economic/buy-void-chain-anchor-contract-v1.example.json"
      - "docs/architecture/buy-void-chain-anchor-and-datanet-boundary-v1.md"
      - ".github/workflows/void-buy-void-chain-anchor-contract-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-buy-void-chain-anchor-contract-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Check module syntax
        run: node --check scripts/lib/void_buy_void_chain_anchor_contract_v1.mjs
      - name: Check proof syntax
        run: node --check scripts/prove_void_buy_void_chain_anchor_contract_v1.mjs
      - name: Prove dual-rail chain anchor and DataNet boundary
        run: node scripts/prove_void_buy_void_chain_anchor_contract_v1.mjs
      - name: Diff hygiene
        run: git diff --check
