name: VOID Buy VOID claimed PostgreSQL activation contract v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-activation-contract-v1.yml"
      - "docs/operators/buy-void-payment-keyed-dispatcher-postgres-activation-contract-v1.md"
      - "ops/mainnet0/buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.json"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts"
      - "tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs"
      - "tools/void-buy-void-epoch2-postgres-source-qualification-v3.mjs"
      - "scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v3.mjs"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_payment_keyed_full_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_admitted_guarded_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_contract_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-payment-keyed-dispatcher-postgres-activation-contract-v1.yml"
      - "docs/operators/buy-void-payment-keyed-dispatcher-postgres-activation-contract-v1.md"
      - "ops/mainnet0/buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.json"
      - "scripts/prove_buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts"
      - "tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs"
      - "tools/void-buy-void-epoch2-postgres-source-qualification-v3.mjs"
      - "scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v3.mjs"
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_payment_keyed_full_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_admitted_guarded_runtime_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_v1.ts"
      - "src/economic/buy_void_payment_keyed_dispatcher_postgres_claimed_runtime_parent_contract_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node.js major
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: node --check tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs
      - name: Preserve predecessor and qualify current Epoch-2 source
        shell: bash
        run: |
          set -euo pipefail
          predecessor="084b9a657be7cc074dfd954d37651d8b00d47153"
          git merge-base --is-ancestor "$predecessor" HEAD
          test "$(git rev-parse "$predecessor:tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs")" = "db6a56b56eea4fe150ad1ebc98519bc263b70ee2"
          test "$(git rev-parse "$predecessor:scripts/prove_buy_void_payment_keyed-dispatcher-postgres-activation-contract-v1.ts")" = "a6759292c99f8b77e1bc2fc725621225dbd51e22"
          test "$(git rev-parse "$predecessor:ops/mainnet0/buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.json")" = "ed853b88329cd3a708b22a025cec0fe48540168a"
          echo "PRE_REBIND_E1_CARRIER_PRESERVED=true"

          test "$(git rev-parse HEAD:tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs)" = "f8281ffc9cfbfd2b810a11a10f8cb3ff8473fa95"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_payment_keyed_dispatcher-postgres-activation-contract-v1.ts)" = "674de094c6750a1f7498fa06efa6f7571edb3151"
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-postgres-source-qualification-v3.mjs)" = "38230df7822b3dcbdc24a42e4fd2e2c24cc43009"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_epoch2_postgres_source_qualification_v3.mjs)" = "95f4ac1c4c764feed6b1782c22f1ec1038518015"

          node tools/void-buy-void-payment-keyed-dispatcher-postgres-activation-candidate-v1.mjs > "$RUNNER_TEMP/current-activation-candidate.log"
          grep -Fx 'status=candidate_verified_activation_not_authorized' "$RUNNER_TEMP/current-activation-candidate.log"
          grep -Fx 'activation_authorized=false' "$RUNNER_TEMP/current-activation-candidate.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/current-activation-candidate.log"

          node tools/void-buy-void-epoch2-postgres-source-qualification-v3.mjs > "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'marker=VOID_BUY_VOID_EPOCH2_CLAIMED_PG_SOURCE_QUALIFICATION_V3' "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'historical_v1_source_qualification_preserved=true' "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'historical_v2_signer_control_evidence_preserved=true' "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'current_activation_candidate_source_requalified=true' "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'activation_authorized=false' "$RUNNER_TEMP/e2-source-v3.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/e2-source-v3.log"
      - name: Prove current activation state machine
        run: npm exec -- tsx scripts/prove_buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts
      - name: Root typecheck
        run: npm run typecheck
      - name: Focused proof typecheck
        run: >-
          npm exec -- tsc
          --noEmit
          --strict
          --skipLibCheck
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --types node
          scripts/prove_buy_void_payment_keyed_dispatcher_postgres_activation_contract_v1.ts
      - name: Diff hygiene
        shell: bash
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          git diff --check "$base"...HEAD
