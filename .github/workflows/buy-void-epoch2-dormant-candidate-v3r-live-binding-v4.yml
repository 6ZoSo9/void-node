name: Buy VOID Epoch-2 dormant candidate V3R live binding V4

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml"
      - "docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs"
      - "scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V4 successor scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT_NAME" in
            pull_request)
              case "$BASE_REF" in
                ren/epoch2-v6r3-main-integration-v1-20261019|ren/epoch2-dormant-v3r-live-binding-v4-current-source-20261019|ren/epoch2-dormant-v4-retained-root-exec-v1-20261020|ren/epoch2-dormant-v4-canonical-configured-root-exec-v1-20261020)
                  base="$PR_BASE"
                  ;;
                *)
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch)
              base="977164822ca9032a9f8ec2fd988758102612d866"
              ;;
            *)
              exit 1
              ;;
          esac
          git merge-base --is-ancestor 977164822ca9032a9f8ec2fd988758102612d866 "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml' \
            'docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md' \
            'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c' \
            'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs' \
            'scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs)" = \
            "fec8dcf902e15aa4d121ac6561bd00cc0eb503ac"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c)" = \
            "370ba9a37b1e1d31d4f3aac5de6e173e5bde0941"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py)" = \
            "c56c367e90b8e123f7cde75e0331457ba0967c13"
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md)" = \
            "96abcc08a3b44887b651cedbc6ea9af2c7668c96"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Dynamic current-source V4 proof
        run: |
          set -euo pipefail
          node --check ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py \
            | tee "$RUNNER_TEMP/proof.log"

          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_CANDIDATE_V3R_LIVE_BINDING_V4_PROOF_GREEN' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_head_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_tree_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_head_runtime_observed=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_tree_runtime_observed=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_actual_object_ancestry_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_graft_only_ancestry_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_dependency_count=9' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_complete_dependency_set_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'historical_compat_v3_source_authority=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_receipt_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_source_checkout_crosscheck_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_source_checkout_drift_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runtime_policy_sha256_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runtime_policy_authenticated_by_native_preentry=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'historical_generation_overclaim_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_preentry_binds_exact_binder_bytes=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_retained_root_exec_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_ancestor_and_runtime_acl_guard_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_configured_original_path_symlink_guard_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_root_child_retained_fd_sha256_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_root_child_static_no_interp_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'host_execution=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'credential_access=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'signing=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'transaction=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'payment_acceptance=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'wc_void_market_activation=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/proof.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
