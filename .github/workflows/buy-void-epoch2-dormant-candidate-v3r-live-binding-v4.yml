name: Buy VOID Epoch-2 dormant candidate V3R live binding V4

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml"
      - "docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs"
      - "scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V4 successor scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "pull_request"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$BASE_REF" in
            ren/epoch2-v6r3-main-integration-v1-20261019|ren/epoch2-dormant-v3r-live-binding-v4-current-source-20261019|ren/epoch2-dormant-v4-retained-root-exec-v1-20261020|ren/epoch2-dormant-v4-canonical-configured-root-exec-v1-20261020|ren/epoch2-dormant-native-byte-firstexec-guard-v1-20261020)
              base="$PR_BASE"
              ;;
            ren/epoch2-dormant-root-elf-parser-adversarial-proof-20261020)
              base="$PR_BASE"
              test "$base" = "268680e4e00d7adfed4695a3051ddb437510262a"
              ;;
            ren/epoch2-dormant-v4-proof-optimized-codeobject-hold-20261020)
              base="$PR_BASE"
              test "$base" = "8a58301048437f6406349665dcd6c48287fce53a"
              ;;
            ren/epoch2-dormant-elf-load-extent-independent-fixture-20261020)
              base="$PR_BASE"
              test "$base" = "891db34c74ebbba102515e5184f157ec1898cb46"
              ;;
            ren/epoch2-dormant-native-preentry-sealed-source-v1-20261020)
              base="$PR_BASE"
              test "$base" = "9746fdd767f35cb08e2967c616fb5da4a144c44e"
              ;;
            ren/epoch2-binder-native-nonblocking-trusted-open-v1-20261020)
              base="$PR_BASE"
              test "$base" = "d44a2a57abf80d41eac605cbe8518f0dc7b673b7"
              ;;
            main)
              git fetch --no-tags --prune origin \
                '+refs/heads/main:refs/remotes/origin/main'
              base="$(git rev-parse refs/remotes/origin/main)"
              test -n "$base"
              ;;
            *)
              exit 1
              ;;
          esac
          if [ "$BASE_REF" = "main" ]; then
            git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"
          else
            git merge-base --is-ancestor 977164822ca9032a9f8ec2fd988758102612d866 "$EXPECTED_HEAD"
          fi

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          if [ "$BASE_REF" = "main" ]; then
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml' \
              '.github/workflows/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.yml' \
              '.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.yml' \
              '.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.yml' \
              '.github/workflows/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.yml' \
              'docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md' \
              'docs/operators/buy-void-epoch2-live-binding-source-runtime-compat-contract-v1.md' \
              'docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.md' \
              'docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.md' \
              'docs/operators/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.md' \
              'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs' \
              'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c' \
              'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs' \
              'ops/precision/void_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py' \
              'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py' \
              'ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json' \
              'scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py' \
              'scripts/prove_buy_void_epoch2_live_binding_source_runtime_compat_contract_v1.py' \
              'scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_lock_v6r3.py' \
              'scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py' \
              'scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py' \
              | sort > "$expected"
          elif [ "$BASE_REF" = "ren/epoch2-dormant-root-elf-parser-adversarial-proof-20261020" ]; then
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml' \
              'docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md' \
              'scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py' \
              | sort > "$expected"
          elif [ "$BASE_REF" = "ren/epoch2-dormant-elf-load-extent-independent-fixture-20261020" ] || \
               [ "$BASE_REF" = "ren/epoch2-dormant-native-preentry-sealed-source-v1-20261020" ]; then
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml' \
              'docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md' \
              'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c' \
              'scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py' \
              | sort > "$expected"
          else
            printf '%s\n' \
              '.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml' \
              'docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md' \
              'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c' \
              'ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs' \
              'scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py' \
              | sort > "$expected"
          fi
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          if [ "$BASE_REF" = "main" ]; then
            historical_leaf="41380839014d202421643d252288bd89985a1191"
            adapted_workflow='.github/workflows/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.yml'
            adapted_native='ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c'
            adapted_proof='scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py'
            adapted_doc='docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md'
            git cat-file -e "$historical_leaf^{commit}"
            test "$(wc -l < "$expected")" -eq 21
            inherited_count=0
            adapted_count=0
            while IFS= read -r relative; do
              current_entry="$(git ls-tree "$EXPECTED_HEAD" -- "$relative")"
              historical_entry="$(git ls-tree "$historical_leaf" -- "$relative")"
              test -n "$current_entry"
              test -n "$historical_entry"
              case "$relative" in
                "$adapted_workflow")
                  test "$(printf '%s\n' "$current_entry" | awk '{print $1" "$2}')" = \
                       "$(printf '%s\n' "$historical_entry" | awk '{print $1" "$2}')"
                  current_blob="$(git rev-parse "$EXPECTED_HEAD:$relative")"
                  historical_blob="$(git rev-parse "$historical_leaf:$relative")"
                  [[ "$current_blob" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$historical_blob" =~ ^[0-9a-f]{40}$ ]]
                  test "$current_blob" != "$historical_blob"
                  adapted_count=$((adapted_count+1))
                  ;;
                "$adapted_native")
                  test "$(printf '%s\n' "$current_entry" | awk '{print $1" "$2}')" = \
                       "$(printf '%s\n' "$historical_entry" | awk '{print $1" "$2}')"
                  test "$(git rev-parse "$historical_leaf:$relative")" = \
                    "704f3726600690605303d9083976225f4913b446"
                  test "$(git rev-parse "$EXPECTED_HEAD:$relative")" = \
                    "e5920575541001bff00abf894f0d62869d8f2452"
                  adapted_count=$((adapted_count+1))
                  ;;
                "$adapted_proof")
                  test "$(printf '%s\n' "$current_entry" | awk '{print $1" "$2}')" = \
                       "$(printf '%s\n' "$historical_entry" | awk '{print $1" "$2}')"
                  test "$(git rev-parse "$historical_leaf:$relative")" = \
                    "3321e8a0cf05ab2272951b34aef8185fef3caf0d"
                  test "$(git rev-parse "$EXPECTED_HEAD:$relative")" = \
                    "63c7a41d6e6e40e109fb5baaba5539754d0d87b2"
                  adapted_count=$((adapted_count+1))
                  ;;
                "$adapted_doc")
                  test "$(printf '%s\n' "$current_entry" | awk '{print $1" "$2}')" = \
                       "$(printf '%s\n' "$historical_entry" | awk '{print $1" "$2}')"
                  test "$(git rev-parse "$historical_leaf:$relative")" = \
                    "dd21593a9e4e3086c08fb22f55ffd1727fa8569e"
                  test "$(git rev-parse "$EXPECTED_HEAD:$relative")" = \
                    "839a166286ccc2b22383edb5c94220c7e0f3df16"
                  adapted_count=$((adapted_count+1))
                  ;;
                *)
                  test "$current_entry" = "$historical_entry"
                  inherited_count=$((inherited_count+1))
                  ;;
              esac
            done < "$expected"
            test "$inherited_count" -eq 17
            test "$adapted_count" -eq 4
          fi

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs)" = \
            "d2d648b144d3b406ff845a597fa4b9f54167b6bc"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v4.c)" = \
            "e5920575541001bff00abf894f0d62869d8f2452"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py)" = \
            "63c7a41d6e6e40e109fb5baaba5539754d0d87b2"
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-candidate-v3r-live-binding-v4.md)" = \
            "839a166286ccc2b22383edb5c94220c7e0f3df16"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Dynamic current-source V4 proof
        run: |
          set -euo pipefail
          node --check ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.mjs
          python3 -I -B -S scripts/prove_buy_void_epoch2_dormant_candidate_v3r_live_binding_v4.py \
            | tee "$RUNNER_TEMP/proof.log"

          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_CANDIDATE_V3R_LIVE_BINDING_V4_PROOF_GREEN' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_head_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_tree_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_head_runtime_observed=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_tree_runtime_observed=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_actual_object_ancestry_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_graft_only_ancestry_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_dependency_count=9' "$RUNNER_TEMP/proof.log"
          grep -Fx 'source_runtime_complete_dependency_set_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'historical_compat_v3_source_authority=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_receipt_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_source_checkout_crosscheck_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runner_v4_child_source_checkout_drift_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runtime_policy_sha256_compile_constant_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'runtime_policy_authenticated_by_native_preentry=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'historical_generation_overclaim_absent=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_preentry_binds_exact_binder_bytes=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_sealed_memfd_source_verified_before_root_fork=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_inplace_mutation_cannot_change_streamed_js=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_trusted_open_fifo_swap_nonblocking=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_policy_exact_physical_bytes_canonical=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'native_policy_embedded_nul_blank_suffix_leading_zero_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_terminal_installed_source_digest_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_same_inode_size_mutation_receipt_rejection_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_parent_private_proof_accepted_digest_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_retained_root_exec_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_ancestor_and_runtime_acl_guard_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_configured_original_path_symlink_guard_source_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_accepted_lock_v6r2_digest_bound=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_exact_fd_elf_parser_fixture_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_ptload_memory_file_and_offset_bounds_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_short_read_and_generation_drift_negative_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'optimized_python_negative_fixtures=2' "$RUNNER_TEMP/proof.log"
          grep -Fx 'optimized_code_object_negative_fixtures=2' "$RUNNER_TEMP/proof.log"
          grep -Fx 'per_code_object_debug_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'isolated_no_site_python_proof_entry_required=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'pre_guard_future_import_poison_rejected=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'binder_native_retained_root_fd_static_elf_guard_proven=true' "$RUNNER_TEMP/proof.log"
          grep -Fx 'host_execution=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'credential_access=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'signing=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'transaction=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'payment_acceptance=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'wc_void_market_activation=false' "$RUNNER_TEMP/proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/proof.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
