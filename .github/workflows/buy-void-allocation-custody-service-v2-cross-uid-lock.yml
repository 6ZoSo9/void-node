name: VOID Buy VOID allocation custody service v2 cross-UID lock

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-service-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_service_v2.mjs"
      - "tools/void-buy-allocation-custody-inspect-client-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_inspect_client_v1.mjs"
      - "docs/architecture/buy-void-custody-inspect-ipc-v1.md"
      - "src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
      - "scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs"
      - "src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs"
      - "src/economic/buy_void_custody_payment_ledgers_observed_read_v1.mjs"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - ".github/workflows/buy-void-allocation-custody-service-v2-cross-uid-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-custody-service-v2-cross-uid-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: custody V2 cross-UID / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build canonical dependencies
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Syntax-check V2 custody source and proof
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-service-v2.mjs
          node --check scripts/prove_void_buy_allocation_custody_service_v2.mjs
          node --check tools/void-buy-allocation-custody-inspect-client-v1.mjs
          node --check scripts/prove_void_buy_allocation_custody_inspect_client_v1.mjs
          node --check src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs
          node --check scripts/prove_buy_void_cross_uid_capacity_exclusive_lock_v1.mjs

      - name: Prove ordinary custody V2 HOLD boundary
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_allocation_custody_service_v2.mjs \
            | tee "custody-v2-ordinary-${{ matrix.node }}.txt"
          for marker in \
            'VOID_BUY_VOID_ALLOCATION_CUSTODY_SERVICE_V2_PROOF_GREEN' \
            'v1_service_untouched=true' \
            'custody_cross_uid_lock_participation_source_bound=true' \
            'read_validation_hold_releases_lock=true' \
            'durable_payment_provenance_reaches_web_writer_lock_hold=true' \
            'web_payment_writer_cross_uid_lock_participation_verified=false' \
            'payment_capacity_lock_verified=false' \
            'allocation_handoff_atomicity_proven=false' \
            'reserve_method_enabled=false' \
            'recovery_terminal_before_new_transition=false' \
            'allocation_write=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "custody-v2-ordinary-${{ matrix.node }}.txt"
          done

      - name: Prove source-only V2 inspect socket client
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-inspect-client-v1.mjs
          node --check scripts/prove_void_buy_allocation_custody_inspect_client_v1.mjs
          node scripts/prove_void_buy_allocation_custody_inspect_client_v1.mjs \
            | tee "custody-v2-inspect-client-${{ matrix.node }}.txt"
          for marker in \
            'VOID_BUY_VOID_CUSTODY_INSPECT_IPC_V1_PROOF_GREEN' \
            'bounded_socket_request_and_reply=true' \
            'request_digest_bound=true' \
            'utf8_decoder_intrinsic_bound=true' \
            'malformed_and_oversize_replies_hold=true' \
            'positive_decision_authority_false=true' \
            'socket_path_and_metadata_preflight=true' \
            'absolute_deadline_enforced=true' \
            'config_proxy_and_accessors_not_executed=true' \
            'actual_custody_v2_server_protocol_proven=true' \
            'cross_uid_principal_separation_verified=false' \
            'protected_custody_verified=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "custody-v2-inspect-client-${{ matrix.node }}.txt"
          done

      - name: Prove actual web-to-custody lock contention
        run: |
          set -euo pipefail

          NODE="$(command -v node)"
          GROUP="voidv2ipc"
          CUST="voidv2custody"
          WEB="voidv2web"
          CODE="/tmp/void-custody-v2-code-${{ github.run_id }}-${{ matrix.node }}"
          DATA="/tmp/void-custody-v2-data-${{ github.run_id }}-${{ matrix.node }}"
          SHARED="/tmp/void-custody-v2-lock-${{ github.run_id }}-${{ matrix.node }}"
          LOGROOT="/tmp/void-custody-v2-logdir-${{ github.run_id }}-${{ matrix.node }}"
          LOG="$LOGROOT/contention.log"

          sudo groupadd "$GROUP"
          sudo useradd -M -s /usr/sbin/nologin -g "$GROUP" "$CUST"
          sudo useradd -M -s /usr/sbin/nologin -g "$GROUP" "$WEB"

          CUST_UID="$(id -u "$CUST")"
          WEB_UID="$(id -u "$WEB")"
          GID="$(getent group "$GROUP" | cut -d: -f3)"
          test "$CUST_UID" -ne "$WEB_UID"
          test "$CUST_UID" -gt 0
          test "$WEB_UID" -gt 0
          test "$GID" -gt 0

          sudo install -d -m 0755 -o root -g root \
            "$CODE" "$CODE/dist" "$CODE/src" "$CODE/tools" "$CODE/scripts"
          sudo cp -a dist/economic "$CODE/dist/"
          sudo cp -a src/economic "$CODE/src/"
          sudo install -m 0444 -o root -g root \
            tools/void-buy-allocation-custody-service-v2.mjs \
            "$CODE/tools/void-buy-allocation-custody-service-v2.mjs"
          sudo install -m 0444 -o root -g root \
            scripts/prove_void_buy_allocation_custody_service_v2.mjs \
            "$CODE/scripts/prove_void_buy_allocation_custody_service_v2.mjs"
          sudo install -m 0444 -o root -g root \
            scripts/prove_buy_void_cross_uid_capacity_exclusive_lock_v1.mjs \
            "$CODE/scripts/prove_buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
          sudo chown -R root:root "$CODE"
          sudo find "$CODE" -type d -exec chmod 0555 {} +
          sudo find "$CODE" -type f -exec chmod 0444 {} +

          cmp tools/void-buy-allocation-custody-service-v2.mjs \
            "$CODE/tools/void-buy-allocation-custody-service-v2.mjs"
          cmp scripts/prove_void_buy_allocation_custody_service_v2.mjs \
            "$CODE/scripts/prove_void_buy_allocation_custody_service_v2.mjs"
          cmp src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs \
            "$CODE/src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"

          sudo install -d -m 0700 -o "$CUST" -g "$GROUP" "$DATA"
          sudo install -d -m 3770 -o "$CUST" -g "$GROUP" "$SHARED"
          sudo install -d -m 0770 -o "$CUST" -g "$GROUP" "$LOGROOT"
          sudo install -m 0660 -o "$CUST" -g "$GROUP" /dev/null "$LOG"

          WEB_PROOF="$CODE/scripts/prove_buy_void_cross_uid_capacity_exclusive_lock_v1.mjs"
          CUST_PROOF="$CODE/scripts/prove_void_buy_allocation_custody_service_v2.mjs"

          sudo runuser -u "$WEB" -- "$NODE" "$WEB_PROOF" --worker \
            "$SHARED" "$CUST_UID" "$WEB_UID" "$GID" "$LOG" \
            web-holder success 5000 10 \
            > "custody-v2-web-holder-${{ matrix.node }}.txt" &
          WEB_PID=$!

          seen=false
          for _ in $(seq 1 200); do
            if sudo grep -Fxq 'enter:web-holder' "$LOG"; then
              seen=true
              break
            fi
            sleep 0.01
          done
          test "$seen" = true

          sudo runuser -u "$CUST" -- "$NODE" "$CUST_PROOF" \
            --custody-reserve-worker \
            "$DATA" "$SHARED" "$WEB_UID" "$GID" "$LOG" \
            > "custody-v2-custody-worker-${{ matrix.node }}.txt"

          wait "$WEB_PID"

          grep -Fx 'VOID_CROSS_UID_WORKER_SUCCESS_GREEN' \
            "custody-v2-web-holder-${{ matrix.node }}.txt"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_V2_TWO_UID_RESERVE_GREEN' \
            "custody-v2-custody-worker-${{ matrix.node }}.txt"
          grep -Fx 'custody_waited_for_foreign_web_lock=true' \
            "custody-v2-custody-worker-${{ matrix.node }}.txt"
          grep -Fx 'payment_capacity_lock_verified=false' \
            "custody-v2-custody-worker-${{ matrix.node }}.txt"
          grep -Fx 'allocation_write=false' \
            "custody-v2-custody-worker-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' \
            "custody-v2-custody-worker-${{ matrix.node }}.txt"

          sudo cp "$LOG" "custody-v2-contention-${{ matrix.node }}.log"
          sudo chown "$(id -u):$(id -g)" \
            "custody-v2-contention-${{ matrix.node }}.log"
          node scripts/prove_void_buy_allocation_custody_service_v2.mjs \
            --verify-contention-log \
            "custody-v2-contention-${{ matrix.node }}.log" \
            | tee "custody-v2-contention-proof-${{ matrix.node }}.txt"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_V2_CROSS_UID_CONTENTION_GREEN' \
            "custody-v2-contention-proof-${{ matrix.node }}.txt"
          grep -Fx 'web_exit_precedes_custody_completion=true' \
            "custody-v2-contention-proof-${{ matrix.node }}.txt"

          sudo test ! -e \
            "$SHARED/.void-buy-void-cross-uid-capacity-exclusive-lock-v1.json"

          sudo rm -rf "$CODE" "$DATA" "$SHARED" "$LOGROOT"

      - name: Preserve custody source history and qualify the lock successor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEWED_V2_SOURCE_COMMIT: 6e50a22d213694999d9ba0bbc2c51dde32953a58
          LOCK_PREDECESSOR_SOURCE_COMMIT: c53b09a8c8039a5ef3bb0d5388793f9abc753ccf
          LOCK_SUCCESSOR_SOURCE_COMMIT: 97c4649e12d12a6adece53c0c165828801b9095a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$REVIEWED_V2_SOURCE_COMMIT" "$HEAD_SHA"

          # Original V1 is byte-identical to the source reviewed before V2.
          test "$(git hash-object tools/void-buy-allocation-custody-service-v1.mjs)" = \
               "b89d6c3ef210473f486f9fc9d1cab9303e6336c9"
          test "$(git rev-parse "$REVIEWED_V2_SOURCE_COMMIT:tools/void-buy-allocation-custody-service-v1.mjs")" = \
               "b89d6c3ef210473f486f9fc9d1cab9303e6336c9"

          # A different successor needs a fresh proof, not silent V2 reissue.
          test "$(git hash-object tools/void-buy-allocation-custody-service-v2.mjs)" = \
               "3afcc450b11f93209253a5cc10b300596942d07d"
          test "$(git rev-parse "$REVIEWED_V2_SOURCE_COMMIT:tools/void-buy-allocation-custody-service-v2.mjs")" = \
               "3afcc450b11f93209253a5cc10b300596942d07d"
          test "$(git hash-object scripts/prove_void_buy_allocation_custody_service_v2.mjs)" = \
               "b089e10782b93e12687aa5f7cd8e395adb51768d"
          test "$(git rev-parse "$REVIEWED_V2_SOURCE_COMMIT:scripts/prove_void_buy_allocation_custody_service_v2.mjs")" = \
               "b089e10782b93e12687aa5f7cd8e395adb51768d"

          # #2792's old lock pin remains historical evidence, not a label
          # for #2793's changed bytes. Bind both source generations explicitly.
          git merge-base --is-ancestor "$LOCK_PREDECESSOR_SOURCE_COMMIT" "$LOCK_SUCCESSOR_SOURCE_COMMIT"
          git merge-base --is-ancestor "$LOCK_SUCCESSOR_SOURCE_COMMIT" "$HEAD_SHA"
          test "$(git rev-parse "$LOCK_PREDECESSOR_SOURCE_COMMIT:src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs")" = \
               "aac7b7fa9d0c86e1b3d11f9ab430f4b4d6e8a5d5"
          test "$(git rev-parse "$LOCK_SUCCESSOR_SOURCE_COMMIT:src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs")" = \
               "a7610b03d394254c760683f0d9061aa0865718db"
          test "$(git hash-object src/economic/buy_void_cross_uid_capacity_exclusive_lock_v1.mjs)" = \
               "a7610b03d394254c760683f0d9061aa0865718db"
          test "$(git rev-parse "$LOCK_SUCCESSOR_SOURCE_COMMIT:scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs")" = \
               "30c4aff0c28423cd20e7ec5593683a0d0588991b"
          test "$(git hash-object scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs)" = \
               "30c4aff0c28423cd20e7ec5593683a0d0588991b"

          # Run the actual successor regression in the same Node job as the
          # unchanged custody and two-UID tests above. No inherited GREEN.
          node --check scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs
          node scripts/prove_buy_void_cross_uid_capacity_claim_bounded_read_v1.mjs \
            | tee "custody-v2-lock-successor-${{ matrix.node }}.txt"
          for marker in \
            'VOID_BUY_VOID_CROSS_UID_CAPACITY_BOUNDED_CLAIM_V1_GREEN' \
            'released_claim_before_and_after_read_retried=true' \
            'observer_descriptor_closed_before_reacquire=true' \
            'nonabsence_and_cleanup_failures_remain_hold=true' \
            'replacement_inode_remains_hold=true' \
            'disappearing_competitor_retries_deadline_bounded=true' \
            'disappearing_competitor_retries_yield=true' \
            'changed_claim_rejected_before_callback=true' \
            'production_gate_ready=false' \
            'presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "custody-v2-lock-successor-${{ matrix.node }}.txt"
          done

          # The initial 3-file PR diff is historical; later PRs may include
          # other reviewed, disjoint changes to buyer/ledger/chain source.
          # Preserve exact V1/V2 identities above and check ALL current diff
          # whitespace, rather than asserting each future PR has 3 files.
          if test -n "${BASE_SHA:-}"; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
          echo VOID_BUY_VOID_CUSTODY_V2_MERGED_SOURCE_IDENTITY_GREEN
          echo original_v1_unmodified=true
          echo reviewed_v2_unchanged=true
          echo lock_successor_source_identity_verified=true
          echo historical_lock_reinterpreted=false
          echo runtime_service_or_customer_mutation=false
          echo payment_acceptance=false
          echo funds_moved=false
