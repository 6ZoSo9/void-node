name: VOID public checkpoint discovery transport v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-checkpoint-discovery-transport-v1.yml"
      - "docs/public/void-public-checkpoint-discovery-transport-v1.md"
      - "run-void-node.sh"
      - "scripts/resolve_void_public_bootstrap_v1.mjs"
      - "scripts/lib/void_public_seed_client_transport_v1.mjs"
      - "scripts/prove_void_public_checkpoint_discovery_transport_v1.mjs"
      - "scripts/prove_void_public_checkpoint_qualification_lifetime_v1.mjs"
      - "tools/void-public-seed-client-adapter-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-checkpoint-discovery-transport-v1.yml"
      - "docs/public/void-public-checkpoint-discovery-transport-v1.md"
      - "run-void-node.sh"
      - "scripts/resolve_void_public_bootstrap_v1.mjs"
      - "scripts/lib/void_public_seed_client_transport_v1.mjs"
      - "scripts/prove_void_public_checkpoint_discovery_transport_v1.mjs"
      - "scripts/prove_void_public_checkpoint_qualification_lifetime_v1.mjs"
      - "tools/void-public-seed-client-adapter-v1.mjs"
      - "tools/void-public-seed-gateway-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build follower authority module
        run: npm run build

      - name: Syntax check
        run: |
          node --check tools/void-public-seed-gateway-v1.mjs
          node --check tools/void-public-seed-client-adapter-v1.mjs
          node --check scripts/lib/void_public_seed_client_transport_v1.mjs
          node --check scripts/prove_void_public_checkpoint_discovery_transport_v1.mjs
          node --check scripts/prove_void_public_checkpoint_qualification_lifetime_v1.mjs
          node --check scripts/resolve_void_public_bootstrap_v1.mjs
          bash -n run-void-node.sh

      - name: Prove checkpoint discovery transport
        run: node scripts/prove_void_public_checkpoint_discovery_transport_v1.mjs

      - name: Prove checkpoint qualification lifetime
        run: node scripts/prove_void_public_checkpoint_qualification_lifetime_v1.mjs

      - name: Diff hygiene
        run: git diff --check
