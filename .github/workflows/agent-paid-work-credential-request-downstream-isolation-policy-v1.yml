name: VOID credential request downstream isolation policy v1

on:
  pull_request:
    paths:
      - "tools/void-agent-paid-work-credential-request-downstream-isolation-policy-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_downstream_isolation_policy_v1.mjs"
      - "docs/architecture/agent-paid-work-credential-request-downstream-isolation-policy-v1.md"
      - ".github/workflows/agent-paid-work-credential-request-downstream-isolation-policy-v1.yml"
      - "tools/void-agent-paid-work-credential-request-loopback-connector-policy-v1.mjs"
      - "scripts/prove_agent_paid_work_credential_request_loopback_connector_policy_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-credential-request-downstream-isolation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: downstream isolation policy / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check policy and proof
        run: |
          node --check tools/void-agent-paid-work-credential-request-loopback-connector-policy-v1.mjs
          node --check tools/void-agent-paid-work-credential-request-downstream-isolation-policy-v1.mjs
          node --check scripts/prove_agent_paid_work_credential_request_loopback_connector_policy_v1.mjs
          node --check scripts/prove_agent_paid_work_credential_request_downstream_isolation_policy_v1.mjs

      - name: Preserve merged loopback connector policy
        run: node scripts/prove_agent_paid_work_credential_request_loopback_connector_policy_v1.mjs

      - name: Prove downstream isolation policy
        run: node scripts/prove_agent_paid_work_credential_request_downstream_isolation_policy_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
