name: chain2050-role-authority-signed-transaction-verification-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-signed-transaction-verification-precision-v1.json"
      - "tools/chain2050-role-authority-signed-transaction-verification-v1.mjs"
      - "scripts/prove_chain2050_role_authority_signed_transaction_verification_v1.mjs"
      - "docs/security/chain2050-role-authority-signed-transaction-verification-v1.md"
      - ".github/workflows/chain2050-role-authority-signed-transaction-verification-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/mainnet0/chain2050-role-authority-signed-transaction-verification-precision-v1.json"
      - "tools/chain2050-role-authority-signed-transaction-verification-v1.mjs"
      - "scripts/prove_chain2050_role_authority_signed_transaction_verification_v1.mjs"
      - "docs/security/chain2050-role-authority-signed-transaction-verification-v1.md"
      - ".github/workflows/chain2050-role-authority-signed-transaction-verification-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Verify exact signed-transaction evidence
        run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_signed_transaction_verification_v1.mjs | tee "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_SIGNED_TRANSACTION_VERIFICATION_V1_GREEN' "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'raw_signed_transaction_committed=false' "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'rpc_call=false' "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'transaction_broadcast=false' "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'deployment=false' "$RUNNER_TEMP/role-authority-signed.log"
          grep -Fx 'decision=HOLD_PENDING_FRESH_PRECISION_PRE_BROADCAST_REVALIDATION' "$RUNNER_TEMP/role-authority-signed.log"
      - name: Diff hygiene
        run: git diff --check
