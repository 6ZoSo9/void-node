name: VOID Buy authenticated user-manager live query qualification v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v2.py"
      - "scripts/prove_void_buy_void_user_manager_query_live_qualification_v2.py"
      - "docs/operators/buy-void-user-manager-query-live-qualification-v2.md"
      - ".github/workflows/buy-void-user-manager-query-live-qualification-v2.yml"
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v2.py"
      - "ops/security/buy-void-user-manager-query-elf-lock-v2.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v2.py"
      - "scripts/prove_void_buy_void_user_manager_query_live_qualification_v2.py"
      - "docs/operators/buy-void-user-manager-query-live-qualification-v2.md"
      - ".github/workflows/buy-void-user-manager-query-live-qualification-v2.yml"
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v2.py"
      - "ops/security/buy-void-user-manager-query-elf-lock-v2.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [3.12]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Dispatch exact V2 live-query generation
        id: generation
        run: |
          set -euo pipefail
          query_blob="$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_unit_query_v1.c)"
          peer_blob="$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c)"
          preexec_blob="$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c)"
          lock_v2_blob="$(git rev-parse HEAD:ops/security/buy-void-user-manager-query-elf-lock-v2.json)"
          parser_blob="$(git rev-parse HEAD:tools/void-buy-allocation-custody-host-evidence-v4.mjs)"
          if [ "$query_blob" = "5355b7f177574ac4fa173a693605acaf9c5f26e4" ] &&
             [ "$peer_blob" = "d8b30ac499c3bb8a5d223dbc6be687dd175be611" ] &&
             [ "$preexec_blob" = "f0fbfaae97df3294097a281100f06ada2ef157ff" ] &&
             [ "$lock_v2_blob" = "b3abcb408730cf5e79093f6df30733f11324e95c" ] &&
             [ "$parser_blob" = "7887cacd5481ba70a34dc7316fe8343e928936b5" ]; then
            echo "superseded3114=true" >> "$GITHUB_OUTPUT"
          else
            case "$query_blob" in
            6aefc385bcc4212d3c45e36871bfde0da3529baa|ddca2c544ce14261dffb80a202c0a4ae2979ec1e) ;;
            *) echo "unknown canonical query successor: $query_blob" >&2; exit 2 ;;
          esac
            test "$peer_blob" = "d8b30ac499c3bb8a5d223dbc6be687dd175be611"
            test "$preexec_blob" = "f0fbfaae97df3294097a281100f06ada2ef157ff"
            test "$lock_v2_blob" = "347951dbaa2d9bb5c31c8b718d9965ab3fdf7301"
            test "$parser_blob" = "223a8acf32f8c7961d61222b83c0db17075f86c6"
            test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-query-elf-lock-v4.json)" = "55ceccf61d59a18809e74979afa518ed150d62a0"
            echo "superseded3114=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve superseded 3114 live-query evidence
        if: steps.generation.outputs.superseded3114 != 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_query_live_qualification_v2.py)" = "16c75f6f385749283221914c92c968281578dbb3"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_query_live_qualification_v2.py)" = "78f9783829f6cbd52befc265e9e327c508fc6eb6"
          test "$(git rev-parse HEAD:docs/operators/buy-void-user-manager-query-live-qualification-v2.md)" = "d528ec295dd2275cb2064da816fecfd95566d8d8"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_query_protected_replace_v2.py)" = "25753737ac7719b0ceddc759904c81db0f7a1cae"
          echo "VOID_BUY_VOID_USER_MANAGER_QUERY_LIVE_QUALIFICATION_V2_HISTORICAL_PRESERVED"
      - name: Prove V2 qualifier
        if: steps.generation.outputs.superseded3114 == 'true'
        run: |
          set -euo pipefail
          python3 -I -B ops/precision/void_buy_void_user_manager_query_live_qualification_v2.py --self-test |
            tee "$RUNNER_TEMP/qual-v2-self.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_QUERY_LIVE_QUALIFICATION_V2_SELF_TEST_GREEN' "$RUNNER_TEMP/qual-v2-self.log"

          python3 -I -B scripts/prove_void_buy_void_user_manager_query_live_qualification_v2.py |
            tee "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_QUERY_LIVE_QUALIFICATION_V2_PROOF_GREEN' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'protected_v2_generation_required=true' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'private_users_false_required=true' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'kernel_active_capabilities_zero_required=true' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'configured_kernel_bounding_set_equality_required=true' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'double_authenticated_query_required=true' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/qual-v2-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/qual-v2-proof.log"
      - name: Prove inert plan
        if: steps.generation.outputs.superseded3114 == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qual-v2-plan.log"
          python3 -I -B ops/precision/void_buy_void_user_manager_query_live_qualification_v2.py --plan | tee "$out"
          grep -Fx 'protected_v2_generation_verification_required=true' "$out"
          grep -Fx 'private_users_false_required=true' "$out"
          grep -Fx 'kernel_active_capabilities_zero_required=true' "$out"
          grep -Fx 'configured_kernel_bounding_set_equality_required=true' "$out"
          grep -Fx 'query_execution=false' "$out"
          grep -Fx 'host_mutation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"
      - run: git diff --check
