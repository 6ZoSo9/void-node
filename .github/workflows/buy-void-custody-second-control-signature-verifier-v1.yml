name: Buy VOID custody second-control Ed25519 verifier V1
on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-custody-second-control-signature-verifier-v1.yml"
      - "tools/void-buy-allocation-custody-second-control-signature-verifier-v1.mjs"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs"
      - "scripts/prove_buy_void_custody_second_control_signature_verifier_v1.mjs"
      - "docs/architecture/buy-void-custody-second-control-signature-verifier-v1.md"
      - "ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v2.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-custody-second-control-signature-verifier-v1.yml"
      - "tools/void-buy-allocation-custody-second-control-signature-verifier-v1.mjs"
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v2.mjs"
      - "scripts/prove_buy_void_custody_second_control_signature_verifier_v1.mjs"
permissions:
  contents: read
jobs:
  verify:
    name: Fixture-only Ed25519 math Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Parse source without importing it
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-second-control-signature-verifier-v1.mjs
          node --check scripts/prove_buy_void_custody_second_control_signature_verifier_v1.mjs
      - name: Fixture-only synthetic Ed25519 negative and positive proof
        env:
          HOME: /nonexistent
          TZ: UTC
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_custody_second_control_signature_verifier_v1.mjs
      - name: Diff hygiene
        run: git diff --check
