name: VOID Cloudflare retirement preexec provenance v1

on:
  pull_request:
    paths:
      - "ops/public/void_cloudflare_historical_user_tunnel_retirement_preexec_v2.c"
      - "ops/public/void_cloudflare_historical_user_tunnel_retirement_query_v2.c"
      - "ops/public/void_cloudflare_historical_user_tunnel_retirement_query_v1.c"
      - "scripts/prove_void_cloudflare_retirement_preexec_provenance_v1.mjs"
      - "docs/architecture/cloudflare-retirement-preexec-provenance-v1.md"
      - ".github/workflows/cloudflare-retirement-preexec-provenance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: retirement provenance / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove source contract
        run: |
          set -euo pipefail
          node scripts/prove_void_cloudflare_retirement_preexec_provenance_v1.mjs |
            tee "$RUNNER_TEMP/provenance-source-proof.log"
          grep -Fx 'VOID_CLOUDFLARE_RETIREMENT_PREEXEC_PROVENANCE_V1_PROOF_GREEN' "$RUNNER_TEMP/provenance-source-proof.log"
          grep -Fx 'direct_marker_invocation_rejected=true' "$RUNNER_TEMP/provenance-source-proof.log"
          grep -Fx 'forged_proof_channel_rejected=true' "$RUNNER_TEMP/provenance-source-proof.log"
          grep -Fx 'historical_user_tunnel_retirement_verified=false' "$RUNNER_TEMP/provenance-source-proof.log"

      - name: Build V2 static preexec and dynamic query
        run: |
          set -euo pipefail
          preexec="$RUNNER_TEMP/cloudflare-retirement-preexec-v2"
          query="$RUNNER_TEMP/cloudflare-retirement-query-v2"
          gcc -O2 -Wall -Wextra -Werror -std=c11 -static -fno-pie -no-pie             -Wl,--build-id=none             ops/public/void_cloudflare_historical_user_tunnel_retirement_preexec_v2.c             -o "$preexec"
          gcc -O2 -Wall -Wextra -Werror -std=c11             ops/public/void_cloudflare_historical_user_tunnel_retirement_query_v2.c             -ldl -o "$query"
          readelf -l "$preexec" | tee "$RUNNER_TEMP/preexec-readelf.log"
          if grep -F ' INTERP ' "$RUNNER_TEMP/preexec-readelf.log"; then
            echo "V2 preexec unexpectedly has PT_INTERP" >&2
            exit 1
          fi
          file "$preexec" | grep -F 'statically linked'
          echo "V2_PREEXEC_BYTES=$(stat -Lc '%s' "$preexec")"
          echo "V2_PREEXEC_SHA256=$(sha256sum "$preexec" | awk '{print $1}')"
          echo "V2_QUERY_BYTES=$(stat -Lc '%s' "$query")"
          echo "V2_QUERY_SHA256=$(sha256sum "$query" | awk '{print $1}')"

      - name: Prove protected parent provenance and direct-call rejection
        run: |
          set -euo pipefail
          root=/opt/void-cloudflare-user-tunnel-retirement-query-v2
          preexec="$RUNNER_TEMP/cloudflare-retirement-preexec-v2"
          query="$RUNNER_TEMP/cloudflare-retirement-query-v2"
          cleanup() {
            sudo rm -rf "$root" || true
          }
          trap cleanup EXIT
          sudo install -d -o root -g root -m 0555 "$root"
          sudo install -o root -g root -m 0555 "$preexec"             "$root/void_cloudflare_historical_user_tunnel_retirement_preexec_v2"
          sudo install -o root -g root -m 0555 "$query"             "$root/void_cloudflare_historical_user_tunnel_retirement_query_v2"

          sudo "$root/void_cloudflare_historical_user_tunnel_retirement_preexec_v2"             --exec-self-test >"$RUNNER_TEMP/positive.out" 2>"$RUNNER_TEMP/positive.err"
          grep -Fx 'VOID_CLOUDFLARE_HISTORICAL_USER_TUNNEL_RETIREMENT_QUERY_V1_SELF_TEST_GREEN'             "$RUNNER_TEMP/positive.out"

          if sudo env               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1               "$root/void_cloudflare_historical_user_tunnel_retirement_query_v2"               --self-test >"$RUNNER_TEMP/direct.out" 2>"$RUNNER_TEMP/direct.err"; then
            echo "direct marker invocation unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fx 'reason=protected_preexec_provenance_required' "$RUNNER_TEMP/direct.err"

          sudo env ROOT="$root" /usr/bin/python3 - <<'PY'
          import os, subprocess
          root=os.environ["ROOT"]
          r,w=os.pipe()
          os.set_inheritable(r,True)
          env={
              "PATH":"/usr/bin:/bin","LANG":"C","LC_ALL":"C",
              "VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1":"1",
              "VOID_CLOUDFLARE_RETIREMENT_PREEXEC_PROOF_FD":str(r),
          }
          p=subprocess.Popen(
              [root+"/void_cloudflare_historical_user_tunnel_retirement_query_v2","--self-test"],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
              text=True,env=env,pass_fds=(r,),
          )
          os.close(r)
          record=(
              "VOID_CLOUDFLARE_RETIREMENT_PREEXEC_PROOF_V1\n"
              f"parent_pid={os.getpid()}\n"
              f"child_pid={p.pid}\n"
              "preexec_dev=1\npreexec_ino=1\nquery_dev=1\nquery_ino=1\n"
          ).encode()
          os.write(w,record)
          os.close(w)
          out,err=p.communicate(timeout=10)
          assert p.returncode==2,(p.returncode,out,err)
          assert "reason=protected_preexec_provenance_required" in err,err
          PY

      - name: Prove caller preload cannot cross static V2 preexec
        run: |
          set -euo pipefail
          root=/opt/void-cloudflare-user-tunnel-retirement-query-v2
          sentinel="$RUNNER_TEMP/preload-fired"
          cat >"$RUNNER_TEMP/preload.c" <<'C'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <stdlib.h>
          #include <unistd.h>
          __attribute__((constructor))
          static void poison(void){
            const char *path=getenv("VOID_PRELOAD_SENTINEL");
            if(!path||!*path)return;
            int fd=open(path,O_WRONLY|O_CREAT|O_TRUNC,0600);
            if(fd>=0){(void)write(fd,"x",1);close(fd);}
          }
          C
          gcc -shared -fPIC "$RUNNER_TEMP/preload.c" -o "$RUNNER_TEMP/preload.so"

          rm -f "$sentinel"
          if sudo env               LD_PRELOAD="$RUNNER_TEMP/preload.so"               VOID_PRELOAD_SENTINEL="$sentinel"               VOID_BUY_VOID_USER_MANAGER_PRIVATE_UNIT_QUERY_SANITIZED_V1=1               "$root/void_cloudflare_historical_user_tunnel_retirement_query_v2"               --self-test >/dev/null 2>"$RUNNER_TEMP/direct-preload.err"; then
            echo "direct preloaded query unexpectedly succeeded" >&2
            exit 1
          fi
          test -f "$sentinel"

          rm -f "$sentinel"
          sudo env             LD_PRELOAD="$RUNNER_TEMP/preload.so"             VOID_PRELOAD_SENTINEL="$sentinel"             "$root/void_cloudflare_historical_user_tunnel_retirement_preexec_v2"             --exec-self-test >/dev/null
          test ! -e "$sentinel"
          echo 'caller_preload_crossed_static_preexec=false'

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
