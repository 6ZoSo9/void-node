name: External Agent Paid Work Submission Prerequisite Prepare-Only Runtime Integration V1

on:
  pull_request:
    paths:
      - ".github/workflows/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.yml"
      - "docs/public-agent/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.md"
      - "examples/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.example.json"
      - "schemas/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.schema.json"
      - "scripts/external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts"
      - "scripts/prove_external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts"
      - "scripts/external_agent_paid_work_submission_prerequisite_creation_gate_v1.ts"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
      - "integrations/mcp/src/http-config.ts"
      - "integrations/mcp/src/config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.yml"
      - "docs/public-agent/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.md"
      - "examples/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.example.json"
      - "schemas/external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1.schema.json"
      - "scripts/external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts"
      - "scripts/prove_external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts"
      - "scripts/external_agent_paid_work_submission_prerequisite_creation_gate_v1.ts"
      - "tools/void-ai-agent-paid-work-client-v1.mjs"
      - "integrations/mcp/src/http-config.ts"
      - "integrations/mcp/src/config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-agent-paid-work-submission-prerequisite-prepare-only-runtime-integration-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run focused proof
        shell: bash
        run: |
          set -Eeuo pipefail
          PROOF_LOG="$RUNNER_TEMP/void-prepare-only-runtime-proof.txt"
          node node_modules/tsx/dist/cli.mjs             scripts/prove_external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts             | tee "$PROOF_LOG"
          grep -Fq             "VOID_EXTERNAL_AGENT_PAID_WORK_SUBMISSION_PREREQUISITE_PREPARE_ONLY_RUNTIME_V1_PROOF_GREEN"             "$PROOF_LOG"

      - name: Focused TypeScript no-new-errors check
        shell: bash
        run: |
          set -Eeuo pipefail

          BASELINE_LOG="$RUNNER_TEMP/void-prepare-only-runtime-baseline-tsc.txt"
          CANDIDATE_LOG="$RUNNER_TEMP/void-prepare-only-runtime-candidate-tsc.txt"

          COMMON_ARGS=(
            --pretty false
            --noEmit
            --strict
            --target ES2022
            --module NodeNext
            --moduleResolution NodeNext
            --types node
            --skipLibCheck
            scripts/agent_paid_work_order_envelope_v1.ts
            scripts/agent_paid_work_submission_admission_v1.ts
            scripts/external_agent_paid_work_submission_prerequisite_creation_gate_v1.ts
            integrations/mcp/src/http-config.ts
          )

          set +e
          node node_modules/typescript/bin/tsc \
            "${COMMON_ARGS[@]}" \
            >"$BASELINE_LOG" 2>&1
          BASELINE_RC=$?

          node node_modules/typescript/bin/tsc \
            "${COMMON_ARGS[@]}" \
            scripts/external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts \
            scripts/prove_external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts \
            >"$CANDIDATE_LOG" 2>&1
          CANDIDATE_RC=$?
          set -e

          cat "$BASELINE_LOG"
          cat "$CANDIDATE_LOG"

          python3 - \
            "$BASELINE_LOG" \
            "$BASELINE_RC" \
            "$CANDIDATE_LOG" \
            "$CANDIDATE_RC" <<'PY'
          import json
          import re
          import sys

          baseline_path, baseline_rc, candidate_path, candidate_rc = sys.argv[1:]
          baseline_rc = int(baseline_rc)
          candidate_rc = int(candidate_rc)

          start = re.compile(
              r"^(?P<path>.+?)\((?P<line>\d+),(?P<column>\d+)\): "
              r"error TS(?P<code>\d+): (?P<message>.*)$"
          )

          def parse(path):
              records = []
              current = None
              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  for raw in handle:
                      line = raw.rstrip("\r\n")
                      match = start.match(line)
                      if match:
                          if current is not None:
                              records.append(current)
                          current = {
                              "path": match.group("path"),
                              "line": int(match.group("line")),
                              "column": int(match.group("column")),
                              "code": int(match.group("code")),
                              "message": [match.group("message").strip()],
                          }
                      elif current is not None and line.strip():
                          current["message"].append(line.strip())
              if current is not None:
                  records.append(current)
              for record in records:
                  record["message"] = " ".join(record["message"])
              return sorted(
                  records,
                  key=lambda item: (
                      item["path"],
                      item["line"],
                      item["column"],
                      item["code"],
                      item["message"],
                  ),
              )

          baseline = parse(baseline_path)
          candidate = parse(candidate_path)

          print("baseline_diagnostics=" + json.dumps(baseline, sort_keys=True))
          print("candidate_diagnostics=" + json.dumps(candidate, sort_keys=True))

          if baseline_rc == 0:
              if baseline:
                  raise SystemExit(
                      "HOLD: baseline compiler returned zero with parsed diagnostics"
                  )
              if candidate_rc != 0 or candidate:
                  raise SystemExit(
                      "HOLD: candidate introduced TypeScript diagnostics on a clean baseline"
                  )
          else:
              expected = {
                  (
                      "scripts/public_agent_service_acceptance_materialization_replay_consumer_v1.ts",
                      494,
                      5,
                      2322,
                  ),
                  (
                      "scripts/public_agent_service_acceptance_persistence_adapter_v1.ts",
                      534,
                      47,
                      2345,
                  ),
              }
              identities = {
                  (item["path"], item["line"], item["column"], item["code"])
                  for item in baseline
              }
              if identities != expected:
                  raise SystemExit(
                      "HOLD: baseline TypeScript debt differs from the exact reviewed pair; "
                      f"actual={sorted(identities)}"
                  )
              if candidate_rc == 0:
                  raise SystemExit(
                      "HOLD: candidate unexpectedly changed baseline compiler outcome"
                  )
              if candidate != baseline:
                  raise SystemExit(
                      "HOLD: candidate TypeScript diagnostics differ from baseline"
                  )

          target_paths = {
              "scripts/external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts",
              "scripts/prove_external_agent_paid_work_submission_prerequisite_prepare_only_runtime_integration_v1.ts",
          }
          if any(item["path"] in target_paths for item in candidate):
              raise SystemExit(
                  "HOLD: candidate diagnostics mention a prepare-only target file"
              )

          print("VOID_EXTERNAL_AGENT_PAID_WORK_SUBMISSION_PREREQUISITE_PREPARE_ONLY_RUNTIME_V1_TYPESCRIPT_NO_NEW_ERRORS_GREEN")
          PY

      - name: Full TypeScript build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
