name: VOID WC/VOID opening minimum real WC depth policy v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-v1.mjs"
      - "scripts/prove_void_wc_void_opening_minimum_real_wc_depth_policy_v1.mjs"
      - "docs/operators/wc-void-opening-minimum-real-wc-depth-policy-v1.md"
      - "tools/void-wc-void-opening-window-policy-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-wc-void-opening-minimum-real-wc-depth-policy-v1.yml"
  push:
    branches:
      - main
    paths:
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-contract-v1.mjs"
      - "tools/void-wc-void-opening-minimum-real-wc-depth-policy-v1.mjs"
      - "scripts/prove_void_wc_void_opening_minimum_real_wc_depth_policy_v1.mjs"
      - "docs/operators/wc-void-opening-minimum-real-wc-depth-policy-v1.md"
      - "tools/void-wc-void-opening-window-policy-v1.mjs"
      - "tools/void-wc-void-opening-nonproduction-exclusion-v1.mjs"
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - ".github/workflows/void-wc-void-opening-minimum-real-wc-depth-policy-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-opening-minimum-real-wc-depth-policy-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove opening window dependency
        run: node scripts/prove_void_wc_void_opening_window_policy_v1.mjs

      - name: Prove nonproduction WC dependency
        run: node scripts/prove_void_wc_void_opening_nonproduction_exclusion_v1.mjs

      - name: Prove minimum real WC depth policy
        run: node scripts/prove_void_wc_void_opening_minimum_real_wc_depth_policy_v1.mjs

      - name: Diff hygiene
        run: git diff --check
