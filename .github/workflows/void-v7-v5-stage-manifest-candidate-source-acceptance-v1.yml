name: VOID V7 V5 stage manifest-candidate source acceptance v1
on:
  pull_request:
    paths:
      - ".github/workflows/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.yml"
      - "docs/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.md"
      - "ops/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.json"
      - "scripts/prove_void_v7_v5_stage_manifest_candidate_source_acceptance_v1.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact four-file acceptance scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          BASE=05508e433831d16629e989096b9a73d3731ef40c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          A	.github/workflows/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.yml
          A	docs/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.md
          A	ops/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.json
          A	scripts/prove_void_v7_v5_stage_manifest_candidate_source_acceptance_v1.mjs
          EOF
          git diff --name-status "$BASE" HEAD -- | sort > "$RUNNER_TEMP/actual"
          sort "$RUNNER_TEMP/expected" > "$RUNNER_TEMP/expected.sorted"
          diff -u "$RUNNER_TEMP/expected.sorted" "$RUNNER_TEMP/actual"
          test "$(git rev-parse HEAD:ops/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.json)" = "63df08d8574043e07cbbbb0c9a9fe9f0df634af5"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_v5_stage_manifest_candidate_source_acceptance_v1.mjs)" = "650b2d19da6042de3de37c8d64ba6848ed0a97ba"
          test "$(git rev-parse HEAD:docs/security/void-v7-v5-stage-manifest-candidate-source-acceptance-v1.md)" = "a36bc2d116af8fa71a4769105888e2541cc52e67"
          git diff --check "$BASE" HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove source-review acceptance
        run: |
          set -euo pipefail
          node --check scripts/prove_void_v7_v5_stage_manifest_candidate_source_acceptance_v1.mjs
          node scripts/prove_void_v7_v5_stage_manifest_candidate_source_acceptance_v1.mjs
