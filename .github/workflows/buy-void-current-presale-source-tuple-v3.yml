name: VOID Buy VOID current presale source tuple V3 — review only

on:
  pull_request:
    paths:
      - "src/economic/buy_void_preappend_plain_input_v1.ts"
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs"
      - "scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v5.mjs"
      - ".github/workflows/buy-void-current-presale-source-tuple-v3.yml"
      - ".github/workflows/void-pr2761-current-presale-successor-author-v1.yml"
      - "docs/architecture/buy-void-current-presale-source-tuple-v3.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-current-presale-v3-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact review head without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout and absence of opaque auto-writer
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
          test ! -e .github/workflows/void-pr2761-current-presale-successor-author-v1.yml
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked toolchain with package scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and authenticate current source tuple
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          test "$(git hash-object src/economic/buy_void_preappend_plain_input_v1.ts)" = "945cd55d92d4a76fe0d8bfaa237ca27d4753dc2f"
          test "$(git hash-object src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts)" = "eb4fb37c6073415228b312663c45a99d5015c727"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts)" = "5050498f600efd7d5c83af214f75663a66685d6e"
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts)" = "5c5e105b87d4ba4cbc39c0e027c11ac20352a437"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts)" = "d31f8cbb85ed17c9937baf3c9725a6fae22cc829"
          test "$(git hash-object scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts)" = "d33adb6d84fc96a9f65acbf319391c5d771f3a2d"
          test "$(git hash-object scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs)" = "3f91404c8f5b6897b0781455564b4ec26b480c03"
          test "$(git hash-object scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v5.mjs)" = "5dc2d12e34e648d2dbfb8f1e79584caa2f8abc51"
      - name: Require historical proofs to HOLD their original source identities
        shell: bash
        run: |
          set -euo pipefail
          specs=(
            'scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts|exact reviewed dispatcher source drift'
            'scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts|reviewed handoff source blob mismatch:src/economic/buy_void_preappend_plain_input_v1.ts'
            'scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v4.mjs|reviewed_source_blob_drift:src/economic/buy_void_preappend_plain_input_v1.ts'
          )
          for spec in "${specs[@]}"; do
            proof="${spec%%|*}"
            expected="${spec#*|}"
            log="$RUNNER_TEMP/$(basename "$proof").hold"
            set +e
            case "$proof" in
              *.ts) node --import tsx "$proof" >"$log" 2>&1 ;;
              *) node "$proof" >"$log" 2>&1 ;;
            esac
            status=$?
            set -e
            test "$status" -eq 1
            grep -Fq "$expected" "$log"
          done
      - name: Verify both existing compiled array-snapshot security proofs
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_preappend_inherited_index_setter_v1.mjs
          node scripts/prove_buy_void_dispatch_own_array_index_v1.mjs
      - name: Prove new current source successor on synthetic-only data
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_payment_allocation_hypothetical_crash_matrix_v5.mjs > "crash-${{ matrix.node }}.json"
          node --import tsx scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v4.ts > "handoff-${{ matrix.node }}.txt"
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v3.ts > "dispatch-${{ matrix.node }}.txt"
          grep -Fq 'VOID_BUY_VOID_PAYMENT_ALLOCATION_HYPOTHETICAL_CRASH_MATRIX_V5' "crash-${{ matrix.node }}.json"
          grep -Fxq 'VOID_BUY_VOID_VERIFIED_ALLOCATION_HANDOFF_FIRST_ORIGINAL_V4_GREEN' "handoff-${{ matrix.node }}.txt"
          grep -Fxq 'VOID_BUY_VOID_OPERATOR_ALLOCATION_DISPATCH_SOURCE_CANDIDATE_V3_GREEN' "dispatch-${{ matrix.node }}.txt"
          grep -Fxq 'production_gate_ready=false' "handoff-${{ matrix.node }}.txt"
          grep -Fxq 'mounted_verified_allocation_dispatch=false' "dispatch-${{ matrix.node }}.txt"
          grep -Fxq 'funds_moved=false' "dispatch-${{ matrix.node }}.txt"
      - name: Upload three exact-head proof outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-current-presale-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            crash-${{ matrix.node }}.json
            handoff-${{ matrix.node }}.txt
            dispatch-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all three original proof outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-current-presale-v3-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence
      - name: Require byte-for-byte Node 22, 24, 26 equality
        run: |
          set -euo pipefail
          for version in 22 24 26; do
            for file in "crash-$version.json" "handoff-$version.txt" "dispatch-$version.txt"; do
              test -s "evidence/$file"
            done
          done
          for kind in crash handoff dispatch; do
            suffix=txt
            test "$kind" != crash || suffix=json
            cmp "evidence/$kind-22.$suffix" "evidence/$kind-24.$suffix"
            cmp "evidence/$kind-22.$suffix" "evidence/$kind-26.$suffix"
          done
          echo VOID_BUY_VOID_CURRENT_PRESALE_SOURCE_TUPLE_V3_THREE_NODE_GREEN
          echo payment_to_allocation_production_authority=false
          echo presale_activation=false
          echo funds_moved=false
