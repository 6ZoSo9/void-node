name: VOID P2P UDP swarm Node direct-route health mount bootstrap v2

on:
  pull_request:
    branches:
      - 'feat/p2p-udp-swarm-direct-route-health-probe-v1-20260809'
    paths:
      - '.github/workflows/void-p2p-udp-swarm-node-direct-route-health-mount-bootstrap-v2.yml'
      - 'scripts/apply_void_p2p_udp_swarm_node_direct_route_health_mount_v1.py'
      - 'scripts/prove_void_p2p_udp_swarm_node_direct_route_health_mount_v1.ts'
      - 'docs/public/void-p2p-udp-swarm-node-direct-route-health-mount-v1.md'

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.event.pull_request.head.ref == 'feat/p2p-udp-swarm-node-direct-route-health-mount-v1-20260809'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98689b23eb1fa2d349a63ce42d7cb0e87685fc07 HEAD

      - name: Apply source-aware Node health mount
        run: python3 scripts/apply_void_p2p_udp_swarm_node_direct_route_health_mount_v1.py

      - name: Check mounted diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'udpSwarmPromotedDirectRouteHealthSnapshotV1' src/node_core.ts
          grep -Fq 'VOID_P2P_UDP_SWARM_DIRECT_HEALTH_MOUNT_V1_REJECT' src/node_core.ts

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove Node direct-route health mount
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_direct_route_health_mount_v1.ts

      - name: Re-prove direct-route health probe
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_probe_v1.ts

      - name: Re-prove direct-route health observer
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_observer_v1.ts

      - name: Re-prove direct-route health policy
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_direct_route_health_policy_v1.ts

      - name: Re-prove Node candidate promotion
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_promotion_v1.ts

      - name: Re-prove Node candidate integration
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_node_candidate_integration_v1.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit proven Node health mount
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/node_core.ts
          git diff --cached --check
          git commit -m 'feat: mount UDP direct-route health in Node v1'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
