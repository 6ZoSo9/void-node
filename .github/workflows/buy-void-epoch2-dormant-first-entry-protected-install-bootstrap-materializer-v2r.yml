name: Buy VOID Epoch-2 protected-bootstrap materializer v2r

on:
  pull_request:
    paths:
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  push:
    branches: [main]
    paths:
      - "scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.yml"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact materializer generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="$(git rev-parse "$EXPECTED_HEAD^1")" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.md' \
            'scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py)" = 974bd92fb5bd444c04ab90357e54cf3c01f512c5
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py)" = f414df0df6276bb2b35132a5af965e80de4cbc54
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-materializer-v2r.md)" = 1e33db8ebefb93e2149ea525d95bd826f65b1838

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json)" = 64c9a42ca1108a9e8f88218c34d53e50668c653e
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v2.py)" = 4f9b5a2ca77b3aebc9e70ea835c92155601a1a06
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c)" = 19f9baf8d6d707da43dbd0e247667af1a10e46c5
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py)" = 383b84e71b371de65579e4113469e86a59b807ab

          test "$(git rev-parse 344f0abcc57d6f2fbacbb6a57e27009ae9ea7a4b^{tree})" = 4085987d856fa303b8bc81087e3b5a207bc8964f
          git merge-base --is-ancestor 344f0abcc57d6f2fbacbb6a57e27009ae9ea7a4b "$EXPECTED_HEAD"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and static proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for p in (
              Path("scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py"),
              Path("scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py"),
          ):
              compile(p.read_text("utf-8"),str(p),"exec",dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_MATERIALIZER_V2R_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/materializer-proof.log"
          python3 -I -B \
            scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_materializer_v2r.py \
            | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_MATERIALIZER_V2R_PROOF_GREEN' \
            'materializer_blob_bound=true' \
            'accepted_lock_blob_bound=true' \
            'candidate_proof_blob_bound=true' \
            'frozen_candidate_merge_required=true' \
            'candidate_report_identity_required=true' \
            'accepted_bootstrap_identity_required=true' \
            'runtime_head_contract_required=true' \
            'canonical_main_candidate_authority=true' \
            'superseded_v2_lock_install_authority=false' \
            'superseded_v1_lock_install_authority=false' \
            'git_lazy_fetch_forbidden=true' \
            'git_transport_forbidden=true' \
            'detached_worktree_derivation_required=true' \
            'create_only_output_required=true' \
            'output_mode_0555_required=true' \
            'descriptor_readback_required=true' \
            'destructive_output_cleanup_absent=true' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Materialize exact accepted bootstrap
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/protected-install-bootstrap-v2"
          log="$RUNNER_TEMP/protected-bootstrap-materialize.log"

          python3 -I -B \
            scripts/materialize_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2r.py \
            --derive "$output" | tee "$log"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_MATERIALIZER_V2R_DERIVE_GREEN' \
            'candidate_report_bytes=4789' \
            'candidate_report_sha256=2ca03a4d7e609076df740a7590abfae572101ef7bf78feacf11240e309a43ee4' \
            'candidate_report_git_blob=fbaab61d0e169516a49c5c07feeceba1a7204e83' \
            'candidate_id=voidbuye2bootstrapcand2_b71b8757fa64fc36c2df0e95e3812c00eccef114b71e0b854c34ddfd62285def' \
            'bootstrap_binary_bytes=731072' \
            'bootstrap_binary_sha256=37a6979c274e93fa09860b26664804a9d912201a290db65deb9b4499e39aa276' \
            'bootstrap_binary_git_blob=45ca1ed7a6237fccbd6bb0b9d73ef5ff47c72d62' \
            'accepted_lock_id=voidbuye2bootstraplock3_690d119c90f5c8c20f429fcc14919b62691f9a1b3bfe2226476267ede993197f' \
            'output_descriptor_readback=true' \
            'output_parent_directory_fsync=true' \
            'output_failure_destructive_cleanup=false' \
            'bootstrap_binary_identity_accepted=true' \
            'runtime_head_contract_accepted=true' \
            'canonical_main_candidate_authority=true' \
            'superseded_v2_lock_install_authority=false' \
            'superseded_v1_lock_install_authority=false' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$log"
          done

          test "$(stat -c %s "$output")" = 731072
          test "$(stat -c %a "$output")" = 555
          test "$(sha256sum "$output" | awk '{print $1}')" = 37a6979c274e93fa09860b26664804a9d912201a290db65deb9b4499e39aa276

          self="$RUNNER_TEMP/protected-bootstrap-self-test.log"
          "$output" --self-test | tee "$self"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_V2_SELF_TEST_GREEN' "$self"
          grep -Fx 'protected_install_authorized=false' "$self"

          mkdir -p "$RUNNER_TEMP/v2r-install-inputs"
          cp -- "$output" "$RUNNER_TEMP/v2r-install-inputs/protected-install-bootstrap-v2"
          cp -- "$log" "$RUNNER_TEMP/v2r-install-inputs/materialization-v2r.log"
          sha256sum "$RUNNER_TEMP/v2r-install-inputs/protected-install-bootstrap-v2" \
            > "$RUNNER_TEMP/v2r-install-inputs/SHA256SUMS.txt"

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-protected-bootstrap-v2r-install-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v2r-install-inputs
          if-no-files-found: error
          retention-days: 7
