name: DataNet V45 V43-V44 full-stack evidence composition ext4 v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-*.yml"
      - "docs/datanet-*.md"
      - "fixtures/datanet-*.json"
      - "scripts/datanet_*"
      - "scripts/prove_datanet_*"
      - "scripts/run_datanet_v45_full_stack_ext4_v1.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-*.yml"
      - "docs/datanet-*.md"
      - "fixtures/datanet-*.json"
      - "scripts/datanet_*"
      - "scripts/prove_datanet_*"
      - "scripts/run_datanet_v45_full_stack_ext4_v1.sh"

permissions:
  actions: read
  contents: read

concurrency:
  group: datanet-v45-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Exact-head transitive source and runtime wall
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ACCEPTED_PARENT: d73512174afd4f1f0f2591b11ae6bb9955e203ba
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$ACCEPTED_PARENT" HEAD)" = "$ACCEPTED_PARENT"
          test "$(git diff --name-only --diff-filter=A "$ACCEPTED_PARENT"..HEAD | wc -l)" -eq 8
          test -z "$(git diff --name-only --diff-filter=CDMRTUXB "$ACCEPTED_PARENT"..HEAD)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -x /usr/sbin/losetup
          test -x /usr/sbin/mkfs.ext4
          test -x /usr/sbin/tune2fs
          test -x /usr/sbin/dmsetup
          test -x /usr/sbin/blockdev
          command -v strace >/dev/null
          command -v timeout >/dev/null
          command -v findmnt >/dev/null
          command -v mountpoint >/dev/null
          command -v jq >/dev/null

          out="$RUNNER_TEMP/void-v43-${{ matrix.node }}-${{ github.run_id }}-v45-stack"
          mkdir "$out"
          printf 'V45_OUT_DIR=%s\n' "$out" >>"$GITHUB_ENV"
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'V45_EXPECTED_TREE=%s\n' "$expected_tree" >>"$GITHUB_ENV"

          python3 -I -B scripts/prove_datanet_v41_static_gate_v1.py >"$out/v41-static-${{ matrix.node }}.jsonl"
          python3 -I -B scripts/prove_datanet_v42_fsverity_clean_remount_v1.py static >"$out/v42-static-${{ matrix.node }}.jsonl"
          python3 -I -B scripts/prove_datanet_v43_fsverity_sudden_loss_recovery_v1.py static >"$out/v43-static-${{ matrix.node }}.jsonl"
          python3 -I -B scripts/prove_datanet_v44_fsverity_raw_corruption_detection_v1.py static >"$out/v44-static-${{ matrix.node }}.jsonl"
          python3 -I -B scripts/prove_datanet_v45_full_stack_evidence_composition_v1.py static >"$out/v45-static-${{ matrix.node }}.jsonl"

          grep -F 'VOID_DATANET_V41_FSVERITY_GENERATION_BOUND_RECORD_COMPOSITION_STATIC_V1_GREEN' "$out/v41-static-${{ matrix.node }}.jsonl"
          grep -F 'VOID_DATANET_V42_FSVERITY_CLEAN_REMOUNT_STATIC_V1_GREEN' "$out/v42-static-${{ matrix.node }}.jsonl"
          grep -F 'VOID_DATANET_V43_FSVERITY_SUDDEN_LOSS_RECOVERY_STATIC_V1_GREEN' "$out/v43-static-${{ matrix.node }}.jsonl"
          grep -F 'VOID_DATANET_V44_FSVERITY_RAW_CORRUPTION_DETECTION_STATIC_V1_GREEN' "$out/v44-static-${{ matrix.node }}.jsonl"
          grep -F 'VOID_DATANET_V45_FULL_STACK_EVIDENCE_COMPOSITION_STATIC_V1_GREEN' "$out/v45-static-${{ matrix.node }}.jsonl"

          bash -n scripts/run_datanet_v45_full_stack_ext4_v1.sh
          python3 -I -B - <<'PY'
          import ast
          from pathlib import Path

          names = (
              "scripts/prove_datanet_v45_full_stack_evidence_composition_v1.py",
              "scripts/prove_datanet_v45_full_stack_aggregate_controls_v1.py",
              "scripts/prove_datanet_v45_full_stack_terminal_verifier_v1.py",
              "scripts/prove_datanet_v45_cross_runtime_aggregate_v1.py",
          )
          for name in names:
              source = Path(name).read_text(encoding="utf-8")
              tree = ast.parse(source, filename=name)
              compile(tree, name, "exec")
              if name.endswith(("aggregate_controls_v1.py", "terminal_verifier_v1.py", "cross_runtime_aggregate_v1.py")):
                  local_imports = []
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          local_imports.extend(alias.name for alias in node.names if alias.name.startswith("prove_datanet_v45"))
                      if isinstance(node, ast.ImportFrom) and (node.module or "").startswith("prove_datanet_v45"):
                          local_imports.append(node.module)
                  assert local_imports == [], (name, local_imports)
          print("VOID_DATANET_V45_SOURCE_DISTINCT_PARSE_V1_GREEN")
          PY
          python3 -I -B scripts/prove_datanet_v45_cross_runtime_aggregate_v1.py selftest

          python3 -I -B scripts/prove_datanet_v45_full_stack_evidence_composition_v1.py runtime \
            --node-major "${{ matrix.node }}" \
            --output "$out/datanet-v45-runtime-${{ matrix.node }}.json" >/dev/null

      - name: Trace exact V43 recovery into V44 corruption
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          trace="$V45_OUT_DIR/datanet-v45-process-${{ matrix.node }}.trace"
          runner_stdout="$V45_OUT_DIR/datanet-v45-runner-${{ matrix.node }}.stdout.log"
          runner_stderr="$V45_OUT_DIR/datanet-v45-runner-${{ matrix.node }}.stderr.log"
          runner_user="$(id -un)"

          timeout --signal=TERM --kill-after=60s 70m \
            sudo strace -f -q -ttt -s 4096 \
            -e trace=process,mount,umount2 \
            -o "$trace" -u "$runner_user" \
            /usr/bin/env -i \
              PATH="$PATH" LANG=C.UTF-8 \
              VOID_V45_NODE_MAJOR="${{ matrix.node }}" \
              VOID_V45_RUN_ID="${{ github.run_id }}" \
              VOID_V45_EXPECTED_HEAD="$EXPECTED_HEAD" \
              VOID_V45_OUT_DIR="$V45_OUT_DIR" \
              /usr/bin/bash scripts/run_datanet_v45_full_stack_ext4_v1.sh \
            >"$runner_stdout" 2>"$runner_stderr"

          sudo chown "$(id -u):$(id -g)" "$trace"
          test ! -s "$runner_stderr"
          grep -F 'VOID_DATANET_V45_V43_V44_FULL_STACK_RUN_V1_GREEN' "$runner_stdout"

          control_dir="$(mktemp -d "$RUNNER_TEMP/void-v45-${{ matrix.node }}-controls.XXXXXX")"
          candidate="$V45_OUT_DIR/datanet-v45-candidate-${{ matrix.node }}.json"
          controls="$V45_OUT_DIR/datanet-v45-controls-${{ matrix.node }}.json"
          producer_control="$V45_OUT_DIR/datanet-v45-producer-substitution-control-${{ matrix.node }}.json"
          terminal_aba="$V45_OUT_DIR/datanet-v45-terminal-aba-control-${{ matrix.node }}.json"
          aggregate="$V45_OUT_DIR/datanet-v45-aggregate-${{ matrix.node }}.json"
          semantic_target="$V45_OUT_DIR/datanet-v43-final-${{ matrix.node }}.json"

          candidate_ready="$control_dir/candidate.ready"
          candidate_continue="$control_dir/candidate.continue"
          candidate_aba_receipt="$control_dir/candidate-aba.json"
          python3 -I -B scripts/prove_datanet_v45_full_stack_evidence_composition_v1.py candidate-aba-control \
            --node-major "${{ matrix.node }}" --evidence-root "$V45_OUT_DIR" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --generation-control-ready "$candidate_ready" \
            --generation-control-continue "$candidate_continue" \
            --output "$candidate_aba_receipt" >"$control_dir/candidate-aba.stdout" &
          candidate_control_pid=$!
          for _ in $(seq 1 1500); do
            test ! -e "$candidate_ready" || break
            kill -0 "$candidate_control_pid" 2>/dev/null
            sleep 0.02
          done
          test -e "$candidate_ready"
          mv -- "$semantic_target" "$control_dir/candidate-generation-a.json"
          printf '{"substituted_generation":true}\n' >"$semantic_target"
          rm -- "$semantic_target"
          mv -- "$control_dir/candidate-generation-a.json" "$semantic_target"
          touch "$candidate_continue"
          wait "$candidate_control_pid"
          jq -e '.marker=="VOID_DATANET_V45_CANDIDATE_ABA_CONTROL_V1_GREEN" and .rejection=="HOLD_V45_ARTIFACT_GENERATION_CHANGED"' "$candidate_aba_receipt" >/dev/null

          python3 -I -B scripts/prove_datanet_v45_full_stack_evidence_composition_v1.py candidate \
            --node-major "${{ matrix.node }}" --evidence-root "$V45_OUT_DIR" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --output "$candidate" >/dev/null

          fake_candidate="$control_dir/substitute-candidate.json"
          fake_controls="$control_dir/substitute-controls.json"
          python3 -I -B scripts/prove_datanet_v45_full_stack_aggregate_controls_v1.py \
            --candidate "$candidate" --candidate-generation-control-receipt "$candidate_aba_receipt" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --substitute-candidate-output "$fake_candidate" \
            --substitute-controls-output "$fake_controls" \
            --output "$controls" >/dev/null

          python3 -I -B scripts/prove_datanet_v45_full_stack_terminal_verifier_v1.py producer-control \
            --node-major "${{ matrix.node }}" --evidence-root "$V45_OUT_DIR" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --substitute-candidate "$fake_candidate" --substitute-controls "$fake_controls" \
            --output "$producer_control" >/dev/null

          terminal_ready="$control_dir/terminal.ready"
          terminal_continue="$control_dir/terminal.continue"
          python3 -I -B scripts/prove_datanet_v45_full_stack_terminal_verifier_v1.py terminal-aba-control \
            --node-major "${{ matrix.node }}" --evidence-root "$V45_OUT_DIR" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --generation-control-ready "$terminal_ready" \
            --generation-control-continue "$terminal_continue" \
            --output "$terminal_aba" >"$control_dir/terminal-aba.stdout" &
          terminal_control_pid=$!
          for _ in $(seq 1 1500); do
            test ! -e "$terminal_ready" || break
            kill -0 "$terminal_control_pid" 2>/dev/null
            sleep 0.02
          done
          test -e "$terminal_ready"
          mv -- "$semantic_target" "$control_dir/terminal-generation-a.json"
          printf '{"substituted_generation":true}\n' >"$semantic_target"
          rm -- "$semantic_target"
          mv -- "$control_dir/terminal-generation-a.json" "$semantic_target"
          touch "$terminal_continue"
          wait "$terminal_control_pid"
          jq -e '.marker=="VOID_DATANET_V45_TERMINAL_ABA_CONTROL_V1_GREEN" and .rejection=="HOLD_V45_ARTIFACT_GENERATION_CHANGED"' "$terminal_aba" >/dev/null

          python3 -I -B scripts/prove_datanet_v45_full_stack_terminal_verifier_v1.py finalize \
            --node-major "${{ matrix.node }}" --evidence-root "$V45_OUT_DIR" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$V45_EXPECTED_TREE" \
            --output "$aggregate" >/dev/null

          jq -e '
            .marker=="VOID_DATANET_V45_FULL_STACK_EVIDENCE_AGGREGATE_V2_GREEN" and
            .status=="GREEN" and
            .artifact_generation_bound==true and
            .candidate_generation_aba_control==true and
            .terminal_generation_aba_control==true and
            .producer_substitution_control==true and
            .source_distinct_terminal_verifier==true and
            .terminal_verifier_imports_candidate_or_controls==false and
            .transitive_source_wall_verified==true and
            .runner_subgraph_process_census.full_job_process_census==false and
            .process_accounting.full_job_process_census==false and
            .full_job_process_census==false and
            .tiers.same_recovered_r0_record_composed==true and
            .full_campaign_evidence_accepted==false and
            .datanet_availability_proved==false and
            .production_runtime_touched==false
          ' "$aggregate" >/dev/null
          test "$(find "$V45_OUT_DIR" -type f | wc -l)" -eq "$(jq '.expected_archive_members | length' "$aggregate")"

      - name: Retain V45 per-node evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datanet-v45-full-stack-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.V45_OUT_DIR }}/
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check

  node-22-24-26-aggregate:
    needs: full-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact Node 22/24/26 artifact identities and ZIP bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          output="$RUNNER_TEMP/datanet-v45-node-22-24-26-top-$EXPECTED_HEAD.json"
          python3 -I -B scripts/prove_datanet_v45_cross_runtime_aggregate_v1.py selftest
          python3 -I -B scripts/prove_datanet_v45_cross_runtime_aggregate_v1.py aggregate \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --api-url "$GITHUB_API_URL" --expected-head "$EXPECTED_HEAD" \
            --expected-tree "$expected_tree" --output "$output" >/dev/null
          jq -e '
            .marker=="VOID_DATANET_V45_NODE_22_24_26_TOP_AGGREGATE_V1_GREEN" and
            .status=="GREEN" and
            .node_set==[22,24,26] and
            .exact_artifact_ids_bound==true and
            .artifact_api_and_zip_digests_bound==true and
            .per_node_membership_and_aggregate_bound==true and
            .node_runtime_labels_bound==true and
            .all_cross_runtime_controls_rejected==true and
            .v45_full_stack_evidence_composition_accepted==true and
            .full_job_process_census==false and
            .datanet_availability_proved==false and
            .production_runtime_touched==false
          ' "$output" >/dev/null
          printf 'V45_TOP_AGGREGATE=%s\n' "$output" >>"$GITHUB_ENV"

      - name: Retain source-bound Node 22/24/26 aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datanet-v45-node-22-24-26-top-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.V45_TOP_AGGREGATE }}
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check
