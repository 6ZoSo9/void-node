name: Authenticated paid-work runtime listener cgroup binding v1

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-paid-work-runtime-listener-cgroup-binding-v1.yml"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/validation-helpers-v1.mjs"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-binding-v1.md"
      - "scripts/prove_authenticated_paid_work_runtime_listener_cgroup_binding_v1.mjs"
      - "fixtures/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1.example.json"
      - "schemas/authenticated-paid-work-runtime-listener-cgroup-binding-v1.schema.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-paid-work-runtime-listener-cgroup-binding-v1.yml"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs"
      - "integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/validation-helpers-v1.mjs"
      - "docs/operations/authenticated-paid-work-runtime-listener-cgroup-binding-v1.md"
      - "scripts/prove_authenticated_paid_work_runtime_listener_cgroup_binding_v1.mjs"
      - "fixtures/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1.example.json"
      - "schemas/authenticated-paid-work-runtime-listener-cgroup-binding-v1.schema.json"

permissions:
  contents: read

concurrency:
  group: authenticated-paid-work-runtime-listener-cgroup-binding-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse closed JSON artifacts
        run: |
          python3 -m json.tool \
            fixtures/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1.example.json \
            >/dev/null
          python3 -m json.tool \
            schemas/authenticated-paid-work-runtime-listener-cgroup-binding-v1.schema.json \
            >/dev/null
      - name: Check JavaScript syntax
        run: |
          node --check \
            integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/index.mjs
          node --check \
            integrations/agents/authenticated-paid-work-runtime-listener-cgroup-binding-v1/validation-helpers-v1.mjs
          node --check \
            scripts/prove_authenticated_paid_work_runtime_listener_cgroup_binding_v1.mjs
      - name: Prove strong and bounded receipt classes
        run: node scripts/prove_authenticated_paid_work_runtime_listener_cgroup_binding_v1.mjs
      - name: Typecheck repository
        run: npm run typecheck
