name: VOID custody permanent fence detached input v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_high_water_fence_storage_v1.mjs"
      - "scripts/prove_buy_void_custody_fence_detached_input_v1.mjs"
      - "docs/architecture/buy-void-custody-fence-detached-input-v1.md"
      - ".github/workflows/buy-void-custody-fence-detached-input-v1.yml"
      - "src/economic/buy_void_custody_high_water_transition_fence_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-fence-detached-input-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  proof:
    name: detached input / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source-only head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up reviewed Node major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Verify protected source and detached input repair
        run: |
          set -euo pipefail
          node --check src/economic/buy_void_custody_high_water_fence_storage_v1.mjs
          node --check scripts/prove_buy_void_custody_fence_detached_input_v1.mjs
          node scripts/prove_buy_void_custody_fence_detached_input_v1.mjs \
            | tee "fence-detached-${{ matrix.node }}.txt"
          for value in \
            'VOID_CUSTODY_FENCE_DETACHED_INPUT_V1_GREEN' \
            'exclusive_create_mutation_after_validation=true' \
            'caller_owned_bytes_not_written_after_change=true' \
            'reported_digest_matches_permanent_slot=true' \
            'permanent_slot_canonical_and_replay_idempotent=true' \
            'modified_caller_input_remains_rejected=true' \
            'production_allocation_mutation_ready=false' \
            'funds_moved=false'
          do
            grep -Fx "$value" "fence-detached-${{ matrix.node }}.txt"
          done
      - name: Upload disposable fixture verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custody-fence-detached-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: fence-detached-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Committed change hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three exact-head proof receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: custody-fence-detached-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./receipts
      - name: Require bit-for-bit Node 22 24 26 proof agreement
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "receipts/fence-detached-$node.txt"; done
          cmp receipts/fence-detached-22.txt receipts/fence-detached-24.txt
          cmp receipts/fence-detached-22.txt receipts/fence-detached-26.txt
          echo 'VOID_CUSTODY_FENCE_DETACHED_INPUT_THREE_NODE_GREEN'
          echo 'runtime_mounted=false'
          echo 'production_allocation_mutation_ready=false'
