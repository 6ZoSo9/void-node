name: Buy VOID presale current-source enforcement successor v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-presale-current-source-enforcement-successor-v1.yml"
      - "docs/architecture/buy-void-presale-current-source-enforcement-successor-v1.md"
      - "ops/security/buy-void-presale-current-source-enforcement-successor-v1.json"
      - "scripts/prove_buy_void_presale_current_source_enforcement_successor_v1.mjs"
      - "ops/security/buy-void-presale-source-freeze-candidate-v2.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json"
      - "ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_candidate_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact successor scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          STACK_PARENT=3284df2adbf4a6606ef3526e2f1381bbdf319d59
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$STACK_PARENT" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-presale-current-source-enforcement-successor-v1.yml' \
            'docs/architecture/buy-void-presale-current-source-enforcement-successor-v1.md' \
            'ops/security/buy-void-presale-current-source-enforcement-successor-v1.json' \
            'scripts/prove_buy_void_presale_current_source_enforcement_successor_v1.mjs' \
            | sort > "$expected"
          git diff --no-renames --name-only "$STACK_PARENT" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-current-source-enforcement-successor-v1.json)" = 774db38ccb771f393b44d589a455144b99d36f6b
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_current_source_enforcement_successor_v1.mjs)" = 6777b900a61d979355671ebee502c4b7ebb6b5dd
          test "$(git rev-parse HEAD:docs/architecture/buy-void-presale-current-source-enforcement-successor-v1.md)" = 311b8491a22ac887c4d017fbe9cf02726601a438

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-source-freeze-candidate-v2.json)" = ca9c42e2d3ab4c50ac54badadb9efde6180ad241
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json)" = 4e23ecbb64eb26c14f5ab15af85eb86d59c3a718
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json)" = 589845615654da8b688764377b34296267ac0063
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs)" = 35b8b878ba30cfa7567578ab05424d4f827f3220

          test "$(git rev-parse 05614762b1b4638e05e539fd7d20cbf670e1570b^{tree})" = 4ade3faff2c3fd8e73f7ab8bf3ce0685e0d0d30e
          git merge-base --is-ancestor 4cdf06a58f2d7ef08942af359b44421887e4d12e "$EXPECTED_HEAD"
          git diff --check "$STACK_PARENT" "$EXPECTED_HEAD"

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild exact enforcement closure
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Prove fixed-source successor
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/successor-proof.log"
          node scripts/prove_buy_void_presale_current_source_enforcement_successor_v1.mjs | tee "$out"
          for marker in \
            'VOID_BUY_VOID_PRESALE_CURRENT_SOURCE_ENFORCEMENT_SUCCESSOR_V1_PROOF_GREEN' \
            'successor_id=voidbuypresaleenfsucc1_819fd2dbce9928145023d4077cffc34e2a9ab3a50e51428fc37dda6ca70a18ef' \
            'protected_path_count=49' \
            'protected_path_delta_count=0' \
            'reviewed_economic_source_file_count=28' \
            'reviewed_economic_source_delta_count=0' \
            'historical_commit_objects_required=false' \
            'reviewed_economic_source_inventory_reproduced=true' \
            'accepted_enforcement_set_preserved=true' \
            'current_source_enforcement_successor_accepted=true' \
            'source_freeze_accepted=false' \
            'public_presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Verify exact accepted candidate against current protected integration
        run: |
          set -euo pipefail
          integration="$RUNNER_TEMP/current-protected-integration-node-${{ matrix.node }}.json"
          candidate="$RUNNER_TEMP/current-source-candidate-node-${{ matrix.node }}.json"

          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --receipt > "$integration"
          cp ops/security/buy-void-enforcement-final-protected-v7-v2-candidate-v2.json "$candidate"

          node --input-type=module - "$candidate" "$integration" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const i=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));

          assert.equal(c.candidate_enforcement_set_sha256,"05d7648032223f74a05d89200ef23a76a5265ef2a3a26e52c7f51ce3b33bc852");
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,"224e8c4b63b231e40b1abf4982127a6e2b999724642c4360c10ca21887bbc0a2");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);

          assert.equal(i.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V2");
          assert.equal(i.protected_path_count,49);
          assert.equal(i.protected_path_identity_preserved,true);
          assert.equal(i.current_built_census_identity_matches_frozen_v4,true);
          assert.equal(i.provider_source_identity_preserved,true);
          assert.equal(i.provider_built_artifact_identity_preserved,true);
          assert.equal(i.historical_commit_objects_required,false);
          assert.equal(i.frozen_candidate_rederived_on_current_head,false);
          assert.equal(i.current_generation_integration_verified,true);
          assert.equal(i.public_presale_activation,false);
          assert.equal(i.funds_movement,false);
          NODE

          test "$(wc -c < "$candidate")" -eq 16342
          test "$(sha256sum "$candidate" | awk '{print $1}')" = 092a97373013d32dda610df7363587fa3a669f33248a37420b07541d12d892bb
          test "$(git hash-object "$candidate")" = 4e23ecbb64eb26c14f5ab15af85eb86d59c3a718
          test "$(sha256sum ops/security/buy-void-enforcement-final-protected-v7-v2-lock-v2.json | awk '{print $1}')" = 06af643df1a807a7d2c3582f6650967575d53874d5bf1277a0f1039bbad6ccd9

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-presale-current-source-enforcement-successor-v1-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/current-source-candidate-node-${{ matrix.node }}.json
            ${{ runner.temp }}/current-protected-integration-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-presale-current-source-enforcement-successor-v1-node-*
          merge-multiple: true
          path: candidate

      - name: Require Node 22/24/26 identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "candidate/current-source-candidate-node-$node.json"
            test -s "candidate/current-protected-integration-node-$node.json"
          done
          cmp candidate/current-source-candidate-node-22.json candidate/current-source-candidate-node-24.json
          cmp candidate/current-source-candidate-node-22.json candidate/current-source-candidate-node-26.json
          cmp candidate/current-protected-integration-node-22.json candidate/current-protected-integration-node-24.json
          cmp candidate/current-protected-integration-node-22.json candidate/current-protected-integration-node-26.json
          candidate_sha256="$(sha256sum candidate/current-source-candidate-node-22.json | awk '{print $1}')"
          echo "current_successor_candidate_sha256=$candidate_sha256"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("candidate/current-source-candidate-node-22.json","utf8"));
          assert.equal(c.candidate_enforcement_set_sha256,"05d7648032223f74a05d89200ef23a76a5265ef2a3a26e52c7f51ce3b33bc852");
          assert.equal(c.current_enforcement_tracked_source_inventory_count,49);
          assert.equal(c.current_enforcement_tracked_source_inventory_sha256,"224e8c4b63b231e40b1abf4982127a6e2b999724642c4360c10ca21887bbc0a2");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          NODE
          echo VOID_BUY_VOID_PRESALE_CURRENT_SOURCE_ENFORCEMENT_SUCCESSOR_V1_CROSS_NODE_GREEN
          echo candidate_enforcement_set_sha256=05d7648032223f74a05d89200ef23a76a5265ef2a3a26e52c7f51ce3b33bc852
          echo current_source_enforcement_successor_accepted=true
          echo source_freeze_accepted=false
          echo funds_movement=false
