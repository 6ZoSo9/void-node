name: Buy VOID bounded segmented history successor v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-history-segmented-successor-v1.yml"
      - "src/economic/buy_void_history_segmented_successor_v1.ts"
      - "src/economic/buy_void_history_carrier_v1.ts"
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_buy_void_history_segmented_successor_v1.ts"
      - "docs/operators/buy-void-history-segmented-successor-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-history-segmented-successor-v1.yml"
      - "src/economic/buy_void_history_segmented_successor_v1.ts"
      - "src/economic/buy_void_history_carrier_v1.ts"
      - "src/storage/segmented_jsonl_v1.ts"
      - "src/storage/segmented_jsonl_snapshot_authority_v1.ts"
      - "src/storage/segmented_jsonl_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_checkpoint_materialized_authority_v1.ts"
      - "src/storage/segmented_jsonl_durable_root_v1.ts"
      - "scripts/prove_buy_void_history_segmented_successor_v1.ts"
      - "docs/operators/buy-void-history-segmented-successor-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Typecheck and prove bounded segmented history successor
        shell: bash
        run: |
          set -euo pipefail
          npx tsc -p tsconfig.json --noEmit
          node --import tsx             scripts/prove_buy_void_history_segmented_successor_v1.ts             | tee "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx             'VOID_BUY_VOID_HISTORY_SEGMENTED_SUCCESSOR_V1_PROOF_GREEN'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'dedicated_live_namespace_proven=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'legacy_generation_one_unchanged=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'one_record_successor_generation_proven=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'predecessor_durable_root_verified=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'predecessor_materialized_verified_at_use=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'append_only_witness_produced=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'predecessor_byte_ceiling=16777216'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'atomic_generation_visibility=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'completed_stage_replay_idempotent=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'staging_does_not_publish_durable_root=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'explicit_durable_root_publish_proven=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'published_locator_exact_record_readback=true'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'carrier_root_mutation=false'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'lifecycle_mount=false'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'runtime_activation_ready=false'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'transaction_broadcast=false'             "$RUNNER_TEMP/history-segmented-successor.log"
          grep -Fx 'funds_movement=false'             "$RUNNER_TEMP/history-segmented-successor.log"
          git diff --check
