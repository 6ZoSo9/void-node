name: Buy VOID payment-verified readiness filter V1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_guard_v1.ts"
      - "docs/operators/buy-void-observe-and-claim-candidate-payment-verified-filter-v1.md"
      - ".github/workflows/buy-void-observe-and-claim-candidate-payment-verified-filter-v1.yml"
  push:
    paths:
      - "src/economic/buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_readiness_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_v1.ts"
      - "scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_guard_v1.ts"
      - "docs/operators/buy-void-observe-and-claim-candidate-payment-verified-filter-v1.md"
      - ".github/workflows/buy-void-observe-and-claim-candidate-payment-verified-filter-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: >-
          npx --no-install tsx
          scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_v1.ts

      - run: >-
          npx --no-install tsx
          scripts/prove_buy_void_observe_and_claim_candidate_payment_verified_filter_guard_v1.ts

      - run: >-
          npx --no-install tsx
          scripts/prove_buy_void_observe_and_claim_candidate_readiness_v1.ts

      - run: >-
          npx --no-install tsx
          scripts/prove_buy_void_observe_and_claim_candidate_readiness_cli_v1.ts
