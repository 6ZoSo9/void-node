name: VOID WC/VOID vault deployer gas funding authorization v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-vault-deployer-gas-funding-authorization-v1.yml"
      - "tools/void-wc-void-market-vault-deployer-gas-funding-authorization-v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-deployer-gas-funding-authorization-v1.json"
      - "scripts/prove_void_wc_void_market_vault_deployer_gas_funding_authorization_v1.mjs"
      - "docs/operators/wc-void-market-vault-deployer-gas-funding-authorization-v1.md"
      - "ops/mainnet0/wc-void-market-vault-deployer-gas-funding-request-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-vault-deployer-gas-funding-authorization-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts

      - name: Prove canonical authorization remains pending
        run: node scripts/prove_void_wc_void_market_vault_deployer_gas_funding_authorization_v1.mjs

      - name: Preserve exact frozen funding request
        run: node scripts/prove_void_wc_void_market_vault_deployer_gas_funding_request_v1.mjs

      - name: Diff hygiene
        run: git diff --check
