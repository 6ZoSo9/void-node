name: chain2050-role-authority-checkpoint-signing-authorization-v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/chain2050-role-authority-checkpoint-signing-authorization-v1.json"
      - "tools/chain2050-role-authority-checkpoint-signing-authorization-v1.mjs"
      - "scripts/prove_chain2050_role_authority_checkpoint_signing_authorization_v1.mjs"
      - "docs/security/chain2050-role-authority-checkpoint-signing-authorization-v1.md"
      - ".github/workflows/chain2050-role-authority-checkpoint-signing-authorization-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Prove exact checkpoint signing authorization
        run: |
          set -euo pipefail
          node scripts/prove_chain2050_role_authority_checkpoint_signing_authorization_v1.mjs | tee "$RUNNER_TEMP/checkpoint-signing-authorization.log"
          grep -Fx 'VOID_CHAIN2050_ROLE_AUTHORITY_CHECKPOINT_SIGNING_AUTHORIZATION_V1_GREEN' "$RUNNER_TEMP/checkpoint-signing-authorization.log"
          grep -Fx 'authorization_id=voidcracsa1_1a038fbf89eedf710f02024b2cd9f49bc12af719c00435197929942ffb55fde4' "$RUNNER_TEMP/checkpoint-signing-authorization.log"
          grep -Fx 'signature_count_max=1' "$RUNNER_TEMP/checkpoint-signing-authorization.log"
          grep -Fx 'transaction_broadcast_authorized=false' "$RUNNER_TEMP/checkpoint-signing-authorization.log"
      - name: Diff hygiene
        run: git diff --check
