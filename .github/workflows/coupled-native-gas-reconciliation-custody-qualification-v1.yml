name: Coupled native gas reconciliation custody qualification v1

on:
  pull_request:
    paths:
      - "src/economic/coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "src/economic/coupled_native_gas_liability_store_v1.ts"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-qualification-v1.md"
      - ".github/workflows/coupled-native-gas-reconciliation-custody-qualification-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "src/economic/coupled_native_gas_liability_store_v1.ts"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-qualification-v1.md"
      - ".github/workflows/coupled-native-gas-reconciliation-custody-qualification-v1.yml"

permissions:
  contents: read

concurrency:
  group: native-gas-reconciliation-custody-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Prove reconciliation custody qualification
        run: npx tsx scripts/prove_coupled_native_gas_reconciliation_custody_qualification_v1.ts
      - name: Diff hygiene
        run: git diff --check
