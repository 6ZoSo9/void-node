name: VOID Buy VOID verified-payment capacity FIFO nonblocking V2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-verified-payment-capacity-fifo-nonblocking-v2.yml"
      - "docs/architecture/buy-void-verified-payment-capacity-fifo-nonblocking-v2.md"
      - "scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    name: source-and-fifo / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Bind reviewed source-generation scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print $2}')" = "1d8c8804d75fa12e1fa9fcfffe7bc93940fbd56c"
          git merge-base --is-ancestor "1d8c8804d75fa12e1fa9fcfffe7bc93940fbd56c" HEAD
          printf '%s\n' \
            'A	.github/workflows/buy-void-verified-payment-capacity-fifo-nonblocking-v2.yml' \
            'A	docs/architecture/buy-void-verified-payment-capacity-fifo-nonblocking-v2.md' \
            'A	scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts' \
            'M	src/economic/buy_void_verified_payment_capacity_admission_v1.ts' | sort > "$RUNNER_TEMP/expected.txt"
          git diff --name-status "1d8c8804d75fa12e1fa9fcfffe7bc93940fbd56c" HEAD -- | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git rev-parse HEAD:src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = "d1320be22fe55af24017b84f0655fbcde82dbee9"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts)" = "1b3d72c2eda967f5cd84d929cd80c62508cce16e"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-verified-payment-capacity-fifo-nonblocking-v2.md)" = "9439e92089031aa3a63e991ae86d42c944b1c367"
          git diff --check "1d8c8804d75fa12e1fa9fcfffe7bc93940fbd56c" HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install locked source dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove source and real FIFO substitution
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          out="$RUNNER_TEMP/capacity-fifo-nonblocking-proof.log"
          timeout 100s npx tsx scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts | tee "$out"
          for marker in \
            'VOID_BUY_VOID_VERIFIED_PAYMENT_CAPACITY_FIFO_NONBLOCKING_V2_GREEN' \
            'historical_capacity_source_reconstructed=true' \
            'two_retained_regular_file_opens_nonblocking=true' \
            'fifo_swap_at_real_production_open_rejected=true' \
            'fifo_private_sidecar_swap_at_real_production_open_rejected=true' \
            'descriptor_type_and_generation_checks_preserved=true' \
            'test_only_temp_filesystem_mutation=true' \
            'protected_host_read=false' \
            'production_gate_ready=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
