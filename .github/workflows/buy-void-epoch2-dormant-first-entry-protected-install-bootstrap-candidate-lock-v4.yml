name: Buy VOID Epoch-2 protected-bootstrap candidate lock v4

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v3.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
  push:
    branches: [main]
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json"
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v2.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v3.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact acceptance-lock generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="$(git rev-parse "$EXPECTED_HEAD^1")" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.md' \
            'ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.json)" = 57ecc08d465fe2a3c395546d349864312cd08a3f
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v3.json)" = 64c9a42ca1108a9e8f88218c34d53e50668c653e
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v2.json)" = 90dfe7728fa56c8d41a396399578bd1b8c52c2f4
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py)" = 2b9485abef846f154ebeaa3f2a2af0428f73466c
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v4.md)" = 4fd38b16a890bb18c09dea1ece74bc089a042547

          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v3.py)" = 1c49abf74e464b3d509a33e2fa3f1a9acc42c771
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.yml)" = 2e48100a85dfd629aeef6cef532bbdcb6ce7b37d
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v3.md)" = 81752a785713754ea80d83e7b1d440ade14f8d6b
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c)" = 2c3c9ed120cc9949a0528e43be886354aa25da5a
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py)" = 69a018c0eccedf3782055c56725579d02463b05e

          test "$(git rev-parse 78875f7379c2dd995e1b545dd0543c934e59907a^{tree})" = a2c1b6b9989ceb11c4fbea3f2fc4ecf64eb50176
          git merge-base --is-ancestor 78875f7379c2dd995e1b545dd0543c934e59907a "$EXPECTED_HEAD"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Static lock proof
        run: |
          set -euo pipefail
          proof='scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py'

          python3 -I -B - <<'PY'
          from pathlib import Path
          p=Path("scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py")
          compile(p.read_text("utf-8"),str(p),"exec",dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V4_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/bootstrap-lock-self-test.log"
          python3 -I -B "$proof" --self-test | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V4_SELF_TEST_GREEN' \
            'canonical_lock_id_verified=true' \
            'candidate_source_generation_bound=true' \
            'candidate_hosted_evidence_bound=true' \
            'candidate_report_identity_bound=true' \
            'bootstrap_binary_identity_bound=true' \
            'candidate_source_blobs_bound=true' \
            'candidate_accepted=true' \
            'bootstrap_binary_identity_accepted=true' \
            'runtime_head_contract_accepted=true' \
            'canonical_main_candidate_authority=true' \
            'superseded_v3_lock_preserved=true' \
            'superseded_v3_lock_install_authority=false' \
            'superseded_v2_lock_preserved=true' \
            'superseded_v2_lock_install_authority=false' \
            'superseded_v1_lock_install_authority=false' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Rederive and accept frozen canonical candidate
        run: |
          set -euo pipefail
          candidate_head=78875f7379c2dd995e1b545dd0543c934e59907a
          worktree="$RUNNER_TEMP/frozen-bootstrap-candidate-source"
          candidate_out="$RUNNER_TEMP/frozen-bootstrap-candidate-output"
          derive_log="$RUNNER_TEMP/frozen-bootstrap-candidate-derive.log"
          accept_log="$RUNNER_TEMP/frozen-bootstrap-candidate-accept.log"

          cleanup() {
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$worktree" "$candidate_head"
          (
            cd "$worktree"
            python3 -I -B \
              scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v3.py \
              --derive-dir "$candidate_out"
          ) | tee "$derive_log"

          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_V3_DERIVE_GREEN' "$derive_log"
          grep -Fx 'candidate_id=voidbuye2bootstrapcand3_9e914f52eb3cde5a5fef42fbdf065b375f89fdabb768034b09615861bba67ce3' "$derive_log"
          grep -Fx 'bootstrap_sha256=904e6b05df45bc9212be7689ea0617ccfbf65d5edf8535a381abcbb588f236cd' "$derive_log"
          grep -Fx 'bootstrap_bytes=731072' "$derive_log"
          grep -Fx 'candidate_accepted=false' "$derive_log"
          grep -Fx 'protected_bootstrap_install_authorized=false' "$derive_log"
          grep -Fx 'funds_movement=false' "$derive_log"

          python3 -I -B \
            scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v4.py \
            --candidate-dir "$candidate_out" | tee "$accept_log"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V4_CANDIDATE_ACCEPTANCE_GREEN' \
            'canonical_lock_id_verified=true' \
            'frozen_candidate_rederived=true' \
            'candidate_report_bytes_exact=true' \
            'bootstrap_binary_bytes_exact=true' \
            'candidate_accepted=true' \
            'bootstrap_binary_identity_accepted=true' \
            'runtime_head_contract_accepted=true' \
            'canonical_main_candidate_authority=true' \
            'superseded_v3_lock_preserved=true' \
            'superseded_v3_lock_install_authority=false' \
            'superseded_v2_lock_preserved=true' \
            'superseded_v2_lock_install_authority=false' \
            'superseded_v1_lock_install_authority=false' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$accept_log"
          done

          cleanup
          trap - EXIT
          git worktree prune
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
