name: DataNet H1 admission exec handoff v1

on:
  pull_request:
    paths:
      - "fixtures/datanet-h1-publication-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/prove_datanet_h1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admission_exec_handoff_v1.py"
      - "docs/datanet-h1-admission-exec-handoff-v1.md"
      - ".github/workflows/datanet-h1-admission-exec-handoff-v1.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/datanet-h1-publication-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/prove_datanet_h1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_h1_admission_exec_handoff_v1.py"
      - "docs/datanet-h1-admission-exec-handoff-v1.md"
      - ".github/workflows/datanet-h1-admission-exec-handoff-v1.yml"

permissions:
  contents: read

concurrency:
  group: datanet-h1-admission-exec-handoff-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exec-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Assert exact head and prerequisite blobs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git hash-object scripts/prove_datanet_posix_admission_capability_v1.py)" = c4d92dcaaed8879bcd98b96e199729098712d5b4
          test "$(git hash-object scripts/prove_datanet_h1_publication_ext4_v1.mjs)" = 1ebc3b0e7611aa8d523333d0bbab5698ebee6456
          test "$(git hash-object fixtures/datanet-h1-publication-ext4-v1.json)" = 538501d77ca9565b81128ec98d3c7edcaa0c28df
          test -x /usr/bin/fallocate
          test -x /usr/bin/ln
          test -x /usr/sbin/mkfs.ext4
          python3 --version
          node --version
      - name: Prove same process owns lock then becomes Node publisher
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/void-datanet-exec-handoff-node-${{ matrix.node }}.ext4"
          mountpoint="$RUNNER_TEMP/void-datanet-exec-handoff-node-${{ matrix.node }}-mnt"
          proof_stdout="$RUNNER_TEMP/datanet-exec-handoff-v1-node-${{ matrix.node }}.stdout.log"
          proof_stderr="$RUNNER_TEMP/datanet-exec-handoff-v1-node-${{ matrix.node }}.stderr.log"
          mounted=0
          cleanup() {
            set +e
            if [ "$mounted" -eq 1 ]; then
              sync
              sudo umount "$mountpoint"
            fi
            rmdir "$mountpoint" 2>/dev/null || true
            rm -f "$image"
          }
          trap cleanup EXIT

          /usr/bin/dd if=/dev/zero of="$image" bs=1M count=384 status=none
          test "$(stat -c %s "$image")" -eq 402653184
          test $(( $(stat -c %b "$image") * 512 )) -ge 402653184
          /usr/sbin/mkfs.ext4 -F -q -E lazy_itable_init=0,lazy_journal_init=0 "$image"

          mkdir "$mountpoint"
          sudo mount -o loop,nosuid,nodev,noexec "$image" "$mountpoint"
          mounted=1
          test "$(findmnt -n -o FSTYPE --target "$mountpoint")" = ext4
          sudo mkdir "$mountpoint/store"
          sudo chown "$(id -u):$(id -g)" "$mountpoint/store"
          sudo chmod 0700 "$mountpoint/store"
          test -z "$(find "$mountpoint/store" -mindepth 1 -maxdepth 1 -print -quit)"

          export VOID_DATANET_EXT4_ROOT="$mountpoint/store"
          python3 -I -B scripts/prove_datanet_h1_admission_exec_handoff_v1.py \
            > >(tee "$proof_stdout") \
            2> >(tee "$proof_stderr" >&2)

          grep -F '"marker":"VOID_DATANET_H1_ADMISSION_EXEC_HANDOFF_V1_GREEN"' "$proof_stdout"
          grep -F '"status":"GREEN"' "$proof_stdout"
          grep -F '"single_process_lock_owner_became_node_publisher":true' "$proof_stdout"
          grep -F '"lock_busy_while_node_publisher_alive":true' "$proof_stdout"
          grep -F '"fresh_acquisition_after_node_exit":true' "$proof_stdout"
          test ! -s "$proof_stderr"

          sync
          sudo umount "$mountpoint"
          mounted=0
          trap - EXIT
          rmdir "$mountpoint"
          rm -f "$image"
      - name: Retain exact exec-handoff diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datanet-h1-admission-exec-handoff-v1-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/datanet-exec-handoff-v1-node-${{ matrix.node }}.stdout.log
            ${{ runner.temp }}/datanet-exec-handoff-v1-node-${{ matrix.node }}.stderr.log
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        run: git diff --check
