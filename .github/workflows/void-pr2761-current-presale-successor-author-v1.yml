name: VOID PR2761 current presale successor author v1

on:
  push:
    branches:
      - ren/buy-void-preappend-detached-json-v1-20261010
    paths:
      - .github/workflows/void-pr2761-current-presale-successor-author-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2761-current-presale-successor-author-v1
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact wrapper commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and run guarded author with current lease
        env:
          EXPECTED_BRANCH: ren/buy-void-preappend-detached-json-v1-20261010
          EXPECTED_PARENT: 20be11279bc5ce593e054582c4b3c1b906f3530d
          EXPECTED_MAIN: ae87314f7b25b23e5ae1251eec7101dda8a1e0a9
          PRESERVED_NIMO_V3: 8cd91951bb7f43d953d4e4c86e2d8360fd7a0427
          NIMO_V3_PARENT: b672df7bd21971cc2e8c60261d853db67bcd3205
          STAGER: .github/workflows/void-pr2761-current-presale-successor-author-v1.yml
          PAYLOAD_COMMIT: b672df7bd21971cc2e8c60261d853db67bcd3205
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$STAGER"
          test "$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$PRESERVED_NIMO_V3^")" = "$NIMO_V3_PARENT"

          expected_nimo_paths="$({ printf '%s\n' \
            .github/workflows/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.yml \
            .github/workflows/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.yml \
            .github/workflows/buy-void-runtime-integration-v1.yml \
            docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.md \
            scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs; } | sort)"
          actual_nimo_paths="$(git diff --name-only "$NIMO_V3_PARENT" "$PRESERVED_NIMO_V3" | sort)"
          test "$actual_nimo_paths" = "$expected_nimo_paths"
          git merge-base --is-ancestor "$PRESERVED_NIMO_V3" HEAD

          git show "$PAYLOAD_COMMIT:$STAGER" > "$RUNNER_TEMP/original-author-workflow.yml"
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          source = Path("${{ runner.temp }}/original-author-workflow.yml").read_text(
              encoding="utf-8"
          )
          prefix = "printf '%s' '"
          suffix = "' | base64 -d | gzip -d"
          start = source.find(prefix)
          if start < 0:
              raise SystemExit("guarded author payload prefix missing")
          start += len(prefix)
          end = source.find(suffix, start)
          if end <= start:
              raise SystemExit("guarded author payload suffix missing")
          encoded = source[start:end]
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          target = Path("${{ runner.temp }}/author.sh")
          target.write_bytes(payload)
          target.chmod(0o700)
          print("VOID_PR2761_GUARDED_AUTHOR_PAYLOAD_DECODED")
          print(f"payload_bytes={len(payload)}")
          PY

          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path("${{ runner.temp }}/author.sh")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = '"crash preappend identity"'
          marker_lines = [i for i, line in enumerate(lines) if marker in line]
          if len(marker_lines) != 1:
              raise SystemExit(
                  f"crash preappend author marker count={len(marker_lines)}"
              )

          diagnostic_lines = [
              i for i, line in enumerate(lines) if "expected one occurrence" in line
          ]
          if len(diagnostic_lines) != 1:
              raise SystemExit(
                  f"replace diagnostic count={len(diagnostic_lines)}"
              )
          diagnostic_index = diagnostic_lines[0]
          guard_candidates = [
              i
              for i in range(max(0, diagnostic_index - 12), diagnostic_index)
              if lines[i].strip() == "if count != 1:"
          ]
          if len(guard_candidates) != 1:
              raise SystemExit(
                  f"replace count guard candidates={len(guard_candidates)}"
              )
          guard_index = guard_candidates[0]
          guard_indent = lines[guard_index][: len(lines[guard_index]) - len(lines[guard_index].lstrip())]
          lines[guard_index:guard_index + 1] = [
              guard_indent
              + 'expected = 2 if label == "crash preappend identity" else 1',
              guard_indent + "if count != expected:",
          ]
          diagnostic_index += 1
          lines[diagnostic_index] = lines[diagnostic_index].replace(
              "expected one occurrence",
              "expected {expected} occurrences",
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("VOID_PR2761_CRASH_PREAPPEND_DUAL_IDENTITY_AUTHOR_PATCHED")
          PY

          bash -n "$RUNNER_TEMP/author.sh"
          export EXPECTED_BRANCH EXPECTED_PARENT EXPECTED_MAIN STAGER
          bash -x "$RUNNER_TEMP/author.sh"
