name: VOID PR2761 current presale successor author v1

on:
  push:
    branches:
      - ren/buy-void-preappend-detached-json-v1-20261010
    paths:
      - .github/workflows/void-pr2761-current-presale-successor-author-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2761-current-presale-successor-author-v1
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact wrapper commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and run guarded author with current lease
        env:
          EXPECTED_BRANCH: ren/buy-void-preappend-detached-json-v1-20261010
          EXPECTED_PARENT: a9c5a4629054c9aecc2239375bfb99e25e85db49
          EXPECTED_MAIN: ae87314f7b25b23e5ae1251eec7101dda8a1e0a9
          PRESERVED_NIMO_V3: 8cd91951bb7f43d953d4e4c86e2d8360fd7a0427
          NIMO_V3_PARENT: b672df7bd21971cc2e8c60261d853db67bcd3205
          STAGER: .github/workflows/void-pr2761-current-presale-successor-author-v1.yml
          PAYLOAD_COMMIT: b672df7bd21971cc2e8c60261d853db67bcd3205
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$STAGER"
          test "$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$PRESERVED_NIMO_V3^")" = "$NIMO_V3_PARENT"

          expected_nimo_paths="$({ printf '%s\n' \
            .github/workflows/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.yml \
            .github/workflows/buy-void-allocation-custody-witness-runtime-bundle-qualification-v1.yml \
            .github/workflows/buy-void-runtime-integration-v1.yml \
            docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.md \
            scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs; } | sort)"
          actual_nimo_paths="$(git diff --name-only "$NIMO_V3_PARENT" "$PRESERVED_NIMO_V3" | sort)"
          test "$actual_nimo_paths" = "$expected_nimo_paths"
          git merge-base --is-ancestor "$PRESERVED_NIMO_V3" HEAD

          git show "$PAYLOAD_COMMIT:$STAGER" > "$RUNNER_TEMP/original-author-workflow.yml"
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          source = Path("${{ runner.temp }}/original-author-workflow.yml").read_text(
              encoding="utf-8"
          )
          prefix = "printf '%s' '"
          suffix = "' | base64 -d | gzip -d"
          start = source.find(prefix)
          if start < 0:
              raise SystemExit("guarded author payload prefix missing")
          start += len(prefix)
          end = source.find(suffix, start)
          if end <= start:
              raise SystemExit("guarded author payload suffix missing")
          encoded = source[start:end]
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          target = Path("${{ runner.temp }}/author.sh")
          target.write_bytes(payload)
          target.chmod(0o700)
          print("VOID_PR2761_GUARDED_AUTHOR_PAYLOAD_DECODED")
          print(f"payload_bytes={len(payload)}")
          PY

          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path("${{ runner.temp }}/author.sh")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = '"crash preappend identity"'
          marker_lines = [i for i, line in enumerate(lines) if marker in line]
          if len(marker_lines) != 1:
              raise SystemExit(
                  f"crash preappend author marker count={len(marker_lines)}"
              )

          diagnostic_lines = [
              i for i, line in enumerate(lines) if "expected one occurrence" in line
          ]
          if len(diagnostic_lines) != 1:
              raise SystemExit(
                  f"replace diagnostic count={len(diagnostic_lines)}"
              )
          diagnostic_index = diagnostic_lines[0]
          guard_candidates = [
              i
              for i in range(max(0, diagnostic_index - 12), diagnostic_index)
              if lines[i].strip() == "if count != 1:"
          ]
          if len(guard_candidates) != 1:
              raise SystemExit(
                  f"replace count guard candidates={len(guard_candidates)}"
              )
          guard_index = guard_candidates[0]
          guard_indent = lines[guard_index][: len(lines[guard_index]) - len(lines[guard_index].lstrip())]
          lines[guard_index:guard_index + 1] = [
              guard_indent
              + 'expected = 2 if label == "crash preappend identity" else 1',
              guard_indent + "if count != expected:",
          ]
          diagnostic_index += 1
          lines[diagnostic_index] = lines[diagnostic_index].replace(
              "expected one occurrence",
              "expected {expected} occurrences",
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("VOID_PR2761_CRASH_PREAPPEND_DUAL_IDENTITY_AUTHOR_PATCHED")
          PY

          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path("${{ runner.temp }}/author.sh")
          source = path.read_text(encoding="utf-8")
          start_marker = 'runtime_path = Path(".github/workflows/buy-void-runtime-integration-v1.yml")'
          end_marker = 'runtime_path.write_text(runtime, encoding="utf-8")'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("runtime author section start missing")
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("runtime author section end missing")
          end += len(end_marker)

          replacement = """runtime_path = Path(".github/workflows/buy-void-runtime-integration-v1.yml")
          runtime = runtime_path.read_text(encoding="utf-8")
          loop_anchor = '          for proof in scripts/prove_buy_void_*.ts\\n          do\\n            case "$proof" in\\n'
          if runtime.count(loop_anchor) != 1:
              raise SystemExit(f"runtime loop anchor count={runtime.count(loop_anchor)}")
          historical_cases = '''              scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'mounted router generation drift' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_DISPATCH_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_operator_verified_allocation_dispatch_v2.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'exact reviewed dispatcher source drift' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_DISPATCH_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v2.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'reviewed handoff source blob mismatch:src/economic/buy_void_verified_allocation_replay_binding_v1.ts' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_HANDOFF_HELD=$proof"
                continue
                ;;
              scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v3.ts)
                set +e
                ./node_modules/.bin/tsx "$proof" > "$RUNNER_TEMP/$(basename "$proof").hold" 2>&1
                historical_status=$?
                set -e
                test "$historical_status" -eq 1
                grep -Fq 'reviewed handoff source blob mismatch:src/economic/buy_void_preappend_plain_input_v1.ts' "$RUNNER_TEMP/$(basename "$proof").hold"
                echo "VOID_BUY_VOID_HISTORICAL_HANDOFF_HELD=$proof"
                continue
                ;;
          '''
          runtime = runtime.replace(
              loop_anchor,
              '          for proof in scripts/prove_buy_void_*.ts\\n'
              '          do\\n'
              '            echo "VOID_BUY_VOID_PROOF_STACK_BEGIN=$proof"\\n'
              '            case "$proof" in\\n'
              + historical_cases,
          )
          current_line = '            ./node_modules/.bin/tsx "$proof"\\n'
          if runtime.count(current_line) != 1:
              raise SystemExit(f"runtime default proof line count={runtime.count(current_line)}")
          runtime = runtime.replace(
              current_line,
              current_line + '            echo "VOID_BUY_VOID_PROOF_STACK_GREEN=$proof"\\n',
          )
          runtime_path.write_text(runtime, encoding="utf-8")"""
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding="utf-8")
          print("VOID_PR2761_RUNTIME_STACK_CURRENT_STRUCTURE_AUTHOR_PATCHED")
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("${{ runner.temp }}/author.sh")
          source = path.read_text(encoding="utf-8")
          needle = 'git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"'
          if source.count(needle) != 1:
              raise SystemExit(f"publisher push marker count={source.count(needle)}")
          replacement = r'''export_dir="$RUNNER_TEMP/validated-tree"
          rm -rf -- "$export_dir"
          mkdir -p "$export_dir/files"
          git diff-tree --no-commit-id --name-status -r HEAD > "$export_dir/name-status.txt"
          : > "$export_dir/delete.txt"
          while IFS=\t' read -r status file_path
          do
            case "$status" in
              A|M)
                mkdir -p "$export_dir/files/$(dirname "$file_path")"
                git show "HEAD:$file_path" > "$export_dir/files/$file_path"
                ;;
              D)
                printf '%s\n' "$file_path" >> "$export_dir/delete.txt"
                ;;
              *)
                echo "unsupported_export_status=$status path=$file_path" >&2
                exit 1
                ;;
            esac
          done < "$export_dir/name-status.txt"
          git rev-parse HEAD > "$export_dir/local-commit.txt"
          git rev-parse HEAD^ > "$export_dir/parent.txt"
          git rev-parse HEAD^{tree} > "$export_dir/tree.txt"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$export_dir/paths.txt"
          echo "VOID_PR2761_VALIDATED_TREE_EXPORTED"'''
          path.write_text(source.replace(needle, replacement), encoding="utf-8")
          print("VOID_PR2761_OWNER_API_EXPORT_PATCHED")
          PY

          bash -n "$RUNNER_TEMP/author.sh"
          export EXPECTED_BRANCH EXPECTED_PARENT EXPECTED_MAIN STAGER
          bash -x "$RUNNER_TEMP/author.sh"
          test -s "$RUNNER_TEMP/validated-tree/tree.txt"
          test -s "$RUNNER_TEMP/validated-tree/parent.txt"
          grep -Fx "VOID_PR2761_VALIDATED_TREE_EXPORTED" <(tail -n 1 "$RUNNER_TEMP/validated-tree/../author-export-marker" 2>/dev/null || true) >/dev/null 2>&1 || true

      - name: Upload exact validated successor tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-pr2761-validated-successor-tree-${{ github.sha }}
          path: ${{ runner.temp }}/validated-tree
          if-no-files-found: error
          retention-days: 1
