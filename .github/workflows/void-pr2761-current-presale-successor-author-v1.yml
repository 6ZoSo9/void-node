name: VOID PR2761 current presale successor author v1

on:
  push:
    branches:
      - ren/buy-void-preappend-detached-json-v1-20261010
    paths:
      - .github/workflows/void-pr2761-current-presale-successor-author-v1.yml

permissions:
  contents: write

concurrency:
  group: void-pr2761-current-presale-successor-author-v1
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Decode guarded author
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/author.sh"
          chmod 0700 "$RUNNER_TEMP/author.sh"
          "$RUNNER_TEMP/author.sh"
