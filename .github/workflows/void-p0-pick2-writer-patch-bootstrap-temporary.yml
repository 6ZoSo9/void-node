name: VOID P0 Pick2 Writer Patch Bootstrap (temporary)

on:
  push:
    branches:
      - fix/agent-pick2-external-writer-cache-wedge-v1-20260817

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact P0 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Apply bounded P0 source patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          pilot_path = Path("src/economic/wc_public_earning_pilot_v1.ts")
          pilot = pilot_path.read_text()
          helper_name = "appendWcPublicRemoteTruthJsonlExactOnceV1"
          if helper_name not in pilot:
              import_anchor = '''import {
            acceptVerifiedReceiptOnce,
            readCanonicalWcState,
          } from "./wc_verified_receipt_acceptance_v1.js";
          '''
              helper_import = '''import {
            acceptVerifiedReceiptOnce,
            readCanonicalWcState,
          } from "./wc_verified_receipt_acceptance_v1.js";
          import {
            appendWcPublicRemoteTruthJsonlExactOnceV1,
          } from "./wc_public_remote_truth_jsonl_index_v1.js";
          '''
              pilot = replace_once(
                  pilot,
                  import_anchor,
                  helper_import,
                  "pilot helper import",
              )

              block = re.compile(
                  r'''function readJsonlMatches\([\s\S]*?\n}\n\nfunction appendExactOnce\([\s\S]*?\n}\n\nexport function persistImportedRemoteTruthOnce\(''',
                  re.MULTILINE,
              )
              replacement = '''async function appendExactOnce(
            file: string,
            value: JsonObject,
            idFields: string[],
          ): Promise<{ appended: boolean; existing: JsonObject | null }> {
            const result = await appendWcPublicRemoteTruthJsonlExactOnceV1(
              file,
              value,
              idFields,
              {
                durable: true,
                mode: 0o600,
                onMalformed: (error) => {
                  recordPilotBestEffortFailure("read-jsonl-line", error, { file });
                },
              },
            );
            return { appended: result.appended, existing: result.existing };
          }

          export async function persistImportedRemoteTruthOnce('''
              pilot, changed = block.subn(replacement, pilot, count=1)
              if changed != 1:
                  raise SystemExit(f"pilot exact-once block: expected one match, found {changed}")

              signature = re.compile(
                  r'''(export async function persistImportedRemoteTruthOnce\([\s\S]*?\n\)): JsonObject \{''',
                  re.MULTILINE,
              )
              pilot, changed = signature.subn(r'''\1: Promise<JsonObject> {''', pilot, count=1)
              if changed != 1:
                  raise SystemExit(f"pilot async return signature: expected one match, found {changed}")

              for name in ("receiptResult", "jobResult", "completedResult"):
                  pilot = replace_once(
                      pilot,
                      f"const {name} = appendExactOnce(",
                      f"const {name} = await appendExactOnce(",
                      f"pilot await {name}",
                  )
              pilot = replace_once(
                  pilot,
                  "const imported = persistImportedRemoteTruthOnce(",
                  "const imported = await persistImportedRemoteTruthOnce(",
                  "pilot await imported remote truth",
              )
              pilot_path.write_text(pilot)

          runtime_path = Path("scripts/prove_wc_public_earning_pilot_runtime_v1.ts")
          runtime = runtime_path.read_text()
          if "const imported = await pilot.persistImportedRemoteTruthOnce(" not in runtime:
              runtime = replace_once(
                  runtime,
                  "const imported = pilot.persistImportedRemoteTruthOnce(",
                  "const imported = await pilot.persistImportedRemoteTruthOnce(",
                  "runtime proof await first import",
              )
          if "const importedAgain = await pilot.persistImportedRemoteTruthOnce(" not in runtime:
              runtime = replace_once(
                  runtime,
                  "const importedAgain = pilot.persistImportedRemoteTruthOnce(",
                  "const importedAgain = await pilot.persistImportedRemoteTruthOnce(",
                  "runtime proof await duplicate import",
              )
          runtime_path.write_text(runtime)

          static_path = Path("scripts/prove_wc_public_earning_pilot_v1.ts")
          static = static_path.read_text()
          if 'const importIndex = moduleText.indexOf("const imported = await persistImportedRemoteTruthOnce(");' not in static:
              static = replace_once(
                  static,
                  'const importIndex = moduleText.indexOf("const imported = persistImportedRemoteTruthOnce(");',
                  'const importIndex = moduleText.indexOf("const imported = await persistImportedRemoteTruthOnce(");',
                  "static proof async import anchor",
              )
          static_path.write_text(static)

          final_pilot = pilot_path.read_text()
          if "function readJsonlMatches(" in final_pilot:
              raise SystemExit("legacy O(history) readJsonlMatches remains")
          if final_pilot.count(helper_name) < 2:
              raise SystemExit("bounded remote-truth helper binding incomplete")
          if final_pilot.count("await appendExactOnce(") != 3:
              raise SystemExit("expected exactly three awaited remote-truth appends")
          if final_pilot.count("await persistImportedRemoteTruthOnce(") != 1:
              raise SystemExit("expected exactly one awaited production remote-truth import")
      - name: Install proof dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove bounded external-writer behavior
        run: ./node_modules/.bin/tsx scripts/prove_agent_pick2_external_writer_cache_wedge_v1.ts
      - name: Prove WC public earning runtime
        run: ./node_modules/.bin/tsx scripts/prove_wc_public_earning_pilot_runtime_v1.ts
      - name: Prove WC public earning source contract
        run: ./node_modules/.bin/tsx scripts/prove_wc_public_earning_pilot_v1.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit exact bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            src/economic/wc_public_earning_pilot_v1.ts \
            scripts/prove_wc_public_earning_pilot_runtime_v1.ts \
            scripts/prove_wc_public_earning_pilot_v1.ts
          if git diff --cached --quiet; then
            echo "bounded P0 patch already present"
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): route WC remote truth through bounded writer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
