name: VOID Alignment Layer + Sovereign Emergency Control v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-alignment-layer-sovereign-emergency-control-v1.yml"
      - "docs/governance/void-alignment-layer-sovereign-emergency-control-v1.md"
      - "docs/MAINNET0_INCIDENT_BAD_BLOCK_POLICY.md"
      - "fixtures/governance/void-alignment-layer-sovereign-emergency-control-v1.json"
      - "fixtures/governance/void-sovereign-key-role-registry-v1.json"
      - "scripts/prove_void_alignment_layer_sovereign_emergency_control_v1.ts"
      - "src/security/void_alignment_layer_v1.ts"
      - "src/security/void_sovereign_emergency_control_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-alignment-layer-sovereign-emergency-control-v1.yml"
      - "docs/governance/void-alignment-layer-sovereign-emergency-control-v1.md"
      - "docs/MAINNET0_INCIDENT_BAD_BLOCK_POLICY.md"
      - "fixtures/governance/void-alignment-layer-sovereign-emergency-control-v1.json"
      - "fixtures/governance/void-sovereign-key-role-registry-v1.json"
      - "scripts/prove_void_alignment_layer_sovereign_emergency_control_v1.ts"
      - "src/security/void_alignment_layer_v1.ts"
      - "src/security/void_sovereign_emergency_control_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: void-alignment-layer-sovereign-emergency-control-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adversarial-proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove AL and emergency control
        run: npx --no-install tsx scripts/prove_void_alignment_layer_sovereign_emergency_control_v1.ts

  repository-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build runtime artifacts
        run: npm run build

      - name: Confirm compiled security contracts
        run: |
          grep -F 'VOID_ALIGNMENT_LAYER_V1' dist/security/void_alignment_layer_v1.js
          grep -F 'VOID_SOVEREIGN_EMERGENCY_CONTROL_V1' dist/security/void_sovereign_emergency_control_v1.js
          grep -F '23e2d92ebeb1d4b025eeb2a76f65b7f8ff6e6cc091f542e202569c9d5abbbd30' dist/security/void_sovereign_emergency_control_v1.js

      - name: Prove shallow committed-range diff hygiene contract
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene across committed change range
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
