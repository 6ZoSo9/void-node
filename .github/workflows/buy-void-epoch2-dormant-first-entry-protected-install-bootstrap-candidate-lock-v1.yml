name: Buy VOID Epoch-2 protected-bootstrap candidate lock v1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  push:
    branches: [main]
    paths:
      - "ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.yml"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.md"
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.yml"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact acceptance-lock generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="$(git rev-parse "$EXPECTED_HEAD^1")" ;;
            *) echo "unsupported_event=$EVENT_NAME" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.md' \
            'ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.json)" = a96dee99c89ef386a6cbd05609b8f4a764caada8
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py)" = 3b665808b28666d8e413063c8bd2a68e4a59b3d7
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-lock-v1.md)" = 5f99657424077c527076d8092ca98d54307326e3

          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py)" = d1417455330837c4d584f7bf36f932a869c903cb
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.yml)" = a4ef30d41a2a950c12db63f6a013cf5bc2b8abcf
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-candidate-v1.md)" = a7d4af84c6c21f5d6e4d894c130f7d4965885a96
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c)" = 243583d4ed0522796b2bbf448abd4e9c28958f50
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py)" = 383b84e71b371de65579e4113469e86a59b807ab

          test "$(git rev-parse 0ea097a3fa43dc95a1a0a5272c61afe570361fc7^{tree})" = 681e9387826f2c0fe8c0336604dfd6e57ff16d93
          git merge-base --is-ancestor 0ea097a3fa43dc95a1a0a5272c61afe570361fc7 "$EXPECTED_HEAD"

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Static lock proof
        run: |
          set -euo pipefail
          proof='scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py'

          python3 -I -B - <<'PY'
          from pathlib import Path
          p=Path("scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py")
          compile(p.read_text("utf-8"),str(p),"exec",dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V1_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/bootstrap-lock-self-test.log"
          python3 -I -B "$proof" --self-test | tee "$out"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V1_SELF_TEST_GREEN' \
            'canonical_lock_id_verified=true' \
            'candidate_source_generation_bound=true' \
            'candidate_hosted_evidence_bound=true' \
            'candidate_report_identity_bound=true' \
            'bootstrap_binary_identity_bound=true' \
            'candidate_source_blobs_bound=true' \
            'candidate_accepted=true' \
            'bootstrap_binary_identity_accepted=true' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Rederive and accept frozen canonical candidate
        run: |
          set -euo pipefail
          candidate_head=0ea097a3fa43dc95a1a0a5272c61afe570361fc7
          worktree="$RUNNER_TEMP/frozen-bootstrap-candidate-source"
          candidate_out="$RUNNER_TEMP/frozen-bootstrap-candidate-output"
          derive_log="$RUNNER_TEMP/frozen-bootstrap-candidate-derive.log"
          accept_log="$RUNNER_TEMP/frozen-bootstrap-candidate-accept.log"

          cleanup() {
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$worktree" "$candidate_head"
          (
            cd "$worktree"
            python3 -I -B \
              scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_v1.py \
              --derive-dir "$candidate_out"
          ) | tee "$derive_log"

          grep -Fx 'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_V1_DERIVE_GREEN' "$derive_log"
          grep -Fx 'candidate_id=voidbuye2bootstrapcand1_24d4c84d307c525cc4e28f010c7f2258db2e55256af7d8cf0cb303cf1c4ee851' "$derive_log"
          grep -Fx 'bootstrap_sha256=1b570f704841f8b833707de2c85ca66d2a344f3a77b5d1979ab29eaae2ec1189' "$derive_log"
          grep -Fx 'bootstrap_bytes=731072' "$derive_log"
          grep -Fx 'candidate_accepted=false' "$derive_log"
          grep -Fx 'protected_bootstrap_install_authorized=false' "$derive_log"
          grep -Fx 'funds_movement=false' "$derive_log"

          python3 -I -B \
            scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_candidate_lock_v1.py \
            --candidate-dir "$candidate_out" | tee "$accept_log"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_CANDIDATE_LOCK_V1_CANDIDATE_ACCEPTANCE_GREEN' \
            'canonical_lock_id_verified=true' \
            'frozen_candidate_rederived=true' \
            'candidate_report_bytes_exact=true' \
            'bootstrap_binary_bytes_exact=true' \
            'candidate_accepted=true' \
            'bootstrap_binary_identity_accepted=true' \
            'protected_bootstrap_install_authorized=false' \
            'protected_installer_apply_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$accept_log"
          done

          cleanup
          trap - EXIT
          git worktree prune
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
