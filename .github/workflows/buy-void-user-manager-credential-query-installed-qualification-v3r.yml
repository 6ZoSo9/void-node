name: VOID Buy credential query V3R installed qualification

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "docs/operators/buy-void-user-manager-credential-query-installed-qualification-v3r.md"
      - ".github/workflows/buy-void-user-manager-credential-query-installed-qualification-v3r.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "docs/operators/buy-void-user-manager-credential-query-installed-qualification-v3r.md"
      - ".github/workflows/buy-void-user-manager-credential-query-installed-qualification-v3r.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact reviewed generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py)" =             "1f582ab69d31a7f80518fe5c366c2d5036b02c3d"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v3r.py)" =             "aef3d57dcba1076bad33cd99c47bef54caa9526d"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_protected_replace_v3r.py)" =             "df103c1439dd054d98132c3beee226f3d8222314"
          test "$(git rev-parse HEAD:ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json)" =             "c4870f3178aebc9a0bb6557562f663b8480cfefa"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c)" =             "0d0e9546aea6e7346f5b35559bcdd8e7788900fe"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_query_live_qualification_v6.py)" =             "83bfd3f3baf5c9d2a9e21852b0f752f27d7749bc"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py",
              "scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v3r.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V3R_SYNTAX_GREEN")
          PY

      - name: Run qualifier self-test
        run: |
          set -euo pipefail
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py             --self-test |
            tee "$RUNNER_TEMP/v3r-qualification-self.log"
          grep -Fx             'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V3R_SELF_TEST_GREEN'             "$RUNNER_TEMP/v3r-qualification-self.log"

      - name: Prove exact V3R qualification source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3r-qualification-proof.log"
          python3 -I -B             scripts/prove_void_buy_void_user_manager_credential_query_installed_qualification_v3r.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_INSTALLED_QUALIFICATION_V3R_PROOF_GREEN"
            "v3r_lock_bound=true"
            "v3r_protected_generation_required=true"
            "v1_predecessor_required=true"
            "v2_predecessor_required=true"
            "double_credential_query_required=true"
            "complete_dropin_set_hash_stability_required=true"
            "complete_credential_set_hash_stability_required=true"
            "exactly_one_epoch2_credential_required=true"
            "unrelated_credentials_allowed=true"
            "v6_security_generation_composition_required=true"
            "credential_contents_read=false"
            "host_mutation=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "transaction=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove inert live plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3r-qualification-plan.log"
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py             --plan |
            tee "$out"
          for marker in             'credential_v3r_generation_required=true'             'credential_v1_predecessor_required=true'             'credential_v2_predecessor_required=true'             'double_credential_query_required=true'             'complete_dropin_set_hash_stability_required=true'             'complete_credential_set_hash_stability_required=true'             'v6_security_qualification_required=true'             'credential_contents_read=false'             'query_execution=false'             'host_mutation=false'             'production_host_evidence_authority=false'             'next_action=SEPARATELY_AUTHORIZE_CREDENTIAL_QUERY_V3R_READ_ONLY_QUALIFICATION'
          do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
