name: DataNet Promotion Evidence Collector v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-promotion-evidence-collector-v1.yml"
      - "docs/architecture/datanet-promotion-evidence-collector-v1.md"
      - "docs/architecture/datanet-promotion-evidence-map-generator-v1.md"
      - "schemas/datanet-promotion-external-evidence-v1.schema.json"
      - "fixtures/architecture/datanet-promotion-external-evidence-v1.green.json"
      - "scripts/datanet_promotion_evidence_source_collect_v1.mjs"
      - "scripts/prove_datanet_promotion_evidence_collector_v1.mjs"
      - "scripts/datanet_promotion_candidate_generate_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-promotion-evidence-collector-v1.yml"
      - "docs/architecture/datanet-promotion-evidence-collector-v1.md"
      - "docs/architecture/datanet-promotion-evidence-map-generator-v1.md"
      - "schemas/datanet-promotion-external-evidence-v1.schema.json"
      - "fixtures/architecture/datanet-promotion-external-evidence-v1.green.json"
      - "scripts/datanet_promotion_evidence_source_collect_v1.mjs"
      - "scripts/prove_datanet_promotion_evidence_collector_v1.mjs"
      - "scripts/datanet_promotion_candidate_generate_v1.mjs"

permissions:
  contents: read

concurrency:
  group: datanet-promotion-evidence-collector-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove GET-only DataNet evidence collection
        run: |
          set -euo pipefail
          node --check scripts/datanet_promotion_evidence_source_collect_v1.mjs
          node --check scripts/prove_datanet_promotion_evidence_collector_v1.mjs
          node scripts/prove_datanet_promotion_evidence_collector_v1.mjs
          git diff --exit-code
