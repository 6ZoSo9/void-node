name: VOID Buy VOID final protected V7/V2 census v6

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v6.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7-v2-census-v6.mjs"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v6.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-census-v6.md"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs"
      - "src/index.ts"
      - "src/http/api_attach.ts"
      - "src/http/api_attach.js"
      - "scripts/prove_void_attach_block_range_bounds_v1.mjs"
      - "scripts/prove_void_index_block_range_bounds_v1.mjs"
      - "ops/run-void-node-live-v1.sh"
      - "runtime/canonical-producer-self-http-guard-v5.cjs"
      - "scripts/prove_canonical_producer_legacy_self_http_observers_current_v5.mjs"
      - "scripts/prove_canonical_producer_source_generation_dispatch_v5.mjs"
      - "scripts/prove_void_public_checkpoint_seal_first_startup_current_v6.mjs"
      - ".github/workflows/canonical-producer-source-custody-v1.yml"
      - ".github/workflows/canonical-producer-legacy-self-http-observers-v1.yml"
      - ".github/workflows/void-live-agent-jsonl-runtime-wedge-v1.yml"
      - ".github/workflows/void-public-checkpoint-seal-first-startup-v1.yml"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-census-v6.yml"
      - "scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v6.mjs"
      - "docs/architecture/buy-void-enforcement-final-protected-v7-v2-census-v6.md"
      - "src/index.ts"
      - "src/http/api_attach.ts"
      - "src/http/api_attach.js"
      - "scripts/prove_void_attach_block_range_bounds_v1.mjs"
      - "scripts/prove_void_index_block_range_bounds_v1.mjs"
      - "ops/run-void-node-live-v1.sh"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact census generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and predecessor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor ee22c668ae2ac896b4b39a0690f65cc329a7717c "$EXPECTED_HEAD"
          git merge-base --is-ancestor d5ad8c401b67832919eeabd95f26bdae513e68fe "$EXPECTED_HEAD"
          test "$(git rev-parse d5ad8c401b67832919eeabd95f26bdae513e68fe:scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v5.mjs)" = e9783f70e2e25145897e0e594aacfd6d57f97bee
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build reviewed economic closure
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Derive protected V6 census
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_enforcement_final_protected_v7_v2_census_v6.mjs"
          node --check "$proof"
          out="$RUNNER_TEMP/final-protected-v7-v2-census-v6-node-${{ matrix.node }}.json"
          node "$proof" > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CENSUS_V6");
          assert.equal(c.version,6);
          assert.equal(c.predecessor_v5_census_head,
            "d5ad8c401b67832919eeabd95f26bdae513e68fe");
          assert.equal(c.protected_tracked_source_count,49);
          assert.equal(c.protected_generation_delta_count,2);
          assert.equal(c.protected_generation_delta_exact,true);
          assert.equal(c.unchanged_protected_path_count,47);
          assert.deepEqual(c.protected_generation_delta.map(x=>x.path),[
            "ops/run-void-node-live-v1.sh","src/index.ts",
          ]);
          assert.equal(c.economic_and_build_source_drift_count,0);
          assert.equal(c.frozen_candidate_rederived,false);
          assert.equal(c.frozen_lock_rewritten,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_CENSUS_V6_NODE_GREEN");
          console.log("census_id="+c.census_id);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-v7-v2-census-v6-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-protected-v7-v2-census-v6-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$HEAD^"
          fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git merge-base --is-ancestor "$merge_base" "$HEAD"
          git diff --check "$merge_base" "$HEAD"

  compare:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-v7-v2-census-v6-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census

      - name: Require Node 22/24/26 V6 census byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "census/final-protected-v7-v2-census-v6-node-$node.json"
          done
          cmp census/final-protected-v7-v2-census-v6-node-22.json census/final-protected-v7-v2-census-v6-node-24.json
          cmp census/final-protected-v7-v2-census-v6-node-22.json census/final-protected-v7-v2-census-v6-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("census/final-protected-v7-v2-census-v6-node-22.json","utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_PROTECTED_V7_V2_CENSUS_V6");
          assert.equal(c.protected_generation_delta_count,2);
          assert.equal(c.unchanged_protected_path_count,47);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_PROTECTED_V7_V2_CENSUS_V6_CROSS_NODE_GREEN");
          console.log("census_id="+c.census_id);
          NODE
