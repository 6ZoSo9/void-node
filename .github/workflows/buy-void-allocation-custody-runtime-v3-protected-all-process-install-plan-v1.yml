name: VOID Buy custody V3 protected all-process install plan v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-install-plan-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-install-plan-v1.yml"
      - "ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v6.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact protected install-plan successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="dd8dc931d4c5d9d857739f82be675127887283c0"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-install-plan-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-install-plan-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py)" = \
            "0fef4e6f76738dd474ea775985b1facdd922bb54"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py)" = \
            "cb22f8c1fd5f0ebf69d86f053206908c7510a662"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-install-plan-v1.md)" = \
            "d89a677b6a11aabf499cdff4812bc974814b1059"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-lock-v6.json)" = \
            "5ba0c8d7b1ab8e8384472bb867e0603e6986b9b1"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py

      - name: Self-test source-only plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/protected-procref-install-plan-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py \
            --self-test | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_INSTALL_PLAN_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'accepted_lock_exact=true' \
            'accepted_source_exact=true' \
            'fixed_protected_install_path_bound=true' \
            'create_only_plan=true' \
            'kernel_noreplace_publication_required=true' \
            'existing_destination_replacement_forbidden=true' \
            'post_publish_exact_source_identity_required=true' \
            'host_namespace_lease_provenance_still_required=true' \
            'live_at_use_reverification_required=true' \
            'root_execution_forbidden_for_plan=true' \
            'production_plan_explicit_filesystem_write=false' \
            'production_plan_filesystem_write_free=false' \
            'production_plan_atime_write_possible=true' \
            'install_target_selected=true' \
            'protected_install_authorized=false' \
            'protected_source_installed=false' \
            'live_privileged_census_authorized=false' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/protected-procref-install-plan-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py \
            | tee "$proof"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_INSTALL_PLAN_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'descriptor_bound_source_read=true' \
            'verified_bytes_executed_without_path_reopen=true' \
            'source_symlink_rejected=true' \
            'source_fifo_nonblocking_rejected=true' \
            'post_hash_path_swap_executes_verified_bytes=true' \
            'accepted_lock_exact=true' \
            'accepted_source_exact=true' \
            'fixed_protected_install_path_bound=true' \
            'deterministic_plan_id_proven=true' \
            'tampered_lock_rejected=true' \
            'root_source_plan_execution_rejected=true' \
            'without_dash_b_bootstrap_hold=true' \
            'apply_mode_absent=true' \
            'create_only_plan=true' \
            'kernel_noreplace_publication_required=true' \
            'existing_destination_replacement_forbidden=true' \
            'post_publish_exact_source_identity_required=true' \
            'host_namespace_lease_provenance_still_required=true' \
            'live_at_use_reverification_required=true' \
            'production_plan_explicit_filesystem_write=false' \
            'production_plan_filesystem_write_free=false' \
            'production_plan_atime_write_possible=true' \
            'install_target_selected=true' \
            'proof_fixture_filesystem_write=true' \
            'protected_install_authorized=false' \
            'protected_source_installed=false' \
            'live_privileged_census_authorized=false' \
            'replacement_apply_authorized=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Emit and validate inert plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/protected-procref-install-plan.json"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_install_plan_v1.py \
            --plan > "$plan"

          python3 -I -B - "$plan" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["marker"]=="VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_INSTALL_PLAN_V1"
          assert value["install_contract"]["create_only"] is True
          assert value["install_contract"]["kernel_noreplace_publication_required"] is True
          assert value["install_contract"]["existing_destination_replacement_forbidden"] is True
          assert value["install_contract"]["installed_execution_authorized"] is False
          assert value["install_contract"]["live_privileged_census_authorized"] is False
          assert value["authority"]["install_target_selected"] is True
          assert value["authority"]["protected_install_authorized"] is False
          assert value["authority"]["protected_source_installed"] is False
          assert value["authority"]["replacement_apply_authorized"] is False
          assert value["authority"]["payment_acceptance"] is False
          assert value["authority"]["public_presale_activation"] is False
          assert value["authority"]["funds_movement"] is False
          PY

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
