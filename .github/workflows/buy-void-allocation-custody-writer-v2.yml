name: VOID Buy VOID allocation custody writer v2

on:
  pull_request:
    paths:
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "src/economic/buy_void_allocation_custody_qualification_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_qualification_v1.ts"
      - "docs/architecture/buy-void-allocation-custody-qualification-v1.md"
      - "scripts/prove_buy_void_allocation_custody_writer_v2.ts"
      - "docs/architecture/buy-void-allocation-custody-writer-v2.md"
      - ".github/workflows/buy-void-allocation-custody-writer-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-custody-writer-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: custody writer v2 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove exact additive writer successor
        run: npx tsx scripts/prove_buy_void_allocation_custody_writer_v2.ts

      - name: Preserve V1 contract files without executing stale writer pin
        run: |
          set -euo pipefail
          test "$(git hash-object src/economic/buy_void_allocation_custody_qualification_v1.ts)" = "4adae871f2938840e2ec936e743d0b650b5f1a00"
          test "$(git hash-object scripts/prove_buy_void_allocation_custody_qualification_v1.ts)" = "756cc52119e78150e6cc251454e1a79d75ade9f9"
          test "$(git hash-object docs/architecture/buy-void-allocation-custody-qualification-v1.md)" = "b52f32ff343f7fd340c7782d0c68cde3bb54693d"
          git cat-file -e 59b336eb82222bf0f5bcfe37060ec520c54e9b62^{blob}
          echo "historical_custody_v1_preserved=true"
          echo "current_writer_v2_source_requalification=true"
          echo "production_gate_ready=false"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
