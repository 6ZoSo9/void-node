name: First public earn and validator registry recovery v1

on:
  pull_request:
    paths:
      - ".github/workflows/first-public-earn-validator-registry-recovery-v1.yml"
      - "docs/operators/first-public-earn-validator-registry-recovery-v1.md"
      - "fixtures/public-earning/void-public-earn-first-work-v1.json"
      - "ops/mainnet0/install-first-public-earn-runtime-v1.sh"
      - "ops/public/public-earn-coordinator-composition-v1.mjs"
      - "scripts/prove_first_public_earn_validator_registry_recovery_v1.mjs"
      - "tools/void-validator-candidate-registry-live-resolver-v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/first-public-earn-validator-registry-recovery-v1.yml"
      - "docs/operators/first-public-earn-validator-registry-recovery-v1.md"
      - "fixtures/public-earning/void-public-earn-first-work-v1.json"
      - "ops/mainnet0/install-first-public-earn-runtime-v1.sh"
      - "ops/public/public-earn-coordinator-composition-v1.mjs"
      - "scripts/prove_first_public_earn_validator_registry_recovery_v1.mjs"
      - "tools/void-validator-candidate-registry-live-resolver-v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prove_first_public_earn_validator_registry_recovery_v1.mjs
      - run: npm run typecheck
