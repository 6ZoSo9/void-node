name: VOID Buy VOID verified allocation replay binding v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs"
      - "docs/architecture/buy-void-verified-allocation-replay-binding-v1.md"
      - ".github/workflows/buy-void-verified-allocation-replay-binding-v1.yml"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-verified-allocation-replay-binding-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: verified allocation replay binding / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to expected HEAD
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Prove exact verified-payment allocation replay history
        run: |
          node --check scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs
          node scripts/prove_buy_void_verified_allocation_replay_binding_v1.mjs

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif [[ -z "$BASE_SHA" && -z "$HEAD_SHA" ]]; then
            # No pull-request payload on workflow_dispatch: check last commit
            # rather than treating empty revision arguments as valid SHAs.
            git diff --check HEAD^ HEAD
          else
            echo "diff_revision_pair_incomplete_hold" >&2
            exit 1
          fi
