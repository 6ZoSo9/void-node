name: VOID Buy VOID post-2865 provider closure lock v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml"
      - "docs/architecture/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.md"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs"
      - "ops/security/buy-void-enforcement-post2865-candidate-v1.json"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2865_v7_historical_refusal_v2.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "docs/architecture/buy-void-enforcement-post2865-lock-v1.md"
      - "docs/architecture/buy-void-enforcement-post2865-candidate-v1.md"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_v1.mjs"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs"
      - "docs/architecture/buy-void-enforcement-post2865-candidate-v1.md"
      - "ops/security/buy-void-enforcement-post2865-candidate-v1.json"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2865_v7_historical_refusal_v2.mjs"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "docs/architecture/buy-void-enforcement-post2865-lock-v1.md"
      - "scripts/prove_buy_void_delivery_dependency_provider_closure_v1.mjs"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and compile exact provider generation
        run: |
          set -euo pipefail
          npm run typecheck
          node ./node_modules/typescript/bin/tsc -p tsconfig.build.json

      - name: Classify historical versus V7 enforcement generation
        id: enforcement-generation
        run: |
          set -euo pipefail
          if test -f src/economic/buy_void_source_finality_generation_provenance_v7.ts; then
            echo "mode=v7" >> "$GITHUB_OUTPUT"
          else
            echo "mode=historical" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-enforce exact hosted provider closure
        if: steps.enforcement-generation.outputs.mode == 'historical'
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs
          receipt="$RUNNER_TEMP/provider-closure-lock-${{ matrix.node }}.json"
          node scripts/prove_buy_void_delivery_dependency_provider_closure_post2865_lock_v1.mjs > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(
            value.marker,
            "VOID_BUY_VOID_DELIVERY_DEPENDENCY_PROVIDER_CLOSURE_POST2865_LOCK_V1",
          );
          assert.equal(
            value.candidate_json_sha256,
            "6c2bfe62b0d669bc9794a13eb24d357026ca8f9f7c055af1bcc0c0893c94247b",
          );
          assert.equal(
            value.provider_closure_sha256,
            "3b6be7b9efdc7f70b6f270f77208efab2f7321136a54cc76a7e1d34c57bd4945",
          );
          assert.equal(value.provider_closure_identity_accepted,true);
          assert.equal(value.hosted_cross_node_identity_bound,true);
          assert.equal(value.current_descendant_semantics_requalified,true);
          assert.equal(value.provider_runtime_artifact_count,9);
          assert.equal(value.delivery_route_closure_composed,false);
          assert.equal(value.package_runtime_identity_accepted,false);
          assert.equal(value.whole_enforcement_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.public_presale_activation,false);
          assert.equal(value.funds_movement,false);
          console.log("VOID_BUY_VOID_PROVIDER_CLOSURE_POST2865_LOCK_NODE_GREEN");
          NODE

      - name: Verify provider closure on current protected integration
        if: steps.enforcement-generation.outputs.mode == 'v7'
        run: |
          set -euo pipefail
          echo "CURRENT_PROTECTED_INTEGRATION_DISPATCH_V3"
          receipt="$RUNNER_TEMP/provider-current-integration-${{ matrix.node }}.json"
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs --self-test
          node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs --receipt > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(v.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V3");
          assert.equal(v.provider_source_identity_preserved,true);
          assert.equal(v.provider_built_artifact_identity_preserved,true);
          assert.equal(v.protected_path_identity_preserved,false);
          assert.equal(v.protected_range_router_drift_classified,true);
          assert.equal(v.current_protected_source_generation_accepted,false);
          assert.equal(v.current_built_census_identity_matches_frozen_v4,true);
          assert.equal(v.current_generation_integration_verified,true);
          assert.equal(v.historical_v2_candidate_enforcement_identity_accepted,true);
          assert.equal(v.candidate_enforcement_identity_accepted,false);
          assert.equal(v.production_source_finality_authority_ready,false);
          assert.equal(v.public_presale_activation,false);
          assert.equal(v.funds_movement,false);
          NODE

      - name: Derive audited whole-enforcement candidate
        if: steps.enforcement-generation.outputs.mode == 'historical'
        run: |
          set -euo pipefail
          provider_receipt="$RUNNER_TEMP/provider-closure-lock-${{ matrix.node }}.json"
          candidate="$RUNNER_TEMP/enforcement-post2865-${{ matrix.node }}.json"
          node --check scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs
          node scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs \
            --self-test --provider-lock-receipt "$provider_receipt"
          node scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs \
            --derive --provider-lock-receipt "$provider_receipt" > "$candidate"
          node --input-type=module - "$candidate" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_POST2865_CANDIDATE_V1");
          assert.equal(c.package_runtime_identity_accepted,true);
          assert.equal(c.provider_closure_composed,true);
          assert.equal(c.delivery_route_closure_composed,true);
          assert.equal(c.third_party_package_runtime_closure_verified,true);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2865_CANDIDATE_NODE_GREEN");
          NODE

      - name: Lock exact audited whole-enforcement identity
        if: steps.enforcement-generation.outputs.mode == 'historical'
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/enforcement-post2865-${{ matrix.node }}.json"
          cmp "$candidate" ops/security/buy-void-enforcement-post2865-candidate-v1.json
          node --check scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs
          node scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs --self-test
          node scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs --derive \
            > "$RUNNER_TEMP/enforcement-post2865-lock-${{ matrix.node }}.json"
          cmp "$RUNNER_TEMP/enforcement-post2865-lock-${{ matrix.node }}.json" \
            ops/security/buy-void-enforcement-post2865-lock-v1.json

      - name: Require frozen post-2865 evidence preservation on V7 generation
        if: steps.enforcement-generation.outputs.mode == 'v7'
        run: |
          set -euo pipefail
          integration="$RUNNER_TEMP/provider-current-integration-${{ matrix.node }}.json"
          test -s "$integration"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_post2865_candidate_v1.mjs)" = "1e2eccad36b482c2bc72cd82a7432f677d251571"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-post2865-candidate-v1.json)" = "e85ec223ccb5babcc834a300e1be5abc315626dd"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_enforcement_post2865_lock_v1.mjs)" = "9ba14ccacca6c1e5ccb4204b58ffd3ef46800712"
          test "$(git rev-parse HEAD:ops/security/buy-void-enforcement-post2865-lock-v1.json)" = "37210b74fa0de86250af84ec088c2d74e9e90499"
          node --input-type=module - "$integration" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(v.provider_source_identity_preserved,true);
          assert.equal(v.frozen_lock_identity_preserved,true);
          assert.equal(v.frozen_candidate_rederived_on_current_head,false);
          assert.equal(v.current_generation_integration_verified,true);
          assert.equal(v.historical_v2_candidate_enforcement_identity_accepted,true);
          assert.equal(v.candidate_enforcement_identity_accepted,false);
          assert.equal(v.public_presale_activation,false);
          assert.equal(v.funds_movement,false);
          console.log("frozen_post2865_evidence_preserved=true");
          console.log("historical_provider_proof_reexecution_on_restack=false");
          NODE

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload exact lock receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-provider-closure-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/provider-closure-lock-${{ matrix.node }}.json
            ${{ runner.temp }}/provider-current-integration-${{ matrix.node }}.json
            ${{ runner.temp }}/enforcement-post2865-${{ matrix.node }}.json
            ${{ runner.temp }}/enforcement-post2865-lock-${{ matrix.node }}.json
            ${{ runner.temp }}/enforcement-post2865-v7-refusal-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Download Node-major lock receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-provider-closure-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require Node 22 24 26 provider identity
        run: |
          set -euo pipefail
          if test -s receipts/provider-current-integration-22.json; then
            for node in 22 24 26; do test -s "receipts/provider-current-integration-$node.json"; done
            cmp receipts/provider-current-integration-22.json receipts/provider-current-integration-24.json
            cmp receipts/provider-current-integration-22.json receipts/provider-current-integration-26.json
            node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync("receipts/provider-current-integration-22.json","utf8"));
          assert.equal(v.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V3");
          assert.equal(v.provider_source_identity_preserved,true);
          assert.equal(v.provider_built_artifact_identity_preserved,true);
          assert.equal(v.protected_path_identity_preserved,false);
          assert.equal(v.protected_range_router_drift_classified,true);
          assert.equal(v.current_protected_source_generation_accepted,false);
          assert.equal(v.current_generation_integration_verified,true);
          assert.equal(v.historical_v2_candidate_enforcement_identity_accepted,true);
          assert.equal(v.candidate_enforcement_identity_accepted,false);
          assert.equal(v.production_source_finality_authority_ready,false);
          assert.equal(v.funds_movement,false);
          console.log("VOID_BUY_VOID_PROVIDER_CURRENT_INTEGRATION_CROSS_NODE_GREEN");
          NODE
          else
            for node in 22 24 26; do
              test -s "receipts/provider-closure-lock-$node.json"
              test -s "receipts/enforcement-post2865-$node.json"
              test -s "receipts/enforcement-post2865-lock-$node.json"
            done
            cmp receipts/provider-closure-lock-22.json receipts/provider-closure-lock-24.json
            cmp receipts/provider-closure-lock-22.json receipts/provider-closure-lock-26.json
            cmp receipts/enforcement-post2865-22.json receipts/enforcement-post2865-24.json
            cmp receipts/enforcement-post2865-22.json receipts/enforcement-post2865-26.json
            cmp receipts/enforcement-post2865-lock-22.json receipts/enforcement-post2865-lock-24.json
            cmp receipts/enforcement-post2865-lock-22.json receipts/enforcement-post2865-lock-26.json
            node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync("receipts/provider-closure-lock-22.json","utf8"));
          const c=JSON.parse(fs.readFileSync("receipts/enforcement-post2865-22.json","utf8"));
          const l=JSON.parse(fs.readFileSync("receipts/enforcement-post2865-lock-22.json","utf8"));
          assert.equal(p.provider_closure_identity_accepted,true);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(l.candidate_enforcement_identity_accepted,true);
          assert.equal(l.production_source_finality_authority_ready,false);
          assert.equal(l.funds_movement,false);
          console.log("VOID_BUY_VOID_PROVIDER_CLOSURE_POST2865_LOCK_CROSS_NODE_GREEN");
          NODE
          fi
