name: VOID Buy VOID V2 live-process collection plan

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "docs/operators/buy-void-source-finality-live-process-v2-collection-plan-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-v2-collection-plan-v1.yml"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "scripts/prove_buy_void_source_finality_live_process_v2_collection_plan_v1.ts"
      - "docs/operators/buy-void-source-finality-live-process-v2-collection-plan-v1.md"
      - ".github/workflows/buy-void-source-finality-live-process-v2-collection-plan-v1.yml"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and prove collection plan
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsx scripts/prove_buy_void_source_finality_live_process_v2_collection_plan_v1.ts |
            tee "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'VOID_BUY_VOID_V2_LIVE_PROCESS_COLLECTION_PLAN_V1_PROOF_GREEN' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'selector_elf_lock_bound=true' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'selector_pidfd_handshake_required=true' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'selector_spawn_error_machine_readable_hold=true' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'reviewed_node_options_exact=true' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'malicious_node_options_preload_rejected=true' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'receipt_publication_authorized=false' "$RUNNER_TEMP/v2-collection-plan.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/v2-collection-plan.log"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}"
          git diff --check "$BASE" "$HEAD"
