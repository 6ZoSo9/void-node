name: VOID economic epoch2 Besu raw transaction validator runtime v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-besu-raw-transaction-validator-runtime-v1.yml"
      - "besu-plugins/epoch2-raw-transaction-domain-v1/**"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-v1.json"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_source_v1.mjs"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.mjs"
      - "scripts/run_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.sh"
      - "docs/operators/economic-epoch2-besu-raw-transaction-validator-runtime-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-besu-raw-transaction-validator-runtime-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BESU_IMAGE: hyperledger/besu@sha256:6f3f21ce533383fcc8db3bce02252b59d5a9e776b72b5a1c8ecd2db011600042
      VOID_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove hosted-runtime source boundary
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_source_v1.mjs
          node --check scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.mjs
          bash -n scripts/run_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.sh
          node scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_runtime_source_v1.mjs

      - name: Prove plugin on disposable pinned Besu
        run: bash scripts/run_void_economic_epoch2_besu_raw_transaction_validator_runtime_v1.sh

      - name: Upload hosted Besu raw-domain runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-economic-epoch2-besu-raw-transaction-validator-runtime-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/void-besu-raw-domain-runtime-v1/void-economic-epoch2-besu-raw-transaction-validator-runtime-v1.json
            ${{ runner.temp }}/void-besu-raw-domain-runtime-v1/plugins/void-epoch2-raw-transaction-domain-plugin-v1.jar
            ${{ runner.temp }}/void-besu-raw-domain-runtime-v1/genesis.json
            ${{ runner.temp }}/void-besu-raw-domain-runtime-v1/qbft-extra-data.txt
            ${{ runner.temp }}/void-besu-raw-domain-runtime-v1/besu.log
          if-no-files-found: warn
          retention-days: 30

      - name: Diff hygiene
        run: git diff --check
