name: Apollyon candidate training entrypoint hold v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_candidate_training_entrypoint_v1.c"
      - "scripts/prove_apollyon_candidate_training_entrypoint_v1.py"
      - "docs/security/apollyon-candidate-training-entrypoint-v1.md"
      - ".github/workflows/apollyon-candidate-training-entrypoint-v1.yml"
  push:
    branches:
      - main
    paths:
      - "ops/xiphos/apollyon_candidate_training_entrypoint_v1.c"
      - "scripts/prove_apollyon_candidate_training_entrypoint_v1.py"
      - "docs/security/apollyon-candidate-training-entrypoint-v1.md"
      - ".github/workflows/apollyon-candidate-training-entrypoint-v1.yml"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Syntax and source proof
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prove_apollyon_candidate_training_entrypoint_v1.py
          python3 scripts/prove_apollyon_candidate_training_entrypoint_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          MERGE_BASE="$(git merge-base "$BASE" HEAD)"
          git diff --check "$MERGE_BASE" HEAD
