name: Buy VOID presale host-evidence collection plan v1

on:
  pull_request:
    paths:
      - "ops/security/buy-void-presale-host-evidence-collection-plan-v1.json"
      - "scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py"
      - "docs/operators/buy-void-presale-host-evidence-collection-plan-v1.md"
      - ".github/workflows/buy-void-presale-host-evidence-collection-plan-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact plan generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          STACK_PARENT=086887b517bf6bf6fab336cbcc56c22471e1a92c
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$STACK_PARENT" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            'ops/security/buy-void-presale-host-evidence-collection-plan-v1.json' \
            'scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py' \
            'docs/operators/buy-void-presale-host-evidence-collection-plan-v1.md' \
            '.github/workflows/buy-void-presale-host-evidence-collection-plan-v1.yml' \
            | sort > "$expected"
          git diff --no-renames --name-only "$STACK_PARENT" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-host-evidence-collection-plan-v1.json)" = 3a503e0b64fe56f58f2c344531034192d9005b94
          test "$(git rev-parse HEAD:scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py)" = 257e1ae47d3f0794899a9902f04858125b4b6aa1
          test "$(git rev-parse HEAD:docs/operators/buy-void-presale-host-evidence-collection-plan-v1.md)" = 99b8d5e01adbb3a32aef7707398b7a3b40e624f1

          git diff --check "$STACK_PARENT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify pinned current-main compatibility
        run: |
          set -euo pipefail
          MAIN_REF=e64049c3f460eae077364567f63aa3298ecf9c31
          git cat-file -e "$MAIN_REF^{commit}"

          check_pair() {
            path="$1"
            expected="$2"
            test "$(git rev-parse "HEAD:$path")" = "$expected"
            test "$(git rev-parse "$MAIN_REF:$path")" = "$expected"
          }

          check_pair 'ops/precision/void_buy_void_source_finality_v7_deployment_receipt_install_v1.ts' '3de6e4bd1f9aa2e9c0a0889cc7c0ab489cb306c0'
          check_pair 'ops/precision/void_buy_void_source_finality_live_process_binding_v2_receipt_publish_v1.ts' 'a334ab29477dec3e36862a512191b9701debb73e'
          check_pair 'src/economic/buy_void_source_finality_live_process_binding_v2.ts' '987c97568a4d1b9814218603df48a65dbfeed18f'
          check_pair 'ops/precision/void_buy_void_source_finality_live_process_v2_collection_plan_v1.ts' 'd47a6f99870f385c1bc938adbef74535b78eba1f'
          check_pair 'src/economic/buy_void_allocation_custody_witness_live_read_replay_rollback_independence_v1.ts' '2d5fc24498b569f20701445d6214a8ca31e4f701'
          check_pair 'tools/void-buy-allocation-custody-witness-live-read-replay-rollback-policy-evidence-v1.mjs' 'cf40d9d4a19d138d74aee849a6c02f96ee362dbb'
          check_pair 'src/economic/buy_void_allocation_custody_witness_live_read_replay_rollback_second_control_composition_v1.ts' '97180cc03e3f1b2f9935191ac6aafe4b15307708'
          check_pair 'ops/precision/void_buy_void_epoch2_live_composition_native_installed_qualification_v5.py' 'a04c2e7665294cdd142426e9eb01ee27c5292b8d'
          check_pair 'scripts/prove_void_buy_void_epoch2_live_composition_native_installed_qualification_v5.py' 'c14ec00acffbc55630aa68db0013d97cac068ab3'

          echo VOID_BUY_VOID_PRESALE_HOST_EVIDENCE_COLLECTION_PLAN_V1_CURRENT_MAIN_COMPAT_GREEN
          echo current_main_reference_head=$MAIN_REF
          echo current_main_reference_blob_identity_verified=true
          echo auto_adopt_later_main=false

      - name: Syntax check
        run: python3 -I -B -m py_compile scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py

      - name: Prove collection plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/host-evidence-plan-v1.log"
          python3 -I -B scripts/prove_buy_void_presale_host_evidence_collection_plan_v1.py | tee "$out"
          for marker in \
            'VOID_BUY_VOID_PRESALE_HOST_EVIDENCE_COLLECTION_PLAN_V1_PROOF_GREEN' \
            'plan_id=voidbuyhostevplan1_42809a0e54b1adf4537df6ec848d3327299dee2895becd174d60e4f287dae1b7' \
            'primitive_path_count=9' \
            'lane_mapping_exact=true' \
            'lane_mapping_mutation_rejected=true' \
            'all_pinned_primitive_blobs_match_current_stack=true' \
            'receipt_evidence_collected=false' \
            'custody_evidence_collected=false' \
            'epoch2_installed_evidence_collected=false' \
            'host_execution_authorized=false' \
            'filesystem_read_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'wc_void_market_activation_authorized=false' \
            'funds_movement=false' \
            'next_gate=SEPARATELY_AUTHORIZE_READ_ONLY_HOST_EVIDENCE_COLLECTION'
          do
            grep -Fx "$marker" "$out"
          done
