name: VOID Buy allocation custody host evidence v2

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-host-evidence-v2.mjs"
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_host_evidence_v2.mjs"
      - "docs/architecture/buy-void-allocation-custody-host-evidence-v2.md"
      - ".github/workflows/buy-void-allocation-custody-host-evidence-v2.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-allocation-custody-host-evidence-v2.mjs"
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_host_evidence_v2.mjs"
      - "docs/architecture/buy-void-allocation-custody-host-evidence-v2.md"
      - ".github/workflows/buy-void-allocation-custody-host-evidence-v2.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove user-manager adapter contract
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-host-evidence-v2.mjs
          node scripts/prove_buy_void_allocation_custody_host_evidence_v2.mjs |
            tee "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'VOID_BUY_VOID_ALLOCATION_CUSTODY_HOST_EVIDENCE_V2_PROOF_GREEN' "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'runtime_service_manager=user' "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'user_manager_bus_exact=true' "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'v1_storage_mount_socket_source_engine_reused=true' "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/custody-host-v2.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/custody-host-v2.log"
          git diff --check
