name: VOID Buy VOID source finality handoff v1

on:
  pull_request:
    paths:
      - "scripts/lib/void_buy_void_source_finality_handoff_v1.mjs"
      - "scripts/prove_void_buy_void_source_finality_handoff_v1.mjs"
      - "docs/architecture/buy-void-source-finality-handoff-v1.md"
      - ".github/workflows/void-buy-void-source-finality-handoff-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/void_buy_void_source_finality_handoff_v1.mjs"
      - "scripts/prove_void_buy_void_source_finality_handoff_v1.mjs"
      - "docs/architecture/buy-void-source-finality-handoff-v1.md"
      - ".github/workflows/void-buy-void-source-finality-handoff-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-buy-void-source-finality-handoff-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Check module syntax
        run: node --check scripts/lib/void_buy_void_source_finality_handoff_v1.mjs
      - name: Check proof syntax
        run: node --check scripts/prove_void_buy_void_source_finality_handoff_v1.mjs
      - name: Prove deterministic source-finality handoff
        run: node scripts/prove_void_buy_void_source_finality_handoff_v1.mjs
      - name: Diff hygiene
        run: git diff --check
