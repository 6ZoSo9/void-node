name: Guard index.ts size & markers

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure script is executable
        run: chmod +x tools/check_index_size.sh

      - name: Run guard
        run: tools/check_index_size.sh

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Block files >=10MB in working tree
        run: |
          big=$(find . -type f -size +10M -not -path './.git/*' -printf '%s %p\n' | wc -l)
          if [ "$big" -gt 0 ]; then
            echo "Found files >=10MB in working tree:"
            find . -type f -size +10M -not -path './.git/*' -printf '%s %p\n' | awk '{printf "%.2f MB  %s\n",$1/1024/1024,$2}'
            exit 1
          fi

  no-large-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }   # IMPORTANT: get full history
      - name: Block blobs >=10MB anywhere in history
        run: |
          bash tools/check_large_history_baseline.sh
