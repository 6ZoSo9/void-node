name: Guard index.ts size & markers

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-size-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Block files >=10MB in working tree
        run: |
          big=$(find . -type f -size +10M -not -path './.git/*' -printf '%s %p\n' | wc -l)
          if [ "$big" -gt 0 ]; then
            echo "Found files >=10MB in working tree:"
            find . -type f -size +10M -not -path './.git/*' -printf '%s %p\n' | awk '{printf "%.2f MB  %s\n",$1/1024/1024,$2}'
            exit 1
          fi

      - name: Block blobs >=10MB anywhere in history
        run: bash tools/check_large_history_baseline.sh
