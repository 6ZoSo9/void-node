name: DataNet H1 ext4 publication v1

on:
  pull_request:
    paths:
      - "fixtures/datanet-h1-publication-ext4-v1.json"
      - "scripts/prove_datanet_h1_publication_ext4_v1.mjs"
      - "docs/datanet-h1-publication-ext4-v1.md"
      - ".github/workflows/datanet-h1-publication-ext4-v1.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/datanet-h1-publication-ext4-v1.json"
      - "scripts/prove_datanet_h1_publication_ext4_v1.mjs"
      - "docs/datanet-h1-publication-ext4-v1.md"
      - ".github/workflows/datanet-h1-publication-ext4-v1.yml"

permissions:
  contents: read

concurrency:
  group: datanet-h1-publication-ext4-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Assert exact source head and hosted tools
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -x /usr/bin/fallocate
          test -x /usr/bin/ln
          test -x /usr/sbin/mkfs.ext4
          node --version
      - name: Prove reservation, anonymous rehash, and create-only publication on dedicated ext4
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/void-datanet-h1-v26-node-${{ matrix.node }}.ext4"
          mountpoint="$RUNNER_TEMP/void-datanet-h1-v26-node-${{ matrix.node }}-mnt"
          mounted=0
          cleanup() {
            set +e
            if [ "$mounted" -eq 1 ]; then
              sync
              sudo umount "$mountpoint"
            fi
            rmdir "$mountpoint" 2>/dev/null || true
            rm -f "$image"
          }
          trap cleanup EXIT

          /usr/bin/dd if=/dev/zero of="$image" bs=1M count=384 status=none
          test "$(stat -c %s "$image")" -eq 402653184
          allocated_bytes=$(( $(stat -c %b "$image") * 512 ))
          test "$allocated_bytes" -ge 402653184
          /usr/sbin/mkfs.ext4 -F -q -E lazy_itable_init=0,lazy_journal_init=0 "$image"

          mkdir "$mountpoint"
          sudo mount -o loop,nosuid,nodev,noexec "$image" "$mountpoint"
          mounted=1
          test "$(findmnt -n -o FSTYPE --target "$mountpoint")" = ext4
          sudo mkdir "$mountpoint/store"
          sudo chown "$(id -u):$(id -g)" "$mountpoint/store"
          sudo chmod 0700 "$mountpoint/store"
          test -z "$(find "$mountpoint/store" -mindepth 1 -maxdepth 1 -print -quit)"

          export VOID_DATANET_EXT4_ROOT="$mountpoint/store"
          node scripts/prove_datanet_h1_publication_ext4_v1.mjs

          sync
          sudo umount "$mountpoint"
          mounted=0
          trap - EXIT
          rmdir "$mountpoint"
          rm -f "$image"
      - name: Diff hygiene
        run: git diff --check
