name: Buy VOID Epoch-2 dormant binder protected installer v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-protected-install-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-protected-install-v2.yml"
      - "ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "docs/operators/buy-void-epoch2-dormant-binder-native-protected-install-v2.md"
      - ".github/workflows/buy-void-epoch2-dormant-binder-native-protected-install-v2.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V3 lock and V2 installer scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse "$EXPECTED_HEAD^1")"
          fi

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-binder-installer-first-entry-v1.yml' \
            '.github/workflows/buy-void-epoch2-dormant-binder-native-protected-install-v2.yml' \
            'docs/operators/buy-void-epoch2-dormant-binder-installer-first-entry-v1.md' \
            'docs/operators/buy-void-epoch2-dormant-binder-native-protected-install-v2.md' \
            'ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_v1.c' \
            'ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py' \
            'scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-dormant-binder-native-candidate-lock-v3.json)" =             5aa397be684dd1c87ca84fcb4d70ab3ebc176eb1
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py)" =             37f8b9269e91ac37c65a527e5e3f87b6e5b10213
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py)" =             c83f44626ef347b52b878614a6df3e8df2c2f358
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_binding_native_preentry_v2.c)" =             4fdf3f627f407335b9d50800fbbc913d1edae523
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_candidate_v3r_live_binding_v2.mjs)" =             9c29eb4716077e459b9154f39d0f30cf2e56729f

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_NATIVE_PROTECTED_INSTALL_V2_SYNTAX_GREEN")
          PY

      - name: Prove V3-bound create-only installer
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dormant-binder-install-v2-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_dormant_binder_native_protected_install_v2.py |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_DORMANT_BINDER_NATIVE_PROTECTED_INSTALL_V2_PROOF_GREEN"
            "accepted_dormant_binder_v3_lock_bound=true"
            "post_3363_verified_helper_generation_bound=true"
            "accepted_v3_lock_parser_exercised=true"
            "superseded_pre_3363_locks_install_authority=false"
            "exact_native_candidate_bound=true"
            "exact_binder_git_object_bound=true"
            "distinct_fixed_install_root=true"
            "authenticated_first_entry_fd_contract_required_for_apply=true"
            "create_only=true"
            "atomic_root_publication_required=true"
            "rename_noreplace_required=true"
            "native_mode_0555=true"
            "binder_mode_0444=true"
            "staging_cleanup_before_publication_failure=true"
            "explicit_apply_confirmation_required=true"
            "operation_bound_plan_id_required=true"
            "plan_id_validation_precedes_host_access=true"
            "prepublication_revalidation_required=true"
            "post_publication_rollback=false"
            "single_final_root_publish_call=true"
            "truthful_post_publication_failure_receipt=true"
            "post_publication_failure_requires_inspection=true"
            "native_execution=false"
            "binder_execution=false"
            "credential_access=false"
            "private_key_access=false"
            "signing=false"
            "transaction=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
            "next_gate=EPOCH2_DORMANT_BINDER_INSTALLED_READ_ONLY_QUALIFICATION_V2"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
