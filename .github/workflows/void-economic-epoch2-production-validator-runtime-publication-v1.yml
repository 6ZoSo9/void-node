name: VOID economic epoch2 production validator runtime publication v1

on:
  pull_request:
    paths:
      - "tools/void-economic-epoch2-production-validator-runtime-publication-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_publication_v1.mjs"
      - "docs/operators/economic-epoch2-production-validator-runtime-publication-v1.md"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-*-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-*-import-v1.json"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-publication-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-economic-epoch2-production-validator-runtime-publication-v1.mjs"
      - "scripts/prove_void_economic_epoch2_production_validator_runtime_publication_v1.mjs"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-*-v1.json"
      - "ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-*-import-v1.json"
      - ".github/workflows/void-economic-epoch2-production-validator-runtime-publication-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove publication verifier source
        run: |
          set -euo pipefail
          node --check tools/void-economic-epoch2-production-validator-runtime-publication-v1.mjs
          node --check scripts/prove_void_economic_epoch2_production_validator_runtime_publication_v1.mjs
          node scripts/prove_void_economic_epoch2_production_validator_runtime_publication_v1.mjs

      - name: Verify any canonical published host pairs
        run: |
          set -euo pipefail
          for role in precision nimo xiphos; do
            evidence="ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-${role}-v1.json"
            receipt="ops/mainnet0/economic-epoch2-production-validator-runtime-evidence-${role}-import-v1.json"
            if test -e "$evidence" || test -e "$receipt"; then
              test -f "$evidence"
              test -f "$receipt"
              node tools/void-economic-epoch2-production-validator-runtime-publication-v1.mjs                 --machine-role "$role"                 --evidence "$evidence"                 --import "$receipt"
            fi
          done

      - name: Diff hygiene
        run: git diff --check
