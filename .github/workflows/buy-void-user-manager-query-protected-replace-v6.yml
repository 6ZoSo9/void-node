name: VOID Buy protected user-manager query replacement v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_query_protected_replace_v6.py"
      - "docs/operators/buy-void-user-manager-query-protected-replace-v6.md"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v6.json"
      - ".github/workflows/buy-void-user-manager-query-protected-replace-v6.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "scripts/prove_void_buy_void_user_manager_query_protected_replace_v6.py"
      - "docs/operators/buy-void-user-manager-query-protected-replace-v6.md"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v6.json"
      - ".github/workflows/buy-void-user-manager-query-protected-replace-v6.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py",
              "scripts/prove_void_buy_void_user_manager_query_protected_replace_v6.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_QUERY_PROTECTED_REPLACE_V6_SYNTAX_GREEN")
          PY

      - name: Prove exact replacement source
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_void_buy_void_user_manager_query_protected_replace_v6.py |
            tee "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_QUERY_PROTECTED_REPLACE_V6_PROOF_GREEN' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'accepted_v6_lock_bound=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'installed_v2_identity_bound=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'fixed_preexec_unchanged=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'v1_predecessor_preserved=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'v2_predecessor_retained=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'atomic_query_exchange_required=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'automatic_failure_rollback=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'explicit_apply_confirmation_required=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'explicit_rollback_confirmation_required=true' "$RUNNER_TEMP/replace-v6-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/replace-v6-proof.log"

      - name: Prove inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/replace-v6-source-plan.log"
          python3 -I -B             ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py             --source-plan | tee "$out"
          grep -Fx 'source_only=true' "$out"
          grep -Fx 'host_read=false' "$out"
          grep -Fx 'host_write=false' "$out"
          grep -Fx 'preexec_replacement=false' "$out"
          grep -Fx 'v1_predecessor_preserved=true' "$out"
          grep -Fx 'v2_predecessor_retained_after_success=true' "$out"
          grep -Fx 'query_atomic_exchange_required=true' "$out"
          grep -Fx 'query_execution=false' "$out"
          grep -Fx 'service_mutation=false' "$out"
          grep -Fx 'systemd_mutation=false' "$out"
          grep -Fx 'payment_acceptance=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Require explicit mutation confirmations
        run: |
          set -euo pipefail
          apply_log="$RUNNER_TEMP/replace-v6-missing-apply-confirm.log"
          if python3 -I -B                ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py                --apply --query /nonexistent/v6-query >"$apply_log" 2>&1; then
            echo "apply unexpectedly admitted without confirmation" >&2
            exit 1
          fi
          grep -Fx 'reason=explicit_atomic_exchange_confirmation_required' "$apply_log"

          rollback_log="$RUNNER_TEMP/replace-v6-missing-rollback-confirm.log"
          if python3 -I -B                ops/precision/void_buy_void_user_manager_query_protected_replace_v6.py                --rollback >"$rollback_log" 2>&1; then
            echo "rollback unexpectedly admitted without confirmation" >&2
            exit 1
          fi
          grep -Fx 'reason=explicit_rollback_confirmation_required' "$rollback_log"

      - run: git diff --check
