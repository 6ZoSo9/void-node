name: VOID Buy VOID V7 executable delta candidate v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_execution_preflight_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "src/economic/buy_void_ethereum_public_checkout_finality_gate_v1.ts"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs"
      - "ops/security/buy-void-enforcement-post2933-candidate-v1.json"
      - "docs/architecture/buy-void-enforcement-post2933-candidate-v1.md"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_source_finality_execution_preflight_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "src/economic/buy_void_ethereum_public_checkout_finality_gate_v1.ts"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs"
      - "scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs"
      - "ops/security/buy-void-enforcement-post2933-candidate-v1.json"
      - "docs/architecture/buy-void-enforcement-post2933-candidate-v1.md"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build exact candidate
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Derive non-authoritative V7 executable delta
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs
          receipt="$RUNNER_TEMP/v7-executable-delta-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(
            value.marker,
            "VOID_BUY_VOID_SOURCE_FINALITY_V7_EXECUTABLE_DELTA_CANDIDATE_V1",
          );
          assert.equal(value.module_count,5);
          assert.equal(value.modules.length,5);
          assert.equal(value.predecessor_enforcement_lock.historical_identity_preserved,true);
          assert.equal(value.cross_node_byte_identity_required,true);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.deployed_artifact_generation_verified,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.public_presale_activation,false);
          assert.equal(value.funds_movement,false);
          assert.match(value.source_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.artifact_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.candidate_generation_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_NODE_GREEN");
          NODE

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/v7-executable-delta-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require Node 22 24 26 byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/v7-executable-delta-node-$node.json"
          done
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-24.json
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(
            fs.readFileSync("receipts/v7-executable-delta-node-22.json","utf8"),
          );
          assert.equal(value.module_count,5);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.funds_movement,false);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_generation_sha256="+value.candidate_generation_sha256);
          console.log("artifact_inventory_sha256="+value.artifact_inventory_sha256);
          NODE

  enforcement-candidate:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build exact current generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Reprove exact 27-artifact census
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs
          node scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs > "$RUNNER_TEMP/census-${{ matrix.node }}.json"
          node --input-type=module - "$RUNNER_TEMP/census-${{ matrix.node }}.json" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.census_id,"voidbe2933c1_bf0fae6a02a69c2fe17c2fd6a4a552db4f30dfdee16a8b4429865e3de389d888");
          assert.equal(c.artifact_count,27);
          assert.equal(c.complete_executable_closure_verified,false);
          NODE

      - name: Derive complete unaccepted enforcement candidate
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs
          node scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs --self-test
          out="enforcement-post2933-candidate-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs --derive > "$out"
          cmp "$out" ops/security/buy-void-enforcement-post2933-candidate-v1.json
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_POST2933_CANDIDATE_V1");
          assert.equal(c.candidate_enforcement_set_sha256,"839840e9480abdda2afe2daa3e948e7f1508ffe3a5e1c8316e4fc32b22ccebbc");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          NODE

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-post2933-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: enforcement-post2933-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  enforcement-candidate-cross-node:
    needs: [enforcement-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Download Node-major enforcement candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-post2933-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require exact Node 22 24 26 candidate equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/enforcement-post2933-candidate-$node.json"
          done
          cmp receipts/enforcement-post2933-candidate-22.json receipts/enforcement-post2933-candidate-24.json
          cmp receipts/enforcement-post2933-candidate-22.json receipts/enforcement-post2933-candidate-26.json
          sha256sum receipts/enforcement-post2933-candidate-22.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("receipts/enforcement-post2933-candidate-22.json","utf8"));
          assert.equal(c.candidate_enforcement_set_sha256,"839840e9480abdda2afe2daa3e948e7f1508ffe3a5e1c8316e4fc32b22ccebbc");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2933_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          NODE
