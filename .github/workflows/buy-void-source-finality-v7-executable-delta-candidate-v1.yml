name: VOID Buy VOID V7 executable delta candidate v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_source_finality_execution_preflight_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "src/economic/buy_void_ethereum_public_checkout_finality_gate_v1.ts"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_v2_candidate_v1.mjs"
      - "ops/security/buy-void-enforcement-final-v7-v2-candidate-v1.json"
      - "ops/security/buy-void-enforcement-final-v7-v2-lock-v1.json"
      - "scripts/prove_buy_void_enforcement_final_v7_v2_lock_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-v2-lock-v1.md"
      - "docs/architecture/buy-void-enforcement-final-v7-v2-candidate-v1.md"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v2.md"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_source_finality_execution_preflight_v1.ts"
      - "src/economic/buy_void_source_finality_generation_provenance_v7.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v1.ts"
      - "src/economic/buy_void_source_finality_live_process_binding_v2.ts"
      - "src/economic/buy_void_source_finality_provider_pair_binding_v1.ts"
      - "src/economic/buy_void_ethereum_public_checkout_finality_gate_v1.ts"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_artifact_census_v2.mjs"
      - "scripts/prove_buy_void_enforcement_final_v7_v2_candidate_v1.mjs"
      - "ops/security/buy-void-enforcement-final-v7-v2-candidate-v1.json"
      - "ops/security/buy-void-enforcement-final-v7-v2-lock-v1.json"
      - "scripts/prove_buy_void_enforcement_final_v7_v2_lock_v1.mjs"
      - "docs/architecture/buy-void-enforcement-final-v7-v2-lock-v1.md"
      - "docs/architecture/buy-void-enforcement-final-v7-v2-candidate-v1.md"
      - "docs/architecture/buy-void-enforcement-final-v7-artifact-census-v2.md"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: read

jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build exact candidate
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Derive non-authoritative V7 executable delta
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs
          receipt="$RUNNER_TEMP/v7-executable-delta-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(
            value.marker,
            "VOID_BUY_VOID_SOURCE_FINALITY_V7_EXECUTABLE_DELTA_CANDIDATE_V1",
          );
          assert.equal(value.module_count,6);
          assert.equal(value.modules.length,6);
          assert.equal(value.predecessor_enforcement_lock.historical_identity_preserved,true);
          assert.equal(value.cross_node_byte_identity_required,true);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.deployed_artifact_generation_verified,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.public_presale_activation,false);
          assert.equal(value.funds_movement,false);
          assert.match(value.source_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.artifact_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.candidate_generation_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_NODE_GREEN");
          NODE

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/v7-executable-delta-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require Node 22 24 26 byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/v7-executable-delta-node-$node.json"
          done
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-24.json
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(
            fs.readFileSync("receipts/v7-executable-delta-node-22.json","utf8"),
          );
          assert.equal(value.module_count,6);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.funds_movement,false);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_generation_sha256="+value.candidate_generation_sha256);
          console.log("artifact_inventory_sha256="+value.artifact_inventory_sha256);
          NODE

  final-v7-enforcement-census-v2:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact final-V7 V2 census head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build exact V2 generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Derive fresh 28-member whole-enforcement census
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_v7_artifact_census_v2.mjs
          out="$RUNNER_TEMP/final-v7-v2-census-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_v7_artifact_census_v2.mjs > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_V7_ARTIFACT_CENSUS_V2");
          assert.equal(c.version,2);
          assert.equal(c.source_parent,"82aee920f26b45c7e43bcc9f9e1023a175e2783a");
          assert.equal(c.repository_head_sha,process.env.EXPECTED_HEAD);
          assert.equal(c.artifact_count,28);
          assert.equal(c.source_file_count,28);
          assert.ok(c.artifacts.some(x=>x.path==="dist/economic/buy_void_source_finality_live_process_binding_v2.js"));
          assert.ok(c.sources.some(x=>x.path==="src/economic/buy_void_source_finality_live_process_binding_v2.ts"));
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.census_id,/^voidbefv7c2_[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_FINAL_V7_V2_ENFORCEMENT_CENSUS_NODE_GREEN");
          NODE
      - name: Upload fresh final-V7 V2 census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-v7-v2-enforcement-census-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-v7-v2-census-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  final-v7-enforcement-census-v2-cross-node:
    needs: [final-v7-enforcement-census-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major V2 census evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-v7-v2-enforcement-census-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census
      - name: Require exact Node 22 24 26 census equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "census/final-v7-v2-census-$node.json"; done
          cmp census/final-v7-v2-census-22.json census/final-v7-v2-census-24.json
          cmp census/final-v7-v2-census-22.json census/final-v7-v2-census-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("census/final-v7-v2-census-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.artifact_count,28);
          assert.equal(c.source_file_count,28);
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_V7_V2_ENFORCEMENT_CENSUS_CROSS_NODE_GREEN");
          console.log("census_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("census_id="+c.census_id);
          console.log("artifact_inventory_sha256="+crypto.createHash("sha256").update(Buffer.from(JSON.stringify(c.artifacts))).digest("hex"));
          console.log("source_inventory_sha256="+crypto.createHash("sha256").update(Buffer.from(JSON.stringify(c.sources))).digest("hex"));
          NODE

  final-v7-v2-enforcement-candidate:
    needs: [final-v7-enforcement-census-v2-cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact V2 candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build exact candidate generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Derive fresh unaccepted 28-member enforcement candidate
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_final_v7_v2_candidate_v1.mjs
          node scripts/prove_buy_void_enforcement_final_v7_v2_candidate_v1.mjs --self-test
          out="$RUNNER_TEMP/final-v7-v2-candidate-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_final_v7_v2_candidate_v1.mjs --derive > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_final_v7_v2_candidate_v1");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_FINAL_V7_V2_CANDIDATE_V1");
          assert.equal(c.version,1);
          assert.equal(c.source_parent,"82aee920f26b45c7e43bcc9f9e1023a175e2783a");
          assert.equal(c.hosted_census_evidence.census_id,
            "voidbefv7c2_2dddb68128ce0baff4a848568fac7651c025cc97956cdf1b3d6faff6a9ae075a");
          assert.equal(c.hosted_census_evidence.artifact_inventory_sha256,
            "e7fe07c5e9e5386d6dd4e95132b6d2551426d9b62fabd9257f43f2e271cdfd8f");
          assert.equal(c.hosted_census_evidence.source_inventory_sha256,
            "ceaaf5cd9faf3b9176cfd02f1fabf455212391f24df1040707ba487a7ebb96a3");
          assert.equal(c.current_inventory_evidence.hosted_json_artifact_inventory_sha256,
            c.hosted_census_evidence.artifact_inventory_sha256);
          assert.equal(c.current_inventory_evidence.hosted_json_source_inventory_sha256,
            c.hosted_census_evidence.source_inventory_sha256);
          assert.equal(c.current_inventory_evidence.canonical_artifact_inventory_sha256,
            "8d186c88bad544fdbdcbc928cce3883c83d9be194ae57f2e00ff1cf84e705496");
          assert.equal(c.current_inventory_evidence.canonical_source_inventory_sha256,
            "9036b38b760d34a586aa8fb44f86e85b6120fbf941b1b487069c90bd1739948b");
          assert.equal(c.hosted_census_evidence.artifact_count,28);
          assert.equal(c.hosted_census_evidence.source_file_count,28);
          assert.equal(c.v7_executable_delta.module_count,6);
          assert.equal(c.v7_executable_delta.candidate_generation_sha256,
            "cfac0b510932203623a4b9a0c09ad9c6639efdb04b0e5f1ff9feba15175f9311");
          assert.equal(c.live_process_v2_static_execution_closure_verified,true);
          assert.equal(c.live_process_v2_static_edge.dynamic_import_count,0);
          assert.equal(c.live_process_v2_static_edge.function_constructor_count,0);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.candidate_enforcement_set_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_FINAL_V7_V2_ENFORCEMENT_CANDIDATE_NODE_GREEN");
          NODE
      - name: Upload V2 candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-v7-v2-enforcement-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/final-v7-v2-candidate-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  final-v7-v2-enforcement-candidate-cross-node:
    needs: [final-v7-v2-enforcement-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-v7-v2-enforcement-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate
      - name: Require exact Node 22 24 26 candidate equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate/final-v7-v2-candidate-$node.json"; done
          cmp candidate/final-v7-v2-candidate-22.json candidate/final-v7-v2-candidate-24.json
          cmp candidate/final-v7-v2-candidate-22.json candidate/final-v7-v2-candidate-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("candidate/final-v7-v2-candidate-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.live_process_v2_static_execution_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_FINAL_V7_V2_ENFORCEMENT_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          NODE

  final-v7-v2-enforcement-lock:
    needs: [final-v7-v2-enforcement-candidate-cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact lock head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Download exact same-run V2 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-v7-v2-enforcement-candidate-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate
      - name: Bind committed candidate and derive exact lock
        run: |
          set -euo pipefail
          cmp "candidate/final-v7-v2-candidate-${{ matrix.node }}.json"             "ops/security/buy-void-enforcement-final-v7-v2-candidate-v1.json"
          node --check scripts/prove_buy_void_enforcement_final_v7_v2_lock_v1.mjs
          node scripts/prove_buy_void_enforcement_final_v7_v2_lock_v1.mjs --self-test |
            tee "lock-${{ matrix.node }}.txt"
          node scripts/prove_buy_void_enforcement_final_v7_v2_lock_v1.mjs --derive             > "lock-${{ matrix.node }}.json"
          cmp "lock-${{ matrix.node }}.json"             "ops/security/buy-void-enforcement-final-v7-v2-lock-v1.json"
          grep -Fx 'candidate_enforcement_identity_accepted=true' "lock-${{ matrix.node }}.txt"
          grep -Fx 'production_source_finality_authority_ready=false' "lock-${{ matrix.node }}.txt"
          grep -Fx 'public_presale_activation=false' "lock-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' "lock-${{ matrix.node }}.txt"
      - name: Upload exact lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-final-v7-v2-enforcement-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            lock-${{ matrix.node }}.json
            lock-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 7

  final-v7-v2-enforcement-lock-cross-node:
    needs: [final-v7-v2-enforcement-lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major lock evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-final-v7-v2-enforcement-lock-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: lock
      - name: Require exact Node 22 24 26 lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "lock/lock-$node.json"
            test -s "lock/lock-$node.txt"
          done
          cmp lock/lock-22.json lock/lock-24.json
          cmp lock/lock-22.json lock/lock-26.json
          cmp lock/lock-22.txt lock/lock-24.txt
          cmp lock/lock-22.txt lock/lock-26.txt
          sha256sum lock/lock-22.json
          echo "VOID_BUY_VOID_ENFORCEMENT_FINAL_V7_V2_LOCK_CROSS_NODE_GREEN"
