permissions:
  contents: read

jobs:
  derive:
    name: derive / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build exact candidate
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Derive non-authoritative V7 executable delta
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs
          receipt="$RUNNER_TEMP/v7-executable-delta-node-${{ matrix.node }}.json"
          node scripts/prove_buy_void_source_finality_v7_executable_delta_candidate_v1.mjs > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(
            value.marker,
            "VOID_BUY_VOID_SOURCE_FINALITY_V7_EXECUTABLE_DELTA_CANDIDATE_V1",
          );
          assert.equal(value.module_count,5);
          assert.equal(value.modules.length,5);
          assert.equal(value.predecessor_enforcement_lock.historical_identity_preserved,true);
          assert.equal(value.cross_node_byte_identity_required,true);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.deployed_artifact_generation_verified,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.public_presale_activation,false);
          assert.equal(value.funds_movement,false);
          assert.match(value.source_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.artifact_inventory_sha256,/^[0-9a-f]{64}$/u);
          assert.match(value.candidate_generation_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_NODE_GREEN");
          NODE

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/v7-executable-delta-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [derive]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-v7-executable-delta-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require Node 22 24 26 byte identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/v7-executable-delta-node-$node.json"
          done
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-24.json
          cmp receipts/v7-executable-delta-node-22.json receipts/v7-executable-delta-node-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const value=JSON.parse(
            fs.readFileSync("receipts/v7-executable-delta-node-22.json","utf8"),
          );
          assert.equal(value.module_count,5);
          assert.equal(value.candidate_only,true);
          assert.equal(value.complete_executable_closure_verified,false);
          assert.equal(value.candidate_enforcement_identity_accepted,false);
          assert.equal(value.production_source_finality_authority_ready,false);
          assert.equal(value.funds_movement,false);
          console.log("VOID_BUY_VOID_V7_EXECUTABLE_DELTA_CANDIDATE_CROSS_NODE_GREEN");
          console.log("candidate_generation_sha256="+value.candidate_generation_sha256);
          console.log("artifact_inventory_sha256="+value.artifact_inventory_sha256);
          NODE

  enforcement-candidate:
    needs: [cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build exact current generation
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Reprove exact 27-artifact census
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs
          node scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs > "$RUNNER_TEMP/census-${{ matrix.node }}.json"
          node --input-type=module - "$RUNNER_TEMP/census-${{ matrix.node }}.json" <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const canonical=(v)=>{
            if(v===null||typeof v==="boolean"||typeof v==="string")return JSON.stringify(v);
            if(typeof v==="number"){assert.ok(Number.isSafeInteger(v));return String(v);}
            if(Array.isArray(v))return "["+v.map(canonical).join(",")+"]";
            assert.ok(v&&typeof v==="object"&&!Array.isArray(v));
            return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canonical(v[k])).join(",")+"}";
          };
          const sha256=(v)=>crypto.createHash("sha256").update(Buffer.from(canonical(v),"utf8")).digest("hex");
          assert.equal(c.repository_head_sha,process.env.EXPECTED_HEAD);
          assert.equal(c.source_parent,"ccb4546cf841ce1a43a13339272e4d07c90f7cc0");
          assert.match(c.census_id,/^voidbe2933c1_[0-9a-f]{64}$/u);
          assert.equal(c.artifact_count,27);
          assert.equal(c.source_file_count,27);
          assert.match(sha256(c.artifacts),/^[0-9a-f]{64}$/u);
          assert.match(sha256(c.sources),/^[0-9a-f]{64}$/u);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          NODE

      - name: Upload exact 27-artifact census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-post2933-census-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/census-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Confirm stale candidate refuses the new census generation
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs
          if node scripts/prove_buy_void_enforcement_post2933_candidate_v1.mjs --derive \
              > "$RUNNER_TEMP/stale-candidate.txt" 2>&1; then
            echo "UNEXPECTED_STALE_CANDIDATE_ACCEPTANCE" >&2
            exit 1
          fi
          grep -E 'census|artifact|source|candidate|mismatch|expected' "$RUNNER_TEMP/stale-candidate.txt" >/dev/null
          echo "STALE_POST2933_CANDIDATE_REFUSES_RECURSION_FREE_V7=true"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  enforcement-census-cross-node:
    needs: [enforcement-candidate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major census evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-post2933-census-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: census
      - name: Require exact Node 22 24 26 census equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "census/census-$node.json"; done
          cmp census/census-22.json census/census-24.json
          cmp census/census-22.json census/census-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("census/census-22.json","utf8"));
          const canonical=(v)=>{
            if(v===null||typeof v==="boolean"||typeof v==="string")return JSON.stringify(v);
            if(typeof v==="number"){assert.ok(Number.isSafeInteger(v));return String(v);}
            if(Array.isArray(v))return "["+v.map(canonical).join(",")+"]";
            assert.ok(v&&typeof v==="object"&&!Array.isArray(v));
            return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canonical(v[k])).join(",")+"}";
          };
          const hash=(v)=>crypto.createHash("sha256").update(Buffer.from(canonical(v),"utf8")).digest("hex");
          assert.equal(c.source_parent,"ccb4546cf841ce1a43a13339272e4d07c90f7cc0");
          assert.equal(c.artifact_count,27);
          assert.equal(c.source_file_count,27);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          console.log("VOID_BUY_VOID_RECURSION_FREE_V7_CENSUS_CROSS_NODE_GREEN");
          console.log("census_id="+c.census_id);
          console.log("artifact_inventory_sha256="+hash(c.artifacts));
          console.log("source_inventory_sha256="+hash(c.sources));
          NODE

  enforcement-candidate-v2:
    needs: [enforcement-census-cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate-v2 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build exact current generation
        run: |
          set -euo pipefail
          npm run typecheck
          node ./node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Derive fresh unaccepted enforcement candidate v2
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_enforcement_post2933_candidate_v2.mjs
          node scripts/prove_buy_void_enforcement_post2933_candidate_v2.mjs --self-test
          out="$RUNNER_TEMP/enforcement-post2933-v2-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_post2933_candidate_v2.mjs --derive > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.schema,"void_buy_void_enforcement_post2933_candidate_v2");
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_POST2933_CANDIDATE_V2");
          assert.equal(c.version,2);
          assert.equal(c.source_parent,"ccb4546cf841ce1a43a13339272e4d07c90f7cc0");
          assert.equal(c.hosted_census_evidence.census_id,
            "voidbe2933c1_b37b0e86035a3dd1ccf09821445069ea0de1626be4763c9d19d2975645a93539");
          assert.equal(c.v7_executable_delta.candidate_generation_sha256,
            "17e70d5f6fe47f7eda87aabfa79ead574ecadeec4eb44470b774f020c997006e");
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.deployed_artifact_generation_verified,false);
          assert.equal(c.runtime_mount_authority,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.candidate_enforcement_set_sha256,/^[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2933_CANDIDATE_V2_NODE_GREEN");
          NODE
      - name: Upload candidate-v2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-post2933-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/enforcement-post2933-v2-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

  enforcement-candidate-v2-cross-node:
    needs: [enforcement-candidate-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major candidate-v2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-post2933-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate-v2
      - name: Require exact Node 22 24 26 candidate equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do test -s "candidate-v2/enforcement-post2933-v2-$node.json"; done
          cmp candidate-v2/enforcement-post2933-v2-22.json candidate-v2/enforcement-post2933-v2-24.json
          cmp candidate-v2/enforcement-post2933-v2-22.json candidate-v2/enforcement-post2933-v2-26.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          const bytes=fs.readFileSync("candidate-v2/enforcement-post2933-v2-22.json");
          const c=JSON.parse(bytes);
          assert.equal(c.complete_executable_closure_verified,true);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2933_CANDIDATE_V2_CROSS_NODE_GREEN");
          console.log("candidate_json_sha256="+crypto.createHash("sha256").update(bytes).digest("hex"));
          console.log("candidate_enforcement_set_sha256="+c.candidate_enforcement_set_sha256);
          NODE

  enforcement-lock-v2:
    needs: [enforcement-candidate-v2-cross-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact lock head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Download exact same-run V2 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-post2933-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: candidate-v2
      - name: Bind committed evidence and derive exact lock
        run: |
          set -euo pipefail
          cmp "candidate-v2/enforcement-post2933-v2-${{ matrix.node }}.json" "ops/security/buy-void-enforcement-post2933-candidate-v2.json"
          node --check "scripts/prove_buy_void_enforcement_post2933_lock_v2.mjs"
          node "scripts/prove_buy_void_enforcement_post2933_lock_v2.mjs" --self-test | tee "lock-v2-${{ matrix.node }}.txt"
          node "scripts/prove_buy_void_enforcement_post2933_lock_v2.mjs" --derive > "lock-v2-${{ matrix.node }}.json"
          cmp "lock-v2-${{ matrix.node }}.json" "ops/security/buy-void-enforcement-post2933-lock-v2.json"
          grep -Fx 'candidate_enforcement_identity_accepted=true' "lock-v2-${{ matrix.node }}.txt"
          grep -Fx 'production_source_finality_authority_ready=false' "lock-v2-${{ matrix.node }}.txt"
          grep -Fx 'public_presale_activation=false' "lock-v2-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' "lock-v2-${{ matrix.node }}.txt"
      - name: Upload exact lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-enforcement-post2933-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            lock-v2-${{ matrix.node }}.json
            lock-v2-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 7

  enforcement-lock-v2-cross-node:
    needs: [enforcement-lock-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download Node-major lock evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-enforcement-post2933-lock-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: lock-v2
      - name: Require exact Node 22 24 26 lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "lock-v2/lock-v2-$node.json"
            test -s "lock-v2/lock-v2-$node.txt"
          done
          cmp lock-v2/lock-v2-22.json lock-v2/lock-v2-24.json
          cmp lock-v2/lock-v2-22.json lock-v2/lock-v2-26.json
          cmp lock-v2/lock-v2-22.txt lock-v2/lock-v2-24.txt
          cmp lock-v2/lock-v2-22.txt lock-v2/lock-v2-26.txt
          sha256sum lock-v2/lock-v2-22.json
          echo "VOID_BUY_VOID_ENFORCEMENT_POST2933_LOCK_V2_CROSS_NODE_GREEN"

