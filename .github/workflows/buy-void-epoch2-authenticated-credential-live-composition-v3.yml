name: Buy VOID Epoch-2 V3R authenticated live composition v3

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-composition-v3.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-composition-v3.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-live-composition-v3.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-live-composition-v3.yml"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact reviewed generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" =             "78ce64b2e8c629f8688f675ad9aa9c2114683576"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs)" =             "e14b17279ea6bb7bf7949a39da9b4b83af867a53"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v3r.py)" =             "70b74ff2f09f5aef86eec39b8f643d8f2ebb63f5"
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" =             "14cbe81e27d04fee77cbe75225ce308bf8561a7b"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check             ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs
          node --check             scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs

      - name: Run V3 source self-test
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-self.log"
          node             ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs             --self-test | tee "$out"
          grep -Fx             'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_LIVE_COMPOSITION_V3_SELF_TEST_GREEN'             "$out"
          grep -Fx 'transaction=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Prove exact V3 source contract
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-proof.log"
          node             scripts/prove_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_LIVE_COMPOSITION_V3_PROOF_GREEN"
            "v3r_credential_qualifier_bound=true"
            "complete_dropin_set_hash_bound=true"
            "complete_credential_set_hash_bound=true"
            "exact_qualification_shape_required=true"
            "v3_fixed_native_preentry_path_separate=true"
            "v3_native_preentry_accepted_by_this_pr=false"
            "v3_native_preentry_install_authorized=false"
            "live_execution_authorized=false"
            "future_native_parent_proof_required=true"
            "runner_parent_credential_content_access=false"
            "sealed_child_nontransaction_signing_only=true"
            "transaction=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove inert V3 plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-plan.log"
          node             ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v3.mjs             --plan | tee "$out"
          markers=(
            "mode=plan"
            "source_generation=v3r_credential_composition"
            "protected_native_entry_accepted_by_this_pr=false"
            "protected_native_entry_install_authorized=false"
            "live_execution_authorized=false"
            "future_v3_native_preentry_required_for_live=true"
            "credential_v3r_v6_qualification_required=true"
            "complete_dropin_set_hash_binding_required=true"
            "complete_credential_set_hash_binding_required=true"
            "credential_content_access=false"
            "private_key_access=false"
            "nontransaction_signature=false"
            "transaction=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "funds_movement=false"
            "production_host_evidence_authority=false"
            "next_action=DERIVE_AND_ACCEPT_EPOCH2_LIVE_COMPOSITION_V3_NATIVE_PREENTRY"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
