name: datanet-pack-short-read-fail-closed-v1

on:
  pull_request:
    paths:
      - "src/datanet/pack.ts"
      - "scripts/prove_datanet_pack_short_read_fail_closed_v1.mjs"
      - ".github/workflows/datanet-pack-short-read-fail-closed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prove_datanet_pack_short_read_fail_closed_v1.mjs
      - run: npm run typecheck -- --pretty false
      - run: git diff --check
