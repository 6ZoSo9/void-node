name: datanet-pack-short-read-fail-closed-v1

on:
  pull_request:
    paths:
      - "src/datanet/pack.ts"
      - "src/voidctl/index.ts"
      - "scripts/prove_datanet_pack_short_read_fail_closed_v1.mjs"
      - ".github/workflows/datanet-pack-short-read-fail-closed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without stored Git credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/prove_datanet_pack_short_read_fail_closed_v1.mjs
      - run: npm run typecheck -- --pretty false
      - run: git diff --check
