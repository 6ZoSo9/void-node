name: Buy VOID terminal closeout transport one-shot v1

on:
  push:
    branches:
      - fix/buy-void-postmerge-terminal-closeout-hardening-v1-20260809
    paths:
      - ".github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml"

permissions:
  contents: write

concurrency:
  group: buy-void-terminal-closeout-transport-one-shot-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify exact child and parent authority
        shell: bash
        env:
          EXPECTED_OLD_CHILD: fb5f1ce00361e5f5b9f2b991d005977fd985df1d
          EXPECTED_PARENT: 3ec97675449b76383557d2e5a198b91fc4e6b7e3
          CHILD_BRANCH: fix/buy-void-postmerge-terminal-closeout-hardening-v1-20260809
          PARENT_BRANCH: fix/buy-void-terminal-closeout-plan-binding-v1-20260809
          SELF: .github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_OLD_CHILD"
          test "$(git diff --name-only HEAD^..HEAD)" = "$SELF"

          live_child="$(git ls-remote origin "refs/heads/$CHILD_BRANCH" | awk '{print $1}')"
          live_parent="$(git ls-remote origin "refs/heads/$PARENT_BRANCH" | awk '{print $1}')"
          echo "trigger_head=$GITHUB_SHA"
          echo "live_child=$live_child"
          echo "expected_parent=$EXPECTED_PARENT"
          echo "live_parent=$live_parent"
          test "$live_child" = "$GITHUB_SHA"
          test "$live_parent" = "$EXPECTED_PARENT"

          git fetch --no-tags origin "$PARENT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff "$EXPECTED_PARENT" -m "Merge exact terminal plan-binding parent"
          test -z "$(git status --porcelain)"

      - name: Apply deterministic terminal transport hardening
        run: python3 scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py

      - name: Verify exact semantic working scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            > /tmp/expected-semantic.txt
          git diff --name-only | sort > /tmp/actual-semantic.txt
          diff -u /tmp/expected-semantic.txt /tmp/actual-semantic.txt
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts

      - name: Prove terminal closeout hardening wall
        shell: bash
        run: |
          set -euo pipefail
          for proof in \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_reducer_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_runtime_reducer_v1.ts \
            scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts \
            scripts/prove_buy_void_confirmed_closeout_v1.ts \
            scripts/prove_buy_void_crash_consistent_saga_server_policy_v1.ts \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts \
            scripts/prove_buy_void_saga_broadcast_reconciliation_runtime_v1.ts \
            scripts/prove_buy_void_runtime_integration_v1.ts \
            scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts
          do
            echo "proof=$proof"
            npx --no-install tsx "$proof"
          done

      - name: Typecheck and build repository
        run: |
          npm run typecheck
          npm run build

      - name: Commit semantic delta and retire all carriers
        shell: bash
        env:
          EXPECTED_PARENT: 3ec97675449b76383557d2e5a198b91fc4e6b7e3
          OLD_WORKFLOW: .github/workflows/buy-void-postmerge-terminal-closeout-hardening-pr-bootstrap-v1.yml
          PATCH: scripts/patch_buy_void_postmerge_terminal_closeout_hardening_v1.py
          SELF: .github/workflows/buy-void-terminal-closeout-transport-one-shot-v1.yml
        run: |
          set -euo pipefail
          git add -- \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' scripts/buy_void_production_terminal_closeout_operator_v1.ts scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts | sort)"
          git commit -m "fix: harden Buy VOID terminal closeout transport boundary"

          git rm -- "$OLD_WORKFLOW" "$PATCH" "$SELF"
          git commit -m "chore: retire terminal closeout transport publication carriers"

          expected="$(printf '%s\n' \
            scripts/buy_void_production_terminal_closeout_operator_v1.ts \
            scripts/prove_buy_void_production_terminal_closeout_operator_v1.ts | sort)"
          actual="$(git diff --name-only "$EXPECTED_PARENT...HEAD" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "HOLD: final child semantic scope mismatch"
            echo "--- expected ---"
            printf '%s\n' "$expected"
            echo "--- actual ---"
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check "$EXPECTED_PARENT...HEAD"

      - name: Guard live refs and publish non-force
        shell: bash
        env:
          EXPECTED_PARENT: 3ec97675449b76383557d2e5a198b91fc4e6b7e3
          CHILD_BRANCH: fix/buy-void-postmerge-terminal-closeout-hardening-v1-20260809
          PARENT_BRANCH: fix/buy-void-terminal-closeout-plan-binding-v1-20260809
        run: |
          set -euo pipefail
          live_parent="$(git ls-remote origin "refs/heads/$PARENT_BRANCH" | awk '{print $1}')"
          live_child="$(git ls-remote origin "refs/heads/$CHILD_BRANCH" | awk '{print $1}')"
          echo "live_parent_before_push=$live_parent"
          echo "live_child_before_push=$live_child"
          test "$live_parent" = "$EXPECTED_PARENT"
          test "$live_child" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$CHILD_BRANCH"
          echo "VOID_BUY_VOID_TERMINAL_CLOSEOUT_TRANSPORT_ONE_SHOT_V1_GREEN"
          echo "live_terminal_closeout_performed=false"
          echo "inventory_consumption_performed=false"
          echo "public_fulfillment_mutation_performed=false"
          echo "saga_mutation_performed=false"
          echo "credential_access_performed=false"
          echo "signing_performed=false"
          echo "transaction_broadcast_performed=false"
          echo "money_movement_performed=false"
