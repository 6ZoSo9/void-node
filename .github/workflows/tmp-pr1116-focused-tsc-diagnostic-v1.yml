name: VOID PR1116 focused TypeScript diagnostic v1

on:
  pull_request:
    paths:
      - .github/workflows/tmp-pr1116-focused-tsc-diagnostic-v1.yml
  push:
    branches:
      - feat/buy-void-production-preflight-operator-entrypoint-v1-20260808
    paths:
      - .github/workflows/tmp-pr1116-focused-tsc-diagnostic-v1.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture focused TypeScript compiler output
        id: compile
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_production_preflight_operator_v1.ts \
            scripts/prove_buy_void_production_preflight_operator_v1.ts \
            scripts/prove_buy_void_production_live_canary_preflight_v1.ts \
            > pr1116-focused-tsc.log 2>&1
          status=$?
          printf '%s\n' "$status" > pr1116-focused-tsc.exit
          cat pr1116-focused-tsc.log
          exit 0
      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1116-focused-tsc-diagnostic
          path: |
            pr1116-focused-tsc.log
            pr1116-focused-tsc.exit
          if-no-files-found: error
          retention-days: 1
      - name: Preserve compiler result
        shell: bash
        run: |
          status="$(cat pr1116-focused-tsc.exit)"
          test "$status" = "0"
