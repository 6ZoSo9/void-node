name: VOID credentialed external paid-work readiness v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-agent-paid-work-credentialed-external-readiness-v1.yml"
      - "tools/void-agent-paid-work-credentialed-external-readiness-v1.mjs"
      - "scripts/prove_void_agent_paid_work_credentialed_external_readiness_v1.mjs"
      - "docs/operators/agent-paid-work-credentialed-external-readiness-v1.md"
      - "scripts/agent_paid_work_credential_request_gateway_v1.ts"
      - "scripts/agent_paid_work_credential_request_review_queue_v1.ts"
      - "scripts/agent_paid_work_credential_lifecycle_cli_v1.ts"
      - "scripts/agent_paid_work_credential_wc_account_binding_lifecycle_v1.mjs"
      - "scripts/agent_paid_work_credential_registry_v1.ts"
      - "scripts/agent_paid_work_submission_receiver_v1.ts"
      - "ops/void-ai-agent-public-gateway-v1.mjs"
      - "src/economic/agent_paid_work_wc_earning_adapter_v1.ts"
      - "tools/void-wc-void-opening-participant-provenance-eligibility-v1.mjs"
      - "docs/public/agent-paid-work-public-discovery-v1.json"
      - "public/agent-paid-work/credential-request/v1/manifest-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-credentialed-external-paid-work-readiness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove credentialed external readiness census
        run: node scripts/prove_void_agent_paid_work_credentialed_external_readiness_v1.mjs
      - name: Diff hygiene
        run: git diff --check
