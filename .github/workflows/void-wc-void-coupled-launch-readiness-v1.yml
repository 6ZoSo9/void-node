name: VOID WC/VOID coupled launch readiness v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-coupled-launch-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_readiness_v1.mjs"
      - "docs/operators/wc-void-coupled-launch-readiness-v1.md"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - ".github/workflows/void-wc-void-coupled-launch-readiness-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/void-wc-void-coupled-launch-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_launch_readiness_v1.mjs"
      - "docs/operators/wc-void-coupled-launch-readiness-v1.md"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "tools/void-coupled-economic-successor-gate-v1.mjs"
      - "tools/void-economic-evm-successor-migration-v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - ".github/workflows/void-wc-void-coupled-launch-readiness-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-wc-void-coupled-launch-readiness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove canonical component classifiers
        run: |
          set -euo pipefail
          node scripts/prove_void_wc_void_production_readiness_v1.mjs
          node scripts/prove_void_coupled_economic_successor_gate_v1.mjs

      - name: Prove coupled launch composition
        run: |
          set -euo pipefail
          node --check tools/void-wc-void-coupled-launch-readiness-v1.mjs
          node --check scripts/prove_void_wc_void_coupled_launch_readiness_v1.mjs
          node scripts/prove_void_wc_void_coupled_launch_readiness_v1.mjs

      - name: Diff hygiene
        run: git diff --check
