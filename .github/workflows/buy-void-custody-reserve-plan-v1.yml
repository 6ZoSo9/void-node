name: VOID Buy VOID custody reserve source plan v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_custody_reserve_plan_v1.mjs"
      - "scripts/prove_buy_void_custody_reserve_plan_v1.mjs"
      - ".github/workflows/buy-void-custody-reserve-plan-v1.yml"
      - "docs/architecture/buy-void-custody-reserve-plan-v1.md"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "src/economic/buy_void_custody_launch_authority_v2.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-custody-reserve-plan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Set up reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build reviewed compiled dependencies
        run: npm run build

      - name: Syntax-check source-only reserve planner
        run: |
          set -euo pipefail
          node --check src/economic/buy_void_custody_reserve_plan_v1.mjs
          node --check scripts/prove_buy_void_custody_reserve_plan_v1.mjs

      - name: Prove custody-side reserve plan remains source-only
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_custody_reserve_plan_v1.mjs \
            | tee "custody-reserve-plan-node-${{ matrix.node }}.txt"
          for invariant in \
            'VOID_BUY_VOID_CUSTODY_RESERVE_PLAN_V1_PROOF_GREEN' \
            'exact_source_and_dependency_blobs_verified=true' \
            'durable_verified_payment_replay_semantics_reused=true' \
            'canonical_allocation_planner_reused=true' \
            'signed_launch_v2_classifier_called_by_production_entry=true' \
            'planned_then_idempotent_exact_ledger=true' \
            'request_launch_lineage_mismatch_held=true' \
            'prior_verified_allocation_gap_held=true' \
            'production_input_exact_plain_data=true' \
            'production_byte_inputs_detached=true' \
            'activation_receipt_size_bounded=true' \
            'proxy_and_accessor_execution_count=0' \
            'caller_green_flags_accepted=false' \
            'caller_clock_accepted=false' \
            'descriptor_bound_reads=false' \
            'filesystem_write=false' \
            'custody_reserve_method_enabled=false' \
            'production_allocation_mutation_ready=false' \
            'funds_moved=false'
          do
            grep -Fx "$invariant" "custody-reserve-plan-node-${{ matrix.node }}.txt"
          done

      - name: Upload exact-head proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-custody-reserve-plan-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: custody-reserve-plan-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Committed diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Node 22 24 26 receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-custody-reserve-plan-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./custody-reserve-plan-proofs

      - name: Require byte-identical cross-Node evidence
        run: |
          set -euo pipefail
          for version in 22 24 26; do
            test -s "custody-reserve-plan-proofs/custody-reserve-plan-node-$version.txt"
          done
          cmp custody-reserve-plan-proofs/custody-reserve-plan-node-22.txt custody-reserve-plan-proofs/custody-reserve-plan-node-24.txt
          cmp custody-reserve-plan-proofs/custody-reserve-plan-node-22.txt custody-reserve-plan-proofs/custody-reserve-plan-node-26.txt
          echo "VOID_BUY_VOID_CUSTODY_RESERVE_PLAN_CROSS_NODE_GREEN"
          echo "custody_reserve_method_enabled=false"
          echo "production_allocation_mutation_ready=false"
          echo "funds_moved=false"
