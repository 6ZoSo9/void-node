name: VOID economic epoch2 Besu raw transaction validator plugin v1

on:
  pull_request:
    paths:
      - "besu-plugins/epoch2-raw-transaction-domain-v1/**"
      - "ops/mainnet0/economic-epoch2-raw-transaction-domain-v1.json"
      - "ops/mainnet0/economic-epoch2-besu-raw-transaction-validator-plugin-v1.json"
      - "tools/void-economic-epoch2-raw-transaction-domain-v1.mjs"
      - "scripts/prove_void_economic_epoch2_raw_transaction_domain_v1.mjs"
      - "scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_plugin_v1.mjs"
      - "docs/architecture/economic-epoch2-raw-transaction-domain-v1.md"
      - "docs/operators/economic-epoch2-besu-raw-transaction-validator-plugin-v1.md"
      - ".github/workflows/void-economic-epoch2-besu-raw-transaction-validator-plugin-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove source bindings
        run: |
          node --check scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_plugin_v1.mjs
          node scripts/prove_void_economic_epoch2_besu_raw_transaction_validator_plugin_v1.mjs
          node scripts/prove_void_economic_epoch2_raw_transaction_domain_v1.mjs

      - name: Compile, test, and prove reproducible plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          pom="besu-plugins/epoch2-raw-transaction-domain-v1/pom.xml"
          jar_path="besu-plugins/epoch2-raw-transaction-domain-v1/target/void-epoch2-raw-transaction-domain-plugin-v1.jar"

          mvn -B -ntp -f "$pom" clean test package
          test -f "$jar_path"
          first_sha256="$(sha256sum "$jar_path" | awk '{print $1}')"
          cp "$jar_path" "$RUNNER_TEMP/void-epoch2-plugin-build-1.jar"

          mvn -B -ntp -f "$pom" clean test package
          test -f "$jar_path"
          second_sha256="$(sha256sum "$jar_path" | awk '{print $1}')"

          test "$first_sha256" = "$second_sha256"
          cmp "$RUNNER_TEMP/void-epoch2-plugin-build-1.jar" "$jar_path"

          echo "VOID_EPOCH2_BESU_PLUGIN_REPRODUCIBLE_BUILD_V1_GREEN"
          echo "plugin_jar_sha256=$second_sha256"
          echo "plugin_jar_reproducible_build=true"

      - name: Verify plugin JAR service registration
        shell: bash
        run: |
          set -euo pipefail
          jar_path="besu-plugins/epoch2-raw-transaction-domain-v1/target/void-epoch2-raw-transaction-domain-plugin-v1.jar"
          service_path="META-INF/services/org.hyperledger.besu.plugin.BesuPlugin"
          expected="org.voidnetwork.besu.epoch2.VoidEpoch2RawTransactionDomainPlugin"
          test -f "$jar_path"
          jar tf "$jar_path" | grep -Fx "$service_path"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          (
            cd "$tmp"
            jar xf "$GITHUB_WORKSPACE/$jar_path" "$service_path"
          )
          test "$(cat "$tmp/$service_path")" = "$expected"
          echo "besu_plugin_service_registration_verified=true"

      - name: Diff hygiene
        run: git diff --check
