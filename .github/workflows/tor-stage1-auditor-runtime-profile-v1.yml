name: Tor Stage 1 auditor runtime profile v1

on:
  pull_request:
    paths:
      - ".github/workflows/tor-stage1-auditor-runtime-profile-v1.yml"
      - "docs/operations/tor-stage1-auditor-runtime-profile-v1.md"
      - "scripts/prove_tor_stage1_auditor_runtime_profile_v1.mjs"
      - "tools/void_cross_chat_lane_audit_v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tor-stage1-auditor-runtime-profile-v1.yml"
      - "docs/operations/tor-stage1-auditor-runtime-profile-v1.md"
      - "scripts/prove_tor_stage1_auditor_runtime_profile_v1.mjs"
      - "tools/void_cross_chat_lane_audit_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check auditor syntax
        run: node --check tools/void_cross_chat_lane_audit_v1.mjs
      - name: Check proof syntax
        run: node --check scripts/prove_tor_stage1_auditor_runtime_profile_v1.mjs
      - name: Prove exact Stage 1 profile
        run: node scripts/prove_tor_stage1_auditor_runtime_profile_v1.mjs
