name: External Agent Paid-Work Fresh Canary Credential Live Transport Adapters V1

on:
  pull_request:
    paths:
      - '.github/workflows/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.yml'
      - 'docs/public-agent/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.md'
      - 'examples/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.example.json'
      - 'schemas/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.schema.json'
      - 'scripts/external_agent_paid_work_fresh_canary_credential_live_transport_adapters_v1.ts'
      - 'scripts/prove_external_agent_paid_work_fresh_canary_credential_live_transport_adapters_v1.ts'
  push:
    paths:
      - '.github/workflows/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.yml'
      - 'docs/public-agent/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.md'
      - 'examples/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.example.json'
      - 'schemas/external-agent-paid-work-fresh-canary-credential-live-transport-adapters-v1.schema.json'
      - 'scripts/external_agent_paid_work_fresh_canary_credential_live_transport_adapters_v1.ts'
      - 'scripts/prove_external_agent_paid_work_fresh_canary_credential_live_transport_adapters_v1.ts'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes tsx scripts/prove_external_agent_paid_work_fresh_canary_credential_live_transport_adapters_v1.ts
