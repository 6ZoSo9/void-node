name: Apollyon owner-key container metadata v1

on:
  pull_request:
    paths:
      - "scripts/apollyon_owner_key_container_metadata_v1.py"
      - "docs/security/apollyon-owner-key-container-metadata-v1.md"
      - ".github/workflows/apollyon-owner-key-container-metadata-v1.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/apollyon_owner_key_container_metadata_v1.py"
      - "docs/security/apollyon-owner-key-container-metadata-v1.md"
      - ".github/workflows/apollyon-owner-key-container-metadata-v1.yml"

permissions:
  contents: read

jobs:
  source-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run metadata-only self-test
        run: python3 -I -B scripts/apollyon_owner_key_container_metadata_v1.py --self-test
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$HEAD^"
          fi
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
