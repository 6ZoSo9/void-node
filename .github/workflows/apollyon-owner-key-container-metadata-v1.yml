name: Apollyon owner-key container metadata v1

on:
  pull_request:
    paths:
      - "scripts/apollyon_owner_key_container_metadata_v1.py"
      - "docs/security/apollyon-owner-key-container-metadata-v1.md"
      - ".github/workflows/apollyon-owner-key-container-metadata-v1.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/apollyon_owner_key_container_metadata_v1.py"
      - "docs/security/apollyon-owner-key-container-metadata-v1.md"
      - ".github/workflows/apollyon-owner-key-container-metadata-v1.yml"

permissions:
  contents: read

jobs:
  source-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run metadata-only self-test
        run: python3 -I -B scripts/apollyon_owner_key_container_metadata_v1.py --self-test
