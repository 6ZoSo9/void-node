name: VOID Buy authenticated credential unit query v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v1.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v1.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v1.yml"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v1.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v1.mjs"
      - "docs/operators/buy-void-user-manager-private-credential-unit-query-v1.md"
      - ".github/workflows/buy-void-user-manager-private-credential-unit-query-v1.yml"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: prove / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Compile and prove source-only authenticated query
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_user_manager_private_credential_unit_query_v1.mjs |
            tee "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_PRIVATE_CREDENTIAL_UNIT_QUERY_V1_PROOF_GREEN'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'accepted_v6_query_lock_bound=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'credential_effective_properties_same_authenticated_connection=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'bounded_dropin_set_observed=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'exactly_one_credential_dropin_match_required=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'unrelated_hardening_dropin_allowed=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'dropin_set_generation_stability_required=true'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'security_transcript_composed=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'credential_query_preexec_execution_path_proven=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'credential_contents_read=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'binary_acceptance=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'live_query_authorized=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'host_mutation=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'public_presale_activation=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"
          grep -Fx 'funds_movement=false'             "$RUNNER_TEMP/credential-unit-query-proof.log"

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          test -n "$merge_base"
          git diff --check "$merge_base" "$HEAD"
