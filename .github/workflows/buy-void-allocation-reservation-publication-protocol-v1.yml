name: VOID Buy VOID allocation publication protocol v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-allocation-reservation-publication-protocol-v1.yml"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_ledger_v1.ts"
      - "docs/architecture/buy-void-allocation-reservation-publication-protocol-v1.md"
      - "docs/architecture/buy-void-allocation-reservation-high-water-v1.md"
      - "docs/architecture/buy-void-allocation-reservation-ledger-contract-v1.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-allocation-reservation-publication-protocol-v1.yml"
      - "src/economic/buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_publication_protocol_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_reservation_ledger_v1.ts"
      - "docs/architecture/buy-void-allocation-reservation-publication-protocol-v1.md"
      - "docs/architecture/buy-void-allocation-reservation-high-water-v1.md"
      - "docs/architecture/buy-void-allocation-reservation-ledger-contract-v1.md"

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-publication-protocol-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: allocation publication / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove allocation publication protocol
        run: npx tsx scripts/prove_buy_void_allocation_reservation_publication_protocol_v1.ts

      - name: Preserve allocation high-water contract
        run: npx tsx scripts/prove_buy_void_allocation_reservation_high_water_v1.ts

      - name: Preserve parent allocation ledger contract
        run: npx tsx scripts/prove_buy_void_allocation_reservation_ledger_v1.ts

      - name: Verify source tree cleanliness
        run: test -z "$(git status --porcelain=v1)"

      - name: Diff hygiene
        run: git diff --check
