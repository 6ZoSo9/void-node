name: Buy VOID V2 protected source-generation successor (historical refusal under V3)

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs"
      - ".github/workflows/buy-void-verified-payment-v2-source-generation-acceptance-v1.yml"
      - ".github/workflows/buy-void-verified-payment-v3-fifo-composed-source-generation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-refusal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact historical V2 and current writer identities
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs)" = "796cad42e6413a1894eef8dc0466848377176645"
          test "$(git hash-object src/index.ts)" = "a09661797aa4295371c036be36d82995e5233269"
          test "$(git hash-object src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = "d1320be22fe55af24017b84f0655fbcde82dbee9"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build current composed source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Require immutable V2 refusal and historical V1 refusal
        run: |
          set -euo pipefail
          set +e
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test \
            > "$RUNNER_TEMP/v2.stdout" 2> "$RUNNER_TEMP/v2.stderr"
          v2_rc=$?
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs --self-test \
            > "$RUNNER_TEMP/v1.stdout" 2> "$RUNNER_TEMP/v1.stderr"
          v1_rc=$?
          set -e
          test "$v2_rc" -ne 0
          test "$v1_rc" -ne 0
          grep -Fq 'protected_blob_drift:src/index.ts' "$RUNNER_TEMP/v2.stderr"
          grep -Fq '123ec1792a027f93d4c9030749a0e7e136a75a44' "$RUNNER_TEMP/v2.stderr"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$RUNNER_TEMP/v2.stderr"
          grep -Fq 'protected_blob_drift:src/index.ts' "$RUNNER_TEMP/v1.stderr"
          grep -Fq '123ec1792a027f93d4c9030749a0e7e136a75a44' "$RUNNER_TEMP/v1.stderr"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$RUNNER_TEMP/v1.stderr"
          echo VOID_BUY_VOID_V2_SOURCE_SUCCESSOR_HISTORICAL_REFUSAL_GREEN
          echo predecessor_v2_source_acceptance_complete_for_current_generation=false
          echo predecessor_v2_refusal_reason=protected_range_router_drift
          echo fifo_writer_transition_independently_bound=true
          echo current_successor=v3
          echo verified_payment_v2_route_mounted=false
          echo payment_acceptance=false
          echo public_presale_activation=false
          echo funds_movement=false
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
