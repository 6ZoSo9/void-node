name: Buy VOID Epoch-2 V6R3 non-executing upgrade plan main integration

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
      - 'scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py'
      - 'docs/operators/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.md'
      - '.github/workflows/buy-void-epoch2-live-composition-runner-policy-upgrade-plan-v6r3.yml'
      - 'ops/security/buy-void-epoch2-live-composition-runner-policy-candidate-lock-v6r3.json'
      - 'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact workflow head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax
        run: |
          python3 -m py_compile \
            ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py \
            scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py
      - name: Planner self-test
        run: python3 -I -B ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py --self-test
      - name: Source-only plan
        run: python3 -I -B ops/precision/void_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py --source-plan
      - name: Exact planner proof
        run: python3 -I -B scripts/prove_buy_void_epoch2_live_composition_runner_policy_upgrade_plan_v6r3.py
      - name: Diff hygiene
        run: git diff --check
