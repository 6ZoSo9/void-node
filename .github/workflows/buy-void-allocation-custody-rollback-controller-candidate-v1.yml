name: Buy VOID allocation-custody rollback controller candidate v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-rollback-controller-candidate-v1.md"
      - ".github/workflows/buy-void-allocation-custody-rollback-controller-candidate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Bind exact source-only generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          STACK_PARENT=28ff80a88dc766994a92c941d1e41fe5e38bedaa
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$STACK_PARENT" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            'tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs' \
            'scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v1.mjs' \
            'docs/architecture/buy-void-allocation-custody-rollback-controller-candidate-v1.md' \
            '.github/workflows/buy-void-allocation-custody-rollback-controller-candidate-v1.yml' \
            | sort > "$expected"
          git diff --no-renames --name-only "$STACK_PARENT" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/security/buy-void-presale-custody-durability-rollback-challenge-plan-v1.json)" = 5face2022dc2cbc573e32e99f88623f381a8a174
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-live-durability-rollback-contract-v1.mjs)" = eef7c4e1db7401ba82fda96aa1e8da40c1981b7d
          test "$(git rev-parse HEAD:src/economic)" = 71c67e62a2b21a98f3f5135ee6aa56e0ef97d262
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-rollback-controller-candidate-v1.mjs)" = 269e5f716989269697c86bccbce0373762b8d1b3
          test "$(git rev-parse HEAD:scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v1.mjs)" = 98108a3e4043dcd105c16c645d3712cd8c3d6eaa
          test "$(git rev-parse HEAD:docs/architecture/buy-void-allocation-custody-rollback-controller-candidate-v1.md)" = 2d662eb261807a6426f61c7e9cfb923c27201410
          git diff --check "$STACK_PARENT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove controller candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/controller-node-${{ matrix.node }}.log"
          node scripts/prove_buy_void_allocation_custody_rollback_controller_candidate_v1.mjs | tee "$out"
          for marker in \
            'VOID_BUY_VOID_ALLOCATION_CUSTODY_ROLLBACK_CONTROLLER_CANDIDATE_V1_PROOF_GREEN' \
            'plan_id=voidbuycustodychallengeplan1_dd868e3fb6ebdbf894c1170d0ecc153d61e198d9c20279a05c3309957add9006' \
            'challenge_requirement_count=20' \
            'deterministic_controller_sequence=true' \
            'sequence_headroom_preflighted_before_mutation=true' \
            'policy_generation_u64_bounded=true' \
            'authorization_claim_once_required=true' \
            'same_authorization_replay_rejected_before_mutation=true' \
            'authorization_claim_bound_to_evidence_origin=true' \
            'authorization_claim_post_rollback_revalidation_required=true' \
            'authorization_claim_post_rollback_revalidated=true' \
            'authorization_claim_rollback_mutation_forbidden=true' \
            'claim_loss_during_rollback_rejected=true' \
            'challenge_plan_successor_required_before_host_adapter=true' \
            'operation_bound_authorization_authenticated=false' \
            'non_customer_canary_domain_bound=true' \
            'non_customer_canary_isolation_proven=false' \
            'expected_policy_record_matched=true' \
            'exact_current_policy_authenticated=false' \
            'challenge_entropy_capability_invoked=true' \
            'challenge_unpredictability_proven=false' \
            'second_control_precedes_rollback=true' \
            'protected_high_water_non_decrease_required=true' \
            'stale_journal_refusal_required=true' \
            'terminal_journal_predecessor_revalidation_required=true' \
            'durability_checkpoint_binding_stability_required=true' \
            'post_rollback_binding_stability_required=true' \
            'allocation_ledger_unchanged_required=true' \
            'customer_request_state_unchanged_required=true' \
            'evidence_origin_authentication_required=true' \
            'controller_evidence_digest_bound_to_origin=true' \
            'mismatched_evidence_origin_digest_rejected=true' \
            'evidence_origin_authenticated=false' \
            'injected_capabilities_authenticated=false' \
            'all_capabilities_preflighted_before_invocation=true' \
            'revoked_object_proxy_namespaced_rejection=true' \
            'revoked_array_proxy_namespaced_rejection=true' \
            'async_capability_body_not_invoked=true' \
            'proxy_capability_apply_trap_not_invoked=true' \
            'generator_capability_body_not_invoked=true' \
            'bound_async_capability_body_not_invoked=true' \
            'bound_generator_capability_body_not_invoked=true' \
            'then_getter_not_invoked=true' \
            'direct_host_filesystem_api_present=false' \
            'direct_process_api_present=false' \
            'direct_network_api_present=false' \
            'protected_host_adapter_required=true' \
            'host_execution_authorized=false' \
            'storage_mutation_authorized=false' \
            'rollback_test_authorized=false' \
            'payment_acceptance_authorized=false' \
            'public_presale_activation_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done
