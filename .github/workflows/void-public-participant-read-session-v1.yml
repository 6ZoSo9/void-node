name: VOID public participant read session v1

on:
  pull_request:
    paths:
      - "ops/public/void-public-participant-read-session-v1.mjs"
      - "scripts/prove_void_public_participant_read_session_v1.mjs"
      - "docs/public/void-public-participant-read-session-v1.md"
      - ".github/workflows/void-public-participant-read-session-v1.yml"

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check ops/public/void-public-participant-read-session-v1.mjs
      - run: node --check scripts/prove_void_public_participant_read_session_v1.mjs
      - run: node scripts/prove_void_public_participant_read_session_v1.mjs
