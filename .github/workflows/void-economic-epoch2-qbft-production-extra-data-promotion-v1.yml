name: VOID economic epoch2 QBFT production extraData promotion v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/economic-epoch2-qbft-production-extra-data-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-production-extra-data-promotion-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-topology-v1.json"
      - "tools/void-economic-epoch2-qbft-production-extra-data-bind-v1.mjs"
      - "tools/void-economic-epoch2-qbft-production-extra-data-preflight-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_production_extra_data_promotion_v1.mjs"
      - "docs/operators/economic-epoch2-qbft-production-extra-data-promotion-v1.md"
      - ".github/workflows/void-economic-epoch2-qbft-production-extra-data-promotion-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/mainnet0/economic-epoch2-qbft-production-extra-data-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-validator-binding-candidate-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-production-extra-data-promotion-v1.json"
      - "ops/mainnet0/economic-epoch2-qbft-topology-v1.json"
      - "tools/void-economic-epoch2-qbft-production-extra-data-bind-v1.mjs"
      - "tools/void-economic-epoch2-qbft-production-extra-data-preflight-v1.mjs"
      - "scripts/prove_void_economic_epoch2_qbft_production_extra_data_promotion_v1.mjs"
      - "docs/operators/economic-epoch2-qbft-production-extra-data-promotion-v1.md"
      - ".github/workflows/void-economic-epoch2-qbft-production-extra-data-promotion-v1.yml"

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-qbft-production-extra-data-promotion-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prove canonical three-validator extraData promotion
        run: |
          set -euo pipefail
          node --check scripts/prove_void_economic_epoch2_qbft_production_extra_data_promotion_v1.mjs
          node scripts/prove_void_economic_epoch2_qbft_production_extra_data_promotion_v1.mjs

      - name: Diff hygiene
        run: git diff --check
