name: VOID Buy VOID V2 selector ELF lock

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-candidate-v1.json"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_live_process_v2_selector_elf_lock_v1.mjs"
      - ".github/workflows/buy-void-source-finality-live-process-v2-selector-elf-lock-v1.yml"
      - "docs/operators/buy-void-source-finality-live-process-v2-selector-elf-lock-v1.md"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_source_finality_live_process_v2_selector_guard.c"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-candidate-v1.json"
      - "ops/security/buy-void-v7-live-process-v2-selector-elf-lock-v1.json"
      - "scripts/prove_buy_void_source_finality_live_process_v2_selector_elf_lock_v1.mjs"
      - ".github/workflows/buy-void-source-finality-live-process-v2-selector-elf-lock-v1.yml"
      - "docs/operators/buy-void-source-finality-live-process-v2-selector-elf-lock-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Reproduce and verify accepted ELF
        run: |
          set -euo pipefail
          node --check scripts/prove_buy_void_source_finality_live_process_v2_selector_elf_lock_v1.mjs
          node scripts/prove_buy_void_source_finality_live_process_v2_selector_elf_lock_v1.mjs |
            tee "$RUNNER_TEMP/selector-elf-lock.log"
          grep -Fx 'VOID_BUY_VOID_V2_SELECTOR_ELF_LOCK_V1_PROOF_GREEN' "$RUNNER_TEMP/selector-elf-lock.log"
          grep -Fx 'selector_elf_identity_accepted=true' "$RUNNER_TEMP/selector-elf-lock.log"
          grep -Fx 'selector_binary_sha256=048564b0a351a5ba3b9f980962d9261fa14a49823b5075ca4794bbeefecbb232' "$RUNNER_TEMP/selector-elf-lock.log"
          grep -Fx 'install_authorized=false' "$RUNNER_TEMP/selector-elf-lock.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/selector-elf-lock.log"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}"
          git diff --check "$BASE" "$HEAD"
