name: Apollyon custody stale socket cleanup v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_custody_stale_socket_cleanup_v1.py"
      - "ops/xiphos/void-apollyon-authorization-custody-v1.service"
      - "scripts/prove_apollyon_custody_stale_socket_cleanup_v1.py"
      - ".github/workflows/apollyon-custody-stale-socket-cleanup-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove stale socket lifecycle helper
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_custody_stale_socket_cleanup_v1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
