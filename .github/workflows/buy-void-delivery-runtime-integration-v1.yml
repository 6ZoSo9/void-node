name: Buy VOID delivery runtime integration v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_delivery_runtime_integration_v1.ts"
      - "src/economic/buy_void_erc20_execution_composition_v1.ts"
      - "src/economic/buy_void_erc20_transaction_preparation_planner_v1.ts"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_delivery_submission_guard_v1.ts"
      - "scripts/prove_buy_void_delivery_submission_guard_v1.ts"
      - "scripts/prove_buy_void_delivery_runtime_integration_v1.ts"
      - "scripts/prove_buy_void_erc20_execution_composition_v1.ts"
      - "scripts/prove_buy_void_delivery_runtime_integration_guard_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - ".github/workflows/buy-void-delivery-runtime-integration-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/economic/buy_void_runtime_integration_v1.ts"
      - "src/economic/buy_void_delivery_runtime_integration_v1.ts"
      - "src/economic/buy_void_erc20_execution_composition_v1.ts"
      - "src/economic/buy_void_erc20_transaction_preparation_planner_v1.ts"
      - "src/economic/buy_void_erc20_delivery_receipt_reconciler_v1.ts"
      - "src/economic/buy_void_delivery_submission_guard_v1.ts"
      - "scripts/prove_buy_void_delivery_submission_guard_v1.ts"
      - "scripts/prove_buy_void_delivery_runtime_integration_v1.ts"
      - "scripts/prove_buy_void_erc20_execution_composition_v1.ts"
      - "scripts/prove_buy_void_delivery_runtime_integration_guard_v1.ts"
      - "scripts/ci_diff_hygiene_v1.sh"
      - ".github/workflows/buy-void-delivery-runtime-integration-v1.yml"

permissions:
  contents: read

jobs:
  delivery-runtime-integration:
    name: delivery runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_delivery_submission_guard_v1.ts \
            src/economic/buy_void_erc20_execution_composition_v1.ts \
            src/economic/buy_void_delivery_runtime_integration_v1.ts \
            scripts/prove_buy_void_delivery_submission_guard_v1.ts \
            scripts/prove_buy_void_erc20_execution_composition_v1.ts \
            scripts/prove_buy_void_delivery_runtime_integration_v1.ts \
            scripts/prove_buy_void_delivery_runtime_integration_guard_v1.ts

      - name: Delivery submission guard proof
        run: npx --no-install tsx scripts/prove_buy_void_delivery_submission_guard_v1.ts

      - name: ERC20 execution composition proof
        run: npx --no-install tsx scripts/prove_buy_void_erc20_execution_composition_v1.ts

      - name: Delivery runtime proof
        run: npx --no-install tsx scripts/prove_buy_void_delivery_runtime_integration_v1.ts

      - name: Delivery runtime guard
        run: npx --no-install tsx scripts/prove_buy_void_delivery_runtime_integration_guard_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci_diff_hygiene_v1.sh
