name: VOID Buy user manager query ELF lock v6

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - ".github/workflows/buy-void-user-manager-query-elf-candidate-v6.yml"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v6.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "scripts/prove_void_buy_user_manager_query_elf_lock_v6.mjs"
      - "docs/operators/buy-void-user-manager-query-elf-lock-v6.md"
      - ".github/workflows/buy-void-user-manager-query-elf-lock-v6.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_preexec_v1.c"
      - ".github/workflows/buy-void-user-manager-query-elf-candidate-v6.yml"
      - "ops/security/buy-void-user-manager-query-elf-candidate-v6.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v4.json"
      - "ops/security/buy-void-user-manager-query-elf-lock-v6.json"
      - "scripts/prove_void_buy_user_manager_query_elf_lock_v6.mjs"
      - "docs/operators/buy-void-user-manager-query-elf-lock-v6.md"
      - ".github/workflows/buy-void-user-manager-query-elf-lock-v6.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Rederive and verify exact V6 lock
        run: |
          set -euo pipefail
          proof=scripts/prove_void_buy_user_manager_query_elf_lock_v6.mjs
          out="$RUNNER_TEMP/user-manager-query-elf-lock-v6-${{ matrix.node }}.json"

          node "$proof" --self-test | tee "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_QUERY_ELF_LOCK_V6_GREEN' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'kernel_cap_last_cap_projection_required=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'configured_kernel_bounding_set_projection_required=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'candidate_accepted=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'v5_live_diagnostic_observed=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'v5_superseded_by_v6_candidate_generation=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'v6_disposable_live_probe_observed=true' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'v6_protected_install_performed=false' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'install_authorized=false' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"
          grep -Fx 'live_query_authorized=false' "$RUNNER_TEMP/query-elf-lock-v6-proof.log"

          node "$proof" --derive > "$out"
          cmp "$out" ops/security/buy-void-user-manager-query-elf-lock-v6.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-user-manager-query-elf-lock-v6-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/user-manager-query-elf-lock-v6-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-buy-user-manager-query-elf-lock-v6-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: locks

      - name: Require exact V6 lock equality
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "locks/user-manager-query-elf-lock-v6-$node.json"
          done
          cmp locks/user-manager-query-elf-lock-v6-22.json locks/user-manager-query-elf-lock-v6-24.json
          cmp locks/user-manager-query-elf-lock-v6-22.json locks/user-manager-query-elf-lock-v6-26.json
          grep -F '"lock_id": "voidbuyumqelflock6_3627a98945579452b01c79b4d114c54d858122496f2b20a20ddfd7fae6b0307c"'             locks/user-manager-query-elf-lock-v6-22.json
          echo VOID_BUY_VOID_USER_MANAGER_QUERY_ELF_LOCK_V6_CROSS_NODE_GREEN
