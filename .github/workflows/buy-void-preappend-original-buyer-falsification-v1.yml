name: VOID Buy VOID preappend original buyer negative proof v1

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_preappend_original_buyer_falsification_v1.ts"
      - ".github/workflows/buy-void-preappend-original-buyer-falsification-v1.yml"
      - "docs/architecture/buy-void-preappend-original-buyer-falsification-v1.md"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "src/economic/buy_void_allocation_reservation_publication_writer_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-preappend-original-buyer-negative-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  falsify:
    name: negative filesystem proof / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact Draft head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact filesystem source
        run: npm run build
      - name: Demonstrate preappend lineage gap on disposable ledgers only
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/prove_buy_void_preappend_original_buyer_falsification_v1.ts \
            | tee "preappend-buyer-negative-${{ matrix.node }}.txt"
          for token in \
            'PREAPPEND_ORIGINAL_BUYER_LINEAGE_SAFE=false' \
            'canonical_operator_history_poison_reproduced=true' \
            'real_customer_ledger_access=false' \
            'wallet_or_signer_access=false' \
            'funds_moved=false'
          do
            grep -Fx "$token" "preappend-buyer-negative-${{ matrix.node }}.txt"
          done
          test "$(grep -c '^payment_verified_fsynced_BEFORE_lineage_rejection=true$' \
            "preappend-buyer-negative-${{ matrix.node }}.txt")" = 2
      - name: Upload negative evidence without claiming production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-original-buyer-negative-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: preappend-buyer-negative-${{ matrix.node }}.txt
          retention-days: 1
          if-no-files-found: error
      - name: Scope/whitespace check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            git diff --check "$BASE" "$HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  cross-node:
    needs: [falsify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact-head three negative receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-original-buyer-negative-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./negative
      - name: Require byte-identical Node 22 24 26 negative outcomes
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "negative/preappend-buyer-negative-$node.txt"
          done
          cmp negative/preappend-buyer-negative-22.txt negative/preappend-buyer-negative-24.txt
          cmp negative/preappend-buyer-negative-22.txt negative/preappend-buyer-negative-26.txt
          grep -Fx 'PREAPPEND_ORIGINAL_BUYER_LINEAGE_SAFE=false' negative/preappend-buyer-negative-22.txt
          echo 'VOID_BUY_VOID_ORIGINAL_BUYER_NEGATIVE_THREE_NODE_GREEN'
          echo 'production_authority=false'
