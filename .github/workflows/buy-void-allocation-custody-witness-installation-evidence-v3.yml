name: VOID Buy VOID Nimo V3 installation evidence v3

on:
  push:
    branches:
      - main
      - ren/nimo-v3-installation-evidence-v3-20261010
    paths:
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v3.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3_historical_current_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-evidence-v3.md"
      - ".github/workflows/buy-void-allocation-custody-witness-installation-evidence-v3.yml"
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts"
      - "tools/void-buy-allocation-custody-witness-runtime-bundle-evidence-v3.mjs"
      - "scripts/prove_buy_void_nimo_v3_historical_v4_current_v1.mjs"
      - "scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs"
      - "scripts/prove_buy_void_nimo_v4_inactive_bundle_v1.py"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v3.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3_historical_current_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-evidence-v3.md"
      - ".github/workflows/buy-void-allocation-custody-witness-installation-evidence-v3.yml"
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts"
      - "tools/void-buy-allocation-custody-witness-runtime-bundle-evidence-v3.mjs"
      - "scripts/prove_buy_void_nimo_v3_historical_v4_current_v1.mjs"
      - "scripts/prove_buy_void_nimo_combined_v3_unaccepted_source_v1.mjs"
      - "scripts/prove_buy_void_nimo_v4_inactive_bundle_v1.py"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preserve exact predecessor and V3 dependency blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs)" = "9b959172dade1646ec1e2d3541695e6c66f172fb"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs)" = "f3e0aa63a3cf6bfff45b619c068f02d9bef05e35"
          test "$(git rev-parse HEAD:src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts)" = "7692ddd1b1bb10740b156be7e12c3766095eba64"
          test "$(git rev-parse HEAD:src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts)" = "453550bcab9c5caf192c6d9d813bce9ce4433b0a"
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-witness-runtime-bundle-evidence-v3.mjs)" = "67cb27d8eabfa74d3b196b04e313741b40b529ff"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3.mjs)" = "aacfdd851422c4200558f48bb1ac26e00b0e4ed0"
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-witness-installation-evidence-v3.mjs)" = "0fe1cc657ad386d55ae4051db479041d1c0c0248"

      - name: Typecheck and build canonical dependencies
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Classify installation-evidence source generation
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          ledger_blob="$(git hash-object src/economic/buy_void_allocation_reservation_ledger_v1.ts)"
          replay_blob="$(git hash-object src/economic/buy_void_verified_allocation_replay_binding_v1.ts)"
          bakery_blob="$(git hash-object src/economic/buy_void_filesystem_bakery_lock_v1.ts)"
          package_blob="$(git hash-object package.json)"
          lock_blob="$(git hash-object package-lock.json)"

          if [[ "$ledger_blob" == "66617a89d5ad9f81b5a21d98cca55fcda6902a80" \
                && "$package_blob" == "f28c3e9446c7623ef203da36a9642d046e5f34ee" \
                && "$lock_blob" == "b2671f0149f522b2489247016df0a5ec4bb72b8b" ]]; then
            mode="historical_v3"
          elif [[ "$ledger_blob" == "8d84955e1e093a5c5af63241e62b8722fadd2f29" \
                  && "$replay_blob" == "b451bcd895986dadaf6e53954671062068316ccf" \
                  && "$bakery_blob" == "9bd47abb857368d928c0ca289766cdf3571629ba" \
                  && "$package_blob" == "14fbdf5717b07fd4c734f5da7a8e84ed59bee93f" \
                  && "$lock_blob" == "15b5c82ea36f13079a2f9e8863722f654eb3f201" ]]; then
            mode="audited_current_successor_required"
          else
            echo "UNKNOWN_NIMO_INSTALLATION_EVIDENCE_GENERATION:$ledger_blob:$replay_blob:$bakery_blob:$package_blob:$lock_blob" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "NIMO_INSTALLATION_EVIDENCE_GENERATION=$mode"

      - name: Syntax-check and prove V3 installation collector
        if: steps.generation.outputs.mode == 'historical_v3'
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-witness-installation-evidence-v3.mjs
          node --check scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3.mjs
          node scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3.mjs \
            | tee receipt-${{ matrix.node }}.txt
          grep -Fxq 'VOID_BUY_VOID_ALLOCATION_CUSTODY_WITNESS_INSTALLATION_EVIDENCE_V3_GREEN' \
            receipt-${{ matrix.node }}.txt
          grep -Fxq 'v3_runtime_bundle_qualification_required=true' receipt-${{ matrix.node }}.txt
          grep -Fxq 'v3_runtime_bundle_evidence_collector_observed=true' receipt-${{ matrix.node }}.txt
          grep -Fxq 'live_evidence_origin_proven=false' receipt-${{ matrix.node }}.txt
          grep -Fxq 'funds_movement=false' receipt-${{ matrix.node }}.txt

      - name: Preserve V2 support qualification and historical V3 runtime qualification
        if: steps.generation.outputs.mode == 'historical_v3'
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts
          npx --no-install tsx scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v3.ts
          node scripts/prove_void_buy_allocation_custody_witness_runtime_bundle_evidence_v3.mjs

      - name: Prove audited current generation requires installation-evidence successor
        if: steps.generation.outputs.mode == 'audited_current_successor_required'
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts
          node --check scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3_historical_current_v1.mjs
          node scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v3_historical_current_v1.mjs \
            | tee "receipt-${{ matrix.node }}.txt"
          node --input-type=module - "receipt-${{ matrix.node }}.txt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(j.schema,"void_buy_void_nimo_v3_installation_historical_current_v1");
          assert.equal(j.mode,"audited_current_successor_required");
          assert.equal(j.historical_v3_installation_proof_refused_current_runtime,true);
          assert.equal(j.current_nimo_installation_evidence_generation_qualified,false);
          assert.equal(j.current_nimo_installation_successor_required,true);
          assert.equal(j.live_nimo_installed,false);
          assert.equal(j.production_gate_ready,false);
          assert.equal(j.presale_activation,false);
          assert.equal(j.funds_moved,false);
          NODE

      - run: git diff --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nimo-v3-installation-evidence-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: receipt-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nimo-v3-installation-evidence-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: evidence
      - run: |
          set -euo pipefail
          cmp evidence/receipt-22.txt evidence/receipt-24.txt
          cmp evidence/receipt-22.txt evidence/receipt-26.txt
          cat evidence/receipt-22.txt
          echo VOID_BUY_VOID_NIMO_V3_INSTALLATION_EVIDENCE_CROSS_NODE_GREEN
          echo live_nimo_installed=false
          echo verified_payment_to_allocation_mounted=false
          echo presale_activation=false
          echo funds_movement=false
