name: VOID Buy custody runtime V3 protected all-process reference census v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.yml"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py"
      - "ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py"
      - "ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact protected all-process successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="2f58b776c4ba5b4c1b309d122122bd3355e2abc9"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = \
            "8bba1d591b1f3a5e111ff9149209d23ddd4cb4be"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py)" = \
            "e57ea2cc2405ff7b83bc889617c8e52a4548b47b"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-protected-all-process-reference-census-v1.md)" = \
            "f23d4e19b786db42feee5c7134fdc42719df395f"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_process_reference_census_v1.py)" = \
            "a5fa6ff22cc21df555e8a70c32500f07251dc4a8"
          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_install_prestate_census_v1.py)" = \
            "4d9c6e5809a5cc64454626760f71e60ed99354bc"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json)" = \
            "edb4ea2b833373ab387762e45ba7da4032c860f3"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py

      - name: Self-test source candidate only
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-protected-allprocref-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py \
            --self-test | tee "$out"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_REFERENCE_CENSUS_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'protected_source_fixed_path_required=true' \
            'root_owned_nonwritable_ancestry_required=true' \
            'root_execution_required=true' \
            'target_identity_metadata_only=true' \
            'all_numeric_pids_scope=true' \
            'kernel_thread_explicit_skip=true' \
            'pid_generation_recheck=true' \
            'host_pid_namespace_external_lease_required=true' \
            'private_pid_namespace_rejected=true' \
            'host_pid_namespace_lease_mismatch_rejected=true' \
            'host_mount_namespace_external_lease_required=true' \
            'private_mount_namespace_rejected=true' \
            'host_mount_namespace_lease_mismatch_rejected=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'retained_procfs_view_required=true' \
            'retained_procfs_view_descriptor_relative=true' \
            'retained_procfs_view_revalidated_after_census=true' \
            'target_resolved_in_host_mount_namespace=true' \
            'host_namespace_lease_provenance_authenticated_by_census=false' \
            'separately_reviewed_host_namespace_lease_required=true' \
            'host_scoped_target_reference_absent_candidate_only=true' \
            'all_process_target_reference_absent_observed=false' \
            'task_inventory_generation_stability_required=true' \
            'per_thread_files_fs_reference_scan_required=true' \
            'bounded_task_inventory_required=true' \
            'target_pre_post_identity_recheck=true' \
            'proc_cmdline_read=false' \
            'proc_environ_read=false' \
            'proc_fd_target_text_read=false' \
            'proc_maps_path_text_retained=false' \
            'all_process_reference_absence_proven=false' \
            'fd_table_stability_proven=false' \
            'mapping_set_stability_proven=false' \
            'process_reference_snapshot_race_free=false' \
            'live_at_use_reverification_required=true' \
            'production_filesystem_write=false' \
            'self_test_temporary_filesystem_write=true' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary without privileged host census
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/custody-protected-allprocref-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_protected_all_process_reference_census_v1.py \
            | tee "$proof"

          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_PROTECTED_ALL_PROCESS_REFERENCE_CENSUS_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'parent_current_uid_generation_bound=true' \
            'protected_source_fixed_path_required=true' \
            'root_owned_nonwritable_ancestry_required=true' \
            'root_execution_required=true' \
            'mutable_checkout_privileged_execution_rejected=true' \
            'target_identity_metadata_only=true' \
            'all_numeric_pids_scope=true' \
            'kernel_thread_explicit_skip=true' \
            'pid_generation_recheck=true' \
            'host_pid_namespace_external_lease_required=true' \
            'private_pid_namespace_rejected=true' \
            'host_pid_namespace_lease_mismatch_rejected=true' \
            'host_mount_namespace_external_lease_required=true' \
            'private_mount_namespace_rejected=true' \
            'host_mount_namespace_lease_mismatch_rejected=true' \
            'complete_proc_visibility_required=true' \
            'hidepid_restricted_proc_holds=true' \
            'retained_procfs_view_required=true' \
            'retained_procfs_view_descriptor_relative=true' \
            'retained_procfs_view_revalidated_after_census=true' \
            'target_resolved_in_host_mount_namespace=true' \
            'host_namespace_lease_provenance_authenticated_by_census=false' \
            'separately_reviewed_host_namespace_lease_required=true' \
            'host_scoped_target_reference_absent_candidate_only=true' \
            'all_process_target_reference_absent_observed=false' \
            'task_inventory_generation_stability_required=true' \
            'per_thread_files_fs_reference_scan_required=true' \
            'bounded_task_inventory_required=true' \
            'nonleader_thread_fd_reference_detected=true' \
            'task_generation_churn_detected=true' \
            'target_pre_post_identity_recheck=true' \
            'proc_cmdline_read=false' \
            'proc_environ_read=false' \
            'proc_fd_target_text_read=false' \
            'proc_maps_path_text_retained=false' \
            'all_process_reference_absence_proven=false' \
            'fd_table_stability_proven=false' \
            'mapping_set_stability_proven=false' \
            'process_reference_snapshot_race_free=false' \
            'live_at_use_reverification_required=true' \
            'protected_source_installed_in_ci=false' \
            'host_census_not_executed_in_ci=true' \
            'production_filesystem_write=false' \
            'test_fixture_filesystem_write=true' \
            'replacement_apply_authorized=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
