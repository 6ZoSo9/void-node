name: Buy VOID Epoch-2 live-composition runner policy candidate V6R3

on:
  pull_request:
    paths:
      - 'scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py'
      - 'docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.md'
      - '.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.yml'
      - 'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs'
      - 'ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c'
      - 'ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v6r2.json'
  push:
    branches: [ main ]
    paths:
      - 'scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py'
      - 'docs/operators/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.md'
      - '.github/workflows/buy-void-epoch2-live-composition-runner-policy-candidate-v6r3.yml'
      - 'ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v4.mjs'
      - 'ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v3.c'
      - 'ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v6r2.json'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_id: ${{ steps.identity.outputs.candidate_id }}
      runner_sha256: ${{ steps.identity.outputs.runner_sha256 }}
      runner_bytes: ${{ steps.identity.outputs.runner_bytes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact workflow head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax
        run: |
          python3 -m py_compile scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py
      - name: Candidate self-test
        run: |
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py --self-test
      - name: Derive and verify candidate report
        id: identity
        run: |
          out="$RUNNER_TEMP/v6r3-runner-policy-candidate.json"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py --derive "$out"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_runner_policy_candidate_v6r3.py --verify "$out"
          test -s "$out"
          python3 -I -B - "$out" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("candidate_id="+value["candidate_id"])
          print("runner_sha256="+value["runner"]["sha256"])
          print("runner_bytes="+str(value["runner"]["bytes"]))
          PY
      - name: Diff hygiene
        run: git diff --check

  identity:
    needs: prove
    name: candidate-id ${{ needs.prove.outputs.candidate_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exported identity
        env:
          CANDIDATE_ID: ${{ needs.prove.outputs.candidate_id }}
          RUNNER_SHA256: ${{ needs.prove.outputs.runner_sha256 }}
          RUNNER_BYTES: ${{ needs.prove.outputs.runner_bytes }}
        run: |
          case "$CANDIDATE_ID" in
            voidbuye2runnerpolcand6r3_[0-9a-f][0-9a-f]*) ;;
            *) exit 1 ;;
          esac
          test "${#RUNNER_SHA256}" -eq 64
          case "$RUNNER_BYTES" in
            ''|*[!0-9]*) exit 1 ;;
          esac
