name: VOID public-safe background loop backpressure v1

on:
  pull_request:
    paths:
      - '.github/workflows/void-public-safe-background-loop-backpressure-v1.yml'
      - 'scripts/prove_public_safe_background_loop_backpressure_v1.cjs'
      - 'src/http/agent_pick2_jsonl_semantic_index_v1.ts'
      - 'src/index.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/void-public-safe-background-loop-backpressure-v1.yml'
      - 'scripts/prove_public_safe_background_loop_backpressure_v1.cjs'
      - 'src/http/agent_pick2_jsonl_semantic_index_v1.ts'
      - 'src/index.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove:
    name: prove-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Prove public-safe loop backpressure contract
        run: node scripts/prove_public_safe_background_loop_backpressure_v1.cjs
