name: VOID Buy VOID witness live-read replay composition v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_allocation_custody_witness_live_read_replay_composition_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_composition_v1.ts"
      - "docs/architecture/buy-void-allocation-custody-witness-live-read-replay-composition-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-live-read-replay-composition-v1.yml"
      - "src/economic/buy_void_allocation_custody_witness_live_read_replay_writer_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_writer_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_live_read_replay_high_water_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_high_water_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_live_read_replay_state_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_replay_state_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_live_read_qualification_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_live_read_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_transport_v1.ts"
      - "tools/void-buy-allocation-custody-witness-runtime-bundle-evidence-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_runtime_bundle_evidence_v1.mjs"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "scripts/prove_buy_void_filesystem_bakery_lock_async_v1.ts"
      - "tools/void-buy-allocation-custody-witness-live-read-replay-installation-evidence-v1.mjs"
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs"
      - "scripts/prove_buy_void_nimo_v4_inactive_bundle_v1.py"
      - "docs/architecture/buy-void-nimo-v4-inactive-bundle-v1.md"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "tools/void-buy-void-allocation-custody-preflight-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-witness-live-read-replay-composition-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: witness live-read replay composition v1 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Prove replay live-read composition
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_live_read_replay_composition_v1.ts

      - name: Preserve replay writer
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_live_read_replay_writer_v1.ts

      - name: Preserve live-read packet qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_live_read_qualification_v1.ts

      - name: Preserve historical V2 witness refusal
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/witness-installation-v2-historical-hold.txt"
          set +e
          node scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs >"$log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -Fq 'reviewed runtime bundle fixture hash changed: dist/economic/buy_void_allocation_reservation_ledger_v1.js' "$log"
          grep -Fq '51de81388631ecef2a8c3feea68960040ccbda75fd29ada171cb9c9c7b53188a' "$log"
          grep -Fq 'af497a5b7f62b08b60e90a527ae3365540fd2a13fcd99f6dd4e8253423869c0f' "$log"
          echo "VOID_WITNESS_INSTALLATION_V2_HISTORICAL_GENERATION_HOLD_GREEN"

      - name: Preserve historical V4 witness refusal after bakery source advance
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/witness-v4-historical-hold.txt"
          set +e
          python3 scripts/prove_buy_void_nimo_v4_inactive_bundle_v1.py --plan >"$log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq 'VOID_NIMO_V4_INACTIVE_BUNDLE_V1_HOLD:' "$log"
          grep -Fq 'runtime_bytes_invalid:' "$log"
          grep -Fq 'dist/economic/buy_void_filesystem_bakery_lock_v1.js' "$log"
          echo "VOID_NIMO_V4_BAKERY_SUCCESSOR_REQUIRED_HOLD_GREEN"
          echo "installed_nimo_successor_accepted=false"
          echo "production_gate_ready=false"
          echo "funds_movement=false"

      - name: Preserve transport contract
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_transport_v1.ts

      - name: Preserve external witness contract
        run: npx tsx scripts/prove_buy_void_allocation_custody_external_witness_v1.ts

      - name: Preserve filesystem bakery lock
        run: npx tsx scripts/prove_buy_void_filesystem_bakery_lock_async_v1.ts

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check
          fi