ses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n          persist-credentials: false\n          fetch-depth: 0\n      - name: Prove native peer integration contract\n        run: |\n          set -euo pipefail\n          node --check tools/apollyon-durable-attempt-claim-native-peer-guard-integration-v2.mjs\n          node --check scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_integration_v2.mjs\n          node scripts/prove_apollyon_durable_attempt_claim_native_peer_guard_integration_v2.mjs\n          test -z "$(git status --porcelain=v1 --untracked-files=all)"\n      - name: Diff hygiene\n        env:\n          EVENT_NAME: ${{ github.event_name }}\n          PR_BASE: ${{ github.event.pull_request.base.sha }}\n          PUSH_BEFORE: ${{ github.event.before }}\n          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}\n        run: |\n          set -euo pipefail\n          test "$(git rev-parse HEAD)" = "$HEAD"\n          case "$EVENT_NAME" in\n            pull_request)\n              test -n "$PR_BASE"\n              BASE="$PR_BASE"\n              ;;\n            push)\n              test -n "$PUSH_BEFORE"\n              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"\n              BASE="$PUSH_BEFORE"\n              ;;\n            workflow_dispatch)\n              BASE="$(git rev-parse HEAD^)"\n              ;;\n            *)\n              echo "unsupported_event=$EVENT_NAME" >&2\n              exit 1\n              ;;\n          esac\n          git merge-base --is-ancestor "$BASE" "$HEAD"\n          git diff --check "$BASE" "$HEAD"\n