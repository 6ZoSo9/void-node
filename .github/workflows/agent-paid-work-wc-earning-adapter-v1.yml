name: Agent Paid-Work WC Earning Adapter V1

on:
  pull_request:
    paths:
      - "src/economic/agent_paid_work_wc_earning_adapter_v1.ts"
      - "scripts/agent_paid_work_wc_earning_adapter_cli_v1.ts"
      - "scripts/prove_agent_paid_work_wc_earning_adapter_v1.ts"
      - "examples/agent-paid-work-wc-earning-adapter-plan-v1.example.json"
      - "schemas/agent-paid-work-wc-earning-adapter-plan-v1.schema.json"
      - "docs/public/agent-paid-work-wc-earning-adapter-v1.md"
      - ".github/workflows/agent-paid-work-wc-earning-adapter-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/economic/agent_paid_work_wc_earning_adapter_v1.ts"
      - "scripts/agent_paid_work_wc_earning_adapter_cli_v1.ts"
      - "scripts/prove_agent_paid_work_wc_earning_adapter_v1.ts"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/prove_agent_paid_work_wc_earning_adapter_v1.ts
