name: node-workflow-compatibility-contract-v1

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/prove_node22_repository_contract_v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/prove_node22_repository_contract_v1.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Prove repository workflow compatibility contract
        run: node scripts/prove_node22_repository_contract_v1.mjs
