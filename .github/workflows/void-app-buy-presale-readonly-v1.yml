name: void-app-buy-presale-readonly-v1

on:
  pull_request:
    paths:
      - "public/void-app-wave1-v1/assets/js/views.js"
      - "public/void-app-wave1-v1/assets/js/buy-live.js"
      - "public/void-app-wave1-v1/index.html"
      - "scripts/prove_void_app_buy_presale_readonly_v1.mjs"
      - "docs/public/void-app-buy-presale-readonly-v1.md"
      - ".github/workflows/void-app-buy-presale-readonly-v1.yml"
      - "src/index.ts"
      - "src/economic/buy_void_coupled_launch_gate_v1.mjs"
      - "scripts/prove_void_buy_coupled_launch_gate_v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - "public/void-app-wave1-v1/assets/js/views.js"
      - "public/void-app-wave1-v1/assets/js/buy-live.js"
      - "public/void-app-wave1-v1/index.html"
      - "scripts/prove_void_app_buy_presale_readonly_v1.mjs"
      - "docs/public/void-app-buy-presale-readonly-v1.md"
      - ".github/workflows/void-app-buy-presale-readonly-v1.yml"
      - "src/index.ts"
      - "src/economic/buy_void_coupled_launch_gate_v1.mjs"
      - "scripts/prove_void_buy_coupled_launch_gate_v1.mjs"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

jobs:
  proof:
    name: node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: node --check public/void-app-wave1-v1/assets/js/views.js
      - run: node --check public/void-app-wave1-v1/assets/js/buy-live.js
      - run: node scripts/prove_void_buy_coupled_launch_gate_v1.mjs
      - run: node scripts/prove_void_app_buy_presale_readonly_v1.mjs
