name: DataNet Chain-2050 commitment receipt v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-datanet-chain2050-commitment-receipt-v1.yml"
      - "contracts/mainnet/DatanetContentCommitmentRegistryV1.sol"
      - "docs/architecture/datanet-chain2050-commitment-receipt-v1.md"
      - "scripts/lib/void_datanet_chain2050_commitment_receipt_v1.mjs"
      - "scripts/prove_void_datanet_chain2050_commitment_receipt_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-datanet-chain2050-commitment-receipt-v1.yml"
      - "contracts/mainnet/DatanetContentCommitmentRegistryV1.sol"
      - "docs/architecture/datanet-chain2050-commitment-receipt-v1.md"
      - "scripts/lib/void_datanet_chain2050_commitment_receipt_v1.mjs"
      - "scripts/prove_void_datanet_chain2050_commitment_receipt_v1.mjs"

permissions:
  contents: read

concurrency:
  group: datanet-chain2050-commitment-receipt-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check verifier syntax
        run: node --check scripts/lib/void_datanet_chain2050_commitment_receipt_v1.mjs
      - name: Prove receipt and canonical-block binding
        run: node scripts/prove_void_datanet_chain2050_commitment_receipt_v1.mjs
      - name: Diff check
        run: git diff --check
