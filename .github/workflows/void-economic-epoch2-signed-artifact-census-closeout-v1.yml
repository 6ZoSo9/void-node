name: VOID epoch2 signed-artifact census closeout v1

on:
  pull_request:
    paths:
      - "ops/mainnet0/economic-epoch2-signed-artifact-census-closeout-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "tools/void-economic-epoch2-signed-artifact-census-closeout-v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_artifact_census_closeout_v1.mjs"
      - "docs/operators/economic-epoch2-signed-artifact-census-closeout-v1.md"
      - "docs/operators/nimo-epoch2-signed-artifact-metadata-census-v1.md"
      - ".github/workflows/void-economic-epoch2-signed-artifact-census-closeout-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: |
          node --check tools/void-economic-epoch2-signed-artifact-census-closeout-v1.mjs
          node --check scripts/prove_void_economic_epoch2_signed_artifact_census_closeout_v1.mjs
          node scripts/prove_void_economic_epoch2_signed_artifact_census_closeout_v1.mjs
      - run: git diff --check
