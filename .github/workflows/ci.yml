permissions:
  contents: read

name: CI
name: CI


on:
  push:
    branches: [ restore-2025-10-28 ]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "!**.md"
      - "!docs/**"
      - "!**.png"
      - "!**.jpg"
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Block secret-like files in PR diff
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
          if echo "$CHANGED" | grep -E "(^|/)\.secrets/|(\.key$|\.pem$|\.p12$|\.pfx$|\.env(\.|$))"; then
            echo "Secret-like file detected in changes"; exit 1
          else
            echo "OK"
          fi
      - uses: actions/setup-node@v4
        cache-dependency-path: package-lock.json
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:loose --if-present
      - run: npx tsc --noEmit || true

      - name: Secret scan (ggshield repo)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip && pip install ggshield
      - env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan repo --all .
