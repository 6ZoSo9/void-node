name: CI
on:
  push:
    branches: [ new-main*, restore-2025-10-28, main ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck (no emit)
        run: bash tools/check_tsc_noemit_baseline.sh
      - name: Check public node operator trial terminal final seal
        run: bash tools/check_public_node_operator_trial_terminal_final_seal_v1.sh
