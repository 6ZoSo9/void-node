name: CI

on:
  push:
    branches:
      - restore-2025-10-28
      - new-main
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR-only denylist for secret-like paths in the diff
      - name: Block secret-like files in PR diff
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE...$HEAD" || true)"
          if echo "$CHANGED" | grep -E '(^|/)\.secrets/|(\.key$|\.pem$|\.p12$|\.pfx$|\.env(\.|$))' ; then
            echo "Secret-like file detected in changes"
            exit 1
          else
            echo "OK"
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install
        run: npm ci

      - name: Typecheck (no emit)
        run: npx tsc --noEmit

      # Optional: full repo secret scan only if the secret is set
      - name: Setup Python (for ggshield)
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ggshield
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        run: python -m pip install --upgrade pip && pip install ggshield

      - name: ggshield scan
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan repo --all .
