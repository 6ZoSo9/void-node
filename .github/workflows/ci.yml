name: CI
name: CI


on:
  push:
    branches: [ restore-2025-10-28 ]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:loose --if-present
      - run: npx tsc --noEmit || true
