name: CI
on:
  push:
    branches: [ new-main*, restore-2025-10-28, main ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck (no emit)
        run: |
          test "$(git hash-object tools/check_tsc_noemit_baseline.sh)" = "$(git rev-parse "${GITHUB_SHA}:tools/check_tsc_noemit_baseline.sh")"
          test "$(git hash-object scripts/prove_segmented_jsonl_ci_topology_v1.mjs)" = "$(git rev-parse "${GITHUB_SHA}:scripts/prove_segmented_jsonl_ci_topology_v1.mjs")"
          test "$(git hash-object .github/workflows/ci.yml)" = "$(git rev-parse "${GITHUB_SHA}:.github/workflows/ci.yml")"
          bash tools/check_tsc_noemit_baseline.sh
      - name: Check public node operator trial terminal final seal
        run: bash tools/check_public_node_operator_trial_terminal_final_seal_v1.sh
      - name: Check public node operator trial lane final seal
        run: bash tools/check_public_node_operator_trial_lane_final_seal_v1.sh


  nimo-tor-p2p-auth-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Tor client
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor
      - name: Bootstrap isolated Tor client
        run: |
          mkdir -p "$RUNNER_TEMP/void-tor-client-data"
          printf '%s\n' \
            "DataDirectory $RUNNER_TEMP/void-tor-client-data" \
            "SocksPort 127.0.0.1:19051" \
            "SafeSocks 1" \
            "SafeLogging 1" \
            "ClientOnly 1" \
            "RunAsDaemon 0" \
            "Log notice stdout" \
            >"$RUNNER_TEMP/void-tor-client.conf"
          tor --verify-config -f "$RUNNER_TEMP/void-tor-client.conf"
          tor -f "$RUNNER_TEMP/void-tor-client.conf" >"$RUNNER_TEMP/tor.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/tor.pid"
          for _ in $(seq 1 180); do
            if grep -Fq 'Bootstrapped 100% (done): Done' "$RUNNER_TEMP/tor.log"; then
              echo "tor_bootstrap_100=true"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/tor.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/tor.log" >&2
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tor.log" >&2
          exit 1
      - name: Authenticate to Nimo VOID P2P over onion
        run: npx --no-install tsx scripts/verify_void_nimo_tor_p2p_auth_v1.ts
