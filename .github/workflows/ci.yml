name: CI
on:
  push:
    branches: [ new-main*, restore-2025-10-28, main ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck (no emit)
        run: |
          test "$(git hash-object tools/check_tsc_noemit_baseline.sh)" = "$(git rev-parse "${GITHUB_SHA}:tools/check_tsc_noemit_baseline.sh")"
          test "$(git hash-object scripts/prove_segmented_jsonl_ci_topology_v1.mjs)" = "$(git rev-parse "${GITHUB_SHA}:scripts/prove_segmented_jsonl_ci_topology_v1.mjs")"
          test "$(git hash-object .github/workflows/ci.yml)" = "$(git rev-parse "${GITHUB_SHA}:.github/workflows/ci.yml")"
          bash tools/check_tsc_noemit_baseline.sh
      - name: Check public node operator trial terminal final seal
        run: bash tools/check_public_node_operator_trial_terminal_final_seal_v1.sh
      - name: Check public node operator trial lane final seal
        run: bash tools/check_public_node_operator_trial_lane_final_seal_v1.sh


  tor-onion-external-reachability-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Tor client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor

      - name: Bootstrap isolated Tor client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/void-tor-client-data"
          printf '%s\n' \
            "DataDirectory $RUNNER_TEMP/void-tor-client-data" \
            "SocksPort 127.0.0.1:19051" \
            "SafeSocks 1" \
            "SafeLogging 1" \
            "ClientOnly 1" \
            "RunAsDaemon 0" \
            "Log notice stdout" \
            >"$RUNNER_TEMP/void-tor-client.conf"
          tor --verify-config -f "$RUNNER_TEMP/void-tor-client.conf"
          tor -f "$RUNNER_TEMP/void-tor-client.conf" >"$RUNNER_TEMP/tor-client.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/tor-client.pid"
          for _ in $(seq 1 180); do
            if grep -Fq 'Bootstrapped 100% (done): Done' "$RUNNER_TEMP/tor-client.log" &&
               ss -H -ltn | awk '{print $4}' | grep -Eq '127\.0\.0\.1:19051$'; then
              echo "tor_bootstrap_100=true"
              echo "tor_socks_ready=true"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/tor-client.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/tor-client.log" >&2
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tor-client.log" >&2
          exit 1

      - name: Probe Nimo onion readiness externally
        shell: bash
        run: |
          set -euo pipefail
          onion='6a4r6osb37sp2t6nbx7dpdnq5wfdzdrn5axt7t33kduzuznarqqpnkid.onion'
          success=0
          for attempt in 1 2 3; do
            echo "external_probe_attempt=$attempt"
            set +e
            curl --fail --silent --show-error \
              --socks5-hostname 127.0.0.1:19051 \
              --connect-timeout 20 \
              --max-time 45 \
              -D "$RUNNER_TEMP/headers-$attempt.txt" \
              -o "$RUNNER_TEMP/body-$attempt.json" \
              "http://$onion/__void/ready.json"
            rc=$?
            set -e
            if test "$rc" -eq 0; then
              cat "$RUNNER_TEMP/headers-$attempt.txt"
              cat "$RUNNER_TEMP/body-$attempt.json"
              grep -Fiq 'x-void-public-seed-gateway: v1' "$RUNNER_TEMP/headers-$attempt.txt"
              READY_JSON="$(cat "$RUNNER_TEMP/body-$attempt.json")" node -e '
                const v=JSON.parse(process.env.READY_JSON);
                if(v?.ready!==true || !Number.isSafeInteger(v?.head) ||
                   v.head<1951058 || v?.gap!==0 || v?.txroot_live!==1) process.exit(1);
              '
              success=1
              break
            fi
            sleep 20
          done
          test "$success" -eq 1
          echo "external_onion_reachable=true"
          echo "external_onion_exact_green=true"
          echo "VOID_TOR_ONION_EXTERNAL_REACHABILITY_V1_GREEN"
