name: VOID Buy authenticated user manager unit evidence v4

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"
      - "scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs"
      - "docs/architecture/buy-void-authenticated-user-manager-unit-evidence-v4.md"
      - ".github/workflows/buy-void-authenticated-user-manager-unit-evidence-v4.yml"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v2.conf.example"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"
      - "scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs"
      - "docs/architecture/buy-void-authenticated-user-manager-unit-evidence-v4.md"
      - ".github/workflows/buy-void-authenticated-user-manager-unit-evidence-v4.yml"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "ops/systemd/void-node-live.service.d/98-buy-void-allocation-custody-runtime-hardening-v2.conf.example"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prove V4 authenticated evidence
        run: |
          set -euo pipefail
          node scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs |
            tee "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'VOID_BUY_VOID_ALLOCATION_CUSTODY_HOST_EVIDENCE_V4_PROOF_GREEN' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'native_v2_exact_transcript_required=true' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'caller_built_native_object_authority=false' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'private_users_false_required=true' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'kernel_no_new_privileges_required=true' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'kernel_active_capabilities_zero_required=true' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'configured_kernel_bounding_set_equality_required=true' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'complete_host_evidence_collector=false' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'host_mutation=false' "$RUNNER_TEMP/evidence-v4.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/evidence-v4.log"
      - run: git diff --check
