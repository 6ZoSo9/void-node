name: VOID Buy authenticated user manager unit evidence v4

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"
      - "scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs"
      - "docs/architecture/buy-void-authenticated-user-manager-unit-evidence-v4.md"
      - ".github/workflows/buy-void-authenticated-user-manager-unit-evidence-v4.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_private_unit_query_v1.c"
      - "tools/void-buy-allocation-custody-host-evidence-v4.mjs"
      - "scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs"
      - "docs/architecture/buy-void-authenticated-user-manager-unit-evidence-v4.md"
      - ".github/workflows/buy-void-authenticated-user-manager-unit-evidence-v4.yml"

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve V4 authenticated evidence on exact V5 successor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_private_unit_query_v1.c)" = "ddca2c544ce14261dffb80a202c0a4ae2979ec1e"
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-host-evidence-v4.mjs)" = "223a8acf32f8c7961d61222b83c0db17075f86c6"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_host_evidence_v4.mjs)" = "5359de58ece074d937bc7c3a1b99b358afff0f31"
          test "$(git rev-parse HEAD:docs/architecture/buy-void-authenticated-user-manager-unit-evidence-v4.md)" = "2b554518e9c585f64a7386723e5a80ff82030af6"
          echo VOID_BUY_VOID_ALLOCATION_CUSTODY_HOST_EVIDENCE_V4_HISTORICAL_PRESERVED
          echo v5_control_group_service_interface_successor=true
          echo complete_host_evidence_collector=false
          echo public_presale_activation=false
          echo funds_movement=false
      - run: git diff --check
