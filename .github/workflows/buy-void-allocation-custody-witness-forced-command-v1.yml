name: Buy VOID allocation custody witness forced command v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-forced-command-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_witness-forced-command-v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-forced-command-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-forced-command-v1.yml"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-allocation-custody-witness-forced-command-v1.mjs"
      - "scripts/prove_buy_void_allocation_custody_witness-forced-command-v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-forced-command-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-forced-command-v1.yml"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_allocation_reservation_ledger_v1.ts"
      - "src/economic/buy_void_allocation_reservation_high_water_v1.ts"
      - "src/economic/buy_void_crash_consistent_saga_server_policy_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-allocation-custody-witness-forced-command-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: witness forced command / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository build
        run: npm run build

      - name: Prove parent witness transport
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_transport_v1.ts

      - name: Syntax check forced-command source
        run: node --check tools/void-buy-allocation-custody-witness-forced-command-v1.mjs

      - name: Prove forced-command persistence and recovery
        run: node scripts/prove_buy_void_allocation_custody_witness_forced_command_v1.mjs

      - name: Verify source tree cleanliness
        run: test -z "$(git status --porcelain=v1)"

      - name: Diff hygiene
        run: git diff --check
