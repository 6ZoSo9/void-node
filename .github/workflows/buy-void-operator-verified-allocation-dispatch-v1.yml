name: VOID Buy VOID operator verified-allocation dispatch V1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "docs/architecture/buy-void-operator-verified-allocation-dispatch-v1.md"
      - ".github/workflows/buy-void-operator-verified-allocation-dispatch-v1.yml"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "src/index.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build source without running node
        run: |
          npm run typecheck
          npm run build
      - name: Prove detached dispatch plan and current mounted route HOLD
        run: |
          set -euo pipefail
          node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts \
            | tee "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'pre_serialization_plain_data_bound=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'caller_toJSON_rejected_without_invocation=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'caller_accessor_rejected_without_invocation=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'caller_proxy_rejected_without_traps=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'oversize_text_holds_before_full_json_serialization=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'deep_nesting_holds_before_json_serialization=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'excess_key_count_holds_before_json_serialization=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'sparse_array_inherited_lookup_forbidden=true' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'mounted_verified_allocation_dispatch=false' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'payment_or_allocation_append_performed=false' "dispatch-node-${{ matrix.node }}.txt"
          grep -Fx 'presale_activation=false' "dispatch-node-${{ matrix.node }}.txt"
      - name: Upload synthetic proof only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-verified-allocation-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: dispatch-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff whitespace hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE" "$HEAD"

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three exact-head proof outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-verified-allocation-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence
      - name: Require exact Node 22 24 26 proof byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "evidence/dispatch-node-$v.txt"; done
          cmp evidence/dispatch-node-22.txt evidence/dispatch-node-24.txt
          cmp evidence/dispatch-node-22.txt evidence/dispatch-node-26.txt
          echo "VOID_BUY_VOID_VERIFIED_ALLOCATION_DISPATCH_CROSS_NODE_GREEN"
          echo "mounted_operator_route_verified=false"
          echo "production_gate_ready=false"
          echo "funds_moved=false"
