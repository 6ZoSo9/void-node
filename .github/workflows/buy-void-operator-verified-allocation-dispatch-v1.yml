name: VOID Buy VOID operator verified-allocation dispatch V1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts"
      - "docs/architecture/buy-void-operator-verified-allocation-dispatch-v1.md"
      - ".github/workflows/buy-void-operator-verified-allocation-dispatch-v1.yml"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "src/index.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build source without running node
        run: |
          npm run typecheck
          npm run build
      - name: Preserve frozen V1 negative source identity
        run: |
          set -euo pipefail
          # V1 is historical; current dispatcher/writer intentionally evolved.
          # A frozen V1 proof MUST reject the source generation, never gain
          # a new writer SHA by silent repinning.
          test "$(git hash-object scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts)" = "e58bf39fadc25123771481608fad2a61a8f3133f"
          if node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v1.ts > "$RUNNER_TEMP/frozen-dispatch-v1.txt" 2>&1; then
            echo "UNEXPECTED_HISTORICAL_DISPATCH_V1_ACCEPTANCE" >&2
            exit 1
          fi
          grep -Fq "exact reviewed dispatcher source drift" "$RUNNER_TEMP/frozen-dispatch-v1.txt"
          grep -Fq "0e27a76e777c326d2d9e2b1550b7f2979fca9abb" "$RUNNER_TEMP/frozen-dispatch-v1.txt"
          grep -Fq "eb4fb37c6073415228b312663c45a99d5015c727" "$RUNNER_TEMP/frozen-dispatch-v1.txt"
          {
            echo "VOID_BUY_VOID_DISPATCH_FROZEN_V1_DRIFT_HOLD_GREEN"
            echo "historical_v1_proof_blob_unchanged=true"
            echo "current_dispatcher_generation_not_misidentified=true"
            echo "mounted_verified_allocation_dispatch=false"
            echo "payment_or_allocation_append_performed=false"
            echo "presale_activation=false"
            echo "funds_moved=false"
          } > "dispatch-node-${{ matrix.node }}.txt"
          cat "dispatch-node-${{ matrix.node }}.txt"
      - name: Upload synthetic proof only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-verified-allocation-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: dispatch-node-${{ matrix.node }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Diff whitespace hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE" "$HEAD"

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three exact-head proof outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buy-void-verified-allocation-dispatch-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence
      - name: Require exact Node 22 24 26 proof byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do test -s "evidence/dispatch-node-$v.txt"; done
          cmp evidence/dispatch-node-22.txt evidence/dispatch-node-24.txt
          cmp evidence/dispatch-node-22.txt evidence/dispatch-node-26.txt
          echo "VOID_BUY_VOID_VERIFIED_ALLOCATION_DISPATCH_CROSS_NODE_GREEN"
          echo "mounted_operator_route_verified=false"
          echo "production_gate_ready=false"
          echo "funds_moved=false"
