name: Apollyon live custody source session preentry binary candidate v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_live_custody_source_session_preentry_v2.c"
      - "scripts/prove_apollyon_live_custody_source_session_preentry_binary_candidate_v1.py"
      - "docs/security/apollyon-live-custody-source-session-preentry-binary-candidate-v1.md"
      - ".github/workflows/apollyon-live-custody-source-session-preentry-binary-candidate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: derive candidate / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive candidate report
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -I -B scripts/prove_apollyon_live_custody_source_session_preentry_binary_candidate_v1.py             --derive "$RUNNER_TEMP/candidate.json"
          cat "$RUNNER_TEMP/candidate.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apollyon-live-session-preentry-candidate-${{ matrix.lane }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: compare three candidate reports
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download candidate reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apollyon-live-session-preentry-candidate-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false
      - name: Require byte-identical hosted candidates
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_apollyon_live_custody_source_session_preentry_binary_candidate_v1.py \
            --self-test | tee "$RUNNER_TEMP/preentry-self-test.txt"
          grep -Fx 'static_link_required=true' "$RUNNER_TEMP/preentry-self-test.txt"
          grep -Fx 'pt_interp_absent=true' "$RUNNER_TEMP/preentry-self-test.txt"
          grep -Fx 'hostile_ld_preload_positive_control=true' "$RUNNER_TEMP/preentry-self-test.txt"
          grep -Fx 'hostile_ld_preload_preentry_blocked=true' "$RUNNER_TEMP/preentry-self-test.txt"
          grep -Fx 'static_toolchain_closure_bound=true' "$RUNNER_TEMP/preentry-self-test.txt"
          python3 -I -B scripts/prove_apollyon_live_custody_source_session_preentry_binary_candidate_v1.py \
            --compare-dir "$RUNNER_TEMP/candidates" | tee "$RUNNER_TEMP/preentry-compare.txt"
          grep -Fx 'pt_interp_absent=true' "$RUNNER_TEMP/preentry-compare.txt"
          grep -Fx 'hostile_ld_preload_preentry_blocked=true' "$RUNNER_TEMP/preentry-compare.txt"
          grep -Fx 'static_toolchain_closure_bound=true' "$RUNNER_TEMP/preentry-compare.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -z "${BASE:-}" ]; then
            BASE="$(git rev-parse "$HEAD^1")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
