name: VOID WC-VOID market-vault gas census v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-gas-census-v1.yml"
      - "test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol"
      - "scripts/prove_void_wc_void_market_vault_gas_census_v1.mjs"
      - "docs/operators/wc-void-market-vault-gas-census-v1.md"
      - "contracts/mainnet/WCVoidMarketVaultV2.sol"
      - "contracts/epoch2/VoidEpoch2TokenV1.sol"
      - "ops/mainnet0/wc-void-market-vault-compiled-identity-acceptance-v1.json"
      - "ops/mainnet0/economic-epoch2-contract-holder-destination-manifest-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-market-vault-gas-census-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove gas-census source binding
        run: node scripts/prove_void_wc_void_market_vault_gas_census_v1.mjs

      - name: Diff hygiene
        run: git diff --check

  foundry-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact reviewed source blobs
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:contracts/mainnet/WCVoidMarketVaultV2.sol)" = "bd11190e2c22f58ac60918ecdf603f53427cadd0"
          test "$(git rev-parse HEAD:contracts/epoch2/VoidEpoch2TokenV1.sol)" = "7c4297aadbc17b6214b4dde1f1766523cb499923"
          echo "tested_head_sha=$(git rev-parse HEAD)"
          echo "vault_git_blob_sha1=bd11190e2c22f58ac60918ecdf603f53427cadd0"
          echo "token_git_blob_sha1=7c4297aadbc17b6214b4dde1f1766523cb499923"
          sha256sum             contracts/mainnet/WCVoidMarketVaultV2.sol             contracts/epoch2/VoidEpoch2TokenV1.sol             test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol

      - name: Run isolated Foundry gas measurement
        env:
          FOUNDRY_IMAGE: ghcr.io/foundry-rs/foundry:v1.7.1
        run: |
          set -Eeuo pipefail

          FOUNDRY_HOME="$RUNNER_TEMP/void-foundry-home"
          FOUNDRY_OUT="$RUNNER_TEMP/void-foundry-out"
          FOUNDRY_CACHE="$RUNNER_TEMP/void-foundry-cache"
          FOUNDRY_PROJECT="$RUNNER_TEMP/void-wc-void-market-vault-gas-census-foundry"
          LOG="$RUNNER_TEMP/void-wc-void-market-vault-gas-census.log"

          mkdir -p             "$FOUNDRY_HOME"             "$FOUNDRY_OUT"             "$FOUNDRY_CACHE"             "$FOUNDRY_PROJECT/contracts/mainnet"             "$FOUNDRY_PROJECT/contracts/epoch2"             "$FOUNDRY_PROJECT/test/mainnet"

          install -m 0444             contracts/mainnet/WCVoidMarketVaultV2.sol             "$FOUNDRY_PROJECT/contracts/mainnet/WCVoidMarketVaultV2.sol"
          install -m 0444             contracts/epoch2/VoidEpoch2TokenV1.sol             "$FOUNDRY_PROJECT/contracts/epoch2/VoidEpoch2TokenV1.sol"
          install -m 0444             test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol             "$FOUNDRY_PROJECT/test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol"

          cmp             contracts/mainnet/WCVoidMarketVaultV2.sol             "$FOUNDRY_PROJECT/contracts/mainnet/WCVoidMarketVaultV2.sol"
          cmp             contracts/epoch2/VoidEpoch2TokenV1.sol             "$FOUNDRY_PROJECT/contracts/epoch2/VoidEpoch2TokenV1.sol"
          cmp             test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol             "$FOUNDRY_PROJECT/test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol"

          docker pull "$FOUNDRY_IMAGE"
          echo "foundry_image_id=$(docker image inspect --format '{{.Id}}' "$FOUNDRY_IMAGE")"

          docker run --rm             --user "$(id -u):$(id -g)"             --entrypoint forge             -e HOME=/foundry-home             -v "$FOUNDRY_HOME:/foundry-home"             -v "$FOUNDRY_OUT:/foundry-out"             -v "$FOUNDRY_CACHE:/foundry-cache"             -v "$FOUNDRY_PROJECT:/proof:ro"             -w /proof             "$FOUNDRY_IMAGE"             --version

          docker run --rm             --user "$(id -u):$(id -g)"             --entrypoint forge             -e HOME=/foundry-home             -v "$FOUNDRY_HOME:/foundry-home"             -v "$FOUNDRY_OUT:/foundry-out"             -v "$FOUNDRY_CACHE:/foundry-cache"             -v "$FOUNDRY_PROJECT:/proof:ro"             -w /proof             "$FOUNDRY_IMAGE"             test             --root /proof             --contracts contracts             --match-path test/mainnet/WCVoidMarketVaultV2GasCensus.t.sol             --use 0.8.24             --evm-version paris             --optimizer-runs 200             --out /foundry-out             --cache-path /foundry-cache             --gas-report             -vvvv 2>&1 | tee "$LOG"

          grep -F "settle_void_first_execution_gas" "$LOG"
          grep -F "settle_void_first_intrinsic_gas" "$LOG"
          grep -F "settle_void_first_measured_tx_gas" "$LOG"
          grep -F "settle_void_subsequent_execution_gas" "$LOG"
          grep -F "settle_void_subsequent_intrinsic_gas" "$LOG"
          grep -F "settle_void_subsequent_measured_tx_gas" "$LOG"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
