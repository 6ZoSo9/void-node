name: WC Public Opportunity Discovery Budget v1

on:
  pull_request:
    paths:
      - ".github/workflows/wc-public-opportunity-discovery-budget-v1.yml"
      - "tools/wc-public-opportunity-discovery-v1.mjs"
      - "tools/wc-public-response-teardown-v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_budget_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wc-public-opportunity-discovery-budget-v1.yml"
      - "tools/wc-public-opportunity-discovery-v1.mjs"
      - "tools/wc-public-response-teardown-v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_budget_v1.mjs"
      - "scripts/ci_diff_hygiene_v1.sh"
      - "scripts/prove_ci_diff_hygiene_v1.mjs"

permissions:
  contents: read

concurrency:
  group: wc-public-opportunity-discovery-budget-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Check source and proof syntax
        run: |
          node --check tools/wc-public-opportunity-discovery-v1.mjs
          node --check tools/wc-public-response-teardown-v1.mjs
          node --check scripts/prove_wc_public_opportunity_discovery_v1.mjs
          node --check scripts/prove_wc_public_opportunity_discovery_budget_v1.mjs

      - name: Prove existing discovery trust contract
        run: node scripts/prove_wc_public_opportunity_discovery_v1.mjs

      - name: Prove candidate and logical deadline bounds
        run: |
          node scripts/prove_wc_public_opportunity_discovery_budget_v1.mjs \
            | tee /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "VOID_WC_PUBLIC_OPPORTUNITY_DISCOVERY_BUDGET_V1_PROOF_GREEN" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "maximum_candidate_paths=24" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "shared_logical_deadline=true" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "primary_rejection_truth_preserved=true" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "structure_budget_bounded=true" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "mutation=false" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log
          grep -Fx "wc_award=false" \
            /tmp/wc-public-opportunity-discovery-budget-v1.log

      - name: Prove committed-range diff hygiene contract
        if: matrix.node == '22'
        run: node scripts/prove_ci_diff_hygiene_v1.mjs

      - name: Diff hygiene (pull request)
        if: github.event_name == 'pull_request'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_DIFF_CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          CI_DIFF_HEAD_REMOTE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh

      - name: Diff hygiene (push)
        if: github.event_name == 'push'
        env:
          CI_DIFF_EVENT_NAME: ${{ github.event_name }}
          CI_DIFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_DIFF_CURRENT_SHA: ${{ github.sha }}
          CI_DIFF_CHECKOUT_SHA: ${{ github.sha }}
          CI_DIFF_BASE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash scripts/ci_diff_hygiene_v1.sh
