name: VOID Precision web recovery evidence v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-precision-web-recovery-evidence-v1.yml"
      - "tools/void-precision-web-recovery-evidence-v2.mjs"
      - "scripts/prove_void_precision_web_recovery_evidence_v2.mjs"
      - "docs/operators/precision-web-recovery-evidence-v1.md"
      - "scripts/prove_void_precision_web_recovery_evidence_v1.mjs"
      - "tools/void-precision-web-recovery-evidence-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "ops/public/run-public-seed-adapter-v1.sh"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "ops/public/run-void-public-app-composition-gateway-v1.sh"
      - "ops/systemd/user/void-public-app-composition-gateway-v1.service.example"
      - "ops/public/void-public-frontdoor-v1.mjs"
      - "ops/public/void-public-frontdoor-cutover-v1.sh"
      - "public/void-public-frontdoor-v1/index.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-precision-web-recovery-evidence-v1.yml"
      - "tools/void-precision-web-recovery-evidence-v2.mjs"
      - "scripts/prove_void_precision_web_recovery_evidence_v2.mjs"
      - "docs/operators/precision-web-recovery-evidence-v1.md"
      - "scripts/prove_void_precision_web_recovery_evidence_v1.mjs"
      - "tools/void-precision-web-recovery-evidence-v1.mjs"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "ops/public/run-public-seed-adapter-v1.sh"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "ops/public/run-void-public-app-composition-gateway-v1.sh"
      - "ops/systemd/user/void-public-app-composition-gateway-v1.service.example"
      - "ops/public/void-public-frontdoor-v1.mjs"
      - "ops/public/void-public-frontdoor-cutover-v1.sh"
      - "public/void-public-frontdoor-v1/index.html"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check tools/void-precision-web-recovery-evidence-v1.mjs
          node --check scripts/prove_void_precision_web_recovery_evidence_v1.mjs
      - name: Preserve frozen V1 source refusal
        run: |
          set +e
          node scripts/prove_void_precision_web_recovery_evidence_v1.mjs \
            > "$RUNNER_TEMP/precision-v1.stdout" 2> "$RUNNER_TEMP/precision-v1.stderr"
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'precision_web_source_blob_mismatch:ops/public/void-public-app-composition-gateway-v1.mjs' \
            "$RUNNER_TEMP/precision-v1.stderr"
          echo "frozen_precision_v1_refusal=GREEN"
      - name: Prove current gateway V2 successor
        run: node scripts/prove_void_precision_web_recovery_evidence_v2.mjs
      - name: Existing public stack regressions
        run: |
          node --check ops/public/public-seed-adapter-v1.mjs
          node --check ops/public/void-public-app-composition-gateway-v1.mjs
          node --check ops/public/void-public-frontdoor-v1.mjs
          node scripts/prove_void_public_frontdoor_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
