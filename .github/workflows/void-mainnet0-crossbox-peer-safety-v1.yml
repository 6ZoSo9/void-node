name: VOID Mainnet-0 explicit cross-box peer safety v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-mainnet0-crossbox-peer-safety-v1.yml"
      - "scripts/prove_void_mainnet0_crossbox_peer_safety_v1.mjs"
      - "ops/mainnet/mainnet0-crossbox-status-smoke.sh"
      - "ops/mainnet/mainnet0-prelaunch-safety-proof.sh"
      - "ops/mainnet/mainnet0-validator-live-admission-final-preflight-proof.sh"
      - "ops/mainnet/mainnet0-status-runbook.md"
      - "ops/mainnet/mainnet0-prelaunch-safety-runbook.md"
      - "ops/mainnet/mainnet0-status-smoke.sh"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-mainnet0-crossbox-peer-safety-v1.yml"
      - "scripts/prove_void_mainnet0_crossbox_peer_safety_v1.mjs"
      - "ops/mainnet/mainnet0-crossbox-status-smoke.sh"
      - "ops/mainnet/mainnet0-prelaunch-safety-proof.sh"
      - "ops/mainnet/mainnet0-validator-live-admission-final-preflight-proof.sh"
      - "ops/mainnet/mainnet0-status-runbook.md"
      - "ops/mainnet/mainnet0-prelaunch-safety-runbook.md"
      - "ops/mainnet/mainnet0-status-smoke.sh"
      - "Makefile"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
      - name: Shell syntax
        run: |
          bash -n ops/mainnet/mainnet0-crossbox-status-smoke.sh
          bash -n ops/mainnet/mainnet0-prelaunch-safety-proof.sh
          bash -n ops/mainnet/mainnet0-validator-live-admission-final-preflight-proof.sh
      - name: Node syntax
        run: node --check scripts/prove_void_mainnet0_crossbox_peer_safety_v1.mjs
      - name: Prove explicit cross-box peer safety
        run: node scripts/prove_void_mainnet0_crossbox_peer_safety_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
