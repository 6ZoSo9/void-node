name: steam-readonly-bridge-bootstrap-v3

on:
  pull_request:
    paths:
      - "src/index.ts"
      - "src/http/steam_readonly_bridge_bootstrap_v3.ts"
      - "scripts/prove_steam_readonly_bridge_bootstrap_v3.ts"
      - "docs/integrations/steam-readonly-bridge-bootstrap-v3.md"
      - ".github/workflows/steam-readonly-bridge-bootstrap-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck node source
        run: npm run typecheck
      - name: Typecheck Steam bootstrap v3 scope
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --target ES2022
          --lib ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --strict
          --esModuleInterop
          --skipLibCheck
          --types node
          src/integrations/steam_readonly_bridge_v1.ts
          src/http/steam_readonly_bridge_runtime_v2.ts
          src/http/steam_readonly_bridge_bootstrap_v3.ts
          scripts/prove_steam_readonly_bridge_bootstrap_v3.ts
      - name: Reprove Steam runtime v2
        run: >-
          ./node_modules/.bin/tsx
          scripts/prove_steam_readonly_bridge_runtime_v2.ts
      - name: Prove Steam bootstrap v3
        run: >-
          ./node_modules/.bin/tsx
          scripts/prove_steam_readonly_bridge_bootstrap_v3.ts
