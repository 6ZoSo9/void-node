name: VOID economic epoch2 Besu capability v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-besu-capability-v1.yml"
      - "scripts/prove_void_economic_epoch2_besu_capability_v1.mjs"
      - "contracts/epoch2/VoidEpoch2TokenV1.sol"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-besu-capability-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-besu-qbft-free-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove Besu 26.8.1 QBFT free-gas capability
        env:
          BESU_IMAGE: hyperledger/besu:26.8.1
          FOUNDRY_IMAGE: ghcr.io/foundry-rs/foundry:v1.7.1
        run: |
          set -Eeuo pipefail

          work="$RUNNER_TEMP/void-besu-capability-v1"
          validator="$work/validator"
          foundry_home="$work/foundry-home"
          foundry_cache="$work/foundry-cache"
          foundry_out="$work/foundry-out"
          foundry_project="$work/foundry-project"
          mkdir -p             "$validator"             "$foundry_home"             "$foundry_cache"             "$foundry_out"             "$foundry_project/contracts/epoch2"
          chmod 0777 "$validator"

          cleanup() {
            docker rm -f void-besu-capability-v1 >/dev/null 2>&1 || true
            rm -f "$work/fixture.json"
          }
          trap cleanup EXIT INT TERM

          docker pull "$BESU_IMAGE"
          docker pull "$FOUNDRY_IMAGE"

          BESU_REPODIGEST="$(docker inspect             --format='{{index .RepoDigests 0}}'             "$BESU_IMAGE")"
          test -n "$BESU_REPODIGEST"

          umask 077
          openssl rand -hex 32 > "$validator/key"
          chmod 0444 "$validator/key"
          test "$(wc -c < "$validator/key")" -eq 65

          docker run --rm             -v "$validator:/data"             "$BESU_IMAGE"             --data-path=/data             public-key export-address             --to=/data/address

          validator_address="$(tr -d '\r\n ' < "$validator/address" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$validator_address" | grep -Ec '^0x[0-9a-f]{40}$')" = "1"

          printf '["%s"]\n' "$validator_address" > "$work/validators.json"

          docker run --rm             -v "$work:/work:ro"             "$BESU_IMAGE"             rlp encode             --from=/work/validators.json             --type=QBFT_EXTRA_DATA             > "$work/extraData.txt"

          extra_data="$(tail -n 1 "$work/extraData.txt" | tr -d '\r\n ')"
          test "$(printf '%s' "$extra_data" | grep -Ec '^0x[0-9a-fA-F]+$')" = "1"

          install -m 0444             contracts/epoch2/VoidEpoch2TokenV1.sol             "$foundry_project/contracts/epoch2/VoidEpoch2TokenV1.sol"

          docker run --rm             --user "$(id -u):$(id -g)"             --entrypoint forge             -e HOME=/foundry-home             -v "$foundry_home:/foundry-home"             -v "$foundry_cache:/foundry-cache"             -v "$foundry_out:/foundry-out"             -v "$foundry_project:/proof:ro"             -w /proof             "$FOUNDRY_IMAGE"             inspect             contracts/epoch2/VoidEpoch2TokenV1.sol:VoidEpoch2TokenV1             deployedBytecode             --root /proof             --contracts contracts             --use 0.8.24             --evm-version paris             --out /foundry-out             --cache-path /foundry-cache             > "$work/token.runtime.hex"

          node scripts/prove_void_economic_epoch2_besu_capability_v1.mjs             prepare             "$work"             "$validator_address"             "$extra_data"             "$work/token.runtime.hex"

          docker run -d             --name void-besu-capability-v1             -p 127.0.0.1:18551:8545             -v "$validator:/data"             -v "$work/genesis.json:/config/genesis.json:ro"             "$BESU_IMAGE"             --data-path=/data             --genesis-file=/config/genesis.json             --network-id=2050             --rpc-http-enabled             --rpc-http-host=0.0.0.0             --rpc-http-port=8545             --rpc-http-api=ETH,NET,QBFT             '--host-allowlist=*'             --min-gas-price=0             --discovery-enabled=false             --p2p-host=127.0.0.1             --p2p-port=30303             --logging=INFO             --revert-reason-enabled=true

          for _ in $(seq 1 120); do
            if curl -fsS               -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'               http://127.0.0.1:18551/               | grep -q '"0x802"'
            then
              ready=true
              break
            fi
            sleep 0.5
          done
          test "${ready:-false}" = "true"

          node scripts/prove_void_economic_epoch2_besu_capability_v1.mjs             verify             http://127.0.0.1:18551/             "$work/fixture.json"             "$work/capability-result.json"

          docker logs void-besu-capability-v1             > "$work/besu.log" 2>&1

          node - "$work" "$BESU_REPODIGEST" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = require("node:path");

          const work = process.argv[2];
          const imageDigest = process.argv[3];
          const resultPath = path.join(work, "capability-result.json");
          const result = JSON.parse(fs.readFileSync(resultPath, "utf8"));

          if (result.status !== "BESU_QBFT_FREE_GAS_CAPABILITY_GREEN") {
            throw new Error("capability result not green");
          }
          if (!/^hyperledger\/besu@sha256:[0-9a-f]{64}$/.test(imageDigest)) {
            throw new Error("Besu image digest invalid");
          }

          const material = {
            ...result,
            besu_image: "hyperledger/besu:26.8.1",
            besu_image_repo_digest: imageDigest,
            source_commit: process.env.GITHUB_SHA,
            github_run_id: process.env.GITHUB_RUN_ID,
            github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          const canonical = (value) => {
            if (Array.isArray(value)) {
              return "[" + value.map(canonical).join(",") + "]";
            }
            if (value && typeof value === "object") {
              return (
                "{" +
                Object.keys(value)
                  .sort()
                  .map((key) => JSON.stringify(key) + ":" + canonical(value[key]))
                  .join(",") +
                "}"
              );
            }
            return JSON.stringify(value);
          };
          material.receipt_material_sha256 = crypto
            .createHash("sha256")
            .update(Buffer.from(canonical(material), "utf8"))
            .digest("hex");

          fs.writeFileSync(
            path.join(work, "void-economic-epoch2-besu-capability-v1.json"),
            JSON.stringify(material, null, 2) + "\n",
          );

          console.log("besu_image_repo_digest=" + imageDigest);
          console.log(
            "receipt_material_sha256=" + material.receipt_material_sha256,
          );
          console.log("production_client_capability_proven=true");
          console.log("production_client_selected=false");
          console.log("authoritative_chain2050_write=false");
          console.log("funds_movement=false");
          NODE

          test -s "$work/void-economic-epoch2-besu-capability-v1.json"

          rm -f "$work/fixture.json"
          test ! -e "$work/fixture.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload Besu capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-economic-epoch2-besu-capability-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/void-besu-capability-v1/void-economic-epoch2-besu-capability-v1.json
            ${{ runner.temp }}/void-besu-capability-v1/genesis.json
            ${{ runner.temp }}/void-besu-capability-v1/besu.log
          if-no-files-found: warn
          retention-days: 30
