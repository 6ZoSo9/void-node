name: VOID WC/VOID coupled opening v1

on:
  pull_request:
    paths:
      - "tools/void-wc-void-coupled-opening-v1.mjs"
      - "scripts/prove_void_wc_void_coupled_opening_v1.mjs"
      - "docs/operators/wc-void-coupled-opening-v1.md"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "docs/operators/wc-void-production-readiness-v1.md"
      - ".github/workflows/void-wc-void-coupled-opening-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-coupled-opening-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove WC/VOID coupled opening contract
        run: node scripts/prove_void_wc_void_coupled_opening_v1.mjs

      - name: Prove production readiness remains fail closed
        run: node scripts/prove_void_wc_void_production_readiness_v1.mjs

      - name: Diff hygiene
        run: git diff --check
