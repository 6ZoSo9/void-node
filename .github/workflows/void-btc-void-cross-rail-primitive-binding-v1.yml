name: VOID BTC VOID cross-rail primitive binding v1

on:
  pull_request:
    paths:
      - "tools/void-btc-void-cross-rail-primitive-binding-v1.mjs"
      - "scripts/prove_void_btc_void_cross_rail_primitive_binding_v1.mjs"
      - "docs/operators/btc-void-cross-rail-primitive-binding-v1.md"
      - ".github/workflows/void-btc-void-cross-rail-primitive-binding-v1.yml"
      - "tools/void-btc-void-bitcoin-htlc-v1.mjs"
      - "tools/void-btc-void-chain2050-hashlock-v1.mjs"
      - "contracts/mainnet/BtcVoidHashlockSettlementV1.sol"
      - "contracts/epoch2/VoidEpoch2TokenV1.sol"
  push:
    branches: [main]
    paths:
      - "tools/void-btc-void-cross-rail-primitive-binding-v1.mjs"
      - "scripts/prove_void_btc_void_cross_rail_primitive_binding_v1.mjs"
      - "docs/operators/btc-void-cross-rail-primitive-binding-v1.md"
      - ".github/workflows/void-btc-void-cross-rail-primitive-binding-v1.yml"
      - "tools/void-btc-void-bitcoin-htlc-v1.mjs"
      - "tools/void-btc-void-chain2050-hashlock-v1.mjs"
      - "contracts/mainnet/BtcVoidHashlockSettlementV1.sol"
      - "contracts/epoch2/VoidEpoch2TokenV1.sol"

permissions:
  contents: read

concurrency:
  group: void-btc-void-cross-rail-primitive-binding-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check tools/void-btc-void-cross-rail-primitive-binding-v1.mjs
          node --check scripts/prove_void_btc_void_cross_rail_primitive_binding_v1.mjs

      - name: Prove portable source binding semantics
        run: node scripts/prove_void_btc_void_cross_rail_primitive_binding_v1.mjs

      - name: Authority wall
        run: |
          set -euo pipefail
          tool="tools/void-btc-void-cross-rail-primitive-binding-v1.mjs"
          grep -F 'timeout_safety_observed: false' "$tool" >/dev/null
          grep -F 'asymmetric_cross_chain_timeout_margin_verified: false' "$tool" >/dev/null
          grep -F 'bitcoin_rpc_call: false' "$tool" >/dev/null
          grep -F 'chain2050_rpc_call: false' "$tool" >/dev/null
          grep -F 'contract_deployment: false' "$tool" >/dev/null
          grep -F 'transaction_broadcast: false' "$tool" >/dev/null
          grep -F 'funds_movement: false' "$tool" >/dev/null

      - name: Diff hygiene
        run: git diff --check

  exact-dual-compiler-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Rederive exact Chain-2050 dual-compiler identity
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/void-btc-void-cross-rail-binding"
          mkdir -p "$WORK"
          chmod 700 "$WORK"

          node tools/void-btc-void-chain2050-hashlock-v1.mjs \
            rederive \
            --source contracts/mainnet/BtcVoidHashlockSettlementV1.sol \
            --out "$WORK/chain2050-identity.json"

          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Bind exact compiler identity to Bitcoin HTLC contract
        run: |
          set -euo pipefail
          CHAIN_IDENTITY="$WORK/chain2050-identity.json" \
            node scripts/prove_void_btc_void_cross_rail_primitive_binding_v1.mjs

      - name: Preserve rederived compiler identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-btc-void-cross-rail-chain2050-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/void-btc-void-cross-rail-binding/chain2050-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check
