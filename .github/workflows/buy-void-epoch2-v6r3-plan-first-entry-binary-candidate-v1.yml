name: Buy VOID Epoch-2 V6R3 planner first-entry binary candidate V1

on:
  pull_request:
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_plan_first_entry_v1.c'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v1.yml'
  push:
    branches: [ main ]
    paths:
      - 'ops/precision/void_buy_void_epoch2_v6r3_plan_first_entry_v1.c'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v1.py'
      - 'docs/operators/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v1.md'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v1.yml'

permissions:
  contents: read

concurrency:
  group: buy-void-e2-v6r3-first-entry-bin-candidate-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    name: derive candidate / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Derive candidate report
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v1.py             --derive "$RUNNER_TEMP/candidate.json"
          cat "$RUNNER_TEMP/candidate.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-e2-v6r3-plan-first-entry-candidate-${{ matrix.lane }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: compare three candidate reports
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Download candidate reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: void-e2-v6r3-plan-first-entry-candidate-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false
      - name: Require byte-identical hosted candidates
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v1.py --self-test
          python3 -I -B scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v1.py             --compare-dir "$RUNNER_TEMP/candidates"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
