name: VOID PR1110 bounded semantic finalizer v2

on:
  pull_request:
    paths:
      - .github/workflows/tmp-pr1110-chain2050-result-boundary-apply-v1.yml
      - .github/workflows/tmp-pr1110-chain2050-result-boundary-diagnostic-v1.yml
      - .github/workflows/tmp-pr1110-chain2050-result-boundary-runner-v1.yml
      - .github/workflows/tmp-pr1110-semantic-extract-runner-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/buy-void-chain2050-transport-result-boundary-v1-20260808'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR staging head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Reconstruct prove and publish exact three-file patch
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          BASE='7d2ea5a633b29d08432190543e2ff2d5a82ed082'
          BRANCH='fix/buy-void-chain2050-transport-result-boundary-v1-20260808'
          HELPER='.github/workflows/tmp-pr1110-chain2050-result-boundary-apply-v1.yml'
          DIAGNOSTIC='.github/workflows/tmp-pr1110-chain2050-result-boundary-diagnostic-v1.yml'
          RUNNER='.github/workflows/tmp-pr1110-chain2050-result-boundary-runner-v1.yml'
          FINALIZER='.github/workflows/tmp-pr1110-semantic-extract-runner-v2.yml'
          SOURCE='src/economic/buy_void_native_chain2050_broadcaster_v1.ts'
          PROOF='scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts'
          GUARD='scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts'

          test "${GITHUB_HEAD_REF:-}" = "$BRANCH"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "HEAD:$HELPER")" = '9c5661b430f2c5e9ec7fba2fc4c6df389986b3fe'
          test "$(git rev-parse "$BASE:$SOURCE")" = '6bb2912ee0e89839bf83ce6663234614a756518c'
          test "$(git rev-parse "$BASE:$PROOF")" = 'b2a83e37ece3550d6f351290eff0e938940b8c7c'
          test "$(git rev-parse "$BASE:$GUARD")" = 'fe9b7edea8c94be9df68cd85595ac9f0d242eda0'
          expected_staging="$(printf '%s\n' "$HELPER" "$DIAGNOSTIC" "$RUNNER" "$FINALIZER" | sort)"
          actual_staging="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual_staging" = "$expected_staging"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/tmp-pr1110-chain2050-result-boundary-apply-v1.yml')
          lines = helper.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'"]
          if len(starts) != 1:
              raise SystemExit('HOLD: semantic Python block start not unique')
          start = starts[0] + 1
          ends = [i for i in range(start, len(lines)) if lines[i].strip() == 'PY']
          if not ends:
              raise SystemExit('HOLD: semantic Python block end missing')
          body = textwrap.dedent('\n'.join(lines[start:ends[0]])) + '\n'
          Path('/tmp/pr1110-semantic-patch.py').write_text(body)
          PY
          python3 /tmp/pr1110-semantic-patch.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts')
          text = path.read_text()
          old = (
              "        const next = queue.shift();\n"
              "        assert.ok(next, `missing synthetic response for ${input.method}`);\n"
              "        if (next instanceof Error) throw next;\n"
          )
          new = (
              "        const next = queue.shift();\n"
              "        if (next === undefined) {\n"
              "          throw new Error(`missing synthetic response for ${input.method}`);\n"
              "        }\n"
              "        if (next instanceof Error) throw next;\n"
          )
          if text.count(old) != 1:
              raise SystemExit('HOLD: queue missing-response anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

          expected_semantic="$(printf '%s\n' "$GUARD" "$PROOF" "$SOURCE" | sort)"
          expected_working="$(printf '%s\n' "$HELPER" "$DIAGNOSTIC" "$RUNNER" "$FINALIZER" "$GUARD" "$PROOF" "$SOURCE" | sort)"
          actual_working="$(git diff --name-only "$BASE" | sort)"
          test "$actual_working" = "$expected_working"
          git diff --check "$BASE"

          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx "$PROOF"
          npx --no-install tsx "$GUARD"
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts
          npm run typecheck
          npm run build

          git rm -- "$HELPER" "$DIAGNOSTIC" "$RUNNER" "$FINALIZER"
          git add -- "$SOURCE" "$PROOF" "$GUARD"
          test "$(git diff --name-only "$BASE" | sort)" = "$expected_semantic"
          git diff --check "$BASE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate chain2050 transport results at runtime'

          test "$(git diff --name-only "$BASE" HEAD | sort)" = "$expected_semantic"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/tmp-pr1110-' || true)"
          git push origin "HEAD:$BRANCH"
