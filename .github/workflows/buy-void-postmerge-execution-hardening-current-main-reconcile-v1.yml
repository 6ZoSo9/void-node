name: Buy VOID postmerge execution hardening current-main reconcile v1

on:
  push:
    branches:
      - fix/buy-void-postmerge-execution-reconciliation-hardening-v1-20260809
    paths:
      - ".github/workflows/buy-void-postmerge-execution-hardening-current-main-reconcile-v1.yml"

permissions:
  contents: write

concurrency:
  group: buy-void-postmerge-execution-hardening-current-main-reconcile-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify exact carrier, semantic parent, and current main
        shell: bash
        env:
          SEMANTIC_PARENT: 8438d78ab0b4152fadc5925bb8b01758bcca992b
          EXPECTED_MAIN: ee3d3037159e259d8726f6bf5018373d2edc96d7
          BRANCH: fix/buy-void-postmerge-execution-reconciliation-hardening-v1-20260809
          CARRIER: .github/workflows/buy-void-postmerge-execution-hardening-current-main-reconcile-v1.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SEMANTIC_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = "$CARRIER"

          remote_branch="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "trigger_head=$GITHUB_SHA"
          echo "remote_branch=$remote_branch"
          echo "expected_main=$EXPECTED_MAIN"
          echo "remote_main=$remote_main"
          test "$remote_branch" = "$GITHUB_SHA"
          test "$remote_main" = "$EXPECTED_MAIN"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          merge_base="$(git merge-base "$SEMANTIC_PARENT" "$EXPECTED_MAIN")"
          echo "merge_base=$merge_base"

          semantic_paths=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )

          allowed() {
            local candidate="$1"
            local path
            for path in "${semantic_paths[@]}"; do
              [[ "$candidate" = "$path" ]] && return 0
            done
            return 1
          }

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            allowed "$path" || {
              echo "HOLD: current main moved through non-semantic path: $path"
              exit 1
            }
          done < <(git diff --name-only "$merge_base..$EXPECTED_MAIN")

          expected_semantic="$(printf '%s\n' "${semantic_paths[@]}" | sort)"
          actual_semantic="$(git diff --name-only "$merge_base..$SEMANTIC_PARENT" | sort)"
          if [[ "$actual_semantic" != "$expected_semantic" ]]; then
            echo "HOLD: semantic parent scope mismatch"
            echo "--- expected ---"
            printf '%s\n' "$expected_semantic"
            echo "--- actual ---"
            printf '%s\n' "$actual_semantic"
            exit 1
          fi

          : > /tmp/void-semantic-blobs.txt
          for path in "${semantic_paths[@]}"; do
            blob="$(git rev-parse "$SEMANTIC_PARENT:$path")"
            printf '%s %s\n' "$blob" "$path" >> /tmp/void-semantic-blobs.txt
          done
          cat /tmp/void-semantic-blobs.txt

      - name: Merge exact main and preserve reviewed semantic blobs
        shell: bash
        env:
          EXPECTED_MAIN: ee3d3037159e259d8726f6bf5018373d2edc96d7
        run: |
          set -euo pipefail
          semantic_paths=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )

          allowed() {
            local candidate="$1"
            local path
            for path in "${semantic_paths[@]}"; do
              [[ "$candidate" = "$path" ]] && return 0
            done
            return 1
          }

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          merge_rc=$?
          set -e
          echo "merge_rc=$merge_rc"

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            allowed "$path" || {
              echo "HOLD: unexpected merge conflict: $path"
              git merge --abort || true
              exit 1
            }
            git checkout --ours -- "$path"
            git add -- "$path"
          done

          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "HOLD: unresolved merge conflicts remain"
            git merge --abort || true
            exit 1
          }

          while read -r expected_blob path; do
            actual_blob="$(git hash-object -- "$path")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "HOLD: semantic blob drift during merge: $path"
              echo "expected=$expected_blob"
              echo "actual=$actual_blob"
              git merge --abort || true
              exit 1
            fi
          done < /tmp/void-semantic-blobs.txt

          git diff --check
          git diff --cached --check

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            scripts/buy_void_production_native_execution_operator_v1.ts \
            scripts/prove_buy_void_production_native_execution_operator_v1.ts \
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts \
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts

      - name: Prove native execution hardening wall
        run: |
          npx --no-install tsx scripts/prove_buy_void_production_native_execution_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_runtime_guard_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_worker_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_execution_nonce_fee_planner_v1.ts
          npx --no-install tsx scripts/prove_buy_void_delivery_submission_guard_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_preflight_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_activation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
          npx --no-install tsx scripts/prove_buy_void_synthetic_end_to_end_fulfillment_rehearsal_v1.ts

      - name: Prove broadcast reconciliation hardening wall
        run: |
          npx --no-install tsx scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_production_native_execution_operator_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_broadcast_reconciliation_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_runtime_integration_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts

      - name: Repository typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Commit exact reconciliation, retire carrier, and verify final scope
        shell: bash
        env:
          SEMANTIC_PARENT: 8438d78ab0b4152fadc5925bb8b01758bcca992b
          EXPECTED_MAIN: ee3d3037159e259d8726f6bf5018373d2edc96d7
          BRANCH: fix/buy-void-postmerge-execution-reconciliation-hardening-v1-20260809
          CARRIER: .github/workflows/buy-void-postmerge-execution-hardening-current-main-reconcile-v1.yml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Merge exact main after Buy VOID native plan binding"
          merge_sha="$(git rev-parse HEAD)"
          echo "merge_sha=$merge_sha"
          test "$(git rev-parse HEAD^1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN"

          git rm -- "$CARRIER"
          git commit -m "chore: retire Buy VOID postmerge reconciliation carrier"
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=$final_sha"

          semantic_paths=(
            docs/operators/buy-void-production-native-execution-operator-v1.md
            scripts/buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/buy_void_production_native_execution_operator_v1.ts
            scripts/prove_buy_void_native_execution_runtime_v1.ts
            scripts/prove_buy_void_production_broadcast_reconciliation_operator_v1.ts
            scripts/prove_buy_void_production_native_execution_operator_v1.ts
            src/economic/buy_void_native_execution_runtime_v1.ts
          )
          expected="$(printf '%s\n' "${semantic_paths[@]}" | sort)"
          actual="$(git diff --name-only "$EXPECTED_MAIN..HEAD" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "HOLD: final semantic scope mismatch"
            echo "--- expected ---"
            printf '%s\n' "$expected"
            echo "--- actual ---"
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check "$EXPECTED_MAIN..HEAD"

          while read -r expected_blob path; do
            actual_blob="$(git rev-parse "HEAD:$path")"
            test "$actual_blob" = "$expected_blob" || {
              echo "HOLD: final semantic blob drift: $path"
              exit 1
            }
          done < /tmp/void-semantic-blobs.txt

          remote_branch="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "remote_branch_before_push=$remote_branch"
          echo "remote_main_before_push=$remote_main"
          test "$remote_branch" = "$GITHUB_SHA"
          test "$remote_main" = "$EXPECTED_MAIN"

          git push origin "HEAD:refs/heads/$BRANCH"
