name: chain2050-role-authority-registry-source-v1

on:
  pull_request:
    paths:
      - ".github/workflows/chain2050-role-authority-registry-source-v1.yml"
      - "contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"
      - "test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol"
      - "src/security/chain2050_role_authority_contract_projection_v1.ts"
      - "scripts/prove_chain2050_role_authority_contract_projection_v1.ts"
      - "docs/security/chain2050-role-authority-registry-source-v1.md"
      - "src/security/chain2050_role_authority_record_v1.ts"
      - "src/security/chain2050_role_authority_registry_v1.ts"
      - "src/security/chain2050_role_authority_read_adapter_v1.ts"
      - "src/security/chain2050_role_authority_registry_read_source_binding_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chain2050-role-authority-registry-source-v1.yml"
      - "contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"
      - "test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol"
      - "src/security/chain2050_role_authority_contract_projection_v1.ts"
      - "scripts/prove_chain2050_role_authority_contract_projection_v1.ts"
      - "docs/security/chain2050-role-authority-registry-source-v1.md"
      - "src/security/chain2050_role_authority_record_v1.ts"
      - "src/security/chain2050_role_authority_registry_v1.ts"
      - "src/security/chain2050_role_authority_read_adapter_v1.ts"
      - "src/security/chain2050_role_authority_registry_read_source_binding_v1.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain2050-role-authority-registry-source-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove canonical contract projection
        run: |
          npx --no-install tsx \
            scripts/prove_chain2050_role_authority_contract_projection_v1.ts
          npm run typecheck

      - name: Run self-contained Foundry registry suite
        env:
          FOUNDRY_IMAGE: ghcr.io/foundry-rs/foundry:v1.7.1
        run: |
          set -Eeuo pipefail

          FOUNDRY_HOME="$RUNNER_TEMP/void-role-authority-foundry-home"
          FOUNDRY_OUT="$RUNNER_TEMP/void-role-authority-foundry-out"
          FOUNDRY_CACHE="$RUNNER_TEMP/void-role-authority-foundry-cache"
          FOUNDRY_PROJECT="$RUNNER_TEMP/void-role-authority-foundry"

          mkdir -p \
            "$FOUNDRY_HOME" \
            "$FOUNDRY_OUT" \
            "$FOUNDRY_CACHE" \
            "$FOUNDRY_PROJECT/contracts/mainnet0" \
            "$FOUNDRY_PROJECT/test/mainnet0"

          install -m 0444 \
            contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol \
            "$FOUNDRY_PROJECT/contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"
          install -m 0444 \
            test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol \
            "$FOUNDRY_PROJECT/test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol"

          cmp \
            contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol \
            "$FOUNDRY_PROJECT/contracts/mainnet0/VoidChain2050RoleAuthorityRegistryV1.sol"
          cmp \
            test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol \
            "$FOUNDRY_PROJECT/test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol"

          docker pull "$FOUNDRY_IMAGE"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint forge \
            -e HOME=/foundry-home \
            -v "$FOUNDRY_HOME:/foundry-home" \
            -v "$FOUNDRY_OUT:/foundry-out" \
            -v "$FOUNDRY_CACHE:/foundry-cache" \
            -v "$FOUNDRY_PROJECT:/proof:ro" \
            -w /proof \
            "$FOUNDRY_IMAGE" \
            test \
            --root /proof \
            --contracts contracts \
            --match-path \
              test/mainnet0/VoidChain2050RoleAuthorityRegistryV1.t.sol \
            --use 0.8.20 \
            --evm-version paris \
            --out /foundry-out \
            --cache-path /foundry-cache \
            -vvv

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
