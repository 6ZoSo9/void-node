name: Buy VOID Epoch-2 repaired V6 bootstrap installed qualification v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired qualification generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="4658a7d6650225d0bfb66e7868cef5646245d6c7"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py)" = \
            04c7ca5f0d96dcb60faeae8cf4d712435ad65466
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py)" = \
            498ca198461e2d9b263869559a9b36274c55afe5
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-bootstrap-repaired-installed-qualification-v1.md)" = \
            409baf527ac9903e13bb9c4dbb58842420800c36

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py)" = \
            7d70527d8910881f9973479b89ceef78789ad100
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_v1.py)" = \
            9e0b997230943b1ad0a0285e74e82faf049d7d31
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py)" = \
            ed1f1aeb5fadf0d1ab6e3644a11a7d34c3356e78
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_atomic_upgrade_plan_v1.py)" = \
            e695ceed29f61f08f480d4dafaad7cc6635adf81

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py",
          ):
              compile(
                  Path(relative).read_text("utf-8"),
                  relative,
                  "exec",
                  dont_inherit=True,
              )
          print("VOID_BUY_VOID_EPOCH2_REPAIRED_V6_INSTALLED_QUALIFICATION_SYNTAX_GREEN")
          PY

      - name: Prove repaired installed qualification
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
          out="$RUNNER_TEMP/repaired-v6-installed-qualification-proof.log"
          python3 -I -B "$proof" | tee "$out"

          markers=(
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_BOOTSTRAP_V6_REPAIRED_INSTALLED_QUALIFICATION_V1_PROOF_GREEN'
            'target_blob_bound=true'
            'workflow_dispatch_exact_parent_bound=true'
            'workflow_dispatch_first_parent_inference_absent=true'
            'repaired_upgrader_generation_bound=true'
            'nonexecuting_upgrade_plan_generation_bound=true'
            'green_state_classifier_reused=true'
            'repaired_fixed_root_reverified=true'
            'retained_predecessor_reverified=true'
            'upgrade_stage_absence_required=true'
            'temporary_git_metadata_cleanup_required=true'
            'source_repository_mutation=false'
            'upgrader_collect_absent=true'
            'upgrader_apply_absent=true'
            'temporary_git_metadata_write_required=true'
            'qualification_git_callbacks_neutralized=true'
            'qualification_git_fsmonitor_callback_rejected=true'
            'repaired_plan_immutable_handoff_bound=true'
            'nonroot_run_required=true'
            'protected_filesystem_mutation=false'
            'bootstrap_execution=false'
            'inner_installer_execution=false'
            'service_mutation=false'
            'credential_access=false'
            'private_key_access=false'
            'signing=false'
            'transaction=false'
            'rpc_call=false'
            'payment_acceptance=false'
            'public_presale_activation=false'
            'wc_void_market_activation=false'
            'treasury_liquidity_action=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

      - name: Verify source-only qualification plan
        run: |
          set -euo pipefail
          target="ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_bootstrap_repaired_installed_qualification_v1.py"
          out="$RUNNER_TEMP/repaired-v6-installed-qualification-source-plan.log"
          python3 -I -B "$target" --source-plan | tee "$out"

          markers=(
            'mode=source-plan'
            'source_only=true'
            'host_read=false'
            'host_write=false'
            'upgrader_git_blob_sha1=7d70527d8910881f9973479b89ceef78789ad100'
            'upgrade_plan_git_blob_sha1=ed1f1aeb5fadf0d1ab6e3644a11a7d34c3356e78'
            'repaired_fixed_root_required=true'
            'retained_predecessor_required=true'
            'upgrade_stage_absent_required=true'
            'temporary_git_metadata_boundary_explicit=true'
            'temporary_git_metadata_write_required=true'
            'qualification_git_callbacks_neutralized=true'
            'nonroot_run_required=true'
            'protected_filesystem_mutation=false'
            'bootstrap_execution=false'
            'inner_installer_execution=false'
            'service_mutation=false'
            'credential_access=false'
            'funds_movement=false'
          )
          for marker in "${markers[@]}"; do grep -Fx "$marker" "$out"; done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
