name: Apollyon activation credential transport contract v1

on:
  pull_request:
    paths:
      - "tools/apollyon-training-activation-credential-transport-contract-v1.mjs"
      - "scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs"
      - "docs/security/apollyon-training-activation-credential-transport-contract-v1.md"
      - ".github/workflows/apollyon-training-activation-credential-transport-contract-v1.yml"
      - "tools/apollyon-training-activation-capability-contract-v1.mjs"
      - "scripts/prove_apollyon_training_activation_capability_contract_v1.mjs"
      - "docs/security/apollyon-training-activation-capability-contract-v1.md"
      - ".github/workflows/apollyon-training-activation-capability-contract-v1.yml"
      - "ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py"
      - "ops/xiphos/void-apollyon-training-bus-isolation-v1.service"
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
  push:
    branches: [main]
    paths:
      - "tools/apollyon-training-activation-credential-transport-contract-v1.mjs"
      - "scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs"
      - "docs/security/apollyon-training-activation-credential-transport-contract-v1.md"
      - ".github/workflows/apollyon-training-activation-credential-transport-contract-v1.yml"
      - "tools/apollyon-training-activation-capability-contract-v1.mjs"
      - "scripts/prove_apollyon_training_activation_capability_contract_v1.mjs"
      - "docs/security/apollyon-training-activation-capability-contract-v1.md"
      - ".github/workflows/apollyon-training-activation-capability-contract-v1.yml"
      - "ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py"
      - "ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py"
      - "ops/xiphos/void-apollyon-training-bus-isolation-v1.service"
      - "ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact source and accepted parent
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"

          # Two distinct identities: frozen historical V1 source lineage and
          # current non-authoritative source-review parent. Never substitute one.
          historical_parent=d00ca0141db62d752be7ddc6e7d9618e0475d897
          current_parent=c4997641b4ef8f06d2be9667d308a585839b6e4e
          historical_capability_head=d6670d8dd6185d034c9b07ef3a29390add63ee21
          git merge-base --is-ancestor "$historical_parent" "$current_parent"
          git merge-base --is-ancestor "$historical_parent" "$historical_capability_head"
          git merge-base --is-ancestor "$current_parent" "$HEAD"
          git merge-base --is-ancestor "$historical_capability_head" "$HEAD"
          test "$(git rev-parse "${historical_capability_head}:tools/apollyon-training-activation-capability-contract-v1.mjs")" = bcb47a4b105b89a459a4ea876b03f057450371c5
          test "$(git rev-parse "${historical_capability_head}:scripts/prove_apollyon_training_activation_capability_contract_v1.mjs")" = ff4abd9e709f9b1e9b8df533c619be4724409941
          test "$(git rev-parse "${historical_capability_head}:docs/security/apollyon-training-activation-capability-contract-v1.md")" = e061865a9cf4c4f7a0aa3eea424dd7d581844809
          test "$(git rev-parse "${historical_capability_head}:.github/workflows/apollyon-training-activation-capability-contract-v1.yml")" = 519b4f1651f8a02d23c8bd95617ce2692db62153
          test "$(git rev-parse "${current_parent}:ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py")" = b57457435cc691ce576ef090e67ba323af254929
          test "$(git rev-parse "${current_parent}:ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py")" = 87fa30d10d8d18716cd37ee2d375f0a1d094bdcf
          test "$(git rev-parse "${current_parent}:ops/xiphos/apollyon_live_custody_reviewed_root_v2_upgrade_v1.py")" = 95b2f64562e995611807aac7f9b8b044775f203b
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py)" = 87fa30d10d8d18716cd37ee2d375f0a1d094bdcf
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_live_custody_reviewed_root_v2_upgrade_v1.py)" = 95b2f64562e995611807aac7f9b8b044775f203b
          echo 'historical_capability_source_identity_bound=true'
          echo 'current_retired_parent_source_identity_bound=true'

          test "$(git rev-parse HEAD:tools/apollyon-training-activation-credential-transport-contract-v1.mjs)" = 735ffbe9c765ace594a664851a5e48f79c2ef3b6
          test "$(git rev-parse HEAD:scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs)" = b59f1a5c68567a4ea5933d92db89967411ed4c68
          test "$(git rev-parse HEAD:docs/security/apollyon-training-activation-credential-transport-contract-v1.md)" = d421cf6a7900fbe6377c00f2c71227164d79ed94
          test "$(git rev-parse HEAD:tools/apollyon-training-activation-capability-contract-v1.mjs)" = 7af22ba4e4374a5da490d909c32525a68bf0c5d2
          test "$(git rev-parse HEAD:scripts/prove_apollyon_training_activation_capability_contract_v1.mjs)" = a3b93893ab36437c4d5c819e2bef2650157c959a
          test "$(git rev-parse HEAD:docs/security/apollyon-training-activation-capability-contract-v1.md)" = de24249f7c541a6bb7c7db8cc8d020d299a44e74
          test "$(git rev-parse HEAD:.github/workflows/apollyon-training-activation-capability-contract-v1.yml)" = e6e8ebc9924df2bff0dc7bff28931dd76e28d402
          external_consumption_ref=refs/heads/ren/apollyon-training-start-consumption-contract-v1-20261016
          external_consumption_head=bdadfcc6854d6f4e1804347e51b940e897a8da9f
          external_consumption_blob=42d7d5d4ab75bfd4fc145f63c2a0432f9bcf9bd3
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags --depth=1 origin "$external_consumption_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$external_consumption_head"
          test "$(git cat-file -t FETCH_HEAD)" = commit
          test "$(git rev-parse FETCH_HEAD:tools/apollyon-training-start-consumption-contract-v1.mjs)" = "$external_consumption_blob"

          test "$(git rev-parse HEAD:ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py)" = b57457435cc691ce576ef090e67ba323af254929
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py)" = 352bd36f2b07091140b990de4170f708eb11fee6
          test "$(git rev-parse HEAD:ops/xiphos/void-apollyon-training-bus-isolation-v1.service)" = 62fbabe1cf7ae0d940f5d96e19b06282f841267b
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_training_bus_isolation_preentry_v1.c)" = 9503d19c8bc0b4f073ba117f6a547d339b7623d0

          git merge-base --is-ancestor c4997641b4ef8f06d2be9667d308a585839b6e4e "$HEAD"
          case "$EVENT_NAME" in
            pull_request)
              { test "$PR_BASE" = 16566518b0ae1da06e6e35f16929d9cf9e99b16b || test "$PR_BASE" = 0ada7fde0d90c3946b10693f4621cbd690bfcde6; }
              base="$PR_BASE"
              expected="$RUNNER_TEMP/expected.txt"
              actual="$RUNNER_TEMP/actual.txt"
              printf '%s\n' \
                '.github/workflows/apollyon-installed-training-bus-isolation-qualification-v2.yml' \
                '.github/workflows/apollyon-live-custody-reviewed-root-v2-upgrade-v1.yml' \
                '.github/workflows/apollyon-live-custody-source-session-create-only-install-v1.yml' \
                '.github/workflows/apollyon-training-activation-capability-contract-v1.yml' \
                '.github/workflows/apollyon-training-activation-credential-transport-contract-v1.yml' \
                'docs/security/apollyon-installed-training-bus-isolation-qualification-v2.md' \
                'docs/security/apollyon-live-custody-reviewed-root-v2-upgrade-v1.md' \
                'docs/security/apollyon-training-activation-capability-contract-v1.md' \
                'docs/security/apollyon-training-activation-credential-transport-contract-v1.md' \
                'ops/xiphos/apollyon-live-custody-reviewed-root-v2-upgrade-v1.json' \
                'ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py' \
                'ops/xiphos/apollyon_live_custody_reviewed_root_v2_upgrade_v1.py' \
                'ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py' \
                'ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py' \
                'scripts/prove_apollyon_installed_training_bus_isolation_qualification_v2.py' \
                'scripts/prove_apollyon_live_custody_reviewed_root_v2_upgrade_v1.py' \
                'scripts/prove_apollyon_live_custody_source_session_create_only_install_v1.py' \
                'scripts/prove_apollyon_training_activation_capability_contract_v1.mjs' \
                'scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs' \
                'tools/apollyon-training-activation-capability-contract-v1.mjs' \
                'tools/apollyon-training-activation-credential-transport-contract-v1.mjs' \
                | LC_ALL=C sort > "$expected"
              if [ "$PR_BASE" = 0ada7fde0d90c3946b10693f4621cbd690bfcde6 ]; then
                printf '%s\n' \
                '.github/workflows/apollyon-installed-training-bus-isolation-qualification-v1.yml' \
                '.github/workflows/apollyon-installed-training-bus-isolation-qualification-v2.yml' \
                '.github/workflows/apollyon-live-custody-reviewed-root-v2-upgrade-v1.yml' \
                '.github/workflows/apollyon-live-custody-source-session-create-only-install-v1.yml' \
                '.github/workflows/apollyon-training-activation-capability-contract-v1.yml' \
                '.github/workflows/apollyon-training-activation-credential-transport-contract-v1.yml' \
                'docs/security/apollyon-durable-attempt-claim-request-envelope-v2.md' \
                'docs/security/apollyon-durable-attempt-claim-store-host-plan-v2.md' \
                'docs/security/apollyon-durable-attempt-claim-store-service-source-candidate-v2.md' \
                'docs/security/apollyon-installed-training-bus-isolation-qualification-v1.md' \
                'docs/security/apollyon-installed-training-bus-isolation-qualification-v2.md' \
                'docs/security/apollyon-live-custody-reviewed-root-v2-upgrade-v1.md' \
                'docs/security/apollyon-training-activation-capability-contract-v1.md' \
                'docs/security/apollyon-training-activation-credential-transport-contract-v1.md' \
                'ops/xiphos/apollyon-custody-deployment-manifest-v1.json' \
                'ops/xiphos/apollyon-live-custody-reviewed-root-v2-upgrade-v1.json' \
                'ops/xiphos/apollyon_durable_attempt_claim_store_host_plan_v2.py' \
                'ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v1.py' \
                'ops/xiphos/apollyon_installed_training_bus_isolation_qualification_v2.py' \
                'ops/xiphos/apollyon_live_custody_reviewed_root_v2_upgrade_v1.py' \
                'ops/xiphos/apollyon_live_custody_source_session_create_only_install_v1.py' \
                'ops/xiphos/apollyon_live_custody_source_session_launcher_lifecycle_lock_v1.py' \
                'ops/xiphos/apollyon_live_custody_source_session_launcher_v2.py' \
                'scripts/prove_apollyon_candidate_training_attempt_claim_contract_v2.mjs' \
                'scripts/prove_apollyon_candidate_training_preclaim_v2.mjs' \
                'scripts/prove_apollyon_durable_attempt_claim_request_envelope_v2.mjs' \
                'scripts/prove_apollyon_durable_attempt_claim_store_contract_v2.mjs' \
                'scripts/prove_apollyon_durable_attempt_claim_store_host_plan_v2.py' \
                'scripts/prove_apollyon_durable_attempt_claim_store_service_source_candidate_v2.mjs' \
                'scripts/prove_apollyon_installed_training_bus_isolation_qualification_v1.py' \
                'scripts/prove_apollyon_installed_training_bus_isolation_qualification_v2.py' \
                'scripts/prove_apollyon_live_custody_reviewed_root_v2_upgrade_v1.py' \
                'scripts/prove_apollyon_live_custody_service_source_session_binding_v2.mjs' \
                'scripts/prove_apollyon_live_custody_source_session_create_only_install_v1.py' \
                'scripts/prove_apollyon_live_custody_source_session_execution_closure_v2.py' \
                'scripts/prove_apollyon_live_source_session_terminal_receipt_v2.mjs' \
                'scripts/prove_apollyon_training_activation_capability_contract_v1.mjs' \
                'scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs' \
                'tools/apollyon-candidate-training-attempt-claim-contract-v2.mjs' \
                'tools/apollyon-candidate-training-preclaim-v2.mjs' \
                'tools/apollyon-durable-attempt-claim-request-envelope-v2.mjs' \
                'tools/apollyon-durable-attempt-claim-store-contract-v2.mjs' \
                'tools/apollyon-durable-attempt-claim-store-service-source-candidate-v2.mjs' \
                'tools/apollyon-live-custody-service-source-session-binding-v2.mjs' \
                'tools/apollyon-live-source-session-terminal-receipt-v2.mjs' \
                'tools/apollyon-training-activation-capability-contract-v1.mjs' \
                'tools/apollyon-training-activation-credential-transport-contract-v1.mjs' \
                  | LC_ALL=C sort > "$expected"
              fi
              git diff --no-renames --name-only "$base" "$HEAD" -- | LC_ALL=C sort > "$actual"
              diff -u "$expected" "$actual"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git diff --check "$base" "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Reprove activation capability contract
        run: |
          set -euo pipefail
          node --check tools/apollyon-training-activation-capability-contract-v1.mjs
          node --check scripts/prove_apollyon_training_activation_capability_contract_v1.mjs
          node scripts/prove_apollyon_training_activation_capability_contract_v1.mjs | tee /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'VOID_APOLLYON_TRAINING_ACTIVATION_CAPABILITY_CONTRACT_V1_PROOF_GREEN' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'existing_training_start_consumption_contract_reused=true' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'activation_capability_issuance_performed=false' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'activation_secret_possession_proven=false' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'training_start_consumption_performed=false' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'training_release_authorized=false' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'training_execution_authorized=false' /tmp/apollyon-activation-capability-proof.txt
          grep -Fx 'funds_movement=false' /tmp/apollyon-activation-capability-proof.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove namespaced Proxy rejection without traps
        run: |
          set -euo pipefail
          timeout 20s node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            buildApollyonActivationCredentialTransportCandidateV1,
            qualifyApollyonActivationCredentialTransportCandidateV1,
          } from './tools/apollyon-training-activation-credential-transport-contract-v1.mjs';

          let trapCalls=0;
          const traps=Object.fromEntries(
            ['get','getPrototypeOf','ownKeys','getOwnPropertyDescriptor','has'].map(
              name=>[name,()=>{trapCalls++;throw new Error('proxy_trap_executed');}],
            ),
          );
          let cases=0;
          for(const fn of [
            buildApollyonActivationCredentialTransportCandidateV1,
            qualifyApollyonActivationCredentialTransportCandidateV1,
          ]){
            for(const kind of ['object','array']){
              for(const state of ['active','revoked','wrapped_revoked']){
                const target=kind==='array'?[]:{};
                const pair=Proxy.revocable(target,traps);
                if(state!=='active')pair.revoke();
                const input=state==='wrapped_revoked'?new Proxy(pair.proxy,traps):pair.proxy;
                assert.throws(
                  ()=>fn(input),
                  error=>error.constructor===Error&&
                    error.message==='apollyon_activation_credential_transport_schema_invalid',
                  fn.name+':'+kind+':'+state,
                );
                assert.equal(trapCalls,0);
                cases++;
              }
            }
          }
          assert.equal(cases,12);
          console.log('transport_proxy_rejection_cases=12');
          console.log('transport_revoked_proxy_namespaced_rejection=true');
          console.log('transport_proxy_traps_not_invoked=true');
          console.log('training_execution_authorized=false');
          console.log('service_action=false');
          JS

      - name: Prove flat primitive-only transport candidate
        run: |
          set -euo pipefail
          node --check tools/apollyon-training-activation-credential-transport-contract-v1.mjs
          node --check scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs
          node scripts/prove_apollyon_training_activation_credential_transport_contract_v1.mjs | tee /tmp/apollyon-activation-transport-proof.txt
          grep -Fx 'VOID_APOLLYON_TRAINING_ACTIVATION_CREDENTIAL_TRANSPORT_CONTRACT_V1_PROOF_GREEN' /tmp/apollyon-activation-transport-proof.txt
          for marker in \
            'exact_parent_capability_contract_blob_bound=true' \
            'historical_capability_parent_lineage_pinned=true' \
            'transport_candidate_content_addressed=true' \
            'parent_capability_candidate_consistency_proven=true' \
            'readdressed_parent_candidate_drift_rejected=true' \
            'raw_secret_field_rejected=true' \
            'fixed_credential_name_bound=true' \
            'bearer_secret_exact_32_bytes_required=true' \
            'run_scoped_transport_required=true' \
            'systemd_load_credential_candidate_only=true' \
            'systemd_runtime_transport_proven=false' \
            'protected_origin_validation_performed=false' \
            'protected_capability_issuance_performed=false' \
            'capability_replay_authorized=false' \
            'direct_systemd_start_authorized=false' \
            'credential_possession_proven=false' \
            'training_start_consumption_performed=false' \
            'unknown_and_hidden_keys_rejected=true' \
            'accessor_getter_not_invoked=true' \
            'proxy_traps_not_invoked=true' \
            'oversized_keyset_rejected_before_sort=true' \
            'service_action=false' \
            'training_execution_authorized=false' \
            'funds_movement=false'; do
              grep -Fx "$marker" /tmp/apollyon-activation-transport-proof.txt
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
