name: Buy VOID Epoch-2 V6R3 planner first-entry binary candidate lock V2

on:
  pull_request:
    paths:
      - 'ops/security/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.json'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_lock_v2.py'
      - 'docs/operators/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.md'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.yml'
      - 'ops/precision/void_buy_void_epoch2_v6r3_plan_first_entry_v1.c'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v2.py'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v2.yml'
  push:
    branches: [ main ]
    paths:
      - 'ops/security/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.json'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_lock_v2.py'
      - 'docs/operators/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.md'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-lock-v2.yml'
      - 'ops/precision/void_buy_void_epoch2_v6r3_plan_first_entry_v1.c'
      - 'scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_v2.py'
      - '.github/workflows/buy-void-epoch2-v6r3-plan-first-entry-binary-candidate-v2.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Syntax
        run: python3 -I -B -m py_compile scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_lock_v2.py
      - name: Exact lock proof
        run: python3 -I -B scripts/prove_buy_void_epoch2_v6r3_plan_first_entry_binary_candidate_lock_v2.py
      - name: Diff hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
