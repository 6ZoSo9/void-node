name: DataNet state-derived H1 reducer v1

on:
  pull_request:
    paths:
      - "src/storage/datanet_state_derived_h1_v1.ts"
      - "scripts/prove_datanet_state_derived_h1_v1.ts"
      - ".github/workflows/datanet-state-derived-h1-v1.yml"
      - "docs/datanet-state-derived-h1-v1.md"
  push:
    branches: [main]
    paths:
      - "src/storage/datanet_state_derived_h1_v1.ts"
      - "scripts/prove_datanet_state_derived_h1_v1.ts"
      - ".github/workflows/datanet-state-derived-h1-v1.yml"
      - "docs/datanet-state-derived-h1-v1.md"

permissions:
  contents: read

concurrency:
  group: datanet-state-derived-h1-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reducer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Focused typecheck
        run: >-
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext
          --types node --skipLibCheck
          src/storage/datanet_state_derived_h1_v1.ts
          scripts/prove_datanet_state_derived_h1_v1.ts
      - name: Prove history-independent reducer
        run: npx tsx scripts/prove_datanet_state_derived_h1_v1.ts
      - name: Diff hygiene
        run: git diff --check
