name: VOID native gas reconciliation custody source binding v1

on:
  pull_request:
    paths:
      - "package-lock.json"
      - "package.json"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_fulfillment_confirmation_v1.ts"
      - "src/economic/buy_void_fulfillment_journal_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
      - "src/economic/coupled_native_gas_effective_open_census_v1.ts"
      - "src/economic/coupled_native_gas_liability_reconciliation_v1.ts"
      - "src/economic/coupled_native_gas_liability_store_v1.ts"
      - "src/economic/coupled_native_gas_liability_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_evidence_resolver_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_storage_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_writer_v1.ts"
      - "src/economic/coupled_native_gas_terminal_cost_evidence_v1.ts"
      - "tools/void-buy-void-allocation-custody-preflight-v1.mjs"
      - "tools/void-coupled-native-gas-reconciliation-custody-host-evidence-v1.mjs"
      - "tsconfig.build.json"
      - "tools/void-coupled-native-gas-reconciliation-custody-source-binding-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v1.mjs"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-source-binding-v1.md"
      - ".github/workflows/coupled-native-gas-reconciliation-custody-source-binding-v1.yml"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "package.json"
      - "src/economic/buy_void_auto_fulfillment_v1.ts"
      - "src/economic/buy_void_broadcast_outcome_journal_v1.ts"
      - "src/economic/buy_void_execution_attempt_journal_v1.ts"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "src/economic/buy_void_fulfillment_confirmation_v1.ts"
      - "src/economic/buy_void_fulfillment_journal_v1.ts"
      - "src/economic/buy_void_prepared_transaction_plan_reservation_v1.ts"
      - "src/economic/coupled_native_gas_effective_open_census_v1.ts"
      - "src/economic/coupled_native_gas_liability_reconciliation_v1.ts"
      - "src/economic/coupled_native_gas_liability_store_v1.ts"
      - "src/economic/coupled_native_gas_liability_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_custody_qualification_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_evidence_resolver_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_storage_v1.ts"
      - "src/economic/coupled_native_gas_reconciliation_writer_v1.ts"
      - "src/economic/coupled_native_gas_terminal_cost_evidence_v1.ts"
      - "tools/void-buy-void-allocation-custody-preflight-v1.mjs"
      - "tools/void-coupled-native-gas-reconciliation-custody-host-evidence-v1.mjs"
      - "tsconfig.build.json"
      - "tools/void-coupled-native-gas-reconciliation-custody-source-binding-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v1.mjs"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-source-binding-v1.md"
      - ".github/workflows/coupled-native-gas-reconciliation-custody-source-binding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: source binding / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove exact source generation
        run: node scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v1.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
