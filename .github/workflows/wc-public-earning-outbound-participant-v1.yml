name: wc-public-earning-outbound-participant-v1

on:
  push:
    paths:
      - "src/economic/wc_public_earning_pilot_v1.ts"
      - "ops/mainnet0/wc-public-earning-participant-v1.sh"
      - "scripts/prove_wc_public_earning_outbound_participant_v1.ts"
      - ".github/workflows/wc-public-earning-outbound-participant-v1.yml"
  pull_request:
    paths:
      - "src/economic/wc_public_earning_pilot_v1.ts"
      - "ops/mainnet0/wc-public-earning-participant-v1.sh"
      - "scripts/prove_wc_public_earning_outbound_participant_v1.ts"
      - ".github/workflows/wc-public-earning-outbound-participant-v1.yml"

permissions:
  contents: read

jobs:
  outbound-participant-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve pilot and participant proofs
        run: |
          chmod +x ops/mainnet0/wc-public-earning-participant-v1.sh
          bash -n ops/mainnet0/wc-public-earning-participant-v1.sh
          npx tsx scripts/prove_wc_public_earning_pilot_v1.ts
          npx tsx scripts/prove_wc_public_earning_pilot_runtime_v1.ts
          npx tsx scripts/prove_wc_public_earning_participant_cli_v1.ts

      - name: Prove outbound-only participant transport
        run: npx tsx scripts/prove_wc_public_earning_outbound_participant_v1.ts

      - name: Guard index.ts size and markers
        run: |
          chmod +x tools/check_index_size.sh
          tools/check_index_size.sh

      - name: Build
        run: npm run build
