name: First External Agent Paid-Work to WC Public Evidence V1

on:
  pull_request:
    paths:
      - "docs/public-agent/evidence/first-external-agent-paid-work-to-wc-live-canary-v1/**"
      - "scripts/prove_first_external_agent_paid_work_to_wc_public_evidence_v1.ts"
      - ".github/workflows/first-external-agent-paid-work-to-wc-public-evidence-v1.yml"
  push:
    paths:
      - "docs/public-agent/evidence/first-external-agent-paid-work-to-wc-live-canary-v1/**"
      - "scripts/prove_first_external_agent_paid_work_to_wc_public_evidence_v1.ts"
      - ".github/workflows/first-external-agent-paid-work-to-wc-public-evidence-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes tsx scripts/prove_first_external_agent_paid_work_to_wc_public_evidence_v1.ts
