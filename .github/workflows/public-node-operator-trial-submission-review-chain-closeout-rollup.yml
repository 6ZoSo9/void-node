name: public-node-operator-trial-submission-review-chain-closeout-rollup

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-node-operator-trial-submission-review-chain-closeout-rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial submission review chain closeout rollup
        run: bash tools/check_public_node_operator_trial_submission_review_chain_closeout_rollup_v1.sh
