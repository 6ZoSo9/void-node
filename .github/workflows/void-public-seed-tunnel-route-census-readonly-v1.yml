name: VOID Public Seed Tunnel Route Census Readonly V1

on:
  pull_request:
    paths:
      - "ops/public/void_public_seed_tunnel_route_census_readonly_v1.sh"
      - "scripts/prove_void_public_seed_tunnel_route_census_readonly_v1.mjs"
      - "docs/operators/void-public-seed-tunnel-route-census-readonly-v1.md"
      - ".github/workflows/void-public-seed-tunnel-route-census-readonly-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/public/void_public_seed_tunnel_route_census_readonly_v1.sh"
      - "scripts/prove_void_public_seed_tunnel_route_census_readonly_v1.mjs"
      - "docs/operators/void-public-seed-tunnel-route-census-readonly-v1.md"
      - ".github/workflows/void-public-seed-tunnel-route-census-readonly-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and synthetic authority proof
        run: |
          bash -n ops/public/void_public_seed_tunnel_route_census_readonly_v1.sh
          node --check scripts/prove_void_public_seed_tunnel_route_census_readonly_v1.mjs
          bash ops/public/void_public_seed_tunnel_route_census_readonly_v1.sh --self-test
          node scripts/prove_void_public_seed_tunnel_route_census_readonly_v1.mjs
      - name: Diff hygiene
        run: git diff --check
