name: VOID attach block range bounds v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-attach-block-range-bounds-v1.yml"
      - "src/http/api_attach.ts"
      - "src/http/api_attach.js"
      - "scripts/prove_void_attach_block_range_bounds_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Attach range bounds / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate without stored Git credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check executable sources
        run: |
          set -euo pipefail
          node --check src/http/api_attach.js
          node --check scripts/prove_void_attach_block_range_bounds_v1.mjs
      - name: Prove attach range bounds
        run: node --import tsx scripts/prove_void_attach_block_range_bounds_v1.mjs
      - name: Typecheck source
        run: npm run typecheck
      - name: Diff hygiene
        run: git diff --check
