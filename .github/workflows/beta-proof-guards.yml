name: beta-proof-guards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta-proof-guards.yml'
      - '.github/workflows/self-hosted-beta-proof.yml'
      - '.ci/beta-proof-guards.sh'
      - 'Makefile'
      - 'PUBLIC_BETA.md'
      - 'README.md'
      - 'ops/public-beta-quickstart.sh'
      - 'ops/public-beta-preflight.sh'
      - 'ops/wc-wallet-isolated-proof.sh'
      - 'ops/install-path-status.sh'
      - 'ops/install-user-units.sh'
      - 'ops/install-devbox-ubuntu.sh'
      - 'ops/first-run-smoke.sh'
      - 'ops/BETA_BASELINE_2026-03-23.md'
      - 'ops/SELF_HOSTED_BETA_CI_PLAN.md'
  pull_request:
    paths:
      - '.github/workflows/beta-proof-guards.yml'
      - '.github/workflows/self-hosted-beta-proof.yml'
      - '.ci/beta-proof-guards.sh'
      - 'Makefile'
      - 'PUBLIC_BETA.md'
      - 'README.md'
      - 'ops/public-beta-quickstart.sh'
      - 'ops/public-beta-preflight.sh'
      - 'ops/wc-wallet-isolated-proof.sh'
      - 'ops/install-path-status.sh'
      - 'ops/install-user-units.sh'
      - 'ops/install-devbox-ubuntu.sh'
      - 'ops/first-run-smoke.sh'
      - 'ops/BETA_BASELINE_2026-03-23.md'
      - 'ops/SELF_HOSTED_BETA_CI_PLAN.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run beta proof guards
        run: bash .ci/beta-proof-guards.sh
