name: Buy VOID Epoch-2 protected-install bootstrap v2

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.md"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact V2 source generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              base="$PR_BASE"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
              base="$PUSH_BEFORE"
              ;;
            workflow_dispatch)
              base="$(git rev-parse "$EXPECTED_HEAD^1")"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$base" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.yml' \
            'docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.md' \
            'ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c' \
            'scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py' \
            | sort > "$expected"
          git diff --name-only "$base" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c)" = \
            19f9baf8d6d707da43dbd0e247667af1a10e46c5
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py)" = \
            8c0cacad398426fa886bcc72969fb1eab51d2177
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-dormant-first-entry-protected-install-bootstrap-v2.md)" = \
            645238bb9926cf0f755025d0be0214896c23471d

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py)" = \
            383b84e71b371de65579e4113469e86a59b807ab
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v1.c)" = \
            243583d4ed0522796b2bbf448abd4e9c28958f50

          git diff --check "$base" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove V2 runtime-head authentication boundary
        run: |
          set -euo pipefail
          proof="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py"
          python3 -I -B - <<'PY'
          from pathlib import Path
          relative="scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.py"
          compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_PROTECTED_INSTALL_BOOTSTRAP_V2_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/protected-install-bootstrap-v2-proof.log"
          python3 -I -B "$proof" | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_DORMANT_FIRST_ENTRY_PROTECTED_INSTALL_BOOTSTRAP_V2_PROOF_GREEN' \
            'merged_3391_installer_blob_bound=true' \
            'merged_3391_installer_sha256_bound=true' \
            'required_compile_generation_macros=true' \
            'production_bootstrap_static=true' \
            'production_bootstrap_no_pt_interp=true' \
            'production_bootstrap_no_dynamic_needed=true' \
            'exact_installer_snapshot_compile_bound=true' \
            'compile_time_expected_head_required=false' \
            'runtime_expected_head_strict_hex_required=true' \
            'runtime_expected_head_forwarded_to_authenticated_child=true' \
            'alternate_runtime_expected_head_forwarded=true' \
            'malformed_runtime_expected_head_rejected_prechild=true' \
            'sealed_installer_memfd_required=true' \
            'fixed_python_policy_bound=true' \
            'caller_stdin_rejected_prechild=true' \
            'wrong_confirmation_rejected_prechild=true' \
            'prelaunch_installer_substitution_rejected=true' \
            'python_policy_mismatch_rejected_prechild=true' \
            'hostile_loader_python_environment_removed=true' \
            'midchild_visible_installer_drift_withholds_green=true' \
            'sealed_snapshot_child_survives_visible_replacement=true' \
            'strict_plan_apply_argv=true' \
            'direct_root_python_authoritative=false' \
            'real_3391_apply_executed=false' \
            'precision_filesystem_mutation=false' \
            'protected_install_authorized=false' \
            'credential_access=false' \
            'signing=false' \
            'transaction=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'wc_void_market_activation=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
