name: VOID WC/VOID market vault deployer observer v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-wc-void-market-vault-deployer-observer-v1.yml"
      - "tools/void-wc-void-market-vault-deployment-observer-v1.mjs"
      - "scripts/prove_void_wc_void_market_vault_deployment_observer_v1.mjs"
      - "docs/operators/wc-void-market-vault-deployer-observer-v1.md"
      - "ops/mainnet0/wc-void-market-vault-deployer-offline-generation-evidence-v1.json"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "tools/void-wc-void-production-readiness-v1.mjs"
      - "scripts/prove_void_wc_void_production_readiness_v1.mjs"
      - "ops/mainnet0/wc-void-market-vault-deployment-preparation-v1.json"
      - "ops/mainnet0/wc-void-market-vault-v2-compiled-identity-v1.json"
      - "ops/mainnet0/wc-void-market-vault-v2-creation-bytecode.hex"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-wc-void-market-vault-deployer-observer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove read-only deployer observer
        run: node scripts/prove_void_wc_void_market_vault_deployment_observer_v1.mjs

      - name: Preserve production readiness HOLD
        run: node scripts/prove_void_wc_void_production_readiness_v1.mjs

      - name: Preserve role authorization
        run: node scripts/prove_void_wc_void_market_vault_role_binding_authorization_v1.mjs

      - name: Diff hygiene
        run: git diff --check
