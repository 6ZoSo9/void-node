name: VOID Buy request-root runtime-topology census v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v1.py"
      - "docs/operators/buy-void-request-root-runtime-topology-census-v1.md"
      - ".github/workflows/buy-void-request-root-runtime-topology-census-v1.yml"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_request_root_runtime_topology_census_v1.py"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v1.py"
      - "docs/operators/buy-void-request-root-runtime-topology-census-v1.md"
      - ".github/workflows/buy-void-request-root-runtime-topology-census-v1.yml"

permissions:
  contents: read

jobs:
  census:
    name: request-root runtime-topology census source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove collector
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/request-root-topology-proof.txt"
          {
            python3 -I -B ops/precision/void_buy_request_root_runtime_topology_census_v1.py --self-test
            python3 -I -B scripts/prove_void_buy_request_root_runtime_topology_census_v1.py
          } | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_REQUEST_ROOT_RUNTIME_TOPOLOGY_CENSUS_V1_PROOF_GREEN' "$proof"
          grep -Fx 'process_environment_access=false' "$proof"
          grep -Fx 'request_payment_contents_read=false' "$proof"
          grep -Fx 'loopback_get_only=true' "$proof"
          grep -Fx 'production_gate_ready=false' "$proof"
      - name: Prove inert plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/request-root-topology-plan.txt"
          python3 -I -B ops/precision/void_buy_request_root_runtime_topology_census_v1.py --plan | tee "$plan"
          grep -Fx 'read_only=true' "$plan"
          grep -Fx 'sudo_required=false' "$plan"
          grep -Fx 'filesystem_write=false' "$plan"
          grep -Fx 'process_environment_access=false' "$plan"
          grep -Fx 'request_payment_contents_read=false' "$plan"
          grep -Fx 'public_presale_activation=false' "$plan"
          grep -Fx 'funds_movement=false' "$plan"
      - name: Diff hygiene
        run: git diff --check
