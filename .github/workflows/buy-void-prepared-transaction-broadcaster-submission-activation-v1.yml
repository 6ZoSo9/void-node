name: Buy VOID broadcaster submission activation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-prepared-transaction-broadcaster-submission-activation-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-broadcaster-submission-activation-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "src/economic/buy_void_saga_execute_prepared_transaction_runtime_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_runtime_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-prepared-transaction-broadcaster-submission-activation-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-broadcaster-submission-activation-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "tools/buy-void-prepared-transaction-broadcaster-service-v1.mjs"
      - "src/economic/buy_void_prepared_transaction_chain2050_transport_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "src/economic/buy_void_saga_execute_prepared_transaction_runtime_v1.ts"
      - "src/economic/buy_void_saga_terminal_closeout_runtime_v1.ts"

permissions:
  contents: read

concurrency:
  group: buy-void-broadcaster-submission-activation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove submission-capable activation boundary
        run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
      - name: Preserve inspection-only activation boundary
        run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_inspection_activation_v1.ts
      - name: Preserve private broadcaster and chain-2050 semantics
        run: |
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_ipc_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_chain2050_composition_v1.ts
      - name: Preserve private custodian credential composition
        run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts
      - name: Preserve execute runtime and terminal closeout boundaries
        run: |
          npx --no-install tsx scripts/prove_buy_void_saga_execute_prepared_transaction_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_execute_prepared_transaction_parent_dispatch_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_runtime_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_terminal_closeout_parent_dispatch_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
