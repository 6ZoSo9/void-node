name: First public earn tunnel overlay v1

on:
  pull_request:
    paths:
      - "scripts/compose_first_public_earn_tunnel_overlay_v1.mjs"
      - "scripts/verify_first_public_earn_tunnel_overlay_v1.mjs"
      - "scripts/prove_first_public_earn_tunnel_overlay_v1.mjs"
      - "ops/mainnet0/install-first-public-earn-tunnel-overlay-v1.sh"
      - ".github/workflows/first-public-earn-tunnel-overlay-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/compose_first_public_earn_tunnel_overlay_v1.mjs"
      - "scripts/verify_first_public_earn_tunnel_overlay_v1.mjs"
      - "scripts/prove_first_public_earn_tunnel_overlay_v1.mjs"
      - "ops/mainnet0/install-first-public-earn-tunnel-overlay-v1.sh"
      - ".github/workflows/first-public-earn-tunnel-overlay-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove tunnel overlay contract
        run: |
          node --check scripts/compose_first_public_earn_tunnel_overlay_v1.mjs
          node --check scripts/verify_first_public_earn_tunnel_overlay_v1.mjs
          node --check scripts/prove_first_public_earn_tunnel_overlay_v1.mjs
          bash -n ops/mainnet0/install-first-public-earn-tunnel-overlay-v1.sh
          node scripts/prove_first_public_earn_tunnel_overlay_v1.mjs
