name: public-node-operator-trial-lane-rollup

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-lane-rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial lane rollup
        run: bash tools/check_public_node_operator_trial_lane_rollup_v1.sh
