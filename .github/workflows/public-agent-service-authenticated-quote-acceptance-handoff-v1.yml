name: Public Agent Service Authenticated Quote Acceptance Handoff V1

on:
  pull_request:
    paths:
      - "schemas/public-agent-service-authenticated-quote-acceptance-handoff-v1.schema.json"
      - "examples/public-agent-service-authenticated-quote-acceptance-handoff-v1.example.json"
      - "docs/public-agent/public-agent-service-authenticated-quote-acceptance-handoff-v1.md"
      - "scripts/public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - "scripts/prove_public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - ".github/workflows/public-agent-service-authenticated-quote-acceptance-handoff-v1.yml"
      - "schemas/public-agent-service-provider-quote-response-authentication-v1.schema.json"
      - "scripts/public_agent_service_provider_quote_response_authentication_v1.ts"
      - "docs/public-agent/public-agent-service-provider-quote-response-authentication-v1.md"
      - "schemas/agent-paid-work-acceptance-envelope-v1.schema.json"
      - "scripts/agent_paid_work_acceptance_envelope_v1.ts"
      - "docs/public/agent-paid-work-acceptance-envelope-v1.md"
      - "docs/operators/agent-paid-work-credential-registry-v1.md"
      - "ops/public/agent-services-v1/catalog.json"
  push:
    branches:
      - main
    paths:
      - "schemas/public-agent-service-authenticated-quote-acceptance-handoff-v1.schema.json"
      - "examples/public-agent-service-authenticated-quote-acceptance-handoff-v1.example.json"
      - "docs/public-agent/public-agent-service-authenticated-quote-acceptance-handoff-v1.md"
      - "scripts/public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - "scripts/prove_public_agent_service_authenticated_quote_acceptance_handoff_v1.ts"
      - "schemas/public-agent-service-provider-quote-response-authentication-v1.schema.json"
      - "scripts/public_agent_service_provider_quote_response_authentication_v1.ts"
      - "docs/public-agent/public-agent-service-provider-quote-response-authentication-v1.md"
      - "schemas/agent-paid-work-acceptance-envelope-v1.schema.json"
      - "scripts/agent_paid_work_acceptance_envelope_v1.ts"
      - "docs/public/agent-paid-work-acceptance-envelope-v1.md"
      - "docs/operators/agent-paid-work-credential-registry-v1.md"
      - "ops/public/agent-services-v1/catalog.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsx scripts/prove_public_agent_service_authenticated_quote_acceptance_handoff_v1.ts
