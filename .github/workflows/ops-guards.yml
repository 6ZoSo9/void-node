name: ops-guards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-guards.yml'
      - 'Makefile.ops'
      - 'ops/*.sh'
      - 'ops/**/*.sh'
  pull_request:
    paths:
      - '.github/workflows/ops-guards.yml'
      - 'Makefile.ops'
      - 'ops/*.sh'
      - 'ops/**/*.sh'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard .RECIPEPREFIX for ops
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*>' Makefile.ops; then
            grep -q '^[.]RECIPEPREFIX := >' Makefile.ops || {
              echo "Missing '.RECIPEPREFIX := >' in Makefile.ops"
              exit 1
            }
          fi

      - name: Basic bash sanity (no CRLF, no DOS paths)
        run: |
          set -euo pipefail
          if grep -RIl $'\r' ops/*.sh ops/**/*.sh 2>/dev/null | grep .; then
            echo "CRLF found in shell scripts"
            exit 1
          fi
          for f in ops/*.sh ops/**/*.sh; do
            [ -f "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "not executable: $f"
              exit 1
            fi
          done
