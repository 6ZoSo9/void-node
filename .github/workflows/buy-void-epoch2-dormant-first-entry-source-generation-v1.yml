name: Buy VOID Epoch-2 first-entry source generation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v1.md"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_generation.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-epoch2-dormant-first-entry-source-generation-v1.yml"
      - "docs/operators/buy-void-epoch2-dormant-first-entry-source-generation-v1.md"
      - "ops/security/buy-void-epoch2-dormant-first-entry-source-generation-v1.conf"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.c"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_generation.py"
      - "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_terminal.py"
      - "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.py"
      - "ops/security/buy-void-epoch2-dormant-binder-installer-first-entry-candidate-lock-v1.json"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_native_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v1.py"
      - "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v2.py"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v2.c"
      - "ops/precision/void_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v3.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch2-first-entry-source-generation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact event source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and focused source-generation proofs
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_generation.py",
              "scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_terminal.py",
              "scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.py",
          ):
              compile(Path(relative).read_bytes(), relative, "exec", dont_inherit=True)
          print("VOID_EPOCH2_FIRST_ENTRY_SOURCE_GENERATION_V1_SYNTAX_GREEN")
          PY
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_generation.py
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3_terminal.py
          /usr/bin/python3 -I -S -B scripts/prove_buy_void_epoch2_dormant_first_entry_protected_install_bootstrap_v4.py
          /usr/bin/python3 -I -S -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py --self-test
          /usr/bin/python3 -I -S -B ops/precision/void_buy_void_epoch2_dormant_binder_installer_first_entry_protected_install_v3.py --source-plan
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
