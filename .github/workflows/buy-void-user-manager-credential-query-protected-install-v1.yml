name: VOID Buy credential query protected install v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-install-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-install-v1.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v1.py"
      - "docs/operators/buy-void-user-manager-credential-query-protected-install-v1.md"
      - ".github/workflows/buy-void-user-manager-credential-query-protected-install-v1.yml"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v1.json"
      - "ops/security/buy-void-user-manager-credential-query-elf-candidate-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py",
              "scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_INSTALL_V1_SYNTAX_GREEN")
          PY

      - name: Prove exact create-only installer
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_void_buy_void_user_manager_credential_query_protected_install_v1.py |
            tee "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_PROTECTED_INSTALL_V1_PROOF_GREEN' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'accepted_credential_lock_bound=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'exact_candidate_pair_bound=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'distinct_fixed_install_root=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'create_only=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'atomic_root_publication_required=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'rename_noreplace_required=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'explicit_apply_confirmation_required=true' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'credential_contents_read=false' "$RUNNER_TEMP/credential-install-proof.log"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/credential-install-proof.log"

      - name: Prove inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-install-plan.log"
          python3 -I -B             ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py             --source-plan | tee "$out"
          grep -Fx 'source_only=true' "$out"
          grep -Fx 'host_read=false' "$out"
          grep -Fx 'host_write=false' "$out"
          grep -Fx 'create_only=true' "$out"
          grep -Fx 'atomic_root_publication_required=true' "$out"
          grep -Fx 'rename_noreplace_required=true' "$out"
          grep -Fx 'query_execution=false' "$out"
          grep -Fx 'credential_contents_read=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Require explicit apply confirmation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credential-install-no-confirm.log"
          if python3 -I -B                ops/precision/void_buy_void_user_manager_credential_query_protected_install_v1.py                --apply                --preexec /nonexistent/preexec                --query /nonexistent/query                >"$out" 2>&1; then
            echo "credential install unexpectedly admitted without confirmation" >&2
            exit 1
          fi
          grep -Fx 'reason=explicit_create_only_confirmation_required' "$out"
          grep -Fx 'protected_install_performed=false' "$out"

      - run: git diff --check
