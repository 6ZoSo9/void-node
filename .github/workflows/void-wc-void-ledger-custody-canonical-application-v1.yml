      - "package-lock.json"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-wc-void-ledger-custody-canonical-application-v1.yml"
      - "docs/operators/wc-void-ledger-custody-canonical-application-v1.md"
      - "scripts/prove_void_wc_void_ledger_custody_canonical_application_v1.mjs"
