      - "ops/security/reviewed-node-package-runtime-ethers-v1.json"
      - "scripts/prove_void_reviewed_node_package_runtime_v1.mjs"
      - "package.json"
      - "package-lock.json"
      - "ops/mainnet0/wc-void-production-candidate-v1.json"
      - "ops/mainnet0/coupled-economic-successor-gate-candidate-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check tools/void-wc-void-ledger-custody-canonical-application-v1.mjs
          node --check scripts/prove_void_wc_void_ledger_custody_canonical_application_v1.mjs
      - name: Prove ledger custody canonical application
        run: node scripts/prove_void_wc_void_ledger_custody_canonical_application_v1.mjs
      - name: Upstream ledger/custody, classifier, and reviewed-runtime regressions
        run: |
          node scripts/prove_void_reviewed_node_package_runtime_v1.mjs
          node scripts/prove_void_wc_void_ledger_custody_coupled_candidate_promotion_v1.mjs
          node scripts/prove_void_wc_void_production_readiness_v1.mjs
          node scripts/prove_void_coupled_economic_successor_gate_v1.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
