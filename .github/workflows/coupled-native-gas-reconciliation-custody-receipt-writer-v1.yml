name: VOID native-gas custody receipt writer v1

on:
  pull_request:
    paths:
      - ".github/workflows/coupled-native-gas-reconciliation-custody-receipt-writer-v1.yml"
      - "tools/void-coupled-native-gas-reconciliation-custody-receipt-writer-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_receipt_writer_v1.mjs"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-receipt-writer-v1.md"
      - "tools/void-coupled-native-gas-reconciliation-custody-receipt-continuity-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_receipt_continuity_v1.mjs"
      - "tools/void-coupled-native-gas-reconciliation-custody-source-binding-v1.mjs"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/coupled-native-gas-reconciliation-custody-receipt-writer-v1.yml"
      - "tools/void-coupled-native-gas-reconciliation-custody-receipt-writer-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_receipt_writer_v1.mjs"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-receipt-writer-v1.md"
      - "tools/void-coupled-native-gas-reconciliation-custody-receipt-continuity-v1.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_receipt_continuity_v1.mjs"
      - "tools/void-coupled-native-gas-reconciliation-custody-source-binding-v1.mjs"
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: native-gas-custody-receipt-writer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build canonical bakery lock runtime
        run: npm run build

      - name: Prove native-gas custody receipt continuity prerequisite
        run: node scripts/prove_coupled_native_gas_reconciliation_custody_receipt_continuity_v1.mjs

      - name: Prove durable custody receipt writer
        run: |
          node --check tools/void-coupled-native-gas-reconciliation-custody-receipt-writer-v1.mjs
          node --check scripts/prove_coupled_native_gas_reconciliation_custody_receipt_writer_v1.mjs
          node scripts/prove_coupled_native_gas_reconciliation_custody_receipt_writer_v1.mjs

      - name: Verify clean proof execution
        run: git diff --exit-code
