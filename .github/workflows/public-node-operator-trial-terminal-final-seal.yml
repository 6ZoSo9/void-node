name: public-node-operator-trial-terminal-final-seal

on:
  pull_request:
    paths:
      - ".github/workflows/public-node-operator-trial-terminal-final-seal.yml"
      - ".github/workflows/ci.yml"
      - "tools/check_public_node_operator_trial_terminal_final_seal_v1.sh"
      - "public/public-node/public-node-operator-trial-terminal-final-seal-v1.json"
      - "public/public-node/public-node-operator-trial-terminal-final-seal-v1.html"
      - "docs/public-node/public-node-operator-trial-terminal-final-seal-v1.md"
      - "public/public-node/index.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-node-operator-trial-terminal-final-seal.yml"
      - ".github/workflows/ci.yml"
      - "tools/check_public_node_operator_trial_terminal_final_seal_v1.sh"
      - "public/public-node/public-node-operator-trial-terminal-final-seal-v1.json"
      - "public/public-node/public-node-operator-trial-terminal-final-seal-v1.html"
      - "docs/public-node/public-node-operator-trial-terminal-final-seal-v1.md"
      - "public/public-node/index.json"

permissions:
  contents: read

jobs:
  public-node-operator-trial-terminal-final-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial terminal final seal
        run: bash tools/check_public_node_operator_trial_terminal_final_seal_v1.sh
