name: VOID Buy custody runtime V3 UID process census v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py"
      - "scripts/prove_void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py"
      - "docs/operators/buy-void-allocation-custody-runtime-v3-uid-process-census-v1.md"
      - ".github/workflows/buy-void-allocation-custody-runtime-v3-uid-process-census-v1.yml"
      - "ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json"
      - "tools/void-buy-allocation-custody-socket-runtime-directory-policy-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact UID-process census successor
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE="4f0150a53a4c938c273c634f506f5dbbc56475e7"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          mapfile -t actual < <(git diff --name-status "$BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            $'A\t.github/workflows/buy-void-allocation-custody-runtime-v3-uid-process-census-v1.yml'
            $'A\tdocs/operators/buy-void-allocation-custody-runtime-v3-uid-process-census-v1.md'
            $'A\tops/precision/void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py'
            $'A\tscripts/prove_void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          test "$(git rev-parse HEAD:ops/precision/void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py)" = \
            "7a292a4df12d3ce280c947cedc197f6edfdca1b3"
          test "$(git rev-parse HEAD:scripts/prove_void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py)" = \
            "4a3442376b85c9841c7ac34b6a6bf940e1652091"
          test "$(git rev-parse HEAD:docs/operators/buy-void-allocation-custody-runtime-v3-uid-process-census-v1.md)" = \
            "1a6ef5779953fefe74c42a06f7ad9bb197dc9252"
          test "$(git rev-parse HEAD:ops/security/buy-void-allocation-custody-runtime-install-archive-lock-v3.json)" = \
            "edb4ea2b833373ab387762e45ba7da4032c860f3"
          test "$(git rev-parse HEAD:tools/void-buy-allocation-custody-socket-runtime-directory-policy-v1.mjs)" = \
            "9d4b97a822b50c525722f0decae9205a9aebeb4a"

          git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            ops/precision/void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            scripts/prove_void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py

      - name: Self-test without host process census
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/custody-uid-process-selftest.txt"
          python3 -I -B \
            ops/precision/void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py \
            --self-test | tee "$out"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_UID_PROCESS_CENSUS_V1_SELF_TEST_GREEN' "$out"
          for marker in \
            'archive_lock_exact=true' \
            'socket_runtime_policy_exact=true' \
            'four_uid_slots_classified=true' \
            'thread_uid_slots_classified=true' \
            'proc_visibility_verified_before_empty_candidate=true' \
            'hidepid_restricted_proc_holds=true' \
            'malformed_live_status_holds=true' \
            'proc_entry_budget_enforced_before_sort=true' \
            'two_pass_uid_process_set_stability=true' \
            'dedicated_uid_process_quiescence_proven=false' \
            'global_runtime_reference_quiescence_proven=false' \
            'proc_status_uid_only=true' \
            'proc_thread_status_uid_only=true' \
            'process_cmdline_read=false' \
            'process_environment_read=false' \
            'process_executable_read=false' \
            'process_fd_read=false' \
            'process_signal=false' \
            'service_mutation=false' \
            'production_census_filesystem_write=false' \
            'self_test_private_fixture_writes=true' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$out"
          done

      - name: Prove source boundary
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/custody-uid-process-proof.txt"
          python3 -I -B \
            scripts/prove_void_buy_allocation_custody_runtime_v3_uid_process_census_v1.py \
            | tee "$proof"
          grep -Fx 'VOID_BUY_VOID_CUSTODY_RUNTIME_V3_UID_PROCESS_CENSUS_V1_PROOF_GREEN' "$proof"
          for marker in \
            'exact_source_blob_asserted=true' \
            'archive_lock_exact=true' \
            'socket_runtime_policy_exact=true' \
            'four_uid_slots_classified=true' \
            'thread_uid_slots_classified=true' \
            'proc_visibility_verified_before_empty_candidate=true' \
            'hidepid_restricted_proc_holds=true' \
            'malformed_live_status_holds=true' \
            'missing_live_status_holds=true' \
            'proc_entry_budget_enforced_before_sort=true' \
            'two_pass_uid_process_set_stability=true' \
            'dedicated_uid_process_quiescence_proven=false' \
            'global_runtime_reference_quiescence_proven=false' \
            'proc_status_uid_only=true' \
            'proc_thread_status_uid_only=true' \
            'process_cmdline_read=false' \
            'process_environment_read=false' \
            'process_executable_read=false' \
            'process_fd_read=false' \
            'process_signal=false' \
            'service_mutation=false' \
            'production_census_filesystem_write=false' \
            'source_proof_private_fixture_writes=true' \
            'request_history_read=false' \
            'custody_data_read=false' \
            'credential_access=false' \
            'wallet_or_signer_access=false' \
            'install_target_selected=false' \
            'existing_target_replaced=false' \
            'runtime_integration=false' \
            'payment_acceptance=false' \
            'public_presale_activation=false' \
            'funds_movement=false'; do
            grep -Fx "$marker" "$proof"
          done

      - name: Diff hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
