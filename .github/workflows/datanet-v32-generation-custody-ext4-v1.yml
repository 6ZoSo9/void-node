name: DataNet V32 ext4 generation custody v1

on:
  pull_request:
    paths:
      - ".github/workflows/datanet-v32-generation-custody-ext4-v1.yml"
      - "docs/datanet-v32-generation-custody-ext4-v1.md"
      - "fixtures/datanet-h1-s0-s1-publication-ext4-v1.json"
      - "fixtures/datanet-v31-campaign-topology-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/datanet_v24_bounded_payload_io_v1.mjs"
      - "scripts/prove_datanet_v24_source_bound_io_fault_controls_v1.py"
      - "scripts/prove_datanet_h1_admitted_s0_s1_publication_ext4_v1.mjs"
      - "scripts/datanet_v31_campaign_reducer_v1.py"
      - "scripts/prove_datanet_v31_campaign_topology_ext4_v1.py"
      - "scripts/datanet_ext4_inode_generation_v1.py"
      - "scripts/datanet_v32_generation_reducer_v1.py"
      - "scripts/prove_datanet_h1_generation_bound_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_v32_generation_final_verifier_v1.py"
      - "scripts/prove_datanet_v32_generation_custody_ext4_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datanet-v32-generation-custody-ext4-v1.yml"
      - "docs/datanet-v32-generation-custody-ext4-v1.md"
      - "fixtures/datanet-h1-s0-s1-publication-ext4-v1.json"
      - "fixtures/datanet-v31-campaign-topology-ext4-v1.json"
      - "scripts/prove_datanet_posix_admission_capability_v1.py"
      - "scripts/datanet_v24_bounded_payload_io_v1.mjs"
      - "scripts/prove_datanet_v24_source_bound_io_fault_controls_v1.py"
      - "scripts/prove_datanet_h1_admitted_s0_s1_publication_ext4_v1.mjs"
      - "scripts/datanet_v31_campaign_reducer_v1.py"
      - "scripts/prove_datanet_v31_campaign_topology_ext4_v1.py"
      - "scripts/datanet_ext4_inode_generation_v1.py"
      - "scripts/datanet_v32_generation_reducer_v1.py"
      - "scripts/prove_datanet_h1_generation_bound_s1_publication_ext4_v1.mjs"
      - "scripts/prove_datanet_v32_generation_final_verifier_v1.py"
      - "scripts/prove_datanet_v32_generation_custody_ext4_v1.py"

permissions:
  contents: read

concurrency:
  group: datanet-v32-generation-custody-ext4-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Exact-head and source gates
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -x /usr/bin/fallocate
          test -x /usr/bin/ln
          test -x /usr/sbin/mkfs.ext4
          command -v strace >/dev/null
          node --version
          node --check scripts/prove_datanet_h1_generation_bound_s1_publication_ext4_v1.mjs
          python3 -I -B - <<'PY'
          import ast
          from pathlib import Path
          paths = [
              Path('scripts/datanet_ext4_inode_generation_v1.py'),
              Path('scripts/datanet_v32_generation_reducer_v1.py'),
              Path('scripts/prove_datanet_v32_generation_final_verifier_v1.py'),
              Path('scripts/prove_datanet_v32_generation_custody_ext4_v1.py'),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          source = Path('scripts/datanet_ext4_inode_generation_v1.py').read_text(encoding='utf-8')
          assert source.count('fcntl.ioctl(') == 1
          assert 'EXT4_IOC_SETVERSION' not in source
          assert 'FS_IOC_SETVERSION' not in source
          PY

      - name: Preserve V24 source-bound fault controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B scripts/prove_datanet_v24_source_bound_io_fault_controls_v1.py | tee "$RUNNER_TEMP/v24-controls-node-${{ matrix.node }}.jsonl"
          grep -F 'VOID_DATANET_V24_SOURCE_BOUND_IO_FAULT_CONTROLS_V1_GREEN' "$RUNNER_TEMP/v24-controls-node-${{ matrix.node }}.jsonl"
          grep -F '"controls":12' "$RUNNER_TEMP/v24-controls-node-${{ matrix.node }}.jsonl"
          grep -F '"publisher_shared_engine_wired":true' "$RUNNER_TEMP/v24-controls-node-${{ matrix.node }}.jsonl"

      - name: Prove generation-bound 27-lifetime campaign
        shell: bash
        run: |
          set -euo pipefail
          e0_image="$RUNNER_TEMP/void-datanet-v32-e0-node-${{ matrix.node }}.ext4"
          r0_image="$RUNNER_TEMP/void-datanet-v32-r0-node-${{ matrix.node }}.ext4"
          e0_mount="$RUNNER_TEMP/void-datanet-v32-e0-node-${{ matrix.node }}-mnt"
          r0_mount="$RUNNER_TEMP/void-datanet-v32-r0-node-${{ matrix.node }}-mnt"
          evidence="$RUNNER_TEMP/datanet-v32-evidence-node-${{ matrix.node }}"
          stdout_log="$RUNNER_TEMP/datanet-v32-campaign-node-${{ matrix.node }}.stdout.log"
          stderr_log="$RUNNER_TEMP/datanet-v32-campaign-node-${{ matrix.node }}.stderr.log"
          e0_mounted=0
          r0_mounted=0
          cleanup() {
            set +e
            if [ "$r0_mounted" -eq 1 ]; then sync; sudo umount "$r0_mount"; fi
            if [ "$e0_mounted" -eq 1 ]; then sync; sudo umount "$e0_mount"; fi
            rmdir "$r0_mount" "$e0_mount" 2>/dev/null || true
            rm -f "$r0_image" "$e0_image"
          }
          trap cleanup EXIT

          /usr/bin/dd if=/dev/zero of="$e0_image" bs=1M count=384 status=none
          /usr/bin/dd if=/dev/zero of="$r0_image" bs=1M count=384 status=none
          /usr/sbin/mkfs.ext4 -F -q -E lazy_itable_init=0,lazy_journal_init=0 "$e0_image"
          /usr/sbin/mkfs.ext4 -F -q -E lazy_itable_init=0,lazy_journal_init=0 "$r0_image"
          mkdir "$e0_mount" "$r0_mount" "$evidence"
          sudo mount -o loop,nosuid,nodev,noexec "$e0_image" "$e0_mount"
          e0_mounted=1
          sudo mount -o loop,nosuid,nodev,noexec "$r0_image" "$r0_mount"
          r0_mounted=1
          test "$(findmnt -n -o FSTYPE --target "$e0_mount")" = ext4
          test "$(findmnt -n -o FSTYPE --target "$r0_mount")" = ext4
          sudo mkdir "$e0_mount/store" "$r0_mount/store"
          sudo chown "$(id -u):$(id -g)" "$e0_mount/store" "$r0_mount/store"
          sudo chmod 0700 "$e0_mount/store" "$r0_mount/store"

          export VOID_DATANET_V31_E0_ROOT="$e0_mount/store"
          export VOID_DATANET_V31_R0_ROOT="$r0_mount/store"
          export VOID_DATANET_V31_EVIDENCE_DIR="$evidence"
          python3 -I -B scripts/prove_datanet_v32_generation_custody_ext4_v1.py \
            > >(tee "$stdout_log") \
            2> >(tee "$stderr_log" >&2)

          grep -F '"marker":"VOID_DATANET_V32_EXT4_GENERATION_CUSTODY_V1_GREEN"' "$stdout_log"
          grep -F '"status":"GREEN"' "$stdout_log"
          grep -F '"calls":15372' "$stdout_log"
          grep -F '"completed_mib":960' "$stdout_log"
          grep -F '"total_lifetimes":27' "$stdout_log"
          grep -F '"peak_live":9' "$stdout_log"
          grep -F '"ext4_inode_generation_observed_in_process":true' "$stdout_log"
          grep -F '"ext4_getversion_observations":6' "$stdout_log"
          grep -F '"generation_extra_process_lifetimes":0' "$stdout_log"
          grep -F '"r0_cut_generation_matched_before_s1_allocation":true' "$stdout_log"
          grep -F '"retained_s0_fd_across_python_node_exec_proved":true' "$stdout_log"
          grep -F '"node_verified_inherited_s0_fd_before_candidate_allocation":true' "$stdout_log"
          grep -F '"same_uid_generation_rewrite_proved":false' "$stdout_log"
          grep -F '"full_cold_restart_generation_authority_proved":false' "$stdout_log"
          grep -F '"source_bound_injected_fault_matrix_proved":false' "$stdout_log"
          grep -F '"production_runtime_touched":false' "$stdout_log"
          test ! -s "$stderr_log"

          test "$(find "$evidence" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5
          for f in manifest.json runtime.json observer.json restart-census.json aggregate.json; do
            test -s "$evidence/$f"
          done
          grep -F '"generation_observations":6' "$evidence/aggregate.json"
          grep -F '"extra_process_lifetimes":0' "$evidence/aggregate.json"
          grep -F '"retained_s0_fd_across_python_node_exec":true' "$evidence/aggregate.json"

          sync
          sudo umount "$r0_mount"
          r0_mounted=0
          sudo umount "$e0_mount"
          e0_mounted=0
          trap - EXIT
          rmdir "$r0_mount" "$e0_mount"
          rm -f "$r0_image" "$e0_image"

      - name: Retain generation-custody evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datanet-v32-generation-custody-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/datanet-v32-campaign-node-${{ matrix.node }}.stdout.log
            ${{ runner.temp }}/datanet-v32-campaign-node-${{ matrix.node }}.stderr.log
            ${{ runner.temp }}/v24-controls-node-${{ matrix.node }}.jsonl
            ${{ runner.temp }}/datanet-v32-evidence-node-${{ matrix.node }}/
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check
