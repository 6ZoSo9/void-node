name: VOID V7 V5 staging static launcher qualifier v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-v7-v5-stage-static-launcher-qualifier-v1.yml"
      - "docs/operators/void-v7-v5-stage-static-launcher-qualifier-v1.md"
      - "ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v1.c"
      - "ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v1.py"
      - "scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py"
      - "ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact launcher candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parent and five-add scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PARENT=8b262f8aef3fc384fed360f776b991a4f5170090
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          mapfile -t actual < <(git diff --name-status "$PARENT" HEAD | sort)
          expected=(
            $'A\t.github/workflows/void-v7-v5-stage-static-launcher-qualifier-v1.yml'
            $'A\tdocs/operators/void-v7-v5-stage-static-launcher-qualifier-v1.md'
            $'A\tops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v1.py'
            $'A\tops/precision/void_v7_v5_source_receipt_stage_root_launcher_v1.c'
            $'A\tscripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py'
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${actual[$i]}" = "${expected[$i]}"; done
          git diff --check "$PARENT" HEAD

      - name: Bind exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v1.c)" = "f1012d2ee8002d5ab9c2c60e1c889705b002a4a3"
          test "$(git rev-parse HEAD:ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v1.py)" = "c3ec29996876aa5b0f712988c4595c946d51868b"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py)" = "c0844899cd19fab6d727169ac90559a124de7f33"
          test "$(git rev-parse HEAD:docs/operators/void-v7-v5-stage-static-launcher-qualifier-v1.md)" = "cffd2543945ee2f45ca36b31c75b37a49a441537"
          test "$(git rev-parse HEAD:ops/security/buy-void-v7-v5-stage-trusted-admission-plan-v1.json)" = "3762b757a21048d6eb891245559e7c277716cf93"

      - name: Python syntax
        run: |
          python3 -I -B -m py_compile             ops/precision/void_v7_v5_source_receipt_stage_pair_qualifier_v1.py             scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py

      - name: Build static launcher candidate
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -static             ops/precision/void_v7_v5_source_receipt_stage_root_launcher_v1.c             -o "$RUNNER_TEMP/v5-stage-launcher-static"
          test -x "$RUNNER_TEMP/v5-stage-launcher-static"
          file "$RUNNER_TEMP/v5-stage-launcher-static" | grep -F 'statically linked'
          "$RUNNER_TEMP/v5-stage-launcher-static" --self-test | tee "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'VOID_V7_V5_SOURCE_RECEIPT_STAGE_ROOT_LAUNCHER_V1_SELF_TEST_GREEN' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'production_payload_manifest_lock_embedded=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'root_execution_authorized=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'source_stage_apply_authorized=false' "$RUNNER_TEMP/static-self-test.log"
          grep -Fx 'receipt_stage_apply_authorized=false' "$RUNNER_TEMP/static-self-test.log"

      - name: Prove launcher and qualifier boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v5-stage-launcher-qualifier-proof.log"
          python3 -I -B scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py | tee "$out"
          grep -Fx 'VOID_V7_V5_STAGE_STATIC_LAUNCHER_QUALIFIER_V1_PROOF_GREEN' "$out"
          grep -Fx 'launcher_compiles_with_werror=true' "$out"
          grep -Fx 'launcher_self_test_green=true' "$out"
          grep -Fx 'production_manifest_lock_unbound=true' "$out"
          grep -Fx 'normal_launcher_operation_fail_closed=true' "$out"
          grep -Fx 'four_fixed_operations_only=true' "$out"
          grep -Fx 'caller_path_authority=false' "$out"
          grep -Fx 'caller_source_generation_authority=false' "$out"
          grep -Fx 'read_only_pair_qualifier_self_test_green=true' "$out"
          grep -Fx 'journal_fence_path_selection_deferred=true' "$out"
          grep -Fx 'launcher_install_authorized=false' "$out"
          grep -Fx 'root_execution_authorized=false' "$out"
          grep -Fx 'source_stage_apply_authorized=false' "$out"
          grep -Fx 'receipt_stage_apply_authorized=false' "$out"
          grep -Fx 'fixed_source_exchange_authority=false' "$out"
          grep -Fx 'fixed_receipt_exchange_authority=false' "$out"
          grep -Fx 'service_mutation=false' "$out"
          grep -Fx 'public_presale_activation=false' "$out"
          grep -Fx 'funds_movement=false' "$out"

      - name: Assert host-facing operations are not invoked
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F -- '--inspect' scripts/prove_void_v7_v5_stage_static_launcher_qualifier_v1.py
          ! grep -F -- 'source-stage-apply' .github/workflows/void-v7-v5-stage-static-launcher-qualifier-v1.yml
          ! grep -F -- 'receipt-stage-apply' .github/workflows/void-v7-v5-stage-static-launcher-qualifier-v1.yml
