name: VOID public bootstrap outside-machine target v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-bootstrap-outside-machine-acceptance-v1.yml"
      - ".github/workflows/void-public-bootstrap-outside-machine-target-v1.yml"
      - "scripts/void_public_bootstrap_outside_machine_target_v1.mjs"
      - "scripts/prove_void_public_bootstrap_outside_machine_target_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-bootstrap-outside-machine-acceptance-v1.yml"
      - ".github/workflows/void-public-bootstrap-outside-machine-target-v1.yml"
      - "scripts/void_public_bootstrap_outside_machine_target_v1.mjs"
      - "scripts/prove_void_public_bootstrap_outside_machine_target_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check scripts/void_public_bootstrap_outside_machine_target_v1.mjs
          node --check scripts/prove_void_public_bootstrap_outside_machine_target_v1.mjs

      - name: Prove exact target-head acceptance
        run: node scripts/prove_void_public_bootstrap_outside_machine_target_v1.mjs

      - name: Diff hygiene
        run: git diff --check
