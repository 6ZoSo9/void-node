name: VOID public bootstrap outside-machine acceptance v1

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Published canonical HTTPS bootstrap manifest URL
        required: true
        type: string
      expected_source_sha:
        description: Exact 40-character merged source commit to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: void-public-bootstrap-outside-machine-acceptance-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outside-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Bind workflow to exact merged source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --

      - name: Bind acceptance target to exact verified manifest
        shell: bash
        env:
          VOID_PUBLIC_BOOTSTRAP_MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "${#VOID_PUBLIC_BOOTSTRAP_MANIFEST_URL}" -le 2048
          mkdir -p outside-machine-evidence

          VERIFY_LOG="$RUNNER_TEMP/void-public-bootstrap-acceptance-verify-$GITHUB_RUN_ID.log"
          VERIFY_OUT="$RUNNER_TEMP/void-public-bootstrap-acceptance-verify-$GITHUB_RUN_ID.out"
          TARGET=outside-machine-evidence/target.txt

          if ! node scripts/resolve_void_public_bootstrap_v1.mjs --verify-only               >"$VERIFY_OUT" 2>"$VERIFY_LOG"; then
            cat "$VERIFY_LOG" >&2
            exit 1
          fi
          test -s "$VERIFY_OUT"

          node scripts/void_public_bootstrap_outside_machine_target_v1.mjs bind             --manifest public/bootstrap/v1.json             --resolver-log "$VERIFY_LOG"             >"$TARGET"

          TARGET_HEAD="$(sed -n 's/^target_head=//p' "$TARGET")"
          MANIFEST_ID="$(sed -n 's/^manifest_id=//p' "$TARGET")"
          QUALIFICATION_IDS="$(sed -n 's/^qualification_ids=//p' "$TARGET")"

          [[ "$TARGET_HEAD" =~ ^[1-9][0-9]*$ ]]
          [[ "$MANIFEST_ID" =~ ^voidpbm1_[0-9a-f]{64}$ ]]
          test -n "$QUALIFICATION_IDS"

          {
            printf 'VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_TARGET_HEAD=%s\n' "$TARGET_HEAD"
            printf 'VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_MANIFEST_ID=%s\n' "$MANIFEST_ID"
            printf 'VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_QUALIFICATION_IDS=%s\n' "$QUALIFICATION_IDS"
          } >> "$GITHUB_ENV"

          echo "acceptance_target_head=$TARGET_HEAD"
          echo "acceptance_manifest_id=$MANIFEST_ID"
          echo "acceptance_target_bound=true"

      - name: Clone-run and synchronize through public bootstrap only
        shell: bash
        env:
          VOID_PUBLIC_BOOTSTRAP_MANIFEST_URL: ${{ inputs.manifest_url }}
          VOID_PUBLIC_BOOTSTRAP_REQUIRE: '1'
          DATA_DIR: ${{ runner.temp }}/void-public-bootstrap-data
        run: |
          set -Eeuo pipefail
          umask 077
          test "${#VOID_PUBLIC_BOOTSTRAP_MANIFEST_URL}" -le 2048
          [[ "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_TARGET_HEAD" =~ ^[1-9][0-9]*$ ]]
          rm -rf .runtime node_modules dist .env .nodekey "$DATA_DIR"
          mkdir -p outside-machine-evidence "$DATA_DIR"

          LOG=outside-machine-evidence/node.log
          READY=outside-machine-evidence/ready.json
          READY_AFTER_GRACE=outside-machine-evidence/ready-after-grace.json
          SOURCE=outside-machine-evidence/source.txt
          TARGET=outside-machine-evidence/target.txt

          ./run-void-node.sh run >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill -TERM "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          GREEN=0
          for _ in $(seq 1 2400); do
            if curl -fsS --max-time 5 http://127.0.0.1:4100/__void/ready.json >"$READY"; then
              if node scripts/void_public_bootstrap_outside_machine_target_v1.mjs check-ready                   --ready "$READY"                   --target-head "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_TARGET_HEAD"                   >/dev/null
              then
                GREEN=1
                break
              fi
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG" >&2
              exit 1
            fi
            sleep 1
          done

          if test "$GREEN" != 1; then
            cat "$LOG" >&2
            exit 1
          fi

          grep -F 'public_bootstrap=resolved_stable_https_seed' "$LOG"
          grep -F 'public_sync_via_loopback_adapter=true' "$LOG"
          grep -F 'tailnet_required=false' "$LOG"
          grep -F 'VOID_PUBLIC_BOOTSTRAP_SUPERVISOR_V1_ACTIVE' "$LOG"
          grep -F 'direct_remote_fetch_from_node=false' "$LOG"

          sleep 30
          kill -0 "$PID"
          curl -fsS --max-time 5 http://127.0.0.1:4100/__void/ready.json >"$READY_AFTER_GRACE"
          node scripts/void_public_bootstrap_outside_machine_target_v1.mjs check-ready             --ready "$READY_AFTER_GRACE"             --target-head "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_TARGET_HEAD"

          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'target_head=%s\n' "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_TARGET_HEAD"
            printf 'manifest_id=%s\n' "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_MANIFEST_ID"
            printf 'qualification_ids=%s\n' "$VOID_PUBLIC_BOOTSTRAP_ACCEPTANCE_QUALIFICATION_IDS"
            printf 'target_head_reached=true\n'
            printf 'tailnet_required=false\n'
            printf 'private_configuration_required=false\n'
            printf 'wallet_authority=false\n'
            printf 'signer_authority=false\n'
            printf 'validator_authority=false\n'
            printf 'treasury_authority=false\n'
            printf 'work_credit_authority=false\n'
            printf 'money_movement_authority=false\n'
          } >"$SOURCE"
          sha256sum "$LOG" "$READY" "$READY_AFTER_GRACE" "$TARGET" "$SOURCE"             > outside-machine-evidence/SHA256SUMS

          echo 'VOID_PUBLIC_BOOTSTRAP_OUTSIDE_MACHINE_ACCEPTANCE_V1_GREEN'
          echo 'target_head_reached=true'
          echo 'tailnet_required=false'
          echo 'private_configuration_required=false'
          echo 'private_mutation_routes_exposed=false'
          echo 'money_movement_authority=false'

      - name: Upload sanitized outside-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-public-bootstrap-outside-machine-acceptance-v1-${{ github.sha }}
          path: outside-machine-evidence/
          if-no-files-found: warn
          retention-days: 14
