name: WC Public Opportunity Discovery v1

on:
  pull_request:
    paths:
      - ".github/workflows/wc-public-opportunity-discovery-v1.yml"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "tools/wc-public-opportunity-discovery-v1.mjs"
      - "tools/wc-public-opportunity-directory-v1.mjs"
      - "tools/wc-public-coordinator-readiness-v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_composition_v1.mjs"
      - "scripts/prove_wc_public_opportunity_response_bounds_v1.mjs"
      - "scripts/prove_wc_public_opportunity_directory_evidence_types_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_response_contract_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_policy_evidence_types_v1.mjs"
      - "scripts/prove_wc_public_coordinator_readiness_v1.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wc-public-opportunity-discovery-v1.yml"
      - "ops/public/public-seed-adapter-v1.mjs"
      - "tools/wc-public-opportunity-discovery-v1.mjs"
      - "tools/wc-public-opportunity-directory-v1.mjs"
      - "tools/wc-public-coordinator-readiness-v1.mjs"
      - "scripts/prove_wc_public_opportunity_discovery_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_composition_v1.mjs"
      - "scripts/prove_wc_public_opportunity_response_bounds_v1.mjs"
      - "scripts/prove_wc_public_opportunity_directory_evidence_types_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_response_contract_v1.mjs"
      - "scripts/prove_wc_public_opportunity_adapter_policy_evidence_types_v1.mjs"
      - "scripts/prove_wc_public_coordinator_readiness_v1.mjs"

permissions:
  contents: read

jobs:
  prove:
    name: prove (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Check adapter source syntax
        run: node --check ops/public/public-seed-adapter-v1.mjs
      - name: Check discovery source syntax
        run: node --check tools/wc-public-opportunity-discovery-v1.mjs
      - name: Check directory source syntax
        run: node --check tools/wc-public-opportunity-directory-v1.mjs
      - name: Check coordinator readiness source syntax
        run: node --check tools/wc-public-coordinator-readiness-v1.mjs
      - name: Check focused proof syntax
        run: node --check scripts/prove_wc_public_opportunity_discovery_v1.mjs
      - name: Check adapter composition proof syntax
        run: node --check scripts/prove_wc_public_opportunity_adapter_composition_v1.mjs
      - name: Check response-bounds proof syntax
        run: node --check scripts/prove_wc_public_opportunity_response_bounds_v1.mjs
      - name: Check directory evidence proof syntax
        run: node --check scripts/prove_wc_public_opportunity_directory_evidence_types_v1.mjs
      - name: Check adapter response-contract proof syntax
        run: node --check scripts/prove_wc_public_opportunity_adapter_response_contract_v1.mjs
      - name: Check adapter policy evidence proof syntax
        run: node --check scripts/prove_wc_public_opportunity_adapter_policy_evidence_types_v1.mjs
      - name: Check coordinator readiness proof syntax
        run: node --check scripts/prove_wc_public_coordinator_readiness_v1.mjs
      - name: Prove strict discovery evidence typing
        run: node scripts/prove_wc_public_opportunity_discovery_v1.mjs
      - name: Prove adapter-to-discovery evidence typing
        run: node scripts/prove_wc_public_opportunity_adapter_composition_v1.mjs
      - name: Prove bounded discovery responses
        run: node scripts/prove_wc_public_opportunity_response_bounds_v1.mjs
      - name: Prove strict directory child evidence
        run: node scripts/prove_wc_public_opportunity_directory_evidence_types_v1.mjs
      - name: Prove adapter response bounds and total deadline
        run: node scripts/prove_wc_public_opportunity_adapter_response_contract_v1.mjs
      - name: Prove adapter policy evidence typing
        run: node scripts/prove_wc_public_opportunity_adapter_policy_evidence_types_v1.mjs
      - name: Prove coordinator readiness policy evidence typing
        run: node scripts/prove_wc_public_coordinator_readiness_v1.mjs
