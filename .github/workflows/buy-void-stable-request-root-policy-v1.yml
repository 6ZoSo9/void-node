name: VOID Buy VOID stable request root policy v1

on:
  pull_request:
    paths:
      - "tools/void-buy-stable-request-root-policy-v1.mjs"
      - "scripts/prove_void_buy_stable_request_root_policy_v1.mjs"
      - "scripts/prove_void_buy_stable_request_root_policy_v2.mjs"
      - "docs/operators/buy-void-stable-request-root-policy-v1.md"
      - ".github/workflows/buy-void-stable-request-root-policy-v1.yml"
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-stable-request-root-policy-v1.mjs"
      - "scripts/prove_void_buy_stable_request_root_policy_v1.mjs"
      - "scripts/prove_void_buy_stable_request_root_policy_v2.mjs"
      - "docs/operators/buy-void-stable-request-root-policy-v1.md"
      - ".github/workflows/buy-void-stable-request-root-policy-v1.yml"
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck build and prove fixed request-root policy
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          node --check tools/void-buy-stable-request-root-policy-v1.mjs
          node --check scripts/prove_void_buy_stable_request_root_policy_v1.mjs
          node --check scripts/prove_void_buy_stable_request_root_policy_v2.mjs
          set +e
          node scripts/prove_void_buy_stable_request_root_policy_v1.mjs \
            > "$RUNNER_TEMP/stable-request-root-v1.hold" 2>&1
          v1_rc=$?
          set -e
          test "$v1_rc" -ne 0
          grep -Fq 'accepted_parent_source_blob_drift:src/economic/buy_void_verified_payment_capacity_admission_v1.ts' \
            "$RUNNER_TEMP/stable-request-root-v1.hold"
          node scripts/prove_void_buy_stable_request_root_policy_v2.mjs |
            tee "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'VOID_BUY_VOID_STABLE_REQUEST_ROOT_POLICY_V2_GREEN' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'request_root=/var/lib/void-buy-request-journal-v1' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'request_directory_mode=0750' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'fixed_journal_mode=0640' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'private_sidecar_mode=0600' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'legacy_history_disposition_required_before_apply=true' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'request_history_migration_authorized=false' "$RUNNER_TEMP/stable-request-root-v1.txt"
          grep -Fx 'funds_movement=false' "$RUNNER_TEMP/stable-request-root-v1.txt"
      - run: git diff --check
