name: VOID participant wallet mutation wall v1

on:
  pull_request:
    paths:
      - "src/http/participant_wallet_native_v1.ts"
      - "scripts/prove_participant_wallet_mutation_wall_v1.mjs"
      - "docs/operators/participant-wallet-mutation-wall-v1.md"
      - ".github/workflows/participant-wallet-mutation-wall-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Prove mutation wall
        run: node scripts/prove_participant_wallet_mutation_wall_v1.mjs
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Diff hygiene
        run: git diff --check
