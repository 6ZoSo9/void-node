name: VOID P2P ephemeral direct transport mount v1

on:
  pull_request:
    paths:
      - "src/node_core.ts"
      - "scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts"
      - "docs/public/void-p2p-ephemeral-direct-mount-v1.md"
      - ".github/workflows/void-p2p-ephemeral-direct-mount-v1.yml"
      - "src/p2p/udp_swarm_control_v1.ts"
      - "src/p2p/udp_swarm_upgrade_v1.ts"
      - "src/p2p/udp_secure_session_bootstrap_v1.ts"
  push:
    branches: [main]
    paths:
      - "src/node_core.ts"
      - "scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts"
      - "docs/public/void-p2p-ephemeral-direct-mount-v1.md"
      - ".github/workflows/void-p2p-ephemeral-direct-mount-v1.yml"
      - "src/p2p/udp_swarm_control_v1.ts"
      - "src/p2p/udp_swarm_upgrade_v1.ts"
      - "src/p2p/udp_secure_session_bootstrap_v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-p2p-ephemeral-direct-mount-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove ephemeral direct transport mount
        run: npx --no-install tsx scripts/prove_void_p2p_ephemeral_direct_mount_v1.ts

      - name: Preserve authenticated UDP swarm relay control
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_control_v1.ts

      - name: Preserve UDP swarm upgrade orchestrator
        run: npx --no-install tsx scripts/prove_void_p2p_udp_swarm_upgrade_v1.ts

      - name: Preserve secure-session bootstrap
        run: npx --no-install tsx scripts/prove_void_p2p_udp_secure_session_bootstrap_v1.ts

      - name: Preserve peer-socket adapter
        run: npx --no-install tsx scripts/prove_void_p2p_udp_peer_socket_adapter_v1.ts

      - name: Preserve secure reliable UDP transport
        run: npx --no-install tsx scripts/prove_void_p2p_udp_secure_reliable_transport_v1.ts

      - name: Preserve authenticated UDP path
        run: npx --no-install tsx scripts/prove_void_p2p_udp_authenticated_path_v1.ts

      - name: Preserve UDP hole-punch foundation
        run: npx --no-install tsx scripts/prove_void_p2p_udp_hole_punch_foundation_v1.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
