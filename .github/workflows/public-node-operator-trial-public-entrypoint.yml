name: public-node-operator-trial-public-entrypoint

on:
  pull_request:
    paths:
      - '.github/workflows/public-node-operator-trial-*.yml'
      - 'tools/check_public_node_operator_trial_*.sh'
      - 'docs/public-node/public-node-operator-trial-*.md'
      - 'public/public-node/public-node-operator-trial-*'
      - 'public/public-node/index.json'
      - 'public/public-node/public-node-operator-dashboard-v1.*'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-node-operator-trial-*.yml'
      - 'tools/check_public_node_operator_trial_*.sh'
      - 'docs/public-node/public-node-operator-trial-*.md'
      - 'public/public-node/public-node-operator-trial-*'
      - 'public/public-node/index.json'
      - 'public/public-node/public-node-operator-dashboard-v1.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-node-operator-trial-public-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial public entrypoint
        run: bash tools/check_public_node_operator_trial_public_entrypoint_v1.sh
