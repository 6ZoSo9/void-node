name: public-node-operator-trial-public-entrypoint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-node-operator-trial-public-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public node operator trial public entrypoint
        run: bash tools/check_public_node_operator_trial_public_entrypoint_v1.sh
