name: VOID Buy VOID source-finality compiled artifact attestation v1

on:
  pull_request:
    paths:
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v1.mjs"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v1.md"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v1.json"
      - ".github/workflows/buy-void-source-finality-compiled-artifact-attestation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build exact repository artifacts
        run: npm run build

      - name: Derive source-finality compiled artifact identities
        run: |
          node scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v1.mjs \
            | tee "buy-void-source-finality-compiled-artifact-attestation-node-${{ matrix.node }}.log"

      - name: Upload derivation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buy-void-source-finality-compiled-artifact-attestation-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: buy-void-source-finality-compiled-artifact-attestation-node-${{ matrix.node }}.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve reviewed source-file V4 proof
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_generation_provenance_v4.ts

      - name: Preserve V3 authenticated composition
        run: ./node_modules/.bin/tsx scripts/prove_buy_void_source_finality_authenticated_composition_v3.ts

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
