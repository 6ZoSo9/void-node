name: VOID Buy VOID historical compiled V3 and current V4 successor

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/prove_buy_void_historical_compiled_v4_preservation_v1.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4_candidate.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4.mjs"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json"
      - ".github/workflows/buy-void-source-finality-compiled-artifact-attestation-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and immutable V3/V4 manifests
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json)" =             "d6e97784c5d8be93713e733628c7d1ef746bb5c7"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json)" =             "a07f2e9b03958a58280c4d940fe49097a9413af5"
          test "$(git hash-object scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4_candidate.mjs)" =             "1fb96f6c707dcbd8682a32b31ebdf5aa3ca56af4"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Preserve historical V3 and V4 only
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_historical_compiled_v4_preservation_v1.mjs             | tee "historical-v3-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v3_manifest_blob_preserved=true'             "historical-v3-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v4_locked_manifest_blob_preserved=true'             "historical-v3-v4-${{ matrix.node }}.txt"
          grep -Fx 'historical_v4_rederived_against_current_source=false'             "historical-v3-v4-${{ matrix.node }}.txt"
          grep -Fx 'funds_moved=false'             "historical-v3-v4-${{ matrix.node }}.txt"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
