name: VOID Buy VOID historical compiled V3 and current V4 successor

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v3.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4_candidate.mjs"
      - "scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4.mjs"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json"
      - "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json"
      - ".github/workflows/buy-void-source-finality-compiled-artifact-attestation-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout and immutable predecessor manifests
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json)" =             "d6e97784c5d8be93713e733628c7d1ef746bb5c7"
          test "$(git hash-object docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json)" =             "a07f2e9b03958a58280c4d940fe49097a9413af5"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact repository artifacts
        run: npm run build

      - name: Preserve historical V3 as predecessor only
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v3 = JSON.parse(fs.readFileSync(
            "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v3.json",
            "utf8",
          ));
          assert.equal(v3.marker, "VOID_BUY_VOID_SOURCE_FINALITY_COMPILED_ARTIFACT_ATTESTATION_V3");
          assert.equal(v3.version, 3);
          assert.equal(v3.production_source_finality_authority_ready, false);
          assert.equal(v3.deployed_artifact_generation_verified, false);
          console.log("HISTORICAL_COMPILED_V3_MANIFEST_IMMUTABLE=true");
          NODE

      - name: Prove locked current compiled V4
        run: |
          node scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4_candidate.mjs --self-test
          node scripts/prove_buy_void_source_finality_compiled_artifact_attestation_v4.mjs

      - name: Require locked V4 authority boundary
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const v4 = JSON.parse(fs.readFileSync(
            "docs/architecture/buy-void-source-finality-compiled-artifact-attestation-v4.json",
            "utf8",
          ));
          assert.equal(v4.compiled_artifact_generation_verified, true);
          assert.equal(v4.deployed_artifact_generation_verified, false);
          assert.equal(v4.runtime_mount_authority, false);
          assert.equal(v4.production_source_finality_authority_ready, false);
          assert.equal(
            v4.predecessor?.manifest_git_blob_sha1,
            "d6e97784c5d8be93713e733628c7d1ef746bb5c7",
          );
          console.log("CURRENT_COMPILED_V4_SUCCESSOR_HOLD_GREEN=true");
          NODE

      - name: Committed-range diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
