name: VOID economic epoch2 public read runtime v1

on:
  pull_request:
    paths:
      - "ops/public/void-economic-epoch2-public-read-runtime-v1.mjs"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "ops/mainnet0/install-void-economic-epoch2-public-read-runtime-v1.sh"
      - "ops/precision/void_precision_epoch2_public_read_runtime_evidence_v1.sh"
      - "ops/mainnet0/economic-epoch2-public-read-runtime-contract-v1.json"
      - "tools/void-economic-epoch2-public-read-runtime-evidence-v1.mjs"
      - "tools/void-economic-epoch2-public-read-runtime-promotion-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_read_runtime_v1.mjs"
      - "tools/void-economic-epoch2-public-read-gateway-v1.mjs"
      - "tools/void-economic-epoch2-public-read-loopback-transport-v1.mjs"
      - "ops/mainnet0/economic-epoch2-public-read-loopback-transport-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - ".github/workflows/void-economic-epoch2-public-read-runtime-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Check public read runtime package syntax
        run: |
          set -euo pipefail
          bash -n ops/mainnet0/install-void-economic-epoch2-public-read-runtime-v1.sh
          bash -n ops/precision/void_precision_epoch2_public_read_runtime_evidence_v1.sh
          node --check ops/public/void-economic-epoch2-public-read-runtime-v1.mjs
          node --check ops/public/void-public-app-composition-gateway-v1.mjs
          node --check tools/void-economic-epoch2-public-read-runtime-evidence-v1.mjs
          node --check tools/void-economic-epoch2-public-read-runtime-promotion-v1.mjs
          node --check scripts/prove_void_economic_epoch2_public_read_runtime_v1.mjs

      - name: Prove bounded public economic read runtime
        run: |
          set -euo pipefail
          node scripts/prove_void_economic_epoch2_public_read_runtime_v1.mjs

      - name: Diff hygiene
        run: git diff --check
