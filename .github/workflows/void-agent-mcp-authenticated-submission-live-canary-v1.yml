name: VOID Agent MCP Authenticated Submission Live Canary V1

on:
  pull_request:
    paths:
      - '.github/workflows/void-agent-mcp-authenticated-submission-live-canary-v1.yml'
      - 'docs/public-agent/void-agent-mcp-authenticated-submission-live-canary-v1.md'
      - 'examples/void-agent-mcp-authenticated-submission-live-canary-v1.example.json'
      - 'schemas/void-agent-mcp-authenticated-submission-live-canary-v1.schema.json'
      - 'tools/void-agent-mcp-authenticated-submission-live-canary-v1.mjs'
      - 'scripts/prove_void_agent_mcp_authenticated_submission_live_canary_v1.mjs'
      - 'integrations/mcp/**'
      - 'tools/void-ai-agent-paid-work-client-v1.mjs'
      - 'scripts/public_agent_service_order_submission_v1.ts'
      - 'ops/public/agent-services-v1/catalog.json'
  push:
    paths:
      - '.github/workflows/void-agent-mcp-authenticated-submission-live-canary-v1.yml'
      - 'docs/public-agent/void-agent-mcp-authenticated-submission-live-canary-v1.md'
      - 'examples/void-agent-mcp-authenticated-submission-live-canary-v1.example.json'
      - 'schemas/void-agent-mcp-authenticated-submission-live-canary-v1.schema.json'
      - 'tools/void-agent-mcp-authenticated-submission-live-canary-v1.mjs'
      - 'scripts/prove_void_agent_mcp_authenticated_submission_live_canary_v1.mjs'
      - 'integrations/mcp/**'
      - 'tools/void-ai-agent-paid-work-client-v1.mjs'
      - 'scripts/public_agent_service_order_submission_v1.ts'
      - 'ops/public/agent-services-v1/catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix integrations/mcp ci --ignore-scripts
      - run: npm --prefix integrations/mcp run check
      - run: node --check tools/void-agent-mcp-authenticated-submission-live-canary-v1.mjs
      - run: node --check scripts/prove_void_agent_mcp_authenticated_submission_live_canary_v1.mjs
      - run: node scripts/prove_void_agent_mcp_authenticated_submission_live_canary_v1.mjs
      - run: npx --no-install tsx scripts/prove_void_agent_mcp_bridge_v1.ts
