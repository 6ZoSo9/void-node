name: Buy VOID Epoch-2 authenticated credential public evidence v2

on:
  pull_request:
    paths:
      - "tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-public-evidence-v2.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-public-evidence-v2.yml"
      - "tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-public-evidence-v2.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-public-evidence-v2.yml"
      - "tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22,24,26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact reviewed dependency generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs)" =             "2431f4fde2c1228a3eef4fecf002fa992c2a758b"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs)" =             "4f1f11bb926a411007359d332d48a7f9812e63df"
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs)" =             "b20a3c8b5081730d2991e9f9ff108ab431bc5611"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py)" =             "5dec0f9534c3b2d6c8d4a0647e69d3c89ab91cd6"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove authenticated credential evidence composition
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs |
            tee "$RUNNER_TEMP/e2-auth-credential-v2.log"
          for marker in             'VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_PUBLIC_EVIDENCE_V2_PROOF_GREEN'             'sealed_public_signature_verified=true'             'authenticated_private_manager_crosscheck=true'             'main_pid_crosscheck=true'             'loadcredential_binding_crosscheck=true'             'service_cgroup_hash_crosscheck=true'             'public_user_bus_sufficient_authority=false'             'credential_source_reemitted=false'             'credential_contents_read_by_composer=false'             'live_payment_signing_authorized=false'             'transaction_sign_or_broadcast_authorized=false'             'public_presale_activation_authorized=false'             'wc_void_market_activation_authorized=false'             'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/e2-auth-credential-v2.log"
          done

      - run: git diff --check
