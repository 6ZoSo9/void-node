name: Buy VOID Epoch-2 authenticated credential public evidence v2

on:
  pull_request:
    paths:
      - "tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-public-evidence-v2.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-public-evidence-v2.yml"
      - "tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"
  push:
    branches: [main]
    paths:
      - "tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs"
      - "scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs"
      - "docs/operators/buy-void-epoch2-authenticated-credential-public-evidence-v2.md"
      - ".github/workflows/buy-void-epoch2-authenticated-credential-public-evidence-v2.yml"
      - "tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs"
      - "ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact reviewed dependency generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-authenticated-credential-public-evidence-v2.mjs)" =             "399620f90dc47613c503ebcf9f27f3d584b6a266"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs)" =             "37e506be9a6982573235de04db6a77f211f1bb4b"
          test "$(git rev-parse HEAD:tools/void-buy-void-epoch2-installed-credential-public-evidence-v1.mjs)" =             "b20a3c8b5081730d2991e9f9ff108ab431bc5611"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_user_manager_credential_query_installed_qualification_v1.py)" =             "8dc5d53dfcc52c261a3da0ee692f3a4fcc0bfc4c"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove source-only authenticated credential evidence composition
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2-auth-credential-v2.log"
          node scripts/prove_buy_void_epoch2_authenticated_credential_public_evidence_v2.mjs |
            tee "$out"
          markers=(
            "VOID_BUY_VOID_EPOCH2_AUTHENTICATED_CREDENTIAL_PUBLIC_EVIDENCE_V2_PROOF_GREEN"
            "sealed_public_signature_verified=true"
            "authenticated_private_manager_fields_crosschecked=true"
            "qualification_provenance_authenticated=false"
            "production_runtime_authority=false"
            "main_pid_crosscheck=true"
            "loadcredential_binding_crosscheck=true"
            "service_cgroup_hash_crosscheck=true"
            "cap_last_cap_projection_revalidated=true"
            "above_kernel_capability_bits_rejected=true"
            "exact_qualifier_schema_mirrored=true"
            "credential_path_relations_revalidated=true"
            "public_user_bus_sufficient_authority=false"
            "credential_source_reemitted=false"
            "credential_contents_read_by_composer=false"
            "live_payment_signing_authorized=false"
            "transaction_sign_or_broadcast_authorized=false"
            "public_presale_activation_authorized=false"
            "wc_void_market_activation_authorized=false"
            "funds_movement_authorized=false"
            "next_action=BUILD_ROOT_LIVE_COMPOSITION_RUNNER_V1"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
