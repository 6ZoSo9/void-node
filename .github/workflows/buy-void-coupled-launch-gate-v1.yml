permissions:
  contents: read

concurrency:
  group: buy-void-coupled-launch-gate-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Provenance checks require the reviewed ancestor object.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed dependencies
        run: npm ci
      - name: Prove canonical coupled launch readiness
        run: node scripts/prove_void_wc_void_coupled_launch_readiness_v1.mjs
      - name: Prove coupled launch source gate
        run: node scripts/prove_void_buy_coupled_launch_gate_v1.mjs
      - name: Prove async bakery-lock lifetime
        run: npx tsx scripts/prove_buy_void_filesystem_bakery_lock_async_v1.ts
      - name: Prove exact sale capacity projection without ledger writes
        run: node --import tsx scripts/prove_buy_void_sale_capacity_projection_v1.ts
      - name: Prove verified-payment capacity admission
        run: npx tsx scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts
      - name: Prove canonical verified-payment V2
        run: npx tsx scripts/prove_buy_void_verified_payment_v2.ts
      - name: Prove canonical verified-payment V2 provenance
        run: npx tsx scripts/prove_buy_void_verified_payment_v2_provenance_v1.ts
      - name: Prove verified-payment duplicate guard
        run: npx tsx scripts/prove_buy_void_verified_payment_duplicate_guard_v1.ts
      - name: Prove duplicate-guard runtime integration
        run: npx tsx scripts/prove_buy_void_verified_payment_duplicate_guard_runtime_integration_v1.ts
      - name: Load canonical generation publisher without mutation
        run: node ops/precision/void-buy-coupled-live-generation-publish-v1.mjs --help
      - name: Build exact runtime artifacts for enforcement attestation
        run: npm run build
      - name: Prove current runtime integration generation successor
        run: node scripts/prove_void_buy_coupled_launch_runtime_integration_generation_dispatch_v3.mjs
      - name: Preserve exact historical inline-persistor V1 proof
        run: test "$(git hash-object scripts/prove_void_buy_coupled_launch_runtime_integration_v1.mjs)" = "699dacd2d4eb21e1a1213a8d0d5d8da94717f3e7"
      - name: Prove current request persistence and privacy against disposable ledgers
        run: node scripts/prove_buy_void_request_under_lock_revalidation_v3.mjs
      - name: Prove current-generation coupled launch runtime integration
        run: node scripts/prove_void_buy_coupled_launch_runtime_integration_current_v3.mjs
      - name: Prove request tx-hash launch-authority binding
        run: npx tsx scripts/prove_buy_void_request_tx_hash_binding_v1.ts
      - name: Diff hygiene
        run: git diff --check
