name: VOID Buy allocation custody service bootstrap plan v1

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-service-bootstrap-plan-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_service_bootstrap_plan_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-service-bootstrap-plan-v1.md"
      - ".github/workflows/buy-void-allocation-custody-service-bootstrap-plan-v1.yml"
      - "tools/void-buy-allocation-custody-service-v1.mjs"
      - "src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-service-contract-v1.json"
      - "tools/void-buy-allocation-custody-host-evidence-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-buy-allocation-custody-service-bootstrap-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only-plan:
    name: Source-only bootstrap plan / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax and source-only adversaries
        run: |
          set -euo pipefail
          node --check tools/void-buy-allocation-custody-service-bootstrap-plan-v1.mjs
          node --check src/economic/buy_void_custody_allocation_roots_observed_read_v1.mjs
          node --check scripts/prove_void_buy_allocation_custody_service_bootstrap_plan_v1.mjs
          node scripts/prove_void_buy_allocation_custody_service_bootstrap_plan_v1.mjs

      - name: Original V1 byte identity and new V2 diagnostic both remain HOLD
        run: |
          set -euo pipefail
          node tools/void-buy-allocation-custody-service-bootstrap-plan-v1.mjs --plan > "$RUNNER_TEMP/original-v1.json"
          node tools/void-buy-allocation-custody-service-bootstrap-plan-v1.mjs --plan-v2 > "$RUNNER_TEMP/inspection-v2.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const one=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const two=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            assert.equal(one.schema,"void.buy.allocation.custody.bootstrap.plan.v1");
            assert.equal(one.version,1);
            assert.equal(one.plan_sha256,"sha256:b279da39b1856ded9c7b90289192bb5ab19ebf7aae157ddd1d644b1f34c7e348");
            assert.equal(two.schema,"void.buy.allocation.custody.bootstrap.plan.v2");
            assert.equal(two.version,2);
            assert.equal(two.predecessor_v1_plan_sha256,one.plan_sha256);
            assert.equal(two.candidate.source_review_generation,"descriptor-inspection-20261010");
            for(const p of [one,two]) {
              assert.equal(p.status,"HOLD_SOURCE_ONLY");
              assert.equal(p.production_gate_ready,false);
              assert.equal(p.candidate.requested_exec_start,null);
              assert.equal(p.executable_unit_emitted,false);
            }
            console.log("VOID_BOOTSTRAP_V1_FROZEN_V2_DIAGNOSTIC_GREEN");
          ' "$RUNNER_TEMP/original-v1.json" "$RUNNER_TEMP/inspection-v2.json"

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
