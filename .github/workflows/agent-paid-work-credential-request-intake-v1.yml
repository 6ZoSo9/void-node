name: Agent paid-work credential request intake V1

on:
  pull_request:
    paths:
      - ".github/workflows/agent-paid-work-credential-request-intake-v1.yml"
      - "docs/operators/agent-paid-work-credential-request-intake-v1.md"
      - "fixtures/agent-paid-work/credential-request-draft-v1.example.json"
      - "scripts/agent_paid_work_credential_request_intake_v1.ts"
      - "scripts/prove_agent_paid_work_credential_request_intake_v1.ts"
      - "scripts/agent_paid_work_order_envelope_v1.ts"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prove credential request intake
        run: npx tsx scripts/prove_agent_paid_work_credential_request_intake_v1.ts

      - name: Regress real-agent handoff
        run: npx tsx scripts/prove_agent_paid_work_real_agent_handoff_v1.ts

      - name: Build
        run: npm run build
