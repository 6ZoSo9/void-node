name: VOID public participant demo safe render v1

on:
  pull_request:
    paths:
      - "public/demo/participant/index.html"
      - "scripts/prove_public_participant_demo_safe_render_v1.mjs"
      - ".github/workflows/public-participant-demo-safe-render-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}
      - name: Bind exact candidate source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          SOURCE_BASE="$(git merge-base "$EXPECTED_HEAD" refs/remotes/origin/main)"
          test -n "$SOURCE_BASE"

          paths=(
            ".github/workflows/public-participant-demo-safe-render-v1.yml"
            "public/demo/participant/index.html"
            "scripts/prove_public_participant_demo_safe_render_v1.mjs"
          )
          git diff --name-status "$SOURCE_BASE" "$EXPECTED_HEAD" -- > "$RUNNER_TEMP/actual.txt"
          test -s "$RUNNER_TEMP/actual.txt"

          validate_name_status() {
            local input="$1"
            while IFS="$(printf '\t')" read -r status path extra; do
              case "$status" in
                A|M) ;;
                *)
                  echo "destructive_or_unexpected_status=$status path=$path" >&2
                  return 1
                  ;;
              esac
              case "$path" in
                ".github/workflows/public-participant-demo-safe-render-v1.yml" | \
                "public/demo/participant/index.html" | \
                "scripts/prove_public_participant_demo_safe_render_v1.mjs") ;;
                *)
                  echo "unexpected_path=$path" >&2
                  return 1
                  ;;
              esac
              test -z "${extra:-}" || return 1
            done < "$input"
          }

          printf 'M\tpublic/demo/participant/index.html\nM\tsrc/unrelated-example.ts\n' > "$RUNNER_TEMP/synthetic-unexpected.txt"
          if validate_name_status "$RUNNER_TEMP/synthetic-unexpected.txt"; then
            echo "synthetic_unexpected_path_was_accepted" >&2
            exit 1
          fi

          validate_name_status "$RUNNER_TEMP/actual.txt"

          for path in "${paths[@]}"; do
            test -s "$path"
          done
          git diff --check "$SOURCE_BASE" "$EXPECTED_HEAD" -- "${paths[@]}"
      - name: Prove participant rendering safety
        run: node scripts/prove_public_participant_demo_safe_render_v1.mjs
