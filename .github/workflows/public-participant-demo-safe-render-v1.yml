name: VOID public participant demo safe render v1

on:
  pull_request:
    paths:
      - "public/demo/participant/index.html"
      - "scripts/prove_public_participant_demo_safe_render_v1.mjs"
      - ".github/workflows/public-participant-demo-safe-render-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}
      - name: Bind exact candidate scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          SOURCE_BASE="$(git merge-base "$EXPECTED_HEAD" refs/remotes/origin/main)"
          test -n "$SOURCE_BASE"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          A	.github/workflows/public-participant-demo-safe-render-v1.yml
          A	scripts/prove_public_participant_demo_safe_render_v1.mjs
          M	public/demo/participant/index.html
          EOF
          git diff --name-status "$SOURCE_BASE" "$EXPECTED_HEAD" -- | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          LC_ALL=C sort "$RUNNER_TEMP/expected.txt" > "$RUNNER_TEMP/expected.sorted.txt"
          diff -u "$RUNNER_TEMP/expected.sorted.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check "$SOURCE_BASE" "$EXPECTED_HEAD" --
      - name: Prove participant rendering safety
        run: node scripts/prove_public_participant_demo_safe_render_v1.mjs
