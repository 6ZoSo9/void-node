name: Apollyon protected first-entry static candidate install handoff v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_install_v1.py"
      - "scripts/prove_apollyon_claim_protected_first_entry_static_candidate_install_v1.py"
      - "docs/security/apollyon-claim-protected-first-entry-static-candidate-install-v1.md"
      - ".github/workflows/apollyon-claim-protected-first-entry-static-candidate-install-v1.yml"
      - "ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_lock_v1.py"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_install_v1.py"
      - "scripts/prove_apollyon_claim_protected_first_entry_static_candidate_install_v1.py"
      - "docs/security/apollyon-claim-protected-first-entry-static-candidate-install-v1.md"
      - ".github/workflows/apollyon-claim-protected-first-entry-static-candidate-install-v1.yml"
      - "ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_lock_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-archive-admission-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify accepted source generation and owned blobs
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor ab7864323b8a924e6c9b5b488c228ff32819bc38 "$EXACT_HEAD"
          printf '%s\n' \
            '2d328245a4850f90ee33a15750e3ba9db00515ad ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_lock_v1.py' \
            '2c0f909a9df8df3a24411a52e9ac4196738e03e7 ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_install_v1.py' \
            '588b2477d876f46d48c85bae46ce2924b6f6357e scripts/prove_apollyon_claim_protected_first_entry_static_candidate_install_v1.py' \
            '5f08d00bc3ab32e17f6cceec0e0d7819ef2ac0e4 docs/security/apollyon-claim-protected-first-entry-static-candidate-install-v1.md' \
            | while read -r blob path; do
                test "$(git hash-object "$path")" = "$blob"
                test "$(git rev-parse "HEAD:$path")" = "$blob"
              done
          echo 'exact_parent_and_owned_source_blobs_bound=true'

      - name: Execute offline in-memory archive adversaries
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for path in (
            "ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_install_v1.py",
            "scripts/prove_apollyon_claim_protected_first_entry_static_candidate_install_v1.py",
          ):
              compile(Path(path).read_bytes(), path, "exec")
          print("source_syntax_green=true")
          PY

          python3 -I -B \
            ops/xiphos/apollyon_claim_protected_first_entry_static_candidate_install_v1.py \
            --self-test > "$RUNNER_TEMP/apollyon-install-handoff-self-test.log"
          grep -Fx 'host_installation=false' "$RUNNER_TEMP/apollyon-install-handoff-self-test.log"
          grep -Fx 'training_execution_authorized=false' "$RUNNER_TEMP/apollyon-install-handoff-self-test.log"
          grep -Fx 'descriptor_close_failures_machine_readable=true' "$RUNNER_TEMP/apollyon-install-handoff-self-test.log"

          python3 -I -B \
            scripts/prove_apollyon_claim_protected_first_entry_static_candidate_install_v1.py \
            > "$RUNNER_TEMP/apollyon-install-handoff-proof.log"
          grep -Fx 'VOID_APOLLYON_CLAIM_PROTECTED_FIRST_ENTRY_STATIC_CANDIDATE_INSTALL_V1_PROOF_GREEN' \
            "$RUNNER_TEMP/apollyon-install-handoff-proof.log"
          for marker in \
            'accepted_parent_lock_bound=true' \
            'descriptor_safe_parent_lock_generation_bound=true' \
            'synthetic_positive_fixture_verified=true' \
            'synthetic_fixture_not_accepted_by_production_lock=true' \
            'parent_failure_machine_readable_hold=true' \
            'archive_held_regular_admission=true' \
            'archive_visible_replacement_not_data_opened=true' \
            'parent_held_regular_admission=true' \
            'parent_visible_replacement_not_data_opened=true' \
            'parent_dependency_descriptor_custody=true' \
            'parent_dependency_held_regular_admission=true' \
            'parent_dependency_visible_replacement_not_data_opened=true' \
            'archive_close_failure_machine_readable_hold=true' \
            'parent_source_close_failure_machine_readable_hold=true' \
            'parent_dependency_close_failure_machine_readable_hold=true' \
            'changed_tar_digest_rejected=true' \
            'wrong_elf_mode_rejected=true' \
            'symlink_member_rejected=true' \
            'extra_member_rejected=true' \
            'missing_member_rejected=true' \
            'wrong_source_head_rejected=true' \
            'manifest_drift_rejected=true' \
            'report_drift_rejected=true' \
            'malformed_report_type_rejected=true' \
            'binary_size_drift_rejected=true' \
            'archive_not_extracted=true' \
            'host_installation=false' \
            'protected_install_authorized=false' \
            'training_execution_authorized=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/apollyon-install-handoff-proof.log"
          done

          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Committed range hygiene
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if test -n "$PR_BASE"; then
            git merge-base --is-ancestor "$PR_BASE" HEAD
            git diff --check "$PR_BASE" HEAD
          else
            git diff --check ab7864323b8a924e6c9b5b488c228ff32819bc38 HEAD
          fi
