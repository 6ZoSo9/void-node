name: VOID Buy VOID witness installation evidence v2

on:
  pull_request:
    paths:
      - "tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-installation-evidence-v2.md"
      - ".github/workflows/buy-void-allocation-custody-witness-installation-evidence-v2.yml"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v2.ts"
      - "src/economic/buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts"
      - "tools/void-buy-allocation-custody-witness-runtime-bundle-evidence-v1.mjs"
      - "scripts/prove_void_buy_allocation_custody_witness_runtime_bundle_evidence_v1.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.md"
      - ".github/workflows/buy-void-allocation-custody-witness-runtime-bundle-evidence-v1.yml"
      - "src/economic/buy_void_allocation_custody_witness_installation_qualification_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_transport_v1.ts"
      - "src/economic/buy_void_allocation_custody_external_witness_v1.ts"
      - "src/economic/buy_void_allocation_custody_witness_identity_continuity_v1.ts"
      - "tools/void-buy-allocation-custody-witness-forced-command-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-witness-installation-evidence-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: witness installation evidence v2 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build canonical dependencies
        run: |
          npm run typecheck
          npm run build

      - name: Syntax-check V2 evidence collector
        run: |
          node --check tools/void-buy-allocation-custody-witness-installation-evidence-v2.mjs
          node --check scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs

      - name: Prove V2 installation evidence collector
        run: node scripts/prove_void_buy_allocation_custody_witness_installation_evidence_v2.mjs

      - name: Preserve merged runtime-bundle evidence collector
        run: node scripts/prove_void_buy_allocation_custody_witness_runtime_bundle_evidence_v1.mjs

      - name: Preserve runtime-bundle qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_qualification_v1.ts

      - name: Preserve V2 installation qualification
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_installation_qualification_v2.ts

      - name: Preserve V2 forced-command continuity handler
        run: node scripts/prove_buy_void_allocation_custody_witness_forced_command_v2.mjs

      - name: Preserve witness transport contract
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_transport_v1.ts

      - name: Preserve witness identity continuity contract
        run: npx tsx scripts/prove_buy_void_allocation_custody_witness_identity_continuity_v1.ts

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
