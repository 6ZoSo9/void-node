name: VOID Buy VOID request custody-read visibility v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_request_custody_read_visibility_v1.ts"
      - "scripts/prove_buy_void_request_under_lock_revalidation_v2.mjs"
      - "scripts/prove_buy_void_request_under_lock_revalidation_v3.mjs"
      - "scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts"
      - "docs/architecture/buy-void-request-custody-read-visibility-v1.md"
      - ".github/workflows/buy-void-request-custody-read-visibility-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/economic/buy_void_request_custody_read_policy_v1.ts"
      - "src/economic/buy_void_public_request_under_launch_lock_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_request_custody_read_visibility_v1.ts"
      - "scripts/prove_buy_void_request_under_lock_revalidation_v2.mjs"
      - "scripts/prove_buy_void_request_under_lock_revalidation_v3.mjs"
      - "scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts"
      - "docs/architecture/buy-void-request-custody-read-visibility-v1.md"
      - ".github/workflows/buy-void-request-custody-read-visibility-v1.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Prove opt-in custody-readable journal contract
        run: |
          set -euo pipefail
          gid="$(id -g)"
          VOID_BUY_REQUEST_CUSTODY_READ_GID="$gid"             npx tsx scripts/prove_buy_void_request_custody_read_visibility_v1.ts |
            tee "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'VOID_BUY_VOID_REQUEST_CUSTODY_READ_VISIBILITY_V1_GREEN' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'request_directory_mode=0750' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'fixed_journal_mode=0640' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'customer_sidecar_mode=0600' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'operator_sidecar_mode=0600' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'operator_sidecar_private_reopen_path=true' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'shared_journal_preflight_precedes_reader_callbacks=true' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'custody_write_authority=false' "$RUNNER_TEMP/custody-read.log"
          grep -Fx 'public_presale_activation=false' "$RUNNER_TEMP/custody-read.log"
      - name: Preserve legacy default behavior
        run: |
          set -euo pipefail
          legacy="$RUNNER_TEMP/custody-read-legacy.log"
          env -u VOID_BUY_REQUEST_CUSTODY_READ_GID \
            npx tsx scripts/prove_buy_void_request_custody_read_visibility_v1.ts |
            tee "$legacy"
          grep -Fx 'VOID_BUY_VOID_REQUEST_CUSTODY_READ_VISIBILITY_V1_LEGACY_DEFAULT_GREEN' "$legacy"
          grep -Fx 'legacy_request_directory_mode=0700' "$legacy"
          grep -Fx 'legacy_request_journal_mode=0600' "$legacy"
          grep -Fx 'legacy_customer_sidecar_mode=0600' "$legacy"
          grep -Fx 'legacy_mode_create_on_first_request=true' "$legacy"
          env -u VOID_BUY_REQUEST_CUSTODY_READ_GID \
            npx tsx scripts/prove_buy_void_verified_payment_capacity_admission_v1.ts
      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          git diff --check "$BASE" "$HEAD"
