name: Apollyon claim peer singleton task-set guard v1

on:
  pull_request:
    paths:
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.c"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.h"
      - "scripts/apollyon_claim_task_singleton_guard_v1_selftest.c"
      - "scripts/prove_apollyon_claim_task_singleton_guard_v1.py"
      - "docs/security/apollyon-claim-task-singleton-guard-v1.md"
      - ".github/workflows/apollyon-claim-task-singleton-guard-v1.yml"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.c"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.h"
      - "scripts/apollyon_durable_attempt_claim_native_process_identity_v2_selftest.c"
      - "scripts/prove_apollyon_durable_attempt_claim_native_process_identity_v2.mjs"
      - ".github/workflows/apollyon-durable-attempt-claim-native-process-identity-v2.yml"
  push:
    branches: [main]
    paths:
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.c"
      - "ops/xiphos/apollyon_claim_task_singleton_guard_v1.h"
      - "scripts/apollyon_claim_task_singleton_guard_v1_selftest.c"
      - "scripts/prove_apollyon_claim_task_singleton_guard_v1.py"
      - "docs/security/apollyon-claim-task-singleton-guard-v1.md"
      - ".github/workflows/apollyon-claim-task-singleton-guard-v1.yml"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.c"
      - "ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.h"
      - "scripts/apollyon_durable_attempt_claim_native_process_identity_v2_selftest.c"
      - "scripts/prove_apollyon_durable_attempt_claim_native_process_identity_v2.mjs"
      - ".github/workflows/apollyon-durable-attempt-claim-native-process-identity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source generation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and event scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_claim_task_singleton_guard_v1.c)" = b507d8d5bff32b39be998482efe3c0e8b729cefe
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_claim_task_singleton_guard_v1.h)" = 2ff84bb8f04ba3bc935272175fb8056624e2222a
          test "$(git rev-parse HEAD:scripts/apollyon_claim_task_singleton_guard_v1_selftest.c)" = fbfade764e58fc2161abb978a9494b55107df47b
          test "$(git rev-parse HEAD:scripts/prove_apollyon_claim_task_singleton_guard_v1.py)" = 6020131271f9448f6ba38d29ea70593a6576d785
          test "$(git rev-parse HEAD:docs/security/apollyon-claim-task-singleton-guard-v1.md)" = 770d0c95c28a5439faf5cfbbe8f20a2656693131
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.c)" = ecc262686cdc388d08775c735c68430e737e40d5
          test "$(git rev-parse HEAD:ops/xiphos/apollyon_durable_attempt_claim_native_process_identity_v2.h)" = 5355ffd2856e0f0c57f6e52fd1b347441b94e4d7
          test "$(git rev-parse HEAD:scripts/apollyon_durable_attempt_claim_native_process_identity_v2_selftest.c)" = fae7e024425e1c32cfe2ae7b896825ef9de6d4ce
          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE"
              BASE="$PR_BASE"
              git merge-base --is-ancestor "$BASE" "$HEAD"
              actual="$RUNNER_TEMP/apollyon-singleton-actual.txt"
              expected="$RUNNER_TEMP/apollyon-singleton-expected.txt"
              git diff --name-status "$BASE" "$HEAD" | LC_ALL=C sort > "$actual"
              printf '%s\n' \
                $'A\tops/xiphos/apollyon_claim_task_singleton_guard_v1.c' \
                $'A\tops/xiphos/apollyon_claim_task_singleton_guard_v1.h' \
                $'A\tscripts/apollyon_claim_task_singleton_guard_v1_selftest.c' \
                $'A\tscripts/prove_apollyon_claim_task_singleton_guard_v1.py' \
                $'A\tdocs/security/apollyon-claim-task-singleton-guard-v1.md' \
                $'A\t.github/workflows/apollyon-claim-task-singleton-guard-v1.yml' | LC_ALL=C sort > "$expected"
              cmp "$expected" "$actual"
              ;;
            push)
              test -n "$PUSH_BEFORE"
              test "$PUSH_BEFORE" != "0000000000000000000000000000000000000000"
              BASE="$PUSH_BEFORE"
              git merge-base --is-ancestor "$BASE" "$HEAD"
              ;;
            workflow_dispatch)
              BASE="$(git rev-parse HEAD^)"
              ;;
            *)
              echo "unsupported_event=$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git diff --check "$BASE" "$HEAD"
      - name: Compile and prove singleton task-set guard
        run: |
          set -euo pipefail
          command -v gcc
          python3 -I -B scripts/prove_apollyon_claim_task_singleton_guard_v1.py |
            tee "$RUNNER_TEMP/apollyon-singleton-proof.txt"
          markers=(
            "VOID_APOLLYON_CLAIM_TASK_SINGLETON_GUARD_V1_PROOF_GREEN"
            "parent_3309_native_source_and_header_pinned=true"
            "exact_native_source_and_header_pinned=true"
            "native_three_build_reproducible=true"
            "singleton_child_accepted=true"
            "second_live_tid_rejected=true"
            "singleton_reaccepted_after_join=true"
            "wrong_start_generation_rejected=true"
            "invalid_pidfd_rejected=true"
            "exited_pidfd_rejected=true"
            "fake_procfs_rejected=true"
            "continuous_single_threadedness_proven=false"
            "process_wide_credential_authority_proven=false"
            "protected_peer_identity_proven=false"
            "durable_attempt_claim_performed=false"
            "trainer_release_authorized=false"
            "training_execution_performed=false"
            "host_installation_performed=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$RUNNER_TEMP/apollyon-singleton-proof.txt"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
