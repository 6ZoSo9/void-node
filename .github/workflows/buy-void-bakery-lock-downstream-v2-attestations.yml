name: VOID bakery-lock downstream V2 attestations

on:
  pull_request:
    paths:
      - "src/economic/buy_void_filesystem_bakery_lock_v1.ts"
      - "scripts/prove_buy_void_allocation_custody_witness_runtime_bundle_v2_candidate.mjs"
      - "scripts/prove_coupled_native_gas_reconciliation_custody_source_binding_v2_candidate.mjs"
      - "docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-v2-attestation.json"
      - "docs/architecture/coupled-native-gas-reconciliation-custody-source-binding-v2-attestation.json"
      - "scripts/prove_buy_void_bakery_lock_downstream_v2_attestations.mjs"
      - "docs/architecture/buy-void-bakery-lock-downstream-v2-attestations.md"
      - ".github/workflows/buy-void-bakery-lock-downstream-v2-attestations.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "scripts/copy_void_runtime_js_v1.mjs"
      - "scripts/retire_saveblock_periodic_rewriters_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-bakery-downstream-v2-attestations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: bakery downstream V2 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact runtime bytes
        run: npm run build

      - name: Prove locked V2 successor attestations
        run: |
          set -euo pipefail
          node scripts/prove_buy_void_bakery_lock_downstream_v2_attestations.mjs             | tee "bakery-downstream-v2-node-${{ matrix.node }}.txt"
          cp docs/architecture/buy-void-allocation-custody-witness-runtime-bundle-v2-attestation.json             "custody-runtime-bundle-v2-node-${{ matrix.node }}.json"
          cp docs/architecture/coupled-native-gas-reconciliation-custody-source-binding-v2-attestation.json             "native-gas-source-binding-v2-node-${{ matrix.node }}.json"

      - name: Upload exact locked evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bakery-downstream-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            bakery-downstream-v2-node-${{ matrix.node }}.txt
            custody-runtime-bundle-v2-node-${{ matrix.node }}.json
            native-gas-source-binding-v2-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi

  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download exact locked evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bakery-downstream-v2-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: ./evidence

      - name: Require Node 22/24/26 byte equality
        run: |
          set -euo pipefail
          for v in 22 24 26; do
            test -s "evidence/custody-runtime-bundle-v2-node-$v.json"
            test -s "evidence/native-gas-source-binding-v2-node-$v.json"
          done
          cmp evidence/custody-runtime-bundle-v2-node-22.json evidence/custody-runtime-bundle-v2-node-24.json
          cmp evidence/custody-runtime-bundle-v2-node-22.json evidence/custody-runtime-bundle-v2-node-26.json
          cmp evidence/native-gas-source-binding-v2-node-22.json evidence/native-gas-source-binding-v2-node-24.json
          cmp evidence/native-gas-source-binding-v2-node-22.json evidence/native-gas-source-binding-v2-node-26.json
          echo "VOID_BUY_VOID_BAKERY_DOWNSTREAM_V2_CROSS_NODE_GREEN"
