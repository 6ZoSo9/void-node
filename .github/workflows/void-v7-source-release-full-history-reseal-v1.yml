name: VOID V7 full-history source-release reseal v1

on:
  pull_request:
    paths:
      - 'ops/precision/void_v7_source_release_full_history_reseal_v1.py'
      - 'scripts/prove_void_v7_source_release_full_history_reseal_v1.py'
      - 'docs/operators/void-v7-source-release-full-history-reseal-v1.md'
      - '.github/workflows/void-v7-source-release-full-history-reseal-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reseal-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact four-file scope and blobs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_v7_source_release_full_history_reseal_v1.py)" = "5b1bfbf98ade36506f65fb9ab4e96b3db6b73d0b"
          test "$(git rev-parse HEAD:scripts/prove_void_v7_source_release_full_history_reseal_v1.py)" = "30c1bb56e5c6d3e65e9be8b404be36a3998f8cde"
          test "$(git rev-parse HEAD:docs/operators/void-v7-source-release-full-history-reseal-v1.md)" = "a296a15dd188e2befbd0e4708aa2518f96a190a9"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
            cat > /tmp/expected <<'EOF'
          A	.github/workflows/void-v7-source-release-full-history-reseal-v1.yml
          A	docs/operators/void-v7-source-release-full-history-reseal-v1.md
          A	ops/precision/void_v7_source_release_full_history_reseal_v1.py
          A	scripts/prove_void_v7_source_release_full_history_reseal_v1.py
          EOF
            git diff --name-status "${{ github.event.pull_request.base.sha }}" HEAD -- | sort > /tmp/actual
            sort /tmp/expected > /tmp/expected.sorted
            diff -u /tmp/expected.sorted /tmp/actual
          fi
          git diff --check

      - name: Syntax and source proof
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          for rel in (
              "ops/precision/void_v7_source_release_full_history_reseal_v1.py",
              "scripts/prove_void_v7_source_release_full_history_reseal_v1.py",
          ):
              raw = Path(rel).read_bytes()
              compile(raw, rel, "exec", dont_inherit=True, optimize=0)
          PY
          python3 -I -B scripts/prove_void_v7_source_release_full_history_reseal_v1.py

      - name: Build and verify disposable full-history candidate
        run: |
          set -euo pipefail
          mkdir -p /home/runner/Downloads
          python3 -I -B ops/precision/void_v7_source_release_full_history_reseal_v1.py             --build             --output /home/runner/Downloads/void-v7-full-history-candidate
          test ! -e /home/runner/Downloads/void-v7-full-history-candidate/.git/shallow
          test "$(git -C /home/runner/Downloads/void-v7-full-history-candidate rev-parse --is-shallow-repository)" = false
          test "$(git -C /home/runner/Downloads/void-v7-full-history-candidate rev-list --count 4c80887adc2b55e327f1aaec4f58a90d0bb1a3fb)" = 17931
          test "$(git -C /home/runner/Downloads/void-v7-full-history-candidate rev-parse HEAD)" = 4c80887adc2b55e327f1aaec4f58a90d0bb1a3fb
          test "$(git -C /home/runner/Downloads/void-v7-full-history-candidate rev-parse 'HEAD^{tree}')" = de12c9d2d5e475d435d21da3b047d7b63b69e2b7
          test -z "$(git -C /home/runner/Downloads/void-v7-full-history-candidate status --porcelain=v1 --untracked-files=all)"
