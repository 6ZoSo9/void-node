name: P2P Authenticated Edge Wall v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2p-*.yml'
      - 'scripts/prove_p2p_*'
      - 'src/p2p/**'
      - 'ops/mainnet0/*p2p*'
      - 'docs/architecture/p2p-*.md'
      - 'src/index.ts'
      - 'tools/check_index_size.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/p2p-*.yml'
      - 'scripts/prove_p2p_*'
      - 'src/p2p/**'
      - 'ops/mainnet0/*p2p*'
      - 'docs/architecture/p2p-*.md'
      - 'src/index.ts'
      - 'tools/check_index_size.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  p2p-authenticated-edge-wall-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove authenticated P2P edge wall runtime
        run: npx tsx scripts/prove_p2p_authenticated_edge_wall_v1.ts

      - name: Prove authenticated P2P edge wall boundaries
        run: npx tsx scripts/prove_p2p_authenticated_edge_wall_guard_v1.ts

      - name: Guard index.ts size and markers
        run: |
          chmod +x tools/check_index_size.sh
          tools/check_index_size.sh

      - name: Build
        run: npm run build
