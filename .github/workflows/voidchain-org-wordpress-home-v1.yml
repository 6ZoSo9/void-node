name: voidchain.org WordPress home v1

on:
  pull_request:
    paths:
      - ".github/workflows/voidchain-org-wordpress-home-v1.yml"
      - "docs/operators/voidchain-org-wordpress-home-v1.md"
      - "ops/public/voidchain-org-wordpress-home-v1.html"
      - "ops/public/sync-voidchain-org-wordpress-home-v1.mjs"
      - "scripts/prove_voidchain_org_wordpress_home_v1.mjs"
      - "scripts/prove_wordpress_production_ref_guards_v1.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voidchain-org-wordpress-home-v1.yml"
      - "docs/operators/voidchain-org-wordpress-home-v1.md"
      - "ops/public/voidchain-org-wordpress-home-v1.html"
      - "ops/public/sync-voidchain-org-wordpress-home-v1.mjs"
      - "scripts/prove_voidchain_org_wordpress_home_v1.mjs"
      - "scripts/prove_wordpress_production_ref_guards_v1.mjs"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only inspect or guarded page-content apply"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      expected_modified_gmt:
        description: "Exact authenticated inspect value; required for apply"
        required: false
        type: string
      expected_content_sha256:
        description: "Exact authenticated inspect value; required for apply"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: voidchain-org-wordpress-home-v1
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node --check ops/public/sync-voidchain-org-wordpress-home-v1.mjs
      - run: node --check scripts/prove_voidchain_org_wordpress_home_v1.mjs
      - run: node --check scripts/prove_wordpress_production_ref_guards_v1.mjs
      - run: node scripts/prove_voidchain_org_wordpress_home_v1.mjs
      - run: node scripts/prove_wordpress_production_ref_guards_v1.mjs

  inspect_ref_guard:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require exact main ref for authenticated production inspect
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::voidchain.org production inspect requires refs/heads/main; got $GITHUB_REF"
            exit 1
          fi

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    needs: [proof, inspect_ref_guard]
    environment: voidchain-org-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Inspect exact WordPress page
        env:
          VOIDCHAIN_WORDPRESS_USERNAME: ${{ secrets.VOIDCHAIN_WORDPRESS_USERNAME }}
          VOIDCHAIN_WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.VOIDCHAIN_WORDPRESS_APPLICATION_PASSWORD }}
        run: node ops/public/sync-voidchain-org-wordpress-home-v1.mjs --inspect

  apply_ref_guard:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require exact main ref for production apply
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::voidchain.org production apply requires refs/heads/main; got $GITHUB_REF"
            exit 1
          fi

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: [proof, apply_ref_guard]
    environment: voidchain-org-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Apply exact reviewed WordPress page
        env:
          VOIDCHAIN_WORDPRESS_USERNAME: ${{ secrets.VOIDCHAIN_WORDPRESS_USERNAME }}
          VOIDCHAIN_WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.VOIDCHAIN_WORDPRESS_APPLICATION_PASSWORD }}
          EXPECTED_MODIFIED_GMT: ${{ inputs.expected_modified_gmt }}
          EXPECTED_CONTENT_SHA256: ${{ inputs.expected_content_sha256 }}
        run: |
          node ops/public/sync-voidchain-org-wordpress-home-v1.mjs \
            --apply \
            --expected-modified-gmt "$EXPECTED_MODIFIED_GMT" \
            --expected-content-sha256 "$EXPECTED_CONTENT_SHA256"
