name: Buy VOID Epoch-2 live composition native candidate v2

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v2.yml"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-v2.md"
  push:
    branches: [main]
    paths:
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - ".github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-v2.yml"

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve pre-repair V2 candidate as historical evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs)" =             "92e8c8696ea7e2bb81b6ef089db8baa657188935"
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c)" =             "4aa091e7835b32aa5c4e7b8e4059651c69a64eb3"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs)" =             "c07773c2d1e365b408ef2e5f859e0dfbf4fdbd88"
          test "$(git rev-parse HEAD:.github/workflows/buy-void-epoch2-live-composition-native-preentry-v1.yml)" =             "85c28fdf03345240332cbf41d46fbda065958ec7"
          test "$(git rev-parse HEAD:scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs)" =             "14cbe81e27d04fee77cbe75225ce308bf8561a7b"

          echo VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_V2_HISTORICAL_PRESERVED
          echo historical_candidate_head=de1d19d8782405afa4d62ae670b11087d9c7e93e
          echo historical_workflow_run=38811855456
          echo historical_source_proof_blob=4db3583c5c058a581fce69ef49312f7d3534b8ca
          echo current_repaired_source_proof_blob=c07773c2d1e365b408ef2e5f859e0dfbf4fdbd88
          echo current_candidate_generation=v3_required
          echo candidate_accepted=false
          echo install_authorized=false
          echo live_execution_authorized=false
          echo credential_access=false
          echo private_key_access=false
          echo transaction=false
          echo payment_acceptance=false
          echo public_presale_activation=false
          echo wc_void_market_activation=false
          echo funds_movement=false

      - run: git diff --check
