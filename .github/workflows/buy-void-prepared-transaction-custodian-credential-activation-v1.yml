name: Buy VOID custodian credential activation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-prepared-transaction-custodian-credential-activation-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-custodian-credential-activation-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_custodian_credential_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_credential_signer_v1.ts"
      - "src/economic/buy_void_native_fulfillment_wallet_credential_signer_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_ipc_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custody_v1.ts"
      - "tools/buy-void-prepared-transaction-custodian-service-v1.mjs"
      - "scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_custodian_ipc_v1.ts"
      - "scripts/prove_buy_void_saga_prepared_transaction_custody_v1.ts"
      - "scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buy-void-prepared-transaction-custodian-credential-activation-v1.yml"
      - "docs/operators/buy-void-prepared-transaction-custodian-credential-activation-v1.md"
      - "scripts/prove_buy_void_prepared_transaction_custodian_credential_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_custodian_credential_composition_v1.ts"
      - "src/economic/buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts"
      - "src/economic/buy_void_prepared_transaction_credential_signer_v1.ts"
      - "tools/buy-void-prepared-transaction-custodian-service-v1.mjs"

permissions:
  contents: read

concurrency:
  group: buy-void-custodian-credential-activation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove explicit custodian credential activation
        run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_activation_v1.ts
      - name: Preserve credential composition and embedded signer boundaries
        run: |
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_credential_composition_v1.ts
      - name: Preserve private custodian and saga custody boundaries
        run: |
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_custodian_ipc_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_prepared_transaction_custody_v1.ts
          npx --no-install tsx scripts/prove_buy_void_crash_consistent_saga_runtime_v1.ts
      - name: Preserve merged broadcaster submission activation
        run: npx --no-install tsx scripts/prove_buy_void_prepared_transaction_broadcaster_submission_activation_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
