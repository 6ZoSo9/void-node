name: Buy VOID Epoch-2 installed credential attestation v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-epoch2-installed-credential-attestation-v1.yml"
      - "src/economic/buy_void_epoch2_credential_attestation_v1.ts"
      - "scripts/void_buy_void_epoch2_credential_attestation_v1.ts"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs"
      - "scripts/prove_buy_void_epoch2_credential_attestation_sealed_v1.mjs"
      - "scripts/prove_buy_void_epoch2_credential_attestation_v1.ts"
      - "ops/systemd/void-node-live.service.d/97-buy-void-epoch2-fulfiller-credential-v1.conf.example"
      - "docs/operators/buy-void-epoch2-installed-credential-attestation-v1.md"
      - "src/economic/buy_void_native_fulfillment_wallet_credential_signer_v1.ts"
      - "src/economic/buy_void_epoch2_fulfillment_access_list_v1.ts"
      - "src/economic/buy_void_epoch2_credential_source_binding_v1.ts"
      - "src/economic/buy_void_payment_keyed_full_runtime_v1.ts"
      - "tools/void-buy-void-epoch2-postgres-source-qualification-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-epoch2-installed-credential-attestation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Prove sealed pre-execution credential boundary
        run: |
          set -euo pipefail
          node --check scripts/void_buy_void_epoch2_credential_attestation_sealed_v1.mjs
          node --check scripts/prove_buy_void_epoch2_credential_attestation_sealed_v1.mjs
          node scripts/prove_buy_void_epoch2_credential_attestation_sealed_v1.mjs \
            | tee "epoch2-credential-attestation-sealed-${{ matrix.node }}.txt"
          for marker in \
            'VOID_BUY_VOID_EPOCH2_CREDENTIAL_ATTESTATION_SEALED_V1_PROOF_GREEN' \
            'builtin_only_probe=true' \
            'tsx_loader_in_live_probe=false' \
            'git_object_stdin_required=true' \
            'direct_worktree_probe_rejected=true' \
            'dirty_top_level_sentinel_never_executed=true' \
            'domain_separated_nontransaction_signature_green=true' \
            'private_key_string_materialization=false' \
            'sec1_der_buffer_zeroed=true' \
            'trusted_node_binary_required=true' \
            'node_loader_environment_empty=true' \
            'transaction_constructed=false' \
            'credential_access_in_proof=false' \
            'funds_movement=false'
          do
            grep -Fx "$marker" \
              "epoch2-credential-attestation-sealed-${{ matrix.node }}.txt"
          done

      - name: Prove E2 credential attestation source boundary
        run: |
          set -euo pipefail
          node --import tsx scripts/prove_buy_void_epoch2_credential_attestation_v1.ts \
            | tee "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'VOID_BUY_VOID_EPOCH2_CREDENTIAL_ATTESTATION_V1_PROOF_GREEN' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'distinct_epoch2_systemd_credential_required=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'canonical_probe_semantics_bound=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'caller_selected_executable_probe_rejected=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'probe_challenge_derivation_bound=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'probe_intrinsically_non_executable=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'probe_gas_limit=1' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'minimum_evm_intrinsic_gas=21000' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'probe_nonce_number_max_safe_integer=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'dummy_signer_production_evidence_rejected=true' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          for marker in \
            'worktree_authority_bytes_bound=true' \
            'dirty_or_sparse_worktree_held=true' \
            'assume_unchanged_or_skip_worktree_held=true' \
            'worktree_blob_substitution_held=true' \
            'git_environment_sanitized=true' \
            'authority_modules_imported_after_source_preflight=true'
          do
            grep -Fx "$marker" \
              "epoch2-credential-attestation-${{ matrix.node }}.txt"
          done
          grep -Fx 'transaction_broadcast=false' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'presale_activation=false' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"
          grep -Fx 'funds_movement=false' \
            "epoch2-credential-attestation-${{ matrix.node }}.txt"

      - name: Prove operator CLI defaults to zero access
        run: |
          set -euo pipefail
          node --import tsx scripts/void_buy_void_epoch2_credential_attestation_v1.ts \
            | tee "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"status": "disabled"' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"reason": "epoch2_credential_attestation_probe_not_requested"' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"systemd_observation_performed": false' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"credential_content_read": false' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"signing_performed": false' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"transaction_broadcast_performed": false' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"
          grep -F '"funds_movement": false' \
            "epoch2-credential-attestation-disabled-${{ matrix.node }}.json"

      - name: Diff hygiene
        run: git diff --check
