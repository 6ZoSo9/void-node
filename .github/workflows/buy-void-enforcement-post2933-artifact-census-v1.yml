name: VOID Buy VOID post-2933 enforcement artifact census v1

on:
  pull_request:
    paths:
      - ".github/workflows/buy-void-enforcement-post2933-artifact-census-v1.yml"
      - "scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs"
      - "docs/architecture/buy-void-enforcement-post2933-artifact-census-v1.md"
      - "src/economic/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
      - "ops/security/reviewed-node-package-runtime-enforcement-post2865-v1.json"
      - "ops/security/buy-void-delivery-dependency-provider-closure-post2865-v1.json"
      - "ops/security/buy-void-enforcement-post2865-lock-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git merge-base --is-ancestor c8ce2b67b72cd59111a62d9638035a46c6120afa HEAD

      - name: Use reviewed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact audited dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile exact post-2933 source
        run: |
          set -euo pipefail
          npm run typecheck
          node ./node_modules/typescript/bin/tsc -p tsconfig.build.json
          node --check scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs

      - name: Derive unaccepted artifact census
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/enforcement-post2933-census-${{ matrix.node }}.json"
          node scripts/prove_buy_void_enforcement_post2933_artifact_census_v1.mjs > "$out"
          node --input-type=module - "$out" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(c.marker,"VOID_BUY_VOID_ENFORCEMENT_POST2933_ARTIFACT_CENSUS_V1");
          assert.equal(c.source_parent,"c8ce2b67b72cd59111a62d9638035a46c6120afa");
          assert.equal(c.artifact_count,27);
          assert.equal(c.source_file_count,27);
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          assert.match(c.census_id,/^voidbe2933c1_[0-9a-f]{64}$/u);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2933_ARTIFACT_CENSUS_NODE_GREEN");
          NODE

      - name: Diff hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$HEAD^"; fi
          git cat-file -e "$BASE^{commit}"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          test -n "$MERGE_BASE"
          git diff --check "$MERGE_BASE" "$HEAD"

      - name: Upload census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enforcement-post2933-census-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/enforcement-post2933-census-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node:
    needs: [census]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Download census receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: enforcement-post2933-census-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: receipts

      - name: Require exact Node 22 24 26 census identity
        run: |
          set -euo pipefail
          for node in 22 24 26; do
            test -s "receipts/enforcement-post2933-census-$node.json"
          done
          cmp receipts/enforcement-post2933-census-22.json receipts/enforcement-post2933-census-24.json
          cmp receipts/enforcement-post2933-census-22.json receipts/enforcement-post2933-census-26.json
          sha256sum receipts/enforcement-post2933-census-22.json
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("receipts/enforcement-post2933-census-22.json","utf8"));
          assert.equal(c.artifact_count,27);
          assert.equal(c.census_only,true);
          assert.equal(c.complete_executable_closure_verified,false);
          assert.equal(c.candidate_enforcement_identity_accepted,false);
          assert.equal(c.production_source_finality_authority_ready,false);
          assert.equal(c.public_presale_activation,false);
          assert.equal(c.funds_movement,false);
          console.log("VOID_BUY_VOID_ENFORCEMENT_POST2933_ARTIFACT_CENSUS_CROSS_NODE_GREEN");
          console.log("census_id="+c.census_id);
          console.log("prior_accepted_enforcement_set_sha256="+c.prior_accepted_enforcement_set_sha256);
          console.log("artifact_count="+c.artifact_count);
          console.log("candidate_enforcement_identity_accepted=false");
          console.log("production_source_finality_authority_ready=false");
          NODE
