name: VOID epoch2 signed-artifact candidate metadata review v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-signed-artifact-candidate-metadata-review-v1.yml"
      - "tools/void-economic-epoch2-signed-artifact-candidate-metadata-review-v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_artifact_candidate_metadata_review_v1.mjs"
      - "docs/operators/economic-epoch2-signed-artifact-candidate-metadata-review-v1.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/void-economic-epoch2-signed-artifact-candidate-metadata-review-v1.yml"
      - "tools/void-economic-epoch2-signed-artifact-candidate-metadata-review-v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_artifact_candidate_metadata_review_v1.mjs"
      - "docs/operators/economic-epoch2-signed-artifact-candidate-metadata-review-v1.md"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - run: node scripts/prove_void_economic_epoch2_signed_artifact_candidate_metadata_review_v1.mjs
