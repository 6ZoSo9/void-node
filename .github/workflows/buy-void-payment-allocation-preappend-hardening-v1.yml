name: VOID Buy VOID payment allocation preappend hardening v1

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_allocation_replay_binding_v1.ts"
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_payment_allocation_preappend_hardening_v1.ts"
      - "docs/architecture/buy-void-payment-allocation-preappend-hardening-v1.md"
      - ".github/workflows/buy-void-payment-allocation-preappend-hardening-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-void-payment-allocation-preappend-hardening-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: preappend hardening / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove real OS-temp preappend and sidecar boundaries
        run: npx tsx scripts/prove_buy_void_payment_allocation_preappend_hardening_v1.ts

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
