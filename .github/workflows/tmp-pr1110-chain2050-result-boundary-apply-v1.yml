name: VOID PR1110 chain2050 transport result boundary apply v1

on:
  push:
    branches:
      - fix/buy-void-chain2050-transport-result-boundary-v1-20260808
    paths:
      - .github/workflows/tmp-pr1110-chain2050-result-boundary-apply-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Apply bounded fail-closed transport result hardening
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE='7d2ea5a633b29d08432190543e2ff2d5a82ed082'
          BRANCH='fix/buy-void-chain2050-transport-result-boundary-v1-20260808'
          HELPER='.github/workflows/tmp-pr1110-chain2050-result-boundary-apply-v1.yml'
          SOURCE='src/economic/buy_void_native_chain2050_broadcaster_v1.ts'
          PROOF='scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts'
          GUARD='scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts'

          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = "$HELPER"
          test "$(git rev-parse "$BASE:$SOURCE")" = '6bb2912ee0e89839bf83ce6663234614a756518c'
          test "$(git rev-parse "$BASE:$PROOF")" = 'b2a83e37ece3550d6f351290eff0e938940b8c7c'
          test "$(git rev-parse "$BASE:$GUARD")" = 'fe9b7edea8c94be9df68cd85595ac9f0d242eda0'

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/economic/buy_void_native_chain2050_broadcaster_v1.ts')
          source = source_path.read_text()

          provider_anchor = '''function providerId(requestId: number, suffix: string): string {
            return safeProviderSubmissionId(
              `chain2050-rpc:${requestId}:${suffix}`,
            );
          }
          '''
          validator = '''
          function hasOwn(
            record: Record<string, unknown>,
            key: string,
          ): boolean {
            return Object.prototype.hasOwnProperty.call(record, key);
          }

          function invalidTransportResult(
            input: Readonly<BuyVoidNativeChain2050JsonRpcCallV1>,
          ): BuyVoidNativeChain2050JsonRpcCallHeldV1 {
            return {
              ok: false,
              request_sent: input.method === "eth_sendRawTransaction",
              response_received: false,
              http_status: null,
              request_id: input.request_id,
              error_code: "transport_result_boundary_invalid",
              json_rpc_error_code: "",
              provider_submission_id: providerId(
                input.request_id,
                "boundary-invalid",
              ),
            };
          }

          function normalizeTransportResult(
            input: Readonly<BuyVoidNativeChain2050JsonRpcCallV1>,
            value: unknown,
          ): BuyVoidNativeChain2050JsonRpcCallResultV1 {
            const invalid = (): BuyVoidNativeChain2050JsonRpcCallHeldV1 =>
              invalidTransportResult(input);

            if (!value || typeof value !== "object" || Array.isArray(value)) {
              return invalid();
            }

            const record = value as Record<string, unknown>;
            const providerRaw = record.provider_submission_id;
            if (
              !hasOwn(record, "provider_submission_id") ||
              typeof providerRaw !== "string" ||
              providerRaw !== safeProviderSubmissionId(providerRaw)
            ) {
              return invalid();
            }
            const providerSubmissionId = providerRaw;

            if (record.ok === true) {
              if (
                !hasOwn(record, "ok") ||
                !hasOwn(record, "request_sent") ||
                !hasOwn(record, "response_received") ||
                !hasOwn(record, "http_status") ||
                !hasOwn(record, "request_id") ||
                record.request_sent !== true ||
                record.response_received !== true ||
                record.http_status !== 200 ||
                record.request_id !== input.request_id ||
                !hasOwn(record, "result") ||
                hasOwn(record, "error_code") ||
                hasOwn(record, "json_rpc_error_code")
              ) {
                return invalid();
              }
              return {
                ok: true,
                request_sent: true,
                response_received: true,
                http_status: 200,
                request_id: input.request_id,
                result: record.result,
                provider_submission_id: providerSubmissionId,
              };
            }

            if (record.ok === false) {
              const requestSent = record.request_sent;
              const responseReceived = record.response_received;
              const httpStatus = record.http_status;
              const errorCode = record.error_code;
              const jsonRpcErrorCode = record.json_rpc_error_code;
              if (
                !hasOwn(record, "ok") ||
                !hasOwn(record, "request_sent") ||
                !hasOwn(record, "response_received") ||
                !hasOwn(record, "http_status") ||
                !hasOwn(record, "request_id") ||
                !hasOwn(record, "error_code") ||
                !hasOwn(record, "json_rpc_error_code") ||
                typeof requestSent !== "boolean" ||
                typeof responseReceived !== "boolean" ||
                (httpStatus !== null &&
                  (typeof httpStatus !== "number" ||
                    !Number.isInteger(httpStatus) ||
                    httpStatus < 100 ||
                    httpStatus > 599)) ||
                record.request_id !== input.request_id ||
                typeof errorCode !== "string" ||
                !/^[A-Za-z0-9._:-]{1,160}$/.test(errorCode) ||
                typeof jsonRpcErrorCode !== "string" ||
                !/^(?:|-?[0-9]{1,12})$/.test(jsonRpcErrorCode) ||
                hasOwn(record, "result")
              ) {
                return invalid();
              }
              return {
                ok: false,
                request_sent: requestSent,
                response_received: responseReceived,
                http_status: httpStatus as number | null,
                request_id: input.request_id,
                error_code: errorCode,
                json_rpc_error_code: jsonRpcErrorCode,
                provider_submission_id: providerSubmissionId,
              };
            }

            return invalid();
          }
          '''
          if source.count(provider_anchor) != 1:
              raise SystemExit('HOLD: provider anchor mismatch')
          source = source.replace(provider_anchor, provider_anchor + validator, 1)

          old_call = '''  try {
              return await transport.call(input);
            } catch (error) {'''
          new_call = '''  try {
              const response: unknown = await transport.call(input);
              return normalizeTransportResult(input, response);
            } catch (error) {'''
          if source.count(old_call) != 1:
              raise SystemExit('HOLD: callTransport anchor mismatch')
          source = source.replace(old_call, new_call, 1)
          source_path.write_text(source)

          proof_path = Path('scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts')
          proof = proof_path.read_text()
          queue_anchor = 'function queueTransport(\n'
          malformed_helper = '''function malformed(
            value: unknown,
          ): BuyVoidNativeChain2050JsonRpcCallResultV1 {
            return value as BuyVoidNativeChain2050JsonRpcCallResultV1;
          }

          '''
          if proof.count(queue_anchor) != 1:
              raise SystemExit('HOLD: proof queue anchor mismatch')
          proof = proof.replace(queue_anchor, malformed_helper + queue_anchor, 1)

          wallet_anchor = 'const wallet = Wallet.createRandom();\n'
          malformed_probe_tests = '''const malformedProbeResponses = [
            malformed(null),
            malformed([]),
            malformed({
              ok: false,
              request_sent: true,
              response_received: true,
              http_status: 200,
              request_id: 1,
              result: "0x802",
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: false,
              response_received: true,
              http_status: 200,
              request_id: 1,
              result: "0x802",
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: false,
              http_status: 200,
              request_id: 1,
              result: "0x802",
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: true,
              http_status: 503,
              request_id: 1,
              result: "0x802",
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: true,
              http_status: 200,
              request_id: 99,
              result: "0x802",
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: true,
              http_status: 200,
              request_id: 1,
              provider_submission_id: "proof:1:malformed",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: true,
              http_status: 200,
              request_id: 1,
              result: "0x802",
              provider_submission_id: "bad provider id!",
            }),
            malformed({
              ok: true,
              request_sent: true,
              response_received: true,
              http_status: 200,
              request_id: 1,
              result: "0x802",
              error_code: "synthetic_error",
              json_rpc_error_code: "",
              provider_submission_id: "proof:1:malformed",
            }),
          ];

          for (const malformedResponse of malformedProbeResponses) {
            const queued = queueTransport([malformedResponse]);
            const probe = await probeBuyVoidNativeChain2050BroadcasterV1(
              policy,
              queued.transport,
            );
            assert.equal(probe.ok, false);
            if (probe.ok) throw new Error("malformed transport result accepted");
            assert.equal(probe.reason, "chain_identity_probe_failed");
            assert.equal(
              probe.detail?.error_code,
              "transport_result_boundary_invalid",
            );
            assert.equal(
              probe.provider_submission_id,
              "chain2050-rpc:1:boundary-invalid",
            );
            assert.equal(probe.mutation_performed, false);
            assert.deepEqual(queued.calls.map((call) => call.method), [
              "eth_chainId",
            ]);
          }

          '''
          if proof.count(wallet_anchor) != 1:
              raise SystemExit('HOLD: proof wallet anchor mismatch')
          proof = proof.replace(wallet_anchor, malformed_probe_tests + wallet_anchor, 1)

          wrong_chain_anchor = 'const rawWrongChain = await wallet.signTransaction({\n'
          broadcast_boundary_tests = '''{
            const queued = queueTransport([
              ready(1, "0x802"),
              malformed({
                ok: true,
                request_sent: true,
                response_received: true,
                http_status: 200,
                request_id: 2,
                result: "0x802",
                provider_submission_id: "bad provider id!",
              }),
            ]);
            const created = requireCreatedReady(
              await createBuyVoidNativeChain2050BroadcasterV1(
                policy,
                queued.transport,
              ),
            );
            const result = await created.broadcaster.broadcast_signed_transaction(
              raw2050,
            );
            assert.equal(result.accepted, false);
            assert.equal(result.submission_may_have_occurred, false);
            assert.equal(
              result.provider_submission_id,
              "chain2050-rpc:2:boundary-invalid",
            );
            assert.deepEqual(queued.calls.map((call) => call.method), [
              "eth_chainId",
              "eth_chainId",
            ]);
          }

          {
            const queued = queueTransport([
              ready(1, "0x802"),
              ready(2, "0x802"),
              malformed({
                ok: false,
                request_sent: false,
                response_received: false,
                http_status: null,
                request_id: 3,
                result: hash2050,
                provider_submission_id: "proof:3:malformed",
              }),
            ]);
            const created = requireCreatedReady(
              await createBuyVoidNativeChain2050BroadcasterV1(
                policy,
                queued.transport,
              ),
            );
            const result = await created.broadcaster.broadcast_signed_transaction(
              raw2050,
            );
            assert.equal(result.accepted, false);
            assert.equal(result.transaction_hash, hash2050);
            assert.equal(result.submission_may_have_occurred, true);
            assert.equal(
              result.provider_submission_id,
              "chain2050-rpc:3:boundary-invalid",
            );
            assert.deepEqual(queued.calls.map((call) => call.method), [
              "eth_chainId",
              "eth_chainId",
              "eth_sendRawTransaction",
            ]);
          }

          '''
          if proof.count(wrong_chain_anchor) != 1:
              raise SystemExit('HOLD: proof wrong-chain anchor mismatch')
          proof = proof.replace(
              wrong_chain_anchor,
              broadcast_boundary_tests + wrong_chain_anchor,
              1,
          )
          proof_path.write_text(proof)

          guard_path = Path('scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts')
          guard = guard_path.read_text()
          weak_marker = '  \'"error_code" in response\',\n'
          validator_markers = '''  "normalizeTransportResult",
            '"transport_result_boundary_invalid"',
            "Object.prototype.hasOwnProperty.call",
            "record.ok === true",
            "record.ok === false",
            'input.method === "eth_sendRawTransaction"',
            "providerRaw !== safeProviderSubmissionId(providerRaw)",
          '''
          if guard.count(weak_marker) != 1:
              raise SystemExit('HOLD: guard weak marker mismatch')
          guard = guard.replace(weak_marker, validator_markers, 1)

          weak_block = '''assert.equal(
            (moduleText.match(/"error_code" in response/g) || []).length,
            2,
            "JSON-RPC result unions must use explicit held-result narrowing",
          );
          '''
          hardened_block = '''assert.equal(
            (moduleText.match(/normalizeTransportResult\\(input, response\\)/g) || [])
              .length,
            1,
            "all injected transport returns must cross the runtime result validator",
          );
          assert.equal(
            moduleText.indexOf("const response: unknown = await transport.call(input)") <
              moduleText.indexOf("return normalizeTransportResult(input, response)"),
            true,
            "transport result validation must occur immediately after the injected call",
          );
          assert.equal(
            moduleText.includes('error_code: "transport_result_boundary_invalid"'),
            true,
            "malformed injected results must become a fail-closed held result",
          );
          '''
          if guard.count(weak_block) != 1:
              raise SystemExit('HOLD: guard weak block mismatch')
          guard = guard.replace(weak_block, hardened_block, 1)

          proof_marker_anchor = '''assert.equal(
            behaviorProof.includes("submission_may_have_occurred"),
            true,
          );
          '''
          proof_marker_addition = proof_marker_anchor + '''assert.equal(
            behaviorProof.includes("transport_result_boundary_invalid"),
            true,
          );
          assert.equal(
            behaviorProof.includes("bad provider id!"),
            true,
          );
          assert.equal(
            behaviorProof.includes("malformed transport result accepted"),
            true,
          );
          '''
          if guard.count(proof_marker_anchor) != 1:
              raise SystemExit('HOLD: guard proof marker anchor mismatch')
          guard = guard.replace(proof_marker_anchor, proof_marker_addition, 1)
          guard_path.write_text(guard)
          PY

          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prove_buy_void_native_chain2050_broadcaster_v1.ts
          npx --no-install tsx scripts/prove_buy_void_native_chain2050_broadcaster_guard_v1.ts
          npx --no-install tsx scripts/prove_buy_void_prepared_transaction_chain2050_transport_v1.ts
          npx --no-install tsx scripts/prove_buy_void_saga_broadcast_reconciliation_v1.ts
          npm run typecheck
          npm run build

          git rm -- "$HELPER"

          expected_scope="$(printf '%s\n' "$SOURCE" "$PROOF" "$GUARD" | sort)"
          actual_scope="$(git diff --name-only "$BASE" | sort)"
          test "$actual_scope" = "$expected_scope"
          git diff --check "$BASE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$SOURCE" "$PROOF" "$GUARD"
          git commit -m 'fix: validate chain2050 transport results at runtime'

          test "$(git diff --name-only "$BASE" HEAD | sort)" = "$expected_scope"
          git push origin "HEAD:$BRANCH"
