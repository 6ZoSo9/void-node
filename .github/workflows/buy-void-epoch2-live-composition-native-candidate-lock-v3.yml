name: Buy VOID Epoch-2 native candidate lock v3

on:
  pull_request:
    paths:
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v3.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v3.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v3.yml"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"
  push:
    branches: [main]
    paths:
      - "ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v3.py"
      - "docs/operators/buy-void-epoch2-live-composition-native-candidate-lock-v3.md"
      - ".github/workflows/buy-void-epoch2-live-composition-native-candidate-lock-v3.yml"
      - "scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py"
      - "scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_preentry_v1.c"
      - "ops/precision/void_buy_void_epoch2_authenticated_credential_live_composition_v2.mjs"
      - "scripts/void_buy_void_epoch2_credential_attestation_sealed_v2.mjs"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact lock head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact lock source generation
        run: |
          set -euo pipefail
          git merge-base --is-ancestor             e7c5e20493e453053bc8c3d2c4fa85fbb994475b             HEAD
          test "$(git rev-parse HEAD:ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json)" =             "57f965a944031eac90d69b4104b0f8f2473e66cc"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v3.py)" =             "69ef2b6ca14032207c49f93f4b52788b3280eaae"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_candidate_v3.py)" =             "3b779a27cfd071c2569c438e3319b756b46c85c9"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs)" =             "73062194b5b5ed304ff820d7fa33e66c5c8da436"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Re-run repaired privileged-source proof
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-source-proof.log"
          node scripts/prove_buy_void_epoch2_live_composition_native_preentry_v1.mjs |
            tee "$out"
          for marker in             'VOID_BUY_VOID_EPOCH2_NATIVE_PREENTRY_V1_PROOF_GREEN'             'trusted_cc_symlink_resolution_bound=true'             'direct_statx_mount_topology_bound=true'             'proc_mountinfo_topology_authority=false'             'native_parent_revalidated_after_sensitive_sequence=true'             'live_credential_access=false'             'live_signing=false'             'transaction=false'             'funds_movement=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Rederive and verify exact V3 acceptance lock
        run: |
          set -euo pipefail
          proof=scripts/prove_buy_void_epoch2_live_composition_native_candidate_lock_v3.py
          out="$RUNNER_TEMP/epoch2-native-candidate-lock-v3.json"
          python3 -I -B "$proof" --self-test |
            tee "$RUNNER_TEMP/lock-proof.log"
          for marker in             'VOID_BUY_VOID_EPOCH2_LIVE_COMPOSITION_NATIVE_CANDIDATE_LOCK_V3_GREEN'             'lock_id=voidbuye2nativecandlock3_024c9e3818a40616fc8b198f605721bf76ed43d6d4f186bf02a202d46860a659'             'candidate_report_sha256=d17e765afaca21cbd980804dda51f5cd3886883fb628b2843bc5d72268b9769e'             'candidate_accepted=true'             'native_binary_identity_accepted=true'             'runner_identity_accepted=true'             'protected_install_authorized=false'             'live_execution_authorized=false'             'signing_authorized=false'             'transaction_authorized=false'             'public_presale_activation_authorized=false'             'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$RUNNER_TEMP/lock-proof.log"
          done
          python3 -I -B "$proof" --derive > "$out"
          cmp "$out"             ops/security/buy-void-epoch2-live-composition-native-candidate-lock-v3.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-buy-epoch2-native-candidate-lock-v3-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/epoch2-native-candidate-lock-v3.json
          if-no-files-found: error
          retention-days: 7

      - run: git diff --check
