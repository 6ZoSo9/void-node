name: VOID public participant production composition preflight v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-public-participant-production-composition-preflight-v1.yml"
      - "docs/security/void-public-participant-production-composition-preflight-v1.md"
      - "scripts/prove_void_public_participant_production_composition_preflight_v1.mjs"
      - "tools/void-public-participant-production-composition-preflight-v1.mjs"
      - "ops/public/void-public-participant-session-state-file-v1.mjs"
      - "ops/public/void-public-participant-read-session-v1.mjs"
      - "ops/public/void-public-participant-session-http-v1.mjs"
      - "ops/public/void-public-participant-account-read-projection-v1.mjs"
      - "ops/public/void-public-participant-account-read-http-edge-v1.mjs"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "ops/public/void-public-participant-live-role-authority-v1.mjs"
      - "tools/chain2050-role-authority-participant-live-binding-preflight-v1.mjs"
      - "tools/chain2050-role-authority-live-rpc-observer-v1.mjs"
      - "src/security/participant_role_authority_*.ts"
      - "src/security/chain2050_role_authority_*.ts"
      - "tsconfig.build.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/void-public-participant-production-composition-preflight-v1.yml"
      - "docs/security/void-public-participant-production-composition-preflight-v1.md"
      - "scripts/prove_void_public_participant_production_composition_preflight_v1.mjs"
      - "tools/void-public-participant-production-composition-preflight-v1.mjs"
      - "ops/public/void-public-participant-session-state-file-v1.mjs"
      - "ops/public/void-public-participant-read-session-v1.mjs"
      - "ops/public/void-public-participant-session-http-v1.mjs"
      - "ops/public/void-public-participant-account-read-projection-v1.mjs"
      - "ops/public/void-public-participant-account-read-http-edge-v1.mjs"
      - "ops/public/void-public-app-composition-gateway-v1.mjs"
      - "ops/public/void-public-participant-live-role-authority-v1.mjs"
      - "tools/chain2050-role-authority-participant-live-binding-preflight-v1.mjs"
      - "tools/chain2050-role-authority-live-rpc-observer-v1.mjs"
      - "src/security/participant_role_authority_*.ts"
      - "src/security/chain2050_role_authority_*.ts"
      - "tsconfig.build.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reviewed security runtime
        run: npm run build
      - name: Syntax
        run: |
          node --check ops/public/void-public-participant-live-role-authority-v1.mjs
          node --check ops/public/void-public-app-composition-gateway-v1.mjs
          node --check tools/void-public-participant-production-composition-preflight-v1.mjs
          node --check scripts/prove_void_public_participant_production_composition_preflight_v1.mjs
      - name: Prove production composition source ready
        run: node scripts/prove_void_public_participant_production_composition_preflight_v1.mjs
      - name: Existing participant composition regressions
        if: matrix.node == '24'
        run: |
          node scripts/prove_void_public_participant_session_state_file_v1.mjs
          node scripts/prove_void_public_participant_session_http_v1.mjs
          node scripts/prove_void_public_participant_account_read_projection_v1.mjs
          node scripts/prove_void_public_participant_account_read_http_edge_v1.mjs
          node scripts/prove_void_public_participant_composition_integration_v1.mjs
          npx --no-install tsx scripts/prove_participant_role_authority_guard_v1.ts
          npx --no-install tsx scripts/prove_participant_role_authority_session_integration_v1.ts
      - name: Typecheck reviewed TypeScript role stack
        if: matrix.node == '24'
        run: npm run typecheck
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD
