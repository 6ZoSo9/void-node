name: license-guard
on:
  pull_request:
    paths:
      - '.github/workflows/license-guard.yml'
      - 'LICENSE'
      - '.ci/VCL_LICENSE.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/license-guard.yml'
      - 'LICENSE'
      - '.ci/VCL_LICENSE.txt'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify LICENSE matches canonical VCL
        shell: bash
        run: |
          set -euo pipefail
          diff -u --strip-trailing-cr .ci/VCL_LICENSE.txt LICENSE
