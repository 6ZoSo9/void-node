name: license-guard
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify LICENSE matches canonical VCL
        shell: bash
        run: |
          set -euo pipefail
          diff -u --strip-trailing-cr .ci/VCL_LICENSE.txt LICENSE
