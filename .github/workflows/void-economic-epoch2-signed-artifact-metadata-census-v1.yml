name: VOID epoch2 signed-artifact metadata census v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-signed-artifact-metadata-census-v1.yml"
      - "tools/void-economic-epoch2-signed-artifact-metadata-census-v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_artifact_metadata_census_v1.mjs"
      - "ops/mainnet0/economic-epoch2-known-signed-transaction-lineages-v1.json"
      - "docs/operators/economic-epoch2-signed-artifact-metadata-census-v1.md"
      - "docs/ren/journal/2026-09-27-signed-artifact-metadata-census-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-signed-artifact-metadata-census-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Prove bounded metadata census
        run: node scripts/prove_void_economic_epoch2_signed_artifact_metadata_census_v1.mjs

      - name: Preserve repository lineage baseline
        run: node scripts/prove_void_economic_epoch2_known_signed_transaction_lineages_v1.mjs

      - name: Diff hygiene
        run: git diff --check
