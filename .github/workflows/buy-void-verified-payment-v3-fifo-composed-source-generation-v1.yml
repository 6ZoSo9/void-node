name: Buy VOID V3 composed V2 + FIFO-safe source successor

on:
  pull_request:
    paths:
      - "src/economic/buy_void_verified_payment_capacity_admission_v1.ts"
      - "scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts"
      - ".github/workflows/buy-void-stable-request-root-policy-v1.yml"
      - ".github/workflows/buy-void-verified-payment-v2-source-generation-acceptance-v1.yml"
      - ".github/workflows/buy-void-runtime-integration-v1.yml"
      - ".github/workflows/buy-void-request-root-runtime-topology-census-v2.yml"
      - ".github/workflows/buy-void-operator-verified-allocation-dispatch-v2.yml"
      - ".github/workflows/buy-void-legacy-operator-status-exact-identity-v1.yml"
      - ".github/workflows/buy-void-current-presale-source-tuple-v4.yml"
      - ".github/workflows/buy-void-current-presale-source-tuple-v3.yml"
      - ".github/workflows/buy-void-canonical-caller-request-v1.yml"
      - "scripts/prove_void_buy_stable_request_root_policy_v2.mjs"
      - "scripts/prove_void_buy_request_root_runtime_topology_census_v3.py"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts"
      - "scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts"
      - "scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts"
      - "scripts/prove_buy_void_legacy_operator_status_exact_identity_v2.ts"
      - "scripts/prove_buy_void_canonical_caller_request_v2.ts"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs"
      - "scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs"
      - "scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs"
      - "docs/architecture/buy-void-verified-payment-v3-fifo-composed-source-generation-v1.md"
      - ".github/workflows/buy-void-verified-payment-v3-fifo-composed-source-generation-v1.yml"
      - ".github/workflows/buy-void-verified-payment-transport-v2.yml"
      - "scripts/prove_buy_void_v2_custody_inspect_bridge_v1.mjs"
      - "scripts/prove_buy_void_verified_payment_transport_v2.ts"
      - "scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts"
      - "src/economic/buy_void_v2_custody_inspect_bridge_v1.mjs"
      - "src/economic/buy_void_verified_payment_transport_v2.ts"
      - "src/economic/buy_void_verified_payment_v2_allocation_stage.ts"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml"
      - ".github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v1.yml"
      - ".github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml"
      - ".github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml"
      - ".github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: composed source / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Bind exact V3 composition
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ACCEPTED_PARENT: 29057c25f06fcb214853bc612ea7606211778f81
          ACCEPTED_PARENT_TREE: 3f3f9b834e0cfeeafb636502330d2c48d526287e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$ACCEPTED_PARENT" "$EXPECTED_HEAD"
          test "$(git merge-base "$ACCEPTED_PARENT" "$EXPECTED_HEAD")" = "$ACCEPTED_PARENT"
          test "$(git rev-parse "$ACCEPTED_PARENT^{tree}")" = "$ACCEPTED_PARENT_TREE"
          git diff --check "$ACCEPTED_PARENT" "$EXPECTED_HEAD" --
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          A	.github/workflows/buy-void-current-presale-source-tuple-v4.yml
          A	.github/workflows/buy-void-verified-payment-v3-fifo-composed-source-generation-v1.yml
          A	docs/architecture/buy-void-verified-payment-v3-fifo-composed-source-generation-v1.md
          A	scripts/prove_buy_void_canonical_caller_request_v2.ts
          A	scripts/prove_buy_void_legacy_operator_status_exact_identity_v2.ts
          A	scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts
          A	scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs
          A	scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts
          A	scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts
          A	scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts
          A	scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs
          A	scripts/prove_void_buy_request_root_runtime_topology_census_v3.py
          A	scripts/prove_void_buy_stable_request_root_policy_v2.mjs
          M	.github/workflows/buy-void-canonical-caller-request-v1.yml
          M	.github/workflows/buy-void-current-presale-source-tuple-v3.yml
          M	.github/workflows/buy-void-delivery-dependency-provider-closure-post2865-lock-v1.yml
          M	.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v1.yml
          M	.github/workflows/buy-void-enforcement-final-protected-v7-v2-candidate-v2.yml
          M	.github/workflows/buy-void-enforcement-final-v7-artifact-census-v4.yml
          M	.github/workflows/buy-void-legacy-operator-status-exact-identity-v1.yml
          M	.github/workflows/buy-void-operator-verified-allocation-dispatch-v2.yml
          M	.github/workflows/buy-void-request-root-runtime-topology-census-v2.yml
          M	.github/workflows/buy-void-runtime-integration-v1.yml
          M	.github/workflows/buy-void-source-finality-v7-executable-delta-candidate-v1.yml
          M	.github/workflows/buy-void-stable-request-root-policy-v1.yml
          M	.github/workflows/buy-void-verified-payment-v2-source-generation-acceptance-v1.yml
          M	src/economic/buy_void_verified_payment_capacity_admission_v1.ts
          EOF
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          git diff --name-status "$ACCEPTED_PARENT" "$EXPECTED_HEAD" -- | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git rev-parse HEAD:src/economic/buy_void_verified_payment_capacity_admission_v1.ts)" = "d1320be22fe55af24017b84f0655fbcde82dbee9"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts)" = "1b3d72c2eda967f5cd84d929cd80c62508cce16e"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs)" = "796cad42e6413a1894eef8dc0466848377176645"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs)" = "28f76da047016eb42b7a2a538a9743621ac74379"
          test "$(git rev-parse HEAD:scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs)" = "095461babc377187e06ed7dd514cf963b7576633"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build exact composition
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Prove V3 trigger closure
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-trigger-${{ matrix.node }}.log"
          node --check scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs
          timeout 30s node scripts/prove_buy_void_verified_payment_v3_trigger_closure_v1.mjs | tee "$out"
          grep -Fx 'VOID_BUY_VOID_VERIFIED_PAYMENT_V3_TRIGGER_CLOSURE_V1_GREEN' "$out"
          grep -Fx 'v2_source_file_count=7' "$out"
          grep -Fx 'v2_source_file_triggers_complete=true' "$out"
          grep -Fx 'capacity_fifo_source_and_proof_triggers_complete=true' "$out"
          grep -Fx 'protected_consumer_count=5' "$out"
          grep -Fx 'compatibility_trigger_count=16' "$out"
          grep -Fx 'compatibility_successor_triggers_complete=true' "$out"
          grep -Fx 'v3_trigger_reader_descriptor_bound=true' "$out"
          grep -Fx 'v3_trigger_reader_fifo_swap_rejected=true' "$out"
      - name: Prove composed current generation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v3-source-${{ matrix.node }}.log"
          receipt="$RUNNER_TEMP/v3-source-${{ matrix.node }}.json"
          node --check scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs --self-test | tee "$out"
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v3.mjs --receipt > "$receipt"
          grep -Fx 'VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V3_GREEN' "$out"
          grep -Fx 'landed_v2_source_acceptance_carrier_bound=true' "$out"
          grep -Fx 'capacity_fifo_safe_source_transition_verified=true' "$out"
          grep -Fx 'predecessor_v2_source_proof_refuses_current_generation=true' "$out"
          grep -Fx 'bounded_descriptor_source_reads=true' "$out"
          grep -Fx 'fifo_reader_substitution_nonblocking_rejected=true' "$out"
          grep -Fx 'historical_v2_candidate_enforcement_identity_accepted=true' "$out"
          grep -Fx 'candidate_enforcement_identity_accepted=false' "$out"
          grep -Fx 'protected_path_identity_preserved=false' "$out"
          grep -Fx 'protected_canonical_producer_launcher_drift_classified=true' "$out"
          grep -Fx 'protected_range_router_drift_classified=true' "$out"
          grep -Fx 'current_protected_source_generation_accepted=false' "$out"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          assert.equal(p.marker,"VOID_BUY_VOID_REPAIRED_V7_V2_CURRENT_GENERATION_DISPATCH_V3");
          assert.equal(p.version,3);
          assert.equal(p.protected_path_count,49);
          assert.equal(p.nonprotected_economic_drift_count,6);
          assert.equal(p.added_v2_economic_source_count,3);
          assert.equal(p.capacity_fifo_safe_source_transition_verified,true);
          assert.equal(p.capacity_fifo_safe_source_blob,"d1320be22fe55af24017b84f0655fbcde82dbee9");
          assert.equal(p.capacity_fifo_proof_blob,"1b3d72c2eda967f5cd84d929cd80c62508cce16e");
          assert.equal(p.predecessor_v2_source_proof_refuses_current_generation,true);
          assert.equal(p.historical_v2_candidate_enforcement_identity_accepted,true);
          assert.equal(p.candidate_enforcement_identity_accepted,false);
          assert.equal(p.protected_path_identity_preserved,false);
          assert.equal(p.protected_canonical_producer_launcher_drift_classified,true);
          assert.equal(p.protected_range_router_drift_classified,true);
          assert.deepEqual(
            p.protected_current_generation_drift.map(row=>row.path),
            ["ops/run-void-node-live-v1.sh","src/index.ts"],
          );
          assert.equal(p.current_protected_source_generation_accepted,false);
          assert.equal(p.verified_payment_v2_route_mounted,false);
          assert.equal(p.payment_allocation_custody_authority,false);
          assert.equal(p.source_finality_authentication_verified,false);
          assert.equal(p.successor_runtime_generation_accepted,false);
          assert.equal(p.public_presale_activation,false);
          assert.equal(p.funds_movement,false);
          NODE
      - name: Prove compatibility successors on the same exact source
        run: |
          set -euo pipefail
          timeout 180s node --import tsx scripts/prove_buy_void_legacy_operator_status_exact_identity_v2.ts > "$RUNNER_TEMP/operator-status-v2.log"
          grep -Fx 'VOID_BUY_VOID_LEGACY_OPERATOR_STATUS_EXACT_IDENTITY_V2_GREEN' "$RUNNER_TEMP/operator-status-v2.log"
          timeout 120s node scripts/prove_void_buy_stable_request_root_policy_v2.mjs > "$RUNNER_TEMP/stable-root-v2.log"
          grep -Fx 'VOID_BUY_VOID_STABLE_REQUEST_ROOT_POLICY_V2_GREEN' "$RUNNER_TEMP/stable-root-v2.log"
          timeout 60s python3 -I -B scripts/prove_void_buy_request_root_runtime_topology_census_v3.py > "$RUNNER_TEMP/topology-v3.log"
          grep -Fx 'VOID_BUY_VOID_REQUEST_ROOT_RUNTIME_TOPOLOGY_CENSUS_V3_PROOF_GREEN' "$RUNNER_TEMP/topology-v3.log"
          timeout 180s node --import tsx scripts/prove_buy_void_canonical_caller_request_v2.ts > "$RUNNER_TEMP/canonical-v2.log"
          grep -Fx 'VOID_BUY_VOID_CANONICAL_CALLER_REQUEST_V2_SOURCE_BINDING_GREEN' "$RUNNER_TEMP/canonical-v2.log"
          timeout 180s node --import tsx scripts/prove_buy_void_operator_verified_allocation_dispatch_v7.ts > "$RUNNER_TEMP/dispatch-v7.log"
          grep -Fx 'VOID_BUY_VOID_OPERATOR_ALLOCATION_DISPATCH_SOURCE_CANDIDATE_V7_GREEN' "$RUNNER_TEMP/dispatch-v7.log"
          timeout 180s node --import tsx scripts/prove_buy_void_verified_payment_allocation_handoff_first_original_v5.ts > "$RUNNER_TEMP/first-original-v5.log"
          grep -Fx 'VOID_BUY_VOID_VERIFIED_ALLOCATION_HANDOFF_FIRST_ORIGINAL_V5_GREEN' "$RUNNER_TEMP/first-original-v5.log"
          timeout 180s node --import tsx scripts/prove_buy_void_verified_payment_allocation_handoff_dual_rail_v4.ts > "$RUNNER_TEMP/dual-rail-v4.log"
          grep -Fx 'VOID_BUY_VOID_FIRST_ORIGINAL_DUAL_RAIL_REAL_HANDOFF_V4_GREEN' "$RUNNER_TEMP/dual-rail-v4.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove FIFO-safe production opens
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fifo-${{ matrix.node }}.log"
          timeout 120s npx tsx scripts/prove_buy_void_verified_payment_capacity_fifo_nonblocking_v2.ts | tee "$out"
          grep -Fx 'VOID_BUY_VOID_VERIFIED_PAYMENT_CAPACITY_FIFO_NONBLOCKING_V2_GREEN' "$out"
          grep -Fx 'fifo_swap_at_real_production_open_rejected=true' "$out"
          grep -Fx 'fifo_private_sidecar_swap_at_real_production_open_rejected=true' "$out"
      - name: Reprove V2 staged transport on composed source
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/transport-${{ matrix.node }}.log"
          s="$RUNNER_TEMP/stage-${{ matrix.node }}.log"
          c="$RUNNER_TEMP/custody-${{ matrix.node }}.log"
          timeout 90s npx tsx scripts/prove_buy_void_verified_payment_transport_v2.ts | tee "$t"
          timeout 90s npx tsx scripts/prove_buy_void_verified_payment_v2_allocation_stage.ts | tee "$s"
          timeout 120s node scripts/prove_buy_void_v2_custody_inspect_bridge_v1.mjs | tee "$c"
          grep -Fx 'VOID_BUY_VOID_VERIFIED_PAYMENT_TRANSPORT_V2_PROOF_GREEN' "$t"
          grep -Fx 'VOID_BUY_VOID_VERIFIED_PAYMENT_V2_ALLOCATION_STAGE_PROOF_GREEN' "$s"
          grep -Fx 'real_canonical_verifier_event_without_quote_stages=true' "$s"
          grep -Fx 'VOID_BUY_VOID_V2_CUSTODY_INSPECT_BRIDGE_REAL_UNIX_PROOF_GREEN' "$c"
          grep -Fx 'custody_inspect_never_promotes_reservation_authority=true' "$c"
      - name: Preserve V2 and V1 refusal
        run: |
          set -euo pipefail
          set +e
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v2.mjs --self-test > "$RUNNER_TEMP/v2.out" 2> "$RUNNER_TEMP/v2.err"
          v2_rc=$?
          timeout 150s node scripts/prove_buy_void_repaired_v7_v2_current_generation_dispatch_v1.mjs --self-test > "$RUNNER_TEMP/v1.out" 2> "$RUNNER_TEMP/v1.err"
          v1_rc=$?
          set -e
          test "$v2_rc" -ne 0
          test "$v1_rc" -ne 0
          grep -Fq 'protected_blob_drift:src/index.ts' "$RUNNER_TEMP/v2.err"
          grep -Fq '123ec1792a027f93d4c9030749a0e7e136a75a44' "$RUNNER_TEMP/v2.err"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$RUNNER_TEMP/v2.err"
          grep -Fq 'protected_blob_drift:src/index.ts' "$RUNNER_TEMP/v1.err"
          grep -Fq '123ec1792a027f93d4c9030749a0e7e136a75a44' "$RUNNER_TEMP/v1.err"
          grep -Fq 'a09661797aa4295371c036be36d82995e5233269' "$RUNNER_TEMP/v1.err"
          echo 'predecessor_v2_refusal_preserved=true'
          echo 'historical_v1_refusal_preserved=true'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buy-void-v3-composed-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/v3-source-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 7
  cross-node:
    needs: [prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: buy-void-v3-composed-${{ github.event.pull_request.head.sha || github.sha }}-node-*
          merge-multiple: true
          path: proof
      - name: Exact Node 22/24/26 receipt equality
        run: |
          set -euo pipefail
          for version in 22 24 26; do test -s "proof/v3-source-$version.json"; done
          cmp proof/v3-source-22.json proof/v3-source-24.json
          cmp proof/v3-source-22.json proof/v3-source-26.json
          echo 'VOID_BUY_VOID_V3_COMPOSED_SOURCE_CROSS_NODE_GREEN'
