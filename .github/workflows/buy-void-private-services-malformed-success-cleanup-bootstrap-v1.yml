name: Buy VOID private-services malformed-success cleanup bootstrap v1

on:
  push:
    branches:
      - "fix/buy-void-private-services-malformed-success-cleanup-v1-20260809"
    paths:
      - ".github/workflows/buy-void-private-services-malformed-success-cleanup-bootstrap-v1.yml"
      - "scripts/patch_buy_void_private_services_malformed_success_cleanup_v1.py"

permissions:
  contents: write

concurrency:
  group: buy-void-private-services-malformed-success-cleanup-bootstrap-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply deterministic source patch
        run: python3 scripts/patch_buy_void_private_services_malformed_success_cleanup_v1.py
      - name: Verify exact modified source path
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/economic/buy_void_production_private_services_operator_v1.ts"
          git diff --check
      - name: Focused TypeScript compile
        run: |
          ./node_modules/.bin/tsc \
            --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --lib ES2022 \
            --types node \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --downlevelIteration \
            --skipLibCheck \
            src/economic/buy_void_production_private_services_operator_v1.ts \
            scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts
      - name: Prove malformed-success cleanup
        run: npx --no-install tsx scripts/prove_buy_void_private_services_malformed_success_cleanup_v1.ts
      - name: Preserve production private-services operator
        run: npx --no-install tsx scripts/prove_buy_void_production_private_services_operator_v1.ts
      - name: Preserve production private-services activation
        run: npx --no-install tsx scripts/prove_buy_void_production_private_services_activation_v1.ts
      - name: Typecheck repository
        run: npm run typecheck
      - name: Build repository
        run: npm run build
      - name: Publish semantic fix and retire carriers
        shell: bash
        env:
          BRANCH_NAME: fix/buy-void-private-services-malformed-success-cleanup-v1-20260809
        run: |
          set -euo pipefail
          git config user.name "void-ci"
          git config user.email "void-ci@users.noreply.github.com"
          git add -- src/economic/buy_void_production_private_services_operator_v1.ts
          git rm -- \
            scripts/patch_buy_void_private_services_malformed_success_cleanup_v1.py \
            .github/workflows/buy-void-private-services-malformed-success-cleanup-bootstrap-v1.yml
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/buy-void-private-services-malformed-success-cleanup-bootstrap-v1.yml"
            "scripts/patch_buy_void_private_services_malformed_success_cleanup_v1.py"
            "src/economic/buy_void_production_private_services_operator_v1.ts"
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${staged[$i]}" = "${expected[$i]}"
          done
          git diff --cached --check
          git commit -m "fix: clean malformed private-service success handles v1"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
