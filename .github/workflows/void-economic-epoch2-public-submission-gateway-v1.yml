name: VOID economic epoch2 public submission gateway v1

on:
  pull_request:
    paths:
      - ".github/workflows/void-economic-epoch2-public-submission-gateway-v1.yml"
      - "tools/void-economic-epoch2-public-submission-gateway-v1.mjs"
      - "tools/void-economic-epoch2-signed-submission-intent-v1.mjs"
      - "scripts/prove_void_economic_epoch2_public_submission_gateway_v1.mjs"
      - "scripts/prove_void_economic_epoch2_signed_submission_intent_v1.mjs"
      - "scripts/prove_void_economic_evm_successor_migration_v1.mjs"
      - "ops/mainnet0/economic-epoch2-signed-submission-policy-v1.json"
      - "ops/mainnet0/economic-evm-successor-migration-candidate-v1.json"
      - "docs/architecture/economic-epoch2-public-submission-gateway-v1.md"
      - "docs/architecture/economic-epoch2-signed-submission-replay-domain-v1.md"
      - "docs/operators/economic-evm-successor-migration-v1.md"
      - "docs/ren/current-state-v1.md"
      - "ops/mainnet/CURRENT_TRUTH.md"
      - "docs/ren/journal/2026-09-27-epoch2-public-submission-gateway-core-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-economic-epoch2-public-submission-gateway-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use supported Node.js major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Prove epoch-2 gateway core
        run: node scripts/prove_void_economic_epoch2_public_submission_gateway_v1.mjs

      - name: Preserve signed-intent domain proof
        run: node scripts/prove_void_economic_epoch2_signed_submission_intent_v1.mjs

      - name: Preserve successor migration HOLD proof
        run: node scripts/prove_void_economic_evm_successor_migration_v1.mjs

      - name: Diff hygiene
        run: git diff --check
