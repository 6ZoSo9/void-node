name: VOID Buy credential query ELF lock v3 repaired

on:
  pull_request:
    paths:
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json"
      - "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3r.py"
      - "docs/operators/buy-void-user-manager-credential-query-elf-lock-v3r.md"
      - ".github/workflows/buy-void-user-manager-credential-query-elf-lock-v3r.yml"
      - "ops/precision/void_buy_void_user_manager_private_peer_guard_v1.c"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_v3.c"
      - "scripts/prove_void_buy_user_manager_private_credential_unit_query_v3.mjs"
      - "ops/precision/void_buy_void_user_manager_private_credential_unit_query_preexec_v1.c"
      - "scripts/prove_void_buy_void_user_manager_private_credential_unit_query_preexec_v1.mjs"
      - "ops/security/buy-void-user-manager-credential-query-elf-lock-v2.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax check without bytecode writes
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          relative = "scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3r.py"
          compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V3_REPAIRED_SYNTAX_GREEN")
          PY

      - name: Prove repaired V3 lock from exact historical candidate head
        run: |
          set -euo pipefail
          proof=scripts/prove_void_buy_user_manager_credential_query_elf_lock_v3r.py
          out="$RUNNER_TEMP/credential-query-lock-v3r.log"

          python3 -I -B "$proof" --verify | tee "$out"

          markers=(
            "VOID_BUY_VOID_USER_MANAGER_CREDENTIAL_QUERY_ELF_LOCK_V3_REPAIRED_GREEN"
            "lock_id=voidbuyumqcredelflock3r_8b064214e22ce54ac193b426f38b9d6a7ea4cee07b38b68c8d1eeb6c51de6f34"
            "candidate_id=voidbuyumqcredelfcand3_b5c405437bd40582908e097a6f021bd575315d018a9d8457af6549458cbe0922"
            "candidate_head=a8f133c7542491af1e48018e917f0cbcd73cf15f"
            "historical_candidate_scope_preserved=true"
            "candidate_metadata_exact_rederivation=true"
            "complete_native_toolchain_closure_bound=true"
            "preexec_predecessor_identity_exact=true"
            "preexec_binary_sha256=67e4017efffc7dd9f7bc44f31280244bf58dab3c6fb255f49fea6e5cec9b714c"
            "query_binary_sha256=d60e5719a4d785dbfaca90074ed3313ef9e0cae84c3f933af44d7faf84763923"
            "candidate_accepted=true"
            "replacement_authorized=false"
            "live_query_authorized=false"
            "credential_contents_read=false"
            "production_host_evidence_authority=false"
            "payment_acceptance=false"
            "public_presale_activation=false"
            "wc_void_market_activation=false"
            "transaction=false"
            "funds_movement=false"
          )
          for marker in "${markers[@]}"; do
            grep -Fx "$marker" "$out"
          done

          derived="$RUNNER_TEMP/credential-query-lock-v3r.json"
          python3 -I -B "$proof" --derive-lock > "$derived"
          cmp "$derived" ops/security/buy-void-user-manager-credential-query-elf-lock-v3r.json

          # The detached historical worktree must be cleaned up by the proof.
          test -z "$(git worktree list --porcelain | grep -F 'void-cred-v3r-lock-' || true)"

      - run: git diff --check
