name: Buy VOID Epoch-2 V6R2 policy head rebind v1

on:
  pull_request:
    paths:
      - "ops/precision/void_buy_void_epoch2_live_composition_policy_head_rebind_v1.py"
      - "scripts/prove_buy_void_epoch2_live_composition_policy_head_rebind_v1.py"
      - "docs/operators/buy-void-epoch2-live-composition-policy-head-rebind-v1.md"
      - ".github/workflows/buy-void-epoch2-live-composition-policy-head-rebind-v1.yml"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py"
      - "ops/precision/void_buy_void_epoch2_live_composition_native_installed_qualification_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact policy rebind generation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          parent=1c2e3db1165cacd998ab21b504a053b3c6fdea82
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$parent" "$EXPECTED_HEAD"

          expected="$RUNNER_TEMP/expected-scope.txt"
          actual="$RUNNER_TEMP/actual-scope.txt"
          printf '%s\n' \
            '.github/workflows/buy-void-epoch2-live-composition-policy-head-rebind-v1.yml' \
            'docs/operators/buy-void-epoch2-live-composition-policy-head-rebind-v1.md' \
            'ops/precision/void_buy_void_epoch2_live_composition_policy_head_rebind_v1.py' \
            'scripts/prove_buy_void_epoch2_live_composition_policy_head_rebind_v1.py' \
            | sort > "$expected"
          git diff --name-only "$parent" "$EXPECTED_HEAD" -- | sort > "$actual"
          diff -u "$expected" "$actual"

          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_policy_head_rebind_v1.py)" = \
            37ab46ca5b77a642d84ad18c61388c30f4d63881
          test "$(git rev-parse HEAD:scripts/prove_buy_void_epoch2_live_composition_policy_head_rebind_v1.py)" = \
            a6666ff9225365bf15e56276164e42876716739b
          test "$(git rev-parse HEAD:docs/operators/buy-void-epoch2-live-composition-policy-head-rebind-v1.md)" = \
            1790363c6a7229e9431f62749294db30fe60409c
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_protected_install_v5.py)" = \
            fd7a06490ccf6fb14831d8b0372a892e2764c9dc
          test "$(git rev-parse HEAD:ops/precision/void_buy_void_epoch2_live_composition_native_installed_qualification_v5.py)" = \
            a04c2e7665294cdd142426e9eb01ee27c5292b8d

          git diff --check "$parent" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Syntax and proof
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from pathlib import Path
          for relative in (
              "ops/precision/void_buy_void_epoch2_live_composition_policy_head_rebind_v1.py",
              "scripts/prove_buy_void_epoch2_live_composition_policy_head_rebind_v1.py",
          ):
              compile(Path(relative).read_text("utf-8"), relative, "exec", dont_inherit=True)
          print("VOID_BUY_VOID_EPOCH2_V6R2_POLICY_HEAD_REBIND_V1_SYNTAX_GREEN")
          PY

          out="$RUNNER_TEMP/policy-head-rebind-proof.log"
          python3 -I -B scripts/prove_buy_void_epoch2_live_composition_policy_head_rebind_v1.py | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_V6R2_POLICY_HEAD_REBIND_V1_PROOF_GREEN' \
            'target_blob_bound=true' \
            'installer_blob_bound=true' \
            'old_installed_policy_identity_bound=true' \
            'new_policy_expected_head_derived=true' \
            'exact_v6r2_native_runner_generation_required=true' \
            'exact_v4_predecessor_generation_required=true' \
            'atomic_cross_directory_policy_exchange_required=true' \
            'old_policy_retention_required=true' \
            'automatic_rollback_required=true' \
            'publication_aware_failure_receipt=true' \
            'post_exchange_failure_reports_publication=true' \
            'apply_exception_path_emits_final_failure_receipt=true' \
            'post_exchange_failure_transcript_monotonic=true' \
            'rollback_failure_final_state_uncertain=true' \
            'pre_mutation_authority_scoped=true' \
            'native_mutation_authorized=false' \
            'runner_mutation_authorized=false' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - name: Inert source plan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/policy-head-rebind-source-plan.log"
          python3 -I -B ops/precision/void_buy_void_epoch2_live_composition_policy_head_rebind_v1.py --source-plan | tee "$out"

          for marker in \
            'VOID_BUY_VOID_EPOCH2_V6R2_POLICY_HEAD_REBIND_V1' \
            'mode=source-plan' \
            'source_only=true' \
            'host_read=false' \
            'host_write=false' \
            'native_mutation_authorized=false' \
            'runner_mutation_authorized=false' \
            'policy_atomic_exchange_required=true' \
            'old_policy_retention_required=true' \
            'automatic_rollback_required=true' \
            'live_execution_authorized=false' \
            'credential_access_authorized=false' \
            'private_key_access_authorized=false' \
            'signing_authorized=false' \
            'transaction_authorized=false' \
            'rpc_call_authorized=false' \
            'funds_movement_authorized=false'
          do
            grep -Fx "$marker" "$out"
          done

      - run: git diff --check
